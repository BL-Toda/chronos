<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Chronos — 年表を探す</title>
<link href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A0C;--bg2:#111114;--bg3:#16161A;--bg-card:#16161A;--bg-card-h:#1C1C22;
  --accent:#C8A87E;--accent-dim:rgba(200,168,126,0.13);--accent-glow:rgba(200,168,126,0.04);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#8A8680;--text3:#5A5754;
  --border:rgba(200,168,126,0.1);--border2:rgba(200,168,126,0.22);
  --line:rgba(200,168,126,0.15);
  --c-blue:#5B9BD5;--c-blue-d:rgba(91,155,213,0.12);
  --c-green:#7BC67E;--c-green-d:rgba(123,198,126,0.12);
  --c-pink:#D4849A;--c-pink-d:rgba(212,132,154,0.12);
  --c-teal:#5BBCB4;--c-teal-d:rgba(91,188,180,0.12);
  --c-gold:#C8B87E;--c-gold-d:rgba(200,184,126,0.12);
  --c-purple:#9E7EC8;--c-purple-d:rgba(158,126,200,0.12);
  --c-orange:#D4A05A;--c-orange-d:rgba(212,160,90,0.12);
  --f-d:'Erode','Shippori Mincho',serif;
  --f-b:'DM Sans',sans-serif;
  --f-m:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color-scheme:dark}
body{font-family:var(--f-b);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.88);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between}
.hdr-brand{font-family:var(--f-d);font-size:1.3rem;font-weight:500;
  letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;cursor:pointer}
.hdr-nav{display:flex;align-items:center;gap:20px}
.hdr-nav a{font-size:13px;color:var(--text3);text-decoration:none;transition:color 0.2s}
.hdr-nav a:hover{color:var(--text2)}
.hdr-nav a.active{color:var(--accent)}
.hdr-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;
  border:1.5px solid var(--border);cursor:pointer;transition:border-color 0.2s}
.hdr-avatar:hover{border-color:var(--accent)}
.hdr-avatar svg{width:100%;height:100%;display:block}

/* ===== LAYOUT ===== */
.layout{display:flex;max-width:1200px;margin:0 auto;min-height:calc(100vh - 56px)}

/* ===== SIDEBAR ===== */
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);
  padding:24px 20px;position:sticky;top:56px;height:calc(100vh - 56px);
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sb-section{margin-bottom:28px}
.sb-label{font-family:var(--f-m);font-size:9px;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.sb-item{display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text2);
  cursor:pointer;transition:all 0.2s;margin-bottom:2px}
.sb-item:hover{background:rgba(200,168,126,0.04);color:var(--text)}
.sb-item.active{background:var(--accent-dim);color:var(--accent)}
.sb-item-count{font-family:var(--f-m);font-size:10px;color:var(--text3)}
.sb-item.active .sb-item-count{color:var(--accent);opacity:0.6}
.sb-dot{width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0}
.sb-item-left{display:flex;align-items:center}

.sb-range{display:flex;align-items:center;gap:8px;padding:0 4px}
.sb-range-input{flex:1;background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;padding:6px 8px;font-family:var(--f-m);font-size:11px;
  color:var(--text);outline:none;width:100%;text-align:center}
.sb-range-input:focus{border-color:var(--accent)}
.sb-range-sep{color:var(--text3);font-size:12px}

.sb-check{display:flex;align-items:center;gap:8px;padding:6px 10px;
  border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;
  transition:all 0.2s;margin-bottom:2px}
.sb-check:hover{background:rgba(200,168,126,0.04)}
.sb-check.active{color:var(--accent)}
.sb-checkbox{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.sb-check.active .sb-checkbox{background:var(--accent);border-color:var(--accent)}
.sb-check.active .sb-checkbox::after{content:'✓';font-size:10px;color:var(--bg);font-weight:600}

.sb-reset{font-size:11px;color:var(--text3);cursor:pointer;transition:color 0.2s;
  padding:8px 10px;text-align:center}
.sb-reset:hover{color:var(--accent)}

/* ===== CONTENT ===== */
.content{flex:1;padding:24px 28px 80px;min-width:0}

/* Search */
.search-bar{display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  transition:all 0.3s ease;margin-bottom:20px}
.search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,168,126,0.06)}
.search-icon{flex-shrink:0;width:16px;height:16px;stroke:var(--text3);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-input{flex:1;background:none;border:none;outline:none;font-family:var(--f-b);
  font-size:14px;color:var(--text);caret-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.search-kbd{font-family:var(--f-m);font-size:10px;color:var(--text3);
  padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--bg);
  letter-spacing:0.06em}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar-left{display:flex;align-items:center;gap:12px}
.result-count{font-size:13px;color:var(--text2)}
.result-count strong{color:var(--text);font-weight:500}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.active-filter-tag{font-family:var(--f-m);font-size:10px;padding:3px 10px 3px 8px;
  border-radius:12px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;gap:5px;cursor:pointer;transition:all 0.2s}
.active-filter-tag:hover{background:rgba(200,168,126,0.2)}
.active-filter-tag .aft-x{font-size:12px;opacity:0.6}
.toolbar-right{display:flex;align-items:center;gap:8px}
.sort-select{font-family:var(--f-b);font-size:12px;color:var(--text3);
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  padding:6px 28px 6px 10px;cursor:pointer;outline:none;transition:all 0.2s;
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%235A5754' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center}
.sort-select:focus{border-color:var(--accent)}
.sort-select option{background:var(--bg2);color:var(--text)}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.view-btn{padding:6px 10px;background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.view-btn svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2}
.view-btn.active{background:var(--accent-dim)}
.view-btn.active svg{stroke:var(--accent)}
.view-btn+.view-btn{border-left:1px solid var(--border)}

/* ===== GRID VIEW ===== */
.tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1100px){.tl-grid{grid-template-columns:repeat(2,1fr)}}

.tl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:all 0.3s ease}
.tl-card:hover{border-color:var(--border2);transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(0,0,0,0.25)}
.tl-card-top{height:4px;display:flex}
.tl-card-top span{flex:1}
.tl-card-body{padding:14px 14px 10px}
.tl-card-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.1em;
  text-transform:uppercase;margin-bottom:4px}
.tl-card-title{font-family:var(--f-d);font-size:16px;font-weight:400;
  line-height:1.3;margin-bottom:4px;color:var(--text-h)}
.tl-card-desc{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-card-meta{display:flex;align-items:center;justify-content:space-between}
.tl-card-author{display:flex;align-items:center;gap:6px}
.tl-avatar{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:var(--f-m);font-size:8px;font-weight:500}
.tl-card-author span{font-size:10px;color:var(--text3)}
.tl-card-stats{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text3)}
.tl-card-stats svg{width:11px;height:11px;stroke:var(--text3);fill:none;
  stroke-width:2;vertical-align:-1px;margin-right:2px}
.tl-mini{display:flex;align-items:center;gap:2px;padding:0 14px 10px;position:relative}
.tl-mini::before{content:'';position:absolute;left:14px;right:14px;top:50%;
  height:1px;background:var(--line)}
.tl-mini-dot{width:6px;height:6px;border-radius:50%;position:relative;z-index:1;flex-shrink:0}
.tl-mini-spacer{flex:1}

/* ===== LIST VIEW ===== */
.tl-list{display:none;flex-direction:column;gap:2px}
.tl-list.active{display:flex}
.tl-grid.active{display:grid}
.tl-grid:not(.active){display:none}

.tl-list-item{display:flex;align-items:center;gap:14px;padding:12px 14px;
  border-radius:10px;border:1px solid transparent;cursor:pointer;
  transition:all 0.2s}
.tl-list-item:hover{background:var(--bg-card);border-color:var(--border)}
.tl-list-layers{display:flex;gap:3px;flex-shrink:0;width:28px}
.tl-list-dot{width:6px;height:6px;border-radius:50%}
.tl-list-body{flex:1;min-width:0}
.tl-list-title{font-family:var(--f-d);font-size:15px;font-weight:400;
  line-height:1.3;color:var(--text-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-list-sub{font-size:11px;color:var(--text3);margin-top:2px;
  display:flex;align-items:center;gap:8px}
.tl-list-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:6px}
.tl-list-meta{display:flex;align-items:center;gap:14px;flex-shrink:0;
  font-size:11px;color:var(--text3)}
.tl-list-meta svg{width:11px;height:11px;stroke:var(--text3);fill:none;
  stroke-width:2;vertical-align:-1px;margin-right:2px}
.tl-list-author{display:flex;align-items:center;gap:5px}
.tl-list-author-av{width:18px;height:18px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-family:var(--f-m);font-size:8px}

/* ===== LOADING ===== */
.loading-row{display:flex;justify-content:center;padding:32px 0}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-trigger{height:1px}

/* ===== EMPTY ===== */
.empty-state{display:none;text-align:center;padding:60px 20px}
.empty-icon{width:44px;height:44px;margin:0 auto 14px;stroke:var(--text3);
  fill:none;stroke-width:1.5}
.empty-title{font-family:var(--f-d);font-size:18px;font-weight:300;margin-bottom:6px;color:var(--text2)}
.empty-desc{font-size:12px;color:var(--text3);line-height:1.6}

/* ===== RESPONSIVE ===== */
@media(max-width:860px){
  .sidebar{display:none}
  .tl-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:540px){
  .hdr-nav a:not(.active){display:none}
  .search-kbd{display:none}
  .tl-grid{grid-template-columns:1fr}
  .tl-list-meta{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">Chronos</div>
  <nav class="hdr-nav">
    <a href="#">マイページ</a>
    <a href="#" class="active">年表を探す</a>
    <a href="#">年表をつくる</a>
    <div class="hdr-avatar">
      <svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#0F1A2E"/><ellipse cx="100" cy="100" rx="72" ry="32" fill="none" stroke="#5B9BD5" stroke-width="2" opacity="0.5" transform="rotate(-25 100 100)"/><ellipse cx="100" cy="100" rx="72" ry="32" fill="none" stroke="#D4849A" stroke-width="2" opacity="0.5" transform="rotate(30 100 100)"/><circle cx="100" cy="100" r="9" fill="#C8A87E" opacity="0.85"/></svg>
    </div>
  </nav>
</header>

<div class="layout">

  <!-- SIDEBAR FACETS -->
  <aside class="sidebar">
    <div class="sb-section">
      <div class="sb-label">カテゴリ</div>
      <div class="sb-item active" data-cat="all" onclick="toggleCat('all',this)">
        <span class="sb-item-left">すべて</span><span class="sb-item-count" id="countAll">1,247</span>
      </div>
      <div class="sb-item" data-cat="tech" onclick="toggleCat('tech',this)">
        <span class="sb-item-left"><span class="sb-dot" style="background:var(--c-blue)"></span>テクノロジー</span><span class="sb-item-count">328</span>
      </div>
      <div class="sb-item" data-cat="history" onclick="toggleCat('history',this)">
        <span class="sb-item-left"><span class="sb-dot" style="background:var(--c-pink)"></span>歴史・政治</span><span class="sb-item-count">265</span>
      </div>
      <div class="sb-item" data-cat="culture" onclick="toggleCat('culture',this)">
        <span class="sb-item-left"><span class="sb-dot" style="background:var(--c-gold)"></span>カルチャー</span><span class="sb-item-count">218</span>
      </div>
      <div class="sb-item" data-cat="science" onclick="toggleCat('science',this)">
        <span class="sb-item-left"><span class="sb-dot" style="background:var(--c-green)"></span>科学・自然</span><span class="sb-item-count">172</span>
      </div>
      <div class="sb-item" data-cat="business" onclick="toggleCat('business',this)">
        <span class="sb-item-left"><span class="sb-dot" style="background:var(--c-orange)"></span>ビジネス</span><span class="sb-item-count">148</span>
      </div>
      <div class="sb-item" data-cat="personal" onclick="toggleCat('personal',this)">
        <span class="sb-item-left"><span class="sb-dot" style="background:var(--c-purple)"></span>個人・ライフ</span><span class="sb-item-count">116</span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">年代範囲</div>
      <div class="sb-range">
        <input class="sb-range-input" type="text" value="1800" id="eraFrom" placeholder="From">
        <span class="sb-range-sep">–</span>
        <input class="sb-range-input" type="text" value="2026" id="eraTo" placeholder="To">
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">レイヤー数</div>
      <div class="sb-check active" onclick="toggleCheck(this)">
        <div class="sb-checkbox"></div><span>2レイヤー以上</span>
      </div>
      <div class="sb-check" onclick="toggleCheck(this)">
        <div class="sb-checkbox"></div><span>3レイヤー以上</span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">イベント数</div>
      <div class="sb-item active" onclick="this.parentElement.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));this.classList.add('active')">
        <span class="sb-item-left">すべて</span>
      </div>
      <div class="sb-item" onclick="this.parentElement.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));this.classList.add('active')">
        <span class="sb-item-left">10件以上</span>
      </div>
      <div class="sb-item" onclick="this.parentElement.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));this.classList.add('active')">
        <span class="sb-item-left">30件以上</span>
      </div>
      <div class="sb-item" onclick="this.parentElement.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));this.classList.add('active')">
        <span class="sb-item-left">50件以上</span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">言語</div>
      <div class="sb-check active" onclick="toggleCheck(this)">
        <div class="sb-checkbox"></div><span>日本語</span>
      </div>
      <div class="sb-check active" onclick="toggleCheck(this)">
        <div class="sb-checkbox"></div><span>English</span>
      </div>
    </div>

    <div class="sb-reset" onclick="resetFilters()">フィルターをリセット</div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content">

    <!-- Search -->
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="キーワード、テーマ、レイヤーの組み合わせで検索…" id="searchInput" oninput="handleSearch()">
      <span class="search-kbd">⌘K</span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="result-count"><strong id="resultNum">1,247</strong> 件の年表</div>
        <div class="active-filters" id="activeFilters"></div>
      </div>
      <div class="toolbar-right">
        <select class="sort-select" id="sortSelect" onchange="rerender()">
          <option value="popular">人気順</option>
          <option value="recent">新着順</option>
          <option value="events">イベント数順</option>
          <option value="relevance">関連度順</option>
        </select>
        <div class="view-toggle">
          <button class="view-btn active" id="viewGrid" onclick="setView('grid')" title="グリッド表示">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="view-btn" id="viewList" onclick="setView('list')" title="リスト表示">
            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Grid View -->
    <div class="tl-grid active" id="gridView"></div>

    <!-- List View -->
    <div class="tl-list" id="listView"></div>

    <!-- Loading -->
    <div class="loading-row" id="loadingRow" style="display:none">
      <div class="loading-spinner"></div>
    </div>

    <!-- Empty -->
    <div class="empty-state" id="emptyState">
      <svg class="empty-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      <div class="empty-title">年表が見つかりませんでした</div>
      <div class="empty-desc">検索キーワードを変えるか、フィルターを変更してお試しください</div>
    </div>

    <!-- Infinite scroll trigger -->
    <div class="load-trigger" id="loadTrigger"></div>

  </main>
</div>

<script>
// ===== DATA GENERATOR =====
const CATS=[
  {id:'tech',name:'テクノロジー',color:'var(--c-blue)',colorD:'var(--c-blue-d)'},
  {id:'history',name:'歴史・政治',color:'var(--c-pink)',colorD:'var(--c-pink-d)'},
  {id:'culture',name:'カルチャー',color:'var(--c-gold)',colorD:'var(--c-gold-d)'},
  {id:'science',name:'科学・自然',color:'var(--c-green)',colorD:'var(--c-green-d)'},
  {id:'business',name:'ビジネス',color:'var(--c-orange)',colorD:'var(--c-orange-d)'},
  {id:'personal',name:'個人・ライフ',color:'var(--c-purple)',colorD:'var(--c-purple-d)'}
];
const COLORS=['var(--c-blue)','var(--c-pink)','var(--c-green)','var(--c-teal)','var(--c-gold)','var(--c-purple)','var(--c-orange)'];
const TITLES={
  tech:['AI革命の全体像 2020–2026','モバイル革命の全体像','ブロックチェーンの興亡','量子コンピュータへの道','SNSが変えた世界','半導体戦争の50年','サイバーセキュリティの進化','Web3.0とメタバース','クラウド革命の15年','ロボティクスの夜明け','自動運転の現在地','5G/6G通信の進化','フィンテックの破壊力','EdTechが変える教育','宇宙インターネット計画'],
  history:['宇宙開発の舞台裏','幕末から明治維新まで','冷戦の構図','フランス革命とナポレオン','シルクロードの2000年','大航海時代の光と影','日本の戦後復興','古代ローマの興亡','産業革命の波紋','民主主義の系譜','東西ドイツ統一','中東紛争の構造','EU統合の歴史','アジア通貨危機','デジタル民主主義'],
  culture:['印象派からストリートアートへ','J-POPとストリーミングの30年','映画100年史','ファッションの変遷','建築様式の進化','アニメ文化の世界進出','ヒップホップの50年','文学賞の系譜','ゲーム産業の爆発','写真表現の進化','ストリートカルチャー','食文化のグローバル化','デザイン思考の歴史','K-POPグローバル化','伝統工芸の現在'],
  science:['気候変動の100年','DNAから遺伝子編集まで','宇宙物理学の革命','感染症との闘い','素粒子物理学の旅','脳科学の最前線','再生可能エネルギー史','海洋探査の歴史','数学の美しい定理','恐竜研究の進化','火星探査ミッション','ワクチン開発の歴史','人工臓器の進化','深海探査の記録','天文学の転換点'],
  business:['日本発ユニコーンの軌跡','GAFA帝国の形成','トヨタ生産方式の進化','スタートアップ失敗学','広告業界の100年','流通革命の歴史','M&A戦略の名勝負','サブスクモデルの進化','ESG投資の潮流','不動産バブルの教訓','フリーランス経済','DX推進の記録','B2B SaaSの勃興','働き方改革の年表','コーヒー産業の変遷'],
  personal:['ふたりの10年間','子育ての記録','読書遍歴 1990–2026','マラソン完走記録','旅行アルバム年表','キャリアの転換点','猫との暮らし','引っ越しの歴史','料理スキルの進化','語学学習の道のり','ガーデニング日記','フィルム写真の記録','楽器練習の軌跡','ダイエット記録','家族の歴史']
};
const DESCS={
  tech:'技術の進化を複数レイヤーで俯瞰する年表。',
  history:'複数の視点を重ねて読み解く歴史年表。',
  culture:'文化の変遷を多角的に捉えた年表。',
  science:'科学の発見と社会への影響を重ねた年表。',
  business:'ビジネスの転換点を構造的に分析した年表。',
  personal:'人生の出来事を複数の軸で記録した年表。'
};
const NAMES=['toda_m','sato_ai','yui_art','kenta_h','rika_env','nao_biz','miki_m','abe_hist','hana_k','ryo_t','jun_s','emi_n','dai_k','yuki_o','mai_f','ken_y','aoi_m','shu_h','lin_w','tom_e'];

function generateTimelines(count){
  const items=[];
  for(let i=0;i<count;i++){
    const cat=CATS[i%6];
    const titles=TITLES[cat.id];
    const title=titles[i%titles.length];
    const layers=2+Math.floor(Math.random()*2);
    const lColors=[];for(let l=0;l<layers;l++)lColors.push(COLORS[(i+l*3)%COLORS.length]);
    items.push({
      id:i,cat:cat.id,catName:cat.name,catColor:cat.color,catColorD:cat.colorD,
      title,desc:DESCS[cat.id],layers,lColors,
      likes:Math.floor(Math.random()*3000)+50,
      events:Math.floor(Math.random()*80)+8,
      date:20260213-Math.floor(Math.random()*60),
      author:NAMES[i%NAMES.length],
      authorInitial:NAMES[i%NAMES.length][0].toUpperCase(),
      search:(title+' '+cat.catName+' '+DESCS[cat.id]).toLowerCase()
    });
  }
  return items;
}

const ALL_DATA=generateTimelines(1247);
let filteredData=[...ALL_DATA];
let displayedCount=0;
const PAGE_SIZE=24;
let currentView='grid';
let activeCat='all';
let searchQuery='';

// ===== RENDER =====
function renderGridCard(item){
  const layerDots=item.lColors.map(c=>`<span style="background:${c}"></span>`).join('');
  const miniDots=item.lColors.map((c,i)=>`<div class="tl-mini-dot" style="background:${c}"></div>${i<item.lColors.length-1?'<div class="tl-mini-spacer"></div>':''}${i<item.lColors.length-1?`<div class="tl-mini-dot" style="background:${item.lColors[(i+1)%item.lColors.length]}"></div><div class="tl-mini-spacer"></div>`:''}`).join('');
  const simpleMini=item.lColors.flatMap((c,i)=>{
    const dots=[`<div class="tl-mini-dot" style="background:${c}"></div>`];
    if(i<item.lColors.length-1)dots.push('<div class="tl-mini-spacer"></div>');
    return dots;
  });
  // Add extra dots for visual interest
  const extraDots=[...simpleMini];
  item.lColors.forEach((c,i)=>{
    extraDots.push('<div class="tl-mini-spacer"></div>');
    extraDots.push(`<div class="tl-mini-dot" style="background:${item.lColors[(i+1)%item.lColors.length]}"></div>`);
  });

  return `<div class="tl-card">
    <div class="tl-card-top">${layerDots}</div>
    <div class="tl-card-body">
      <div class="tl-card-cat" style="color:${item.catColor}">${item.catName}</div>
      <div class="tl-card-title">${item.title}</div>
      <div class="tl-card-desc">${item.desc}</div>
      <div class="tl-card-meta">
        <div class="tl-card-author"><div class="tl-avatar" style="background:${item.catColorD};color:${item.catColor}">${item.authorInitial}</div><span>@${item.author}</span></div>
        <div class="tl-card-stats"><span><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>${item.likes.toLocaleString()}</span></div>
      </div>
    </div>
    <div class="tl-mini">${extraDots.join('')}</div>
  </div>`;
}

function renderListItem(item){
  const dots=item.lColors.map(c=>`<div class="tl-list-dot" style="background:${c}"></div>`).join('');
  return `<div class="tl-list-item">
    <div class="tl-list-layers">${dots}</div>
    <div class="tl-list-body">
      <div class="tl-list-title">${item.title}</div>
      <div class="tl-list-sub">
        <span class="tl-list-cat" style="background:${item.catColorD};color:${item.catColor}">${item.catName}</span>
        <span>${item.events} events</span>
        <span>${item.layers} layers</span>
      </div>
    </div>
    <div class="tl-list-meta">
      <div class="tl-list-author">
        <div class="tl-list-author-av" style="background:${item.catColorD};color:${item.catColor}">${item.authorInitial}</div>
        <span>@${item.author}</span>
      </div>
      <span><svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2;vertical-align:-1px;margin-right:2px"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>${item.likes.toLocaleString()}</span>
    </div>
  </div>`;
}

function applyFilters(){
  filteredData=ALL_DATA.filter(item=>{
    if(activeCat!=='all'&&item.cat!==activeCat)return false;
    if(searchQuery&&!item.search.includes(searchQuery))return false;
    return true;
  });
  const sort=document.getElementById('sortSelect').value;
  filteredData.sort((a,b)=>{
    if(sort==='popular')return b.likes-a.likes;
    if(sort==='recent')return b.date-a.date;
    if(sort==='events')return b.events-a.events;
    if(sort==='relevance'&&searchQuery)return (b.search.includes(searchQuery)?1:0)-(a.search.includes(searchQuery)?1:0);
    return b.likes-a.likes;
  });
}

function renderPage(){
  const grid=document.getElementById('gridView');
  const list=document.getElementById('listView');
  const end=Math.min(displayedCount+PAGE_SIZE,filteredData.length);
  const newItems=filteredData.slice(displayedCount,end);

  if(displayedCount===0){grid.innerHTML='';list.innerHTML='';}

  newItems.forEach(item=>{
    grid.insertAdjacentHTML('beforeend',renderGridCard(item));
    list.insertAdjacentHTML('beforeend',renderListItem(item));
  });

  displayedCount=end;
  document.getElementById('resultNum').textContent=filteredData.length.toLocaleString();
  document.getElementById('emptyState').style.display=filteredData.length===0?'block':'none';
  document.getElementById('loadingRow').style.display='none';

  updateActiveFilterTags();
}

function rerender(){
  displayedCount=0;
  applyFilters();
  renderPage();
}

function handleSearch(){
  searchQuery=document.getElementById('searchInput').value.toLowerCase().trim();
  rerender();
}

// ===== VIEW TOGGLE =====
function setView(v){
  currentView=v;
  document.getElementById('viewGrid').classList.toggle('active',v==='grid');
  document.getElementById('viewList').classList.toggle('active',v==='list');
  document.getElementById('gridView').classList.toggle('active',v==='grid');
  document.getElementById('listView').classList.toggle('active',v==='list');
}

// ===== CATEGORY FILTER =====
function toggleCat(cat,el){
  activeCat=cat;
  el.parentElement.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  rerender();
}

function toggleCheck(el){el.classList.toggle('active');}

function resetFilters(){
  activeCat='all';searchQuery='';
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.sidebar .sb-item').forEach((item,i)=>{
    item.classList.toggle('active',i===0||item.parentElement.querySelector('.sb-label')?.textContent==='イベント数');
  });
  document.querySelectorAll('.sb-section').forEach(sec=>{
    const label=sec.querySelector('.sb-label');
    if(label&&label.textContent==='カテゴリ'){
      sec.querySelectorAll('.sb-item').forEach((i,idx)=>i.classList.toggle('active',idx===0));
    }
  });
  rerender();
}

function updateActiveFilterTags(){
  const container=document.getElementById('activeFilters');
  container.innerHTML='';
  if(activeCat!=='all'){
    const cat=CATS.find(c=>c.id===activeCat);
    container.innerHTML+=`<div class="active-filter-tag" onclick="toggleCat('all',document.querySelector('.sb-item[data-cat=all]'));rerender()"><span>${cat.name}</span><span class="aft-x">×</span></div>`;
  }
  if(searchQuery){
    container.innerHTML+=`<div class="active-filter-tag" onclick="document.getElementById('searchInput').value='';handleSearch()"><span>「${searchQuery}」</span><span class="aft-x">×</span></div>`;
  }
}

// ===== INFINITE SCROLL =====
const observer=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting&&displayedCount<filteredData.length){
    document.getElementById('loadingRow').style.display='flex';
    setTimeout(()=>renderPage(),300);
  }
},{rootMargin:'200px'});
observer.observe(document.getElementById('loadTrigger'));

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){
    e.preventDefault();document.getElementById('searchInput').focus();
  }
});

// ===== INIT =====
applyFilters();
renderPage();
</script>
</body>
</html>
