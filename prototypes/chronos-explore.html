<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Chronos — 年表を探す</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A0C;--bg2:#111114;--bg3:#16161A;--bg-card:#16161A;--bg-card-h:#1C1C22;
  --accent:#C8A87E;--accent-dim:rgba(200,168,126,0.13);--accent-glow:rgba(200,168,126,0.04);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#8A8680;--text3:#5A5754;
  --border:rgba(200,168,126,0.1);--border2:rgba(200,168,126,0.22);
  --line:rgba(200,168,126,0.15);
  --c-blue:#5B9BD5;--c-blue-d:rgba(91,155,213,0.12);
  --c-green:#7BC67E;--c-green-d:rgba(123,198,126,0.12);
  --c-pink:#D4849A;--c-pink-d:rgba(212,132,154,0.12);
  --c-teal:#5BBCB4;--c-teal-d:rgba(91,188,180,0.12);
  --c-gold:#C8B87E;--c-gold-d:rgba(200,184,126,0.12);
  --c-purple:#9E7EC8;--c-purple-d:rgba(158,126,200,0.12);
  --c-orange:#D4A05A;--c-orange-d:rgba(212,160,90,0.12);
  --f-d:'Erode','Shippori Mincho',serif;
  --f-b:'DM Sans',sans-serif;
  --f-m:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color-scheme:dark}
body{font-family:var(--f-b);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.88);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;height:100px;
  display:flex;align-items:center;justify-content:space-between}
.hdr-brand{font-family:var(--f-d);font-size:1.3rem;font-weight:500;
  letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;cursor:pointer}
.hdr-nav{display:flex;align-items:center;gap:20px}
.hdr-nav a{font-size:13px;color:var(--text2);text-decoration:none;transition:color 0.2s}
.hdr-nav a:hover{color:var(--text)}
.hdr-nav a.active{color:var(--accent)}
.hdr-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;
  border:1.5px solid var(--border);cursor:pointer;transition:border-color 0.2s;flex-shrink:0}
.hdr-avatar:hover{border-color:var(--accent)}
.hdr-avatar svg{width:100%;height:100%;display:block}
.hdr-burger{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:8px}
.hdr-burger svg{width:20px;height:20px;stroke:var(--text2);stroke-width:2;fill:none;stroke-linecap:round}
.hdr-burger:hover svg{stroke:var(--text)}

/* Mobile menu panel */
.menu-panel{position:fixed;top:100px;left:0;right:0;z-index:300;background:var(--bg2);
  border-bottom:1px solid var(--border);padding:8px 24px 16px;display:none;flex-direction:column}
body.menu-open .menu-panel{display:flex}
.menu-panel a{padding:15px 4px;font-size:14px;color:var(--text);text-decoration:none;
  border-bottom:1px solid var(--border);letter-spacing:0.04em}
.menu-panel a:last-child{border-bottom:none}
.menu-panel a.active{color:var(--accent)}

/* Overlay (shared: bottom sheet / menu) */
.overlay{position:fixed;inset:0;background:rgba(10,10,12,0.6);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s;z-index:250}
body.sheet-open .overlay,body.menu-open .overlay{opacity:1;visibility:visible}
body.sheet-open{overflow:hidden}

/* ===== LAYOUT (fluid full-width) ===== */
.layout{display:flex;width:100%;min-height:calc(100vh - 100px)}

/* ===== SIDEBAR ===== */
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);
  padding:24px 20px;position:sticky;top:100px;height:calc(100vh - 100px);
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sb-sheet-head{display:none}
.sb-section{margin-bottom:28px}
.sb-label{font-family:var(--f-m);font-size:9px;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.sb-item{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text2);text-align:left;
  cursor:pointer;transition:all 0.2s;margin-bottom:2px}
.sb-item:hover{background:rgba(200,168,126,0.04);color:var(--text)}
.sb-item.active{background:var(--accent-dim);color:var(--accent)}
.sb-item-count{font-family:var(--f-m);font-size:10px;color:var(--text2)}
.sb-item.active .sb-item-count{color:var(--accent);opacity:0.6}
.sb-dot{width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0}
.sb-item-left{display:flex;align-items:center}

.sb-range{display:flex;align-items:center;gap:8px;padding:0 4px}
.sb-range-input{flex:1;background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;padding:6px 8px;font-family:var(--f-m);font-size:11px;
  color:var(--text);outline:none;width:100%;text-align:center}
.sb-range-input:focus{border-color:var(--accent)}
.sb-range-sep{color:var(--text2);font-size:12px}

.sb-check{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;
  border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;text-align:left;
  transition:all 0.2s;margin-bottom:2px}
.sb-check:hover{background:rgba(200,168,126,0.04)}
.sb-check.active{color:var(--accent)}
.sb-checkbox{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.sb-check.active .sb-checkbox{background:var(--accent);border-color:var(--accent)}
.sb-check.active .sb-checkbox::after{content:'✓';font-size:10px;color:var(--bg);font-weight:600}

.sb-reset{font-size:11px;color:var(--text2);cursor:pointer;transition:color 0.2s;
  padding:8px 10px;text-align:center;width:100%}
.sb-reset:hover{color:var(--accent)}

/* ===== CONTENT ===== */
.content{flex:1;padding:24px 32px 80px;min-width:0}

/* Search */
.search-bar{display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  transition:all 0.3s ease;margin-bottom:20px}
.search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,168,126,0.06)}
.search-icon{flex-shrink:0;width:16px;height:16px;stroke:var(--text2);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-input{flex:1;background:none;border:none;outline:none;font-family:var(--f-b);
  font-size:14px;color:var(--text);caret-color:var(--accent)}
.search-input::placeholder{color:var(--text2)}
.search-kbd{font-family:var(--f-m);font-size:10px;color:var(--text2);
  padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--bg);
  letter-spacing:0.06em}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.result-count{font-size:13px;color:var(--text2)}
.result-count strong{color:var(--text);font-weight:400;font-family:var(--f-m);font-variant-numeric:tabular-nums}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.active-filter-tag{font-family:var(--f-m);font-size:10px;padding:3px 10px 3px 8px;
  border-radius:12px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;gap:5px;cursor:pointer;transition:all 0.2s}
.active-filter-tag:hover{background:rgba(200,168,126,0.2)}
.active-filter-tag .aft-x{font-size:12px;opacity:0.6}
.toolbar-right{display:flex;align-items:center;gap:8px}
.filter-btn{display:none;align-items:center;gap:6px;padding:7px 12px;
  border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2);
  background:var(--bg2);transition:all 0.2s}
.filter-btn:hover{color:var(--text);border-color:var(--border2)}
.filter-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.sort-select{font-family:var(--f-b);font-size:12px;color:var(--text2);
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  padding:6px 28px 6px 10px;cursor:pointer;outline:none;transition:all 0.2s;
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238A8680' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center}
.sort-select:focus{border-color:var(--accent)}
.sort-select option{background:var(--bg2);color:var(--text)}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.view-btn{padding:6px 10px;background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.view-btn svg{width:14px;height:14px;stroke:var(--text2);fill:none;stroke-width:2}
.view-btn.active{background:var(--accent-dim)}
.view-btn.active svg{stroke:var(--accent)}
.view-btn+.view-btn{border-left:1px solid var(--border)}

/* ===== GRID VIEW ===== */
.tl-grid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.tl-grid.active{display:grid}
.tl-grid:not(.active){display:none}

.tl-card{display:block;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:all 0.3s ease;
  text-decoration:none;color:inherit}
.tl-card:hover,.tl-card:focus-visible{border-color:var(--border2);transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(0,0,0,0.25)}
.tl-card-cover{aspect-ratio:16/8;position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);background:var(--bg2)}
.tl-card-cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ===== PHOTO COVER (Unsplash) — SVGは読み込み中プレースホルダ兼フォールバック ===== */
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity 0.4s ease,transform 0.6s ease-out;will-change:transform}
.cover-img.loaded{opacity:1}
.tl-card:hover .cover-img.loaded,.tl-card:focus-visible .cover-img.loaded{transform:scale(1.04)}
.cover-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,10,12,0) 0%,rgba(10,10,12,0.55) 100%)}
.cover-credit{position:absolute;left:10px;bottom:6px;z-index:2;display:flex;gap:3px;
  font-family:var(--f-m);font-size:9px;letter-spacing:0.04em;color:rgba(232,228,222,0.55);
  opacity:0;transition:opacity 0.3s ease;pointer-events:none;white-space:nowrap}
.tl-card:hover .cover-credit,.tl-card:focus-within .cover-credit{opacity:1;pointer-events:auto}
.cover-credit button{font:inherit;color:inherit;padding:0;text-decoration:underline;
  text-underline-offset:2px;text-decoration-color:rgba(232,228,222,0.3)}
.cover-credit button:hover{color:var(--text)}
/* 年代ベースライン（常時表示）+ 積層バー（レイヤー数ぶん、seed決定論の位置/長さ）
   両端の年代・「N layers」はhover/focusでフェードイン。クレジット(bottom:6px)の上 */
.cover-era{position:absolute;left:14px;right:14px;bottom:28px;height:1px;z-index:2;pointer-events:none}
.cover-era-line{position:absolute;inset:0;background:rgba(200,168,126,0.32)}
.cover-era-y{position:absolute;bottom:5px;font-family:var(--f-m);font-size:11px;line-height:1;
  color:var(--text);letter-spacing:0.04em;opacity:0;transition:opacity 0.2s ease}
.cover-era-y.from{left:0}.cover-era-y.to{right:0}
.cover-layers{position:absolute;left:0;right:0;bottom:1px;height:16px}
.cover-layers-track{position:absolute;left:36px;right:92px;top:0;bottom:0}
.cover-layers-bar{position:absolute;height:2px;border-radius:1px;opacity:0.9;
  bottom:calc(3px + var(--k,0)*5px);transform-origin:left center}
.cover-layers-n{position:absolute;right:38px;bottom:4px;font-family:var(--f-m);font-size:10px;line-height:1;
  color:var(--text2);letter-spacing:0.04em;white-space:nowrap;opacity:0;transition:opacity 0.2s ease}
.tl-card:hover .cover-era-y,.tl-card:focus-visible .cover-era-y,
.tl-card:hover .cover-layers-n,.tl-card:focus-visible .cover-layers-n{opacity:1;transition:opacity 0.3s ease 0.1s}

/* ===== MICRO-INTERACTIONS ===== */
.views{transition:opacity 0.2s ease}
.views.xfade{opacity:0}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tl-card.pre,.tl-list-item.pre{opacity:0}
.tl-card.in,.tl-list-item.in{animation:cardIn 0.5s ease backwards}
@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.act-like.pop svg{animation:heartPop 0.25s ease}
/* 積層バーの順次伸長（reveal時、下のバーから80ms間隔・card .in の150ms後） */
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tl-card.pre .cover-layers-bar{transform:scaleX(0)}
.tl-card.in .cover-layers-bar{animation:barIn 0.45s ease-out backwards;animation-delay:calc(150ms + var(--k,0)*80ms)}
@keyframes dotIn{from{opacity:0}to{opacity:1}}
/* ブックマーク初回ヒント（マイページ / ハンバーガーが1.2s灯る） */
.hdr-nav a{border-radius:4px;transition:color 0.3s ease,box-shadow 0.3s ease}
.hdr-nav a.hint{color:var(--accent);box-shadow:0 0 14px 5px rgba(200,168,126,0.09)}
.hdr-burger{transition:box-shadow 0.3s ease}
.hdr-burger svg{transition:stroke 0.3s ease}
.hdr-burger.hint{box-shadow:0 0 14px 3px rgba(200,168,126,0.10)}
.hdr-burger.hint svg{stroke:var(--accent)}
/* 空状態のタイムライン線画（0.6sで線が引かれる） */
@keyframes emptyLine{to{stroke-dashoffset:0}}
.empty-tl{display:block;width:220px;max-width:100%;height:24px;margin:0 auto 18px;overflow:visible}
.empty-tl line{stroke:rgba(138,134,128,0.4);stroke-width:1;stroke-dasharray:220;stroke-dashoffset:220;
  animation:emptyLine 0.6s ease forwards}
.empty-tl circle{fill:rgba(138,134,128,0.4);animation:dotIn 0.3s ease backwards}
.empty-tl circle:nth-child(2){animation-delay:0.1s}.empty-tl circle:nth-child(3){animation-delay:0.2s}.empty-tl circle:nth-child(4){animation-delay:0.3s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tl-card.pre,.tl-list-item.pre{opacity:1}
  .tl-card.pre .cover-layers-bar{transform:none}
  .empty-tl line{stroke-dashoffset:0}
}
.tl-card-body{padding:14px 14px 12px}
.tl-card-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.1em;
  text-transform:uppercase;margin-bottom:4px}
.tl-card-title{font-family:var(--f-d);font-size:16px;font-weight:400;
  line-height:1.3;margin-bottom:4px;color:var(--text-h)}
.tl-card-desc{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tl-card-author{display:flex;align-items:center;gap:6px;min-width:0}
.tl-avatar{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:var(--f-m);font-size:8px;font-weight:500;flex-shrink:0}
.tl-card-author span{font-size:10px;color:var(--text2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* Like / Bookmark buttons */
.tl-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.act-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:8px;
  font-family:var(--f-m);font-size:10px;color:var(--text2);transition:all 0.2s;
  position:relative;z-index:2}
.act-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:fill 0.2s}
.act-btn:hover{background:rgba(200,168,126,0.08);color:var(--text)}
.act-btn.on{color:var(--accent)}
.act-btn.on svg{fill:var(--accent)}

/* ===== LIST VIEW ===== */
.tl-list{flex-direction:column;gap:2px}
.tl-list.active{display:flex}
.tl-list:not(.active){display:none}

.tl-list-item{display:flex;align-items:center;gap:14px;padding:10px 14px;
  border-radius:10px;border:1px solid transparent;cursor:pointer;
  transition:all 0.2s;text-decoration:none;color:inherit}
.tl-list-item:hover{background:var(--bg-card);border-color:var(--border)}
.tl-list-thumb{width:64px;height:40px;border-radius:6px;overflow:hidden;flex-shrink:0;
  position:relative;background:var(--bg2);border:1px solid var(--border)}
.tl-list-thumb svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tl-list-body{flex:1;min-width:0}
.tl-list-title{font-family:var(--f-d);font-size:15px;font-weight:400;
  line-height:1.3;color:var(--text-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-list-sub{font-size:11px;color:var(--text2);margin-top:2px;
  display:flex;align-items:center;gap:8px}
.tl-list-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:6px}
.tl-list-author{display:flex;align-items:center;gap:5px;flex-shrink:0;
  font-size:11px;color:var(--text2)}
.tl-list-author-av{width:18px;height:18px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-family:var(--f-m);font-size:8px;flex-shrink:0}

/* ===== LOADING ===== */
.loading-row{display:flex;justify-content:center;padding:32px 0}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-trigger{height:1px}

/* ===== EMPTY ===== */
.empty-state{display:none;text-align:center;padding:60px 20px}
.empty-icon{width:44px;height:44px;margin:0 auto 14px;stroke:var(--text2);
  fill:none;stroke-width:1.5}
.empty-title{font-family:var(--f-d);font-size:18px;font-weight:300;margin-bottom:6px;color:var(--text2)}
.empty-desc{font-size:12px;color:var(--text2);line-height:1.6}

/* ===== RESPONSIVE ===== */
@media(max-width:860px){
  /* sidebar becomes a bottom sheet */
  .sidebar{position:fixed;top:auto;left:0;right:0;bottom:0;width:100%;height:auto;
    max-height:78vh;background:var(--bg2);border:1px solid var(--border);border-bottom:none;
    border-radius:18px 18px 0 0;z-index:300;transform:translateY(102%);visibility:hidden;
    transition:transform 0.32s ease,visibility 0.32s;padding:14px 20px 36px}
  body.sheet-open .sidebar{transform:translateY(0);visibility:visible}
  .sb-sheet-head{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .sidebar.dragging{transition:none}
  .sb-sheet-title{font-family:var(--f-d);font-size:15px;letter-spacing:0.08em;color:var(--text-h)}
  .sb-sheet-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;font-size:18px;color:var(--text2)}

<script>
// ===== SEEDED RANDOM (deterministic mock data) =====
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))>>>0}return h}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a.toFixed(3)})`}

const COLORS=['var(--c-blue)','var(--c-pink)','var(--c-green)','var(--c-teal)','var(--c-gold)','var(--c-purple)','var(--c-orange)'];
const TITLES={

// タイトル重複回避用の視点バリエーション（同一ベーステーマの2周目以降に付与）

const NAMES=['toda_m','sato_ai','yui_art','kenta_h','rika_env','nao_biz','miki_m','abe_hist','hana_k','ryo_t','jun_s','emi_n','dai_k','yuki_o','mai_f','ken_y','aoi_m','shu_h','lin_w','tom_e'];

function generateTimelines(count){
  const items=[];
  for(let i=0;i<count;i++){
    const cat=CATS[i%6];
    const titles=TITLES[cat.id];
    const j=Math.floor(i/6);
    const base=titles[j%titles.length];
    const rep=Math.floor(j/titles.length);
    const title=rep===0?base:`${base} — ${QUALIFIERS[(rep-1)%QUALIFIERS.length]}`;
    const desc=rep===0?DESCS[cat.id]:QUAL_DESCS[(rep-1)%QUAL_DESCS.length];
    // タイトルのハッシュをシードに: id・数値・カバーが全てリロード後も安定
    const seed=hashStr(cat.id+'|'+title);
    const rng=mulberry32(seed);
    const id=cat.id+'-'+seed.toString(36);
    const layers=2+Math.floor(rng()*2);
    const lColors=[];for(let l=0;l<layers;l++)lColors.push(COLORS[(i+l*3)%COLORS.length]);
    const likes=Math.floor(rng()*3000)+50;
    const eraFrom=1800+Math.floor(rng()*170);
    const eraTo=Math.min(2026,eraFrom+20+Math.floor(rng()*80));
    items.push({
      id,seed,cat:cat.id,catName:cat.name,catColor:cat.color,catColorD:cat.colorD,catHex:cat.hex,
      title,desc,layers,lColors,
      likes,
      bm:Math.round(likes*0.15),
      events:Math.floor(rng()*80)+8,
      date:20260213-Math.floor(rng()*60),
      eraFrom,eraTo,
      lang:rng()<0.72?'ja':'en',
      pattern:seed%6,
      author:NAMES[i%NAMES.length],
      authorInitial:NAMES[i%NAMES.length][0].toUpperCase(),
      search:(title+' '+cat.name+' '+desc).toLowerCase()
    });
  }
  return items;
}

// ───── Supabase から実90本を取得（失敗時は従来の生成モックにフォールバック）
const SUPA_URL='https://dtysaqogcvnklxtvciyn.supabase.co/rest/v1';
const SUPA_KEY='sb_publishable_Xhyzh9YugRP8MCevtf_7YA_x1IumMC6';
const CAT_BY_DB={'technology':'tech','history-politics':'history','culture':'culture','science-nature':'science','business':'business','personal-life':'personal'};
const eraLabel=y=>y<0?`前${-y}`:String(y);
async function loadRealTimelines(){
  const sel='slug,title,description,category,start_year,end_year,users(username),layers(color,position),events(count)';
  const res=await fetch(`${SUPA_URL}/timelines?select=${encodeURIComponent(sel)}&visibility=eq.public&limit=200`,
    {headers:{apikey:SUPA_KEY,Authorization:`Bearer ${SUPA_KEY}`}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const rows=await res.json();
  if(!rows.length)throw new Error('empty');
  return rows.map(r=>{
    const catId=CAT_BY_DB[r.category]||'tech';
    const cat=CATS.find(c=>c.id===catId);
    const seed=hashStr(catId+'|'+r.title);
    const rng=mulberry32(seed);
    const likes=Math.floor(rng()*3000)+50; // ソーシャル数値はseed決定論のダミー（DB接続前と同じ見え方を維持）
    const lColors=(r.layers||[]).sort((a,b)=>a.position-b.position).map(l=>`var(--c-${l.color})`);
    return {
      id:r.slug,slug:r.slug,seed,cat:catId,catName:cat.name,catColor:cat.color,catColorD:cat.colorD,catHex:cat.hex,
      title:r.title,desc:r.description,layers:lColors.length,lColors,
      likes,bm:Math.round(likes*0.15),
      events:(r.events&&r.events[0]&&r.events[0].count)||0,
      date:20260213-Math.floor(rng()*60),
      eraFrom:r.start_year,eraTo:r.end_year,
      lang:'ja',pattern:seed%6,
      author:(r.users&&r.users.username)||'chronos',authorInitial:((r.users&&r.users.username)||'c')[0].toUpperCase(),
      search:(r.title+' '+cat.name+' '+r.description).toLowerCase()
    };
  });
}
let ALL_DATA=[];const ITEM_BY_ID={};let filteredData=[];

const PAGE_SIZE=24;

// ===== FILTER STATE =====

// ===== LIKE / BOOKMARK (localStorage, 別ページと共有スキーマ) =====
const LS_LIKES='chronos_likes_v1';      // いいね済みidの配列
const LS_BM='chronos_bookmarks_v1';     // [{id,title,desc,cat,catName,likes}]
function loadJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v==null?fallback:v}catch(e){return fallback}}
let likedIds=new Set(loadJSON(LS_LIKES,[]));
let bookmarks=loadJSON(LS_BM,[]);
if(!Array.isArray(bookmarks))bookmarks=[];
function persist(){
  localStorage.setItem(LS_LIKES,JSON.stringify([...likedIds]));
  localStorage.setItem(LS_BM,JSON.stringify(bookmarks));
}
function isBookmarked(id){return bookmarks.some(b=>b.id===id)}

// ===== GENERATIVE COVERS (seeded, category-color based) =====
const VBW=320,VBH=180;
function pMesh(rng,c,uid){
  let defs='',body='';
  for(let i=0;i<4;i++){
    const gid=uid+'m'+i;
    const cx=(rng()*VBW).toFixed(1),cy=(rng()*VBH).toFixed(1),r=(80+rng()*130).toFixed(1);
    defs+=`<radialGradient id="${gid}"><stop offset="0%" stop-color="${c(0.16+rng()*0.18)}"/><stop offset="100%" stop-color="${c(0)}"/></radialGradient>`;
    body+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${gid})"/>`;
  }
  return `<defs>${defs}</defs>${body}`;
}
function pWaves(rng,c){

    const y=42+i*38+rng()*14,amp=9+rng()*15,ph=rng()*6.28,fr=40+rng()*26;
    let d=`M0 ${y.toFixed(1)}`;
    for(let x=0;x<=VBW;x+=16)d+=` L${x} ${(y+Math.sin(x/fr+ph)*amp).toFixed(1)}`;
    d+=` L${VBW} ${VBH+20} L0 ${VBH+20} Z`;

  }

}
function pDotsGrid(rng,c){
  let body='';const ox=rng()*12,oy=rng()*12;
  for(let y=10;y<VBH;y+=24)for(let x=10;x<VBW;x+=24){
    body+=`<circle cx="${(x+ox).toFixed(1)}" cy="${(y+oy).toFixed(1)}" r="${(0.9+rng()*1.9).toFixed(1)}" fill="${c(0.12+rng()*0.22)}"/>`;
  }
  return body;
}
function pContour(rng,c){
  const cx=(70+rng()*180).toFixed(1),cy=(35+rng()*110).toFixed(1);let body='';
  const bw=20+rng()*8,bh=12+rng()*5,rot=(rng()*24-12).toFixed(1);
  for(let i=1;i<=8;i++){
    body+=`<ellipse cx="${cx}" cy="${cy}" rx="${(i*bw).toFixed(1)}" ry="${(i*bh).toFixed(1)}" transform="rotate(${rot} ${cx} ${cy})" fill="none" stroke="${c(Math.max(0.08,0.3-i*0.026))}" stroke-width="1"/>`;
  }
  return body;
}
function pAurora(rng,c,uid){
  let defs='',body='';
  for(let i=0;i<3;i++){
    const gid=uid+'a'+i;
    defs+=`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c(0)}"/><stop offset="50%" stop-color="${c(0.13+rng()*0.15)}"/><stop offset="100%" stop-color="${c(0)}"/></linearGradient>`;
    const x=(rng()*VBW-40).toFixed(1),w=(90+rng()*130).toFixed(1),sk=(rng()*44-22).toFixed(1);
    body+=`<rect x="${x}" y="-40" width="${w}" height="${VBH+80}" fill="url(#${gid})" transform="skewX(${sk})"/>`;
  }
  return `<defs>${defs}</defs>${body}`;
}
function pGeo(rng,c){
  let body='';const s=32;
  for(let x=0;x<=VBW;x+=s)body+=`<line x1="${x}" y1="0" x2="${x}" y2="${VBH}" stroke="${c(0.09)}" stroke-width="1"/>`;
  for(let y=0;y<=VBH;y+=s)body+=`<line x1="0" y1="${y}" x2="${VBW}" y2="${y}" stroke="${c(0.09)}" stroke-width="1"/>`;
  for(let i=0;i<6;i++){
    const gx=Math.floor(rng()*10)*s,gy=Math.floor(rng()*6)*s;
    if(rng()<0.5)body+=`<rect x="${gx}" y="${gy}" width="${s}" height="${s}" fill="${c(0.1+rng()*0.16)}"/>`;
    else body+=`<path d="M${gx} ${gy+s} L${gx+s} ${gy+s} L${gx+s} ${gy} Z" fill="${c(0.12+rng()*0.16)}"/>`;
  }

}

function coverSVG(item,uidPrefix){
  const rng=mulberry32(item.seed+7);

  const uid=uidPrefix+item.seed.toString(36);
  const inner=PATTERNS[item.pattern](rng,c,uid);
  return `<svg viewBox="0 0 ${VBW} ${VBH}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">`+

}

function viewerHref(item){const s=item.slug||SLUG_BY_TITLE[item.title];return s?`chronos-viewer.html?slug=${s}`:'chronos-viewer.html';}
const UNSPLASH_UTM='?utm_source=chronos&utm_medium=referral';
function escHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pickPhoto(item){const pool=PHOTO_POOL[item.cat];return pool&&pool.length?pool[(item.seed>>>8)%pool.length]:null}
function photoURL(p,w,h){return `${p.raw}?w=${w}&h=${h}&fit=crop&auto=format&q=70`}
// SVGを下敷きにし、写真をlazy読み込み。onloadで.loaded付与→0.4sフェードイン。onerrorはimgを外してSVGを残す
// 積層バー: レイヤー数ぶんの短い横バーをベースライン上に積む。左端6〜34%・長さ38〜68%はseedから決定論
// （explore/profileで同一の形）。下から順に --k で積層・reveal時の伸長順を指定
function layerBars(item){
  const rng=mulberry32((item.seed^0x5A17)>>>0);
  return item.lColors.map((c,k)=>{
    const left=6+rng()*28,width=Math.min(38+rng()*30,100-left);
    return `<span class="cover-layers-bar" style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%;background:${c};--k:${k}"></span>`;
  }).join('');
}
function eraHTML(item){
  const n=item.lColors.length;
  return `<div class="cover-era"><span class="cover-era-line" aria-hidden="true"></span><span class="cover-era-y from" aria-hidden="true">${eraLabel(item.eraFrom)}</span><span class="cover-era-y to" aria-hidden="true">${eraLabel(item.eraTo)}</span>`+
    `<div class="cover-layers" role="img" aria-label="レイヤー${n}本"><span class="cover-layers-track">${layerBars(item)}</span><span class="cover-layers-n" aria-hidden="true">${n} layers</span></div></div>`;
}
function coverHTML(item,uidPrefix,size){
  const svg=coverSVG(item,uidPrefix);
  const p=pickPhoto(item);
  const thumb=size==='thumb';
  // 年代ベースライン+積層バー（カードのみ。写真なしフォールバックでも表示）
  const era=thumb?'':eraHTML(item);
  if(!p)return svg+(thumb?'':'<div class="cover-shade"></div>')+era;
  const img=`<img class="cover-img" src="${photoURL(p,thumb?128:640,thumb?80:360)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.remove()">`;
  if(thumb)return svg+img;
  const credit=`<span class="cover-credit">Photo: <button type="button" data-href="${escHTML(p.user)}${UNSPLASH_UTM}">${escHTML(p.name)}</button> / <button type="button" data-href="https://unsplash.com/${UNSPLASH_UTM}">Unsplash</button></span>`;
  return svg+img+'<div class="cover-shade"></div>'+era+credit;
}

function applyFilters(){
  filteredData=ALL_DATA.filter(it=>{
    if(state.cat!=='all'&&it.cat!==state.cat)return false;
    if(state.q&&!it.search.includes(state.q))return false;
    if(it.layers<state.minLayers)return false;
    if(it.events<state.minEvents)return false;
    if(!state.langs.has(it.lang))return false;
    if(it.eraTo<state.eraFrom||it.eraFrom>state.eraTo)return false;
    return true;
  });
  const sort=document.getElementById('sortSelect').value;
  filteredData.sort((a,b)=>{
    if(sort==='popular')return b.likes-a.likes;
    if(sort==='recent')return b.date-a.date;
    if(sort==='events')return b.events-a.events;
    if(sort==='relevance'&&state.q)return (b.search.includes(state.q)?1:0)-(a.search.includes(state.q)?1:0);
    return b.likes-a.likes;
  });
}

function renderPage(){
  const grid=document.getElementById('gridView');
  const list=document.getElementById('listView');
  const end=Math.min(displayedCount+PAGE_SIZE,filteredData.length);

  newItems.forEach(item=>{
    grid.insertAdjacentHTML('beforeend',renderGridCard(item));
    list.insertAdjacentHTML('beforeend',renderListItem(item));
  });
  observeReveal();

  displayedCount=end;

}

const REDUCE_MOTION=window.matchMedia('(prefers-reduced-motion: reduce)');

// 件数のカウントアップ: 変化時に0.4s・easeOutCubicで旧値→新値。初回とreduce-motionは即時
const resultNumEl=document.getElementById('resultNum');
let shownCount=null,countRAF=null;
function setResultCount(n){
  if(shownCount===null||shownCount===n||REDUCE_MOTION.matches){
    cancelAnimationFrame(countRAF);shownCount=n;resultNumEl.textContent=n.toLocaleString();return;
  }
  cancelAnimationFrame(countRAF);
  const from=shownCount,t0=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-t0)/400),e=1-Math.pow(1-p,3);
    shownCount=Math.round(from+(n-from)*e);
    resultNumEl.textContent=shownCount.toLocaleString();
    if(p<1)countRAF=requestAnimationFrame(step);else shownCount=n;
  };
  countRAF=requestAnimationFrame(step);
}

// フィルタ・カテゴリ切替: 0.2sで旧DOMをフェードアウト→差し替え→フェードイン
const viewsEl=document.getElementById('views');

function rerender(){
  displayedCount=0;
  applyFilters();
  clearTimeout(xfadeTimer);
  if(REDUCE_MOTION.matches){renderPage();return}
  viewsEl.classList.add('xfade');
  xfadeTimer=setTimeout(()=>{

    requestAnimationFrame(()=>viewsEl.classList.remove('xfade'));

}

// カード表示時のreveal（IntersectionObserver、下から8px・stagger 40ms）
const revealIO=new IntersectionObserver(entries=>{
  let i=0;
  entries.forEach(en=>{
    if(!en.isIntersecting)return;
    const el=en.target;
    revealIO.unobserve(el);
    el.style.animationDelay=(i++*40)+'ms';
    el.classList.remove('pre');
    el.classList.add('in');
  });
},{rootMargin:'0px 0px -5% 0px'});
function observeReveal(){
  document.querySelectorAll('.tl-card.pre,.tl-list-item.pre').forEach(el=>{
    if(REDUCE_MOTION.matches){el.classList.remove('pre');return}
    revealIO.observe(el);
  });
}

document.addEventListener('click',e=>{

  const credit=e.target.closest('.cover-credit button');

  }else{
    if(isBookmarked(item.id)){
      bookmarks=bookmarks.filter(b=>b.id!==item.id);

      bookmarks.push({id:item.id,title:item.title,desc:item.desc,cat:item.cat,catName:item.catName,likes:item.likes});

    }
  }
  persist();

});

// スワイプダウンで閉じる: ヘッダー(ハンドル部)からのpointerドラッグに追従。80px以上 or 速度十分で閉じ、未満は0.25sで戻る
(function(){
  const head=sidebarEl.querySelector('.sb-sheet-head');
  const SHEET_MQ=window.matchMedia('(max-width:860px)');
  let drag=null;
  head.addEventListener('pointerdown',e=>{
    if(!SHEET_MQ.matches||REDUCE_MOTION.matches||!document.body.classList.contains('sheet-open'))return;
    if(e.target.closest('.sb-sheet-close'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    drag={id:e.pointerId,startY:e.clientY,dy:0,lastY:e.clientY,lastT:e.timeStamp,vy:0};
    sidebarEl.classList.add('dragging');
    head.setPointerCapture(e.pointerId);
    head.style.cursor='grabbing';
  });
  head.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const dy=Math.max(0,e.clientY-drag.startY);
    const dt=e.timeStamp-drag.lastT;
    if(dt>0)drag.vy=(e.clientY-drag.lastY)/dt; // px/ms
    drag.lastY=e.clientY;drag.lastT=e.timeStamp;drag.dy=dy;
    sidebarEl.style.transform=`translateY(${dy}px)`;
  });
  function endDrag(e){
    if(!drag||e.pointerId!==drag.id)return;
    const {dy,vy}=drag;drag=null;
    head.style.cursor='';
    sidebarEl.classList.remove('dragging');
    sidebarEl.style.transition='transform 0.25s ease,visibility 0.25s';
    sidebarEl.style.transform='';           // 以後はCSS状態(open→0 / closed→102%)へ遷移
    if(e.type==='pointerup'&&(dy>=80||(vy>0.5&&dy>20)))closeSheet();
    setTimeout(()=>{sidebarEl.style.transition=''},300);
  }
  head.addEventListener('pointerup',endDrag);
  head.addEventListener('pointercancel',endDrag);
})();

const observer=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting&&displayedCount<filteredData.length){
    document.getElementById('loadingRow').style.display='flex';
    setTimeout(()=>renderPage(),300);
  }
},{rootMargin:'200px'});
observer.observe(document.getElementById('loadTrigger'));

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){
    e.preventDefault();document.getElementById('searchInput').focus();
  }
  if(e.key==='Escape'){closeSheet();closeMenu();}
});

// ===== INIT =====
(async()=>{
  try{ALL_DATA=await loadRealTimelines();}
  catch(e){ALL_DATA=generateTimelines(1247);}
  ALL_DATA.forEach(it=>ITEM_BY_ID[it.id]=it);
  document.getElementById('countAll').textContent=ALL_DATA.length.toLocaleString();
  CATS.forEach(c=>{
    const el=document.querySelector(`#catSection .sb-item[data-cat="${c.id}"] .sb-item-count`);
    if(el)el.textContent=ALL_DATA.filter(i=>i.cat===c.id).length.toLocaleString();
  });
  applyFilters();
  renderPage();
})();
</script>
</body>
</html>
