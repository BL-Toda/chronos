<!DOCTYPE html>
<html lang="ja" style="background-color:#0A0A0C;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>年表ビューア — Chronos</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="年表ビューア — Chronos">
<meta property="og:description" content="複数レイヤーで文脈を重ねて読む年表。">
<link href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0C;
    --bg2: #0E0E11;
    --bg-card: #16161A;
    --bg-card-h: #1A1A1F;
    --accent: #B8B4AE;
    --accent-soft: rgba(232,228,222,0.07);
    --accent-med: rgba(232,228,222,0.14);
    --accent-dim: rgba(232,228,222,0.07);
    --text: #E8E4DE;
    --text-h: #F5F2ED;
    --text2: #9A9590;
    --text3: #7A7570;
    --border: rgba(232,228,222,0.09);
    --border2: rgba(232,228,222,0.18);
    --line: rgba(232,228,222,0.12);

    --c-blue: #5B9BD5;     --c-blue-dim: rgba(91,155,213,0.12);   --c-blue-bar: rgba(91,155,213,0.22);
    --c-green: #7BC67E;    --c-green-dim: rgba(123,198,126,0.12);
    --c-pink: #D4849A;     --c-pink-dim: rgba(212,132,154,0.12);  --c-pink-bar: rgba(212,132,154,0.22);
    --c-gold: #C8B87E;     --c-gold-dim: rgba(200,184,126,0.12);
    --c-purple: #9E7EC8;   --c-purple-dim: rgba(158,126,200,0.12);
    --c-teal: #5BBCB4;     --c-teal-dim: rgba(91,188,180,0.12);   --c-teal-bar: rgba(91,188,180,0.22);
    --c-orange: #D4A05A;   --c-orange-dim: rgba(212,160,90,0.12);

    --f-display: 'Erode', 'Shippori Mincho', serif;
    --f-body: 'DM Sans', sans-serif;
    --f-mono: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(0.16,1,0.3,1);

    /* タイプスケール5段（行間は偶数px固定） */
    --fs-display: clamp(24px,4vw,32px); --lh-display: 44px;
    --fs-title: 18px;  --lh-title: 28px;
    --fs-body: 15px;   --lh-body: 28px;
    --fs-sm: 13px;     --lh-sm: 22px;
    --fs-xs: 11px;     --lh-xs: 18px;
    --fs-year: 32px;   --lh-year: 44px; /* タイムラインの大きな年表示専用 */

    --lane-w: 6px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; background:var(--bg); color-scheme:dark; }
  body {
    font-family:var(--f-body); background:var(--bg);
    color:var(--text); min-height:100vh;
    font-size:var(--fs-body); line-height:var(--lh-body); font-weight:400;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  :focus-visible { outline:2px solid var(--text-h); outline-offset:3px; border-radius:2px; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  /* ===== HEADER ===== */
  .header {
    position:sticky; top:0; z-index:100;
    background:rgba(10,10,12,0.88); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    padding:0 20px; height:100px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .header-brand {
    font-family:var(--f-display); font-size:var(--fs-title); line-height:var(--lh-title); font-weight:500;
    letter-spacing:0.2em; color:var(--accent); text-transform:uppercase;
  }
  .header-badge {
    font-family:var(--f-mono); font-size:var(--fs-xs); line-height:var(--lh-xs);
    padding:4px 12px; border-radius:10px; border:1px solid var(--border);
    color:var(--text3);
  }

  /* ===== HERO ===== */
  .hero {
    text-align:center; padding:36px 20px 8px;
    max-width:700px; margin:0 auto; background:var(--bg);
    opacity:0; animation:fadeUp 0.8s ease forwards 0.1s;
  }
  .hero h1 {
    font-family:var(--f-display); font-size:var(--fs-display); font-weight:400;
    line-height:var(--lh-display); margin-bottom:12px; color:var(--text-h);
  }
  .hero p {
    font-size:var(--fs-body); color:var(--text2); line-height:var(--lh-body);
    max-width:500px; margin:0 auto;
  }

  /* ===== LAYER CONTROLS ===== */
  .layer-controls {
    position:sticky; top:100px; z-index:90;
    background:rgba(10,10,12,0.92); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:12px 16px; display:flex; gap:8px; flex-wrap:wrap;
    justify-content:center;
  }
  .layer-chip {
    font-family:var(--f-body); font-size:var(--fs-sm); line-height:var(--lh-sm); font-weight:500;
    letter-spacing:0.04em; padding:4px 16px; border-radius:999px;
    border:1px solid var(--border); background:transparent;
    cursor:pointer; transition:border-color 0.3s,background 0.3s,color 0.3s; user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
    display:flex; align-items:center; gap:8px; color:var(--text3);
  }
  .chip-dot { width:7px; height:7px; border-radius:50%; transition:transform 0.3s var(--ease); }
  .layer-chip[data-layer="art"] .chip-dot { background:var(--c-blue); }
  .layer-chip[data-layer="art"].active { border-color:var(--c-blue); background:var(--c-blue-dim); color:var(--c-blue); }
  .layer-chip[data-layer="history"] .chip-dot { background:var(--c-pink); }
  .layer-chip[data-layer="history"].active { border-color:var(--c-pink); background:var(--c-pink-dim); color:var(--c-pink); }
  .layer-chip[data-layer="science"] .chip-dot { background:var(--c-teal); }
  .layer-chip[data-layer="science"].active { border-color:var(--c-teal); background:var(--c-teal-dim); color:var(--c-teal); }
  .layer-chip[data-layer="product"] .chip-dot { background:var(--c-blue); }
  .layer-chip[data-layer="product"].active { border-color:var(--c-blue); background:var(--c-blue-dim); color:var(--c-blue); }
  .layer-chip[data-layer="management"] .chip-dot { background:var(--c-pink); }
  .layer-chip[data-layer="management"].active { border-color:var(--c-pink); background:var(--c-pink-dim); color:var(--c-pink); }
  .layer-chip[data-layer="industry"] .chip-dot { background:var(--c-teal); }
  .layer-chip[data-layer="industry"].active { border-color:var(--c-teal); background:var(--c-teal-dim); color:var(--c-teal); }

  /* ===== LEGEND ===== */
  .legend {
    display:flex; gap:20px; justify-content:center;
    padding:16px 16px 8px; max-width:700px; margin:0 auto;
    background:var(--bg);
    opacity:0; animation:fadeUp 0.6s ease forwards 0.3s;
  }
  .legend-item {
    display:flex; align-items:center; gap:8px;
    font-size:var(--fs-xs); line-height:var(--lh-xs); color:var(--text3);
  }
  .legend-dot-icon {
    width:8px; height:8px; border-radius:50%; background:var(--accent); opacity:0.5;
  }
  .legend-bar-icon {
    width:6px; height:20px; border-radius:3px; background:var(--accent); opacity:0.35;
  }

  /* ===== TIMELINE CONTAINER ===== */
  .tl-wrap {
    max-width:700px; margin:0 auto;
    padding:12px 16px 100px 16px;
    background:var(--bg);
  }

  /* ===== TIMELINE ROW ===== */
  .tl-row {
    display:flex; align-items:stretch;
    min-height:24px; position:relative;
    opacity:0; transform:translateY(12px);
    transition:opacity 0.35s var(--ease), transform 0.35s var(--ease);
  }
  .tl-row.visible { opacity:1; transform:translateY(0); }
  .tl-row.hidden { display:none; }

  /* ===== LANE AREA (left side) ===== */
  .tl-lanes {
    display:flex; gap:4px; flex-shrink:0;
    width:60px; padding:0 8px 0 0; position:relative;
    align-items:stretch;
  }

  /* Individual lane bar */
  .lane {
    width:var(--lane-w); border-radius:3px;
    flex-shrink:0; position:relative;
    transition:opacity 0.35s var(--ease), width 0.3s var(--ease);
  }
  .lane.active {
    opacity:1;
  }
  .lane.inactive {
    width:0; opacity:0; margin:0; padding:0;
  }
  .lane.art    { background:var(--c-blue-bar); }
  .lane.history { background:var(--c-pink-bar); }
  .lane.science { background:var(--c-teal-bar); }

  /* Lane start cap */
  .lane.start { border-radius:3px 3px 0 0; }
  .lane.end   { border-radius:0 0 3px 3px; }
  .lane.start.end { border-radius:3px; }

  /* Lane label (appears at start) */
  .lane-label {
    position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    font-family:var(--f-mono); font-size:var(--fs-xs); line-height:var(--lh-xs); letter-spacing:0.04em;
    white-space:nowrap; writing-mode:horizontal-tb;
    opacity:0.7;
  }
  .lane-label.art { color:var(--c-blue); }
  .lane-label.history { color:var(--c-pink); }
  .lane-label.science { color:var(--c-teal); }

  /* Spacer lane (invisible, holds position) */
  .lane.spacer {
    width:var(--lane-w); background:transparent;
  }

  /* ===== AXIS DOT ===== */
  .tl-axis {
    display:flex; flex-direction:column; align-items:center;
    width:24px; flex-shrink:0; position:relative;
  }
  .tl-axis::before {
    content:''; position:absolute; top:0; bottom:0; left:50%;
    width:1px; background:var(--line); transform:translateX(-50%);
  }
  .axis-dot {
    width:10px; height:10px; border-radius:50%;
    border:2px solid var(--bg); position:relative; z-index:5;
    margin-top:16px; flex-shrink:0;
  }
  .axis-dot.art    { background:var(--c-blue); box-shadow:0 0 0 3px var(--c-blue-dim); }
  .axis-dot.history { background:var(--c-pink); box-shadow:0 0 0 3px var(--c-pink-dim); }
  .axis-dot.science { background:var(--c-teal); box-shadow:0 0 0 3px var(--c-teal-dim); }

  /* Period marker on axis — small horizontal bar */
  .axis-period-mark {
    width:16px; height:3px; border-radius:2px;
    position:relative; z-index:5; margin-top:20px; flex-shrink:0;
  }
  .axis-period-mark.start.art     { background:var(--c-blue); }
  .axis-period-mark.start.history  { background:var(--c-pink); }
  .axis-period-mark.start.science  { background:var(--c-teal); }
  .axis-period-mark.end.art       { background:var(--c-blue); opacity:0.4; }
  .axis-period-mark.end.history    { background:var(--c-pink); opacity:0.4; }
  .axis-period-mark.end.science    { background:var(--c-teal); opacity:0.4; }

  /* Dashed connector: lane → axis for period rows */
  .period-connector {
    display:flex; align-items:center; flex-shrink:0;
    width:12px; position:relative;
  }
  .period-connector::before {
    content:''; position:absolute;
    top:21px; left:0; right:0; height:0;
    border-top:1.5px dashed var(--text3);
    opacity:0.35;
  }
  .period-connector.art::before    { border-color:var(--c-blue); opacity:0.45; }
  .period-connector.history::before { border-color:var(--c-pink); opacity:0.45; }
  .period-connector.science::before { border-color:var(--c-teal); opacity:0.45; }
  .period-connector.end::before { opacity:0.25; }

  /* Invisible spacer — same width, keeps axis aligned on non-period rows */
  .connector-spacer {
    width:12px; flex-shrink:0;
  }

  /* ===== CONTENT AREA (right) ===== */
  .tl-content {
    flex:1; padding:8px 0 8px 12px; min-width:0;
  }

  /* Year separator */
  .tl-year {
    display:flex; align-items:center; padding:20px 0 8px 0;
  }
  .tl-year-text {
    font-family:var(--f-display); font-size:var(--fs-year); font-weight:400;
    color:var(--text-h); opacity:0.2; line-height:var(--lh-year);
    font-variant-numeric:tabular-nums;
  }
  .tl-year-line {
    flex:1; height:1px; margin-left:16px;
    background:linear-gradient(90deg, var(--line), transparent);
  }

  /* Event card */
  .ev-card {
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:12px; padding:16px 20px; margin-bottom:8px;
    transition:background 0.2s, border-color 0.2s; cursor:pointer; position:relative;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
    overflow:hidden;
  }
  .ev-card::before {
    content:''; position:absolute; top:0; left:0; bottom:0; width:3px;
    border-radius:3px 0 0 3px;
  }
  .ev-card.art::before    { background:var(--c-blue); }
  .ev-card.history::before { background:var(--c-pink); }
  .ev-card.science::before { background:var(--c-teal); }

  /* Caret for ev-card (point events) */
  .ev-card .ev-caret {
    position:absolute; top:16px; right:16px;
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    transition:transform 0.35s var(--ease);
  }
  .ev-card .ev-caret svg {
    width:14px; height:14px; stroke:var(--text3); stroke-width:2;
    fill:none; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.3s;
  }
  .ev-card.expanded .ev-caret { transform:rotate(180deg); }

  /* Accordion body for ev-card */
  .ev-card .ev-accordion-body {
    max-height:0; overflow:hidden;
    transition:max-height 0.35s var(--ease), opacity 0.3s var(--ease);
    opacity:0;
  }
  .ev-card.expanded .ev-accordion-body {
    max-height:300px; opacity:1;
  }

  .ev-date {
    font-size:var(--fs-sm); line-height:var(--lh-sm); font-weight:500; color:var(--text2);
    letter-spacing:0.04em; font-variant-numeric:tabular-nums; margin-bottom:4px;
  }
  .ev-title {
    font-family:var(--f-display); font-size:var(--fs-title); font-weight:500;
    line-height:var(--lh-title); color:var(--text-h); margin-bottom:4px;
    transition:color 0.3s;
  }
  .ev-summary {
    font-size:var(--fs-body); color:var(--text); line-height:var(--lh-body);
  }
  .ev-tags { margin-top:8px; display:flex; gap:4px; flex-wrap:wrap; }
  .ev-tag {
    display:inline-flex; align-items:center; font-family:var(--f-mono); font-size:var(--fs-xs); line-height:var(--lh-xs);
    letter-spacing:0.06em; padding:0 8px; border-radius:999px;
  }
  .ev-tag.art    { background:var(--c-blue-dim); color:var(--c-blue); }
  .ev-tag.history { background:var(--c-pink-dim); color:var(--c-pink); }
  .ev-tag.science { background:var(--c-teal-dim); color:var(--c-teal); }
  .ev-tag.cred   { background:rgba(232,228,222,0.08); color:var(--text); }
  .ev-tag.period { background:var(--accent-soft); color:var(--text2); }

  /* Period start card — expandable, same fields as point events */
  .period-card-start {
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:12px; padding:16px 20px; margin-bottom:8px;
    transition:background 0.2s, border-color 0.2s; cursor:pointer; position:relative;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
    overflow:hidden;
  }
  .period-card-start::before {
    content:''; position:absolute; top:0; left:0; bottom:0; width:3px;
    border-radius:3px 0 0 3px;
  }
  .period-card-start.art::before    { background:var(--c-blue); }
  .period-card-start.history::before { background:var(--c-pink); }
  .period-card-start.science::before { background:var(--c-teal); }

  /* Period bar inside card */
  .period-bar-inline {
    display:flex; align-items:center; gap:8px; margin:8px 0 8px;
  }
  .period-bar-track {
    flex:1; height:6px; border-radius:3px; position:relative; overflow:hidden;
  }
  .period-bar-track.art    { background:var(--c-blue-dim); }
  .period-bar-track.history { background:var(--c-pink-dim); }
  .period-bar-track.science { background:var(--c-teal-dim); }
  .period-bar-fill {
    position:absolute; top:0; left:0; bottom:0; border-radius:3px;
    animation: barGrow 1s var(--ease) forwards;
  }
  .period-bar-track.art .period-bar-fill    { background:var(--c-blue); opacity:0.45; }
  .period-bar-track.history .period-bar-fill { background:var(--c-pink); opacity:0.45; }
  .period-bar-track.science .period-bar-fill { background:var(--c-teal); opacity:0.45; }
  @keyframes barGrow { from{width:0} to{width:100%} }

  .period-bar-year {
    font-size:var(--fs-xs); line-height:var(--lh-xs); color:var(--text3);
    letter-spacing:0.02em; font-variant-numeric:tabular-nums; flex-shrink:0;
  }

  /* Period end card — minimal */
  .period-label-end {
    padding:8px 16px; margin-bottom:8px;
    background:transparent; border:1px dashed var(--border);
    border-radius:10px; display:flex; align-items:center; gap:8px;
  }
  .period-label-end .pl-bar {
    width:20px; height:4px; border-radius:2px; flex-shrink:0; opacity:0.4;
  }
  .period-label-end .pl-bar.art    { background:var(--c-blue); }
  .period-label-end .pl-bar.history { background:var(--c-pink); }
  .period-label-end .pl-bar.science { background:var(--c-teal); }

  .pl-text {
    font-family:var(--f-display); font-size:var(--fs-sm); line-height:var(--lh-sm); font-weight:500;
    color:var(--text-h);
  }
  .pl-text .pl-end-note {
    font-family:var(--f-body); font-size:var(--fs-xs); line-height:var(--lh-xs); font-weight:400; color:var(--text3);
    margin-left:8px;
  }

  /* Lane hover & active highlight */
  .lane:not(.spacer) { cursor:pointer; transition:opacity 0.35s var(--ease), width 0.3s var(--ease), filter 0.3s var(--ease); }

  /* Period highlight — emphasis on active period rows */
  .tl-row.period-highlight .ev-card,
  .tl-row.period-highlight .period-card-start {
    border-color:var(--border2);
    box-shadow:0 0 0 1px var(--accent-soft), 0 4px 20px rgba(0,0,0,0.3);
  }
  .tl-row.period-highlight .period-label-end {
    border-color:var(--border2);
  }
  /* Dim non-highlighted rows */
  .tl-wrap.has-highlight .tl-row:not(.period-highlight):not([data-layers="all"]) {
    opacity:0.22; transition:opacity 0.35s var(--ease);
  }
  .tl-wrap.has-highlight .tl-row.period-highlight {
    opacity:1; transition:opacity 0.35s var(--ease);
  }
  /* Lane glow */
  .lane.lane-glow {
    filter:brightness(2.2) !important;
    box-shadow:0 0 8px rgba(232,228,222,0.15);
  }

  /* Caret icon for period accordion */
  .period-caret {
    position:absolute; top:16px; right:16px;
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    transition:transform 0.35s var(--ease);
  }
  .period-caret svg {
    width:14px; height:14px; stroke:var(--text3); stroke-width:2;
    fill:none; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.3s;
  }
  .period-card-start.expanded .period-caret { transform:rotate(180deg); }

  /* Accordion body */
  .period-accordion-body {
    max-height:0; overflow:hidden;
    transition:max-height 0.35s var(--ease), opacity 0.3s var(--ease);
    opacity:0;
  }
  .period-card-start.expanded .period-accordion-body {
    max-height:300px; opacity:1;
  }

  /* Center-focus highlight — card nearest viewport center, monotone emphasis */
  .ev-card.center-focus,
  .period-card-start.center-focus {
    border-color:rgba(232,228,222,0.28) !important;
    background:var(--bg-card-h) !important;
    box-shadow:0 0 0 1px rgba(232,228,222,0.06), 0 2px 14px rgba(0,0,0,0.2) !important;
    transition:border-color 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.35s var(--ease);
  }

  /* ===== RESPONSIVE ===== */
  @media (min-width:768px) {
    .tl-wrap { padding-left:32px; padding-right:32px; }
    .tl-lanes { width:72px; }
  }
  @media (max-width:400px) {
    .tl-lanes { width:44px; padding-right:4px; }
  }

  /* ===== VIEWER-SPECIFIC ===== */
  /* Public hero */
  .pub-hero {
    text-align:center; padding:32px 20px 24px;
    max-width:700px; margin:0 auto;
    border-bottom:1px solid var(--border);
    opacity:0; animation:fadeUp 0.8s ease forwards 0.1s;
  }
  .pub-emoji { font-size:var(--fs-display); line-height:var(--lh-display); margin-bottom:12px; }
  .pub-title {
    font-family:var(--f-display); font-size:var(--fs-display); font-weight:500;
    color:var(--text-h); margin-bottom:12px; line-height:var(--lh-display);
  }
  .pub-meta {
    display:flex; align-items:center; justify-content:center;
    gap:12px; margin-bottom:16px; flex-wrap:wrap;
  }
  .pub-author { display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); line-height:var(--lh-sm); color:var(--text2); }
  .pub-avatar {
    width:24px; height:24px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent-soft),var(--bg-card));
    border:1px solid var(--border2);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--f-display); font-size:var(--fs-xs); line-height:var(--lh-xs); color:var(--accent);
  }
  .pub-stat {
    font-family:var(--f-mono); font-size:var(--fs-xs); line-height:var(--lh-xs);
    color:var(--text3); letter-spacing:0.04em; font-variant-numeric:tabular-nums;
  }
  .pub-desc {
    font-size:var(--fs-body); color:var(--text2); line-height:var(--lh-body);
    max-width:480px; margin:0 auto;
  }

  /* Like button */
  .like-btn {
    display:inline-flex; align-items:center; gap:8px;
    height:32px; padding:0 16px; border-radius:999px;
    border:1px solid var(--border); background:transparent;
    color:var(--text2); font-family:var(--f-body); font-size:var(--fs-sm); line-height:var(--lh-sm);
    cursor:pointer; transition:border-color 0.25s, background 0.25s, color 0.25s;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
  }
  .like-btn svg {
    width:14px; height:14px; flex-shrink:0;
    stroke:currentColor; stroke-width:1.8; fill:none;
    stroke-linecap:round; stroke-linejoin:round; transition:fill 0.25s, stroke 0.25s;
  }
  .like-count {
    font-family:var(--f-mono); font-size:var(--fs-xs); line-height:var(--lh-xs); letter-spacing:0.04em; font-variant-numeric:tabular-nums;
  }
  .like-btn.liked {
    border-color:rgba(212,132,154,0.35); background:var(--c-pink-dim); color:var(--c-pink);
  }
  .like-btn.liked svg { fill:var(--c-pink); stroke:var(--c-pink); }

  /* Share button in header */
  .hdr-btn {
    height:36px; padding:0 16px; border-radius:8px;
    border:1px solid var(--border); background:none;
    color:var(--text2); font-size:var(--fs-sm); line-height:var(--lh-sm); font-family:var(--f-body);
    cursor:pointer; display:flex; align-items:center; gap:8px;
    transition:border-color 0.2s, color 0.2s, background 0.2s; white-space:nowrap;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
  }
  .hdr-btn svg { width:14px; height:14px; flex-shrink:0; }

  /* Share sheet */
  .share-overlay {
    position:fixed; inset:0; z-index:300;
    background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
    display:none; align-items:flex-end; justify-content:center;
  }
  .share-overlay.open { display:flex; }
  .share-sheet {
    width:100%; max-width:440px; background:var(--bg2);
    border-radius:20px 20px 0 0; border:1px solid var(--border);
    border-bottom:none; padding:20px 24px 32px;
    animation:slideUp 0.35s var(--ease);
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .share-handle { width:36px; height:4px; border-radius:2px; background:var(--text3); margin:0 auto 16px; opacity:0.3; }
  .share-title { font-family:var(--f-display); font-size:var(--fs-title); line-height:var(--lh-title); font-weight:500; color:var(--text-h); text-align:center; margin-bottom:20px; }
  .share-url {
    display:flex; align-items:center; gap:8px; padding:12px 16px;
    border-radius:10px; background:var(--bg-card); border:1px solid var(--border); margin-bottom:20px;
  }
  .share-url-text { flex:1; font-family:var(--f-mono); font-size:var(--fs-sm); line-height:var(--lh-sm); color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .share-url-copy {
    padding:4px 16px; border-radius:8px; background:var(--text-h); color:var(--bg);
    font-size:var(--fs-sm); line-height:var(--lh-sm); font-family:var(--f-body); font-weight:500;
    border:none; cursor:pointer; flex-shrink:0; transition:background 0.2s;
    touch-action:manipulation;
  }
  .share-btns { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .share-btn {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:16px 8px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg-card); cursor:pointer;
    transition:border-color 0.2s, background 0.2s, transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
  }
  .share-btn-icon { font-size:var(--fs-title); line-height:var(--lh-title); }
  .share-btn-label { font-size:var(--fs-xs); line-height:var(--lh-xs); color:var(--text3); }
  .share-dismiss {
    width:100%; padding:12px; border-radius:12px; background:none;
    border:1px solid var(--border); color:var(--text2);
    font-size:var(--fs-sm); line-height:var(--lh-sm); font-family:var(--f-body); cursor:pointer;
    transition:border-color 0.2s, color 0.2s, background 0.2s;
    touch-action:manipulation; -webkit-tap-highlight-color:rgba(232,228,222,0.06);
  }

  /* CTA footer */
  .pub-footer {
    position:fixed; bottom:0; left:0; right:0; z-index:80;
    background:rgba(10,10,12,0.92); backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    padding:12px 16px; display:flex; align-items:center;
    justify-content:space-between; gap:12px;
  }
  .pub-footer-brand { font-family:var(--f-display); font-size:var(--fs-xs); line-height:var(--lh-xs); color:var(--accent); letter-spacing:0.12em; text-transform:uppercase; }
  .pub-footer-desc { font-size:var(--fs-xs); line-height:var(--lh-xs); color:var(--text3); }
  .pub-footer-cta {
    padding:8px 20px; border-radius:10px; background:var(--text-h); color:var(--bg);
    font-size:var(--fs-sm); line-height:var(--lh-sm); font-family:var(--f-body); font-weight:500;
    border:none; cursor:pointer; white-space:nowrap; flex-shrink:0;
    transition:background 0.2s, transform 0.3s var(--ease);
    touch-action:manipulation;
  }
  .toast {
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(16px);
    padding:8px 20px; border-radius:10px; background:var(--text-h); color:var(--bg);
    font-size:var(--fs-sm); line-height:var(--lh-sm); font-weight:500; opacity:0; transition:opacity 0.3s, transform 0.3s var(--ease);
    z-index:400; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== ACTIVE (tap) STATES ===== */
  .ev-card:active, .period-card-start:active, .share-btn:active { background:#1E1E24; }
  .like-btn:active, .hdr-btn:active, .share-dismiss:active { background:rgba(232,228,222,0.06); }

  /* ===== HOVER（ポインタ環境のみ。タッチでは残らない） ===== */
  @media (hover:hover) and (pointer:fine) {
    .layer-chip:hover { border-color:var(--border2); background:rgba(232,228,222,0.05); color:var(--text2); }
    .layer-chip:hover .chip-dot { transform:scale(1.15); }
    .lane:not(.spacer):hover { filter:brightness(1.6); }
    .ev-card:hover, .period-card-start:hover { background:var(--bg-card-h); border-color:var(--border2); }
    .ev-card:hover .ev-title, .period-card-start:hover .ev-title { color:#FFFFFF; }
    .ev-card:hover .ev-caret svg { stroke:var(--text-h); }
    .period-card-start:hover .period-caret svg { stroke:var(--text-h); }
    .like-btn:not(.liked):hover { border-color:var(--border2); color:var(--text-h); }
    .hdr-btn:hover { border-color:var(--border2); color:var(--text-h); }
    .share-btn:hover { border-color:var(--border2); background:var(--bg-card-h); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.35); }
    .share-dismiss:hover { border-color:var(--border2); color:var(--text-h); }
    .share-url-copy:hover, .pub-footer-cta:hover { background:#FFFFFF; }
    .ev-src a:hover { color:var(--text-h); }
  }

  /* ===== REDUCED MOTION ===== */
  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    * { transition:none !important; animation:none !important; }
    .hero, .pub-hero, .legend { opacity:1; }
    .tl-row { opacity:1; transform:none; }
    .period-bar-fill { width:100%; }
  }
</style>
</head>
<body>

  </div>
  <button class="hdr-btn" onclick="openShare()">

      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>

</div>

    <div class="share-url">
      <span class="share-url-text" id="shareUrlText"></span>
      <button class="share-url-copy" onclick="copyURL()">コピー</button>
    </div>
    <div class="share-btns">
      <div class="share-btn"><div class="share-btn-icon">𝕏</div><div class="share-btn-label">Post</div></div>
      <div class="share-btn"><div class="share-btn-icon">💬</div><div class="share-btn-label">LINE</div></div>
      <div class="share-btn"><div class="share-btn-icon">📘</div><div class="share-btn-label">Facebook</div></div>
      <div class="share-btn"><div class="share-btn-icon">🔗</div><div class="share-btn-label">埋め込み</div></div>

    <button class="share-dismiss" onclick="closeShare()">閉じる</button>

</div>
<div class="toast" id="toast">コピーしました</div>

<script>
// ───────── Chronos viewer — Supabase データ駆動版
// 公開年表を publishable key(公開可・RLSでSELECTのみ)で読む。?slug= で年表を指定。
const SUPA_URL = 'https://dtysaqogcvnklxtvciyn.supabase.co/rest/v1';
const SUPA_KEY = 'sb_publishable_Xhyzh9YugRP8MCevtf_7YA_x1IumMC6';
const DEFAULT_SLUG = 'tech-ai-revolution';
const COLOR_HEX = {blue:'#5B9BD5',green:'#7BC67E',pink:'#D4849A',gold:'#C8B87E',purple:'#9E7EC8',teal:'#5BBCB4',orange:'#D4A05A'};
const CRED = {verified:['✓ 検証済み','cred'],disputed:['諸説あり','cred-d'],unverified:['未検証','cred-u']};

// 7色ぶんのレーン/カード/バー系スタイルを動的生成(art/history/science固定クラスの一般化)
(function(){
  let css = '.ev-tag.cred-d{background:rgba(212,160,90,0.1);color:var(--c-orange)}\n.ev-tag.cred-u{background:rgba(138,134,128,0.12);color:var(--text2)}\n';
  css += '.ev-summary p+p{margin-top:8px}\n.ev-summary strong{color:var(--text-h);font-weight:500}\n';
  css += '.ev-note{margin-top:8px;font-size:11px;color:var(--c-orange);background:rgba(212,160,90,0.07);border-left:2px solid rgba(212,160,90,0.4);padding:6px 10px;border-radius:0 8px 8px 0;line-height:1.6}\n';
  css += '.ev-note b{font-family:var(--f-mono);font-size:10px;font-weight:400;letter-spacing:0.1em;display:block;margin-bottom:2px}\n';
  css += '.ev-srcs{margin-top:8px;border-top:1px solid var(--border);padding-top:7px;display:flex;flex-direction:column;gap:2px}\n';
  css += '.ev-src{font-size:11px;color:var(--text3);line-height:1.6}\n.ev-src a{color:var(--text2);text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:2px;word-break:break-all}\n';
  css += '.ev-card .ev-accordion-body,.period-card-start .period-accordion-body{transition:max-height 0.5s cubic-bezier(0.16,1,0.3,1),opacity 0.3s ease}\n';
  css += '.ev-card.expanded .ev-accordion-body,.period-card-start.expanded .period-accordion-body{max-height:1200px}\n';
  for (const [name, hex] of Object.entries(COLOR_HEX)) {
    const rgb = [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)].join(',');
    const dim = `rgba(${rgb},0.12)`, bar = `rgba(${rgb},0.22)`;
    css += `.lane.c-${name}{background:${bar}}\n`;
    css += `.axis-dot.c-${name}{background:${hex};box-shadow:0 0 0 3px ${dim}}\n`;
    css += `.axis-period-mark.start.c-${name}{background:${hex}}\n.axis-period-mark.end.c-${name}{background:${hex};opacity:0.4}\n`;
    css += `.period-connector.c-${name}::before{border-color:${hex};opacity:0.45}\n`;
    css += `.ev-card.c-${name}::before,.period-card-start.c-${name}::before{background:${hex}}\n`;
    css += `.ev-tag.c-${name}{background:${dim};color:${hex}}\n`;
    css += `.period-bar-track.c-${name}{background:${dim}}\n.period-bar-track.c-${name} .period-bar-fill{background:${hex};opacity:0.45}\n`;
    css += `.period-label-end .pl-bar.c-${name}{background:${hex}}\n`;
    css += `.layer-chip.c-${name}.active{border-color:${hex};background:${dim};color:${hex}}\n`;
  }
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => '<p>' + esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n{2,}/g, '</p><p>') + '</p>';

// "0044-03-15 BC" / "2020-05-28" → {y(負=BC), m, d, key}
function parseDate(str){
  const bc = /\sBC$/.test(str);
  const [y, m, d] = str.replace(/\sBC$/, '').split('-').map(Number);
  const yy = bc ? -y : y;
  return {y: yy, m, d, key: yy * 10000 + m * 100 + d};
}
const yearLabel = y => y < 0 ? `前${-y}` : String(y);
function fmtDate(dateStr, precision){
  const p = parseDate(dateStr);
  const y = yearLabel(p.y);
  if (precision === 'year') return y;
  const mm = String(p.m).padStart(2, '0');
  if (precision === 'month') return `${y}.${mm}`;
  return `${y}.${mm}.${String(p.d).padStart(2, '0')}`;
}

let TL = null;            // 取得した年表
let activeLayers = new Set();

async function loadTimeline(){
  const slug = new URLSearchParams(location.search).get('slug') || DEFAULT_SLUG;
  const sel = 'slug,title,description,category,start_year,end_year,like_count,'
    + 'users(username,display_name),'
    + 'layers(id,name,color,position),'
    + 'events(id,event_date,end_date,date_precision,event_type,title,summary,credibility,credibility_note,layer_id,position,event_sources(title,url))';
  try {
    const res = await fetch(`${SUPA_URL}/timelines?slug=eq.${encodeURIComponent(slug)}&select=${encodeURIComponent(sel)}&limit=1`,
      {headers: {apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`}});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!rows.length) throw new Error('not found');
    TL = rows[0];
  } catch (err) {
    document.getElementById('tlStatus').innerHTML =
      `年表を読み込めませんでした（${esc(err.message)}）<br><br>` +
      `<a href="?slug=${esc(DEFAULT_SLUG)}" style="color:var(--accent)">サンプル年表を開く</a>`;
    document.getElementById('pubTitle').textContent = '年表が見つかりません';
    return;
  }
  render();
}

function render(){
  const t = TL;
  t.layers.sort((a,b) => a.position - b.position);
  t.events.forEach(e => { e._d = parseDate(e.event_date); e._e = e.end_date ? parseDate(e.end_date) : null; });
  t.events.sort((a,b) => a._d.key - b._d.key || a.position - b.position);
  const layerById = Object.fromEntries(t.layers.map(l => [l.id, l]));

  // ヘッダー・ヒーロー
  document.title = `${t.title} — Chronos`;
  document.getElementById('hdrTitle').textContent = t.title;
  document.getElementById('pubTitle').textContent = t.title;
  document.getElementById('pubDesc').textContent = t.description;
  const au = t.users || {username: 'chronos'};
  document.getElementById('pubAuthor').textContent = '@' + au.username;
  document.querySelector('.pub-avatar').textContent = au.username[0].toUpperCase();
  const era = `${yearLabel(t.start_year)}–${yearLabel(t.end_year)}`;
  document.getElementById('pubStat').textContent = `${t.events.length} events · ${t.layers.length} layers · ${era}`;
  document.getElementById('shareUrlText').textContent = location.href;

  // レイヤーチップ
  activeLayers = new Set(t.layers.map(l => l.id));
  document.getElementById('layerControls').innerHTML = t.layers.map(l =>
    `<button class="layer-chip c-${l.color} active" data-layer="${l.id}" onclick="toggleLayer('${l.id}',this)">` +
    `<span class="chip-dot" style="background:${COLOR_HEX[l.color]}"></span>${esc(l.name)}</button>`).join('');

  // 期間イベント(レーン割当・時系列順)
  const periods = t.events.filter(e => e.event_type === 'period' && e._e).map((e, i) => ({ev: e, pid: 'p' + i}));

  // 描画アイテム列: 点/期間開始(=イベント) + 期間終了マーカー を日付順に混ぜる
  const items = [];
  t.events.forEach(e => items.push({kind: e.event_type === 'period' && e._e ? 'pstart' : 'point', ev: e, key: e._d.key}));
  periods.forEach(p => items.push({kind: 'pend', ev: p.ev, pid: p.pid, key: p.ev._e.key + 0.5}));
  items.sort((a,b) => a.key - b.key);

  const laneState = {}; periods.forEach(p => laneState[p.pid] = 'before'); // before | active | after
  const lanesHTML = (opts = {}) => periods.map(p => {
    const st = laneState[p.pid];
    if (st !== 'active' && opts.startPid !== p.pid && opts.endPid !== p.pid)
      return `<div class="lane spacer" data-period="${p.pid}"></div>`;
    const color = (layerById[p.ev.layer_id] || {}).color || 'gold';
    const cap = opts.startPid === p.pid ? ' start' : opts.endPid === p.pid ? ' end' : '';
    return `<div class="lane c-${color}${cap} active" data-period="${p.pid}"></div>`;
  }).join('');

  let html = '', lastYear = null;
  const pidOf = ev => (periods.find(p => p.ev === ev) || {}).pid;
  for (const it of items) {
    const ev = it.ev;
    const layer = layerById[ev.layer_id] || {name: '', color: 'gold', id: ''};
    const y = it.kind === 'pend' ? ev._e.y : ev._d.y;
    if (it.kind !== 'pend' && y !== lastYear) {
      lastYear = y;
      html += `<div class="tl-row" data-layers="all"><div class="tl-lanes">${lanesHTML()}</div><div class="connector-spacer"></div>` +
        `<div class="tl-axis"><div style="margin-top:28px"></div></div>` +
        `<div class="tl-content"><div class="tl-year"><div class="tl-year-text">${yearLabel(y)}</div><div class="tl-year-line"></div></div></div></div>`;
    }
    const caret = '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
    const credTag = CRED[ev.credibility] || CRED.unverified;
    const note = ev.credibility_note ? `<div class="ev-note"><b>${ev.credibility === 'disputed' ? '（諸説ありの理由）' : '（未検証の理由）'}</b>${esc(ev.credibility_note)}</div>` : '';
    const srcs = (ev.event_sources || []).map(sc => sc.url
      ? `<div class="ev-src">出典: <a href="${esc(sc.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${esc(sc.title)}</a></div>`
      : `<div class="ev-src">出典: ${esc(sc.title)}</div>`).join('');
    const body = `<div class="ev-summary">${md(ev.summary)}</div>${note}${srcs ? `<div class="ev-srcs">${srcs}</div>` : ''}` +
      `<div class="ev-tags"><span class="ev-tag c-${layer.color}">${esc(layer.name)}</span>%%PERIODTAG%%<span class="ev-tag ${credTag[1]}">${credTag[0]}</span></div>`;

    if (it.kind === 'point') {
      html += `<div class="tl-row" data-layers="${layer.id}"><div class="tl-lanes">${lanesHTML()}</div><div class="connector-spacer"></div>` +
        `<div class="tl-axis"><div class="axis-dot c-${layer.color}"></div></div>` +
        `<div class="tl-content"><div class="ev-card c-${layer.color}" onclick="toggleEvAccordion(this)">` +
        `<div class="ev-caret">${caret}</div><div class="ev-date">${fmtDate(ev.event_date, ev.date_precision)}</div>` +
        `<div class="ev-title">${esc(ev.title)}</div><div class="ev-accordion-body">${body.replace('%%PERIODTAG%%','')}</div></div></div></div>`;
    } else if (it.kind === 'pstart') {
      const pid = pidOf(ev); laneState[pid] = 'active';
      const years = Math.max(1, ev._e.y - ev._d.y);
      html += `<div class="tl-row" data-layers="${layer.id}" data-period-id="${pid}" data-period-action="start">` +
        `<div class="tl-lanes">${lanesHTML({startPid: pid})}</div><div class="period-connector c-${layer.color}"></div>` +
        `<div class="tl-axis"><div class="axis-period-mark start c-${layer.color}"></div></div>` +
        `<div class="tl-content"><div class="period-card-start c-${layer.color}" onclick="toggleAccordion(this)">` +
        `<div class="period-caret">${caret}</div><div class="ev-date">${fmtDate(ev.event_date, ev.date_precision)} — ${fmtDate(ev.end_date, ev.date_precision)}</div>` +
        `<div class="ev-title">${esc(ev.title)}</div>` +
        `<div class="period-bar-inline"><span class="period-bar-year">${yearLabel(ev._d.y)}</span><div class="period-bar-track c-${layer.color}"><div class="period-bar-fill"></div></div><span class="period-bar-year">${yearLabel(ev._e.y)}</span></div>` +
        `<div class="period-accordion-body">${body.replace('%%PERIODTAG%%', `<span class="ev-tag period">期間 ${years}年</span>`)}</div></div></div></div>`;
    } else { // pend
      const pid = it.pid;
      html += `<div class="tl-row" data-layers="${layer.id}" data-period-id="${pid}" data-period-action="end">` +
        `<div class="tl-lanes">${lanesHTML({endPid: pid})}</div><div class="period-connector c-${layer.color} end"></div>` +
        `<div class="tl-axis"><div class="axis-period-mark end c-${layer.color}"></div></div>` +
        `<div class="tl-content"><div class="period-label-end"><div class="pl-bar c-${layer.color}"></div>` +
        `<div class="pl-text">${esc(ev.title)}<span class="pl-end-note">ここまで（${yearLabel(ev._e.y)}）</span></div></div></div></div>`;
      laneState[pid] = 'after';
    }
  }
  document.getElementById('timeline').innerHTML = html;

  setupReveal();
  setupLaneClicks();
  setupCenterFocus();
  renderLike();
  document.getElementById('likeBtn').style.display = '';
}

// ── レイヤー表示切替
function toggleLayer(layerId, chip){
  if (activeLayers.has(layerId)) { if (activeLayers.size === 1) return; activeLayers.delete(layerId); chip.classList.remove('active'); }
  else { activeLayers.add(layerId); chip.classList.add('active'); }
  updateVisibility();
}
function updateVisibility(){
  document.querySelectorAll('.tl-row').forEach(row => {
    const l = row.dataset.layers;
    row.classList.toggle('hidden', !(l === 'all' || activeLayers.has(l)));
  });
}

// ── 期間ハイライト
let highlightedPeriod = null;
function highlightPeriod(pid){
  const wrap = document.getElementById('timeline');
  wrap.classList.add('has-highlight');
  document.querySelectorAll('.tl-row').forEach(row => {
    const hasLane = row.querySelector(`.lane[data-period="${pid}"]:not(.spacer)`);
    row.classList.toggle('period-highlight', !!hasLane || row.dataset.periodId === pid);
  });
  document.querySelectorAll(`.lane[data-period="${pid}"]:not(.spacer)`).forEach(l => l.classList.add('lane-glow'));
}
function clearPeriodHighlight(){
  document.getElementById('timeline').classList.remove('has-highlight');
  document.querySelectorAll('.period-highlight').forEach(r => r.classList.remove('period-highlight'));
  document.querySelectorAll('.lane-glow').forEach(l => l.classList.remove('lane-glow'));
  highlightedPeriod = null;
}
function setupLaneClicks(){
  document.querySelectorAll('.lane:not(.spacer)').forEach(lane => {
    lane.addEventListener('click', e => {
      e.stopPropagation();
      const pid = lane.dataset.period;
      if (highlightedPeriod === pid) { clearPeriodHighlight(); return; }
      clearPeriodHighlight(); highlightedPeriod = pid; highlightPeriod(pid);
    });
  });
  document.addEventListener('click', e => { if (highlightedPeriod && !e.target.closest('.lane')) clearPeriodHighlight(); });
}

// ── アコーディオン
function toggleAccordion(card){ card.classList.toggle('expanded'); }
function toggleEvAccordion(card){ card.classList.toggle('expanded'); }

// ── スクロールリビール
function setupReveal(){
  const rows = document.querySelectorAll('.tl-row');
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('visible'); io.unobserve(en.target); }
  }), {rootMargin: '0px 0px -8% 0px'});
  rows.forEach(r => io.observe(r));
}

// ── 中央フォーカス
function setupCenterFocus(){
  const allCards = document.querySelectorAll('.ev-card, .period-card-start');
  function tick(){
    const vh = Math.min(window.innerHeight || Infinity, document.documentElement.clientHeight || Infinity);
    const center = vh * 0.42;
    let best = null, bestDist = Infinity;
    allCards.forEach(card => {
      const rect = card.getBoundingClientRect();
      if (!rect.height) return;
      const dist = Math.abs(rect.top + rect.height / 2 - center);
      if (dist < bestDist) { bestDist = dist; best = card; }
    });
    allCards.forEach(c => c.classList.toggle('center-focus', c === best && bestDist < vh * 0.25));
  }
  let raf = null;
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = null; tick(); }); }, {passive: true});
  tick();
}

// ── 共有
function openShare(){ document.getElementById('shareOverlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeShare(){ document.getElementById('shareOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function copyURL(){
  navigator.clipboard && navigator.clipboard.writeText(location.href).catch(() => {});
  const t = document.getElementById('toast');
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000);
}

// ── いいね(localStorageで画面間連携: chronos_likes_v1)
const LIKE_KEY = 'chronos_likes_v1';
function likeId(){ return TL ? TL.slug : ''; }
function getLikedIds(){
  try { const v = JSON.parse(localStorage.getItem(LIKE_KEY)); return Array.isArray(v) ? v : []; } catch { return []; }
}
function renderLike(){
  const liked = getLikedIds().includes(likeId());
  const btn = document.getElementById('likeBtn');
  btn.classList.toggle('liked', liked);
  btn.setAttribute('aria-pressed', String(liked));
  document.getElementById('likeCount').textContent = ((TL.like_count || 0) + (liked ? 1 : 0)).toLocaleString();
}
function toggleTimelineLike(){
  let ids = getLikedIds();
  if (ids.includes(likeId())) ids = ids.filter(id => id !== likeId());
  else ids.push(likeId());
  localStorage.setItem(LIKE_KEY, JSON.stringify(ids));
  renderLike();
}

loadTimeline();
