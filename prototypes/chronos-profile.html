<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chronos — @toda</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A0C;--bg2:#0E0E11;--card:#16161A;
  --accent:#B8B4AE;--accent-soft:rgba(232,228,222,0.07);--accent-med:rgba(232,228,222,0.14);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#9A9590;--text3:#7A7570;
  --border:rgba(232,228,222,0.09);--border2:rgba(232,228,222,0.18);
  --ease:cubic-bezier(0.16,1,0.3,1);
  /* タイプスケール5段（行間は偶数px固定） */
  --fs-display:clamp(24px,4vw,32px);--lh-display:44px;
  --fs-title:18px;--lh-title:28px;
  --fs-body:15px;--lh-body:28px;
  --fs-sm:13px;--lh-sm:22px;
  --fs-xs:11px;--lh-xs:18px;
  --fs-input:16px;--lh-input:24px;
  --c-blue:#5B9BD5;--c-blue-d:rgba(91,155,213,0.12);
  --c-green:#7BC67E;--c-green-d:rgba(123,198,126,0.12);
  --c-pink:#D4849A;--c-pink-d:rgba(212,132,154,0.12);
  --c-teal:#5BBCB4;
  --c-gold:#C8B87E;--c-gold-d:rgba(200,184,126,0.12);
  --c-purple:#9E7EC8;--c-purple-d:rgba(158,126,200,0.12);
  --c-orange:#D4A05A;--c-orange-d:rgba(212,160,90,0.12);
  --f-d:'Erode','Shippori Mincho',serif;
  --f-b:'DM Sans',sans-serif;
  --f-m:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color-scheme:dark}
html{overflow-x:clip}
body{font-family:var(--f-b);color:var(--text);min-height:100vh;
  font-size:var(--fs-body);line-height:var(--lh-body);font-weight:400;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;
  display:flex;flex-direction:column}
a,button{-webkit-tap-highlight-color:rgba(232,228,222,0.06)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--text-h);outline-offset:3px;border-radius:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.88);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;height:100px;
  display:flex;align-items:center;justify-content:space-between}
.hdr-brand img{height:40px;width:auto;display:block}
.hdr-nav{display:flex;align-items:center;gap:20px}
.hdr-nav a{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--text2);text-decoration:none;transition:color 0.2s var(--ease)}
.hdr-burger{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:8px;transition:background 0.2s var(--ease)}
.hdr-burger:active{background:#1A1A1F}
.hdr-burger svg{width:20px;height:20px;stroke:var(--text2);stroke-width:2;fill:none;stroke-linecap:round;transition:stroke 0.2s var(--ease)}

/* Mobile menu panel */
.menu-panel{position:fixed;top:100px;left:0;right:0;z-index:300;background:var(--bg2);
  border-bottom:1px solid var(--border);padding:8px 24px 16px;display:none;flex-direction:column}
body.menu-open .menu-panel{display:flex}
.menu-panel a{padding:16px 4px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text);text-decoration:none;
  border-bottom:1px solid var(--border);letter-spacing:0.04em}
.menu-panel a:active{background:#1A1A1F}
.menu-panel a:last-child{border-bottom:none}
.overlay{position:fixed;inset:0;background:rgba(10,10,12,0.6);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s;z-index:250}
body.menu-open .overlay{opacity:1;visibility:visible}

/* ===== PAGE ===== */
.page{width:100%;max-width:1200px;margin:0 auto;padding:56px 32px 80px;flex:1}

/* ===== PROFILE HEADER ===== */
.profile{display:flex;align-items:center;gap:28px;margin-bottom:56px;
  animation:fadeUp 0.5s var(--ease) both}
.profile-avatar{width:96px;height:96px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);border:1px solid var(--border2);
  font-family:var(--f-d);font-size:var(--fs-display);line-height:var(--lh-display);font-weight:400;color:var(--accent)}
.profile-body{min-width:0}
.profile-name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.profile-name{font-family:var(--f-d);font-size:var(--fs-display);line-height:var(--lh-display);font-weight:500;
  letter-spacing:0.08em;color:var(--text-h)}
.profile-handle{font-family:var(--f-m);font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);letter-spacing:0.04em}
.profile-bio{font-size:var(--fs-sm);color:var(--text2);line-height:var(--lh-sm);margin-top:8px}
.profile-stats{display:flex;align-items:center;gap:24px;margin-top:16px}
.stat{display:flex;align-items:baseline;gap:8px}
.stat-num{font-family:var(--f-m);font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-h)}
.stat-label{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text2)}
.stat-sep{width:1px;height:14px;background:var(--border);align-self:center}

/* ===== SECTION ===== */
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;
  padding-bottom:12px;border-bottom:1px solid var(--border)}
.section-title{font-family:var(--f-d);font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500;
  letter-spacing:0.14em;color:var(--text-h)}
.section-count{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}

/* ===== GRID (explore v3系カード) ===== */
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px;
  animation:fadeUp 0.5s var(--ease) 0.08s both}
.tl-card{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;
  transition:border-color 0.3s,background 0.3s,transform 0.3s var(--ease),box-shadow 0.3s var(--ease);
  text-decoration:none;color:inherit}
.tl-card:active{background:#1A1A1F}
.tl-card:focus-visible{border-color:var(--border2);transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(0,0,0,0.35)}
.tl-card-cover{aspect-ratio:16/8;position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);background:var(--bg2)}
.tl-card-cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ===== PHOTO COVER (Unsplash) — SVGは読み込み中プレースホルダ兼フォールバック（exploreと同一） ===== */
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity 0.4s var(--ease),transform 0.6s var(--ease);will-change:transform}
.cover-img.loaded{opacity:1}
.tl-card:focus-visible .cover-img.loaded{transform:scale(1.04)}
.cover-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,10,12,0) 0%,rgba(10,10,12,0.55) 100%)}
.cover-credit{position:absolute;left:10px;bottom:6px;z-index:2;display:flex;gap:4px;
  font-family:var(--f-m);font-size:var(--fs-xs);line-height:12px;letter-spacing:0.04em;color:rgba(232,228,222,0.55);
  opacity:0;transition:opacity 0.3s var(--ease);pointer-events:none;white-space:nowrap}
.tl-card:focus-within .cover-credit{opacity:1;pointer-events:auto}
.cover-credit button{font:inherit;color:inherit;padding:0;text-decoration:underline;
  text-underline-offset:2px;text-decoration-color:rgba(232,228,222,0.3);
  transition:color 0.2s var(--ease),text-decoration-color 0.2s var(--ease)}
/* 年代ベースライン（常時表示）+ 積層バー（exploreと同一: seed決定論の位置/長さ）
   両端の年代・「N layers」はhover/focusでフェードイン。クレジット(bottom:6px)の上 */
.cover-era{position:absolute;left:14px;right:14px;bottom:28px;height:1px;z-index:2;pointer-events:none}
.cover-era-line{position:absolute;inset:0;background:rgba(232,228,222,0.32)}
.cover-era-y{position:absolute;bottom:5px;font-family:var(--f-b);font-size:var(--fs-xs);line-height:12px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:0.04em;opacity:0;transition:opacity 0.2s var(--ease)}
.cover-era-y.from{left:0}.cover-era-y.to{right:0}
.cover-layers{position:absolute;left:0;right:0;bottom:1px;height:16px}
.cover-layers-track{position:absolute;left:36px;right:92px;top:0;bottom:0}
.cover-layers-bar{position:absolute;height:2px;border-radius:1px;opacity:0.9;
  bottom:calc(3px + var(--k,0)*5px);transform-origin:left center;
  animation:barIn 0.45s ease-out backwards;animation-delay:calc(230ms + var(--k,0)*80ms)}
.cover-layers-n{position:absolute;right:38px;bottom:4px;font-family:var(--f-m);font-size:var(--fs-xs);line-height:12px;
  color:var(--text2);letter-spacing:0.04em;white-space:nowrap;opacity:0;transition:opacity 0.2s var(--ease)}
.tl-card:focus-visible .cover-era-y,
.tl-card:focus-visible .cover-layers-n{opacity:1;transition:opacity 0.3s var(--ease) 0.1s}
/* 積層バーの順次伸長（グリッドfadeUp 0.08s + 150ms後、下のバーから80ms間隔） */
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.act-btn.pop svg{animation:heartPop 0.25s ease}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.tl-card-body{padding:20px 20px 16px}
.tl-card-cat{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.1em;
  text-transform:uppercase;margin-bottom:4px}
.tl-card-title{font-family:var(--f-d);font-size:var(--fs-title);font-weight:500;
  line-height:var(--lh-title);margin-bottom:4px;color:var(--text-h);transition:color 0.3s}
.tl-card-desc{font-size:var(--fs-sm);color:var(--text2);line-height:var(--lh-sm);margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tl-card-events{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}
.act-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;
  font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text2);
  font-variant-numeric:tabular-nums;transition:background 0.2s var(--ease),color 0.2s var(--ease);
  position:relative;z-index:2}
.act-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:fill 0.2s}
.act-btn:active{background:rgba(232,228,222,0.10)}
.act-btn.on{color:var(--text-h)}
.act-btn.on svg{fill:currentColor}

/* ===== EMPTY ===== */
.empty-state{display:none;text-align:center;padding:72px 20px}
.empty-icon{width:44px;height:44px;margin:0 auto 16px;stroke:var(--text2);
  fill:none;stroke-width:1.5;stroke-linecap:round}
.empty-title{font-family:var(--f-d);font-size:var(--fs-title);line-height:var(--lh-title);font-weight:400;
  letter-spacing:0.06em;color:var(--text2);margin-bottom:8px}
.empty-desc{font-size:var(--fs-sm);color:var(--text3);line-height:var(--lh-sm)}
body.is-empty .tl-grid{display:none}
body.is-empty .empty-state{display:block}
body.is-empty .section-count{display:none}

/* ===== FOOTER ===== */
.ftr{border-top:1px solid var(--border);padding:28px 32px;
  display:flex;align-items:center;justify-content:center;gap:12px}
.ftr img{height:18px;width:auto;display:block;opacity:0.85}
.ftr span{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3);letter-spacing:0.06em}

/* ===== RESPONSIVE ===== */
@media(max-width:540px){
  .hdr{padding:0 16px}
  .hdr-nav{gap:12px}
  .hdr-nav a{display:none}
  .hdr-burger{display:inline-flex}
  .page{padding:36px 16px 64px}
}
@media(max-width:400px){
  .profile{flex-direction:column;align-items:flex-start;gap:20px;margin-bottom:40px}
  .profile-avatar{width:80px;height:80px}
  .tl-grid{grid-template-columns:1fr;gap:16px}
}

/* ===== HOVER（ポインタ環境のみ。タッチでは残らない） ===== */
@media (hover:hover) and (pointer:fine){
  .hdr-nav a:hover{color:var(--text-h)}
  .hdr-burger:hover svg{stroke:var(--text)}
  .tl-card:hover{border-color:var(--border2);background:#1A1A1F;transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(0,0,0,0.35)}
  .tl-card:hover .tl-card-title{color:#FFFFFF}
  .tl-card:hover .cover-img.loaded{transform:scale(1.04)}
  .tl-card:hover .cover-credit{opacity:1;pointer-events:auto}
  .tl-card:hover .cover-era-y,
  .tl-card:hover .cover-layers-n{opacity:1;transition:opacity 0.3s var(--ease) 0.1s}
  .cover-credit button:hover{color:var(--text);text-decoration-color:rgba(232,228,222,0.5)}
  .act-btn:hover{background:var(--accent-soft);color:var(--text-h)}
  .menu-panel a:hover{color:var(--text-h)}
}
</style>
</head>

<header class="hdr">
  <div class="hdr-brand"><a href="chronos-explore.html" aria-label="Chronos" style="display:block"><img src="assets/chronos-logo.svg" alt="Chronos"></a></div>
  <nav class="hdr-nav">
    <a href="chronos-screens.html">マイページ</a>
    <a href="chronos-explore.html">年表を探す</a>
    <a href="#">年表をつくる</a>
    <button type="button" class="hdr-burger" id="menuBtn" aria-label="メニュー" aria-expanded="false">
      <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </nav>
</header>

<!-- Mobile menu panel -->
<div class="menu-panel" id="menuPanel" role="dialog" aria-label="メニュー">
  <a href="chronos-screens.html">マイページ</a>
  <a href="chronos-explore.html">年表を探す</a>
  <a href="#">年表をつくる</a>
</div>
<div class="overlay" id="overlay"></div>

<main class="page">

  <!-- PROFILE HEADER -->
  <section class="profile">
    <div class="profile-avatar" aria-hidden="true" id="pfAvatar">C</div>
    <div class="profile-body">
      <div class="profile-name-row">
        <h1 class="profile-name" id="pfName">読み込み中…</h1>
        <span class="profile-handle" id="pfHandle"></span>
      </div>
      <p class="profile-bio" id="pfBio"></p>
      <div class="profile-stats">
        <div class="stat"><span class="stat-num" id="statCount">4</span><span class="stat-label">公開年表</span></div>
        <div class="stat-sep" aria-hidden="true"></div>

</main>

<footer class="ftr">
  <img src="assets/chronos-logo.svg" alt="Chronos">
  <span>— Every event has context.</span>

<script>
// ===== SEEDED RANDOM(exploreと同一ロジック: 同じタイトルなら同じカバー) =====
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))>>>0}return h}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a.toFixed(3)})`}

// ===== DATA(@todaの公開年表 4件) =====
const CAT_META={
  tech:{name:'テクノロジー',color:'var(--c-blue)',hex:'#5B9BD5'},
  history:{name:'歴史・政治',color:'var(--c-pink)',hex:'#D4849A'},
  culture:{name:'カルチャー',color:'var(--c-gold)',hex:'#C8B87E'},
  science:{name:'科学・自然',color:'var(--c-green)',hex:'#7BC67E'},
  business:{name:'ビジネス',color:'var(--c-orange)',hex:'#D4A05A'},
  personal:{name:'個人・ライフ',color:'var(--c-purple)',hex:'#9E7EC8'}
};
// lColors はexploreの同一年表と同じ並び（exploreは生成インデックス依存のためここでは明示）
let TIMELINES=[
  {cat:'tech',title:'AI革命の全体像 2020–2026',desc:'技術の進化を複数レイヤーで俯瞰する年表。',likes:4820,events:64,lColors:['var(--c-blue)','var(--c-teal)','var(--c-orange)']},
  {cat:'history',title:'宇宙開発の舞台裏',desc:'複数の視点を重ねて読み解く歴史年表。',likes:3260,events:48,lColors:['var(--c-pink)','var(--c-gold)','var(--c-blue)']},
  {cat:'tech',title:'半導体戦争の50年',desc:'地政学と技術のせめぎ合いを重ねた年表。',likes:2840,events:52,lColors:['var(--c-green)','var(--c-purple)']},
  {cat:'science',title:'気候変動の100年',desc:'科学の発見と社会への影響を重ねた年表。',likes:1480,events:37,lColors:['var(--c-teal)','var(--c-orange)','var(--c-green)']}
].map(t=>{
  const seed=hashStr(t.cat+'|'+t.title);
  // 年代範囲はexploreと同じrng消費順（layers→likes→eraFrom→eraTo）で導出し、同一年表で一致させる
  const rng=mulberry32(seed);rng();rng();
  const eraFrom=1800+Math.floor(rng()*170);
  const eraTo=Math.min(2026,eraFrom+20+Math.floor(rng()*80));
  return {...t,seed,id:t.cat+'-'+seed.toString(36),pattern:seed%6,eraFrom,eraTo,
    catName:CAT_META[t.cat].name,catColor:CAT_META[t.cat].color,catHex:CAT_META[t.cat].hex};
});

// ===== GENERATIVE COVERS(explore v3の簡略移植・シード決定論) =====
const VBW=320,VBH=180;
function pMesh(rng,c,uid){
  let defs='',body='';
  for(let i=0;i<4;i++){
    const gid=uid+'m'+i;
    const cx=(rng()*VBW).toFixed(1),cy=(rng()*VBH).toFixed(1),r=(80+rng()*130).toFixed(1);
    defs+=`<radialGradient id="${gid}"><stop offset="0%" stop-color="${c(0.16+rng()*0.18)}"/><stop offset="100%" stop-color="${c(0)}"/></radialGradient>`;
    body+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${gid})"/>`;
  }
  return `<defs>${defs}</defs>${body}`;
}
function pWaves(rng,c){
  let body='';
  for(let i=0;i<4;i++){
    const y=42+i*38+rng()*14,amp=9+rng()*15,ph=rng()*6.28,fr=40+rng()*26;
    let d=`M0 ${y.toFixed(1)}`;
    for(let x=0;x<=VBW;x+=16)d+=` L${x} ${(y+Math.sin(x/fr+ph)*amp).toFixed(1)}`;
    d+=` L${VBW} ${VBH+20} L0 ${VBH+20} Z`;

  for(let y=10;y<VBH;y+=24)for(let x=10;x<VBW;x+=24){
    body+=`<circle cx="${(x+ox).toFixed(1)}" cy="${(y+oy).toFixed(1)}" r="${(0.9+rng()*1.9).toFixed(1)}" fill="${c(0.12+rng()*0.22)}"/>`;
  }

}
function pContour(rng,c){
  const cx=(70+rng()*180).toFixed(1),cy=(35+rng()*110).toFixed(1);let body='';
  const bw=20+rng()*8,bh=12+rng()*5,rot=(rng()*24-12).toFixed(1);
  for(let i=1;i<=8;i++){
    body+=`<ellipse cx="${cx}" cy="${cy}" rx="${(i*bw).toFixed(1)}" ry="${(i*bh).toFixed(1)}" transform="rotate(${rot} ${cx} ${cy})" fill="none" stroke="${c(Math.max(0.08,0.3-i*0.026))}" stroke-width="1"/>`;

  for(let x=0;x<=VBW;x+=s)body+=`<line x1="${x}" y1="0" x2="${x}" y2="${VBH}" stroke="${c(0.09)}" stroke-width="1"/>`;
  for(let y=0;y<=VBH;y+=s)body+=`<line x1="0" y1="${y}" x2="${VBW}" y2="${y}" stroke="${c(0.09)}" stroke-width="1"/>`;
  for(let i=0;i<6;i++){

function escHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

// SVGを下敷きにし、写真をlazy読み込み。onloadで.loaded付与→0.4sフェードイン。onerrorはimgを外してSVGを残す
// 積層バー: exploreと同一ロジック（seed^0x5A17 → 左端6〜34%・長さ38〜68%）。同じ年表なら同じ形
function layerBars(item){
  if(item.bars&&item.bars.length){
    return item.bars.map((b,k)=>
      `<span class="cover-layers-bar" style="left:${b.left.toFixed(1)}%;width:${b.width.toFixed(1)}%;background:${b.color};--k:${k}"></span>`).join('');
  }
  const rng=mulberry32((item.seed^0x5A17)>>>0);
  return item.lColors.map((c,k)=>{
    const left=6+rng()*28,width=Math.min(38+rng()*30,100-left);
    return `<span class="cover-layers-bar" style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%;background:${c};--k:${k}"></span>`;
  }).join('');
}
function eraHTML(item){
  const n=item.lColors.length;
  return `<div class="cover-era"><span class="cover-era-line" aria-hidden="true"></span><span class="cover-era-y from" aria-hidden="true">${item.eraFrom}</span><span class="cover-era-y to" aria-hidden="true">${item.eraTo}</span>`+
    `<div class="cover-layers" role="img" aria-label="レイヤー${n}本"><span class="cover-layers-track">${layerBars(item)}</span><span class="cover-layers-n" aria-hidden="true">${(item.bars||[]).length?`${item.bars.length} period${item.bars.length>1?'s':''}`:`${item.lColors.length} layer${item.lColors.length>1?'s':''}`}</span></div></div>`;
}
function coverHTML(item,uidPrefix,size){
  const svg=coverSVG(item);
  const p=pickPhoto(item);

  // 年代ベースライン+積層バー（カードのみ。写真なしフォールバックでも表示）
  const era=thumb?'':eraHTML(item);
  if(!p)return svg+(thumb?'':'<div class="cover-shade"></div>')+era;
  const img=`<img class="cover-img" src="${photoURL(p,thumb?128:640,thumb?80:360)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.remove()">`;
  if(thumb)return svg+img;
  const credit=`<span class="cover-credit">Photo: <button type="button" data-href="${escHTML(p.user)}${UNSPLASH_UTM}">${escHTML(p.name)}</button> / <button type="button" data-href="https://unsplash.com/${UNSPLASH_UTM}">Unsplash</button></span>`;
  return svg+img+'<div class="cover-shade"></div>'+era+credit;
}

function renderCard(item){
  const liked=likedIds.has(item.id);
  return `<a class="tl-card" href="${viewerHref(item)}">
    <div class="tl-card-cover">${coverHTML(item,'p','card')}</div>
    <div class="tl-card-body">
      <div class="tl-card-cat" style="color:${item.catColor}">${item.catName}</div>
      <div class="tl-card-title">${item.title}</div>
      <div class="tl-card-desc">${item.desc}</div>
      <div class="tl-card-meta">
        <span class="tl-card-events">${item.events} events</span>
        <button type="button" class="act-btn${liked?' on':''}" data-id="${item.id}" aria-pressed="${liked}" aria-label="いいね">${ICON_HEART}<span class="act-num">${(item.likes+(liked?1:0)).toLocaleString()}</span></button>
      </div>
    </div>
  </a>`;
}

// ───── Supabase から実データを取得（?u=username で切替。失敗時は上のモックにフォールバック）
const SUPA_URL='https://dtysaqogcvnklxtvciyn.supabase.co/rest/v1';
const SUPA_KEY='sb_publishable_Xhyzh9YugRP8MCevtf_7YA_x1IumMC6';
const CAT_BY_DB={'technology':'tech','history-politics':'history','culture':'culture','science-nature':'science','business':'business','personal-life':'personal'};
const dateYear=d=>{const bc=/\sBC$/.test(d);const y=parseInt(d.replace(/\sBC$/,'').slice(0,4),10);return bc?-y:y;};

async function loadProfile(){
  const uname=params.get('u')||'chronos';
  const H={apikey:SUPA_KEY,Authorization:`Bearer ${SUPA_KEY}`};
  const sel='id,slug,title,description,category,start_year,end_year,like_count,layers(id,color,position),events(count)';
  const [ur,tr]=await Promise.all([
    fetch(`${SUPA_URL}/users?username=eq.${encodeURIComponent(uname)}&select=username,display_name,bio&limit=1`,{headers:H}),
    fetch(`${SUPA_URL}/timelines?select=${encodeURIComponent(sel)},users!inner(username)&users.username=eq.${encodeURIComponent(uname)}&visibility=eq.public&order=slug&limit=100`,{headers:H})
  ]);
  if(!ur.ok||!tr.ok) throw new Error('HTTP');
  const [u]=await ur.json(); const rows=await tr.json();
  if(!u||!rows.length) throw new Error('empty');

  // 期間イベント（カバーの積層バー用）
  const periodsBy={};
  try{
    const ids=rows.map(r=>`"${r.id}"`).join(',');
    const pr=await fetch(`${SUPA_URL}/events?event_type=eq.period&timeline_id=in.(${ids})&select=timeline_id,event_date,end_date,layer_id&limit=1000`,{headers:H});
    if(pr.ok) for(const e of await pr.json()) (periodsBy[e.timeline_id] ??= []).push(e);
  }catch(e){}

  document.getElementById('pfName').textContent=u.display_name||u.username;
  document.getElementById('pfHandle').textContent='@'+u.username;
  document.getElementById('pfBio').textContent=u.bio||'';
  document.getElementById('pfAvatar').textContent=u.username[0].toUpperCase();
  document.title=`Chronos — @${u.username}`;

  return rows.map(r=>{
    const catId=CAT_BY_DB[r.category]||'tech';
    const seed=hashStr(catId+'|'+r.title);
    const ls=(r.layers||[]).slice().sort((a,b)=>a.position-b.position);
    const colorById=Object.fromEntries(ls.map(l=>[l.id,`var(--c-${l.color})`]));
    const lColors=ls.map(l=>`var(--c-${l.color})`);
    const span=Math.max(1,(r.end_year||0)-(r.start_year||0));
    const bars=(periodsBy[r.id]||[]).map(e=>{
      const a=dateYear(e.event_date), b=dateYear(e.end_date);
      const left=Math.max(0,Math.min(96,((a-r.start_year)/span)*100));
      const width=Math.max(4,Math.min(100-left,((b-a)/span)*100));
      return {left,width,color:colorById[e.layer_id]||lColors[0]||'var(--c-blue)',len:b-a};
    }).sort((x,y)=>y.len-x.len).slice(0,6);
    return {id:r.slug,slug:r.slug,seed,cat:catId,title:r.title,desc:r.description,
      likes:r.like_count||0,events:(r.events&&r.events[0]&&r.events[0].count)||0,
      lColors,bars,pattern:seed%6,eraFrom:r.start_year,eraTo:r.end_year,
      catName:CAT_META[catId].name,catColor:CAT_META[catId].color,catHex:CAT_META[catId].hex};
  });
}

// like toggle(カードは<a>のため委譲+preventDefault)
document.addEventListener('click',e=>{
  const credit=e.target.closest('.cover-credit button');
  if(credit){e.preventDefault();e.stopPropagation();window.open(credit.dataset.href,'_blank','noopener');return}
  const btn=e.target.closest('.act-btn');
  if(!btn)return;
  e.preventDefault();e.stopPropagation();
  const item=TIMELINES.find(t=>t.id===btn.dataset.id);
  if(!item)return;
  if(likedIds.has(item.id))likedIds.delete(item.id);
  else{
    likedIds.add(item.id);
    btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop');
    btn.addEventListener('animationend',()=>btn.classList.remove('pop'),{once:true});
  }
  persist();
  const on=likedIds.has(item.id);
  btn.classList.toggle('on',on);
  btn.setAttribute('aria-pressed',on);
  btn.querySelector('.act-num').textContent=(item.likes+(on?1:0)).toLocaleString();
});
