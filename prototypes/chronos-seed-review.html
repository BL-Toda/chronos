020-06-01","precision":"month","end_date":null,"type":"point","layer":"音楽と社会","title":"巣ごもり需要で電子ピアノが品薄に","summary":"在宅時間の増加を背景に電子ピアノや初心者向け楽器の販売が伸び、一部メーカーの製品では品薄や納期の遅れが報じられました。オンラインの音楽レッスンも利用が広がりました。\n\n販売増の正確な規模は各社の発表や報道に依りますが、外出できない時期に楽器を始めた人が一定数いたことは複数の調査が示しています。「不要不急」の代表のような趣味が、生活の支えとして見直された時期でした。","detail":null,"credibility":"unverified","credibility_note":"電子ピアノの販売増・品薄の規模は各社発表と報道に基づくもので、業界全体の確定統計としては確認できません。","sources":[{"title":"楽器の販売動向に関する各社報道(2020年)","url":null}]},{"date":"2021-10-21","precision":"day","end_date":null,"type":"point","layer":"音楽と社会","title":"ショパン国際コンクールで反田恭平が2位に","summary":"第18回ショパン国際ピアノコンクールで反田恭平さんが第2位、小林愛実さんが第4位に入賞しました。日本人の第2位は1970年の内田光子さん以来、51年ぶりとされます。\n\nコンクールの模様は公式のネット配信で世界に中継され、わたしも深夜に演奏を追いかけました。練習記録アプリには、この月だけ明け方の再生履歴が残っています。聴くことが、練習のいちばんの燃料になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"第18回ショパン国際ピアノコンクール結果に関する各社報道(2021年10月)","url":null}]},{"date":"2022-10-24","precision":"day","end_date":null,"type":"point","layer":"音楽と社会","title":"最高裁、生徒の演奏への使用料徴収を認めず","summary":"音楽教室での演奏をめぐる訴訟で最高裁は、先生の演奏には著作権使用料が発生する一方、生徒の演奏は徴収の対象にならないという判断を確定させました。5年に及んだ争いの決着です。\n\n「習う人の演奏は誰のためのものか」に司法が答えた形で、教室に通うわたしたちにも静かな安堵が広がりました。2017年の方針表明(同レイヤー)に始まった論点は、練習という行為の位置づけを社会に問い直したと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"最高裁判所第一小法廷判決(2022年10月24日)に関する各社報道","url":null}]},{"date":"2023-08-01","precision":"month","end_date":null,"type":"point","layer":"日々の暮らし","title":"実家のアップライトピアノを引き取る","summary":"実家の建て替えを機に、祖母が母のために買ったという古いアップライトピアノを名古屋の自宅へ運びました。運送と修理、調律を合わせたら、電子ピアノがもう一台買える金額になりました。\n\n調律師さんの「50年物ですが芯は生きています」がうれしくて!防音マットを敷いて、弾くのは昼間だけと決めました。電子ピアノで再開した練習が、7年かけて生のピアノに戻ってきたことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"音楽と社会","title":"国内のピアノ出荷はピーク時の1割前後に","summary":"経済産業省の生産動態統計などによれば、国内のアコースティックピアノの生産・出荷は1980年前後のピークから長期的に減り続け、近年はピーク時の1割前後の水準とされています。\n\n少子化と住宅事情、電子ピアノへの移行が背景です。ただ、電子ピアノや中古市場を含めた「弾く人の数」の推移は別の話で、生産統計だけで文化の衰退を語れるわけではない、と再開組のわたしは思っています。","detail":null,"credibility":"disputed","credibility_note":"「ピーク時の1割前後」は統計の品目区分や比較する年の取り方で数値が変わり、電子ピアノを含めるかどうかでも評価が分かれます。","sources":[{"title":"経済産業省 生産動態統計(楽器)","url":null}]},{"date":"2024-11-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"発表会で幻想即興曲、途中で止まる","summary":"再開から8年、憧れだったショパンの幻想即興曲に挑みました。中間部の手前で頭が真っ白になり、完全に止まりました。数秒の沈黙のあと、少し前から弾き直して最後までたどり着きました。\n\n録音を聴き返すと、止まった数秒のあとの音のほうが、本番中のどこよりも落ち着いていたんです。**止まっても、続きから弾けばいい**。7歳から数えて30年目に、ようやく腑に落ちました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"🎹 練習ノートが10冊目に入る","summary":"再開の日から書き続けている練習ノートが、10冊目に入りました!日付と練習した曲、気づきを3行だけ書く方式で、通算の練習日は2000日を超えています。\n\n読み返すと、上達の記録というより暮らしの記録に近いです。仕事が荒れた月は空白が続き、戻ってくるたびに同じ基礎練からやり直しています。**やめないことではなく、何度でも戻ること**。この記録の結論は、それに尽きます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-parenting","title":"👶 子育ての記録","description":"2016年に生まれた長女と、2022年に生まれた次女。子どもが生まれた日からつけている、我が家の10年の記録です。子どもの成長、親の仕事と暮らし、保育や教育の制度、コロナ禍。重ねてみると、家庭の選択がどれだけ制度に左右されてきたかが見えてきます。","category":"personal-life","language":"ja","start_year":2016,"end_year":2026,"layers":[{"name":"子どもの成長","color":"green"},{"name":"親の仕事と暮らし","color":"gold"},{"name":"社会と制度","color":"blue"}],"events":[{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"「保育園落ちた」ブログが国会で取り上げられる","summary":"2月の中旬に投稿された、認可保育所に入れなかった保護者の方の匿名ブログがSNSで広がって、月末の衆議院予算委員会で取り上げられました。「保活」という言葉が一般に広まって、都市部の待機児童問題が大きな政策課題になった年です。\n\nこの年の秋に長女を迎える私たちには、生まれる前から入園の心配をするのが当たり前という空気が、もうできあがっていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"衆議院: 第190回国会 予算委員会 会議録（平成28年2月29日）","url":null},{"title":"厚生労働省: 保育所等関連状況取りまとめ（平成28年4月1日）","url":null}]},{"date":"2016-11-08","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"第一子、誕生","summary":"予定日より4日遅れて、都内の病院で長女が生まれました!体重3,120グラム。陣痛から18時間、夫は職場から駆けつけて立ち会ってくれました。名前を決めるのには一晩かかりました。\n\n待機児童問題が国会で取り上げられた年です。退院の日に受け取った区の案内には、もう翌々年度の保育所申込みの説明が入っていました。腕の中の赤ん坊の1年半後を考えるのは不思議な感覚でしたが、**それがこの街で子どもを育てるということ**なのでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-11-08","precision":"day","end_date":"2017-10-31","type":"period","layer":"親の仕事と暮らし","title":"母の産休・育休、ほぼ1年","summary":"出産の日から翌年の10月末まで、産後休業と育児休業を取りました。最初は1歳の誕生日で復職するつもりでしたが、認可保育所の一次選考に落ちて、計画を組み替えることになります。\n\n育休中の10月に育児・介護休業法が改正されて、保育所に入れない場合は育休を最長2歳まで延長できるようになりました。でも、家計と職場の事情で延長はせず、認可外の保育園に入れて復職しました。制度の変化と自分の状況が、少しずれて重なった一年です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"育児休業が最長2歳まで延長可能に","summary":"改正育児・介護休業法が施行されて、保育所に入れないなどの場合、それまで1歳6か月までだった育休の延長上限が、待機児童対策の一環として、子どもが2歳になるまでに引き上げられました。会社が育休制度を個別に知らせることも、努力義務になっています。\n\n私はちょうど育休の終盤でこの改正を迎えましたが、延長はせず、認可外への入園を選びました。**制度が整うことと、それを使えるかどうかは別の問題**なのだと、身をもって知りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 育児・介護休業法の改正について（平成29年10月1日施行）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000130583.html"}]},{"date":"2017-11-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"母が時短勤務で復職","summary":"1日6時間の短時間勤務で復職しました。認可外保育園への送りは私、迎えは週2回だけ夫の担当です。職場には理解がありましたが、17時に席を立つとき、まだ会議が続いている部屋を後にする気まずさは、正直なところ残りました。\n\n認可外の保育料は月7万円を超えて、時短で減ったお給料とほぼ相殺。それでも辞めなかったのは、翌年に認可へ移れる可能性を残すためでした。この年の秋、長女が初めてひとりで立ちました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-02-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"認可保育所の二度目の申込みで内定","summary":"前の年は落選、今年は第3希望の園に内定!区から届いた封筒を開けるまで、夫婦そろって仕事が手につきませんでした。認可外に預けて働いた復職実績が選考指数を押し上げたようで、前の年の「落ちたから認可外に入れて働く」という選択が、結果的に効いた形です。\n\nブログが国会で話題になった年に生まれた子が、2年越しで認可の門をくぐります。**制度の順番待ちが、我が家の暦を決めていた**のだと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-04-02","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"認可保育所へ転園","summary":"認可外の小さな園から、園庭のある認可保育所の1歳児クラスへ。人数も部屋の広さも違って最初は戸惑ったのでしょう、慣らし保育の2週間は毎朝泣かれました。それでも3週目には、自分から靴を履くように。園長先生の「泣くのは前の園が好きだった証拠」という言葉には救われました。\n\n転園を境に、私は時短を1時間縮めて7時間勤務に戻し、夫の迎えを週3回に増やしました。家族の時間割が、園の生活リズムに合わせて組み直された春です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"幼児教育・保育の無償化が始まる","summary":"3〜5歳児の認可保育所や幼稚園などの利用料が、原則無償になりました。消費税率10%への引き上げと同じ日の実施で、増収分を財源に、子育て世帯の負担軽減と少子化対策を掲げた制度です。0〜2歳児は住民税非課税世帯だけ、給食費や延長保育料は対象外でした。\n\n長女は2歳児クラスだったので、恩恵は翌年度から。認可外に月7万円を払っていた頃と比べると、制度の谷間にいた時期の記憶が、あらためてよみがえりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 幼児教育・保育の無償化について","url":"https://www8.cao.go.jp/shoushi/shinseido/musyouka/index.html"}]},{"date":"2020-02-27","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"全国の小中高校に一斉休校を要請","summary":"新型コロナの感染拡大を受けて、政府が全国の小中高校に3月2日からの臨時休校を要請しました。あまりに突然のことで、共働きの家庭では、子どもの居場所をどうするかという問題が一気に噴き出しました。\n\n保育所は原則開所とされましたが、4月の緊急事態宣言のあとは、多くの自治体が登園自粛や休園に踏み切ります。我が家も4月から2か月近く、3歳の長女を家で見ながらの在宅勤務になりました。**制度の空白を、家庭が埋める時期**の始まりです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 新型コロナウイルス感染症対策のための小学校、中学校、高等学校及び特別支援学校等における一斉臨時休業について（令和2年2月28日）","url":"https://www.mext.go.jp/content/202002228-mxt_kouhou01-000004520_1.pdf"}]},{"date":"2020-04-11","precision":"day","end_date":"2020-05-31","type":"period","layer":"子どもの成長","title":"休園中、家で過ごした7週間","summary":"緊急事態宣言のもと、区の要請で登園を自粛して、3歳の長女と親ふたりが、ひとつの部屋で在宅勤務と保育を続けた7週間です。午前は夫、午後は私が仕事を止めて子どもを見る交代制にしました。公園は使えず、ベランダで水遊びをして、絵本を何十回も読みました。\n\n長女はこの時期に平仮名を読み始め、私たちは会議の画面に子どもが映り込むことに慣れました。6月に登園が再開したとき、お友達の名前をほとんど忘れていましたが、1週間で取り戻しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-04-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"GIGAスクール構想で小中学生に一人一台端末","summary":"もともと2023年度までの計画だったGIGAスクール構想が、休校の経験から一気に前倒しされて、2020年度末までに全国の大半の自治体で、小中学生向けの端末整備が終わったとされます。\n\n文部科学省の調査では2021年3月末時点で9割超の自治体が整備を終えたそうですが、集計の時点や「整備完了」の定義で、数値は資料ごとに違うようです。長女が2023年に入学した小学校では、1年生から端末を持ち帰る宿題がありました。3年前の休校の記憶と、私の中ではつながっています。","detail":null,"credibility":"unverified","credibility_note":"整備完了率は調査時点（2021年3月末／7月末など）と集計単位により文部科学省資料の中でも数値が異なるため、単一の値として確定していない。","sources":[{"title":"文部科学省: GIGAスクール構想の実現に向けた ICT 環境整備の進捗状況について","url":null}]},{"date":"2022-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"産後パパ育休（出生時育児休業）が施行","summary":"子どもが生まれて8週間以内に最大4週間、2回に分けて取れる出生時育児休業が、改正育児・介護休業法の第2段階として始まりました。男性の育休を後押しするための、通常の育休とは別枠の制度で、申出期限も短く設定されています。\n\n翌2023年4月からは、従業員1,000人超の企業に取得率の公表も義務づけられました。我が家の次女はこの施行の翌月に生まれて、夫はこの新しい制度で4週間の休みを取ることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 育児・介護休業法 改正ポイントのご案内（令和4年4月1日から3段階で施行）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000130583.html"}]},{"date":"2022-11-14","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"第二子、誕生","summary":"長女が5歳の秋に、次女が生まれました。コロナ禍の面会制限はまだ続いていて、立ち会いは夫だけ。長女は退院の日まで妹に会えず、玄関で待っていてくれました。初対面の長女は妹の指を握って、思ったより小さい、と言いました。\n\n前の月に始まった産後パパ育休を夫が取ることが決まっていて、退院の翌日から、家に大人がふたりいる暮らしが始まりました。6年前の長女のときには、なかった選択肢です。👶","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-11-15","precision":"day","end_date":"2022-12-12","type":"period","layer":"親の仕事と暮らし","title":"父の産後パパ育休、4週間","summary":"始まったばかりの出生時育児休業を使って、夫が退院の翌日から4週間を続けて取りました。職場に前例がなく、上司と人事に制度の説明資料を渡すところからだったそうです。育休中は長女の保育園送迎、食事、夜間の授乳の補助を夫が担ってくれて、私は産後の回復に専念できました。\n\n長女のとき、夫が取れたのは有給3日だけでした。この差は夫婦ともに身にしみています。復帰後、同じ部署の後輩の方が翌年に同じ制度を使ったと聞きました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-04-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"こども家庭庁が発足","summary":"内閣府と厚生労働省に分かれていた子ども政策をひとつにまとめる新しい省庁が、こども基本法の施行と同じ日に発足しました。少子化対策や虐待防止、保育行政を担って、保育所も所管に移りました。翌年には、児童手当の拡充などを含む政策パッケージが法制化されます。\n\n我が家では長女の小学校入学と次女の保活準備が重なった年で、区役所の書類に印刷された省庁名が変わっていることに気づいた程度でしたが、翌年の手当の増額は、ここから来ていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"こども家庭庁: こども家庭庁について","url":"https://www.cfa.go.jp/about"}]},{"date":"2023-04-06","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"長女、小学校に入学","summary":"区立小学校に入学しました!ランドセルは祖父母からの贈り物です。入学式は保護者2人まで参加できて、コロナ禍の制限がようやく緩んだことを実感しました。GIGAスクール構想で整備されたタブレットが1年生から配られて、保育園にはなかった宿題として持ち帰るようになりました。\n\n休園中に平仮名を覚えた子が、今度は画面で足し算の練習をしています。学童保育の申込みも同時に済ませましたが、この年、私の働き方を変える必要が出てきます。🎒","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-06-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"「小1の壁」で母が転職","summary":"保育園は19時まで預かってくれたのに、学童は18時で閉まります。時短勤務の対象からも外れて、通勤を入れると、毎日のお迎えが間に合わない計算でした。8年勤めた会社を離れて、週4日在宅の職場へ転職。年収は下がりましたが、夕方の時間を取り戻しました。\n\n翌年10月から児童手当が高校生まで拡充されて、家計の目減りを少しだけ埋めてくれます。**制度は追いついてきているけれど、まだ半歩遅れている**。それが正直な実感です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-10-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"児童手当の拡充（所得制限撤廃・高校生まで）","summary":"2024年10月分から児童手当の所得制限がなくなって、支給対象が高校生年代まで延び、第3子以降は月3万円に増えました。こども家庭庁が主導した「こども未来戦略」に基づく改正で、支払いも年3回から隔月に変わっています。\n\n我が家は長女と次女の2人分。前の年の転職で私の収入が下がったあとに届きました。制度の拡充と家計の変化が続けて起きたのは偶然ですが、記録に残すと、あとから因果のように見えてしまいます。それも年表の面白さかもしれません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"こども家庭庁: 児童手当制度のご案内（令和6年10月分からの制度改正）","url":"https://www.cfa.go.jp/policies/kokoseido/jidouteate/annai"}]},{"date":"2025-04-01","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"次女、保育所に入園","summary":"次女が、姉と同じ園の2歳児クラスに入園しました。長女のときは2年かかった認可入園が、次女は一度で決まって、慣らし保育は3日で終わりました!地域の子どもの数が減って、園によっては定員に空きが出始めていると、園長先生から聞きました。姉のときとは、何もかもが早いのです。\n\n同じ4月から改正育児・介護休業法が施行されて、3歳未満の子を持つ親のテレワークが、事業主の努力義務になりました。転職した私の在宅勤務は、制度に先回りしていた形です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"「こども誰でも通園制度」が全国で本格実施","summary":"親が働いているかどうかを問わず、生後6か月から3歳未満の子を、月に一定時間まで保育所などに預けられる制度が、全国で実施される予定です。2023年から一部の自治体で試行的事業が始まり、2025年度に法律上の給付制度になって、2026年度から全自治体での実施が予定されています。\n\nすでに認可に通っている次女は、直接の対象ではありません。それでも、10年前に「保育園落ちた」が国会で語られたことを思うと、預ける理由を問わない制度が全国に広がる予定というだけで、**時代の距離**を感じます。","detail":null,"credibility":"unverified","credibility_note":"2026年度からの全国実施は制度設計上の予定であり、自治体ごとの実施時期や利用可能時間の運用は本記録作成時点で確定していない。","sources":[{"title":"こども家庭庁: こども誰でも通園制度について","url":"https://www.cfa.go.jp/policies/kokoseido/daredemo-tsuen"}]}]},{"slug":"personal-reading-log","title":"読書遍歴 1990–2026","description":"1990年、10歳のときから続けている読書の記録です。読んだ本と転機、人生の出来事、出版と社会の変化を重ねて、一冊の本がどんな年に自分の手元へ届いたのかをたどります。読まなかった時期も、記録のうちだと思っています。","category":"personal-life","language":"ja","start_year":1990,"end_year":2026,"layers":[{"name":"読んだ本と転機","color":"purple"},{"name":"人生の出来事","color":"gold"},{"name":"出版と社会","color":"blue"}],"events":[{"date":"1990-07-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"小学校の図書室で『モモ』に出会う","summary":"10歳の夏休み前、図書室の先生に薦められて借りたのが、ミヒャエル・エンデの長編でした。返却期限を2度延長して読み終えた、最初の「自分の本」です。時間泥棒の話を、当時はただの冒険物語として読んでいました。貸出カードに何度も自分の名前を書いた年です。\n\n読み返すたびに違う本になることを知るのはずっと後のことで、それがこの記録を始めた動機のひとつでもあります。1990年代の初め、街の書店はまだ増えていて、本は身近な場所に、いくらでもありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"出版物の推定販売金額がピークに","summary":"書籍と雑誌を合わせた紙の出版物の推定販売金額が約2兆6,500億円に達して、これ以降は長い減少局面に入ります。雑誌が売上の6割近くを占め、コンビニと駅の書店が日常の本の入口だった時代の頂点で、以後は雑誌の落ち込みを中心に市場が縮み続けました。\n\nこの年、16歳の私は、高校の帰り道にある書店で『ソフィーの世界』を手に取っています。**本がいちばん売れていた年に、自分の読書が本格的に始まっていた**ことを、ずっとあとから統計で知りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"出版科学研究所: 出版指標年報（出版物推定販売金額の推移）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"1996-05-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"高校1年、『ソフィーの世界』で哲学に触れる","summary":"ヨースタイン・ゴルデルによる、小説仕立ての哲学史です。日本語版は1995年に出て、ベストセラーになっていました。読み終えても哲学者の名前は覚えられませんでしたが、なぜ、と口に出すことに引け目を感じなくなりました。哲学の入門書というより、「問いを持ってよい」と教わった本として残っています。\n\n紙の出版物がもっとも売れた年に、通学路の書店の新刊台から取った一冊でした。その書店が2023年に閉店することを、当時の私はもちろん知りません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1998-04-01","precision":"day","end_date":"1999-03-31","type":"period","layer":"人生の出来事","title":"浪人の1年","summary":"大学受験に失敗して、予備校に通った1年です。読んだのは参考書だけ、と当時は思っていましたが、鞄の底にはいつも『銀河鉄道の夜』の文庫がありました。読み進めるというより、開いて閉じるための本です。\n\n駅前の書店では相変わらず雑誌の棚がいちばん広く、新刊の話題は、当時の私には遠いものでした。翌春に地方の大学へ合格して、この一年は結果的に、読書と自分の距離を測り直す時間になったのだと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2002-04-01","precision":"day","end_date":null,"type":"point","layer":"人生の出来事","title":"就職と上京","summary":"地方の大学を卒業して、東京の中堅出版取次の会社に就職しました。本に近い仕事を選んだつもりが、配属は物流部門。毎朝、雑誌の束が全国へ出ていくのを倉庫で見ていました。\n\n1996年をピークに市場が縮んでいることは社内の誰もが知っていて、それでも量は圧倒的でした。読む本を選ぶ時間はなくなり、代わりに「売れる本」の情報だけが増えていきます。この頃、Amazon.co.jpはすでに営業を始めていて、書店に行かずに本を買う人が、少しずつ現れていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2003-10-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『博士の愛した数式』を通勤電車で読む","summary":"小川洋子さんの2003年8月刊行の小説を、働き始めて2年目の通勤電車で読みました。80分しか記憶がもたない数学者と家政婦の物語です。取次の倉庫で数字として扱っていた本のひとつが、開いてみれば、静かで確かな世界でした。\n\n本を数として扱う日々のなかで、久しぶりに一冊を最後まで読んで、本を「作品」として取り戻した気がします。翌2004年に第1回本屋大賞を受けることになるのですが、その知らせを職場で聞いたとき、少しだけ自分の手柄のような気がしました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2004-04-05","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"第1回本屋大賞が発表される","summary":"書店員が選ぶ文学賞として本屋大賞が創設されて、第1回の大賞に『博士の愛した数式』が選ばれました。出版不況と書店の減少が意識され始めた時期に、「売り場からベストセラーをつくる」ことを掲げて始まった賞です。\n\n以後、受賞作が映像化と大きな売上につながる例が続いて、書店員の推薦が読者の選択に影響する構図が定着していきます。取次で働いていた私にとって、前の年に通勤電車で読んだ本が最初の受賞作になったことは、小さな符合として記憶に残っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"本屋大賞 公式サイト: 過去の本屋大賞（2004年）","url":"https://www.hontai.or.jp/history/"}]},{"date":"2012-10-25","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"Kindleストアが日本で開始","summary":"Amazonが日本語の電子書籍ストアを開きました。2010年のiPad発売を機に「電子書籍元年」という言葉が広まりましたが、日本語のコンテンツと端末の両方が揃うのは2年遅れのこの年からで、以後は電子コミックを中心に、電子出版の市場が年々広がっていきます。\n\n取次を辞めて出版社の編集に移っていた私は、この年、電子版の契約書を初めて読みました。紙の本の物流を見てきた身には、倉庫のない本というものが、不思議でなりませんでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon.co.jp: プレスリリース Kindleストア開設（2012年10月25日）","url":null}]},{"date":"2012-11-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"初めて電子書籍を買う","summary":"Kindleストアの開設からひと月後、通勤中に読むために、既読の文庫を電子で買い直しました。最初の一冊は、紙で3冊持っている『モモ』。読み比べたかったのだと思います。文字の大きさを変えられることに驚いて、ページの厚みで残りを測れないことに戸惑いました。\n\n以後、移動中は電子、家では紙、という使い分けが定着します。同じ月に第一子が生まれて、片手で読める電子書籍は、**思いがけず育児の道具になった**のでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-11-18","precision":"day","end_date":null,"type":"point","layer":"人生の出来事","title":"第一子が生まれる","summary":"32歳で第一子が生まれました。出版社の編集の仕事は続けましたが、読書の中身が変わります。夜中の授乳の合間に電子書籍を片手で読む習慣がつき、自分のための本より子どもに読む本を選ぶ時間が増えて、『ぐりとぐら』や『はらぺこあおむし』を何百回と読みました。読む本の半分が、絵本になった時期です。\n\nKindleストアが開いたばかりの月に生まれた子で、片手で持てる端末がなければ、この時期の読書はほとんど途絶えていたと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-10-01","precision":"day","end_date":"2018-06-30","type":"period","layer":"人生の出来事","title":"父の介護と、本を読めなかった1年9か月","summary":"地方の実家に月2回通って、父の入退院に付き添った1年9か月です。編集の仕事は続けましたが、新幹線の往復と病院の待合室では、本を開いても頭に入りませんでした。読書の記録がほとんど空白になった唯一の時期で、読めない時期にも本は側にあった、という以上のことは書けません。\n\n父を見送った2018年6月から、少しずつ読書が戻ってきます。この空白は、あとから見ると、年表の中でいちばん雄弁な部分になりました。**読まなかったことにも記録の価値がある**と、いまは思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-12-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『82年生まれ、キム・ジヨン』を読む","summary":"介護が終わった年の暮れ、チョ・ナムジュの小説の日本語版が筑摩書房から出たばかりのところを、一晩で読みました。翌年にかけて韓国文学が広く読まれるきっかけのひとつになった一冊です。自分と2歳違いの主人公が通ってきた道は、国は違っても、地続きに見えました。\n\n空白の1年9か月のあと、最初に最後まで読んだ本です。読書が「戻ってきた」と感じた一冊として、この年表では区切りの位置に置いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"紙と電子を合わせた出版市場が前年比プラスに","summary":"出版科学研究所の推計で、2019年は紙の販売額が前年割れとなる一方、電子出版が2割超の伸びでそれを上回って、紙と電子の合計では小幅ながら前年を上回りました。\n\n報道では「1996年以来」「合算統計で初」といった表現が使われましたが、紙と電子を合算した統計自体は2014年からで、比較の基準は資料によって異なります。編集の現場でも、電子の売上を前提に企画を立てることが、当たり前になった年でした。","detail":null,"credibility":"disputed","credibility_note":"「前年比プラス」自体は出版科学研究所の推計に基づくが、「何年ぶり」「初」といった位置づけは統計の集計範囲（紙+電子の合算開始年）によって異なる。","sources":[{"title":"出版科学研究所: 2019年の出版市場（紙+電子）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"2020-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"巣ごもりで電子出版市場が3割近く伸びる","summary":"コロナ禍で在宅の時間が増えて、電子コミックを中心に電子出版が急伸しました。出版科学研究所の推計で市場は約3,900億円、前年比およそ28%増です。書店の休業や外出自粛で紙の販売にも波がありましたが、児童書や学習参考書は伸びました。\n\nこの年、私は在宅勤務の合間に、カミュの『ペスト』を読み返しています。本を読む場所と方法が、この年を境に、もう一段変わった気がします。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"出版科学研究所: 2020年の出版市場（紙+電子）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"2020-05-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『ペスト』を再読する","summary":"緊急事態宣言のもと、アルベール・カミュの1947年の小説を、20年ぶりに読み返しました。この年、世界的に再び読まれて、日本でも文庫が増刷されています。閉ざされた街の中で人が何を続け、何を諦めるかという描写が外の空気とそのまま重なって、若い頃は寓話として読んだ小説が、記録として読めました。\n\n同じ年に電子出版が急伸して、私の本棚も、電子の比率が初めて半分を超えました。**読む本と読み方の両方が、社会の状況に押されて動いた年**です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-03-01","precision":"month","end_date":null,"type":"point","layer":"人生の出来事","title":"地元の書店が閉店する","summary":"高校時代に通い、『ソフィーの世界』を買った駅前の書店が閉店しました。2階建てで、雑誌と参考書と文庫が中心の店です。最終日に帰省して、最後の一冊に『モモ』の新版を買いました。店主からは、雑誌が売れなくなってからは厳しかった、と聞きました。\n\n翌年には国が書店振興の検討を始めるのですが、間に合わない店のほうが多いのです。**本を買う場所がなくなることと、本を読まなくなることは同じではない**。そう自分に言い聞かせながら、それでも寂しい帰り道でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-05","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"経済産業省が書店振興プロジェクトチームを設置","summary":"全国で書店が減り続ける状況を受けて、経産省が大臣直属のプロジェクトチームを設置しました。書店を「文化創造基盤」と位置づけて、キャッシュレス手数料や取引慣行、図書館との連携などを論点に検討が進められます。書店のない自治体が全国の4分の1を超えるという民間調査も、同じ時期に報じられました。\n\n前の年に地元の書店を失った私には、遅すぎるとも、ようやくとも思える動きでした。読書会を始める直接のきっかけの、ひとつでもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省: 書店振興プロジェクトチームの設置について（2024年3月5日）","url":"https://www.meti.go.jp/press/2023/03/20240305001/20240305001.html"}]},{"date":"2024-08-01","precision":"month","end_date":null,"type":"point","layer":"出版と社会","title":"書店のない自治体が全国の約3割との調査","summary":"出版文化産業振興財団の調査で、書店が1店もない市区町村が全国に約480、およそ27%にのぼるとされました。都道府県によっては、半数近くに達するそうです。\n\nただ、「書店」の定義(新刊書店だけか、古書店やコンビニの書籍売場を含むか)や調査の時点で数値は変わって、別の調査では異なる割合も示されています。地元の店を失った私は、この統計の1に自分の町が入っていることを、数字として初めて確認しました。","detail":null,"credibility":"unverified","credibility_note":"無書店自治体の割合は「書店」の定義と調査時点により調査ごとに差があり、約27%という値は特定の民間調査に基づく暫定的な数値。","sources":[{"title":"出版文化産業振興財団（JPIC）: 書店のない自治体に関する調査（2024年）","url":null}]},{"date":"2025-06-01","precision":"month","end_date":null,"type":"point","layer":"人生の出来事","title":"月に一度の読書会を始める","summary":"近所の公民館を借りて、6人で読書会を始めました。課題本は毎回参加者の持ち回りで、最初の一冊は『モモ』です。書店がなくなった町でも、本の話をする場所は作れると思いました。\n\n参加者は20代から70代まで。紙で読む人も電子で読む人もいて、同じ本の違う版を並べて話すのが恒例になっています。35年前に図書室で借りた本を、今度は自分が薦める側になりました。この年表は、初回の自己紹介の代わりに配ったものが元になっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"子どもが『モモ』を図書室で借りてくる","summary":"13歳になった子どもが、薦めたわけでもないのに、私が10歳で読んだのと同じ本を、学校の図書室から借りてきました。36年ぶりに同じ本を、別々に読んでいます。感想は聞かないことにしました。読み返すたびに違う本になるのなら、最初の一回は本人だけのものだと思うからです。\n\nこの年表はここでいったん止まりますが、続きは子どもの年表になるのかもしれません。本の売れ方も読み方も変わり続けたこの36年で、**変わらなかったのは、図書室に本があったこと**でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-travel-album","title":"旅行アルバム年表","description":"1980年、25歳で行った香港が最初の海外でした。古希を前にした台湾まで、50冊のアルバムに残した旅の記録を、家族の節目や円高、LCC、感染症といった時代の出来事と重ねて、1本の年表にまとめてみたものです。","category":"personal-life","language":"ja","start_year":1978,"end_year":2025,"layers":[{"name":"旅の記録","color":"blue"},{"name":"暮らしと家族","color":"gold"},{"name":"旅と時代","color":"teal"}],"events":[{"date":"1978-05-20","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"成田空港が開港","summary":"長い反対闘争の混乱を経て、新東京国際空港(成田空港)が開港しました。羽田発着の国際線の大半が移り、日本の海外への玄関口が成田になった年です。\n\n開港のニュースは、22歳だった私も勤め先の寮のテレビで見ました。海外はまだ遠い場所でしたが、玄関ができたことだけは分かったのです。2年後、この空港から初めて出国することになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"成田国際空港株式会社: 成田空港の歴史","url":null}]},{"date":"1979-01-01","precision":"year","end_date":null,"type":"point","layer":"旅と時代","title":"『地球の歩き方』創刊","summary":"個人旅行者向けのガイドブック『地球の歩き方』の最初の2冊(ヨーロッパ編、アメリカ編)が出ました。団体パッケージツアーが主流だった頃に、自分で調べて旅する読者を思い描いた、新しい本だったのです。\n\n私が手にしたのは数年後のことですが、**旅は自分で組み立てられる**という考え方は、この本に教わりました。書き込みだらけの1冊は、今もアルバムと同じ棚にあります。","detail":null,"credibility":"disputed","credibility_note":"創刊は1979年とされていますが、刊行月や初版の詳しいところは、資料によって書き方が揺れているようです。","sources":[{"title":"地球の歩き方: 『地球の歩き方』の歩み","url":null}]},{"date":"1980-06-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"初めてのパスポートで香港へ","summary":"25歳、会社の同期3人との3泊4日の香港旅行でした。初めてのパスポートは5年用で、出国審査では手が震えたのを覚えています。九龍の夜市の匂いと、ビクトリアピークから見た夜景は今も忘れません。\n\n帰国後に現像した36枚撮り4本が、アルバムの1冊目になりました。海外旅行がまだ月給数か月分の買い物だった時代です。この1冊目だけ、写真の貼り方が不器用なままになっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1985-09-22","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"プラザ合意、円高が旅の値段を変える","summary":"先進5か国がドル高是正で合意し、1ドル240円前後だった円相場は、1年ほどで150円台まで急伸しました。海外旅行の実質的な値段が下がり、庶民の休暇の選択肢に入っていった転機です。\n\n私の新婚旅行が国内ではなくハワイになったのは、この円高の影響が大きかったのです。為替の数字がわが家のアルバムの行き先を決めた、最初にして最大の例だと思っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本銀行: 外国為替相場状況(時系列統計データ)","url":null}]},{"date":"1986-05-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"新婚旅行でハワイ、5泊7日","summary":"結婚式の翌々日からハワイへ発ちました。当時の定番だったワイキキのホテルに泊まり、レンタカーでノースショアまで走りました。妻が水平線を撮った1枚は、今も居間に飾ってあります。\n\n円高元年の新婚旅行は同世代に多く、帰りの成田では同じような土産袋が並んだものです。アルバムは2冊目、表紙に初めてふたりの名前を書きました。土産のマカダミアナッツは、以後のわが家の定番です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1987-01-01","precision":"year","end_date":null,"type":"point","layer":"旅と時代","title":"テンミリオン計画、海外旅行が国策になる","summary":"運輸省が、海外旅行者を5年間で倍の年間1000万人にする「海外旅行倍増計画(テンミリオン計画)」を打ち出しました。貿易黒字への国際的な批判をかわす狙いもあり、休暇を海外で使うことが政策として勧められたのです。\n\n旅行会社の店頭にパンフレットがあふれ始めたのは、この頃だったと記憶しています。数年後のわが家の旅の選択肢が広がる、その下地になりました。","detail":null,"credibility":"unverified","credibility_note":"計画の存在と1987年の策定は広く言われていますが、目標値や決め方の詳しいところまでは、一次資料で確かめられていません。","sources":[{"title":"運輸省「海外旅行倍増計画(テンミリオン計画)」(1987)","url":null}]},{"date":"1989-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"長女誕生","summary":"33歳で父になりました。平成が始まった春のことで、産院の帰り道に桜が咲いていたのを覚えています。しばらく旅行どころではなくなり、アルバムは旅のものから家族のものへ変わっていきました。カメラも旅行用から普段使いになりました。\n\nこの年表を作って気づいたのは、旅の空白期がそのまま子育ての密度だったということです。次に海外へ出るのは、7年後のことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1990-01-01","precision":"year","end_date":null,"type":"point","layer":"旅と時代","title":"海外旅行者数、初の1000万人超え","summary":"日本人の年間出国者数が約1100万人となり、初めて1000万人を超えました。テンミリオン計画の目標は前倒しで達成され、円高とバブル景気を追い風に、海外旅行の大衆化が定まった年といわれます。\n\n同じ年、わが家では1歳の長女を連れての旅は近場の温泉が精一杯でした。**時代の追い風と家の事情は別々に吹く**ものだということも、年表にすると見えてくるのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"法務省: 出入国管理統計(1990年)","url":null}]},{"date":"1992-02-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"長男誕生","summary":"4人家族になりました。社宅から郊外の賃貸に移り、ミニバンを買い、休日は近所の公園と実家への帰省が定番になりました。長女は弟のベビーカーを押したがったものです。\n\nアルバムは、この時期がいちばん厚いのです。旅は遠出だけではないと今なら言えますが、当時は手帳の隅に「いつかグアム」と書いていました。その小さな走り書きが、4年後に実現することになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1996-08-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"家族4人で初の海外、グアム","summary":"長女7歳、長男4歳を連れての3泊4日のグアムでした。子連れの飛行機は3時間半が限界だろう、という判断です。プールと海だけで子どもたちには十分で、観光らしい観光はほとんどしていません。\n\n格安パッケージが普及して、家族4人の海外が現実的な値段になっていた時期でした。帰国便で長男が描いた飛行機の絵は、アルバム10冊目の表紙に貼ってあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2001-09-11","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"米同時多発テロ、旅の風景が変わる","summary":"米国で同時多発テロが起き、世界の航空需要が急減しました。日本人出国者数も大きく落ち込み、空港の保安検査はこの後、時間をかけて厳しくなっていきます。\n\n翌年に考えていた家族でのハワイ再訪は取りやめました。液体物の持ち込み制限や靴を脱ぐ検査など、**旅の手続きが警戒の形をとる時代**がここから始まったのだと、後の旅のたびに実感したものです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国土交通省: 観光白書(平成14年版)","url":null}]},{"date":"2004-08-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"子どもたちとの最後の家族旅行、沖縄","summary":"長女15歳、長男12歳。美ら海水族館と離島の海をめぐった4日間が、結果的に4人そろっての最後の旅行になりました。以後は部活と受験で、4人の予定が合わなくなったのです。\n\n最後と分かって撮った写真は1枚もありません。家族旅行の終わりは事件ではなく、予定表の空白として静かに来るものでした。アルバムのこの巻だけ、妻の字のキャプションが多いのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2011-06-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"結婚25年、迷った末のイタリア10日間","summary":"銀婚式の記念に計画していたイタリア旅行でした。震災後の自粛の空気の中で行くかどうか夫婦で悩み、予定どおり出発しました。フィレンツェの朝市で買ったオリーブオイルの味は、今もわが家の基準です。\n\n旅行業界全体が自粛の影響を受けた年で、「行くことも支えになる」という添乗員さんの言葉が忘れられません。56歳、体力のあるうちの長旅という判断でもありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-03-01","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"Peach就航、日本のLCC元年","summary":"関西空港を拠点とするPeach Aviationが初就航し、この年はジェットスター・ジャパンなども続いて「LCC元年」と呼ばれました。数千円の航空券が、旅の頻度という考え方を変えていきます。\n\n定年を控えた私には、リタイア後の旅の設計図が変わる出来事でした。安く何度も行く旅と、貯めて長く行く旅。ようやく両方を選べる時代になったのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Peach Aviation: 就航開始について(2012年3月)","url":null}]},{"date":"2016-03-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"60歳で定年、アルバムの整理を始める","summary":"60歳で定年退職しました。最初にやったのは、40年近い年月分のアルバム45冊を年代順に並べ直すことでした。旅の写真の背景には、家と家族と自分の変化が全部写り込んでいたのです。\n\n整理の途中で、行き先と年号の一覧表を作り始めました。それがこの年表の原型です。並べ直して、ようやく分かったことがあります。**アルバムは旅の記録で、旅は人生の索引だった**のです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-05-01","precision":"month","end_date":"2018-05-30","type":"period","layer":"旅の記録","title":"夫婦で欧州鉄道の旅、30日間","summary":"鉄道パスを使い、リスボンからウィーンまで1か月かけて移動しました。62歳、宿を3日先まで決めない旅は初めてのことです。荷物は夫婦で機内持ち込み2個まで削りました。\n\n若い頃に『地球の歩き方』で憧れた旅を、退職後にようやく実行した形です。旅先で日本の若いバックパッカーに安宿を教わる側になっていたのが、少し可笑しかったのを覚えています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-08-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"初孫誕生","summary":"長女に子が生まれ、64歳で祖父になりました。孫の写真が増えるにつれ、長男からアルバムのデジタル化を勧められ、スキャナーを買いました。取り込みながら、紙のアルバムも残すと決めたのです。\n\n紙をめくる孫の代のことを、想像したからです。旅の計画には「孫と行ける場所」という条件が加わりました。次の旅の同行者が、またひとり増えたわけです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":"2023-04-30","type":"period","layer":"旅と時代","title":"海外旅行が消えた3年間","summary":"新型コロナウイルスの水際対策で国際的な人の往来が止まり、日本人出国者数は2019年の約2000万人から2021年には約51万人まで落ち込みました。海外旅行そのものが、3年間ほぼ消えたのです。\n\n私のパスポートは、棚の中で期限を迎えました。旅ができない間にアルバムの整理とこの年表づくりが進んだのですから、**空白もまた記録の一部**なのだと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本政府観光局(JNTO): 日本人出国者数統計","url":null}]},{"date":"2023-10-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"3年半ぶりの海外、台湾で孫と","summary":"水際措置の終わりを待って、68歳で3世代の台湾旅行に出ました。新しいパスポートを10年用にするか5年用にするか、人生で初めて迷ったものです。九份の坂道を、4歳の孫と手をつないで登りました。\n\n44年前の香港で始まった旅の記録に、孫の代が加わった巻です。夜市の匂いは、あの頃と同じでした。孫が屋台で選んだ提灯の写真が、この巻の最初のページになっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-05-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"50冊目のアルバムと、この年表","summary":"古希を前に、アルバムがちょうど50冊になりました。最初の香港から45年、行き先を並べてみると、為替とテロと感染症と、時代の出来事がそのまま旅程の余白に写っていたのです。\n\n年表の最後の行は空けてあります。次の旅で埋めるつもりだからです。子どもたちには、それぞれの家のアルバムがもう始まっています。旅の記録は私のものですが、続きは誰かに引き継がれていくのでしょう。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-two-of-us","title":"🌸 ふたりの10年間","description":"2014年に東京で出会ってから、わたしとKの暮らしを年表にしています。ふたりの出来事と仕事や暮らしの変化に、同じ年の社会の出来事を重ねて、小さな選択が時代の空気とどう響き合っていたのかを、ときどき振り返るための記録です。","category":"personal-life","language":"ja","start_year":2014,"end_year":2024,"layers":[{"name":"ふたりの出来事","color":"pink"},{"name":"仕事と暮らし","color":"gold"},{"name":"時代の空気","color":"teal"}],"events":[{"date":"2014-04-01","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"消費税率が5%から8%へ","summary":"17年ぶり、1997年以来の消費税率の引き上げでした。社会保障の財源のためとされて、駆け込み需要のあと、春の消費は一時的に冷え込んだそうです。日用品の値札が一斉に書き換わって、街には「増税前セール」の名残がありました。\n\nこの年の5月、わたしたちは友人の写真展で初めて言葉を交わします。最初の会話は、缶コーヒーが少し高くなったねという、他愛のない話でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"財務省: 消費税率の引上げについて（平成26年4月）","url":"https://www.mof.go.jp/tax_policy/summary/consumption/consumption_tax/index.html"}]},{"date":"2014-05-17","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"友人の写真展で出会う","summary":"神保町の小さなギャラリーで開かれた、共通の友人の個展の最終日でした。会社帰りに閉場間際に滑り込んだわたしと、受付で片付けを始めていたK。缶コーヒーの値段が上がった話から始まって、気づけば搬出まで手伝っていました。\n\n連絡先を交換したのはその晩ではなくて、友人を介した打ち上げの席でした。**消費税が8%になった春の、なんでもない土曜日**の出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-03-21","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"付き合い始める","summary":"出会いから10か月。写真展のあとも月に一度は顔を合わせていたのに、関係に名前をつけるまでずいぶんかかりました。三連休の初日、井の頭公園のまだ蕾の桜並木を歩きながら、次の春も一緒に見に来ようという話になったのです。\n\n特別な告白の言葉はありませんでした。帰り道にKが「じゃあ、そういうことで」と言ったのが始まりだと、当時の手帳に書いてあります。🌸","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-04-14","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"熊本地震が発生","summary":"4月14日と16日に最大震度7を2度観測して、前震と本震という言葉を初めて知った地震でした。関連死を含めて270人以上が亡くなり、住宅の被害は20万棟近くに及んだそうです。\n\n東日本大震災から5年。東京でも防災意識があらためて高まって、非常食や簡易トイレを買い足す人が増え、備蓄品が品薄になっていました。この年の秋に同棲を始めたとき、わたしたちが最初に揃えた共有の持ち物も、防災リュックでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成28年（2016年）熊本地震","url":"https://www.data.jma.go.jp/eqev/data/2016_04_14_kumamoto/index.html"},{"title":"内閣府防災: 平成28年熊本地震に係る被害状況等について","url":null}]},{"date":"2016-11-01","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"三軒茶屋の1LDKで同棲を始める","summary":"ふたつの部屋を引き払って、三軒茶屋の築30年の1LDKへ。それぞれの更新時期が近かったことが背中を押しました。家賃は折半、食器は実家からのお下がりです。引っ越し当日は本の段ボールが多すぎて業者さんに呆れられ、夜は床に座ってお弁当を食べました。\n\n春の熊本地震のあとだったので、**最初に買い足した共有物は防災リュックと水**でした。玄関に置いたあの赤いリュックは、その後の引っ越しにもずっとついてくることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"わたしの残業が月80時間を超える","summary":"新規の案件が重なって、終電帰りが続いた月でした。深夜のタクシー代が出る代わりに、休日出勤が当たり前になっていて。6月末に微熱が引かず、Kに促されて病院に行き、初めて仕事のペースについて真剣に話し合いました。\n\n翌年に働き方改革関連法が成立して残業時間に上限ができるのですが、このときはまだ「忙しいのは良いこと」という空気が職場に残っていました。この経験が、のちのフリーランス転向の遠い伏線になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-04-01","precision":"day","end_date":"2019-03-31","type":"period","layer":"ふたりの出来事","title":"Kの大阪赴任による遠距離の1年","summary":"Kが大阪支社の立ち上げに参加して、月に一度どちらかが新幹線に乗る12か月でした。赴任は1年限定と決まっていたのに、始まる前はとても長く感じたものです。毎晩ビデオ通話をつないで、お互いの夕食を画面越しに見せ合うのが習慣になりました。\n\n同じ年に働き方改革関連法が成立して、Kの会社でも有給を取りやすくなったおかげで、月に一度の往復は最後まで途切れませんでした。三軒茶屋の防災リュックの点検は、この年はわたしひとりの仕事でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-06-29","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"働き方改革関連法が成立","summary":"時間外労働の罰則付き上限規制や、有給休暇の取得義務化を含む法律が成立しました。長時間労働の是正が柱で、大企業では2019年4月から残業の上限規制が始まります。背景には過労死の社会問題化と、労働力人口の減少があるそうです。\n\n前の年に残業で体調を崩したわたしには、**少し遅れて届いた追い風**でした。遠距離中のKが月に一度の帰京を続けられたのも、有給を取りやすくなった職場の空気の変化と、無関係ではなかったと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 「働き方改革」の実現に向けて","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000148322.html"}]},{"date":"2019-05-01","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"元号が令和に改まる","summary":"平成から令和へ、1989年以来30年ぶりの改元でした。憲政史上初の退位による代替わりで、新しい元号が事前に発表されるという珍しい経過をたどりました。10連休のなか、街のカウントダウンや記帳の列がニュースになっていたのを覚えています。\n\nわたしたちはこの年の秋に入籍するのですが、婚姻届の元号欄をどちらで書こうか、という小さな会話をした記憶があります。時代の区切りが自分たちの書類の書式にまで及ぶことを、静かに実感した年でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 新元号「令和」について（平成31年4月1日）","url":"https://www.kantei.go.jp/jp/98_abe/statement/2019/0401singengou.html"}]},{"date":"2019-11-03","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"入籍","summary":"遠距離が明けて半年、文化の日の朝に、区役所の休日窓口へ婚姻届を出しました。証人はあの写真展の主催者だった友人にお願いして、式は挙げませんでした。夜は三軒茶屋の行きつけの定食屋で、いつも通りの夕食です。\n\n改元の年の秋、日付欄に「令和元年」と書きました。平成生まれのふたりが**初めて新しい元号を自分の手で書いた日**です。式の代わりに翌年の春に小さな旅行を計画していたのですが、それは叶いませんでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"時代の空気","title":"都内企業のテレワーク導入率が6割超に","summary":"東京都の調査で、従業員30人以上の都内企業のテレワーク導入率が、4月に6割を超えたそうです。3月の時点では2割ほどだった数字が、緊急事態宣言を挟んで急に上がりました。\n\nただ、調査の対象や時期、「導入」の定義によって数値は大きく違うようで、中小企業や現場のお仕事では実施率が低かったという調査もあります。わたしたちの在宅勤務も、Kの会社が制作業でわたしが企画職だったからこそでした。数字の後ろには、在宅にできなかった人たちの仕事があります。","detail":null,"credibility":"unverified","credibility_note":"調査主体・対象企業規模・調査時期によりテレワーク実施率の数値は大きく異なり、単一の値として確定しにくい。","sources":[{"title":"東京都: テレワーク導入率調査結果（2020年4月）","url":null}]},{"date":"2020-04-07","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"新型コロナで初の緊急事態宣言","summary":"東京など7都府県に、改正特措法に基づく初めての緊急事態宣言が出ました。16日には全国に広がって、飲食店の時短、学校の休校、通勤の消失。外出自粛と在宅勤務が一気に広がりました。3月24日には、東京五輪の延期も決まっていました。\n\nわたしたちの部屋も翌日から在宅勤務の場になり、6畳の居間にふたつの机が並びます。前の年に計画した旅行は取りやめになったけれど、この宣言下の2か月が、**ふたりにとっていちばん長く一緒に過ごした時間**になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣官房: 新型コロナウイルス感染症緊急事態宣言（令和2年4月7日）","url":"https://corona.go.jp/news/pdf/kinkyujitai_sengen_0407.pdf"}]},{"date":"2020-04-08","precision":"day","end_date":"2020-05-25","type":"period","layer":"仕事と暮らし","title":"6畳の居間でふたり在宅勤務","summary":"宣言の翌日から解除の日まで、ひとつの部屋にふたつの机。Kはリビングのテーブル、わたしは寝室の窓際に折りたたみ机を置いて、オンライン会議の時間を朝に共有して、声が重ならないようにしていました。買い物は週2回にまとめて、防災リュックの中身が初めて役に立ちました。\n\n宣言が解除されて出社が戻ったあとも、Kの会社は週3日の在宅を続けました。働く場所と暮らす場所の境目は、このときから曖昧なままです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-10-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"わたしがフリーランスに","summary":"8年勤めた会社を辞めて、企画・編集の仕事を個人で受け始めました。最初の取引先は、元の勤め先です。在宅勤務の1年半で、会社に行かなくても仕事が回ることを、知ってしまったのでした。\n\n2017年に体調を崩した経験と、遠距離の間に身についた、自分で時間を組み立てる習慣が決断の土台でした。収入は不安定になったけれど、朝の時間が自分のものになりました。Kは反対も賛成もせず、開業届を出した日に、少し良いお米を買ってきてくれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"物価上昇で家計簿を始める","summary":"食用油や小麦製品の値上げが続いて、初めて共有の家計簿アプリを入れました。2月のロシアによるウクライナ侵攻のあと、エネルギーと食料の値段が上がり続けて、この年の秋には円相場が一時1ドル150円台をつけました。\n\nフリーランスになって収入の波が大きくなったこともあって、ふたりの支出を見えるようにする必要が出てきたのです。続けてみて分かったのは、いちばん減らせないのが本代とコーヒー代だということでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-01-01","precision":"year","end_date":null,"type":"point","layer":"時代の空気","title":"東京23区の新築マンション平均価格が1億円超","summary":"民間の調査で、2023年の東京23区の新築分譲マンションの平均価格が、初めて1億円を上回ったそうです。建築費の高騰と用地不足、都心回帰、海外投資家の需要などが背景に挙げられていました。\n\nもっとも、平均価格は大型の高額物件に引きずられやすくて、調査機関や集計方法によって数値は違うようです。この年、わたしたちが8か月かけて家を探して、結局は郊外寄りの中古を選んだ背景には、この価格の変化がありました。","detail":null,"credibility":"disputed","credibility_note":"平均価格の水準は調査機関（不動産経済研究所など）や集計対象により差があり、「初の1億円超」の解釈も集計方法に依存する。","sources":[{"title":"不動産経済研究所: 首都圏新築分譲マンション市場動向 2023年（年間のまとめ）","url":null}]},{"date":"2023-04-01","precision":"day","end_date":"2023-11-30","type":"period","layer":"ふたりの出来事","title":"家探しの8か月","summary":"三軒茶屋の更新を機に、購入か賃貸かで迷い続けた春から秋でした。中古の団地、郊外の戸建て、賃貸のまま住み替える案。週末ごとに内見を重ねて20件を超え、休みはほとんど埋まりました。\n\n都心の新築マンションが1億円を超えたと報じられた年で、最初から新築は考えていませんでした。11月に、東京の西寄りにある築25年のマンションに決めました。決め手は、Kの「ここなら本棚を壁一面にできる」のひと言です。📚","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"住宅ローンを固定金利で契約","summary":"日銀のマイナス金利解除と同じ月に、住宅ローンを契約しました。金利の先行きが読めないなか、迷った末に、返済額が変わらない安心を優先して全期間固定に。フリーランスのわたしは審査に時間がかかって、契約はKの名義が中心になりました。\n\n2022年から続けていた家計簿が返済計画に思いがけず役立って、項目がひとつ増えました。10年前に缶コーヒーの値段の話をしていたふたりが、金利の話をしている。それが可笑しくて、少しだけ感慨深い月でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-19","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"日銀がマイナス金利政策を解除","summary":"2016年から続いたマイナス金利政策が解除されて、17年ぶりの利上げになりました。賃金と物価の好循環が見通せるとして、大規模な金融緩和の枠組みが転換されたのだそうです。\n\n長期金利が上がるかもしれないというニュースで、住宅ローンは固定か変動か、という話題が急に身近になりました。前の年の秋に購入を決めたわたしたちのローン契約が同じ月に重なって、決断の重さを実感することになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本銀行: 金融政策の枠組みの見直しについて（2024年3月19日）","url":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2024/k240319a.pdf"}]},{"date":"2024-05-17","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"出会いから10年、神保町へ","summary":"新居への引っ越しを翌月に控えた土曜日、出会いから10年の日に、神保町へ行きました。あの写真展のギャラリーは別のお店に変わっていたけれど、通りの古書店は変わらずにあって、同じ喫茶店で、缶コーヒーではなく珈琲を飲みました。\n\nこの10年で消費税は2度上がり、元号が変わり、感染症で街が静まり、金利が動きました。わたしたちの記録は、**大きな流れの脇に置かれた小さな注釈**のようなものです。玄関の赤い防災リュックは、次の家にも持っていきます。☕","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"science-artificial-organs","title":"🫀 人工臓器の進化","description":"人工腎臓と人工心臓から、人工内耳、iPS細胞、異種移植まで。機器と技術、患者と社会、制度と倫理の3つの層を重ねながら、「臓器を作る」という挑戦が医療と社会をどう変えてきたかを、やさしく語りなおす年表です。","category":"science-nature","language":"ja","start_year":1943,"end_year":2024,"layers":[{"name":"機器と技術","color":"blue"},{"name":"患者と社会","color":"pink"},{"name":"制度と倫理","color":"teal"}],"events":[{"date":"1943-01-01","precision":"year","end_date":null,"type":"point","layer":"機器と技術","title":"コルフが回転ドラム式人工腎臓を完成","summary":"オランダの医師コルフが、ナチス占領下で回転ドラム式の人工腎臓を完成させ、腎不全患者の血液透析を試みました。汚れた血液を機械で洗って体に戻す、いわば血液の洗濯機です。1945年には急性腎不全の患者の救命に成功し、実用性を初めて示しました。\n\n**壊れた臓器の機能を機械で代替する**という、人工臓器医療の原点です。コルフは戦後米国へ渡り、人工心臓の開発にも関わっていきます。ただし血液透析の原理実証には1910年代からの先行研究があり、「最初」の線引きには議論があります。","detail":null,"credibility":"disputed","credibility_note":"人工腎臓の「実用化第一号」の位置づけは、アベルらの動物実験(1913年)やハースの臨床試行(1924年)との関係で、文献により異なります。","sources":[{"title":"Wikipedia: Willem Johan Kolff","url":"https://en.wikipedia.org/wiki/Willem_Johan_Kolff"}]},{"date":"1953-05-06","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"🫀 ギボンの人工心肺で世界初の開心術成功","summary":"米国の外科医ギボンが、自ら開発した人工心肺装置を使い、心房中隔欠損をもつ18歳の患者の開心術に世界で初めて成功しました。心臓を止めているあいだ、血液の循環と酸素化は機械が代役を務めたのです。\n\n心臓と肺という生命の中枢を、一時的にせよ機械に置き換えられると証明したことで、心臓外科という分野そのものが成立しました。のちの人工心臓開発も、この体外循環技術の延長線上にあります。装置の開発をIBMが支援したことでも知られる出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: John Heysham Gibbon","url":"https://en.wikipedia.org/wiki/John_Heysham_Gibbon"}]},{"date":"1958-10-08","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"世界初の植込み型心臓ペースメーカー移植","summary":"ストックホルムで外科医セニングが、技術者エルムクヴィストの設計した完全植込み型心臓ペースメーカーを、患者アーネ・ラーソンに移植しました。体内に完全に埋め込まれた人工臓器デバイスの、世界初の例とされています。\n\n最初の装置は数時間で故障しましたが、ラーソンは車を乗り換えるように生涯で26台を乗り継ぎ、2001年まで86歳の生涯を全うしました。「機械と共に生きる患者」(患者と社会レイヤー)の最初の一人で、植込み医療が一回の手術ではなく生涯の伴走であることを示しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Arne Larsson","url":"https://en.wikipedia.org/wiki/Arne_Larsson"}]},{"date":"1960-03-09","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"スクリブナー・シャントで反復透析が可能に","summary":"シアトルのスクリブナーらが開発したテフロン製シャントが、患者クライド・シールズに装着されました。血管に常設の出入り口を付けるようなもので、毎回血管を切開せずに、くり返し透析を受けることが初めて可能になったのです。\n\n人工腎臓は急性期の救命装置から、慢性腎不全の患者が**何年も生き続けるための日常の医療**へと変わりました。しかし装置と病床は足りず、2年後には「誰に透析を受けさせるか」を選ぶシアトルの市民委員会(制度と倫理レイヤー)を生むことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Belding Hibbard Scribner","url":"https://en.wikipedia.org/wiki/Belding_Hibbard_Scribner"}]},{"date":"1962-11-09","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"ライフ誌がシアトルの「神の委員会」を報道","summary":"ライフ誌が、シアトルの透析センターで匿名の市民委員会が透析を受けられる患者を選別している実態を、「彼らが誰が生き、誰が死ぬかを決める」と報じました。職業や家族構成、社会への貢献までが考慮されたといいます。\n\n救命ボートの席を割り当てるような、**誰を生かすかを委員会が決める**という事態。それはスクリブナーのシャント(機器と技術レイヤー)が生んだ、希少な延命技術の配分問題そのものでした。医療資源の配分を社会に突きつけ、生命倫理学誕生の契機の一つとされています。","detail":null,"credibility":"unverified","credibility_note":"委員会の運営実態は当事者の証言とライフ誌の取材に基づいており、体系的に検証できる一次記録は限られています。","sources":[{"title":"LIFE (1962-11-09): They Decide Who Lives, Who Dies","url":null}]},{"date":"1967-12-03","precision":"day","end_date":null,"type":"point","layer":"患者と社会","title":"バーナードが世界初の心臓移植を実施","summary":"南アフリカのバーナードがケープタウンで世界初のヒト心臓移植を行い、患者ワシュカンスキーは18日間生存しました。手術は世界的なセンセーションとなり、各国で追随する移植手術が相次ぎます。\n\nしかし、体が移植された心臓を異物とみなして攻撃してしまう拒絶反応の壁で、初期の移植成績は低迷しました。ドナー不足と脳死判定をめぐる議論も噴出します。移植医療の限界こそが人工心臓の開発(機器と技術レイヤー)を加速させたという意味で、この歴史に欠かせない転換点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Christiaan Barnard","url":"https://en.wikipedia.org/wiki/Christiaan_Barnard"}]},{"date":"1969-04-04","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"クーリーが世界初の完全人工心臓を植込み","summary":"ヒューストンの外科医クーリーが、心臓移植までのつなぎとして、世界初の完全人工心臓(リオッタ心臓)を患者に植え込みました。いわば橋が架かるまでの仮の渡し舟です。患者は64時間後に心臓移植を受けましたが、その後亡くなりました。\n\n装置は上司格にあたるデベーキーの研究室で開発途上のもので、無断使用だとする非難から、米国外科史に残る確執へ発展します。功名心と患者の利益、実験と治療の境界という、**人工臓器開発の倫理の原型**がこの一件に現れています。","detail":null,"credibility":"disputed","credibility_note":"装置使用の承認をめぐるクーリーとデベーキーの主張は真っ向から対立しており、実施に至る経緯の詳細には諸説あります。","sources":[{"title":"Wikipedia: Domingo Liotta","url":"https://en.wikipedia.org/wiki/Domingo_Liotta"}]},{"date":"1972-10-30","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"米国、末期腎不全の透析費用を公的保険で負担","summary":"米国で社会保障法改正が成立し、末期腎不全患者の透析と腎移植の費用が、年齢を問わずメディケアの給付対象になりました。特定の疾患だけを対象とした、異例の公的保険の拡大です。\n\nシアトルの委員会が象徴した選別の重荷を、公的保険という大きな財布が引き受けた。つまり**命の選別を制度が引き取った**出来事で、米国の透析患者はやがて数十万人規模に増えていきます。一方で膨らみ続ける費用は、人工臓器医療と保険財政の緊張という、現在まで続く問題の始まりでもありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"US Social Security Amendments of 1972 (P.L. 92-603) ESRD Program","url":null}]},{"date":"1982-12-02","precision":"day","end_date":"1983-03-23","type":"period","layer":"患者と社会","title":"バーニー・クラーク、人工心臓で112日間生存","summary":"ユタ大学でデブリーズが、退役歯科医バーニー・クラークに、恒久使用を前提とした完全人工心臓ジャービック7を植え込みました。クラークは体外の大型駆動装置と管でつながれたまま112日間生きました。経過は連日、世界に報道されます。\n\n**人工心臓と生きた112日**は技術の到達点であると同時に、生活の質を欠いた延命の是非という問いを社会に残しました。この経験が、恒久型の完全人工心臓への期待を、移植までの「つなぎ」や補助人工心臓(制度と倫理レイヤーの承認へ続く)へと方向転換させる契機になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Barney Clark","url":"https://en.wikipedia.org/wiki/Barney_Clark"}]},{"date":"1985-10-01","precision":"month","end_date":null,"type":"point","layer":"制度と倫理","title":"👂 FDAが多チャンネル人工内耳を承認","summary":"米FDAが、多チャンネル方式の人工内耳「ニュークリアス22」を成人向けに承認しました。音を電気の信号に翻訳して聴神経へ直接届ける、感覚そのものを代替する人工臓器の本格的な実用化です。\n\n1990年には小児へ適用が広がり、装用者は世界で数十万人規模になっていきます。一方、ろう者コミュニティ(患者と社会レイヤー)からは「ろうは治すべき欠損なのか」という根源的な異議が示され、人工臓器が文化やアイデンティティと衝突しうることを教えた出来事でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cochlear implant","url":"https://en.wikipedia.org/wiki/Cochlear_implant"}]},{"date":"1994-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と倫理","title":"FDAが補助人工心臓ハートメイトを承認","summary":"米FDAが、空気駆動式の左心補助人工心臓(LVAD)ハートメイトを、心臓移植までの「つなぎ」として承認しました。心臓を丸ごと取り替えるのではなく、疲れた心臓に助手を付けて支える。その現実路線が、規制の場で公認されたのです。\n\n2001年のREMATCH試験では、移植できない患者への恒久使用でも薬物治療を上回る生存が示され、補助人工心臓は人工心臓医療の主流になっていきます。バーニー・クラーク(患者と社会レイヤー)以後の方向転換が、制度に結実した出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ventricular assist device","url":"https://en.wikipedia.org/wiki/Ventricular_assist_device"}]},{"date":"2001-07-02","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"完全植込み型人工心臓アビオコアの初症例","summary":"米アビオメッド社の完全植込み型人工心臓アビオコアが、ケンタッキー州で初めて患者に植え込まれました。皮膚越しにエネルギーを送る方式で、管や配線を体の外へ一切出さない、いわば密閉された機械の心臓です。\n\n初例の患者は151日間生存しましたが、装置の大きさと血栓の問題から適用は広がらず、2006年に人道的機器免除の枠組みで承認(制度と倫理レイヤー)された後も、植込みはごく少数にとどまりました。恒久型の完全人工心臓の難しさを、あらためて示した症例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: AbioCor","url":"https://en.wikipedia.org/wiki/AbioCor"}]},{"date":"2006-08-01","precision":"month","end_date":null,"type":"point","layer":"機器と技術","title":"🧫 山中らがiPS細胞の樹立を発表","summary":"山中伸弥と高橋和利が、4つの遺伝子の導入により、マウスの体細胞を多能性幹細胞(iPS細胞)へ初期化することに成功したと発表しました。いわば細胞の時計を巻き戻す技術で、翌2007年にはヒトの細胞でも樹立に成功します。\n\n胚を使う倫理問題と拒絶反応を避けながら、**体細胞から臓器の材料を作る**道を開き、人工臓器の発想を「機械による代替」から「細胞による再建」へと広げました。2012年にノーベル賞を受賞し、日本では再生医療の法制度整備(制度と倫理レイヤー)が一気に進む契機になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Cell: Induction of Pluripotent Stem Cells from Mouse Embryonic and Adult Fibroblast Cultures by Defined Factors","url":"https://doi.org/10.1016/j.cell.2006.07.024"}]},{"date":"2011-04-01","precision":"month","end_date":null,"type":"point","layer":"制度と倫理","title":"日本で植込み型補助人工心臓が保険適用に","summary":"日本で植込み型補助人工心臓が薬事承認を経て保険適用となり、心臓移植の待機患者が、装置とともに在宅で移植を待てる体制が始まりました。それまで患者の多くは、体外式装置での長期入院を強いられていたのです。\n\n臓器提供が極端に少ない日本では移植待機が数年に及び、補助人工心臓は事実上の長期治療として使われています。同じ種でも土壌が違えば育ち方が変わるように、機器(機器と技術レイヤー)は同じでも、制度と文化の違いが使われ方を大きく変える例です。","detail":null,"credibility":"unverified","credibility_note":"国内の薬事承認と保険適用の正確な時期・対象機種の対応関係は、公的資料での確認が取り切れていません。","sources":[{"title":"日本循環器学会・関連学会: 植込み型補助人工心臓の適正使用に関する資料","url":null}]},{"date":"2014-09-12","precision":"day","end_date":null,"type":"point","layer":"患者と社会","title":"iPS細胞由来の網膜シート、世界初の移植","summary":"理化学研究所の高橋政代らのチームが、患者本人のiPS細胞から作った網膜色素上皮シートを、加齢黄斑変性の患者に移植しました。iPS細胞由来の組織がヒトに移植された、世界初の症例です。\n\n山中らの樹立(機器と技術レイヤー)からわずか8年での臨床到達でした。再生医療関連法の施行前夜という転換期に、慎重な審査を経て行われています。視力の回復ではなく安全性の確認を主な目的とする、石橋を叩いて渡るような設計で、「細胞で臓器を作る」医療の現実的な一歩目になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"理化学研究所: iPS細胞由来網膜色素上皮シート移植手術の実施について(2014年9月)","url":null}]},{"date":"2016-03-23","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"人工気管移植のマッキャリーニ、不正が問題化","summary":"「幹細胞を播種した人工気管」の移植で脚光を浴びた外科医マッキャリーニをめぐり、患者の相次ぐ死亡と論文の誇張が問題になり、カロリンスカ研究所が解雇を発表しました。のちに複数の論文が撤回され、2023年にはスウェーデンで有罪判決が確定しています。\n\n再生医療への過剰な期待が、審査の目を曇らせてしまった。そう総括された事件です。先端的な人工臓器・再生医療の臨床応用における研究不正の教訓として、各国の制度に影を落としました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Paolo Macchiarini","url":"https://en.wikipedia.org/wiki/Paolo_Macchiarini"}]},{"date":"2021-09-25","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"脳死者の体でブタ腎臓の機能を実証","summary":"ニューヨーク大学の医療チームが、遺伝子改変ブタの腎臓を脳死状態の提供者の血管につなぎ、54時間にわたって尿の生成が続き、超急性拒絶反応が起きないことを確かめました。\n\n家族の同意のもとで脳死者を移植研究の場とした点で、科学的な前進であると同時に、新しい研究倫理の枠組みの試行でもありました。いわば本番前の舞台稽古です。この検証が翌2022年の生体患者への異種心臓移植(患者と社会レイヤー)への橋渡しとなり、異種移植を臨床の射程に引き入れました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NYU Langone Health: 遺伝子改変ブタ腎臓の機能実証に関する発表(2021年10月)","url":null}]},{"date":"2022-01-07","precision":"day","end_date":"2022-03-08","type":"period","layer":"患者と社会","title":"世界初のブタ心臓移植、ベネット氏60日の生存","summary":"メリーランド大学で、末期心不全のデービッド・ベネットに、遺伝子改変ブタの心臓が移植されました。生体の人間への異種心臓移植は世界初。他に治療手段のない患者に開かれる特別な扉、FDAの拡大アクセス制度によって実施され、ベネットは60日間生存しました。\n\n**種の壁を越えた移植**は、臓器不足の根本的な解決策として世界の注目を集めましたが、死後の分析でブタ由来ウイルスの関与が示唆され、安全性の課題も残りました。移植を受けられない患者の存在(制度と倫理レイヤー)が、この挑戦の背景にあります。","detail":null,"credibility":"disputed","credibility_note":"死因は移植心の機能不全に至る複合的な要因が指摘されており、ブタサイトメガロウイルスの寄与の程度をめぐって見解が分かれます。","sources":[{"title":"University of Maryland School of Medicine: 遺伝子改変ブタ心臓移植に関する発表(2022年1月)","url":null}]},{"date":"2024-03-16","precision":"day","end_date":null,"type":"point","layer":"患者と社会","title":"生体患者への世界初のブタ腎臓移植","summary":"マサチューセッツ総合病院で、遺伝子改変ブタの腎臓が、末期腎不全のリチャード・スレイマンに移植されました。生体の人間へのブタ腎臓移植は世界初で、患者はいったん透析を離れて退院しています。\n\nスレイマンは約2か月後に亡くなりましたが、病院は移植との直接の関連を否定しています。コルフの人工腎臓(機器と技術レイヤー)から約80年。機械の腎臓から始まった物語は、遺伝子を書き換えた生体臓器という、新しい選択肢にたどり着きました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Massachusetts General Hospital: 遺伝子改変ブタ腎臓の生体移植に関する発表(2024年3月)","url":null}]}]},{"slug":"science-astronomy-turning-points","title":"🔭 天文学の転換点","description":"コペルニクスの地動説から望遠鏡、相対性理論、系外惑星、重力波、JWSTまで。観測技術・宇宙像・社会の3層を重ねて、「宇宙の見え方」がひっくり返った瞬間を選んで並べました。見上げる夜空の意味が変わってきた記録です 🌌","category":"science-nature","language":"ja","start_year":1543,"end_year":2023,"layers":[{"name":"観測と技術","color":"blue"},{"name":"宇宙像の転換","color":"purple"},{"name":"社会と宇宙観","color":"gold"}],"events":[{"date":"1543-01-01","precision":"year","end_date":null,"type":"point","layer":"宇宙像の転換","title":"コペルニクス「天球の回転について」刊行","summary":"コペルニクスの主著「天球の回転について」が刊行されました。太陽を中心に地球が公転する体系を数学的に示し、古代から続く天動説に代わる選択肢を差し出した一冊です。刊行は著者の死の直前でした。\n\n**地球を宇宙の中心から外した**この本が、のちの科学革命の起点とされています。ただし当時は主に計算の道具として読まれ、教会が本格的に問題視する(社会と宇宙観レイヤー)のはガリレオの時代です。観測による裏付けまでには、半世紀以上を要しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: De revolutionibus orbium coelestium","url":"https://en.wikipedia.org/wiki/De_revolutionibus_orbium_coelestium"}]},{"date":"1600-02-17","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"無限宇宙を説いたブルーノの処刑","summary":"修道士ジョルダーノ・ブルーノが、ローマで異端として火刑に処されました。ブルーノは無限の宇宙と無数の世界を唱え、夜空の恒星は太陽と同じ存在で、それぞれに世界が伴うと論じていた人です。\n\n後世には「宇宙論のための殉教者」として語られてきましたが、裁判記録の多くは失われていて、処刑の理由に宇宙論がどれほど関わったのかを確かめるのは難しいのが実情です。宇宙像と信仰の衝突(1633年のガリレオ裁判)を先取りする出来事として、この年表に置いています。","detail":null,"credibility":"unverified","credibility_note":"裁判記録の多くが現存せず、有罪理由のうち宇宙論的な主張が占めた比重は、検証が難しいままです。神学的異端が主因とする見解が有力です。","sources":[{"title":"Wikipedia: Giordano Bruno","url":"https://en.wikipedia.org/wiki/Giordano_Bruno"}]},{"date":"1609-08-01","precision":"month","end_date":"1610-03-13","type":"period","layer":"観測と技術","title":"ガリレオの望遠鏡観測と「星界の報告」","summary":"ガリレオが自作の望遠鏡を夜空へ向け、月面の凹凸、木星を回る4つの衛星、天の川が無数の星の集まりであることを次々に見つけました。成果は1610年3月の「星界の報告」で公表され、欧州中を駆け巡ります 🔭\n\n木星の衛星は「すべての天体が地球を回るわけではない」ことの実証で、コペルニクス説(宇宙像の転換レイヤー)を観測が初めて後押ししました。**見る道具が宇宙像を変える**という天文学の型は、ここで生まれたのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sidereus Nuncius","url":"https://en.wikipedia.org/wiki/Sidereus_Nuncius"}]},{"date":"1633-06-22","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"異端審問所がガリレオに有罪宣告","summary":"ローマの異端審問所がガリレオに有罪を宣告し、地動説を「異端の疑いが濃厚」として撤回させました。ガリレオは終身の軟禁下に置かれ、主著「天文対話」は禁書目録に載ります。\n\n科学と宗教的権威の衝突を象徴する事件として、以後何世紀も語り継がれることになりました。ローマ教皇庁が裁判の誤りを公式に認めたのは、1992年のことです。一方で、軟禁の中でもガリレオが力学研究を続けたことは、ニュートン(宇宙像の転換レイヤー)への橋渡しになりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Galileo affair","url":"https://en.wikipedia.org/wiki/Galileo_affair"}]},{"date":"1687-07-05","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"ニュートン「プリンキピア」刊行","summary":"ニュートンの「自然哲学の数学的諸原理(プリンキピア)」が刊行されました。万有引力と運動の法則によって、物体の落下から惑星の公転までを同じ数学で説明し、ケプラーの法則を導いてみせたのです。\n\n天の上も地の上も、同じ法則が支配している。この統一が、天動説と地動説の対立を最終的に過去のものにしました。以後160年間この力学は完璧に見え、そのわずかな揺らぎ(1846年の海王星発見、1915年の一般相対性理論)自体が、次の転換点になっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Philosophiæ Naturalis Principia Mathematica","url":"https://en.wikipedia.org/wiki/Philosophi%C3%A6_Naturalis_Principia_Mathematica"}]},{"date":"1846-09-23","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"計算が予言した惑星、海王星の発見","summary":"ベルリン天文台のガレが、フランスのルヴェリエの計算が示した位置のすぐ近くに、海王星を見つけました。天王星の軌道のずれから未知の惑星の居場所を割り出した、理論天文学の金字塔です。\n\n**紙と計算だけで惑星を予言した**この成功は、ニュートン力学の権威を頂点へ押し上げました。発見の栄誉をめぐっては英国のアダムズの計算が先だとする声が上がり英仏間の論争になりましたが、近年の史料再検証では、英国側の主張を割り引く見方が進んでいます。","detail":null,"credibility":"disputed","credibility_note":"アダムズの計算の先行性と精度をめぐる評価は英仏間で長く対立してきました。近年の史料再検証では、英国側の主張を割り引く見解が有力です。","sources":[{"title":"Wikipedia: Discovery of Neptune","url":"https://en.wikipedia.org/wiki/Discovery_of_Neptune"}]},{"date":"1915-11-25","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"アインシュタインが一般相対性理論を発表","summary":"アインシュタインがプロイセン科学アカデミーで、一般相対性理論の重力場方程式を発表しました。重力を力ではなく時空の曲がりとして描き、ニュートン以来の重力観を根本から置き換えたのです。\n\n水星の近日点移動という積年の謎を説明したうえ、光の湾曲と重力波という検証できる予言を生みました。前者は1919年の日食観測(社会と宇宙観レイヤー)で、後者はちょうど100年後、2015年の直接検出(観測と技術レイヤー)で確かめられることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: General relativity","url":"https://en.wikipedia.org/wiki/General_relativity"}]},{"date":"1919-05-29","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"日食観測が相対性理論を実証、世界的事件に","summary":"エディントンらの遠征隊が西アフリカとブラジルで皆既日食を観測し、太陽の重力による星の光の湾曲が一般相対性理論の予言と一致すると、同年11月に発表しました。「ニュートンの宇宙が覆された」と新聞が書き立て、アインシュタインは一夜で世界的な名声を得ます。\n\n科学の成果がメディアを通じて大衆的な事件になった、最初期の例です。当時の観測精度は低く、データの取捨選択への批判も長く続きましたが、後年の再解析は結論をおおむね支持しています。","detail":null,"credibility":"disputed","credibility_note":"観測精度の低さとデータ選択の妥当性への批判は長くありましたが、後年の再解析では、結論はおおむね支持されています。","sources":[{"title":"Wikipedia: Eddington experiment","url":"https://en.wikipedia.org/wiki/Eddington_experiment"}]},{"date":"1923-10-06","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"ハッブル、アンドロメダが銀河系の外と示す","summary":"ハッブルがウィルソン山天文台の100インチ望遠鏡で、アンドロメダ「星雲」の中にセファイド変光星を見つけ、その距離が銀河系の大きさをはるかに超えることを示しました。変光星を意味する「VAR」と興奮のままに書き込んだ写真乾板が残っています。\n\n宇宙は銀河系がすべてか否かを争った1920年の「大論争」に決着をつけ、**銀河系は無数の銀河の一つ**にすぎないと確定させました。距離の物差しになったのは、リービットが1912年に見つけた変光星の周期光度関係です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edwin Hubble","url":"https://en.wikipedia.org/wiki/Edwin_Hubble"}]},{"date":"1929-03-15","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"宇宙膨張の観測的証拠、ハッブルの法則","summary":"ハッブルが、遠い銀河ほど速く遠ざかるという、距離と後退速度の比例関係を発表しました。宇宙そのものが膨張していることの観測的な根拠で、永遠不変の静的な宇宙像は放棄を迫られます。\n\n膨張を時間的に遡れば、宇宙には「始まり」があったことになる。ビッグバン宇宙論への道はここから開けました。同様の関係は1927年にルメートルが理論とともに導いていて、先取権をめぐる長い議論の末、2018年に「ハッブル–ルメートルの法則」へ改称されています。","detail":null,"credibility":"disputed","credibility_note":"法則の先取権については1927年のルメートルの論文との関係で議論が続き、IAUが2018年に名称変更を決議した経緯があります。","sources":[{"title":"Wikipedia: Hubble's law","url":"https://en.wikipedia.org/wiki/Hubble%27s_law"}]},{"date":"1957-10-04","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"スプートニク1号打ち上げ、宇宙時代の幕開け","summary":"ソ連が世界初の人工衛星スプートニク1号の打ち上げに成功しました。直径58cmの球体が発する電波は世界中のアマチュア無線家にも届き、米国には「スプートニク・ショック」と呼ばれる衝撃が走ります 📡\n\n宇宙が「観測するだけの場所」から「人類が機械を送り込む場所」へ変わった瞬間です。冷戦下の宇宙開発競争は、結果として宇宙望遠鏡や惑星探査機(観測と技術レイヤー)という、大気の外から宇宙を見る新しい道具を天文学にもたらしていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sputnik 1","url":"https://en.wikipedia.org/wiki/Sputnik_1"}]},{"date":"1965-05-01","precision":"month","end_date":null,"type":"point","layer":"観測と技術","title":"宇宙マイクロ波背景放射の発見","summary":"ベル研究所のペンジアスとウィルソンが、アンテナからどうしても消えない雑音として、全天からほぼ等しく届くマイクロ波を検出しました。これが宇宙誕生の名残の光、宇宙マイクロ波背景放射と同定されます。\n\nビッグバン理論と定常宇宙論の論争に事実上の決着をつけ、宇宙論(宇宙像の転換レイヤー)を思弁から精密観測の科学へ変える突破口になりました(1978年ノーベル賞)。同じ放射を予言していたプリンストンのチームとの同時期の遭遇は、科学史に残る偶然です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cosmic microwave background","url":"https://en.wikipedia.org/wiki/Cosmic_microwave_background"}]},{"date":"1967-11-28","precision":"day","end_date":null,"type":"point","layer":"観測と技術","title":"ジョスリン・ベルがパルサーを発見","summary":"ケンブリッジ大学の大学院生ジョスリン・ベルが、電波観測データの中に、正確な周期で届くパルスを見つけました。当初は半ば冗談で「小さな緑の人(LGM-1)」と呼ばれた信号は、高速で自転する中性子星、パルサーと同定されます。\n\n理論上の存在だった中性子星が実在すると示し、極限状態の物理を観測できる高エネルギー天体物理学の扉を開きました。1974年のノーベル物理学賞は指導教員ヒューイッシュらに贈られ、発見者本人が外れたことは、科学界の長い論争として残っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Jocelyn Bell Burnell","url":"https://en.wikipedia.org/wiki/Jocelyn_Bell_Burnell"}]},{"date":"1990-04-24","precision":"day","end_date":null,"type":"point","layer":"観測と技術","title":"ハッブル宇宙望遠鏡の打ち上げ","summary":"スペースシャトルによって、ハッブル宇宙望遠鏡が打ち上げられました。大気の揺らぎに邪魔されない軌道の上から宇宙を見ることは天文学の悲願で、口径2.4mのこの望遠鏡は、30年以上も観測を続けることになります。\n\n直後に主鏡の研磨誤差が見つかり「欠陥望遠鏡」と酷評されましたが、1993年の修理ミッションで性能を回復しました。以後は宇宙膨張の加速の測定(宇宙像の転換レイヤー)などに貢献し、公開された画像は、私たちが思い浮かべる宇宙のイメージそのものを塗り替えています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hubble Space Telescope","url":"https://en.wikipedia.org/wiki/Hubble_Space_Telescope"}]},{"date":"1995-10-06","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"太陽に似た恒星を回る初の系外惑星発見","summary":"スイスのマイヨールとケローが、ペガスス座51番星を回る惑星の発見を発表しました。太陽に似た恒星を回る系外惑星の確認は史上初。しかも木星級の巨大惑星がわずか4日で公転するという、太陽系の常識の外にある姿でした 🪐\n\n**太陽系が特別ではなくなった**転換点です。「灼熱の木星」の存在は惑星形成理論の書き換えを迫り、系外惑星はその後の探査で5000個を超えて見つかっていきます。2019年、二人にはノーベル物理学賞が贈られました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 51 Pegasi b","url":"https://en.wikipedia.org/wiki/51_Pegasi_b"}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"宇宙像の転換","title":"宇宙膨張の加速とダークエネルギーの発見","summary":"遠方の超新星を観測していた2つの国際チームが、宇宙の膨張は減速ではなく、むしろ加速しているという結果を相次いで発表しました。加速を引き起こす正体不明の何かは「ダークエネルギー」と名付けられます。\n\n**膨張は加速していた**。この発見は、宇宙の約7割が正体不明のエネルギーで占められることを意味し、物理学最大級の未解決問題を生みました。観測自体は追試で確立して2011年のノーベル賞に至りましたが、ダークエネルギーの正体は今も分かっていません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Accelerating expansion of the universe","url":"https://en.wikipedia.org/wiki/Accelerating_expansion_of_the_universe"}]},{"date":"2015-09-14","precision":"day","end_date":null,"type":"point","layer":"観測と技術","title":"LIGOが重力波を初めて直接検出","summary":"米国の重力波検出器LIGOが、約13億光年彼方のブラックホール連星の合体から届いた重力波を、史上初めて直接検出しました。一般相対性理論(宇宙像の転換レイヤー)の予言から、ちょうど100年目の検証です。\n\n電磁波に頼らず、時空のさざ波そのものを捉える。**宇宙を「聴く」観測**の始まりでした。2017年には中性子星合体を重力波と光の双方で捉えるマルチメッセンジャー天文学も実現し、検出は同年のノーベル物理学賞の対象になっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Physical Review Letters: Observation of Gravitational Waves from a Binary Black Hole Merger","url":"https://doi.org/10.1103/PhysRevLett.116.061102"}]},{"date":"2019-04-10","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"ブラックホールの「影」を初めて撮像・公開","summary":"国際協力イベント・ホライズン・テレスコープ(EHT)が、楕円銀河M87の中心にある超大質量ブラックホールの「影」の画像を、世界6か所の同時会見で公開しました。ブラックホールが直接撮像された、史上初の例です。\n\n地球規模の電波望遠鏡網(観測と技術レイヤー)が成し遂げた成果であると同時に、あのオレンジ色のリングが一夜で世界中に共有される、科学とメディアの新しい関係も見せてくれました。理論上の存在だったブラックホールは、誰もが見た「実在」になったのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Event Horizon Telescope","url":"https://en.wikipedia.org/wiki/Event_Horizon_Telescope"}]},{"date":"2021-12-25","precision":"day","end_date":"2022-07-12","type":"period","layer":"観測と技術","title":"JWST打ち上げから最初の科学画像公開まで","summary":"ジェイムズ・ウェッブ宇宙望遠鏡(JWST)が打ち上げられ、地球から150万kmのラグランジュ点への航行と、口径6.5mの主鏡の展開・調整を経て、2022年7月12日に最初の科学画像が公開されました 🌌\n\n赤外線で宇宙最初期の銀河まで見通す設計で、開発には四半世紀と約100億ドルが投じられています。最初の画像公開は米大統領も参加する社会的なイベント(社会と宇宙観レイヤー)となり、観測データは公開直後から、初期宇宙の描像(宇宙像の転換レイヤー)を揺さぶり始めました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: James Webb Space Telescope","url":"https://en.wikipedia.org/wiki/James_Webb_Space_Telescope"}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"宇宙像の転換","title":"JWSTが初期宇宙に「重すぎる銀河」候補を発見","summary":"JWSTの初期観測データから、ビッグバン後5〜7億年の宇宙に、標準的な銀河形成モデルの予想を大きく上回る質量を持つとみられる銀河の候補が、複数報告されました。\n\n候補の多くは測光観測による赤方偏移の推定に基づいていて、分光での確認や質量見積もりの下方修正も進行中です。宇宙論の修正が要るのかどうかは、まだ分かりません。新しい観測装置(観測と技術レイヤー)が宇宙像を揺さぶるという、この年表で繰り返されてきた構図の、いちばん新しい一幕です。","detail":null,"credibility":"unverified","credibility_note":"銀河候補の距離と質量は測光的な推定に基づく初期報告で、分光確認と再解析によって、見積もりが変わる可能性が高い段階です。","sources":[{"title":"Nature: A population of red candidate massive galaxies ~600 Myr after the Big Bang (Labbé et al., 2023)","url":null}]}]},{"slug":"science-astrophysics","title":"🌌 宇宙物理学の革命","description":"1915年の一般相対性理論から、重力波、そしてJWSTまで。理論の飛躍と、それを確かめた観測と装置、発見に沸いた人と社会。3つの層を重ねて、宇宙の姿が塗り替えられてきた100年あまりをたどります。夜空の向こうで起きてきたことの記録です 🔭","category":"science-nature","language":"ja","start_year":1915,"end_year":2023,"layers":[{"name":"理論","color":"purple"},{"name":"観測と装置","color":"blue"},{"name":"人と社会","color":"gold"}],"events":[{"date":"1915-11-25","precision":"day","end_date":null,"type":"point","layer":"理論","title":"アインシュタイン、一般相対性理論の場の方程式を発表","summary":"アインシュタインがプロイセン科学アカデミーで、重力を時空の曲がりとして描く場の方程式を提出しました。10年に及ぶ試行錯誤の末、11月の4回の講演で理論を完成させ、水星の近日点移動の謎まで説明してみせたのです。\n\nほぼ同じ頃、ヒルベルトも同等の方程式にたどり着いていて、どちらが先かをめぐる議論は長く続きました。4年後の日食で確かめられる光の湾曲も、膨張宇宙もブラックホールも、すべてはこの方程式の解から現れてきます。","detail":null,"credibility":"disputed","credibility_note":"場の方程式の最終形にヒルベルトが先に到達していたかどうかは、校正刷りの証拠をめぐって、科学史家の間でも見解が分かれています。","sources":[{"title":"Einstein, A. (1915) Die Feldgleichungen der Gravitation. Sitzungsberichte der Königlich Preußischen Akademie der Wissenschaften","url":null},{"title":"Corry, L., Renn, J. & Stachel, J. (1997) Belated Decision in the Hilbert-Einstein Priority Dispute. Science","url":null}]},{"date":"1919-05-29","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"エディントンらが日食観測で光の湾曲を確認","summary":"第一次大戦が終わった翌年、英国の遠征隊がプリンシペ島とブラジル・ソブラルで皆既日食を観測し、太陽の近くの星の位置がわずかにずれて見えることを確かめました。一般相対論の予測どおりの結果です。\n\n同年11月6日の王立協会での発表を英タイムズ紙が「科学の革命」と報じ、アインシュタインは一夜で世界の有名人に。観測精度や乾板の選び方には後年疑問も出ましたが、再解析では結論が支持されています。**理論と観測と社会の反響が半年のうちに連鎖した**、鮮やかな実例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Dyson, F. W., Eddington, A. S. & Davidson, C. (1920) A Determination of the Deflection of Light by the Sun's Gravitational Field. Philosophical Transactions of the Royal Society A","url":"https://doi.org/10.1098/rsta.1920.0009"}]},{"date":"1927-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"ルメートル、膨張宇宙モデルを提唱","summary":"ベルギーの司祭で物理学者でもあったルメートルが、一般相対論の解として膨張する宇宙を導き、後退速度と距離の比例関係を予言しました。1922年のフリードマンの数学的な解に続き、観測データと結びつけて宇宙の膨張率まで見積もっています。\n\nフランス語の地方誌に載ったため当初は注目されず、広く知られるのは2年後のハッブルの観測でした。2018年にIAUが「ハッブル・ルメートルの法則」の呼称を推奨し、先取権が見直されています。1931年には「原始的原子」の着想で、ビッグバン理論の原型も示しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Lemaître, G. (1927) Un Univers homogène de masse constante et de rayon croissant. Annales de la Société Scientifique de Bruxelles","url":null},{"title":"IAU (2018) Resolution B4 on a suggested renaming of the Hubble Law","url":null}]},{"date":"1929-03-15","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ハッブル、銀河の後退速度と距離の比例関係を発表","summary":"ウィルソン山天文台の100インチ望遠鏡で測った24個の銀河の距離と赤方偏移から、ハッブルが「遠い銀河ほど速く遠ざかる」という比例関係を導きました。アンドロメダが天の川の外の銀河だと示した1924年の観測に続く成果です。\n\n当時の距離の物差しの誤りで、比例定数は現在の約7倍もありました。それでも**膨張宇宙という理論レイヤーの予言に、観測の裏付けを与えた**意義は揺るがず、静的な宇宙を信じていたアインシュタインも1931年に宇宙項を撤回しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Hubble, E. (1929) A relation between distance and radial velocity among extra-galactic nebulae. PNAS","url":"https://doi.org/10.1073/pnas.15.3.168"}]},{"date":"1933-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と装置","title":"ツビッキー、かみのけ座銀河団に「見えない質量」を指摘","summary":"ツビッキーがビリアル定理を使ってかみのけ座銀河団の質量を見積もったところ、銀河の速度分散から、光度から推定される量を大きく上回る「見えない質量」が必要になりました。ここで「暗黒物質（dunkle Materie）」という言葉が使われています。\n\n当時のハッブル定数が過大だったため見積もりの倍率は現在より大きく、この指摘は数十年間ほとんど顧みられませんでした。1970年代、ルービンらの銀河回転曲線の観測で問いがよみがえり、暗黒物質は現代宇宙論の中心課題になっていきます。","detail":null,"credibility":"unverified","credibility_note":"ツビッキーが示した質量比は当時の距離尺度に依存していて、現在の値とは大きく異なります。これを「暗黒物質の発見」と位置づけるかどうかも、評価が分かれています。","sources":[{"title":"Zwicky, F. (1933) Die Rotverschiebung von extragalaktischen Nebeln. Helvetica Physica Acta","url":null}]},{"date":"1935-01-11","precision":"day","end_date":null,"type":"point","layer":"人と社会","title":"エディントン、王立天文学会でチャンドラセカールの理論を公然と否定","summary":"白色矮星の質量に上限があるとする24歳のチャンドラセカールの発表を、王立天文学会の場で、権威エディントンがその場で酷評しました。太陽質量の約1.4倍を超えると重力を支えられない。相対論的な量子統計から導かれた理論でした。\n\nこの否定は若い研究者の歩みに長く影を落とし、彼は研究分野を変えます。上限質量はのちに中性子星やブラックホール形成の理解の基礎となり、1983年のノーベル賞で報われました。**理論の正しさと学界の受け入れが数十年ずれた**出来事として語り継がれています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Chandrasekhar, S. (1935) The highly collapsed configurations of a stellar mass (Second paper). Monthly Notices of the Royal Astronomical Society","url":null},{"title":"The Observatory, Vol. 58 (1935) Report of the RAS meeting of 1935 January 11","url":null}]},{"date":"1948-04-01","precision":"day","end_date":null,"type":"point","layer":"理論","title":"アルファーとガモフ、高温初期宇宙での元素合成を提唱","summary":"「αβγ論文」と呼ばれる短報で、アルファーとガモフが、膨張する高温高密度の初期宇宙で軽い元素が作られたと論じました。ビッグバン元素合成の出発点です。ガモフが冗談でベーテを著者に加えた逸話でも知られています。\n\n同じ年、アルファーとハーマンは、初期宇宙の名残の放射が現在約5Kの背景放射として残っていると予言しましたが、観測できるとは思われず忘れられました。この予言が日の目を見るのは、1965年の偶然の発見を待つことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Alpher, R. A., Bethe, H. & Gamow, G. (1948) The Origin of Chemical Elements. Physical Review","url":"https://doi.org/10.1103/PhysRev.73.803"}]},{"date":"1965-07-01","precision":"month","end_date":null,"type":"point","layer":"観測と装置","title":"ペンジアスとウィルソン、宇宙マイクロ波背景放射を発見","summary":"ベル研究所のペンジアスとウィルソンが、衛星通信用ホーンアンテナのどうしても消えない雑音の源を、鳩の糞まで疑って探しました。たどり着いた答えは、あらゆる方向から届く約3Kの等方的な宇宙背景放射でした 📡\n\nプリンストンのディッケらはちょうど同じ放射を探す観測を準備中で、両グループの論文は同じ号に並びます。**忘れられていた1948年の予言を17年越しで裏づける**、ビッグバン理論の決定的な証拠となり、定常宇宙論は退場しました。2人は1978年にノーベル物理学賞を受けています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Penzias, A. A. & Wilson, R. W. (1965) A Measurement of Excess Antenna Temperature at 4080 Mc/s. The Astrophysical Journal","url":"https://doi.org/10.1086/148307"},{"title":"The Nobel Prize in Physics 1978","url":"https://www.nobelprize.org/prizes/physics/1978/summary/"}]},{"date":"1967-11-28","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ジョスリン・ベル、初のパルサーを検出","summary":"ケンブリッジの大学院生ジョスリン・ベルが、電波観測の記録紙の中に、1.337秒周期の規則正しいパルスを見つけました。信号は当初「LGM-1（小さな緑の人）」と冗談交じりに呼ばれ、のちに高速回転する中性子星と解釈されます。\n\n1930年代に理論で予想されていた中性子星が本当に夜空にあると確かめられ、極限状態の物理を試せる天体が手に入りました。1974年のノーベル物理学賞は指導教官ヒューイッシュに贈られ、発見者のベルが外れたことは、貢献の帰属をめぐる議論を呼びました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Hewish, A., Bell, S. J., Pilkington, J. D. H., Scott, P. F. & Collins, R. A. (1968) Observation of a Rapidly Pulsating Radio Source. Nature","url":"https://doi.org/10.1038/217709a0"}]},{"date":"1970-02-01","precision":"month","end_date":null,"type":"point","layer":"観測と装置","title":"ルービンとフォード、アンドロメダ銀河の平坦な回転曲線を報告","summary":"ルービンとフォードがアンドロメダ銀河を分光観測し、外縁部の星が予想より速く回り、回転速度がほぼ一定に保たれていることを示しました。光る物質だけなら外側ほど遅くなるはずで、見えない質量が銀河を包んでいる可能性が観測から浮かび上がります。\n\n1970年代の末までに多くの渦巻銀河で同じ傾向が確かめられ、1933年のツビッキーの指摘が銀河スケールでも成り立つことになりました。暗黒物質は以後の宇宙論の前提になりましたが、その正体は2020年代になっても謎のままです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Rubin, V. C. & Ford, W. K. Jr. (1970) Rotation of the Andromeda Nebula from a Spectroscopic Survey of Emission Regions. The Astrophysical Journal","url":"https://doi.org/10.1086/150317"}]},{"date":"1974-03-01","precision":"day","end_date":null,"type":"point","layer":"理論","title":"ホーキング、ブラックホールが放射して蒸発すると予言","summary":"ホーキングが一般相対論と量子論を組み合わせた計算から、ブラックホールが量子効果で熱放射を出して質量を失い、蒸発しうること、温度とエントロピーを持つことを、Nature誌の短報で示しました。\n\n1972年のベッケンシュタインの着想を理論の側から裏づけ、量子重力と情報パラドックスという長い議論が始まります。放射はあまりに微弱でまだ観測されていませんが、この飛躍は1988年の著書「ホーキング、宇宙を語る」を通じて広く届き、宇宙物理学を身近にしました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Hawking, S. W. (1974) Black hole explosions? Nature","url":"https://doi.org/10.1038/248030a0"}]},{"date":"1981-01-15","precision":"day","end_date":null,"type":"point","layer":"理論","title":"グース、インフレーション宇宙論を発表","summary":"グースが、初期宇宙が指数関数的に急膨張したとするインフレーション宇宙論を発表し、地平線問題と平坦性問題をまとめて解決しました。素粒子論の相転移から生まれた着想で、宇宙の一様さと平坦さを説明し、量子ゆらぎが銀河の種になるという予測も導かれます。\n\nその予測は、1992年のCOBE、2003年以降のWMAP、プランク衛星の観測で確かめられていきました。同じ頃に佐藤勝彦、スタロビンスキー、リンデらも似た考えを独立に提案していて、着想の先取権はひとりには決められません。","detail":null,"credibility":"disputed","credibility_note":"1979〜81年には佐藤勝彦、スタロビンスキー、カザナス、リンデらが独立に類似モデルを発表していて、誰を提唱者とするかは文献によって異なります。","sources":[{"title":"Guth, A. H. (1981) Inflationary universe: A possible solution to the horizon and flatness problems. Physical Review D","url":"https://doi.org/10.1103/PhysRevD.23.347"},{"title":"Sato, K. (1981) First-order phase transition of a vacuum and the expansion of the Universe. Monthly Notices of the Royal Astronomical Society","url":null}]},{"date":"1990-04-24","precision":"day","end_date":"1993-12-13","type":"period","layer":"観測と装置","title":"ハッブル宇宙望遠鏡、打ち上げから光学系修理まで","summary":"スペースシャトルで打ち上げられたハッブル宇宙望遠鏡に、直後から像がぼやける主鏡の研磨誤差「球面収差」が見つかり、巨額の計画への批判が噴き出しました。1993年12月、エンデバー号の飛行士が補正光学系を取り付け、本来の視力を取り戻します 🔭\n\n以後は深宇宙の撮像、宇宙年齢の決定、加速膨張の発見と、数々の成果を生みました。装置の失敗と回復が、科学予算への社会の視線を左右した例でもあり、次世代望遠鏡JWSTの慎重な開発姿勢にも影響しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NASA: Hubble Space Telescope","url":"https://science.nasa.gov/mission/hubble/"},{"title":"NASA: STS-61 Mission Archives (First Hubble Servicing Mission)","url":null}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と装置","title":"遠方超新星の観測で宇宙の加速膨張を発見","summary":"リースらとパールマッターらの2チームが、Ia型超新星の距離測定から、宇宙の膨張は減速ではなく加速していると報告しました。重力でブレーキがかかるはずという理論レイヤーの前提を覆し、アインシュタインが撤回した宇宙項に相当する「ダークエネルギー」の存在を示唆します。\n\n精度を支えたのはハッブル宇宙望遠鏡の追観測でした。通常物質約5%、暗黒物質約27%、ダークエネルギー約68%という現代の宇宙の描像はここから固まり、3人は2011年にノーベル物理学賞を受けました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Riess, A. G. et al. (1998) Observational Evidence from Supernovae for an Accelerating Universe and a Cosmological Constant. The Astronomical Journal","url":"https://doi.org/10.1086/300499"},{"title":"Perlmutter, S. et al. (1999) Measurements of Ω and Λ from 42 High-Redshift Supernovae. The Astrophysical Journal","url":"https://doi.org/10.1086/307221"}]},{"date":"2014-03-17","precision":"day","end_date":"2015-01-30","type":"period","layer":"人と社会","title":"BICEP2「原始重力波の痕跡」発表から撤回まで","summary":"南極の望遠鏡BICEP2が、インフレーションの証拠となる原始重力波起源の偏光パターンを検出したと発表しました。記者会見と動画で「ノーベル賞級」と報じられ、理論の直接証拠として大きく取り上げられます。\n\nしかしプランク衛星との共同解析で、信号の大部分は銀河系内の塵によるものと結論され、2015年1月に主張は事実上撤回されました。査読前の発表と科学報道のあり方が問われる一方で、誤りが公開の場で正されていく、科学の自己修正が働いた事例でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"BICEP2 Collaboration (2014) Detection of B-Mode Polarization at Degree Angular Scales by BICEP2. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.112.241101"},{"title":"BICEP2/Keck and Planck Collaborations (2015) Joint Analysis of BICEP2/Keck Array and Planck Data. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.114.101301"}]},{"date":"2015-09-14","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"LIGO、重力波を初めて直接検出","summary":"観測再開の直後、約13億光年先のブラックホール連星の合体から届いた重力波GW150914を、2台の検出器が同時に捉えました。太陽の約36倍と29倍のブラックホールが合体し、約3太陽質量分のエネルギーが重力波として放たれ、2016年2月11日に公表されます。\n\n**一般相対論が1916年に予言してから、ほぼ100年後の直接検出**です。2017年8月には中性子星合体GW170817が電磁波でも同時観測されてマルチメッセンジャー天文学が幕を開け、ワイス、バリッシュ、ソーンは2017年にノーベル物理学賞を受けました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Abbott, B. P. et al. (LIGO Scientific Collaboration and Virgo Collaboration) (2016) Observation of Gravitational Waves from a Binary Black Hole Merger. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.116.061102"},{"title":"The Nobel Prize in Physics 2017","url":"https://www.nobelprize.org/prizes/physics/2017/summary/"}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"「ハッブル定数の不一致」が統計的に有意と報告される","summary":"近くの宇宙で距離はしごを組んで測った膨張率と、宇宙背景放射から標準モデルで導いた値のずれが、約4σを超えたと報告されました。セファイド変光星と超新星による測定は毎秒毎メガパーセクあたり約74km、プランク衛星側は約67kmで、誤差では説明がつきません。\n\n原因が測定の系統誤差なのか、暗黒エネルギーの性質や初期宇宙の物理の見直しを迫る新しい物理なのかは、まだ決着していません。JWSTによる距離尺度の再検証が、2020年代の大きな宿題になっています。","detail":null,"credibility":"disputed","credibility_note":"ずれの原因が未知の系統誤差なのか標準宇宙モデルの不備なのか、研究者の間でも見解が分かれていて、独立した距離測定法ごとに値も異なります。","sources":[{"title":"Riess, A. G. et al. (2019) Large Magellanic Cloud Cepheid Standards Provide a 1% Foundation for the Determination of the Hubble Constant and Stronger Evidence for Physics beyond ΛCDM. The Astrophysical Journal","url":null},{"title":"Planck Collaboration (2020) Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics","url":"https://doi.org/10.1051/0004-6361/201833910"}]},{"date":"2020-10-06","precision":"day","end_date":null,"type":"point","layer":"人と社会","title":"ペンローズ、ゲンツェル、ゲズにノーベル物理学賞","summary":"ブラックホールの形成が一般相対論の帰結だと証明したペンローズと、天の川銀河の中心に太陽の約400万倍の質量を突き止めたゲンツェル、ゲズに、ノーベル物理学賞が贈られました。ペンローズの特異点定理は1965年、星の軌道追跡の観測は1990年代からの積み重ねです。\n\n前年の2019年4月には、イベント・ホライズン・テレスコープがM87のブラックホールの影を初めて撮像していました。**理論と観測と社会的な評価が、105年の時を経てひとつに集まった**瞬間です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Physics 2020","url":"https://www.nobelprize.org/prizes/physics/2020/summary/"}]},{"date":"2021-12-25","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ジェイムズ・ウェッブ宇宙望遠鏡を打ち上げ","summary":"口径6.5mの赤外線宇宙望遠鏡ジェイムズ・ウェッブが、クリスマスの日に仏領ギアナからアリアン5で打ち上げられました。1996年の構想から25年、度重なる延期と予算超過を経て総額約100億ドルの計画が実現し、2022年7月に最初の科学画像が公開されます 🌌\n\n太陽・地球のラグランジュ点L2から赤外線で、最初期の銀河、系外惑星の大気、星が生まれる現場を捉えます。ハッブルの後継として距離尺度の再検証にも投入され、2019年の「ハッブル定数の不一致」の解決も期待されています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NASA: James Webb Space Telescope","url":"https://science.nasa.gov/mission/webb/"}]},{"date":"2023-02-22","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"JWST、初期宇宙に予想外に重い銀河候補を報告","summary":"ビッグバンから約5〜7億年の時点に、標準モデルの予想を超える質量を持つとみられる銀河の候補が見つかったと、Nature誌に報告されました。ラベらのチームは赤外線の色から6個の候補の質量を見積もり、当時の宇宙にある通常物質の量に対して多すぎると指摘し、銀河形成理論の見直しの可能性を投げかけています。\n\nただし推定は測光に基づくもので、分光での確認や活動銀河核の寄与、質量の見積もり方によって結論は変わりえます。追観測で一部の候補は距離や質量が下方修正されていて、評価はいまも続いています。","detail":null,"credibility":"unverified","credibility_note":"候補天体の距離と質量は測光推定に基づいていて、分光の追観測やモデルの違いで大きく変わりうるため、標準モデルとの矛盾はまだ確定していません。","sources":[{"title":"Labbé, I. et al. (2023) A population of red candidate massive galaxies ~600 Myr after the Big Bang. Nature","url":"https://doi.org/10.1038/s41586-023-05786-2"}]}]},{"slug":"science-climate-100","title":"気候変動の100年","description":"1896年のアレニウスの計算から2020年代の1.5℃到達まで。科学の発見、大気と気温の観測記録、国際政策と社会運動の3層を重ね、知見が政策に届くまでの遅れと加速を読む。","category":"science-nature","language":"ja","start_year":1896,"end_year":2024,"layers":[{"name":"科学の発見","color":"blue"},{"name":"観測と現象","color":"teal"},{"name":"政策と社会","color":"orange"}],"events":[{"date":"1896-01-01","precision":"year","end_date":null,"type":"point","layer":"科学の発見","title":"アレニウス、CO2濃度と地表温度の関係を定量化","summary":"スウェーデンの化学者アレニウスが、大気中のCO2が倍増すると地表温度が数℃上昇するとの計算結果を発表。氷期の成因を探る中で、CO2の赤外吸収が地表温度に与える影響を手計算で見積もり、倍増時の昇温を5〜6℃とした。\n\nただし当時は温暖化を有益と考えており、産業起源のCO2が問題になるとは想定されていなかった。**濃度上昇が観測で示されるのは60年以上後**のキーリングの測定であり、知見と検証の長い時差の出発点にあたる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Arrhenius, S. (1896) On the Influence of Carbonic Acid in the Air upon the Temperature of the Ground. Philosophical Magazine","url":"https://doi.org/10.1080/14786449608620846"}]},{"date":"1958-03-01","precision":"month","end_date":null,"type":"point","layer":"観測と現象","title":"キーリング、マウナロアでCO2の連続観測を開始","summary":"国際地球観測年を機に、スクリップス海洋研究所のチャールズ・キーリングがハワイ・マウナロア山頂で大気中CO2濃度の高精度な定常観測を開始。開始時の濃度は約315ppmだった。\n\n観測は季節変動を伴いながら右肩上がりに増える「キーリング曲線」を生み、人為的なCO2増加を初めて連続データで示した。1960年代以降の理論研究や1965年の大統領諮問報告が依拠する基礎となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Scripps Institution of Oceanography: The Keeling Curve","url":"https://keelingcurve.ucsd.edu/"},{"title":"NOAA Global Monitoring Laboratory: Trends in Atmospheric Carbon Dioxide","url":"https://gml.noaa.gov/ccgg/trends/"}]},{"date":"1965-11-01","precision":"month","end_date":null,"type":"point","layer":"政策と社会","title":"米大統領科学諮問委員会がCO2の気候影響を報告","summary":"ジョンソン政権の科学諮問委員会が報告書「Restoring the Quality of Our Environment」の付録で、CO2増加による気候変化の可能性を政府に警告。キーリングの観測開始から7年で得られたデータを根拠に、2000年までにCO2が約25%増え気候に「著しい変化」を起こしうると述べた。\n\n米政府文書が温暖化に言及した最初期の例だが、**警告は具体的な政策には結びつかなかった**。科学の知見が政策の言葉になるまでの長い空白がここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"President's Science Advisory Committee (1965) Restoring the Quality of Our Environment, Appendix Y4","url":null}]},{"date":"1967-01-01","precision":"year","end_date":null,"type":"point","layer":"科学の発見","title":"真鍋淑郎らがCO2倍増時の昇温を約2.3℃と算出","summary":"真鍋淑郎とウェザラルドが、水蒸気フィードバックを含む放射対流平衡モデルにより、CO2倍増で地表が約2.3℃昇温すると計算。物理モデルによる初の定量評価で、以後の気候モデルの原型となった。\n\n同年代の観測レイヤーではキーリング曲線が10年分の上昇を刻んでおり、理論と観測が初めてかみ合い始めた時期にあたる。真鍋はこの業績を含む研究で2021年にノーベル物理学賞を受賞した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Manabe, S. & Wetherald, R. T. (1967) Thermal Equilibrium of the Atmosphere with a Given Distribution of Relative Humidity. Journal of the Atmospheric Sciences","url":null},{"title":"The Nobel Prize in Physics 2021","url":"https://www.nobelprize.org/prizes/physics/2021/summary/"}]},{"date":"1979-07-01","precision":"month","end_date":null,"type":"point","layer":"科学の発見","title":"チャーニー報告、気候感度を1.5〜4.5℃と推定","summary":"ジュール・チャーニーを長とする米科学アカデミーの委員会が、真鍋らとハンセンらのモデルを比較し、CO2倍増時の昇温を1.5〜4.5℃と評価。「無視できる昇温は考えにくい」と結論し、この推定幅は数十年にわたり基準となった。\n\n同年2月にはWMO主催の第1回世界気候会議がジュネーブで開かれており、科学者コミュニティが政策側へ警告を発し始めた年でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"National Research Council (1979) Carbon Dioxide and Climate: A Scientific Assessment","url":"https://doi.org/10.17226/12181"}]},{"date":"1988-06-23","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"ハンセン、米上院で「温暖化は始まっている」と証言","summary":"記録的猛暑と干ばつに見舞われた夏、NASAのジェームズ・ハンセンが米上院公聴会で、温室効果と観測された昇温の関係を「99%の確度」と述べ、温暖化が高い確度で進行中と証言した。\n\nこの証言は温暖化を米国の政
