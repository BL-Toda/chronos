"type":"point","layer":"深海の生命と発見","title":"アルビン号が熱水噴出孔の生態系を発見","summary":"米国の潜水調査船アルビン号が、ガラパゴス沖の海嶺で熱水噴出孔と、そこに密集するチューブワームや二枚貝の群集を発見した。冷たく暗い深海に、誰も予想しなかった豊かな生態系が広がっていた。\n\n光合成ではなく硫化水素の化学合成を基盤とする**太陽に依存しない生態系**の発見は生命観を塗り替え、生命の起源や地球外生命の研究にも波及した。噴出孔が作る鉱床は、のちに深海採掘(資源・環境と社会レイヤー)の標的ともなっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hydrothermal vent","url":"https://en.wikipedia.org/wiki/Hydrothermal_vent"}]},{"date":"1982-12-10","precision":"day","end_date":null,"type":"point","layer":"資源・環境と社会","title":"国連海洋法条約が採択、深海底は人類の財産に","summary":"国連海洋法条約が採択され、各国の管轄外にある深海底とその鉱物資源を、特定の国に属さない**人類の共同の財産**と定めた。管理機関として国際海底機構(ISA)の設立も定められ、条約は1994年に発効した。\n\nマンガン団塊など深海底資源への期待が高まった時代の産物であり、探査(探査と技術レイヤー)が進むほど「深海は誰のものか」が問われる構図を法として先取りした。2021年以降の採掘ルールをめぐる攻防もこの条約の枠内で起きている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United Nations Convention on the Law of the Sea","url":"https://en.wikipedia.org/wiki/United_Nations_Convention_on_the_Law_of_the_Sea"}]},{"date":"1985-09-01","precision":"day","end_date":null,"type":"point","layer":"探査と技術","title":"タイタニック号の残骸を海底で発見","summary":"バラード率いる米仏合同チームが、水深約3800mの北大西洋の海底でタイタニック号の船体を発見した。曳航式カメラ「アルゴ」が捉えた散乱するボイラーが決め手となった。\n\n無人探査技術の実力を世界に示すと同時に、深海を「歴史が保存される場所」として大衆に印象づけた。調査が米海軍の原子力潜水艦残骸調査の副産物だったことは後年公表された。沈没船を目指す深海観光は、2023年のタイタン事故(資源・環境と社会レイヤー)まで続く系譜の起点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Wreck of the Titanic","url":"https://en.wikipedia.org/wiki/Wreck_of_the_Titanic"}]},{"date":"1989-08-11","precision":"day","end_date":null,"type":"point","layer":"探査と技術","title":"しんかい6500が6527mの潜航記録","summary":"日本の有人潜水調査船しんかい6500が、三陸沖で水深6527mへの潜航に成功した。当時の有人調査船として世界最深の記録であり、以後も稼働する調査船では世界最深級の能力を長く保ち続ける。\n\n日本海溝の調査ではプレート境界の亀裂の直接観察など地震研究に貢献し、熱水噴出域の生物調査(深海の生命と発見レイヤー)でも成果を重ねた。深海探査が一度きりの記録競争から、繰り返し通う科学インフラへ移ったことを示す存在である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"JAMSTEC: 有人潜水調査船しんかい6500","url":null}]},{"date":"1995-03-24","precision":"day","end_date":null,"type":"point","layer":"探査と技術","title":"無人探査機かいこう、最深部10,911mに到達","summary":"JAMSTECの無人探査機かいこうが、チャレンジャー海淵で水深10,911mに到達した。トリエステ号以来35年ぶりの最深部到達であり、無人機としては世界初である。\n\n採取した堆積物からは超深海の微生物が多数見つかり、極限環境生物学(深海の生命と発見レイヤー)に貴重な材料を提供した。人が乗らないからこそ反復調査ができることを示し、**無人機が主役になる深海探査**の時代を開いたが、かいこう自体は2003年に洋上で失われた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"JAMSTEC: 無人探査機かいこう","url":null}]},{"date":"2012-03-26","precision":"day","end_date":null,"type":"point","layer":"探査と技術","title":"キャメロン、52年ぶりの有人最深部到達","summary":"映画監督ジェームズ・キャメロンが、単独操縦の潜水艇ディープシー・チャレンジャーでチャレンジャー海淵の水深10,908mに到達した。有人での最深部到達はトリエステ号以来52年ぶりで、単独潜航としては史上初である。\n\n民間の資金と独自設計による挑戦であり、国家プロジェクトだった深海探査が個人と民間の領域へ移ったことを象徴する。撮影された映像と採取試料は科学チームと共有され、探査と映像文化(資源・環境と社会レイヤー)の結びつきを更新した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Deepsea Challenger","url":"https://en.wikipedia.org/wiki/Deepsea_Challenger"}]},{"date":"2012-07-01","precision":"month","end_date":null,"type":"point","layer":"深海の生命と発見","title":"生きたダイオウイカの深海撮影に世界初成功","summary":"国立科学博物館の窪寺恒己らが、小笠原沖の水深600m超で生きたダイオウイカの動画撮影に成功した。深海を泳ぐ生きた姿の撮影は世界初で、映像は翌年NHKなどで放送され世界的な反響を呼んだ。\n\n何世紀も船乗りの伝説として語られてきた巨大イカが、ようやく生きた姿で記録された。深海生物の眼に配慮した赤色光や発光ルアーなど、生物側の感覚に合わせた撮影手法の成果であり、観察が「捕る」から「そっと見る」へ移る流れを象徴する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国立科学博物館・NHK: 小笠原沖ダイオウイカ撮影(2012年)","url":null}]},{"date":"2017-05-01","precision":"month","end_date":null,"type":"point","layer":"深海の生命と発見","title":"水深8178mで魚類の最深映像記録","summary":"JAMSTECらの調査で、マリアナ海溝の水深8178mを泳ぐシンカイクサウオ属の魚が撮影され、当時の魚類の生息最深映像記録となった。8000m級の海底では、餌に群がる端脚類の大群も確認された。\n\n魚類は浸透圧調整物質の濃度の限界から水深8200〜8400m付近が生息下限と予測されており、この記録は理論限界の実証という意味も持った。記録は2022年、伊豆・小笠原海溝の水深8336mで撮影されたクサウオ類により更新されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"JAMSTEC: マリアナ海溝における魚類の世界最深映像記録(2017年)","url":null}]},{"date":"2018-12-19","precision":"day","end_date":"2019-08-24","type":"period","layer":"探査と技術","title":"ファイブ・ディープス探検、五大洋最深部を制覇","summary":"投資家ヴェスコボが潜水艇リミティング・ファクターで、五大洋すべての最深部に潜る「ファイブ・ディープス探検」を実施し完遂した。2019年4月にはチャレンジャー海淵で潜航深度10,928mを記録したと発表した。\n\n何度でも潜れる商用認証を得た潜水艇の登場で、最深部は「一度きりの到達点」から繰り返し通える場所へ変わった。ただし発表された深度と過去の記録の差は計測誤差の範囲内であり、「最深記録の更新」という位置づけには議論がある。","detail":null,"credibility":"disputed","credibility_note":"潜航深度10,928mは計測誤差を伴う値で、トリエステ号やキャメロンの記録との差は誤差範囲内とされ、記録更新の位置づけに議論がある。","sources":[{"title":"Wikipedia: Five Deeps Expedition","url":"https://en.wikipedia.org/wiki/Five_Deeps_Expedition"}]},{"date":"2020-03-01","precision":"month","end_date":null,"type":"point","layer":"資源・環境と社会","title":"プラスチックの名を持つ超深海の新種","summary":"マリアナ海溝の水深6900m超で採集された端脚類の新種が、体内からマイクロプラスチックが検出されたことにちなみ「ユーリテネス・プラスティクス」と命名された。\n\n人類が数回しか到達していない**最深部にまで届いたプラスチック**という事実は、深海がもはや手つかずの領域ではないことを突きつけた。命名は研究者による汚染への警告として意図されており、発見の年表(深海の生命と発見レイヤー)が環境問題の年表と重なり始めたことを象徴する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Zootaxa: Eurythenes plasticus sp. nov. (Weston et al., 2020)","url":null}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"資源・環境と社会","title":"ナウルが深海採掘の「2年ルール」を発動","summary":"太平洋の島国ナウルが、後援する企業による深海採掘の計画を念頭に、国際海底機構(ISA)へ「2年ルール」の適用を通告した。2年以内に採掘規則が完成しなくても、採掘申請の審査が始まりうる状況が生まれた。\n\n電気自動車の電池金属の需要増を背景に、1982年の海洋法条約が定めた「人類の共同の財産」の商業利用が初めて現実の日程に載った。科学者からは、熱水噴出孔などの生態系(深海の生命と発見レイヤー)への不可逆な影響を懸念する声が相次いだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Deep sea mining","url":"https://en.wikipedia.org/wiki/Deep_sea_mining"}]},{"date":"2023-06-01","precision":"month","end_date":null,"type":"point","layer":"探査と技術","title":"海底地図化プロジェクト、進捗25%に","summary":"海底地形の全容解明を目指す国際プロジェクト「Seabed 2030」が、世界の海底の約25%が現代的な水準で測深済みになったと発表した。プロジェクト開始時の2017年には約6%だった。\n\n月や火星の表面より粗くしか知られていない海底の地図は、探査・資源・環境(資源・環境と社会レイヤー)のあらゆる議論の土台である。2030年の完全地図化という目標には各国と民間の測深データ提供が不可欠で、データを共有する仕組みづくりが技術と並ぶ課題になっている。","detail":null,"credibility":"unverified","credibility_note":"進捗率はプロジェクト側の自己発表値であり、「マッピング済み」とする解像度基準の定義によって数値は変わりうる。","sources":[{"title":"The Nippon Foundation-GEBCO Seabed 2030 Project 進捗発表","url":null}]},{"date":"2023-06-18","precision":"day","end_date":null,"type":"point","layer":"資源・環境と社会","title":"潜水艇タイタンが圧壊、乗員5人死亡","summary":"タイタニック号の見学ツアーへ向かった民間潜水艇タイタンが潜航中に圧壊し、乗員5人全員が死亡した。船体には第三者認証を受けていない炭素繊維複合材の耐圧殻が使われていた。\n\n深海観光という新しい市場における安全規制の空白を露呈し、業界の認証制度と冒険的な民間探査の関係が問い直された。1985年のタイタニック発見(探査と技術レイヤー)に始まる大衆的な深海への憧れが、最悪の形で裏返った事故である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Titan submersible implosion","url":"https://en.wikipedia.org/wiki/Titan_submersible_implosion"}]},{"date":"2023-07-01","precision":"month","end_date":null,"type":"point","layer":"資源・環境と社会","title":"深海採掘の規則できず、対立が鮮明に","summary":"国際海底機構の理事会・総会は、期限とされた時期までに商業採掘の規則を完成できず、採択目標を先送りした。一方でモラトリアム(一時停止)や予防的中断を支持する国は20か国を超えたとされ、推進派との対立が鮮明になった。\n\nナウルの通告から2年が経過し、規則がないまま採掘申請が可能になりうる異例の局面で、**採掘か保全か**の対立が続く。深海の科学的知見の少なさ(深海の生命と発見レイヤー)そのものが、判断を先送りさせる理由になっている。","detail":null,"credibility":"unverified","credibility_note":"モラトリアム等を支持する国の数は環境団体や報道による集計で20か国超とされるが、立場の分類の仕方により数え方が異なる。","sources":[{"title":"国際海底機構(ISA)第28回会期に関する報道・IISD Earth Negotiations Bulletin","url":null}]}]},{"slug":"science-dinosaur-research","title":"恐竜研究の進化","description":"最初の化石記載から羽毛恐竜、絶滅論争、化石の競売まで。発見・学説・大衆文化の3層を重ね、恐竜像が「愚鈍な爬虫類」から「鳥の祖先」へ塗り替えられる200年を追う。","category":"science-nature","language":"ja","start_year":1824,"end_year":2020,"layers":[{"name":"発見と化石","color":"green"},{"name":"学説の転換","color":"blue"},{"name":"大衆文化と市場","color":"pink"}],"events":[{"date":"1824-02-20","precision":"day","end_date":null,"type":"point","layer":"発見と化石","title":"バックランドがメガロサウルスを記載","summary":"オックスフォード大学のバックランドがロンドン地質学会でメガロサウルスを報告し、のちに恐竜と呼ばれることになる動物として世界で初めて学名が与えられた。\n\n当時は「巨大なトカゲ」と理解され、恐竜という枠組み自体がまだ存在しなかった。顎と歯など断片からの記載であり、**化石の断片から動物の姿を復元する**という古生物学の方法の出発点でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Megalosaurus","url":"https://en.wikipedia.org/wiki/Megalosaurus"}]},{"date":"1842-01-01","precision":"year","end_date":null,"type":"point","layer":"学説の転換","title":"オーウェンが「恐竜(Dinosauria)」を命名","summary":"解剖学者オーウェンが、メガロサウルス、イグアノドン、ヒラエオサウルスの3属を、直立した四肢を持つ独自のグループとしてまとめ、「恐ろしく大きなトカゲ」を意味するDinosauriaと命名した。\n\n個別の化石(発見と化石レイヤー)に共通する体の設計を見抜いた概念の発明であり、この命名によって初めて「恐竜」は研究対象になった。オーウェンがこの枠組みを進化論への反証として構想していたという皮肉も残る。","detail":null,"credibility":"disputed","credibility_note":"命名の年は、もととなった学会報告の年(1841年)と報告書の刊行年(1842年)のどちらを取るかで資料により記載が分かれる。","sources":[{"title":"Wikipedia: Richard Owen","url":"https://en.wikipedia.org/wiki/Richard_Owen"}]},{"date":"1853-12-31","precision":"day","end_date":null,"type":"point","layer":"大衆文化と市場","title":"イグアノドン模型の中での晩餐会","summary":"ロンドンの水晶宮公園に展示される実物大恐竜模型の完成を前に、彫刻家ホーキンスとオーウェンらが、未完成のイグアノドン模型の鋳型の中で約20人の晩餐会を開いた。\n\n翌年公開された模型群は世界初の恐竜テーマの常設展示となり、恐竜を**科学者だけのものから見世物へ**と押し広げた。復元姿勢は現在の知見と大きく異なるが、模型は歴史遺産として今も同じ公園に保存されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Crystal Palace Dinosaurs","url":"https://en.wikipedia.org/wiki/Crystal_Palace_Dinosaurs"}]},{"date":"1861-01-01","precision":"year","end_date":null,"type":"point","layer":"発見と化石","title":"始祖鳥の化石が発見される","summary":"ドイツ・ゾルンホーフェンの石灰岩から、羽毛の印象と爬虫類的な骨格を併せ持つ始祖鳥(アーケオプテリクス)の化石が発見され、標本は大英博物館が購入した。\n\n『種の起源』刊行のわずか2年後に現れた「中間的な生物」は、進化論争の象徴として即座に注目された。恐竜と鳥を結ぶ議論はここに始まり、1世紀後のデイノニクスの記載(学説の転換レイヤー)で本格的に再燃する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Archaeopteryx","url":"https://en.wikipedia.org/wiki/Archaeopteryx"}]},{"date":"1877-01-01","precision":"year","end_date":"1892-01-01","type":"period","layer":"発見と化石","title":"コープ対マーシュ、「化石戦争」の時代","summary":"米国の古生物学者コープとマーシュが化石の発見を競い、発掘隊の引き抜きや発掘地の妨害まで伴う激しい争いを繰り広げた。両者あわせて130種以上の恐竜を命名し、トリケラトプスやステゴサウルスもこの時期に見つかった。\n\n私財を投じた競争は科学を一気に加速させると同時に、拙速な記載による分類の混乱も残した。**発見の量が学問を作り、競争がそれを歪める**という構図の原型である。","detail":null,"credibility":"disputed","credibility_note":"「化石戦争」の開始・終了をいつと見るかは諸説あり、両者の対立自体は1870年代前半から続いていた。","sources":[{"title":"Wikipedia: Bone Wars","url":"https://en.wikipedia.org/wiki/Bone_Wars"}]},{"date":"1902-01-01","precision":"year","end_date":null,"type":"point","layer":"発見と化石","title":"ブラウンがティラノサウルスを発見","summary":"アメリカ自然史博物館のバーナム・ブラウンがモンタナ州ヘルクリークの地層で大型肉食恐竜の部分骨格を発掘した。1905年にオズボーンがティラノサウルス・レックスと命名する。\n\n「暴君トカゲの王」という命名と巨大骨格の展示は博物館の集客力を証明し、恐竜が博物館の看板になる時代を開いた。T. rexは以後1世紀にわたり、映画から競売まで大衆文化と市場レイヤーの主役であり続ける。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Barnum Brown","url":"https://en.wikipedia.org/wiki/Barnum_Brown"}]},{"date":"1969-01-01","precision":"year","end_date":null,"type":"point","layer":"学説の転換","title":"オストロムがデイノニクスを記載","summary":"イェール大学のオストロムが、大きな鉤爪を持つ軽量で俊敏な肉食恐竜デイノニクスを記載し、恐竜が活発で代謝の高い動物だった可能性を骨格の証拠から論じた。\n\n「のろまな爬虫類」という半世紀来の常識を覆し、始祖鳥との骨格の類似から鳥類の恐竜起源説も再提起した。**恐竜ルネサンス**と呼ばれる研究の刷新はこの記載を起点とし、教え子のバッカーが論争の顔となっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Deinonychus","url":"https://en.wikipedia.org/wiki/Deinonychus"}]},{"date":"1975-04-01","precision":"month","end_date":null,"type":"point","layer":"学説の転換","title":"バッカー「恐竜ルネサンス」を発表","summary":"バッカーがサイエンティフィック・アメリカン誌に記事「恐竜ルネサンス」を寄稿し、恐竜温血説と鳥類の恐竜起源説を一般読者に向けて鮮烈に主張した。\n\n学界内の論争を大衆に開いた記事であり、活発でしなやかな恐竜像は後の映画『ジュラシック・パーク』(大衆文化と市場レイヤー)の描写を用意した。温血か冷血かという単純な二分法はその後修正されていくが、議論の枠組みを変えた影響は大きい。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Dinosaur renaissance","url":"https://en.wikipedia.org/wiki/Dinosaur_renaissance"}]},{"date":"1980-06-06","precision":"day","end_date":null,"type":"point","layer":"学説の転換","title":"アルバレス父子が隕石衝突絶滅説を発表","summary":"物理学者ルイス・アルバレスと地質学者ウォルターの父子らが、白亜紀末の地層境界に高濃度のイリジウムを見いだし、小惑星衝突が恐竜を含む大量絶滅を引き起こしたとサイエンス誌で提唱した。\n\n天文学・地質学・古生物学をまたぐ仮説は当初強い抵抗を受けたが、分野横断で証拠を検証する新しい研究様式を持ち込んだ。決定的な物証となるクレーターの特定(発見と化石レイヤーの地質版)は11年後を待つことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Alvarez hypothesis","url":"https://en.wikipedia.org/wiki/Alvarez_hypothesis"}]},{"date":"1990-08-12","precision":"day","end_date":null,"type":"point","layer":"発見と化石","title":"史上最も完全なT. rex「スー」発見","summary":"化石ハンターのスー・ヘンドリクソンがサウスダコタ州で、骨格の約9割が残るティラノサウルスを発見した。標本は発見者にちなみ「スー」と名付けられた。\n\n保存状態のよさから研究価値は際立っていたが、発掘地の権利をめぐり連邦政府・先住民部族・地主・発掘団体の間で法廷闘争となり、化石は連邦当局に差し押さえられた。**化石は誰のものか**という問いが表面化し、7年後の競売につながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sue (dinosaur)","url":"https://en.wikipedia.org/wiki/Sue_(dinosaur)"}]},{"date":"1991-09-01","precision":"month","end_date":null,"type":"point","layer":"学説の転換","title":"チクシュルーブ・クレーターを衝突痕と同定","summary":"ヒルデブランドらが、メキシコ・ユカタン半島の地下に埋もれた直径約180kmの円形構造を、白亜紀末の小惑星衝突の痕跡として地質学誌ジオロジーで報告した。\n\n1980年の衝突説(同じ学説の転換レイヤー)に欠けていた「現場」がそろい、仮説は定説へ大きく前進した。構造の発見に石油会社の探査データが決め手となった点も、産業と科学の意外な接点として語られる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Chicxulub crater","url":"https://en.wikipedia.org/wiki/Chicxulub_crater"}]},{"date":"1993-06-11","precision":"day","end_date":null,"type":"point","layer":"大衆文化と市場","title":"映画『ジュラシック・パーク』公開","summary":"スピルバーグ監督の『ジュラシック・パーク』が米国で公開され、当時の世界興行収入記録を塗り替えた。CGとアニマトロニクスによる恐竜は「本物らしさ」の基準を一変させた。\n\n描かれた俊敏で賢い恐竜像は恐竜ルネサンス(学説の転換レイヤー)の成果を反映したもので、オストロムらの研究が下敷きになっている。この映画を見て古生物学者を志した世代が、2000年代以降の羽毛恐竜研究などを担っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Jurassic Park (film)","url":"https://en.wikipedia.org/wiki/Jurassic_Park_(film)"}]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"発見と化石","title":"中国で羽毛恐竜シノサウロプテリクスを発見","summary":"中国遼寧省の約1億2500万年前の地層から、原始的な羽毛の痕跡をまとう小型獣脚類シノサウロプテリクスが報告された。飛べない恐竜が羽毛を持っていたことを示す初の直接証拠となった。\n\n鳥は恐竜の子孫という仮説(学説の転換レイヤー)に決定的な物証を与え、以後、遼寧の熱河層群からは羽毛恐竜の発見が相次ぐ。**羽毛は鳥の発明ではなかった**という事実が、恐竜の復元像を根本から書き換えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sinosauropteryx","url":"https://en.wikipedia.org/wiki/Sinosauropteryx"}]},{"date":"1997-10-04","precision":"day","end_date":null,"type":"point","layer":"大衆文化と市場","title":"「スー」が競売で約836万ドルで落札","summary":"法廷闘争の末に競売へかけられたスーを、シカゴのフィールド自然史博物館がディズニーやマクドナルドなどの資金協力を得て約836万ドルで落札した。化石の取引額として桁違いの記録だった。\n\n重要標本が公的機関に残った点では安堵を呼んだ一方、化石に巨額の市場価値がつく前例は商業発掘を刺激するという懸念も現実のものにした。この構図は2020年の「スタン」競売でさらに極端な形で繰り返される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sue (dinosaur)","url":"https://en.wikipedia.org/wiki/Sue_(dinosaur)"}]},{"date":"2005-03-25","precision":"day","end_date":null,"type":"point","layer":"学説の転換","title":"T. rex化石から軟組織様の構造を報告","summary":"シュヴァイツァーらが、約6800万年前のティラノサウルスの大腿骨から、弾力を保った血管様の構造やコラーゲン様タンパク質を回収したとサイエンス誌で報告した。\n\n「化石に有機物は残らない」という前提を揺るがし、分子レベルで古生物を調べる分子古生物学を活気づけた。ただし汚染や生物膜による偽陽性の可能性も指摘されており、何がどこまで残るのかの検証は現在も続いている。","detail":null,"credibility":"disputed","credibility_note":"軟組織様構造やコラーゲンの検出については、汚染や細菌由来の生物膜による偽陽性の可能性が指摘され、解釈をめぐる議論が続いている。","sources":[{"title":"Schweitzer et al., Science 307: Soft-Tissue Vessels and Cellular Preservation in Tyrannosaurus rex (2005)","url":null}]},{"date":"2010-01-01","precision":"month","end_date":null,"type":"point","layer":"学説の転換","title":"化石から恐竜の「色」を初めて推定","summary":"張福成らが、羽毛化石に残るメラノソーム(色素を作る細胞小器官)の形状から、シノサウロプテリクスが赤褐色の縞模様の尾を持っていたと推定し、ネイチャー誌に発表した。\n\n想像で塗られてきた恐竜の体色が**証拠から推定できる対象**へ変わった転換点である。1996年の羽毛発見(発見と化石レイヤー)から14年、標本の微細構造まで読み取る技術の進歩が、復元画の常識を変えた。","detail":null,"credibility":"unverified","credibility_note":"復元される色はメラノソームの形状と現生鳥類との対応関係に基づく推定であり、部位や保存状態によって確度が異なる。","sources":[{"title":"Zhang et al., Nature 463: Fossilized melanosomes and the colour of Cretaceous dinosaurs and birds (2010)","url":null}]},{"date":"2014-09-11","precision":"day","end_date":null,"type":"point","layer":"学説の転換","title":"スピノサウルス半水生説の提唱","summary":"イブラヒムらがモロッコの新標本に基づき、スピノサウルスが短い後肢と密な骨を持つ半水生の恐竜だったとサイエンス誌で発表した。「恐竜に水生の種はいない」という長年の通説への挑戦だった。\n\nその後もひれ状の尾の発見と、遊泳能力を疑う解析が交互に発表され、論争は現在進行形である。断片的な化石(発見と化石レイヤー)から生態をどこまで復元できるかという、この分野の方法論そのものが試されている。","detail":null,"credibility":"disputed","credibility_note":"半水生説には骨密度や遊泳能力の解析からの異論があり、水中を泳いだのか水辺で待ち伏せたのかは決着していない。","sources":[{"title":"Wikipedia: Spinosaurus","url":"https://en.wikipedia.org/wiki/Spinosaurus"}]},{"date":"2020-10-06","precision":"day","end_date":null,"type":"point","layer":"大衆文化と市場","title":"T. rex「スタン」が約3,180万ドルで落札","summary":"クリスティーズの競売で、ティラノサウルス骨格「スタン」が手数料込み約3,180万ドルで落札され、化石の落札額の記録をおよそ4倍に更新した。落札者は当初明かされなかった。\n\n後にアブダビに建設中の自然史博物館へ収蔵されることが判明したが、研究上重要な標本が市場で取引される状況への懸念が改めて示された。1997年のスー以来の**科学と市場の緊張**が、より大きな金額で反復されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Stan (dinosaur)","url":"https://en.wikipedia.org/wiki/Stan_(dinosaur)"}]}]},{"slug":"science-dna-to-editing","title":"DNAから遺伝子編集まで","description":"1869年の核酸発見からCRISPR治療の承認まで。生命の設計図をめぐる発見と理論、それを操作する技術、そして社会がどう線を引いてきたかの3層を重ね、150年の歩みを一望する。","category":"science-nature","language":"ja","start_year":1869,"end_year":2025,"layers":[{"name":"発見と理論","color":"blue"},{"name":"技術と応用","color":"green"},{"name":"倫理と制度","color":"purple"}],"events":[{"date":"1869-01-01","precision":"year","end_date":null,"type":"point","layer":"発見と理論","title":"ミーシャー、細胞核から「ヌクレイン」を単離","summary":"スイスの医師ミーシャーがテュービンゲンの実験室で包帯の膿から白血球を集め、その核からリンを多く含むタンパク質とは異なる酸性物質を単離し、「ヌクレイン」と命名した。後に核酸（DNA）と呼ばれる物質の最初の記録である。\n\nただし当時、遺伝の担い手はタンパク質と考えられており、DNAが遺伝物質だと確立されるのは75年後の1944年まで待つことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Dahm, R. (2005) Friedrich Miescher and the discovery of DNA. Developmental Biology","url":"https://doi.org/10.1016/j.ydbio.2004.11.028"}]},{"date":"1944-02-01","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"エイブリーら、DNAが形質転換の本体であると報告","summary":"エイブリー、マクラウド、マッカーティが、肺炎球菌の形質転換を起こす物質がタンパク質でなくDNAであることを精製実験で示した。1928年のグリフィスの形質転換実験を出発点に形質転換因子を精製し、DNA分解酵素でのみ活性が失われることを突き止めた。\n\n当初は懐疑的な受け止めもあったが、1952年のハーシーとチェイスの実験で補強され、翌年の二重らせん構造の解明へと道が開かれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Avery, O. T., MacLeod, C. M. & McCarty, M. (1944) Studies on the chemical nature of the substance inducing transformation of pneumococcal types. Journal of Experimental Medicine","url":"https://doi.org/10.1084/jem.79.2.137"}]},{"date":"1953-04-25","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"ワトソンとクリック、DNAの二重らせん構造を発表","summary":"ワトソンとクリックがNature誌にDNAの二重らせんモデルを発表し、塩基対の相補性が複製の仕組みを示唆すると指摘した。同じ号にはウィルキンス、フランクリンらのX線回折データの論文が並んで掲載された。\n\nフランクリンの「写真51」を含むデータがモデル構築に用いられた経緯と功績の配分は今も議論が続く。1962年のノーベル賞はワトソン、クリック、ウィルキンスに贈られたが、フランクリンは1958年に没していた。この構造理解が遺伝暗号解読と組換えDNA技術の前提となった。","detail":null,"credibility":"disputed","credibility_note":"構造自体は確立しているが、フランクリンのデータ利用の経緯と各人の貢献の配分については歴史家・科学者の間で評価が分かれる。","sources":[{"title":"Watson, J. D. & Crick, F. H. C. (1953) Molecular Structure of Nucleic Acids: A Structure for Deoxyribose Nucleic Acid. Nature","url":"https://doi.org/10.1038/171737a0"}]},{"date":"1961-01-01","precision":"year","end_date":"1966-12-31","type":"period","layer":"発見と理論","title":"遺伝暗号の解読","summary":"1961年、ニーレンバーグとマッタイが合成RNA（ポリU）からフェニルアラニンの鎖ができることを示し、最初のコドンを決定。コラナ、ホリーらの研究と競争を経て、1966年までに64通りのコドンとアミノ酸の対応表が完成した。\n\nDNAの塩基配列とタンパク質を結ぶ「翻訳規則」の確定により、配列を読めば意味が分かるという前提が成立し、1970年代の配列決定法と組換え技術の価値を決定づけた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nirenberg, M. W. & Matthaei, J. H. (1961) The dependence of cell-free protein synthesis in E. coli upon naturally occurring or synthetic polyribonucleotides. PNAS","url":"https://doi.org/10.1073/pnas.47.10.1588"},{"title":"The Nobel Prize in Physiology or Medicine 1968","url":"https://www.nobelprize.org/prizes/medicine/1968/summary/"}]},{"date":"1973-11-01","precision":"month","end_date":null,"type":"point","layer":"技術と応用","title":"コーエンとボイヤー、組換えDNA技術を確立","summary":"コーエンとボイヤーが、制限酵素で切断したDNA断片をプラスミドにつなぎ、大腸菌内で複製させることに成功。異なる生物由来のDNAを人工的につなぎ増やす、遺伝子工学の出発点となった。\n\nこの技術は翌年には科学者自身が実験の一時停止を呼びかけるほどの衝撃を与え、1975年のアシロマ会議につながった。応用面では1976年のジェネンテック設立と1982年のヒトインスリン承認へ直結し、1980年に成立したコーエン・ボイヤー特許は大学発ライセンスの原型となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Cohen, S. N., Chang, A. C. Y., Boyer, H. W. & Helling, R. B. (1973) Construction of Biologically Functional Bacterial Plasmids In Vitro. PNAS","url":"https://doi.org/10.1073/pnas.70.11.3240"}]},{"date":"1975-02-24","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"アシロマ会議、組換えDNA研究の自主規制指針を策定","summary":"1974年にバーグらが呼びかけた実験モラトリアムを受け、カリフォルニア州アシロマに科学者約140人が集まり、組換えDNA実験のリスク区分と物理的・生物学的封じ込め基準を自ら定めた。\n\nこの枠組みは翌1976年の米NIHガイドラインの基礎となり、日本でも1979年に組換えDNA実験指針が制定された。**技術の確立から2年で制度が追いついた**研究者主導の規制の先例として、後の遺伝子編集をめぐる議論でも繰り返し参照される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Berg, P., Baltimore, D., Brenner, S., Roblin, R. O. & Singer, M. F. (1975) Summary statement of the Asilomar Conference on Recombinant DNA Molecules. PNAS","url":"https://doi.org/10.1073/pnas.72.6.1981"}]},{"date":"1980-06-16","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"米最高裁、遺伝子操作した生物の特許を認める","summary":"ダイヤモンド対チャクラバーティ事件で米最高裁が、石油分解能力を持たせた細菌をめぐり、人が作り出した微生物は特許の対象になりうると5対4で判断。「太陽の下の人工物は何でも」特許になりうるとした。\n\n判決はバイオテクノロジー産業の投資を後押しし、同年12月にはコーエン・ボイヤー特許が成立、同じ年にジェネンテックが株式公開している。**技術と資本が制度によって結びついた年**であり、後のヒト遺伝子特許やCRISPR特許紛争の遠因ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Diamond v. Chakrabarty, 447 U.S. 303 (1980)","url":"https://supreme.justia.com/cases/federal/us/447/303/"}]},{"date":"1982-10-01","precision":"month","end_date":null,"type":"point","layer":"技術と応用","title":"遺伝子組換えヒトインスリンを米FDAが承認","summary":"大腸菌に作らせたヒトインスリン「ヒューマリン」を米FDAが承認し、組換えDNA技術による初の医薬品が実用化。ジェネンテックが開発しイーライリリーが製造し、それまでのブタ・ウシ由来インスリンに代わって供給の安定と免疫反応の低減をもたらした。\n\n1973年の技術確立から9年、1975年のアシロマ会議で定められた封じ込め基準のもとで開発が進み、規制と産業化が両立しうることを示した。以後、成長ホルモンやワクチンなど組換え医薬品が続いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Genentech: Press release, First recombinant DNA drug approved by FDA (1982)","url":null},{"title":"FDA: Celebrating a Milestone: FDA's Approval of First Genetically-Engineered Product","url":null}]},{"date":"1985-12-20","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"PCR法の論文が発表される","summary":"マリスの着想に基づくシータス社の研究チームが、DNAの特定領域を試験管内で指数的に増幅するPCR法をScience誌に発表。1988年の耐熱性DNAポリメラーゼの導入で実用技術となった。\n\n微量DNAの増幅は診断・法科学・ゲノム計画の全てを支え、マリスは1993年にノーベル化学賞を受賞した。ただし増幅の原理は1971年にクレッペらが記述しており、着想の先取権と貢献の配分には議論がある。","detail":null,"credibility":"disputed","credibility_note":"基本原理は1971年のクレッペらの論文に先例があり、マリス個人の着想とチームの貢献の配分についても関係者の証言が食い違う。","sources":[{"title":"Saiki, R. K. et al. (1985) Enzymatic amplification of β-globin genomic sequences and restriction site analysis for diagnosis of sickle cell anemia. Science","url":"https://doi.org/10.1126/science.2999980"},{"title":"The Nobel Prize in Chemistry 1993","url":"https://www.nobelprize.org/prizes/chemistry/1993/summary/"}]},{"date":"1990-09-14","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"承認された初のヒト遺伝子治療臨床試験を実施","summary":"米NIHでアンダーソン、ブレーズらのチームが、ADA欠損症の4歳女児に対し、レトロウイルスベクターで正常遺伝子を導入したT細胞を戻す、承認された初のヒト遺伝子治療を実施した。\n\n患者は長期にわたり良好な経過をたどったが、酵素補充療法（PEG-ADA）を併用していたため遺伝子治療単独の効果を切り分けることは難しい。同年10月にはヒトゲノム計画が始動し、「読む」計画と「直す」試みが同時に幕を開けた。分野は1999年のゲルシンガー事件で一度大きく後退する。","detail":null,"credibility":"unverified","credibility_note":"臨床的改善への遺伝子治療の寄与度は、併用された酵素補充療法の影響を分離できないため確定していない。","sources":[{"title":"Blaese, R. M. et al. (1995) T Lymphocyte-Directed Gene Therapy for ADA-SCID: Initial Trial Results After 4 Years. Science","url":"https://doi.org/10.1126/science.270.5235.475"}]},{"date":"1990-10-01","precision":"month","end_date":"2003-04-14","type":"period","layer":"発見と理論","title":"ヒトゲノム計画","summary":"米英日仏独中の国際共同で約30億塩基対のヒトゲノムを解読する計画が始動。1977年のサンガー法を自動化・大規模化して進められ、日本は理化学研究所などが21番・18番染色体などを担当した。\n\n1998年にセレラ社が参入して官民の競争となり、2000年6月に草案、2001年2月に論文発表を経て、二重らせん発表50周年に合わせた2003年4月、当初の15年計画を前倒しして完了が宣言された。全塩基配列という「地図」が、後の疾患遺伝子探索とゲノム編集の標的設計を可能にした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"National Human Genome Research Institute: The Human Genome Project","url":"https://www.genome.gov/human-genome-project"},{"title":"International Human Genome Sequencing Consortium (2001) Initial sequencing and analysis of the human genome. Nature","url":"https://doi.org/10.1038/35057062"}]},{"date":"1999-09-17","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"遺伝子治療の臨床試験で被験者ジェシー・ゲルシンガーが死亡","summary":"ペンシルベニア大学の遺伝子治療臨床試験で、アデノウイルスベクター投与後に18歳の被験者ジェシー・ゲルシンガーが死亡。調査で被験者選定基準の逸脱や有害事象報告の不備、研究者の利益相反が指摘され、FDAは同大学の試験を停止した。\n\n1990年の初試験以来の期待は一転し、投資と臨床試験数は数年にわたり落ち込んだ。**被験者保護と利益相反開示の制度強化**につながり、2010年代の遺伝子治療復活と2018年のゲノム編集ベビー問題の際にも安全性議論の原点として参照された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wilson, J. M. (2009) Lessons learned from the gene therapy trial for ornithine transcarbamylase deficiency. Molecular Genetics and Metabolism","url":null},{"title":"FDA (2000) Warning letter to the Institute for Human Gene Therapy, University of Pennsylvania","url":null}]},{"date":"2000-06-26","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"ヒトゲノム草案を国際計画とセレラ社が共同発表","summary":"クリントン米大統領とブレア英首相の立ち会いで、公的な国際計画と民間セレラ社がヒトゲノム草案の完成を同時に発表。1998年に参入したセレラ社が全ゲノムショットガン法で公的計画を追い上げ、政治的仲介で「引き分け」の共同発表となった。\n\n翌2001年2月、Nature誌とScience誌に別々の論文が掲載された。ヒト遺伝子数が当初の10万前後の予想を大きく下回る2万〜2万5千程度と判明したのはこの成果からで、遺伝子の数より制御の複雑さが問われる時代に入った。","detail":null,"credibility":"disputed","credibility_note":"草案の完成度（カバー率）と両陣営の貢献の大きさについては公的計画とセレラ社の主張が食い違い、セレラ社が公的データを利用した程度も論争となった。","sources":[{"title":"International Human Genome Sequencing Consortium (2001) Initial sequencing and analysis of the human genome. Nature","url":"https://doi.org/10.1038/35057062"},{"title":"Venter, J. C. et al. (2001) The Sequence of the Human Genome. Science","url":"https://doi.org/10.1126/science.1058040"}]},{"date":"2012-06-28","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"ダウドナとシャルパンティエ、CRISPR-Cas9を編集ツールとして提示","summary":"ダウドナとシャルパンティエらがScience誌のオンライン公開論文で、細菌の獲得免疫機構CRISPRを、Cas9とガイドRNAの組み合わせだけで任意のDNA配列を切断できる汎用ツールに転用できることを試験管内で実証した。\n\n翌2013年1月にはチャン、チャーチらがヒト細胞での編集を報告し、以後、技術は爆発的に普及する。ジンクフィンガーやTALENに比べ設計が容易で安価な点が決定的で、同時に特許紛争と倫理議論の火種にもなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Jinek, M. et al. (2012) A Programmable Dual-RNA-Guided DNA Endonuclease in Adaptive Bacterial Immunity. Science","url":"https://doi.org/10.1126/science.1225829"},{"title":"Cong, L. et al. (2013) Multiplex Genome Engineering Using CRISPR/Cas Systems. Science","url":"https://doi.org/10.1126/science.1231143"}]},{"date":"2015-12-01","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"第1回ヒトゲノム編集国際サミット開催","summary":"米英中の科学アカデミーが第1回ヒトゲノム編集国際サミットをワシントンで開催。基礎研究は容認しつつ、生殖細胞系列の臨床応用は安全性と社会的合意が得られるまで行うべきでなく「現時点で無責任」との声明を発表した。\n\n同年4月に中国のチームが受精しない三倍体ヒト胚での編集実験を報告し、是非が急浮上したことを受けた対応で、**CRISPR論文からわずか3年半でのルール形成**だった。しかし2018年の香港での第2回サミット直前に、その線を越える事例が公表される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"National Academies of Sciences, Engineering, and Medicine (2015) On Human Gene Editing: International Summit Statement","url":null},{"title":"Liang, P. et al. (2015) CRISPR/Cas9-mediated gene editing in human tripronuclear zygotes. Protein & Cell","url":null}]},{"date":"2017-02-15","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"米特許審判部、CRISPR特許紛争でブロード研究所側を支持","summary":"真核細胞でのCRISPR-Cas9利用に関する特許について、米特許審判部がカリフォルニア大学側の主張を退けブロード研究所側の特許を維持。2012年のダウドナらの発表と2013年のチャンらの実証のどちらが発明にあたるかが争点となった。\n\n米国では2022年にも審判部がブロード側に有利な判断を示した一方、欧州特許庁では判断が異なり、地域ごとに権利関係が分かれている。ライセンス構造の複雑さは治療開発企業の契約に影響し、2023年の治療承認まで続く背景となった。","detail":null,"credibility":"disputed","credibility_note":"発明の先取権をめぐる争いは控訴や地域ごとの判断の違いが続いており、最終的な権利関係は確定していない。","sources":[{"title":"USPTO Patent Trial and Appeal Board, Interference No. 106,048 (Decision on Motions, Feb. 15, 2017)","url":null},{"title":"Nature News (2017) Broad Institute wins bitter battle over CRISPR patents","url":null}]},{"date":"2018-11-26","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"賀建奎、ゲノム編集した双子の誕生を公表","summary":"中国の研究者・賀建奎が、CRISPRでCCR5遺伝子を改変した受精卵から双子が生まれたと香港での第2回ヒトゲノム編集国際サミット直前に公表し、国際的な非難を招いた。2015年の第1回サミット声明が「無責任」とした生殖細胞系列の臨床応用が実際に行われたことが明らかになった。\n\n中国当局は違法な医療行為として2019年12月に懲役3年の判決を下し、WHOは登録制度と各国規制の整備を勧告。**1975年のアシロマ以来の「研究者の自主規制」モデルの限界**が問われた事件でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nature News (2018) Genome-edited baby claim provokes international outcry","url":"https://doi.org/10.1038/d41586-018-07545-0"},{"title":"新華社 (2019-12-30) 「基因編輯嬰兒」案一審宣判","url":null}]},{"date":"2020-10-07","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"シャルパンティエとダウドナにノーベル化学賞","summary":"CRISPR-Cas9による「遺伝子のはさみ」の開発が評価され、シャルパンティエとダウドナにノーベル化学賞。女性2人のみの共同受賞として初であり、2012年の論文発表から8年という異例の早さでの受賞は技術の影響の大きさを示した。\n\n同じ時期、技術レイヤーでは鎌状赤血球症へのCRISPR治療の臨床試験結果が報告され、制度レイヤーでは特許紛争と生殖細胞系列編集の国際ルール作りが続いていた。受賞対象は基礎的発見であり、真核細胞での応用をめぐる特許の争点とは別に評価された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Chemistry 2020","url":"https://www.nobelprize.org/prizes/chemistry/2020/summary/"}]},{"date":"2023-11-16","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"世界初のCRISPR治療「カスジェビー」を英国が承認","summary":"鎌状赤血球症とβサラセミアに対するCRISPR-Cas9を用いた世界初の治療「カスジェビー」を英MHRAが承認し、12月には米FDAも承認した。患者自身の造血幹細胞を体外で編集し胎児型ヘモグロビンの産生を回復させる治療で、バーテックス社とCRISPRセラピューティクス社が開発した。\n\n2012年の論文から11年で臨床承認に至った一方、価格は1回あたり約220万ドルとされ、**患者数の多いアフリカなどでの利用可能性**が新たな倫理・制度の課題となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FDA (2023-12-08) FDA Approves First Gene Therapies to Treat Patients with Sickle Cell Disease","url":"https://www.fda.gov/news-events/press-announcements/fda-approves-first-gene-therapies-treat-patients-sickle-cell-disease"},{"title":"MHRA (2023-11-16) MHRA authorises world-first gene therapy that aims to cure sickle-cell disease and transfusion-dependent β-thalassemia","url":null}]},{"date":"2025-05-15","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"個別化した塩基編集治療を乳児に初めて適用と報告","summary":"希少な代謝疾患CPS1欠損症の乳児1人のために設計された塩基編集治療の投与結果がNEJMに報告された。米国の研究チームが患者固有の変異に合わせて約6か月で治療を設計・製造し、肝臓を標的に脂質ナノ粒子で投与した。\n\nDNA二本鎖を切らずに一塩基を書き換える塩基編集の体内投与例であり、「1人のための薬」の規制上の枠組みも同時に試された。ただし1例の短期報告であり、長期の安全性と有効性は今後の追跡による。","detail":null,"credibility":"unverified","credibility_note":"症例1例の短期経過報告にとどまり、長期的な安全性・有効性は未確認。","sources":[{"title":"Musunuru, K. et al. (2025) Patient-Specific In Vivo Gene Editing to Treat a Rare Genetic Disease. New England Journal of Medicine","url":null}]}]},{"slug":"science-infectious-diseases","title":"感染症との闘い","description":"1798年の種痘から新型コロナまで。病原体の流行、医学と公衆衛生の応答、国際制度の整備の3層を重ね、対策が常に流行の後を追いながらも前進してきた200年余りを辿る。","category":"science-nature","language":"ja","start_year":1798,"end_year":2023,"layers":[{"name":"病原体と流行","color":"pink"},{"name":"医学と公衆衛生","color":"blue"},{"name":"社会と制度","color":"gold"}],"events":[{"date":"1798-01-01","precision":"year","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"ジェンナー、種痘の成果を公刊","summary":"ジェンナーが牛痘接種による天然痘予防の観察をまとめた『牛痘の原因と作用に関する研究』を自費出版。1796年の少年への接種実験を含む23例を報告し、ワクチンという概念の出発点となった。\n\n病原体もウイルスも知られていない時代に経験則から生まれた手法であり、免疫学の理論整備は1世紀後を待つ。約180年後の天然痘根絶(社会と制度レイヤー)まで続く長い物語の起点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edward Jenner","url":"https://en.wikipedia.org/wiki/Edward_Jenner"}]},{"date":"1854-09-01","precision":"month","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"スノウ、コレラの感染源を井戸に特定","summary":"ロンドン・ソーホーのコレラ流行で、ジョン・スノウが患者の発生を地図に落としてブロード街の共同井戸を感染源と推定し、ポンプの柄を外させた。疫学的手法で感染経路を突き止めた古典的事例である。\n\n当時の主流は空気中の毒気を原因とする瘴気説で、コレラ菌の同定(1884年のコッホ)より30年早い。**病原体が見えないうちからデータで対策を打つ**という公衆衛生の原型がここにある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: John Snow","url":"https://en.wikipedia.org/wiki/John_Snow"}]},{"date":"1882-03-24","precision":"day","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"コッホ、結核菌を発見","summary":"ロベルト・コッホがベルリンの生理学会で結核菌の発見を報告。独自の染色法と純粋培養、動物への感染実験によって、当時の死因の筆頭級だった結核が特定の細菌による感染症であることを示した。\n\n炭疽菌、コレラ菌と続く一連の発見により「病原体を突き止めれば対策できる」という細菌学の時代が確立した。この日は後に世界結核デーとなる。治療薬ストレプトマイシンの登場は60年以上先である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Robert Koch","url":"https://en.wikipedia.org/wiki/Robert_Koch"}]},{"date":"1894-06-01","precision":"month","end_date":null,"type":"point","layer":"病原体と流行","title":"香港でペスト菌を発見","summary":"香港のペスト流行下で、イェルサンと北里柴三郎がほぼ同時期に病原菌を分離・報告した。19世紀を通じ世界へ広がった第三次ペスト・パンデミックの最中の成果である。\n\n発見の先取権は長く論争となったが、現在は両者の貢献を認める見方が一般的で、学名はイェルサンに由来する。ネズミとノミを介する感染経路の解明はこの後に続き、中世以来の脅威がようやく科学の対象になった。","detail":null,"credibility":"disputed","credibility_note":"先に純粋な菌を分離したのがどちらかは当時の報告の解釈により諸説あり、発見者の扱いは資料によって異なる。","sources":[{"title":"Wikipedia: Alexandre Yersin","url":"https://en.wikipedia.org/wiki/Alexandre_Yersin"},{"title":"Wikipedia: 北里柴三郎","url":"https://ja.wikipedia.org/wiki/%E5%8C%97%E9%87%8C%E6%9F%B4%E4%B8%89%E9%83%8E"}]},{"date":"1918-03-01","precision":"month","end_date":"1920-04-01","type":"period","layer":"病原体と流行","title":"インフルエンザ・パンデミック(スペインかぜ)","summary":"H1N1型インフルエンザが第一次大戦下の兵員移動に乗って世界へ拡大し、3つの波にわたって流行。世界人口の3分の1程度が感染したと推定される。\n\n死者は1700万〜5000万人とされ推計の幅が大きい。参戦国の戦時検閲で報道が抑えられ、中立国スペインの名が付いた経緯自体が**情報統制が流行対策を歪める**例である。原因ウイルスの同定は1933年、遺伝子の復元は2005年だった。","detail":null,"credibility":"disputed","credibility_note":"死者数は1700万〜5000万人(1億人とする説も)と推計に大きな幅があり、確定していない。","sources":[{"title":"Wikipedia: Spanish flu","url":"https://en.wikipedia.org/wiki/Spanish_flu"}]},{"date":"1928-09-01","precision":"month","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"フレミング、ペニシリンを発見","summary":"アレクサンダー・フレミングが、休暇中に放置した培養皿でアオカビの周囲だけブドウ球菌が育たないことを観察し、カビが出す抗菌物質をペニシリンと名付けた。\n\n実用化にはフローリーとチェインによる精製と、第二次大戦中に米英の国家事業として進んだ量産(社会と制度レイヤー)が必要だった。感染症が「治る病気」になる抗生物質時代の起点だが、フレミング自身は早くから耐性菌の出現を警告していた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Alexander Fleming","url":"https://en.wikipedia.org/wiki/Alexander_Fleming"}]},{"date":"1948-04-07","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"世界保健機関(WHO)発足","summary":"国連の専門機関として世界保健機関が発足した。憲章は健康を基本的人権と位置づけ、感染症に国際的に対処する常設組織が初めて整った。憲章発効の4月7日は世界保健デーとなる。\n\n19世紀以来の国際衛生会議の系譜を引き継ぎ、天然痘根絶やポリオ対策など**国境を越える病気には国境を越える制度**で応じる枠組みの中核となった。各国に流行の通報を義務づける国際保健規則(IHR)の運用主体でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: World Health Organization","url":"https://en.wikipedia.org/wiki/World_Health_Organization"}]},{"date":"1955-04-12","precision":"day","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"ソークのポリオワクチン、有効と発表","summary":"米国で約180万人の子どもが参加した大規模野外試験の結果が発表され、ソークの不活化ポリオワクチンの有効性が確認された。発表は全米に中継され、各地で祝賀が起きたと伝えられる。\n\n直後に一部製造ロットの不活化不良による感染事故(カッター事件)が起き、ワクチンの品質管理と国の監督体制が整備される契機ともなった。セービンの経口生ワクチンと合わせ、後の世界ポリオ根絶計画(社会と制度レイヤー)の土台となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Jonas Salk","url":"https://en.wikipedia.org/wiki/Jonas_Salk"}]},{"date":"1977-10-26","precision":"day","end_date":null,"type":"point","layer":"病原体と流行","title":"天然痘、最後の自然感染例","summary":"ソマリアの病院職員アリ・マオ・マーランが天然痘(小痘瘡)を発症。これが世界で確認された最後の自然感染例となった。本人は回復し、後にポリオ根絶活動に携わった。\n\nWHOが1967年に強化した根絶計画は、全員接種ではなく患者の周囲を集中的に接種で囲い込む「包囲接種」への戦術転換で成果を上げた。ジェンナーの種痘(医学と公衆衛生レイヤー)から約180年、人類が一つの感染症を地上からなくす直前の瞬間である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ali Maow Maalin","url":"https://en.wikipedia.org/wiki/Ali_Maow_Maalin"}]},{"date":"1980-05-08","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"WHO、天然痘の根絶を宣言","summary":"第33回世界保健総会が天然痘の世界根絶を宣言した。人類が意図して根絶した最初の感染症であり、ワクチンの原型の誕生から約180年での到達だった。\n\n冷戦下で米ソが協力した数少ない事業でもあり、**制度と現場が噛み合えば根絶は可能**だという成功体験が、ポリオや麻疹の根絶・排除計画に引き継がれた。一方で、研究用に残されたウイルス株を廃棄すべきかどうかの議論は今も決着していない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Smallpox","url":"https://en.wikipedia.org/wiki/Smallpox"}]},{"date":"1981-06-05","precision":"day","end_date":null,"type":"point","layer":"病原体と流行","title":"米CDC、後のエイズとなる症例を初報告","summary":"米疾病予防管理センターの週報MMWRが、ロサンゼルスの若い男性5人に生じた珍しい肺炎(ニューモシスチス肺炎)を報告した。後にエイズと名付けられる疾患の最初の公式記録である。\n\n原因不明のまま流行は拡大し、患者への偏見と差別が初動の対策を遅らせた。病原体の特定(医学と公衆衛生レイヤー)まで2年、有効な治療の確立までは15年を要し、社会の側の反応が被害を左右することを示す事例となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"CDC MMWR: Pneumocystis Pneumonia --- Los Angeles (1981-06-05)","url":null},{"title":"Wikipedia: HIV/AIDS","url":"https://en.wikipedia.org/wiki/HIV/AIDS"}]},{"date":"1983-05-20","precision":"day","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"HIVの分離を報告","summary":"パスツール研究所のバレシヌシとモンタニエらが、エイズ患者のリンパ節から新種のレトロウイルス(後のHIV)を分離したとScience誌に報告した。\n\n翌年に米国のギャロも同種のウイルスを報告し、発見の先取権と検査法特許をめぐる米仏の争いに発展。1987年に両国政府間で決着したが、2008年のノーベル賞はパスツール研究所側のみに贈られた。抗体検査の確立により、血液製剤の安全対策も始まる。","detail":null,"credibility":"disputed","credibility_note":"発見の先取権は米仏で長く争われ、政治決着とノーベル賞の授賞を経てもなお評価には立場による差が残る。","sources":[{"title":"Wikipedia: HIV","url":"https://en.wikipedia.org/wiki/HIV"}]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"HIV多剤併用療法(HAART)が確立","summary":"プロテアーゼ阻害薬の登場により、作用の異なる薬を組み合わせてウイルスの増殖を抑え込む多剤併用療法が確立した。この年の国際エイズ会議で治療の転換が示され、先進国の死亡率は数年で急減した。\n\nエイズは「死の病」から管理可能な慢性疾患へと変わった。しかし高価な薬が途上国に届くまでには特許と価格をめぐる制度闘争(社会と制度レイヤー)が続き、治療アクセスの格差そのものが国際保健の主題になっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Management of HIV/AIDS","url":"https://en.wikipedia.org/wiki/Management_of_HIV/AIDS"}]},{"date":"2002-11-16","precision":"day","end_date":"2003-07-05","type":"period","layer":"病原体と流行","title":"SARSの流行","summary":"中国広東省で始まった重症急性呼吸器症候群(SARS)が香港経由で約30の国・地域へ広がり、感染者約8000人、死者774人を出した。2003年7月、WHOが流行の封じ込めを宣言した。\n\n原因は新種のコロナウイルスと特定され、初期の情報開示の遅れが国際的な批判を浴びた。この教訓から国際保健規則が2005年に大幅改正され、**次の新興感染症への備え**が制度化された。17年後、同じ属のウイルスが再び現れる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: SARS","url":"https://en.wikipedia.org/wiki/SARS"}]},{"date":"2014-03-01","precision":"month","end_date":"2016-06-01","type":"period","layer":"病原体と流行","title":"西アフリカでエボラ出血熱が大流行","summary":"ギニアで確認されたエボラウイルス病がリベリア、シエラレオネへ拡大し、感染者2万8000人超、死者1万1000人超という過去最大の流行になった。2014年8月にWHOが緊急事態を宣言した。\n\n数か月に及んだWHOの初動の遅れは厳しく検証され、緊急対応体制の改革(社会と制度レイヤー)につながった。流行下で候補ワクチンの臨床試験が実施され、後の正式承認への道を開いた点でも転機となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Western African Ebola virus epidemic","url":"https://en.wikipedia.org/wiki/Western_African_Ebola_virus_epidemic"}]},{"date":"2016-05-19","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"薬剤耐性(AMR)レビュー最終報告","summary":"英政府委託のオニール・レビューが最終報告を公表し、対策を怠れば2050年には薬剤耐性菌による死者が年1000万人に達しうると警告、抗菌薬の適正使用と新薬開発の促進を提言した。\n\n1000万人という数字は複数の仮定を重ねた推計であり学術的な異論もあるが、抗生物質時代の起点(1928年、医学と公衆衛生レイヤー)から続く**特効薬が効かなくなる時代**への警鐘として、AMRを国際政治の議題に載せる役割を果たした。","detail":null,"credibility":"unverified","credibility_note":"年1000万人という死者予測はモデルに基づく推計で、前提の置き方によって大きく変わりうる数字である。","sources":[{"title":"UK Review on Antimicrobial Resistance: Tackling Drug-Resistant Infections Globally (2016)","url":null}]},{"date":"2020-01-30","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"WHO、新型コロナで緊急事態を宣言","summary":"WHOが新型コロナウイルス感染症について「国際的に懸念される公衆衛生上の緊急事態(PHEIC)」を宣言した。前年12月末の武漢での症例報告から約1か月での判断だった。\n\n3月11日にはパンデミックと表明し、各国は渡航制限や都市封鎖に踏み切った。SARS後に改正された国際保健規則の実効性と限界が同時に露呈した局面であり、ワクチン開発(医学と公衆衛生レイヤー)は宣言と同時並行で始まっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: COVID-19 pandemic","url":"https://en.wikipedia.org/wiki/COVID-19_pandemic"}]},{"date":"2020-12-08","precision":"day","end_date":null,"type":"point","layer":"医学と公衆衛生","title":"mRNAワクチン、一般接種が開始","summary":"英国で90歳の女性を第1号として、ファイザー・ビオンテック製の新型コロナmRNAワクチンの一般接種が始まった。ウイルスの遺伝情報の公開から約11か月という異例の速さでの実用化である。\n\n数十年に及ぶ基礎研究の蓄積が緊急時に結実したもので、カリコとワイスマンの基盤技術は2023年のノーベル賞となった。一方で供給が富裕国に偏る「ワクチン格差」は、制度の側(社会と制度レイヤー)に大きな宿題を残した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: COVID-19 vaccine","url":"https://en.wikipedia.org/wiki/COVID-19_vaccine"}]},{"date":"2021-03-30","precision":"day","end_date":null,"type":"point","layer":"病原体と流行","title":"WHO調査団、新型コロナ起源の報告書","summary":"WHOと中国の合同調査団が武漢での現地調査に基づく報告書を公表し、コウモリ由来のウイルスが中間宿主を介して人に達した経路を「可能性が高い」、研究所からの流出を「極めて考えにくい」と評価した。\n\nしかし直後にWHO事務局長自身がデータへのアクセス制約に言及し、追加調査を求めた。ウイルスの起源は今も確定しておらず、**分からないことを分からないまま記録する**ことの難しさを示す事例である。","detail":null,"credibility":"unverified","credibility_note":"ウイルスの起源は自然由来説・研究所関連説のいずれにも決定的証拠がなく、未確定のままである。","sources":[{"title":"WHO-convened Global Study of Origins of SARS-CoV-2: China Part (2021)","url":null}]},{"date":"2023-05-05","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"WHO、新型コロナの緊急事態を終了","summary":"WHOが新型コロナに関する緊急事態(PHEIC)の終了を発表した。宣言から3年3か月、報告された死者は約700万人に上り、WHOは2020〜21年だけで約1500万人の超過死亡を推計している。\n\n各国はパンデミック条約の交渉と国際保健規則の再改正へ進んだが、資金と権限をめぐる対立は残った。1798年の種痘以来繰り返されてきたように、流行の記憶が薄れる前に制度を整えられるかが問われている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: COVID-19 pandemic","url":"https://en.wikipedia.org/wiki/COVID-19_pandemic"}]}]},{"slug":"science-mars-missions","title":"火星探査ミッション","description":"運河の幻から探査車の隊列、サンプルリターン計画まで。ミッションの成否・水と生命の証拠・競争と構想の3層を重ね、人類が隣の惑星をどう読み解いてきたかをたどる。","category":"science-nature","language":"ja","start_year":1877,"end_year":2024,"layers":[{"name":"ミッションと技術","color":"blue"},{"name":"水と生命の探査","color":"teal"},{"name":"競争と構想","color":"orange"}],"events":[{"date":"1877-01-01","precision":"year","end_date":null,"type":"point","layer":"競争と構想","title":"スキャパレリが火星の「溝」を報告","summary":"イタリアの天文学者スキャパレリが大接近時の火星を観測し、表面に線状の地形を認めて「canali(溝)」と記載した。英語圏で「運河」と訳されたことで、人工物という連想が独り歩きした。\n\nローウェルらが**知的生命が築いた運河網**という解釈を広め、SFの火星人像を育てていく。この幻は1965年の探査機の写真(ミッションと技術レイヤー)まで88年間生き続け、観測と願望の混同の教訓として語り継がれる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Giovanni Schiaparelli","url":"https://en.wikipedia.org/wiki/Giovanni_Schiaparelli"}]},{"date":"1938-10-30","precision":"day","end_date":null,"type":"point","layer":"競争と構想","title":"ラジオドラマ「宇宙戦争」放送","summary":"オーソン・ウェルズ演出のラジオドラマ「宇宙戦争」が、火星人の襲来を臨時ニュース仕立てで放送し、一部の聴取者が現実の出来事と誤解したと報じられた。\n\n「全米がパニックに陥った」という通説は後年の研究で誇張と指摘されているが、火星イコール侵略者というイメージの定着を示す事件ではあった。運河説から続く想像の火星の頂点であり、実像の探査が始まるのはこの27年後である。","detail":null,"credibility":"disputed","credibility_note":"全国的パニックが起きたという通説は後年の研究で誇張と指摘されており、実際の聴取率と混乱の規模には諸説ある。","sources":[{"title":"Wikipedia: The War of the Worlds (1938 radio drama)","url":"https://en.wikipedia.org/wiki/The_War_of_the_Worlds_(1938_radio_drama)"}]},{"date":"1965-07-15","precision":"day","end_date":null,"type":"point","layer":"ミッションと技術","title":"マリナー4号、初の火星接近撮影","summary":"NASAのマリナー4号が火星への接近通過に成功し、20枚余りの近接写真を初めて地球へ送った。写っていたのは運河でも植生でもなく、月に似たクレーターだらけの地表だった。\n\n88年続いた運河の幻(競争と構想レイヤー)は事実上ここで消え、大気圧は地球の1%に満たないことも判明した。期待との落差から探査の意義が問われたが、「本当に死んだ星なのか」という問いが、以後の水探し(水と生命の探査レイヤー)の動機となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Mariner 4","url":"https://en.wikipedia.org/wiki/Mariner_4"}]},{"date":"1971-12-02","precision":"day","end_date":null,"type":"point","layer":"競争と構想","title":"ソ連のマルス3号、初の火星軟着陸","summary":"ソ連のマルス3号の着陸機が、人類として初めて火星への軟着陸に成功した。ただし送信は着陸の約20秒後に途絶し、意味のある画像は得られなかった。\n\n同じ時期、米国のマリナー9号は初の火星周回機となり全球の撮影に成功している。着陸はソ連が先んじ、観測は米国が制したという対照的な結果は、火星が**国家の威信を測る場**であったこと、そしてその難しさを同時に物語る。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Mars 3","url":"https://en.wikipedia.org/wiki/Mars_3"}]},{"date":"1976-07-20","precision":"day","end_date":null,"type":"point","layer":"ミッションと技術","title":"バイキング1号が着陸、生命探査実験を実施","summary":"NASAのバイキング1号がクリュセ平原に着陸し、火星表面からの撮影と土壌の生命探査実験を初めて本格的に実施した。実験の一部は、当初生命を示唆するかに見える反応を返した。\n\n結果は最終的に「生命の証拠なし」と解釈されたが、標識放出実験の解釈には現在も異論が残る。生命探しへの期待と失望の落差はその後20年間の火星着陸の空白の一因となり、次の着陸は1997年まで待つことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Viking 1","url":"https://en.wikipedia.org/wiki/Viking_1"}]},{"date":"1996-08-07","precision":"day","end_date":null,"type":"point","layer":"水と生命の探査","title":"火星隕石に「生命の痕跡」発表","summary":"NASAの研究チームが、南極で発見された火星起源の隕石ALH84001に微生物の化石に似たナノメートル級の構造を見つけたと発表した。クリントン大統領が声明を出すほどの騒ぎとなった。\n\n主張の多くは後に非生物的な過程で説明され、現在は懐疑的な見方が主流である。それでもこの騒動は宇宙生物学という分野の確立と火星探査予算の復活を後押しし、**証拠の解釈をめぐる火星生命論争**の型がここで定まった。","detail":null,"credibility":"disputed","credibility_note":"ナノメートル級構造を生物起源とする解釈には非生物的な生成過程による説明が示されており、現在は懐疑的な見方が主流である。","sources":[{"title":"Wikipedia: Allan Hills 84001","url":"https://en.wikipedia.org/wiki/Allan_Hills_84001"}]},{"date":"1997-07-04","precision":"day","end_date":null,"type":"point","layer":"ミッションと技術","title":"パスファインダー着陸、初の火星ローバー","summary":"NASAのマーズ・パスファインダーがエアバッグで弾みながら着陸し、初の火星ローバー「ソジャーナ」が地表を走行した。画像はウェブで即時公開され、公開サイトには当時として記録的なアクセスが集まった。\n\n「より速く、より良く、より安く」路線の象徴で、バイキング以来21年ぶりの着陸成功が探査の空白を破った。動き回り、岩を選んで調べるというローバーの様式は、以後の火星探査の標準になっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Mars Pathfinder","url":"https://en.wikipedia.org/wiki/Mars_Pathfinder"}]},{"date":"1999-09-23","precision":"day","end_date":null,"type":"point","layer":"ミッションと技術","title":"マーズ・クライメイト・オービター喪失","summary":"NASAの火星気候周回機が軌道投入の際に大気圏へ深く進入しすぎ、破壊された。原因は、開発側がヤード・ポンド法、運用側がメートル法の数値を前提にしていたという単位の取り違えだった。\n\n直後のマーズ・ポーラー・ランダーの失敗と併せ、低コスト路線の管理体制が厳しく問い直された。初歩的な取り違えが1億ドル超の機体を失わせた事例として、システム工学の教材に今も登場し続けている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Mars Climate Orbiter","url":"https://en.wikipedia.org/wiki/Mars_Climate_Orbiter"}]},{"date":"2004-01-25","precision":"day","end_date":"2019-02-13","type":"period","layer":"ミッションと技術","title":"オポチュニティ、90日の予定を15年走る","summary":"双子ローバーの一方オポチュニティがメリディアニ平原に着陸した。設計寿命90日のところ約15年・45km超を走破し、2018年の全球砂嵐で交信が途絶、2019年2月にミッション終了が宣言された。\n\n着陸直後に水中で形成された鉱物を発見し、**かつて水をたたえていた火星**の姿を決定づけた(水と生命の探査レイヤー)。想定を超えて延命する運用のノウハウは、キュリオシティ以降の設計と計画に引き継がれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Opportunity (rover)","url":"https://en.wikipedia.org/wiki/Opportunity_(rover)"}]},{"date":"2008-06-01","precision":"month","end_date":null,"type":"point","layer":"水と生命の探査","title":"フェニックス、火星の水の氷を直接確認","summary":"北極域に着陸したNASAのフェニックスが、掘削した溝に現れた白い塊が数日のうちに昇華して消える様子を撮影し、地表直下に水の氷が存在することを初めてその場で確認した。\n\n周回機の中性子観測による推定を地上で裏づけた成果である。土壌からは過塩素酸塩も検出され、生命探査の条件と将来の水資源利用の両面で、以後の着陸地選定の前提を変えることになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Phoenix (spacecraft)","url":"https://en.wikipedia.org/wiki/Phoenix_(spacecraft)"}]},{"date":"2012-08-06","precision":"day","end_date":null,"type":"point","layer":"ミッションと技術","title":"キュリオシティ、スカイクレーンで着陸","summary":"1トン級ローバーのキュリオシティが、ロケット噴射で空中に静止したクレーンから吊り下ろされる新方式「スカイクレーン」でゲールクレーターに着陸した。「恐怖の7分間」という言葉とともに世界が中継を見守った。\n\n重量級の科学機材を安全に降ろすこの方式は、後のパーサヴィアランスにも継承される。着陸からまもなく古代の河床の礫を発見し、湖の痕跡を追う探査(水と生命の探査レイヤー)が本格化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Curiosity (rover)","url":"https://en.wikipedia.org/wiki/Curiosity_(rover)"}]},{"date":"2013-12-01","precision":"month","end_date":null,"type":"point","layer":"水と生命の探査","title":"ゲールクレーターに古代湖、生命居住可能と判定","summary":"キュリオシティの掘削試料の分析から、ゲールクレーターにかつて中性の淡水湖が存在し、微生物が生存しうる化学環境だったとする一連の論文がサイエンス誌に掲載された。\n\n「水があったか」から「**住める環境だったか**」へと問いが一段進んだ画期である。ただし生命そのものの痕跡の検出は探査車の機器では難しく、その検証は将来のサンプルリターン(競争と構想レイヤー)に委ねられている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Grotzinger et al., Science: A Habitable Fluvio-Lacustrine Environment at Yellowknife Bay, Gale Crater, Mars (2014)","url":null}]},{"date":"2014-12-01","precision":"month","end_date":null,"type":"point","layer":"水と生命の探査","title":"キュリオシティがメタンの一時的増加を検出","summary":"キュリオシティ搭載の分析計が、火星大気中のメタン濃度が数カ月にわたり背景値の約10倍に高まる現象を捉えたと報告された。メタンは生物起源にも地質起源にもなりうる注目の分子である。\n\nしかしその後、高感度の欧州周回機TGOはメタンをほとんど検出せず、測定どうしの矛盾は未解決のまま残っている。検出のたびに期待と懐疑が交錯する経過は、ALH84001以来の火星生命論争の続編といえる。","detail":null,"credibility":"unverified","credibility_note":"メタン検出は時期や観測手段により結果が一致せず、欧州のTGOはほぼ検出していない。発生源・消失過程も含めて未確定である。","sources":[{"title":"Webster et al., Science: Mars methane detection and variability at Gale crater (2015)","url":null}]},{"date":"2015-09-28","precision":"day","end_date":null,"type":"point","layer":"水と生命の探査","title":"NASA「現在の火星に液体の水」と発表","summary":"周回機MROの分光観測に基づき、斜面に季節的に現れて伸びる筋状地形(RSL)から含水塩が検出されたとして、NASAが「現在の火星に液体の水が流れている証拠」と大きく発表した。\n\nしかし2年後には、乾いた砂の流れでも同じ地形を説明できるとする反論が提示され、解釈は覆されつつある。派手な発表と静かな訂正という経過は、**発表の科学と検証の科学の時差**を示す例としてしばしば引かれる。","detail":null,"credibility":"disputed","credibility_note":"含水塩に基づく液体の水という解釈にはその後、乾いた砂の流動とする説が有力に提示されており、決着していない。","sources":[{"title":"Wikipedia: Seasonal flows on warm Martian slopes","url":"https://en.wikipedia.org/wiki/Seasonal_flows_on_warm_Martian_slopes"}]},{"date":"2016-09-27","precision":"day","end_date":null,"type":"point","layer":"競争と構想","title":"スペースXが火星移民構想を発表","summary":"マスクが国際宇宙会議で「人類を複数惑星種にする」と題した講演を行い、100人乗り大型ロケット(後のスターシップ)による火星都市建設の構想を示した。\n\n国家機関の科学探査とは別に、民間企業による移民という目標が公の議論に載った転換点である。示されたスケジュールは以後繰り返し延期されているが、大型機の開発自体は進み、独自の着陸手段を持たないNASAの月・火星計画にも影響を与えている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX: Making Humans a Multiplanetary Species (IAC 2016 講演)","url":null}]},{"date":"2018-07-25","precision":"day","end_date":null,"type":"point","layer":"水と生命の探査","title":"南極冠の地下に「湖」検出と発表","summary":"欧州の周回機マーズ・エクスプレスのレーダー観測から、南極冠の氷の下約1.5kmに幅約20kmの液体の水域が存在するとイタリアの研究チームがサイエンス誌で発表した。\n\n極低温でも塩分濃度が高ければ液体を保ちうるという解釈だが、粘土鉱物などでも似たレーダー反射を説明できるとする反論が続く。地球の氷底湖に微生物の生態系があることを思わせる発見だけに、検証の行方が注目されている。","detail":null,"credibility":"disputed","credibility_note":"レーダー反射の解釈には粘土鉱物や塩水以外による説明も提示されており、湖の実在をめぐる議論が続いている。","sources":[{"title":"Orosei et al., Science: Radar evidence of subglacial liquid water on Mars (2018)","url":null}]},{"date":"2021-02-18","precision":"day","end_date":null,"type":"point","layer":"ミッションと技術","title":"パーサヴィアランス着陸、サンプル採取開始","summary":"NASAのパーサヴィアランスが、かつて川のデルタが広がっていたジェゼロクレーターに着陸した。試料を採取・密封して地表に残し、将来の回収を待つサンプルリターン計画の第一段階を担う。\n\n搭載ヘリコプター「インジェニュイティ」は同年4月、他天体で初の動力飛行に成功した。同じ月にはUAEと中国の探査機も相次いで火星に到着しており(競争と構想レイヤー)、火星は多極化した探査の舞台となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Perseverance (rover)","url":"https://en.wikipedia.org/wiki/Perseverance_(rover)"}]},{"date":"2021-05-15","precision":"day","end_date":null,"type":"point","layer":"競争と構想","title":"中国の祝融号が着陸、米ソに続く3カ国目","summary":"中国の天問1号ミッションの着陸機がユートピア平原に軟着陸し、ローバー祝融号の走行に成功した。初挑戦で周回・着陸・走行の3つを一度に達成した国は初めてである。\n\n火星着陸の成功国は旧ソ連(部分的成功)、米国に続く3カ国目で、**一極化していた火星探査の多極化**を決定づけた。中国はサンプルリターンでも独自計画を進めており、見直しが続く米欧の計画と試料回収の時期を競う構図になっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Zhurong (rover)","url":"https://en.wikipedia.org/wiki/Zhurong_(rover)"}]},{"date":"2022-03-17","precision":"day","end_date":null,"type":"point","layer":"競争と構想","title":"ロシア侵攻でExoMarsローバー打上げ中止","summary":"欧州宇宙機関(ESA)が、ロシアのウクライナ侵攻を受けて、同国と共同で予定していたExoMarsローバーの2022年打ち上げを断念し、ロシアとの協力を停止すると決定した。\n\n着陸システムをロシア側が担う分担だったため計画は根本からの再設計となり、打ち上げは2028年以降へ延期された。地上の地政学が惑星探査の時間割を直接書き換えた、冷戦後では最も明確な事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ExoMars","url":"https://en.wikipedia.org/wiki/ExoMars"}]},{"date":"2024-04-15","precision":"day","end_date":null,"type":"point","layer":"競争と構想","title":"NASA、サンプルリターン計画の見直しを表明","summary":"NASAが火星サンプルリターン計画について、このままでは費用が最大110億ドル、試料の地球到着が2040年になるとの独立評価を受け、より安く早い代替案を産業界からも募ると発表した。\n\nパーサヴィアランスが密封した試料(ミッションと技術レイヤー)は、回収の目途が定まらないまま火星表面で待ち続けている。生命の痕跡の決定的な検証は地球の実験室でしか行えないだけに、計画の帰趨は火星生命論争(水と生命の探査レイヤー)全体の行方を左右する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Mars sample-return mission","url":"https://en.wikipedia.org/wiki/Mars_sample-return_mission"}]}]},{"slug":"science-mathematics","title":"数学の美しい定理","description":"フェルマーの余白の書き込みからポアンカレ予想の解決まで。定理の証明・予想の提示・応用への波及の3層を重ね、抽象的な美しさが時を経て世界を動かす瞬間をたどる。","category":"science-nature","language":"ja","start_year":1637,"end_year":2023,"layers":[{"name":"定理と証明","color":"gold"},{"name":"予想と問題提起","color":"purple"},{"name":"応用への波及","color":"teal"}],"events":[{"date":"1637-01-01","precision":"year","end_date":null,"type":"point","layer":"予想と問題提起","title":"フェルマー、「最終定理」を欄外に書き残す","summary":"フェルマーがディオファントス『算術』の余白に、3以上の冪では成り立たない旨の命題と「真に驚くべき証明を見つけたが、この余白は狭すぎる」という言葉を書き残したとされる。時期は1637年頃と推定される。\n\n見た目の単純さと証明の困難さの落差が数学者を358年間ひきつけ、その挑戦の過程で代数的数論という分野が育った。**余白の一行が生んだ358年**の物語の起点である。","detail":null,"credibility":"unverified","credibility_note":"欄外書き込みの年は本人による日付の記録がなく、1637年頃とする後世の推定に基づく。","sources":[{"title":"Wikipedia: Fermat's Last Theorem","url":"https://en.wikipedia.org/wiki/Fermat%27s_Last_Theorem"}]},{"date":"1735-01-01","precision":"year","end_date":null,"type":"point","layer":"定理と証明","title":"オイラーがバーゼル問題を解く","summary":"平方数の逆数をすべて足した無限和がπ²/6に等しいことをオイラーが示し、ベルヌーイ家の数学者たちも解けなかった難問を28歳で解決した。\n\n整数だけから作った和に円周率が現れるという**無関係に見えるものどうしの結びつき**は、数学の美の典型とされる。この和を一般化したものが後にリーマンのゼータ関数(予想と問題提起レイヤー)となり、素数の謎へと直結していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Basel problem","url":"https://en.wikipedia.org/wiki/Basel_problem"}]},{"date":"1736-01-01","precision":"year","end_date":null,"type":"point","layer":"応用への波及","title":"ケーニヒスベルクの橋の問題、グラフ理論の誕生","summary":"7本の橋をすべて一度ずつ渡る経路は存在しないことを、オイラーが土地と橋を点と線に置き換えて証明した。位置や距離を捨てて「つながり方」だけを扱う、当時としては異例の抽象化だった。\n\n娯楽的な問いから生まれたこの発想がグラフ理論となり、約250年後にはインターネットの経路制御やSNSの分析を支えることになる。役に立たなそうな問いが最も役に立つという逆説の代表例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Seven Bridges of Königsberg","url":"https://en.wikipedia.org/wiki/Seven_Bridges_of_K%C3%B6nigsberg"}]},{"date":"1748-01-01","precision":"year","end_date":null,"type":"point","layer":"定理と証明","title":"『無限解析序説』とオイラーの等式","summary":"オイラーが『無限解析序説』を出版し、指数関数と三角関数を結ぶ公式 e^iθ = cosθ + i sinθ を体系化した。θにπを代入すれば e^iπ + 1 = 0 が得られる。\n\ne、i、π、1、0という**五つの基本定数が一つの式で結ばれる**この等式は、後世の数学者への調査でしばしば「最も美しい式」に選ばれてきた。もっとも、この形を最初に明示的に書いた人物が誰かは、はっきりしていない。","detail":null,"credibility":"disputed","credibility_note":"e^iπ+1=0という等式の形を最初に明示した人物・時期には諸説あり、オイラー自身の著作にこの形そのものの記載は確認されていない。","sources":[{"title":"Wikipedia: Euler's identity","url":"https://en.wikipedia.org/wiki/Euler%27s_identity"}]},{"date":"1801-01-01","precision":"year","end_date":null,"type":"point","layer":"定理と証明","title":"ガウス『整数論』刊行、相互法則を証明","summary":"24歳のガウスが『ディスクィジティオネス・アリトメティカエ(整数論)』を刊行した。合同式の記法を整備し、オイラーやルジャンドルが証明しきれなかった平方剰余の相互法則に初の完全な証明を与えた。\n\nガウスはこの法則を「黄金定理」と呼び、生涯に複数の異なる証明を残した。素数どうしの間に潜む対称性を示すこの定理は、後の類体論からラングランズ・プログラムに至る数論の主軸となっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Disquisitiones Arithmeticae","url":"https://en.wikipedia.org/wiki/Disquisitiones_Arithmeticae"}]},{"date":"1822-01-01","precision":"year","end_date":null,"type":"point","layer":"応用への波及","title":"フーリエ『熱の解析的理論』刊行","summary":"フーリエが熱伝導の研究をまとめ、任意の関数を三角関数の無限和で表せるという主張を体系化した。数学的な厳密さをめぐり、当時は有力数学者からの批判も受けた。\n\nこの「フーリエ級数」は音声や画像の圧縮、医療画像、信号処理の基盤となった。同時に「関数とは何か」という問いを純粋数学に突きつけ、後の集合論の誕生を刺激した点でも重要で、応用と純粋が互いを育てる循環の好例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Joseph Fourier","url":"https://en.wikipedia.org/wiki/Joseph_Fourier"}]},{"date":"1859-01-01","precision":"year","end_date":null,"type":"point","layer":"予想と問題提起","title":"リーマン予想の提示","summary":"リーマンが論文「与えられた数より小さい素数の個数について」で、ゼータ関数を複素数へ拡張し、その非自明な零点はすべて実部1/2の直線上にあると予想した。\n\nバーゼル問題(定理と証明レイヤー)に始まる級数が、素数の分布という数論の核心と結ばれた瞬間である。予想は1900年のヒルベルトの23問題、2000年のミレニアム懸賞問題に引き継がれ、今なお未解決の**数学最大の未解決問題**とされる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Riemann hypothesis","url":"https://en.wikipedia.org/wiki/Riemann_hypothesis"}]},{"date":"1874-01-01","precision":"year","end_date":null,"type":"point","layer":"定理と証明","title":"カントール、無限に大小があることを証明","summary":"カントールが、実数全体は自然数全体と一対一に対応づけられないことを証明し、無限集合の間にも「濃度」の違いがあることを初めて示した。\n\n「無限はひとつ」という直観を覆すこの結果は同時代の数学者から激しい反発を受けたが、やがて集合論として数学全体の共通言語になった。さらに連続体仮説という新たな問い(予想と問題提起レイヤー)を生み、それは後のゲーデルの仕事につながる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cantor's first set theory article","url":"https://en.wikipedia.org/wiki/Cantor%27s_first_set_theory_article"}]},{"date":"1900-08-08","precision":"day","end_date":null,"type":"point","layer":"予想と問題提起","title":"ヒルベルト、23の問題を提示","summary":"パリの国際数学者会議でヒルベルトが講演し、20世紀の数学が取り組むべき23の問題を提示した。リーマン予想や連続体仮説、算術の無矛盾性の証明などが含まれる。\n\n**問いを立てること自体が数学を駆動する**ことを示した講演であり、以後100年の研究の地図となった。皮肉にも、算術の無矛盾性を証明せよという第2問題は、31年後のゲーデル(定理と証明レイヤー)によって否定的な形で決着する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hilbert's problems","url":"https://en.wikipedia.org/wiki/Hilbert%27s_problems"}]},{"date":"1931-01-01","precision":"year","end_date":null,"type":"point","layer":"定理と証明","title":"ゲーデルの不完全性定理","summary":"ゲーデルが、算術を含む無矛盾な形式体系には証明も反証もできない命題が必ず存在すること、そして体系は自身の無矛盾性を証明できないことを示した。\n\n数学の完全な基礎づけを目指すヒルベルトの計画(予想と問題提起レイヤー)に根本的な限界を突きつけた結果だが、その証明技法は計算可能性の理論を生み、チューリングを経てコンピュータの理論的な土台となった。限界の証明が新しい分野を開いた逆説である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gödel's incompleteness theorems","url":"https://en.wikipedia.org/wiki/G%C3%B6del%27s_incompleteness_theorems"}]},{"date":"1948-07-01","precision":"month","end_date":null,"type":"point","layer":"応用への波及","title":"シャノン「通信の数学的理論」発表","summary":"シャノンが情報を確率とビットで定量化する理論を発表し、あらゆる通信路には誤りなく情報を送れる限界(通信路容量)が存在することを数学的に示した。\n\nブール代数や確率論という純粋数学の道具が、通信という工学の全体を一つの理論で説明してみせた。デジタル革命の理論的な出発点であり、エントロピーの概念を介して物理学や統計学とも結ばれている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: A Mathematical Theory of Communication","url":"https://en.wikipedia.org/wiki/A_Mathematical_Theory_of_Communication"}]},{"date":"1976-01-01","precision":"year","end_date":null,"type":"point","layer":"定理と証明","title":"四色定理、コンピュータで証明される","summary":"どんな地図も4色あれば隣り合う領域を塗り分けられるという1852年以来の予想を、アッペルとハーケンが約2,000通りの配置をコンピュータで検証することにより証明した。\n\n人間が一生かけても読み切れない証明は「これは数学の証明といえるのか」という論争を呼んだ。証明とは何かという問いを実務のレベルで突きつけた最初の事件であり、半世紀後の形式検証(応用への波及レイヤー)を先取りしていた。","detail":null,"credibility":"disputed","credibility_note":"定理自体への反例は見つかっていないが、コンピュータに依存する証明を数学的証明と認めるかは当時激しく議論され、検証方法の評価には現在も立場の差がある。","sources":[{"title":"Wikipedia: Four color theorem","url":"https://en.wikipedia.org/wiki/Four_color_theorem"}]},{"date":"1977-01-01","precision":"year","end_date":null,"type":"point","layer":"応用への波及","title":"RSA暗号の考案、数論が社会基盤になる","summary":"リベスト、シャミア、エイドルマンの3人が、大きな数の素因数分解の難しさに安全性の根拠を置く公開鍵暗号を考案した。鍵をあらかじめ受け渡さなくても秘密の通信ができる。\n\nフェルマーやオイラーの整数論という**最も実用から遠いとされた分野**が、オンライン取引と通信の安全を支える社会基盤へ転じた。数論の「無用さ」を誇ったハーディの随筆から約40年後の逆転である。","detail":null,"credibility":"disputed","credibility_note":"同等の方式は英国GCHQのコックスが1973年に先に考案していたことが1997年の機密解除で判明しており、発明の先後関係は文脈により語られ方が分かれる。","sources":[{"title":"Wikipedia: RSA (cryptosystem)","url":"https://en.wikipedia.org/wiki/RSA_(cryptosystem)"}]},{"date":"1993-06-23","precision":"day","end_date":"1995-05-01","type":"period","layer":"定理と証明","title":"ワイルズ、フェルマー最終定理を証明","summary":"ワイルズがケンブリッジでの連続講演の最後に証明を発表した。直後の査読で見つかった欠陥を教え子テイラーとともに修正し、1995年5月の論文出版をもって358年の懸案が決着した。\n\n証明の実体は、楕円曲線とモジュラー形式を結ぶ谷山–志村予想の(半安定な場合の)解決である。フェルマーの素朴な問い(予想と問題提起レイヤー)は、現代数学の最深部と結ばれることで初めて落ちた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Wiles's proof of Fermat's Last Theorem","url":"https://en.wikipedia.org/wiki/Wiles%27s_proof_of_Fermat%27s_Last_Theorem"}]},{"date":"1994-01-01","precision":"year","end_date":null,"type":"point","layer":"応用への波及","title":"ショアのアルゴリズム発表","summary":"ショアが、量子コンピュータであれば素因数分解を効率的に解けるアルゴリズムを発表した。大規模な量子計算機が実現すれば、RSA暗号(1977年)の安全性の前提は崩れることになる。\n\n数論から暗号へ、暗号から量子計算へという応用の連鎖が一巡し、暗号の置き換え(耐量子暗号)という新しい社会課題を生んだ。一つの定理が数十年単位で社会のリスク構造を変えることを示す例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Shor's algorithm","url":"https://en.wikipedia.org/wiki/Shor%27s_algorithm"}]},{"date":"2000-05-24","precision":"day","end_date":null,"type":"point","layer":"予想と問題提起","title":"クレイ研究所がミレニアム懸賞問題を発表","summary":"クレイ数学研究所が、リーマン予想、ポアンカレ予想、P対NP問題など7つの未解決問題に各100万ドルの懸賞金をかけると発表した。ヒルベルトの23問題からちょうど100年後にあたる。\n\n賞金という分かりやすい形で、数学の未解決問題が一般のニュースとして扱われるようになった。7問のうち解決されたのは現在までポアンカレ予想(定理と証明レイヤー)のみで、しかも解決者は賞金を辞退することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Millennium Prize Problems","url":"https://en.wikipedia.org/wiki/Millennium_Prize_Problems"}]},{"date":"2002-11-11","precision":"day","end_date":"2006-08-22","type":"period","layer":"定理と証明","title":"ペレルマン、ポアンカレ予想を証明","summary":"ペレルマンが3本のプレプリントをarXivに投稿し、リッチフローを用いてポアンカレ予想を含む幾何化予想を解決した。国際的な検証には約4年を要し、2006年のフィールズ賞は本人が辞退した。\n\n査読誌を経ずアーカイブ投稿のみで公表し、後にクレイ研究所の賞金100万ドルも辞退した。宇宙の形にも通じる位相幾何学の百年の難問が、**名誉と無縁の一人の研究者**によって静かに閉じられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: The entropy formula for the Ricci flow and its geometric applications (math/0211159)","url":"https://arxiv.org/abs/math/0211159"}]},{"date":"2013-05-01","precision":"month","end_date":null,"type":"point","layer":"定理と証明","title":"張益唐、素数の間隔に有限の上界を証明","summary":"ほぼ無名だった張益唐が、差が7,000万以下である素数の組が無限に存在することを証明し、論文がアナルズ誌に受理された。差2の組を問う双子素数予想に対する、史上初の「有限の壁」だった。\n\n発表直後から世界中の数学者がオンライン共同研究「Polymath」で改良を重ね、上界は数カ月で246まで縮んだ。孤高の証明と開かれた共同作業が連続したこの出来事は、数学の営みの新旧両面を同時に見せた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Yitang Zhang","url":"https://en.wikipedia.org/wiki/Yitang_Zhang"}]},{"date":"2023-12-01","precision":"month","end_date":null,"type":"point","layer":"応用への波及","title":"タオら、最新の定理を証明支援系Leanで形式化","summary":"フィールズ賞受賞者テレンス・タオらが、発表から数週間しか経っていない最新の定理(多項式フライマン–ルジャ予想の解決)を証明支援システムLeanで形式化し、機械による検証を完了したと報告した。\n\n四色定理(定理と証明レイヤー)が突きつけた「計算機による証明は信用できるか」という問いから約半世紀を経て、今度は計算機が証明の正しさを保証する側に回った。大人数が分担して証明を検証する、数学の共同研究の新しい形も示した。","detail":null,"credibility":"unverified","credibility_note":"形式化完了の時期と作業規模は著者らのブログ等の当事者発信に基づき、第三者によるまとまった検証記録はない。","sources":[{"title":"Terence Tao's blog: Formalizing the proof of PFR in Lean4 (2023)","url":null}]}]},{"slug":"science-neuroscience","title":"脳科学の最前線","description":"1848年の事故症例から脳直結インターフェースまで。脳の理解をめぐる発見、計測と操作の技術、医療と社会への波及の3層を重ね、最も身近で最も未知の臓器への接近を追う。","category":"science-nature","language":"ja","start_year":1848,"end_year":2024,"layers":[{"name":"脳の理解","color":"blue"},{"name":"計測と操作の技術","color":"green"},{"name":"医療と社会","color":"pink"}],"events":[{"date":"1848-09-13","precision":"day","end_date":null,"type":"point","layer":"医療と社会","title":"フィニアス・ゲージ、前頭葉損傷の事故","summary":"米国の鉄道工事現場で爆発事故が起き、作業員フィニアス・ゲージの頭部を鉄棒が貫通した。彼は一命を取り留めたが、前頭葉の損傷後に人格が変わったと報告された。\n\n脳の部位と心の働きの対応を示す症例として教科書に載り続けている。ただし実際の人格変化の程度や経過は同時代の記録が乏しく、後年の誇張も指摘される。**症例が語れることと語れないこと**の教訓まで含めた、脳科学の古典である。","detail":null,"credibility":"disputed","credibility_note":"事故後の人格変化の内容と程度は主治医ハーローの限られた記録に依存しており、後世の記述には誇張や脚色が指摘されている。","sources":[{"title":"Wikipedia: Phineas Gage","url":"https://en.wikipedia.org/wiki/Phineas_Gage"}]},{"date":"1861-01-01","precision":"year","end_date":null,"type":"point","layer":"脳の理解","title":"ブローカ、言語野を特定","summary":"外科医ブローカが、発話を失った患者「タン」の死後解剖で左前頭葉の限局した損傷を確認し、発話をつかさどる領域(後のブローカ野)の存在を報告した。\n\n「脳の機能は場所ごとに分かれている」とする機能局在論に、初めて決定的な証拠を与えた。頭蓋骨の形から性格を読む骨相学の失敗で疑われていた局在の考えが科学として復権し、1874年のウェルニッケによる感覚性言語野の発見へと続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Paul Broca","url":"https://en.wikipedia.org/wiki/Paul_Broca"}]},{"date":"1873-01-01","precision":"year","end_date":null,"type":"point","layer":"計測と操作の技術","title":"ゴルジ染色法の開発","summary":"イタリアのゴルジが、ごく一部の神経細胞だけを全形まで黒く染め出す鍍銀染色法を開発した。細胞が密集する脳組織の中から、個々の細胞のかたちを初めて浮かび上がらせた技術である。\n\nこの染色をスペインのカハールが徹底的に使い込み、神経細胞は独立した単位だとするニューロン説(脳の理解レイヤー)に到達する。**見る技術が理解の限界を決める**という、本年表を貫く主旋律の最初の例となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Golgi's method","url":"https://en.wikipedia.org/wiki/Golgi%27s_method"}]},{"date":"1888-01-01","precision":"year","end_date":null,"type":"point","layer":"脳の理解","title":"カハール、ニューロン説の証拠を示す","summary":"カハールがゴルジ染色を改良し、神経細胞どうしは連続した網ではなく独立した細胞として接しているとする観察を発表し始めた。神経系の単位をニューロンとする学説の実証的な基盤である。\n\n皮肉にも染色法の開発者ゴルジ自身は細胞が融合した網だとする網状説を支持し続け、1906年に2人が同時受賞したノーベル賞の記念講演でも真っ向から対立した。接合部シナプスの実在が電子顕微鏡で確認されるのは1950年代である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Santiago Ramón y Cajal","url":"https://en.wikipedia.org/wiki/Santiago_Ram%C3%B3n_y_Cajal"}]},{"date":"1929-01-01","precision":"year","end_date":null,"type":"point","layer":"計測と操作の技術","title":"ベルガー、ヒト脳波(EEG)を報告","summary":"ドイツの精神科医ベルガーが、頭皮の上から人間の脳の電気活動を記録した「脳波」の論文を発表した。頭を開かずに生きた人間の脳の活動を捉えた、最初の計測技術である。\n\n発表当初は疑いの目で見られたが、1934年に英国の生理学者エイドリアンらが追試して確立した。てんかんの診断や睡眠研究を一変させ、脳を「開けずに測る」系譜はfMRI(1990年)や脳直結インターフェース(2023年)へと続いていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hans Berger","url":"https://en.wikipedia.org/wiki/Hans_Berger"}]},{"date":"1952-01-01","precision":"year","end_date":null,"type":"point","layer":"脳の理解","title":"ホジキン・ハクスリーの神経興奮モデル","summary":"ホジキンとハクスリーがヤリイカの巨大軸索を使った実験から、神経の電気信号(活動電位)はナトリウムとカリウムのイオンの流れで生じることを示し、その全過程を微分方程式で記述した。\n\n神経の働きを物理と数学の言葉で定量的に説明したこの仕事は、脳を計算する装置として扱う計算論的神経科学の原点となった。2人は1963年にノーベル賞を受賞している。イオンの通り道であるチャネルの実体の解明は後年に続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hodgkin–Huxley model","url":"https://en.wikipedia.org/wiki/Hodgkin%E2%80%93Huxley_model"}]},{"date":"1953-09-01","precision":"month","end_date":null,"type":"point","layer":"医療と社会","title":"患者H.M.の手術、記憶研究の転機に","summary":"重いてんかんの治療のため、米国の患者ヘンリー・モレゾン(H.M.)の左右の海馬を含む内側側頭葉が切除された。発作は減ったが、彼は新しい出来事を覚えられなくなった。\n\nミルナーらによる半世紀の研究で、記憶には海馬を必要とする種類とそうでない種類があることが分かり、記憶研究の土台となった。治療が生んだ悲劇が科学を進めたという**患者の犠牲の上に立つ知見**であり、研究倫理の教材でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Henry Molaison","url":"https://en.wikipedia.org/wiki/Henry_Molaison"}]},{"date":"1959-01-01","precision":"year","end_date":null,"type":"point","layer":"脳の理解","title":"ヒューベルとウィーゼル、視覚野の応答を発見","summary":"ヒューベルとウィーゼルが、ネコの一次視覚野に特定の傾きの線分にだけ反応する神経細胞があることを発見した。視覚は単純な特徴の検出から段階的に組み立てられる、という理解の出発点である。\n\n幼少期の経験が視覚回路を形作る「臨界期」の発見と合わせて1981年のノーベル賞となった。階層的に特徴を抽出するという考え方は、半世紀後の深層学習における畳み込みネットワークの設計にも影響を与えている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: David H. Hubel","url":"https://en.wikipedia.org/wiki/David_H._Hubel"}]},{"date":"1971-01-01","precision":"year","end_date":null,"type":"point","layer":"脳の理解","title":"オキーフ、場所細胞を発見","summary":"オキーフらが、ラットの海馬に「自分が特定の場所にいるときだけ発火する」神経細胞を見つけ、場所細胞と名付けた。脳内に空間の地図が実在することを示す発見である。\n\n2005年にはモーザー夫妻が格子状の座標系を作るグリッド細胞を発見し、3人は2014年のノーベル賞を受賞した。H.M.の症例(医療と社会レイヤー)が示した海馬と記憶の深い関係に、細胞レベルの説明を与えていく系譜の起点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Place cell","url":"https://en.wikipedia.org/wiki/Place_cell"}]},{"date":"1973-01-01","precision":"year","end_date":null,"type":"point","layer":"脳の理解","title":"長期増強(LTP)の発見","summary":"ブリスとレモが、ウサギの海馬でシナプスの伝達効率が刺激の後に長時間強まったままになる現象を報告し、長期増強(LTP)と名付けた。\n\n「記憶はシナプスの強さの変化として蓄えられる」という1949年のヘッブの仮説に、初めて具体的な生理現象を対応づけた発見である。記憶の分子機構の研究はこの現象を軸に展開し、後の認知症治療の研究(医療と社会レイヤー)にも基礎を提供している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Long-term potentiation","url":"https://en.wikipedia.org/wiki/Long-term_potentiation"}]},{"date":"1990-01-01","precision":"year","end_date":null,"type":"point","layer":"計測と操作の技術","title":"fMRIの原理となるBOLD信号を発見","summary":"米ベル研究所の小川誠二が、血液中の酸素量の変化がMRI信号に影響する現象(BOLD効果)を報告した。神経活動に伴う血流の変化を、造影剤なしで画像化できることを意味する発見である。\n\n数年のうちに機能的MRI(fMRI)として実用化され、健常な人間の脳活動を非侵襲で見る研究が爆発的に広がった。心を画像で語る時代の幕開けだが、血流はあくまで神経活動の間接指標である点への注意も繰り返し指摘されてきた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Functional magnetic resonance imaging","url":"https://en.wikipedia.org/wiki/Functional_magnetic_resonance_imaging"}]},{"date":"1990-01-01","precision":"year","end_date":"1999-12-31","type":"period","layer":"医療と社会","title":"米国「脳の10年」","summary":"米国が1990年代を「脳の10年」と定め、大統領布告のもとで脳研究の振興と社会への普及を図った。脳研究が国家の旗印として掲げられた最初の例である。\n\n神経科学の学会規模と研究費はこの時期に大きく拡大し、fMRI(計測と操作の技術レイヤー)の普及とも重なって、健常者の心を扱う認知神経科学が確立した。国家主導の大型脳科学という路線は、2013年の米欧のプロジェクトへと引き継がれていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Decade of the Brain","url":"https://en.wikipedia.org/wiki/Decade_of_the_Brain"}]},{"date":"2005-08-01","precision":"month","end_date":null,"type":"point","layer":"計測と操作の技術","title":"光遺伝学、神経活動を光で操作","summary":"ボイデンとダイセロスらが、藻類由来の光感受性タンパク質を神経細胞に発現させ、光を当てるだけで特定の細胞の活動をミリ秒単位で制御する手法を報告した。光遺伝学の実質的な誕生である。\n\n「観察する」から**狙った回路を操作して因果を確かめる**への転換をもたらし、神経科学の標準手法として一気に普及した。特定の記憶を人工的に呼び起こす実験など、かつては思考実験だった研究を現実のものにしている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Optogenetics","url":"https://en.wikipedia.org/wiki/Optogenetics"}]},{"date":"2013-04-02","precision":"day","end_date":null,"type":"point","layer":"医療と社会","title":"米BRAINイニシアチブ発表","summary":"オバマ大統領が、脳の神経回路の活動を大規模に記録・解読する技術開発を掲げる研究計画BRAINイニシアチブを発表した。ヒトゲノム計画に続く国家主導の大型生命科学と位置づけられた。\n\n「脳の10年」(1990年代)から続く投資の系譜にあるが、疾患の解明そのものより計測技術の開発を主眼に据えた設計が特徴で、光遺伝学(計測と操作の技術レイヤー)以後の「道具が科学を駆動する」時代を反映している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: BRAIN Initiative","url":"https://en.wikipedia.org/wiki/BRAIN_Initiative"}]},{"date":"2013-10-01","precision":"month","end_date":null,"type":"point","layer":"医療と社会","title":"ヒューマン・ブレイン・プロジェクト始動","summary":"EUの旗艦プロジェクトとしてヒューマン・ブレイン・プロジェクト(HBP)が始動した。提唱者マークラムは10年でヒトの脳全体をスーパーコンピュータ上に再現すると訴え、約10億ユーロ規模の予算が組まれた。\n\nしかし「10年で脳のシミュレーション」という看板は実現性への疑問を呼び、発足翌年には数百人の研究者が公開書簡で抗議、運営は再編された。2023年の終了までに研究基盤は残したが、当初の看板は実現しなかった。","detail":null,"credibility":"unverified","credibility_note":"「10年でヒト脳全体をシミュレーションする」という当初目標は科学的裏づけが確立しておらず、実現しないまま計画は再編・終了した。","sources":[{"title":"Wikipedia: Human Brain Project","url":"https://en.wikipedia.org/wiki/Human_Brain_Project"}]},{"date":"2021-06-07","precision":"day","end_date":null,"type":"point","layer":"医療と社会","title":"アルツハイマー新薬アデュカヌマブ承認","summary":"米FDAが、脳内のアミロイドβを除去する抗体薬アデュカヌマブを、約20年ぶりのアルツハイマー病新薬として迅速承認した。原因物質とされるタンパク質を直接の標的にした初の承認薬である。\n\nしかし臨床的な有効性の証拠は不十分だとして諮問委員会はほぼ全会一致で承認に反対しており、承認後に委員3名が辞任する異例の事態となった。アミロイド仮説(脳の理解レイヤー)の妥当性をめぐる論争を象徴する出来事である。","detail":null,"credibility":"disputed","credibility_note":"認知機能の低下を抑える臨床効果があるかどうかで評価が真っ二つに分かれ、FDA内部と諮問委員会の判断も対立した。","sources":[{"title":"Wikipedia: Aducanumab","url":"https://en.wikipedia.org/wiki/Aducanumab"}]},{"date":"2022-07-21","precision":"day","end_date":null,"type":"point","layer":"脳の理解","title":"アミロイド研究の重要論文に画像疑義","summary":"Science誌の調査報道が、アルツハイマー病のアミロイド仮説を支えてきた2006年の著名論文に画像の加工疑惑があると報じた。問題の論文は2024年に撤回された。\n\n特定のアミロイド種の役割を示したとされる同論文への疑義は、**一つの仮説に研究資源が集中する危うさ**の議論を呼んだ。ただし仮説自体は他の証拠にも支えられており、翌年のレカネマブ承認(医療と社会レイヤー)で治療応用は一定の裏づけを得ている。","detail":null,"credibility":"disputed","credibility_note":"画像加工の疑義と論文撤回は確定したが、それがアミロイド仮説全体の妥当性をどこまで揺るがすかは研究者の間で評価が分かれる。","sources":[{"title":"Science: Blots on a field? (2022-07-21)","url":null}]},{"date":"2023-07-06","precision":"day","end_date":null,"type":"point","layer":"医療と社会","title":"レカネマブ、正式承認","summary":"米FDAがエーザイとバイオジェンの抗アミロイド抗体薬レカネマブを正式承認した。臨床試験で認知機能の低下を27%緩やかにしたと報告され、日本でも同年9月に承認された。\n\n効果の大きさが患者の生活にとって意味のある水準かどうかは議論が続くが、症状への対症療法ではなく疾患の進行に働きかける治療が初めて標準医療に入った。LTP(1973年)以来の基礎研究が半世紀を経て薬へ結実した形である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Lecanemab","url":"https://en.wikipedia.org/wiki/Lecanemab"}]},{"date":"2023-08-23","precision":"day","end_date":null,"type":"point","layer":"計測と操作の技術","title":"脳信号から会話を復元するBCI","summary":"脳に埋め込んだ電極の信号から発話を毎分約60〜80語の速度で文章化する脳直結インターフェース(BCI)の成果を、米国の2チームがNature誌に同時発表した。ALSや脳幹梗塞で話せなくなった参加者が、考えるだけで会話できることを示した。\n\nベルガーの脳波(1929年)から続く「脳を読む」技術が、実用的な意思疎通の速度に達した画期である。読み取り精度の向上は、思考のプライバシーという倫理問題(医療と社会レイヤー)も現実のものにした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Brain–computer interface","url":"https://en.wikipedia.org/wiki/Brain%E2%80%93computer_interface"}]},{"date":"2024-01-29","precision":"day","end_date":null,"type":"point","layer":"計測と操作の技術","title":"ニューラリンク、初のヒト埋め込みを発表","summary":"イーロン・マスク率いるニューラリンク社が、脳埋め込み型デバイスを初めてヒトに移植したとSNS上で発表した。同社はその後、頸髄損傷のある参加者が思考でカーソルを操作する様子を配信した。\n\n学術界のBCI研究(2023年)と異なり、査読論文や詳細データの公表を伴わない企業発表が先行する点には批判がある。脳インターフェースの主戦場が研究室から企業へ広がったことを示す出来事であり、安全性と透明性の検証はこれからである。","detail":null,"credibility":"unverified","credibility_note":"移植の実施と経過は同社および参加者本人の発表・配信に基づいており、査読を経た詳細データは公表されていない。","sources":[{"title":"Wikipedia: Neuralink","url":"https://en.wikipedia.org/wiki/Neuralink"}]}]},{"slug":"science-ocean-exploration","title":"海洋探査の歴史","description":"帆船による世界周航から有人潜水艇、無人機、そして深海資源をめぐる国際ルールまで。探査技術・発見・制度の3層を重ね、人類が最後のフロンティアである深海へどう到達してきたかをたどる。","category":"science-nature","language":"ja","start_year":1872,"end_year":2023,"layers":[{"name":"探査技術","color":"blue"},{"name":"発見と科学","color":"teal"},{"name":"社会と制度","color":"orange"}],"events":[{"date":"1872-12-21","precision":"day","end_date":"1876-05-24","type":"period","layer":"発見と科学","title":"チャレンジャー号探検航海、海洋学の誕生","summary":"英国のチャレンジャー号がポーツマスを出航し、3年半かけて約13万kmを周航。約360地点で測深と生物採集を行い、4,700種余りの新種を報告し、マリアナ海溝の深部も測深した。\n\n国家が科学のために艦船を投じた最初期の例で、全50巻の報告書は海洋学という学問の出発点とされる。以後の探査は「深さ」への挑戦(探査技術レイヤー)と、海をめぐる国際的な制度づくり(社会と制度レイヤー)へと分岐していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Challenger expedition","url":"https://en.wikipedia.org/wiki/Challenger_expedition"}]},{"date":"1925-04-01","precision":"month","end_date":"1927-06-01","type":"period","layer":"探査技術","title":"メテオール号が音響測深で南大西洋を観測","summary":"ドイツの観測船メテオール号が南大西洋を14回横断し、音響測深機で6万点を超える水深データを取得。大西洋中央海嶺が南北に連続する巨大山脈であることを示した。\n\nロープを下ろして測る従来の測深から**音で海底を測る**時代への転換点である。ここで得られた海底地形の知識は、後の海洋底拡大説とプレートテクトニクス確立(発見と科学レイヤー)の伏線となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ドイツ海洋観測船メテオール号 南大西洋観測航海報告(1925–1927)","url":null}]},{"date":"1934-08-15","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"ビービとバートン、潜水球で水深923mに到達","summary":"生物学者ビービと技師バートンが鋼鉄球「バチスフィア」でバミューダ沖の水深923m(3,028フィート)に達し、人類が初めて深海の生物をその場で直接観察した。\n\n母船からケーブルで吊るす方式のため行動範囲は限られたが、発光生物の目撃記録は深海生物学への関心を一気に高めた。自力で潜航するバチスカーフ(1960年のトリエステ)へ続く技術的な布石である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bathysphere","url":"https://en.wikipedia.org/wiki/Bathysphere"}]},{"date":"1943-01-01","precision":"year","end_date":null,"type":"point","layer":"探査技術","title":"クストーとガニャンがアクアラングを開発","summary":"占領下のフランスでクストーと技師ガニャンが、呼吸に応じて空気を供給するレギュレーターを備えた自給気式潜水器「アクアラング」を完成させた。\n\n潜水を軍や職業ダイバーの独占から解放し、戦後は研究者や市民が自ら海中を観察する道を開いた。浅海の生態研究や水中考古学(発見と科学レイヤー)の裾野を広げ、海洋ドキュメンタリーという文化も生み出した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Aqua-Lung","url":"https://en.wikipedia.org/wiki/Aqua-Lung"}]},{"date":"1960-01-23","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"トリエステ号がチャレンジャー海淵に到達","summary":"ピカールとウォルシュが乗るバチスカーフ「トリエステ」がマリアナ海溝チャレンジャー海淵の底に到達し、人類が**海の最深部に立った**最初の瞬間となった。\n\n到達水深は当初11,521mと発表され、後の較正で約10,916mに修正された。海底で魚らしき生物を見たという証言は深海にも生命が満ちる証拠と受け止められたが、種の同定には議論が残る。有人での再訪は2012年まで52年間途絶えることになる。","detail":null,"credibility":"disputed","credibility_note":"当初発表の水深11,521mは後に約10,916mへ修正されており、計測値には資料により幅がある。海底で目撃したとされる魚の正体にも異論がある。","sources":[{"title":"Wikipedia: Trieste (bathyscaphe)","url":"https://en.wikipedia.org/wiki/Trieste_(bathyscaphe)"}]},{"date":"1977-02-01","precision":"month","end_date":null,"type":"point","layer":"発見と科学","title":"ガラパゴス沖で熱水噴出孔を発見","summary":"潜水艇アルビン号の調査隊がガラパゴス地溝帯の水深約2,500mで熱水噴出孔を発見した。周囲にはチューブワームや二枚貝が密集し、太陽光に依存しない生態系が広がっていた。\n\n光合成ではなく**化学合成が支える生態系**の発見は生物学の前提を覆し、生命の起源や地球外生命の議論にも波及した。1960年代の有人潜水艇の整備(探査技術レイヤー)が科学的発見に結実した代表例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hydrothermal vent","url":"https://en.wikipedia.org/wiki/Hydrothermal_vent"}]},{"date":"1982-12-10","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"国連海洋法条約、モンテゴ・ベイで署名開放","summary":"「海の憲法」と呼ばれる国連海洋法条約がジャマイカのモンテゴ・ベイで署名開放された。領海12海里と排他的経済水域200海里を定め、深海底とその資源を**人類の共同財産**と位置づけた。\n\n測深と地質調査の蓄積により深海採鉱が現実味を帯びたことが、深海底制度の交渉を長期化させた一因である。発効は12年後の1994年で、探査技術の進歩に制度が追いつくまでの時差を示している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United Nations Convention on the Law of the Sea","url":"https://en.wikipedia.org/wiki/United_Nations_Convention_on_the_Law_of_the_Sea"}]},{"date":"1985-09-01","precision":"day","end_date":null,"type":"point","layer":"発見と科学","title":"バラードらがタイタニック号の残骸を発見","summary":"ウッズホール海洋研究所のバラードらが、曳航式カメラシステム「アルゴ」により水深約3,800mに沈むタイタニック号を沈没から73年ぶりに発見した。\n\n調査は米海軍の原子力潜水艦残骸調査の副産物として行われていたことが後年公表された。無人カメラで広域を捜索し有人艇で確認する手法は無人機中心の深海探査への転換を象徴し、沈没船考古学と深海観光をめぐる議論も呼び起こした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Wreck of the Titanic","url":"https://en.wikipedia.org/wiki/Wreck_of_the_Titanic"}]},{"date":"1994-11-16","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"海洋法条約が発効、国際海底機構が発足","summary":"署名開放から12年を経て国連海洋法条約が発効し、深海底の鉱物資源を管理する国際海底機構(ISA)がジャマイカのキングストンに設立された。\n\n深海底の商業採鉱を国際管理の下に置く枠組みがようやく動き出したが、肝心の採掘規則づくりは30年後も完了していない。技術(探査技術レイヤー)より制度の時計が遅く進む構図は、2021年のナウルによる「2年ルール」発動へとつながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: International Seabed Authority","url":"https://en.wikipedia.org/wiki/International_Seabed_Authority"}]},{"date":"1995-03-24","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"無人探査機かいこうがチャレンジャー海淵に到達","summary":"海洋科学技術センター(現JAMSTEC)の無人探査機「かいこう」がチャレンジャー海淵で水深10,911mを記録し、無人機として初めて世界最深部に到達した。\n\n以後かいこうは最深部の堆積物を採取し、超高圧下で生きる微生物の研究へ道を開いた。1960年のトリエステ以来35年ぶりの最深部到達が無人機によって成し遂げられたことは、深海探査の主役交代を印象づけた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kaikō ROV","url":"https://en.wikipedia.org/wiki/Kaik%C5%8D_ROV"}]},{"date":"2000-01-01","precision":"year","end_date":"2010-10-04","type":"period","layer":"発見と科学","title":"国際共同調査「海洋生物センサス」","summary":"80カ国超の研究者約2,700人が参加する10年計画の国際調査「海洋生物センサス」が始動した。海洋生物の多様性・分布・個体数を体系的に記録し、2010年の最終報告までに1,200種を超える新種を正式に記載した。\n\n単発の航海ではなく**世界規模のデータベースづくり**へと海洋研究の様式を変えた計画であり、成果は公海の保護区設計(社会と制度レイヤー)の科学的基盤にもなっていく。","detail":null,"credibility":"unverified","credibility_note":"参加者数や新種数は計画側の最終報告に基づく集計で、その後の分類学的な見直しにより数値は変動しうる。","sources":[{"title":"Wikipedia: Census of Marine Life","url":"https://en.wikipedia.org/wiki/Census_of_Marine_Life"}]},{"date":"2007-11-01","precision":"month","end_date":null,"type":"point","layer":"探査技術","title":"海洋観測フロート網Argoが3,000基体制に","summary":"世界の海にセンサー付き自動フロートを漂わせる国際観測網Argoが、目標としていた3,000基の展開に到達したと発表された。各フロートは約10日ごとに潜航と浮上を繰り返し、水温・塩分の鉛直データを衛星経由で送り続ける。\n\n船が行かない海域を含めて海洋内部を常時監視する体制が初めて整い、海面上昇や海洋熱吸収の評価など、気候変動をめぐる政策議論(社会と制度レイヤー)を支える基礎インフラとなった。","detail":null,"credibility":"unverified","credibility_note":"3,000基到達の時期は計画側の集計に基づくもので、稼働中フロートの定義や集計時点により数値は前後する。","sources":[{"title":"Wikipedia: Argo (oceanography)","url":"https://en.wikipedia.org/wiki/Argo_(oceanography)"}]},{"date":"2012-03-26","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"キャメロンが単独潜航でチャレンジャー海淵へ","summary":"映画監督キャメロンが潜水艇ディープシー・チャレンジャーで単独潜航し、チャレンジャー海淵の水深10,908mに到達した。1960年のトリエステ以来52年ぶりの有人到達だった。\n\n国家事業ではなく個人の資金と情熱による探査だった点が新しく、撮影された映像と採取試料は科学チームと共有された。民間資金が深海探査を担う流れは、2019年のファイブ・ディープス遠征へと続いていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Deepsea Challenger","url":"https://en.wikipedia.org/wiki/Deepsea_Challenger"}]},{"date":"2017-06-01","precision":"month","end_date":null,"type":"point","layer":"発見と科学","title":"海底地形図計画「Seabed 2030」開始","summary":"日本財団とGEBCOが、2030年までに世界の海底地形図を完成させる国際プロジェクト「Seabed 2030」を国連海洋会議で発表した。開始時点で現代的な水準で測深済みの海底は全体の約6%にすぎなかった。\n\n火星の地形より粗くしか分かっていない地球の海底を埋める試みで、各国の調査船や民間船が持つ測深データを持ち寄る方式をとる。地形データは資源探査や大陸棚の境界画定(社会と制度レイヤー)にも直結する。","detail":null,"credibility":"verified","credibility_note":null,"so
