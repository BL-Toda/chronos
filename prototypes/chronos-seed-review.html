した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 禁門の変","url":"https://ja.wikipedia.org/wiki/禁門の変"}]},{"date":"1864-09-05","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"四国艦隊、下関を砲撃","summary":"英仏米蘭の連合艦隊が長州藩の砲台を攻撃・占拠。前年からの外国船砲撃への報復だった。","detail":"旧暦元治元年8月5日から数日間。長州は1863年に攘夷実行として関門海峡を通る外国船を砲撃していた。講和交渉には高杉晋作が臨み、賠償金は幕府が負担することになる。禁門の変で朝敵となった直後(幕府レイヤー)の敗戦で、長州藩内では攘夷の非現実性が認識され、翌年の高杉らの藩政掌握、そして薩長同盟(思想レイヤー)へと方向が変わる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 下関戦争","url":"https://ja.wikipedia.org/wiki/下関戦争"}]},{"date":"1866-03-07","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"薩長同盟、京都で成立","summary":"対立していた薩摩と長州が坂本龍馬らの仲介で提携。倒幕への政治的枠組みが生まれた。","detail":"旧暦慶応2年1月21日とされる。禁門の変で交戦した両藩だが、幕府による長州再征を前に、薩摩が長州を支援する六か条に合意した。合意内容は木戸孝允の書簡裏に龍馬が朱書きで裏書きした形で残る。同年、幕府レイヤーでは第二次長州征討が始まり、この同盟によって薩摩は出兵を拒む。外交レイヤーで英国が薩長に接近していた動きとも連動している。","credibility":"disputed","credibility_note":"成立日は1月21日説と22日説があり、龍馬の仲介がどの程度決定的だったかも研究者間で評価が分かれる。「同盟」の性格(軍事同盟か政治的提携か)についても議論がある。","sources":[{"title":"Wikipedia（日本語版）: 薩長同盟","url":"https://ja.wikipedia.org/wiki/薩長同盟"}]},{"date":"1866-07-18","precision":"day","end_date":"1866-09-29","type":"period","layer":"幕府と諸藩","title":"第二次長州征討、幕府軍が敗退","summary":"幕府は諸藩を動員して長州を攻めたが各方面で敗れ、将軍家茂の死を機に休戦。幕府の軍事的威信が失われた。","detail":"旧暦慶応2年6月から8月。薩摩は薩長同盟(思想レイヤー)を理由に出兵を拒み、長州は英国経由で得た新式銃で対抗した。7月20日(旧暦)に将軍家茂が大坂城で死去し、停戦の勅命で終結する。同じ年、諸国で世直し一揆や打ちこわしが頻発し、物価高騰の中での動員は幕府への不満を高めた。徳川慶喜が年末に将軍となるが、幕府の主導権はすでに揺らいでいた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 長州征討","url":"https://ja.wikipedia.org/wiki/長州征討"}]},{"date":"1867-01-30","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"孝明天皇崩御、政局の均衡が崩れる","summary":"公武合体を支持し倒幕に否定的だった孝明天皇が35歳で急逝。翌月、明治天皇が14歳で践祚した。","detail":"旧暦慶応2年12月25日。孝明天皇は攘夷を強く求めつつ幕府との協調を重んじ、倒幕派にとっては壁でもあった。崩御により幼い明治天皇のもとで岩倉具視ら倒幕派公家が復権し、幕府レイヤーの王政復古へ道が開く。同じ冬、徳川慶喜が将軍に就いており、幕府と朝廷の両方で指導者が交代した数週間だった。","credibility":"disputed","credibility_note":"死因は天然痘とする記録が公式だが、回復期に急変したことから毒殺説が古くから唱えられており、史料上の決着はついていない。","sources":[{"title":"Wikipedia（日本語版）: 孝明天皇","url":"https://ja.wikipedia.org/wiki/孝明天皇"}]},{"date":"1867-11-09","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"大政奉還、慶喜が政権を朝廷に返上","summary":"徳川慶喜が二条城で政権返上を上表。武力倒幕の名分を先回りして奪う狙いがあったとされる。","detail":"旧暦慶応3年10月14日。土佐藩の建白を受けた決断で、同じ日に薩長には討幕の密勅が下されていた。政権を返しても徳川家が諸侯会議の中心に残ることを想定していたとみられる。思想レイヤーではこの1か月後に坂本龍馬が暗殺され、翌月には王政復古の大号令が発せられる。260年余の幕府政治が形式上終わり、外交上も列強への対応主体が問われる状況となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 大政奉還","url":"https://ja.wikipedia.org/wiki/大政奉還"}]},{"date":"1867-12-10","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"坂本龍馬、京都近江屋で暗殺される","summary":"大政奉還の1か月後、龍馬と中岡慎太郎が京都の宿で襲われ死亡。龍馬は33歳だった。","detail":"旧暦慶応3年11月15日。龍馬は薩長同盟の仲介、海援隊、大政奉還につながる建白などに関わり、新政府構想「船中八策」の伝承でも知られる。幕府レイヤーで大政奉還が実現し、王政復古を目前にした時期の死であり、以後の政局は西郷・大久保・岩倉らの主導で武力による決着へ進む。外交レイヤーでは兵庫開港が翌月に迫っていた。","credibility":"disputed","credibility_note":"実行犯は京都見廻組とする説が有力だが、新選組説や薩摩藩関与説など諸説があり、確定していない。「船中八策」の史料的裏付けにも疑義がある。","sources":[{"title":"Wikipedia（日本語版）: 近江屋事件","url":"https://ja.wikipedia.org/wiki/近江屋事件"}]},{"date":"1868-01-03","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"王政復古の大号令、新政府樹立を宣言","summary":"岩倉具視・薩摩らが御所を固めて幕府と摂関の廃止を宣言。同夜の小御所会議で慶喜の辞官納地を決めた。","detail":"旧暦慶応3年12月9日。大政奉還後も残る徳川家の影響力を排除するための政変で、天皇親政の名の下に総裁・議定・参与の三職を置いた。孝明天皇の崩御(思想レイヤー)で倒幕派公家が復権していたことが背景にある。慶喜側は反発し、翌月の鳥羽・伏見の戦いで武力衝突に至る。外交面では列強がどちらを日本政府と認めるかが焦点となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 王政復古 (日本)","url":"https://ja.wikipedia.org/wiki/王政復古_(日本)"}]},{"date":"1868-01-27","precision":"day","end_date":"1869-06-27","type":"period","layer":"幕府と諸藩","title":"戊辰戦争、鳥羽・伏見から箱館まで","summary":"新政府軍と旧幕府勢力の内戦。鳥羽・伏見に始まり、江戸開城、東北諸藩の戦い、箱館五稜郭の降伏で終結した。","detail":"旧暦慶応4年1月3日に開戦、明治2年5月18日に終結。錦の御旗を掲げた新政府軍が緒戦で勝ち、慶喜は江戸へ退いて恭順した。江戸城は西郷と勝海舟の交渉で無血開城となる。思想レイヤーでは戦争中の1868年4月に五箇条の御誓文が出され、外交レイヤーでは列強が局外中立を宣言して旧幕府への武器供給を止めた。会津・長岡などの戦いは深い遺恨を残した。","credibility":"unverified","credibility_note":"戦死者総数は約8,000人前後とする推計が多いが、資料により幅があり確定値はない。","sources":[{"title":"Wikipedia（日本語版）: 戊辰戦争","url":"https://ja.wikipedia.org/wiki/戊辰戦争"}]},{"date":"1868-04-06","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"五箇条の御誓文、新政府の基本方針を示す","summary":"「広く会議を興し万機公論に決すべし」など五か条を天皇が神々に誓う形で公布。新政府の理念となった。","detail":"旧暦慶応4年3月14日。由利公正の原案を福岡孝弟、木戸孝允が修正した。戊辰戦争(幕府レイヤー)のさなか、諸藩や列強に新政府の方向性を示す必要があった。「公論」の理念は後の自由民権運動が政府に約束の履行を迫る根拠にもなる。翌日には民衆向けの五榜の掲示が出され、キリスト教禁止など旧幕府の政策を継承した点で、理念と現実の差もあった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 五箇条の御誓文","url":"https://ja.wikipedia.org/wiki/五箇条の御誓文"},{"title":"国立公文書館デジタルアーカイブ「五箇条の御誓文」","url":null}]},{"date":"1871-08-29","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"廃藩置県、藩が消え中央集権国家へ","summary":"261の藩を廃して府県を置き、知藩事を東京に集めた。薩長土の兵力を背景に、抵抗なく断行された。","detail":"1869年の版籍奉還で藩主は知藩事となっていたが、徴税と軍事は藩に残っていた。西郷隆盛の主導で薩長土三藩の兵1万を御親兵として集め、その武力を背景に一挙に実施した。旧藩主は東京居住を命じられ、藩債と家臣の俸禄は政府が引き継ぐ。数か月後の岩倉使節団派遣(外交レイヤー)は、この改革で内政の骨格が固まったことを前提としていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 廃藩置県","url":"https://ja.wikipedia.org/wiki/廃藩置県"}]},{"date":"1871-12-23","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"岩倉使節団、横浜を出航","summary":"岩倉具視を全権に、大久保・木戸・伊藤ら政府首脳が米欧12か国を約1年10か月かけて視察した。","detail":"旧暦明治4年11月12日出発。当初の目的だった条約改正の予備交渉は米国で行き詰まり、以後は制度・産業の視察に重点を移した。津田梅子ら女子留学生も同行している。使節団不在の間、留守政府は学制・徴兵令・地租改正を進め、帰国後には征韓論をめぐって明治六年政変(思想レイヤー)が起きる。幕府レイヤーの廃藩置県の直後という時期も注目される。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 岩倉使節団","url":"https://ja.wikipedia.org/wiki/岩倉使節団"}]},{"date":"1873-01-01","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"太陽暦を採用、明治5年12月3日が明治6年1月1日に","summary":"太陰太陽暦を廃止しグレゴリオ暦へ切り替え。この年表の日付も、これ以前は旧暦を新暦に換算している。","detail":"改暦の布告は1872年12月9日(旧暦11月9日)と急で、1か月足らずで実施された。西洋との条約・貿易実務に合わせる狙いがあった。この年表では、それ以前の出来事はすべて旧暦を新暦に換算した日付で表し、detailに旧暦を併記している。同じ年、幕府レイヤーの旧士族には徴兵令が、思想レイヤーでは政変が待っており、暦の切替は近代化の一区切りだった。","credibility":"unverified","credibility_note":"改暦を急いだ理由として「明治6年に閏月があり官吏の給与を13か月分払う財政負担を避けた」とする説は大隈重信の回想に基づき、一次史料による裏付けは限定的。","sources":[{"title":"Wikipedia（日本語版）: 明治改暦","url":"https://ja.wikipedia.org/wiki/明治改暦"}]},{"date":"1873-10-24","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"明治六年政変、西郷・板垣らが下野","summary":"朝鮮への使節派遣をめぐり政府が分裂。西郷隆盛、板垣退助、江藤新平ら参議が辞職し政府を去った。","detail":"岩倉使節団(外交レイヤー)の帰国後、内治優先を唱える大久保・岩倉と、西郷の朝鮮派遣を決めていた留守政府が対立した。西郷の辞表は10月24日に受理され、翌年には板垣らが民撰議院設立建白書を出して自由民権運動が始まる。西郷は鹿児島に帰り、士族の不満の受け皿となる。ここから佐賀の乱、西南戦争(幕府と諸藩レイヤー)へと不平士族の反乱が続く。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 明治六年政変","url":"https://ja.wikipedia.org/wiki/明治六年政変"}]},{"date":"1877-01-29","precision":"day","end_date":"1877-09-24","type":"period","layer":"幕府と諸藩","title":"西南戦争、最後の士族反乱","summary":"鹿児島の私学校党が西郷隆盛を擁して蜂起。熊本城攻防、田原坂の激戦を経て、城山で西郷が自刃し終結。","detail":"1月29日の私学校生徒による火薬庫襲撃に始まり、9月24日に鹿児島城山で終わった。徴兵制の政府軍が旧武士の反乱を鎮圧したことで、武力による政変の時代は終わり、以後の反政府運動は言論と自由民権運動(思想レイヤー)へ向かう。戦費は政府財政を圧迫し、不換紙幣の増発がインフレを招いた。同年、大久保利通は内務卿として殖産興業を進めていたが、翌年に暗殺される。","credibility":"unverified","credibility_note":"両軍の戦死者数は政府軍約6,400人、薩軍約6,500人前後とされるが、資料により数値に幅がある。","sources":[{"title":"Wikipedia（日本語版）: 西南戦争","url":"https://ja.wikipedia.org/wiki/西南戦争"}]}]},{"slug":"history-cold-war","title":"冷戦の構図","description":"1945年から1991年まで、核と軍事のエスカレーション、外交の駆け引きと危機、そして人々の暮らしと文化を三層で重ねる。同じ年に会議室と実験場と茶の間で何が起きていたかを並べる年表。","category":"history-politics","language":"ja","start_year":1945,"end_year":1991,"layers":[{"name":"軍事と核","color":"orange"},{"name":"外交と危機","color":"blue"},{"name":"文化と社会","color":"pink"}],"events":[{"date":"1945-08-06","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"広島に原子爆弾が投下される","summary":"人類史上初めて核兵器が実戦使用され、3日後には長崎にも投下された。核時代の始まりとなった。","detail":"米国はマンハッタン計画で開発した原爆を広島(8月6日)と長崎(8月9日)に投下した。8月8日にはソ連が対日参戦し、8月15日に日本は降伏する。核の独占は米国の交渉力を高める一方、ソ連に開発を急がせ、外交レイヤーの戦後秩序をめぐる対立を「核を持つ二国の対峙」へと変えた。死者数は年末までに広島で約14万人と推計されるが、幅がある。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Atomic bombings of Hiroshima and Nagasaki","url":"https://en.wikipedia.org/wiki/Atomic_bombings_of_Hiroshima_and_Nagasaki"},{"title":"広島平和記念資料館","url":null}]},{"date":"1947-03-12","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"トルーマン・ドクトリン、封じ込め政策を表明","summary":"ギリシャ・トルコ支援を議会に求める演説で、共産主義の拡大に対抗する方針を宣言した。","detail":"英国がギリシャ支援を続けられないと通告したことを受け、米国が肩代わりする形で表明された。前年のケナン長文電報とチャーチルの「鉄のカーテン」演説に続き、ヤルタ会談時の米ソ協調は封じ込めへ転換する。6月のマーシャル・プラン発表と合わせ、欧州の東西分断が固定化していく。文化と社会レイヤーでは同年秋、ハリウッドへの下院非米活動委員会の公聴会が始まった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Truman Doctrine","url":"https://en.wikipedia.org/wiki/Truman_Doctrine"}]},{"date":"1948-06-24","precision":"day","end_date":"1949-05-12","type":"period","layer":"外交と危機","title":"ベルリン封鎖と大空輸","summary":"ソ連が西ベルリンへの陸路を遮断。米英は約11か月にわたり空輸で200万人の都市を支え、封鎖は解除された。","detail":"西側占領地区の通貨改革に反発したソ連が、鉄道・道路・水路を封鎖した。米英は食料と石炭を航空機で運び続け、最盛期には数十秒間隔で着陸した。封鎖中の1949年4月4日にNATOが設立され、5月には西ドイツ基本法が公布される。冷戦初の直接対決が武力に至らなかった経験は、以後の危機管理の原型となった。同じ1949年8月、軍事レイヤーではソ連が初の核実験に成功する。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Berlin Blockade","url":"https://en.wikipedia.org/wiki/Berlin_Blockade"}]},{"date":"1949-08-29","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"ソ連、初の核実験に成功","summary":"カザフスタンのセミパラチンスクでRDS-1が爆発。米国の核独占は4年で終わり、軍拡競争が始まった。","detail":"米国の予測より早い成功で、スパイによる情報入手も一因とされる。米国は翌1950年1月に水爆開発を決定し、1952年に初の水爆実験、ソ連も1953年に続く。外交レイヤーではこの年にNATOが発足し、10月には中華人民共和国が成立した。核の均衡は以後、外交と危機レイヤーの全交渉の背景となり、文化と社会レイヤーでは核シェルターや民間防衛が日常に入り込む。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: RDS-1","url":"https://en.wikipedia.org/wiki/RDS-1"}]},{"date":"1950-02-09","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"マッカーシー、国務省に共産主義者がいると演説","summary":"上院議員マッカーシーが「名簿を持っている」と述べ、以後数年続く反共の告発と社会的圧力の象徴となった。","detail":"ソ連核実験と中国革命の翌年、国内の「裏切り者」を探す空気が広がっていた。ハリウッド、大学、公務員に忠誠審査とブラックリストが及び、公職を追われる人が相次ぐ。1954年の陸軍公聴会のテレビ中継で世論が離れ、上院はマッカーシーを非難する。外交・軍事の緊張が国内社会の自由を狭めた典型例であり、同年6月には朝鮮戦争が始まる。","credibility":"disputed","credibility_note":"演説で挙げた人数は「205人」と報じられたが、本人はのちに「57人」と主張し、原稿が残っていないため正確な発言内容は確定していない。","sources":[{"title":"Wikipedia（英語版）: McCarthyism","url":"https://en.wikipedia.org/wiki/McCarthyism"}]},{"date":"1950-06-25","precision":"day","end_date":"1953-07-27","type":"period","layer":"軍事と核","title":"朝鮮戦争、冷戦初の大規模な熱戦","summary":"北朝鮮軍の南進で始まり、国連軍と中国義勇軍が参戦。3年後に休戦協定が結ばれたが、平和条約は結ばれていない。","detail":"38度線を越えた北朝鮮軍に対し、米国主導の国連軍が介入し、中国が参戦して膠着した。マッカーサーの核使用検討は却下され、核保有国同士が直接対決を避ける「限定戦争」の型ができる。日本では特需で経済が回復し、警察予備隊が発足した。文化と社会レイヤーではマッカーシズムが最盛期にあり、外交レイヤーではスターリンの死(1953年3月)が休戦を後押しした。","credibility":"unverified","credibility_note":"軍人・民間人の死者数は数百万人規模とされるが、推計は資料により大きく異なり確定値がない。","sources":[{"title":"Wikipedia（英語版）: Korean War","url":"https://en.wikipedia.org/wiki/Korean_War"}]},{"date":"1961-08-13","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ベルリンの壁、一夜で築かれる","summary":"東ドイツが西ベルリンとの境界を有刺鉄線で封鎖し、後にコンクリートの壁に。分断の象徴が生まれた。","detail":"1949年以降、東から西へ約250万人以上が流出しており、東独政府は人口流出を止めるために境界を閉じた。米国は西ベルリンの権利が侵されない限り軍事対応せず、10月にはチェックポイント・チャーリーで米ソ戦車が対峙した。同年4月にはガガーリンの宇宙飛行、5月にケネディの月着陸表明があり、宇宙と地上の両方で対抗が激しくなっていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Berlin Wall","url":"https://en.wikipedia.org/wiki/Berlin_Wall"}]},{"date":"1962-10-16","precision":"day","end_date":"1962-10-28","type":"period","layer":"外交と危機","title":"キューバ危機、核戦争に最も近づいた13日間","summary":"キューバのソ連ミサイル基地を米国が発見。海上封鎖と交渉の末、ソ連が撤去に応じて危機は回避された。","detail":"ケネディは空爆案を退けて海上封鎖を選び、フルシチョフとの書簡交渉で解決した。米国のキューバ不侵攻約束に加え、トルコの米ミサイル撤去を密約していたことは後年まで公表されなかった。翌年、米ソ間にホットラインが設けられ、部分的核実験禁止条約が結ばれる。軍事レイヤーの核軍拡が外交を極限まで追い込んだ事例であり、以後の軍備管理交渉の出発点になった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Cuban Missile Crisis","url":"https://en.wikipedia.org/wiki/Cuban_Missile_Crisis"}]},{"date":"1968-07-01","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"核拡散防止条約(NPT)が署名開放","summary":"核保有を米ソ英仏中の5か国に限り、他国の取得を禁じる枠組み。1970年発効、日本は1976年に批准。","detail":"キューバ危機後の米ソは、核の拡散を共通の脅威とみなして協調した。条約は非核保有国に平和利用の権利を認め、核保有国に軍縮交渉義務を課す。署名開放の翌月、外交レイヤーではソ連軍がプラハの春を鎮圧しており、緊張緩和と抑圧が同時に進んでいた。翌1969年7月にはアポロ11号(文化と社会レイヤー)が月に着陸し、米ソ競争の一つの局面が閉じる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Treaty on the Non-Proliferation of Nuclear Weapons","url":"https://en.wikipedia.org/wiki/Treaty_on_the_Non-Proliferation_of_Nuclear_Weapons"},{"title":"外務省: 核兵器不拡散条約（NPT）","url":null}]},{"date":"1969-07-20","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"アポロ11号の月面着陸、世界が同時に見た中継","summary":"人類初の月面着陸が各国にテレビ中継され、冷戦の競争が同時に世界共通の体験にもなった。","detail":"1957年のスプートニクに始まる宇宙競争は、軍事レイヤーのICBM技術と表裏一体だった。着陸の中継は日本を含む多くの国で放送され、日本時間では7月21日午前に当たる。同じ年に外交レイヤーではニクソン政権が発足し、米中接近の下準備が始まる。ソ連は同月に月ロケットN1の爆発事故を起こしていたが、公表されなかった。","credibility":"unverified","credibility_note":"「世界で約6億人が視聴した」とする数字が広く引用されるが、当時の視聴率調査に基づく推計であり、算出根拠は明確でない。","sources":[{"title":"Wikipedia（英語版）: Apollo 11","url":"https://en.wikipedia.org/wiki/Apollo_11"}]},{"date":"1972-02-21","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ニクソン訪中、米中が対立から接近へ","summary":"米大統領が初めて中華人民共和国を訪問し毛沢東と会談。中ソ対立を背景に、冷戦の二極構造が揺らいだ。","detail":"前年のキッシンジャー秘密訪問を経て実現し、上海コミュニケで台湾問題を棚上げしつつ関係正常化の方向を示した。3か月後の5月にはニクソンがモスクワを訪れ、SALT I(第一次戦略兵器制限交渉)とABM条約に署名する。中国と関係を結ぶことでソ連に圧力をかける三角外交の始まりであり、日本でも同年9月に日中国交正常化が実現した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: 1972 visit by Richard Nixon to China","url":"https://en.wikipedia.org/wiki/1972_visit_by_Richard_Nixon_to_China"}]},{"date":"1979-12-24","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"ソ連軍、アフガニスタンに侵攻","summary":"12月24日に空輸を開始し、27日にアミン政権を倒してカルマル政権を樹立。デタントは終わった。","detail":"米国は穀物禁輸とモスクワ五輪ボイコット(文化と社会レイヤー・1980年)で応じ、SALT IIの批准は見送られた。ムジャヒディンへの米国・パキスタン・サウジの支援が続き、ソ連軍は1989年まで撤退できず、経済と体制の疲弊を深める。同じ12月にNATOは中距離核ミサイルの欧州配備を決めており(二重決定)、1980年代前半の「新冷戦」がここから始まる。","credibility":"disputed","credibility_note":"侵攻の動機については、周辺同盟国の崩壊を防ぐ防衛的判断とみる説と、南方への勢力拡張とみる説があり、ソ連側史料の公開後も評価が分かれる。","sources":[{"title":"Wikipedia（英語版）: Soviet–Afghan War","url":"https://en.wikipedia.org/wiki/Soviet%E2%80%93Afghan_War"}]},{"date":"1980-08-31","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"ポーランドで「連帯」が誕生","summary":"グダニスク造船所のストライキが政府との協定に至り、東側で初の独立自主管理労組「連帯」が認められた。","detail":"食料価格の値上げに端を発した労働者の抗議を、ワレサらが組織化した。1975年のヘルシンキ最終文書で東側諸国も人権条項に署名しており、これが市民の運動の根拠となる。翌1981年12月に戒厳令で非合法化されるが地下で存続し、1989年の円卓会議と部分自由選挙で政権交代を導く。軍事レイヤーのアフガン侵攻で西側の対ソ姿勢が硬化していた時期でもあった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Solidarity (Polish trade union)","url":"https://en.wikipedia.org/wiki/Solidarity_(Polish_trade_union)"}]},{"date":"1983-11-07","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"NATO演習「エイブル・アーチャー83」","summary":"核攻撃手順を含むNATO指揮所演習を、ソ連側が本物の攻撃準備と疑ったとされる。11月7日から11日。","detail":"同年3月のレーガンの「悪の帝国」演説とSDI(戦略防衛構想)発表、9月の大韓航空機撃墜で緊張は高まっていた。9月26日にはソ連の早期警戒システムが米ミサイル発射を誤検知している。演習は無事終わったが、後年の情報公開で東側の警戒レベルが上げられていたことが判明した。文化と社会レイヤーでは同月、核戦争を描くドラマ「ザ・デイ・アフター」が放送される。","credibility":"disputed","credibility_note":"ソ連指導部が実際に先制攻撃を懸念していた程度は、二重スパイの証言と公開文書の解釈をめぐって研究者間で評価が分かれる。","sources":[{"title":"Wikipedia（英語版）: Able Archer 83","url":"https://en.wikipedia.org/wiki/Able_Archer_83"}]},{"date":"1983-11-20","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"テレビ映画「ザ・デイ・アフター」全米放送","summary":"核戦争後の米中西部を描くABCのドラマが放送され、視聴者は1億人規模とされる。核への不安が可視化された。","detail":"軍事レイヤーのエイブル・アーチャー演習の直後という時期に放送された。レーガンは日記に「大いに気が滅入った」と記し、後年INF条約への姿勢に影響したと自ら回想している。欧州では中距離核ミサイル配備に反対する大規模デモが続き、日本でも反核運動が広がっていた。翌1984年、レーガンは対ソ対話への転換を演説で示し、1985年のゴルバチョフ登場を迎える。","credibility":"unverified","credibility_note":"視聴者数「約1億人」は放送局の推計に基づき、正確な視聴者数は確定していない。レーガンの日記の記述は公刊されている。","sources":[{"title":"Wikipedia（英語版）: The Day After","url":"https://en.wikipedia.org/wiki/The_Day_After"}]},{"date":"1985-03-11","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ゴルバチョフ、ソ連共産党書記長に就任","summary":"54歳の書記長が誕生。ペレストロイカとグラスノスチを掲げ、対外的には「新思考外交」で軍縮に転じた。","detail":"アフガニスタンの戦費と軍事支出、石油価格の下落でソ連経済は行き詰まっていた。ゴルバチョフは同年11月にレーガンとジュネーブで会談し、1986年のレイキャビク会談を経て1987年のINF条約(軍事レイヤー)に至る。1986年4月のチェルノブイリ事故は情報公開の必要性を印象づけた。文化と社会レイヤーでは検閲の緩和が東欧の市民運動を勢いづけることになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Mikhail Gorbachev","url":"https://en.wikipedia.org/wiki/Mikhail_Gorbachev"}]},{"date":"1987-12-08","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"INF全廃条約に米ソが署名","summary":"射程500〜5,500kmの地上発射ミサイルを全廃。核兵器の一カテゴリーを丸ごとなくした初の条約となった。","detail":"ワシントンでレーガンとゴルバチョフが署名し、現地査察を含む検証制度が導入された。1979年のNATO二重決定から8年、配備と反対運動(文化と社会レイヤー)を経ての合意である。米ソ首脳の関係改善は外交レイヤーの1989年マルタ会談へつながる。条約は2019年に米国が離脱して失効するが、冷戦終結期の軍縮の到達点として位置づけられる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Intermediate-Range Nuclear Forces Treaty","url":"https://en.wikipedia.org/wiki/Intermediate-Range_Nuclear_Forces_Treaty"}]},{"date":"1989-11-09","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"ベルリンの壁崩壊","summary":"東独政府の記者会見での旅行自由化発表を受けて市民が検問所に殺到し、壁は事実上その夜に開いた。","detail":"報道官シャボウスキーが新規則の発効時期を「ただちに」と答えたことで、準備のないまま国境が開いた。背景にはポーランドの円卓会議(連帯の合法化)、ハンガリーの国境開放、ライプツィヒの月曜デモなど、市民の動きの連鎖がある。ソ連は軍事介入せず、外交レイヤーでは3週間後にマルタ会談で冷戦終結が宣言される。1961年に一夜で築かれた壁は、28年後に一夜で開いた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Fall of the Berlin Wall","url":"https://en.wikipedia.org/wiki/Fall_of_the_Berlin_Wall"}]},{"date":"1989-12-03","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"マルタ会談、米ソ首脳が冷戦の終結を宣言","summary":"ブッシュとゴルバチョフが地中海のマルタ沖で会談し、対立の時代が終わったことを共同で表明した。","detail":"12月2日と3日、荒天の中ソ連客船上で行われた。ベルリンの壁崩壊(文化と社会レイヤー)から1か月足らずで、東欧各国では共産党政権が相次いで退陣していた。翌1990年10月にドイツが統一し、1991年7月にはSTART I(軍事レイヤーの延長線)が署名される。会談は制度的な合意より象徴的意味が大きく、「ヤルタからマルタへ」と表現された。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Malta Summit","url":"https://en.wikipedia.org/wiki/Malta_Summit"}]},{"date":"1991-12-25","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ソ連解体、ゴルバチョフが大統領を辞任","summary":"クレムリンの赤旗が降ろされ、翌26日に最高会議がソ連の消滅を宣言。69年続いた国家が終わった。","detail":"8月の保守派クーデター未遂で党の権威が崩れ、12月8日にロシア・ウクライナ・ベラルーシが独立国家共同体(CIS)創設を宣言した。核兵器はロシアが継承し、ウクライナなどの核はその後の交渉で撤去される。文化と社会レイヤーで見た東欧の市民運動、軍事レイヤーの軍拡負担、外交レイヤーの新思考が重なった帰結であり、この年表の終点となる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Dissolution of the Soviet Union","url":"https://en.wikipedia.org/wiki/Dissolution_of_the_Soviet_Union"}]}]},{"slug":"history-space-race","title":"宇宙開発の舞台裏","description":"スプートニクから民間宇宙船まで、ロケットの進歩だけでなく、その裏で誰が何を決め、社会がどう反応したかを三層で重ねる。同じ年に別の場所で起きていたことが見えてくる年表。","category":"history-politics","language":"ja","start_year":1957,"end_year":2020,"layers":[{"name":"技術","color":"blue"},{"name":"人の決断","color":"gold"},{"name":"社会の動き","color":"teal"}],"events":[{"date":"1957-10-04","precision":"day","end_date":null,"type":"point","layer":"技術","title":"スプートニク1号、世界初の人工衛星に","summary":"ソ連がR-7ロケットで直径58cmの人工衛星を軌道に投入。地上でも受信できるビープ音が世界を駆けた。","detail":"国際地球観測年に合わせた打ち上げだったが、R-7は本来ICBMとして開発されたロケットで、核弾頭を米本土に届けうる能力の実証でもあった。技術上の成功は同じ日に「社会の動き」レイヤーで始まるスプートニク・ショックを引き起こし、翌年のNASA設立という「人の決断」へと連鎖する。設計主任コロリョフの名は公表されなかった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Sputnik 1","url":"https://en.wikipedia.org/wiki/Sputnik_1"},{"title":"NASA History: Sputnik and the Dawn of the Space Age","url":null}]},{"date":"1957-10-04","precision":"day","end_date":"1958-09-02","type":"period","layer":"社会の動き","title":"スプートニク・ショックと米国の科学教育改革","summary":"ソ連の先行に米国世論が動揺。議会は科学教育への連邦投資を拡大し、国防教育法(NDEA)成立に至る。","detail":"衛星そのものより「ソ連が先に到達した」事実が米国社会を揺さぶった。12月のヴァンガード打ち上げ失敗が焦りを増幅し、1958年9月2日の国防教育法で理数・外国語教育に連邦資金が投じられる。同年7月にはNASA設立法が署名され、この期間の世論が「人の決断」レイヤーの政策判断を後押しした構図が読み取れる。","credibility":"disputed","credibility_note":"アイゼンハワー政権自身は衛星を脅威と見ておらず、「ショック」は主にメディアと議会の反応だったとする研究があり、当時の危機感の実態は評価が分かれる。","sources":[{"title":"Wikipedia（英語版）: Sputnik crisis","url":"https://en.wikipedia.org/wiki/Sputnik_crisis"},{"title":"Wikipedia（英語版）: National Defense Education Act","url":"https://en.wikipedia.org/wiki/National_Defense_Education_Act"}]},{"date":"1958-07-29","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"アイゼンハワー、NASA設立法に署名","summary":"軍ではなく文民機関に宇宙開発を担わせる決断。国家航空宇宙法が成立し、10月1日にNASAが発足した。","detail":"陸海空軍がそれぞれ宇宙計画を競っていた状況を整理し、既存のNACA(航空諮問委員会)を母体に文民機関を置いた。「平和目的」を掲げる建て付けは、のちの宇宙条約や国際協力の前提となる。同じ年、技術レイヤーではエクスプローラー1号がヴァン・アレン帯を発見し、社会レイヤーではスプートニク・ショックが議会を動かしていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: National Aeronautics and Space Act","url":"https://en.wikipedia.org/wiki/National_Aeronautics_and_Space_Act"}]},{"date":"1961-04-12","precision":"day","end_date":null,"type":"point","layer":"技術","title":"ガガーリン、人類初の有人宇宙飛行","summary":"ボストーク1号が地球を1周、108分の飛行。人類が初めて地球の外から地球を見た日となった。","detail":"飛行は完全自動制御で、ガガーリンは高度約7kmで機体から射出されパラシュートで着地した。この点は当時、国際航空連盟の記録要件を満たすため公表されなかった。技術的勝利は6週間後のケネディ演説という「人の決断」を直接引き出し、米ソの競争は月へと舞台を移す。同年8月にはベルリンの壁が築かれ、冷戦の緊張が最高潮にあった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Vostok 1","url":"https://en.wikipedia.org/wiki/Vostok_1"}]},{"date":"1961-05-25","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"ケネディ、「10年以内に月へ」と議会に表明","summary":"ガガーリン飛行とピッグス湾失敗の直後、議会特別教書で1960年代中の有人月着陸を国家目標に掲げた。","detail":"4月12日のガガーリン飛行、4月17日のピッグス湾侵攻失敗という二つの打撃を受け、ケネディは副大統領ジョンソンに「ソ連に勝てる分野」を諮問。5月5日にシェパードが弾道飛行に成功したことも後押しとなり、この演説に至った。技術面の見通しは未確定のまま政治判断が先行した点が、以後の予算膨張(社会の動きレイヤー・1966年)につながる。","credibility":"verified","credibility_note":null,"sources":[{"title":"JFK Library: Address to Joint Session of Congress, May 25, 1961","url":"https://www.jfklibrary.org/learn/about-jfk/historic-speeches/address-to-joint-session-of-congress-may-25-1961"}]},{"date":"1966-01-01","precision":"year","end_date":null,"type":"point","layer":"社会の動き","title":"NASA予算、連邦予算の約4.4%でピーク","summary":"アポロ計画の人員は40万人規模に達し、NASA予算は連邦支出比で史上最高水準となった。","detail":"1961年の決断から5年、予算は毎年拡大し1966会計年度に頂点を迎えた。同時期にベトナム戦争の戦費と「偉大な社会」政策の支出が膨らみ、以後NASA予算は月着陸前から削減局面に入る。技術レイヤーではこの年にコロリョフが死去し、翌年にはアポロ1号火災が起きる。予算の山と現場の緊張が同時に存在していた。","credibility":"unverified","credibility_note":"「約4.4%」は連邦予算に対する比率としてよく引用されるが、算出方法により4.4〜4.5%と幅があり、雇用者数の40万人も概数である。","sources":[{"title":"Wikipedia（英語版）: Budget of NASA","url":"https://en.wikipedia.org/wiki/Budget_of_NASA"}]},{"date":"1966-01-14","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"コロリョフ死去、ソ連月計画の指揮系統に空白","summary":"ソ連宇宙開発を率いた「主任設計者」が手術中に死去。存命中は匿名だった名がこの時初めて公表された。","detail":"スプートニクとガガーリン飛行を実現した人物だが、機密のため生前は「主任設計者」としか呼ばれなかった。死後、N1月ロケットの開発はミーシンが引き継ぐが、設計局間の対立と資源分散は解消されない。同じ年、社会の動きレイヤーで米国のNASA予算がピークを迎えていたのと対照的に、ソ連側は指揮の統合を失っていた。","credibility":"disputed","credibility_note":"コロリョフの死がソ連月計画失敗の主因だったかは評価が分かれる。N1のエンジン構成や資金・組織の問題を重視する研究者も多い。","sources":[{"title":"Wikipedia（英語版）: Sergei Korolev","url":"https://en.wikipedia.org/wiki/Sergei_Korolev"}]},{"date":"1967-10-10","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"宇宙条約が発効、天体の領有を禁止","summary":"宇宙空間の平和利用と天体の国家領有禁止を定めた条約が発効。宇宙法の基礎となった。","detail":"米ソ英が1月に署名し、10月に発効。核兵器の軌道配備禁止や天体の領有禁止は、月着陸を目前にした両国が「先に着いた側が月を領有する」事態を避ける枠組みでもあった。同年1月にはアポロ1号火災、4月にはソユーズ1号事故で両国が犠牲者を出しており、技術レイヤーの試練と並行して法的秩序が整えられた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Outer Space Treaty","url":"https://en.wikipedia.org/wiki/Outer_Space_Treaty"},{"title":"国連宇宙部（UNOOSA）: Outer Space Treaty","url":null}]},{"date":"1968-12-24","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"アポロ8号「地球の出」写真が世界に届く","summary":"初めて月周回軌道に入った乗員が撮影した地球の写真が、環境意識と「一つの地球」の感覚を広めた。","detail":"アポロ8号は月着陸船の遅れを受けて計画を急きょ変更し、司令船のみで月周回に向かった決断の産物だった。撮影された「Earthrise」は翌年以降の環境運動の象徴となり、1970年の最初のアースデイにも影響したとされる。1968年は暗殺やベトナム反戦運動が続いた年で、年末のこの中継は米国内で異例の共有体験として受け止められた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Earthrise","url":"https://en.wikipedia.org/wiki/Earthrise"}]},{"date":"1969-07-03","precision":"day","end_date":null,"type":"point","layer":"技術","title":"ソ連N1ロケット、発射台で爆発","summary":"ソ連の月ロケットN1が2回目の打ち上げで発射直後に落下・爆発。アポロ11号の17日前だった。","detail":"N1は30基のエンジンを束ねる設計で、4回の打ち上げすべてに失敗した。この爆発は発射施設を大きく損壊し、ソ連の有人月着陸の可能性を事実上絶った。ソ連は月競争への参加自体を長く公式に認めず、計画の存在が公表されたのは1989年である。人の決断レイヤーで見たコロリョフ死去後の混乱が、技術面の結果として現れた形といえる。","credibility":"unverified","credibility_note":"N1計画はソ連が1989年まで存在を公表せず、打ち上げ経過や被害規模は後年公開された資料と関係者証言に基づく。爆発規模の推定値も資料により異なる。","sources":[{"title":"Wikipedia（英語版）: N1 (rocket)","url":"https://en.wikipedia.org/wiki/N1_(rocket)"}]},{"date":"1969-07-20","precision":"day","end_date":null,"type":"point","layer":"技術","title":"アポロ11号、人類初の月面着陸","summary":"アームストロングとオルドリンが月面に立ち、ケネディの目標を期限内に達成。日本時間では7月21日。","detail":"着陸は協定世界時7月20日20時17分、最初の一歩は21日2時56分で、日本では21日午前の出来事だった。1961年の政治決断から8年、社会の動きレイヤーの予算ピークを経て到達した頂点だが、NASA予算はすでに削減期に入っており、アポロ計画は17号で打ち切られる。同月3日にはソ連N1が爆発しており、競争の帰趨は事実上この月に決した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Apollo 11","url":"https://en.wikipedia.org/wiki/Apollo_11"}]},{"date":"1972-01-05","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"ニクソン、スペースシャトル計画を承認","summary":"月の次に「再使用型」を選ぶ決断。火星有人飛行案は退けられ、以後30年の米有人宇宙の形が決まった。","detail":"アポロ後の計画として宇宙ステーションと火星飛行を含む構想があったが、予算制約の中でシャトル単体が選ばれた。初飛行は1981年4月12日、ガガーリン飛行のちょうど20年後だった。低コスト・高頻度という当初の想定は達成されず、1986年のチャレンジャー事故(技術レイヤー)で計画の前提そのものが問われることになる。","credibility":"disputed","credibility_note":"承認の主因を、大統領選の年にカリフォルニア州の航空宇宙雇用を守る政治判断とみる説と、国家威信や軍の要求を重視する説があり、解釈が分かれる。","sources":[{"title":"Wikipedia（英語版）: Space Shuttle program","url":"https://en.wikipedia.org/wiki/Space_Shuttle_program"}]},{"date":"1975-07-17","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"アポロ・ソユーズ、軌道上で米ソがドッキング","summary":"デタント(緊張緩和)の象徴として、競争相手だった両国の宇宙船が軌道上で握手を交わした。","detail":"1972年のニクソン訪ソで合意された共同飛行。同じ夏にヘルシンキ最終文書が採択されており、外交の緊張緩和がそのまま宇宙に映し出された。技術面では両国のドッキング機構が異なるため中間モジュールを新設した。この協力は1979年のアフガニスタン侵攻で途絶え、再開は1990年代のシャトル・ミール計画まで待つことになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Apollo–Soyuz","url":"https://en.wikipedia.org/wiki/Apollo%E2%80%93Soyuz"}]},{"date":"1986-01-28","precision":"day","end_date":null,"type":"point","layer":"技術","title":"チャレンジャー号、打ち上げ73秒後に空中分解","summary":"固体ロケットブースターのOリング破損が原因。乗員7名が死亡し、シャトルは約2年半飛行を停止した。","detail":"前夜、製造元の技術者が低温下での打ち上げに反対していたことが調査委員会で明らかになり、技術的欠陥だけでなく組織の意思決定が問われた。教員宇宙飛行士の搭乗で全米の学校が生中継を見ており、社会的衝撃は大きかった。同年2月にはソ連が宇宙ステーション・ミールの中核モジュールを打ち上げており、両国の明暗が分かれた月でもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Space Shuttle Challenger disaster","url":"https://en.wikipedia.org/wiki/Space_Shuttle_Challenger_disaster"}]},{"date":"1998-11-20","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"ISS最初のモジュール「ザーリャ」打ち上げ","summary":"冷戦後の米露協力を軸に、日欧加を含む15か国が参加する国際宇宙ステーションの建設が始まった。","detail":"ザーリャはロシア製だが米国の資金で建造されており、冷戦期のライバルが同じ構造物を組み立てる象徴となった。ソ連解体後、ロシアの宇宙技術者を計画に組み込む狙いもあった。日本は実験棟「きぼう」で参加し、2008年から取り付けが始まる。技術レイヤーではこの後、シャトルによる組み立て飛行が2011年の退役まで続く。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Zarya","url":"https://en.wikipedia.org/wiki/Zarya"},{"title":"JAXA: 国際宇宙ステーション（ISS）","url":null}]},{"date":"2003-10-15","precision":"day","end_date":null,"type":"point","layer":"技術","title":"神舟5号、中国が3番目の有人宇宙飛行国に","summary":"楊利偉が地球を14周。ソ連・米国に続き、独自ロケットで人を軌道に送った3か国目となった。","detail":"ソユーズ設計を参考にした神舟宇宙船と長征2Fロケットによる飛行。同年2月にはコロンビア号事故で米シャトルが飛行停止しており、有人宇宙飛行の担い手が多極化する転機だった。中国はISSに参加しておらず、以後独自ステーション「天宮」へ向かう。社会の動きレイヤーで見る国際協力の枠外に、もう一つの軸が生まれた年である。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Shenzhou 5","url":"https://en.wikipedia.org/wiki/Shenzhou_5"}]},{"date":"2006-08-18","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"NASA、民間に貨物輸送を委ねるCOTS契約","summary":"ISSへの物資輸送を「自前開発」から「民間からの購入」へ。設立4年のスペースXが選ばれた。","detail":"商業軌道輸送サービス(COTS)は、NASAが仕様と成果に対して段階的に支払う方式で、従来の受託開発とは異なる。この決断が2010年代の民間宇宙の土台となり、2015年12月のファルコン9第1段着陸(技術)、2020年の民間有人飛行へつながる。同年、政府はコンステレーション計画で月再訪を目指していたが、後に中止される。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Commercial Orbital Transportation Services","url":"https://en.wikipedia.org/wiki/Commercial_Orbital_Transportation_Services"}]},{"date":"2011-07-21","precision":"day","end_date":"2020-05-30","type":"period","layer":"社会の動き","title":"シャトル退役後、米国が有人打ち上げ能力を失った9年間","summary":"STS-135の帰還を最後にシャトルは退役。米国飛行士はISSへ行くためロシアのソユーズに依存した。","detail":"退役の背景にはコロンビア号事故後の安全性評価と運用コストがある。この間、米国はソユーズの座席を購入し続け、宇宙開発の主導権をめぐる議論と民間活用への期待が高まった。人の決断レイヤーで2006年に始まった民間委託が、2020年5月30日のクルードラゴン初有人飛行(技術)で空白を埋める形となる。","credibility":"unverified","credibility_note":"ソユーズ座席の購入単価は契約年により異なり、報道値に幅があるため本項では金額を示していない。","sources":[{"title":"Wikipedia（英語版）: STS-135","url":"https://en.wikipedia.org/wiki/STS-135"}]},{"date":"2020-05-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"クルードラゴン、民間宇宙船初の有人軌道飛行","summary":"スペースXの宇宙船がNASA飛行士2名をISSへ運び、民間企業が有人軌道飛行を担う時代が始まった。","detail":"ファルコン9第1段は洋上のドローン船に着陸し、2015年以来の再使用技術が有人飛行にも適用された。2006年のCOTS契約(人の決断)から14年、シャトル退役後の空白(社会の動き)を終わらせた飛行でもある。同年、新型コロナウイルスの流行下で観客を制限した打ち上げとなり、10月にはアルテミス合意が署名され月探査の国際枠組みが動き出した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Crew Dragon Demo-2","url":"https://en.wikipedia.org/wiki/Crew_Dragon_Demo-2"}]},{"date":"2020-10-13","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"アルテミス合意に日本など8か国が署名","summary":"月探査の行動原則を定めた合意。1967年宇宙条約を土台に、資源利用や安全区域の考え方を示した。","detail":"米国主導のアルテミス計画に参加する国々が、透明性・相互運用性・宇宙資源の利用などの原則に合意した。ロシアと中国は加わっておらず、月探査は再び複数の陣営に分かれつつある。技術レイヤーで民間有人飛行が実現した同じ年に、法と外交の枠組みが更新された点は、1967年に宇宙条約と有人計画が並走した構図の再来ともいえる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Artemis Accords","url":"https://en.wikipedia.org/wiki/Artemis_Accords"}]}]},{"slug":"personal-parenting","title":"子育ての記録","description":"2016年に生まれた第一子と、2022年に生まれた第二子を育てる架空の家族の10年。子どもの成長、親の仕事と暮らし、保育・教育制度やコロナ禍といった社会の動きを重ね、家庭の選択が制度に左右されてきた道筋を残す。","category":"personal-life","language":"ja","start_year":2016,"end_year":2026,"layers":[{"name":"子どもの成長","color":"green"},{"name":"親の仕事と暮らし","color":"gold"},{"name":"社会と制度","color":"blue"}],"events":[{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"「保育園落ちた」ブログが国会で取り上げられる","summary":"認可保育所に入れなかった保護者の匿名ブログが広まり、待機児童問題が国会審議の場でも論点になった。","detail":"2月中旬に投稿された匿名ブログが SNS で拡散し、月末の衆議院予算委員会で言及された。「保活」という言葉が一般に広まり、都市部の待機児童問題が政策課題として前景化した年。この年の秋に第一子を迎える家族にとって、生まれる前から入園の心配をするのが当たり前という空気が、すでにできあがっていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"衆議院: 第190回国会 予算委員会 会議録（平成28年2月29日）","url":null},{"title":"厚生労働省: 保育所等関連状況取りまとめ（平成28年4月1日）","url":null}]},{"date":"2016-11-08","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"第一子、誕生","summary":"予定日より4日遅れて、都内の病院で長女が生まれる。体重3,120グラム。名前は決めるのに一晩かかった。","detail":"陣痛から18時間。夫は職場から駆けつけて立ち会った。生まれた年は待機児童問題が国会で取り上げられた年で、退院の日に受け取った区の案内には、すでに翌々年度の保育所申込みの説明が入っていた。抱いている赤ん坊の1年半後を考えるのは奇妙な感覚だったが、それがこの街で子を育てるということだった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-11-08","precision":"day","end_date":"2017-10-31","type":"period","layer":"親の仕事と暮らし","title":"母の産休・育休、ほぼ1年","summary":"出産日から翌年10月末まで、産後休業と育児休業を取得。復職は認可外保育園への入園と同時。","detail":"当初は1歳の誕生日で復職する予定だったが、認可保育所の一次選考に落ちて計画を組み替えた。育休期間中の10月に育児・介護休業法が改正され、保育所に入れない場合の育休が最長2歳まで延長可能になったが、家計と職場の事情から延長はせず、認可外に入園させて復職した。制度の変化と自分の状況が、少しずれて重なった一年。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"育児休業が最長2歳まで延長可能に","summary":"改正育児・介護休業法が施行。保育所に入れないなどの場合、育休を子が2歳になるまで再延長できるようになった。","detail":"従来は1歳6か月までだった育休の延長上限を、待機児童対策の一環として2歳まで引き上げた。同時に、事業主による育休制度の個別周知が努力義務化された。この家族の母は、ちょうど育休の終盤にこの改正を迎えたが、延長せず認可外への入園を選んだ。制度が整うことと、それを使えるかどうかは別の問題だと知った。","credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 育児・介護休業法の改正について（平成29年10月1日施行）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000130583.html"}]},{"date":"2017-11-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"母が時短勤務で復職","summary":"1日6時間の短時間勤務で復職。認可外保育園の送迎は母、迎えは週2回だけ父が担当することにした。","detail":"職場は理解があったが、17時に席を立つとき、まだ会議が続いている部屋を後にする気まずさは残った。認可外の保育料は月7万円を超え、時短で減った給与とほぼ相殺された。それでも辞めない選択をしたのは、翌年に認可へ移れる可能性を残すためだった。この年の秋、長女は初めて一人で立った。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-02-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"認可保育所の二度目の申込みで内定","summary":"前年は落選、今年は第3希望の園に内定。復職実績が加点になり、ようやく4月から認可へ移れることになった。","detail":"区から届いた封筒を開けるまで、夫婦とも仕事が手につかなかった。認可外に預けて働いた実績が選考指数を押し上げたと考えられ、前年の「落ちたから認可外に入れて働く」という選択が結果的に効いた。ブログが国会で話題になった年に生まれた子が、2年越しで認可の門をくぐる。制度の順番待ちが、家族の暦を決めていた。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-04-02","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"認可保育所へ転園","summary":"1歳児クラスに転園。慣らし保育の2週間は毎朝泣いたが、3週目には自分から靴を履くようになった。","detail":"認可外の小さな園から、園庭のある認可保育所へ。人数も部屋の広さも違い、最初は戸惑いが大きかった。園長からは、泣くのは前の園が好きだった証拠だと言われた。転園を境に、母は時短を1時間縮めて7時間勤務に戻し、父の迎え担当を週3回に増やした。家族の時間割が、園の生活リズムに合わせて組み直された。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"幼児教育・保育の無償化が始まる","summary":"3〜5歳児の認可保育所・幼稚園等の利用料が原則無償に。消費税率10%への引き上げと同日に実施された。","detail":"消費税増収分を財源とし、子育て世帯の負担軽減と少子化対策を掲げて導入された。0〜2歳児は住民税非課税世帯に限られ、給食費や延長保育料は対象外。この家族の長女は2歳児クラスだったため恩恵は翌年度から。認可外に7万円を払っていた頃と比べると、制度の谷間にいた時期の記憶が改めてよみがえった。","credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 幼児教育・保育の無償化について","url":"https://www8.cao.go.jp/shoushi/shinseido/musyouka/index.html"}]},{"date":"2020-02-27","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"全国の小中高校に一斉休校を要請","summary":"新型コロナの感染拡大を受け、政府が3月2日からの臨時休校を要請。保育所は原則開所とされたが、登園自粛が広がった。","detail":"突然の要請に、共働き世帯の間で子どもの居場所をどうするかという問題が一気に表面化した。保育所は開所を続けたが、4月の緊急事態宣言後は多くの自治体が登園自粛や休園に踏み切った。この家族も4月から2か月近く、3歳の長女を家で見ながら在宅勤務をすることになる。制度の空白を、家庭が埋める時期の始まりだった。","credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 新型コロナウイルス感染症対策のための小学校、中学校、高等学校及び特別支援学校等における一斉臨時休業について（令和2年2月28日）","url":"https://www.mext.go.jp/content/202002228-mxt_kouhou01-000004520_1.pdf"}]},{"date":"2020-04-11","precision":"day","end_date":"2020-05-31","type":"period","layer":"子どもの成長","title":"休園中、家で過ごした7週間","summary":"緊急事態宣言下、区の要請で登園を自粛。3歳の長女と両親が、ひとつの部屋で在宅勤務と保育を続けた。","detail":"午前は父、午後は母が仕事を止めて子どもを見る交代制にした。公園は使えず、ベランダで水遊びをし、絵本を何十回も読んだ。長女はこの時期に平仮名を読み始め、両親は会議中に画面に子どもが映り込むことに慣れた。6月に登園が再開したとき、園の友達の名前をほとんど忘れていたが、1週間で取り戻した。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-04-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"GIGAスクール構想で小中学生に一人一台端末","summary":"コロナ禍で前倒しされ、2020年度末までに全国の大半の自治体で小中学生向け端末の整備が完了したとされる。","detail":"もともと2023年度までの計画だったが、休校の経験から一気に前倒しされた。文部科学省の調査では2021年3月末時点で9割超の自治体が整備を終えたとされるが、集計時点や「整備完了」の定義により数値は資料ごとに異なる。この家族の長女が2023年に入学した小学校では、1年生から端末を持ち帰る宿題があった。3年前の休校の記憶とつながっている。","credibility":"unverified","credibility_note":"整備完了率は調査時点（2021年3月末／7月末など）と集計単位により文部科学省資料の中でも数値が異なるため、単一の値として確定していない。","sources":[{"title":"文部科学省: GIGAスクール構想の実現に向けた ICT 環境整備の進捗状況について","url":null}]},{"date":"2022-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"産後パパ育休（出生時育児休業）が施行","summary":"子の出生後8週間以内に最大4週間、2回に分けて取得できる新しい育休制度が始まった。","detail":"改正育児・介護休業法の第2段階として施行。男性の育休取得を後押しするため、通常の育休とは別枠で、申出期限も短く設定された。翌2023年4月からは従業員1,000人超の企業に取得率の公表も義務づけられた。この家族の第二子は施行の翌月に生まれ、父はこの新制度を使って4週間の休みを取ることになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 育児・介護休業法 改正ポイントのご案内（令和4年4月1日から3段階で施行）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000130583.html"}]},{"date":"2022-11-14","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"第二子、誕生","summary":"長女が5歳の秋に、次女が生まれる。長女は病院の面会制限で、退院の日まで妹に会えなかった。","detail":"コロナ禍の面会制限はまだ続いており、立ち会いは夫だけ、長女は玄関で退院を待った。初対面の長女は妹の指を握って、思ったより小さいと言った。前月に施行された産後パパ育休を父が取ることが決まっており、退院の翌日から家に大人が2人いる暮らしが始まった。6年前の第一子のときには、なかった選択肢だった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-11-15","precision":"day","end_date":"2022-12-12","type":"period","layer":"親の仕事と暮らし","title":"父の産後パパ育休、4週間","summary":"施行されたばかりの出生時育児休業を使い、退院翌日から4週間を続けて取得。長女の送迎と家事を父が担った。","detail":"職場では前例がなく、上司と人事に制度の説明資料を渡すところから始めた。育休中は長女の保育園送迎、食事、夜間の授乳補助を分担し、母は産後の回復に専念できた。第一子のとき父が取れたのは有給3日だけで、この差を夫婦ともに実感した。復帰後、同じ部署の後輩が翌年に同じ制度を使ったと聞いた。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-04-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"こども家庭庁が発足","summary":"内閣府と厚生労働省に分かれていた子ども政策を一元化する新しい省庁が発足。保育所も所管に移った。","detail":"こども基本法の施行と同日。少子化対策や虐待防止、保育行政を担い、翌年には児童手当拡充などを含む政策パッケージが法制化された。この家族にとっては、長女の小学校入学と次女の保活準備が重なる年で、区役所の窓口の書類に印刷された省庁名が変わっていることに気づいた程度の変化だったが、翌年の手当の増額はそこから来ていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"こども家庭庁: こども家庭庁について","url":"https://www.cfa.go.jp/about"}]},{"date":"2023-04-06","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"長女、小学校に入学","summary":"区立小学校に入学。配られたタブレット端末を、保育園にはなかった宿題として持ち帰るようになった。","detail":"ランドセルは祖父母からの贈り物。入学式は保護者2人まで参加でき、コロナ禍の制限がようやく緩んだことを実感した。GIGAスクール構想で整備された端末が1年生から配られ、休園中に平仮名を覚えた子が、今度は画面で足し算の練習をしている。学童保育の申込みも同時に済ませたが、この年に母の働き方を変える必要が生じる。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-06-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"「小1の壁」で母が転職","summary":"学童の閉所時間に迎えが間に合わず、母が在宅中心の職場へ転職。年収は下がったが、夕方の時間を取り戻した。","detail":"保育園は19時まで預かってくれたが、学童は18時で閉まる。時短勤務の対象からも外れ、通勤を含めると毎日間に合わない計算だった。8年勤めた会社を離れ、週4日在宅の職場へ。翌年10月から児童手当が高校生まで拡充され、家計の目減りを少しだけ埋めることになる。制度は追いついてきているが、まだ半歩遅れていると感じた。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-10-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"児童手当の拡充（所得制限撤廃・高校生まで）","summary":"2024年10月分から所得制限が撤廃され、支給対象が高校生年代まで延長。第3子以降は月3万円に増額された。","detail":"こども家庭庁が主導した「こども未来戦略」に基づく改正で、支払いも年3回から隔月に変わった。この家族には長女と次女の2人分が該当し、前年の転職で母の収入が下がったあとに届いた。制度の拡充と家計の変化が続けて起きたのは偶然だが、記録として残しておくと、あとで見返したときに因果のように見えてしまう。それも年表の面白さかもしれない。","credibility":"verified","credibility_note":null,"sources":[{"title":"こども家庭庁: 児童手当制度のご案内（令和6年10月分からの制度改正）","url":"https://www.cfa.go.jp/policies/kokoseido/jidouteate/annai"}]},{"date":"2025-04-01","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"次女、保育所に入園","summary":"2歳児クラスに入園。姉と同じ園で、慣らし保育は3日で終わった。姉のときとは何もかもが早い。","detail":"長女のときは2年かかった認可入園が、次女は一度で決まった。地域の子どもの数が減り、園によっては定員に空きが出始めていると園長から聞いた。同じ4月から改正育児・介護休業法が施行され、3歳未満の子を持つ親のテレワークが事業主の努力義務になった。転職した母の在宅勤務は、制度に先回りしていた形になった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"「こども誰でも通園制度」が全国で本格実施","summary":"親の就労を問わず、生後6か月から3歳未満の子を月一定時間まで保育所等に預けられる制度が全国実施の予定。","detail":"2023年から試行的事業として一部自治体で始まり、2025年度に法律上の給付制度化、2026年度から全自治体での実施が予定されている。この家族の次女はすでに認可に在園しているため直接の対象ではないが、10年前に「保育園落ちた」が国会で語られたことを思うと、預ける理由を問わない制度が全国に広がる予定というだけで、時代の距離を感じる。","credibility":"unverified","credibility_note":"2026年度からの全国実施は制度設計上の予定であり、自治体ごとの実施時期や利用可能時間の運用は本記録作成時点で確定していない。","sources":[{"title":"こども家庭庁: こども誰でも通園制度について","url":"https://www.cfa.go.jp/policies/kokoseido/daredemo-tsuen"}]}]},{"slug":"personal-reading-log","title":"読書遍歴 1990–2026","description":"1980年生まれの架空の一人が、10歳から46歳までに出会った本の記録。読んだ本と転機、人生の出来事、出版と社会の変化を重ね、一冊の本がどんな年に手元へ届いたのかをたどる。","category":"personal-life","language":"ja","start_year":1990,"end_year":2026,"layers":[{"name":"読んだ本と転機","color":"purple"},{"name":"人生の出来事","color":"gold"},{"name":"出版と社会","color":"blue"}],"events":[{"date":"1990-07-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"小学校の図書室で『モモ』に出会う","summary":"10歳の夏休み前。返却期限を2度延長して読み終えたミヒャエル・エンデの長編が、最初の「自分の本」になった。","detail":"図書室の先生に薦められて借りた。時間泥棒の話を、当時はただの冒険物語として読んだ。読み返すたびに違う本になることを知るのはずっと後で、この記録を始めた動機のひとつでもある。図書室の貸出カードに自分の名前を何度も書いた年。1990年代初め、街の書店はまだ増えており、本は身近な場所にいくらでもあった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"出版物の推定販売金額がピークに","summary":"書籍・雑誌を合わせた紙の出版物の推定販売金額が約2兆6,500億円に達し、これ以降は長期の減少局面に入る。","detail":"雑誌が売上の6割近くを占め、コンビニと駅の書店が日常の本の入口だった時代の頂点。以後、雑誌の落ち込みを中心に市場は縮小を続ける。この年、16歳の「わたし」は高校の帰り道にある書店で『ソフィーの世界』を手に取っている。本がいちばん売れていた年に、自分の読書が本格的に始まっていたことを、あとから統計で知った。","credibility":"verified","credibility_note":null,"sources":[{"title":"出版科学研究所: 出版指標年報（出版物推定販売金額の推移）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"1996-05-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"高校1年、『ソフィーの世界』で哲学に触れる","summary":"前年に日本語版が出て話題だった一冊。哲学の入門書としてより、「問いを持ってよい」と教わった本として残っている。","detail":"ヨースタイン・ゴルデルによる小説仕立ての哲学史。日本語版は1995年に刊行され、ベストセラーになっていた。読み終えても哲学者の名前は覚えられなかったが、なぜ、と口に出すことに引け目を感じなくなった。紙の出版物がもっとも売れた年に、通学路の書店で新刊台から取った本。その書店は2023年に閉店する。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"1998-04-01","precision":"day","end_date":"1999-03-31","type":"period","layer":"人生の出来事","title":"浪人の1年","summary":"大学受験に失敗し、予備校に通う。読んだのは参考書だけ、と当時は思っていたが、通学の電車で文庫を1冊だけ読み続けた。","detail":"本を読む時間はないと決めていたが、鞄の底にいつも『銀河鉄道の夜』の文庫があった。読み進めるというより、開いて閉じるための本。駅前の書店では相変わらず雑誌の棚がいちばん広く、新刊の話題は当時のわたしには遠いものだった。翌春に地方の大学に合格し、この一年は結果的に、読書と自分の距離を測り直す時間になった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2002-04-01","precision":"day","end_date":null,"type":"point","layer":"人生の出来事","title":"就職と上京","summary":"地方の大学を卒業し、東京の中堅出版取次の会社に就職。本に近い仕事を選んだつもりが、配属は物流部門だった。","detail":"毎朝、雑誌の束が全国へ出ていくのを倉庫で見た。1996年をピークに市場が縮んでいることは社内の誰もが知っていて、それでも量は圧倒的だった。読む本を選ぶ時間はなくなり、代わりに「売れる本」の情報だけが増えた。この頃、Amazon.co.jp はすでに営業を始めており、書店に行かずに本を買う人が少しずつ現れていた。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2003-10-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『博士の愛した数式』を通勤電車で読む","summary":"働き始めて2年目。仕事で本を数として扱う日々のなかで、久しぶりに一冊を最後まで読み、本を「作品」として取り戻した。","detail":"小川洋子による2003年8月刊行の小説。80分しか記憶がもたない数学者と家政婦の物語。取次の倉庫で数字として扱っていた本のひとつが、開いてみれば静かで確かな世界だった。翌2004年に第1回本屋大賞を受けることになるが、そのニュースを職場で聞いたとき、少しだけ自分の手柄のような気がした。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2004-04-05","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"第1回本屋大賞が発表される","summary":"書店員が選ぶ文学賞として本屋大賞が創設され、第1回大賞に『博士の愛した数式』が選ばれた。","detail":"出版不況と書店の減少が意識され始めた時期に、「売り場からベストセラーをつくる」ことを掲げて始まった賞。以後、受賞作は映像化と大きな売上につながる例が続き、書店員の推薦が読者の選択に影響する構図が定着した。取次で働いていたわたしにとって、前年に通勤電車で読んだ本が最初の受賞作になったのは、小さな符合として記憶に残っている。","credibility":"verified","credibility_note":null,"sources":[{"title":"本屋大賞 公式サイト: 過去の本屋大賞（2004年）","url":"https://www.hontai.or.jp/history/"}]},{"date":"2012-10-25","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"Kindleストアが日本で開始","summary":"Amazon が日本語の電子書籍ストアを開設。「電子書籍元年」と呼ばれた2010年から2年遅れで、本格的な普及の入口が開いた。","detail":"2010年の iPad 発売を機に電子書籍元年という言葉が広まったが、日本語コンテンツと端末の両方が揃うのはこの年からだった。以後、電子コミックを中心に電子出版市場は年々拡大していく。取次を辞めて出版社の編集に移っていたわたしは、電子版の契約書を初めて読んだ年でもあった。紙の本の物流を見てきた身には、倉庫のない本というものが不思議だった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon.co.jp: プレスリリース Kindleストア開設（2012年10月25日）","url":null}]},{"date":"2012-11-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"初めて電子書籍を買う","summary":"Kindleストアの開設からひと月後、通勤中に読むために既読の文庫を電子で買い直した。最初の一冊は『モモ』。","detail":"紙で3冊持っている本を、なぜか電子でも買った。読み比べたかったのだと思う。文字の大きさを変えられることに驚き、ページの厚みで残りを測れないことに戸惑った。以後、移動中は電子、家では紙、という使い分けが定着する。同じ月に第一子が生まれ、片手で読める電子書籍は、思いがけず育児の道具になった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-11-18","precision":"day","end_date":null,"type":"point","layer":"人生の出来事","title":"第一子が生まれる","summary":"32歳。夜中の授乳の合間に、電子書籍を片手で読む習慣がついた。読む本の半分が絵本になった。","detail":"出版社の編集の仕事は続けたが、読書の中身が変わった。自分のための本より、子どもに読む本を選ぶ時間が増え、『ぐりとぐら』や『はらぺこあおむし』を何百回と読んだ。Kindleストアが開いたばかりの月に生まれた子で、片手で持てる端末がなければ、この時期の読書はほとんど途絶えていたと思う。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-10-01","precision":"day","end_date":"2018-06-30","type":"period","layer":"人生の出来事","title":"父の介護と、本を読めなかった1年9か月","summary":"地方の実家に月2回通い、父の入退院に付き添った期間。読書の記録がほとんど空白になった唯一の時期。","detail":"編集の仕事は続けたが、新幹線での往復と病院の待合室で、本を開いても頭に入らなかった。読めない時期にも本は側にあった、という以上のことは書けない。父を見送った2018年6月以降、少しずつ読書が戻ってくる。この期間の空白は、あとから見ると年表の中でいちばん雄弁な部分になった。読まなかったことにも記録の価値がある。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-12-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『82年生まれ、キム・ジヨン』を読む","summary":"介護が終わった年の暮れ、日本語版が出たばかりの韓国小説を一晩で読んだ。読書が「戻ってきた」と感じた一冊。","detail":"チョ・ナムジュによる小説。日本語版は2018年12月に筑摩書房から刊行され、翌年にかけて韓国文学が広く読まれるきっかけのひとつになった。自分と2歳違いの主人公が通ってきた道は、国は違っても地続きに見えた。空白の1年9か月のあと、最初に最後まで読んだ本として、この年表では区切りの位置にある。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"紙と電子を合わせた出版市場が前年比プラスに","summary":"紙の販売額は減少が続く一方、電子出版の伸びが上回り、紙+電子の合計で前年を上回ったとされる。","detail":"出版科学研究所の推計で、2019年は紙が前年比マイナス、電子が2割超の伸びとなり、合計では小幅ながらプラスに転じた。「1996年以来」「合算統計で初」といった表現が報道で使われたが、紙と電子を合算した統計自体は2014年からで、比較の基準が資料によって異なる。編集の現場でも、電子の売上を前提に企画を立てることが当たり前になった年。","credibility":"disputed","credibility_note":"「前年比プラス」自体は出版科学研究所の推計に基づくが、「何年ぶり」「初」といった位置づけは統計の集計範囲（紙+電子の合算開始年）によって異なる。","sources":[{"title":"出版科学研究所: 2019年の出版市場（紙+電子）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"2020-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"巣ごもりで電子出版市場が3割近く伸びる","summary":"コロナ禍の在宅時間の増加で電子コミックを中心に電子出版が急伸し、市場は前年比で約28%増となった。","detail":"出版科学研究所の推計で電子出版市場は約3,900億円、前年比28%増。電子コミックが大半を占めた。書店の休業や外出自粛で紙の販売にも波があったが、児童書や学習参考書は伸びた。この年、わたしは在宅勤務の合間にカミュの『ペスト』を読み返している。本を読む場所と方法が、この年を境にもう一段変わった。","credibility":"verified","credibility_note":null,"sources":[{"title":"出版科学研究所: 2020年の出版市場（紙+電子）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"2020-05-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『ペスト』を再読する","summary":"緊急事態宣言下、20年ぶりに読み返した。若い頃は寓話として読んだ小説が、この年は記録として読めた。","detail":"アルベール・カミュの1947年の小説。この年、世界的に再び読まれ、日本でも文庫が増刷された。閉ざされた街の中で人が何を続け、何を諦めるかという描写が、外の空気とそのまま重なった。同じ年に電子出版が急伸し、わたしの本棚も電子の比率が初めて半分を超えた。読む本と読み方の両方が、社会の状況に押されて動いた年。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-03-01","precision":"month","end_date":null,"type":"point","layer":"人生の出来事","title":"地元の書店が閉店する","summary":"高校時代に通い、『ソフィーの世界』を買った書店が閉店。最終日に帰省して、最後の一冊を買った。","detail":"駅前の2階建て、雑誌と参考書と文庫が中心の店だった。店主から、雑誌が売れなくなってからは厳しかったと聞いた。翌年には国が書店振興の検討を始めることになるが、間に合わない店は多い。本を買う場所がなくなることと、本を読まなくなることは同じではない、と自分に言い聞かせながら、それでも寂しかった。最後に買ったのは『モモ』の新版。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-05","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"経済産業省が書店振興プロジェクトチームを設置","summary":"全国で書店が減り続ける状況を受け、経産省が大臣直属のプロジェクトチームを立ち上げ、書店支援の検討を始めた。","detail":"書店を「文化創造基盤」と位置づけ、キャッシュレス手数料や取引慣行、図書館との連携などを論点として検討が進められた。書店のない自治体が全国の4分の1を超えるとする民間調査も同時期に報じられた。前年に地元の書店が閉店したわたしにとっては、遅すぎるとも、ようやくとも思える動きだった。読書会を始める直接のきっかけのひとつでもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省: 書店振興プロジェクトチームの設置について（2024年3月5日）","url":"https://www.meti.go.jp/press/2023/03/20240305001/20240305001.html"}]},{"date":"2024-08-01","precision":"month","end_date":null,"type":"point","layer":"出版と社会","title":"書店のない自治体が全国の約3割との調査","summary":"出版文化産業振興財団の調査で、書店が1店もない市区町村が全国の約27%にのぼるとされた。","detail":"調査によれば無書店自治体は約480で、都道府県によっては半数近くに達する。ただし「書店」の定義（新刊書店のみか、古書店やコンビニの書籍売場を含むか）や調査時点で数値は変わり、別の調査では異なる割合が示されている。地元の店を失ったわたしは、この統計の1に自分の町が入っていることを、数字として初めて確認した。","credibility":"unverified","credibility_note":"無書店自治体の割合は「書店」の定義と調査時点により調査ごとに差があり、約27%という値は特定の民間調査に基づく暫定的な数値。","sources":[{"title":"出版文化産業振興財団（JPIC）: 書店のない自治体に関する調査（2024年）","url":null}]},{"date":"2025-06-01","precision":"month","end_date":null,"type":"point","layer":"人生の出来事","title":"月に一度の読書会を始める","summary":"近所の公民館を借りて、6人から始めた読書会。課題本は毎回参加者が持ち回りで選ぶ。最初の一冊は『モモ』。","detail":"書店がなくなった町で、それでも本の話をする場所は作れると思った。参加者の年齢は20代から70代まで。紙で読む人も電子で読む人もいて、同じ本の違う版を並べて話すのが恒例になった。35年前に図書室で借りた本を、今度は自分が薦める側になった。この年表は、読書会の初回で自己紹介の代わりに配ったものが元になっている。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"子どもが『モモ』を図書室で借りてくる","summary":"13歳になった子どもが、薦めたわけでもないのに同じ本を学校の図書室から借りてきた。36年ぶりに同じ本を、別々に読む。","detail":"自分が10歳で読んだ本を、子どもは13歳で手に取った。感想は聞かないことにしている。読み返すたびに違う本になるなら、最初の一回は本人だけのものだと思うから。この年表はここでいったん止まるが、続きは子どもの年表になるのかもしれない。本の売れ方も読み方も変わり続けたこの36年で、変わらなかったのは、図書室に本があったことだった。","credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-two-of-us","title":"ふたりの10年間","description":"2014年に東京で出会った架空のふたり、「わたし」とKの記録。ふたりの出来事と仕事・暮らしの変化に、同じ年の社会の出来事を重ね、小さな選択が時代の空気とどう響き合っていたかを振り返る。","category":"personal-life","language":"ja","start_year":2014,"end_year":2024,"layers":[{"name":"ふたりの出来事","color":"pink"},{"name":"仕事と暮らし","color":"gold"},{"name":"時代の空気","color":"teal"}],"events":[{"date":"2014-04-01","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"消費税率が5%から8%へ","summary":"17年ぶりの消費税率引き上げ。駆け込み需要のあと、春の消費が一時的に冷え込んだ。","detail":"1997年以来の税率引き上げで、社会保障財源の確保が目的とされた。日用品の値札が一斉に書き換わり、街には「増税前セール」の名残があった。この年の5月、ふたりは友人の写真展で初めて言葉を交わす。最初の会話は、缶コーヒーが少し高くなったという他愛のない話題だったと記録にある。","credibility":"verified","credibility_note":null,"sources":[{"title":"財務省: 消費税率の引上げについて（平成26年4月）","url":"https://www.mof.go.jp/tax_policy/summary/consumption/consumption_tax/index.html"}]},{"date":"2014-05-17","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"友人の写真展で出会う","summary":"神保町の小さなギャラリー。受付を手伝っていたKと、閉場間際に来たわたしが初めて話した日。","detail":"共通の友人の個展の最終日。わたしは会社帰りに滑り込み、Kは受付で片付けを始めていた。缶コーヒーの値段が上がった話から始まり、気づけば搬出まで手伝っていた。連絡先を交換したのはその晩ではなく、友人を介した打ち上げの席だったという。消費税が8%になった春の、なんでもない土曜日の出来事。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-03-21","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"付き合い始める","summary":"出会いから10か月。井の頭公園の桜が咲く前の週末に、どちらからともなく約束をした。","detail":"写真展のあとも月に一度は顔を合わせていたが、関係に名前をつけるまでに時間がかかった。三連休の初日、まだ蕾の桜並木を歩きながら、次の春も一緒に見に来ようという話になった。特別な告白の言葉はなく、帰り道にKが「じゃあ、そういうことで」と言ったのが始まりだったと、わたしの手帳には書いてある。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-04-14","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"熊本地震が発生","summary":"4月14日と16日に最大震度7を2度観測。東京でも防災意識が再び高まり、備蓄品が品薄になった。","detail":"前震と本震という言葉が広く知られるきっかけとなった地震。関連死を含め270人以上が亡くなり、住宅被害は20万棟近くに及んだ。東日本大震災から5年、東京でも非常食や簡易トイレを買い足す人が増えた。ふたりがこの年の秋に同棲を始めたとき、最初に揃えた共有の持ち物は防災リュックだった。","credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成28年（2016年）熊本地震","url":"https://www.data.jma.go.jp/eqev/data/2016_04_14_kumamoto/index.html"},{"title":"内閣府防災: 平成28年熊本地震に係る被害状況等について","url":null}]},{"date":"2016-11-01","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"三軒茶屋の1LDKで同棲を始める","summary":"ふたつの部屋を引き払い、築30年の1LDKへ。家賃は折半、食器は片方の実家から譲り受けた。","detail":"それぞれの更新時期が近かったことが背中を押した。引っ越し当日は本の段ボールが多すぎて業者に呆れられ、夜は床に座って弁当を食べた。春の熊本地震のあとだったので、最初に買い足した共有物は防災リュックと水だった。玄関に置かれたその赤いリュックは、その後の引っ越しにもずっとついてくることになる。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"わたしの残業が月80時間を超える","summary":"新規案件が重なり、終電帰りが続いた月。体調を崩し、初めて仕事のペースについて真剣に話し合った。","detail":"深夜のタクシー代が支給される代わりに、休日出勤が当たり前になっていた。6月末に微熱が引かず、Kに促されて受診した。翌年に働き方改革関連法が成立し、残業時間に上限が設けられるが、この時点ではまだ「忙しいのは良いこと」という空気が職場に残っていた。この経験が、のちのフリーランス転向の遠い伏線になる。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-04-01","precision":"day","end_date":"2019-03-31","type":"period","layer":"ふたりの出来事","title":"Kの大阪赴任による遠距離の1年","summary":"Kが大阪支社の立ち上げに参加。月に一度どちらかが新幹線に乗る、遠距離の12か月。","detail":"赴任は1年限定と決まっていたが、始まる前は長く感じられた。ビデオ通話を毎晩つなぎ、互いの夕食を画面越しに見せ合うのが習慣になった。同じ年に働き方改革関連法が成立し、Kの会社でも有給取得が推奨されるようになったおかげで、月一度の往復は最後まで途切れなかった。三軒茶屋の部屋の防災リュックは、この年もわたしが一人で点検した。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-06-29","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"働き方改革関連法が成立","summary":"時間外労働の罰則付き上限規制や有給休暇の取得義務化を含む法律が成立。2019年4月から順次施行。","detail":"長時間労働の是正を柱に、大企業では2019年4月から残業の上限規制が始まった。過労死の社会問題化と、労働力人口の減少という背景がある。前年に残業で体調を崩したわたしにとって、この法律は少し遅れて届いた追い風だった。遠距離中のKが月一度の帰京を続けられたのも、有給取得を促す職場の空気の変化と無関係ではなかった。","credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 「働き方改革」の実現に向けて","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000148322.html"}]},{"date":"2019-05-01","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"元号が令和に改まる","summary":"平成から令和へ。10連休のなか、街のカウントダウンや記帳の列がニュースになった。","detail":"1989年以来30年ぶりの改元。憲政史上初の退位による代替わりで、事前に新元号が公表されるという珍しい経過をたどった。ふたりはこの年の秋に入籍するが、婚姻届の元号欄をどちらで書くか、という小さな会話が残っている。時代の区切りが個人の記録の書式にまで及ぶことを、静かに実感した年だった。","credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 新元号「令和」について（平成31年4月1日）","url":"https://www.kantei.go.jp/jp/98_abe/statement/2019/0401singengou.html"}]},{"date":"2019-11-03","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"入籍","summary":"遠距離が明けて半年。文化の日の朝、区役所の休日窓口に婚姻届を出した。式は挙げなかった。","detail":"改元の年の秋。婚姻届の日付欄に「令和元年」と書き、平成生まれのふたりが初めて新しい元号を自分の手で書いた日でもあった。証人はあの写真展の主催者の友人に頼んだ。夜は三軒茶屋の行きつけの定食屋で、いつも通りの夕食。式を挙げない代わりに、翌年の春に小さな旅行を計画していたが、それは実現しなかった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"時代の空気","title":"都内企業のテレワーク導入率が6割超に","summary":"東京都の調査で、従業員30人以上の都内企業のテレワーク導入率が4月に6割を超えたとされる。","detail":"3月時点では2割程度だった導入率が、緊急事態宣言を挟んで急上昇した。ただし調査対象や時期、「導入」の定義によって数値は大きく異なり、中小企業や現場職種では実施率が低かったとする調査もある。ふたりの在宅勤務も、Kの会社が制作業でわたしが企画職だったからこそ可能だった。数字の背後には、在宅にできなかった人々の仕事がある。","credibility":"unverified","credibility_note":"調査主体・対象企業規模・調査時期によりテレワーク実施率の数値は大きく異なり、単一の値として確定しにくい。","sources":[{"title":"東京都: テレワーク導入率調査結果（2020年4月）","url":null}]},{"date":"2020-04-07","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"新型コロナで初の緊急事態宣言","summary":"東京など7都府県に緊急事態宣言。16日に全国へ拡大され、外出自粛と在宅勤務が一気に広がった。","detail":"3月24日に東京五輪の延期が決まり、4月7日に改正特措法に基づく初の宣言が出された。飲食店の時短、学校の休校、通勤の消失。ふたりの部屋も翌日から在宅勤務の場になり、6畳の居間にふたつの机が並んだ。前年に計画した旅行は取りやめになったが、この宣言下の2か月が、ふたりにとって最も長く一緒に過ごした時間になる。","credibility":"verified","credibility_note":null,"sources":[{"title":"内閣官房: 新型コロナウイルス感染症緊急事態宣言（令和2年4月7日）","url":"https://corona.go.jp/news/pdf/kinkyujitai_sengen_0407.pdf"}]},{"date":"2020-04-08","precision":"day","end_date":"2020-05-25","type":"period","layer":"仕事と暮らし","title":"6畳の居間でふたり在宅勤務","summary":"緊急事態宣言の翌日から解除まで、ひとつの部屋にふたつの机。会議の声が重なる日々。","detail":"Kはリビングのテーブル、わたしは寝室の窓際に折りたたみ机を置いた。互いのオンライン会議の時間を朝に共有し、声が重ならないよう調整した。買い物は週2回にまとめ、防災リュックの中身が初めて役に立った。宣言解除で出社が戻ったあとも、Kの会社は週3日の在宅を継続した。働く場所と暮らす場所の境目が、このときから曖昧になった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-10-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"わたしがフリーランスに","summary":"8年勤めた会社を辞め、企画・編集の仕事を個人で受け始める。最初の取引先は元の勤め先。","detail":"在宅勤務の1年半で、会社に行かなくても仕事が回ることを知ってしまった。2017年に体調を崩した経験と、遠距離の間に身についた自分で時間を組み立てる習慣が、決断の土台になった。収入は不安定になったが、朝の時間が自分のものになった。Kは反対も賛成もせず、開業届を出した日に少し良い米を買ってきた。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"物価上昇で家計簿を始める","summary":"食用油や小麦製品の値上げが続き、初めて共有の家計簿アプリを入れた。円安が話題になり始めた頃。","detail":"2月のロシアによるウクライナ侵攻以降、エネルギーと食料の価格が上がり、この年の秋には円相場が一時1ドル150円台をつけた。フリーランスになって収入の波が大きくなったこともあり、ふたりの支出を可視化する必要が出てきた。家計簿を続けて分かったのは、いちばん減らせないのが本代とコーヒー代だということだった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-01-01","precision":"year","end_date":null,"type":"point","layer":"時代の空気","title":"東京23区の新築マンション平均価格が1億円超","summary":"民間調査で2023年の23区新築分譲マンション平均価格が初めて1億円を上回ったとされる。","detail":"建築費の高騰と用地不足、都心回帰、海外投資家の需要などが背景に挙げられる。ただし平均価格は大型高額物件の供給に引きずられやすく、調査機関や集計方法によって数値は異なる。ふたりがこの年に8か月かけて家を探し、結局は郊外寄りの中古物件を選んだ背景には、この価格帯の変化があった。","credibility":"disputed","credibility_note":"平均価格の水準は調査機関（不動産経済研究所など）や集計対象により差があり、「初の1億円超」の解釈も集計方法に依存する。","sources":[{"title":"不動産経済研究所: 首都圏新築分譲マンション市場動向 2023年（年間のまとめ）","url":null}]},{"date":"2023-04-01","precision":"day","end_date":"2023-11-30","type":"period","layer":"ふたりの出来事","title":"家探しの8か月","summary":"三軒茶屋の更新を機に、購入か賃貸かで迷い続けた春から秋。内見は20件を超え、週末はほぼ埋まった。","detail":"都心の新築マンション価格が1億円を超えたと報じられた年で、最初から新築は選択肢になかった。中古の団地、郊外の戸建て、賃貸のまま住み替える案。週末ごとに内見を重ね、11月に東京の西寄りにある築25年のマンションを買うことに決めた。決め手は、Kが「ここなら本棚を壁一面にできる」と言ったことだった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"住宅ローンを固定金利で契約","summary":"日銀のマイナス金利解除と同じ月に契約。迷った末に全期間固定を選び、家計簿の項目がひとつ増えた。","detail":"フリーランスのわたしは審査に時間がかかり、契約はKの名義が中心になった。金利の先行きが読めない中、返済額が変わらない安心を優先した。2022年から続けていた家計簿が、返済計画を立てるうえで思いがけず役に立った。10年前に缶コーヒーの値段の話をしていたふたりが、金利の話をしている。それが可笑しくもあり、少し感慨深くもあった。","credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-19","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"日銀がマイナス金利政策を解除","summary":"2016年から続いたマイナス金利を解除し、17年ぶりの利上げ。住宅ローン金利の先行きが話題になった。","detail":"賃金と物価の好循環が見通せるとして、大規模金融緩和の枠組みが転換された。長期金利の上昇観測から、住宅ローンを固定にするか変動にするかという議論が身近な話題になった。前年秋に購入を決めたふたりのローン契約が同じ月に重なり、決断の重さを実感することになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"日本銀行: 金融政策の枠組みの見直しについて（2024年3月19日）","url":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2024/k240319a.pdf"}]},{"date":"2024-05-17","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"出会いから10年、神保町へ","summary":"あの写真展のギャラリーはもうないが、同じ通りを歩き、同じ喫茶店で缶コーヒーではなく珈琲を飲んだ。","detail":"新居への引っ越しを翌月に控えた土曜日。ギャラリーは別の店に変わっていたが、通りの古書店は変わらずにあった。この10年で消費税は2度上がり、元号が変わり、感染症で街が静まり、金利が動いた。ふたりの記録は、その大きな流れの脇に置かれた小さな注釈のようなものだ。玄関の赤い防災リュックは、次の家にも持っていく。","credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"science-astrophysics","title":"宇宙物理学の革命","description":"1915年の一般相対性理論から重力波とJWSTまで。理論の飛躍、それを検証した観測と装置、そして発見をめぐる人と社会の反応の3層を重ね、宇宙像がどう塗り替えられてきたかをたどる。","category":"science-nature","language":"ja","start_year":1915,"end_year":2023,"layers":[{"name":"理論","color":"purple"},{"name":"観測と装置","color":"blue"},{"name":"人と社会","color":"gold"}],"events":[{"date":"1915-11-25","precision":"day","end_date":null,"type":"point","layer":"理論","title":"アインシュタイン、一般相対性理論の場の方程式を発表","summary":"プロイセン科学アカデミーで重力を時空の曲がりとして記述する場の方程式を提出。宇宙論と天体物理の基礎となる。","detail":"10年に及ぶ試行の末、11月中に4回の講演で理論を完成させ、水星の近日点移動を説明した。ほぼ同時期にヒルベルトも同等の方程式に到達しており、先取権をめぐる議論が長く続いた。理論の予言する光の湾曲は4年後の日食観測で検証され、膨張宇宙やブラックホールといった以後の理論展開はすべてこの方程式の解として現れる。","credibility":"disputed","credibility_note":"場の方程式の最終形をヒルベルトが先に得ていたかどうかについて、校正刷りの証拠をめぐり科学史家の見解が分かれる。","sources":[{"title":"Einstein, A. (1915) Die Feldgleichungen der Gravitation. Sitzungsberichte der Königlich Preußischen Akademie der Wissenschaften","url":null},{"title":"Corry, L., Renn, J. & Stachel, J. (1997) Belated Decision in the Hilbert-Einstein Priority Dispute. Science","url":null}]},{"date":"1919-05-29","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"エディントンらが日食観測で光の湾曲を確認","summary":"プリンシペ島とブラジル・ソブラルの皆既日食観測で、太陽近くの星の位置ずれが一般相対論の予測と一致。","detail":"第一次大戦終結の翌年、英国の遠征隊がドイツの物理学者の理論を検証した。同年11月6日の王立協会での発表を英タイムズ紙が「科学の革命」と報じ、アインシュタインは一夜にして世界的な有名人となった。観測精度と写真乾板の取捨選択には後年疑問も出されたが、再解析では結論が支持されている。理論と観測と社会的反響が半年のうちに連鎖した典型例。","credibility":"verified","credibility_note":null,"sources":[{"title":"Dyson, F. W., Eddington, A. S. & Davidson, C. (1920) A Determination of the Deflection of Light by the Sun's Gravitational Field. Philosophical Transactions of the Royal Society A","url":"https://doi.org/10.1098/rsta.1920.0009"}]},{"date":"1927-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"ルメートル、膨張宇宙モデルを提唱","summary":"ベルギーの司祭で物理学者のルメートルが、一般相対論の解として膨張する宇宙を導き、後退速度と距離の比例関係を予言。","detail":"1922年のフリードマンの数学的解に続き、ルメートルは観測データと結びつけて宇宙の膨張率を見積もった。フランス語の地方誌に掲載されたため当初は注目されず、2年後のハッブルの観測が広く知られることになる。2018年、IAUは「ハッブルの法則」を「ハッブル・ルメートルの法則」と呼ぶことを推奨し、先取権の再評価が行われた。1931年には「原始的原子」の着想でビッグバン理論の原型を示した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Lemaître, G. (1927) Un Univers homogène de masse constante et de rayon croissant. Annales de la Société Scientifique de Bruxelles","url":null},{"title":"IAU (2018) Resolution B4 on a suggested renaming of the Hubble Law","url":null}]},{"date":"1929-03-15","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ハッブル、銀河の後退速度と距離の比例関係を発表","summary":"ウィルソン山天文台の100インチ望遠鏡で測った銀河の距離と赤方偏移から、遠い銀河ほど速く遠ざかることを示す。","detail":"1924年にアンドロメダが天の川の外の銀河だと示したハッブルは、24個の銀河のデータで比例関係を導いた。当時の距離尺度の誤りから比例定数は現在の約7倍と大きかったが、宇宙が膨張しているという理論レイヤーの予言に観測の裏付けを与え、静的宇宙を信じていたアインシュタインも1931年に宇宙項を撤回した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Hubble, E. (1929) A relation between distance and radial velocity among extra-galactic nebulae. PNAS","url":"https://doi.org/10.1073/pnas.15.3.168"}]},{"date":"1933-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と装置","title":"ツビッキー、かみのけ座銀河団に「見えない質量」を指摘","summary":"銀河団内の銀河の速度分散から、光る物質だけでは重力的に束縛できないほど大きな質量が必要と推定。","detail":"ツビッキーはビリアル定理を用いて銀河団の質量を見積もり、光度から推定される質量を大幅に上回るとして「暗黒物質（dunkle Materie）」の語を使った。当時のハッブル定数が過大だったため推定倍率は現在より大きく、結論は数十年間ほとんど顧みられなかった。1970年代のルービンらの銀河回転曲線の観測で問題が再浮上し、暗黒物質は現代宇宙論の中心課題となる。","credibility":"unverified","credibility_note":"ツビッキーが示した質量比の数値は当時の距離尺度に依存し、現在の値とは大きく異なる。「暗黒物質発見」と位置づけるかどうかも評価が分かれる。","sources":[{"title":"Zwicky, F. (1933) Die Rotverschiebung von extragalaktischen Nebeln. Helvetica Physica Acta","url":null}]},{"date":"1935-01-11","precision":"day","end_date":null,"type":"point","layer":"人と社会","title":"エディントン、王立天文学会でチャンドラセカールの理論を公然と否定","summary":"白色矮星の質量に上限があるとする24歳のチャンドラセカールの発表に対し、権威エディントンがその場で酷評。","detail":"チャンドラセカールは相対論的量子統計を白色矮星に適用し、太陽質量の約1.4倍を超えると重力を支えられないと示した。エディントンの否定は若い研究者の評価に長く影を落とし、彼は研究分野を変えた。この上限質量は後に中性子星やブラックホールの形成理解の基礎となり、1983年のノーベル賞で報われた。理論の正しさと学界の受容が数十年ずれた事例として語り継がれる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Chandrasekhar, S. (1935) The highly collapsed configurations of a stellar mass (Second paper). Monthly Notices of the Royal Astronomical Society","url":null},{"title":"The Observatory, Vol. 58 (1935) Report of the RAS meeting of 1935 January 11","url":null}]},{"date":"1948-04-01","precision":"day","end_date":null,"type":"point","layer":"理論","title":"アルファーとガモフ、高温初期宇宙での元素合成を提唱","summary":"「αβγ論文」として知られる短報で、膨張する高温高密度の初期宇宙で軽元素が作られたと論じる。","detail":"ガモフが冗談でベーテを著者に加えたことで知られるこの論文は、ビッグバン元素合成の出発点となった。同年アルファーとハーマンは、初期宇宙の名残の放射が現在約5Kの背景放射として残っていると予言したが、観測可能とは考えられず忘れられた。1965年の宇宙マイクロ波背景放射の偶然の発見が、17年越しでこの予言を裏付けることになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Alpher, R. A., Bethe, H. & Gamow, G. (1948) The Origin of Chemical Elements. Physical Review","url":"https://doi.org/10.1103/PhysRev.73.803"}]},{"date":"1965-07-01","precision":"month","end_date":null,"type":"point","layer":"観測と装置","title":"ペンジアスとウィルソン、宇宙マイクロ波背景放射を発見","summary":"ベル研究所のホーンアンテナで除去できない雑音が、あらゆる方向から届く約3Kの宇宙背景放射だと判明。","detail":"衛星通信用アンテナの雑音源を探していた2人は、鳩の糞まで疑った末に等方的な放射を確認した。プリンストンのディッケらはちょうど同じ放射を探す観測を準備中で、両グループの論文が同じ号に並んだ。1948年の予言を裏付けるビッグバン理論の決定的証拠となり、定常宇宙論は退場した。2人は1978年にノーベル物理学賞を受賞している。","credibility":"verified","credibility_note":null,"sources":[{"title":"Penzias, A. A. & Wilson, R. W. (1965) A Measurement of Excess Antenna Temperature at 4080 Mc/s. The Astrophysical Journal","url":"https://doi.org/10.1086/148307"},{"title":"The Nobel Prize in Physics 1978","url":"https://www.nobelprize.org/prizes/physics/1978/summary/"}]},{"date":"1967-11-28","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ジョスリン・ベル、初のパルサーを検出","summary":"ケンブリッジの大学院生が電波観測の記録紙に規則正しいパルスを見つけ、後に高速回転する中性子星と解釈される。","detail":"1.337秒周期の信号は当初「LGM-1（小さな緑の人）」と冗談交じりに呼ばれた。パルサーの発見により、1930年代に理論的に予想された中性子星の実在が確かめられ、極限状態の物理を試す天体が手に入った。1974年のノーベル物理学賞は指導教官ヒューイッシュに贈られ、発見者のベルが対象外だったことは科学界での貢献の帰属をめぐる議論を呼んだ。","credibility":"verified","credibility_note":null,"sources":[{"title":"Hewish, A., Bell, S. J., Pilkington, J. D. H., Scott, P. F. & Collins, R. A. (1968) Observation of a Rapidly Pulsating Radio Source. Nature","url":"https://doi.org/10.1038/217709a0"}]},{"date":"1970-02-01","precision":"month","end_date":null,"type":"point","layer":"観測と装置","title":"ルービンとフォード、アンドロメダ銀河の平坦な回転曲線を報告","summary":"銀河外縁部の星が予想より速く回っていることを示し、見えない質量が銀河を包む可能性を観測から提起。","detail":"光る物質だけなら外側ほど回転速度は落ちるはずだが、観測は速度がほぼ一定に保たれることを示した。1970年代末までに多数の渦巻銀河で同じ傾向が確かめられ、1933年のツビッキーの指摘が銀河スケールでも成り立つことになった。暗黒物質の存在は以後の宇宙論の前提となり、その正体は2020年代でも未解明のままである。","credibility":"verified","credibility_note":null,"sources":[{"title":"Rubin, V. C. & Ford, W. K. Jr. (1970) Rotation of the Andromeda Nebula from a Spectroscopic Survey of Emission Regions. The Astrophysical Journal","url":"https://doi.org/10.1086/150317"}]},{"date":"1974-03-01","precision":"day","end_date":null,"type":"point","layer":"理論","title":"ホーキング、ブラックホールが放射して蒸発すると予言","summary":"量子効果によりブラックホールが熱放射を出し、質量を失って蒸発しうることをNature誌の短報で示す。","detail":"一般相対論と量子論を組み合わせた計算で、ブラックホールに温度とエントロピーがあることを示した。1972年のベッケンシュタインの着想を理論的に裏付け、量子重力と情報パラドックスという長い議論を生んだ。放射は極めて微弱で観測はされていないが、1970年代の理論の飛躍は1988年の著書「ホーキング、宇宙を語る」を通じて社会に広く届き、宇宙物理学の大衆化を象徴した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Hawking, S. W. (1974) Black hole explosions? Nature","url":"https://doi.org/10.1038/248030a0"}]},{"date":"1981-01-15","precision":"day","end_date":null,"type":"point","layer":"理論","title":"グース、インフレーション宇宙論を発表","summary":"初期宇宙が指数関数的に急膨張したとするモデルを提唱し、地平線問題と平坦性問題を同時に解決。","detail":"素粒子論の相転移から着想されたインフレーションは、宇宙の一様性と平坦さを説明し、量子ゆらぎが銀河の種になるという予測を生んだ。その予測は1992年のCOBE、2003年以降のWMAP、プランク衛星の観測で確かめられていく。同時期に佐藤勝彦、スタロビンスキー、リンデらも類似の考えを独立に提案しており、着想の先取権は単一には帰せない。","credibility":"disputed","credibility_note":"1979〜81年に佐藤勝彦、スタロビンスキー、カザナス、リンデらが独立に類似モデルを発表しており、誰を提唱者とするかは文献により異なる。","sources":[{"title":"Guth, A. H. (1981) Inflationary universe: A possible solution to the horizon and flatness problems. Physical Review D","url":"https://doi.org/10.1103/PhysRevD.23.347"},{"title":"Sato, K. (1981) First-order phase transition of a vacuum and the expansion of the Universe. Monthly Notices of the Royal Astronomical Society","url":null}]},{"date":"1990-04-24","precision":"day","end_date":"1993-12-13","type":"period","layer":"観測と装置","title":"ハッブル宇宙望遠鏡、打ち上げから光学系修理まで","summary":"スペースシャトルで打ち上げられたが主鏡の研磨誤差が判明。1993年の修理ミッションで本来の性能を取り戻す。","detail":"打ち上げ直後に像がぼやける「球面収差」が見つかり、巨額計画への批判が噴出した。1993年12月のエンデバー号による補正光学系の取り付けで視力を回復し、以後、深宇宙撮像、宇宙年齢の決定、加速膨張の発見など数々の成果を生む。装置の失敗と回復が社会の科学予算への視線を左右した例であり、次世代望遠鏡JWSTの慎重な開発姿勢にも影響した。","credibility":"verified","credibility_note":null,"sources":[{"title":"NASA: Hubble Space Telescope","url":"https://science.nasa.gov/mission/hubble/"},{"title":"NASA: STS-61 Mission Archives (First Hubble Servicing Mission)","url":null}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と装置","title":"遠方超新星の観測で宇宙の加速膨張を発見","summary":"リースらとパールマッターらの2チームがIa型超新星の距離測定から、宇宙膨張が減速でなく加速していると報告。","detail":"重力で膨張が減速するはずという理論レイヤーの前提を覆し、アインシュタインが撤回した宇宙項に相当する「ダークエネルギー」の存在を示唆した。ハッブル宇宙望遠鏡の追観測が精度を支えた。宇宙の組成は通常物質約5%、暗黒物質約27%、ダークエネルギー約68%という現代の描像がここから固まり、3人は2011年にノーベル物理学賞を受賞した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Riess, A. G. et al. (1998) Observational Evidence from Supernovae for an Accelerating Universe and a Cosmological Constant. The Astronomical Journal","url":"https://doi.org/10.1086/300499"},{"title":"Perlmutter, S. et al. (1999) Measurements of Ω and Λ from 42 High-Redshift Supernovae. The Astrophysical Journal","url":"https://doi.org/10.1086/307221"}]},{"date":"2014-03-17","precision":"day","end_date":"2015-01-30","type":"period","layer":"人と社会","title":"BICEP2「原始重力波の痕跡」発表から撤回まで","summary":"南極の望遠鏡がインフレーションの証拠となる偏光パターンを検出したと発表し話題となるが、銀河系の塵の影響と判明。","detail":"記者会見と動画で「ノーベル賞級」と報じられ、インフレーション理論の直接証拠として大きく取り上げられた。しかしプランク衛星との共同解析で、信号の大部分は銀河系内の塵によるものと結論され、2015年1月に主張は事実上撤回された。査読前の発表と科学報道のあり方が問われる一方、誤りが公開の場で修正される科学の自己修正機能を示した事例でもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"BICEP2 Collaboration (2014) Detection of B-Mode Polarization at Degree Angular Scales by BICEP2. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.112.241101"},{"title":"BICEP2/Keck and Planck Collaborations (2015) Joint Analysis of BICEP2/Keck Array and Planck Data. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.114.101301"}]},{"date":"2015-09-14","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"LIGO、重力波を初めて直接検出","summary":"改良後の観測開始直後、約13億光年先のブラックホール連星合体からの重力波GW150914を2台の検出器が同時に捉える。","detail":"一般相対論が1916年に予言してからほぼ100年後の直接検出で、2016年2月11日に公表された。太陽の約36倍と29倍のブラックホールが合体し、約3太陽質量分のエネルギーが重力波として放出されたと解析された。2017年8月には中性子星合体GW170817が電磁波でも同時観測され、マルチメッセンジャー天文学が始まった。ワイス、バリッシュ、ソーンは2017年にノーベル物理学賞を受賞している。","credibility":"verified","credibility_note":null,"sources":[{"title":"Abbott, B. P. et al. (LIGO Scientific Collaboration and Virgo Collaboration) (2016) Observation of Gravitational Waves from a Binary Black Hole Merger. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.116.061102"},{"title":"The Nobel Prize in Physics 2017","url":"https://www.nobelprize.org/prizes/physics/2017/summary/"}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"「ハッブル定数の不一致」が統計的に有意と報告される","summary":"近傍宇宙の距離はしごによる測定値と、宇宙背景放射から標準モデルで導く値のずれが約4σ超に達し、新物理の可能性が議論に。","detail":"リースらのセファイド変光星と超新星による測定は毎秒毎メガパーセクあたり約74km、プランク衛星の背景放射に標準宇宙モデルを当てはめた値は約67kmで、誤差を超えて食い違う。測定の系統誤差か、暗黒エネルギーの性質や初期宇宙の物理に見直しが必要かは決着していない。JWSTによる距離尺度の再検証が2020年代の焦点となっている。","credibility":"disputed","credibility_note":"不一致の原因が未知の系統誤差か標準宇宙モデルの不備かについて研究者間で見解が分かれ、独立した距離測定法ごとに値も異なる。","sources":[{"title":"Riess, A. G. et al. (2019) Large Magellanic Cloud Cepheid Standards Provide a 1% Foundation for the Determination of the Hubble Constant and Stronger Evidence for Physics beyond ΛCDM. The Astrophysical Journal","url":null},{"title":"Planck Collaboration (2020) Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics","url":"https://doi.org/10.1051/0004-6361/201833910"}]},{"date":"2020-10-06","precision":"day","end_date":null,"type":"point","layer":"人と社会","title":"ペンローズ、ゲンツェル、ゲズにノーベル物理学賞","summary":"ブラックホール形成が一般相対論の帰結であることの証明と、天の川銀河中心の超大質量天体の発見が評価される。","detail":"ペンローズは1965年に特異点定理でブラックホールの形成が理論の必然だと示し、ゲンツェルとゲズは1990年代からの星の軌道追跡で銀河中心に太陽の約400万倍の質量を突き止めた。前年2019年4月にはイベント・ホライズン・テレスコープがM87銀河中心のブラックホールの影を初めて撮像しており、理論、観測、社会的評価が105年の時を経て一点に集まった。","credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Physics 2020","url":"https://www.nobelprize.org/prizes/physics/2020/summary/"}]},{"date":"2021-12-25","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ジェイムズ・ウェッブ宇宙望遠鏡を打ち上げ","summary":"口径6.5mの赤外線宇宙望遠鏡が仏領ギアナからアリアン5で打ち上げられ、2022年7月に最初の科学画像を公開。","detail":"1996年の構想から25年、度重なる延期と予算超過を経て、総額約100億ドルの計画が実現した。太陽・地球のラグランジュ点L2で赤外線観測を行い、最初期の銀河、系外惑星大気、星形成領域を高感度で捉える。ハッブルの後継として距離尺度の再検証にも投入され、2019年の「ハッブル定数の不一致」の解決も期待される。","credibility":"verified","credibility_note":null,"sources":[{"title":"NASA: James Webb Space Telescope","url":"https://science.nasa.gov/mission/webb/"}]},{"date":"2023-02-22","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"JWST、初期宇宙に予想外に重い銀河候補を報告","summary":"ビッグバンから約5〜7億年の時点で、標準モデルの予想を超える質量を持つとみられる銀河候補がNature誌に報告される。","detail":"ラベらのチームは赤外線の色から推定した6個の候補天体の質量が、当時の宇宙にある通常物質の量から見て多すぎると指摘し、銀河形成理論の見直しの可能性を提起した。ただし推定は測光に基づき、分光確認や活動銀河核の寄与、質量推定法の違いによって結論が変わりうる。追観測で一部の候補は距離や質量が下方修正されており、評価は継続中である。","credibility":"unverified","credibility_note":"候補天体の距離と質量は測光推定に基づき、分光追観測やモデルの違いで大きく変わりうるため、標準モデルとの矛盾は確定していない。","sources":[{"title":"Labbé, I. et al. (2023) A population of red candidate massive galaxies ~600 Myr after the Big Bang. Nature","url":"https://doi.org/10.1038/s41586-023-05786-2"}]}]},{"slug":"science-climate-100","title":"気候変動の100年","description":"1896年のアレニウスの計算から2020年代の1.5℃到達まで。科学の発見、大気と気温の観測記録、国際政策と社会運動の3層を重ね、知見が政策に届くまでの遅れと加速を読む。","category":"science-nature","language":"ja","start_year":1896,"end_year":2024,"layers":[{"name":"科学の発見","color":"blue"},{"name":"観測と現象","color":"teal"},{"name":"政策と社会","color":"orange"}],"events":[{"date":"1896-01-01","precision":"year","end_date":null,"type":"point","layer":"科学の発見","title":"アレニウス、CO2濃度と地表温度の関係を定量化","summary":"スウェーデンの化学者アレニウスが、大気中CO2が倍増すると地表温度が数℃上昇するとの計算結果を発表。","detail":"アレニウスは氷期の成因を探る中で、CO2の赤外吸収が地表温度に与える影響を手計算で見積もった。倍増時の昇温を5〜6℃としたが、当時は温暖化を有益と考えていた。産業起源のCO2が問題になるとは想定されず、実際に濃度上昇が観測で示されるのは60年以上後のキーリングの測定を待つことになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Arrhenius, S. (1896) On the Influence of Carbonic Acid in the Air upon the Temperature of the Ground. Philosophical Magazine","url":"https://doi.org/10.1080/14786449608620846"}]},{"date":"1958-03-01","precision":"month","end_date":null,"type":"point","layer":"観測と現象","title":"キーリング、マウナロアでCO2の連続観測を開始","summary":"国際地球観測年を機に、ハワイ・マウナロア山頂で大気中CO2濃度の高精度な定常観測が始まる。","detail":"スクリップス海洋研究所のチャールズ・キーリングが開始した観測は、季節変動を伴いながら右肩上がりに増える「キーリング曲線」を生んだ。開始時の濃度は約315ppm。人為的なCO2増加を初めて連続データで示した観測であり、1960年代以降の理論研究や1965年の大統領諮問報告が依拠する基礎となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Scripps Institution of Oceanography: The Keeling Curve","url":"https://keelingcurve.ucsd.edu/"},{"title":"NOAA Global Monitoring Laboratory: Trends in Atmospheric Carbon Dioxide","url":"https://gml.noaa.gov/ccgg/trends/"}]},{"date":"1965-11-01","precision":"month","end_date":null,"type":"point","layer":"政策と社会","title":"米大統領科学諮問委員会がCO2の気候影響を報告","summary":"ジョンソン政権の科学諮問委員会が環境報告書の付録でCO2増加による気候変化の可能性を政府に警告。","detail":"報告書「Restoring the Quality of Our Environment」の付録は、キーリングの観測開始から7年で得られたデータを根拠に、2000年までにCO2が約25%増え気候に「著しい変化」を起こしうると述べた。米政府文書が温暖化に言及した最初期の例だが、具体的な政策には結びつかなかった。","credibility":"verified","credibility_note":null,"sources":[{"title":"President's Science Advisory Committee (1965) Restoring the Quality of Our Environment, Appendix Y4","url":null}]},{"date":"1967-01-01","precision":"year","end_date":null,"type":"point","layer":"科学の発見","title":"真鍋淑郎らがCO2倍増時の昇温を約2.3℃と算出","summary":"真鍋淑郎とウェザラルドが放射対流平衡モデルにより、CO2倍増で地表が約2.3℃昇温すると計算。","detail":"水蒸気フィードバックを含む物理モデルによる初の定量評価で、以後の気候モデルの原型となった。同年代の観測レイヤーではキーリング曲線が10年分の上昇を刻んでおり、理論と観測が初めてかみ合い始めた時期にあたる。真鍋はこの業績を含む研究で2021年にノーベル物理学賞を受賞した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Manabe, S. & Wetherald, R. T. (1967) Thermal Equilibrium of the Atmosphere with a Given Distribution of Relative Humidity. Journal of the Atmospheric Sciences","url":null},{"title":"The Nobel Prize in Physics 2021","url":"https://www.nobelprize.org/prizes/physics/2021/summary/"}]},{"date":"1979-07-01","precision":"month","end_date":null,"type":"point","layer":"科学の発見","title":"チャーニー報告、気候感度を1.5〜4.5℃と推定","summary":"米科学アカデミーの委員会がCO2倍増時の昇温を1.5〜4.5℃と評価。数十年にわたり基準となる推定幅。","detail":"ジュール・チャーニーを長とする委員会は、真鍋らのモデルとハンセンらのモデルを比較し、CO2倍増で「無視できる昇温は考えにくい」と結論した。同年2月にはWMO主催の第1回世界気候会議がジュネーブで開かれており、科学者コミュニティが政策側へ警告を発し始めた年でもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"National Research Council (1979) Carbon Dioxide and Climate: A Scientific Assessment","url":"https://doi.org/10.17226/12181"}]},{"date":"1988-06-23","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"ハンセン、米上院で「温暖化は始まっている」と証言","summary":"NASAのジェームズ・ハンセンが猛暑の中の上院公聴会で、温暖化が高い確度で進行中と証言し注目を集める。","detail":"記録的猛暑と干ばつに見舞われた夏の公聴会で、ハンセンは温室効果と観測された昇温の関係を「99%の確度」と述べた。この証言は温暖化を米国の政治課題に押し上げ、同年11月のIPCC設立とも重なった。1979年の科学的評価から約10年を経て、科学レイヤーの知見が政策レイヤーに本格的に接続した転換点。","credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Senate Committee on Energy and Natural Resources, Hearing on the Greenhouse Effect and Global Climate Change (June 23, 1988)","url":null}]},{"date":"1990-08-01","precision":"month","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC第1次評価報告書を公表","summary":"1988年に設立されたIPCCが初の評価報告書をまとめ、人為的排出が温室効果を強めていることを確認。","detail":"報告書は温室効果ガス排出が続けば21世紀に10年あたり約0.3℃の昇温が起きうると予測し、観測された昇温の人為的寄与についてはなお不確実と慎重に記した。この科学的評価が同年の第2回世界気候会議を経て、1992年の気候変動枠組条約の交渉に直接つながった。","credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (1990) Climate Change: The IPCC Scientific Assessment (First Assessment Report)","url":"https://www.ipcc.ch/reports/"}]},{"date":"1992-06-01","precision":"month","end_date":null,"type":"point","layer":"政策と社会","title":"地球サミットで気候変動枠組条約が署名開放","summary":"リオデジャネイロの国連環境開発会議で、温室効果ガス濃度の安定化を目的とする枠組条約に各国が署名。","detail":"条約は「気候系に危険な人為的干渉を及ぼさない水準」で濃度を安定させることを究極目的とし、1994年に発効した。数値目標を伴わない枠組みだったため、具体的な削減義務は1997年の京都議定書へ持ち越された。IPCC第1次報告から2年、ハンセン証言から4年での国際合意である。","credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: What is the United Nations Framework Convention on Climate Change?","url":"https://unfccc.int/process-and-meetings/the-convention/what-is-the-united-nations-framework-convention-on-climate-change"}]},{"date":"1997-12-11","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"京都議定書を採択","summary":"COP3で先進国に法的拘束力ある削減目標を課す京都議定書が採択。日本は6%削減を約束。","detail":"先進国全体で2008〜2012年に1990年比約5%削減を義務づけた。米国は署名したが批准せず、発効は2005年まで待つことになる。採択の翌年、観測レイヤーでは強いエルニーニョで1998年が当時の観測史上最高気温を記録し、科学レイヤーでは過去1000年の気温復元が発表されるなど、政策・観測・科学が同時に動いた時期。","credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: Kyoto Protocol","url":"https://unfccc.int/kyoto_protocol"}]},{"date":"1998-04-01","precision":"month","end_date":null,"type":"point","layer":"科学の発見","title":"マンら、過去600年の気温復元「ホッケースティック」を発表","summary":"年輪などの代替指標から北半球の気温変動を復元し、20世紀の昇温が突出していると示した論文がNatureに掲載。","detail":"翌年には復元期間が過去1000年に延長され、IPCC第3次報告（2001年）に採用されて温暖化の象徴的な図となった。一方で統計手法や代替指標の選択をめぐる批判が続き、2006年の米国研究評議会の検証では大筋の結論が支持されたが、中世の気温との比較の確からしさは議論が残った。","credibility":"disputed","credibility_note":"復元手法（主成分分析の中心化や代替指標の選択）に対する批判があり、20世紀以前の詳細な気温変動については専門家間で評価が分かれる。","sources":[{"title":"Mann, M. E., Bradley, R. S. & Hughes, M. K. (1998) Global-scale temperature patterns and climate forcing over the past six centuries. Nature","url":"https://doi.org/10.1038/33859"},{"title":"National Research Council (2006) Surface Temperature Reconstructions for the Last 2,000 Years","url":null}]},{"date":"2003-08-01","precision":"month","end_date":null,"type":"point","layer":"観測と現象","title":"欧州熱波、初めて人為的寄与が定量評価される","summary":"西欧を襲った記録的熱波で数万人規模の超過死亡。翌年、人間活動が発生確率を高めたとする研究が発表。","detail":"フランスなどで8月上旬に40℃前後が続き、高齢者を中心に多数の死者が出た。翌2004年、ストットらは人為的な温室効果ガスがこの規模の熱波の発生リスクを少なくとも2倍にしたと推定し、個別の異常気象に人為的寄与を割り当てる「イベント・アトリビューション」の先駆けとなった。政策レイヤーでは京都議定書がなお未発効だった。","credibility":"unverified","credibility_note":"超過死亡数は約3万人から7万人超まで推計に幅があり、対象国や集計期間によって数値が異なる。","sources":[{"title":"Stott, P. A., Stone, D. A. & Allen, M. R. (2004) Human contribution to the European heatwave of 2003. Nature","url":"https://doi.org/10.1038/nature03089"},{"title":"Robine, J.-M. et al. (2008) Death toll exceeded 70,000 in Europe during the summer of 2003. Comptes Rendus Biologies","url":"https://doi.org/10.1016/j.crvi.2007.12.001"}]},{"date":"2007-02-02","precision":"day","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC第4次報告「温暖化は疑う余地がない」","summary":"第1作業部会が気候系の温暖化を「疑う余地がない」と断定し、人為的要因である可能性が非常に高いと評価。","detail":"20世紀半ば以降の昇温の大部分が人為的温室効果ガスによる可能性を90%以上とした。同年10月にはIPCCとアル・ゴアがノーベル平和賞を受賞し、9月には北極海の夏季海氷面積が当時の観測史上最小を記録。科学の断定、観測の異変、社会的評価が同じ年に重なった。","credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (2007) Climate Change 2007: The Physical Science Basis. Summary for Policymakers","url":"https://www.ipcc.ch/report/ar4/wg1/"},{"title":"The Nobel Peace Prize 2007","url":"https://www.nobelprize.org/prizes/peace/2007/summary/"}]},{"date":"2008-01-01","precision":"year","end_date":"2012-12-31","type":"period","layer":"政策と社会","title":"京都議定書 第一約束期間","summary":"先進国が削減義務を負う5年間。日本は6%削減目標を森林吸収と海外クレジットを含めて達成。","detail":"採択から11年を経てようやく始まった義務期間。米国不参加のうえ、カナダは2011年に離脱を表明し、排出が急増する中国・インドには義務がなかった。期間中の2009年COP15コペンハーゲンでは次期枠組みの合意に失敗し、全ての国が参加する仕組みへの転換が2015年のパリ協定まで持ち越された。","credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: Kyoto Protocol","url":"https://unfccc.int/kyoto_protocol"},{"title":"環境省: 京都議定書目標達成計画の進捗状況","url":null}]},{"date":"2013-05-09","precision":"day","end_date":null,"type":"point","layer":"観測と現象","title":"マウナロアの日平均CO2濃度が初めて400ppmを超える","summary":"キーリングの観測開始から55
