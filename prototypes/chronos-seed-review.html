<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シードコンテンツ確認 — Chronos</title>
<meta name="description" content="Supabaseシード18本の内容レビュー用ページ。">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=erode@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C;--bg2:#0E0E11;--card:#16161A;
  --accent:#C8A87E;--accent-soft:rgba(200,168,126,0.10);--accent-med:rgba(200,168,126,0.18);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#9A9590;--text3:#7A7570;
  --border:rgba(200,168,126,0.10);--border2:rgba(200,168,126,0.20);
  --f-d:'Erode','Shippori Mincho',serif;--f-b:'DM Sans',sans-serif;--f-m:'JetBrains Mono',monospace;
  --hdr:100px;--ease:cubic-bezier(0.16,1,0.3,1);
  --c-blue:#5B9BD5;--c-green:#7BC67E;--c-pink:#D4849A;--c-gold:#C8B87E;--c-purple:#9E7EC8;--c-teal:#5BBCB4;--c-orange:#D4A05A;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px;-webkit-font-smoothing:antialiased;background:var(--bg);color-scheme:dark;overflow-x:clip;scroll-padding-top:calc(var(--hdr) + 16px)}
body{font-family:var(--f-b);background:var(--bg);color:var(--text);line-height:1.8}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

header.site{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,12,0.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.hdr-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:var(--hdr);display:flex;align-items:center;justify-content:space-between}
.hdr-logo{display:flex;align-items:center;padding:20px 0}
.hdr-logo img{height:40px;width:auto}
.hdr-back{font-size:12px;color:var(--text2);text-decoration:none;letter-spacing:0.06em;transition:color .3s;padding:8px 0}
.hdr-back:hover{color:var(--text)}

.wrap{max-width:1080px;margin:0 auto;padding:calc(var(--hdr) + 40px) 24px 96px}
.page-label{font-family:var(--f-m);font-size:12px;letter-spacing:0.22em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
h1.page-title{font-family:var(--f-d);font-weight:500;font-size:clamp(24px,4vw,34px);letter-spacing:0.08em;color:var(--text-h);margin-bottom:14px}
.page-lead{font-size:15px;color:var(--text2);max-width:640px;margin-bottom:48px}

/* ─ home: category sections */
.cat-sec{margin-bottom:52px}
.cat-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:10px}
.cat-name{font-family:var(--f-d);font-weight:500;font-size:19px;letter-spacing:0.1em;color:var(--text-h)}
.cat-count{font-family:var(--f-m);font-size:12px;color:var(--text3)}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tl-card{display:block;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 20px 16px;transition:border-color .3s,transform .3s var(--ease);width:100%}
.tl-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.tl-years{font-family:var(--f-m);font-size:12px;color:var(--accent);letter-spacing:0.12em;margin-bottom:8px}
.tl-title{font-size:18px;font-weight:500;color:var(--text-h);line-height:1.5;margin-bottom:8px}
.tl-desc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.layer-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.layer-chip i{width:8px;height:8px;border-radius:2px;flex:none}
.tl-evcount{margin-left:auto;font-family:var(--f-m);font-size:11px;color:var(--text3)}

/* ─ detail */
.detail{display:none}
.detail.on{display:block}
.home.off{display:none}
.d-back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin-bottom:28px;transition:color .3s}
.d-back:hover{color:var(--text)}
.d-cat{font-family:var(--f-m);font-size:11px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
.d-title{font-family:var(--f-d);font-weight:500;font-size:clamp(24px,4vw,34px);letter-spacing:0.06em;color:var(--text-h);line-height:1.5;margin-bottom:12px}
.d-desc{font-size:16px;color:var(--text2);max-width:680px;margin-bottom:20px}
.d-stats{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--f-m);font-size:12px;color:var(--text3);margin-bottom:28px}
.d-stats b{color:var(--text);font-weight:400}
.d-layers{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:44px}
.d-layer{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 16px;font-size:13px}
.d-layer i{width:10px;height:10px;border-radius:3px;flex:none}

/* events */
.ev-list{position:relative;padding-left:2px}
.ev{position:relative;display:grid;grid-template-columns:14px 1fr;gap:16px;padding-bottom:8px}
.ev-rail{position:relative}
.ev-rail::before{content:"";position:absolute;left:6px;top:22px;bottom:-4px;width:1px;background:var(--border)}
.ev:last-child .ev-rail::before{display:none}
.ev-dot{position:absolute;left:2px;top:9px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bg)}
.ev-dot.period{border-radius:3px}
.ev-body{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;min-width:0}
.ev-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.ev-date{font-family:var(--f-m);font-size:12px;color:var(--accent);letter-spacing:0.06em}
.ev-layer{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.ev-layer i{width:7px;height:7px;border-radius:2px}
.cred{font-size:11px;letter-spacing:0.08em;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.cred.verified{color:#7BC67E;border-color:rgba(123,198,126,0.35)}
.cred.disputed{color:#D4A05A;border-color:rgba(212,160,90,0.4)}
.cred.unverified{color:var(--text3);border-color:rgba(154,149,144,0.35)}
.ev-title{font-size:17px;font-weight:500;color:var(--text-h);line-height:1.55;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px}
.ev-summary{font-size:15px;color:var(--text);line-height:1.75;margin-bottom:8px}
.ev-summary strong,.ev-detail strong{color:var(--text-h);font-weight:500;background:linear-gradient(transparent 62%,var(--accent-med) 62%)}
.ev-summary p+p,.ev-detail p+p{margin-top:10px}
.ev-detail{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:8px}
.ev-note-label{display:block;font-family:var(--f-m);font-size:11px;letter-spacing:0.14em;color:#D4A05A;margin-bottom:4px}
.ev-note{font-size:13px;color:#D4A05A;background:rgba(212,160,90,0.07);border-left:2px solid rgba(212,160,90,0.4);padding:7px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;line-height:1.7}
.ev-srcs{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.ev-src{font-size:13px;color:var(--text3);line-height:1.6}
.ev-src a{color:var(--text2);text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:3px;word-break:break-all}
.ev-src a:hover{color:var(--accent)}
.year-mark{grid-column:1 / -1;font-family:var(--f-m);font-size:13px;letter-spacing:0.18em;color:var(--text3);padding:14px 0 12px;border-bottom:1px dashed var(--border);margin-bottom:16px}

@media (max-width:560px){
  .hdr-inner{padding:0 18px}
  .wrap{padding:calc(var(--hdr) + 28px) 18px 72px}
  .tl-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<header class="site">
  <div class="hdr-inner">
    <a class="hdr-logo" href="./" aria-label="Chronos"><img src="assets/chronos-logo.svg" alt="Chronos"></a>

  </div>
</header>

<main class="wrap">

    <div id="cats"></div>
  </div>

</main>

<script>
const DATA = [{"slug":"business-gafa","title":"GAFA帝国の形成","description":"1976年のApple創業から2020年代の規制強化まで、Google・Apple・Facebook（Meta）・Amazonの歩みを、製品とプラットフォーム・買収と資本・規制と社会の3層で重ねる。","category":"business","language":"ja","start_year":1976,"end_year":2024,"layers":[{"name":"製品とプラットフォーム","color":"blue"},{"name":"買収と資本","color":"orange"},{"name":"規制と社会","color":"teal"}],"events":[{"date":"1976-04-01","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Apple Computer 創業","summary":"スティーブ・ジョブズ、スティーブ・ウォズニアック、ロナルド・ウェインがカリフォルニア州でApple Computerを創業した。","detail":"ガレージ企業として始まり、翌1977年のApple IIで個人向けコンピュータ市場を開いた。GAFA四社の中で最も古く、ほかの三社が生まれるインターネット時代より20年近く前の出来事である。1980年の株式公開で得た資本と、のちの経営危機と復活が、2007年のiPhoneに至る長い前史をつくった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Apple Inc.","url":"https://en.wikipedia.org/wiki/History_of_Apple_Inc."}]},{"date":"1994-07-05","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Amazon 創業（当初社名Cadabra）","summary":"ジェフ・ベゾスがワシントン州でCadabraを設立。翌1995年7月にオンライン書店Amazon.comを開設した。","detail":"ウェブの商用利用が始まった直後の創業で、書籍を入り口に「あらゆるものを売る店」を目指した。1997年の株式公開で調達した資本を長期にわたり物流と技術に再投資し、利益より成長を優先する姿勢が投資家に受け入れられた。この方針が2006年のクラウド事業AWSの立ち上げを可能にする。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Amazon","url":"https://en.wikipedia.org/wiki/History_of_Amazon"}]},{"date":"1995-01-01","precision":"year","end_date":"2000-12-31","type":"period","layer":"買収と資本","title":"ドットコム・ブーム","summary":"インターネット関連企業への投資が過熱し、NASDAQは2000年3月に史上最高値を付けたのち急落した。","detail":"AmazonとGoogleはこの熱狂の中で創業・成長し、Amazonはバブル崩壊後の株価急落と資金繰りの不安を乗り越えた。Googleは崩壊直後の2000年に検索連動広告AdWordsを開始し、収益モデルを確立する。バブル期に敷設された通信インフラの過剰投資が、その後の安価な帯域と2000年代のプラットフォーム成長の土台になったとされる。","credibility":"unverified","credibility_note":"ブームの開始・終了年は定義により異なり、ここでは概ね1995年から2000年の崩壊までを目安として示す。","sources":[{"title":"Wikipedia: Dot-com bubble","url":"https://en.wikipedia.org/wiki/Dot-com_bubble"}]},{"date":"1998-09-04","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Google 設立","summary":"スタンフォード大学の研究プロジェクトを母体に、ラリー・ペイジとセルゲイ・ブリンがGoogleを法人化した。","detail":"被リンクを評価するPageRankを核にした検索エンジンで、ドットコム・ブームの渦中に創業した。1999年にベンチャーキャピタルから大型調達を行い、2004年に株式公開する。技術面では2000年のAdWordsによって「検索と広告」の結合が完成し、これがのちのYouTubeやAndroidの買収資金の源泉となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Google","url":"https://en.wikipedia.org/wiki/History_of_Google"}]},{"date":"2000-10-23","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Google AdWords 開始","summary":"Googleがセルフサービス型の検索連動広告AdWordsを開始。検索行動を広告収益に変える仕組みが確立した。","detail":"ドットコム・バブル崩壊の年に、無料検索の裏側で収益を生むモデルが登場した意味は大きい。以後、Googleの売上の大半を広告が占め、この資本力が2005年のAndroid、2006年のYouTube買収を支える。規制レイヤーでは、この検索と広告の結合が2020年の米司法省提訴と2024年の独占認定の中心論点になる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Google Ads","url":"https://en.wikipedia.org/wiki/Google_Ads"}]},{"date":"2004-02-04","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Thefacebook 開設","summary":"マーク・ザッカーバーグらがハーバード大学の学生向けにThefacebook.comを公開。大学から一般へと段階的に開放された。","detail":"実名を前提としたソーシャルネットワークで、2006年に一般公開、2007年に外部開発者向けプラットフォームを開始した。同じ2004年にはGoogleが株式公開しており、検索とソーシャルという二つの広告基盤が並行して立ち上がった年である。実名データの集積は成長の源泉であると同時に、2018年のケンブリッジ・アナリティカ問題の火種にもなる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Facebook","url":"https://en.wikipedia.org/wiki/History_of_Facebook"}]},{"date":"2005-08-01","precision":"month","end_date":null,"type":"point","layer":"買収と資本","title":"GoogleがAndroidを買収","summary":"Googleがモバイル向けOSを開発するスタートアップAndroidを買収。買収額は非公表で、約5,000万ドルと報じられた。","detail":"当時は小さな買収と受け止められたが、2007年のiPhone登場後にAndroidをオープンソースで端末メーカーに提供し、モバイル検索と広告の入り口を確保した。製品レイヤーではiPhoneとApp Storeが先行し、Androidは2008年秋に最初の端末が発売される。買収時の金額は公式には明らかにされていない。","credibility":"unverified","credibility_note":"買収の事実と時期は確かだが、買収額は非公表で報道による推計値。","sources":[{"title":"Wikipedia: Android (operating system)","url":"https://en.wikipedia.org/wiki/Android_(operating_system)"}]},{"date":"2006-08-25","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Amazon EC2 ベータ公開","summary":"AmazonがEC2の限定ベータを開始。同年3月のS3と合わせ、計算資源を時間貸しするクラウド事業AWSが本格化した。","detail":"小売の余剰インフラから生まれたと語られることが多いが、実際には社内の開発効率化の取り組みが出発点とされる。スタートアップが初期投資なしにサービスを立ち上げられる環境は、のちのInstagramなど買収対象となる企業を育てる土壌にもなった。AWSは2010年代にAmazonの営業利益の柱となり、規制当局が同社を評価する際の重要な論点となる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Elastic Compute Cloud","url":"https://en.wikipedia.org/wiki/Amazon_Elastic_Compute_Cloud"}]},{"date":"2006-10-09","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"GoogleがYouTubeを16.5億ドルで買収","summary":"Googleが動画共有サービスYouTubeを約16.5億ドルの株式交換で買収すると発表した。","detail":"創業から2年に満たない企業への大型買収で、AdWordsで築いた資本力を用いて成長領域を取り込む戦略が明確になった。製品面では同年にAmazonがEC2を公開しており、動画のような大容量サービスを支えるインフラ競争も始まっていた。動画広告市場の支配は、のちの各国の競争法調査でも繰り返し検討対象となる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: YouTube","url":"https://en.wikipedia.org/wiki/YouTube"}]},{"date":"2007-01-09","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"iPhone 発表","summary":"スティーブ・ジョブズがMacworldでiPhoneを発表。同年6月に米国で発売され、スマートフォンの形を定義した。","detail":"電話・iPod・インターネット端末を一体化した製品で、タッチ操作を前提としたモバイルOSの標準をつくった。Googleは2005年に買収していたAndroidの設計を見直し、2008年に対抗端末を投入する。翌2008年のApp Storeによって、端末とアプリ流通を一社が握る「プラットフォーム」の構図が完成し、これが2020年代の日欧の規制の対象となる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: Apple Reinvents the Phone with iPhone","url":"https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/"}]},{"date":"2008-07-10","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"App Store 開始","summary":"AppleがiPhone向けアプリ配信のApp Storeを開始。約500本のアプリでスタートし、開発者に売上の70%を配分するモデルを示した。","detail":"アプリ流通を単一の窓口に集約し、審査と手数料の仕組みを標準化した。Googleも同年にAndroid Marketを開始し、二大モバイルプラットフォームの並立が固まる。手数料率と審査の裁量はのちに開発者との対立を生み、EUのデジタル市場法（2022年発効）や日本のスマホソフトウェア競争促進法（2024年成立）で直接の規制対象となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: App Store (Apple)","url":"https://en.wikipedia.org/wiki/App_Store_(Apple)"}]},{"date":"2012-04-09","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"FacebookがInstagramを買収","summary":"Facebookが写真共有アプリInstagramを現金と株式で約10億ドルで買収すると発表。従業員13人の企業への大型買収だった。","detail":"スマートフォンとApp Storeの普及で急成長した若い企業を、株式公開直前のFacebookが取り込んだ。発表額は約10億ドルだが、Facebook株の下落により完了時の価値は7億ドル台と報じられる。この買収は2020年の米連邦取引委員会（FTC）による提訴で「競争相手の芽を摘む買収」として問題視され、事後的な規制の焦点になった。","credibility":"disputed","credibility_note":"発表時の約10億ドルという金額と、株価変動後の完了時価値は異なり、報道により数値が分かれる。","sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2014-02-19","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"FacebookがWhatsAppを買収","summary":"Facebookがメッセージアプリ WhatsAppを約190億ドルで買収すると発表。完了時には株価上昇で200億ドルを超えた。","detail":"モバイルのメッセージ領域を押さえる目的で、Instagramに続く大型買収となった。EUの企業結合審査ではデータ統合を行わないとの説明が前提とされ、のちに実態との相違で制裁金が科される。2018年のGDPR施行やケンブリッジ・アナリティカ問題を経て、こうしたデータを軸にした買収の審査は各国で厳格化していく。","credibility":"disputed","credibility_note":"発表額は約190億ドルだが、株式部分の価値変動により最終的な取引額は約218億ドルとされ、資料により金額が異なる。","sources":[{"title":"Wikipedia: WhatsApp","url":"https://en.wikipedia.org/wiki/WhatsApp"}]},{"date":"2018-03-17","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"ケンブリッジ・アナリティカ問題が発覚","summary":"英ガーディアン等の報道で、Facebook利用者のデータが選挙コンサル会社に不正利用されていたことが明らかになった。","detail":"外部アプリを通じて最大8,700万人分のデータが取得されたとされ、ザッカーバーグは米議会で証言した。2004年の実名SNSという製品設計と、2012年以降の買収によるデータ集積が、社会的な信頼の問題として噴出した形である。約2か月後にEUでGDPRが施行され、2019年のFTC制裁金へとつながる規制強化の起点となった。","credibility":"disputed","credibility_note":"影響を受けた利用者数は当初約5,000万人と報じられ、後にFacebookが最大約8,700万人と発表しており、数値に幅がある。","sources":[{"title":"Wikipedia: Facebook–Cambridge Analytica data scandal","url":"https://en.wikipedia.org/wiki/Facebook%E2%80%93Cambridge_Analytica_data_scandal"}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"EU一般データ保護規則（GDPR）施行","summary":"EUで個人データ保護を包括的に定めるGDPRが適用開始。違反時は世界売上の最大4%の制裁金が可能となった。","detail":"2016年に採択され2年の準備期間を経て施行された。ケンブリッジ・アナリティカ問題の直後というタイミングで、広告を収益源とするGoogleとFacebookのデータ利用に直接影響した。同意取得の設計や越境データ移転を巡り、以後GAFA各社への制裁金決定が相次ぐ。2022年のデジタル市場法と並び、EUがプラットフォーム規制の先行地域となる基盤である。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: General Data Protection Regulation","url":"https://en.wikipedia.org/wiki/General_Data_Protection_Regulation"}]},{"date":"2019-07-24","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"FTCがFacebookに50億ドルの制裁金","summary":"米連邦取引委員会がプライバシー侵害を理由にFacebookへ50億ドルの制裁金と監督強化を科すと発表した。","detail":"ケンブリッジ・アナリティカ問題を受けた処分で、消費者保護分野では過去最大級の金額となった。制裁と同時に取締役会レベルのプライバシー監督体制が義務付けられた。同年はGoogleに対する州司法長官の調査も始まり、翌2020年の司法省提訴とFTCによるFacebook提訴へ続く。買収レイヤーで拡大した企業が、規制レイヤーで初めて大きな代償を払った出来事である。","credibility":"verified","credibility_note":null,"sources":[{"title":"FTC Press Release (2019-07-24)","url":"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-imposes-5-billion-penalty-sweeping-new-privacy-restrictions-facebook"}]},{"date":"2020-10-20","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"米司法省がGoogleを反トラスト法違反で提訴","summary":"米司法省と11州がGoogleを検索と検索広告市場の独占維持で提訴。1998年のMicrosoft訴訟以来の大型事件となった。","detail":"Appleなど端末メーカーへの巨額の支払いでデフォルト検索を確保した行為が違法な独占維持にあたるかが争点となった。製品レイヤーではiPhoneとAndroidの二大プラットフォームが検索の入り口を握る構図が背景にある。同年12月にはFTCがFacebookのInstagram・WhatsApp買収を問題視して提訴し、GAFAへの競争法執行が本格化した。","credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Department of Justice: Justice Department Sues Monopolist Google","url":"https://www.justice.gov/opa/pr/justice-department-sues-monopolist-google-violating-antitrust-laws"}]},{"date":"2022-11-01","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"EUデジタル市場法（DMA）発効","summary":"EUで大規模プラットフォームを「ゲートキーパー」に指定し事前規制するデジタル市場法が発効。2023年から順次適用された。","detail":"自社サービスの優遇禁止やアプリストアの開放などを事前に義務付ける枠組みで、事後的な競争法執行の限界を補う狙いがある。2023年9月にAlphabet・Amazon・Apple・Metaなど6社がゲートキーパーに指定された。2008年のApp Storeに始まる閉じた流通モデルが直接の規制対象となり、日本も2024年に類似の法律を成立させた。","credibility":"verified","credibility_note":null,"sources":[{"title":"European Commission: The Digital Markets Act","url":"https://digital-markets-act.ec.europa.eu/"}]},{"date":"2024-06-12","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"日本でスマホソフトウェア競争促進法が成立","summary":"スマートフォンのOS・アプリストア等を対象に、公正取引委員会が事前規制を行う新法が国会で成立した。","detail":"EUのデジタル市場法を参照し、AppleとGoogleを主な対象として代替アプリストアの許容や自社優遇の禁止を定めた。2008年のApp Store以来続いてきた手数料や審査の裁量が、日本でも法律で制約されることになる。米国では同年8月にGoogleの検索独占が認定されており、日米欧で規制が同時期に収束した年である。","credibility":"unverified","credibility_note":"成立日は国会記録に基づくが、全面施行時期（2025年12月と発表）や指定事業者の範囲は施行後の運用で確定するため未確認とする。","sources":[{"title":"公正取引委員会 スマートフォンにおいて利用される特定ソフトウェアに係る競争の促進に関する法律","url":null}]},{"date":"2024-08-05","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"米連邦地裁がGoogleの検索独占を認定","summary":"ワシントンD.C.連邦地裁が、Googleが検索市場で違法に独占を維持したと判断。2020年提訴の司法省訴訟で原告側が勝訴した。","detail":"Appleへの巨額支払いによるデフォルト契約が独占維持の手段と認定された。2000年のAdWords以来の「検索と広告」の結合モデルが司法によって問い直された節目であり、是正措置の審理が続いた。同年6月に日本のスマホ新法が成立し、EUではDMAの執行が始まっており、GAFAの事業構造そのものが日米欧で同時に規制対象となった年として位置づけられる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United States v. Google LLC (2020)","url":"https://en.wikipedia.org/wiki/United_States_v._Google_LLC_(2020)"}]}]},{"slug":"business-japan-unicorns","title":"日本発ユニコーンの軌跡","description":"2010年代から2020年代の日本スタートアップを、企業と資金調達・制度と市場・技術とトレンドの3層で追う。評価額の報道と政策の動きを重ねると、ブームの背景が見えてくる。","category":"business","language":"ja","start_year":2010,"end_year":2024,"layers":[{"name":"企業と資金調達","color":"orange"},{"name":"制度と市場","color":"teal"},{"name":"技術とトレンド","color":"blue"}],"events":[{"date":"2010-01-01","precision":"year","end_date":"2015-12-31","type":"period","layer":"技術とトレンド","title":"スマートフォン普及期","summary":"総務省調査でスマートフォンの世帯保有率は2010年の約1割から2015年には7割超へ急伸した。","detail":"iPhoneのソフトバンク独占販売終了とAndroid端末の拡大を背景に、日本の生活者は数年で常時接続の端末を手にした。この普及が、2013年に創業するメルカリなど「スマホ前提」のサービスの土台となる。同時期の制度面では2013年の日本再興戦略が開業率目標を掲げており、需要側と政策側の条件が並行して整った。","credibility":"verified","credibility_note":null,"sources":[{"title":"総務省 通信利用動向調査","url":"https://www.soumu.go.jp/johotsusintokei/statistics/statistics05.html"}]},{"date":"2013-02-01","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"メルカリ創業（当時コウゾウ）","summary":"山田進太郎らが株式会社コウゾウを設立。同年7月にフリマアプリ「メルカリ」を公開し、スマホ完結の個人間取引を広げた。","detail":"創業年の日本はスマートフォン普及期の真っ只中にあり、写真を撮って出品するという操作がそのまま「スマホ前提」の設計に結びついた。同じ2013年6月には政府が日本再興戦略を閣議決定し、開業率の引き上げを掲げている。企業側の挑戦と政策側の号令が同じ年に始まった点は、後年の資金流入を読む上で重要である。","credibility":"verified","credibility_note":null,"sources":[{"title":"株式会社メルカリ 会社概要","url":"https://about.mercari.com/"},{"title":"Wikipedia: Mercari","url":"https://en.wikipedia.org/wiki/Mercari"}]},{"date":"2013-06-14","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"日本再興戦略を閣議決定","summary":"成長戦略として開業率10%台を目標に掲げ、ベンチャー支援や規制改革を成長政策の柱に据えた。","detail":"アベノミクス「三本の矢」の三本目にあたる成長戦略で、開業率・廃業率を米英並みの10%台にする目標が明記された。同年はメルカリ創業やスマホ普及の加速と重なり、政策と市場の機運が同期している。この目標自体は達成されず、開業率は5%前後にとどまったが、以降のJ-Startupや育成5か年計画に続く政策系譜の起点となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 日本再興戦略 -JAPAN is BACK-","url":"https://www.kantei.go.jp/jp/singi/keizaisaisei/pdf/saikou_jpn.pdf"}]},{"date":"2014-03-26","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"Preferred Networks 設立","summary":"西川徹・岡野原大輔らがPreferred Infrastructureから分社する形でPFNを設立。深層学習の産業応用に特化した。","detail":"研究者主導のスタートアップで、設立の翌2015年には自社の深層学習フレームワークChainerを公開する。学術発の技術と大企業の資本を結びつける方針は、2017年のトヨタからの大型出資に結実した。同時期の制度面では公的な支援策は限られており、事業会社との資本提携が国内AIスタートアップの主要な資金源になった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Preferred Networks 会社概要","url":"https://www.preferred.jp/ja/"},{"title":"Wikipedia: Preferred Networks","url":"https://en.wikipedia.org/wiki/Preferred_Networks"}]},{"date":"2015-06-01","precision":"month","end_date":null,"type":"point","layer":"技術とトレンド","title":"深層学習フレームワークChainer公開","summary":"PFNがChainerをオープンソースとして公開。国産の深層学習基盤として研究者や企業に広がった。","detail":"Define-by-Runと呼ばれる動的計算グラフの設計はのちのPyTorchにも影響を与えたとされる。2016年の囲碁AIの話題化とともに国内でもAIブームが加速し、AIを掲げるスタートアップへの投資が増えた。PFNは2019年12月にChainerの開発終了とPyTorchへの移行を発表しており、国産基盤の限界と国際標準化の流れを示す出来事でもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Chainer","url":"https://en.wikipedia.org/wiki/Chainer"}]},{"date":"2016-03-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"メルカリ、評価額1,000億円超と報道","summary":"メルカリが約84億円の資金調達を実施。企業評価額は1,000億円を超えたと報じられ、「日本初のユニコーン」と呼ばれた。","detail":"非上場のまま評価額10億ドル超に達したとされ、日本のスタートアップ資金調達が数十億円単位から百億円単位へ移る象徴となった。同年は制度面で大きな動きは少なく、民間の大型調達が先行した形である。ただし評価額は各社が公表した数値ではなく報道ベースであり、「日本初」の呼称もPFNなどとの比較で見解が分かれる。","credibility":"disputed","credibility_note":"評価額は非公表で報道による推計値。「日本初のユニコーン」の呼称もPFNとの比較で報道により見解が異なる。","sources":[{"title":"日本経済新聞 報道（2016年3月、メルカリの資金調達）","url":null},{"title":"Wikipedia: Mercari","url":"https://en.wikipedia.org/wiki/Mercari"}]},{"date":"2017-08-04","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"トヨタがPFNに105億円を追加出資","summary":"トヨタ自動車がPreferred Networksへ約105億円の追加出資を発表。事業会社による国内AI企業への大型投資となった。","detail":"自動運転やモビリティ分野での協業強化が目的とされ、国内では独立系VCよりも事業会社（CVC）が大型ラウンドを担う構図を象徴した。技術レイヤーではChainerの普及やAIブームが背景にあり、翌2018年には政府がJ-Startupを開始する。PFNはこの出資以降、企業評価額が国内最大級と報じられるようになった。","credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 ニュースリリース（2017年8月）","url":null},{"title":"Wikipedia: Preferred Networks","url":"https://en.wikipedia.org/wiki/Preferred_Networks"}]},{"date":"2018-06-11","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"経済産業省がJ-Startupを開始","summary":"経産省とJETRO等が有望スタートアップを選定し、官民で集中支援するJ-Startupプログラムを開始した。","detail":"初回選定92社にはメルカリやPFNが含まれ、政府がスタートアップを名指しで支援する初の枠組みとなった。開始から1週間後にはメルカリが東証マザーズに上場しており、政策と市場の節目が重なった月である。技術面ではこの年の秋にPayPayがサービスを開始し、キャッシュレス分野への注目も高まっていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"J-Startup 公式サイト","url":"https://www.j-startup.go.jp/"}]},{"date":"2018-06-19","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"メルカリが東証マザーズに上場","summary":"メルカリが東証マザーズに上場。初値は公開価格3,000円を大きく上回る5,000円で、時価総額は7,000億円規模と報じられた。","detail":"国内スタートアップとして異例の規模のIPOで、未上場段階で大型調達を重ねてから上場する米国型の経路が日本でも成立することを示した。同月にはJ-Startupが始動し、上場後の海外展開や暗号資産事業への挑戦も注目された。市場レイヤーでは2022年の東証再編で「グロース市場」が生まれるまで、マザーズが新興企業の主要な出口であった。","credibility":"verified","credibility_note":null,"sources":[{"title":"株式会社メルカリ IR情報","url":"https://about.mercari.com/"},{"title":"日本取引所グループ 新規上場会社情報","url":"https://www.jpx.co.jp/"}]},{"date":"2018-10-05","precision":"day","end_date":null,"type":"point","layer":"技術とトレンド","title":"PayPayがサービス開始","summary":"ソフトバンクとヤフーの合弁PayPayがQRコード決済を開始。12月の「100億円あげちゃうキャンペーン」で一気に認知を得た。","detail":"スマートフォンの普及を前提に、少額決済のデジタル化が加速した。翌2019年10月には政府のキャッシュレス・ポイント還元事業が始まり、民間の投資合戦と公的なインセンティブが同時に働く形でキャッシュレス比率が上昇する。決済データを起点とした金融サービスの拡張は、後のPaidyへの大型買収にも通じるトレンドである。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: PayPay","url":"https://en.wikipedia.org/wiki/PayPay"}]},{"date":"2019-10-01","precision":"day","end_date":"2020-06-30","type":"period","layer":"制度と市場","title":"キャッシュレス・ポイント還元事業","summary":"消費税率引き上げに合わせ、中小店舗でのキャッシュレス決済に最大5%を還元する国の事業が9か月間実施された。","detail":"PayPayをはじめとするコード決済各社の顧客獲得競争と時期が重なり、決済スタートアップの利用者数が急増した。事業終了直前の2020年春には新型コロナの緊急事態宣言が出され、非接触決済の需要がさらに高まる。政策・技術・社会情勢が同じ方向に働いた稀な期間である。","credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省 キャッシュレス・ポイント還元事業","url":"https://cashless.go.jp/"}]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"制度と市場","title":"オープンイノベーション促進税制の創設","summary":"事業会社がスタートアップへ一定額以上出資した場合に所得控除を認める税制が2020年度税制改正で創設された。","detail":"CVCによる出資を後押しする狙いで、トヨタとPFNのような事業会社主導の資金供給を制度面から支える意味を持った。同月には新型コロナの緊急事態宣言が発出され、対面事業のスタートアップは打撃を受ける一方、リモートワーク関連の需要が拡大した。制度の設計時と施行時で市場環境が大きく変わった例である。","credibility":"unverified","credibility_note":"2020年度税制改正で創設された点は確かだが、適用開始日や出資要件の細部は法令原文で未確認。","sources":[{"title":"経済産業省 オープンイノベーション促進税制","url":null}]},{"date":"2020-04-07","precision":"day","end_date":"2020-05-25","type":"period","layer":"技術とトレンド","title":"緊急事態宣言とリモートワークの急拡大","summary":"新型コロナで初の緊急事態宣言が発出。在宅勤務やオンライン化が急速に広がり、SaaSやEC関連の需要が伸びた。","detail":"労務のクラウド化を進めるSmartHRやオンライン診療、決済など非対面領域のスタートアップに追い風となり、翌2021年の大型調達につながった。ただし「DXの加速」がどこまで定着したかは業種により差があり、行動制限の解除後に需要が反転した分野もある。政策面では同月にオープンイノベーション促進税制が施行されていた。","credibility":"disputed","credibility_note":"宣言の期間は事実だが、スタートアップ需要への影響の大きさや持続性は業種や調査により評価が分かれる。","sources":[{"title":"内閣官房 新型コロナウイルス感染症対策","url":null}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"SmartHRが156億円を調達","summary":"クラウド労務ソフトのSmartHRがシリーズDで約156億円を調達。企業評価額は1,700億円超と報じられ、ユニコーン入りとされた。","detail":"コロナ禍でのリモートワーク拡大が労務のクラウド化需要を押し上げ、SaaS企業の評価額が国内でも急上昇した局面を象徴する。海外投資家が主導した点も特徴で、同年はSmartNewsやPaidyの大型案件も相次いだ。国内スタートアップの年間資金調達額はこの前後で過去最高水準に達したとされる。","credibility":"unverified","credibility_note":"調達額は同社発表だが、企業評価額は非公表で報道ベースの推計値。","sources":[{"title":"株式会社SmartHR プレスリリース（2021年6月）","url":"https://smarthr.co.jp/"}]},{"date":"2021-09-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"SmartNewsが評価額20億ドルと報道","summary":"ニュースアプリのSmartNewsが約2.3億ドルを調達し、企業評価額は20億ドルに達したと報じられた。","detail":"米国市場でのユーザー拡大が評価され、日米で事業を展開する国内発スタートアップの代表例となった。同月にはPayPalによるPaidy買収も発表され、2021年は国内スタートアップの評価額と資金調達額がともに高水準となった年として記録される。ただし評価額は同社が公式に確認した数値ではなく、報道と投資家筋の情報に基づく。","credibility":"unverified","credibility_note":"評価額は非公表で報道ベース。同社は調達額のみ公表している。","sources":[{"title":"Wikipedia: SmartNews","url":"https://en.wikipedia.org/wiki/SmartNews"}]},{"date":"2021-09-08","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"PayPalがPaidyを約3,000億円で買収","summary":"米PayPalが後払い決済のPaidyを約3,000億円で買収すると発表。国内スタートアップの大型M&Aとして注目された。","detail":"IPO以外の出口として海外大手による買収が成立し、投資家の回収手段が広がった意味を持つ。技術面ではPayPay以降のキャッシュレス化と、コロナ禍でのEC拡大が後払い決済の需要を押し上げていた。制度面では翌2022年の東証再編と育成5か年計画を控え、出口の多様化が政策課題として意識され始めた時期でもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"PayPal ニュースリリース（2021年9月8日）","url":null},{"title":"Wikipedia: Paidy","url":"https://en.wikipedia.org/wiki/Paidy"}]},{"date":"2022-04-04","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"東証がプライム・スタンダード・グロースへ再編","summary":"東京証券取引所が市場区分を再編し、マザーズはグロース市場へ移行。新興企業の上場市場が再定義された。","detail":"メルカリが上場したマザーズは「グロース市場」となり、上場維持基準に時価総額の要件が明確化された。同年11月には政府がスタートアップ育成5か年計画を決定し、投資額10兆円という数値目標を掲げる。市場側の制度と政策側の目標が同じ年に更新されたことで、小型IPOへの依存からの脱却が課題として共有された。","credibility":"verified","credibility_note":null,"sources":[{"title":"日本取引所グループ 市場区分の見直し","url":"https://www.jpx.co.jp/"}]},{"date":"2022-11-28","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"スタートアップ育成5か年計画を決定","summary":"政府が2027年度にスタートアップ投資額10兆円、ユニコーン100社創出などを掲げる5か年計画を決定した。","detail":"新しい資本主義実現会議で決定され、人材・資金・オープンイノベーションの3本柱で構成される。同じ2022年11月末には米国でChatGPTが公開され、翌年以降の生成AIスタートアップの勃興と政策支援が重なる。2013年の日本再興戦略から続く政策系譜の中で、初めて具体的なユニコーン数を目標に置いた計画である。","credibility":"verified","credibility_note":null,"sources":[{"title":"内閣官房 新しい資本主義実現本部","url":"https://www.cas.go.jp/jp/seisaku/atarashii_sihonsyugi/"}]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"技術とトレンド","title":"ChatGPT公開と生成AIブーム","summary":"OpenAIがChatGPTを公開。生成AIへの関心が世界的に高まり、日本でも基盤モデルや応用サービスの起業が相次いだ。","detail":"育成5か年計画の決定からわずか2日後の出来事で、政策の追い風と技術の転換点が同時に訪れた。国内では2023年以降に生成AI関連の資金調達が増え、2024年にはSakana AIが短期間でユニコーンと報じられる。技術レイヤーの起点としては2015年のChainer公開以来の大きな波であり、AIスタートアップの資金源が事業会社中心から海外VCへ広がる契機ともなった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ChatGPT","url":"https://en.wikipedia.org/wiki/ChatGPT"}]},{"date":"2024-09-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"Sakana AIが約300億円を調達","summary":"東京拠点のSakana AIがシリーズAで約300億円を調達。設立から約1年で評価額10億ドル超と報じられ、国内最速級のユニコーンとされた。","detail":"元Googleの研究者らが2023年に創業した企業で、ChatGPT以降の生成AIブームと育成5か年計画の追い風を受けた。海外VCと国内大手金融機関が共同で出資し、事業会社中心だった国内AI投資の構図が変わりつつあることを示す。ただし評価額は非公表で、報道により金額に幅があるため確定値ではない。","credibility":"disputed","credibility_note":"調達額は同社発表だが、企業評価額は非公表で報道により数値が異なる。","sources":[{"title":"Sakana AI 公式サイト","url":"https://sakana.ai/"},{"title":"Wikipedia: Sakana AI","url":"https://en.wikipedia.org/wiki/Sakana_AI"}]}]},{"slug":"business-toyota-production","title":"トヨタ生産方式の進化","description":"1930年代の豊田自動織機の自動車部から2020年代の半導体不足まで、トヨタ生産方式（TPS）を生産技術と現場・経営と危機・世界への波及の3層で辿る。危機のたびに現場の手法が磨かれた過程が見える。","category":"business","language":"ja","start_year":1933,"end_year":2022,"layers":[{"name":"生産技術と現場","color":"green"},{"name":"経営と危機","color":"orange"},{"name":"世界への波及","color":"teal"}],"events":[{"date":"1933-09-01","precision":"day","end_date":null,"type":"point","layer":"生産技術と現場","title":"豊田自動織機製作所に自動車部を設置","summary":"豊田喜一郎の主導で豊田自動織機製作所に自動車部が設けられ、国産乗用車の開発が始まった。","detail":"父・豊田佐吉が完成させた自動織機の事業を資金源に、喜一郎は欧米視察を経て自動車事業に踏み出した。糸が切れると機械が自ら止まる織機の思想は、のちに「自働化」としてトヨタ生産方式の二本柱の一つになる。1930年代は満州事変以降の統制経済へ向かう時期で、自動車製造事業法（1936年）が国産化を後押しした。","credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1937-08-28","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"トヨタ自動車工業を設立","summary":"自動車部が独立し、資本金1,200万円でトヨタ自動車工業株式会社が設立された。喜一郎が副社長として実務を率いた。","detail":"自動織機の利益に頼っていた自動車事業が独立採算の会社となり、翌年の挙母工場建設に向けて資本を集めた。1937年は日中戦争の開始と重なり、以後は軍需のトラック生産が中心となる。生産技術の面では喜一郎が「必要なものを、必要なときに、必要なだけ」という考えを掲げ始めた時期にあたる。","credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1938-11-03","precision":"day","end_date":null,"type":"point","layer":"生産技術と現場","title":"挙母工場完成と「ジャスト・イン・タイム」構想","summary":"愛知県挙母町に本社工場が完成。喜一郎が工程間の流れを重視した「ジャスト・イン・タイム」の考えを工場運営に持ち込んだとされる。","detail":"設立翌年に完成した挙母（現・豊田市）工場は、工程を流れ順に配置し中間在庫を減らす構想で設計されたと社史は伝える。ただし喜一郎がいつどのように「ジャスト・イン・タイム」という言葉を用いたかは一次資料が乏しく、後年の回想に依るところが大きい。戦時統制で構想の実現は遅れ、本格的な体系化は戦後の大野耐一を待つことになる。","credibility":"disputed","credibility_note":"工場完成日は社史で確認できるが、喜一郎による「ジャスト・イン・タイム」提唱の時期と表現は後年の回想に基づき諸説ある。","sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"},{"title":"Wikipedia: Kiichiro Toyoda","url":"https://en.wikipedia.org/wiki/Kiichiro_Toyoda"}]},{"date":"1950-04-01","precision":"month","end_date":"1950-06-30","type":"period","layer":"経営と危機","title":"経営危機と労働争議、喜一郎の退任","summary":"戦後の金融引き締めで資金繰りが悪化し、人員整理を巡る労働争議が発生。約2か月の争議の末、豊田喜一郎が社長を退いた。","detail":"銀行団の融資条件として販売会社の分離（トヨタ自動車販売）と人員整理が求められ、希望退職者は1,600人前後とされる。争議収束直後の6月に朝鮮戦争が始まり、米軍のトラック特需が会社を救った。この危機の教訓が「在庫を持たず、売れる分だけつくる」という生産方式の徹底と、以後の無借金経営志向につながった。","credibility":"disputed","credibility_note":"争議の期間と喜一郎退任は社史で確認できるが、退職者数は資料により1,500〜2,100人台と幅がある。","sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1953-01-01","precision":"year","end_date":null,"type":"point","layer":"生産技術と現場","title":"機械工場で「かんばん」方式を試行","summary":"大野耐一が米国のスーパーマーケットに着想を得た後工程引取り方式を機械工場で試み、かんばんによる指示が始まった。","detail":"客が必要な分だけ棚から取り、店が補充するスーパーマーケットの仕組みを工程間に適用したもので、大野は1956年に渡米して実際の店舗を見学している。1950年の危機で在庫の重さを痛感した経営側の意向と現場の工夫が結びついた形である。ただし開始年は社史や大野の著書で1953年頃と記されるものの、正確な時期には諸説ある。","credibility":"disputed","credibility_note":"かんばん方式の試行開始は1953年頃とされるが、大野の著書と社史で年の記述が一致せず、正確な開始時期は特定できない。","sources":[{"title":"Wikipedia: Toyota Production System","url":"https://en.wikipedia.org/wiki/Toyota_Production_System"},{"title":"大野耐一『トヨタ生産方式』ダイヤモンド社、1978年","url":null}]},{"date":"1957-10-31","precision":"day","end_date":null,"type":"point","layer":"世界への波及","title":"米国トヨタ自動車販売を設立","summary":"トヨタが米国ロサンゼルスに販売会社を設立し、乗用車クラウンで対米輸出を開始した。","detail":"初期のクラウンは高速走行に耐えられず一時撤退に近い状態となり、米国市場に合わせた製品開発の必要性を痛感させた。国内では同時期にかんばん方式が機械工場から広がりつつあり、輸出の失敗と現場改善が並行して進んでいた。1980年代のNUMMIや現地工場に至る海外展開の起点である。","credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1962-01-01","precision":"year","end_date":null,"type":"point","layer":"生産技術と現場","title":"かんばん方式を全社に展開","summary":"機械工場で始まったかんばん方式が組立や部品供給を含む全社へ広がり、生産方式の骨格が固まった。","detail":"1960年代前半は乗用車の量産体制づくりが進んだ時期で、1966年のカローラ発売に向けて工程を貫く仕組みが必要とされた。全社展開に伴い、外注先の部品メーカーへもかんばんが広がっていく。同時期の経営面では1965年にデミング賞を受賞しており、品質管理と生産方式が並行して整備された。","credibility":"unverified","credibility_note":"全社展開の年は社史で1962〜1963年頃と記されるが、何をもって「全社」とするかの定義が資料で一致しないため年を確定できない。","sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"経営と危機","title":"第一次オイルショック","summary":"第四次中東戦争を機に原油価格が急騰。高度成長が終わる中で、トヨタの低在庫・省資源の生産方式が注目を集めた。","detail":"国内の多くの企業が減産と在庫調整で赤字に陥る一方、トヨタは比較的早く収益を回復し、その要因として生産方式が語られるようになった。これを機に社外や海外からの見学が増え、大野が1978年に著書で体系を公表する流れにつながる。危機が生産技術の価値を経営の言葉に翻訳した転換点である。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1973 oil crisis","url":"https://en.wikipedia.org/wiki/1973_oil_crisis"},{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1978-05-01","precision":"month","end_date":null,"type":"point","layer":"生産技術と現場","title":"大野耐一『トヨタ生産方式』刊行","summary":"大野耐一がダイヤモンド社から『トヨタ生産方式―脱規模の経営をめざして』を刊行し、体系を初めて社外に公開した。","detail":"ジャスト・イン・タイムと自働化を二本柱とし、七つのムダや標準作業などの概念が本人の言葉で整理された。オイルショック後の関心の高まりを受けた出版で、英訳は1988年に刊行される。1980年代の米国での研究や1990年の『リーン生産方式が、世界の自動車産業をこう変える。』はこの本を重要な参照元とした。","credibility":"verified","credibility_note":null,"sources":[{"title":"大野耐一『トヨタ生産方式』ダイヤモンド社、1978年","url":null},{"title":"Wikipedia: Taiichi Ohno","url":"https://en.wikipedia.org/wiki/Taiichi_Ohno"}]},{"date":"1984-02-01","precision":"month","end_date":null,"type":"point","layer":"世界への波及","title":"GMとの合弁NUMMIを設立","summary":"トヨタとGMが米カリフォルニア州フリーモントに合弁会社NUMMIを設立。同年12月に生産を開始した。","detail":"閉鎖されていたGM工場を引き継ぎ、旧来の従業員を再雇用しながらトヨタ生産方式を導入した実験場となった。日米貿易摩擦の中で現地生産を迫られた経営判断と、TPSが米国の労使環境でも機能するかという検証が同時に進んだ。ここでの成果が1988年のケンタッキー工場と、GM側のリーン生産導入につながる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: NUMMI","url":"https://en.wikipedia.org/wiki/NUMMI"}]},{"date":"1988-05-01","precision":"month","end_date":null,"type":"point","layer":"世界への波及","title":"ケンタッキー工場（TMMK）が生産開始","summary":"トヨタ単独の米国工場としてケンタッキー州ジョージタウンでカムリの生産を開始した。","detail":"NUMMIで得た知見を基に、現地採用の従業員に対してトレーナーが「なぜそうするか」から教える方式が採られた。同年に大野の著書の英訳が刊行され、TPSの用語が英語圏に広がる。貿易摩擦への対応という経営課題と、現場手法の移植という生産技術の課題が同じ工場で扱われた点で象徴的である。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Toyota Motor Manufacturing Kentucky","url":"https://en.wikipedia.org/wiki/Toyota_Motor_Manufacturing_Kentucky"}]},{"date":"1990-01-01","precision":"year","end_date":null,"type":"point","layer":"世界への波及","title":"『The Machine That Changed the World』刊行","summary":"MITの国際自動車研究プログラムの成果として刊行され、トヨタの方式を「リーン生産」と名付けて世界に広めた。","detail":"ウォマック、ジョーンズ、ルースによる同書は、大量生産と対比してトヨタの手法を一般化した。NUMMIやTMMKで米国でも機能することが示された直後の出版で、自動車以外の製造業や医療、サービス業へ「リーン」の概念が波及する起点となった。日本ではバブル経済の末期にあたり、国内では生産方式よりも金融の話題が優勢だった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Machine That Changed the World (book)","url":"https://en.wikipedia.org/wiki/The_Machine_That_Changed_the_World_(book)"}]},{"date":"2001-04-01","precision":"month","end_date":null,"type":"point","layer":"生産技術と現場","title":"「トヨタウェイ2001」を策定","summary":"海外拠点の拡大を受け、「知恵と改善」「人間性尊重」を柱とする価値観をトヨタウェイ2001として文書化した。","detail":"1980年代以降の海外生産の広がりで、現場のOJTだけでは伝えきれない考え方を明文化する必要が生じた。生産方式の手法（かんばん等）と、それを支える価値観を分けて示した点が特徴である。同時期の経営面では海外販売の拡大が続き、2000年代後半の生産台数世界一と、その直後の品質問題の両方をこの拡大が準備した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Toyota Way","url":"https://en.wikipedia.org/wiki/The_Toyota_Way"}]},{"date":"2008-01-01","precision":"year","end_date":null,"type":"point","layer":"世界への波及","title":"世界販売台数でGMを上回る","summary":"2008年の世界販売台数でトヨタがGMを上回り、77年ぶりに首位が交代したと報じられた。","detail":"1957年の対米輸出の失敗から半世紀を経た到達点で、NUMMIやTMMKなど現地生産の積み重ねが背景にある。ただし同年秋にはリーマン・ショックが起き、翌2009年3月期にトヨタは戦後初の営業赤字を計上した。首位到達と赤字転落がほぼ同時に起きたことは、規模拡大と生産方式の関係を問い直す契機になった。","credibility":"unverified","credibility_note":"台数の集計基準（生産・販売、グループ会社の範囲）が発表主体により異なり、首位交代の年や差は資料で一致しない。","sources":[{"title":"トヨタ自動車 ニュースリリース（2009年1月）","url":null}]},{"date":"2009-05-08","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"2009年3月期に戦後初の営業赤字","summary":"リーマン・ショック後の需要急減で、トヨタは2009年3月期決算で約4,610億円の営業赤字を発表した。","detail":"前年に世界販売首位に立った直後の急転で、生産能力の拡大が固定費として重くのしかかった。生産方式の観点では、需要変動に合わせて生産量を柔軟に変える「平準化」の限界が議論となり、以後は生産能力の増強を抑える方針へ転じる。この決算発表は豊田章男が社長に就任する直前にあたる。","credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 2009年3月期 決算発表","url":null},{"title":"トヨタ自動車 有価証券報告書（2009年3月期）","url":null}]},{"date":"2010-02-24","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"大規模リコールと米下院公聴会","summary":"アクセルペダル等を巡る大規模リコールを受け、豊田章男社長が米下院の公聴会に出席し、品質問題について証言した。","detail":"2009年から2010年にかけて世界で数百万台規模のリコールが相次ぎ、急拡大した海外生産と品質保証の体制が問われた。公聴会で社長は「成長のスピードが人材育成を上回った」との趣旨を述べている。この危機を受け、生産方式の原点である「品質を工程でつくり込む」考えを再徹底する動きが社内で進み、2015年のTNGAにつながる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2009–2011 Toyota vehicle recalls","url":"https://en.wikipedia.org/wiki/2009%E2%80%932011_Toyota_vehicle_recalls"}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"東日本大震災でサプライチェーンが寸断","summary":"東北の部品・素材メーカーが被災して供給網が寸断され、国内外の工場が数か月にわたる減産を余儀なくされた。","detail":"低在庫のジャスト・イン・タイムが災害に弱いとの批判が起きた一方、トヨタは寸断の原因を特定の部品や素材の一極集中に求め、サプライチェーンの可視化に取り組んだ。同年はタイの洪水も重なり、部品供給網の情報を集めるデータベース整備が進む。この教訓は2020年代の半導体不足で一定の効果を発揮したとされる。","credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 ニュースリリース（2011年）","url":null},{"title":"Wikipedia: Toyota Production System","url":"https://en.wikipedia.org/wiki/Toyota_Production_System"}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"世界への波及","title":"『リーン・スタートアップ』刊行","summary":"エリック・リースが『The Lean Startup』を刊行。TPS由来のリーンの考え方をソフトウェアと起業の方法論に転用した。","detail":"小さくつくり検証を繰り返す手法は、TPSのムダ排除や「現地現物」の発想を参照したと著者が述べている。1990年の『The Machine That Changed the World』が製造業に広げた概念が、2010年代にはIT産業や公共部門にまで及んだ形である。同年の日本では東日本大震災でTPSの弱点が議論されており、原産地と応用先で評価が分かれた年でもある。","credibility":"unverified","credibility_note":"刊行時期は確かだが、TPSからの影響の程度は著者の言及に基づく評価であり、方法論の系譜として定説化しているとは言い切れない。","sources":[{"title":"Wikipedia: The Lean Startup","url":"https://en.wikipedia.org/wiki/The_Lean_Startup"}]},{"date":"2015-12-01","precision":"month","end_date":null,"type":"point","layer":"生産技術と現場","title":"TNGA採用の初の車種（4代目プリウス）発売","summary":"車両の基本骨格と生産ラインを共通化するTNGAを採用した最初の車種として4代目プリウスが発売された。","detail":"リコール問題後の「もっといいクルマづくり」の方針を受け、設計と生産を一体で見直す取り組みである。生産ラインの設備を低く簡素にし、生産量の増減に合わせて組み替えやすくする方向は、2009年の営業赤字で明らかになった固定費の重さへの応答でもある。世界の工場に順次展開され、2020年代の半導体不足下でも工程を柔軟に組み替える基盤となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Toyota New Global Architecture","url":"https://en.wikipedia.org/wiki/Toyota_New_Global_Architecture"}]},{"date":"2021-08-19","precision":"day","end_date":"2022-12-31","type":"period","layer":"経営と危機","title":"半導体不足による長期減産","summary":"トヨタが2021年9月の世界生産を計画比約4割減らすと発表。半導体と部品の不足による減産は2022年まで断続的に続いた。","detail":"新型コロナ後の需要回復と東南アジアの感染拡大が重なり、半導体を含む部品供給が滞った。2011年以降に整備したサプライチェーンの可視化により当初は他社より影響が小さかったとされるが、長期化には耐えきれず減産に至った。ジャスト・イン・タイムの適用範囲と、戦略的な在庫の持ち方が改めて議論される契機となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 ニュースリリース（2021年8月19日）","url":null},{"title":"Wikipedia: 2020–2023 global chip shortage","url":"https://en.wikipedia.org/wiki/2020%E2%80%932023_global_chip_shortage"}]}]},{"slug":"culture-cinema-100","title":"映画100年史","description":"1895年のリュミエール兄弟から2020年代の配信時代まで。撮影・上映の技術、作品と作家、産業と観客の3層を重ね、技術の節目がいかに表現と興行を作り替えてきたかを追う。","category":"culture","language":"ja","start_year":1895,"end_year":2023,"layers":[{"name":"技術","color":"blue"},{"name":"作品と作家","color":"pink"},{"name":"産業と観客","color":"gold"}],"events":[{"date":"1895-12-28","precision":"day","end_date":null,"type":"point","layer":"技術","title":"リュミエール兄弟、パリのグラン・カフェで有料上映","summary":"シネマトグラフによる有料公開上映。撮影・映写・複製を1台でこなす装置が「映画の誕生」の通説的な起点となった。","detail":"エジソンのキネトスコープ（1894年）は覗き箱で個人鑑賞だったのに対し、スクリーンに投影して複数人が同時に見る形式が興行の原型を作った。作品はまだ1分足らずの実写だが、観客が集まり料金を払う「産業と観客」のレイヤーがこの日から始まる。翌年には世界各地へ巡回興行が広がった。","credibility":"disputed","credibility_note":"「最初の映画上映」の定義は諸説あり、同年11月にベルリンでスクラダノフスキー兄弟が行った有料上映や、エジソン社の先行装置を起点とする見方がある。","sources":[{"title":"Institut Lumière (公式)","url":"https://www.institut-lumiere.org/"},{"title":"Wikipedia: Auguste and Louis Lumière","url":"https://en.wikipedia.org/wiki/Auguste_and_Louis_Lumi%C3%A8re"}]},{"date":"1902-09-01","precision":"month","end_date":null,"type":"point","layer":"作品と作家","title":"メリエス『月世界旅行』公開","summary":"舞台の手品師出身のメリエスが、セットと特殊効果で約14分の物語映画を作り、映画を「見世物」から「語り」へ導いた。","detail":"多重露光やストップ・トリックといった技術レイヤーの発明を、物語のために体系的に用いた最初期の作品。無許可の複製が米国で流通して収益を奪われた経緯は、産業レイヤーで著作権と配給の仕組みが未整備だったことを示す。着色版が近年再発見され、修復のうえ上映されている。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: A Trip to the Moon","url":"https://en.wikipedia.org/wiki/A_Trip_to_the_Moon"}]},{"date":"1912-09-10","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"日本活動写真株式会社（日活）設立","summary":"国内4社が合併して日活が誕生。製作・配給・興行を束ねる日本最初期の大手映画会社が生まれた。","detail":"欧米でも同時期にスタジオが形成されており、日本の映画産業が世界とほぼ同時に企業化したことを示す。技術レイヤーでは輸入映写機と国産フィルムの整備が進み、作品レイヤーでは弁士付きの上映が独自の受容文化を作っていた。以後、松竹（1920年）などの参入で競争構造が形作られる。","credibility":"verified","credibility_note":null,"sources":[{"title":"日活: 会社沿革（公式）","url":"https://www.nikkatsu.com/company/history.html"},{"title":"Wikipedia: 日活","url":"https://ja.wikipedia.org/wiki/%E6%97%A5%E6%B4%BB"}]},{"date":"1927-10-06","precision":"day","end_date":null,"type":"point","layer":"技術","title":"『ジャズ・シンガー』公開、トーキーの商業的成功","summary":"ワーナー・ブラザースのヴァイタフォン方式で同期音声を持つ長編が公開。数年でサイレントは主流から退いた。","detail":"音の導入は撮影所の防音化、俳優の声、音楽著作権と、技術・作品・産業のすべてを組み替えた。同じ年、産業レイヤーでは映画芸術科学アカデミーが設立され、業界の自己組織化が進む。日本では弁士文化のためトーキー化が数年遅れた。部分トーキーながら興行の成功が各社の設備投資を決定づけた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Jazz Singer","url":"https://en.wikipedia.org/wiki/The_Jazz_Singer"}]},{"date":"1930-01-01","precision":"year","end_date":"1948-05-03","type":"period","layer":"産業と観客","title":"ハリウッド・スタジオシステムの全盛期","summary":"大手5社が製作・配給・興行を垂直統合し、専属契約の俳優と監督で量産した時代。1948年の反トラスト判決で崩れ始める。","detail":"トーキー化に伴う設備投資が寡占を強め、大恐慌下でも週7,000万人以上が映画館に通った。作品レイヤーではジャンル映画とスターシステムが確立し、1934年の製作倫理規定（ヘイズ・コード）の厳格運用で表現の枠も産業側が決めた。技術レイヤーではテクニカラーが浸透していく。","credibility":"disputed","credibility_note":"始点と終点は論者により異なる（トーキー化の1927〜1929年を起点とする説、テレビ普及の1950年代までとする説など）。","sources":[{"title":"Wikipedia: Studio system","url":"https://en.wikipedia.org/wiki/Studio_system"}]},{"date":"1941-05-01","precision":"day","end_date":null,"type":"point","layer":"作品と作家","title":"オーソン・ウェルズ『市民ケーン』公開","summary":"パンフォーカス、非線形の語り、天井の見える構図。25歳の監督が撮影所の慣習を組み替え、後世の批評で最高作と繰り返し評された。","detail":"撮影監督グレッグ・トーランドの深い被写界深度は高感度フィルムと照明技術の進歩という技術レイヤーに支えられた。モデルとされた新聞王ハーストの妨害で興行は振るわず、産業レイヤーではスタジオが有力者の圧力に弱いことを露呈した。アカデミー賞は脚本賞のみの受賞に終わった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Citizen Kane","url":"https://en.wikipedia.org/wiki/Citizen_Kane"}]},{"date":"1948-05-03","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"米最高裁「パラマウント判決」、スタジオの劇場所有を違法と判断","summary":"製作会社による映画館チェーンの所有と抱き合わせ配給を反トラスト法違反と認定。垂直統合が解体へ向かった。","detail":"同時期にテレビが家庭に入り始め、観客動員は減少に転じる。スタジオは大作主義と技術的な差別化（ワイドスクリーン、立体）で対抗し、独立プロと監督の裁量が拡大した。2020年に同意判決が終了するまで、70年以上ハリウッドの産業構造を規定した。判決の翌年からスタジオは劇場部門の分離を進めた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United States v. Paramount Pictures, Inc.","url":"https://en.wikipedia.org/wiki/United_States_v._Paramount_Pictures,_Inc."}]},{"date":"1951-09-10","precision":"day","end_date":null,"type":"point","layer":"作品と作家","title":"黒澤明『羅生門』、ヴェネツィア国際映画祭で金獅子賞","summary":"前年公開の作品が最高賞を受賞し、日本映画が国際的に発見された。以後、溝口・小津らが欧州の映画祭で評価される。","detail":"国内では評価が割れた作品を海外の映画祭という制度が押し上げた例。産業レイヤーでは日本の映画館入場者数が急増期にあり、1950年代を通じて年10億人規模に達する。技術レイヤーでは宮川一夫が太陽に直接カメラを向ける撮影を試み、表現の常識を更新した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 羅生門 (1950年の映画)","url":"https://ja.wikipedia.org/wiki/%E7%BE%85%E7%94%9F%E9%96%80_(1950%E5%B9%B4%E3%81%AE%E6%98%A0%E7%94%BB)"}]},{"date":"1958-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と観客","title":"日本の映画館入場者数が約11億2,700万人でピーク","summary":"日本映画製作者連盟の統計で年間入場者数が過去最高を記録。翌年のテレビ普及本格化とともに急減に転じる。","detail":"作品レイヤーでは大手6社が週替わり2本立てで年500本以上を製作した黄金期。技術レイヤーではテレビ受像機が皇太子成婚（1959年）を機に普及し、家庭が「観客席」になっていく。1960年代を通じ入場者数は3分の1以下に落ち込み、撮影所システムの再編を促した。","credibility":"verified","credibility_note":null,"sources":[{"title":"日本映画製作者連盟: 過去データ一覧（入場人員）","url":"http://www.eiren.org/toukei/data.html"}]},{"date":"1959-05-01","precision":"month","end_date":"1968-05-31","type":"period","layer":"作品と作家","title":"ヌーヴェルヴァーグの時代","summary":"トリュフォー『大人は判ってくれない』のカンヌ受賞からゴダールらの活動を経て、1968年のカンヌ中止まで。作家主義が世界に広がった。","detail":"軽量カメラと高感度フィルム、同時録音機という技術レイヤーの進歩が、撮影所を出て街頭で撮る手法を可能にした。批評誌『カイエ・デュ・シネマ』出身の監督たちは「作家」という概念を定着させ、産業レイヤーではスタジオ外の低予算製作が興行として成立することを示した。","credibility":"disputed","credibility_note":"運動の始点・終点には諸説あり（1958年『美しきセルジュ』を起点、1960年代前半で終わるとする見方など）。本項は便宜的な区切り。","sources":[{"title":"Wikipedia: French New Wave","url":"https://en.wikipedia.org/wiki/French_New_Wave"}]},{"date":"1975-06-20","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"『ジョーズ』公開、ブロックバスター興行の原型に","summary":"全米400館超の同時公開とテレビCMの大量投下で夏興行を制し、公開規模とマーケティングの型を作った。","detail":"それまで大作は都市部の少数館から順次拡大するのが通例で、広域一斉公開は例外だった。作品レイヤーではスピルバーグら「映画学校世代」が主流に入り、技術レイヤーでは1977年の『スター・ウォーズ』がモーションコントロール撮影とドルビーステレオで続く。以後、夏と年末の大作商戦が産業のリズムになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Jaws (film)","url":"https://en.wikipedia.org/wiki/Jaws_(film)"}]},{"date":"1976-09-01","precision":"month","end_date":null,"type":"point","layer":"技術","title":"日本ビクターがVHS方式のビデオデッキを発売","summary":"家庭で映画を録画・再生できる時代へ。ベータマックスとの規格競争を経てVHSが標準となり、レンタルビデオ市場を生んだ。","detail":"産業レイヤーでは映画会社が当初は違法録画を恐れて訴訟を起こしたが（ベータマックス訴訟）、1980年代にはビデオ販売とレンタルが劇場興行を上回る収益源となった。作品レイヤーでは旧作や小規模作品が「棚」で発見される機会が生まれ、後の配信時代の視聴形態を先取りした。","credibility":"unverified","credibility_note":"発表は1976年9月、発売は同年10月とする資料もあり、月の特定は要確認。","sources":[{"title":"Wikipedia: VHS","url":"https://en.wikipedia.org/wiki/VHS"}]},{"date":"1995-11-22","precision":"day","end_date":null,"type":"point","layer":"技術","title":"『トイ・ストーリー』公開、全編CGによる初の長編","summary":"ピクサーがコンピュータ・グラフィックスだけで長編を完成させ、アニメーションと実写の双方に転換をもたらした。","detail":"1993年『ジュラシック・パーク』の恐竜が実写合成の壁を越えたのに続く節目。産業レイヤーではディズニーとの配給契約が長編CG映画の商業モデルを確立し、2000年代の手描きアニメ縮小につながる。作品レイヤーでは「デジタルの作家」という新しい職能が生まれた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Toy Story","url":"https://en.wikipedia.org/wiki/Toy_Story"}]},{"date":"1997-12-19","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"『タイタニック』公開、世界興行収入が初めて10億ドルを突破","summary":"製作費超過で不安視された大作が記録的なロングランとなり、世界同時マーケティングとリピート鑑賞の力を示した。","detail":"技術レイヤーではCGと大規模セットの併用が標準になり、作品レイヤーではメロドラマと災害映画の合体という古典的な語りが最新技術で再生された。同年、DVDが米国で発売され、家庭視聴の画質が上がる一方、映画館は「大画面でしか味わえない体験」を売る方向へ向かう。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Titanic (1997 film)","url":"https://en.wikipedia.org/wiki/Titanic_(1997_film)"},{"title":"Box Office Mojo: Titanic","url":null}]},{"date":"2005-01-01","precision":"year","end_date":"2014-12-31","type":"period","layer":"技術","title":"フィルム上映からデジタル上映への転換期","summary":"DCI規格の策定を起点に、主要国の映画館がフィルム映写機をデジタルプロジェクターへ置き換えた期間。","detail":"2009年『アバター』の3D興行がデジタル化の投資を一気に正当化し、2012年にはコダックが連邦破産法を申請した。産業レイヤーでは配給コストが激減する一方、小規模館の設備投資負担が問題化した。作品レイヤーではデジタルカメラでの撮影が標準となり、フィルムは一部作家の選択肢に退いた。","credibility":"unverified","credibility_note":"始点・終点は規格策定と主要国の移行完了時期から概略で置いたもので、国別の移行時期は大きく異なる。","sources":[{"title":"Wikipedia: Digital cinema","url":"https://en.wikipedia.org/wiki/Digital_cinema"}]},{"date":"2007-01-01","precision":"month","end_date":null,"type":"point","layer":"技術","title":"Netflixがストリーミング配信を開始","summary":"DVD郵送レンタルから始まった同社がオンライン視聴を導入。映画が「届く」から「呼び出す」ものへ変わる起点。","detail":"ブロードバンドの普及という技術基盤の上で、月額定額のライブラリという新しい消費形態が定着した。産業レイヤーでは劇場・ビデオ・テレビという公開順序（ウィンドウ）が揺らぎ、作品レイヤーでは2010年代半ばから配信会社の自社製作が映画祭と賞レースに参入していく。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Netflix","url":"https://en.wikipedia.org/wiki/Netflix"}]},{"date":"2009-12-18","precision":"day","end_date":null,"type":"point","layer":"技術","title":"『アバター』公開、3Dとデジタル上映を興行の主流に押し上げる","summary":"パフォーマンス・キャプチャと立体撮影を組み合わせた大作が世界興行収入の記録を更新し、3D上映の設備投資を加速させた。","detail":"1950年代の3Dブームがテレビ対策として短命に終わったのに対し、今回はデジタル上映への移行と結びついて劇場の設備を恒久的に変えた。産業レイヤーでは3D追加料金が興行収入を押し上げ、作品レイヤーではその後数年、大作の3D化が半ば義務のようになった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Avatar (2009 film)","url":"https://en.wikipedia.org/wiki/Avatar_(2009_film)"}]},{"date":"2020-02-09","precision":"day","end_date":null,"type":"point","layer":"作品と作家","title":"『パラサイト 半地下の家族』、非英語作品で初のアカデミー作品賞","summary":"ポン・ジュノ監督作が作品賞・監督賞など4部門を受賞。前年のカンヌ最高賞に続き、英語圏中心の評価軸が動いた。","detail":"韓国映画産業の1990年代以降の投資と映画振興策の成果が国際的な制度で認められた。技術・産業レイヤーでは字幕付き作品が配信で日常的に視聴される環境が受容の土壌を作っており、翌月にはパンデミックで世界の映画館が休業し、配信への移行が一気に進む。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Parasite (2019 film)","url":"https://en.wikipedia.org/wiki/Parasite_(2019_film)"}]},{"date":"2020-12-03","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"ワーナー、2021年全作品を劇場と配信で同日公開と発表","summary":"パンデミック下でHBO Maxとの同日公開を発表。劇場優先の公開順序（ウィンドウ）が大手スタジオによって公然と崩された。","detail":"映画館の休業と配信加入者の急増という産業レイヤーの変化が、技術レイヤーで整っていた配信基盤に一気に流れ込んだ。作家や劇場チェーンからの反発を受け、翌年には劇場独占期間を短縮した形で折り合いがついたが、45日ウィンドウなど新しい慣行が定着した。同年、日本では『劇場版「鬼滅の刃」無限列車編』が興行収入の国内記録を更新し、劇場体験の需要が消えていないことも示された。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: HBO Max (Warner Bros. day-and-date releases)","url":null},{"title":"Warner Bros. Discovery: プレスリリース (2020年12月3日)","url":null}]},{"date":"2023-07-21","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"『バービー』と『オッペンハイマー』が同日公開、劇場に観客が戻る","summary":"対照的な2作の同日公開が「バーベンハイマー」現象を生み、パンデミック後の劇場興行回復を象徴した。","detail":"SNS上の観客発の話題化がマーケティングを上回る効果を持った例で、技術レイヤーではIMAX70mmフィルム上映が話題になるなど、配信では代替できない体験が再評価された。同時期に全米で脚本家・俳優組合のストライキが起き、配信時代の報酬とAI利用をめぐる産業構造の再交渉が並行していた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Barbenheimer","url":"https://en.wikipedia.org/wiki/Barbenheimer"}]}]},{"slug":"culture-impressionism-to-street","title":"印象派からストリートアートへ","description":"1874年の第1回印象派展から2010年代のバンクシーまで。作品と運動、それを受け入れ値付けする制度と市場、表現を支えた技術と社会の3層を重ね、「前衛」が周縁から中心へ移る反復を追う。","category":"culture","language":"ja","start_year":1874,"end_year":2018,"layers":[{"name":"作品と運動","color":"pink"},{"name":"制度と市場","color":"gold"},{"name":"技術と社会","color":"teal"}],"events":[{"date":"1874-04-15","precision":"day","end_date":"1886-06-15","type":"period","layer":"制度と市場","title":"印象派展の時代（全8回の自主展）","summary":"1874年から1886年まで計8回開かれた自主展。サロンに代わる発表と販売の回路を画商デュラン=リュエルらと築いた。","detail":"官展一極の発表制度に対し、グループ展と画商が結びつく近代的な市場モデルが形成された時期。参加者は毎回入れ替わり、最終回の1886年展にはスーラの点描が登場し、運動の内部から次の様式が生まれた。同じ頃、写真の商業化と鉄道網の拡大が郊外での制作と流通を後押ししていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Impressionism (Exhibitions)","url":"https://en.wikipedia.org/wiki/Impressionism"},{"title":"National Gallery of Art: Paul Durand-Ruel and the Impressionists","url":null}]},{"date":"1874-04-15","precision":"day","end_date":null,"type":"point","layer":"作品と運動","title":"第1回印象派展、パリのナダール旧写真スタジオで開幕","summary":"モネ、ルノワール、ドガらの「画家・彫刻家・版画家等芸術家匿名協会」がサロンの外で自主展を開催。","detail":"官展サロンの審査に依存しない自主展。会場が写真家ナダールの旧スタジオだった点は象徴的で、写真という新技術が絵画の役割を問い直していた時期と重なる。批評家ルイ・ルロワがモネ《印象、日の出》を揶揄した記事が「印象派」の呼称の起源とされる。展覧会は約1か月続き、入場者は限られたが批評は活発だった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Musée d'Orsay: 1874 Inventing Impressionism (展覧会解説)","url":"https://www.musee-orsay.fr/en/whats-on/exhibitions/paris-1874-inventing-impressionism"},{"title":"Wikipedia: First Impressionist Exhibition","url":"https://en.wikipedia.org/wiki/First_Impressionist_Exhibition"}]},{"date":"1886-04-10","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"デュラン=リュエル、ニューヨークで大規模な印象派展を開催","summary":"画商ポール・デュラン=リュエルがアメリカ美術協会で約300点を展示。印象派の米国市場が開かれた。","detail":"パリで売れ残った在庫を抱えた画商が新大陸に活路を求めた。以後、米国の実業家コレクターが印象派の主要な買い手となり、20世紀の米国美術館コレクションの基礎を築く。同年パリでは最後の印象派展が開かれ、運動が制度化と拡散の段階に入ったことを示す。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Paul Durand-Ruel","url":"https://en.wikipedia.org/wiki/Paul_Durand-Ruel"}]},{"date":"1888-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と社会","title":"コダック、初のロールフィルム式カメラを発売","summary":"「あなたはボタンを押すだけ」。撮影の大衆化が始まり、絵画の「記録」としての役割はいっそう後退した。","detail":"ジョージ・イーストマンのコダック・カメラは現像・焼付をメーカーが代行する仕組みで、写真を専門家から一般へ解放した。画家たちは同時期にスナップ的な構図や瞬間の光へと関心を移し、写真と絵画の役割分担が明確になる。後年のグラフィティ記録やSNS拡散へ続く「誰もが記録者になる」流れの起点でもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kodak (History)","url":"https://en.wikipedia.org/wiki/Kodak"}]},{"date":"1913-02-17","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"アーモリー・ショー開幕、米国にヨーロッパ前衛が紹介される","summary":"ニューヨークの兵器庫で開かれた国際現代美術展。デュシャン《階段を降りる裸体No.2》が騒動を呼んだ。","detail":"印象派から後期印象派、キュビスムまでを一望させ、米国の批評と市場に前衛の受容を迫った。会場は軍の兵器庫という非美術館空間で、後のオルタナティブ・スペースの先例でもある。同年、ヨーロッパでは翌年の大戦を控え、未来派やロシア前衛が急進化していた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Armory Show","url":"https://en.wikipedia.org/wiki/Armory_Show"}]},{"date":"1917-04-01","precision":"month","end_date":null,"type":"point","layer":"作品と運動","title":"デュシャン《泉》、独立芸術家協会展への出品を拒否される","summary":"「R. Mutt」と署名した男性用小便器。既製品を作品とするレディメイドの概念が広まる契機となった。","detail":"「審査なし」を掲げた協会展が展示を拒んだことで、何が芸術かを決めるのは制度か作家かという問いが顕在化した。オリジナルは失われ、スティーグリッツの写真とレプリカで知られる。作者をエルザ・フォン・フライターク=ローリングホーフェンとする説もあり、帰属は現在も議論がある。","credibility":"disputed","credibility_note":"出品者がデュシャン本人か、エルザ・フォン・フライターク=ローリングホーフェンかについて研究者間で見解が分かれる。","sources":[{"title":"Wikipedia: Fountain (Duchamp)","url":"https://en.wikipedia.org/wiki/Fountain_(Duchamp)"},{"title":"Tate: Fountain 1917, replica 1964 (作品解説)","url":"https://www.tate.org.uk/art/artworks/duchamp-fountain-t07573"}]},{"date":"1929-11-07","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"ニューヨーク近代美術館（MoMA）開館","summary":"開館展は「セザンヌ、ゴーガン、スーラ、ファン・ゴッホ」。近代美術を収集・体系化する美術館が誕生した。","detail":"ウォール街大暴落の直後に開館。印象派以後の美術を「近代美術」として正典化し、収蔵と展示を通じて価値を定める制度が確立した。同時期、ドイツではバウハウスが機能主義を掲げ、モダニズムは制度と教育の両面から広がっていた。開館当初は貸しビルの数室から始まった。開館当初は貸しビルの数室から始まり、1939年に現在地へ移った。","credibility":"verified","credibility_note":null,"sources":[{"title":"MoMA: History (公式)","url":"https://www.moma.org/about/who-we-are/moma-history"},{"title":"Wikipedia: Museum of Modern Art","url":"https://en.wikipedia.org/wiki/Museum_of_Modern_Art"}]},{"date":"1937-07-19","precision":"day","end_date":null,"type":"point","layer":"技術と社会","title":"ナチス政権、ミュンヘンで「退廃芸術展」を開催","summary":"表現主義や抽象などを「退廃」として見せしめ展示。国家による美術の統制と没収が公然化した。","detail":"美術館から約1万6千点が押収され、一部は国外で売却・破棄された。多くの作家が亡命し、戦後の抽象表現主義がニューヨークで開花する遠因となる。作品と制度が政治に従属した極端な例で、同じ年パリ万博ではピカソ《ゲルニカ》がスペイン館に展示されていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Degenerate Art exhibition","url":"https://en.wikipedia.org/wiki/Degenerate_Art_exhibition"}]},{"date":"1947-01-01","precision":"year","end_date":null,"type":"point","layer":"作品と運動","title":"ポロック、床置きキャンバスへの「ドリップ」を本格化","summary":"絵具を垂らし飛ばすオールオーヴァーの画面。1949年の『ライフ』誌特集で大衆的にも知られる存在に。","detail":"工業用エナメル塗料と巨大なキャンバスという素材の変化が、身体の運動を画面に記録する手法を可能にした。冷戦下で抽象表現主義は「自由な米国美術」として国務省や美術館の海外展に組み込まれ、制度と政治が作品の評価を後押しした。","credibility":"disputed","credibility_note":"ドリップ技法の「開始年」は諸説あり、1936年のシケイロス工房での実験や1943年頃の試作を起点とする見方もある。","sources":[{"title":"MoMA: Jackson Pollock (作家解説)","url":"https://www.moma.org/artists/4675"},{"title":"Wikipedia: Jackson Pollock","url":"https://en.wikipedia.org/wiki/Jackson_Pollock"}]},{"date":"1962-07-09","precision":"day","end_date":null,"type":"point","layer":"作品と運動","title":"ウォーホル《キャンベル・スープ缶》をロサンゼルスで初展示","summary":"フェラス画廊で32点の缶詰を並べた初個展。大量生産品と広告のイメージが美術館の壁に入った。","detail":"スーパーマーケットの陳列を模した展示は、消費社会そのものを主題にした。同年、シルクスクリーンによる複製技法を採用し、作家の手仕事という価値観を揺さぶる。テレビと雑誌広告が家庭に浸透した時期と重なり、後のストリートアートが広告的手法を用いる伏線となる。","credibility":"verified","credibility_note":null,"sources":[{"title":"MoMA: Campbell's Soup Cans (作品解説)","url":"https://www.moma.org/collection/works/79809"},{"title":"Wikipedia: Campbell's Soup Cans","url":"https://en.wikipedia.org/wiki/Campbell%27s_Soup_Cans"}]},{"date":"1970-01-01","precision":"year","end_date":"1989-05-12","type":"period","layer":"技術と社会","title":"ニューヨーク地下鉄グラフィティの時代","summary":"車両全面のピースからワイルドスタイルまで様式が発達。1989年、MTAが「グラフィティのない地下鉄」を宣言し終息。","detail":"1970年代の財政危機と治安悪化を背景に、地下鉄は最大のキャンバスとなった。写真家マーサ・クーパーらの記録と、1983年の映画『ワイルド・スタイル』や写真集『Subway Art』が世界に様式を伝え、ヨーロッパや日本へ波及した。行政は洗浄と車両更新で対抗し、80年代後半に路上へと舞台が移る。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Graffiti in New York City","url":"https://en.wikipedia.org/wiki/Graffiti_in_New_York_City"},{"title":"Martha Cooper & Henry Chalfant『Subway Art』(1984)","url":null}]},{"date":"1971-07-21","precision":"day","end_date":null,"type":"point","layer":"技術と社会","title":"『ニューヨーク・タイムズ』が「TAKI 183」を報道","summary":"マンハッタン中に名前を書き残す少年を紹介した記事。地下鉄グラフィティが社会現象として認知される。","detail":"スプレー缶とマーカーという安価な道具、地下鉄という移動する画面が「タグ」の文化を生んだ。記事は模倣者を急増させ、都市財政危機下のニューヨークで行政との攻防が始まる。同じ1970年代初頭、美術界ではコンセプチュアル・アートが「もの」を離れつつあり、路上では逆に名前を可視化する欲望が噴出していた。","credibility":"disputed","credibility_note":"TAKI 183を「最初のグラフィティ・ライター」とする通説には異論があり、フィラデルフィアのCornbreadら先行例を挙げる見方がある。","sources":[{"title":"Wikipedia: TAKI 183","url":"https://en.wikipedia.org/wiki/TAKI_183"}]},{"date":"1973-10-18","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"スカル・コレクション競売、現代美術の投機時代を告げる","summary":"ロバートとエセルのスカル夫妻が所蔵50点をサザビー・パーク・バーネットで競売。落札額が購入価格を大きく上回った。","detail":"ラウシェンバーグ《Thaw》は約900ドルで購入された作品が8万5千ドルで落札され、作家が会場でコレクターに詰め寄った逸話が残る。存命作家の作品が短期間で値上がりする構図が可視化され、以後オークションが現代美術の価格形成の中心となる。作家への再販利益還元（追及権）の議論も高まった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Robert C. Scull","url":"https://en.wikipedia.org/wiki/Robert_C._Scull"}]},{"date":"1980-06-01","precision":"month","end_date":null,"type":"point","layer":"作品と運動","title":"「タイムズ・スクエア・ショー」開催","summary":"作家集団コラボが空きビルで開いた雑居展。バスキア、ヘリングら路上系の若手が美術界と接続した。","detail":"元マッサージ店の廃屋を会場に、グラフィティ、パンク、ポルノ地区の風景を取り込んだ展示は「最初のラディカルな80年代アートショー」と評された。同年ニューヨーク市は財政再建の途上にあり、空き家と低家賃が若手の実験を可能にしていた。数年後、同じ作家たちがソーホーの画廊と競売に吸収されていく。","credibility":"unverified","credibility_note":"開催期間の正確な日付と参加作家の全リストは資料により異同があり、本項は6月開催という概略のみ記載。","sources":[{"title":"Wikipedia: The Times Square Show","url":"https://en.wikipedia.org/wiki/The_Times_Square_Show"}]},{"date":"1987-03-30","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"ゴッホ《ひまわり》、約2,475万ポンドで落札","summary":"クリスティーズ・ロンドンで当時の美術品最高額を記録。落札者は安田火災海上保険で、日本マネーの本格参入を示す。","detail":"1874年に嘲笑された印象派・後期印象派が、一世紀後には最も高価な資産となった。プラザ合意後の円高と日本のバブル経済が価格を押し上げ、1990年には斎藤了英がゴッホ《医師ガシェの肖像》を8,250万ドルで落札する。制度と市場のレイヤーが作品評価を規定する時代の頂点。","credibility":"verified","credibility_note":null,"sources":[{"title":"SOMPO美術館: ゴッホ《ひまわり》(所蔵作品解説)","url":"https://www.sompo-museum.org/collections/sunflowers/"},{"title":"Wikipedia: Sunflowers (Van Gogh series)","url":"https://en.wikipedia.org/wiki/Sunflowers_(Van_Gogh_series)"}]},{"date":"2005-08-01","precision":"month","end_date":null,"type":"point","layer":"作品と運動","title":"バンクシー、ヨルダン川西岸の分離壁に9点の壁画","summary":"少女が風船で壁を越える図像など。壁面を政治的メッセージの媒体にし、匿名の作家像が国際的に知られる。","detail":"ステンシル技法は短時間で高精度の図像を残せる。パレスチナでの制作は、路上の表現が観光地化と報道を通じて拡散する初期の例で、写真がウェブで共有される時代の到来と一体だった。作家は匿名を保ち、公式サイトと代理人以外の「認証」がないため、帰属の確認は常に困難を伴う。","credibility":"unverified","credibility_note":"制作時期は報道と作家側の発表に基づく概略で、日付レベルの一次資料は確認できていない。","sources":[{"title":"Wikipedia: Banksy","url":"https://en.wikipedia.org/wiki/Banksy"}]},{"date":"2008-05-23","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"テート・モダン、外壁を舞台に「Street Art」展を開催","summary":"国立美術館の建物正面に6組の作家が巨大壁画を制作。ストリートアートが公的制度に正面から迎え入れられた。","detail":"同じ月、ロンドン・ウォータールーの地下道ではバンクシー主催の「カンズ・フェスティバル」が開かれ、公的制度と自主企画が並走した。地下鉄グラフィティが洗浄された20年前と比べ、行政と美術館の態度は反転した。以後、路上作品の切り出し販売や保護をめぐる法的議論が続く。","credibility":"verified","credibility_note":null,"sources":[{"title":"Tate: Street Art (2008年展覧会ページ)","url":"https://www.tate.org.uk/whats-on/tate-modern/street-art"}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"技術と社会","title":"Instagramがサービス開始","summary":"スマートフォンで撮影と共有が一体化。壁画は現地に行かなくても「消える前に」世界へ届く画像となった。","detail":"1888年のコダックが撮影を大衆化したように、Instagramは発表と流通を大衆化した。ストリートアートは制作直後に撮影・共有され、消去や上書きを前提とした表現が画像として残る。作家の匿名性とフォロワー数が価値の一部となり、美術館や画廊を経由しない評価回路が形成された。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2013-10-01","precision":"day","end_date":"2013-10-31","type":"period","layer":"作品と運動","title":"バンクシー「Better Out Than In」ニューヨーク滞在制作","summary":"10月の1か月間、毎日1点をニューヨーク市内に発表。作品の場所はウェブとSNSで公表され、市民が探し歩いた。","detail":"作品と技術と社会のレイヤーが同時に動いた例。発表はInstagramと専用サイト、鑑賞は市民のスマートフォン、市長は「器物損壊」と非難し、一部作品は数時間で上書きされた。セントラルパークで本人の作品を1点60ドルで無名販売する企画は、市場が値付けする「作家名」の機能を露わにした。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Better Out Than In","url":"https://en.wikipedia.org/wiki/Better_Out_Than_In"}]},{"date":"2018-10-05","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"サザビーズで落札直後、バンクシー《風船と少女》が自ら裁断","summary":"落札額約104万ポンドの直後、額縁内のシュレッダーが作動。半分裁断された作品は《愛はごみ箱の中に》と改題された。","detail":"市場批判のパフォーマンスが、結果として作品価値を高めるという逆説。2021年の再出品では約1,870万ポンドで落札された。1973年のスカル競売で作家が抗議した構図から半世紀、抗議そのものが商品化される段階に達した。実行の映像はSNSで拡散され、技術と社会のレイヤーが市場の出来事を即時に世界化した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Love is in the Bin","url":"https://en.wikipedia.org/wiki/Love_is_in_the_Bin"},{"title":"Sotheby's: Banksy, Love is in the Bin (2021年セール解説)","url":null}]}]},{"slug":"culture-jpop-streaming","title":"J-POPとストリーミングの30年","description":"1990年代のCDバブルから2020年代のグローバルヒットまで。ヒット作とアーティスト、流通と技術、産業と制度の3層を重ね、「売れる形」が円盤から再生回数へ移る過程を追う。","category":"culture","language":"ja","start_year":1988,"end_year":2024,"layers":[{"name":"作品とアーティスト","color":"pink"},{"name":"流通と技術","color":"blue"},{"name":"産業と制度","color":"gold"}],"events":[{"date":"1988-10-01","precision":"day","end_date":null,"type":"point","layer":"産業と制度","title":"J-WAVE開局、「J-POP」の呼称が広まる","summary":"東京のFM局J-WAVEが開局。洋楽中心の編成の中で流す邦楽を指す言葉として「J-POP」が使われ始めたとされる。","detail":"「歌謡曲」でも「ニューミュージック」でもない、洋楽と並べても違和感のない邦楽というカテゴリの誕生。放送局という制度側の命名がジャンル意識を作った例で、90年代のCDバブルとともにレコード店の棚区分やチャートの語彙として定着した。以後この語は業界の標準語彙になる。","credibility":"disputed","credibility_note":"呼称の起源はJ-WAVE開局前後の局内用語とする説が有力だが、命名者・時期には諸説あり一次資料で確定していない。","sources":[{"title":"Wikipedia: J-POP","url":"https://ja.wikipedia.org/wiki/J-POP"},{"title":"烏賀陽弘道『Jポップとは何か』岩波新書 (2005)","url":null}]},{"date":"1991-01-01","precision":"year","end_date":"1998-12-31","type":"period","layer":"産業と制度","title":"CDバブル：音楽ソフト生産額が右肩上がりの時代","summary":"ドラマ・CMタイアップとミリオンセラーが量産され、1998年に音楽ソフト生産金額が過去最高を記録するまで拡大が続いた。","detail":"8cmシングルとタイアップ、カラオケの普及が「知っている曲を買う」循環を生んだ。同時期の流通と技術レイヤーではCDが完全にレコードを置き換え、レンタル店網が全国に広がる。ピークの1998年に宇多田ヒカルがデビューし、翌年からは市場が縮小に転じる。","credibility":"verified","credibility_note":null,"sources":[{"title":"日本レコード協会: 音楽ソフト種類別生産金額推移","url":"https://www.riaj.or.jp/g/data/annual/ms_m.html"}]},{"date":"1992-05-27","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"米米CLUB「君がいるだけで」発売、ドラマ主題歌が大ヒット","summary":"ドラマ『素顔のままで』主題歌としてシングル約289万枚を売り上げ、タイアップ型ヒットの代表例となった。","detail":"テレビドラマの主題歌が毎週流れ、CDショップとレンタル店で回収されるという90年代型のヒット構造。同年、産業レイヤーではミリオンセラーが相次ぎ、シングル市場が拡大の局面に入る。作品はメディア露出とセットで設計される時代へ移った。翌年以降もタイアップ曲がミリオンを量産した。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 君がいるだけで","url":"https://ja.wikipedia.org/wiki/%E5%90%9B%E3%81%8C%E3%81%84%E3%82%8B%E3%81%A0%E3%81%91%E3%81%A7"}]},{"date":"1994-01-01","precision":"year","end_date":"1998-12-31","type":"period","layer":"作品とアーティスト","title":"小室哲哉プロデュース作品の全盛期","summary":"TRF、globe、安室奈美恵らのプロデュース作がチャート上位を占め、「小室サウンド」がJ-POPの音像を規定した。","detail":"シンセサイザーとダンスビートを軸にした制作は、デジタル機材の低価格化という技術レイヤーの変化を背景にしていた。プロデューサーの名前で売れる構造は、後のアイドル運営型や動画発のヒットと対照的な「作り手中心」のモデル。市場拡大期と重なり、CD売上のピークを支えた。","credibility":"disputed","credibility_note":"全盛期の始点・終点は論者により異なり、本項は主要ヒットの集中した1994〜1998年を便宜的に採用。","sources":[{"title":"Wikipedia: 小室哲哉","url":"https://ja.wikipedia.org/wiki/%E5%B0%8F%E5%AE%A4%E5%93%B2%E5%93%89"}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と制度","title":"音楽ソフト生産金額が約6,075億円で過去最高に","summary":"日本レコード協会統計で音楽ソフト生産金額がピーク。以後、CD市場は長期の縮小局面に入る。","detail":"同じ年、宇多田ヒカルがデビューし、翌年『First Love』が史上最多のアルバム売上を記録する。作品の頂点と市場の頂点が重なった転換点。技術レイヤーではMP3プレーヤーとCD-Rが普及し始め、「複製できる音楽」への移行が静かに始まっていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"日本レコード協会: 音楽ソフト種類別生産金額推移","url":"https://www.riaj.or.jp/g/data/annual/ms_m.html"}]},{"date":"1999-03-10","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"宇多田ヒカル『First Love』発売、日本史上最多売上アルバムに","summary":"デビューアルバムが累計約765万枚（オリコン）を記録。CD時代の到達点となる数字を残した。","detail":"R&Bを土台にした音作りと15歳でのデビューは、J-POPの語法を更新した。産業レイヤーでは前年に生産金額がピークを打っており、この記録は「上り坂の最後」ではなく「下り坂の始まり」に立った作品として位置づけられる。以後この枚数を超えるアルバムは現れていない。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: First Love (宇多田ヒカルのアルバム)","url":"https://ja.wikipedia.org/wiki/First_Love_(%E5%AE%87%E5%A4%9A%E7%94%B0%E3%83%92%E3%82%AB%E3%83%AB%E3%81%AE%E3%82%A2%E3%83%AB%E3%83%90%E3%83%A0)"}]},{"date":"2002-03-01","precision":"month","end_date":null,"type":"point","layer":"流通と技術","title":"エイベックス、国内初のコピーコントロールCDを発売","summary":"PCでの複製を防ぐCCCDを導入。再生互換性の問題で批判を受け、数年で各社が撤退した。","detail":"CD-Rとファイル交換ソフトによる複製への防衛策だったが、規格外ディスクの再生トラブルと音質への不満で利用者の反発を招いた。産業と制度レイヤーでは同時期に違法コピー対策の議論が本格化し、技術で流通を縛る路線から配信で稼ぐ路線への転換を促す反面教師となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: コピーコントロールCD","url":"https://ja.wikipedia.org/wiki/%E3%82%B3%E3%83%94%E3%83%BC%E3%82%B3%E3%83%B3%E3%83%88%E3%83%AD%E3%83%BC%E3%83%ABCD"}]},{"date":"2002-12-01","precision":"month","end_date":null,"type":"point","layer":"流通と技術","title":"auが「着うた」サービスを開始","summary":"携帯電話で楽曲の一部を着信音として購入する仕組み。日本独自の音楽配信市場が携帯電話上で立ち上がった。","detail":"PC向け配信が普及する前に、携帯キャリアの課金基盤を使った配信が先に成立した点が日本の特徴。2004年の「着うたフル」で1曲丸ごとの購入が可能になり、2000年代後半には有料配信売上の大半を占めた。産業レイヤーではCD縮小を配信が一部補う構図が生まれる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 着うた","url":"https://ja.wikipedia.org/wiki/%E7%9D%80%E3%81%86%E3%81%9F"}]},{"date":"2002-12-01","precision":"month","end_date":"2016-12-31","type":"period","layer":"流通と技術","title":"着うた時代：携帯電話が音楽配信の主戦場","summary":"着うた・着うたフルが有料配信の中心を占めた期間。スマートフォン普及とともに縮小し、2010年代半ばに役割を終えた。","detail":"ガラケーの課金基盤とキャリア主導の流通が、iTunesのようなPC中心のモデルとは別の道を作った。作品レイヤーでは「サビが着うたで売れる曲」が意識され、産業レイヤーでは配信売上が2008〜2009年頃に一度ピークを迎える。iPhone以降、主導権はアプリ事業者へ移った。","credibility":"unverified","credibility_note":"終期は主要キャリアのサービス終了時期から概略で置いており、正確な終了日は事業者・サービス名により異なる。","sources":[{"title":"Wikipedia: 着うた","url":"https://ja.wikipedia.org/wiki/%E7%9D%80%E3%81%86%E3%81%9F"},{"title":"日本レコード協会: 有料音楽配信売上実績","url":"https://www.riaj.or.jp/g/data/annual/dg_m.html"}]},{"date":"2005-01-01","precision":"day","end_date":null,"type":"point","layer":"産業と制度","title":"改正著作権法施行、「還流防止措置（レコード輸入権）」導入","summary":"海外向けに安価に製造された邦楽CDの逆輸入を止める規定が施行。国内価格維持のための制度的措置。","detail":"アジア市場向けの廉価盤が日本に還流するのを防ぐ狙いで、洋楽輸入盤への影響を懸念する反対運動も起きた。再販売価格維持制度と並び、CDの価格を守る制度が整備された時期だが、同年8月にはiTunes Music Storeが日本で開始し、流通と技術レイヤーは価格統制の外側で動き始めていた。","credibility":"verified","credibility_note":null,"sources":[{"title":"文化庁: 著作権法の一部を改正する法律（平成16年法律第92号）概要","url":null},{"title":"Wikipedia: 音楽レコードの還流防止措置","url":null}]},{"date":"2007-08-31","precision":"day","end_date":null,"type":"point","layer":"流通と技術","title":"歌声合成ソフト「初音ミク」発売","summary":"クリプトン・フューチャー・メディアがVOCALOID製品を発売。ニコニコ動画を舞台に個人制作の楽曲文化が広がった。","detail":"前年に始まったニコニコ動画と組み合わさり、レーベルを経由せず楽曲が公開・評価される回路が生まれた。ここから出た作り手が2010年代後半以降のヒットを担う。産業レイヤーではCD売上減が続く中、作品レイヤーの「発表の場」が先に変わった例。当初の想定を超える売れ行きで、関連楽曲の投稿が急増した。","credibility":"verified","credibility_note":null,"sources":[{"title":"クリプトン・フューチャー・メディア: 初音ミク公式サイト","url":"https://ec.crypton.co.jp/pages/prod/virtualsinger/cv01"},{"title":"Wikipedia: 初音ミク","url":"https://ja.wikipedia.org/wiki/%E5%88%9D%E9%9F%B3%E3%83%9F%E3%82%AF"}]},{"date":"2010-10-27","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"AKB48「Beginner」発売、初週ミリオンを記録","summary":"オリコン週間で初週100万枚超。特典付きCDの大量購入を前提とした販売手法がシングル市場を支えた。","detail":"握手券や投票券を同梱する手法は、CDを「音楽を聴くための媒体」から「体験と権利のチケット」へと変えた。産業レイヤーではシングルの枚数が回復して見える一方、実際の聴取は配信と動画へ移っており、指標としてのCD売上と実態の乖離が広がった時期。一方で音楽性の評価とは別の議論も呼んだ。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Beginner (AKB48の曲)","url":"https://ja.wikipedia.org/wiki/Beginner_(AKB48%E3%81%AE%E6%9B%B2)"}]},{"date":"2012-10-01","precision":"day","end_date":null,"type":"point","layer":"産業と制度","title":"改正著作権法施行、違法ダウンロードに刑事罰","summary":"違法にアップロードされた音楽・映像と知りつつダウンロードする行為に刑事罰が導入された。","detail":"業界団体の要望を受けた立法で、CD・配信の縮小を違法流通の問題として捉える発想に立つ。だが同時期の技術レイヤーではYouTubeとスマートフォンが標準になり、翌年以降のストリーミング解禁で「無料で聴ける合法の場」を作る方向へ産業の戦略が転換していく。","credibility":"verified","credibility_note":null,"sources":[{"title":"文化庁: 平成24年通常国会 著作権法改正について","url":"https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/h24_hokaisei/"}]},{"date":"2015-05-27","precision":"day","end_date":null,"type":"point","layer":"流通と技術","title":"AWA・LINE MUSICが開始、国内で定額制配信が本格化","summary":"AWA（5月27日）、LINE MUSIC（6月11日）が相次いで開始し、同年7月にはApple Musicも日本で開始した。","detail":"定額聴き放題が国内でも選択肢になった年。当初は主要邦楽アーティストの楽曲が揃わず、産業レイヤーではCD売上と配信収益のバランスをめぐりレーベル各社の判断が分かれた。作品レイヤーでは以後、再生回数がヒットの指標として意識され始める。月額1,000円前後という価格帯もここで定まった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: AWA (音楽配信サービス)","url":null},{"title":"Wikipedia: LINE MUSIC","url":"https://ja.wikipedia.org/wiki/LINE_MUSIC"}]},{"date":"2016-09-29","precision":"day","end_date":null,"type":"point","layer":"流通と技術","title":"Spotifyが日本でサービス開始","summary":"世界最大手の定額制配信が日本に上陸。無料プランを含むフリーミアムモデルが国内でも提供された。","detail":"欧米より約8年遅れの参入。無料プランの是非をめぐり産業レイヤーで議論があったが、以後数年で主要レーベルの楽曲提供が進む。作品レイヤーでは2018年の「Lemon」以降、配信起点のロングヒットが標準となり、CD初動偏重のチャートから複合指標へ移る動きを後押しした。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Spotify","url":"https://ja.wikipedia.org/wiki/Spotify"}]},{"date":"2018-03-14","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"米津玄師「Lemon」発売、配信時代のロングヒットの原型に","summary":"ドラマ主題歌として発売され、Billboard JAPAN Hot 100で2018年・2019年の年間1位を連続で獲得した。","detail":"ボーカロイド出身の作り手が、テレビ主題歌という90年代型タイアップと動画・配信という2010年代型の流通を両立させた作品。CD初週ではなく数年単位の累積で評価される「ロングヒット」の代表例で、産業レイヤーではストリーミング認定制度導入の動機となる状況を作った。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Lemon (米津玄師の曲)","url":"https://ja.wikipedia.org/wiki/Lemon_(%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB%E3%81%AE%E6%9B%B2)"},{"title":"Billboard JAPAN: 年間チャート","url":null}]},{"date":"2019-12-15","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"YOASOBI「夜に駆ける」配信開始、翌年の年間チャート1位に","summary":"小説を原作にした楽曲。CDを出さない配信専門のデビューで、Billboard JAPAN Hot 100の2020年年間1位を獲得した。","detail":"ボーカロイド出身の作曲者による、動画とストリーミングだけで到達したヒット。CDが売上指標から外れても頂点に立てることを示し、産業レイヤーの2020年ストリーミング認定制度導入と歩調が合う。作品の作られ方（原作小説）と届き方（配信）の両方が新しかった。CDを介さないデビュー曲としては異例の到達点だった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 夜に駆ける","url":"https://ja.wikipedia.org/wiki/%E5%A4%9C%E3%81%AB%E9%A7%86%E3%81%91%E3%82%8B"}]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"産業と制度","title":"日本レコード協会がストリーミング認定制度を開始","summary":"累計再生回数に基づくゴールド（5,000万回）などの認定を導入。「売上枚数」に代わる公式の指標が生まれた。","detail":"業界団体がCD枚数と並ぶ評価軸として再生回数を公認した転換点。同年、有料音楽配信売上に占めるストリーミングの割合が大半を占め、コロナ禍でライブ収入が途絶える中、配信が産業の中心であることが数字でも明確になった。","credibility":"unverified","credibility_note":"認定基準の閾値と開始月は協会発表に基づくが、初回認定の対象作品や制度の細部は要確認。","sources":[{"title":"日本レコード協会: ストリーミング認定","url":"https://www.riaj.or.jp/f/data/cert/streaming.html"}]},{"date":"2023-04-12","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"YOASOBI「アイドル」、日本語曲初のBillboard世界チャート1位","summary":"アニメ主題歌として配信され、同年6月にBillboard Global Excl. U.S.で日本語楽曲として初めて1位を獲得した。","detail":"アニメという映像コンテンツの世界流通と、国境のない配信プラットフォームが結びついた結果。CD時代には物理流通の制約で困難だった海外チャート上位が、流通と技術レイヤーの変化で現実になった。翌年にはCreepy Nuts「Bling-Bang-Bang-Born」も同チャート1位を獲得し、単発ではない流れになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: アイドル (YOASOBIの曲)","url":"https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%A4%E3%83%89%E3%83%AB_(YOASOBI%E3%81%AE%E6%9B%B2)"},{"title":"Billboard: Global Excl. U.S. chart","url":null}]},{"date":"2024-01-07","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"Creepy Nuts「Bling-Bang-Bang-Born」世界1位","summary":"アニメ主題歌として配信され、ダンス動画の拡散を経てBillboard Global Excl. U.S.で1位を記録した。","detail":"TikTokなどショート動画での二次創作が再生回数を押し上げる回路が定着した例。作品はアニメと一体で届き、流通と技術レイヤーではプラットフォームのアルゴリズムがヒットの経路になった。30年前のドラマ主題歌タイアップと構造は似ているが、媒体がテレビから動画アプリへ、指標が枚数から再生回数へ置き換わった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bling-Bang-Bang-Born","url":"https://ja.wikipedia.org/wiki/Bling-Bang-Bang-Born"}]}]},{"slug":"history-bakumatsu-meiji","title":"幕末から明治維新まで","description":"黒船来航から西南戦争まで、幕府と諸藩の権力の動き、思想と人物のうねり、列強との外交を三層で重ねる。同じ月に京都と下関と横浜で何が起きていたかを並べて読む年表。","category":"history-politics","language":"ja","start_year":1853,"end_year":1877,"layers":[{"name":"幕府と諸藩","color":"purple"},{"name":"思想と人物","color":"pink"},{"name":"外交と世界","color":"green"}],"events":[{"date":"1853-07-08","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"ペリー艦隊、浦賀に来航","summary":"米国東インド艦隊の蒸気船を含む4隻が浦賀沖に現れ、開国を求める大統領親書を幕府に渡した。","detail":"旧暦では嘉永6年6月3日。米国は太平洋航路と捕鯨船の補給地を求めており、清のアヘン戦争敗北を知る幕府にとって列強の軍事力は現実の脅威だった。老中阿部正弘は親書を諸大名に示して意見を求め、幕府の専決という慣行が崩れる。ここから「幕府と諸藩」レイヤーの権力構造の変化と、「思想と人物」レイヤーの尊王攘夷論が同時に動き出す。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 黒船来航","url":"https://ja.wikipedia.org/wiki/黒船来航"}]},{"date":"1858-07-29","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"日米修好通商条約に調印、勅許を得ず","summary":"大老井伊直弼のもと、天皇の許可を得ないまま調印。領事裁判権と関税自主権の欠如を含む内容だった。","detail":"旧暦安政5年6月19日。ハリスは英仏が清との戦争(アロー戦争)を終えて日本に向かうと説き、調印を急がせた。同年中に蘭露英仏とも同様の条約を結ぶ(安政五カ国条約)。無勅許調印は朝廷と諸藩の反発を招き、幕府レイヤーでは安政の大獄、思想レイヤーでは攘夷論の激化として跳ね返る。不平等条項の改正は明治政府の長年の課題となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 日米修好通商条約","url":"https://ja.wikipedia.org/wiki/日米修好通商条約"}]},{"date":"1859-11-21","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"安政の大獄で吉田松陰が処刑される","summary":"幕政批判者を弾圧した安政の大獄で、松下村塾を主宰した吉田松陰が江戸で刑死。享年30。","detail":"旧暦安政6年10月27日。大獄は前年の無勅許調印(外交レイヤー)と将軍継嗣問題への批判を封じるため、井伊直弼が主導した。松陰の門下からは高杉晋作、久坂玄瑞、伊藤博文、山県有朋らが出ており、処刑は長州藩の若手を過激化させる転機となった。弾圧の反動は翌年の桜田門外の変(幕府レイヤー)として現れる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 安政の大獄","url":"https://ja.wikipedia.org/wiki/安政の大獄"},{"title":"Wikipedia（日本語版）: 吉田松陰","url":"https://ja.wikipedia.org/wiki/吉田松陰"}]},{"date":"1860-03-24","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"桜田門外の変、大老井伊直弼が暗殺される","summary":"水戸藩脱藩者らが江戸城桜田門外で井伊直弼を襲撃。幕府の最高権力者が白昼に討たれた。","detail":"旧暦安政7年3月3日、雪の朝の出来事。前年の安政の大獄(思想レイヤー)への報復であり、幕府の権威は決定的に傷ついた。以後幕府は朝廷との融和(公武合体)に舵を切り、和宮降嫁へ向かう。同じ年、外交レイヤーでは条約批准のため遣米使節が渡米し、咸臨丸が太平洋を横断していた。弾圧と開国が同時に進む幕府の二面性が表れている。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 桜田門外の変","url":"https://ja.wikipedia.org/wiki/桜田門外の変"}]},{"date":"1862-09-14","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"生麦事件、薩摩藩士が英国人を殺傷","summary":"島津久光の行列を横切った英国人を薩摩藩士が斬り、1名死亡。翌年の薩英戦争の引き金となった。","detail":"旧暦文久2年8月21日。英国は幕府と薩摩に賠償と犯人処罰を要求し、翌1863年8月に鹿児島を砲撃した(薩英戦争)。薩摩は城下を焼かれたが英国側にも損害を与え、以後両者は接近し、薩摩は英国から軍艦や技術を得る。攘夷の実行が結果的に開国派を生んだ逆説であり、思想レイヤーの薩長同盟や、幕府レイヤーの倒幕への布石となる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 生麦事件","url":"https://ja.wikipedia.org/wiki/生麦事件"},{"title":"Wikipedia（日本語版）: 薩英戦争","url":"https://ja.wikipedia.org/wiki/薩英戦争"}]},{"date":"1864-08-20","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"禁門の変、長州藩が御所で敗れる","summary":"前年の政変で京都を追われた長州藩が挙兵し、会津・薩摩藩兵と御所周辺で交戦して敗退した。","detail":"旧暦元治元年7月19日。1863年の八月十八日の政変で長州は京都から排除されており、その巻き返しだった。御所に発砲した長州は「朝敵」となり、幕府は第一次長州征討を発令する。同じ月、外交レイヤーでは英仏米蘭の四国艦隊が下関を砲撃しており、長州は国内と国外の敵に同時に直面していた。京都の市街は戦火で広範囲が焼失
