ナビの部品が見つかった形です。\n\n2005年にはモーザー夫妻が、格子状の座標系を作るグリッド細胞を発見し、3人は2014年のノーベル賞を受賞しました。H.M.の症例(医療と社会レイヤー)が示した海馬と記憶の深い関係に、細胞レベルの説明を与えていく系譜の起点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Place cell","url":"https://en.wikipedia.org/wiki/Place_cell"}]},{"date":"1973-01-01","precision":"year","end_date":null,"type":"point","layer":"脳の理解","title":"長期増強(LTP)の発見","summary":"ブリスとレモが、ウサギの海馬で、シナプスの伝達効率が刺激の後に長時間強まったままになる現象を報告し、長期増強(LTP)と名付けました。よく通る道が踏み固められて歩きやすくなるように、使われたつなぎ目は強くなるのです。\n\n「記憶はシナプスの強さの変化として蓄えられる」という1949年のヘッブの仮説に、初めて具体的な生理現象を対応づけた発見でした。記憶の分子機構の研究はこの現象を軸に展開し、後の認知症治療の研究(医療と社会レイヤー)にも基礎を提供しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Long-term potentiation","url":"https://en.wikipedia.org/wiki/Long-term_potentiation"}]},{"date":"1990-01-01","precision":"year","end_date":null,"type":"point","layer":"計測と操作の技術","title":"fMRIの原理となるBOLD信号を発見","summary":"米ベル研究所の小川誠二が、血液中の酸素量の変化がMRI信号に影響する現象(BOLD効果)を報告しました。神経活動に伴う血流の変化を、造影剤なしで画像にできることを意味する発見です。\n\n数年のうちに機能的MRI(fMRI)として実用化され、健常な人間の脳活動を傷つけずに見る研究が爆発的に広がりました。心を画像で語る時代の幕開けです。ただし血流は、煙突の煙から火の勢いを推し量るような間接的な指標であることも、くり返し指摘されてきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Functional magnetic resonance imaging","url":"https://en.wikipedia.org/wiki/Functional_magnetic_resonance_imaging"}]},{"date":"1990-01-01","precision":"year","end_date":"1999-12-31","type":"period","layer":"医療と社会","title":"米国「脳の10年」","summary":"米国が1990年代を「脳の10年」と定め、大統領布告のもとで脳研究の振興と社会への普及を図りました。脳研究に国の看板が掛かった、最初の例です。\n\n神経科学の学会規模と研究費はこの時期に大きく育ち、fMRI(計測と操作の技術レイヤー)の普及とも重なって、健常者の心を扱う認知神経科学が確立しました。国家主導の大型脳科学という路線は、2013年の米欧のプロジェクトへ引き継がれていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Decade of the Brain","url":"https://en.wikipedia.org/wiki/Decade_of_the_Brain"}]},{"date":"2005-08-01","precision":"month","end_date":null,"type":"point","layer":"計測と操作の技術","title":"💡 光遺伝学、神経活動を光で操作","summary":"ボイデンとダイセロスらが、藻類由来の光感受性タンパク質を神経細胞に発現させ、光を当てるだけで特定の細胞の活動をミリ秒単位で制御する手法を報告しました。いわば神経細胞にリモコンのスイッチを取り付ける技術、光遺伝学の実質的な誕生です。\n\n「観察する」から、**狙った回路を操作して因果を確かめる**への転換をもたらし、神経科学の標準手法として一気に広まりました。特定の記憶を人工的に呼び起こす実験など、かつては思考実験だった研究を現実のものにしています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Optogenetics","url":"https://en.wikipedia.org/wiki/Optogenetics"}]},{"date":"2013-04-02","precision":"day","end_date":null,"type":"point","layer":"医療と社会","title":"米BRAINイニシアチブ発表","summary":"オバマ大統領が、脳の神経回路の活動を大規模に記録・解読する技術開発を掲げる研究計画、BRAINイニシアチブを発表しました。ヒトゲノム計画に続く、国家主導の大型生命科学と位置づけられています。\n\n「脳の10年」(1990年代)から続く投資の系譜にありますが、疾患の解明そのものより計測技術の開発を主眼に据えた設計が特徴です。望遠鏡が天文学を変えたように、まず道具から。光遺伝学(計測と操作の技術レイヤー)以後の時代を映した計画といえます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: BRAIN Initiative","url":"https://en.wikipedia.org/wiki/BRAIN_Initiative"}]},{"date":"2013-10-01","precision":"month","end_date":null,"type":"point","layer":"医療と社会","title":"ヒューマン・ブレイン・プロジェクト始動","summary":"EUの旗艦プロジェクトとして、ヒューマン・ブレイン・プロジェクト(HBP)が始動しました。提唱者マークラムは10年でヒトの脳全体をスーパーコンピュータ上に再現すると訴え、約10億ユーロ規模の予算が組まれています。\n\nしかし「10年で脳のシミュレーション」という看板は、掲げるには大きすぎたのかもしれません。実現性への疑問から、発足翌年には数百人の研究者が公開書簡で抗議し、運営は再編されました。2023年の終了までに研究基盤は残りましたが、当初の看板は実現しませんでした。","detail":null,"credibility":"unverified","credibility_note":"「10年でヒト脳全体をシミュレーションする」という当初目標は科学的な裏づけが確立しておらず、実現しないまま計画は再編・終了しました。","sources":[{"title":"Wikipedia: Human Brain Project","url":"https://en.wikipedia.org/wiki/Human_Brain_Project"}]},{"date":"2021-06-07","precision":"day","end_date":null,"type":"point","layer":"医療と社会","title":"アルツハイマー新薬アデュカヌマブ承認","summary":"米FDAが、脳内のアミロイドβを取り除く抗体薬アデュカヌマブを、約20年ぶりのアルツハイマー病新薬として迅速承認しました。原因物質とされるタンパク質を、いわば直接掃除しにいく発想の、初めての承認薬です。\n\nしかし臨床的な有効性の証拠は不十分だとして、諮問委員会はほぼ全会一致で承認に反対しており、承認後に委員3名が辞任する異例の事態になりました。アミロイド仮説(脳の理解レイヤー)の妥当性をめぐる論争を象徴する出来事です。","detail":null,"credibility":"disputed","credibility_note":"認知機能の低下を抑える臨床効果があるかどうかで評価が真っ二つに分かれ、FDA内部と諮問委員会の判断も対立しました。","sources":[{"title":"Wikipedia: Aducanumab","url":"https://en.wikipedia.org/wiki/Aducanumab"}]},{"date":"2022-07-21","precision":"day","end_date":null,"type":"point","layer":"脳の理解","title":"アミロイド研究の重要論文に画像疑義","summary":"Science誌の調査報道が、アルツハイマー病のアミロイド仮説を支えてきた2006年の著名論文に、画像の加工疑惑があると報じました。問題の論文は、2024年に撤回されています。\n\n特定のアミロイド種の役割を示したとされる論文への疑義は、**一つの仮説に研究資源が集中する危うさ**の議論を呼びました。ただし、建物を支える柱は一本ではありません。仮説自体は他の証拠にも支えられており、翌年のレカネマブ承認(医療と社会レイヤー)で治療応用は一定の裏づけを得ています。","detail":null,"credibility":"disputed","credibility_note":"画像加工の疑義と論文撤回は確定しましたが、それがアミロイド仮説全体の妥当性をどこまで揺るがすかは、研究者の間で評価が分かれています。","sources":[{"title":"Science: Blots on a field? (2022-07-21)","url":null}]},{"date":"2023-07-06","precision":"day","end_date":null,"type":"point","layer":"医療と社会","title":"レカネマブ、正式承認","summary":"米FDAが、エーザイとバイオジェンの抗アミロイド抗体薬レカネマブを正式承認しました。臨床試験では認知機能の低下を27%緩やかにしたと報告され、日本でも同年9月に承認されています。\n\n下り坂の傾きを少し緩くするような効果が、患者の生活にとって意味のある水準かどうかは議論が続きます。それでも、症状への対症療法ではなく、疾患の進行そのものに働きかける治療が初めて標準医療に入りました。LTP(1973年)以来の基礎研究が、半世紀を経て薬に結実した形です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Lecanemab","url":"https://en.wikipedia.org/wiki/Lecanemab"}]},{"date":"2023-08-23","precision":"day","end_date":null,"type":"point","layer":"計測と操作の技術","title":"💬 脳信号から会話を復元するBCI","summary":"脳に埋め込んだ電極の信号から、発話を毎分約60〜80語の速さで文章化する脳直結インターフェース(BCI)の成果を、米国の2チームがNature誌に同時発表しました。ALSや脳幹梗塞で話せなくなった参加者が、考えるだけで会話できることを示したのです。\n\nいわば脳と機械のあいだに通訳が入った形で、ベルガーの脳波(1929年)から続く「脳を読む」技術が、実用的な意思疎通の速さに達した画期です。読み取り精度の向上は、思考のプライバシーという倫理問題(医療と社会レイヤー)も現実のものにしました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Brain–computer interface","url":"https://en.wikipedia.org/wiki/Brain%E2%80%93computer_interface"}]},{"date":"2024-01-29","precision":"day","end_date":null,"type":"point","layer":"計測と操作の技術","title":"ニューラリンク、初のヒト埋め込みを発表","summary":"イーロン・マスク率いるニューラリンク社が、脳埋め込み型デバイスを初めてヒトに移植したと、SNS上で発表しました。同社はその後、頸髄損傷のある参加者が思考でカーソルを操作する様子を配信しています。\n\n学術界のBCI研究(2023年)と違い、査読という関所を通る前に企業の発表が先行する点には批判があります。脳インターフェースの主戦場が研究室から企業へ広がったことを示す出来事で、安全性と透明性の検証はこれからです。","detail":null,"credibility":"unverified","credibility_note":"移植の実施と経過は同社および参加者本人の発表・配信に基づいており、査読を経た詳細データは公表されていません。","sources":[{"title":"Wikipedia: Neuralink","url":"https://en.wikipedia.org/wiki/Neuralink"}]}]},{"slug":"science-ocean-exploration","title":"⚓ 海洋探査の歴史","description":"帆船での世界周航から有人潜水艇、無人機、そして深海資源をめぐる国際ルールまで。探査技術・発見・制度の3層を重ねて、人類が最後のフロンティアである深海へどう潜っていったのかをたどります。船の上と海の底の記録帳です。","category":"science-nature","language":"ja","start_year":1872,"end_year":2023,"layers":[{"name":"探査技術","color":"blue"},{"name":"発見と科学","color":"teal"},{"name":"社会と制度","color":"orange"}],"events":[{"date":"1872-12-21","precision":"day","end_date":"1876-05-24","type":"period","layer":"発見と科学","title":"⚓ チャレンジャー号探検航海、海洋学の誕生","summary":"英国のチャレンジャー号がポーツマスを出航し、3年半かけて約13万kmを周航しました。約360地点で測深と生物採集を重ね、4,700種余りの新種を報告。マリアナ海溝の深部も測っています。\n\n国家が科学のために船を出した最初期の例で、全50巻の報告書は海洋学という学問の出発点とされます。ここから先の探査は「深さ」への挑戦(探査技術レイヤー)と、海のルールづくり(社会と制度レイヤー)に分かれていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Challenger expedition","url":"https://en.wikipedia.org/wiki/Challenger_expedition"}]},{"date":"1925-04-01","precision":"month","end_date":"1927-06-01","type":"period","layer":"探査技術","title":"メテオール号が音響測深で南大西洋を観測","summary":"ドイツの観測船メテオール号が南大西洋を14回横断し、音響測深機で6万点を超える水深データを取りました。大西洋中央海嶺が南北に連なる巨大山脈だと分かったのは、この航海です。\n\nロープを下ろして測る時代から**音で海底を測る**時代への転換点でした。ここで見えてきた海底地形が、のちの海洋底拡大説とプレートテクトニクスの確立(発見と科学レイヤー)の伏線になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ドイツ海洋観測船メテオール号 南大西洋観測航海報告(1925–1927)","url":null}]},{"date":"1934-08-15","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"ビービとバートン、潜水球で水深923mに到達","summary":"生物学者ビービと技師バートンが、鋼鉄球「バチスフィア」でバミューダ沖の水深923m(3,028フィート)まで潜りました。人類が深海の生物をその場で直接観察した、最初の記録です。\n\n母船からケーブルで吊るす方式なので動ける範囲は限られましたが、発光生物の目撃記録は深海生物学への関心を一気に高めました。自力で潜航するバチスカーフ(1960年のトリエステ)へ続く技術的な布石です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bathysphere","url":"https://en.wikipedia.org/wiki/Bathysphere"}]},{"date":"1943-01-01","precision":"year","end_date":null,"type":"point","layer":"探査技術","title":"クストーとガニャンがアクアラングを開発","summary":"占領下のフランスで、クストーと技師ガニャンが、呼吸に応じて空気を送るレギュレーターを備えた自給気式潜水器「アクアラング」を完成させました。\n\n潜水が軍や職業ダイバーだけのものではなくなり、戦後は研究者や市民が自分の目で海中を観察できるようになります。浅海の生態研究や水中考古学(発見と科学レイヤー)の裾野を広げ、海洋ドキュメンタリーという文化も生まれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Aqua-Lung","url":"https://en.wikipedia.org/wiki/Aqua-Lung"}]},{"date":"1960-01-23","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"トリエステ号がチャレンジャー海淵に到達","summary":"ピカールとウォルシュの乗るバチスカーフ「トリエステ」が、マリアナ海溝チャレンジャー海淵の底に着きました。人類が**海の最深部に立った**最初の瞬間です。\n\n到達水深は当初11,521mと発表され、のちの較正で約10,916mに直されました。海底で魚らしき生物を見たという証言は深海にも生命がいる証拠と受け止められましたが、種の同定には議論が残ります。有人での再訪は2012年まで52年間ありませんでした。","detail":null,"credibility":"disputed","credibility_note":"当初発表の水深11,521mはのちに約10,916mへ修正されていて、計測値は資料によって幅があります。海底で見たとされる魚の正体にも異論があります。","sources":[{"title":"Wikipedia: Trieste (bathyscaphe)","url":"https://en.wikipedia.org/wiki/Trieste_(bathyscaphe)"}]},{"date":"1977-02-01","precision":"month","end_date":null,"type":"point","layer":"発見と科学","title":"ガラパゴス沖で熱水噴出孔を発見","summary":"潜水艇アルビン号の調査隊が、ガラパゴス地溝帯の水深約2,500mで熱水噴出孔を見つけました。周りにはチューブワームや二枚貝が密集し、太陽の光に頼らない生態系が広がっていたのです。\n\n光合成ではなく**化学合成が支える生態系**の発見は生物学の前提をひっくり返し、生命の起源や地球外生命の議論にも波及しました。1960年代の有人潜水艇の整備(探査技術レイヤー)が実を結んだ代表例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hydrothermal vent","url":"https://en.wikipedia.org/wiki/Hydrothermal_vent"}]},{"date":"1982-12-10","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"国連海洋法条約、モンテゴ・ベイで署名開放","summary":"「海の憲法」と呼ばれる国連海洋法条約が、ジャマイカのモンテゴ・ベイで署名開放されました。領海12海里と排他的経済水域200海里を定め、深海底とその資源を**人類の共同財産**と位置づけています。\n\n測深と地質調査の積み重ねで深海採鉱が現実味を帯びたことが、深海底の制度をめぐる交渉を長引かせた一因でした。発効は12年後の1994年。探査技術の進歩に制度が追いつくまでの時差が見えます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United Nations Convention on the Law of the Sea","url":"https://en.wikipedia.org/wiki/United_Nations_Convention_on_the_Law_of_the_Sea"}]},{"date":"1985-09-01","precision":"day","end_date":null,"type":"point","layer":"発見と科学","title":"バラードらがタイタニック号の残骸を発見","summary":"ウッズホール海洋研究所のバラードらが、曳航式カメラシステム「アルゴ」で、水深約3,800mに眠るタイタニック号を見つけました。沈没から73年ぶりの再会です。\n\n調査が米海軍の原子力潜水艦残骸調査の副産物だったことは、後年になって公表されました。無人カメラで広く探して有人艇で確かめる手法は無人機中心の深海探査への転換を象徴し、沈没船考古学と深海観光をめぐる議論も呼び起こします。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Wreck of the Titanic","url":"https://en.wikipedia.org/wiki/Wreck_of_the_Titanic"}]},{"date":"1994-11-16","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"海洋法条約が発効、国際海底機構が発足","summary":"署名開放から12年を経て国連海洋法条約が発効し、深海底の鉱物資源を管理する国際海底機構(ISA)がジャマイカのキングストンにできました。\n\n深海底の商業採鉱を国際管理の下に置く枠組みがようやく動き出したものの、肝心の採掘規則づくりは30年たっても完了していません。技術(探査技術レイヤー)より制度の時計が遅く進む構図は、2021年のナウルによる「2年ルール」発動につながっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: International Seabed Authority","url":"https://en.wikipedia.org/wiki/International_Seabed_Authority"}]},{"date":"1995-03-24","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"無人探査機かいこうがチャレンジャー海淵に到達","summary":"海洋科学技術センター(現JAMSTEC)の無人探査機「かいこう」が、チャレンジャー海淵で水深10,911mを記録しました。無人機として初めての世界最深部到達です。\n\n以後かいこうは最深部の堆積物を持ち帰り、超高圧の泥の中で生きる微生物の研究へ道を開きます。1960年のトリエステ以来35年ぶりの最深部到達を無人機が果たしたことは、深海探査の主役交代を印象づけました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kaikō ROV","url":"https://en.wikipedia.org/wiki/Kaik%C5%8D_ROV"}]},{"date":"2000-01-01","precision":"year","end_date":"2010-10-04","type":"period","layer":"発見と科学","title":"国際共同調査「海洋生物センサス」","summary":"80カ国超・約2,700人の研究者が加わる10年計画の国際調査「海洋生物センサス」が始まりました。海の生き物の多様性・分布・個体数を体系的に記録し、2010年の最終報告までに1,200種を超える新種を正式に記載しています。\n\n一度きりの航海ではなく**世界規模のデータベースづくり**へと海洋研究のやり方を変えた計画で、成果は公海の保護区設計(社会と制度レイヤー)の科学的な土台にもなっていきます。","detail":null,"credibility":"unverified","credibility_note":"参加者数や新種数は計画側の最終報告に基づく集計で、その後の分類学的な見直しによって数値は変わりえます。","sources":[{"title":"Wikipedia: Census of Marine Life","url":"https://en.wikipedia.org/wiki/Census_of_Marine_Life"}]},{"date":"2007-11-01","precision":"month","end_date":null,"type":"point","layer":"探査技術","title":"海洋観測フロート網Argoが3,000基体制に","summary":"世界の海にセンサー付きの自動フロートを漂わせる国際観測網Argoが、目標としていた3,000基の展開に到達したと発表されました。各フロートは約10日ごとに潜っては浮かび、水温・塩分の鉛直データを衛星経由で送り続けます。\n\n船が行かない海域まで含めて海の内部を常時見張る体制が初めて整い、海面上昇や海洋熱吸収の評価など、気候変動をめぐる政策議論(社会と制度レイヤー)を支える基礎インフラになりました。","detail":null,"credibility":"unverified","credibility_note":"3,000基到達の時期は計画側の集計に基づくもので、稼働中フロートの定義や集計時点によって数値は前後します。","sources":[{"title":"Wikipedia: Argo (oceanography)","url":"https://en.wikipedia.org/wiki/Argo_(oceanography)"}]},{"date":"2012-03-26","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"キャメロンが単独潜航でチャレンジャー海淵へ","summary":"映画監督キャメロンが潜水艇ディープシー・チャレンジャーで単独潜航し、チャレンジャー海淵の水深10,908mに到達しました。1960年のトリエステ以来、52年ぶりの有人到達です。\n\n国家事業ではなく、個人の資金と情熱による探査だったのが新しいところでした。撮影された映像と採取試料は科学チームと共有されています。民間資金が深海探査を担う流れは、2019年のファイブ・ディープス遠征へ続いていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Deepsea Challenger","url":"https://en.wikipedia.org/wiki/Deepsea_Challenger"}]},{"date":"2017-06-01","precision":"month","end_date":null,"type":"point","layer":"発見と科学","title":"🗺️ 海底地形図計画「Seabed 2030」開始","summary":"日本財団とGEBCOが、2030年までに世界の海底地形図を完成させる国際プロジェクト「Seabed 2030」を国連海洋会議で発表しました。開始時点で、現代的な水準で測深済みの海底は全体の約6%しかありません。\n\n火星の地形より粗くしか分かっていない足元の海底を埋めていく試みで、各国の調査船や民間船が持つ測深データを持ち寄る方式です。地形データは資源探査や大陸棚の境界画定(社会と制度レイヤー)にも直結します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nippon Foundation-GEBCO Seabed 2030 Project","url":"https://seabed2030.org"}]},{"date":"2019-04-28","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"ファイブ・ディープス遠征、五大洋最深部へ","summary":"投資家ヴェスコヴォが潜水艇リミッティング・ファクターでチャレンジャー海淵に潜り、水深10,928mと発表しました。五大洋すべての最深部に潜るファイブ・ディープス遠征の一環で、遠征は約10カ月で完遂されています。\n\n何度でも潜れる商用認証艇の登場で、最深部は一度きりの偉業の場から**繰り返し通える場所**に変わりました。同艇はその後、各国の研究者を乗せた科学潜航にも使われています。","detail":null,"credibility":"disputed","credibility_note":"記録水深10,928mは遠征側の発表値です。計測・較正の方法をめぐって、過去の記録との比較には議論があります。","sources":[{"title":"Wikipedia: Five Deeps Expedition","url":"https://en.wikipedia.org/wiki/Five_Deeps_Expedition"}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"ナウルが深海採鉱の「2年ルール」を発動","summary":"太平洋の島国ナウルが、支援する企業による深海底採鉱の計画を念頭に、2年以内の採掘規則完成を国際海底機構に求める条項を発動しました。規則が未完成のままでも、採掘申請の審査が始まりうる状況です。\n\n主な対象はクラリオン・クリッパートン海域の多金属団塊で、背景には電池向け金属の需要増があります。科学界からは深海生態系(発見と科学レイヤー)の知見不足を理由にモラトリアムを求める声が上がり、各国の賛否も割れています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際海底機構(ISA)へのナウルによる2年ルール発動通知(2021年6月)","url":null}]},{"date":"2023-06-18","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"潜水艇タイタン、タイタニック観光中に圧壊","summary":"オーシャンゲート社の潜水艇タイタンが、タイタニック号見学ツアーの潜航中に消息を絶ちました。のちに水深約3,800m付近で圧壊していたことが確認され、乗員5人全員が亡くなっています。\n\n同艇は既存の第三者認証を受けない独自設計で運航されていました。事故は深海観光をめぐる安全規制の空白をあらわにします。1985年の残骸発見(発見と科学レイヤー)が生んだ観光需要と、制度の未整備が交差した悲劇でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Titan submersible implosion","url":"https://en.wikipedia.org/wiki/Titan_submersible_implosion"}]},{"date":"2023-06-19","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"国連で公海の生物多様性協定(BBNJ)を採択","summary":"国家管轄権の外側にある海域の生物多様性を守る「BBNJ協定」が国連で採択されました。公海に海洋保護区を設ける手続きと、海洋遺伝資源から得る利益の配分枠組みを初めて定めています。\n\n交渉開始から採択まで約20年。海洋法条約が生まれた1982年には想定されていなかった遺伝資源やDNA配列データが争点になり、**探査が生んだ新しい価値**に制度が追いつく構図が、ここでも繰り返されました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国連: 国家管轄権外区域の海洋生物多様性(BBNJ)協定 採択(2023年6月19日)","url":null}]}]},{"slug":"science-particle-physics","title":"素粒子物理学の旅","description":"1897年の電子発見からヒッグス粒子、次世代加速器構想まで。理論の予言、実験と加速器による検証、巨大科学を支える国際協力の3層を重ね、物質の最小単位を問い続ける旅を辿る。","category":"science-nature","language":"ja","start_year":1897,"end_year":2025,"layers":[{"name":"理論","color":"purple"},{"name":"実験と加速器","color":"blue"},{"name":"巨大科学と協力","color":"gold"}],"events":[{"date":"1897-04-30","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"J.J.トムソン、電子を発見","summary":"キャヴェンディッシュ研究所のトムソンが、陰極線の正体は原子よりはるかに軽い負電荷の粒子だとする実験結果を王立研究所で講演した。原子より小さい構成要素、最初の素粒子の発見である。\n\n「原子は分割できない」という古代以来の前提が崩れた出発点であり、1911年の原子核、1932年の中性子と続く**より小さな階層を問い続ける旅**がここから始まる。当時この発見に実用価値を見た者はほとんどいなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: J. J. Thomson","url":"https://en.wikipedia.org/wiki/J._J._Thomson"}]},{"date":"1928-02-01","precision":"month","end_date":null,"type":"point","layer":"理論","title":"ディラック方程式、反物質を予言","summary":"ディラックが特殊相対論と量子力学を両立させる電子の方程式を発表した。方程式は負エネルギーの解を含み、やがて電子と同じ質量で電荷が逆の「反粒子」の存在を意味すると解釈される。\n\n1932年にアンダーソンが宇宙線の中に陽電子を発見して予言は的中した。**紙の上の数学が未知の粒子を先に言い当てる**という理論主導の発見様式の最初の劇的な成功であり、以後の素粒子物理の型となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Dirac equation","url":"https://en.wikipedia.org/wiki/Dirac_equation"}]},{"date":"1932-02-27","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"チャドウィック、中性子を発見","summary":"チャドウィックが、ベリリウムから出る透過力の強い放射線を電荷を持たない中性の粒子と同定し、Nature誌に速報した。師のラザフォードが1920年に示唆していた中性子の実証である。\n\n陽子と中性子の組で原子核を説明できるようになり、核物理は急展開した。同年には加速器による人工核変換も成功している。核子どうしを結ぶ力の説明として、3年後に湯川の中間子論(理論レイヤー)が生まれる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: James Chadwick","url":"https://en.wikipedia.org/wiki/James_Chadwick"}]},{"date":"1935-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"湯川秀樹、中間子論を発表","summary":"湯川秀樹が、原子核の中で陽子と中性子を結びつける力は未知の粒子(中間子)の交換によって生じるとする理論を日本の学術誌に発表した。力を粒子の交換として説明する枠組みの提示である。\n\n1947年のパイ中間子発見(実験と加速器レイヤー)で理論は裏づけられ、1949年に日本人初のノーベル賞を受賞。敗戦直後の日本社会を勇気づけ、素粒子論の研究拠点が日本に育つ契機となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 湯川秀樹","url":"https://ja.wikipedia.org/wiki/%E6%B9%AF%E5%B7%9D%E7%A7%80%E6%A8%B9"}]},{"date":"1947-05-01","precision":"month","end_date":null,"type":"point","layer":"実験と加速器","title":"パイ中間子を宇宙線中に発見","summary":"パウエルらが、高山に設置した原子核乾板に残された飛跡から、湯川の予言に合う新粒子パイ中間子の崩壊を捉えてNature誌に報告した。\n\n加速器がまだ非力だった時代、天然の高エネルギー源である宇宙線が素粒子の狩場だった。だが同様に見つかる新粒子は予想外に増え続け、「粒子の動物園」と呼ばれる混沌が生じる。この混沌を整理する試みが、1964年のクォーク模型(理論レイヤー)につながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pion","url":"https://en.wikipedia.org/wiki/Pion"}]},{"date":"1954-09-29","precision":"day","end_date":null,"type":"point","layer":"巨大科学と協力","title":"欧州合同原子核研究機関(CERN)設立","summary":"欧州12か国の批准によりCERNが正式に発足した。第二次大戦で疲弊し人材が米国へ流出した欧州が、一国では持てない大型加速器を共同で保有するために作った国際機関である。\n\n「科学による欧州の再建」を掲げた設立は、素粒子物理が**一国では担えない巨大科学**へ向かう転換点となった。後にW/Z粒子の発見、LHC、さらに副産物としてのWeb発明(1989年)まで、協力の枠組みそのものが成果を生み続ける。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: CERN","url":"https://en.wikipedia.org/wiki/CERN"}]},{"date":"1956-06-14","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ニュートリノを初めて検出","summary":"ライネスとコーワンが原子炉から放出される反ニュートリノの検出に成功し、提唱者パウリに「検出した」と電報を打った。1930年の理論的な提唱から26年目の実証である。\n\nパウリが「検出不可能かもしれない」と悩みながら導入した粒子は実在した。物質とほとんど反応しないこの幽霊のような粒子は、その後も超新星の観測(1987年)や振動の発見(1998年)と、本年表で繰り返し主役を務めることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cowan–Reines neutrino experiment","url":"https://en.wikipedia.org/wiki/Cowan%E2%80%93Reines_neutrino_experiment"}]},{"date":"1964-02-01","precision":"month","end_date":null,"type":"point","layer":"理論","title":"クォーク模型の提唱","summary":"ゲルマンとツワイクがそれぞれ独立に、乱立するハドロンを3種類の基本粒子(クォーク)の組み合わせとして整理する模型を提唱した。\n\n分数電荷を持つ粒子は当初「数学的な便法」と受け取られ、単独で取り出せない性質もあって実在への懐疑が続いたが、1968年以降の電子散乱実験が陽子の内部構造を裏づけた。宇宙線と加速器が生んだ「粒子の動物園」(実験と加速器レイヤー)に、周期表にあたる秩序を与えた転換点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Quark","url":"https://en.wikipedia.org/wiki/Quark"}]},{"date":"1964-08-01","precision":"month","end_date":null,"type":"point","layer":"理論","title":"ヒッグス機構の提唱","summary":"アングレールとブラウト、続いてヒッグス、さらにグラルニクらの3グループが、対称性の自発的破れによって素粒子が質量を得る機構を相次いで独立に発表した。ヒッグスの論文は新粒子の存在に明示的に触れていた。\n\n半世紀後のLHCでの粒子発見(実験と加速器レイヤー)で実証されるが、提唱の先取権と呼び名をめぐる議論は長く続いた。2013年のノーベル賞は2名に絞られ、選から漏れた貢献者をめぐる論争も残った。","detail":null,"credibility":"disputed","credibility_note":"機構はほぼ同時期に3グループが独立に提唱しており、貢献の配分と「誰の名を冠すべきか」は現在も立場によって見解が分かれる。","sources":[{"title":"Wikipedia: Higgs mechanism","url":"https://en.wikipedia.org/wiki/Higgs_mechanism"}]},{"date":"1967-11-20","precision":"day","end_date":null,"type":"point","layer":"理論","title":"ワインバーグ、電弱統一理論を発表","summary":"ワインバーグが電磁気力と弱い力を一つの枠組みで記述する理論を発表した。ヒッグス機構を組み込み、未発見のW粒子とZ粒子の質量を予言するものだった。サラムも独立に同様の理論へ到達している。\n\n発表当初はほとんど引用されなかったが、1971年にトフーフトが計算の整合性(繰り込み可能性)を証明すると一気に主流となり、素粒子の「標準模型」の柱となった。予言の検証は1983年のCERN(実験と加速器レイヤー)を待つ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Electroweak interaction","url":"https://en.wikipedia.org/wiki/Electroweak_interaction"}]},{"date":"1974-11-11","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"J/ψ粒子の同時発見(11月革命)","summary":"米国のブルックヘブン研究所とSLACの2チームが、同じ新粒子J/ψの発見を同日に発表した。異常に長い寿命を持つこの粒子は、第4のクォーク(チャーム)と反クォークの束縛状態と解釈された。\n\nクォーク模型と電弱理論(理論レイヤー)の予言が一挙に裏づけられ、標準模型が定説となる「11月革命」と呼ばれる転換点になった。一方でティン側が結果の公表を数か月遅らせた経緯には食い違いが残り、名称も両陣営の呼称を併記する異例の形となった。","detail":null,"credibility":"disputed","credibility_note":"ブルックヘブン側がいつ発見と確信し、なぜ公表を遅らせたのかについては、当事者の回想の間に食い違いがある。","sources":[{"title":"Wikipedia: J/psi meson","url":"https://en.wikipedia.org/wiki/J/psi_meson"}]},{"date":"1983-01-25","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"CERN、W粒子の発見を発表","summary":"ルビア率いるUA1実験が、陽子・反陽子衝突の中にW粒子の証拠を確認したと発表した。同年6月にはZ粒子の発見も発表され、いずれも電弱統一理論(理論レイヤー)の予言どおりの質量だった。\n\n反陽子を貯めて冷却するファンデルメーアの技術革新が発見を可能にし、両名は翌1984年にノーベル賞を受賞。欧州が素粒子実験の主導権を米国から取り戻した出来事とも評され、探索の焦点は残るヒッグス粒子へ移っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: W and Z bosons","url":"https://en.wikipedia.org/wiki/W_and_Z_bosons"}]},{"date":"1987-02-23","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"超新星1987Aのニュートリノを検出","summary":"大マゼラン雲で起きた超新星爆発からのニュートリノを、岐阜県神岡のカミオカンデを含む3つの検出器がほぼ同時に捉えた。カミオカンデは11個の事象を時刻とエネルギー付きで記録した。\n\n超新星理論の中核を初めて直接検証した観測であり、ニュートリノで宇宙を見る「ニュートリノ天文学」を開いた。小柴昌俊は2002年にノーベル賞を受賞し、後継機スーパーカミオカンデによる振動発見(1998年)へと日本の実験の系譜が続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: SN 1987A","url":"https://en.wikipedia.org/wiki/SN_1987A"}]},{"date":"1993-10-01","precision":"month","end_date":null,"type":"point","layer":"巨大科学と協力","title":"米国、超伝導超大型加速器(SSC)を中止","summary":"米議会が、テキサス州で建設中だった周長約87kmの加速器SSCの計画中止を決定した。すでに約20億ドルが投じられトンネルの一部も掘られていたが、費用の膨張と冷戦終結後の優先順位の変化が致命傷となった。\n\n素粒子物理の主導権は、より小さい周長27kmのLHCを選んだ欧州へ移る。**巨大科学の成否を決めるのは政治と予算**であることを見せつけた事件であり、以後の大型計画は最初から国際分担を前提に設計されるようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Superconducting Super Collider","url":"https://en.wikipedia.org/wiki/Superconducting_Super_Collider"}]},{"date":"1998-01-01","precision":"year","end_date":"2008-09-10","type":"period","layer":"巨大科学と協力","title":"LHC建設、100か国規模の協力事業に","summary":"CERNで大型ハドロン衝突型加速器(LHC)の建設が進み、2008年9月10日に最初のビーム周回に到達した。周長27kmのトンネルに超伝導磁石を並べ、検出器の建設には日本や米国を含む100を超える国・地域の研究者が参加した。\n\nSSC中止(1993年)後の素粒子物理の希望を一身に背負った計画である。周回の9日後に磁石接続部の事故で1年余り停止する挫折も経て2010年から本格運転に入り、2年後のヒッグス粒子発見の舞台となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Large Hadron Collider","url":"https://en.wikipedia.org/wiki/Large_Hadron_Collider"}]},{"date":"1998-06-05","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ニュートリノ振動の発見","summary":"スーパーカミオカンデのグループが、大気ニュートリノが飛行中に種類を変える「振動」の証拠を岐阜県高山市での国際会議で発表した。振動が起きることは、ニュートリノに質量があることを意味する。\n\n標準模型はニュートリノの質量をゼロと仮定しており、これは**標準模型の綻びを示した初の確かな実験事実**となった。梶田隆章とマクドナルドは2015年にノーベル賞を受賞。質量の起源や宇宙の物質優勢の謎へ続く未解決領域が開かれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Neutrino oscillation","url":"https://en.wikipedia.org/wiki/Neutrino_oscillation"}]},{"date":"2012-07-04","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ヒッグス粒子の発見を発表","summary":"CERNのATLASとCMSの両実験が、質量約125GeVの新粒子の発見を発表した。1964年に提唱されたヒッグス機構(理論レイヤー)が予言する粒子と矛盾しない性質で、その後の測定でも裏づけられた。\n\n標準模型最後の未発見粒子が48年越しに見つかり、翌年アングレールとヒッグスがノーベル賞を受賞した。**半世紀前の理論を数千人の実験が検証する**という、この分野の時間スケールと協力の規模を象徴する到達点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Higgs boson","url":"https://en.wikipedia.org/wiki/Higgs_boson"}]},{"date":"2013-08-23","precision":"day","end_date":null,"type":"point","layer":"巨大科学と協力","title":"ILC、国内候補地に北上山地を選定","summary":"次世代の直線加速器・国際リニアコライダー(ILC)について、日本の研究者組織が国内候補地を岩手県などにまたがる北上山地に一本化した。発見されたばかりのヒッグス粒子を精密測定する「ヒッグス工場」の構想である。\n\nしかし巨額の建設費の国際分担は固まらず、日本政府は誘致の意思表明を保留し続けた。SSC中止(1993年)と同様に、次の一手を決めるのは物理ではなく政治と資金であるという構図が繰り返されている。","detail":null,"credibility":"unverified","credibility_note":"候補地選定は研究者側の決定であり、政府の誘致判断・国際的な費用分担・実現時期はいずれも未確定のままである。","sources":[{"title":"Wikipedia: 国際リニアコライダー","url":"https://ja.wikipedia.org/wiki/%E5%9B%BD%E9%9A%9B%E3%83%AA%E3%83%8B%E3%82%A2%E3%82%B3%E3%83%A9%E3%82%A4%E3%83%80%E3%83%BC"}]},{"date":"2021-04-07","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ミューオンg-2、標準模型とのずれを報告","summary":"米フェルミ研究所のMuon g-2実験が、ミューオンの磁気異常の測定値が標準模型の予測と食い違うとする最初の結果を発表した。先行するブルックヘブンの測定とも一致し、ずれの統計的有意性が高まった。\n\n未知の粒子の兆候かと注目されたが、同時期に格子QCDによる新しい理論計算が実験値に近い値を示し、**ずれているのは自然か、それとも理論計算か**という論争になった。標準模型の先を探る現在進行形の戦線である。","detail":null,"credibility":"disputed","credibility_note":"実験値と理論値の乖離は、理論側の計算手法(データ駆動法と格子QCD)の間の不一致が未解決のため、新物理の証拠かどうか結論が出ていない。","sources":[{"title":"Wikipedia: Muon g-2","url":"https://en.wikipedia.org/wiki/Muon_g-2"}]},{"date":"2025-03-31","precision":"day","end_date":null,"type":"point","layer":"巨大科学と協力","title":"CERN、次期加速器FCCの実現可能性報告","summary":"CERNが周長約91kmの次期円形加速器FCCの実現可能性調査の最終報告をまとめた。まず電子・陽電子衝突でヒッグス粒子を精密測定し、将来は陽子衝突で未知の高エネルギー領域を探る二段構えの構想である。\n\n建設費は第1段階だけで150億スイスフラン規模とされ、承認は加盟国の判断に委ねられる。1954年の設立以来続いてきた国際協力の枠組みが、数十年がかりの次の賭けに踏み出せるかが問われている。","detail":null,"credibility":"unverified","credibility_note":"報告書は構想段階の計画であり、費用見積りと建設の可否・時期は未承認・未確定。公表日は報道に基づく。","sources":[{"title":"Wikipedia: Future Circular Collider","url":"https://en.wikipedia.org/wiki/Future_Circular_Collider"}]}]},{"slug":"science-renewable-energy","title":"🌱 再生可能エネルギー史","description":"1839年の光起電力効果の発見から、世界の電力の3割へ。技術の芽、産業と価格の変動、政策の後押しの3つの層を重ねながら、再生可能エネルギーが補助輪を外して走り出すまでの長い道のりを、やさしく語りなおす年表です。","category":"science-nature","language":"ja","start_year":1839,"end_year":2024,"layers":[{"name":"技術の芽","color":"green"},{"name":"産業と価格","color":"orange"},{"name":"政策と社会","color":"blue"}],"events":[{"date":"1839-01-01","precision":"year","end_date":null,"type":"point","layer":"技術の芽","title":"ベクレル、光起電力効果を発見","summary":"フランスの19歳の物理学者エドモン・ベクレルが、電解液に浸した電極に光を当てると電流が生じる現象を報告しました。光を電気に変える太陽電池の原理につながる、最初の観察とされています。\n\n実用にはほど遠く、シリコン太陽電池(1954年)まで115年。まかれた種が花を咲かせるまでの、**原理の発見から産業になるまでの時間差**は、この年表を貫く主題です。なお、放射能を発見した孫のアンリ・ベクレルの方が、後世には有名になりました。","detail":null,"credibility":"disputed","credibility_note":"ベクレルが観察した現象は、今日の半導体の光起電力効果とは機構が異なる光電気化学反応で、「太陽電池の起源」とみなせるかには学説上の幅があります。","sources":[{"title":"Wikipedia: Edmond Becquerel","url":"https://en.wikipedia.org/wiki/Edmond_Becquerel"}]},{"date":"1887-07-01","precision":"month","end_date":null,"type":"point","layer":"技術の芽","title":"ブライス、風車による発電に成功","summary":"スコットランドのジェームズ・ブライスが自宅の庭に風車を建て、蓄電池への充電に成功しました。翌1888年には米国のブラッシュも自邸で大型風車による発電を始めており、風力発電の実質的な誕生期にあたります。\n\nブライスが余った電力を村に提供しようと申し出たところ、「悪魔の仕業」と断られたという逸話が残っています。いわば電気のおすそ分けを断られたのです。風力が発電の主役級に育つのは、約1世紀後のデンマークの産業化と洋上風力(1991年)を待つことになります。","detail":null,"credibility":"disputed","credibility_note":"「世界初の風力発電」をブライス(1887年)とブラッシュ(1888年)のどちらに帰すかは、規模や連続運転などの定義によって記述が分かれます。","sources":[{"title":"Wikipedia: James Blyth (engineer)","url":"https://en.wikipedia.org/wiki/James_Blyth_(engineer)"}]},{"date":"1954-04-25","precision":"day","end_date":null,"type":"point","layer":"技術の芽","title":"☀️ ベル研究所、シリコン太陽電池を発表","summary":"米ベル研究所が、変換効率約6%のシリコン太陽電池を発表しました。おもちゃの観覧車やラジオを動かす実演が行われ、報道は無尽蔵の太陽エネルギー利用の始まりと持ち上げました。\n\nしかし高価すぎて地上の用途は開けず、最初の顧客は電池交換のできない人工衛星でした(1958年のヴァンガード1号)。宇宙という特殊な市場が、いわば技術の避難所になったのです。地上での価格低下(産業と価格レイヤー)を待つ構図が、数十年続きます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Solar cell","url":"https://en.wikipedia.org/wiki/Solar_cell"}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"政策と社会","title":"第一次石油危機","summary":"第四次中東戦争を機にアラブ産油国が原油の減産と禁輸を発動し、原油価格は数か月で約4倍に高騰しました。石油に頼りきっていた先進国の経済は、大きな打撃を受けます。\n\n燃料の蛇口を他人に握られている。そんな**エネルギーを他国に握られる恐怖**が、代替エネルギー研究への公的投資を初めて本格化させました。日本のサンシャイン計画(1974年)や米国の太陽エネルギー研究所の設立など、現在の再エネ技術の源流の多くがこの危機に発しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1973 oil crisis","url":"https://en.wikipedia.org/wiki/1973_oil_crisis"}]},{"date":"1979-06-20","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"カーター、ホワイトハウスに太陽熱パネル","summary":"カーター米大統領が、ホワイトハウスの屋根に32枚の太陽熱温水パネルを設置し、2000年までにエネルギーの2割を太陽由来にする目標を掲げました。第二次石油危機のさなかの、象徴的な行動です。\n\nパネルは石油価格が下がった後の1986年、レーガン政権下で撤去されました。屋根の上のパネルが、いわば政策の風見鶏になったのです。再エネ政策が**政権交代のたびに揺れる**ことを示す最初の分かりやすい例で、同じ構図は2010年代以降の米国でもくり返されます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Scientific American: Where Did the Carter White House's Solar Panels Go? (2010)","url":null}]},{"date":"1981-01-01","precision":"year","end_date":"1986-12-31","type":"period","layer":"産業と価格","title":"カリフォルニア風力ラッシュ","summary":"石油危機後の手厚い税制優遇を追い風に、カリフォルニア州の峠に数千基規模の風車が林立しました。当時の世界の風力発電容量の大半が同州に集中する、いわば風のゴールドラッシュです。\n\n優遇の失効と油価の下落でブームは崩壊し、粗製乱造された風車の残骸は、再エネ懐疑論の格好の材料になりました。一方で、着実に改良を重ねたデンマークの製造業者が生き残り、風力産業の主導権は欧州へ移ります。補助金の設計が産業の質を左右する、教訓の残る出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Altamont Pass Wind Farm","url":"https://en.wikipedia.org/wiki/Altamont_Pass_Wind_Farm"}]},{"date":"1991-01-01","precision":"year","end_date":null,"type":"point","layer":"技術の芽","title":"🌊 世界初の洋上風力発電所ヴィンデビー","summary":"デンマーク沖に、世界初の洋上風力発電所ヴィンデビーが完成しました。450kW機が11基、合計約5MWという小さな規模ながら、風がよく吹き土地の取り合いもない海の上へ、風車を引っ越しさせた最初の一歩です。\n\n実証を積み重ねるデンマークの漸進主義は、ブームと崩壊をくり返したカリフォルニア(産業と価格レイヤー)と対照をなします。洋上風力はその後、北海を中心に主力電源級へ成長しました。ヴィンデビーは2017年に役目を終えて、静かに解体されています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Vindeby Offshore Wind Farm","url":"https://en.wikipedia.org/wiki/Vindeby_Offshore_Wind_Farm"}]},{"date":"1997-12-11","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"京都議定書を採択","summary":"気候変動枠組条約の第3回締約国会議(COP3)が京都で開かれ、先進国に温室効果ガスの削減義務を課す京都議定書が採択されました。気候変動対策が国際法上の義務になった、最初の枠組みです。\n\n提出期限のある宿題のような削減義務ができたことで、再エネは「環境に良い選択肢」から「義務を果たすための手段」へと変わりました。各国の導入支援策が2000年前後に出揃う下地となり、世界の太陽光市場を作ったドイツの固定価格買取制度(2000年)へ直結します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kyoto Protocol","url":"https://en.wikipedia.org/wiki/Kyoto_Protocol"}]},{"date":"2000-04-01","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"ドイツ、再エネ固定価格買取制度(EEG)","summary":"ドイツで再生可能エネルギー法(EEG)が施行され、再エネ電力を20年間固定価格で買い取ることが電力会社に義務づけられました。発電した分だけ確実に収入になる仕組みが、家の屋根や農地を小さな発電所に変え、個人や農家までも発電事業者にしたのです。\n\n生まれた巨大な需要は太陽電池の量産投資を呼び、のちに中国メーカーの規模拡大(産業と価格レイヤー)を通じて世界の価格を押し下げました。**一国の制度設計が世界の価格曲線を動かした**例として、政策史の画期とされています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: German Renewable Energy Sources Act","url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act"}]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"技術の芽","title":"宮坂力ら、ペロブスカイト太陽電池を報告","summary":"桐蔭横浜大学の宮坂力らが、ペロブスカイト結晶を光吸収材に使う新型太陽電池を論文で報告しました。当初の変換効率は、わずか3.8%でした。\n\nいわば塗って印刷するように作れる、軽くて曲げられる電池です。2012年ごろから効率が急伸し、研究レベルではシリコンに迫る25%超に達しました。ビルの壁面や耐荷重の小さい屋根など、設置場所を一気に広げうる次世代の本命として、日本発の技術の産業化競争(産業と価格レイヤー)が現在も続いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Perovskite solar cell","url":"https://en.wikipedia.org/wiki/Perovskite_solar_cell"}]},{"date":"2011-06-30","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"ドイツ、脱原発と再エネ転換を決定","summary":"福島第一原発事故を受けて、ドイツ連邦議会が2022年までの原発全廃を圧倒的多数で可決しました。再エネを電力供給の柱に据える「エネルギーヴェンデ(転換)」の加速が、国策として確定します。\n\n遠い国の事故という外からの出来事が、一国のエネルギーの舵を大きく切らせた事例です。移行期の石炭依存や電力価格の上昇といった代償も大きく、脱原発と脱炭素のどちらを先にするかという論争は、世界の再エネ政策に影響を与え続けました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Energiewende","url":"https://en.wikipedia.org/wiki/Energiewende"}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"米ソリンドラ破綻、価格競争の象徴に","summary":"米政府の債務保証を受けていた新興太陽電池メーカーのソリンドラが、経営破綻しました。シリコンを使わない円筒形パネルという独自技術は、シリコン価格の暴落で「シリコンは高い」という前提を失い、いわば足場ごと崩れたのです。\n\n破綻は米政界で再エネ支援策への攻撃材料になりましたが、背景にあったのは中国メーカーの大増産による太陽電池の世界的な値崩れでした。**価格下落は産業の淘汰と普及を同時に進める**という、この時期の太陽光の二面性を象徴しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Solyndra","url":"https://en.wikipedia.org/wiki/Solyndra"}]},{"date":"2012-07-01","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"日本、再エネ固定価格買取制度を開始","summary":"福島第一原発事故後のエネルギー政策見直しのなかで、日本でも再エネの固定価格買取制度(FIT)が始まりました。高めに設定された買取価格を追って、メガソーラーの建設が全国で殺到します。\n\n太陽光の導入量は数年で世界有数の規模になった一方、電気料金への賦課金の膨張や、山林開発をめぐる摩擦も生まれ、入札制への移行(2017年以降)につながりました。ドイツ(2000年)が先にたどった軌跡を、いわば早送りで再生したような経過です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"資源エネルギー庁: 再生可能エネルギー固定価格買取制度","url":null}]},{"date":"2015-12-12","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"パリ協定を採択","summary":"COP21で、産業革命前からの気温上昇を2℃より十分低く、できれば1.5℃に抑えることを目指すパリ協定が採択されました。途上国を含むすべての国が削減目標を掲げる、いわば初めて全員参加になった約束事です。\n\n今世紀後半の実質排出ゼロが長期目標となったことで、再エネは移行の中心手段と位置づけられ、企業の投資判断や金融の基準にまで浸透していきます。義務型の京都議定書(1997年)から、自主目標を積み上げる方式への転換でもありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Paris Agreement","url":"https://en.wikipedia.org/wiki/Paris_Agreement"}]},{"date":"2016-09-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"太陽光入札、当時最安級の価格が相次ぐ","summary":"アブダビの発電事業入札で、1kWh当たり2.42米セントという当時世界最安水準の太陽光の応札価格が報じられました。この前後、中東や中南米で最安記録の更新が相次ぎます。\n\n補助金なしでも化石燃料と競える水準に達したことを、いわば市場自身が値札で示した局面です。ただしこれらの数字は、日照や金利、土地の条件が揃った案件の値で、単純な国際比較はできません。それでも、価格の向かう方向は誰の目にも明らかになりました。","detail":null,"credibility":"unverified","credibility_note":"入札価格は報道ベースで、契約条件や補助の有無が案件ごとに異なるため、「最安記録」の比較には幅があります。","sources":[{"title":"PV Magazine等による2016年アブダビ・スウェイハン入札の報道","url":null}]},{"date":"2019-10-09","precision":"day","end_date":null,"type":"point","layer":"技術の芽","title":"🔋 リチウムイオン電池にノーベル化学賞","summary":"リチウムイオン電池を開発したグッドイナフ、ウィッティンガム、吉野彰の3氏に、ノーベル化学賞が贈られました。授賞理由には、化石燃料に依存しない社会を可能にする基盤、という位置づけが明記されています。\n\n天候で出力が変わる太陽光・風力を使いこなす鍵は、電気の貯金箱ともいえる蓄電にあります。電気自動車の量産が電池価格を押し下げる好循環(産業と価格レイヤー)が2010年代に確立し、1970年代の石油危機に始まった研究が、再エネの弱点を埋める形で実を結びました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Chemistry 2019","url":"https://www.nobelprize.org/prizes/chemistry/2019/summary/"}]},{"date":"2020-10-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"IEA「太陽光は史上最も安い電力」","summary":"国際エネルギー機関(IEA)が、年次報告書の世界エネルギー見通しで、好条件の太陽光発電を「歴史上最も安い電力源」と表現しました。再エネの成長を長年控えめに見積もってきた同機関だけに、いわば慎重な目利きが太鼓判を押した転換として注目されます。\n\nベクレルの発見(1839年)から181年、ベル研の電池(1954年)から66年での到達です。以後の争点は、発電コストそのものから、送電網への統合や蓄電といった変動対策(技術の芽レイヤー)へと移っていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IEA: World Energy Outlook 2020","url":"https://www.iea.org/reports/world-energy-outlook-2020"}]},{"date":"2022-08-16","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"米インフレ抑制法(IRA)成立","summary":"気候・エネルギー対策に約3700億ドルを投じる、米インフレ抑制法が成立しました。税額控除を軸に、再エネ発電から蓄電池や部材の製造まで国内投資を誘導する、米国史上最大の気候立法です。\n\n規制や炭素価格というムチではなく、補助というアメで産業を自国に呼び込む設計は、各国の産業政策競争を誘発しました。再エネが気候対策であると同時に**産業の主導権争いの主戦場**になったことを象徴します。政権交代による見直しという、米国特有のリスクも残りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Inflation Reduction Act","url":"https://en.wikipedia.org/wiki/Inflation_Reduction_Act"}]},{"date":"2023-12-13","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"COP28、再エネ3倍と脱化石燃料を合意","summary":"ドバイでのCOP28で、2030年までに世界の再エネ容量を3倍にする目標と、エネルギーシステムにおける「化石燃料からの脱却」が、初めて合意文書に明記されました。\n\n産油国のお膝元でこの文言が入ったことは象徴的ですが、法的な拘束力はなく、実現は各国の実行にかかっています。いわば号令はかかったものの、走るのはこれから。目標達成には送電網の増強と資金、とりわけ途上国への投資という壁が残ると、採択の当日から指摘されていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2023 United Nations Climate Change Conference","url":"https://en.wikipedia.org/wiki/2023_United_Nations_Climate_Change_Conference"}]},{"date":"2024-05-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"🌍 世界の発電量の30%が再エネに","summary":"エネルギー分野のシンクタンクのエンバーが、2023年に世界の発電量に占める再エネの比率が初めて30%を超えたとする分析を公表しました。伸びを引っ張ったのは水力ではなく、太陽光と風力です。\n\n分析は各国統計の集計と推計を含む速報値ですが、方向ははっきりしています。1839年に実験室で見つかった小さな現象は、185年かけて世界の電力の3分の1近くを灯すまでになりました。焦点は「増やせるか」から、「どこまで速く置き換えられるか」へ移っています。","detail":null,"credibility":"unverified","credibility_note":"30%超という比率はエンバーの集計・推計に基づく速報値で、確定統計では数値が改定されることがあります。","sources":[{"title":"Ember: Global Electricity Review 2024","url":null}]}]},{"slug":"science-vaccines","title":"💉 ワクチン開発の歴史","description":"ジェンナーの種痘からmRNAワクチンまで、およそ230年。科学の突破、感染症と社会の反応、制度と公衆衛生の整備の3つの層を重ねながら、ワクチンが一人の発明から社会みんなの基盤へ変わっていく道のりを、やさしく語りなおす年表です。","category":"science-nature","language":"ja","start_year":1796,"end_year":2023,"layers":[{"name":"科学と技術","color":"blue"},{"name":"感染症と社会","color":"orange"},{"name":"制度と公衆衛生","color":"teal"}],"events":[{"date":"1796-05-14","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"🐄 ジェンナーが少年に牛痘を接種、種痘の起点","summary":"英国の医師エドワード・ジェンナーが、8歳の少年ジェームズ・フィップスに牛痘を接種し、のちに天然痘への抵抗力が生じたことを確かめました。いわば弱い相手と先に手合わせをして、本番に備えさせる方法。人為的に免疫を付ける最初の体系的な実証とされます。\n\n牛痘接種そのものには農夫ベンジャミン・ジェスティらの先行例が知られますが、観察を実験と論文にまとめて医学界に届けた点がジェンナーの功績です。種痘は各国へ急速に広がり、1853年の英国での義務化(制度と公衆衛生レイヤー)につながっていきます。","detail":null,"credibility":"disputed","credibility_note":"「世界初のワクチン接種」という位置づけには、1774年のベンジャミン・ジェスティら先行例をめぐって諸説があります。","sources":[{"title":"Wikipedia: Edward Jenner","url":"https://en.wikipedia.org/wiki/Edward_Jenner"}]},{"date":"1853-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"英国で種痘法成立、乳児への接種を義務化","summary":"英国で1853年種痘法が成立し、乳児への天然痘ワクチン接種が罰則付きで義務づけられました。国家が国民に予防接種を義務として課した、初期の代表例です。\n\n直後から**接種の義務化と反対運動**が、コインの表と裏のように対になって現れ、反ワクチン同盟の結成や「良心的拒否」条項の追加(1898年)を生みました。ワクチンが個人の医療から公衆衛生の制度へ変わる出発点で、感染症と社会レイヤーでくり返される忌避運動の原型もここにあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Vaccination Act","url":"https://en.wikipedia.org/wiki/Vaccination_Act"}]},{"date":"1885-07-06","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"パスツールが狂犬病ワクチンを少年に接種","summary":"ルイ・パスツールが、弱毒化した狂犬病ワクチンを、狂犬に咬まれた9歳の少年ジョゼフ・マイステルに接種し、発症を防ぎました。実験室で病原体の毒性を弱めてワクチンにする、近代的な開発手法の最初の劇的な成功です。\n\nジェンナーの種痘が自然界にある牛痘に頼ったのに対し、こちらは病原体を人の手で飼いならして免疫の練習相手に変える、原理の転換でした。この成功は1888年のパスツール研究所設立(制度と公衆衛生レイヤー)と、世界に広がる研究所網の礎になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Louis Pasteur","url":"https://en.wikipedia.org/wiki/Louis_Pasteur"}]},{"date":"1890-12-04","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"ベーリングと北里が血清療法を発表","summary":"エミール・ベーリングと北里柴三郎が、血清療法の論文を発表しました。ジフテリアと破傷風の毒素に対する「抗毒素」、いわば体の中で作られる解毒剤が動物の血清中に生じることを示し、免疫という現象の実体に初めて迫った研究です。\n\nワクチンが「なぜ効くのか」を説明する免疫学の出発点で、のちの抗体医薬にも連なります。1901年の第1回ノーベル生理学・医学賞はベーリング単独に贈られ、共同研究者だった北里の貢献の評価をめぐる議論は、現在まで続いています。","detail":null,"credibility":"disputed","credibility_note":"共同研究における北里柴三郎の貢献の位置づけと、ノーベル賞がベーリング単独授与となった経緯については、評価が分かれています。","sources":[{"title":"Wikipedia: Emil von Behring","url":"https://en.wikipedia.org/wiki/Emil_von_Behring"}]},{"date":"1918-03-01","precision":"month","end_date":"1920-04-30","type":"period","layer":"感染症と社会","title":"スペインかぜ大流行、ワクチンなき最後の大災禍","summary":"H1N1型インフルエンザが世界的に大流行し、世界人口の3割前後が感染、死者は1700万人から1億人と推定されています。当時はインフルエンザウイルスの分離すらできておらず、人類はワクチンという盾を持たないまま向き合うしかありませんでした。\n\n「病原体が分からないまま流行が過ぎ去る」最後の世界的大流行となり、各国の公衆衛生体制と国際協調(制度と公衆衛生レイヤー)の必要性を刻みました。流行の最中にワクチンが作られた約1世紀後の新型コロナと、くっきりと対をなす出来事です。","detail":null,"credibility":"disputed","credibility_note":"死者数は推計手法により1700万人から1億人まで大きな幅があり、流行の発生地についても米国起源説など諸説あります。","sources":[{"title":"Wikipedia: Spanish flu","url":"https://en.wikipedia.org/wiki/Spanish_flu"}]},{"date":"1921-07-01","precision":"month","end_date":null,"type":"point","layer":"科学と技術","title":"BCGワクチン、パリで初めて新生児に投与","summary":"カルメットとゲランが13年かけて230代以上植え継ぎ、病原性が弱まるまで「育てた」ウシ型結核菌(BCG)が、パリで初めて新生児に投与されました。当時最大級の死因だった結核に対する、最初のワクチンです。\n\n長い継代培養で菌の気性を穏やかに変えていく手法は、パスツール流の方法論の到達点でした。1930年のリューベック事故で信頼が大きく揺らぎながらも、戦後はWHOとユニセフの大規模接種事業(制度と公衆衛生レイヤー)を通じ、世界で最も広く接種されるワクチンになります。","detail":null,"credibility":"unverified","credibility_note":"初回投与の正確な日付は資料により記載が異なり、1921年7月とする文献が多いものの、確定的な一次記録は確認できていません。","sources":[{"title":"Wikipedia: BCG vaccine","url":"https://en.wikipedia.org/wiki/BCG_vaccine"}]},{"date":"1948-04-07","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"世界保健機関(WHO)が発足","summary":"国連の専門機関として、世界保健機関(WHO)が発足しました。憲章発効日の4月7日は、のちに「世界保健デー」となります。感染症対策を国ごとの事業から国際協調の枠組みへ移す、その拠点が生まれました。\n\n種痘の国際的な調整はここから本格化し、1959年の根絶決議、1967年の根絶強化計画を経て、1980年の天然痘根絶宣言(感染症と社会レイヤー)へ至ります。いわばワクチンを世界へ「配る」ための、物流と調整の中心が定まった出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"WHO: Constitution of the World Health Organization","url":"https://www.who.int/about/governance/constitution"}]},{"date":"1955-04-12","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"ソークのポリオワクチン、有効性が発表される","summary":"フランシス報告により、ソークの不活化ポリオワクチンが大規模野外試験で有効と発表されました。約180万人の児童が参加した史上最大級の臨床試験の結果に、ポリオに怯えていた米国は祝賀に沸きます。\n\n発表はラジオで中継され、各地で教会の鐘が鳴らされたと伝えられる社会的事件でした(感染症と社会レイヤー)。ワクチンへの公的な信頼が、いちばん高いところにあった瞬間といえます。しかしわずか2週間後、カッター事故が製造管理の未熟さをあらわにするのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Polio vaccine","url":"https://en.wikipedia.org/wiki/Polio_vaccine"}]},{"date":"1955-04-27","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"カッター事故、ワクチン規制強化の転機に","summary":"カッター研究所製の不活化ポリオワクチンに、不活化が不十分な生きたウイルスが混ざっていたことが分かり、接種した子どもたちに麻痺患者と死者が出ました。政府は同社製品を回収し、接種計画はいったん止まります。\n\n事故の調査を通じて、連邦政府によるワクチンの品質管理と規制の体制が根本から強化され、後の生物製剤監督制度の原型になりました。転んだ場所に手すりが付くように、**失敗が制度を作る**。この年表でくり返される構図の、最初のはっきりした事例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cutter incident","url":"https://en.wikipedia.org/wiki/Cutter_incident"}]},{"date":"1961-07-01","precision":"month","end_date":null,"type":"point","layer":"感染症と社会","title":"日本、ポリオ生ワクチンを緊急輸入し一斉投与","summary":"日本でポリオ患者が急増するなか、母親たちを中心とする世論の強い求めを受けて、政府はソ連・カナダから経口生ワクチン約1300万人分を緊急輸入し、全国一斉投与に踏み切りました。患者数は翌年から激減します。\n\n平時の薬事手続きをいったん脇に置く、いわば非常ボタンを押すような政治判断で接種が実現した例です。市民の声が制度(制度と公衆衛生レイヤー)を動かした出来事として記憶され、以後の日本のポリオ定期接種の起点になりました。","detail":null,"credibility":"unverified","credibility_note":"緊急輸入の数量は約1300万人分とする資料が多いものの文献により幅があり、投与実績の集計も資料間で異なります。","sources":[{"title":"厚生労働省・国立感染症研究所によるポリオ(急性灰白髄炎)関連資料","url":null}]},{"date":"1974-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"WHOが拡大予防接種計画(EPI)を開始","summary":"WHOが拡大予防接種計画(EPI)を始め、結核・ジフテリア・百日咳・破傷風・ポリオ・麻疹の6つの病気のワクチンを、世界のすべての子どもに届けるという目標を掲げました。\n\n当時の途上国での接種率は5%程度とされます。ワクチンが存在することと、届くことは別の問題。いわばラストワンマイル、**すべての子どもに届ける仕組み**こそが課題だと、国際保健の中心に据えた計画です。のちのGAVIワクチンアライアンス(2000年)やCOVAX(2020年)も、この延長線上にあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"WHO: Essential Programme on Immunization","url":null}]},{"date":"1980-05-08","precision":"day","end_date":null,"type":"point","layer":"感染症と社会","title":"🌍 WHOが天然痘の世界根絶を宣言","summary":"WHO総会が、天然痘の世界根絶を宣言しました。ジェンナーの種痘から184年、天然痘は**人類が計画的に根絶した最初の感染症**になりました。最後の自然感染例は、1977年のソマリアで確認されています。\n\nサーベイランスと包囲接種という戦略、凍結乾燥ワクチンと分岐針という技術、WHOという制度(制度と公衆衛生レイヤー)。三つの歯車が噛み合って初めて届いた到達点です。ワクチンの力を示す金字塔ですが、以後「根絶」は麻疹でもポリオでも達成できていません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Smallpox","url":"https://en.wikipedia.org/wiki/Smallpox"}]},{"date":"1998-02-28","precision":"day","end_date":null,"type":"point","layer":"感染症と社会","title":"MMRと自閉症を結びつけた論文、忌避の起点に","summary":"英国の医師ウェイクフィールドらが、MMRワクチンと自閉症の関連を示唆する論文をランセット誌に発表しました。のちに研究不正が認定され、2010年に論文は撤回、本人は医籍を抹消されています。\n\n撤回までの12年間に英国などでMMR接種率が大きく下がり、麻疹の再流行を招きました。一度こぼれた水が元に戻らないように、科学的には完全に否定された主張が、SNS時代の**ワクチン忌避**の中核的な言説として生き残り続ける。その起点となった出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Lancet MMR autism fraud","url":"https://en.wikipedia.org/wiki/Lancet_MMR_autism_fraud"}]},{"date":"2006-06-08","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"FDAが初のHPVワクチンを承認","summary":"米FDAが、初のヒトパピローマウイルス(HPV)ワクチン「ガーダシル」を承認しました。子宮頸がんの主因となるウイルス型の感染を防ぐ、いわば「がんを予防する注射」の実用化です。\n\n感染症の盾ががん対策にも使われるようになった転換点で、豪州など早期に導入した国では、前がん病変の減少が確認されていきます。一方、日本では2013年に積極的勧奨が中止され(制度と公衆衛生レイヤー)、普及の明暗が国によって大きく分かれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gardasil","url":"https://en.wikipedia.org/wiki/Gardasil"}]},{"date":"2013-06-14","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"日本、HPVワクチンの積極的勧奨を中止","summary":"厚生労働省が、接種後の多様な症状の報告を受けて、HPVワクチンの積極的勧奨を一時差し控えました。定期接種の位置づけは残ったものの、接種率は70%前後から1%未満へ、崖から落ちるように急落します。\n\nその後の疫学研究で症状とワクチンの因果関係は支持されず、2022年4月に勧奨は再開されました。しかし約9年の空白は、対象世代で防げたはずの子宮頸がんを増やすと推計されています。科学・制度・社会(感染症と社会レイヤー)の緊張関係が凝縮した事例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: HPVワクチンの積極的勧奨差し控えに関する勧告(2013年6月14日)","url":null}]},{"date":"2020-01-30","precision":"day","end_date":"2023-05-05","type":"period","layer":"感染症と社会","title":"新型コロナのパンデミック(緊急事態宣言期間)","summary":"新型コロナウイルス感染症が世界的に流行し、WHOは2020年1月30日に「国際的に懸念される公衆衛生上の緊急事態」を宣言、2023年5月5日に終了を発表しました。確認された死者は690万人を超え、超過死亡は1500万人前後と推計されています。\n\nスペインかぜから約1世紀。今回は流行の最中にワクチンが開発・接種された初の世界的大流行となり、mRNA技術の実力(科学と技術レイヤー)と分配の不平等(制度と公衆衛生レイヤー)、その両方を映す鏡になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: COVID-19 pandemic","url":"https://en.wikipedia.org/wiki/COVID-19_pandemic"}]},{"date":"2020-12-02","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"💉 英国がmRNAワクチンを世界に先駆け承認","summary":"英国の規制当局MHRAがファイザー・ビオンテックのmRNAワクチンを承認し、西側諸国で初の新型コロナワクチン実用化となりました。8日後には、90歳の女性が臨床試験の外で世界初の接種を受けています。\n\nウイルスの遺伝子配列の公開から約11か月。**着手から1年未満での実用化**は、「ワクチン開発は10年仕事」という常識を覆しました。カリコらの基礎研究、各国政府の先行購入という資本、緊急承認という制度(制度と公衆衛生レイヤー)。三つの力の足し算でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pfizer–BioNTech COVID-19 vaccine","url":"https://en.wikipedia.org/wiki/Pfizer%E2%80%93BioNTech_COVID-19_vaccine"}]},{"date":"2021-02-24","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"COVAX初の供給便がガーナに到着","summary":"ワクチンの共同購入・分配の国際枠組みCOVAXによる初の供給便が、ガーナの首都アクラに到着しました。高所得国による買い占めに対して、いわば先に並んだ人だけが買える列に順番を作ろうとする試みです。\n\nしかし2021年の供給目標20億回分は大幅な未達に終わり、先進国でブースター接種が進む一方、低所得国の接種率が1桁台にとどまる時期が続きました。**分配の不平等**が、技術ではなく制度の限界として刻まれた出来事です。","detail":null,"credibility":"unverified","credibility_note":"供給実績や各国の接種率の数値は、GaviやWHOの自己報告と推計に基づいており、集計時点や定義により幅があります。","sources":[{"title":"Gavi/WHO/UNICEF: COVAX共同声明・供給実績報告","url":null}]},{"date":"2021-10-06","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"WHOが初のマラリアワクチンを推奨","summary":"WHOがマラリアワクチンRTS,S(モスキリックス)について、サハラ以南アフリカなどの子どもへの広い使用を初めて推奨しました。寄生虫による感染症に対する、世界初の実用ワクチンです。\n\n有効率は3割ほどと高くありませんが、患者数が膨大なため、公衆衛生上の効果は大きいと判断されました。小さな網でも魚の多い海なら多く掬える、という考え方です。30年を超えた開発は官民連携の資金に支えられ、市場任せでは進まないワクチン開発を制度が支えた例として、COVAXと同じ文脈に置かれます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: RTS,S","url":"https://en.wikipedia.org/wiki/RTS,S"}]},{"date":"2023-10-02","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"カリコとワイスマンにノーベル生理学・医学賞","summary":"mRNAワクチンを可能にした塩基修飾の発見により、カタリン・カリコとドリュー・ワイスマンにノーベル生理学・医学賞が贈られました。授賞理由には、新型コロナワクチン開発への貢献が明記されています。\n\nカリコの研究は長年、資金難と降格のなかで続けられ、鍵となる2005年の論文も当初はほとんど注目されませんでした。パンデミックという需要が、**基礎研究の長い助走**を一気に社会実装の跳躍へ変えた。この年表の締めくくりにふさわしい物語です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Physiology or Medicine 2023","url":"https://www.nobelprize.org/prizes/medicine/2023/press-release/"}]}]},{"slug":"tech-5g-6g","title":"5G/6G通信の進化","description":"通信の世代交代は技術だけでは進まない。国際標準化・事業者の市場競争・各国の政策と地政学の3層を重ね、5Gの理想と現実、そして6Gへの助走を俯瞰する年表。","category":"technology","language":"ja","start_year":2015,"end_year":2026,"layers":[{"name":"技術と標準化","color":"blue"},{"name":"事業者と市場","color":"orange"},{"name":"政策と地政学","color":"teal"}],"events":[{"date":"2015-09-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"ITU-Rが5Gビジョン勧告「IMT-2020」を承認","summary":"国際電気通信連合の無線通信部門が勧告M.2083を承認し、高速大容量・超低遅延・多数同時接続という5Gの3つの利用シナリオと、2020年頃の実用化という目標を国際的に定めた。\n\n通信の世代交代は各社の発明の積み上げではなく、**国際的な目標設定から逆算して進む**。以後は3GPPが仕様策定を担い、各国が周波数割当と免許で追走する。本年表の3層構造が動き出す起点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ITU-R勧告 M.2083: IMT Vision - Framework and overall objectives of the future development of IMT for 2020 and beyond","url":"https://www.itu.int/rec/R-REC-M.2083"}]},{"date":"2017-12-21","precision":"day","end_date":null,"type":"point","layer":"技術と標準化","title":"3GPPが最初の5G NR仕様(NSA)を完成","summary":"標準化団体3GPPがリスボン会合で、4Gのコアネットワークに5G無線を組み合わせるノンスタンドアロン(NSA)方式の仕様をRelease 15の一部として完成させた。最初の5G標準の確定である。\n\n早期商用化を急ぐ主要事業者(事業者と市場レイヤー)の要望を受け、当初計画から前倒しで策定された経緯があり、標準化のスケジュールそのものが各国・各社の競争の対象であることを示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP発表: First 5G NR specs approved (2017-12-21)","url":null}]},{"date":"2018-06-14","precision":"day","end_date":null,"type":"point","layer":"技術と標準化","title":"Release 15完成、単独運用できる5G標準が確定","summary":"3GPPが米サンディエゴ近郊の会合で、5G専用コアネットワークを含むスタンドアロン(SA)方式の仕様を承認し、Release 15として完全な5G標準の初版が揃った。\n\nこれを受けて機器開発と各国の周波数オークション(事業者と市場・政策レイヤー)が本格化する。ただし実際の商用サービスは当面NSA方式で始まり、SA方式への移行は当初の想定より長い時間を要することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP発表: Release 15 SA仕様承認 (2018-06)","url":null}]},{"date":"2019-04-03","precision":"day","end_date":null,"type":"point","layer":"事業者と市場","title":"韓国と米国が「世界初の5G商用化」を競う","summary":"韓国の通信3社が4月3日夜に一般向け5Gサービスを一斉に開始し、米Verizonも予定を繰り上げて同日の開始を発表。「世界初の5G商用化」の座を両国が争った。\n\n開始時刻を繰り上げてまで初物の称号を奪い合った背景には、5Gを国家と企業のブランドに使う思惑がある。**「世界初」争いそのものが5Gの政治性**を象徴しており、通信世代が国力の指標として扱われる時代の幕開けだった。","detail":null,"credibility":"disputed","credibility_note":"どちらが「世界初」かは、開始時刻の定義や対象(一般向けか限定提供か)によって主張が分かれている。","sources":[{"title":"韓国科学技術情報通信部発表・Reuters報道 (2019-04)","url":null}]},{"date":"2019-05-15","precision":"day","end_date":null,"type":"point","layer":"政策と地政学","title":"米国がファーウェイへ事実上の禁輸措置","summary":"米政権が情報通信サプライチェーンを守るとする大統領令に署名し、商務省はファーウェイをエンティティリストへ追加すると発表。米国由来の技術・部品の供給が原則許可制となった。\n\n5G基地局シェア首位の企業を狙い撃つ措置は、通信インフラが**安全保障の最前線**になったことを示した。以後、同盟国へ排除への同調圧力が広がり、機器市場の勢力図(事業者と市場レイヤー)を書き換えていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省産業安全保障局(BIS)発表 (2019-05)","url":null}]},{"date":"2019-06-06","precision":"day","end_date":null,"type":"point","layer":"政策と地政学","title":"中国が5G商用免許を交付、国家主導の整備へ","summary":"中国の工業情報化部が通信大手4社に5G商用免許を交付した。米国による制裁発動のわずか3週間後というタイミングで、当初の想定より前倒しの交付と報じられた。\n\n以後、中国は国家主導で基地局整備を進め、数年で世界の5G基地局の過半を占める規模に達する。標準・市場・政策が一体となって動く中国モデルと、同盟国連携で対抗する米国という対立軸がここで固まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中国工業情報化部発表・新華社報道 (2019-06-06)","url":null}]},{"date":"2020-03-25","precision":"day","end_date":null,"type":"point","layer":"事業者と市場","title":"日本で5G商用サービス開始","summary":"NTTドコモが日本初の5G商用サービスを開始し、同じ週にKDDI、ソフトバンクも続いた。当初は都市部のごく限られたスポットからの出発だった。\n\n直後に新型コロナの外出制限が重なり、5Gを体験する機会自体が限られたまま推移する。エリアの狭さと対応端末の少なさから「つながらない5G」との批判も受け、規格への期待と利用実態のギャップが早くも表面化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTTドコモ報道発表 (2020-03-25)","url":null}]},{"date":"2020-04-08","precision":"day","end_date":null,"type":"point","layer":"事業者と市場","title":"楽天モバイル本格開始、完全仮想化網を主張","summary":"楽天モバイルが自社回線での本格サービスを開始。ネットワーク機能をソフトウェアで実現する「世界初の完全仮想化クラウドネイティブ網」を掲げ、単一の低価格プランで市場に参入した。\n\n専用ハードウェアに依存しない構成は、基地局のオープン化(O-RAN)の潮流を先取りするものとして海外の事業者からも注目された。ただし「世界初」という位置づけは同社の発表に基づく主張である。","detail":null,"credibility":"disputed","credibility_note":"「世界初の完全仮想化モバイルネットワーク」は同社の主張であり、仮想化の定義や範囲をめぐって業界内で見解が分かれる。","sources":[{"title":"楽天モバイル報道発表 (2020-04-08)","url":null}]},{"date":"2020-07-14","precision":"day","end_date":null,"type":"point","layer":"政策と地政学","title":"英国が5G網からのファーウェイ排除を決定","summary":"英政府が、2020年末以降のファーウェイ製5G機器の新規購入禁止と、2027年までの既設機器の完全撤去を決定した。同年1月の「限定的に容認」からわずか半年での方針転換だった。\n\n転換の直接の契機は米国による対ファーウェイ半導体規制の強化で、機器の安全性評価の前提が変わったためと説明された。**同盟国の政策が連鎖する構図**が鮮明になり、欧州各国でも排除・制限の決定が続いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"英政府(DCMS)発表 (2020-07-14)","url":null}]},{"date":"2021-02-01","precision":"month","end_date":null,"type":"point","layer":"事業者と市場","title":"米C帯オークション、落札総額約810億ドルで史上最大","summary":"米FCCの周波数オークション(オークション107)で、5Gの本命周波数とされるミッドバンドのC帯免許の落札総額が約810億ドルに達し、過去最大となった。VerizonとAT&Tが大半を投じた。\n\nミリ波偏重だった米国の5G戦略の軌道修正を意味し、周波数という有限資源の配分が市場の勝敗を左右することを改めて示した。巨額の免許料は事業者の投資余力を圧迫し、その後の固定無線(FWA)注力にも影を落とす。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FCC Auction 107 (3.7 GHz Service) 結果公表","url":"https://www.fcc.gov/auction/107"}]},{"date":"2022-01-01","precision":"year","end_date":"2024-12-31","type":"period","layer":"事業者と市場","title":"「期待と現実」の調整期、FWAが想定外の主役に","summary":"各国で5Gエリアは拡大したものの、収益の柱と期待された法人向け用途や自動運転は立ち上がらず、米国では5Gを使った固定無線アクセス(FWA)が家庭向け回線として急伸するという想定外の展開になった。\n\nSA方式への移行も調査会社の推計では想定より遅れ、**華々しい標語と収益の実態の乖離**がこの時期の主題となる。6Gの議論が「5Gの反省」から始まる素地は、この数年間に形づくられた。","detail":null,"credibility":"unverified","credibility_note":"SA移行率やFWA契約数は調査会社・事業者発表による推計値で、業界全体の確定的な統計は存在しない。","sources":[{"title":"Ericsson Mobility Report","url":"https://www.ericsson.com/en/reports-and-papers/mobility-report"}]},{"date":"2022-06-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"Release 17完成、衛星通信と省電力IoTを標準に","summary":"3GPPがRelease 17を完成させ、衛星を経由して5G端末と直接通信するNTN(非地上系ネットワーク)や、簡易なIoT端末向けのRedCapが携帯電話の標準仕様に加わった。\n\n地上基地局を前提に発展してきた携帯標準が宇宙へ拡張された画期であり、スマートフォンと衛星の直接通信への道を開いた。5Gの「完成度を上げる」段階から「適用範囲を広げる」段階へ、標準化の軸足が移った節目でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP: Release 17","url":"https://www.3gpp.org/specifications-technologies/releases/release-17"}]},{"date":"2023-11-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"ITU-Rが6Gの枠組み勧告「IMT-2030」を承認","summary":"ITUの無線通信総会が6Gの枠組み勧告M.2160を承認した。没入型通信、AIと通信の融合、通信とセンシングの統合など6つの利用シナリオと、2030年頃の実用化という目標が示された。\n\n2015年のIMT-2020ビジョンと同じ手順の反復であり、**世代交代は10年周期の国際的な合意形成**として進むことがよく分かる。各国・各社の6G研究開発は、以後この座標系に沿って整列し始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ITU-R勧告 M.2160: Framework and overall objectives of the future development of IMT for 2030 and beyond","url":"https://www.itu.int/rec/R-REC-M.2160"}]},{"date":"2024-03-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"Release 18(5G-Advanced)の主要仕様が固まる","summary":"3GPPが5G-Advancedの最初の版となるRelease 18の主要仕様を凍結した。無線区間へのAI・機械学習の適用、ネットワーク省電力化、衛星通信(NTN)の拡張などが盛り込まれた。\n\n5Gと6Gをつなぐ橋渡しと位置づけられ、6Gの本命とされるAIネイティブなネットワークの予行演習という意味を持つ。収益化に苦しむ事業者(事業者と市場レイヤー)にとっては、追加投資に値するかを測る試金石ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP: Release 18","url":"https://www.3gpp.org/specifications-technologies/releases/release-18"}]},{"date":"2025-03-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"3GPPが6G標準化に向けた検討を正式に開始","summary":"3GPPが韓国・仁川で6Gワークショップを開催し、Release 20における6Gの研究項目を始動させた。世界の通信事業者・機器ベンダー・研究機関から技術提案が一斉に持ち寄られた。\n\n標準化の開始は次世代競争の号砲でもある。AIとの融合を押し出す米欧、独自路線もにらむ中国など、この場には政策レイヤーの技術覇権争いがそのまま持ち込まれており、5Gで起きた分断の再現が早くも懸念されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP発表: 6G Workshop, Incheon (2025-03)","url":null}]},{"date":"2026-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と標準化","title":"6G仕様策定は2026年以降へ、商用化目標は2030年頃","summary":"3GPPの工程表では、Release 20での研究を経て2026年以降にRelease 21で6Gの仕様策定段階へ入り、2020年代末の初版完成、2030年頃の商用化開始が見込まれている。\n\nただしこれは現時点の計画にすぎない。5Gで起きた標準化の前倒し圧力、「世界初」競争、地政学的な分断が6Gでも再現される可能性は高く、標準・市場・政策の3層が再び同じ順序で動くのかが、本年表の続きを決める。","detail":null,"credibility":"unverified","credibility_note":"仕様策定と商用化の時期はいずれも標準化団体・各社の計画・見込みであり、今後変動しうる。","sources":[{"title":"3GPP発表・主要各社6Gホワイトペーパー","url":null}]}]},{"slug":"tech-ai-revolution","title":"🤖 AI革命の全体像 2020–2026","description":"AIはどうしてこの数年で「あたりまえ」になったのか。深層学習の下地から生成AIの爆発、各国の規制まで、技術・資本・規制の3つのレイヤーで読み解く年表です 🤖","category":"technology","language":"ja","start_year":2012,"end_year":2026,"layers":[{"name":"技術","color":"blue"},{"name":"企業と資本","color":"orange"},{"name":"社会と規制","color":"teal"}],"events":[{"date":"2012-10-01","precision":"month","end_date":null,"type":"point","layer":"技術","title":"🧠 AlexNetがILSVRCで圧勝、深層学習ブームの起点","summary":"トロント大学のチーム(Krizhevsky、Sutskever、Hinton)が作ったGPU学習の深層CNNが、画像認識コンペILSVRCで従来手法に圧勝。「深層学習って本当に使えるんだ」と世界が気づいた瞬間です!\n\nここから研究のリソースが一気に深層学習へ。GPUで学習するスタイルもこのとき定着しました。のちのNVIDIAの大躍進(企業と資本レイヤー)につながる、生成AI以前の「下地」となる出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: AlexNet","url":"https://en.wikipedia.org/wiki/AlexNet"}]},{"date":"2017-06-12","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🔧 Transformer論文公開、大規模言語モデルの基盤に","summary":"Googleの研究者たちが「再帰構造はもういらない、Attentionだけでいい」と提案したのがTransformer。並列学習に強く、モデルとデータを大きくするほど性能が伸びる「スケーリング」の道を開きました。GPTもBERTも、ぜんぶこの構造の上に立っています!\n\nちなみにこの時点では、AIはまだ研究投資の対象。資本市場や規制当局はほぼノーマークでした。5年後の大騒ぎと見比べると、この静けさが際立ちます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Attention Is All You Need (1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"date":"2019-07-22","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"🤝 MicrosoftがOpenAIに10億ドル出資","summary":"MicrosoftがOpenAIに10億ドルを出資し、Azureを独占的なクラウド基盤にすると発表。巨大な計算資源の供給ラインがここでつながりました。\n\n非営利で始まったOpenAIが営利子会社(capped-profit)を作った直後のできごとです。**この資本と計算資源の結合が、翌年のGPT-3(技術レイヤー)を可能にしました**。以後の生成AI競争は「モデル開発企業×クラウド大手」の連合戦になっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft News: OpenAI forms exclusive computing partnership with Microsoft (2019-07-22)","url":"https://news.microsoft.com/2019/07/22/openai-forms-exclusive-computing-partnership-with-microsoft-to-build-new-azure-ai-supercomputing-technologies/"}]},{"date":"2020-05-28","precision":"day","end_date":null,"type":"point","layer":"技術","title":"📈 GPT-3論文公開、1750億パラメータの言語モデル","summary":"OpenAIが1750億パラメータのGPT-3を発表。少しの例を見せるだけで多様なタスクをこなす「few-shot」能力に研究者たちがざわつきました!規模を大きくすれば能力が伸びる、を実証した形です。\n\n前年のMicrosoft出資が結実した成果でもあります。6月にはAPIとして限定公開され、AIは「研究成果」から「サービスの土台」へ。一方この頃の社会はコロナ対応で手一杯で、AI規制の議論はまだEUの準備段階でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Language Models are Few-Shot Learners (2005.14165)","url":"https://arxiv.org/abs/2005.14165"}]},{"date":"2021-04-21","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"⚖️ 欧州委員会がAI規則(AI Act)案を提案","summary":"欧州委員会が、AIの用途をリスクで4段階に分けて高リスクには義務を課す、世界初の包括的なAI規制案を発表しました。\n\nただ、この時点で生成AIはほぼ想定外。2022年末にChatGPT(技術レイヤー)が登場すると、あわてて汎用AIモデルの条項が追加されることになります。**規制が技術に追いつこうとする構図は、ここから始まりました**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Proposal COM(2021) 206 final","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52021PC0206"}]},{"date":"2022-08-22","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🎨 Stable Diffusion公開、画像生成AIがオープンに","summary":"Stability AIらが画像生成モデルStable Diffusionを重みごと公開。自分のPCで動く生成AIが一気に広まりました。\n\n同じ年のDALL·E 2やMidjourneyに続く動きですが、モデルをオープンに配ったインパクトは別格。派生モデルやツールが爆発的に増える一方で、学習データの著作権をめぐる訴訟が翌年から相次ぎ、社会と規制レイヤーの論点を先取りしました。生成AIが「見て分かる」形でみんなに届いた最初の波です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Stability AI: Stable Diffusion Public Release","url":"https://stability.ai/news/stable-diffusion-public-release"}]},{"date":"2022-10-07","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"🚧 米国が先端半導体の対中輸出規制を発表","summary":"アメリカ商務省が、先端AIチップと製造装置の中国向け輸出をストップ。**計算資源が安全保障と地政学の対象になった**瞬間です。\n\n対象はNVIDIAのA100/H100クラスのGPUで、規制はその後も段階的に強化されます。この縛りが中国側の「少ない計算資源で戦う」工夫を促し、2025年のDeepSeek-R1(技術レイヤー)の衝撃につながったという見方もあります。AIの覇権争いが国家戦略になった、最初のはっきりした出来事でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省産業安全保障局(BIS) 2022年10月7日発表 輸出管理規則改正","url":null}]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"💬 ChatGPT公開","summary":"OpenAIが対話型AI「ChatGPT」を無料公開。中身はGPT-3.5に人間のフィードバックで磨きをかけたもので、技術の大ジャンプというより「届け方」の発明でした。\n\nでも、誰でもおしゃべり感覚で使える体験が世界を変えます!公開2か月で推定1億ユーザーに到達し(社会と規制レイヤー)、翌年1月にはMicrosoftの追加出資が発表され、大手各社が一斉に生成AIへ舵を切りました。**この年表のすべてのレイヤーが、ここを分岐点にしています**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: Introducing ChatGPT","url":"https://openai.com/index/chatgpt/"}]},{"date":"2023-01-23","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"💰 MicrosoftがOpenAIへ数十億ドル規模の追加出資","summary":"MicrosoftがOpenAIとの提携延長と、複数年・数十億ドル規模の投資を発表(報道では総額100億ドルとも)。ChatGPT公開からわずか2か月後のことです。\n\n生成AIが資本市場のど真ん中に来たことを象徴する出来事でした。翌月にはBing、続いてOfficeへの組み込みが進み、Googleも対抗発表を急ぎます。3月にはGPT-4の公開も控えていて、資本と技術の回転がものすごく速くなった時期です。","detail":null,"credibility":"disputed","credibility_note":"実はMicrosoftの公式発表に金額は書かれていません。「100億ドル」は報道ベースの推定です。","sources":[{"title":"Microsoft Official Blog: Microsoft and OpenAI extend partnership (2023-01-23)","url":"https://blogs.microsoft.com/blog/2023/01/23/microsoftandopenaiextendpartnership/"}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"社会と規制","title":"🌍 ChatGPTが公開2か月で推定1億ユーザーに到達","summary":"「ChatGPTの月間利用者が公開2か月で1億人に到達」とUBSの分析が報じられ、史上最速の普及と話題になりました。\n\n学校での利用制限、会社での情報漏えいの心配など、社会の反応も一斉に噴出。イタリアの当局が3月末に一時利用停止を命じるなど、規制側の初動もこのスピードが引き金でした。技術の「届け方の転換」が社会に波及するまでの速さを示す数字です。","detail":null,"credibility":"disputed","credibility_note":"1億人はUBSがSimilarwebなどのデータから推定した数字で、OpenAIの公式発表ではありません。集計方法によって数値は前後します。","sources":[{"title":"Reuters: ChatGPT sets record for fastest-growing user base - analyst note (2023-02-02)","url":null}]},{"date":"2023-03-14","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🚀 GPT-4公開、マルチモーダル対応へ","summary":"OpenAIがGPT-4を発表。画像も読めるようになり、司法試験など多くの試験で人間の上位層に匹敵するスコアを出しました。\n\n一方で技術報告書はモデル規模も学習データも非公開。競争と安全性を理由に、オープンな研究文化から距離を置いた点も話題になりました。同じ月にGoogle BardやAnthropicのClaudeも登場し(企業と資本レイヤー)、1週間後には開発一時停止を求める公開書簡(社会と規制レイヤー)。アクセルとブレーキが同時に踏まれた月です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: GPT-4 Research","url":"https://openai.com/index/gpt-4-research/"}]},{"date":"2023-03-22","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"✋ 「巨大AI実験の一時停止」を求める公開書簡","summary":"「GPT-4を超えるAIの開発を6か月止めよう」。Future of Life Instituteの公開書簡に、著名な研究者や経営者が署名しました。GPT-4公開のわずか8日後のことです。\n\n実際に止めた企業はゼロで、投資も開発もむしろ加速。それでも、AIのリスクを一般の議論の場に引き上げ、同年10月の米大統領令や11月の英国AI安全サミットなど、各国政府の動きを後押ししたと言われています。","detail":null,"credibility":"unverified","credibility_note":"署名者数(3万人超とされる)は主催団体の集計で、第三者によるチェックはされていません。","sources":[{"title":"Future of Life Institute: Pause Giant AI Experiments: An Open Letter","url":"https://futureoflife.org/open-letter/pause-giant-ai-experiments/"}]},{"date":"2023-10-30","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"🏛️ 米国でAIに関する大統領令14110号に署名","summary":"バイデン大統領が「安全で信頼できるAI」の大統領令に署名。計算量のしきい値を基準に、大規模モデルの開発者へ安全性テスト結果の報告を求めました。米国初の包括的なAI政策です。\n\nEUのAI Actが大詰めだった時期と重なり、大西洋の両側で規制づくりが並走しました。ただしこの大統領令、2025年1月の政権交代直後に撤回されます。規制の方向性が政治で変わることを示す例にもなりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Executive Order 14110: Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence","url":null}]},{"date":"2023-11-17","precision":"day","end_date":"2023-11-22","type":"period","layer":"企業と資本","title":"🪑 OpenAI取締役会がアルトマンCEOを解任、5日後に復帰","summary":"OpenAIの取締役会がサム・アルトマンCEOを電撃解任。従業員の大量離反表明とMicrosoftの介入を経て、たった5日で復帰しました。\n\n非営利の理念にもとづく統治と、巨額資本を受け入れた事業の間の緊張が一気に表面化した出来事です。取締役会は再編され、実質的に企業としての路線が優先される結果に。前月に米大統領令、同月に英国AI安全サミットという時期で、AI企業の「中の統治」が世界のニュースになった5日間でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: OpenAI announces leadership transition (2023-11-17)","url":"https://openai.com/index/openai-announces-leadership-transition/"}]},{"date":"2024-03-13","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"🇪🇺 欧州議会がAI Actを可決","summary":"欧州議会が世界初の包括的AI規制「AI Act」を可決。2021年の提案時にはなかった汎用AI(GPAI)への透明性義務は、ChatGPT以後の変化(技術レイヤー)を受けて追加されたものです。\n\n理事会の承認を経て2024年8月1日に発効し、禁止事項→汎用AI義務→高リスク義務の順で段階的に適用されます。企業と資本レイヤーでは、規制コストを理由に欧州でのサービス提供を遅らせる会社も出てきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2024/1689 (AI Act)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"date":"2024-08-01","precision":"day","end_date":"2026-08-02","type":"period","layer":"社会と規制","title":"EU AI Actの段階的適用期間","summary":"⏳ AI Actは一気に効力を持つのではなく、禁止事項(2025年2月)→汎用AIモデル義務(2025年8月)→高リスク義務(2026年8月)と、2年かけて段階的に適用されていきます。\n\nその間、企業と資本レイヤーでは適用延期を求めるロビー活動が続き、技術レイヤーではモデルが数か月単位で更新される状況に。**「規制の時間」と「技術の時間」の速度差**がいちばんよく見える期間で、この年表の終点でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2024/1689 (AI Act) 第113条 適用期日","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"date":"2025-01-20","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🐋 DeepSeek-R1公開、低コスト推論モデルの衝撃","summary":"中国のDeepSeekが推論特化モデルR1をオープンウェイトで公開。「少ない計算資源で最先端に迫る性能」と主張し、世界を驚かせました。\n\n米国の輸出規制(社会と規制レイヤー)でGPUの入手が制限される中での成果とされ、**「計算資源の量が競争力を決める」という前提を揺さぶりました**。1週間後にはNVIDIA株が急落(企業と資本レイヤー)。オープンウェイト戦略が地政学的な意味を持つことも見せつけました。","detail":null,"credibility":"disputed","credibility_note":"「学習コストは数百万ドル規模」という話は自社発表がもとで、どこまで含めた金額か(最終学習だけか、研究開発ぜんぶか)をめぐって見方が分かれています。","sources":[{"title":"arXiv: DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning (2501.12948)","url":"https://arxiv.org/abs/2501.12948"}]},{"date":"2025-01-21","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"🏗️ 「Stargate」構想発表、最大5000億ドルのAIインフラ投資","summary":"OpenAI・SoftBank・Oracleらが、米国内にAIデータセンターを建設する合弁「Stargate」を発表。投資規模は4年間で最大5000億ドルです。\n\n政権交代の翌日にホワイトハウスで発表され、AIインフラが国家プロジェクトとして扱われることを印象づけました。同じ週にDeepSeek-R1(技術レイヤー)が「少ない計算資源」で注目されていたのが、なんとも対照的。電力とデータセンターの立地が新しい争点になっていきます。","detail":null,"credibility":"unverified","credibility_note":"5000億ドルはあくまで「表明額」です。実際にいくら集まっていつ投資されるかは、発表時点では決まっていません。","sources":[{"title":"OpenAI: Announcing The Stargate Project","url":"https://openai.com/index/announcing-the-stargate-project/"}]},{"date":"2025-01-27","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"📉 NVIDIA株が急落、時価総額が1日で約6000億ドル減","summary":"DeepSeekの低コスト主張を受けて、NVIDIA株が約17%下落。1日の時価総額の減少額(約6000億ドル)としては、米国市場史上最大級とされました。\n\n2012年のAlexNet以来ずっとGPUとともに歩み、生成AIブームで時価総額世界トップ級になっていた同社。この急落は「AI投資は本当に回収できるのか」「計算資源はどれだけ必要なのか」という疑念を映しています。その後株価は回復しましたが、輸出規制(社会と規制レイヤー)をめぐる政策は揺れ続けました。","detail":null,"credibility":"unverified","credibility_note":"減少額は終値ベースの報道による概算で、媒体によって5900億ドル前後と幅があります。","sources":[{"title":"Reuters: Nvidia loses nearly $600 billion in market value (2025-01-27)","url":null}]},{"date":"2025-05-28","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"🗾 日本でAI推進法が成立","summary":"「人工知能関連技術の研究開発・活用の推進に関する法律」が参議院で可決・成立。罰則なし・振興メインの、日本初のAI基本法です。\n\nEUが義務と罰則で臨むのに対し、日本は事業者の協力義務と政府の基本計画が柱の「ソフトロー寄り」。同時期の米国では前政権の大統領令が撤回されていて、主要国の規制スタンスがはっきり分かれた年になりました。企業と資本レイヤーでは、国内データセンター投資の呼び込みが政策目標になっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 人工知能関連技術の研究開発及び活用の推進に関する法律(令和7年)","url":null}]}]},{"slug":"tech-autonomous-driving","title":"🚗 自動運転の現在地","description":"砂漠のレースから死亡事故、法整備、ロボタクシーの商用化まで。技術・産業・制度の3層を重ねて、「もうすぐ実現」と言われ続けた自動運転がいまどこを走っているのかを確かめる年表です。期待も現実も、両方記録します。","category":"technology","language":"ja","start_year":2004,"end_year":2025,"layers":[{"name":"技術開発","color":"blue"},{"name":"産業と提携","color":"orange"},{"name":"制度と社会","color":"teal"}],"events":[{"date":"2004-03-13","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"🏜️ DARPAグランドチャレンジ第1回、完走ゼロ","summary":"DARPAが賞金100万ドルをかけた無人車両の砂漠横断レースを開催しました。約240kmのコースで、最も進んだカーネギーメロン大学の車両でも約12km地点で走行不能。完走はゼロでした。\n\n結果だけ見れば惨敗です。でも、軍用技術の公開コンペに大学や愛好家が集う形式が、人材の裾野を一気に広げました。**自動運転の歴史は公開の失敗から始まった**わけで、この失敗の共有が翌年の躍進を生みます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Grand Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Grand_Challenge"}]},{"date":"2005-10-08","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"🏁 スタンフォードのStanleyが砂漠212kmを完走","summary":"第2回グランドチャレンジで、セバスチャン・スラン率いるスタンフォード大学の「Stanley」が約212kmのコースを6時間53分で走破し優勝しました。5台が完走。前年の完走ゼロからの一変に、現場は沸きました。\n\n勝因は機械学習を制御へ本格導入したこととされ、以後の自動運転開発の技術路線を方向づけます。スランはこの後Googleに移り、自動運転プロジェクト(2009年)を率いることに。競技会が産業の母体になった瞬間です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Grand Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Grand_Challenge"}]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"技術開発","title":"Googleが自動運転車プロジェクトを開始","summary":"Googleがスランらグランドチャレンジ出身の研究者を集め、自動運転車の開発プロジェクトを非公開で始めました。翌2010年に公表され、公道での試験走行距離を着実に積み上げていきます。\n\n自動車メーカーではなくIT企業が本気で参入したことで、自動運転は研究テーマから産業競争へ局面が変わりました。センサーの塊のような試験車両が業界に持ち込んだのは、**走行データの量が競争力を決める**という新しいゲームのルールです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Waymo: Our journey(会社沿革)","url":null}]},{"date":"2014-01-01","precision":"month","end_date":null,"type":"point","layer":"制度と社会","title":"SAEが自動運転レベル0〜5の分類を発行","summary":"米自動車技術会(SAE)が、自動化の程度をレベル0〜5に分ける規格J3016を発行しました。「レベル3」「レベル4」という共通言語が生まれ、各国の法制度も企業の開発目標も、この物差しの上で語られるようになります。\n\n一方で「レベル2はあくまで運転支援」という区分の趣旨は、なかなか一般に浸透しませんでした。後のTesla Autopilotをめぐる誤解と事故(制度と社会レイヤーの2016年)の背景の一つです。分類が先、現実が後という順序が象徴的だと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SAE International: J3016 Taxonomy and Definitions for Terms Related to Driving Automation Systems","url":null}]},{"date":"2015-02-01","precision":"month","end_date":"2021-01-01","type":"period","layer":"産業と提携","title":"Uberの自動運転開発、参入から売却まで","summary":"Uberがカーネギーメロン大学の研究者を大量採用して自動運転部門ATGを設立しました。配車事業の人件費をなくす切り札として巨額を投じ、2016年にはピッツバーグで乗客を乗せた公道試験も始めています。\n\nしかし2018年の死亡事故(制度と社会レイヤー)で試験は停止に。開発の遅れと資金難から、2020年末に部門のAuroraへの売却を発表して撤退しました。**「配車の次」を焦った資本**の躓きは、この分野の難しさを業界に再認識させます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters等によるUber ATG設立(2015)とAuroraへの売却(2020-12)の報道","url":null}]},{"date":"2015-10-14","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"TeslaがAutopilotを配信、運転支援の大衆化","summary":"Teslaがソフトウェア更新でModel Sに「Autopilot」を配信しました。高速道路での車線維持と自動操舵が市販車へ一斉に解放され、オーナーは一夜にして「半自動運転」を体験することになります。\n\n無線更新(OTA)で機能が増える手法はクルマの常識を変えました。ただ、機能名と実態(レベル2の運転支援)の乖離への批判は当初から強かったです。**「できること」と「任せてよいこと」の混同**という問題が、ここで社会に持ち込まれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Tesla: Your Autopilot has arrived (2015-10-14)","url":null}]},{"date":"2016-05-07","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"Autopilot使用中の初の死亡事故","summary":"米フロリダ州で、Autopilot使用中のModel Sが交差進行するトレーラーの側面に衝突し、運転者が亡くなりました。明るい空を背にした白い車体を識別できなかったとされ、運転支援中の死亡事故として世界的に報じられます。\n\n米当局の調査は、制度の側が実走行データと向き合う最初の機会になりました。システムの限界と運転者の過信という論点がここで確立します。Autopilot配信(2015年)から半年余りで、社会は代償の議論を始めることになりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NHTSA: ODI調査報告 PE16-007 (2017-01)","url":null}]},{"date":"2016-12-13","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"Google自動運転部門がWaymoとして独立","summary":"Googleの自動運転プロジェクトが「Waymo」として分社化し、Alphabet傘下の事業会社になりました。研究段階の終了と事業化の開始を告げる再編です。\n\n「自家用車は作らず、自動運転技術を磨く」路線を明確にし、クライスラーやジャガーとの提携で車両を調達する水平分業を選びました。7年の先行投資(技術開発レイヤー)を収益に変える長い道のりがここから始まり、2018年のWaymo Oneへつながっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Waymo","url":"https://en.wikipedia.org/wiki/Waymo"}]},{"date":"2018-03-18","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"Uber試験車が歩行者死亡事故、業界に衝撃","summary":"米アリゾナ州テンピで、Uberの自動運転試験車が道路を横断中の歩行者をはね、死亡させました。自動運転試験車による世界初の歩行者死亡事故です。\n\n国家運輸安全委員会(NTSB)は、システムが歩行者を直前まで正しく分類できず、監視役の運転者も画面を注視していたと認定しました。各社が公道試験を一時停止し、州による緩い誘致競争を含む**「実験場としての公道」**の是非が問われます。楽観の時代の終わりを画す事故でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTSB: Highway Accident Report HWY18MH010","url":null}]},{"date":"2018-12-05","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"Waymo One開始、ロボタクシー商用化の一歩","summary":"Waymoが米アリゾナ州フェニックス郊外で配車サービス「Waymo One」を始め、世界初の商用ロボタクシーと報じられました。\n\nただ、当初の利用者は実証実験の参加者からの移行組に限られ、安全要員も同乗していて、「商用化」の実態には議論がありました。誰でも呼べる完全無人のサービスまでは、さらに2年かかります。**発表の言葉と運行の実態の距離**は、この産業を見るときにいつも確かめたい指標です。","detail":null,"credibility":"disputed","credibility_note":"「世界初の商用サービス」という位置づけは、利用者限定・安全要員同乗という当初の運行実態から議論があります。","sources":[{"title":"Waymo: Waymo One launch (2018-12-05)","url":null}]},{"date":"2020-04-01","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"日本でレベル3を認める改正法が施行","summary":"改正道路交通法と改正道路運送車両法が施行され、一定条件下でシステムに運転を委ねるレベル3の自動運転が、日本の公道で法的に可能になりました。世界に先駆けた法整備とされています。\n\n渋滞時の高速道路などに限り、システムが運転主体になることを認める内容です。翌2021年のホンダ・レジェンド(技術開発レイヤー)で実車が実現しました。技術より先に制度が枠を用意した点で、州任せの誘致競争が続く米国とは対照的な進め方です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国土交通省: 改正道路運送車両法・改正道路交通法の施行について (2020-04)","url":null}]},{"date":"2020-10-08","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"🚕 Waymo、完全無人のロボタクシーを一般開放","summary":"Waymoが米フェニックスで、安全要員が同乗しない完全無人のロボタクシーを一般利用者に開放しました。誰でもアプリで無人車を呼べる状態が、世界で初めて日常になった瞬間です。\n\nDARPAの砂漠(2004年)から16年での到達点ですが、対象は詳細な地図を整備済みの限られた地域だけ。「どこでも走れる」への道はまだ遠く、地域限定で確実に動かす路線と、量産車で一気に広げる路線(Tesla)の分岐がはっきりしました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Waymo: Expanded fully driverless service in Phoenix (2020-10)","url":null}]},{"date":"2021-03-05","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"ホンダ、世界初のレベル3市販車を発売","summary":"ホンダが渋滞時に運転をシステムへ委ねられる「トラフィックジャムパイロット」搭載のレジェンドを100台限定でリース販売しました。国土交通省の型式指定を受けた、世界初のレベル3市販車です。\n\n2020年の法整備(制度と社会レイヤー)が用意した枠に、技術がきちんとはまった制度先行型の成果でした。一方で作動条件は高速道路の渋滞時に限られ、台数も限定的。レベル3の普及は、世界的にも緩やかなままです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"本田技研工業: レジェンド(Honda SENSING Elite搭載)発売 (2021-03-05)","url":null}]},{"date":"2023-04-01","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"日本でレベル4の運行許可制度が施行","summary":"改正道路交通法が施行され、特定の条件下で運転者不在の自動運行を認める「特定自動運行」の許可制度が始まりました。翌月には福井県永平寺町の移動サービスが全国初の許可を受けています。\n\n推進力になったのは、過疎地の移動手段の確保という日本固有の課題です。都市のロボタクシー(米国)とは違う、低速・限定路線からの社会実装が選ばれました。制度が描く自動運転の姿は国によってここまで違う、という好例だと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"警察庁: 特定自動運行に係る許可制度の施行 (2023-04)","url":null}]},{"date":"2023-08-10","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"サンフランシスコで24時間ロボタクシー認可","summary":"カリフォルニア州公益事業委員会(CPUC)がWaymoとCruiseに、サンフランシスコ全域での24時間の有償ロボタクシー運行を認可しました。大都市での本格商用化に道を開く決定です。\n\n一方で消防・警察からは緊急車両の妨害事例が報告され、公聴会は賛否で紛糾しました。認可からわずか2か月後にはCruiseの事故(同レイヤー)が起きます。**都市が実験台になることへの合意**は、まだもろいものだと示されました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"CPUC: Decision authorizing expanded driverless AV service in San Francisco (2023-08-10)","url":null}]},{"date":"2023-10-02","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"Cruise車両が歩行者引きずり事故、許可停止へ","summary":"サンフランシスコで、他車にはねられた歩行者がCruiseの無人車両の下に巻き込まれ、車両が路肩へ移動する際に約6m引きずられる事故が起きました。州当局は同社が事故映像を完全には開示しなかったとして、同月末に無人運行の許可を停止します。\n\n事故そのもの以上に、事後対応と情報開示の不備が信頼問題として扱われた点が重要です。全米展開を急いだ同社の路線は、ここから撤回に追い込まれていきます(産業と提携レイヤー)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"カリフォルニア州DMV: Cruiseの無人運行許可停止に関する発表 (2023-10-24)","url":null}]},{"date":"2024-12-10","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"GMがCruiseのロボタクシー事業から撤退","summary":"GMがCruiseへの資金拠出を打ち切り、ロボタクシー事業からの撤退を発表しました。累計100億ドル規模を投じたとされる事業は、技術を市販車の運転支援システムへ転用する形で幕を下ろします。\n\n理由とされたのは、事故(2023年)後の信頼失墜と資金負担の重さです。自動車メーカー本体がロボタクシー事業を抱えることの難しさを示しました。市場は先行するWaymoと、量産車アプローチのTeslaへ整理されていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GM: Cruiseロボタクシー事業からの撤退発表 (2024-12-10)","url":null}]},{"date":"2025-05-01","precision":"month","end_date":null,"type":"point","layer":"産業と提携","title":"Waymo、有償乗車1000万回到達と拡大を発表","summary":"Waymoが累計の有償乗車回数1000万回への到達を発表しました。フェニックス、サンフランシスコ、ロサンゼルスなどで週25万回を超える無人乗車を提供しているとし、対象都市のさらなる拡大も表明しています。\n\n数字はいずれも同社の公表値ですが、ロボタクシーが一部の都市で日常の足になりつつあるのは確かです。2004年に砂漠で12kmしか走れなかった技術が、21年かけてようやく「現在地」と呼べる場所に立ちました。","detail":null,"credibility":"unverified","credibility_note":"乗車回数・週間回数はWaymoの自社発表で、第三者機関による検証済みの統計はありません。","sources":[{"title":"Waymo: 10 million paid rides milestone (2025)","url":null}]},{"date":"2025-06-22","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"Teslaがオースティンでロボタクシー試験開始","summary":"Teslaが米テキサス州オースティンで、招待制のロボタクシーサービスを始めました。車両はModel Y、助手席に安全監視員が同乗する限定的な運行と報じられています。\n\nカメラのみで高精度地図に頼らない同社の路線が、公道サービスに到達した節目です。ただ「無人」の程度や運行範囲は報道により差があり、発表と実態の検証はここでも続きます。**「もうすぐ」と言われ続けた約束**がどの水準で果たされるのか、見届けたい局面です。","detail":null,"credibility":"disputed","credibility_note":"運行の無人性・地理的範囲・監視員の役割は報道により記述が分かれ、公式な運行実績の開示も限定的です。","sources":[{"title":"Reuters: Tesla launches robotaxi service in Austin (2025-06-22)","url":null}]}]},{"slug":"tech-blockchain","title":"⛓️ ブロックチェーンの興亡","description":"Bitcoin論文からEthereum、ICOブーム、相次ぐ取引所事件とFTX破綻、そしてETF承認と法制化まで。ネットの祭りと冬を何度も見てきた視点で、技術・市場と資本・規制と事件の3層から熱狂と崩壊のくり返しをゆるく追う年表です ⛓️","category":"technology","language":"ja","start_year":2008,"end_year":2025,"layers":[{"name":"技術","color":"blue"},{"name":"市場と資本","color":"gold"},{"name":"規制と事件","color":"pink"}],"events":[{"date":"2008-10-31","precision":"day","end_date":null,"type":"point","layer":"技術","title":"⛓️ Bitcoin論文「P2P電子通貨システム」公開","summary":"サトシ・ナカモトを名乗る誰かが暗号学メーリングリストに9ページの論文を投稿し、中央管理者なしで二重支払いを防ぐ仕組みを示しました。リーマン・ブラザーズ破綻から約1か月半後という時期で、金融機関への不信が背景にあったとよく語られます。\n\nProof of Workによる合意形成と公開台帳という設計は、後のEthereum(技術)や無数の暗号資産の原型に。投稿主の正体は今も不明で、規制と事件レイヤーの騒動の多くも、この匿名性に根っこがあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcoin: A Peer-to-Peer Electronic Cash System","url":"https://bitcoin.org/bitcoin.pdf"}]},{"date":"2009-01-03","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🌱 Bitcoinのジェネシスブロック生成","summary":"Bitcoinネットワークの最初のブロックが生成され、稼働開始。ブロックに埋め込まれた英紙の見出し「Chancellor on brink of second bailout for banks」は、金融危機下の既存金融への批評と読まれています。\n\n当初は暗号学者や愛好家の実験にすぎず、市場価格すら存在しませんでした。1年半後のピザ取引(市場と資本)で初めて実物との交換価値がつき、価格を持つ資産としての歴史が始まります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin","url":"https://en.wikipedia.org/wiki/Bitcoin"}]},{"date":"2010-05-22","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"🍕 1万BTCでピザ2枚、初の実物取引","summary":"フロリダのプログラマーが1万BTCと引き換えにピザ2枚を受け取ったと掲示板に報告。Bitcoin最初の商取引として知られ、当時の1万BTCは約41ドル相当でした。後年の価格だと数億ドルに相当し、「ビットコイン・ピザ・デー」として毎年ネタにされています!\
