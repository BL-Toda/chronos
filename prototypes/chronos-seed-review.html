で公開。多数のコンテナを自動で配置・復旧する仕組みを誰でも使えるようにした。\n\n後に中立団体CNCFへ移管され、AWS・Microsoft・Googleのすべてが対応する事実上の標準となった。**激しく競争する市場の土台が共有のオープンソースになる**という、クラウド時代特有の構図を象徴する出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kubernetes","url":"https://en.wikipedia.org/wiki/Kubernetes"}]},{"date":"2014-11-13","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"AWS Lambda発表、サーバーレスの登場","summary":"AWSが、イベント発生時だけコードを実行する「AWS Lambda」を発表。サーバーの存在自体を意識しない「サーバーレス」という新しい抽象化を提示した。\n\n物理サーバーから仮想マシン、コンテナ、そして関数へと、借りる単位は細分化を続けてきた。その到達点であり、ミリ秒単位の従量課金は「所有から利用へ」の流れの極致といえる。運用人員を持てない小さなチームの選択肢を広げ、利用者レイヤーの裾野をさらに広げた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"AWS: AWS Lambda発表 (re:Invent 2014)","url":null}]},{"date":"2015-04-23","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"AmazonがAWSの業績を初開示、高収益に衝撃","summary":"Amazonが四半期決算でAWS部門の業績を初めて開示。売上高は四半期で15億ドルを超え、営業利益率は小売事業を大きく上回り、「副業」と見られていたクラウドが同社の利益の柱であることが判明した。\n\n市場の評価は一変し、Amazon株は急伸。競合他社の投資判断にも影響を与え、クラウドが**利益率の高い本命事業**であることが公式の数字で裏付けられた瞬間である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon.com: Q1 2015 決算発表 (2015-04-23)","url":null}]},{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"利用者と社会","title":"Netflixがクラウド完全移行を完了","summary":"Netflixが7年がかりの取り組みを経て、自社データセンターを閉じ、配信事業の基盤をAWSへ完全移行したと発表した。世界190か国への同時展開を、クラウドの伸縮性が支えた。\n\n大規模サービスでも自前設備なしで運営できることを示した代表例であり、「クラウドは本番システムには不向き」という残っていた慎重論をほぼ終わらせた。障害を前提に設計する同社の手法(カオスエンジニアリング)も業界標準に影響を与えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Netflix Tech Blog: Completing the Netflix Cloud Migration (2016-02)","url":null}]},{"date":"2018-10-28","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"IBMがRed Hatを340億ドルで買収発表","summary":"IBMがオープンソース大手Red Hatを約340億ドルで買収すると発表。同社史上最大の買収であり、複数のクラウドをまたいで運用する「ハイブリッドクラウド」に活路を求めた。\n\n上位3社に離された老舗が、単独の基盤競争ではなく**「どのクラウドも使う企業」の側に立つ**戦略へ転じた形である。買収額の大きさは、クラウド市場の勝敗がIT業界の勢力図を塗り替えつつあったことを物語る。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IBM Newsroom: IBM To Acquire Red Hat (2018-10-28)","url":null}]},{"date":"2019-10-25","precision":"day","end_date":"2021-07-06","type":"period","layer":"企業競争","title":"国防総省JEDI契約、係争の末に白紙へ","summary":"米国防総省の最大100億ドルのクラウド契約「JEDI」がMicrosoftに授与された。本命視されたAmazonは政治的介入があったと主張して提訴し、履行が止まったまま、2021年7月に国防総省は契約自体を取り消した。\n\n後継のJWCC契約は複数社への分割発注となり、巨大調達を単独ベンダーへ委ねる方式は事実上終わった。クラウドが国家の中枢インフラとなり、その調達が政治問題になる時代を示した係争である。","detail":null,"credibility":"disputed","credibility_note":"Amazonが主張した当時の大統領による選定への介入の有無は、司法手続きで確定認定に至っていない。","sources":[{"title":"米国防総省: JEDI契約の取消し発表 (2021-07-06)","url":null}]},{"date":"2020-03-01","precision":"month","end_date":"2021-03-31","type":"period","layer":"利用者と社会","title":"コロナ禍で在宅勤務、クラウド需要が急増","summary":"新型コロナウイルスの感染拡大で在宅勤務やオンライン授業が一斉に始まり、ビデオ会議や仮想デスクトップなど、クラウド経由のサービス利用が急増した。調査会社はこの期間のクラウド支出の伸びを前年比3割超と推定した。\n\n「必要になったら数日で拡張できる」性質が社会機能の維持を支え、クラウドは**平時の効率化の道具から有事の社会インフラ**へと位置づけを変えた。各国の行政デジタル化(利用者と社会レイヤー)も、この経験が押し出した。","detail":null,"credibility":"unverified","credibility_note":"クラウド支出の伸び率はCanalys等の調査会社の推定で、算定方法により数値に幅がある。","sources":[{"title":"Canalys: Global cloud services market(2020年各四半期レポート)","url":null}]},{"date":"2021-09-01","precision":"day","end_date":null,"type":"point","layer":"利用者と社会","title":"デジタル庁発足、ガバメントクラウド整備へ","summary":"日本でデジタル庁が発足し、国と自治体の情報システムを共通のクラウド基盤に載せる「ガバメントクラウド」の整備が始まった。初年度の対象にはAWSとGoogle Cloudが選定された。\n\nコロナ禍で露呈した行政デジタル化の遅れへの制度的な回答である。一方で選定が海外勢に偏ったことは国内産業界に議論を呼び、クラウドをめぐる経済安全保障の論点を日本でも顕在化させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁: ガバメントクラウドの概要と対象クラウドサービスの選定 (2021)","url":null}]},{"date":"2021-12-07","precision":"day","end_date":null,"type":"point","layer":"利用者と社会","title":"AWS大規模障害、依存の深さが可視化","summary":"AWSの米東部リージョン(us-east-1)で大規模障害が発生し、物流システムから動画配信、スマート家電まで広範なサービスが数時間停止した。\n\n15年かけて社会の土台となったクラウドの集中リスクを、多くの人が生活の不便として初めて体感した出来事である。複数リージョンや複数クラウドへの分散設計の必要が改めて叫ばれたが、少数の事業者に計算資源が集中する構造自体は変わっておらず、本年表の締めくくりにふさわしい問いを残した。","detail":null,"credibility":"unverified","credibility_note":"影響を受けたサービス・企業の全容は公的な集計がなく、報道と各社の個別発表に基づく。","sources":[{"title":"AWS: Summary of the AWS Service Event in the Northern Virginia (US-EAST-1) Region (2021-12)","url":null}]}]},{"slug":"tech-cybersecurity","title":"サイバーセキュリティの進化","description":"Morrisワームからランサムウェアの産業化まで。攻撃と脅威・防御と技術・法と国家の3層を重ね、個人の悪戯だった攻撃が国家戦と社会インフラの問題へ拡大する過程を追う。","category":"technology","language":"ja","start_year":1986,"end_year":2024,"layers":[{"name":"攻撃と脅威","color":"pink"},{"name":"防御と技術","color":"blue"},{"name":"法と国家","color":"teal"}],"events":[{"date":"1986-10-01","precision":"month","end_date":null,"type":"point","layer":"法と国家","title":"米国でコンピュータ詐欺濫用法(CFAA)成立","summary":"権限のないコンピュータへのアクセスを連邦犯罪と定めるコンピュータ詐欺濫用法が米国で成立した。映画「ウォー・ゲーム」が象徴したハッカーへの社会不安を背景に、サイバー犯罪を裁く初の本格的な法枠組みとなった。\n\nまだ大きな実害が出る前に法が先行した珍しい例で、2年後のMorrisワーム(攻撃と脅威レイヤー)はこの法律による最初の重要判例を生む。「不正アクセス」の定義の広さは、今日まで論争が続いている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Computer Fraud and Abuse Act","url":"https://en.wikipedia.org/wiki/Computer_Fraud_and_Abuse_Act"}]},{"date":"1988-11-02","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"Morrisワーム、インターネットを初めて麻痺させる","summary":"コーネル大学の大学院生ロバート・モリスが放った自己増殖プログラムが、当時のインターネット接続機の約1割にあたる推定6000台を停止させた。悪意より実験目的だったとされるが、被害は全米に及んだ。\n\n**ネットワークそのものが攻撃の媒介になる**ことを初めて示した事件であり、対応組織CERT/CCの設立(防御と技術レイヤー)を直接生んだ。モリスはCFAAによる最初期の有罪判決を受け、法と技術の追いかけ合いが始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Morris worm","url":"https://en.wikipedia.org/wiki/Morris_worm"}]},{"date":"1991-06-01","precision":"month","end_date":null,"type":"point","layer":"防御と技術","title":"PGP公開、強い暗号が市民の手に","summary":"フィル・ジマーマンが公開鍵暗号を誰でも使えるメール暗号化ソフトPGPを無償公開した。軍事技術と扱われてきた強い暗号が、初めて一般市民の手に渡った。\n\n米政府は暗号の輸出規制違反としてジマーマンを捜査し、「暗号戦争」と呼ばれる政府と技術者の対立(法と国家レイヤー)が始まった。捜査は後に打ち切られ、この対立の構図は2013年のスノーデン事件を経て現在の暗号化論争まで続いている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pretty Good Privacy","url":"https://en.wikipedia.org/wiki/Pretty_Good_Privacy"}]},{"date":"2000-05-04","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"ILOVEYOUワームが世界数千万台に感染","summary":"「ILOVEYOU」という件名のメールで広がるワームがフィリピンから放たれ、数時間で世界の数千万台に感染した。被害総額は数十億ドルから100億ドル超と推計され、各国の政府機関や企業がメールシステムを停止した。\n\n人の心理を突いて開封させる手口は、後のフィッシングの原型といえる。作成者は当時のフィリピンに処罰法がなく訴追されず、各国にサイバー犯罪立法(法と国家レイヤー)を急がせる契機となった。","detail":null,"credibility":"unverified","credibility_note":"感染台数・被害総額はいずれもセキュリティ企業等の推計で、集計方法により大きな幅がある。","sources":[{"title":"Wikipedia: ILOVEYOU","url":"https://en.wikipedia.org/wiki/ILOVEYOU"}]},{"date":"2007-04-27","precision":"day","end_date":"2007-05-18","type":"period","layer":"攻撃と脅威","title":"エストニアに大規模サイバー攻撃","summary":"ソ連兵士像の移設をめぐるロシアとの対立を背景に、エストニアの政府・銀行・報道機関のサイトが約3週間にわたり大規模なDDoS攻撃を受けた。電子政府先進国の行政サービスが断続的に停止した。\n\n**国家全体が攻撃対象になった**初の事例と位置づけられ、翌年NATOはタリンにサイバー防衛協力センターを設立(法と国家レイヤー)した。国家間攻撃の交戦規定を論じる「タリン・マニュアル」もここから生まれた。","detail":null,"credibility":"disputed","credibility_note":"ロシア政府の関与は状況証拠から広く疑われているが、公式には立証されておらず帰属が確定していない。","sources":[{"title":"Wikipedia: 2007 cyberattacks on Estonia","url":"https://en.wikipedia.org/wiki/2007_cyberattacks_on_Estonia"}]},{"date":"2010-06-01","precision":"month","end_date":null,"type":"point","layer":"攻撃と脅威","title":"Stuxnet発見、物理設備を破壊したマルウェア","summary":"イランのウラン濃縮施設の遠心分離機を狙ったマルウェアStuxnetが発見された。制御システムに潜り込み、正常値を装いながら遠心分離機を破壊するという、前例のない精密さを持っていた。\n\n**コードが物理世界を破壊した**初の事例とされ、報道では米国とイスラエルの共同作戦と伝えられている。サイバー攻撃が外交・軍事の手段であることが公然の事実となり、各国の攻撃能力開発(法と国家レイヤー)が加速した。","detail":null,"credibility":"disputed","credibility_note":"米国・イスラエルの関与は複数の報道と研究者の分析に基づくもので、両政府とも公式には認めていない。","sources":[{"title":"Wikipedia: Stuxnet","url":"https://en.wikipedia.org/wiki/Stuxnet"}]},{"date":"2013-06-01","precision":"month","end_date":null,"type":"point","layer":"法と国家","title":"スノーデンがNSAの大規模監視を告発","summary":"元NSA契約職員エドワード・スノーデンが、米政府による通信の大規模収集プログラムの内部文書を暴露した。同盟国の首脳や一般市民の通信までが収集対象だったことが明らかになった。\n\n敵は犯罪者だけでなく**自国の政府でもあり得る**という認識が広がり、通信の常時暗号化(防御と技術レイヤー)が業界標準へと一気に進んだ。プライバシーと安全保障のバランスをめぐる議論の前提を変えた告発である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edward Snowden","url":"https://en.wikipedia.org/wiki/Edward_Snowden"}]},{"date":"2014-11-06","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"日本でサイバーセキュリティ基本法が成立","summary":"サイバーセキュリティ政策の基本理念と国・重要インフラ事業者の責務を定める基本法が成立した。内閣サイバーセキュリティセンター(NISC)が法定組織となり、司令塔機能が整備された。\n\n政府機関への標的型攻撃の増加と2020年東京五輪の招致決定が立法を後押しした。翌年の日本年金機構の情報流出(攻撃と脅威レイヤー)は、この体制が最初に直面した大規模事案となり、法改正による監視対象の拡大につながった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"サイバーセキュリティ基本法(平成26年法律第104号)","url":null}]},{"date":"2015-06-01","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"日本年金機構から125万件の年金情報が流出","summary":"日本年金機構が標的型メール攻撃を受け、氏名・基礎年金番号など約125万件の個人情報が流出したと発表した。職員が添付ファイルを開いたことを起点に、内部ネットワークへ侵入された。\n\n日本の公的機関を狙った標的型攻撃の深刻さを国民に知らしめた事案であり、成立直後のサイバーセキュリティ基本法(法と国家レイヤー)の下で初の大規模検証が行われた。マイナンバー制度開始前夜という時期も、行政のセキュリティ議論を加速させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本年金機構: 不正アクセスによる情報流出事案について (2015年6月)","url":null}]},{"date":"2015-12-03","precision":"day","end_date":null,"type":"point","layer":"防御と技術","title":"Let's Encryptが公開ベータ、常時HTTPS時代へ","summary":"無料でサーバー証明書を自動発行する認証局Let's Encryptが公開ベータを開始した。年間数万円の費用と煩雑な手続きを要した通信の暗号化が、誰でも無料で自動化できるようになった。\n\nスノーデンの告発(法と国家レイヤー)後に高まった暗号化の要請を、費用の壁を壊すことで実装した取り組みである。主要ブラウザの後押しもあり、ウェブの暗号化率は数年で過半から9割超へ達し、**平文の通信が例外になる**時代を作った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Let's Encrypt","url":"https://en.wikipedia.org/wiki/Let%27s_Encrypt"}]},{"date":"2017-05-12","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"WannaCryが世界150か国を襲う","summary":"ランサムウェアWannaCryが150か国の推定20万台以上に感染し、英国では国民保健サービス(NHS)の病院が診療停止に追い込まれた。感染に使われた脆弱性攻撃ツールは、NSAから流出したものだった。\n\n国家の攻撃ツールが流出して犯罪者と他国に使われるという、攻撃能力の拡散(法と国家レイヤー)の危うさを示した。米英政府は後に北朝鮮の犯行と公式に非難し、身代金要求型の攻撃が医療という人命に関わる領域へ達した事件でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: WannaCry ransomware attack","url":"https://en.wikipedia.org/wiki/WannaCry_ransomware_attack"}]},{"date":"2020-12-13","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"SolarWinds事件、供給網攻撃の衝撃","summary":"米SolarWinds社の運用管理ソフトの更新プログラムにバックドアが仕込まれ、同ソフトを導入する米政府機関や大手企業など約1万8000組織に配布されていたことが発覚した。米政府はロシア対外情報庁(SVR)の関与を指摘した。\n\n信頼して受け取る正規のアップデート自体が攻撃経路となるサプライチェーン攻撃の代表例となり、ソフトウェア部品表(SBOM)の義務化など翌年の米大統領令(法と国家レイヤー)に直結した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2020 United States federal government data breach","url":"https://en.wikipedia.org/wiki/2020_United_States_federal_government_data_breach"}]},{"date":"2021-05-07","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"Colonial Pipelineがランサムウェアで停止","summary":"米東海岸の燃料供給の約45%を担うパイプラインがランサムウェア攻撃を受け、5日間の操業停止に追い込まれた。ガソリンの買いだめが起き、複数の州が非常事態を宣言した。同社は身代金約440万ドルを支払ったと認めた。\n\n**ランサムウェアが社会インフラを人質に取った**事件として、サイバー犯罪を国家安全保障問題へ格上げした。犯行グループRaaS(サービス化された攻撃)の分業構造も注目され、米政府の対応(法と国家レイヤー)が一変する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Colonial Pipeline ransomware attack","url":"https://en.wikipedia.org/wiki/Colonial_Pipeline_ransomware_attack"}]},{"date":"2021-05-12","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"米大統領令14028、ゼロトラストを国家方針に","summary":"バイデン大統領がサイバーセキュリティ強化の大統領令に署名した。連邦政府機関へのゼロトラスト・アーキテクチャ導入、多要素認証の義務化、ソフトウェア部品表(SBOM)の整備などを求める包括的な内容である。\n\nColonial Pipeline停止のわずか5日後、SolarWinds事件(攻撃と脅威レイヤー)の半年後という時期が示すとおり、相次ぐ実害への直接の応答だった。「境界の内側は信用する」という従来の防御思想の公式な転換点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Executive Order 14028: Improving the Nation's Cybersecurity (2021-05-12)","url":null}]},{"date":"2022-02-24","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"ウクライナ侵攻、サイバー戦が実戦の一部に","summary":"ロシアのウクライナ全面侵攻の直前、ウクライナ軍も利用する衛星通信網Viasatがワイパー型マルウェアで妨害された。EUと米英は後にロシアの犯行と公式に認定した。\n\n物理侵攻とサイバー攻撃が統合されたハイブリッド戦が現実となった一方、ウクライナ側もIT義勇軍や民間クラウドへのデータ退避(防御と技術レイヤー)で対抗し、民間企業が戦争の当事者に近い役割を担う前例のない構図が生まれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EU理事会: Viasatへのサイバー攻撃に関するロシア非難声明 (2022-05-10)","url":null}]},{"date":"2023-07-01","precision":"month","end_date":null,"type":"point","layer":"攻撃と脅威","title":"生成AIを悪用する攻撃ツールの出現が報告","summary":"フィッシングメール作成やマルウェア作成支援をうたう「WormGPT」「FraudGPT」などの生成AIツールが闇市場で売買されていると、セキュリティ研究者が相次いで報告した。\n\n流暢な文面のフィッシングを誰でも量産できるようになり、不自然な日本語で見分けるといった従来の注意喚起が通用しにくくなった。防御側も検知への生成AI活用(防御と技術レイヤー)を進めており、AIをめぐる攻防の入口にあたる。","detail":null,"credibility":"unverified","credibility_note":"これらのツールの実際の性能と流通規模はセキュリティ企業の報告に基づくもので、誇大宣伝の可能性も指摘されている。","sources":[{"title":"SlashNext: WormGPT – The Generative AI Tool Cybercriminals Are Using (2023-07)","url":null}]},{"date":"2024-02-20","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"国際共同捜査がLockBitの基盤を摘発","summary":"英国家犯罪対策庁と米FBIなど10か国の共同捜査「オペレーション・クロノス」が、世界最大級のランサムウェア組織LockBitの攻撃基盤を差し押さえ、リークサイトを押収したと発表した。\n\n匿名性を盾にしてきた攻撃組織に対し、国境を越えた法執行の連合で応じる段階に入ったことを示す。ただし組織は数日で活動再開を宣言しており、基盤の摘発と犯人の逮捕の間にある壁も同時に露呈した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"英国家犯罪対策庁(NCA): Operation Cronos発表 (2024-02-20)","url":null}]},{"date":"2024-06-08","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"KADOKAWAへのランサムウェア攻撃でニコニコ動画停止","summary":"KADOKAWAグループがランサムウェア攻撃を受け、ニコニコ動画をはじめとするサービスが長期間停止した。出版・経理システムにも障害が及び、後に約25万人分の個人情報の流出が確認された。\n\n日本のコンテンツ産業を代表する企業が数か月にわたり機能不全に陥り、ランサムウェア被害の深刻さを日本社会に印象づけた。復旧過程の情報開示のあり方や、身代金交渉をめぐる報道の是非など、事後対応の論点(法と国家レイヤー)も多く残した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"KADOKAWA: 不正アクセスに関するお知らせ・調査結果 (2024年)","url":null}]},{"date":"2024-07-19","precision":"day","end_date":null,"type":"point","layer":"防御と技術","title":"CrowdStrike更新不具合で世界的システム障害","summary":"セキュリティ企業CrowdStrikeの検知ソフトの更新プログラム不具合により、世界のWindows端末約850万台がブルースクリーンで起動不能になった。空港・病院・銀行が停止し、航空便は数千便が欠航した。\n\n攻撃ではなく**防御ソフトそのものが単一障害点**となった皮肉な事件で、少数のベンダーへの依存が生む集中リスクを露呈した。カーネルへの深いアクセスを持つ防御手法の是非という、防御と技術レイヤーの設計論争を引き起こした。","detail":null,"credibility":"unverified","credibility_note":"影響台数850万台はMicrosoftの推計であり、実際の影響範囲の全体像は確定していない。","sources":[{"title":"CrowdStrike: Falcon Content Update Remediation and Guidance Hub (2024-07)","url":null}]},{"date":"2024-08-13","precision":"day","end_date":null,"type":"point","layer":"防御と技術","title":"NISTがポスト量子暗号の最初の標準を発表","summary":"米国立標準技術研究所(NIST)が、量子コンピュータでも解読困難な暗号方式の最初の連邦標準3件(FIPS 203/204/205)を発表した。約8年の国際公募と評価を経た成果である。\n\n将来の量子計算機で現在の暗号が破られる前に、いま流れている通信を守るための移行が始まった。「今のうちに暗号文を集めて後で解読する」攻撃(攻撃と脅威レイヤー)への備えでもあり、防御が初めて攻撃の実現より先回りした事例といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NIST: Post-Quantum Cryptography Project","url":"https://csrc.nist.gov/projects/post-quantum-cryptography"}]}]},{"slug":"tech-edtech","title":"EdTechが変える教育","description":"無料公開講義の理想からコロナ禍の一斉オンライン化、AI家庭教師まで。サービス・制度・資本の3層を重ね、テクノロジーが教育の何を変え、何が変わらなかったのかを検証する年表。","category":"technology","language":"ja","start_year":2001,"end_year":2025,"layers":[{"name":"技術とサービス","color":"blue"},{"name":"制度と教育現場","color":"teal"},{"name":"産業と資本","color":"orange"}],"events":[{"date":"2001-04-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"MITが講義教材の無料公開OCWを発表","summary":"マサチューセッツ工科大学が、ほぼすべての講義教材をウェブで無償公開するOpenCourseWare(OCW)構想を発表した。「教育をオープンにする」という宣言は世界の大学に衝撃を与えた。\n\n商用eラーニングの模索が続くなかで、最高峰の大学が知識の無償公開を選んだ意味は大きい。後のオープン教材(OER)運動とMOOCの思想的な源流であり、日本でも2005年に主要大学によるJOCWが発足した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"MIT News: MIT to make nearly all course materials available free on the World Wide Web (2001-04)","url":null}]},{"date":"2008-01-01","precision":"year","end_date":null,"type":"point","layer":"技術とサービス","title":"カーンアカデミー設立、動画で学ぶ形を確立","summary":"サルマン・カーンが、親戚の子への算数指導用に作ったYouTube動画を母体として非営利のカーンアカデミーを設立した。短い解説動画と練習問題を無料で提供するモデルを確立した。\n\n「授業を動画で予習し、教室では演習する」という反転授業の議論を世界に広め、財団の支援を受けて成長した。営利スタートアップが主導する後年のEdTech産業に対し、非営利・無料という対極のモデルを示し続ける存在である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Khan Academy: About","url":"https://www.khanacademy.org/about"}]},{"date":"2012-01-01","precision":"year","end_date":null,"type":"point","layer":"技術とサービス","title":"「MOOC元年」、大学講義が数十万人に開かれる","summary":"スタンフォード発のCourseraとUdacity、MITとハーバードが設立したedXが相次いで開講し、大学講義を誰でも無料受講できるMOOCが爆発的な注目を集めた。米紙はこの年を「MOOCの年」と呼んだ。\n\n数十万人規模の登録者は「大学の終わり」論まで呼んだが、後の研究で修了率が数%にとどまることが示され、期待は急速に収縮する。**理想の規模と学びの完遂の落差**という、本年表を貫く主題の最初の実例である。","detail":null,"credibility":"disputed","credibility_note":"登録者数は各社の自社発表で、修了率も研究により数%から十数%と推計に幅がある。","sources":[{"title":"The New York Times: The Year of the MOOC (2012-11)","url":null}]},{"date":"2019-12-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"日本がGIGAスクール構想を開始","summary":"文部科学省が、児童生徒1人1台の学習端末と高速ネットワークを全国の小中学校に整備するGIGAスクール構想を打ち出し、補正予算が計上された。当初は2023年度までの整備計画だった。\n\n直後のコロナ禍で計画は大幅に前倒しされ、OECD調査で最下位級とされた日本の学校ICT環境は数年で一変する。危機が制度を動かした典型例だが、端末が行き渡った後に「何にどう使うか」という課題が現場に残された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: GIGAスクール構想の実現について","url":null}]},{"date":"2020-03-01","precision":"month","end_date":"2021-08-31","type":"period","layer":"制度と教育現場","title":"世界規模の学校閉鎖、オンライン学習へ一斉移行","summary":"新型コロナウイルスの感染拡大で世界の大半の国が休校措置をとり、ピーク時には世界の学習者の9割超・約16億人が影響を受けたとUNESCOは推計した。授業は突如としてオンラインに移行した。\n\nZoomやGoogle Classroomが事実上の公共インフラとなり、EdTechの利用は数年分跳ね上がった。一方で端末や通信環境の有無による**学習機会の格差**が世界中で可視化され、テクノロジーは格差を埋めるのか広げるのかという問いを残した。","detail":null,"credibility":"unverified","credibility_note":"影響を受けた学習者数はUNESCOの推計であり、各国の報告基準によって数値は変動する。","sources":[{"title":"UNESCO: Education - From COVID-19 school closures to recovery","url":null}]},{"date":"2021-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と資本","title":"世界のEdTech投資が過去最高の200億ドル規模に","summary":"コロナ禍の需要急増を受け、2021年の世界のEdTechベンチャー投資は調査会社の推計で200億ドル規模と過去最高に達した。インドと中国の大型資金調達が全体を牽引した。\n\nオンライン学習の恒久的な定着を見込んだ資金流入だったが、翌年以降は対面回帰と金利上昇で投資額は急減する。**需要の先食い**だったことが後から判明し、高い評価額で調達した企業ほど深い調整を迫られることになった。","detail":null,"credibility":"unverified","credibility_note":"投資額はHolonIQなど調査会社の推計で、集計範囲により数値が異なる。","sources":[{"title":"HolonIQ: Global EdTech Venture Capital Report","url":null}]},{"date":"2021-07-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"中国が「双減」政策で学習塾産業を事実上解体","summary":"中国政府が、義務教育段階の学科系学習塾に非営利化や新規認可停止などを課す「双減」政策を発表した。急成長していたオンライン教育企業の株価は暴落し、世界最大の教育産業は事実上解体された。\n\n史上最大級のEdTech市場が政策一つで消えた出来事であり、教育サービスが**国家の教育方針の従属変数**であることを最も鮮烈に示した。行き場を失った投資マネー(産業と資本レイヤー)は、以後インドや東南アジアへ向かう。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中共中央弁公庁・国務院弁公庁「双減」に関する意見 (2021-07)","url":null}]},{"date":"2022-03-01","precision":"month","end_date":null,"type":"point","layer":"産業と資本","title":"Byju'sが評価額220億ドル、世界最大のEdTechに","summary":"インドのByju'sが資金調達で評価額220億ドルと報じられ、世界で最も企業価値の高いEdTech企業となった。広告攻勢と相次ぐ買収でインドの国民的サービスと目されていた。\n\nしかしコロナ特需の反動と決算監査の遅延で信用は急速に崩れ、2年後には債権者から破産手続を申し立てられるに至る。EdTechバブルの頂点と崩壊をわずか数年で体現した、時代の象徴といえる企業である。","detail":null,"credibility":"disputed","credibility_note":"評価額220億ドルは資金調達時の報道ベースの数値で、その後の評価下落の幅にも諸説がある。","sources":[{"title":"Reuters・Bloomberg報道 (2022)","url":null}]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"ChatGPT公開、宿題とレポートの前提を揺るがす","summary":"OpenAIの対話型AIが公開され、レポート作成や問題演習を数秒で代行できることが教育界を直撃した。公開から数週間で学生の利用が広がり、剽窃検出ツール各社は対応を迫られた。\n\n「答えを出す機械」の登場は、宿題・試験・評価という学校の基本装置(制度と教育現場レイヤー)の前提を揺るがした。禁止か活用かの論争が世界の教室で始まり、以後の教育とAIをめぐるすべての議論の起点となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: Introducing ChatGPT","url":"https://openai.com/index/chatgpt/"}]},{"date":"2023-01-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"NY市教育局がChatGPTを遮断、4か月で方針転換","summary":"全米最大の学区であるニューヨーク市教育局が、学校のネットワークと端末からChatGPTへのアクセスを遮断した。学習への悪影響と不正利用への懸念が理由とされた。\n\nしかし同年5月には方針を撤回し、AIリテラシー教育の推進へと転じる。**禁止から共存への転回**をわずか4か月で経験したこの学区の迷走は、その後世界中の教育行政が辿ることになる道筋の縮図だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ニューヨーク市教育局発表・Chalkbeat報道 (2023-01, 2023-05)","url":null}]},{"date":"2023-03-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"カーンアカデミーがAI家庭教師Khanmigoを発表","summary":"カーンアカデミーがGPT-4を組み込んだAI家庭教師「Khanmigo」を発表した。答えを直接教えず、対話を通じて生徒自身の思考を促すソクラテス式の設計を掲げている。\n\nChatGPT遮断(制度と教育現場レイヤー)と同時期に、非営利の老舗が「正しく使う」形を示した対比が鮮やかである。1対1の個別指導は集団授業より大幅に効果が高いという「ブルームの2シグマ問題」への、AIによる挑戦と位置づけられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Khan Academy発表 (2023-03)","url":null}]},{"date":"2023-05-02","precision":"day","end_date":null,"type":"point","layer":"産業と資本","title":"Chegg株が1日で約半値に、AIが収益を直撃","summary":"宿題支援サービス大手Cheggの株価が1日で約48%下落した。ChatGPTの影響で新規契約の伸びが鈍化していると経営陣が決算発表で認めたことが引き金となった。\n\n生成AIが既存EdTech企業の収益を直接破壊しうることを、資本市場が織り込んだ最初の事例である。「AIに置き換えられる側」と「AIを組み込む側」の選別が始まり、教育関連株はAI戦略の説得力で評価される時代に入った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2023-05-02)","url":null}]},{"date":"2023-07-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"UNESCOが学校でのスマートフォン規制を提言","summary":"UNESCOが世界教育モニタリングレポートで、学習の妨げになる場合には学校でのスマートフォン使用を禁止すべきだと提言した。テクノロジー導入は人間中心の視点で判断すべきだと警鐘を鳴らした。\n\nデジタル化を推進してきた国際機関自身による軌道修正であり、各国で相次いだ学校スマホ禁止立法と呼応する。EdTechの学習効果に関する**独立した証拠の乏しさ**への指摘は、業界全体への根本的な問いとなっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNESCO: Global Education Monitoring Report 2023 - Technology in education","url":null}]},{"date":"2024-04-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"日本の小中学校で英語のデジタル教科書を本格導入","summary":"2024年度から全国の小学5年から中学3年の英語で、紙の教科書と併用する形のデジタル教科書の提供が始まった。GIGAスクール構想で整備された1人1台端末がその前提となっている。\n\n端末整備(2019年〜)から日常活用への移行を示す節目だが、視力や学習定着への影響を懸念する声も根強く、当面は紙との併用が続く。制度が慎重に歩む間にも、生徒の学びはAIアプリ(技術とサービスレイヤー)へ先に流れている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 学習者用デジタル教科書について","url":null}]},{"date":"2024-07-01","precision":"month","end_date":null,"type":"point","layer":"産業と資本","title":"Byju'sに破産手続き開始、バブルの象徴が転落","summary":"インドの会社法審判所が、スポンサー料未払いを申し立てたインドクリケット協会の訴えを認め、Byju'sの破産手続き開始を決定した。評価額220億ドルとされた企業は2年で法的整理の入口に立った。\n\n過大な広告費、強引な販売手法、ガバナンスの不全が崩壊の内因とされ、コロナ特需を実力と誤認した業界全体への教訓となった。資本の熱狂と教育の成果は別物であることを、最も高い代償で示した事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2024-07)","url":null}]},{"date":"2025-07-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"ChatGPTに「学習モード」、答えを教えないAIへ","summary":"OpenAIがChatGPTに、答えを直接示さず対話を通じて理解へ導く「study mode」を追加した。学生による丸写し利用への批判が続くなかでの、汎用AI側からの応答である。\n\nKhanmigoが先行した「ソクラテス式AI」の設計思想が汎用チャットAIにも標準搭載された形で、教育専用サービスと汎用AIの境界は一段と曖昧になった。宿題の代行者から**学びの伴走者**へ、教育におけるAIの立ち位置の再定義が進んでいる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI発表 (2025-07)","url":null}]}]},{"slug":"tech-fintech","title":"フィンテックの破壊力","description":"モバイル送金から暗号資産、スマホ時代の銀行取り付けまで。技術は金融の何を壊し、何を壊せなかったのか。サービス・既存金融・規制の3層で破壊と吸収の20年を追う。","category":"technology","language":"ja","start_year":2007,"end_year":2025,"layers":[{"name":"技術とサービス","color":"blue"},{"name":"既存金融と資本","color":"orange"},{"name":"規制と社会","color":"teal"}],"events":[{"date":"2007-03-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"ケニアでM-Pesa開始、銀行なしの送金インフラに","summary":"ケニアの通信会社サファリコムが、携帯電話のショートメッセージを使った送金サービスM-Pesaを開始した。銀行口座を持たない人々が、現金を電子的に送り、受け取れるようになった。\n\n銀行網の外側から金融アクセスを一気に広げた代表例で、金融包摂というフィンテックの原点を示す。後の途上国モバイルマネーやQR決済の先行モデルとなり、規制当局も「銀行免許なしで営まれる金融」への対応を迫られた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Safaricom/Vodafone発表・GSMA調査 (2007)","url":null}]},{"date":"2008-10-31","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"ビットコイン論文公開","summary":"サトシ・ナカモト名義の論文「Bitcoin: A Peer-to-Peer Electronic Cash System」が暗号技術のメーリングリストで公開され、中央管理者なしに二重支払いを防ぐ電子通貨の仕組みが示された。\n\nリーマン・ブラザーズ破綻の翌月という時期は象徴的で、既存金融(既存金融と資本レイヤー)への不信がこの構想の受け皿となった。翌年1月に最初のブロックが生成され、以後の暗号資産のすべてがここから派生する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcoin: A Peer-to-Peer Electronic Cash System (原論文)","url":"https://bitcoin.org/bitcoin.pdf"}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"Stripe公開、オンライン決済がAPI数行になる","summary":"米Stripeが開発者向けの決済APIを一般公開した。加盟店契約や審査に数週間かかっていたカード決済の導入が、ウェブサイトに数行のコードを書くだけで済むようになった。\n\n**決済のインフラ化**はECやSaaSの起業コストを大きく下げ、その後のプラットフォーム経済の裏方となった。既存金融レイヤーから見れば、カード網の上に乗りながら顧客接点だけを奪っていく新種の存在の登場だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Stripe公式発表 (2011-09)","url":null}]},{"date":"2014-01-01","precision":"year","end_date":"2018-12-31","type":"period","layer":"技術とサービス","title":"中国でQR決済が日常インフラ化","summary":"アリペイとWeChat Payの二強が、屋台の支払いから公共料金までQRコード決済を浸透させた。この間に中国のモバイル決済取引額は数十兆元規模へ拡大したと推計されている。\n\nカード社会を経ずに現金からスマホへ跳んだ「リープフロッグ」の代表例である。決済データが信用スコアや少額投資の入口になることを世界に示し、各国のスーパーアプリ構想と規制議論(規制と社会レイヤー)の参照点となった。","detail":null,"credibility":"unverified","credibility_note":"取引額は中国人民銀行統計や調査会社の推計に基づくもので、集計範囲によって数値が大きく異なる。","sources":[{"title":"中国人民銀行「支付体系運行総体情況」各年版","url":null}]},{"date":"2014-02-28","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"マウントゴックス破綻、暗号資産規制の原点に","summary":"世界最大級のビットコイン交換所だった東京のマウントゴックスが民事再生法の適用を申請した。約85万BTCの消失が公表され、利用者資産の保全が世界的な問題として噴出した。\n\nこの事件を機に日本は交換業者の登録制を導入し、世界に先んじて暗号資産を法制度に取り込む道を選ぶ。**破綻が規制を生む**というフィンテック史の反復パターンの、最初の大きな実例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本経済新聞・Reuters報道 (2014-02-28)","url":null}]},{"date":"2015-10-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"EUが決済サービス指令PSD2を可決","summary":"欧州議会が改定決済サービス指令(PSD2)を可決した。銀行に対し、顧客の同意を前提に口座情報や決済機能を外部事業者へAPIで開放することを義務づける内容である。\n\n銀行が独占してきた口座データを競争基盤として開放させる「オープンバンキング」の法的出発点であり、規制が破壊を後押しした珍しい例といえる。英国の同名制度や日本の銀行法改正など、各国制度の雛形となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Directive (EU) 2015/2366 (PSD2)","url":"https://eur-lex.europa.eu/eli/dir/2015/2366/oj"}]},{"date":"2018-12-04","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"PayPayの「100億円あげちゃうキャンペーン」","summary":"ソフトバンクとヤフーが立ち上げたPayPayが、決済額の20%を還元する大型キャンペーンを開始し、わずか10日で還元原資100億円を使い切った。日本のQR決済の認知を一気に押し上げたとされる。\n\n現金志向の強い日本市場に、巨額の販促でユーザーの行動変容を買うプラットフォーム型の戦略が持ち込まれた出来事である。翌年の消費増税に伴うポイント還元事業(規制と社会レイヤー)と重なり、キャッシュレス比率は以後上昇を続けた。","detail":null,"credibility":"unverified","credibility_note":"キャンペーンの実施は事実だが、利用者獲得数や認知への効果は同社発表と調査会社推計に基づき、独立した検証はない。","sources":[{"title":"PayPay報道発表 (2018-12)","url":null}]},{"date":"2019-06-18","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"FacebookがLibra構想を発表","summary":"Facebook(現Meta)が、複数の通貨建て資産で裏付けるグローバルデジタル通貨Libraの構想を発表した。世界20億人超の利用者基盤に金融を載せる計画に、各国の規制当局と中央銀行が一斉に警戒を示した。\n\n構想は縮小と改名(Diem)を経て2022年に消滅したが、**民間企業が通貨そのものに手を伸ばした**衝撃は大きく、各国の中央銀行デジタル通貨(CBDC)研究とステーブルコイン規制を加速させた。挫折が制度を動かした例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Libra白書 (2019-06)","url":null}]},{"date":"2021-01-28","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"ゲームストップ株騒動、Robinhoodが購入制限","summary":"掲示板Redditに集った個人投資家が空売りの多いゲームストップ株を買い上げて株価が急騰。手数料無料の株取引アプリRobinhoodが同株の新規購入を一時制限し、後に米議会の公聴会にまで発展した。\n\nスマホ証券が掲げた「投資の民主化」と、その足元の脆さが同時に露呈した事件である。購入制限の背景には清算機関への預託金という既存金融レイヤーの仕組みがあり、新興サービスも旧来インフラの上に立つ事実を示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米下院金融サービス委員会公聴会記録 (2021-02)","url":null}]},{"date":"2021-04-14","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"Coinbaseがナスダック上場","summary":"米最大の暗号資産交換所Coinbaseがナスダックに直接上場し、時価総額は一時1,000億ドル近くに達した。暗号資産企業として初めての大型上場となった。\n\n既存金融の破壊を掲げた企業が、伝統的な資本市場の作法で資金調達をする構図は、**破壊と制度への吸収が同時に進む**というフィンテックの性格をよく示している。この上場を頂点とする強気相場は、翌年の連鎖破綻で暗転することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2021-04-14)","url":null}]},{"date":"2021-09-07","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"エルサルバドルがビットコインを法定通貨に","summary":"エルサルバドルが世界で初めてビットコインを法定通貨とする法律を施行した。国民向けウォレット「Chivo」を配布し、事業者には受け入れを義務づけた。\n\n国家が暗号資産を通貨制度へ組み込む最初の実験だったが、その後の調査では国民の利用低迷が繰り返し報告され、IMFも見直しを勧告し続けた。2025年には受け入れ義務が撤廃され、実験は大幅に後退した。","detail":null,"credibility":"disputed","credibility_note":"法律の施行は事実だが、国民の利用実態は学術調査・世論調査ベースで報告され、数値には幅がある。","sources":[{"title":"NBER Working Paper: Are Cryptocurrencies Currencies? Bitcoin as Legal Tender in El Salvador","url":null}]},{"date":"2022-05-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"ステーブルコインTerraUSD崩壊","summary":"アルゴリズム型ステーブルコインTerraUSD(UST)が米ドルとの連動を失い、姉妹通貨LUNAとともに数日でほぼ無価値となった。消失した時価総額は400億ドル規模と推計される。\n\n「アルゴリズムで価値を保つ」という設計の破綻は貸付業者やファンドの連鎖倒産を招き、半年後のFTX破綻への導火線となった。各国のステーブルコイン規制(規制と社会レイヤー)が一気に具体化する直接の契機である。","detail":null,"credibility":"disputed","credibility_note":"消失額の推計は集計時点と対象範囲により数百億ドル規模の幅がある。","sources":[{"title":"Reuters・Bloomberg報道 (2022-05)","url":null}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"FTX破綻","summary":"世界2位級の暗号資産交換所FTXが、顧客資産の流用疑惑の表面化から10日足らずで連邦破産法11条を申請した。創業者サム・バンクマン=フリードは後に詐欺罪で有罪となった。\n\n著名投資家や機関投資家まで巻き込んだ崩壊は、**規制の空白地帯に築かれた信用の脆さ**を露呈させた。皮肉にも破綻処理は伝統的な裁判所と会計専門家の手に委ねられ、暗号資産業界への規制導入論を決定づけた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FTX連邦破産法11条申請・米司法省発表 (2022-11)","url":null}]},{"date":"2023-03-10","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"シリコンバレー銀行破綻、スマホ時代の取り付け","summary":"スタートアップ業界の主要銀行だったシリコンバレー銀行(SVB)が破綻した。SNSでの不安拡散とモバイルバンキングにより預金流出は1日で420億ドル規模に達したとされ、史上最速級の取り付けと呼ばれた。\n\nフィンテックが磨いた「即時に動くカネ」が、預金は簡単に逃げないという既存銀行の前提を崩した事件である。破壊の技術は新興企業だけでなく**銀行制度そのものの弱点**にもなり得ることを示し、預金保険と規制の再設計論を呼んだ。","detail":null,"credibility":"disputed","credibility_note":"流出額・速度は当局発表と報道に基づくが、「史上最速の取り付け」という比較には定義上の異論がある。","sources":[{"title":"FDIC・カリフォルニア州金融保護革新局発表 (2023-03-10)","url":null}]},{"date":"2023-06-01","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"日本で改正資金決済法施行、ステーブルコインを制度化","summary":"改正資金決済法が施行され、法定通貨建てステーブルコインが「電子決済手段」として定義された。発行者を銀行・資金移動業者・信託会社に限定する、世界でも先行する包括的な制度である。\n\nマウントゴックス以来の「事件が先、制度が後」という順序から、**制度を先に整えて市場を待つ**姿勢への転換点といえる。2025年には国内初の円建てステーブルコインが登場し、送金・決済インフラとしての実験段階に入った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"金融庁: 資金決済法等の改正について (2023)","url":null}]},{"date":"2023-07-20","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"米FRBが即時決済網FedNowを稼働","summary":"米連邦準備制度が、24時間365日稼働する銀行間の即時送金インフラFedNowの運用を開始した。数日かかることもあった米国内送金が、ようやくリアルタイム化への一歩を踏み出した。\n\n英国の即時決済や日本の全銀システム24時間化など各国の流れに続く動きで、フィンテックが生んだ「即時性」への需要に中央銀行側が応えた形である。**土台のインフラを更新して破壊者を吸収する**、既存側の対応の典型といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Federal Reserve発表 (2023-07-20)","url":null}]},{"date":"2024-01-10","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"米SECがビットコイン現物ETFを一括承認","summary":"米証券取引委員会(SEC)が11本のビットコイン現物ETFを一括で承認し、翌日から取引が始まった。10年にわたり申請却下が続いてきた歴史が、裁判所の判断を経て覆った形である。\n\nブラックロックなど伝統的な資産運用最大手が暗号資産への窓口となり、破壊者として出発した資産が既存金融の商品棚に収まった。反体制の思想から生まれたビットコインの制度化として、本年表の一つの到達点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米SEC発表・声明 (2024-01-10)","url":null}]},{"date":"2025-07-18","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"米国でステーブルコイン規制法(GENIUS法)成立","summary":"決済用ステーブルコインの発行者に準備資産の全額保有と開示を義務づけるGENIUS法が米国で成立した。連邦レベルでは初となる包括的な暗号資産関連法である。\n\nLibra(2019年)への警戒から始まった議論が、6年を経て「排除ではなく制度化」へ着地した。ドル建てステーブルコインの普及を通じたドルの地位維持という狙いも指摘されており、規制そのものが競争戦略の色彩を帯びる段階に入った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米ホワイトハウス・連邦議会発表 (2025-07)","url":null}]}]},{"slug":"tech-mobile-revolution","title":"モバイル革命の全体像","description":"iモードのモバイルネットからiPhone登場、アプリ経済圏の拡大、そして巨大プラットフォームへの規制まで。端末技術・アプリとビジネス・社会と制度の3層で、スマートフォンが生活の基盤になるまでを追う。","category":"technology","language":"ja","start_year":1999,"end_year":2026,"layers":[{"name":"技術と端末","color":"blue"},{"name":"アプリとビジネス","color":"orange"},{"name":"社会と制度","color":"green"}],"events":[{"date":"1999-02-22","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"NTTドコモがiモードを開始","summary":"NTTドコモが携帯電話からメールとウェブサイトを利用できるiモードを開始。着メロや占い、モバイルバンキングなど公式コンテンツへの課金を通信料と合算徴収する月額課金の仕組みで、モバイルコンテンツ市場を築いた。\n\nこの仕組みは、後のApp Storeが整えた**「小額課金の経済圏」を先取りした**ものと評される。一方で日本市場が独自進化を遂げたことは、2008年のiPhone上陸(技術と端末レイヤー)後に「ガラパゴス」と呼ばれる転換の背景ともなった。","detail":null,"credibility":"disputed","credibility_note":"「世界初のモバイルインターネットサービス」とする表現は、同時期のWAP等との比較で定義が分かれる。","sources":[{"title":"Wikipedia: i-mode","url":"https://en.wikipedia.org/wiki/I-mode"}]},{"date":"2001-10-01","precision":"day","end_date":"2026-03-31","type":"period","layer":"技術と端末","title":"3G(FOMA)サービスの時代","summary":"NTTドコモが世界初の商用W-CDMAサービスFOMAを開始。テレビ電話や高速パケット通信を掲げて始まった3Gは、当初は端末の電池持ちなどで普及が遅れたが、2000年代半ばに主流となり、2026年3月末の終了まで四半世紀にわたり通信の土台を担った。\n\n2008年のiPhone 3G(技術と端末)、2010年代のLINEやスマホ決済(アプリとビジネス)はいずれも3G以降の通信基盤の上に成立している。停波はスマホ移行の完了を告げる区切りでもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTTドコモ 報道発表: FOMAおよびiモードのサービス終了について(2019年10月29日)","url":null}]},{"date":"2007-01-09","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"AppleがiPhoneを発表","summary":"スティーブ・ジョブズがMacworldでiPhoneを発表。物理キーを廃したマルチタッチの全面タッチスクリーンとデスクトップ級のフルブラウザを備え、同年6月29日に米国で発売された。\n\nこれはiモードに代表される**「携帯向けに縮小されたウェブ」との決別**を意味した。当初はサードパーティのアプリを認めず、翌年のApp Store(アプリとビジネス)開設で経済圏が生まれる。発表当時、世界の携帯端末市場ではNokiaが首位にあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: Apple Reinvents the Phone with iPhone (2007-01-09)","url":"https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/"}]},{"date":"2007-11-05","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"GoogleらがAndroidとOpen Handset Allianceを発表","summary":"Googleと端末・通信34社がオープンソースのモバイルOS「Android」とOpen Handset Allianceを発表。iPhone発表から10か月後に、対抗する開放型の陣営が形成された。\n\nOSを無償で端末メーカーに提供する戦略は、Samsungや中国メーカーの台頭を促し、世界のスマホ出荷台数の大半をAndroidが占める構図をつくった。同時に、検索やアプリストアを通じたGoogleの支配力が、後年のEUデジタル市場法(社会と制度レイヤー)の主要な争点となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Open Handset Alliance: Industry Leaders Announce Open Platform for Mobile Devices (2007-11-05)","url":"https://www.openhandsetalliance.com/press_110507.html"}]},{"date":"2008-07-10","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"App Store開設、アプリ経済圏の始まり","summary":"AppleがiPhone向けApp Storeを開設。約500本のアプリで始まり、開発者への70%配分モデルがアプリ産業の標準となった。iモードの公式サイト課金と異なり、審査を通れば世界中の開発者が同じ条件で配信できる仕組みが、個人開発者から大手までを引き込んだ。\n\n翌日にはiPhone 3Gが日本を含む22か国で発売され(技術と端末)、端末とストアが同時に世界展開された。この**30%手数料は十数年後にEpic訴訟やDMA(社会と制度)で問われる**ことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: iPhone 3G on Sale Tomorrow (2008-07-10)","url":"https://www.apple.com/newsroom/2008/07/10iPhone-3G-on-Sale-Tomorrow/"}]},{"date":"2008-07-11","precision":"day","end_date":"2011-10-14","type":"period","layer":"アプリとビジネス","title":"iPhone 3G日本発売とソフトバンク単独販売期","summary":"iPhone 3Gが日本で発売され、ソフトバンクモバイルが単独で取り扱った。発売日には表参道の店舗に長い行列ができ、2011年10月のau参入まで続いた単独販売期間はソフトバンクの契約者数を押し上げ、通信キャリアの勢力図を変えた。\n\n日本の携帯市場が端末メーカー主導からプラットフォーム主導へ転換する起点であり、iモード全盛の国内でスマホの世帯保有率が1割に満たなかった2010年(社会と制度)を挟む期間である。","detail":null,"credibility":"unverified","credibility_note":"Appleとソフトバンク間の契約内容は非公開で、「独占契約」の存在は当時の報道と販売実態からの推定にとどまる。","sources":[{"title":"ソフトバンクモバイル 報道発表: iPhone 3Gの発売について(2008年)","url":null}]},{"date":"2008-10-22","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"初のAndroid端末「T-Mobile G1」発売","summary":"HTC製の初のAndroid搭載スマートフォン「T-Mobile G1」が米国で発売。物理キーボード付きで、Android Marketも同時に始まった。iPhone 3G発売の3か月後にあたる。\n\n初代Androidは完成度で劣るとの評価も多かったが、複数メーカーへの展開が急速に進み、2010年代初頭には出荷台数でiOSを上回った。日本ではドコモが2009年にHT-03Aとして初のAndroid端末を投入し、iPhoneを持たなかった同社の対抗軸となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: HTC Dream","url":"https://en.wikipedia.org/wiki/HTC_Dream"}]},{"date":"2010-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と制度","title":"日本のスマートフォン世帯保有率は約1割","summary":"総務省の通信利用動向調査で、2010年末時点のスマートフォン世帯保有率は9.7%。携帯電話全体の保有率は9割を超えており、iPhone上陸から2年を経てもなお大半の利用者はフィーチャーフォンを使っていた。\n\nこの年、Instagramが公開され(アプリとビジネス)、ドコモはLTEサービス「Xi」を12月に開始している(技術と端末)。普及の「前夜」にあたり、以後10年で保有率が8割超へ達する急上昇の起点として参照される数値である。","detail":null,"credibility":"unverified","credibility_note":"9.7%は平成22年通信利用動向調査の値として広く引用されるが、調査年版により集計対象や設問が異なるため原資料での確認を推奨する。","sources":[{"title":"総務省: 通信利用動向調査","url":"https://www.soumu.go.jp/johotsusintokei/statistics/statistics05.html"}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"Instagram公開","summary":"写真共有アプリInstagramがiPhone向けに公開。スマホのカメラとSNSを直結させ、モバイル発のサービスが主流になる先駆けとなった。\n\nPC版を持たずモバイル専用で始まった点が象徴的で、スマートフォンが「PCの補助」から「主戦場」へ変わったことを示す。2012年にFacebookが約10億ドルで買収し、アプリ企業の評価額が急騰する時代を印象づけた。同年の日本ではスマホ保有率が1割程度(社会と制度)であり、普及の速度差が読み取れる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"東日本大震災、安否確認にSNSとモバイルが機能","summary":"東日本大震災では通信規制により音声通話がつながりにくい中、パケット通信は比較的つながりやすく、TwitterなどのSNSによる安否確認や情報共有が広く使われてテレビと並ぶ情報源となり、モバイルの社会的役割が認識された。\n\nこの経験は同年6月のLINE誕生(アプリとビジネス)の直接の動機とされ、災害時の連絡手段としてスマホへの移行を後押しした。3Gネットワーク(技術と端末)の混雑と復旧は通信各社の課題として残った。","detail":null,"credibility":"disputed","credibility_note":"SNSが果たした役割の評価は研究により幅があり、デマ拡散の弊害を重く見る見解もある。","sources":[{"title":"総務省: 平成23年版 情報通信白書 東日本大震災における情報通信の状況","url":null}]},{"date":"2011-06-23","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"LINEサービス開始","summary":"NHN Japanがメッセージアプリ「LINE」を公開。震災時の連絡手段の課題(社会と制度)を受けて短期間で開発されたとされ、無料通話とスタンプで急成長し、日本のスマホ利用の中心的なアプリとなった。\n\n電話番号ベースの登録により乗り換えの負担が小さく、**フィーチャーフォン利用者をスマホへ移行させる強い動機**となった。スタンプ販売や公式アカウントによる収益化はiモード時代の課金文化と接続し、日本独自のアプリ経済圏を形づくった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Line (software)","url":"https://en.wikipedia.org/wiki/Line_(software)"}]},{"date":"2013-09-03","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"MicrosoftがNokiaの携帯端末事業を買収すると発表","summary":"かつて世界首位だったNokiaの携帯端末事業を、Microsoftが約72億ドルで取得すると発表。スマホ移行に乗り遅れた旧勢力の退場を象徴した。\n\niPhone発表時に首位だったNokiaは独自OSからWindows Phoneへ転換したが、iOSとAndroidの二強(技術と端末)とアプリの品揃え(アプリとビジネス)の差を埋められなかった。プラットフォームとアプリ経済圏を握った側が勝つという構図が確定した出来事で、同月には日本でドコモがiPhoneの取り扱いを開始している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Microsoft Mobile","url":"https://en.wikipedia.org/wiki/Microsoft_Mobile"}]},{"date":"2013-09-20","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"NTTドコモがiPhone販売を開始","summary":"国内最大手のNTTドコモがiPhone 5s/5cを発売し、国内3キャリアすべてがiPhoneを扱う体制となって日本市場でのiPhone優位が固まった。同日発売のiPhone 5sは指紋認証Touch IDを搭載し、翌年のApple Payにつながる。\n\niモードで独自エコシステムを築いたドコモがiPhoneを受け入れたことは、**キャリア主導からプラットフォーム主導への転換の完了**を意味した。iモード終了(2026年)は既定路線となり、日本のスマホ世帯保有率はこの後も急上昇を続ける(社会と制度)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTTドコモ 報道発表: iPhone 5s/iPhone 5cの発売について(2013年9月)","url":null}]},{"date":"2016-07-22","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"ポケモンGO日本配信、位置情報ゲームが社会現象に","summary":"米国などでの配信から2週間後、日本でもポケモンGOの配信が開始。公園や観光地に人が集まり、スマホが街の使い方を変える様子が可視化された。GPSとカメラを使ったAR体験は、スマホの標準機能(技術と端末)が数億人規模の行動を同時に動かせることを示した。\n\n歩きスマホや私有地への立ち入りが問題となり、自治体や施設が利用ルールを設けるなど、社会の側がスマホ利用に対応を迫られた早い例でもある。任天堂株の急騰(アプリとビジネス)も話題となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pokémon Go","url":"https://en.wikipedia.org/wiki/Pok%C3%A9mon_Go"}]},{"date":"2018-12-04","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"PayPay「100億円あげちゃうキャンペーン」開始","summary":"スマホ決済PayPayが購入額の20%を還元する「100億円あげちゃうキャンペーン」を開始。10日で予算を使い切り、QRコード決済の認知を一気に広げた。中国のAlipayやWeChat Payに倣った決済方式を、巨額の還元で普及させる手法だった。\n\n翌年の消費増税に伴う政府のポイント還元事業(社会と制度)が追い風となり、現金志向の強かった日本でスマホ決済が日常化する転機となった。スマホがサイフになることで、端末(技術と端末)は生活インフラとしての性格を強めた。","detail":null,"credibility":"unverified","credibility_note":"還元総額や終了時点の利用者数はPayPay社の発表に基づき、第三者による検証はない。","sources":[{"title":"PayPay株式会社 プレスリリース: 100億円あげちゃうキャンペーン(2018年)","url":null}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と制度","title":"スマホの世帯保有率が固定電話を上回る","summary":"総務省の通信利用動向調査で、2019年のスマートフォン世帯保有率は83.4%となり、固定電話(69.0%)を初めて上回った。2010年の約1割から10年足らずで8割超に達し、スマホが「電話」の主役の座を固定電話から奪ったことを示す象徴的な数値である。\n\n同時期にPayPayなど決済アプリ(アプリとビジネス)が普及し、翌年のコロナ禍ではCOCOAや給付金申請など行政サービスもスマホ前提で設計されるようになる。5Gの国内商用開始(2020年、技術と端末)も目前だった。","detail":null,"credibility":"disputed","credibility_note":"83.4%と69.0%は令和元年調査の公表値だが、調査年により集計方法が見直されており、経年比較の解釈には注意が必要。","sources":[{"title":"総務省: 令和元年通信利用動向調査の結果","url":"https://www.soumu.go.jp/johotsusintokei/statistics/statistics05.html"}]},{"date":"2020-06-19","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"接触確認アプリCOCOAの提供開始","summary":"厚生労働省が新型コロナ接触確認アプリCOCOAを公開。AppleとGoogleが共同提供したAPIの上に築かれ、公衆衛生施策がスマホ前提となった。国の施策がプラットフォーム企業の提供する仕組み(技術と端末)に依存する構図が明確になった出来事である。\n\nAndroid版の不具合が長期間見過ごされるなど運用面の課題も残した。同時期にリモートワークやオンライン診療が広がり、スマホとアプリ(アプリとビジネス)が生活と行政の接点として不可欠になった年である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 新型コロナウイルス接触確認アプリ(COCOA)","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/cocoa_00138.html"}]},{"date":"2020-08-13","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"Epic GamesがAppleを提訴、App Store手数料をめぐる争い","summary":"フォートナイトに独自決済を導入したEpic GamesがApp Storeから排除され、同日Appleを反トラスト法違反で提訴。2008年のApp Store開設以来の手数料30%と外部決済禁止に対する正面からの挑戦であり、その妥当性が法廷で争われた。\n\n2021年の一審は大半でApple勝訴としつつ外部リンク禁止を違法と判断し、以後の是正命令へつながった。EUのDMAや日本のスマホ新法(社会と制度)と並び、アプリ経済圏の「門番」に対する規制の潮流をつくった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Epic Games v. Apple","url":"https://en.wikipedia.org/wiki/Epic_Games_v._Apple"}]},{"date":"2024-03-07","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"EUデジタル市場法(DMA)の義務が適用開始","summary":"EUデジタル市場法(DMA)に基づく指定ゲートキーパー企業への義務が発効。AppleはEU域内でサードパーティのアプリストアや外部決済を認める対応を迫られ、iPhoneのアプリ配布がApp Store一本に限られてきた16年間の前提が、初めて法律によって変更された。\n\n対象にはGoogle、Meta、Amazonなども含まれ、Android(技術と端末)の検索やストアの既定設定も是正対象となった。Epic訴訟(アプリとビジネス)が問うた論点を、EUは事前規制として立法で解決する道を選んだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Commission: The Digital Markets Act","url":"https://digital-markets-act.ec.europa.eu/"}]},{"date":"2024-06-12","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"日本でスマホソフトウェア競争促進法が成立","summary":"スマホOS・アプリストア・ブラウザ・検索エンジンの提供事業者に、他社ストアの受け入れなどを義務づけるスマホソフトウェア競争促進法が成立。2025年12月に全面施行され、EUのDMAに続き日本もアプリ経済圏(アプリとビジネス)の門番に対する事前規制へ踏み出した。\n\n1999年のiモード以来、**キャリアからプラットフォーム企業へ移った市場支配力に、制度が追いつく**形となる。25年前にiモードで始まった日本のモバイル史が、規制対象としてのスマホという段階に到達したことを示す出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"公正取引委員会: スマートフォンにおいて利用される特定ソフトウェアに係る競争の促進に関する法律","url":null}]}]},{"slug":"tech-quantum-computing","title":"量子コンピュータへの道","description":"1981年のファインマンの着想から誤り訂正の実証まで。理論・ハードウェア・産業・国家戦略の4層を重ね、40年越しの技術がなぜいま実用へ近づいているのかを俯瞰する年表。","category":"technology","language":"ja","start_year":1981,"end_year":2025,"layers":[{"name":"理論とアルゴリズム","color":"purple"},{"name":"ハードウェア実装","color":"blue"},{"name":"産業と投資","color":"orange"},{"name":"国家戦略","color":"teal"}],"events":[{"date":"1981-05-01","precision":"month","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"ファインマンが量子シミュレータを提唱","summary":"MITで開かれた計算物理の会議で、物理学者リチャード・ファインマンが「自然は量子力学的であり、その完全なシミュレーションには量子力学で動く計算機が必要だ」と講演した。\n\n**量子で量子を計算する**という着想がこのとき研究課題として定式化され、量子計算の出発点として広く引用される。以後10年以上、関心は少数の理論家にとどまり、産業や国家戦略の視点はまだ存在しなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"R. P. Feynman, \"Simulating Physics with Computers\", Int. J. Theor. Phys. 21 (1982)","url":null}]},{"date":"1985-01-01","precision":"year","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"ドイチュが万能量子計算機を定式化","summary":"オックスフォード大学のデイヴィッド・ドイチュが、任意の物理系を模倣できる「万能量子チューリング機械」の概念を論文で提示し、量子計算を計算理論の正式な対象に据えた。\n\nファインマンの着想が「原理的に何を計算できるか」という数学の言葉に翻訳された段階であり、後のショアやグローヴァーのアルゴリズムはこの枠組みの上で設計される。実装(ハードウェア実装レイヤー)への道筋はまだ全く見えていなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"D. Deutsch, Proc. R. Soc. Lond. A 400, 97–117 (1985)","url":null}]},{"date":"1994-01-01","precision":"year","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"ショアが素因数分解の量子アルゴリズムを発表","summary":"AT&Tベル研究所のピーター・ショアが、量子計算機なら大きな数の素因数分解を効率的に解けることを示した。素因数分解の困難さはRSAなど公開鍵暗号の安全性の根拠そのものである。\n\n**理論が暗号という現実の利害に直結した**瞬間であり、各国の政府と軍が量子計算に注目する出発点となった。約30年後のポスト量子暗号標準(国家戦略レイヤー)まで続く、長い備えの起点でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer (quant-ph/9508027)","url":"https://arxiv.org/abs/quant-ph/9508027"}]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"グローヴァーの探索アルゴリズム発表","summary":"ベル研究所のロヴ・グローヴァーが、N件のデータからの探索を古典計算の平方根程度の手数で行える量子アルゴリズムを発表した。ショアの指数的な加速に続く、応用範囲の広い二次加速の代表例である。\n\n素因数分解に加えて探索という汎用的な応用が示されたことで、量子アルゴリズム研究は一つの分野として定着した。一方、これらを動かす量子ビット(ハードウェア実装レイヤー)は、この時点ではまだ実験室にも存在しなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: A fast quantum mechanical algorithm for database search (quant-ph/9605043)","url":"https://arxiv.org/abs/quant-ph/9605043"}]},{"date":"1999-04-01","precision":"month","end_date":null,"type":"point","layer":"ハードウェア実装","title":"NECで超伝導量子ビットが初めて動作","summary":"NEC基礎研究所の中村泰信と蔡兆申らが、超伝導回路上の電荷状態を使って量子重ね合わせの制御に成功し、Nature誌に発表した。\n\n**固体の電子回路で量子ビットを作れる**ことを示した成果で、原子や光子が中心だった実装研究の流れを変えた。超伝導方式は後にGoogleやIBM(産業と投資レイヤー)が採用する主流方式へ育ち、日本発の貢献として特筆される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nakamura, Pashkin & Tsai, Nature 398, 786–788 (1999)","url":null}]},{"date":"2011-05-01","precision":"month","end_date":null,"type":"point","layer":"産業と投資","title":"D-Waveが「世界初の商用量子コンピュータ」発売","summary":"カナダのD-Wave Systemsが量子アニーリング方式の「D-Wave One」を発表し、ロッキード・マーティンが購入した。量子計算をうたう装置が初めて商品として売買された出来事である。\n\nただし同機は最適化問題に特化した方式で、量子効果が計算速度に寄与しているかをめぐり長い学術論争が起きた。論争自体が量子計算への産業的関心を広げた面もあり、市場形成の始まりと位置づけられる。","detail":null,"credibility":"disputed","credibility_note":"量子効果による高速化が実際にあったかは学術的に決着しておらず、性能評価が研究者間で分かれる。","sources":[{"title":"Wikipedia: D-Wave Systems","url":"https://en.wikipedia.org/wiki/D-Wave_Systems"}]},{"date":"2016-05-04","precision":"day","end_date":null,"type":"point","layer":"産業と投資","title":"IBMが量子計算機をクラウドで一般公開","summary":"IBMが5量子ビットの実機をクラウド経由で誰でも使える「IBM Quantum Experience」を公開した。研究室の外の開発者や学生が、実際の量子ハードウェアに触れられるようになった。\n\n量子計算機が論文の中の存在から「試せるサービス」へ変わり、開発ツールと人材をめぐるエコシステム競争が始まった。以後、各社によるロードマップ公表と量子ビット数の競争(ハードウェア実装レイヤー)が産業の定番となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IBMニュースリリース: IBM Makes Quantum Computing Available on IBM Cloud (2016-05-04)","url":null}]},{"date":"2016-12-01","precision":"month","end_date":"2024-08-13","type":"period","layer":"国家戦略","title":"NISTがポスト量子暗号の標準化を推進","summary":"米国立標準技術研究所(NIST)が、量子計算機でも破れない暗号方式の公募を開始。世界から提案された方式の評価を約8年かけて進め、2024年8月に最初の標準3件を発表した。\n\n**まだ存在しない計算機に備えて世界の暗号を入れ替える**という異例の事業であり、根拠は1994年のショアのアルゴリズム(理論とアルゴリズムレイヤー)にある。理論から30年がかりで制度が動いた例といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NIST: Post-Quantum Cryptography Project","url":"https://csrc.nist.gov/projects/post-quantum-cryptography"}]},{"date":"2018-12-21","precision":"day","end_date":null,"type":"point","layer":"国家戦略","title":"米国で国家量子イニシアチブ法が成立","summary":"量子情報科学への連邦投資を定める国家量子イニシアチブ法が米国で成立し、5年間で約12億ドルの研究資金と省庁横断の調整体制が整備された。\n\n背景には量子技術を安全保障と経済競争力の問題とみなす認識があり、EUのQuantum Flagshipや中国の大型投資と同時期の動きである。企業の研究開発(産業と投資レイヤー)に対し、国家が資金と方向を与える構図がここで定まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"H.R.6227 National Quantum Initiative Act (Public Law 115-368)","url":null}]},{"date":"2019-10-23","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"Googleが「量子超越性」の達成を発表","summary":"Googleが53量子ビットの超伝導チップSycamoreで特定の乱数サンプリング課題を約200秒で実行し、最速スパコンなら1万年かかるとする論文をNatureに発表した。\n\nIBMは古典計算でも数日で可能と反論し、**「量子超越性」という言葉の意味そのもの**が論争になった。実用性のない課題ではあったが、各国の投資判断(国家戦略レイヤー)や報道に強く影響し、量子への注目を一段引き上げた。","detail":null,"credibility":"disputed","credibility_note":"「スパコンで1万年」という見積もりにはIBMが反論しており、古典計算に対する優位の程度は評価が分かれる。","sources":[{"title":"Nature: Quantum supremacy using a programmable superconducting processor (2019)","url":"https://www.nature.com/articles/s41586-019-1666-5"}]},{"date":"2020-12-03","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"中国の光量子計算機「九章」が優位性を主張","summary":"中国科学技術大学の潘建偉らが、光子を用いる専用機「九章」でガウシアン・ボソンサンプリングを実行し、古典計算機を大幅に上回るとする論文をScienceに発表した。\n\n超伝導方式のGoogleに続く別方式・別国からの優位性主張であり、量子計算が米中の技術競争(国家戦略レイヤー)の文脈で語られる流れを決定づけた。なお後年の古典アルゴリズムの改良により、優位の幅は当初の主張より縮まっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Science: Quantum computational advantage using photons (2020)","url":null}]},{"date":"2021-07-01","precision":"month","end_date":null,"type":"point","layer":"産業と投資","title":"PsiQuantumが4.5億ドル調達、評価額31億ドルと報道","summary":"光量子方式で誤り訂正済みの大規模機を目指す米PsiQuantumが4億5000万ドルの資金調達を発表し、報道では企業評価額が31億ドル超とされた。\n\n実機を公開していない段階での巨額調達であり、量子スタートアップ投資が期待先行で過熱する局面を象徴する。誤り訂正に必要な規模を見積もる理論(理論とアルゴリズムレイヤー)の時間軸と、資本の時間軸のずれが試され始めた。","detail":null,"credibility":"unverified","credibility_note":"評価額31億ドル超は報道ベースの数値で、当事者による公式開示はない。","sources":[{"title":"Reuters: PsiQuantum raises $450 mln (2021-07)","url":null}]},{"date":"2021-10-01","precision":"day","end_date":null,"type":"point","layer":"産業と投資","title":"IonQが上場、量子専業で初の上場企業に","summary":"イオントラップ方式のIonQがSPAC合併を経てニューヨーク証券取引所に上場し、量子計算専業として初の上場企業となった。\n\n収益がほぼない段階での上場は、量子産業が公開市場の資金で長期開発を続けるモデルへ移ったことを示す。以後RigettiやD-Waveも株式市場に続き、株価は各社の技術発表(ハードウェア実装レイヤー)のたびに大きく変動する投機的な値動きを見せるようになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: IonQ","url":"https://en.wikipedia.org/wiki/IonQ"}]},{"date":"2022-10-04","precision":"day","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"量子もつれの実証にノーベル物理学賞","summary":"量子もつれの実在を実験で示したアスペ、クラウザー、ツァイリンガーの3氏にノーベル物理学賞が贈られた。ベルの不等式の破れの検証という、量子情報科学の土台にあたる業績である。\n\n授賞理由に「量子情報科学の開拓」が明記され、かつて哲学論争に近かった基礎研究が、量子計算・量子通信という応用分野の礎として公式に位置づけられた。基礎から産業(産業と投資レイヤー)までの距離の縮まりを示す授賞といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Physics 2022 - Press release","url":"https://www.nobelprize.org/prizes/physics/2022/press-release/"}]},{"date":"2023-03-27","precision":"day","end_date":null,"type":"point","layer":"国家戦略","title":"国産量子コンピュータ初号機が稼働","summary":"理化学研究所が64量子ビットの超伝導量子コンピュータ国産初号機を稼働させ、クラウド経由での外部利用を開始した。1999年に超伝導量子ビットを生んだ国としての蓄積が、実機として結実した。\n\n開発は国のプロジェクトとして大学・企業の連合で進められ、日本も量子を国家戦略技術と位置づけたことを示す。ハードウェア実装レイヤーにおける日本の存在感を再確立する一歩と受け止められた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"理化学研究所プレスリリース: 量子コンピュータ国産初号機の公開 (2023-03-27)","url":null}]},{"date":"2023-12-04","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"IBMが1121量子ビットの「Condor」を発表","summary":"IBMが1121量子ビットの超伝導プロセッサCondorを発表した。同時に、量子ビット数より誤り率の低さを重視した新チップHeronと、誤り訂正を見据えた開発ロードマップの改訂も示した。\n\n数を競う時代が一つの節目に達し、以後の焦点は誤りの少なさと誤り訂正へ移る。この転換は翌年のGoogleによる誤り訂正実証と合わせ、投資家(産業と投資レイヤー)の評価軸も物理量子ビット数から論理量子ビットへと変えていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IBM Quantum Summit 2023 発表 (Condor / Heron)","url":null}]},{"date":"2024-12-09","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"GoogleのWillowが誤り訂正の閾値を突破","summary":"Googleが105量子ビットのチップWillowで、符号を大きくするほど論理誤り率が下がる「閾値以下」の量子誤り訂正を実証したと発表し、Natureに論文が掲載された。\n\n量子ビットを増やすほど誤りも増えるという最大の障壁に対し、**誤り訂正が原理どおりに機能する**ことを実機で示した節目である。発表を受けて量子関連株が急伸(産業と投資レイヤー)し、実用化時期の議論が具体的になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google Blog: Meet Willow, our state-of-the-art quantum chip (2024-12-09)","url":"https://blog.google/technology/research/google-willow-quantum-chip/"}]},{"date":"2025-02-19","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"Microsoftがトポロジカル量子チップを発表","summary":"Microsoftが、マヨラナ粒子に基づくとするトポロジカル量子ビットのチップ「Majorana 1」を発表した。誤りに本質的に強い方式であり、実現すれば大規模化への近道になると同社は主張した。\n\nただしマヨラナ準粒子の観測をめぐっては同社関連の論文撤回が過去にあり、学界からは慎重な検証を求める声が相次いだ。超伝導・イオン・光と並ぶ方式間の競争が、なお決着していないことを示す出来事でもある。","detail":null,"credibility":"disputed","credibility_note":"トポロジカル量子ビットが実際に実現されたかは学界で検証が続いており、評価が定まっていない。","sources":[{"title":"Microsoft発表: Majorana 1 (2025-02-19)","url":null}]},{"date":"2025-04-01","precision":"month","end_date":null,"type":"point","layer":"産業と投資","title":"富士通と理研が256量子ビット機を開発","summary":"富士通と理化学研究所が共同開発した256量子ビットの超伝導量子コンピュータを発表し、企業や研究機関への提供を始めた。2023年の国産初号機から約2年での大規模化である。\n\n国の研究機関と民間企業の共同開発という日本型の体制が継続的に成果を出し始めた例であり、国家戦略レイヤーの投資が産業側の実装能力へ接続しつつある。誤り訂正時代に向けた1000量子ビット級への通過点と位置づけられる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"富士通・理化学研究所 共同プレスリリース (2025年4月)","url":null}]}]},{"slug":"tech-robotics","title":"ロボティクスの夜明け","description":"1961年の産業用ロボットから二足歩行、災害対応、そしてヒューマノイド投資ブームまで。研究・産業・くらしの3層で、ロボットが現場へ出るまでの長い夜明けを辿る。","category":"technology","language":"ja","start_year":1961,"end_year":2024,"layers":[{"name":"研究と技術","color":"blue"},{"name":"産業と市場","color":"orange"},{"name":"社会とくらし","color":"teal"}],"events":[{"date":"1961-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と市場","title":"世界初の産業用ロボットUnimate稼働","summary":"ジョージ・デボルとジョセフ・エンゲルバーガーが開発した「Unimate」がゼネラルモーターズの工場に導入され、ダイカスト部品の搬出という高温で危険な作業を担った。世界初の産業用ロボットとされる。\n\n**人が嫌がる作業から現場に入る**というロボット普及の型はここで確立した。以後20年あまり、ロボットは工場の中で進化を続け、家庭や街に出るのはずっと先のことになる。","detail":null,"credibility":"disputed","credibility_note":"導入年は試験導入の1959年とする資料と本格稼働の1961年とする資料があり、記述が分かれる。","sources":[{"title":"Wikipedia: Unimate","url":"https://en.wikipedia.org/wiki/Unimate"}]},{"date":"1973-01-01","precision":"year","end_date":null,"type":"point","layer":"研究と技術","title":"早稲田大学WABOT-1、世界初の本格人間型ロボット","summary":"早稲田大学の加藤一郎らが、二足で歩き、視覚と対話機能を備えた世界初の本格的な人間型ロボット「WABOT-1」を完成させた。歩行は一歩に数十秒を要する初歩的なものだった。\n\n産業用ロボット(産業と市場レイヤー)が実用の道を歩む一方で、「人の形をした機械」への挑戦は大学の研究室から始まった。この系譜が後のホンダの極秘研究、そしてASIMOへとつながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"早稲田大学ヒューマノイド研究所: WABOTの歴史","url":null}]},{"date":"1980-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と市場","title":"日本で「ロボット普及元年」、生産現場に浸透","summary":"日本で産業用ロボットの導入が急拡大し、1980年は業界で「ロボット普及元年」と呼ばれた。自動車と電機の工場を中心に溶接・塗装・組立への採用が進み、日本は稼働台数で世界最大のロボット大国となっていく。\n\n人手不足と品質競争がロボット化を後押しした構図で、「雇用を奪う機械」ではなく「人手を補う仲間」と受け止められた日本特有の受容(社会とくらしレイヤー)も、この時期に形づくられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本ロボット工業会: 産業用ロボットの歴史","url":null}]},{"date":"1986-01-01","precision":"year","end_date":"1996-12-31","type":"period","layer":"研究と技術","title":"ホンダ、極秘の二足歩行研究からP2公開へ","summary":"ホンダが社内で二足歩行ロボットの研究を極秘に開始。試作機E0からE6、P1を経て、1996年12月に自律歩行する人間型ロボット「P2」を公開し、世界の研究者に衝撃を与えた。\n\n自動車会社が10年黙って基礎研究を続けたという事実自体が驚きをもって受け止められた。**研究室の夢に企業の資本と工学が合流した**期間であり、WABOT以来の学術的な系譜を一気に実用水準へ引き上げ、ASIMOへ結実する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"本田技研工業: ヒューマノイドロボット研究開発の歩み","url":null}]},{"date":"1999-06-01","precision":"day","end_date":null,"type":"point","layer":"社会とくらし","title":"ソニーAIBO発売、ロボットが家庭のペットに","summary":"ソニーが犬型エンタテインメントロボット「AIBO」を発売。25万円という価格ながら、日本向けの3000台はインターネット販売開始から約20分で完売したと発表された。\n\n実用性ではなく**愛着の対象としてのロボット**という市場を初めて成立させた製品であり、「ロボットと暮らす」ことへの日本社会の抵抗の低さを示した。後年、修理サポート終了に際してAIBOの「葬儀」が営まれたことも、この受容の深さを物語る。","detail":null,"credibility":"unverified","credibility_note":"「約20分で3000台完売」はソニーの発表に基づく数字で、第三者による検証はない。","sources":[{"title":"ソニー: AIBO(ERS-110)発売に関する発表 (1999)","url":null}]},{"date":"2000-10-31","precision":"day","end_date":null,"type":"point","layer":"研究と技術","title":"ホンダASIMO公開、二足歩行の到達点","summary":"ホンダが人間型ロボット「ASIMO」を公開。身長120cmへの小型化と滑らかな歩行を実現し、二足歩行ロボットの代名詞として世界に知られる存在となった。\n\nP2公開から4年、研究の系譜が一つの完成形に達した瞬間である。ただし用途は実証と広報にとどまり、量産・実用化には至らないまま2022年に開発の歴史を閉じた。「歩ける」ことと「役に立つ」ことの間の距離は、この分野の一貫した課題であり続ける。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ASIMO","url":"https://en.wikipedia.org/wiki/ASIMO"}]},{"date":"2002-09-01","precision":"month","end_date":null,"type":"point","layer":"社会とくらし","title":"ルンバ発売、掃除ロボットが実用市場を開く","summary":"米iRobotが自動掃除機「Roomba」を199ドルで発売。軍事・研究用ロボットを手がけてきた企業が家庭向けに出した製品は、累計数千万台に達する大ヒットとなった。\n\n人型でも高機能でもなく、床掃除という単機能に絞ったことが成功の鍵で、**形は仕事が決める**という設計思想を示した。二足歩行の研究(研究と技術レイヤー)が注目を集める裏で、実際に家庭へ入ったのは円盤型の機械だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Roomba","url":"https://en.wikipedia.org/wiki/Roomba"}]},{"date":"2004-03-13","precision":"day","end_date":null,"type":"point","layer":"研究と技術","title":"DARPAグランドチャレンジ、完走車ゼロ","summary":"米国防高等研究計画局(DARPA)が賞金100万ドルの無人車両レースを砂漠で開催。約240kmのコースに対し、最長走行は約12kmで完走車はなかった。\n\n「大失敗」と報じられたが、翌2005年の第2回では5台が完走し、進歩の速さを世界に示した。この競技会に集った研究者たちが後の自動運転産業の中核となる。賞金レース方式が研究を加速させた好例であり、移動ロボットの研究が屋外の実環境へ出た節目でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Grand Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Grand_Challenge"}]},{"date":"2005-01-01","precision":"year","end_date":null,"type":"point","layer":"研究と技術","title":"Boston DynamicsのBigDog公開","summary":"Boston DynamicsがDARPA資金による四足歩行ロボット「BigDog」を発表。不整地を歩き、蹴られても姿勢を立て直す動画が広く拡散し、脚式ロボットの可能性を強く印象づけた。\n\n軍用の荷物運搬を想定した研究だったが、エンジン騒音などの理由で配備には至らなかった。一方でこの技術系譜が後のSpot(産業と市場レイヤーでの商用化)につながり、動画公開でロボットが大衆的関心を集める先例にもなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: BigDog","url":"https://en.wikipedia.org/wiki/BigDog"}]},{"date":"2008-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と市場","title":"Universal Robots、初の協働ロボットUR5出荷","summary":"デンマークのUniversal Robotsが軽量アーム「UR5」を初出荷。安全柵で人と隔離するのが常識だった産業用ロボットに対し、人の隣で働ける「協働ロボット」という新しい分類を作った。\n\nプログラミングの簡便さと低価格により、ロボットを導入できる企業の裾野を中小製造業まで広げた。**柵の中から人の隣へ**という変化は、ロボットが工場の外へ出ていく後年の流れ(社会とくらしレイヤー)の前段でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Universal Robots: Company history","url":null}]},{"date":"2011-04-01","precision":"month","end_date":null,"type":"point","layer":"社会とくらし","title":"福島第一原発にロボット投入、災害対応の現実","summary":"東京電力福島第一原子力発電所の事故対応で、米iRobot社のPackBotが原子炉建屋内の放射線量測定などに投入された。ロボット大国を自任してきた日本が、緊急時に即応できる国産ロボットを持たなかったことが課題として突きつけられた。\n\nこの反省が国内の災害対応ロボット研究を再起動させ、米国ではDARPAロボティクス・チャレンジ(研究と技術レイヤー)開催の直接の契機となった。ロボットの価値が問われる場が、展示会から現場へ移った出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IEEE Spectrum: Robots Enter Fukushima Reactor Building (2011)","url":null}]},{"date":"2012-03-19","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"AmazonがKiva Systemsを7.75億ドルで買収","summary":"Amazonが倉庫内搬送ロボットのKiva Systemsを約7億7500万ドルで買収。棚ごと商品を運ぶロボットを物流センターに大量配備し、外販を止めて自社専用とした。\n\n電子商取引の拡大が倉庫の人手不足を深刻化させた時期であり、ロボットが**工場の外の産業現場**を本格的に変え始めた転換点である。物流ロボット市場はこの買収を機に競合の参入が相次ぎ、一大分野へと成長した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Robotics","url":"https://en.wikipedia.org/wiki/Amazon_Robotics"}]},{"date":"2012-04-01","precision":"month","end_date":"2015-06-06","type":"period","layer":"研究と技術","title":"DARPAロボティクス・チャレンジ開催","summary":"福島の事故を受け、DARPAが災害現場でのロボット活用を競う「ロボティクス・チャレンジ」を開始。車両の運転、扉の開閉、瓦礫の歩行などの課題に世界のチームが挑み、2015年6月の決勝では韓国KAISTのDRC-HUBOが優勝した。\n\n決勝で次々と転倒するロボットの映像は技術の現在地を率直に示したが、ここで鍛えられた人材と技術は後のヒューマノイド企業群(産業と市場レイヤー)へ流れ込んだ。災害対応という目的が研究を束ねた稀有な例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Robotics Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Robotics_Challenge"}]},{"date":"2013-12-01","precision":"month","end_date":null,"type":"point","layer":"産業と市場","title":"Googleがロボット企業8社を連続買収","summary":"GoogleがBoston Dynamicsを含むロボット企業8社を相次いで買収したことが報じられた。Androidの生みの親アンディ・ルービンが率いる新事業として大きな期待を集めた。\n\nしかし事業の方向性が定まらないままルービンは退社し、Boston Dynamicsは2017年にソフトバンクグループへ売却された。巨大IT資本によるロボット産業への最初の大波は、**資本だけでは製品にならない**という教訓を残して引いていった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The New York Times: Google Puts Money on Robots (2013-12)","url":null}]},{"date":"2015-06-20","precision":"day","end_date":null,"type":"point","layer":"社会とくらし","title":"Pepper一般発売、感情認識ロボットの熱狂","summary":"ソフトバンクが人型ロボット「Pepper」を一般向けに発売。本体19万8000円で、初回生産分1000台は発売開始から1分で完売したと同社は発表した。\n\n感情を認識する家庭用ロボットという触れ込みで店頭案内などにも広がったが、継続的な用途の確立には苦戦し、2021年には生産休止が報じられた。AIBO以来の「ロボットと暮らす」期待と、実用の壁との落差を示す事例となった。","detail":null,"credibility":"unverified","credibility_note":"「1分で完売」は同社発表に基づく数字で、販売実数の第三者検証はない。生産休止も報道ベースである。","sources":[{"title":"ソフトバンク: Pepper一般販売開始に関する発表 (2015)","url":null}]},{"date":"2017-10-25","precision":"day","end_date":null,"type":"point","layer":"社会とくらし","title":"ロボット「Sophia」にサウジが市民権付与","summary":"Hanson Robotics製の人型ロボット「Sophia」に対し、サウジアラビアが「市民権」を付与したと発表した。ロボットが市民権を持つ世界初の事例として大きく報じられた。\n\n法的な権利義務の内実は示されておらず、研究者からは会話能力の誇張とあわせて演出的なイベントだとの批判が強い。ロボットへの期待と実態の乖離、そして「人らしさ」の見せ方をめぐる倫理問題を象徴する出来事となった。","detail":null,"credibility":"disputed","credibility_note":"付与された市民権の法的内容は公表されておらず、実質を伴わない象徴的な発表だとする見方が有力である。","sources":[{"title":"Wikipedia: Sophia (robot)","url":"https://en.wikipedia.org/wiki/Sophia_(robot)"}]},{"date":"2020-06-16","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"Boston DynamicsがSpotを一般販売開始","summary":"Boston Dynamicsが四足歩行ロボット「Spot」を7万4500ドルで一般販売開始。動画で世界を驚かせてきた同社にとって初の量産商用製品となり、工場や建設現場の巡回・点検に採用が進んだ。\n\nBigDogから15年、研究資金による開発(研究と技術レイヤー)がようやく市場の製品に到達した。同社の親会社はGoogle、ソフトバンクを経て2021年に現代自動車グループへ移り、脚式ロボットの商用化は自動車資本の下で進むことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Boston Dynamics: Spot commercial availability (2020-06)","url":null}]},{"date":"2021-08-19","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"TeslaがヒューマノイドOptimus計画を発表","summary":"TeslaがAIイベントで人型ロボット「Optimus」の開発計画を発表。当日は実機ではなく着ぐるみのダンサーが登場し、話題と懐疑を同時に呼んだ。\n\n自動運転で開発した認識技術と量産能力を人型に転用するという構想は、**ヒューマノイドを労働力として量産する**競争の号砲となった。以後、米中で人型ロボットへの投資が過熱し、研究の系譜(WABOTからASIMOへ)とは別の、資本主導の第二幕が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Tesla AI Day 2021での発表","url":null}]},{"date":"2024-02-29","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"Figureが6.75億ドル調達、ヒューマノイド投資過熱","summary":"ヒューマノイド開発の米FigureがOpenAI、Microsoft、NVIDIA、Amazon創業者ベゾスらから6億7500万ドルを調達し、評価額は約26億ドルとなった。OpenAIとの共同開発も同時に発表された。\n\n生成AIの言語・視覚能力がロボットの「頭脳」の問題を解くという期待が投資を呼び込んでおり、1961年のUnimate以来の「体」の系譜と、AI革命の「頭」の系譜が合流しつつある。夜明けの次の章が始まろうとしている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Figure: Series B資金調達の発表 (2024-02-29)","url":null}]}]},{"slug":"tech-semiconductor-war","title":"半導体戦争の50年","description":"日米摩擦から米中対立まで。製造技術・企業と市場・国家と地政学の3層を重ね、半導体が「産業のコメ」から安全保障の要へと変わっていく50年を俯瞰する年表。","category":"technology","language":"ja","start_year":1976,"end_year":2025,"layers":[{"name":"技術と製造","color":"blue"},{"name":"企業と市場","color":"orange"},{"name":"国家と地政学","color":"teal"}],"events":[{"date":"1976-01-01","precision":"year","end_date":"1980-03-31","type":"period","layer":"国家と地政学","title":"日本で超LSI技術研究組合が発足","summary":"通商産業省の主導で、富士通・日立・三菱電機・NEC・東芝が参加する超LSI技術研究組合が発足した。約4年間、微細加工技術などの基礎を競合企業が共同で研究する体制が組まれた。\n\n**国家が半導体を戦略産業として育てる**モデルの原型であり、この成果が1980年代の日本製DRAMの品質優位につながったと評価される。半世紀後の米CHIPS法やRapidusまで続く、産業政策と半導体の関係の出発点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"超LSI技術研究組合(1976–1980)に関する通商産業政策史資料","url":null}]},{"date":"1986-09-02","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"日米半導体協定に調印","summary":"ダンピング提訴と貿易摩擦の激化を受け、日米両政府が半導体協定に調印した。日本製品の価格監視と、日本市場での外国製半導体のシェア拡大が柱で、1991年の第2次協定では「外国系20%」の目安が明記された。\n\n民間の競争に政府が介入し、**半導体が貿易摩擦の主戦場**となった最初の事例である。翌年には第301条に基づく対日制裁関税も発動され、この構図は約30年後の米中対立で形を変えて再現される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日米半導体協定(1986年9月2日調印)関連資料","url":null}]},{"date":"1987-02-21","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"台湾でTSMC設立、ファウンドリ業の発明","summary":"台湾の工業技術研究院を母体に、モリス・チャン(張忠謀)が台湾積体電路製造(TSMC)を設立した。自社製品を持たず他社の設計チップの製造だけを請け負う、世界初の専業ファウンドリである。\n\n**設計と製造の分離**という新しい分業は、工場を持たない設計企業の勃興を可能にし、半導体産業の構造を根本から変えた。約30年後、最先端製造がTSMCに集中したことが台湾の地政学的重要性(国家と地政学レイヤー)を一変させる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: TSMC","url":"https://en.wikipedia.org/wiki/TSMC"}]},{"date":"1988-01-01","precision":"year","end_date":null,"type":"point","layer":"企業と市場","title":"日本勢が世界半導体シェアの約半分を占める","summary":"NEC・東芝・日立が世界売上上位を占め、日本メーカー全体で世界の半導体市場の5割前後を握ったとされる。DRAMでは対米で圧倒的な品質と価格の優位を築いていた。\n\n超LSI組合(国家と地政学レイヤー)以来の投資が頂点に達した瞬間だが、同時に日米協定による制約が効き始めた時期でもある。以後、韓国サムスンの追い上げとPC時代の到来で、日本の優位は10年を待たずに崩れていく。","detail":null,"credibility":"disputed","credibility_note":"「シェア5割」は調査会社の統計に基づく概数で、集計範囲と年により数値が異なり、ピーク時期にも諸説ある。","sources":[{"title":"Dataquest/SIA 半導体市場統計に基づく各種文献","url":null}]},{"date":"1992-01-01","precision":"year","end_date":null,"type":"point","layer":"企業と市場","title":"Intelが売上首位、サムスンがDRAM首位に","summary":"この年、Intelが日本勢を抜いて半導体売上世界一となり、サムスン電子がDRAMで首位に立ったとされる。米国はメモリからMPUへ主戦場を移して復活し、韓国は国家的投資でメモリを制した。\n\n日本の一強時代の終わりを示す首位交代である。汎用品のメモリで規模の投資競争に敗れた日本と、設計で付加価値を取った米国という明暗は、その後の各国の産業政策(国家と地政学レイヤー)の教訓として繰り返し参照される。","detail":null,"credibility":"unverified","credibility_note":"首位交代の年は調査会社の集計基準により1992年前後で異なり、単一の確定値はない。","sources":[{"title":"Dataquest 1992年 世界半導体売上ランキング","url":null}]},{"date":"1997-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と製造","title":"EUV LLC結成、極端紫外線露光の研究開始","summary":"Intelが主導し米エネルギー省傘下の国立研究所と組んで、波長13.5nmの極端紫外線(EUV)露光を研究する共同事業体EUV LLCが結成された。ASMLやMotorolaなども参加した。\n\n露光波長の限界を一気に超える構想だったが、実用化には20年以上を要する。この超長期の研究開発を最終的に製品化できたのがオランダのASML一社だったことが、後の輸出規制(国家と地政学レイヤー)の急所を生むことになる。","detail":null,"credibility":"unverified","credibility_note":"結成時期は資料により1996〜1997年と幅があり、参加企業の構成も時期によって変動している。","sources":[{"title":"Wikipedia: Extreme ultraviolet lithography","url":"https://en.wikipedia.org/wiki/Extreme_ultraviolet_lithography"}]},{"date":"2007-06-29","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"iPhone発売、半導体需要の主役がモバイルへ","summary":"AppleがiPhoneを米国で発売した。高性能な省電力チップへの需要が爆発し、半導体の主戦場はPC向けからモバイル向けSoCへ移っていく。\n\n設計はArmアーキテクチャのライセンス、製造は台湾のファウンドリという分業(技術と製造レイヤー)がモバイルで標準となり、自前工場を持つIntelの優位が相対化された。Appleが後に自社設計チップをTSMCの最先端プロセスで独占的に製造する関係も、ここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: iPhone (1st generation)","url":"https://en.wikipedia.org/wiki/IPhone_(1st_generation)"}]},{"date":"2012-07-09","precision":"day","end_date":null,"type":"point","layer":"技術と製造","title":"IntelがASMLに共同出資、EUV開発を加速","summary":"IntelがASMLの次世代露光技術開発への共同投資プログラムに参加し、株式取得を含め最大約41億ドルを投じると発表した。TSMCとサムスンも同様の出資プログラムに続いた。\n\n競合する半導体メーカー3社がそろって装置メーカー1社に資金を出すという異例の構図であり、EUV実用化の資金難がそれだけ深刻だったことを示す。結果としてASMLの独占(企業と市場レイヤー)は決定的になり、露光装置は産業全体の共有インフラと化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Intel News Release: Intel and ASML customer co-investment program (2012-07-09)","url":null}]},{"date":"2015-05-08","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"中国が「中国製造2025」を発表","summary":"中国国務院が製造強国化の10年計画「中国製造2025」を公表した。半導体は中核分野に位置づけられ、国家集積回路産業投資基金(大基金)を通じた巨額の投資が加速した。\n\n輸入額が原油を上回る半導体の国産化は中国の悲願であり、この計画が米国の警戒を決定的にした。紫光集団による米メモリ企業への買収提案など攻勢が続き、数年後のZTE・ファーウェイへの制裁(同レイヤー)の伏線となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中国国務院: 中国製造2025 (2015年5月8日公布)","url":null}]},{"date":"2018-04-16","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米国がZTEへの部品輸出を禁止","summary":"米商務省が、対イラン制裁違反の和解条件に背いたとして中国の通信機器大手ZTEへの米国製部品の輸出を7年間禁止した。米国製チップに依存するZTEは主要業務の停止に追い込まれ、後に罰金と経営陣刷新で解除された。\n\n**米国製半導体を断てば大企業が数週間で止まる**ことを世界に示した事件であり、中国は国産化投資をさらに加速する。供給網が武器になり得るという認識が、以後の各国の政策(企業と市場レイヤーの再編を含む)を規定していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省BIS: ZTE Denial Order (2018-04)","url":null}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と製造","title":"EUV露光が量産適用、微細化の限界を突破","summary":"TSMCとサムスンが7nm世代のロジック半導体でEUV露光の量産適用を開始した。1997年のEUV LLC結成から20年余り、装置1台150億円超のASML製EUV露光機がようやく製造ラインに入った。\n\n最先端の微細化を続けられる企業はこの時点でTSMC・サムスン・(遅れて)Intelの3社に絞られた。EUV機を持つことが国力の指標のように扱われはじめ、対中輸出の管理対象(国家と地政学レイヤー)にもEUVが真っ先に挙がった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Extreme ultraviolet lithography","url":"https://en.wikipedia.org/wiki/Extreme_ultraviolet_lithography"}]},{"date":"2019-05-16","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米国がファーウェイをエンティティリストに追加","summary":"米商務省が華為技術(ファーウェイ)を輸出管理のエンティティリストに追加し、米国技術を用いた製品の供給を許可制にした。翌2020年には米国製装置で作られた半導体全般へ規制が拡大され、TSMCも取引を停止した。\n\n世界2位のスマートフォンメーカーが最先端チップを調達できなくなり、**技術覇権をめぐる米中の分断**が決定的になった。サプライチェーンの各社(企業と市場レイヤー)は、地政学リスクを前提とした再編を迫られる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省BIS: Entity List追加発表 (2019年5月)","url":null}]},{"date":"2020-12-01","precision":"month","end_date":"2023-06-30","type":"period","layer":"企業と市場","title":"世界的な半導体不足","summary":"コロナ禍の需要急変と供給網の混乱により、車載半導体を発端とする世界的な供給不足が発生した。自動車各社は減産を余儀なくされ、ゲーム機や家電まで品薄が広がった。\n\n数十円のチップ1個の欠品が数百万円の自動車の生産を止めるという事実は、各国政府に半導体を経済安全保障の問題として認識させた。米CHIPS法や日本のTSMC誘致(国家と地政学レイヤー)への政治的な追い風は、この不足が作ったといえる。","detail":null,"credibility":"disputed","credibility_note":"不足の開始・終息時期は製品分野により大きく異なり、期間の区切り方には業界内でも幅がある。","sources":[{"title":"Wikipedia: 2020–2023 global chip shortage","url":"https://en.wikipedia.org/wiki/2020%E2%80%932023_global_chip_shortage"}]},{"date":"2022-08-09","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米CHIPS法成立、527億ドルの半導体支援","summary":"バイデン大統領がCHIPS・科学法に署名した。米国内の半導体製造と研究開発に527億ドルの補助金を投じ、支援を受けた企業の対中先端投資を10年間制限するガードレール条項を付けた。\n\n自由貿易を掲げてきた米国が**補助金による産業政策へ回帰**した転換点である。半導体不足(企業と市場レイヤー)と台湾有事への懸念が超党派の合意を生み、EU・日本・インドも同様の巨額支援策で追随した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: CHIPS and Science Act","url":"https://en.wikipedia.org/wiki/CHIPS_and_Science_Act"}]},{"date":"2022-10-07","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米国が先端半導体の対中輸出規制を発表","summary":"米商務省が、先端ロジック・メモリの製造装置と高性能AIチップの対中輸出を包括的に規制した。米国人技術者が中国の先端半導体開発を支援することまで許可制とする、異例に踏み込んだ内容だった。\n\n特定企業ではなく中国の産業全体の技術水準を凍結しようとする設計であり、日本とオランダも2023年に装置規制で歩調を合わせた。露光装置の急所(技術と製造レイヤー)を握る同盟国の協調が規制の実効性を支えている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省産業安全保障局(BIS) 2022年10月7日発表 輸出管理規則改正","url":null}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"Rapidus設立、日本が2nmへ再挑戦","summary":"トヨタ・ソニー・NTTなど8社の出資で設立されたRapidusが発表され、IBMとの提携で2027年の2nm世代量産を目指す計画が示された。政府は研究開発拠点LSTCの設立と数千億円規模の支援を決めた。\n\n40nm世代で止まった日本の先端ロジック製造への、四半世紀ぶりの再挑戦である。超LSI組合の成功体験と、その後の国策プロジェクトの失敗の記憶の両方を背負っており、国家と地政学レイヤーの追い風をどこまで実装力に変えられるかが問われている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省: 次世代半導体の設計・製造基盤確立に向けて (2022-11-11)","url":null}]},{"date":"2024-02-24","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"TSMC熊本工場が開所","summary":"TSMCが日本のソニー・デンソーなどと合弁で建設した熊本第一工場(JASM)が開所式を迎えた。日本政府は最大4760億円を補助し、着工から2年足らずという異例の速さで完成した。\n\n最先端ではなく成熟世代の工場だが、**製造拠点の分散が国家の保険になる**という新しい常識を体現する。台湾一極集中への懸念(国家と地政学レイヤー)が、補助金と速度で立地を動かした代表例であり、第二工場の建設も決まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"JASM/TSMC 熊本第一工場開所式 (2024-02-24)","url":null}]},{"date":"2024-06-18","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"NVIDIAが時価総額世界一に","summary":"生成AI向けGPU需要の爆発を受け、NVIDIAの時価総額が一時Microsoftを抜いて世界一となった。1993年創業のゲーム用チップ企業が、AIデータセンター投資の中心に立った。\n\n売れているGPUの製造はTSMCの最先端プロセスと先端パッケージングに全面依存しており、設計(米)・製造(台)・装置(蘭・日)という分業の相互依存を象徴する。AIチップの対中輸出規制(国家と地政学レイヤー)は同社の売上構成をも直接左右している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters: Nvidia becomes world's most valuable company (2024-06-18)","url":null}]},{"date":"2025-08-22","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米政府がIntel株式の約10%を取得","summary":"米政府がCHIPS法の補助金等を株式に転換する形でIntelの株式約10%を取得することで同社と合意した。経営不振が続く同社に対し、政府が大株主として関与する異例の枠組みである。\n\n補助金による支援からさらに踏み込み、**国家が半導体企業の株主になる**段階に達した。自由市場の旗手だった米国の変化は50年前の日本の産業政策すら超えるもので、政府の企業介入の是非をめぐる論争を呼んでいる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Intel Newsroom: 米政府による出資合意の発表 (2025-08-22)","url":null}]}]},{"slug":"tech-social-media","title":"SNSが変えた世界","description":"Facebook誕生からTikTok規制まで。プラットフォームの進化、社会と政治への波及、規制の応答という3層を重ね、SNSが世論と統治の形をどう変えてきたかを追う年表。","category":"technology","language":"ja","start_year":2004,"end_year":2025,"layers":[{"name":"プラットフォーム","color":"blue"},{"name":"社会と政治","color":"pink"},{"name":"規制と説明責任","color":"teal"}],"events":[{"date":"2004-02-04","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"ハーバードの学生寮でFacebookが誕生","summary":"マーク・ザッカーバーグらがハーバード大学の学生向けサイト「TheFacebook」を公開した。実名と現実の人間関係をオンラインに持ち込む設計が、匿名文化が主流だった当時のネットでは異例だった。\n\n実名制は後の広告ビジネスと個人データ集積の土台となり、2010年代のプライバシー問題(規制と説明責任レイヤー)の遠因もこの設計思想に遡る。20年で30億人が使うインフラになるとは、当時誰も想定していなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Facebook","url":"https://en.wikipedia.org/wiki/Facebook"}]},{"date":"2006-07-15","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"Twitterが一般公開","summary":"140字の短文を投稿する「Twitter」が一般公開された。フォローという非対称な関係と公開が基本の投稿は、友人間の交流を前提としたそれまでのSNSと異なる、速報と拡散に向いた構造だった。\n\nこの構造ゆえにTwitterは後に報道・災害・政治の基盤(社会と政治レイヤー)となり、各国の首脳が直接発信する場にもなる。個人のつぶやきと公共の言論が同じタイムラインに並ぶ空間は、ここから始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Twitter","url":"https://en.wikipedia.org/wiki/Twitter"}]},{"date":"2006-09-05","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"FacebookがNews Feedを導入","summary":"Facebookが友人の行動を時系列で自動表示する「News Feed」を導入した。公開当初は「監視のようだ」と強い反発を受けたが、利用時間は急増し、まもなくSNSの標準機能となった。\n\n自分で見に行く場から**アルゴリズムが情報の流れを決める**場への転換点である。この配信の仕組みは後に、偽情報の拡散や分断の増幅(社会と政治レイヤー)をめぐる論争の中心になっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Feed (Facebook)","url":null}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"Instagram公開、写真SNSの時代へ","summary":"写真共有アプリInstagramがiPhone向けに公開され、初日に約2万5000人が登録した。正方形の写真とフィルターという制約の強い設計が、スマートフォンのカメラ性能の向上と噛み合った。\n\n言葉より画像で自己表現する文化はここで主流化し、「映え」が消費や観光を動かす経済現象となる。後年、外見比較が若年層の心理に与える影響(社会と政治レイヤー)が公衆衛生の議題に上る素地でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2010-12-17","precision":"day","end_date":"2011-12-31","type":"period","layer":"社会と政治","title":"アラブの春、SNSが動員の基盤に","summary":"チュニジアでの青年の焼身自殺を発端に反政府デモが中東・北アフリカへ連鎖し、チュニジア、エジプトなどで長期政権が倒れた。FacebookやTwitterがデモの告知と映像拡散に使われ、「SNS革命」と呼ばれた。\n\nSNSが**国家権力に対する動員のインフラ**になり得ると世界が認識した出来事である。一方で各国政府も監視と遮断の技術を学び、規制と説明責任レイヤーにおける統制強化の転機にもなった。","detail":null,"credibility":"disputed","credibility_note":"政変へのSNSの寄与の大きさについては研究者の評価が分かれており、「SNS革命」という呼称自体に異論がある。","sources":[{"title":"Wikipedia: Arab Spring","url":"https://en.wikipedia.org/wiki/Arab_Spring"}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"社会と政治","title":"東日本大震災、SNSが災害情報インフラに","summary":"東日本大震災の発生直後、電話網が輻輳する中でTwitterなどのSNSが安否確認と情報共有の手段として機能した。震災当日の日本発ツイートは平常時を大きく上回ったとされる。\n\n日本でSNSが娯楽から社会インフラへと認識を変えた転機であり、以後、自治体や公共機関の公式アカウント開設が一気に進んだ。同時にデマの拡散という課題も顕在化し、災害時の情報検証という論点が生まれた。","detail":null,"credibility":"unverified","credibility_note":"震災当日のツイート数の増加率は集計主体により数値が異なり、確定的な統計はない。","sources":[{"title":"総務省: 情報通信白書(平成23年版) 東日本大震災における情報通信の状況","url":null}]},{"date":"2012-04-09","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"FacebookがInstagramを10億ドルで買収","summary":"Facebookが社員13人のInstagramを約10億ドルで買収すると発表した。売上のないアプリへの巨額買収は当時「高すぎる」と評されたが、結果的にはIT史上屈指の安い買い物とされるようになる。\n\n有力な新興サービスを早期に取り込む成長戦略の象徴であり、後の WhatsApp買収と合わせ、競争の芽を摘む買収ではないかという議論(規制と説明責任レイヤー)を招く。米当局は2020年に同社を反トラストで提訴した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram (Acquisition by Facebook)","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2013-06-01","precision":"month","end_date":null,"type":"point","layer":"規制と説明責任","title":"スノーデンが大規模監視を告発","summary":"元NSA契約職員エドワード・スノーデンが、米政府が大手IT企業のデータに広くアクセスする監視プログラムの存在を告発した。SNSやメールの利用記録が国家監視の対象であることが具体的に示された。\n\nプラットフォームに蓄積された個人データ(プラットフォームレイヤー)が国家に流れ得るという事実は世界に衝撃を与え、通信の暗号化の常時化を一気に進めた。EUのデータ保護強化の議論もこの事件で加速した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edward Snowden","url":"https://en.wikipedia.org/wiki/Edward_Snowden"}]},{"date":"2016-09-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"抖音(Douyin)公開、ショート動画時代の幕開け","summary":"中国のByteDanceが短尺動画アプリ「抖音」を公開した。翌年に国際版TikTokを展開し、買収したMusical.lyと統合して世界市場へ急拡大する。\n\nフォロー関係よりも推薦アルゴリズムを核とする設計は、友人のつながりを前提とした従来のSNSの定義を書き換えた。中国企業のアプリが欧米の若年層の主要メディアになったことは、後に安全保障上の争点(規制と説明責任レイヤー)へと発展する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: TikTok","url":"https://en.wikipedia.org/wiki/TikTok"}]},{"date":"2016-11-08","precision":"day","end_date":null,"type":"point","layer":"社会と政治","title":"米大統領選、SNS上の偽情報と影響工作が争点に","summary":"トランプ氏が勝利した米大統領選で、SNS上の偽ニュースの拡散とロシアによる組織的な影響工作が明らかになり、プラットフォームの責任を問う世界的な議論が始まった。\n\nSNSが**世論操作の主戦場**になり得ることが広く認識された転機である。翌年以降、各社はファクトチェックや広告透明化(プラットフォームレイヤー)を導入し、各国は規制の検討(規制と説明責任レイヤー)を本格化させた。","detail":null,"credibility":"disputed","credibility_note":"影響工作の存在は米司法省の捜査で確認されたが、それが選挙結果をどの程度左右したかは実証されておらず、評価が分かれる。","sources":[{"title":"米司法省特別検察官報告書(ミュラー報告書、2019)","url":null}]},{"date":"2018-03-17","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"ケンブリッジ・アナリティカ事件が発覚","summary":"英コンサル企業ケンブリッジ・アナリティカが、最大8700万人分のFacebookユーザーデータを不正に取得し選挙広告の標的設定に使っていたと報じられた。ザッカーバーグCEOは米議会で証言に立った。\n\n2016年米大統領選(社会と政治レイヤー)への疑念と結びつき、SNSのデータ利用への信頼が決定的に揺らいだ事件である。FTCは2019年、Facebookに50億ドルの制裁金を科し、規制強化の流れが確定した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Facebook–Cambridge Analytica data scandal","url":"https://en.wikipedia.org/wiki/Facebook%E2%80%93Cambridge_Analytica_data_scandal"}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"EUで一般データ保護規則(GDPR)施行","summary":"個人データの処理に同意取得や削除権などを義務づけ、違反に全世界売上の最大4%の制裁金を科すGDPRがEUで施行された。域外の企業にも適用される強い設計である。\n\nスノーデンの告発やデータ不正利用事件を経て、**個人データを基本権として守る**という欧州の姿勢が法になった。各社の同意画面や設定変更(プラットフォームレイヤー)は世界共通で改修され、各国のデータ保護法の手本となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2016/679 (GDPR)","url":"https://eur-lex.europa.eu/eli/reg/2016/679/oj"}]},{"date":"2021-01-08","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"Twitterがトランプ大統領のアカウントを永久凍結","summary":"米連邦議会議事堂の襲撃事件(1月6日)を受け、Twitterがさらなる暴力扇動の恐れを理由に現職大統領のアカウントを永久凍結した。FacebookやYouTubeも同様の停止措置を取った。\n\n**私企業が国家元首の発信を止められる**という事実は、言論空間の統治権が誰にあるのかという根源的な問いを世界に突きつけた。この判断への評価は割れ、後のマスク氏による凍結解除(プラットフォームレイヤー)まで論争が続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Twitter Blog: Permanent suspension of @realDonaldTrump (2021-01-08)","url":null}]},{"date":"2
