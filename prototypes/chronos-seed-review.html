layer":"規制と社会","title":"米連邦地裁がGoogleの検索独占を認定","summary":"ワシントンD.C.連邦地裁が、Googleが検索市場で違法に独占を維持したと判断し、2020年提訴の司法省訴訟で原告側が勝訴した。Appleへの巨額支払いによるデフォルト契約が独占維持の手段と認定され、是正措置の審理が続いた。\n\n**2000年のAdWords以来の「検索と広告」の結合モデルが司法によって問い直された**節目である。同年6月に日本のスマホ新法が成立し、EUではDMAの執行が始まっており、GAFAの事業構造そのものが日米欧で同時に規制対象となった年として位置づけられる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United States v. Google LLC (2020)","url":"https://en.wikipedia.org/wiki/United_States_v._Google_LLC_(2020)"}]}]},{"slug":"business-japan-unicorns","title":"日本発ユニコーンの軌跡","description":"2010年代から2020年代の日本スタートアップを、企業と資金調達・制度と市場・技術とトレンドの3層で追う。評価額の報道と政策の動きを重ねると、ブームの背景が見えてくる。","category":"business","language":"ja","start_year":2010,"end_year":2024,"layers":[{"name":"企業と資金調達","color":"orange"},{"name":"制度と市場","color":"teal"},{"name":"技術とトレンド","color":"blue"}],"events":[{"date":"2010-01-01","precision":"year","end_date":"2015-12-31","type":"period","layer":"技術とトレンド","title":"スマートフォン普及期","summary":"総務省の通信利用動向調査によれば、スマートフォンの世帯保有率は2010年の約1割から2015年には7割超へ急伸した。iPhoneのソフトバンク独占販売終了とAndroid端末の拡大を背景に、日本の生活者は数年で常時接続の端末を手にした。\n\nこの普及が、2013年に創業するメルカリなど「スマホ前提」のサービスの土台となる。同時期の制度面では2013年の日本再興戦略が開業率目標を掲げており、需要側と政策側の条件が並行して整った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省 通信利用動向調査","url":"https://www.soumu.go.jp/johotsusintokei/statistics/statistics05.html"}]},{"date":"2013-02-01","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"メルカリ創業（当時コウゾウ）","summary":"山田進太郎らが株式会社コウゾウを設立し、同年7月にフリマアプリ「メルカリ」を公開してスマホ完結の個人間取引を広げた。写真を撮って出品するという操作は、スマートフォン普及期の真っ只中という環境をそのまま「スマホ前提」の設計に結びつけたものである。\n\n同じ2013年6月には政府が日本再興戦略を閣議決定し、開業率の引き上げを掲げている。**企業側の挑戦と政策側の号令が同じ年に始まった**点は、後年の資金流入を読む上で重要である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"株式会社メルカリ 会社概要","url":"https://about.mercari.com/"},{"title":"Wikipedia: Mercari","url":"https://en.wikipedia.org/wiki/Mercari"}]},{"date":"2013-06-14","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"日本再興戦略を閣議決定","summary":"アベノミクス「三本の矢」の三本目にあたる成長戦略が閣議決定され、開業率・廃業率を米英並みの10%台にする目標が明記された。ベンチャー支援や規制改革が成長政策の柱に据えられ、同年はメルカリ創業やスマホ普及の加速と重なり、政策と市場の機運が同期している。\n\nこの目標自体は達成されず、開業率は5%前後にとどまったが、以降のJ-Startupやスタートアップ育成5か年計画に続く政策系譜の起点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 日本再興戦略 -JAPAN is BACK-","url":"https://www.kantei.go.jp/jp/singi/keizaisaisei/pdf/saikou_jpn.pdf"}]},{"date":"2014-03-26","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"Preferred Networks 設立","summary":"西川徹・岡野原大輔らがPreferred Infrastructureから分社する形でPreferred Networksを設立し、深層学習の産業応用に特化した。研究者主導のスタートアップで、翌2015年には自社の深層学習フレームワークChainerを公開する。\n\n学術発の技術と大企業の資本を結びつける方針は、2017年のトヨタからの大型出資に結実した。同時期の制度面では公的な支援策は限られており、事業会社との資本提携が国内AIスタートアップの主要な資金源になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Preferred Networks 会社概要","url":"https://www.preferred.jp/ja/"},{"title":"Wikipedia: Preferred Networks","url":"https://en.wikipedia.org/wiki/Preferred_Networks"}]},{"date":"2015-06-01","precision":"month","end_date":null,"type":"point","layer":"技術とトレンド","title":"深層学習フレームワークChainer公開","summary":"PFNがChainerをオープンソースとして公開し、国産の深層学習基盤として研究者や企業に広がった。Define-by-Runと呼ばれる動的計算グラフの設計は、のちのPyTorchにも影響を与えたとされる。\n\n2016年の囲碁AIの話題化とともに国内でもAIブームが加速し、AIを掲げるスタートアップへの投資が増えた。PFNは2019年12月にChainerの開発終了とPyTorchへの移行を発表しており、国産基盤の限界と国際標準化の流れを示す出来事でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Chainer","url":"https://en.wikipedia.org/wiki/Chainer"}]},{"date":"2016-03-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"メルカリ、評価額1,000億円超と報道","summary":"メルカリが約84億円の資金調達を実施。企業評価額は1,000億円を超えたと報じられ、「日本初のユニコーン」と呼ばれた。非上場のまま評価額10億ドル超に達したとされ、日本のスタートアップ資金調達が数十億円単位から百億円単位へ移る象徴となった。\n\n同年は制度面で大きな動きが少なく、民間の大型調達が先行した形である。ただし**評価額は各社の公表値ではなく報道ベースの推計**であり、「日本初」の呼称もPFNなどとの比較で見解が分かれる。","detail":null,"credibility":"disputed","credibility_note":"評価額は非公表で報道による推計値。「日本初のユニコーン」の呼称もPFNとの比較で報道により見解が異なる。","sources":[{"title":"日本経済新聞 報道（2016年3月、メルカリの資金調達）","url":null},{"title":"Wikipedia: Mercari","url":"https://en.wikipedia.org/wiki/Mercari"}]},{"date":"2017-08-04","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"トヨタがPFNに105億円を追加出資","summary":"トヨタ自動車がPreferred Networksへ約105億円の追加出資を発表した。自動運転やモビリティ分野での協業強化が目的とされ、国内では**独立系VCよりも事業会社が大型ラウンドを担う構図**を象徴する投資となった。\n\n技術レイヤーではChainerの普及やAIブームが背景にあり、翌2018年には政府がJ-Startupを開始する。PFNはこの出資以降、企業評価額が国内最大級と報じられるようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 ニュースリリース（2017年8月）","url":null},{"title":"Wikipedia: Preferred Networks","url":"https://en.wikipedia.org/wiki/Preferred_Networks"}]},{"date":"2018-06-11","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"経済産業省がJ-Startupを開始","summary":"経産省とJETRO等が有望スタートアップを選定し、官民で集中支援するJ-Startupプログラムが始まった。初回選定92社にはメルカリやPFNが含まれ、政府がスタートアップを名指しで支援する初の枠組みとなった。\n\n開始から1週間後にはメルカリが東証マザーズに上場しており、**政策と市場の節目が同じ月に重なった**。技術面ではこの年の秋にPayPayがサービスを開始し、キャッシュレス分野への注目も高まっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"J-Startup 公式サイト","url":"https://www.j-startup.go.jp/"}]},{"date":"2018-06-19","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"メルカリが東証マザーズに上場","summary":"メルカリが東証マザーズに上場した。初値は公開価格3,000円を大きく上回る5,000円で時価総額は7,000億円規模と報じられ、未上場段階で大型調達を重ねてから上場する米国型の経路が日本でも成立することを示した。\n\n同月にはJ-Startupが始動し、上場後の海外展開や暗号資産事業への挑戦も注目された。市場レイヤーでは2022年の東証再編で「グロース市場」が生まれるまで、マザーズが新興企業の主要な出口であった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"株式会社メルカリ IR情報","url":"https://about.mercari.com/"},{"title":"日本取引所グループ 新規上場会社情報","url":"https://www.jpx.co.jp/"}]},{"date":"2018-10-05","precision":"day","end_date":null,"type":"point","layer":"技術とトレンド","title":"PayPayがサービス開始","summary":"ソフトバンクとヤフーの合弁PayPayがQRコード決済を開始し、12月の「100億円あげちゃうキャンペーン」で一気に認知を得た。スマートフォンの普及を前提に、少額決済のデジタル化が加速した。\n\n翌2019年10月には政府のキャッシュレス・ポイント還元事業が始まり、民間の投資合戦と公的なインセンティブが同時に働く形でキャッシュレス比率が上昇する。決済データを起点とした金融サービスの拡張は、後のPaidyへの大型買収にも通じるトレンドである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: PayPay","url":"https://en.wikipedia.org/wiki/PayPay"}]},{"date":"2019-10-01","precision":"day","end_date":"2020-06-30","type":"period","layer":"制度と市場","title":"キャッシュレス・ポイント還元事業","summary":"消費税率引き上げに合わせ、中小店舗でのキャッシュレス決済に最大5%を還元する国の事業が9か月間実施された。PayPayをはじめとするコード決済各社の顧客獲得競争と時期が重なり、決済スタートアップの利用者数が急増した。\n\n事業終了直前の2020年春には新型コロナの緊急事態宣言が出され、非接触決済の需要がさらに高まる。**政策・技術・社会情勢が同じ方向に働いた稀な期間**である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省 キャッシュレス・ポイント還元事業","url":"https://cashless.go.jp/"}]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"制度と市場","title":"オープンイノベーション促進税制の創設","summary":"事業会社がスタートアップへ一定額以上出資した場合に所得控除を認める税制が、2020年度税制改正で創設された。CVCによる出資を後押しする狙いで、トヨタとPFNのような事業会社主導の資金供給を制度面から支える意味を持った。\n\n同月には新型コロナの緊急事態宣言が発出され、対面事業のスタートアップは打撃を受ける一方、リモートワーク関連の需要が拡大した。制度の設計時と施行時で市場環境が大きく変わった例である。","detail":null,"credibility":"unverified","credibility_note":"2020年度税制改正で創設された点は確かだが、適用開始日や出資要件の細部は法令原文で未確認。","sources":[{"title":"経済産業省 オープンイノベーション促進税制","url":null}]},{"date":"2020-04-07","precision":"day","end_date":"2020-05-25","type":"period","layer":"技術とトレンド","title":"緊急事態宣言とリモートワークの急拡大","summary":"新型コロナウイルスの感染拡大を受け、初の緊急事態宣言が発出された。在宅勤務やオンライン化が急速に広がり、SaaSやEC関連の需要が伸びた。\n\n労務のクラウド化を進めるSmartHRやオンライン診療、決済など非対面領域のスタートアップに追い風となり、翌2021年の大型調達につながった。ただし「DXの加速」がどこまで定着したかは業種により差があり、行動制限の解除後に需要が反転した分野もある。政策面では同月にオープンイノベーション促進税制が施行されていた。","detail":null,"credibility":"disputed","credibility_note":"宣言の期間は事実だが、スタートアップ需要への影響の大きさや持続性は業種や調査により評価が分かれる。","sources":[{"title":"内閣官房 新型コロナウイルス感染症対策","url":null}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"SmartHRが156億円を調達","summary":"クラウド労務ソフトのSmartHRがシリーズDで約156億円を調達。企業評価額は1,700億円超と報じられ、ユニコーン入りとされた。コロナ禍でのリモートワーク拡大が労務のクラウド化需要を押し上げ、SaaS企業の評価額が国内でも急上昇した局面を象徴する。\n\n海外投資家が主導した点も特徴で、同年はSmartNewsやPaidyの大型案件も相次いだ。国内スタートアップの年間資金調達額は、この前後で過去最高水準に達したとされる。","detail":null,"credibility":"unverified","credibility_note":"調達額は同社発表だが、企業評価額は非公表で報道ベースの推計値。","sources":[{"title":"株式会社SmartHR プレスリリース（2021年6月）","url":"https://smarthr.co.jp/"}]},{"date":"2021-09-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"SmartNewsが評価額20億ドルと報道","summary":"ニュースアプリのSmartNewsが約2.3億ドルを調達し、企業評価額は20億ドルに達したと報じられた。米国市場でのユーザー拡大が評価され、日米で事業を展開する国内発スタートアップの代表例となった。\n\n同月にはPayPalによるPaidy買収も発表され、2021年は国内スタートアップの評価額と資金調達額がともに高水準となった年として記録される。ただし評価額は同社が公式に確認した数値ではなく、報道と投資家筋の情報に基づく。","detail":null,"credibility":"unverified","credibility_note":"評価額は非公表で報道ベース。同社は調達額のみ公表している。","sources":[{"title":"Wikipedia: SmartNews","url":"https://en.wikipedia.org/wiki/SmartNews"}]},{"date":"2021-09-08","precision":"day","end_date":null,"type":"point","layer":"企業と資金調達","title":"PayPalがPaidyを約3,000億円で買収","summary":"米PayPalが後払い決済のPaidyを約3,000億円で買収すると発表し、国内スタートアップの大型M&Aとして注目された。IPO以外の出口として海外大手による買収が成立し、投資家の回収手段が広がった意味を持つ。\n\n技術面ではPayPay以降のキャッシュレス化と、コロナ禍でのEC拡大が後払い決済の需要を押し上げていた。制度面では翌2022年の東証再編と育成5か年計画を控え、出口の多様化が政策課題として意識され始めた時期でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"PayPal ニュースリリース（2021年9月8日）","url":null},{"title":"Wikipedia: Paidy","url":"https://en.wikipedia.org/wiki/Paidy"}]},{"date":"2022-04-04","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"東証がプライム・スタンダード・グロースへ再編","summary":"東京証券取引所が市場区分をプライム・スタンダード・グロースへ再編し、メルカリが上場したマザーズはグロース市場へ移行した。上場維持基準に時価総額の要件が明確化され、新興企業の上場市場が再定義された。\n\n同年11月には政府がスタートアップ育成5か年計画を決定し、投資額10兆円という数値目標を掲げる。市場側の制度と政策側の目標が同じ年に更新されたことで、小型IPOへの依存からの脱却が課題として共有された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本取引所グループ 市場区分の見直し","url":"https://www.jpx.co.jp/"}]},{"date":"2022-11-28","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"スタートアップ育成5か年計画を決定","summary":"政府が新しい資本主義実現会議で、2027年度にスタートアップ投資額10兆円、ユニコーン100社創出などを掲げる5か年計画を決定した。人材・資金・オープンイノベーションの3本柱で構成される。\n\n同じ2022年11月末には米国でChatGPTが公開され、翌年以降の生成AIスタートアップの勃興と政策支援が重なる。2013年の日本再興戦略から続く政策系譜の中で、初めて具体的なユニコーン数を目標に置いた計画である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣官房 新しい資本主義実現本部","url":"https://www.cas.go.jp/jp/seisaku/atarashii_sihonsyugi/"}]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"技術とトレンド","title":"ChatGPT公開と生成AIブーム","summary":"OpenAIがChatGPTを公開し、生成AIへの関心が世界的に高まった。スタートアップ育成5か年計画の決定からわずか2日後の出来事で、**政策の追い風と技術の転換点が同時に訪れた**。\n\n国内では2023年以降に基盤モデルや応用サービスの起業と生成AI関連の資金調達が相次ぎ、2024年にはSakana AIが短期間でユニコーンと報じられる。技術レイヤーの起点としては2015年のChainer公開以来の大きな波であり、AIスタートアップの資金源が事業会社中心から海外VCへ広がる契機ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ChatGPT","url":"https://en.wikipedia.org/wiki/ChatGPT"}]},{"date":"2024-09-01","precision":"month","end_date":null,"type":"point","layer":"企業と資金調達","title":"Sakana AIが約300億円を調達","summary":"東京拠点のSakana AIがシリーズAで約300億円を調達。設立から約1年で評価額10億ドル超と報じられ、国内最速級のユニコーンとされた。元Googleの研究者らが2023年に創業した企業で、ChatGPT以降の生成AIブームと育成5か年計画の追い風を受けた。\n\n海外VCと国内大手金融機関が共同で出資しており、事業会社中心だった国内AI投資の構図が変わりつつあることを示す。ただし評価額は非公表で、報道により金額に幅があるため確定値ではない。","detail":null,"credibility":"disputed","credibility_note":"調達額は同社発表だが、企業評価額は非公表で報道により数値が異なる。","sources":[{"title":"Sakana AI 公式サイト","url":"https://sakana.ai/"},{"title":"Wikipedia: Sakana AI","url":"https://en.wikipedia.org/wiki/Sakana_AI"}]}]},{"slug":"business-ma-battles","title":"M&A戦略の名勝負","description":"1976年のKKR設立から日鉄・USスチールまで、世界と日本のM&Aの名勝負を、買収の攻防・防衛と規制・金融技術と市場の3層で重ねる。買収の武器と防衛策、そして国家の論理が競い合う50年が見える。","category":"business","language":"ja","start_year":1976,"end_year":2025,"layers":[{"name":"買収の攻防","color":"orange"},{"name":"防衛と規制","color":"teal"},{"name":"金融技術と市場","color":"gold"}],"events":[{"date":"1976-01-01","precision":"year","end_date":null,"type":"point","layer":"金融技術と市場","title":"KKR設立、LBOという武器の誕生","summary":"コールバーグ、クラビス、ロバーツの3人が投資会社KKRを設立した。借入で買収資金を賄い、買収先の資産と将来収益で返済するLBO(レバレッジド・バイアウト)を専業とする先駆けである。\n\n**経営権そのものを売買可能な商品に変えた**転換点であり、以後プライベート・エクイティは一つの産業として確立していく。12年後のRJRナビスコ争奪戦(買収の攻防レイヤー)で、その手法は頂点に達する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"KKR: Our History","url":null}]},{"date":"1982-01-01","precision":"year","end_date":null,"type":"point","layer":"防衛と規制","title":"リプトンがポイズンピルを考案","summary":"米国の弁護士マーティン・リプトンが、敵対的買収者の持分を希薄化する防衛策ポイズンピル(ライツプラン)を考案した。\n\n敵対的買収の全盛期に対する防衛側の発明であり、以後の買収攻防は「仕掛ける金融技術」対「守る法技術」の応酬として展開していく。四半世紀後には日本でも、ブルドックソース事件(2007年)でその適法性が司法判断の対象となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Shareholder rights plan","url":"https://en.wikipedia.org/wiki/Shareholder_rights_plan"}]},{"date":"1983-01-01","precision":"year","end_date":"1990-02-13","type":"period","layer":"金融技術と市場","title":"ジャンク債の時代、買収資金の革命","summary":"ドレクセル・バーナムのマイケル・ミルケンが育てた高利回り債(ジャンク債)市場が、敵対的買収やLBOの資金源として急拡大した。\n\n信用力の低い買い手でも巨額の買収資金を調達できるようになり、1980年代の米国買収ブームを金融面から支えた。ミルケンの訴追とドレクセルの経営破綻(1990年2月)でこの時代は終わるが、ハイイールド債市場そのものは定着した。","detail":null,"credibility":"unverified","credibility_note":"「ジャンク債の時代」という期間区分は概説によるもので、始期の設定には資料により幅がある。","sources":[{"title":"Wikipedia: Drexel Burnham Lambert","url":"https://en.wikipedia.org/wiki/Drexel_Burnham_Lambert"}]},{"date":"1988-11-30","precision":"day","end_date":null,"type":"point","layer":"買収の攻防","title":"RJRナビスコ争奪戦、KKRが勝利","summary":"食品・タバコ大手RJRナビスコの買収合戦で、KKRが経営陣側の対抗提案を退け、約250億ドルで勝利した。当時史上最大のLBOである。\n\n**買収の主役が事業会社から金融資本へ移った**ことを世界に印象づけ、顛末は『野蛮な来訪者』として書籍化された。ジャンク債(金融技術と市場レイヤー)が可能にした規模であり、80年代買収ブームの頂点にして転換点となった。","detail":null,"credibility":"disputed","credibility_note":"買収総額は約250億ドルとされることが多いが、負債込みで約311億ドルとする算定もあり、資料により幅がある。","sources":[{"title":"Bryan Burrough & John Helyar『Barbarians at the Gate』(1989)","url":null},{"title":"Wikipedia: RJR Nabisco","url":"https://en.wikipedia.org/wiki/RJR_Nabisco"}]},{"date":"2000-01-10","precision":"day","end_date":null,"type":"point","layer":"買収の攻防","title":"AOLとタイム・ワーナーが合併合意","summary":"AOLとタイム・ワーナーが合併で合意した。発表時の取引規模は約1650億ドルとされ、史上最大の合併と報じられた。\n\nネット企業が伝統メディアを飲み込む「新旧逆転」の象徴だったが、直後のドットコムバブル崩壊で統合は機能せず、2002年には巨額の減損を計上した。高騰した自社株を通貨とする買収の危うさを示す教科書的事例となった。","detail":null,"credibility":"disputed","credibility_note":"取引規模は約1650億ドルとする報道が多いが、株価変動を反映して1800億ドル超とする算定もある。","sources":[{"title":"Wikipedia: AOL","url":"https://en.wikipedia.org/wiki/AOL"}]},{"date":"2000-02-01","precision":"month","end_date":null,"type":"point","layer":"買収の攻防","title":"ボーダフォンがマンネスマン買収に成功","summary":"英ボーダフォンによる独マンネスマンへの敵対的買収が、約1800億ドル規模で決着した。金額において史上最大級の買収とされる。\n\n敵対的買収がほぼ存在しなかったドイツで成立した点が衝撃で、株主資本主義が大陸欧州の企業統治を塗り替える転機となった。従業員と地域を重視する欧州型経営と資本市場の論理の衝突として、その後も長く論争の対象となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Mannesmann","url":"https://en.wikipedia.org/wiki/Mannesmann"}]},{"date":"2005-02-08","precision":"day","end_date":null,"type":"point","layer":"買収の攻防","title":"ライブドア、ニッポン放送株を大量取得","summary":"ライブドアが東証の時間外取引でニッポン放送株の約3割を取得し、フジテレビとの争奪戦が始まった。ニッポン放送側は新株予約権の発行で対抗したが、裁判所により差し止められた。\n\n**ルールの隙間を突く買収**が日本の茶の間の話題となり、敵対的買収と企業価値をめぐる議論を一気に大衆化させた。翌年以降の買収防衛策の導入ラッシュと制度整備(防衛と規制レイヤー)の直接の引き金である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"東京高裁 平成17年3月23日決定(ニッポン放送新株予約権発行差止事件)ほか関連報道","url":null}]},{"date":"2006-06-25","precision":"day","end_date":null,"type":"point","layer":"買収の攻防","title":"ミタルがアルセロール買収で合意","summary":"ミタル・スチールによる欧州鉄鋼大手アルセロールへの敵対的買収が、約270億ユーロで合意に至った。世界最大の鉄鋼会社アルセロール・ミタルが誕生する。\n\nアルセロール側は各国政府も巻き込んで抵抗したが、最終的には株主の経済合理性が国家的な産業防衛の論理を上回った。約20年後の日鉄・USスチール(買収の攻防レイヤー)では、この力関係が逆転して見えることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ArcelorMittal","url":"https://en.wikipedia.org/wiki/ArcelorMittal"}]},{"date":"2006-07-01","precision":"month","end_date":null,"type":"point","layer":"防衛と規制","title":"王子製紙が北越製紙へ敵対的TOB","summary":"王子製紙が同業の北越製紙へ敵対的TOBを仕掛けた。日本の大手企業同士では戦後初とされる敵対的TOBだった。\n\n北越は三菱商事への第三者割当増資で対抗し、日本製紙も北越株を買い増してTOBは不成立に終わった。安定株主の存在による防衛が機能した事例であり、当時の日本で敵対的買収が成立しにくい構造を改めて示した。13年後の伊藤忠・デサント(買収の攻防レイヤー)と対をなす。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"王子製紙による北越製紙株式への公開買付けに関する開示資料(2006年)","url":null}]},{"date":"2007-05-01","precision":"day","end_date":null,"type":"point","layer":"金融技術と市場","title":"三角合併解禁、外資買収への警戒","summary":"会社法の合併対価柔軟化の施行により、外国企業が自社株を対価として日本企業を買収する三角合併が解禁された。\n\n外資による買収の急増が警戒され、施行が1年延期された経緯自体が、当時の日本の防衛意識を物語る。実際の利用例は限られたが、買収防衛策を導入する上場企業が急増する契機となり、防衛と規制レイヤーの議論を加速させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"法務省: 会社法における合併等対価の柔軟化(平成19年5月1日施行)","url":null}]},{"date":"2007-08-07","precision":"day","end_date":null,"type":"point","layer":"防衛と規制","title":"ブルドックソース事件、最高裁が防衛策容認","summary":"米系ファンドのスティール・パートナーズによるブルドックソースへのTOBをめぐり、最高裁が同社の買収防衛策(新株予約権の差別的割当)を適法と判断した。\n\n株主総会の圧倒的多数による承認を重視した判断で、**防衛策の適法性の限界線を司法が引いた**日本初の最高裁判断となった。以後の防衛策設計と、濫用的買収者をめぐる議論の基準点であり続けている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"最高裁判所 平成19年8月7日決定(ブルドックソース事件)","url":null}]},{"date":"2016-04-06","precision":"day","end_date":null,"type":"point","layer":"防衛と規制","title":"ファイザー・アラガン合併、税制規制で断念","summary":"ファイザーとアラガンが約1600億ドルの合併を断念した。米財務省が直前に発表した税逆転(タックス・インバージョン)対策の新規則が理由である。\n\n節税を主目的として本社を海外へ移す型のM&Aを、規制が事実上封じた事例となった。買収の設計が税制と規制の関数であることを示し、以後の大型案件では規制リスクの審査が取引条件の中心に据えられていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Pfizer: Pfizer Announces Termination of Proposed Combination with Allergan (2016-04-06)","url":null}]},{"date":"2016-07-18","precision":"day","end_date":null,"type":"point","layer":"買収の攻防","title":"ソフトバンクがARMを約3.3兆円で買収へ","summary":"ソフトバンクグループが英半導体設計のARMを約240億ポンド(約3.3兆円)で買収すると発表した。当時、日本企業による海外買収として最大級だった。\n\n上場企業を完全買収して長期投資へ切り替える狙いが語られ、日本企業の大型クロスボーダーM&A時代を象徴する案件となった。のちのNVIDIAへの売却断念(2022年、各国の規制審査による)まで含め、半導体が国家的資産になっていく流れの中にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ソフトバンクグループ プレスリリース: 英国ARM社の買収について(2016年7月18日)","url":null}]},{"date":"2018-03-12","precision":"day","end_date":null,"type":"point","layer":"防衛と規制","title":"米大統領令がブロードコムのクアルコム買収を阻止","summary":"トランプ米大統領が、ブロードコムによるクアルコム買収を安全保障上の理由で禁止する命令に署名した。CFIUS(対米外国投資委員会)の勧告に基づく異例の措置である。\n\n成立前の買収を大統領令で止めた展開は、**M&Aが安全保障政策の対象になった**ことを決定づけた。5G技術の主導権への懸念が理由とされ、以後、半導体を中心に各国の投資審査が一斉に強化されていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"White House: Presidential Order Regarding the Proposed Takeover of Qualcomm by Broadcom (2018-03-12)","url":null}]},{"date":"2018-05-08","precision":"day","end_date":null,"type":"point","layer":"買収の攻防","title":"武田薬品がシャイアー買収で合意","summary":"武田薬品工業がアイルランドの製薬大手シャイアーの買収で合意した。総額約460億ポンド(円換算6兆円超)で、日本企業による海外買収として過去最大となった。\n\n規模の追求と新薬パイプラインの獲得を狙う大きな賭けで、買収資金の借入による財務負担への懸念も同時に噴出した。日本企業のM&Aが「小規模な出資」から「本体を賭けた買収」へと変わったことを示す頂点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"武田薬品工業: Shire plc買収の合意に関する発表(2018年5月8日)","url":null}]},{"date":"2019-03-01","precision":"month","end_date":null,"type":"point","layer":"買収の攻防","title":"伊藤忠、デサントへの敵対的TOBが成立","summary":"伊藤忠商事によるデサントへのTOBが成立した。対象会社の同意を得ないまま成立した敵対的TOBとしては、日本の大手企業間で初とされる。\n\n王子製紙の失敗(2006年、防衛と規制レイヤー)から13年、機関投資家の行動変化とガバナンス改革により、同意なき買収が成立し得る市場へ変わったことを示した。以後「同意なき買収」は日本でも経営戦略の現実的な選択肢となっていく。","detail":null,"credibility":"disputed","credibility_note":"「大手企業間で初の敵対的TOB成立」という位置づけは報道・解説による整理で、対象範囲の取り方により見解が分かれる。","sources":[{"title":"伊藤忠商事: デサント株式に対する公開買付けの結果について(2019年3月)","url":null}]},{"date":"2020-01-01","precision":"year","end_date":"2021-12-31","type":"period","layer":"金融技術と市場","title":"SPACブーム、上場の抜け道が過熱","summary":"買収を目的とする上場箱会社SPACの上場と合併が米国で急増し、2020〜21年に数百社が上場、調達額は年間800億ドルを超えたとされる。\n\n未上場企業が通常より緩い審査で上場する経路として過熱したが、金利上昇とSEC規制強化で2022年に急減した。ジャンク債の時代と同様、金融技術の発明が買収の波を作り、規制がそれを閉じるという循環の再演である。","detail":null,"credibility":"unverified","credibility_note":"SPACの上場社数・調達額は集計機関により異なり、ブームの期間区分にも幅がある。","sources":[{"title":"Wikipedia: Special-purpose acquisition company","url":"https://en.wikipedia.org/wiki/Special-purpose_acquisition_company"}]},{"date":"2022-10-27","precision":"day","end_date":null,"type":"point","layer":"買収の攻防","title":"マスクによるTwitter買収が完了","summary":"イーロン・マスクによるTwitter買収が約440億ドルで完了した。同年4月の合意後にマスク側が撤回を表明し、会社側の履行請求訴訟を経て、公判直前に当初条件のまま決着した。\n\n買収契約の履行をデラウェア州の裁判所が担保する米国実務の強さを示した事例である。個人による大型買収と、完了後の急激な経営改変は、M&Aと企業統治の議論に新しい題材を提供した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Acquisition of Twitter by Elon Musk","url":"https://en.wikipedia.org/wiki/Acquisition_of_Twitter_by_Elon_Musk"}]},{"date":"2023-10-13","precision":"day","end_date":null,"type":"point","layer":"防衛と規制","title":"MSのActivision買収、2年の審査を経て完了","summary":"MicrosoftによるActivision Blizzardの買収が約687億ドルで完了した。2022年1月の発表から、米FTCの差し止め請求と英CMAによる当初の禁止決定を経て、条件修正の末に承認された。\n\nクラウドゲーム配信権の一部譲渡という構造的な救済策で英当局が翻意した経緯は、巨大テックのM&Aが世界の競争当局の同時審査に服する現実を示した。審査が2年近くに及ぶこと自体が、大型M&Aの新常態となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Acquisition of Activision Blizzard by Microsoft","url":"https://en.wikipedia.org/wiki/Acquisition_of_Activision_Blizzard_by_Microsoft"}]},{"date":"2023-12-18","precision":"day","end_date":"2025-06-18","type":"period","layer":"買収の攻防","title":"日鉄のUSスチール買収、政治に翻弄された1年半","summary":"日本製鉄がUSスチールの買収(約141億ドル)を発表してから完了までに約1年半を要した。米大統領選の争点となり、2025年1月にバイデン大統領が中止命令を出したが、政権交代後、安全保障協定と米政府への黄金株発行を条件に承認された。\n\n同盟国企業による買収さえ政治の審査対象となり、**国家が買収条件の当事者になった**事例である。ミタル・アルセロール(2006年)で株主の論理が勝った鉄鋼業で、20年後には国家の論理が最終決定権を握った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本製鉄: USスチールの買収に関するお知らせ(2023年12月18日ほか一連の開示)","url":null}]}]},{"slug":"business-real-estate-bubbles","title":"不動産バブルの教訓","description":"日本のバブル、米サブプライム、中国の恒大危機。三つの不動産バブルを市場・金融政策・人々の暮らしの3層で重ね、「今回は違う」が繰り返される構造を読み解く年表。","category":"business","language":"ja","start_year":1985,"end_year":2024,"layers":[{"name":"市場と価格","color":"orange"},{"name":"金融と政策","color":"teal"},{"name":"人々と暮らし","color":"pink"}],"events":[{"date":"1985-09-22","precision":"day","end_date":null,"type":"point","layer":"金融と政策","title":"プラザ合意、円高対策の金融緩和が始まる","summary":"先進5か国の蔵相・中央銀行総裁がドル高是正で合意(プラザ合意)した。急激な円高が進み、輸出不況を恐れた日本は内需拡大と金融緩和へ舵を切る。\n\n公定歩合は1987年までに当時史上最低の2.5%まで引き下げられ、行き場を求めた資金が株式と不動産へ流れ込んだ。**バブルは金融緩和の顔をしてやってくる**。日本の資産バブルの出発点として、その後の米国・中国の危機と比較され続ける出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: プラザ合意","url":"https://ja.wikipedia.org/wiki/%E3%83%97%E3%83%A9%E3%82%B6%E5%90%88%E6%84%8F"}]},{"date":"1986-12-01","precision":"month","end_date":"1991-02-28","type":"period","layer":"市場と価格","title":"バブル景気、地価と株価が実体から乖離","summary":"内閣府の景気基準日付で1986年12月から1991年2月まで51か月続いた拡張期は、後に「バブル景気」と呼ばれる。この間、地価と株価は実体経済の成長を大きく上回る速度で上昇した。\n\n「土地の値段は下がらない」という土地神話が融資審査の前提となり、担保価値の上昇がさらなる融資を生む循環が続いた。金融と政策レイヤーの低金利と、人々と暮らしレイヤーの財テク熱がこの期間に重なり合っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 景気基準日付","url":"https://www.esri.cao.go.jp/jp/stat/di/hiduke.html"}]},{"date":"1987-01-01","precision":"year","end_date":null,"type":"point","layer":"人々と暮らし","title":"地上げと財テクブームが社会現象に","summary":"都心の地価高騰を背景に、住民に立ち退きを迫って土地をまとめる「地上げ」が社会問題化した。一般家庭にも財テクブームが広がり、この年のNTT株売り出しには個人投資家が殺到した。\n\n地価上昇で住宅は都心からますます遠のき、「持てる者と持てざる者」の格差感覚が広がるなど、バブルの負の面は崩壊前から暮らしに現れていた。熱狂の渦中でそれを異常と認識することの難しさを示す時期である。","detail":null,"credibility":"disputed","credibility_note":"地上げや財テクが社会問題化した時期には幅があり、1987年は象徴的な目安として置いている。","sources":[{"title":"Wikipedia: バブル景気","url":"https://ja.wikipedia.org/wiki/%E3%83%90%E3%83%96%E3%83%AB%E6%99%AF%E6%B0%97"}]},{"date":"1989-12-29","precision":"day","end_date":null,"type":"point","layer":"市場と価格","title":"日経平均が史上最高値3万8915円","summary":"大納会で日経平均株価が3万8915円87銭の史上最高値をつけた。この年、日銀は5月から利上げに転じており、12月には金融引き締めを進める三重野康が総裁に就任していた。\n\n株価はこの日を頂点に下落へ転じるが、地価の下落はさらに1年以上遅れて始まった。**資産価格は同時には崩れない**。この時間差が「不動産は大丈夫」という楽観を生み、崩壊の認識と対応を遅らせる一因となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本経済新聞: 日経平均株価の史上最高値(1989年12月29日)に関する記録","url":null}]},{"date":"1990-03-27","precision":"day","end_date":null,"type":"point","layer":"金融と政策","title":"大蔵省が不動産融資の総量規制を通達","summary":"大蔵省が金融機関に対し、不動産向け融資の伸び率を総貸出の伸び率以下に抑えるよう求める行政指導(総量規制)を通達した。\n\n過熱を放置した後の急ブレーキは、日銀の連続利上げと重なって地価の急落を招き、抑制策としては遅すぎかつ急激すぎたと後に評価される。**出口政策の難しさ**を示す教訓として、サブプライム期の米国や「三道紅線」の中国(いずれも金融と政策レイヤー)と比較され続けている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"大蔵省銀行局長通達「土地関連融資の抑制について」(1990-03-27)","url":null}]},{"date":"1991-01-01","precision":"year","end_date":null,"type":"point","layer":"市場と価格","title":"地価がピークアウト、長期下落へ","summary":"全国の地価は1991年前後にピークを打ち、公示地価は1992年から下落に転じた。大都市圏の商業地はその後10年余りで8割前後下落したとされる。\n\n担保価値の崩壊は金融機関の不良債権となり、企業と家計は借金返済とバランスシートの修復を優先して支出を絞った。バブル崩壊が長期停滞へ転化していくこの過程は、後に「バランスシート不況」として概念化され、他国の危機を読む枠組みにもなった。","detail":null,"credibility":"disputed","credibility_note":"下落率は用いる指数(六大都市市街地価格指数、公示地価など)と地域の取り方により大きく異なり、8割前後は商業地の代表的な推計である。","sources":[{"title":"国土交通省: 地価公示","url":null},{"title":"日本不動産研究所: 市街地価格指数","url":null}]},{"date":"1997-11-01","precision":"month","end_date":null,"type":"point","layer":"金融と政策","title":"拓銀・山一證券が破綻、金融危機が噴出","summary":"北海道拓殖銀行と山一證券が同じ月に相次いで経営破綻した。バブル期の不動産関連融資に由来する不良債権と損失隠しが、崩壊から6年を経て金融システム危機として噴出した。\n\n「大手金融機関は潰れない」という前提が崩れ、貸し渋りが実体経済を冷やす悪循環に入る。バブル崩壊の本当のコストは崩壊の瞬間ではなく**数年遅れの金融危機**として現れる。この時差は2008年の米国、2020年代の中国にも共通するパターンである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 北海道拓殖銀行","url":"https://ja.wikipedia.org/wiki/%E5%8C%97%E6%B5%B7%E9%81%93%E6%8B%93%E6%AE%96%E9%8A%80%E8%A1%8C"},{"title":"Wikipedia: 山一證券","url":"https://ja.wikipedia.org/wiki/%E5%B1%B1%E4%B8%80%E8%A8%BC%E5%88%B8"}]},{"date":"2001-01-03","precision":"month","end_date":"2004-06-30","type":"period","layer":"金融と政策","title":"米FRBの超低金利期、住宅ブームの燃料に","summary":"ITバブル崩壊と同時多発テロを受け、FRBは2001年に11回の利下げを実施。政策金利は2003年に1%まで下がり、2004年半ばまで低水準に据え置かれた。\n\n低金利と「住宅価格が全国一斉に下がったことはない」という経験則が融資の規律を緩め、信用力の低い層へのサブプライムローンと、それを組み替えて売る証券化が急拡大する。日本の1980年代後半と同じく、**緩和マネーの行き先**が次の危機の発生場所を決めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Federal Reserve: Open Market Operations - historical federal funds target rate","url":"https://www.federalreserve.gov/monetarypolicy/openmarket.htm"}]},{"date":"2006-07-01","precision":"month","end_date":null,"type":"point","layer":"市場と価格","title":"米住宅価格がピーク、静かな転換点","summary":"ケース・シラー全米住宅価格指数は2006年半ばに頂点をつけ、下落に転じた。住宅着工と販売もこの前後から減速し始めた。\n\n当時は「軟着陸する」との見方が支配的で、影響は限定的とする楽観が当局にも共有されていた。日本の1990年前後と同じく、**ピークはその渦中では認識されない**。サブプライムローンの延滞率上昇が誰の目にも明らかになるのは翌年からであり、市場の転換から危機の自覚までに1年以上の空白があった。","detail":null,"credibility":"disputed","credibility_note":"住宅価格ピークの時期は用いる指数と季節調整の有無により2006年前半から2007年初めまで幅がある。","sources":[{"title":"S&P CoreLogic Case-Shiller U.S. National Home Price Index","url":"https://fred.stlouisfed.org/series/CSUSHPINSA"}]},{"date":"2007-08-09","precision":"day","end_date":null,"type":"point","layer":"金融と政策","title":"パリバ・ショック、危機が金融市場へ波及","summary":"仏BNPパリバが傘下ファンドの解約凍結を発表し、サブプライム関連証券の価格が算定不能になっている実態が露呈した。欧州中央銀行は即日で大規模な資金供給に踏み切った。\n\n住宅ローンは証券化によって世界中の投資家に散らばっており、米国の住宅市場の変調が世界の金融市場を直撃する経路がここで可視化された。リーマン破綻の1年以上前に市場は警告を発していたが、危機の全体像の把握はなお遅れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: パリバ・ショック","url":"https://ja.wikipedia.org/wiki/%E3%83%91%E3%83%AA%E3%83%90%E3%83%BB%E3%82%B7%E3%83%A7%E3%83%83%E3%82%AF"}]},{"date":"2008-09-15","precision":"day","end_date":null,"type":"point","layer":"金融と政策","title":"リーマン・ブラザーズ破綻、世界金融危機へ","summary":"米証券大手リーマン・ブラザーズが連邦破産法11条の適用を申請し、世界金融危機が本格化した。負債総額は約6000億ドルで、米国史上最大の企業倒産となった。\n\n発端は住宅バブルの崩壊だが、被害を桁違いに拡大したのは証券化とレバレッジという金融の増幅装置だった。日本の1997年(同じ金融と政策レイヤー)と重ねると、不動産バブルの崩壊が数年の時差を経て金融システム危機へ転化するという経路の相似が浮かび上がる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: リーマン・ブラザーズ","url":"https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%BC%E3%83%9E%E3%83%B3%E3%83%BB%E3%83%96%E3%83%A9%E3%82%B6%E3%83%BC%E3%82%BA"}]},{"date":"2010-01-01","precision":"year","end_date":null,"type":"point","layer":"人々と暮らし","title":"米国で住宅差し押さえ危機が深刻化","summary":"住宅ローンを返済できず家を差し押さえられる世帯が急増し、2010年の差し押さえ関連通知は280万件を超えたとされる。書類を確認せず機械的に手続きを進める「ロボサイニング」の不正も発覚した。\n\n金融機関が公的資金で救済される一方、危機の帳尻は家計に残った。この不公平感は後の政治的分断やウォール街占拠運動の土壌となる。バブルの後始末が**誰の痛みとして残るか**という問いは、日本の住宅ローン破綻や中国の爛尾楼にも通じる。","detail":null,"credibility":"unverified","credibility_note":"差し押さえ件数はRealtyTracなど民間調査会社の集計に基づき、集計方法により数値が異なる。","sources":[{"title":"RealtyTrac: 2010 Year-End Foreclosure Market Report","url":null}]},{"date":"2016-12-01","precision":"month","end_date":null,"type":"point","layer":"金融と政策","title":"中国が「房住不炒」を打ち出す","summary":"中国の中央経済工作会議が「住宅は住むためのものであり、投機の対象ではない(房住不炒)」という方針を打ち出した。\n\n不動産は関連産業を含め中国のGDPの2〜3割に関わるとされる基幹産業で、地方政府の財政も土地使用権の譲渡収入に大きく依存していた。投機の抑制と成長の維持という矛盾する要請の間で政策は揺れ続け、規制が本格的に牙をむくのは2020年の「三道紅線」(同じ金融と政策レイヤー)からとなる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"新華社: 中央経済工作会議報道 (2016年12月)","url":null}]},{"date":"2020-08-01","precision":"month","end_date":null,"type":"point","layer":"金融と政策","title":"「三道紅線」で不動産開発企業の借入を規制","summary":"中国当局が不動産開発企業の財務に3つの上限(負債比率などの「三道紅線」)を設け、基準を超える企業の新規借入を制限する規制を導入した。\n\n借入と前受金に依存して高速回転で拡大してきた開発企業の資金繰りを直撃し、翌年の恒大危機の直接の引き金となった。過熱を長く放置した後の急ブレーキが崩壊の形を決めるという点で、日本の総量規制(1990年)との相似がしばしば指摘される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters: China's \"three red lines\" property financing rules coverage (2020)","url":null}]},{"date":"2021-12-09","precision":"day","end_date":null,"type":"point","layer":"市場と価格","title":"恒大集団が事実上のデフォルトに","summary":"格付け会社フィッチが中国恒大集団を「一部債務不履行」に格下げし、負債総額3000億ドル超とされる世界最大級の不動産デベロッパーの破綻が現実となった。\n\n販売代金を先に受け取り建設は後というプリセールス依存の事業構造は、資金繰りが止まった瞬間に未完成物件と前払いした家計を大量に残す。危機は碧桂園など同業他社へ連鎖し、中国の新築住宅販売は長期の減少局面に入った。人々と暮らしレイヤーの爛尾楼問題が同時進行する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters: Fitch declares China Evergrande in default (2021-12-09)","url":null}]},{"date":"2022-07-01","precision":"month","end_date":null,"type":"point","layer":"人々と暮らし","title":"「爛尾楼」で住宅ローン返済拒否が広がる","summary":"建設が止まったままの未完成マンション(爛尾楼)を購入した人々が、物件の引き渡しまで住宅ローンの返済を拒否する集団行動を起こし、中国の多数の都市に広がった。\n\n代金を前払いした家計が最大の被害者になるという構図が可視化され、当局は建設完了を優先する「保交楼」政策を打ち出した。バブルの痛みが暮らしに現れる形は、日本のローン破綻、米国の差し押さえ、中国の爛尾楼と国ごとに異なるが、最も弱い立場に集中する点は共通している。","detail":null,"credibility":"disputed","credibility_note":"返済拒否運動の規模(対象物件数・都市数)はSNS上の集計や報道推計に基づくもので、公式統計はない。","sources":[{"title":"BBC News: China mortgage boycott coverage (2022-07)","url":null}]},{"date":"2024-01-29","precision":"day","end_date":null,"type":"point","layer":"市場と価格","title":"香港高裁が恒大集団に清算命令","summary":"香港高等法院が中国恒大集団に清算命令を出した。2021年の債務不履行から2年余り、債権者との再建協議はまとまらなかった。\n\n中国の不動産調整は販売・価格・投資の減少が数年続く長期戦となり、需要の先食いと人口減少を踏まえて「日本化」への懸念が論じられるようになった。三つのバブルを重ねると、崩壊後の損失処理の速度と透明性が、その後の停滞の長さを分ける変数として浮かび上がってくる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters: Hong Kong court orders liquidation of China Evergrande (2024-01-29)","url":null}]},{"date":"2024-02-22","precision":"day","end_date":null,"type":"point","layer":"市場と価格","title":"日経平均が34年ぶりに史上最高値を更新","summary":"日経平均株価が3万9098円68銭で取引を終え、1989年末につけた史上最高値をおよそ34年ぶりに更新した。\n\nバブル期の高値回復に34年を要したという事実は、資産バブルの後始末の長さを何より雄弁に物語る。同じ時期、東京の新築マンション価格は歴史的な高値圏にあり、これを「新たなバブル」と見るかを巡って見方は分かれている。**「今回は違う」と言えるのか**という本年表の問いは、現在も開いたままである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本経済新聞: 日経平均、34年ぶり最高値更新 (2024-02-22)","url":null}]}]},{"slug":"business-retail-revolution","title":"流通革命の歴史","description":"1904年の百貨店誕生からECと買収攻防まで、日本の小売を業態の革新・企業の攻防・制度と消費の3層で重ねる。規制と消費の変化が新しい業態を生み、旗手が交代し続けた120年が見えてくる。","category":"business","language":"ja","start_year":1904,"end_year":2024,"layers":[{"name":"業態の革新","color":"green"},{"name":"企業の攻防","color":"orange"},{"name":"制度と消費","color":"teal"}],"events":[{"date":"1904-12-01","precision":"month","end_date":null,"type":"point","layer":"業態の革新","title":"三越「デパートメントストア宣言」","summary":"三井呉服店が三越呉服店へと改組するにあたり、「デパートメントストア宣言」を打ち出した。米欧の百貨店にならい、呉服にとどまらない多様な商品を一つの店で扱うと宣言した。\n\n日本の近代小売業の出発点とされる出来事で、店に行くこと自体が娯楽になる都市の消費文化を生んだ。宣言の基準日は、1904年12月の挨拶状と1905年1月の新聞広告のどちらを取るかで記述が分かれる。","detail":null,"credibility":"disputed","credibility_note":"宣言の基準日は1904年12月の挨拶状と1905年1月2日の新聞広告掲載のいずれを取るかで、資料により異なる。","sources":[{"title":"三越伊勢丹ホールディングス: 三越の歴史(デパートメントストア宣言)","url":null}]},{"date":"1953-01-01","precision":"year","end_date":null,"type":"point","layer":"業態の革新","title":"紀ノ国屋がセルフサービス方式を導入","summary":"東京・青山の紀ノ国屋が、客が商品を自ら手に取りレジでまとめて精算するセルフサービス方式の食料品店を開いた。日本初のセルフサービス店とされることが多い。\n\n対面販売が当然だった小売に「**売り場から店員を減らす**」という発想を持ち込み、スーパーマーケットという業態の起点となった。ただし「日本初」の認定は、セルフサービスの定義により諸説がある。","detail":null,"credibility":"disputed","credibility_note":"「日本初のセルフサービス店」という位置づけは、セルフサービスの定義や対象範囲により諸説がある。","sources":[{"title":"紀ノ国屋 会社案内・沿革","url":null}]},{"date":"1957-01-01","precision":"year","end_date":null,"type":"point","layer":"業態の革新","title":"「主婦の店ダイエー」1号店が開店","summary":"中内㓛が大阪・千林に「主婦の店ダイエー」を開いた。安売りを掲げる小さな薬局兼日用品店が、のちに日本最大の小売企業へと成長していく。\n\n高度経済成長の入口で、メーカー主導の定価販売に対し「価格は消費者が決める」と挑んだ。制度と消費レイヤーの『流通革命』(1962年)は、この安売り勢の実践を理論の側から後押しすることになる。","detail":null,"credibility":"disputed","credibility_note":"1号店の開店日は資料により表記が分かれるため、年単位の精度とした。","sources":[{"title":"ダイエー 会社沿革","url":null}]},{"date":"1962-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と消費","title":"林周二『流通革命』刊行、問屋無用論","summary":"東京大学の林周二が『流通革命』を刊行した。スーパーマーケットの連鎖化が卸を中抜きし流通構造を作り替えるとする**「問屋無用論」**で論争を呼び、ベストセラーとなった。\n\n本年表の題名の由来でもある本書は、ダイエーら安売り勢(業態の革新レイヤー)に理論的な旗を与えた。実際には卸は消滅せず機能を変えて生き残り、その予言の当否自体が流通研究の主題となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"林周二『流通革命 製品・経路および消費者』中公新書(1962)","url":null}]},{"date":"1962-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と消費","title":"渥美俊一がペガサスクラブを設立","summary":"経営コンサルタントの渥美俊一が、チェーンストア経営の研究団体ペガサスクラブを設立した。ダイエー、イトーヨーカ堂、ジャスコなど、のちの大手小売の経営者が名を連ねた。\n\n米国流のチェーンストア理論を日本の小売経営者へ体系的に伝えた回路であり、1960〜70年代の急成長期の共通の教科書となった。設立時期の細部は一次資料で確認しづらく、年単位の記載とした。","detail":null,"credibility":"unverified","credibility_note":"設立年は1962年とする資料に依拠したが、設立月日や当初の会員構成は一次資料で確認できていない。","sources":[{"title":"日本リテイリングセンター(ペガサスクラブ)に関する各種資料","url":null}]},{"date":"1972-01-01","precision":"year","end_date":null,"type":"point","layer":"企業の攻防","title":"ダイエーが三越を抜き小売業売上日本一","summary":"ダイエーの売上高が三越を抜き、小売業日本一となった。呉服店を起源とする百貨店から、戦後生まれのスーパーマーケットへの首位交代である。\n\n創業からわずか15年での達成は、大量仕入れと多店舗展開というチェーンストア理論(制度と消費レイヤー)の成果だった。一方で急拡大は各地で出店摩擦を生み、翌年の大規模小売店舗法制定の一因となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ダイエー社史および日経流通新聞など当時の報道","url":null}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"制度と消費","title":"大規模小売店舗法が公布","summary":"大規模小売店舗法が公布された。一定面積以上の出店に地元との調整手続きを課すもので、スーパーの急拡大と地元商店街の摩擦を背景とする。\n\n**規制が業態の進化経路を決める**ことになり、大型店の出店抑制は、コンビニという小型業態(業態の革新レイヤー)の急成長を促す意図せざる結果を生んだ。以後30年近く、この法律が日本の小売の地形を規定する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"大規模小売店舗における小売業の事業活動の調整に関する法律(昭和48年法律第109号)","url":null}]},{"date":"1974-05-15","precision":"day","end_date":null,"type":"point","layer":"業態の革新","title":"セブン-イレブン1号店が豊洲に開店","summary":"セブン-イレブン・ジャパンの1号店が東京・豊洲に開店した。米サウスランド社との提携によるもので、既存の酒店からの業態転換第1号だった。\n\n大型店規制の時代に、小さな独立商店をフランチャイズと情報システムで束ねる方式は日本の環境に適合し、コンビニは日本で独自の進化を遂げる業態となった。のちのPOS導入(1982年)で、この店舗網は巨大な情報装置へ変わる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"セブン-イレブン・ジャパン 会社沿革","url":null}]},{"date":"1982-01-01","precision":"year","end_date":null,"type":"point","layer":"業態の革新","title":"セブン-イレブンが全店POSを導入","summary":"セブン-イレブンが全店にPOSシステムを導入し、単品ごとの販売データを本部で集約する体制を整えた。日本の小売で最も早い全面導入の一つである。\n\n「何がいつ売れたか」に基づく単品管理と多頻度配送は、勘と経験の商売をデータ経営へ変えた。**店頭を情報の入口に変えた**ことが日本のコンビニの競争力の核であり、後年のリテールメディア論の遠い先祖ともいえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"セブン&アイ・ホールディングス: セブン-イレブンの歩み(POSシステム導入)","url":null}]},{"date":"1984-06-02","precision":"day","end_date":null,"type":"point","layer":"業態の革新","title":"ユニクロ1号店が広島に開店","summary":"広島市にユニクロ1号店「ユニーク・クロージング・ウエアハウス」が開店した。カジュアル衣料を倉庫風の店舗でセルフサービス販売する形態だった。\n\nのちに製造小売(SPA)へ転換し、企画から製造・販売までを一体化して低価格と品質を両立させる。衣料品の主導権が百貨店・問屋からSPAへ移る流れの起点であり、流通革命の衣料版にあたる出来事といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ファーストリテイリング 沿革","url":null}]},{"date":"1990-06-01","precision":"month","end_date":null,"type":"point","layer":"制度と消費","title":"日米構造協議で大店法の緩和が決定","summary":"日米構造問題協議の最終報告に、大店法の運用適正化と段階的な規制緩和が盛り込まれた。米国が日本の流通構造を非関税障壁として問題視した結果である。\n\n国内の商業調整だった小売規制が、通商問題として外圧により壊された点が特徴で、以後大型店の出店が加速する。トイザらス日本1号店(1991年)はその象徴とされ、緩和の流れは2000年の大店法廃止へつながる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日米構造問題協議 最終報告(1990年6月)","url":null}]},{"date":"1997-05-01","precision":"day","end_date":null,"type":"point","layer":"業態の革新","title":"楽天市場が開設","summary":"楽天市場が開設された。当初の出店店舗は13店で、中小店舗が月額数万円で出店できるモール型ECとして始まった。\n\n店舗網も土地も持たない小売基盤の登場は、出店規制(制度と消費レイヤー)を前提としてきた競争の意味を根本から変えていく。個店の集合体というモール設計は、商店街の論理をオンラインへ移した日本的なECの原型となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"楽天グループ 会社沿革","url":null}]},{"date":"2000-06-01","precision":"day","end_date":null,"type":"point","layer":"制度と消費","title":"大店法廃止、大店立地法施行","summary":"大規模小売店舗法が廃止され、大規模小売店舗立地法が施行された。出店規制の観点が「商業調整」から交通・騒音など「生活環境」へと転換した。\n\n経済的規制の撤退により郊外型ショッピングセンターの出店が加速し、中心市街地の空洞化が新たな政策課題となる。半世紀近く続いた大型店規制の枠組みは、ECの台頭とほぼ同時に幕を下ろした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省: 大規模小売店舗立地法","url":null}]},{"date":"2000-11-01","precision":"day","end_date":null,"type":"point","layer":"企業の攻防","title":"Amazon.co.jpが開業","summary":"Amazon.co.jpが書籍のオンライン販売で開業した。米Amazonの日本進出であり、当初の取り扱いは書籍のみだった。\n\n**物流網そのものを店にする**外来の競争者の登場は、価格と品揃えの基準を静かに書き換えていった。取扱品目と自社物流の拡大により、2010年代には日本の小売各社の戦略がAmazonへの対応を軸に語られるようになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"アマゾン ジャパン プレスリリース(2000年11月1日)","url":null}]},{"date":"2004-12-01","precision":"month","end_date":null,"type":"point","layer":"企業の攻防","title":"ダイエーが産業再生機構の支援下に","summary":"経営再建中のダイエーが、産業再生機構の支援を受けることが決まった。売上日本一の達成から約30年、流通革命の旗手は事実上の経営破綻に至った。\n\n土地を担保に出店を重ねる拡大路線がバブル崩壊で裏目に出た結果であり、「規模の追求」というチェーンストア理論の限界を示した。小売の主役は、情報化に賭けたセブン&アイとイオンの2強へ交代していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"産業再生機構: ダイエーに対する支援決定(2004年12月)","url":null}]},{"date":"2018-01-22","precision":"day","end_date":null,"type":"point","layer":"業態の革新","title":"レジ無し店舗Amazon Goが一般公開","summary":"レジ無しコンビニAmazon Goの1号店が、米シアトルで一般公開された。カメラとセンサーで購買を検知し、精算という行為そのものを無くした。\n\n紀ノ国屋のセルフサービス(1953年)がレジを残して店員を減らしたのに対し、レジ自体を消した点で業態革新の系譜の延長にある。日本でも省人化店舗の実験が相次ぐ契機となったが、大規模展開には至っていない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Go","url":"https://en.wikipedia.org/wiki/Amazon_Go"}]},{"date":"2020-01-01","precision":"year","end_date":"2022-12-31","type":"period","layer":"制度と消費","title":"コロナ禍でEC化が一気に進む","summary":"新型コロナウイルス感染拡大に伴う外出抑制で、EC利用が一気に広がった。経済産業省の調査では、物販のEC化率が2019年の6.76%から2021年には8.78%へ上昇した。\n\nネットスーパーや食品宅配など「早すぎた」とされてきた領域が定着し、店舗はECの受け取り・配送拠点を兼ねる存在へ再定義された。**店に行くことが選択肢の一つになった**、消費行動の不可逆な転換期である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省「電子商取引に関する市場調査」","url":null}]},{"date":"2024-08-19","precision":"day","end_date":null,"type":"point","layer":"企業の攻防","title":"セブン&アイにクシュタールが買収提案","summary":"セブン&アイ・ホールディングスが、カナダのコンビニ大手アリマンタシォン・クシュタールから買収提案を受けたと公表した。実現すれば外資による日本企業の買収として最大級とされた。\n\n日本の小売の代表格が買収対象となったことは、事業価値と時価総額の乖離という資本市場からの評価を突き付けた。提案額は報道ベースで数兆円規模とされ、2025年7月にクシュタールは提案を撤回した。","detail":null,"credibility":"disputed","credibility_note":"提案額(7兆円前後とされる)は報道ベースの数字であり、当事者が確定額として公式開示したものではない。","sources":[{"title":"セブン&アイ・ホールディングス 適時開示(2024年8月19日)および各社報道","url":null}]}]},{"slug":"business-startup-failures","title":"スタートアップ失敗学","description":"ドットコムバブル崩壊からFTXまで、破綻したスタートアップと資本の熱狂、そこから生まれた教訓を3層で重ねる。失敗のパターンが時代を超えて繰り返されることが見えてくる年表。","category":"business","language":"ja","start_year":2000,"end_year":2023,"layers":[{"name":"破綻の記録","color":"orange"},{"name":"資本と熱狂","color":"gold"},{"name":"検証と教訓","color":"teal"}],"events":[{"date":"2000-03-10","precision":"day","end_date":"2002-10-09","type":"period","layer":"資本と熱狂","title":"ドットコムバブル崩壊","summary":"2000年3月10日、ナスダック総合指数は5048の史上最高値を付けた直後に急落へ転じ、2002年10月には約1100まで下落した。株式市場から数兆ドル規模の時価総額が消えた。\n\n「ネット企業なら収益より成長」という前提が崩れ、破綻の記録レイヤーのPets.comやWebvanはこの期間に集中する。**熱狂の頂点では、資本は最も高く買い、最も速く逃げる**。本年表の出発点となる期間である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Dot-com bubble","url":"https://en.wikipedia.org/wiki/Dot-com_bubble"}]},{"date":"2000-05-18","precision":"day","end_date":null,"type":"point","layer":"破綻の記録","title":"Boo.com破綻、欧州ドットコムの象徴的な失敗","summary":"欧州発のファッションEC、Boo.comが創業から約18か月で資金枯渇により清算された。18か国同時展開や当時の回線には重すぎる3D表示など、インフラが追いつかない野心的な設計が裏目に出た。\n\n調達額はおよそ1億3500万ドルとされるが算定には幅がある。バブル崩壊(資本と熱狂レイヤー)の2か月後の破綻であり、「大きく始めて後から稼ぐ」戦略の脆さを欧州で最初に示した事例となった。","detail":null,"credibility":"disputed","credibility_note":"調達・消費額は報道により約1億3500万〜1億8800万ドルと幅があり、確定的な数字はない。","sources":[{"title":"Wikipedia: Boo.com","url":"https://en.wikipedia.org/wiki/Boo.com"}]},{"date":"2000-11-07","precision":"day","end_date":null,"type":"point","layer":"破綻の記録","title":"Pets.com清算、IPOから268日での退場","summary":"ペット用品ECのPets.comが事業清算を発表した。2000年2月のIPOからわずか268日での退場で、ドットコム崩壊の象徴として記憶されることになった。\n\nスーパーボウルCMなど巨額の広告費に対し、送料負けする低粗利の商品構成という構造的欠陥を抱えていた。**認知度は売上ではない**という教訓は、検証と教訓レイヤーの失敗分析で繰り返し引用されることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pets.com","url":"https://en.wikipedia.org/wiki/Pets.com"}]},{"date":"2001-07-09","precision":"day","end_date":null,"type":"point","layer":"破綻の記録","title":"Webvan事業停止、「早すぎた」生鮮EC","summary":"生鮮食品配達のWebvanが事業停止を発表し、その後破産申請に至った。全米26都市への展開を掲げ、自動化倉庫に先行投資する拡大戦略が需要の実態に先行した。\n\n累計で8億ドル規模を投じたとされるが、確定的な集計は報じられていない。約20年後にネットスーパーが定着したことから「早すぎた失敗」の代表例とされ、アイデアの正しさとタイミングが別問題であることを示す。","detail":null,"credibility":"unverified","credibility_note":"累計投資額(8億ドル超とされる)は報道による概算で、確定的な集計は確認できない。","sources":[{"title":"Wikipedia: Webvan","url":"https://en.wikipedia.org/wiki/Webvan"}]},{"date":"2008-10-01","precision":"month","end_date":null,"type":"point","layer":"資本と熱狂","title":"セコイアの「R.I.P. Good Times」資料","summary":"リーマン・ショック直後、セコイア・キャピタルが投資先の経営者を集め、「R.I.P. Good Times」と題した資料で徹底したコスト削減と生存優先を説いたとされる。\n\n資料は社外に流出して広く読まれ、危機時のVCの行動様式を示す文書として定着した。2000年の崩壊を生き延びた投資家による危機対応であり、熱狂と引き締めのサイクルが繰り返されることを示している。","detail":null,"credibility":"disputed","credibility_note":"流出資料と報道に基づく出来事で、提示日や対象範囲についてセコイアの公式発表はない。","sources":[{"title":"Sequoia Capital「R.I.P. Good Times」プレゼンテーション資料(2008年10月、流出版)","url":null}]},{"date":"2009-10-01","precision":"month","end_date":null,"type":"point","layer":"検証と教訓","title":"失敗を語る会議「FailCon」始まる","summary":"起業家が自らの失敗事例を公開の場で語るカンファレンス「FailCon」が、サンフランシスコで始まったとされる。\n\n失敗を隠すものから共有し学ぶものへと位置づけ直す動きの象徴で、のちの失敗事例データベースや「ポストモーテム」文化につながっていく。破綻の記録レイヤーに並ぶ事例群を「教材」へ変える回路が、この時期に生まれた。","detail":null,"credibility":"unverified","credibility_note":"初回開催の正確な日付・規模を一次資料で確認できず、開催時期は2009年10月とする報道に依拠する。","sources":[{"title":"FailCon 公式サイトおよび開催報道","url":null}]},{"date":"2011-03-23","precision":"day","end_date":null,"type":"point","layer":"資本と熱狂","title":"Color、公開前に4100万ドルを調達","summary":"写真共有アプリのColorが、製品公開と同時にセコイア等から計4100万ドルの調達を明らかにし、大きな話題となった。アプリは公開直後から酷評され、利用は伸びなかった。\n\n「チームと構想への先行投資」の極端な例として過熱の象徴となり、会社は翌年に事実上解体された。製品の検証より先に資本が積み上がる構図は、のちのユニコーン時代を先取りしていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Color Labs","url":"https://en.wikipedia.org/wiki/Color_Labs"}]},{"date":"2011-09-13","precision":"day","end_date":null,"type":"point","layer":"検証と教訓","title":"『リーン・スタートアップ』刊行","summary":"エリック・リースの『リーン・スタートアップ』が刊行され、仮説検証を高速で回して「作るべきでないものを作る無駄」を避ける方法論が世界的に普及した。\n\nドットコム崩壊やWebvan(破綻の記録レイヤー)の教訓を方法論に昇華したものといえ、MVPやピボットという語彙を定着させた。一方でその後のユニコーン時代には、巨額資本が検証を省略させる逆流も起きることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Lean Startup","url":"https://en.wikipedia.org/wiki/The_Lean_Startup"}]},{"date":"2013-11-02","precision":"day","end_date":null,"type":"point","layer":"資本と熱狂","title":"「ユニコーン」という言葉の誕生","summary":"投資家アイリーン・リーが、評価額10億ドル超の未上場企業を「ユニコーン」と名付ける記事をTechCrunchに発表した。当時39社とされた希少な存在は、数年で数百社に膨らむ。\n\n希少性を示すはずの言葉が目標値へと転化し、評価額を吊り上げる資金調達競争を助長したと指摘される。資本と熱狂レイヤーの後半に並ぶWeWorkやFTXは、この言葉の時代の産物である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"TechCrunch: Welcome To The Unicorn Club (2013-11-02)","url":"https://techcrunch.com/2013/11/02/welcome-to-the-unicorn-club/"}]},{"date":"2014-01-01","precision":"year","end_date":null,"type":"point","layer":"検証と教訓","title":"CB Insightsが「失敗理由トップ20」を公開","summary":"調査会社CB Insightsが、スタートアップの死後検証を集計した「失敗理由トップ20」を公開した。最上位は**「市場が求めていないものを作った」**であった。\n\n個別の破綻談を横断データに変えた点で失敗学の画期であり、以後継続的に改訂されている。「市場ニーズなし42%」という数値は集計対象により変動するが、需要検証の軽視が最大の死因という結論は一貫している。","detail":null,"credibility":"disputed","credibility_note":"初出時期と「市場ニーズなし42%」という数値は改訂版ごとに変動があり、集計対象も自主的に公開された事例に限られる。","sources":[{"title":"CB Insights: The Top Reasons Startups Fail","url":"https://www.cbinsights.com/research/report/startup-failure-reasons-top/"}]},{"date":"2015-10-15","precision":"day","end_date":null,"type":"point","layer":"破綻の記録","title":"WSJがTheranosの技術疑惑を報道","summary":"ウォール・ストリート・ジャーナルのジョン・キャリールー記者が、血液検査企業Theranosの技術が主張どおりに機能していない疑いを報道した。\n\n評価額90億ドルとされた同社は、著名人の並ぶ取締役会と創業者の物語で信頼を積み上げており、**物語が検証を上回るとき詐欺の余地が生まれる**ことを示した。この報道を起点に規制当局の調査が進み、会社は解散へ向かう。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"WSJ: Hot Startup Theranos Has Struggled With Its Blood-Test Technology (2015-10-15)","url":"https://www.wsj.com/articles/theranos-has-struggled-with-blood-tests-1444881901"}]},{"date":"2017-09-01","precision":"day","end_date":null,"type":"point","layer":"破綻の記録","title":"Juicero事業終了、過剰設計の教材に","summary":"1億ドル超を調達した高級ジュース機のJuiceroが事業終了を発表した。専用パックが手で搾れることを示した同年4月のBloomberg報道が致命傷となった。\n\n400ドルのWi-Fi接続ジューサーという製品自体が「解決すべき課題の不在」の教材となり、ハードウェアとサブスクの過剰設計を戒める事例として定着した。調達額の大きさが失敗を防がないことも改めて示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Juicero","url":"https://en.wikipedia.org/wiki/Juicero"}]},{"date":"2018-09-01","precision":"month","end_date":null,"type":"point","layer":"破綻の記録","title":"Theranos解散、評価額90億ドルがゼロに","summary":"Theranosが会社の解散手続きに入ると株主に通知した。2015年の疑惑報道から約3年で、一時90億ドルとされた評価額は事実上ゼロになった。\n\n同年6月には創業者ホームズと元社長バルワニが詐欺罪で起訴されている。検証と教訓レイヤーの有罪評決(2022年)まで含め、スタートアップの失敗が犯罪と認定されるまでの過程を最も克明に残した事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Theranos","url":"https://en.wikipedia.org/wiki/Theranos"}]},{"date":"2019-09-30","precision":"day","end_date":null,"type":"point","layer":"資本と熱狂","title":"WeWorkがIPO申請を撤回","summary":"WeWorkの親会社We CompanyがIPO申請の撤回を発表した。S-1開示でガバナンスと損失構造への批判が噴出し、470億ドルとされた評価額は数週間で崩れた。\n\n直前には創業者CEOの退任も発表され、ソフトバンクによる救済(資本と熱狂レイヤーのビジョン・ファンド損失)につながる。**上場審査が私募市場の評価額を検証した**瞬間であり、以後「利益なき成長」への投資姿勢は転換していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: WeWork","url":"https://en.wikipedia.org/wiki/WeWork"}]},{"date":"2020-05-18","precision":"day","end_date":null,"type":"point","layer":"資本と熱狂","title":"ビジョン・ファンド、約1.9兆円の営業損失","summary":"ソフトバンクグループが2019年度決算で、ソフトバンク・ビジョン・ファンド事業の営業損失約1.9兆円を計上した。WeWorkやUberなど投資先の評価損が主因である。\n\n10兆円ファンドによる大量の資金供給は評価額の高騰そのものを生む一因だったと指摘され、供給側の熱狂が失敗の規模を拡大する構図を示した。コロナ禍の金融緩和により、市場はこの直後から再び過熱へ向かう。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ソフトバンクグループ 2020年3月期 決算発表(2020年5月18日)","url":null}]},{"date":"2020-10-21","precision":"day","end_date":null,"type":"point","layer":"破綻の記録","title":"Quibi、開始から半年でサービス終了","summary":"モバイル特化の短尺動画サービスQuibiが、開始からわずか半年でのサービス終了を発表した。事前の調達額は17.5億ドルに上っていた。\n\nハリウッドの実績ある経営陣と潤沢な資金という「成功の条件」が揃いながら、需要の検証を欠いたまま大規模に始めた点でWebvanと同型の失敗である。豪華な布陣と資本は市場の不在を補えないことを、20年の時を隔てて再確認させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Quibi","url":"https://en.wikipedia.org/wiki/Quibi"}]},{"date":"2022-01-03","precision":"day","end_date":null,"type":"point","layer":"検証と教訓","title":"ホームズ被告に有罪評決","summary":"元Theranos CEOエリザベス・ホームズに対し、投資家への詐欺等の罪で有罪評決が下った。のちに禁錮11年余りの量刑が言い渡される。\n\nスタートアップ文化の誇張(fake it till you make it)と刑事上の詐欺の境界を司法が引いた事例とされる。破綻の記録レイヤーに並ぶ一連のTheranos事件を、失敗学の題材から法の領域へと接続した評決である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米司法省 北カリフォルニア地区連邦検事局 発表(2022年1月)","url":null}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"破綻の記録","title":"FTX破産申請、暗号資産バブルの決算","summary":"暗号資産取引所FTXが、グループ約130社とともに米連邦破産法11条の適用を申請した。直前の1週間で顧客資金の流用疑惑が表面化し、取り付けが発生していた。\n\n著名投資家が並ぶ株主構成にもかかわらず基本的な内部統制を欠いており、**熱狂は最も基本的な検証を省略させる**ことを改めて示した。翌2023年11月、創業者バンクマン-フリードは詐欺罪で有罪評決を受けた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bankruptcy of FTX","url":"https://en.wikipedia.org/wiki/Bankruptcy_of_FTX"}]},{"date":"2023-03-10","precision":"day","end_date":null,"type":"point","layer":"資本と熱狂","title":"シリコンバレー銀行が破綻","summary":"スタートアップ業界の中核銀行だったシリコンバレー銀行(SVB)が経営破綻し、米規制当局の管理下に置かれた。当時、米国史上2番目の規模の銀行破綻となった。\n\n低金利期に膨らんだ預金を長期債で運用した金利リスクに、VC業界のSNS上の呼びかけで加速した史上最速級の取り付けが重なった。個社の失敗ではなく、エコシステム全体の資金基盤が揺らいだ点で特異な事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Collapse of Silicon Valley Bank","url":"https://en.wikipedia.org/wiki/Collapse_of_Silicon_Valley_Bank"}]}]},{"slug":"business-subscription","title":"サブスクモデルの進化","description":"所有から利用へ。SaaSの誕生から動画・音楽配信の覇権争い、サブスク疲れと解約規制まで。サービス・インフラ・消費者の3層で、定額制が消費の標準になった四半世紀を追う年表。","category":"business","language":"ja","start_year":1999,"end_year":2024,"layers":[{"name":"サービスと企業","color":"orange"},{"name":"技術と課金インフラ","color":"blue"},{"name":"消費者と社会","color":"teal"}],"events":[{"date":"1999-01-01","precision":"year","end_date":null,"type":"point","layer":"サービスと企業","title":"Salesforce創業、「No Software」を掲げる","summary":"マーク・ベニオフらがSalesforceを創業。業務ソフトをパッケージ販売ではなく、ブラウザ経由の月額課金で提供する形を打ち出し、後にSaaSと呼ばれるモデルの先駆けとなった。\n\n「ソフトウェアの終わり(No Software)」を掲げた挑発的な旗印は、**所有から利用へ**という転換を企業向け市場で最初に大規模に実証した。売り切りの山ではなく定額収益の積み上げを評価する考え方は、後のあらゆるサブスク企業の経営指標の原型となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Salesforce: The History of Salesforce","url":"https://www.salesforce.com/news/stories/the-history-of-salesforce/"}]},{"date":"1999-09-01","precision":"month","end_date":null,"type":"point","layer":"サービスと企業","title":"Netflixが月額定額のDVDレンタルを開始","summary":"郵送DVDレンタルのNetflixが月額定額プランを導入。延滞料金なしで借り続けられる設計により、都度課金が当然だったレンタル市場に定額制を持ち込んだ。\n\n当時の業界最大手Blockbusterは延滞料金を重要な収益源としており、対照的な収益構造がその後の明暗を分けた。物理メディアの時代に築いた会員基盤と継続課金の仕組みが、2007年のストリーミング進出(同じサービスと企業レイヤー)の土台となる。","detail":null,"credibility":"disputed","credibility_note":"定額プラン導入は1999年後半とされるが、当初のプラン内容(貸出枚数の上限など)や名称は資料により記述が揺れる。","sources":[{"title":"Netflix: About Netflix - Company Timeline","url":null}]},{"date":"2005-02-02","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"Amazonプライム開始、会員制の囲い込みへ","summary":"Amazonが年会費79ドルで対象商品の配送を無料にする会員制プログラム「Amazon Prime」を米国で開始した。\n\n送料という購買の摩擦を定額で取り除く設計は、単体の採算よりも**会員の囲い込みによる購買総額の最大化**を狙うもので、後に動画・音楽・写真保存などの特典が次々と束ねられていく。サブスクが個別の商品ではなく顧客との継続的な関係を売る手段になった代表例として、以後の会員制モデルに大きな影響を与えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon Press Release: Amazon.com Announces Amazon Prime (2005-02-02)","url":null}]},{"date":"2006-08-25","precision":"day","end_date":null,"type":"point","layer":"技術と課金インフラ","title":"Amazon EC2ベータ公開、従量課金のクラウドへ","summary":"AmazonがクラウドサーバーのEC2をベータ公開し、計算資源を時間単位で借りる使い方を実用化した。前年公開のストレージS3と合わせ、AWSの中核が出そろった。\n\n自前サーバーへの初期投資なしにサービスを始められる環境は、スタートアップがSaaSや配信サービスを低コストで立ち上げる土台となった。売る側も買う側も「使った分・使う権利に払う」構造への転換であり、サブスク経済を物理的に支えるインフラの登場だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"AWS: Announcing Amazon Elastic Compute Cloud (Amazon EC2) - beta","url":"https://aws.amazon.com/about-aws/whats-new/2006/08/24/announcing-amazon-elastic-compute-cloud-amazon-ec2---beta/"}]},{"date":"2007-01-16","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"Netflixがストリーミング配信を開始","summary":"NetflixがDVD郵送に加え、定額のまま追加料金なしで映画をネット配信する「Watch Now」機能を発表した。\n\n当初は対応作品も画質も限定的だったが、ブロードバンドの普及(技術と課金インフラレイヤー)を追い風に配信が事業の主軸へ移っていく。視聴履歴に基づく推薦とオリジナル作品への投資という後の動画サブスクの標準形はここから育ち、物理メディアの制約を離れたことで国境を越えた拡大も可能になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Netflix Press Release: Netflix Offers Subscribers Option of Instantly Watching Movies on Their PCs (2007-01-16)","url":null}]},{"date":"2008-07-10","precision":"day","end_date":null,"type":"point","layer":"技術と課金インフラ","title":"App Store開始、モバイル課金の入口が確立","summary":"AppleがiPhone向けのApp Storeを開始。開発者が世界中にアプリを配信し、Appleが決済を代行して売上の3割を手数料として得る仕組みが確立した。\n\n2011年にはアプリ内の定期購読の仕組みが整備され、モバイルがサブスク契約の最大の入口の一つとなっていく。一方で手数料率と決済の独占は、後年に各国の規制当局や開発者との係争(消費者と社会レイヤー)の火種となり、サブスク経済の流通構造そのものが争点化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: iPhone 3G on Sale Tomorrow (App Store launch)","url":null}]},{"date":"2008-10-07","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"Spotify公開、音楽聴き放題のフリーミアム","summary":"スウェーデンでSpotifyが一般公開された。広告付き無料プランと月額プレミアムを組み合わせ、膨大な楽曲を聴き放題にするモデルは、違法ダウンロードに苦しんでいた音楽産業への現実的な対案だった。\n\n**無料で集めて有料へ誘導するフリーミアム**の代表例となり、CDやダウンロード販売中心だった音楽の収益構造を、再生回数に応じて権利者へ配分するストリーミング型へ塗り替えていく。日本でのサービス開始は2016年である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Spotify","url":"https://en.wikipedia.org/wiki/Spotify"}]},{"date":"2011-03-28","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"NYタイムズがデジタル購読を本格導入","summary":"ニューヨーク・タイムズが本格的なデジタル購読(ペイウォール)を米国で導入。月あたりの無料閲覧本数を制限し、それ以上の閲覧を有料とするメーター制を採った。\n\n「ネットのニュースは無料」が常識化した時代に購読モデルへ回帰する賭けだったが、後に紙を大きく上回るデジタル購読者を獲得し、広告依存から**読者収益への転換**を象徴する成功例となった。多くの新聞・雑誌がこの方式に続き、報道の事業モデルを変えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The New York Times: A Letter to Our Readers About Digital Subscriptions (2011-03-28)","url":null}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"技術と課金インフラ","title":"Stripe公開、継続課金を数行のコードで","summary":"決済スタートアップのStripeが正式公開された。数行のコードでカード決済や定期課金を組み込める開発者向けAPIを提供し、オンライン決済の実装コストを大きく下げた。\n\n継続課金の管理・決済失敗時の再試行・請求書発行といったサブスク特有の面倒を肩代わりするインフラの登場で、小規模なチームでも定額サービスを立ち上げやすくなった。SaaSの裾野拡大を裏側で支えた、サブスク経済の「配管」にあたる存在である。","detail":null,"credibility":"unverified","credibility_note":"一般公開は2011年9月と報じられるが、限定公開からの移行時期については資料により幅がある。","sources":[{"title":"TechCrunch: Stripe launch coverage (2011)","url":null}]},{"date":"2013-05-06","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"Adobeが買い切りをやめCreative Cloud専業に","summary":"AdobeがパッケージソフトCreative Suiteの新規開発終了を発表し、月額制のCreative Cloudへ全面移行した。PhotoshopやIllustratorは定額契約でしか使えなくなった。\n\n買い切りソフトの代表格による転換は、移行反対のオンライン署名運動も呼んだが、収益は安定化し企業価値は長期で大きく高まった。既存ソフト企業がサブスクへ移行する際の代表的な成功例として、以後も繰り返し引用されている。","detail":null,"credibility":"unverified","credibility_note":"移行への反対署名の件数(数万件規模とされる)は署名サイトの集計に基づき、第三者による検証はない。","sources":[{"title":"Adobe Blog: Adobe Accelerates Shift to the Cloud (2013-05-06)","url":null}]},{"date":"2016-01-06","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"Netflixが130か国へ一斉展開、日本上陸の翌年","summary":"NetflixがCESの基調講演で新たに130か国でのサービス開始を発表し、提供地域は世界190か国に達した。日本参入(2015年9月)の翌年にあたる。\n\n配信はDVDと違い物流網を必要としないため、定額制サービスは一夜にして世界市場を相手にできることを示した。各国の映像産業はグローバルなサブスク事業者と直接競合することになり、ローカル制作への投資合戦と料金競争(消費者と社会レイヤー)が世界規模で始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Netflix: Netflix Is Now Available Around the World (2016-01-06)","url":null}]},{"date":"2019-11-12","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"Disney+開始、ストリーミング戦争が本格化","summary":"ディズニーが動画配信Disney+を米国などで開始した。同月にはApple TV+も始まり、既存メディア大手が自社配信へ一斉に参入する「ストリーミング戦争」が本格化した。\n\nディズニーはNetflixへの作品供給を打ち切り、看板作品を自社サブスクへ集約する直販戦略に転じた。公開初日に1000万件の登録があったと同社は発表している。サービス乱立は消費者の契約数と支出を押し上げ、後の「サブスク疲れ」(消費者と社会レイヤー)の伏線となった。","detail":null,"credibility":"disputed","credibility_note":"初日1000万登録は同社の発表によるもので、無料トライアルを含む集計とされ、継続契約数とは異なる。","sources":[{"title":"The Walt Disney Company: Disney+ launch announcement (2019)","url":null}]},{"date":"2019-12-01","precision":"month","end_date":null,"type":"point","layer":"消費者と社会","title":"「サブスク」が新語・流行語大賞トップ10に","summary":"「サブスク(サブスクリプション)」が2019年の新語・流行語大賞トップ10に選出された。音楽・動画にとどまらず、洋服・家具・車・飲食店まで定額制をうたうサービスが相次いだ年だった。\n\n言葉の流行は、定額制が一部のデジタルサービスの課金方式から**消費のスタイルそのもの**へ広がったことを映す。一方で「解約しにくい」「使っていないのに払い続ける」といった不満もこの頃から消費者相談に現れ始める。","detail":null,"credibility":"disputed","credibility_note":"トップ10選出は主催者(自由国民社)の2019年発表に基づくが、賞の区分(大賞・トップ10・ノミネート)は資料により表記が揺れる。","sources":[{"title":"自由国民社「現代用語の基礎知識」選 ユーキャン新語・流行語大賞 2019","url":null}]},{"date":"2020-03-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"消費者と社会","title":"コロナ禍の巣ごもりでサブスク契約が急拡大","summary":"新型コロナの外出制限下で動画・音楽・ゲーム・フィットネスなどの定額サービス契約が世界的に急増した。Netflixは2020年の1年間で有料会員を約3700万人増やしている。\n\n在宅時間の拡大がサブスクの価値を一時的に押し上げた特殊な期間であり、各社はこの伸びを前提に投資を拡大した。しかし制限解除後には反動が待っており、2022年の会員減(同じ消費者と社会レイヤー)につながる。需要の先食いだったのかは今も議論がある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Netflix Q4 2020 Letter to Shareholders","url":null}]},{"date":"2022-04-19","precision":"day","end_date":null,"type":"point","layer":"消費者と社会","title":"Netflix会員が約10年ぶりに減少、サブスク疲れ","summary":"Netflixが2022年1〜3月期に有料会員の純減を発表した。減少は約10年ぶりで、株価は1日で3割超下落し、成長が当然視されてきた動画サブスクの転機となった。\n\n巣ごもり需要の反動、値上げ、サービス乱立による**サブスク疲れ**が重なった結果と受け止められ、消費者が契約を棚卸しして選別する局面に入った。各社は成長の物語を修正し、広告付きプランや値上げ、アカウント共有の制限へと戦略を転換していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Netflix Q1 2022 Letter to Shareholders (2022-04-19)","url":null}]},{"date":"2022-11-03","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"Netflixが広告付き低価格プランを開始","summary":"Netflixが広告付きの低価格プラン「広告つきベーシック」を日本を含む12か国で開始した。広告を排することを長年の看板としてきた同社の方針転換だった。\n\n会員減(消費者と社会レイヤー)を受け、値ごろ感で解約を防ぎつつ広告収入を積む二本柱への転換であり、Disney+も翌月に広告プランを導入。定額課金一本槍だった動画サブスクが、広告とのハイブリッドという成熟期の事業モデルへ移る画期となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Netflix: Announcing Basic with Ads (2022)","url":null}]},{"date":"2023-02-01","precision":"day","end_date":null,"type":"point","layer":"サービスと企業","title":"ChatGPT Plus開始、AIがサブスクの新商材に","summary":"OpenAIが月額20ドルの有料プラン「ChatGPT Plus」を発表した。混雑時の優先利用や新機能の先行提供を特典とし、生成AIを個人向け定額サービスとして商品化した。\n\n以後、AI各社は個人・法人向けの月額課金を収益の柱に据え、ソフトウェアのサブスクにAIという新しい層が加わった。推論のたびに計算コストがかかるAIは従来のSaaSより原価構造が重く、定額制と従量制の間で価格設計を模索する新しい局面が始まっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: Introducing ChatGPT Plus","url":"https://openai.com/index/chatgpt-plus/"}]},{"date":"2024-10-16","precision":"day","end_date":null,"type":"point","layer":"消費者と社会","title":"米FTCが「クリックで解約」規則を最終決定","summary":"米連邦取引委員会(FTC)が、契約と同程度の簡単さで解約できることを事業者に義務付ける「クリック・トゥ・キャンセル」規則を最終決定した。解約しづらい導線への苦情急増が背景にある。\n\n定額制の普及が進んだ結果、規制の焦点は契約時ではなく解約時の公正さへ移った。なお本規則は2025年7月に連邦控訴裁判所が手続き上の瑕疵を理由に無効としており、サブスク規制のあり方は米国でなお係争中である。日本でも解約導線の改善は消費者行政の課題となっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FTC: Federal Trade Commission Announces Final \"Click-to-Cancel\" Rule (2024-10-16)","url":"https://www.ftc.gov/news-events/news/press-releases/2024/10/federal-trade-commission-announces-final-click-cancel-rule-making-it-easier-consumers-end-recurring"}]}]},{"slug":"business-toyota-production","title":"トヨタ生産方式の進化","description":"1930年代の豊田自動織機の自動車部から2020年代の半導体不足まで、トヨタ生産方式（TPS）を生産技術と現場・経営と危機・世界への波及の3層で辿る。危機のたびに現場の手法が磨かれた過程が見える。","category":"business","language":"ja","start_year":1933,"end_year":2022,"layers":[{"name":"生産技術と現場","color":"green"},{"name":"経営と危機","color":"orange"},{"name":"世界への波及","color":"teal"}],"events":[{"date":"1933-09-01","precision":"day","end_date":null,"type":"point","layer":"生産技術と現場","title":"豊田自動織機製作所に自動車部を設置","summary":"豊田喜一郎の主導で豊田自動織機製作所に自動車部が設けられ、国産乗用車の開発が始まった。父・豊田佐吉が完成させた自動織機の事業を資金源に、喜一郎は欧米視察を経て自動車事業に踏み出した。\n\n**糸が切れると機械が自ら止まる織機の思想**は、のちに「自働化」としてトヨタ生産方式の二本柱の一つになる。1930年代は満州事変以降の統制経済へ向かう時期で、自動車製造事業法（1936年）が国産化を後押しした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1937-08-28","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"トヨタ自動車工業を設立","summary":"自動車部が独立し、資本金1,200万円でトヨタ自動車工業株式会社が設立された。喜一郎が副社長として実務を率い、自動織機の利益に頼っていた自動車事業は独立採算の会社となって、翌年の挙母工場建設に向けて資本を集めた。\n\n1937年は日中戦争の開始と重なり、以後は軍需のトラック生産が中心となる。生産技術の面では、喜一郎が「必要なものを、必要なときに、必要なだけ」という考えを掲げ始めた時期にあたる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1938-11-03","precision":"day","end_date":null,"type":"point","layer":"生産技術と現場","title":"挙母工場完成と「ジャスト・イン・タイム」構想","summary":"愛知県挙母町（現・豊田市）に本社工場が完成した。設立翌年に完成したこの工場は、工程を流れ順に配置し中間在庫を減らす構想で設計されたと社史は伝え、喜一郎が「ジャスト・イン・タイム」の考えを工場運営に持ち込んだとされる。\n\nただし喜一郎がいつどのようにこの言葉を用いたかは一次資料が乏しく、後年の回想に依るところが大きい。戦時統制で構想の実現は遅れ、本格的な体系化は戦後の大野耐一を待つことになる。","detail":null,"credibility":"disputed","credibility_note":"工場完成日は社史で確認できるが、喜一郎による「ジャスト・イン・タイム」提唱の時期と表現は後年の回想に基づき諸説ある。","sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"},{"title":"Wikipedia: Kiichiro Toyoda","url":"https://en.wikipedia.org/wiki/Kiichiro_Toyoda"}]},{"date":"1950-04-01","precision":"month","end_date":"1950-06-30","type":"period","layer":"経営と危機","title":"経営危機と労働争議、喜一郎の退任","summary":"戦後の金融引き締めで資金繰りが悪化し、人員整理を巡る労働争議が発生。約2か月の争議の末、豊田喜一郎が社長を退いた。銀行団の融資条件として販売会社の分離（トヨタ自動車販売）と人員整理が求められ、希望退職者は1,600人前後とされる。\n\n争議収束直後の6月に朝鮮戦争が始まり、米軍のトラック特需が会社を救った。**この危機の教訓が「在庫を持たず、売れる分だけつくる」という生産方式の徹底**と、以後の無借金経営志向につながった。","detail":null,"credibility":"disputed","credibility_note":"争議の期間と喜一郎退任は社史で確認できるが、退職者数は資料により1,500〜2,100人台と幅がある。","sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1953-01-01","precision":"year","end_date":null,"type":"point","layer":"生産技術と現場","title":"機械工場で「かんばん」方式を試行","summary":"大野耐一が、客が必要な分だけ棚から取り店が補充する米国のスーパーマーケットの仕組みに着想を得て、後工程引取り方式を機械工場で試み、かんばんによる指示が始まった。大野は1956年に渡米して実際の店舗を見学している。\n\n1950年の危機で在庫の重さを痛感した経営側の意向と、現場の工夫が結びついた形である。ただし開始年は社史や大野の著書で1953年頃と記されるものの、正確な時期には諸説ある。","detail":null,"credibility":"disputed","credibility_note":"かんばん方式の試行開始は1953年頃とされるが、大野の著書と社史で年の記述が一致せず、正確な開始時期は特定できない。","sources":[{"title":"Wikipedia: Toyota Production System","url":"https://en.wikipedia.org/wiki/Toyota_Production_System"},{"title":"大野耐一『トヨタ生産方式』ダイヤモンド社、1978年","url":null}]},{"date":"1957-10-31","precision":"day","end_date":null,"type":"point","layer":"世界への波及","title":"米国トヨタ自動車販売を設立","summary":"トヨタが米国ロサンゼルスに販売会社を設立し、乗用車クラウンで対米輸出を開始した。しかし初期のクラウンは高速走行に耐えられず一時撤退に近い状態となり、米国市場に合わせた製品開発の必要性を痛感させた。\n\n国内では同時期にかんばん方式が機械工場から広がりつつあり、輸出の失敗と現場改善が並行して進んでいた。1980年代のNUMMIや現地工場に至る海外展開の起点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1962-01-01","precision":"year","end_date":null,"type":"point","layer":"生産技術と現場","title":"かんばん方式を全社に展開","summary":"機械工場で始まったかんばん方式が組立や部品供給を含む全社へ広がり、生産方式の骨格が固まった。1960年代前半は乗用車の量産体制づくりが進んだ時期で、1966年のカローラ発売に向けて工程を貫く仕組みが必要とされた。\n\n全社展開に伴い、外注先の部品メーカーへもかんばんが広がっていく。同時期の経営面では1965年にデミング賞を受賞しており、品質管理と生産方式が並行して整備された。","detail":null,"credibility":"unverified","credibility_note":"全社展開の年は社史で1962〜1963年頃と記されるが、何をもって「全社」とするかの定義が資料で一致しないため年を確定できない。","sources":[{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"経営と危機","title":"第一次オイルショック","summary":"第四次中東戦争を機に原油価格が急騰し、高度成長が終わった。国内の多くの企業が減産と在庫調整で赤字に陥る一方、トヨタは比較的早く収益を回復し、その要因として低在庫・省資源の生産方式が語られ、注目を集めるようになった。\n\nこれを機に社外や海外からの見学が増え、大野が1978年に著書で体系を公表する流れにつながる。**危機が生産技術の価値を経営の言葉に翻訳した**転換点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1973 oil crisis","url":"https://en.wikipedia.org/wiki/1973_oil_crisis"},{"title":"トヨタ自動車75年史","url":"https://www.toyota.co.jp/jpn/company/history/75years/"}]},{"date":"1978-05-01","precision":"month","end_date":null,"type":"point","layer":"生産技術と現場","title":"大野耐一『トヨタ生産方式』刊行","summary":"大野耐一がダイヤモンド社から『トヨタ生産方式―脱規模の経営をめざして』を刊行し、体系を初めて社外に公開した。ジャスト・イン・タイムと自働化を二本柱とし、七つのムダや標準作業などの概念が本人の言葉で整理された。\n\nオイルショック後の関心の高まりを受けた出版で、英訳は1988年に刊行される。1980年代の米国での研究や1990年の『リーン生産方式が、世界の自動車産業をこう変える。』は、この本を重要な参照元とした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"大野耐一『トヨタ生産方式』ダイヤモンド社、1978年","url":null},{"title":"Wikipedia: Taiichi Ohno","url":"https://en.wikipedia.org/wiki/Taiichi_Ohno"}]},{"date":"1984-02-01","precision":"month","end_date":null,"type":"point","layer":"世界への波及","title":"GMとの合弁NUMMIを設立","summary":"トヨタとGMが米カリフォルニア州フリーモントに合弁会社NUMMIを設立し、同年12月に生産を開始した。閉鎖されていたGM工場を引き継ぎ、旧来の従業員を再雇用しながらトヨタ生産方式を導入した実験場となった。\n\n日米貿易摩擦の中で現地生産を迫られた経営判断と、TPSが米国の労使環境でも機能するかという検証が同時に進んだ。ここでの成果が1988年のケンタッキー工場と、GM側のリーン生産導入につながる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: NUMMI","url":"https://en.wikipedia.org/wiki/NUMMI"}]},{"date":"1988-05-01","precision":"month","end_date":null,"type":"point","layer":"世界への波及","title":"ケンタッキー工場（TMMK）が生産開始","summary":"トヨタ単独の米国工場として、ケンタッキー州ジョージタウンでカムリの生産が始まった。NUMMIで得た知見を基に、現地採用の従業員に対してトレーナーが「なぜそうするか」から教える方式が採られた。\n\n同年には大野の著書の英訳が刊行され、TPSの用語が英語圏に広がる。貿易摩擦への対応という経営課題と、現場手法の移植という生産技術の課題が同じ工場で扱われた点で象徴的である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Toyota Motor Manufacturing Kentucky","url":"https://en.wikipedia.org/wiki/Toyota_Motor_Manufacturing_Kentucky"}]},{"date":"1990-01-01","precision":"year","end_date":null,"type":"point","layer":"世界への波及","title":"『The Machine That Changed the World』刊行","summary":"MITの国際自動車研究プログラムの成果として、ウォマック、ジョーンズ、ルースによる同書が刊行され、トヨタの方式を「リーン生産」と名付けて世界に広めた。大量生産と対比してトヨタの手法を一般化した書である。\n\nNUMMIやTMMKで米国でも機能することが示された直後の出版で、自動車以外の製造業や医療、サービス業へ「リーン」の概念が波及する起点となった。日本ではバブル経済の末期にあたり、国内では生産方式よりも金融の話題が優勢だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Machine That Changed the World (book)","url":"https://en.wikipedia.org/wiki/The_Machine_That_Changed_the_World_(book)"}]},{"date":"2001-04-01","precision":"month","end_date":null,"type":"point","layer":"生産技術と現場","title":"「トヨタウェイ2001」を策定","summary":"海外拠点の拡大を受け、「知恵と改善」「人間性尊重」を柱とする価値観がトヨタウェイ2001として文書化された。1980年代以降の海外生産の広がりで、現場のOJTだけでは伝えきれない考え方を明文化する必要が生じていた。\n\n生産方式の手法（かんばん等）と、それを支える価値観を分けて示した点が特徴である。同時期の経営面では海外販売の拡大が続き、2000年代後半の生産台数世界一と、その直後の品質問題の両方をこの拡大が準備した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Toyota Way","url":"https://en.wikipedia.org/wiki/The_Toyota_Way"}]},{"date":"2008-01-01","precision":"year","end_date":null,"type":"point","layer":"世界への波及","title":"世界販売台数でGMを上回る","summary":"2008年の世界販売台数でトヨタがGMを上回り、77年ぶりに首位が交代したと報じられた。1957年の対米輸出の失敗から半世紀を経た到達点で、NUMMIやTMMKなど現地生産の積み重ねが背景にある。\n\nただし同年秋にはリーマン・ショックが起き、翌2009年3月期にトヨタは戦後初の営業赤字を計上した。首位到達と赤字転落がほぼ同時に起きたことは、規模拡大と生産方式の関係を問い直す契機になった。","detail":null,"credibility":"unverified","credibility_note":"台数の集計基準（生産・販売、グループ会社の範囲）が発表主体により異なり、首位交代の年や差は資料で一致しない。","sources":[{"title":"トヨタ自動車 ニュースリリース（2009年1月）","url":null}]},{"date":"2009-05-08","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"2009年3月期に戦後初の営業赤字","summary":"リーマン・ショック後の需要急減で、トヨタは2009年3月期決算で約4,610億円の営業赤字を発表した。前年に世界販売首位に立った直後の急転で、生産能力の拡大が固定費として重くのしかかった。\n\n生産方式の観点では、需要変動に合わせて生産量を柔軟に変える「平準化」の限界が議論となり、以後は生産能力の増強を抑える方針へ転じる。この決算発表は、豊田章男が社長に就任する直前にあたる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 2009年3月期 決算発表","url":null},{"title":"トヨタ自動車 有価証券報告書（2009年3月期）","url":null}]},{"date":"2010-02-24","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"大規模リコールと米下院公聴会","summary":"アクセルペダル等を巡る大規模リコールを受け、豊田章男社長が米下院の公聴会に出席し、品質問題について証言した。2009年から2010年にかけて世界で数百万台規模のリコールが相次ぎ、急拡大した海外生産と品質保証の体制が問われた。\n\n公聴会で社長は「成長のスピードが人材育成を上回った」との趣旨を述べている。この危機を受け、**生産方式の原点である「品質を工程でつくり込む」考えを再徹底する動き**が社内で進み、2015年のTNGAにつながる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2009–2011 Toyota vehicle recalls","url":"https://en.wikipedia.org/wiki/2009%E2%80%932011_Toyota_vehicle_recalls"}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"経営と危機","title":"東日本大震災でサプライチェーンが寸断","summary":"東北の部品・素材メーカーが被災して供給網が寸断され、国内外の工場が数か月にわたる減産を余儀なくされた。低在庫のジャスト・イン・タイムが災害に弱いとの批判も起きた。\n\n一方でトヨタは寸断の原因を特定の部品や素材の一極集中に求め、**危機を機にサプライチェーンの可視化へ踏み出した**。同年はタイの洪水も重なり、部品供給網の情報を集めるデータベース整備が進む。この教訓は2020年代の半導体不足で一定の効果を発揮したとされる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 ニュースリリース（2011年）","url":null},{"title":"Wikipedia: Toyota Production System","url":"https://en.wikipedia.org/wiki/Toyota_Production_System"}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"世界への波及","title":"『リーン・スタートアップ』刊行","summary":"エリック・リースが『The Lean Startup』を刊行し、TPS由来のリーンの考え方をソフトウェアと起業の方法論に転用した。小さくつくり検証を繰り返す手法は、TPSのムダ排除や「現地現物」の発想を参照したと著者が述べている。\n\n1990年の『The Machine That Changed the World』が製造業に広げた概念が、2010年代にはIT産業や公共部門にまで及んだ形である。同年の日本では東日本大震災でTPSの弱点が議論されており、原産地と応用先で評価が分かれた年でもある。","detail":null,"credibility":"unverified","credibility_note":"刊行時期は確かだが、TPSからの影響の程度は著者の言及に基づく評価であり、方法論の系譜として定説化しているとは言い切れない。","sources":[{"title":"Wikipedia: The Lean Startup","url":"https://en.wikipedia.org/wiki/The_Lean_Startup"}]},{"date":"2015-12-01","precision":"month","end_date":null,"type":"point","layer":"生産技術と現場","title":"TNGA採用の初の車種（4代目プリウス）発売","summary":"車両の基本骨格と生産ラインを共通化するTNGAを採用した最初の車種として、4代目プリウスが発売された。リコール問題後の「もっといいクルマづくり」の方針を受け、設計と生産を一体で見直す取り組みである。\n\n生産ラインの設備を低く簡素にし、生産量の増減に合わせて組み替えやすくする方向は、2009年の営業赤字で明らかになった固定費の重さへの応答でもある。世界の工場に順次展開され、2020年代の半導体不足下でも工程を柔軟に組み替える基盤となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Toyota New Global Architecture","url":"https://en.wikipedia.org/wiki/Toyota_New_Global_Architecture"}]},{"date":"2021-08-19","precision":"day","end_date":"2022-12-31","type":"period","layer":"経営と危機","title":"半導体不足による長期減産","summary":"トヨタが2021年9月の世界生産を計画比約4割減らすと発表し、半導体と部品の不足による減産は2022年まで断続的に続いた。新型コロナ後の需要回復と東南アジアの感染拡大が重なり、半導体を含む部品供給が滞った。\n\n2011年以降に整備したサプライチェーンの可視化により当初は他社より影響が小さかったとされるが、長期化には耐えきれず減産に至った。**ジャスト・イン・タイムの適用範囲と戦略的な在庫の持ち方**が、改めて議論される契機となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"トヨタ自動車 ニュースリリース（2021年8月19日）","url":null},{"title":"Wikipedia: 2020–2023 global chip shortage","url":"https://en.wikipedia.org/wiki/2020%E2%80%932023_global_chip_shortage"}]}]},{"slug":"business-workstyle-reform","title":"働き方改革の年表","description":"過労問題を契機とする法整備からコロナ下の在宅勤務、2024年問題まで。法制度・企業の現場・働き手の意識の3層を重ね、日本の働き方が何を変え、何を積み残したかを追う年表。","category":"business","language":"ja","start_year":2016,"end_year":2025,"layers":[{"name":"法制度","color":"teal"},{"name":"企業の現場","color":"orange"},{"name":"働き手の意識","color":"pink"}],"events":[{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"働き手の意識","title":"待機児童問題を訴える匿名ブログが反響","summary":"保育園に入れなかった母親による匿名ブログが大きな反響を呼び、国会でも取り上げられた。仕事と育児の両立を阻む構造への不満が、一気に可視化された。\n\n長時間労働と保育の受け皿不足は表裏の問題であり、翌年から本格化する働き方改革の議論(法制度レイヤー)で両立支援が主要課題に据えられる、世論の下地となった出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"2016年2月の匿名ブログ投稿と衆議院予算委員会での言及(2016-02-29)に関する各社報道","url":null}]},{"date":"2016-09-01","precision":"month","end_date":null,"type":"point","layer":"法制度","title":"働き方改革実現会議が発足","summary":"安倍政権が働き方改革実現会議を設置し、首相自らが議長として長時間労働の是正や同一労働同一賃金の検討を始めた。労使のトップが同じ席に着く体制が組まれた。\n\n少子高齢化による労働力減少への危機感が出発点であり、直後に公表された大手広告会社の過労自殺の労災認定(企業の現場レイヤー)が、この会議の議論を一気に加速させることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸「働き方改革実現会議」(第1回会合 2016年9月)","url":null}]},{"date":"2016-09-30","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"電通新入社員の過労自殺、労災認定が公表","summary":"広告最大手電通の新入社員が過労自殺した事件で労災認定がなされ、翌月に遺族側が公表した。月100時間を超える時間外労働の実態が明らかになり、同社は後に労働基準法違反で有罪となった。\n\n大企業の長時間労働が人命に関わる問題として社会に突きつけられ、**長時間労働の是正が国政の最優先課題**へ押し上げられる直接の契機となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省・三田労働基準監督署による労災認定(2016-09-30)に関する各社報道","url":null}]},{"date":"2018-01-01","precision":"month","end_date":null,"type":"point","layer":"法制度","title":"モデル就業規則改定、副業解禁へ","summary":"厚生労働省がモデル就業規則から副業・兼業を原則禁止する規定を削除し、促進のためのガイドラインを公表した。「副業元年」と呼ばれる転換である。\n\n一つの会社に勤め上げることを前提としてきた雇用慣行を国自身が緩めた点で象徴的であり、後の兼業人材の活用やフリーランスの増加(働き手の意識レイヤー)につながる制度面の起点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「副業・兼業の促進に関するガイドライン」・モデル就業規則改定(2018年1月)","url":null}]},{"date":"2018-06-29","precision":"day","end_date":null,"type":"point","layer":"法制度","title":"働き方改革関連法が成立","summary":"残業時間の罰則付き上限規制、年5日の年次有給休暇取得義務、高度プロフェッショナル制度などを盛り込んだ働き方改革関連法が成立した。労働基準法の歴史で初の罰則付き上限規制とされる。\n\n過労自殺事件(企業の現場レイヤー)を契機とする世論が成立を後押しした一方、高プロ制度には長時間労働を助長するとの批判も残り、**規制強化と柔軟化を同時に進める**妥協の産物でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「働き方改革を推進するための関係法律の整備に関する法律」(2018-06-29成立)","url":null}]},{"date":"2019-04-01","precision":"day","end_date":"2024-03-31","type":"period","layer":"法制度","title":"上限規制の施行と5年間の適用猶予期間","summary":"働き方改革関連法が施行され、大企業から順に残業の上限規制が始まった。ただし建設・運輸・医師については、影響の大きさを考慮して適用が5年間猶予された。\n\nこの猶予が切れる2024年4月に向けて人手不足が深刻化し、「2024年問題」(企業の現場レイヤー)として社会問題化する。**制度の移行期間そのものが社会課題の名前になった**、珍しい例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「時間外労働の上限規制の適用猶予事業・業務」","url":null}]},{"date":"2019-08-01","precision":"month","end_date":null,"type":"point","layer":"企業の現場","title":"日本マイクロソフトが「週勤4日」を実験","summary":"日本マイクロソフトが8月の毎週金曜日を休業とする「ワークライフチョイス チャレンジ」を実施し、労働生産性が約4割向上したと発表した。\n\n生産性の数値は自社発表で外部検証はないが、大手企業が週休3日を全社で試したこと自体が大きな話題となり、休み方の選択肢を広げる議論(働き手の意識レイヤー)に弾みをつけた実験である。","detail":null,"credibility":"unverified","credibility_note":"生産性約4割向上という数値は同社の自社発表であり、算定方法の詳細や第三者による検証は公表されていない。","sources":[{"title":"日本マイクロソフト「ワークライフチョイス チャレンジ 2019 夏」結果発表(2019年10月)","url":null}]},{"date":"2020-04-01","precision":"day","end_date":null,"type":"point","layer":"法制度","title":"同一労働同一賃金が大企業に適用","summary":"正規・非正規の不合理な待遇差を禁じる同一労働同一賃金のルールが大企業に適用された(中小企業は2021年4月から)。手当や福利厚生の待遇差の点検が各社で進んだ。\n\n同年10月には最高裁が賞与・退職金と各種手当をめぐる判断を相次いで示し、何が「不合理な差」なのかの線引きが判例によって形作られていった。コロナ対応の陰で静かに進んだ制度変化である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「同一労働同一賃金特集ページ」(パートタイム・有期雇用労働法 2020-04-01施行)","url":null}]},{"date":"2020-04-07","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"緊急事態宣言で在宅勤務が急拡大","summary":"新型コロナの緊急事態宣言で在宅勤務が一気に広がった。内閣府の調査では全国の就業者の3割超、東京23区では5割超がテレワークを経験したとされる。\n\n実施率は調査によって大きく幅があるが、通勤と出社を前提とした働き方が初めて全国規模で崩れた局面であり、働き方改革の論点が「残業削減」から**働く場所と時間の自由**へ移る転機となった。","detail":null,"credibility":"disputed","credibility_note":"テレワーク実施率は内閣府・総務省・民間の調査で対象や定義が異なり、数値に大きな幅がある。","sources":[{"title":"内閣府「新型コロナウイルス感染症の影響下における生活意識・行動の変化に関する調査」(2020年)","url":null}]},{"date":"2022-01-01","precision":"month","end_date":null,"type":"point","layer":"企業の現場","title":"ヤフーが居住地制限を撤廃、飛行機通勤も容認","summary":"ヤフーが国内どこでも居住できるよう制度を拡充し、飛行機での出社も費用補助の対象とする「どこでもオフィス」の拡充を発表した。\n\nNTTグループも同年、原則テレワークとし出社を出張扱いとする制度を導入するなど、コロナ下の在宅経験(同レイヤー)を恒久的な制度に変える動きが大手企業で相次いだ。地方移住など生活設計の選択肢(働き手の意識レイヤー)にも影響を与えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ヤフー株式会社プレスリリース「どこでもオフィス」拡充(2022年1月)","url":null}]},{"date":"2022-07-01","precision":"month","end_date":null,"type":"point","layer":"働き手の意識","title":"「静かな退職」という言葉が広がる","summary":"米国発の「静かな退職(Quiet Quitting)」という言葉がSNSで拡散し、日本でも、辞めはしないが仕事に最低限しか関与しない働き方を指す語として話題になった。\n\n語の起点や定義には諸説あるが、昇進や成長を至上とする価値観から距離を取る心情が言語化された点が重要であり、日本の従業員エンゲージメントの低さを示す調査と並べて、職場論で盛んに引用された。","detail":null,"credibility":"disputed","credibility_note":"語の初出時期や広まりの経緯には諸説あり、SNS発の流行語であるため確定的な起点を特定できない。","sources":[{"title":"「Quiet Quitting」流行に関する2022年の各社報道","url":null}]},{"date":"2022-10-01","precision":"day","end_date":null,"type":"point","layer":"法制度","title":"産後パパ育休がスタート","summary":"改正育児・介護休業法により、子の出生後8週間以内に4週間まで取得できる「産後パパ育休(出生時育児休業)」が始まり、企業には取得意向の個別確認が義務づけられた。\n\n男性の育休取得率は制度整備とともに上昇していく。残業の上限規制(同レイヤー)と併せて、男性の家庭参画を制度で後押しし、性別役割分担を前提としてきた働き方を変える流れが形になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「育児・介護休業法 改正ポイントのご案内」(2022-10-01施行)","url":null}]},{"date":"2023-05-08","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"コロナ5類移行、出社回帰が本格化","summary":"新型コロナが感染症法上の5類に移行し、出社回帰の動きが本格化した。週数日の出社を求めるハイブリッド勤務が大勢となり、完全在宅を続ける企業は一部にとどまった。\n\n在宅とオフィスの最適な配分をめぐって企業の方針は分かれ、出社義務化への反発が転職理由になる(働き手の意識レイヤー)など、働く場所そのものが労使の交渉事項として定着したことを示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"新型コロナウイルス感染症の5類移行(2023-05-08)と企業の出社方針に関する各社報道","url":null}]},{"date":"2024-03-01","precision":"month","end_date":null,"type":"point","layer":"働き手の意識","title":"春闘賃上げ率が33年ぶりの5%台に","summary":"2024年の春闘で、連合集計の賃上げ率が33年ぶりに5%台に達した。人手不足を背景に、企業が賃上げによって人材をつなぎ止める構図が鮮明になった。\n\n働き方改革の焦点が労働時間から賃金へ移ったことを示す出来事であり、初任給の引き上げ競争や転職市場の活況と併せて、**働き手が会社を選ぶ側に回る**という力関係の変化を映した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本労働組合総連合会「2024春季生活闘争 回答集計結果」","url":null}]},{"date":"2024-04-01","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"「2024年問題」が現実に、物流の現場に影響","summary":"建設・運輸・医師への残業上限規制の適用猶予が終了し、「2024年問題」が現実となった。物流ではドライバー不足による輸送力の不足が試算され、荷主側の商習慣の見直しが迫られた。\n\n規制が人手不足を顕在化させた形だが、送料無料表示の見直しや再配達の削減など、**働き方の問題を消費者の行動につなぐ**議論を初めて広く喚起した点に意味がある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国土交通省「物流の2024年問題について」","url":null}]},{"date":"2024-04-01","precision":"month","end_date":null,"type":"point","layer":"働き手の意識","title":"退職代行サービスの利用が急増と報道","summary":"新年度の直後から退職代行サービスの利用が急増したと報じられ、入社数日での依頼が相次ぐ実態が話題となった。大型連休明けには1日あたりの依頼件数が過去最多になったとする事業者もあった。\n\n件数の裏付けは事業者の発表ベースにとどまるが、辞めることすら外部化するという現象は、会社と個人の関係の変質を示す指標として、人事・労務の現場で受け止められた。","detail":null,"credibility":"unverified","credibility_note":"利用件数は退職代行事業者の自社発表や取材ベースの数値であり、業界全体の統計は存在しない。","sources":[{"title":"退職代行サービス利用動向に関する2024年春の各社報道","url":null}]},{"date":"2025-04-01","precision":"month","end_date":null,"type":"point","layer":"法制度","title":"東京都庁で週休3日の選択制が始まる","summary":"東京都が都庁職員を対象に、フレックスタイム制を活用して週休3日を選べる制度を開始した。育児中などに限定せず、全職員が対象となる点が注目された。\n\n公務職場が柔軟な働き方の先行例を示すことで民間への波及を狙う施策であり、働き方改革が「残業を減らす」段階から「働き方を選ぶ」段階へ進んだことを示す事例として位置づけられる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"東京都「都庁におけるフレックスタイム制を活用した週休3日制」(2025年4月開始)に関する発表・報道","url":null}]}]},{"slug":"culture-anime-global","title":"アニメ文化の世界進出","description":"1963年のテレビアニメ誕生から劇場作品の世界的ヒット、配信による産業化まで。作品・産業と配信・海外の受容の3層を重ね、日本のアニメが世界の主流娯楽になる過程を追う年表。","category":"culture","language":"ja","start_year":1963,"end_year":2025,"layers":[{"name":"作品と表現","color":"blue"},{"name":"産業と配信","color":"orange"},{"name":"海外の受容とファン","color":"green"}],"events":[{"date":"1963-01-01","precision":"day","end_date":null,"type":"point","layer":"作品と表現","title":"「鉄腕アトム」放送開始、テレビアニメの原点","summary":"手塚治虫の虫プロダクションが制作した「鉄腕アトム」がフジテレビ系で放送を開始した。日本初の本格的な30分連続テレビアニメである。\n\n週1本の放送を回すために止め絵や作画の使い回しなどを体系化した**リミテッドアニメ**の手法は、低予算で物語の密度を追求する日本アニメの生産様式と表現の型をつくった。この方式が以後の産業と表現の両方を長く規定していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"手塚プロダクション公式サイト: 鉄腕アトム","url":null}]},{"date":"1963-09-01","precision":"month","end_date":null,"type":"point","layer":"海外の受容とファン","title":"「Astro Boy」として米国で放送開始","summary":"「鉄腕アトム」がNBCエンタープライズの配給により「Astro Boy」として米国で放送された。日本のテレビアニメ輸出の最初期の成功例である。\n\n放送権は制作費の穴を埋める安値で販売されたとされ、輸出を前提とする採算構造はこの時点で始まっていた。米国の子どもたちは日本製と意識せずに見ており、「日本のアニメ」というブランドの認知は数十年後のファン文化の成立を待つことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Astro Boy (1963 TV series)","url":"https://en.wikipedia.org/wiki/Astro_Boy_(1963_TV_series)"}]},{"date":"1978-07-01","precision":"month","end_date":null,"type":"point","layer":"海外の受容とファン","title":"「ゴルドラック」
