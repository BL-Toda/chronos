円安を背景に食品の値上げが相次ぎ、民間調査では2022年10月だけで6,000品目を超える値上げが集計された。\n\n品目数は調査対象の範囲により変動するが、台所への逆風は数字以上に日常的だった。わが家では献立の起点が「食べたいもの」から「安かったもの」へ移り、それはそれで料理の腕を鍛えた。レシートの合計を見て、そっと献立を組み替えた。","detail":null,"credibility":"disputed","credibility_note":"値上げ品目数は調査会社の集計対象(主要メーカーの範囲)により変動し、数値には幅がある。","sources":[{"title":"帝国データバンク: 食品主要メーカー価格改定動向調査(2022年)","url":null}]},{"date":"2026-01-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"20年目のカレーを作り直す","summary":"自炊歴20年の節目に、あの最初のカレーを箱の手順どおりに作り直した。焦がさず、しかし驚くほど普通の味だった。隠し味は何も入れていない。隣で相方が笑っていた。\n\n検索、動画、低温調理、値上げ。台所は時代の道具と事情に振り回され続けたが、**うまくなったのは料理ではなく、暮らしの段取り**なのだと思う。次の20年も、たぶん台所にいる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-diet-log","title":"ダイエット記録","description":"1973年生まれの架空の会社員が、35歳の健診をきっかけに続けてきた体重と健康の記録。数値の変化と食事・運動の試行錯誤に、健診制度や社会の動きを重ね、急がない減量が習慣になるまでをたどる。","category":"personal-life","language":"ja","start_year":2008,"end_year":2026,"layers":[{"name":"からだの記録","color":"green"},{"name":"食事と運動","color":"gold"},{"name":"健康と社会","color":"blue"}],"events":[{"date":"2008-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"特定健診・特定保健指導(メタボ健診)が始まる","summary":"40〜74歳を対象に、内臓脂肪に着目した特定健診・特定保健指導が始まった。同じ年度から職場の定期健診にも腹囲の測定が加わり、「メタボリックシンドローム」という言葉が一般に定着する契機となった。\n\n生活習慣病の予防を医療保険者に義務づけた制度で、個人の体型が公的な数値として測られる時代の始まりでもある。35歳のわたしの健診結果にも、この年から腹囲の欄が現れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 特定健診・特定保健指導について","url":null}]},{"date":"2008-06-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"35歳、健診で腹囲と血圧が基準を超える","summary":"職場の定期健診で腹囲86センチ、血圧はやや高めの判定を受けた。体重は大学卒業時から10キロ増。結果票の「生活習慣の改善を」という一行を、初めて自分のこととして読んだ。\n\nこの年から健診に腹囲の測定が加わっており(健康と社会レイヤー)、制度が変わらなければ数値を気に留めなかった可能性が高い。この結果票が、18年続く記録の一枚目になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2008-09-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"自己流の欠食ダイエットで体調を崩す","summary":"手っ取り早く昼食を抜く方法で1か月に4キロ落としたが、午後の集中力が落ち、立ちくらみが出て産業医に相談した。「減らすべきは食事の回数ではない。急ぎすぎです」と止められた。\n\n**短期間で大きく減らす方法は続かないうえに体に悪い**という、いま思えば当然の教訓を最初に学んだ形になった。以後の記録は、この失敗を起点に読むと分かりやすい。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-03-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"半年で元の体重に戻る","summary":"欠食をやめた反動もあり、半年で体重は元に戻り、むしろ1キロ増えた。いわゆるリバウンドを自分の数値で確認した、最初の記録である。\n\n急な減量は筋肉も一緒に落とすため、戻るときは脂肪が増えやすいと、のちの保健指導で教わった。この時期はまだ体重しか測っておらず、何が減って何が増えたのかを知る手立てがなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2013-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"健康日本21(第二次)が始まる","summary":"国民の健康づくり運動「健康日本21」の第二次計画が2013年度に始まった。健康寿命の延伸を中心目標に掲げ、適正体重の維持や日常の歩数の増加など、具体的な数値目標を定めた。\n\n個人の努力だけでなく社会環境の整備を掲げた点が特徴で、企業の健康経営や自治体のウォーキング事業が広がる下地になった。わたしの会社に歩数計配布の制度ができたのも、この流れの中である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 健康日本21(第二次)","url":null}]},{"date":"2013-10-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"特定保健指導を受け、記録を始める","summary":"40歳の健診で再び基準を超え、特定保健指導の対象になった。保健師と立てた目標は「3か月でマイナス2キロ」。方法は**毎日の体重と歩数を記録するだけ**という拍子抜けするものだった。\n\n5年前の失敗を話すと、保健師は「早く減らした人から戻っていきます」と言った。記録はノートから携帯のアプリに移り、これがいちばん長く続く習慣になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2014-06-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"8か月でマイナス4キロ、血圧が正常域に","summary":"記録を始めて8か月、体重は緩やかに4キロ減り、血圧は正常域に戻った。月に0.5キロというゆっくりした保健師の設定ペースを、結果的にほぼなぞった形になった。\n\n変えたのは記録のほかに、揚げ物を週2回までにしたことと、地下鉄を一駅手前で降りることだけ。劇的な方法を何も使っていないことが、5年前のリバウンドとの最大の違いだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"機能性表示食品制度が始まる","summary":"事業者の責任で食品の機能性を表示できる機能性表示食品制度が始まった。「脂肪の吸収を抑える」といった表示の飲料や食品が店頭に並び、健康食品の市場が拡大していく。\n\n国が個別に審査するトクホと異なり届出制である点への注意も指摘された。表示に頼って食事全体を変えないままでは意味がない、というのが保健指導で受けた助言だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"消費者庁: 機能性表示食品について","url":null}]},{"date":"2017-02-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"単身赴任で外食続き、記録が途切れる","summary":"帯広への単身赴任が決まり、生活が一変した。自炊をやめて外食と弁当が続き、歩数は増えたのに体重は増加。年末には記録アプリを開かない日のほうが多くなっていた。\n\n環境が変わると習慣は簡単に崩れることを実感した2年間の始まりである。数値の悪化そのものより、記録が途切れたことのほうが、あとから見れば先行する危険信号だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-06-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"血糖が予備群の判定に","summary":"45歳の健診で体重は4年前より3キロ増、初めてHbA1cが基準を超えて糖尿病予備群の判定を受けた。腹囲も再び基準超え。単身赴任2年目の数字である。\n\n医師からは「今なら生活習慣で戻せる段階」と説明を受けた。体重そのものより、血糖や血圧といった**健診の数値を目標にする**発想へ切り替えたのは、この判定がきっかけだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-09-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"食べる順番と一駅歩きを再開する","summary":"社員食堂で野菜から食べる、丼ものを定食に替える、帰りは一駅歩く。単身赴任先でもできることに絞って習慣を組み直した。記録アプリも再開し、朝一番の体重測定を歯磨きとセットにした。\n\n新しいことを始めるより、以前できていたことに戻るほうが早かった。翌年の健診でHbA1cは基準内に戻り、結果票から「予備群」の文字が消えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"健康と社会","title":"成人男性の肥満者の割合が3割を超える","summary":"国民健康・栄養調査で、20歳以上の男性の肥満者(BMI25以上)の割合は33.0%と報告された。10年前より増加傾向にあり、特に40〜50代で高い水準にある。\n\n調査年や集計方法により数値は前後するが、働き盛りの男性の3人に1人という水準は、個人の意志の問題だけでは説明がつかない。座り続ける仕事と外食中心の環境という背景は、わたしの単身赴任の2年間とそのまま重なる。","detail":null,"credibility":"disputed","credibility_note":"肥満者割合33.0%は2019年調査(公表は2020年)の値で、調査年や年齢区分の取り方により数値は変動する。","sources":[{"title":"厚生労働省: 令和元年 国民健康・栄養調査結果の概要","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2020-12-31","type":"period","layer":"食事と運動","title":"在宅勤務で歩数が半減、朝散歩を始める","summary":"感染症の流行で単身赴任が解除されて在宅勤務に。通勤がなくなり、歩数は1日3000歩台へ半減した。危機感から、始業前に30分歩く「朝散歩」を家族と始めた9か月である。\n\n「コロナ太り」という言葉が広がった時期だが(健康と社会レイヤー)、記録を見るとこの年の体重は横ばいで守れている。習慣の置き換えを早めに打てたことが大きかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-06-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"「コロナ太り」を報じる調査が相次ぐ","summary":"外出自粛による運動不足と間食の増加で体重が増えたとする民間調査が相次いで報じられ、「コロナ太り」という言葉が広く使われた。増加幅は調査により1〜3キロ程度と幅がある。\n\nいずれもアンケートベースの民間調査で、国の統計で確認された現象ではない点には注意がいる。ただ、生活環境の急変が体重に直結することを、社会全体が同時に体験した時期ではあった。","detail":null,"credibility":"unverified","credibility_note":"「コロナ太り」の増加幅は民間のアンケート調査に基づく報道で、公的統計による裏づけは確認できない。","sources":[{"title":"在宅勤務と体重増加に関する民間調査の各社報道(2020年)","url":null}]},{"date":"2022-05-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"49歳、記録を始めた頃より5キロ軽い健診結果","summary":"健診の結果票を並べると、体重は特定保健指導を受けた頃より5キロ軽く、血圧・血糖・脂質はすべて基準内だった。劇的な変化はどの年にもないが、折れ線は緩やかに下がっている。\n\n最大の変化は数値そのものより、健診の結果票を恐れなくなったこと。**目標は痩せることから、悪化させないことへ**と、記録を続けるうちに、いつの間にか置き換わっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-09-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"筋力の低下を指摘され、自重トレを加える","summary":"市のスポーツセンターの体力測定で、握力と脚力が同年代の平均を下回った。減量はできても筋肉が足りないという指摘を受け、スクワットと腕立てを週2回、朝散歩に追加した。\n\n年齢を重ねてからの健康づくりは、体重を減らすことより筋肉を保つことが重要になると教わった。「軽ければよい」わけではないという視点は、体重だけを見ていた15年前にはなかったものだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"健康日本21(第三次)が始まる","summary":"2024年度から健康日本21(第三次)が始まった。健康寿命の延伸に加えて「誰一人取り残さない健康づくり」を掲げ、若年女性のやせや高齢期の低栄養など、痩せる方向の課題も明記された。\n\n「太りすぎ」だけでなく「痩せすぎ」も公衆衛生の課題として並んだことは、減量そのものを目的にしないという、わたしが遠回りして学んだことと同じ方向を向いている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 健康日本21(第三次)","url":null}]},{"date":"2025-10-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"52歳の健診、オールAではないが悪化なし","summary":"52歳の健診は、視力と聴力に年齢相応の低下があり、すべてA判定とはいかなかった。ただ、生活習慣に関わる項目は8年連続で基準内。主治医の講評は「維持できています」の一言だった。\n\n18年前の結果票と見比べると、数値より書き込みの量が違う。当時は空欄だった生活習慣の欄に、いまは歩数と筋トレの頻度が書いてある。維持は地味だが、積み重なると履歴になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-05-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"18年分の記録を年表にする","summary":"体重のグラフと健診結果、そのとき起きたことをひとつの年表にまとめた。急な減少と増加の山谷は例外なく体調不良か生活の激変と重なり、良い区間はいつも変化が小さい。\n\n18年やって分かったのは、ダイエットとは減らす技術ではなく**崩れたあとに戻ってくるための段取り**だということ。記録は自慢のためではなく、次に崩れたとき最短で戻るための地図として残す。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-family-history","title":"家族の歴史","description":"熊本から大阪へ出た祖父、町の電器店を継いだ父、記録を引き継ぐ私。架空の一家の70年を、家族の出来事・店と生業・時代の出来事の3層で重ね、ふたつの万博のあいだに流れた戦後をたどる。","category":"personal-life","language":"ja","start_year":1954,"end_year":2025,"layers":[{"name":"家族の出来事","color":"pink"},{"name":"店と生業","color":"orange"},{"name":"時代の出来事","color":"blue"}],"events":[{"date":"1954-04-01","precision":"month","end_date":null,"type":"point","layer":"時代の出来事","title":"集団就職列車が走り始める","summary":"地方の中学卒業者を都市部の就職先へまとめて運ぶ、いわゆる集団就職列車がこの頃から運行された。1954年4月の青森発上野行きを第1号とする説が有名だが、それ以前の類似の輸送を挙げる説もある。\n\n高度経済成長期の労働力移動を象徴する光景で、中卒の就職者は「金の卵」と呼ばれた。2年後、熊本の農家の三男だった祖父も、この流れの中で大阪へ向かうことになる。","detail":null,"credibility":"disputed","credibility_note":"「集団就職列車の第1号」は1954年4月の青森発上野行きとする説が有名だが、何をもって最初とするかには諸説ある。","sources":[{"title":"Wikipedia: 集団就職","url":"https://ja.wikipedia.org/wiki/%E9%9B%86%E5%9B%A3%E5%B0%B1%E8%81%B7"}]},{"date":"1956-03-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖父15歳、集団就職で熊本から大阪へ","summary":"中学校を出た祖父は、同級生4人とともに夜行列車で大阪へ発った。行き先は町工場の多い東大阪の電機部品工場。持ち物は布団袋と、母親が持たせた干し芋だったと本人は語っていた。\n\n**布団袋ひとつで乗った夜行列車**が、この一家の大阪での歴史の始まりである。工場の寮から夜学に通い、ラジオの修理を独学で覚えたことが、のちの店の原点になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1964-10-10","precision":"day","end_date":null,"type":"point","layer":"時代の出来事","title":"東京五輪開幕、テレビが茶の間の主役に","summary":"アジアで初めての五輪が東京で開かれ、開会式は全国に中継された。五輪を機にテレビの世帯普及は一段と進み、白黒テレビの普及率は9割前後に達したとされる。\n\n普及率の数値は調査により幅があるが、街頭テレビの時代が終わり「一家に一台」が当たり前になった転換は確かである。祖父の工場もテレビ部品の増産に沸き、その年の暮れ、祖父は祖母と所帯を持った。","detail":null,"credibility":"disputed","credibility_note":"白黒テレビ普及率の水準は、調査(内閣府消費動向調査など)や時点の取り方により数値が異なる。","sources":[{"title":"内閣府: 消費動向調査(主要耐久消費財の普及率)","url":null}]},{"date":"1966-09-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"父が生まれる","summary":"祖父26歳、祖母23歳のとき、長男である父が東大阪の社宅で生まれた。名前には「電気の恩」にちなむ字が入っている、というのが祖父の晩年の定番の話だった。\n\nこの年は丙午(ひのえうま)の迷信で全国の出生数が大きく落ち込んだ年でもあり、父は「同級生の少ない学年」で育つことになる。迷信が人口統計を動かした年に生まれたことを、父は少し気に入っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1970-03-15","precision":"day","end_date":"1970-09-13","type":"period","layer":"時代の出来事","title":"大阪万博が開かれる","summary":"「人類の進歩と調和」を掲げた日本万国博覧会が千里丘陵で開かれ、183日間で約6400万人が入場した。太陽の塔、月の石、動く歩道。高度経済成長の頂点を象徴する祭典だった。\n\n祖父一家は会期中に3度通い、3歳の父を肩車して太陽の塔の前で撮った写真が残る。**一家のアルバムで最初の観光写真**であり、55年後にもう一度万博を訪ねる伏線になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"万博記念公園: 日本万国博覧会(大阪万博)の概要","url":null}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"時代の出来事","title":"第一次石油危機","summary":"第四次中東戦争を機に原油価格が高騰し、狂乱物価と呼ばれる物価上昇やトイレットペーパー騒動が起きた。高度経済成長は事実上ここで終わり、翌1974年は戦後初のマイナス成長となった。\n\n祖父の勤め先も受注減で残業が消え、夜勤手当をあてにしていた家計は苦しくなった。「雇われているかぎり景気に振り回される」。祖父が独立を考え始めたのはこの冬からだと、祖母は言う。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: オイルショック","url":"https://ja.wikipedia.org/wiki/%E3%82%AA%E3%82%A4%E3%83%AB%E3%82%B7%E3%83%A7%E3%83%83%E3%82%AF"}]},{"date":"1976-04-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"祖父36歳、商店街に電器店を開く","summary":"貯金と勤め先の親方の口利きで、東大阪の商店街の一角に家電メーカー系列の小さな電器店を開いた。売り物はテレビ、冷蔵庫、洗濯機。店の奥が住まいで、配達は自転車の荷台から始まった。\n\n当時は全国にメーカー系列の「町の電器店」が数万軒あり、家電は近所の顔見知りから買うのが普通だった。石油危機で独立を決めた祖父にとって、店は雇われない生き方の答えだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1989-04-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"父22歳、店に入る","summary":"工業高校と電機メーカーの販売会社勤務を経て、父が店に入った。昭和から平成に替わった年の春で、店の看板を掛け替えるついでに「親子で営業中」の札を下げたという。\n\n消費税3%が導入された月でもあり、全商品の値札の付け替えが親子最初の共同作業になった。エアコンとビデオデッキが売れ筋の時代で、店はこの頃がいちばん忙しかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1993-06-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"私が生まれる","summary":"父26歳の子として、私が生まれた。店の二階が子ども部屋で、ドライバーとテスターが最初のおもちゃだったというのは、たぶん半分くらい本当である。\n\n生まれた頃の日本はバブル崩壊後の平成不況に入っていたが、店はまだ地域の御用聞きとして安定していた。私の子ども時代の記憶は、店頭に並ぶテレビの光と、配達先で出されるお茶の匂いでできている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1995-01-17","precision":"day","end_date":null,"type":"point","layer":"時代の出来事","title":"阪神・淡路大震災","summary":"淡路島北部を震源とする直下型地震が阪神地域を襲い、6400人を超える犠牲者が出た。倒壊した高速道路の映像は、都市の防災の前提を大きく揺るがした。\n\n東大阪の店は商品が棚から落ちる程度で済んだが、直後から乾電池と携帯ラジオを求める客が列を作った。祖父は在庫のラジオを箱ごと神戸の同業者へ送っている。店が「電気のよろず屋」として頼られた出来事として、家族の記憶に残る。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成7年(1995年)兵庫県南部地震","url":null}]},{"date":"2001-11-23","precision":"day","end_date":null,"type":"point","layer":"時代の出来事","title":"ヨドバシカメラ マルチメディア梅田が開業","summary":"大阪駅前に大型家電量販店ヨドバシカメラ マルチメディア梅田が開業し、初日から長蛇の列となった。ポイント還元と豊富な在庫を武器に、家電の買い場は郊外店と都心の大型店へ集中していく。\n\n町の電器店には価格で勝てない時代の到来だった。父は「うちは売る店やなく、直す店や」と方針を切り替え、配線工事と修理、高齢客の御用聞きに軸足を移していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ヨドバシカメラ マルチメディア梅田の開業に関する報道(2001年11月)","url":null}]},{"date":"2010-01-01","precision":"year","end_date":null,"type":"point","layer":"時代の出来事","title":"町の電器店はピーク時の半分以下に","summary":"メーカー系列の地域電器店は、最盛期の1980年代には全国に数万軒あったとされるが、量販店やネット通販への移行で減少を続け、この頃にはピーク時の半分以下になったとされる。\n\n店舗数の推移を示す一貫した公的統計はなく、業界団体やメーカーの公表値・報道に基づく推計である。一方で高齢化の進む商店街では、設置や修理まで面倒を見る店の価値が静かに再評価されてもいた。","detail":null,"credibility":"unverified","credibility_note":"系列電器店の店舗数の推移は業界団体・メーカー公表値と報道による推計で、一貫した公的統計は確認できない。","sources":[{"title":"地域家電店(まちの電器屋)の減少に関する各社報道","url":null}]},{"date":"2011-07-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"地デジ移行、店の最後の特需","summary":"7月24日のアナログ放送終了を前に、アンテナ工事とテレビ設置の依頼が店に殺到した。祖父71歳と父44歳が朝から晩まで屋根に登ったこの数か月は、**店の歴史で最後の特需**になった。\n\n国策のテレビ買い替えは量販店に大きな売上をもたらしたが、高齢世帯の工事や設定は町の電器店が支えた。「最後まで残る仕事は工事と説明や」という父の言葉どおりの日々だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省: 地上デジタル放送への完全移行(2011年7月24日)","url":null}]},{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"開業から40年、店を閉める","summary":"祖父75歳の冬、店を閉めた。理由は後継ぎの不在ではなく、祖父の体力と、修理部品の供給が終わる製品が増えたこと。最終日は常連客が入れ代わり立ち代わり訪れ、店の前で記念写真を撮った。\n\n父は住宅設備の会社に移り、電気工事の腕はそのまま生きた。閉店を惜しむ声の多くが「テレビを買った店」ではなく「直してくれた店」としての記憶だったことが、一家の誇りとして残っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-11-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖父、78歳で死去","summary":"祖父が78歳で亡くなった。葬儀には熊本から同郷の元同級生が駆けつけ、集団就職の夜行列車の話を、私はこのとき初めて詳しく聞いた。棺には店の名前入りの作業帽を入れた。\n\n遺品の整理では、開業からの売上帳と修理伝票の束、そして1970年の万博の写真が出てきた。この紙の山が、私が家族の記録を年表にまとめようと思った直接のきっかけである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-04-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖母から帳簿とアルバムを預かる","summary":"感染症の流行で帰省できない時期が続いたのち、久しぶりに会った祖母から、店の帳簿と家族のアルバムをひと箱預かった。「あんたがいちばん、ものを捨てへんから」というのが理由だった。\n\nスキャンを始めると、帳簿の余白に祖父の字で客の家族構成や「テレビ調子悪いか、要様子見」といった書き込みがあった。売上の記録が、そのまま**町内の暮らしの記録**になっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-08-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖母と熊本へ、祖父の生家跡を訪ねる","summary":"祖母と父と3人で熊本を訪ね、祖父の生家の跡と、集団就職の列車が出た駅を巡った。駅舎は建て替わっていたが、ホームの長さだけが当時のままだと祖母は言った。\n\n66年前、15歳がここから夜行列車に乗った。その事実を現地に立って想像できたことが、年表づくりの解像度を変えた。記録は紙の上のものだが、場所は思ったより多くのことを覚えている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-04-13","precision":"day","end_date":"2025-10-13","type":"period","layer":"時代の出来事","title":"大阪・関西万博が開かれる","summary":"「いのち輝く未来社会のデザイン」を掲げる国際博覧会が大阪・夢洲で開かれた。1970年の大阪万博から55年ぶりに、万博がこの街へ戻ってきたことになる。\n\n半世紀を挟んだふたつの万博は、高度経済成長の頂点と、成熟したあとの社会が、それぞれ何を誇ろうとしたかの対照でもある。一家にとっては、アルバムの最初の観光写真ともう一度向き合う機会になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"2025年日本国際博覧会(大阪・関西万博)公式サイト","url":"https://www.expo2025.or.jp/"}]},{"date":"2025-08-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"父と万博へ、55年前の写真を持って","summary":"58歳の父と夢洲の万博会場を歩いた。ポケットには、3歳の父が祖父の肩の上にいる1970年の写真。太陽の塔はここにはないが、大屋根の下で同じ構図の写真を撮った。\n\n**肩車の写真から55年**。集団就職の列車で始まった一家の大阪は、ふたつの万博のあいだにまるごと収まっていた。この年表は、次の誰かが書き足すための下書きとして残しておく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-film-photography","title":"フィルム写真の記録","description":"1976年生まれの架空の一人が、大学の写真部でフィルムカメラと出会ってからの30年。撮影と現像の記録に、暮らしの転機とフィルム産業の盛衰を重ね、消えゆくと言われ続けた媒体を選び続けた理由をたどる。","category":"personal-life","language":"ja","start_year":1996,"end_year":2026,"layers":[{"name":"写真と機材","color":"blue"},{"name":"暮らしと転機","color":"gold"},{"name":"フィルムと写真産業","color":"orange"}],"events":[{"date":"1996-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"大学入学、写真部に入る","summary":"京都の大学に進み、新歓で立ち寄った写真部に入部した。部室には歴代の部員が残したモノクロプリントが貼られ、薬品の匂いのする暗室が併設されていた。最初の一本は先輩に借りたカメラで撮った。\n\n同じ春、業界では新規格APSが華々しく登場している(フィルムと写真産業レイヤー)。まだ「写真といえばフィルム」が当たり前だった時代の、その入り口である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1996-04-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"新写真システムAPSが登場","summary":"コダック、富士フイルムなど5社が共同開発した新写真システムAPSの製品が発売された。フィルムの装填を簡単にし、プリント時に3種類の画面比率を選べるなど、フィルム写真の使い勝手を押し広げる規格だった。\n\nしかし数年後にデジタルカメラが急速に普及し、APSは短命に終わる。フィルム産業が最後の拡大を試みた時期に、わたしはちょうど写真を始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Advanced Photo System","url":"https://en.wikipedia.org/wiki/Advanced_Photo_System"}]},{"date":"1997-05-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"中古のニコンFM2を手に入れる","summary":"アルバイト代を貯め、中古カメラ店で機械式一眼レフのニコンFM2を買った。露出計以外に電池を使わない無骨なカメラで、巻き上げの感触とシャッター音が気に入った。\n\n**一本で36枚しか撮れない**制約が、一枚ごとに考える癖をつけた。このカメラはその後30年、修理を挟みながら手元に残り続け、この年表のほとんどの写真を撮ることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-11-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"カメラ付き携帯電話J-SH04が発売","summary":"シャープ製の携帯電話J-SH04が発売された。カメラを内蔵し、撮った写真をメールで送れる「写メール」の起点となった機種である。\n\nカメラ付き携帯の先駆には前年の京セラVP-210を挙げる説もあり、「世界初」の呼び方には幅がある。いずれにせよ、写真を撮る道具が専用機から通信機へ移る転換点であり、フィルムの出荷が減り始める時期とも重なっていた。","detail":null,"credibility":"disputed","credibility_note":"「世界初のカメラ付き携帯電話」については京セラVP-210(1999年)を先行とする見方があり、定義により評価が分かれる。","sources":[{"title":"Wikipedia: J-SH04","url":"https://en.wikipedia.org/wiki/J-SH04"}]},{"date":"2002-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"就職し、金沢で暮らし始める","summary":"印刷会社の制作職に就き、金沢へ移った。会社選びの条件のひとつは、現像所と中古カメラ店が徒歩圏にある街であること。築30年のアパートは押し入れが深く、暗室代わりになった。\n\n職場ではすでに入稿データのデジタル化が進んでいたが、街のDPE店にはまだ「1時間仕上げ」の看板が残っていた。仕事はデジタル、趣味はフィルムという二重生活が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2003-01-01","precision":"year","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"デジタルカメラの出荷がフィルムカメラを逆転","summary":"カメラ映像機器工業会の統計などで、デジタルカメラの出荷台数がフィルムカメラを上回ったとされる時期。カラーフィルムの需要もこの前後をピークに減少へ転じた。\n\n逆転の時期は統計の範囲(国内か世界か、出荷か販売か)によって2002年から2003年まで幅がある。街のDPE店の閉店が目に見えて増えるのは、この数年後からだった。","detail":null,"credibility":"disputed","credibility_note":"デジタルカメラとフィルムカメラの「逆転」の時期は、対象統計(国内/世界、出荷/販売)により2002〜2003年と幅がある。","sources":[{"title":"カメラ映像機器工業会(CIPA) 出荷統計","url":null}]},{"date":"2006-03-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"コニカミノルタが写真事業から撤退","summary":"「サクラカラー」以来100年余りの歴史を持つコニカミノルタが、カメラ事業とフォト事業から撤退した。カメラ関連資産の一部はソニーへ引き継がれた。\n\n老舗の撤退はフィルム時代の終わりを象徴する出来事として報じられた。わたしが常用していた同社のモノクロフィルムも店頭から消え、**使いたいフィルムを選ぶのではなく、残ったフィルムを使う**時代が始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"コニカミノルタ ニュースリリース: カメラ事業・フォト事業の終了について(2006年1月)","url":null}]},{"date":"2009-05-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"結婚、記念写真は大判フィルムで","summary":"写真部の後輩だった相手と結婚した。式は挙げず、金沢の古い写真館で記念写真を一枚だけ、大判のフィルムで撮ってもらった。台紙の裏に日付と使ったフィルムの銘柄が書いてある。\n\n披露宴代わりの食事会で配ったのは、ふたりで焼いたモノクロプリントの絵はがきだった。デジタル一眼レフが家庭にも普及した頃で、フィルムでの記念写真は写真館でも珍しがられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-01-19","precision":"day","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"コダックが連邦破産法11条を申請","summary":"イーストマン・コダックが米連邦破産法11条の適用を申請した。世界のフィルム市場を長く支配し、デジタルカメラを最初期に開発しながら事業転換に失敗した企業の経営破綻だった。\n\nニュースは「フィルムの死」といった見出しで世界を巡った。一方で富士フイルムは多角化で生き残り、フィルム供給の命脈は細くつながる。冷蔵庫にフィルムを備蓄する習慣は、この頃に始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Eastman Kodak","url":"https://en.wikipedia.org/wiki/Eastman_Kodak"}]},{"date":"2012-02-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"冷蔵庫にフィルム専用の棚をつくる","summary":"コダック経営破綻の報を受け、常用フィルムをまとめ買いして冷蔵庫の最下段を備蓄棚にした。銘柄と本数、購入日を記した在庫表は、この年表の元になった記録のひとつである。\n\n「いつまで買えるか分からない」という感覚は、この後の廃番と値上げのたびに強まっていく。産業レイヤーの出来事が、台所の冷蔵庫の中身を決めるようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2014-07-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"長男誕生、産院にFM2を持ち込む","summary":"長男が生まれた。産院に持ち込んだのはFM2と感度400のカラーネガ一本。窓際の自然光だけで撮った数枚が、いま見返しても家族のアルバムのいちばん最初にある。\n\n成長の記録は妻のスマートフォンが主役になったが、月に一度はフィルムでも撮ると決めた。すぐ見られる写真と、現像まで見られない写真。ふたつの速度で子どもの時間が残っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-01-01","precision":"year","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"「写ルンです」30周年、若い世代に再ブーム","summary":"富士フイルムのレンズ付きフィルム「写ルンです」が発売30周年を迎え、この前後からフィルム特有の写りを新鮮に感じる若い世代の利用が増えたと報じられた。\n\nブームの規模を示す公式な統計はなく報道ベースだが、現像受付に並ぶ若い客層など、現場の変化はわたしの目にも見えた。**終わったはずの媒体に、次の世代が合流してきた**のである。","detail":null,"credibility":"unverified","credibility_note":"「再ブーム」の規模や時期は報道・店頭観察に基づくもので、利用者数を示す公式統計は確認できない。","sources":[{"title":"富士フイルム: レンズ付フィルム「写ルンです」製品情報","url":null}]},{"date":"2016-10-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"築40年の家を買い、納戸を暗室にする","summary":"金沢の郊外に築40年の中古住宅を買った。決め手は北側の納戸で、遮光すれば暗室にできる間取りだったこと。引っ越しの荷物で最初に運び込んだのは引き伸ばし機だった。\n\n空き家の増加が社会問題として語られ始めた時期で、古い家は驚くほど安かった。学生時代に部室の暗室で覚えた作業が、20年を経て自分の家の中に戻ってくることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-01-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"コダックがエクタクロームの復活を発表","summary":"コダックが、いったん製造を終えていたリバーサルフィルム「エクタクローム」を復活させると発表した。実際の出荷再開は2018年9月で、廃番フィルムが市場に戻る珍しい事例として注目された。\n\n破産法申請から5年での復活発表は、縮小一辺倒だった産業レイヤーの潮目の変化を示す。若い世代の需要(前年の再ブーム)が、供給側を動かし始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Kodak: Ektachrome復活発表(CES 2017)に関する各社報道","url":null}]},{"date":"2018-04-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"納戸の暗室でモノクロ自家現像を再開","summary":"薬品と現像タンクを揃え、16年ぶりにモノクロの自家現像を再開した。最初の一本は現像ムラだらけだったが、定着液の匂いで部室の記憶が一気に戻った。\n\n背景には、現像所の減少で郵送現像の納期が延び、モノクロだけでも自分で処理する必要が出てきたという事情がある。産業レイヤーの縮小が、回り回って手仕事の技術を家庭に呼び戻した格好である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-04-01","precision":"month","end_date":"2024-04-01","type":"period","layer":"フィルムと写真産業","title":"フィルムの値上げと縮小が続く","summary":"富士フイルムが写真フィルムの大幅な価格改定を繰り返し発表し、一部製品の販売終了も続いた期間。原材料費の高騰と需要減少が理由とされ、一本あたりの価格は数年で大きく上がった。\n\n需要の回帰と供給の縮小が同時に進む、ねじれの時期だった。冷蔵庫の備蓄棚(写真と機材レイヤー)の在庫表では、この間、購入価格の欄の数字だけが着実に増えている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"富士フイルム ニュースリリース: 写真フィルム製品の価格改定(2019年・2022年ほか)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2021-09-30","type":"period","layer":"写真と機材","title":"半径1キロの記録","summary":"感染症の流行で遠出ができなくなり、自宅から半径1キロだけを撮ると決めた18か月。週に一本、同じ現像所に出し続けた。近所の用水路や畑が、撮るたびに違う場所に見えてきた。\n\n旅先でしか写真を撮っていなかったことに気づかされた期間でもある。**遠くへ行けない時間が、いちばん近くを見る練習になった**。この時期のプリントは、後に初めての個展の核になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-01-01","precision":"year","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"中古フィルムカメラの価格が高騰","summary":"中古市場でフィルムカメラの価格が大きく上昇したと報じられた時期。かつて数千円だった普及機が数万円で取引され、人気機種では新品時の定価を超える例も伝えられた。\n\n相場を示す公的な統計はなく報道と市場観察ベースだが、25年前に学生が小遣いで買えた道具が投機の対象になった変化は大きい。若い世代の参入と、新品の供給途絶が重なった結果である。","detail":null,"credibility":"unverified","credibility_note":"中古カメラの相場に公的統計はなく、価格水準は報道や販売店の観察に基づく。","sources":[{"title":"中古フィルムカメラ市況に関する各社報道(2021〜2022年)","url":null}]},{"date":"2025-07-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"長男と写ルンですを持って歩く","summary":"小学5年の長男が夏休みの自由研究に「フィルムってなに」を選び、写ルンです一つを持って一緒に近所を歩いた。27枚を撮り終えるのに、長男は3週間かけた。\n\n現像から戻った写真を見て、長男は「ゲームのセーブより緊張する」と言った。1996年にわたしが部室で感じたことと、たぶん同じことだ。媒体は縮んでも、体験は受け継げる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-03-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"30年分のネガのデジタル化を始める","summary":"押し入れの保存箱からネガを出し、番号を振り直してスキャンを始めた。1996年の最初の一本から約900本。この年表は、その整理のために作った索引でもある。\n\nフィルムは物として残るが、探せなければ残っていないのと同じだ。デジタルの助けを借りてフィルムを未来へ渡す。**30年選び続けた媒体との、これからの付き合い方**だと思っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-gardening","title":"ガーデニング日記","description":"1990年の花博で一鉢の花を買った架空の「私」の36年。ベランダから仮設住宅の花壇、貸し農園、庭へ。育てる記録に暮らしの節目と花と緑をめぐる社会の動きを重ね、土に触れることが人を支えてきた道筋を残す。","category":"personal-life","language":"ja","start_year":1990,"end_year":2026,"layers":[{"name":"庭の記録","color":"green"},{"name":"暮らしの節目","color":"pink"},{"name":"花と緑の時代","color":"purple"}],"events":[{"date":"1990-04-01","precision":"day","end_date":"1990-09-30","type":"period","layer":"花と緑の時代","title":"国際花と緑の博覧会(花博)","summary":"大阪・鶴見緑地で「国際花と緑の博覧会」が開かれ、半年間で約2,300万人が来場した。「自然と人間との共生」をテーマに、園芸分野の博覧会として国内空前の規模となった。\n\n33歳の私は観光のつもりで訪れ、帰りに一鉢のゼラニウムを買った(庭の記録レイヤー)。個人の趣味の起点が国家的イベントだったことは、この年表の最初の重なりである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際花と緑の博覧会協会: 花の万博の記録","url":null}]},{"date":"1990-05-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"花博で買った一鉢から","summary":"花博の売店で買ったゼラニウムを、神戸のマンションのベランダに置いた。水やりだけの世話でも夏中咲き続け、秋には挿し芽で株を増やすことを覚えた。\n\n園芸書を1冊買い、プランターは3つに増えた。**一鉢が庭になっていく**過程の、これが最初の記録である。当時「ガーデニング」という言葉はまだ一般的でなく、私は「園芸」と呼んでいた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1995-01-17","precision":"day","end_date":null,"type":"point","layer":"花と緑の時代","title":"阪神・淡路大震災","summary":"未明に発生した直下型地震により、神戸市を中心に6,400人を超える人が亡くなり、住宅被害は約64万棟に及んだ。\n\n私のマンションも半壊と判定され、ベランダの鉢はひとつ残らず落ちて割れた。避難所から仮設住宅へ移る春、土に触れる暮らしはいったん途切れる。割れた鉢の土だけは、袋に集めて持っていた。だが再開は、思ったより早かった(庭の記録レイヤー)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府防災情報: 阪神・淡路大震災の概要","url":null}]},{"date":"1995-04-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"仮設住宅の脇に花壇を作る","summary":"仮設住宅の並びの空き地に、近所の人たちと小さな花壇を作った。がれきの中から拾ったプランターに、支援物資の種を蒔いた。最初に咲いたのはマリーゴールドだった。\n\n花に実用はない。それでも水やりに人が集まり、立ち話が生まれた。**土に触ることが、日常を取り戻す最初の一歩だった**。この経験が、私の園芸を趣味から支えに変えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1997-12-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"「ガーデニング」が流行語トップテンに","summary":"この年の新語・流行語大賞で「ガーデニング」がトップテンに選ばれた。英国風の庭づくりがテレビや雑誌で盛んに特集され、園芸は「ガーデニング」と呼び替えられてブームになった。\n\nホームセンターの園芸売り場が急拡大し、苗や資材が格段に手に入りやすくなった。震災から2年、復興住宅のベランダで再開していた私の趣味にも、時代のほうが追いついてきた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"「現代用語の基礎知識」選 新語・流行語大賞 1997年","url":null}]},{"date":"1998-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの節目","title":"園芸店でパートを始める","summary":"ブームで人手が足りなくなった地元の園芸店で、パートとして働き始めた。仕事は水やりと寄せ植えの見本作り、そして客の相談相手である。\n\n趣味が仕事になった転機だった。売り場では「ガーデニング」と呼び、家では「花いじり」と呼んだ。流行の熱と、震災後の花壇で知った静かな効用と、その両方をこの店で見ることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-03-18","precision":"day","end_date":"2000-09-17","type":"period","layer":"花と緑の時代","title":"淡路花博ジャパンフローラ2000","summary":"淡路島で国際園芸・造園博「ジャパンフローラ2000」が開かれ、約700万人が来場した。阪神・淡路大震災からの復興を発信する意味も込められた博覧会だった。\n\n私は園芸店の同僚と何度も通った。10年前の花博で一鉢を買った私が、今度は寄せ植えの技術を盗みに歩いている。震災を挟んだ10年の変化を、ふたつの博覧会が両側から見せてくれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"兵庫県: ジャパンフローラ2000(淡路花博)の記録","url":null}]},{"date":"2003-05-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"貸し農園を借りる","summary":"ベランダでは足りなくなり、市民農園の一区画を借りた。15平方メートルの土に、トマト、ナス、ハーブ。週末は農園、平日はベランダという二拠点の園芸が始まった。\n\n花から野菜へ関心が広がったのはこの頃で、「育てて食べる」が加わると記録は一気に具体的になった。収穫量をノートにつけ始めたのが、このガーデニング日記の原型である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"花と緑の時代","title":"家庭菜園ブームが広がる","summary":"世界金融危機後の節約志向や食の安全への関心を背景に、家庭菜園の人気が広がったと報じられた。ベランダ菜園の入門書や貸し農園の契約が増えたとされる。\n\nブームの規模を示す確かな統計はなく、報道と業界の実感が中心である。ただ園芸店の売り場では野菜苗の棚が明らかに広がり、客層に若い世代と男性が増えた。売り場に立つ私の実感も、報道と一致していた。","detail":null,"credibility":"unverified","credibility_note":"ブームの規模や時期を示す公的統計はなく、報道や業界団体の発表に基づく。","sources":[{"title":"日本家庭園芸普及協会: 家庭園芸に関する調査","url":null}]},{"date":"2011-06-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"節電の夏、緑のカーテンが広がる","summary":"東日本大震災後の節電の夏、窓辺にゴーヤやアサガオを這わせる「緑のカーテン」が全国に広がり、自治体が苗を配る取り組みも相次いだ。ゴーヤの苗や種は品薄になったと報じられた。\n\n品薄の程度を示す確かな数字はないが、園芸店の現場では入荷即完売が続いた。花でも食でもなく「日射を遮る」という園芸の第三の効用が注目された夏で、私の店でも育て方の講習会を開いた。","detail":null,"credibility":"unverified","credibility_note":"苗や種の品薄の規模は報道ベースで、販売数量を示す公的統計はない。","sources":[{"title":"緑のカーテンの取組に関する報道(2011年夏)","url":null}]},{"date":"2013-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの節目","title":"庭のある家へ住み替える","summary":"夫の定年を機に、神戸市郊外の庭付きの中古住宅へ住み替えた。日当たりと土質だけで家を選んだと、家族には今も笑われる。内見の日には、庭の隅にスコップで穴を掘って土を確かめた。\n\nベランダ23年、貸し農園10年を経て、初めて「自分の庭」を持った。震災で鉢を全部失った場所から電車で20分。同じ街で、土との付き合いだけが少しずつ大きくなってきた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2013-06-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"初めての庭づくり、失敗の連続","summary":"念願の地植えを始めたが、初年度は失敗続きだった。粘土質の土でバラは根腐れし、ナスは貸し農園の半分も採れなかった。腐葉土を何袋もすき込んで土壌改良に追われた。\n\n鉢と畑で覚えた技術が、庭ではそのまま通じないことを思い知った。**庭は借り物の知識を自分の土に翻訳する場所**だった。3年かけて土を作り直し、ようやく庭が応え始める。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-09-04","precision":"day","end_date":null,"type":"point","layer":"花と緑の時代","title":"台風21号が関西を直撃","summary":"非常に強い勢力の台風21号が徳島県と神戸市に上陸し、関西空港の冠水や広範囲の停電など大きな被害が出た。近畿では最大瞬間風速が観測史上1位を更新した地点が相次いだ。\n\nわが家では庭のオリーブが根元から倒れ、支柱もフェンスも飛んだ。震災の鉢、そして台風の庭。この土地で育てることは、失うことと隣り合わせなのだと改めて知らされた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成30年台風第21号による被害と気象状況","url":null}]},{"date":"2018-10-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"倒れたオリーブを起こす","summary":"台風で倒れたオリーブを近所の人と3人がかりで起こし、支柱を組み直した。折れた枝は挿し木にして、鉢でも育て始めた。翌春、木は何事もなかったように新芽を出した。\n\n仮設住宅の花壇のときと同じで、復旧の作業には自然と人が集まった。**庭は何度でもやり直せる**。それはたぶん、庭以外のことにも言えるのだと、この秋に思った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"コロナ禍の園芸ブーム、種と土が品薄に","summary":"外出自粛で家庭園芸の需要が急増し、野菜の種や培養土、プランターの品薄が各地で報じられた。海外でも同様のガーデニングブームが伝えられた。\n\n売上の伸びは業界団体や小売の発表が中心で、全体像を示す統計は乏しい。それでも、在宅の時間を土に向けた人が世界中で増えたことは確かだろう。30年前に一鉢から始めた身として、今度は始めたばかりの人の相談に乗る側になった。","detail":null,"credibility":"disputed","credibility_note":"需要増や品薄の規模は業界団体・小売各社の発表や報道に基づき、数値の裏づけには幅がある。","sources":[{"title":"日本家庭園芸普及協会: 家庭園芸市場に関する発表(2020年)","url":null}]},{"date":"2021-03-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの節目","title":"初孫が生まれる","summary":"初孫が生まれた。祝いに贈ったのは、産院の帰りに寄った園芸店で買ったレモンの苗木である。娘夫婦には呆れられたが、苗木の名札には孫の名前をひらがなで書いた。\n\n「実がなる頃に一緒に収穫しよう」というつもりだった。庭の記録に、初めて次の世代の予定が書き込まれた。レモンの木は孫と同じ速さで育ち、この年表の続きを担うことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-06-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"肥料価格が高騰","summary":"原料の国際価格上昇や円安を背景に、国内の肥料価格が大幅に引き上げられた。上げ幅は肥料の種類により異なるが、過去に例のない水準の値上げと報じられた。\n\n引き上げ幅の数字は種類・地域・時期で幅があり、単一の値では示しにくい。庭では化成肥料を減らし、落ち葉と生ごみの堆肥づくりを本格化させた。世界の情勢が、庭の隅の堆肥箱を変えた年である。","detail":null,"credibility":"disputed","credibility_note":"引き上げ幅は肥料の種類・地域・契約時期により異なり、報道される数値に幅がある。","sources":[{"title":"JA全農: 肥料価格改定に関する発表(2022年)","url":null}]},{"date":"2025-04-13","precision":"day","end_date":"2025-10-13","type":"period","layer":"花と緑の時代","title":"大阪・関西万博","summary":"大阪・夢洲で日本国際博覧会(大阪・関西万博)が開かれた。35年前の花博と同じ大阪での大規模博覧会で、会場の緑化や花の展示も話題になった。\n\n68歳の私は孫の手を引いて訪れた。1990年に一鉢を買って帰った人間が、今度は孫に花の名前を教えている。休憩所で孫が眠り、私は花壇の図面を眺めていた。博覧会のたびに、私の庭は次の段階へ進んできた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"2025年日本国際博覧会(大阪・関西万博)公式サイト","url":null}]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"孫と朝顔の種をまく","summary":"5歳になった孫と、庭の隅に朝顔の種をまいた。花博のゼラニウムから36年目の春である。レモンの木は孫の背丈を越え、今年は実が10個ついた。双葉が出たら、水やり係は孫に任せるつもりだ。\n\n震災で全部失い、台風で倒れ、それでも庭は続いた。**育てることは、時間を味方につけること**。この日記の続きは、いつか孫が書けばいい。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-language-learning","title":"語学学習の道のり","description":"1971年生まれの架空の「私」が、ラジオ講座から駅前留学、オンライン英会話、AIまで36年続けた英語学習の記録。学びの歩みに仕事と家族の出来事、語学をめぐる社会の変化を重ねる。","category":"personal-life","language":"ja","start_year":1989,"end_year":2025,"layers":[{"name":"学びの記録","color":"purple"},{"name":"仕事と家族","color":"green"},{"name":"語学の時代","color":"blue"}],"events":[{"date":"1989-04-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"ラジオ英会話を録音して聴き始める","summary":"高校3年の春、NHKラジオの英語講座をカセットに録音して聴き始めた。テキストは書店で毎月買った。講師の声を真似て、通学の自転車で口ずさんだ。動機は洋楽と、字幕なしで映画を観たいという漠然とした憧れだった。\n\n塾にも留学にも縁のない地方の高校生にとって、**ラジオがいちばん安い教室だった**。この習慣は、形を変えながら36年続くことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1992-04-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"短大を卒業、自動車部品メーカーへ","summary":"名古屋の短大を卒業し、地元の自動車部品メーカーに事務職で入社した。配属は総務で、英語を使う場面は皆無だった。\n\nバブル崩壊が始まり、求人が急にしぼんだ年だった。英語は仕事と関係のない趣味として、通勤の車内のラジオ講座だけが続いた。学びが細く長く続いたのは、この「趣味」の期間があったからだと今は思う。続けられるものが、それしかなかったとも言える。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1999-10-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"海外営業部へ異動、英語が仕事になる","summary":"取引先の海外展開に伴い、海外営業部に異動した。英文メールと船積み書類、時差のある電話。趣味だった英語が、突然評価の対象になった。\n\n製造業の海外生産移転が加速した時期で、地方の部品メーカーにも英語が流れ込んできた。ラジオ講座10年の貯金は読み書きには効いたが、電話の英語では打ちのめされた。学び直しはここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1999-11-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"初めてのTOEIC、450点","summary":"異動の翌月、会社の勧めで初めてTOEICを受けた。結果は450点。リスニングの途中で頭が真っ白になったことを覚えている。会場の大学教室は受験者で満席だった。\n\n点数は悔しかったが、初めて自分の位置が数字で見えた。以後、TOEICは私の定点観測になる。この頃、受験者数は年々増え、企業が採用や昇進の目安に使う流れが強まりつつあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-01-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"「英語第二公用語」論が話題に","summary":"首相の私的懇談会「21世紀日本の構想」の報告書が、英語の第二公用語化も視野に入れた国民的論議を呼びかけ、賛否両論を巻き起こした。\n\n報告書が公用語化を正式に提言したのか、長期的な検討課題としたのかは読み方が分かれる。ただ、英語が国家的な課題として語られたことは、その後の英語教育政策の流れを方向づけた。賛否の投書が新聞に並んだことを覚えている。","detail":null,"credibility":"disputed","credibility_note":"報告書の位置づけ(公用語化の提言か、論議の呼びかけか)は解釈が分かれ、報道と原文でトーンが異なる。","sources":[{"title":"「21世紀日本の構想」懇談会報告書(2000年1月)","url":null}]},{"date":"2000-08-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"長女誕生","summary":"30歳を目前に長女が生まれた。育児休業を取り、翌春に職場へ復帰した。\n\n生活は一変し、机に向かう学習は止まった。ただ、寝かしつけの子守唄は英語の歌にした。同じ年、世間では英語第二公用語論が話題になっていた(語学の時代レイヤー)。学びの中断は後ろめたかったが、この中断もまた道のりの一部だったと、今なら言える。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-09-01","precision":"month","end_date":"2004-03-31","type":"period","layer":"学びの記録","title":"学習中断の3年半","summary":"育児と仕事の両立で、テキストを開かない日々が3年半続いた。唯一続いたのは、車で流す英語の歌と、娘に読む英語の絵本だった。テキストの山は、押し入れの奥へ移った。\n\n語学は中断すると錆びる。復帰後の最初のTOEICは100点下がっていた。それでも絵本の音読が発音の感覚をつないでいたことに、後で気づく。**中断も、やめたことにはならない**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2002-07-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"「英語が使える日本人」戦略構想","summary":"文部科学省が「『英語が使える日本人』の育成のための戦略構想」を発表し、英語教育の数値目標や教員研修の方針を打ち出した。\n\n第二公用語論から2年、英語力は個人の教養から国の人材戦略へと位置づけを変えた。育児で学習を中断していた私はニュースで横目に見るだけだったが、娘の世代の英語教育はここから変わっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 「英語が使える日本人」の育成のための戦略構想(2002年7月)","url":null}]},{"date":"2005-04-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"「駅前留学」に入会する","summary":"娘の生活が落ち着き、大手英会話教室NOVAに入会した。仕事帰りの駅前で週1回、初めて外国人講師と定期的に話す環境を得た。\n\n当時の英会話学校は空前の規模で、駅前の看板とテレビCMが日常の風景だった。月謝は安くなかったが、電話会議で悔しい思いをするたびに通う理由は増えた。この選択は2年半後、思わぬ形で終わる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2007-10-26","precision":"day","end_date":null,"type":"point","layer":"語学の時代","title":"NOVAが経営破綻","summary":"英会話学校最大手のNOVAが会社更生法の適用を申請し、全国の教室が一斉に閉まった。受講生は数十万人規模とされ、前払い受講料の扱いが社会問題になった。\n\n私も未消化のチケットを残したまま教室を失った一人である。受講生数や被害の規模は報道時点の推計に幅がある。「駅前留学」の時代の終わりは、オンライン英会話の時代(学びの記録レイヤー)への入り口でもあった。","detail":null,"credibility":"disputed","credibility_note":"破綻時の受講生数や前払い受講料の規模は報道による推計で、数値に幅がある。","sources":[{"title":"NOVAの会社更生法申請に関する報道(2007年10月26日)","url":null}]},{"date":"2009-02-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"オンライン英会話を始める","summary":"自宅のパソコンとヘッドセットで、フィリピン人講師とのオンライン英会話を始めた。1回25分、料金は駅前の教室の数分の一だった。\n\nNOVA破綻で前払いに懲りた身には、月謝制で縛りのない仕組みがありがたかった。時差の小さいアジアの講師と夜に話す形は、通信環境の進歩が生んだ新しい教室だった。娘の宿題の隣で受講する夜が続いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2011-04-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"小学校で外国語活動が必修化","summary":"新学習指導要領の全面実施により、小学5・6年生で外国語活動が必修になった。「聞く・話す」を中心に、成績評価をしない活動として始まった。\n\nちょうど5年生になった娘の授業参観で、教室に響く英語の歌を聴いた。私が高校3年のラジオで始めたことを、帰り道、娘は習った歌を口ずさんでいた。私が高校3年のラジオで始めたことを、娘は10歳で始める。**学び始める年齢が、ひと世代で8年早まった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 小学校学習指導要領(平成20年告示)外国語活動","url":null}]},{"date":"2013-09-08","precision":"day","end_date":null,"type":"point","layer":"語学の時代","title":"2020年東京五輪の開催が決定","summary":"ブエノスアイレスのIOC総会で2020年大会の東京開催が決まり、日本時間9月8日早朝の決定の瞬間が中継された。招致演説の「おもてなし」は流行語になった。\n\n訪日客の増加も重なり、「大会までに英語を」という空気が広がった。42歳の私はこのとき、大会ボランティアという目標を初めて手帳に書いた。学習に、締め切りができた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本オリンピック委員会: 2020年東京大会開催決定(2013年9月)","url":null}]},{"date":"2016-11-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"Google翻訳がニューラル翻訳へ","summary":"Google翻訳にニューラル機械翻訳が導入され、日本語と英語の間の翻訳品質が大きく向上したと発表された。長文の訳文が急に自然になったと話題になった。\n\n職場では英文メールの下書きを翻訳にかける同僚が増え、「もう勉強は要らないのでは」という冗談が現実味を帯びた。学ぶ意味を私が問い直す(学びの記録レイヤー)きっかけになった、技術の節目である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google Japan Blog: Google 翻訳が進化しました(2016年11月)","url":null}]},{"date":"2017-01-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"翻訳アプリと学ぶ理由を問い直す","summary":"英文メールの大半が翻訳アプリで済むようになり、28年続けた学習の意味を初めて疑った冬。ノートに「それでも続けるか」と書いた記録が残る。\n\n出した結論は、書く英語は機械に任せ、**自分の声で話すためだけに学ぶ**、だった。目標を読み書きから会話に絞ったことで、学習はむしろ軽くなった。機械翻訳は、私の学びの敵ではなく編集者になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-10-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"ラグビーW杯、道案内の英語が通じる","summary":"ラグビーワールドカップ日本大会で、豊田スタジアム周辺の案内ボランティアに参加し、海外からの観客に英語で道案内をした。定型文ではない会話が、初めて役に立った。\n\n大会は約1か月半にわたり、各地の会場が海外の観客であふれた。30年前のラジオ講座から続く学びが人の役に立った最初の実感で、翌年の五輪ボランティアへの予行演習のつもりだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ラグビーワールドカップ2019日本大会の開催記録","url":null}]},{"date":"2021-07-08","precision":"day","end_date":null,"type":"point","layer":"語学の時代","title":"東京五輪、首都圏会場の無観客が決定","summary":"新型コロナの感染拡大を受け、東京五輪は首都圏の会場を無観客として開催されることが決まった。観客向けの案内を担うはずだったボランティアの活動も大きく縮小された。\n\n辞退や活動縮小の人数は報道の集計で確定値がない。私が予定していた活動も、研修だけで終わった。8年前に手帳へ書いた目標は消えたが、通じた経験までは消えなかった。","detail":null,"credibility":"unverified","credibility_note":"ボランティアの辞退者数や活動縮小の規模は報道による集計で、確定した公式数値がない。","sources":[{"title":"東京2020大会の無観客開催決定に関する五者協議の報道(2021年7月8日)","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"生成AIと毎朝10分の英会話","summary":"対話型AIに「英会話の相手役」を頼み、通勤前の10分間、音声で話す習慣を始めた。相手は疲れず、笑わず、何度でも言い直させてくれる。\n\nラジオ、駅前の教室、オンライン、そしてAI。**教室はどんどん小さくなり、ついに手のひらに収まった**。機械翻訳に迷った日々を経て、道具は敵ではなく相手になった。52歳の学習記録は、まだ更新されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-05-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"54歳、初めての海外一人旅","summary":"有休をつなげてロンドンへ、初めての海外一人旅に出た。機内では映画を字幕なしで2本観た。道を尋ね、パブで隣の客と話し、聞き間違えて笑い合い、それでも会話は続いた。\n\n1989年のラジオから36年。第二公用語論も、駅前留学の崩壊も、機械翻訳の衝撃もあった。旅の最後にノートへ書いたのは一行だけ。「通じた。続けてよかった」。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-life-with-cats","title":"猫との暮らし","description":"2011年、28歳で保護猫を迎えた架空の一人の15年。2匹の猫との日々と暮らしの変化に、動物愛護法の改正や猫ブームといった社会の動きを重ね、速さの違う時間を一緒に生きた記録を残す。","category":"personal-life","language":"ja","start_year":2011,"end_year":2026,"layers":[{"name":"猫たちの記録","color":"pink"},{"name":"わたしの暮らし","color":"gold"},{"name":"猫と社会","color":"teal"}],"events":[{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"東日本大震災、置き去りにされたペットたち","summary":"東日本大震災と原発事故により、警戒区域に多くの犬や猫が取り残された。ボランティアによる保護活動が広がり、災害時のペット同行避難が全国的な課題として認識される契機になった。\n\n各地の保護団体には、行き場のない猫が次々と集まった。半年後に「わたし」が譲渡会で出会う猫も、**災害が連れてきた縁**のひとつである。当時の「わたし」は、まだそれを知らない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 東日本大震災における被災動物対応記録集","url":null}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"保護猫のソラを迎える(推定1歳)","summary":"区民館の譲渡会で、キジトラの若い雄猫と目が合った。被災地から保護されてきた推定1歳。2週間のトライアル初日、ソラはケージから出てこないまま朝を迎えた。\n\n名前は空の色からソラにした。28歳、ひとり暮らしの2年目。誰かの世話をする生活は初めてで、飼うというより暮らしを分け合う感覚なのだと知るのは、もう少し後である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-08-29","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"改正動物愛護管理法が成立、終生飼養を明記","summary":"動物愛護管理法の改正が成立し、飼い主が動物をその命の終わりまで飼う「終生飼養」の責任が明文化された。自治体が引き取りを拒否できる場合も定められ、安易な飼育放棄に歯止めをかける内容となった(施行は2013年9月)。\n\n猫と暮らし始めて1年の「わたし」には、その当たり前がわざわざ法律に書かれるまでの現実がある、ということを考えさせられた改正だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 動物愛護管理法の平成24年改正の概要","url":null}]},{"date":"2013-04-01","precision":"month","end_date":null,"type":"point","layer":"わたしの暮らし","title":"ペット可の部屋へ引っ越す(30歳)","summary":"賃貸の更新を機に、ペット可の1LDKへ引っ越した。家賃は1万円上がり、物件の選択肢は10分の1になった。内見の基準は日当たりより、キャットタワーを置ける壁面になった。\n\n猫と暮らせる賃貸の少なさは、飼育放棄の一因ともされる。住まいの側から猫との暮らしを考えた、最初の経験だった。この部屋で、以後の暮らしの多くが進んでいくことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2014-06-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ソラ脱走、3日間の捜索","summary":"網戸の隙間からソラが脱走した。3日間、早朝と深夜にちくわを持って町内を歩き、3日目の夜、駐車場の車の下から鳴き声が返ってきた。捕まえた瞬間の爪の痛みは、安堵の記憶として残っている。\n\n以後、全部屋の網戸にロックを付け、迷子札を作った。のちにマイクロチップの義務化が議論されるたび、この3日間を思い出すことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"猫と社会","title":"「ネコノミクス」、経済効果2兆円超と試算","summary":"猫がもたらす経済効果を年間約2兆3000億円とする大学教授の試算が報じられ、「ネコノミクス」という言葉が広まった。猫カフェ、猫グッズ、猫の写真集と、猫を主役にした消費が拡大していた時期である。\n\nブームの一方で、飼いきれずに手放される猫の問題も報じられた。**かわいいと暮らせるは別の話**だと、脱走騒ぎを経た「わたし」は思っていた。","detail":null,"credibility":"unverified","credibility_note":"経済効果の試算は研究者個人の推計が報道されたもので、算出根拠の詳細は公表資料からは確認できない。","sources":[{"title":"関西大学 宮本勝浩名誉教授による試算(2016年報道)","url":null}]},{"date":"2016-05-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"2匹目、子猫のハギを迎える","summary":"職場の後輩が保護した生後2か月ほどの三毛猫を引き取った。萩の花の柄からハギと名付けた。先住のソラは3日間威嚇し続け、4日目の朝、同じ毛布で寝ていた。\n\n2匹になって食費と医療費は倍になったが、猫同士の関係という新しい見物ができた。多頭飼いの適正な数について調べたのも、このときが初めてである。先輩になったソラの顔つきが、少し変わった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-12-01","precision":"month","end_date":null,"type":"point","layer":"猫と社会","title":"猫の飼育数が犬を初めて上回る","summary":"ペットフード協会の全国調査で、猫の推計飼育数約952万頭が犬の約892万頭を上回った。調査開始以来初の逆転とされ、散歩が不要で集合住宅でも飼いやすい猫が、単身・共働き世帯の増加という時代に合っていた。\n\nソラとハギのいる「わたし」の家も、その952万分の2である。時代が猫の側に寄ってきた、と当時の日記に書いてある。","detail":null,"credibility":"disputed","credibility_note":"飼育数は世帯アンケートからの推計値で誤差を含み、「逆転」の時期や頭数は調査により見解が分かれる。","sources":[{"title":"一般社団法人ペットフード協会「全国犬猫飼育実態調査」(2017年)","url":null}]},{"date":"2019-04-01","precision":"month","end_date":null,"type":"point","layer":"わたしの暮らし","title":"転職して週2日は家で働く(36歳)","summary":"転職して、週2日在宅で働ける職場になった。決め手のひとつは猫の通院のしやすさで、面接で正直にそう言ったら、面接官も自分の猫の写真を見せてきた。\n\n家で働いてみると、猫が長い昼寝と決まった時間の要求で1日を区切っていることが分かる。人間の側が、猫の時間割に入れてもらう格好になった。出社の日は、帰宅した瞬間の鳴き声の長さで留守の長さが分かった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-06-12","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"改正動物愛護法成立、マイクロチップ義務化へ","summary":"動物愛護管理法の再改正が成立し、販売される犬猫へのマイクロチップ装着の義務化(2022年施行)や、生後56日以下の子犬・子猫の販売規制、動物虐待の厳罰化などが決まった。\n\n脱走騒ぎを経験した「わたし」は施行を待たず、次の健診で2匹にチップを入れた。迷子と遺棄の境界が曖昧な現実に、番号がひとつの答えになると思った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 動物愛護管理法 令和元年改正の概要","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2020-05-31","type":"period","layer":"わたしの暮らし","title":"在宅勤務の日々、猫が同僚になる","summary":"緊急事態宣言で完全在宅になり、2匹との24時間が始まった。ビデオ会議に尻尾が映り込み、キーボードの上が定位置になり、社内でソラとハギは「同僚」と呼ばれるようになった。\n\n世の中ではペットを迎える人が急増し、一方で安易な飼育放棄への懸念も報じられた。**ずっと家にいる人間を、猫がどう思っていたか**は、いまだに分からない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-08-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ソラ、慢性腎臓病の初期と診断(推定11歳)","summary":"年1回の健診の血液検査で、ソラに慢性腎臓病の初期を示す値が出た。高齢の猫に多い病気で、完治はなく、進行を緩やかにする管理が治療になると説明を受けた。\n\n療法食への切り替えと、半年ごとの検査が始まった。猫の11歳は人間なら60歳前後にあたる。**時間の速さが違う相手と暮らしている**ことを、数値で突きつけられた日だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-06-01","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"マイクロチップ装着が義務化","summary":"改正動物愛護法の施行により、ブリーダーやペットショップが販売する犬猫へのマイクロチップ装着と情報登録が義務になった。すでに飼われている犬猫への装着は努力義務とされた。\n\n迷子や災害時に飼い主のもとへ戻る仕組みが、制度として整った形である。震災の年に猫を迎えた「わたし」には、あの日から11年かかってここまで来た、という感慨があった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 犬と猫のマイクロチップ情報登録制度","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"自宅での皮下点滴を覚える","summary":"ソラの腎臓病が進み、週2回の皮下点滴が始まった。最初は動物病院に通ったが、移動が猫の負担になると考えて自宅で行う練習をし、タオルで包む保定と針の角度を覚えた。\n\n治すためではなく、楽に過ごせる時間を延ばすための医療。介護という言葉が猫にも使われる理由が分かってきた。点滴のあいだ、ハギが必ず隣に座るのが支えだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"猫と社会","title":"犬猫の殺処分、10年余りで約9割減","summary":"環境省の統計によると、全国の犬猫の殺処分数は2022年度に約1万2000頭となり、約17万頭だった2011年度から9割以上減った。譲渡活動の広がりと自治体の取り組み、たび重なる法改正の積み重ねが背景にある。\n\nソラを迎えた年から数えたこの変化は、「わたし」の年表に欠かせない1行である。それでもゼロではないことも、あわせて記録しておく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 犬・猫の引取り及び負傷動物等の収容並びに処分の状況","url":null}]},{"date":"2025-04-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ソラを見送る(推定15歳)","summary":"桜の終わりの朝、ソラが膝の上で息を引き取った。推定15歳。最後の1週間はほとんど食べなかったが、それでも窓辺の日向には自分で歩いて行った。診断から3年半、点滴は200回を超えていた。\n\n骨壺の隣に、譲渡会でもらった保護当時の写真を置いた。**14年間の暮らしの単位が、この猫だった**。ハギが数日、家中を探して歩いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-10-01","precision":"month","end_date":null,"type":"point","layer":"わたしの暮らし","title":"保護猫の預かりボランティアを始める(42歳)","summary":"ソラがいた保護団体に登録し、譲渡が決まるまでの猫を預かるボランティアを始めた。最初の預かりは人慣れしていない黒猫で、2か月かけてケージの外で眠るようになった。\n\n迎える側から、送り出す側へ。別れの多い活動だが、ソラを保護した誰かがいたから、あの14年があった。今度は自分がその順番を回す番だと思っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-05-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ハギ10歳、預かり猫は5匹目に","summary":"ハギが10歳になった。預かり猫は5匹目を送り出し、家には「うちの子」と「旅の途中の子」がいる暮らしが定着した。ハギは新入りが来るたび、かつてソラがしたように3日間威嚇して、4日目に毛布を分けている。\n\nこの年表は、ソラの一周忌に作り始めたものである。猫の時間は人より速い。だからこそ、重ねた時間は年表にして残す価値がある。最後の行は、まだ書き足されていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-marathon","title":"マラソン完走記録","description":"2007年、35歳で走り始めた架空の会社員ランナーの19年。レースと記録、練習と体の変化に、市民マラソンブームやシューズ革命といった時代の動きを重ね、ひとりの走りと時代の並走を残す。","category":"personal-life","language":"ja","start_year":2007,"end_year":2026,"layers":[{"name":"レースと記録","color":"orange"},{"name":"練習と体","color":"green"},{"name":"走る人と時代","color":"blue"}],"events":[{"date":"2007-02-18","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"第1回東京マラソン開催","summary":"東京都心の公道を約3万人が走る第1回東京マラソンが開催された。応募者は9万人を超え、抽選制の大都市型市民マラソンという形式がここで定着。以後、大阪・神戸・京都など各都市が続き、日本の市民マラソンブームの起点となった。\n\nこの大会をテレビで見ていたのが「わたし」である。**走ることが特別な人のものでなくなった年**に、この記録も始まる。シューズを買うのは半年後のことだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"東京マラソン財団: 東京マラソン2007 大会概要","url":null}]},{"date":"2007-09-01","precision":"month","end_date":null,"type":"point","layer":"練習と体","title":"健康診断を機に、35歳で走り始める","summary":"春の健康診断で血圧と体重を指摘され、9月の連休にランニングシューズを買った。最初の夜は自宅の周りを15分だけ走って歩いた。距離にして2キロ足らず。翌朝の筋肉痛で、自分の体を長く放置していたことを知る。\n\n同じ年の2月に東京マラソンが始まっていた。「市民ランナー」という言葉を自分のこととして意識するのは、まだ先の話である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2008-11-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"初レース、ハーフマラソンを2時間15分で完走","summary":"走り始めて1年余り、地元のハーフマラソン大会に初出場し、2時間15分で完走した。後半は歩きと変わらない速さになったが、沿道の拍手に背中を押されてゴールした。\n\n完走証を会社の机に飾ったら同僚に笑われたが、翌週から昼休みに走る仲間がひとり増えた。フルマラソンへの挑戦を決めたのは、完走証を鞄にしまった、この日の帰り道である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-03-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"初フルマラソン完走、4時間58分","summary":"河川敷のフルマラソンで初の42.195キロを完走した。35キロで両脚が止まり、最後の7キロは歩きと小走りを繰り返して、4時間58分でゴール。目標にしていた「5時間以内」にぎりぎり収まった。\n\nゴール後に泣くとは思っていなかった。**完走はゴールではなく入口だった**と、この年表を作りながら思う。翌週にはもう次のレースを探していた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2011-10-30","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"第1回大阪マラソン開催、ブームが全国へ","summary":"約2万8千人が参加する第1回大阪マラソンが開催された。東京に始まった大都市型市民マラソンは神戸・京都・熊本と各地に広がり、抽選倍率の高さがニュースになる時代になった。\n\n東日本大震災の年でもあり、多くの大会がチャリティー枠を設けた。「わたし」もこの年、初めて寄付つきエントリーを選んでいる。走ることと社会がつながった最初の記憶である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"大阪マラソン組織委員会: 第1回大会 開催概要","url":null}]},{"date":"2012-01-01","precision":"year","end_date":null,"type":"point","layer":"走る人と時代","title":"ランニング人口が推計1000万人規模に","summary":"笹川スポーツ財団の調査で、年1回以上ジョギング・ランニングを行う人が推計1000万人を超え、過去最高水準になったとされた。東京マラソン以降の5年で、ブームは数字の上でも裏付けられた形である。\n\n一方でこの数字は隔年のアンケート調査に基づく推計で、継続的に走る人はその一部とされる。「わたし」の実感でも、大会の抽選は年々厳しくなっていた。","detail":null,"credibility":"disputed","credibility_note":"推計人口はアンケート調査からの推計値で、調査手法や「実施頻度」の定義により数値に幅がある。","sources":[{"title":"笹川スポーツ財団「スポーツライフに関する調査」","url":null}]},{"date":"2013-11-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"サブ4達成、3時間52分","summary":"4度目のフルマラソンで4時間の壁を破り、3時間52分で完走した。30キロ以降に失速しない配分を、初めて最後まで守れたレースだった。\n\n練習の量より質を考え始めた時期の成果でもある。祝杯の写真は今もこの年のアルバムの最初にあり、その夜、翌年以降の目標を「サブ3.5」と手帳に書いた。この一行に9年かかることは、まだ知らない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-01-01","precision":"month","end_date":"2015-03-31","type":"period","layer":"練習と体","title":"腸脛靭帯炎で3か月走れず","summary":"サブ3.5を狙った年明けのスピード練習で右膝の外側に痛みが出て、腸脛靭帯炎と診断された。走らないよう告げられた3か月は、走り始めて以来もっとも長い中断になった。\n\n代わりに水泳と筋力トレーニングを覚え、練習内容とフォームを記録する習慣ができた。故障は積み過ぎた負荷への体からの通知だと考えるようになったのは、この春からである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-02-28","precision":"day","end_date":null,"type":"point","layer":"レースと記録","title":"東京マラソン初出走、3時間47分の自己ベスト","summary":"5年連続で落選していた東京マラソンに初めて当選し、3時間47分の自己ベストで完走した。9年前にテレビで見たコースを、自分の脚で走った。\n\n銀座で沿道の声援が途切れないことに驚いた。第1回大会を見て走り始めた者として、**スタートラインに立つまで9年かかった**ことも記録しておきたい。抽選倍率は10倍を超えていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-05-06","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"Breaking2、2時間の壁に25秒届かず","summary":"ナイキの非公認レース「Breaking2」でキプチョゲが2時間0分25秒を記録し、フルマラソン2時間切りに25秒まで迫った。この挑戦のために開発された厚底カーボンシューズは市販化され、以後の記録の常識を塗り替えていく。\n\n数年のうちに市民ランナーの間でも厚底が標準になる。「わたし」が導入するのは2019年。道具が記録を動かす時代の入口だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Breaking2","url":"https://en.wikipedia.org/wiki/Breaking2"}]},{"date":"2018-01-01","precision":"year","end_date":null,"type":"point","layer":"走る人と時代","title":"フルマラソン完走者、年間延べ37万人規模に","summary":"国内の大会結果を集計する民間の「全日本マラソンランキング」で、フルマラソンの年間完走者が延べ37万人規模と報じられた。大会数も記録的な水準で、市民マラソンの裾野がもっとも広がった時期とされる。\n\nこの数字は主催者データを集計した延べ人数で、公的統計はない。それでも、どの大会もエントリー開始日に定員が埋まる体感とは一致していた。","detail":null,"credibility":"unverified","credibility_note":"完走者数は民間ランキングによる大会結果の集計(延べ人数)で、対象大会の範囲により数値が変わり、公的統計による裏付けはない。","sources":[{"title":"アールビーズ「全日本マラソンランキング」","url":null}]},{"date":"2019-10-12","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"キプチョゲ、非公認ながら2時間の壁を破る","summary":"ウィーンの特設コースで行われたINEOS 1:59 Challengeで、キプチョゲが1時間59分40秒を記録し、非公認ながら人類初のフルマラソン2時間切りを果たした。交代制のペーサー隊列と厚底シューズが可能にした記録だった。\n\n公認記録と呼べるのかという議論も起きたが、**限界は動かせるという事実**は市民ランナーの端くれにも届いた。47歳の「わたし」が翌月フォーム改造を始めた理由のひとつである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ineos 1:59 Challenge","url":"https://en.wikipedia.org/wiki/Ineos_1:59_Challenge"}]},{"date":"2019-11-01","precision":"month","end_date":null,"type":"point","layer":"練習と体","title":"47歳、厚底シューズとフォーム改造","summary":"初めて厚底カーボンシューズを買い、接地とピッチを作り直す練習を始めた。最初の1か月はふくらはぎの張りが抜けず、道具に走らされている感覚だった。\n\nそれでも12月のハーフマラソンで自己ベストが出た。加齢で落ちる分を、道具と技術でどこまで押し返せるのか。40代後半の練習は、その実験になっていく。実験台は自分の体ひとつである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-02-17","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"東京マラソン2020、一般の部中止を発表","summary":"新型コロナウイルスの感染拡大を受け、東京マラソン財団が2020年大会の一般ランナーの出走中止を発表した。約3万8千人の市民ランナーが走れなくなり、以後、全国の大会が次々と中止・延期に入っていく。\n\n当選していた「わたし」もそのひとりだった。目標を失って気づいたのは、大会がなくても自分は走りたいのか、という問いである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"東京マラソン財団: 東京マラソン2020に関するお知らせ(2020年2月17日)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2021-09-30","type":"period","layer":"練習と体","title":"大会のない日々をひとりで走る","summary":"緊急事態宣言下、人の少ない早朝に距離を抑えて走る日々が1年半続いた。大会は軒並み中止で、GPS時計の走行記録だけが静かに積み上がった。\n\n誰とも競わず、完走証もない。それでも走るのをやめなかったことで、**走る理由は記録の外にもある**と分かった。この期間の月間走行距離は、振り返ると19年間のどの年よりも安定している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-02-28","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"鈴木健吾が2時間4分56秒の日本記録","summary":"最後の開催となった第76回びわ湖毎日マラソンで、鈴木健吾が2時間4分56秒の日本記録を樹立した。この大会では自己ベスト更新が続出し、厚底シューズ時代の到来を象徴するレースと呼ばれた。\n\n歴史ある大会が幕を下ろす日に記録が生まれる皮肉と希望を、「わたし」は自宅の画面越しに見ていた。中断していた自分の目標を再起動させたのは、このレースである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本陸上競技連盟: 第76回びわ湖毎日マラソン大会結果","url":null}]},{"date":"2022-11-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"50歳、サブ3.5達成の3時間28分","summary":"再開された秋のフルマラソンで3時間28分を記録し、手帳に書いてから9年越しの目標だったサブ3.5を50歳で達成した。35キロからの5キロを、人生でいちばん集中して走った。\n\n41歳で立てた目標に9年かかったが、**50歳の自己ベスト**は加齢が言い訳にならないことの証明になった。厚底への適応と、コロナ期の地道な走り込み。両方の成果だと思っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-03-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"通算20回目のフル完走","summary":"3年ぶりに当選した東京マラソンで、通算20回目のフルマラソンを3時間41分で完走した。タイムは全盛期より落ちたが、35キロ以降を最後まで走り切る型は崩れなかった。\n\n初完走から16年。完走証の束はアルバム1冊分になり、それがこの年表の下書きになった。沿道で誰かを応援する側の楽しさを覚えたのも、最近のことである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と体","title":"54歳、次の目標は60歳でのサブ4","summary":"春の健診の数値は、走り始めた35歳のときよりよい。週3回の走りと筋力トレーニングを軸に、60歳でサブ4を維持するという次の10年の目標を手帳に書いた。\n\n19年の記録を並べて分かるのは、速くなった時期より、走り続けた時期の方がずっと長いということだ。記録は年齢と競争しない。この年表は、その途中経過である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-moving-history","title":"引っ越しの歴史","description":"1955年生まれの架空の「私」が経験した、社宅から団地、四畳半、持ち家までの引っ越しの記録。住まいの変遷に家族の節目と日本の住宅史を重ね、間取りの変化が時代をどう映してきたかをたどる。","category":"personal-life","language":"ja","start_year":1961,"end_year":2021,"layers":[{"name":"引っ越しの記録","color":"orange"},{"name":"家族の節目","color":"pink"},{"name":"住宅と都市の時代","color":"blue"}],"events":[{"date":"1961-04-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"北九州・八幡の社宅2Kへ","summary":"父の転勤で、私が6歳の春に家族4人で製鉄所の社宅に移った。台所と二間の2K、風呂は共同棟で、近所と湯の順番を分け合った。廊下に七輪、玄関に自転車。これが記録に残るいちばん古い住まいである。\n\n高度経済成長のただ中で、企業の社宅は住宅不足を補う大きな受け皿だった。**家が会社とともにあった時代**の記憶であり、この年表の出発点になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1962-09-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"千里ニュータウンでまちびらき","summary":"大阪の千里丘陵で、日本初の大規模ニュータウンへの入居が始まった。公団・公社・府営の住宅が丘を覆い、「ニュータウン」という言葉が現実の風景になった。\n\n深刻な住宅不足に対する国家的な回答であり、のちに私の一家もこの丘に移り住む(引っ越しの記録レイヤー)。団地のダイニングキッチンは、食寝分離という新しい暮らし方を全国に広めていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"吹田市: 千里ニュータウンのあゆみ","url":null}]},{"date":"1968-10-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"総住宅数が総世帯数を上回る","summary":"昭和43年住宅統計調査で、全国の住宅数が初めて世帯数を上回った。戦後の「住宅難」が量の面では峠を越えたことを示す節目の数字である。\n\n以後の住宅政策は量から質へと軸足を移していく。とはいえ都市部の狭さは残り、私の一家が暮らす2Kの社宅も例外ではなかった。広さを求める引っ越しは、まだ始まったばかりだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省統計局: 昭和43年住宅統計調査","url":null}]},{"date":"1970-03-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"千里ニュータウンの3DKへ","summary":"父の大阪転勤に伴い、私が15歳の春に千里の公団住宅3DKへ移った。ダイニングキッチンと洋間、ベランダ、水洗トイレ。八幡の社宅とは別世界で、初めて自分の机を持った。\n\n窓の向こうの丘では万国博覧会が開かれようとしていた。**2Kから3DKへ**という間取りの変化は、そのまま日本の暮らしの上昇曲線だった。同級生の多くも、同じ春に越してきた転入組だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1970-03-15","precision":"day","end_date":"1970-09-13","type":"period","layer":"住宅と都市の時代","title":"大阪万博の183日間","summary":"千里丘陵で日本万国博覧会が開かれ、183日間で約6,400万人が来場した。「人類の進歩と調和」を掲げ、動く歩道やワイヤレステレホンが未来の暮らしを演出した。\n\n会場は移り住んだばかりのニュータウンの隣で、私は入場券を握って何度も通った。住宅政策が生んだ丘が、そのまま未来の展示場になった半年だった。団地の子どもの半年は、丸ごと万博とともにあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"大阪府: 日本万国博覧会(EXPO'70)の記録","url":null}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"第一次オイルショック","summary":"第四次中東戦争を機に原油価格が高騰し、「狂乱物価」と呼ばれるインフレが起きた。トイレットペーパー騒動が象徴するように、高度成長の前提が揺らいだ。\n\n建築資材も高騰し、持ち家は遠のいた。翌年に上京する私の住まいが風呂なし四畳半になったのは、仕送りの目減りと無関係ではない。成長の終わりは、まず家賃と物価に現れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済企画庁『昭和49年 年次経済報告』","url":null}]},{"date":"1974-04-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"上京、風呂なし四畳半の下宿へ","summary":"大学進学で東京・中野の木造アパートに移った。四畳半に押し入れ、便所は共同、風呂は銭湯。家賃は月9,000円だったと手帳にある。\n\nオイルショック直後の物価高で仕送りは目減りし、銭湯は週3回に節約した。それでも、初めて自分で選んだ住所だった。団地育ちの目に、木造下宿の路地は古くて新しい東京だった。銭湯の帰りに商店街でコロッケを買うのが贅沢だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1979-04-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"就職、川崎の独身寮6畳へ","summary":"メーカーに就職し、川崎の独身寮に入った。6畳一間に作り付けの棚、食堂と大浴場は共同。同期と廊下で夜通し話した。寮費は安く、月給の多くが貯金に回った。\n\n社宅に生まれ、寮で働き始める。**住まいがずっと会社の敷地の中にあった**ことに気づくのは、ずっと後のことだ。福利厚生としての住宅は、この時代の大企業の標準装備だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1985-05-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"結婚","summary":"29歳の春に同じ会社の同期と結婚した。式は横浜の小さな会場で挙げ、寮を出る日には管理人が赤飯を炊いてくれた。新居の家具は、ふたりの貯金で少しずつ揃えた。\n\n結婚は住まいの転機でもあり、翌月にはふたりで中野の賃貸2DKへ移る(引っ越しの記録レイヤー)。この年の秋のプラザ合意から円高と地価高騰の時代が始まることを、当時のふたりはまだ知らない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1985-06-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"中野の賃貸2DKへ","summary":"結婚を機に、学生時代を過ごした中野へ戻り、賃貸マンションの2DKを借りた。家賃は月6万8,000円。あの四畳半の下宿から歩いて10分の場所だった。\n\nこの部屋で長女が生まれ、6年を暮らす。その間に地価は高騰を続け、「買うなら早く」という焦りが世間に満ちていく。それが次の引っ越しの伏線になった。当時はまだ、対岸の火事だと思っていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1988-03-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"長女誕生","summary":"中野の2DKに家族が3人になった。ベビーベッドを置くと居間はほぼ埋まり、押し入れの半分が子どもの物になった。\n\n子どもの成長は面積の問題でもある。この頃、都心の地価高騰は郊外へ波及し、通勤圏はどんどん外へ延びていた(住宅と都市の時代レイヤー)。「広さは遠さで買う」しかない時代に、私たちの家探しは始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1991-02-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"通勤90分、埼玉の建売住宅を購入","summary":"埼玉の郊外に建売の4LDKを買った。都心まで通勤90分。価格は年収の7倍を超え、頭金は双方の親に頼った。契約の日、営業マンは「今買わないと一生買えませんよ」と言った。\n\n買った直後に地価は下落へ転じ、資産価値は長く戻らなかった。それでも庭と子ども部屋のある家は、**遠さと引き換えに手に入れた広さ**だった。「高値づかみ」という言葉を、後に何度も聞くことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1992-03-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"公示地価が下落、土地神話の終わり","summary":"1992年の地価公示で全国平均の地価が下落に転じ、上がり続けることが前提だった「土地神話」が崩れた。住宅地の下落は以後長く続く。\n\n前年に郊外の家を買った私たちにとって他人事ではなかった。ただしピークの時期や下落幅は地域と用途で大きく異なり、一つの数字では語れない。確かなのは、「家は買えば得」という常識が終わったことだ。","detail":null,"credibility":"disputed","credibility_note":"地価のピーク時期や下落幅は地域・用途により大きく異なり、全国一律の数値としては確定できない。","sources":[{"title":"国土庁: 平成4年地価公示","url":null}]},{"date":"2001-04-01","precision":"month","end_date":"2004-03-31","type":"period","layer":"引っ越しの記録","title":"名古屋へ単身赴任、1Kの3年間","summary":"46歳で名古屋勤務となり、単身赴任の1Kマンションで3年を過ごした。荷物は段ボール10箱。家族の家と自分の部屋、住まいがふたつに分かれた。\n\n週末に新幹線で往復する暮らしは、持ち家が動けないことの裏返しでもあった。ローンを抱えた家は家族を郊外に留め、仕事は父だけを都市へ動かす。この時代の転勤族に共通する構図だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-03-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"定年退職","summary":"60歳で定年を迎え、川崎の独身寮から数えて36年の会社勤めを終えた。最後の出社の日は、社宅と寮の思い出話ばかりしていた。次の住まいを考え始めたのは、それから半年後のことだ。\n\n通勤がなくなると、通勤90分の立地は意味を変える。広い家は夫婦ふたりには余り、駅から遠い坂道は年々こたえるようになった。住まいの条件は、人生の段階ごとに書き換わっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-04-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"空き家846万戸、空き家率13.6%","summary":"平成30年住宅・土地統計調査の結果が公表され、全国の空き家は846万戸、空き家率は13.6%と過去最高を更新した。\n\n住宅数が世帯数を上回ってから半世紀、量の充足は過剰へと転じた。地方の実家をどうするかという問いが、私を含む同世代の共通の宿題になった。この年の秋、私も八幡の実家を手放すことになる(家族の節目レイヤー)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省統計局: 平成30年住宅・土地統計調査","url":null}]},{"date":"2019-11-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"母を見送り、八幡の実家を手放す","summary":"春に母を見送り、秋に空き家となった実家を売却した。買い手がつくまで半年かかった。家財の処分は業者に頼み、アルバムだけ段ボール2箱持ち帰った。庭の金木犀だけ、枝を一本もらってきた。\n\n全国で846万戸と言われた空き家の一戸が、うちの実家だった。**統計の中に自分の家がある**という感覚は、この年表を書き始めた理由のひとつでもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-07-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"東京都が転出超過に","summary":"住民基本台帳の人口移動報告で東京都が転出超過に転じたと報じられ、テレワークの広がりを背景に都心を離れる動きが注目された。\n\nただし月次の速報値で外国人の移動も含まれ、一時的な変化か構造的な変化かは評価が分かれる。確かなのは、通勤距離が住まい選びの絶対条件ではなくなり始めたことだ。翌年の私たちの住み替えにも、この変化は追い風になった。","detail":null,"credibility":"unverified","credibility_note":"月次の速報値に基づく報道で、集計範囲(外国人・世帯類型)や期間の取り方により基調の評価が分かれる。","sources":[{"title":"総務省統計局: 住民基本台帳人口移動報告(2020年7月分)","url":null}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"郊外の家を売り、駅前の中古マンションへ","summary":"30年住んだ埼玉の家を売り、駅から徒歩3分の中古マンション2LDKに移った。荷物は半分に減らし、本と写真だけは全部持ってきた。おそらく人生最後の引っ越しである。\n\nコロナ禍で郊外の庭付き住宅に思わぬ買い手がついた。社宅の2Kに始まり、団地、四畳半、寮、持ち家、そして駅前の2LDKへ。**間取りの遍歴は、そのまま時代の遍歴だった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-music-practice","title":"楽器練習の軌跡","description":"1987年生まれの架空の一人が、7歳で始めて13歳でやめ、29歳で再開したピアノの記録。練習と演奏の歩みに、暮らしの変化と音楽をめぐる社会の動きを重ね、上達ではなく「続いてきたこと」をたどる。","category":"personal-life","language":"ja","start_year":1994,"end_year":2026,"layers":[{"name":"練習と演奏","color":"purple"},{"name":"日々の暮らし","color":"gold"},{"name":"音楽と社会","color":"teal"}],"events":[{"date":"1994-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"7歳、近所のピアノ教室に通い始める","summary":"団地の一室で開かれていた個人教室に、母に連れられて通い始めた。最初の教本はバイエル。家の電子オルガンで練習し、練習した日はカレンダーにシールを貼った。\n\n当時、教室でピアノを習う男子は学年で自分ひとりだった。この「少数派」の感覚は、大人になって再開するときにも少しだけついて回ることになる。すべての始まりとしては、ごく普通の習い事だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-03-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"13歳、発表会を最後に教室をやめる","summary":"中学の部活と塾が重なり、6年通った教室をやめた。最後の発表会で弾いたのはソナチネの第1楽章。演奏の出来より、終わったあとの解放感のほうをよく覚えている。\n\nやめること自体に迷いはなく、**いつでも戻れると思っていた**。実際に戻るまで16年かかることを、このときは知らない。先生は「楽譜は捨てないでね」とだけ言った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-04-01","precision":"month","end_date":"2016-05-31","type":"period","layer":"練習と演奏","title":"弾かなかった16年","summary":"高校、大学、就職と続いた、ピアノに触れない16年間。実家の電子オルガンは処分され、楽譜だけが段ボールで保管されていた。音楽は聴く一方の趣味になった。\n\nこの間に音楽の環境は激変した。動画サイトで誰もが演奏を公開し(音楽と社会レイヤー)、ストリートピアノが街に現れる。ブランクのあいだに、再開のための道具立てが世の中に揃っていった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2006-04-01","precision":"month","end_date":null,"type":"point","layer":"日々の暮らし","title":"大学進学、名古屋で一人暮らし","summary":"名古屋の大学に進み、初めての一人暮らしを始めた。ワンルームにはテレビより先に中古のコンポを置いた。軽音サークルの誘いは「聴く専門なので」と断っている。\n\n同じ年の暮れにニコニコ動画が始まり、「演奏してみた」の文化が育ち始める(音楽と社会レイヤー)。弾かない16年のただ中で、演奏する素人を画面越しに眺める習慣だけが続いていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2006-12-12","precision":"day","end_date":null,"type":"point","layer":"音楽と社会","title":"ニコニコ動画がサービス開始","summary":"動画の上にコメントが流れる動画サービス、ニコニコ動画が始まった。「演奏してみた」タグが生まれ、プロでない演奏者が不特定多数に聴かれる場が国内に定着していく。\n\nYouTubeと合わせて、練習の過程を公開する文化の土台になった。楽譜と教室が中心だった音楽の学びに、「人の演奏を無限に見られる」という新しい入り口が加わった時期である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ニコニコ動画","url":"https://ja.wikipedia.org/wiki/%E3%83%8B%E3%82%B3%E3%83%8B%E3%82%B3%E5%8B%95%E7%94%BB"}]},{"date":"2010-04-01","precision":"month","end_date":null,"type":"point","layer":"日々の暮らし","title":"就職、機械メーカーの営業事務に","summary":"名古屋の機械メーカーに就職した。配属先の歓迎会で特技を聞かれ、「昔ピアノを少し」と答えたら余興で弾かされそうになり、慌てて打ち消したのを覚えている。\n\nリーマン・ショック後の厳しい就職環境で、内定はこの一社だけだった。生活が仕事中心に組み上がっていき、音楽は通勤のイヤホンの中だけに。ピアノからいちばん遠い時期である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-06-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"29歳、電子ピアノを買って再開する","summary":"同僚の結婚式で、新婦の父が挨拶の代わりにピアノを一曲弾いた。その帰り道に楽器店へ寄り、ヘッドホンで練習できる電子ピアノを注文した。ボーナスの大半が消えた。\n\n指は驚くほど動かなかったが、楽譜が読めることだけは体に残っていた。実家から16年ぶりに段ボールの楽譜が届く。**再開に必要だったのは才能ではなく、きっかけと防音**だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-02-01","precision":"month","end_date":null,"type":"point","layer":"音楽と社会","title":"JASRACが音楽教室からの徴収方針を表明","summary":"JASRACが、楽器教室での演奏についても著作権使用料を徴収する方針を明らかにし、教室側は「音楽教育を守る会」を結成して反発した。争いはやがて裁判に持ち込まれる。\n\n練習のための演奏は誰のものか、という問いが初めて広く議論された。翌年に教室通いを始めるわたしにとっても、月謝の先にある論点として無縁ではなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本音楽著作権協会(JASRAC)の発表に関する各社報道(2017年2月)","url":null}]},{"date":"2017-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"大人向けのピアノ教室に通い始める","summary":"月2回、仕事帰りに30分のレッスン。講師は同世代で、最初の面談で「発表会は出ても出なくてもいい」と言われて肩の力が抜けた。課題曲は自分で選べる方式だった。\n\n大人の生徒は教室に十数人おり、再開組が半分を占めた。子どもの頃の教室と違い、進度を比べる相手がいないこと。振り返れば、それが続けられた最大の理由だったと思う。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-11-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"16年ぶりの発表会でショパンのワルツ","summary":"大人の生徒だけの小さな発表会で、ショパンのワルツ第19番イ短調を弾いた。直前の1週間は毎晩指が冷たくなるほど緊張し、本番では中間部で一度和音を外した。\n\nそれでも弾き終えたとき、13歳の発表会では感じなかった種類の満足があった。翌週のレッスンで講師が言った「大人の本番は減点法ではない」という言葉を、以後の支えにしている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"音楽と社会","title":"ストリートピアノが全国に広がる","summary":"駅や商業施設に誰でも弾けるピアノを置く取り組みが各地へ広がった時期。演奏動画の人気も相まって、設置は全国で数百台規模に達したとされる。\n\n国内の先駆けとしては2011年の鹿児島の商店街の事例がよく挙げられるが、正確な設置数を示す統計はなく報道ベースである。練習の成果を人前で試す敷居が、発表会の外側で一気に下がった。","detail":null,"credibility":"unverified","credibility_note":"ストリートピアノの設置数や「国内初」の特定は報道・愛好家の集計に基づき、公的な統計は確認できない。","sources":[{"title":"ストリートピアノに関する各社報道(2019年前後)","url":null}]},{"date":"2019-09-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"駅のストリートピアノで初めて弾く","summary":"出張先の駅の構内にピアノが置かれていた。人が途切れた昼下がり、鞄を足元に置いてワルツを1曲。立ち止まる人はいなかったが、最後に小さな拍手がひとつ聞こえた。\n\n発表会と違い、誰も自分を知らない場所で弾くのは初めてだった。**聴かせるためではなく、弾きたいから弾く**。練習の目的が、このあたりから静かに変わっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":"2021-03-31","type":"period","layer":"日々の暮らし","title":"在宅勤務の1年、練習時間が倍になる","summary":"感染症の流行で在宅勤務になり、通勤に使っていた朝晩の時間が練習に置き換わった1年。昼休みの15分をハノンにあて、練習記録アプリの月間時間は再開後の最長を更新し続けた。\n\n教室のレッスンは一時オンラインになり、手元を映すカメラの角度に苦労した。同じ頃、巣ごもり需要で電子ピアノが品薄になったと報じられ(音楽と社会レイヤー)、4年前の自分の買い物に安堵した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-06-01","precision":"month","end_date":null,"type":"point","layer":"音楽と社会","title":"巣ごもり需要で電子ピアノが品薄に","summary":"在宅時間の増加を背景に電子ピアノや初心者向け楽器の販売が伸び、一部メーカーの製品では品薄や納期の遅れが報じられた。オンラインの音楽レッスンも利用が広がった。\n\n販売増の正確な規模は各社の発表や報道に依るが、外出できない時期に楽器を始める人が一定数いたことは複数の調査が示す。「不要不急」の代表のような趣味が、生活の支えとして見直された。","detail":null,"credibility":"unverified","credibility_note":"電子ピアノの販売増・品薄の規模は各社発表と報道に基づき、業界全体の確定統計としては確認できない。","sources":[{"title":"楽器の販売動向に関する各社報道(2020年)","url":null}]},{"date":"2021-10-21","precision":"day","end_date":null,"type":"point","layer":"音楽と社会","title":"ショパン国際コンクールで反田恭平が2位に","summary":"第18回ショパン国際ピアノコンクールで反田恭平が第2位、小林愛実が第4位に入賞した。日本人の第2位は1970年の内田光子以来51年ぶりとされる。\n\nコンクールの模様は公式のネット配信で世界に中継され、深夜に演奏を追う愛好家が続出した。わたしの練習記録アプリにも、この月だけ明け方の再生履歴が残っている。聴くことが、練習のいちばんの燃料になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"第18回ショパン国際ピアノコンクール結果に関する各社報道(2021年10月)","url":null}]},{"date":"2022-10-24","precision":"day","end_date":null,"type":"point","layer":"音楽と社会","title":"最高裁、生徒の演奏への使用料徴収を認めず","summary":"音楽教室での演奏をめぐる訴訟で最高裁は、教師の演奏には著作権使用料が発生する一方、生徒の演奏は徴収の対象にならないとの判断を確定させた。5年に及んだ争いの決着である。\n\n「習う人の演奏は誰のためのものか」に司法が答えた形で、教室に通う側にも静かな安堵が広がった。2017年の方針表明(同レイヤー)に始まる論点は、練習という行為の位置づけを社会に問い直した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"最高裁判所第一小法廷判決(2022年10月24日)に関する各社報道","url":null}]},{"date":"2023-08-01","precision":"month","end_date":null,"type":"point","layer":"日々の暮らし","title":"実家のアップライトピアノを引き取る","summary":"実家の建て替えを機に、祖母が母のために買ったという古いアップライトピアノを名古屋の自宅へ運んだ。運送と修理、調律を合わせると、電子ピアノがもう一台買える金額になった。\n\n調律師は「50年物ですが芯は生きています」と言った。防音マットを敷き、弾くのは昼間だけと決めた。電子ピアノで再開した練習が、7年かけて生のピアノに戻ってきた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"音楽と社会","title":"国内のピアノ出荷はピーク時の1割前後に","summary":"経済産業省の生産動態統計などによれば、国内のアコースティックピアノの生産・出荷は1980年前後のピークから長期的に減り続け、近年はピーク時の1割前後の水準とされる。\n\n少子化と住宅事情、電子ピアノへの移行が背景にある。ただし電子ピアノや中古市場を含めた「弾く人の数」の推移は別であり、生産統計だけで文化の衰退を語れるわけではない。","detail":null,"credibility":"disputed","credibility_note":"「ピーク時の1割前後」は統計の品目区分や比較する年の取り方によって数値が変わり、電子ピアノを含めるかどうかでも評価が分かれる。","sources":[{"title":"経済産業省 生産動態統計(楽器)","url":null}]},{"date":"2024-11-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"発表会で幻想即興曲、途中で止まる","summary":"再開から8年、憧れだったショパンの幻想即興曲に挑んだ。中間部の手前で頭が真っ白になり、完全に止まった。数秒の沈黙ののち、少し前から弾き直して最後までたどり着いた。\n\n録音を聴き返すと、止まった数秒のあとの音のほうが、本番中のどこよりも落ち着いていた。**止まっても、続きから弾けばいい**。7歳から数えて30年目に、ようやく腑に落ちたことである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"練習ノートが10冊目に入る","summary":"再開の日から書き続けている練習ノートが10冊目に入った。日付と練習した曲、気づきを3行だけ書く方式で、通算の練習日は2000日を超えた。\n\n読み返すと、上達の記録というより暮らしの記録に近い。仕事が荒れた月は空白が続き、戻ってくるたびに同じ基礎練から再開している。**やめないことではなく、何度でも戻ること**。この記録の結論はそれに尽きる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-parenting","title":"子育ての記録","description":"2016年に生まれた第一子と、2022年に生まれた第二子を育てる架空の家族の10年。子どもの成長、親の仕事と暮らし、保育・教育制度やコロナ禍といった社会の動きを重ね、家庭の選択が制度に左右されてきた道筋を残す。","category":"personal-life","language":"ja","start_year":2016,"end_year":2026,"layers":[{"name":"子どもの成長","color":"green"},{"name":"親の仕事と暮らし","color":"gold"},{"name":"社会と制度","color":"blue"}],"events":[{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"「保育園落ちた」ブログが国会で取り上げられる","summary":"2月中旬に投稿された、認可保育所に入れなかった保護者の匿名ブログがSNSで拡散し、月末の衆議院予算委員会で言及された。「保活」という言葉が一般に広まり、都市部の待機児童問題が政策課題として前景化した年。\n\nこの年の秋に第一子を迎える家族にとって、生まれる前から入園の心配をするのが当たり前という空気が、すでにできあがっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"衆議院: 第190回国会 予算委員会 会議録（平成28年2月29日）","url":null},{"title":"厚生労働省: 保育所等関連状況取りまとめ（平成28年4月1日）","url":null}]},{"date":"2016-11-08","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"第一子、誕生","summary":"予定日より4日遅れて、都内の病院で長女が生まれる。体重3,120グラム。陣痛から18時間、夫は職場から駆けつけて立ち会った。名前は決めるのに一晩かかった。\n\n待機児童問題が国会で取り上げられた年で、退院の日に受け取った区の案内には、すでに翌々年度の保育所申込みの説明が入っていた。抱いている赤ん坊の1年半後を考えるのは奇妙な感覚だったが、**それがこの街で子を育てるということだった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-11-08","precision":"day","end_date":"2017-10-31","type":"period","layer":"親の仕事と暮らし","title":"母の産休・育休、ほぼ1年","summary":"出産日から翌年10月末まで、産後休業と育児休業を取得。当初は1歳の誕生日で復職する予定だったが、認可保育所の一次選考に落ちて計画を組み替えた。\n\n育休期間中の10月に育児・介護休業法が改正され、保育所に入れない場合の育休が最長2歳まで延長可能になったが、家計と職場の事情から延長はせず、認可外保育園に入園させて復職した。制度の変化と自分の状況が、少しずれて重なった一年。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"育児休業が最長2歳まで延長可能に","summary":"改正育児・介護休業法が施行され、保育所に入れないなどの場合、従来1歳6か月までだった育休の延長上限が、待機児童対策の一環として子が2歳になるまで引き上げられた。同時に、事業主による育休制度の個別周知が努力義務化された。\n\nこの家族の母は、ちょうど育休の終盤にこの改正を迎えたが、延長せず認可外への入園を選んだ。**制度が整うことと、それを使えるかどうかは別の問題**だと知った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 育児・介護休業法の改正について（平成29年10月1日施行）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000130583.html"}]},{"date":"2017-11-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"母が時短勤務で復職","summary":"1日6時間の短時間勤務で復職。認可外保育園の送迎は母、迎えは週2回だけ父が担当することにした。職場は理解があったが、17時に席を立つとき、まだ会議が続いている部屋を後にする気まずさは残った。\n\n認可外の保育料は月7万円を超え、時短で減った給与とほぼ相殺された。それでも辞めない選択をしたのは、翌年に認可へ移れる可能性を残すためだった。この年の秋、長女は初めて一人で立った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-02-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"認可保育所の二度目の申込みで内定","summary":"前年は落選、今年は第3希望の園に内定。区から届いた封筒を開けるまで、夫婦とも仕事が手につかなかった。認可外に預けて働いた復職実績が選考指数を押し上げたと考えられ、前年の「落ちたから認可外に入れて働く」という選択が結果的に効いた。\n\nブログが国会で話題になった年に生まれた子が、2年越しで認可の門をくぐる。**制度の順番待ちが、家族の暦を決めていた**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-04-02","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"認可保育所へ転園","summary":"認可外の小さな園から、園庭のある認可保育所の1歳児クラスへ転園。人数も部屋の広さも違って最初は戸惑いが大きく、慣らし保育の2週間は毎朝泣いたが、3週目には自分から靴を履くようになった。園長からは、泣くのは前の園が好きだった証拠だと言われた。\n\n転園を境に、母は時短を1時間縮めて7時間勤務に戻し、父の迎え担当を週3回に増やした。家族の時間割が、園の生活リズムに合わせて組み直された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"幼児教育・保育の無償化が始まる","summary":"3〜5歳児の認可保育所・幼稚園等の利用料が原則無償に。消費税率10%への引き上げと同日に実施され、増収分を財源に子育て世帯の負担軽減と少子化対策を掲げて導入された。0〜2歳児は住民税非課税世帯に限られ、給食費や延長保育料は対象外。\n\nこの家族の長女は2歳児クラスだったため恩恵は翌年度から。認可外に7万円を払っていた頃と比べると、制度の谷間にいた時期の記憶が改めてよみがえった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 幼児教育・保育の無償化について","url":"https://www8.cao.go.jp/shoushi/shinseido/musyouka/index.html"}]},{"date":"2020-02-27","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"全国の小中高校に一斉休校を要請","summary":"新型コロナの感染拡大を受け、政府が全国の小中高校に3月2日からの臨時休校を要請。突然の要請に、共働き世帯の間で子どもの居場所をどうするかという問題が一気に表面化した。\n\n保育所は原則開所とされたが、4月の緊急事態宣言後は多くの自治体が登園自粛や休園に踏み切った。この家族も4月から2か月近く、3歳の長女を家で見ながら在宅勤務をすることになる。**制度の空白を、家庭が埋める時期**の始まりだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 新型コロナウイルス感染症対策のための小学校、中学校、高等学校及び特別支援学校等における一斉臨時休業について（令和2年2月28日）","url":"https://www.mext.go.jp/content/202002228-mxt_kouhou01-000004520_1.pdf"}]},{"date":"2020-04-11","precision":"day","end_date":"2020-05-31","type":"period","layer":"子どもの成長","title":"休園中、家で過ごした7週間","summary":"緊急事態宣言下、区の要請で登園を自粛し、3歳の長女と両親がひとつの部屋で在宅勤務と保育を続けた7週間。午前は父、午後は母が仕事を止めて子どもを見る交代制にした。公園は使えず、ベランダで水遊びをし、絵本を何十回も読んだ。\n\n長女はこの時期に平仮名を読み始め、両親は会議中に画面に子どもが映り込むことに慣れた。6月に登園が再開したとき、園の友達の名前をほとんど忘れていたが、1週間で取り戻した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-04-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"GIGAスクール構想で小中学生に一人一台端末","summary":"もともと2023年度までの計画だったGIGAスクール構想が休校の経験から一気に前倒しされ、2020年度末までに全国の大半の自治体で小中学生向け端末の整備が完了したとされる。\n\n文部科学省の調査では2021年3月末時点で9割超の自治体が整備を終えたとされるが、集計時点や「整備完了」の定義により数値は資料ごとに異なる。この家族の長女が2023年に入学した小学校では、1年生から端末を持ち帰る宿題があった。3年前の休校の記憶とつながっている。","detail":null,"credibility":"unverified","credibility_note":"整備完了率は調査時点（2021年3月末／7月末など）と集計単位により文部科学省資料の中でも数値が異なるため、単一の値として確定していない。","sources":[{"title":"文部科学省: GIGAスクール構想の実現に向けた ICT 環境整備の進捗状況について","url":null}]},{"date":"2022-10-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"産後パパ育休（出生時育児休業）が施行","summary":"子の出生後8週間以内に最大4週間、2回に分けて取得できる出生時育児休業が、改正育児・介護休業法の第2段階として施行。男性の育休取得を後押しするため、通常の育休とは別枠で、申出期限も短く設定された。\n\n翌2023年4月からは、従業員1,000人超の企業に取得率の公表も義務づけられた。この家族の第二子は施行の翌月に生まれ、父はこの新制度を使って4週間の休みを取ることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 育児・介護休業法 改正ポイントのご案内（令和4年4月1日から3段階で施行）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000130583.html"}]},{"date":"2022-11-14","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"第二子、誕生","summary":"長女が5歳の秋に、次女が生まれる。コロナ禍の面会制限はまだ続いており、立ち会いは夫だけ、長女は退院の日まで妹に会えず玄関で待った。初対面の長女は妹の指を握って、思ったより小さいと言った。\n\n前月に施行された産後パパ育休を父が取ることが決まっており、退院の翌日から家に大人が2人いる暮らしが始まった。6年前の第一子のときには、なかった選択肢だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-11-15","precision":"day","end_date":"2022-12-12","type":"period","layer":"親の仕事と暮らし","title":"父の産後パパ育休、4週間","summary":"施行されたばかりの出生時育児休業を使い、退院翌日から4週間を続けて取得。職場では前例がなく、上司と人事に制度の説明資料を渡すところから始めた。育休中は長女の保育園送迎、食事、夜間の授乳補助を父が担い、母は産後の回復に専念できた。\n\n第一子のとき父が取れたのは有給3日だけで、この差を夫婦ともに実感した。復帰後、同じ部署の後輩が翌年に同じ制度を使ったと聞いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-04-01","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"こども家庭庁が発足","summary":"内閣府と厚生労働省に分かれていた子
