ャンルになったと報告されました。ストリーミング再生を含む集計方法が大きく効いています。\n\nCD時代に築かれたロックの優位が、聴取行動を直接測る**ストリーミングの時代**にひっくり返った形です。サウンドスキャン導入（1991年）と同じく、測定方法の変化が文化の実勢をあらわにした節目でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nielsen Music Mid-Year Report U.S. 2017","url":null}]},{"date":"2018-04-16","precision":"day","end_date":null,"type":"point","layer":"音楽と表現","title":"🖋️ ケンドリック・ラマーにピュリッツァー賞","summary":"ケンドリック・ラマーのアルバム『DAMN.』がピュリッツァー賞音楽部門を受賞。同部門でクラシックとジャズ以外の作品が選ばれるのは初めてです!\n\n「現代の黒人の生活の複雑さを捉えた作品集」という授賞理由は、ラップの詞を文学として正面から認めるものでした。半世紀前に路上で生まれた表現形式への、制度の側からの**芸術としての承認**を象徴する出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Pulitzer Prizes: Kendrick Lamar","url":"https://www.pulitzer.org/winners/kendrick-lamar"}]},{"date":"2018-05-01","precision":"month","end_date":null,"type":"point","layer":"音楽と表現","title":"🎥 「This Is America」が銃社会を撃つ","summary":"チャイルディッシュ・ガンビーノが「This Is America」を発表。陽気なダンスと突然の銃撃を交錯させるミュージックビデオが米国の銃暴力と黒人の生を主題化し、世界で爆発的に再生されました。\n\nMVという形式そのものを批評の道具に変えた達成で、翌年のグラミー賞では主要2部門を制します。「ザ・メッセージ」以来の「現実を語る」系譜が、映像とSNSの時代の文法で更新されたと言えます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: This Is America (song)","url":null}]},{"date":"2019-08-01","precision":"month","end_date":null,"type":"point","layer":"産業とメディア","title":"🤠 「オールド・タウン・ロード」が19週連続首位","summary":"リル・ナズ・Xの「オールド・タウン・ロード」が、ビルボードHot 100で史上最長となる19週連続1位を達成。カントリーとトラップを混ぜた曲で、TikTok上のミーム拡散がヒットの起点でした。\n\nカントリーチャートから除外された経緯は、ジャンル分類と人種の関係をめぐる論争を呼びます。SNSがラジオに代わるヒットの入口になったことを決定づけ、ヒップホップの語法があらゆるポップの土台になった現在を象徴する曲です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Old Town Road","url":"https://en.wikipedia.org/wiki/Old_Town_Road"}]},{"date":"2023-08-11","precision":"day","end_date":null,"type":"point","layer":"社会とストリート","title":"🎉 ヒップホップ生誕50周年、発祥の地で記念公演","summary":"クール・ハークのパーティーからちょうど50年の当日、ブロンクスのヤンキー・スタジアムでRun-D.M.C.らが出演する大規模な記念公演が開かれました!この年はグラミー賞の特別企画など、一年を通して50周年が祝われています。\n\n誕生日という語りに神話が含まれることは指摘されつつも、地域の路上文化が半世紀で世界最大級のポップカルチャーに到達したことを、発祥の地で確かめる一年になりました。この年表の締めくくりです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Hip Hop 50 Live at Yankee Stadium (2023年8月11日)に関する各社報道","url":null}]}]},{"slug":"culture-impressionism-to-street","title":"印象派からストリートアートへ","description":"1874年の第1回印象派展から2010年代のバンクシーまで。作品と運動、それを受け入れ値付けする制度と市場、表現を支えた技術と社会の3層を重ね、「前衛」が周縁から中心へ移る反復を追う。","category":"culture","language":"ja","start_year":1874,"end_year":2018,"layers":[{"name":"作品と運動","color":"pink"},{"name":"制度と市場","color":"gold"},{"name":"技術と社会","color":"teal"}],"events":[{"date":"1874-04-15","precision":"day","end_date":"1886-06-15","type":"period","layer":"制度と市場","title":"印象派展の時代（全8回の自主展）","summary":"1874年から1886年まで計8回開かれた印象派の自主展の時代。官展サロン一極の発表制度に対し、グループ展と画商デュラン=リュエルらが結びつく**サロンに代わる発表と販売の回路**が築かれ、近代的な市場モデルが形成された。\n\n参加者は毎回入れ替わり、最終回の1886年展にはスーラの点描が登場し、運動の内部から次の様式が生まれた。同じ頃、写真の商業化と鉄道網の拡大が郊外での制作と流通を後押ししていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Impressionism (Exhibitions)","url":"https://en.wikipedia.org/wiki/Impressionism"},{"title":"National Gallery of Art: Paul Durand-Ruel and the Impressionists","url":null}]},{"date":"1874-04-15","precision":"day","end_date":null,"type":"point","layer":"作品と運動","title":"第1回印象派展、パリのナダール旧写真スタジオで開幕","summary":"モネ、ルノワール、ドガらの「画家・彫刻家・版画家等芸術家匿名協会」が、官展サロンの審査に依存しない自主展をパリで開催した。批評家ルイ・ルロワがモネ《印象、日の出》を揶揄した記事が「印象派」の呼称の起源とされる。\n\n会場が写真家ナダールの旧スタジオだった点は象徴的で、写真という新技術が絵画の役割を問い直していた時期と重なる。展覧会は約1か月続き、入場者は限られたが批評は活発だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Musée d'Orsay: 1874 Inventing Impressionism (展覧会解説)","url":"https://www.musee-orsay.fr/en/whats-on/exhibitions/paris-1874-inventing-impressionism"},{"title":"Wikipedia: First Impressionist Exhibition","url":"https://en.wikipedia.org/wiki/First_Impressionist_Exhibition"}]},{"date":"1886-04-10","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"デュラン=リュエル、ニューヨークで大規模な印象派展を開催","summary":"画商ポール・デュラン=リュエルがニューヨークのアメリカ美術協会で約300点を展示し、印象派の米国市場が開かれた。パリで売れ残った在庫を抱えた画商が新大陸に活路を求めた展覧会だった。\n\n以後、米国の実業家コレクターが印象派の主要な買い手となり、20世紀の米国美術館コレクションの基礎を築く。同年パリでは最後の印象派展が開かれており、運動が制度化と拡散の段階に入ったことを示す。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Paul Durand-Ruel","url":"https://en.wikipedia.org/wiki/Paul_Durand-Ruel"}]},{"date":"1888-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と社会","title":"コダック、初のロールフィルム式カメラを発売","summary":"ジョージ・イーストマンのコダック・カメラが「あなたはボタンを押すだけ」を掲げて発売。現像・焼付をメーカーが代行する仕組みで写真を専門家から一般へ解放し、撮影の大衆化が始まった。\n\n絵画の「記録」としての役割はいっそう後退し、画家たちは同時期にスナップ的な構図や瞬間の光へと関心を移して、写真と絵画の役割分担が明確になる。後年のグラフィティ記録やSNS拡散へ続く**「誰もが記録者になる」流れ**の起点でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kodak (History)","url":"https://en.wikipedia.org/wiki/Kodak"}]},{"date":"1913-02-17","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"アーモリー・ショー開幕、米国にヨーロッパ前衛が紹介される","summary":"ニューヨークの兵器庫で国際現代美術展「アーモリー・ショー」が開幕。印象派から後期印象派、キュビスムまでを一望させ、デュシャン《階段を降りる裸体No.2》が騒動を呼ぶなど、米国の批評と市場に前衛の受容を迫った。\n\n会場は軍の兵器庫という非美術館空間で、後のオルタナティブ・スペースの先例でもある。同年、ヨーロッパでは翌年の大戦を控え、未来派やロシア前衛が急進化していた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Armory Show","url":"https://en.wikipedia.org/wiki/Armory_Show"}]},{"date":"1917-04-01","precision":"month","end_date":null,"type":"point","layer":"作品と運動","title":"デュシャン《泉》、独立芸術家協会展への出品を拒否される","summary":"デュシャンが「R. Mutt」と署名した男性用小便器《泉》を独立芸術家協会展に出品し、展示を拒否された。既製品を作品とするレディメイドの概念が広まる契機となる。\n\n「審査なし」を掲げた協会展が展示を拒んだことで、**何が芸術かを決めるのは制度か作家かという問い**が顕在化した。オリジナルは失われ、スティーグリッツの写真とレプリカで知られる。作者をエルザ・フォン・フライターク=ローリングホーフェンとする説もあり、帰属は現在も議論がある。","detail":null,"credibility":"disputed","credibility_note":"出品者がデュシャン本人か、エルザ・フォン・フライターク=ローリングホーフェンかについて研究者間で見解が分かれる。","sources":[{"title":"Wikipedia: Fountain (Duchamp)","url":"https://en.wikipedia.org/wiki/Fountain_(Duchamp)"},{"title":"Tate: Fountain 1917, replica 1964 (作品解説)","url":"https://www.tate.org.uk/art/artworks/duchamp-fountain-t07573"}]},{"date":"1929-11-07","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"ニューヨーク近代美術館（MoMA）開館","summary":"ニューヨーク近代美術館（MoMA）が開館。開館展は「セザンヌ、ゴーガン、スーラ、ファン・ゴッホ」で、近代美術を収集・体系化する美術館が誕生した。\n\nウォール街大暴落の直後の開館だった。印象派以後の美術を「近代美術」として正典化し、収蔵と展示を通じて価値を定める制度が確立する。同時期ドイツではバウハウスが機能主義を掲げ、モダニズムは制度と教育の両面から広がっていた。開館当初は貸しビルの数室から始まり、1939年に現在地へ移った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"MoMA: History (公式)","url":"https://www.moma.org/about/who-we-are/moma-history"},{"title":"Wikipedia: Museum of Modern Art","url":"https://en.wikipedia.org/wiki/Museum_of_Modern_Art"}]},{"date":"1937-07-19","precision":"day","end_date":null,"type":"point","layer":"技術と社会","title":"ナチス政権、ミュンヘンで「退廃芸術展」を開催","summary":"ナチス政権がミュンヘンで「退廃芸術展」を開催。表現主義や抽象などを「退廃」として見せしめ展示し、国家による美術の統制と没収が公然化した。美術館からは約1万6千点が押収され、一部は国外で売却・破棄された。\n\n多くの作家が亡命し、戦後の抽象表現主義がニューヨークで開花する遠因となる。作品と制度が政治に従属した極端な例で、同じ年のパリ万博ではピカソ《ゲルニカ》がスペイン館に展示されていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Degenerate Art exhibition","url":"https://en.wikipedia.org/wiki/Degenerate_Art_exhibition"}]},{"date":"1947-01-01","precision":"year","end_date":null,"type":"point","layer":"作品と運動","title":"ポロック、床置きキャンバスへの「ドリップ」を本格化","summary":"ポロックが床置きキャンバスに絵具を垂らし飛ばす「ドリップ」を本格化させ、オールオーヴァーの画面を生んだ。工業用エナメル塗料と巨大なキャンバスという素材の変化が、身体の運動を画面に記録する手法を可能にした。\n\n1949年の『ライフ』誌特集で大衆的にも知られる存在となる。冷戦下で抽象表現主義は「自由な米国美術」として国務省や美術館の海外展に組み込まれ、制度と政治が作品の評価を後押しした。","detail":null,"credibility":"disputed","credibility_note":"ドリップ技法の「開始年」は諸説あり、1936年のシケイロス工房での実験や1943年頃の試作を起点とする見方もある。","sources":[{"title":"MoMA: Jackson Pollock (作家解説)","url":"https://www.moma.org/artists/4675"},{"title":"Wikipedia: Jackson Pollock","url":"https://en.wikipedia.org/wiki/Jackson_Pollock"}]},{"date":"1962-07-09","precision":"day","end_date":null,"type":"point","layer":"作品と運動","title":"ウォーホル《キャンベル・スープ缶》をロサンゼルスで初展示","summary":"ウォーホルがロサンゼルスのフェラス画廊で32点の缶詰を並べた初個展を開催。スーパーマーケットの陳列を模した展示で、大量生産品と広告のイメージが美術館の壁に入り、消費社会そのものが主題になった。\n\n同年にはシルクスクリーンによる複製技法を採用し、作家の手仕事という価値観を揺さぶる。テレビと雑誌広告が家庭に浸透した時期と重なり、後のストリートアートが広告的手法を用いる伏線となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"MoMA: Campbell's Soup Cans (作品解説)","url":"https://www.moma.org/collection/works/79809"},{"title":"Wikipedia: Campbell's Soup Cans","url":"https://en.wikipedia.org/wiki/Campbell%27s_Soup_Cans"}]},{"date":"1970-01-01","precision":"year","end_date":"1989-05-12","type":"period","layer":"技術と社会","title":"ニューヨーク地下鉄グラフィティの時代","summary":"1970年代の財政危機と治安悪化を背景に、ニューヨークの地下鉄が最大のキャンバスとなった時代。車両全面のピースからワイルドスタイルまで様式が発達し、1989年にMTAが「グラフィティのない地下鉄」を宣言して終息した。\n\n写真家マーサ・クーパーらの記録と、1983年の映画『ワイルド・スタイル』や写真集『Subway Art』が世界に様式を伝え、ヨーロッパや日本へ波及した。行政は洗浄と車両更新で対抗し、80年代後半に舞台は路上へ移る。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Graffiti in New York City","url":"https://en.wikipedia.org/wiki/Graffiti_in_New_York_City"},{"title":"Martha Cooper & Henry Chalfant『Subway Art』(1984)","url":null}]},{"date":"1971-07-21","precision":"day","end_date":null,"type":"point","layer":"技術と社会","title":"『ニューヨーク・タイムズ』が「TAKI 183」を報道","summary":"『ニューヨーク・タイムズ』がマンハッタン中に名前を書き残す少年「TAKI 183」を紹介し、地下鉄グラフィティが社会現象として認知された。記事は模倣者を急増させ、都市財政危機下のニューヨークで行政との攻防が始まる。\n\nスプレー缶とマーカーという安価な道具、地下鉄という移動する画面が「タグ」の文化を生んだ。同じ1970年代初頭、美術界ではコンセプチュアル・アートが「もの」を離れつつあり、路上では逆に名前を可視化する欲望が噴出していた。","detail":null,"credibility":"disputed","credibility_note":"TAKI 183を「最初のグラフィティ・ライター」とする通説には異論があり、フィラデルフィアのCornbreadら先行例を挙げる見方がある。","sources":[{"title":"Wikipedia: TAKI 183","url":"https://en.wikipedia.org/wiki/TAKI_183"}]},{"date":"1973-10-18","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"スカル・コレクション競売、現代美術の投機時代を告げる","summary":"ロバートとエセルのスカル夫妻が所蔵50点をサザビー・パーク・バーネットで競売にかけ、落札額が購入価格を大きく上回った。約900ドルで購入されたラウシェンバーグ《Thaw》は8万5千ドルで落札され、作家が会場でコレクターに詰め寄った逸話が残る。\n\n存命作家の作品が短期間で値上がりする構図が可視化され、以後オークションが現代美術の価格形成の中心となる。作家への再販利益還元（追及権）の議論も高まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Robert C. Scull","url":"https://en.wikipedia.org/wiki/Robert_C._Scull"}]},{"date":"1980-06-01","precision":"month","end_date":null,"type":"point","layer":"作品と運動","title":"「タイムズ・スクエア・ショー」開催","summary":"作家集団コラボが元マッサージ店の廃屋で雑居展「タイムズ・スクエア・ショー」を開催。グラフィティ、パンク、ポルノ地区の風景を取り込んだ展示は「最初のラディカルな80年代アートショー」と評され、バスキア、ヘリングら路上系の若手が美術界と接続した。\n\n同年のニューヨーク市は財政再建の途上にあり、空き家と低家賃が若手の実験を可能にしていた。数年後、同じ作家たちがソーホーの画廊と競売に吸収されていく。","detail":null,"credibility":"unverified","credibility_note":"開催期間の正確な日付と参加作家の全リストは資料により異同があり、本項は6月開催という概略のみ記載。","sources":[{"title":"Wikipedia: The Times Square Show","url":"https://en.wikipedia.org/wiki/The_Times_Square_Show"}]},{"date":"1987-03-30","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"ゴッホ《ひまわり》、約2,475万ポンドで落札","summary":"クリスティーズ・ロンドンでゴッホ《ひまわり》が約2,475万ポンドで落札され、当時の美術品最高額を記録。落札者は安田火災海上保険で、日本マネーの本格参入を示した。\n\n**1874年に嘲笑された印象派が、一世紀後には最も高価な資産となった**。プラザ合意後の円高と日本のバブル経済が価格を押し上げ、1990年には斎藤了英がゴッホ《医師ガシェの肖像》を8,250万ドルで落札する。制度と市場のレイヤーが作品評価を規定する時代の頂点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SOMPO美術館: ゴッホ《ひまわり》(所蔵作品解説)","url":"https://www.sompo-museum.org/collections/sunflowers/"},{"title":"Wikipedia: Sunflowers (Van Gogh series)","url":"https://en.wikipedia.org/wiki/Sunflowers_(Van_Gogh_series)"}]},{"date":"2005-08-01","precision":"month","end_date":null,"type":"point","layer":"作品と運動","title":"バンクシー、ヨルダン川西岸の分離壁に9点の壁画","summary":"バンクシーがヨルダン川西岸の分離壁に、少女が風船で壁を越える図像など9点の壁画を制作。壁面を政治的メッセージの媒体にし、匿名の作家像が国際的に知られるようになった。\n\n短時間で高精度の図像を残せるステンシル技法によるパレスチナでの制作は、路上の表現が観光地化と報道を通じて拡散する初期の例で、写真がウェブで共有される時代の到来と一体だった。作家は匿名を保ち、公式サイトと代理人以外の「認証」がないため、帰属の確認は常に困難を伴う。","detail":null,"credibility":"unverified","credibility_note":"制作時期は報道と作家側の発表に基づく概略で、日付レベルの一次資料は確認できていない。","sources":[{"title":"Wikipedia: Banksy","url":"https://en.wikipedia.org/wiki/Banksy"}]},{"date":"2008-05-23","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"テート・モダン、外壁を舞台に「Street Art」展を開催","summary":"テート・モダンが建物正面の外壁を舞台に「Street Art」展を開催し、6組の作家が巨大壁画を制作。**ストリートアートが公的制度に正面から迎え入れられた**。\n\n同じ月、ロンドン・ウォータールーの地下道ではバンクシー主催の「カンズ・フェスティバル」が開かれ、公的制度と自主企画が並走した。地下鉄グラフィティが洗浄された20年前と比べ、行政と美術館の態度は反転している。以後、路上作品の切り出し販売や保護をめぐる法的議論が続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Tate: Street Art (2008年展覧会ページ)","url":"https://www.tate.org.uk/whats-on/tate-modern/street-art"}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"技術と社会","title":"Instagramがサービス開始","summary":"Instagramがサービスを開始し、スマートフォンで撮影と共有が一体化した。壁画は現地に行かなくても「消える前に」世界へ届く画像となる。\n\n1888年のコダックが撮影を大衆化したように、Instagramは発表と流通を大衆化した。ストリートアートは制作直後に撮影・共有され、消去や上書きを前提とした表現が画像として残る。作家の匿名性とフォロワー数が価値の一部となり、美術館や画廊を経由しない評価回路が形成された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2013-10-01","precision":"day","end_date":"2013-10-31","type":"period","layer":"作品と運動","title":"バンクシー「Better Out Than In」ニューヨーク滞在制作","summary":"バンクシーが10月の1か月間、毎日1点をニューヨーク市内に発表する滞在制作「Better Out Than In」を実施。作品の場所はウェブとSNSで公表され、市民が探し歩いた。\n\n発表はInstagramと専用サイト、鑑賞は市民のスマートフォン、市長は「器物損壊」と非難し、一部作品は数時間で上書きされるなど、作品と技術と社会のレイヤーが同時に動いた例である。セントラルパークで本人の作品を1点60ドルで無名販売する企画は、市場が値付けする「作家名」の機能を露わにした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Better Out Than In","url":"https://en.wikipedia.org/wiki/Better_Out_Than_In"}]},{"date":"2018-10-05","precision":"day","end_date":null,"type":"point","layer":"制度と市場","title":"サザビーズで落札直後、バンクシー《風船と少女》が自ら裁断","summary":"サザビーズでバンクシー《風船と少女》が約104万ポンドで落札された直後、額縁内のシュレッダーが作動。半分裁断された作品は《愛はごみ箱の中に》と改題された。実行の映像はSNSで拡散され、技術と社会のレイヤーが市場の出来事を即時に世界化した。\n\n市場批判のパフォーマンスが結果として作品価値を高める逆説となり、2021年の再出品では約1,870万ポンドで落札される。1973年のスカル競売で作家が抗議した構図から半世紀、**抗議そのものが商品化される段階**に達した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Love is in the Bin","url":"https://en.wikipedia.org/wiki/Love_is_in_the_Bin"},{"title":"Sotheby's: Banksy, Love is in the Bin (2021年セール解説)","url":null}]}]},{"slug":"culture-jpop-streaming","title":"🎧 J-POPとストリーミングの30年","description":"1990年代のCDバブルから2020年代のグローバルヒットまで。ヒット作とアーティスト、流通と技術、産業と制度の3層を重ねて、「売れる形」が円盤から再生回数へ変わっていく30年を、あの頃の記憶と一緒にたどります 🎧","category":"culture","language":"ja","start_year":1988,"end_year":2024,"layers":[{"name":"作品とアーティスト","color":"pink"},{"name":"流通と技術","color":"blue"},{"name":"産業と制度","color":"gold"}],"events":[{"date":"1988-10-01","precision":"day","end_date":null,"type":"point","layer":"産業と制度","title":"📻 J-WAVE開局、「J-POP」の呼称が広まる","summary":"東京のFM局J-WAVEが開局。洋楽中心の編成の中で流す邦楽を指す言葉として「J-POP」が使われ始めたとされています。「歌謡曲」でも「ニューミュージック」でもない、洋楽と並べても浮かない邦楽。この呼び名の誕生です。\n\n放送局側のネーミングがジャンルの意識を作ったというのが面白いところ。90年代のCDバブルと一緒にレコード店の棚やチャートの言葉として定着して、いつの間にか業界の当たり前になっていました。","detail":null,"credibility":"disputed","credibility_note":"呼称の起源はJ-WAVE開局前後の局内用語という説が有力ですが、誰がいつ言い始めたかは諸説あって、一次資料では確定していません。","sources":[{"title":"Wikipedia: J-POP","url":"https://ja.wikipedia.org/wiki/J-POP"},{"title":"烏賀陽弘道『Jポップとは何か』岩波新書 (2005)","url":null}]},{"date":"1991-01-01","precision":"year","end_date":"1998-12-31","type":"period","layer":"産業と制度","title":"💿 CDバブル：音楽ソフト生産額が右肩上がりの時代","summary":"ドラマ・CMタイアップとミリオンセラーが量産され、1998年に音楽ソフト生産金額が過去最高を記録するまで拡大が続いた時代です。8cmシングルとタイアップ、そしてカラオケの普及が**「知ってる曲を買う」循環**を回していました。\n\n同じ頃、流通と技術レイヤーではCDがレコードを完全に置き換え、レンタル店が全国に。ピークの1998年に宇多田ヒカルがデビューして、翌年から市場は縮小に転じます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本レコード協会: 音楽ソフト種類別生産金額推移","url":"https://www.riaj.or.jp/g/data/annual/ms_m.html"}]},{"date":"1992-05-27","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"🎤 米米CLUB「君がいるだけで」発売、ドラマ主題歌が大ヒット","summary":"米米CLUB「君がいるだけで」がドラマ『素顔のままで』の主題歌としてシングル約289万枚を売り上げ、タイアップ型ヒットの代表例になりました。\n\n毎週ドラマで流れた曲を、CDショップとレンタル店で手に入れる。この90年代型ヒットの流れ、覚えている人も多いはず。同じ年にはミリオンセラーが相次いでシングル市場が拡大期に入り、曲はメディア露出とセットで設計される時代へ。翌年以降もタイアップ曲がミリオンを量産しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 君がいるだけで","url":"https://ja.wikipedia.org/wiki/%E5%90%9B%E3%81%8C%E3%81%84%E3%82%8B%E3%81%A0%E3%81%91%E3%81%A7"}]},{"date":"1994-01-01","precision":"year","end_date":"1998-12-31","type":"period","layer":"作品とアーティスト","title":"🎹 小室哲哉プロデュース作品の全盛期","summary":"TRF、globe、安室奈美恵。プロデュース作がチャート上位を占めて、「小室サウンド」がJ-POPの音そのものだった時代です。シンセとダンスビートを軸にした制作の裏には、デジタル機材が安くなったという技術レイヤーの変化がありました。\n\nプロデューサーの名前で売れるという構造は、のちのアイドル運営型や動画発ヒットと対照的な「作り手中心」のモデル。市場拡大期と重なって、CD売上のピークを支えました。","detail":null,"credibility":"disputed","credibility_note":"全盛期をいつからいつまでと見るかは論者によって違うので、ここでは主要ヒットが集中した1994〜1998年を便宜的に採用しています。","sources":[{"title":"Wikipedia: 小室哲哉","url":"https://ja.wikipedia.org/wiki/%E5%B0%8F%E5%AE%A4%E5%93%B2%E5%93%89"}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と制度","title":"📀 音楽ソフト生産金額が約6,075億円で過去最高に","summary":"日本レコード協会の統計で、音楽ソフト生産金額が約6,075億円のピークに到達。ここが頂点で、以後CD市場は長い縮小局面に入ります。\n\n同じ年に宇多田ヒカルがデビューして、翌年の『First Love』が史上最多のアルバム売上を記録。作品の頂点と市場の頂点が重なった転換点です。技術レイヤーではMP3プレーヤーとCD-Rが普及し始めていて、「複製できる音楽」への移行が静かに始まっていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本レコード協会: 音楽ソフト種類別生産金額推移","url":"https://www.riaj.or.jp/g/data/annual/ms_m.html"}]},{"date":"1999-03-10","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"🎧 宇多田ヒカル『First Love』発売、日本史上最多売上アルバムに","summary":"宇多田ヒカルのデビューアルバム『First Love』が累計約765万枚（オリコン）を記録して、日本史上最多売上アルバムに。R&Bを土台にした音作りと15歳でのデビューは、J-POPの言葉づかいを更新しました!\n\n産業レイヤーでは前年に生産金額がピークを打っていて、この記録は「上り坂の最後」ではなく「下り坂の始まり」に立った作品。以後、この枚数を超えるアルバムは現れていません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: First Love (宇多田ヒカルのアルバム)","url":"https://ja.wikipedia.org/wiki/First_Love_(%E5%AE%87%E5%A4%9A%E7%94%B0%E3%83%92%E3%82%AB%E3%83%AB%E3%81%AE%E3%82%A2%E3%83%AB%E3%83%90%E3%83%A0)"}]},{"date":"2002-03-01","precision":"month","end_date":null,"type":"point","layer":"流通と技術","title":"💽 エイベックス、国内初のコピーコントロールCDを発売","summary":"エイベックスが、PCでの複製を防ぐ国内初のコピーコントロールCD（CCCD）を発売しました。CD-Rとファイル交換ソフトによる複製への防衛策でしたが、規格外ディスクの再生トラブルと音質への不満でリスナーの反発を招き、数年で各社が撤退します。\n\n同時期には違法コピー対策の議論も本格化していました。技術で流通を縛る路線から配信で稼ぐ路線へ、転換を促す反面教師になった出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: コピーコントロールCD","url":"https://ja.wikipedia.org/wiki/%E3%82%B3%E3%83%94%E3%83%BC%E3%82%B3%E3%83%B3%E3%83%88%E3%83%AD%E3%83%BC%E3%83%ABCD"}]},{"date":"2002-12-01","precision":"month","end_date":null,"type":"point","layer":"流通と技術","title":"📱 auが「着うた」サービスを開始","summary":"auが、携帯電話で楽曲の一部を着信音として買える「着うた」サービスを開始。日本独自の音楽配信市場が、携帯電話の上で立ち上がりました。\n\nPC向け配信が広がる前に、**携帯キャリアの課金基盤に乗った配信が先に成立した**のが日本らしいところです。2004年の「着うたフル」で1曲丸ごと買えるようになり、2000年代後半には有料配信売上の大半を占めました。産業レイヤーでは、CDの縮小を配信が一部補う構図が生まれます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 着うた","url":"https://ja.wikipedia.org/wiki/%E7%9D%80%E3%81%86%E3%81%9F"}]},{"date":"2002-12-01","precision":"month","end_date":"2016-12-31","type":"period","layer":"流通と技術","title":"🎵 着うた時代：携帯電話が音楽配信の主戦場","summary":"着うた・着うたフルが有料配信の中心だった期間です。ガラケーの課金基盤とキャリア主導の流通が、iTunesのようなPC中心のモデルとは別の道を作りました。\n\n「サビが着うたで売れる曲」が意識されたのもこの頃。配信売上は2008〜2009年頃に一度ピークを迎えます。iPhone以降は主導権がアプリ事業者に移り、スマートフォンの普及とともに縮小して、2010年代半ばに役割を終えました。","detail":null,"credibility":"unverified","credibility_note":"終わりの時期は主要キャリアのサービス終了時期からざっくり置いたもので、正確な終了日は事業者・サービス名によって異なります。","sources":[{"title":"Wikipedia: 着うた","url":"https://ja.wikipedia.org/wiki/%E7%9D%80%E3%81%86%E3%81%9F"},{"title":"日本レコード協会: 有料音楽配信売上実績","url":"https://www.riaj.or.jp/g/data/annual/dg_m.html"}]},{"date":"2005-01-01","precision":"day","end_date":null,"type":"point","layer":"産業と制度","title":"📦 改正著作権法施行、「還流防止措置（レコード輸入権）」導入","summary":"海外向けに安く作られた邦楽CDの逆輸入を止める「還流防止措置（レコード輸入権）」を導入した改正著作権法が施行されました。アジア市場向けの廉価盤が日本に還流するのを防ぐ狙いで、洋楽輸入盤への影響を心配する反対運動も起きています。\n\n再販売価格維持制度と並んで、CDの価格を守る制度が整った時期です。でも同じ年の8月にはiTunes Music Storeが日本で始まっていて、流通と技術は価格統制の外側で動き始めていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文化庁: 著作権法の一部を改正する法律（平成16年法律第92号）概要","url":null},{"title":"Wikipedia: 音楽レコードの還流防止措置","url":null}]},{"date":"2007-08-31","precision":"day","end_date":null,"type":"point","layer":"流通と技術","title":"🎶 歌声合成ソフト「初音ミク」発売","summary":"クリプトン・フューチャー・メディアがVOCALOID製品「初音ミク」を発売。想定を超える売れ行きで、前年に始まったニコニコ動画を舞台に個人制作の楽曲文化が広がり、関連曲の投稿が急増しました。\n\n**レーベルを通さずに曲が公開されて評価される回路**がここで生まれ、この場から出てきた作り手が2010年代後半以降のヒットを担っていきます。CD売上減が続く中で、「発表の場」が先に変わった例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"クリプトン・フューチャー・メディア: 初音ミク公式サイト","url":"https://ec.crypton.co.jp/pages/prod/virtualsinger/cv01"},{"title":"Wikipedia: 初音ミク","url":"https://ja.wikipedia.org/wiki/%E5%88%9D%E9%9F%B3%E3%83%9F%E3%82%AF"}]},{"date":"2010-10-27","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"🤝 AKB48「Beginner」発売、初週ミリオンを記録","summary":"AKB48「Beginner」がオリコン週間で初週100万枚超を記録。握手券や投票券を同梱した特典付きCDの大量購入を前提にした売り方が、シングル市場を支えていました。\n\nこの手法は**CDを「音楽を聴くための媒体」から「体験と権利のチケット」へ**変えたと言えます。シングルの枚数は回復して見える一方、実際の聴取は配信と動画へ。指標としてのCD売上と実態のズレが広がった時期で、音楽性の評価とは別の議論も呼びました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Beginner (AKB48の曲)","url":"https://ja.wikipedia.org/wiki/Beginner_(AKB48%E3%81%AE%E6%9B%B2)"}]},{"date":"2012-10-01","precision":"day","end_date":null,"type":"point","layer":"産業と制度","title":"⚖️ 改正著作権法施行、違法ダウンロードに刑事罰","summary":"違法にアップロードされた音楽・映像と知りつつダウンロードする行為に、刑事罰を導入する改正著作権法が施行されました。業界団体の要望を受けた立法で、CD・配信の縮小を違法流通の問題として捉える発想です。\n\nでも同じ頃、YouTubeとスマートフォンが標準になっていて、翌年以降のストリーミング解禁で「無料で聴ける合法の場」を作る方向へ、産業の戦略は転換していきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文化庁: 平成24年通常国会 著作権法改正について","url":"https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/h24_hokaisei/"}]},{"date":"2015-05-27","precision":"day","end_date":null,"type":"point","layer":"流通と技術","title":"🎧 AWA・LINE MUSICが開始、国内で定額制配信が本格化","summary":"AWA（5月27日）、LINE MUSIC（6月11日）が相次いでスタートし、7月にはApple Musicも日本上陸。定額聴き放題が国内でも選択肢になった年で、月額1,000円前後という相場もここで決まりました。\n\nただ最初は主要邦楽アーティストの曲がなかなか揃わず、「あの曲がない」を体験した人も多いはず。CD売上と配信収益のバランスをめぐってレーベル各社の判断は分かれ、以後は再生回数がヒットの指標として意識され始めます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: AWA (音楽配信サービス)","url":null},{"title":"Wikipedia: LINE MUSIC","url":"https://ja.wikipedia.org/wiki/LINE_MUSIC"}]},{"date":"2016-09-29","precision":"day","end_date":null,"type":"point","layer":"流通と技術","title":"🌏 Spotifyが日本でサービス開始","summary":"世界最大手の定額制配信Spotifyが、欧米から約8年遅れでついに日本上陸!無料プランを含むフリーミアムモデルが国内でも提供されました。\n\n無料プランの是非をめぐって業界では議論もありましたが、以後数年で主要レーベルの楽曲提供が進みます。2018年の「Lemon」以降は配信起点のロングヒットが標準になり、CD初動偏重のチャートから複合指標へ移る流れを後押ししました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Spotify","url":"https://ja.wikipedia.org/wiki/Spotify"}]},{"date":"2018-03-14","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"🍋 米津玄師「Lemon」発売、配信時代のロングヒットの原型に","summary":"米津玄師「Lemon」がドラマ主題歌として発売され、Billboard JAPAN Hot 100で2018年・2019年と2年連続の年間1位に。\n\nボーカロイド出身の作り手が、テレビ主題歌という90年代型タイアップと、動画・配信という2010年代型の流通を両立させた曲です。**CD初週ではなく数年単位の積み重ねで評価される「ロングヒット」**の代表例で、産業レイヤーではストリーミング認定制度の導入につながる状況を作りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Lemon (米津玄師の曲)","url":"https://ja.wikipedia.org/wiki/Lemon_(%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB%E3%81%AE%E6%9B%B2)"},{"title":"Billboard JAPAN: 年間チャート","url":null}]},{"date":"2019-12-15","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"🌃 YOASOBI「夜に駆ける」配信開始、翌年の年間チャート1位に","summary":"YOASOBIが小説原作の「夜に駆ける」を配信開始。CDを出さない配信専門のデビューで、Billboard JAPAN Hot 100の2020年年間1位を獲得しました!ボーカロイド出身の作曲者による、動画とストリーミングだけで到達したヒットです。\n\nCDが売上指標から外れても頂点に立てることを見せた曲で、2020年のストリーミング認定制度の導入とも歩調が合います。作られ方（原作小説）と届き方（配信）の両方が新しい、異例のデビュー曲でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 夜に駆ける","url":"https://ja.wikipedia.org/wiki/%E5%A4%9C%E3%81%AB%E9%A7%86%E3%81%91%E3%82%8B"}]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"産業と制度","title":"📊 日本レコード協会がストリーミング認定制度を開始","summary":"日本レコード協会が、累計再生回数に基づくゴールド（5,000万回）などのストリーミング認定をスタート。業界団体がCD枚数と並ぶ評価軸として再生回数を公認した転換点で、**「売上枚数」に代わる公式のものさし**が生まれました。\n\n同じ年、有料音楽配信売上に占めるストリーミングの割合は大半に。コロナ禍でライブ収入が途絶える中、配信が産業の中心であることが数字でもはっきりした年です。","detail":null,"credibility":"unverified","credibility_note":"認定基準の閾値と開始月は協会発表に基づきますが、初回認定の対象作品や制度の細かいところは要確認です。","sources":[{"title":"日本レコード協会: ストリーミング認定","url":"https://www.riaj.or.jp/f/data/cert/streaming.html"}]},{"date":"2023-04-12","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"✨ YOASOBI「アイドル」、日本語曲初のBillboard世界チャート1位","summary":"YOASOBI「アイドル」がアニメ主題歌として配信され、同年6月にBillboard Global Excl. U.S.で日本語楽曲として初めて1位を獲得しました!\n\nアニメという映像コンテンツの世界流通と、国境のない配信プラットフォームが結びついた結果です。CD時代には物理流通の壁で難しかった海外チャート上位が、流通と技術の変化で現実になりました。翌年にはCreepy Nuts「Bling-Bang-Bang-Born」も同チャート1位となり、単発では終わらない流れになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: アイドル (YOASOBIの曲)","url":"https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%A4%E3%83%89%E3%83%AB_(YOASOBI%E3%81%AE%E6%9B%B2)"},{"title":"Billboard: Global Excl. U.S. chart","url":null}]},{"date":"2024-01-07","precision":"day","end_date":null,"type":"point","layer":"作品とアーティスト","title":"💃 Creepy Nuts「Bling-Bang-Bang-Born」世界1位","summary":"Creepy Nuts「Bling-Bang-Bang-Born」がアニメ主題歌として配信され、ダンス動画の拡散を経てBillboard Global Excl. U.S.で1位に。TikTokなどショート動画での二次創作が再生回数を押し上げる回路が、すっかり定着した例です。\n\n曲はアニメと一体で届き、プラットフォームのアルゴリズムがヒットの通り道になりました。30年前のドラマ主題歌タイアップと構造は似ているのに、**媒体はテレビから動画アプリへ、指標は枚数から再生回数へ**置き換わっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bling-Bang-Bang-Born","url":"https://ja.wikipedia.org/wiki/Bling-Bang-Bang-Born"}]}]},{"slug":"culture-kpop-global","title":"🎤 K-POPグローバル化","description":"ソウルの練習生システムからビルボード制覇、育成システムの輸出まで。音楽と作品・産業とシステム・ファンダムとメディアの3層で、K-POPが世界標準の生産方式になっていく30年を、ファン目線で追いかけます 🌟","category":"culture","language":"ja","start_year":1992,"end_year":2024,"layers":[{"name":"音楽と作品","color":"pink"},{"name":"産業とシステム","color":"orange"},{"name":"ファンダムとメディア","color":"blue"}],"events":[{"date":"1992-04-11","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"🎬 ソ・テジワ・アイドルズがデビュー","summary":"3人組ソ・テジワ・アイドルズが、MBCの新人番組で「ナン・アラヨ」を披露してデビュー。審査員の評価は低かったと伝えられますが、楽曲は韓国のチャートを長期間支配し、ラップとダンスを韓国歌謡のど真ん中に持ち込みました。\n\n10代市場の大きさを見せつけた世代交代の事件で、K-POP史の起点として一番よく引かれる場面です。この成功が、才能の出現を待たずにスターを設計して生産する事務所システムの構想を生みました。","detail":null,"credibility":"disputed","credibility_note":"デビュー番組で審査員から最低点を付けられたという逸話は有名ですが、番組の演出や採点の詳細には諸説あります。","sources":[{"title":"Wikipedia: Seo Taiji and Boys","url":"https://en.wikipedia.org/wiki/Seo_Taiji_and_Boys"}]},{"date":"1995-01-01","precision":"year","end_date":null,"type":"point","layer":"産業とシステム","title":"🏢 SMエンターテインメント設立","summary":"歌手出身のプロデューサー、イ・スマンがSMエンターテインメントを設立。オーディションで原石を見つけて、歌唱・ダンスから語学まで数年がかりで鍛えて送り出す**練習生システム**を体系化しました。\n\n音楽制作・育成・マネジメントを丸ごと抱える韓国型事務所の原型です。YG、JYPが続いて「三大事務所」体制が生まれ、K-POPを再現可能な生産方式に変えた出発点になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: SM Entertainment","url":"https://en.wikipedia.org/wiki/SM_Entertainment"}]},{"date":"1996-09-07","precision":"day","end_date":null,"type":"point","layer":"産業とシステム","title":"H.O.T.デビュー、企画型アイドルの原型","summary":"⭐ SMの5人組H.O.T.がデビュー。コンセプト設計から衣装、ファンクラブ運営まで事務所が一体で設計する「企画型アイドル」の最初の大成功例で、第1世代アイドルの時代を開きました。\n\n人気は中国・台湾へ広がり、のちに「韓流」という言葉を生みます。国内ヒットの延長ではなく、最初から輸出を前提に設計されたK-POPの原型が、ここで完成しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: H.O.T.","url":"https://en.wikipedia.org/wiki/H.O.T."}]},{"date":"1999-02-08","precision":"day","end_date":null,"type":"point","layer":"産業とシステム","title":"📜 韓国で文化産業振興基本法が制定","summary":"通貨危機後の韓国で、金大中政権が文化産業振興基本法を制定。コンテンツを輸出産業として育てる国家方針が法制化され、専門の振興機関と支援予算の整備が進みました。\n\n「支援はしても介入はしない」と要約される文化政策の下で、K-POPの海外展開は制度の後ろ盾を得ます。国家戦略としての大衆文化輸出という構図は、この年表全体の底に流れているテーマです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"韓国「文化産業振興基本法」(1999年制定)","url":null}]},{"date":"2000-02-01","precision":"month","end_date":null,"type":"point","layer":"ファンダムとメディア","title":"🇨🇳 H.O.T.北京公演、「韓流」が流行語に","summary":"H.O.T.が北京の工人体育館で単独公演を行いました。中国メディアが韓国大衆文化のブームを「韓流」と呼ぶ用法はこの前後に定着したとされ、公演はその象徴的な出来事になります。\n\nK-POP最初の海外ファンダムは、欧米ではなくアジアで生まれました。ビルボード制覇の物語で語られがちなK-POP史ですが、**アジア市場が先にあった**ことを教えてくれる出来事です。","detail":null,"credibility":"disputed","credibility_note":"「韓流」の語の初出は1990年代末の中国・台湾メディアとされますが、正確な初出の時期・媒体には諸説あります。","sources":[{"title":"Wikipedia: Korean wave","url":"https://en.wikipedia.org/wiki/Korean_wave"}]},{"date":"2002-03-13","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"🎤 BoAが韓国人初のオリコンアルバム1位","summary":"SM所属のBoAが日本語アルバム「LISTEN TO MY HEART」で、韓国人歌手として初めてオリコン週間アルバムチャート1位を獲得!日本語の習得まで含めた、徹底した現地対応の成果でした。\n\n現地語で歌って現地のテレビに出る「完全ローカライズ戦略」の成功例で、東方神起らも同じ道をたどります。のちのBTSが韓国語のままビルボードを制する戦略と見比べると、K-POP輸出の第1段階を象徴する存在です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: BoA","url":"https://en.wikipedia.org/wiki/BoA"}]},{"date":"2012-07-15","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"🐎 PSY「江南スタイル」公開","summary":"PSYの「江南スタイル」がYouTubeで公開。コミカルな騎馬ダンスとともに世界中に広がり、米ビルボードHot 100で7週連続2位を記録、各国のチャートを席巻しました。\n\n事務所の緻密な輸出戦略ではなく、**プラットフォーム上の偶然の拡散**が生んだ世界的ヒットです。YouTubeこそK-POPの主戦場だという認識を全事務所に植え付け、以後のMV重視戦略を決定づけました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gangnam Style","url":"https://en.wikipedia.org/wiki/Gangnam_Style"}]},{"date":"2012-10-13","precision":"day","end_date":null,"type":"point","layer":"ファンダムとメディア","title":"🎪 第1回KCONを米カリフォルニアで開催","summary":"CJグループが、K-POPと韓国文化の総合イベントKCONを米カリフォルニア州アーバインで初開催。コンサートに美容・食・ドラマの体験ブースを併設して、約1万人を集めたと発表されました。\n\n音楽を入口に韓国製品全体へ関心を広げる「ファンダムの見本市」です。文化輸出を消費財輸出につなげる国家戦略を、民間の興行として形にした装置とも言えます。以後、世界各都市で定例化しました。","detail":null,"credibility":"unverified","credibility_note":"観客数（約1万人）は主催者発表に基づく数字で、第三者による検証はありません。","sources":[{"title":"Wikipedia: KCON (music festival)","url":"https://en.wikipedia.org/wiki/KCON_(music_festival)"}]},{"date":"2012-12-21","precision":"day","end_date":null,"type":"point","layer":"ファンダムとメディア","title":"📈 「江南スタイル」がYouTube初の10億回再生","summary":"「江南スタイル」のミュージックビデオが、YouTube史上初の再生回数10億回に到達。7月の公開から半年足らずでの記録でした。\n\n再生回数という、誰にでも見える「世界ヒットのものさし」を定着させた出来事です。以後、K-POP各社はMV公開初動の再生数を競うようになり、ファンダムによる組織的な再生・投票の文化（いわゆる総攻）が育っていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gangnam Style","url":"https://en.wikipedia.org/wiki/Gangnam_Style"}]},{"date":"2013-06-13","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"🌱 防弾少年団(BTS)デビュー","summary":"Big Hitエンターテインメントから7人組の防弾少年団(BTS)がデビュー。大手3社の外にある中小事務所の出身で、当初は国内での注目度も限られていました。\n\nメンバー自身が制作に関わる楽曲と、SNSでの日常的な発信を武器に、テレビ中心の勝ち筋とは別ルートで支持を積み上げていきます。ファンダムとメディアの構造変化を一番体現するグループの、これが出発点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: BTS","url":"https://en.wikipedia.org/wiki/BTS"}]},{"date":"2016-08-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"産業とシステム","title":"🚧 中国の「限韓令」で最大市場が閉ざされる","summary":"在韓米軍のTHAAD配備決定への報復として、中国で韓国コンテンツの放送や公演が事実上制限されたとされます。K-POP公演の許可が下りなくなり、最大級の成長市場が突然閉ざされました。\n\n各社は日本・東南アジア・欧米へ軸足を移して、市場リスクの分散を迫られます。結果として特定市場に依存しない世界展開が加速したと評価される、地政学がエンタメ産業の形を変えた代表例です。","detail":null,"credibility":"disputed","credibility_note":"中国政府は「限韓令」の存在を公式に認めておらず、開始時期・対象範囲・解除の経緯はいずれも報道に基づく推定です。","sources":[{"title":"Reuters等報道: 中国のTHAAD報復と韓流コンテンツ制限(2016年〜)","url":null}]},{"date":"2017-05-21","precision":"day","end_date":null,"type":"point","layer":"ファンダムとメディア","title":"🏆 BTSがビルボード・ミュージック・アワード受賞","summary":"BTSが米ビルボード・ミュージック・アワードのトップ・ソーシャル・アーティスト部門で受賞。同部門で6年連続受賞中だったジャスティン・ビーバーを、世界のファン投票で破っての受賞でした!\n\nARMYと呼ばれる**組織化されたグローバルファンダムの動員力**が、米国音楽産業の表舞台で数字として見えた瞬間です。以後、米メディアのK-POP報道が本格化し、翌年のアルバム1位への流れを作りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Billboard: BTS Wins Top Social Artist at the 2017 Billboard Music Awards","url":null}]},{"date":"2018-05-27","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"👑 BTSのアルバムが米ビルボード200で1位","summary":"BTSのアルバム「LOVE YOURSELF 転 'Tear'」が、韓国のアーティストとして初めて米ビルボード200で1位に!収録曲はほぼ全編が韓国語です。\n\n英語で歌うことが世界進出の条件だった時代の終わりを告げました。BoAに代表される完全ローカライズ戦略とは対照的な、**韓国語のまま世界へ**というモデルの確立です。歌詞の翻訳は、ファンダムが自発的に担いました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Love Yourself: Tear","url":"https://en.wikipedia.org/wiki/Love_Yourself:_Tear"}]},{"date":"2019-06-01","precision":"month","end_date":null,"type":"point","layer":"ファンダムとメディア","title":"📲 Weverse開始、ファンダムを自前で組織化","summary":"Big Hit系列のbeNXが、ファンコミュニティアプリWeverseの運用を開始。アーティストの投稿、有料コンテンツ配信、グッズ販売、ファン投稿の多言語翻訳までを一つのアプリにまとめました。\n\nSNSと放送局に頼っていたファンとの接点を、事務所が自前のプラットフォームとして持つ転換です。ファンダムのデータと収益を内部化するこの動きは、他社にも一気に広がりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Weverse","url":"https://en.wikipedia.org/wiki/Weverse"}]},{"date":"2020-06-14","precision":"day","end_date":null,"type":"point","layer":"ファンダムとメディア","title":"💜 オンライン公演「BANG BANG CON The Live」","summary":"コロナ禍でワールドツアーが中止になる中、BTSが有料オンライン公演「BANG BANG CON The Live」を開催。107の国と地域から約75万人が同時視聴したと発表されました。\n\n会場の収容人数という物理的な限界を超える興行モデルの実証になり、各社が有料オンライン公演やハイブリッド興行を常設化します。パンデミックがファンダムとメディアの関係を作り替えた、代表的な出来事です。","detail":null,"credibility":"unverified","credibility_note":"同時視聴者数（約75万人）は主催者発表で、第三者による検証はありません。","sources":[{"title":"Big Hit Entertainment発表: BANG BANG CON The Live 視聴者数(2020-06)","url":null}]},{"date":"2020-08-21","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"🧨 「Dynamite」が米Hot 100で1位","summary":"BTSが初の全編英語曲「Dynamite」を発表し、米ビルボードHot 100で韓国アーティストとして初めての1位を獲得!ディスコ調の明るい一曲でした。\n\n韓国語のままビルボード200を制した後の、あえての英語曲による頂点獲得です。コロナ禍で停滞する音楽市場での戦略も奏功して、オンライン公演とともにパンデミック期のK-POPを象徴しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Dynamite (BTS song)","url":"https://en.wikipedia.org/wiki/Dynamite_(BTS_song)"}]},{"date":"2020-10-15","precision":"day","end_date":null,"type":"point","layer":"産業とシステム","title":"💹 Big Hit(現HYBE)がKOSPI上場","summary":"BTSの所属事務所Big Hitエンターテインメントが韓国取引所に上場。時価総額は初日に一時8兆ウォン台に達し、既存エンタメ大手3社の合計を上回る規模と報じられました。\n\n翌年HYBEに社名を変え、米イサカ・ホールディングス買収などで総合エンタメ企業化を進めます。アイドル事務所が資本市場の主要プレイヤーになり、K-POPの生産方式そのものが投資対象になった段階です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hybe Corporation","url":"https://en.wikipedia.org/wiki/Hybe_Corporation"}]},{"date":"2023-04-15","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"🌴 BLACKPINKがコーチェラのヘッドライナーに","summary":"BLACKPINKが米コーチェラ・フェスティバルで、K-POPアーティストとして初めてヘッドライナーを務めました。2019年の同フェス出演から、4年での主役化です。\n\n欧米の大型フェス市場で興行の主役を張れることを示し、ガールグループが世界ツアー市場の主力になったことを印象づけます。ストリーミングとSNSで育った人気が、伝統的な興行の序列を塗り替えた形です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Blackpink","url":"https://en.wikipedia.org/wiki/Blackpink"}]},{"date":"2023-09-01","precision":"month","end_date":null,"type":"point","layer":"産業とシステム","title":"🌐 HYBEとゲフィンが米国発グループを育成","summary":"HYBEと米ゲフィン・レコードの合弁が、世界中から候補者を集めたオーディション企画「The Debut: Dream Academy」を実施。ここから翌年、多国籍6人組KATSEYEが米国を拠点にデビューします。\n\n韓国人グループの輸出ではなく、練習生制度という**育成システムそのものの輸出**への転換です。K-POPが国籍や言語を離れた「方法論」として扱われる段階に入ったことを象徴しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Katseye","url":"https://en.wikipedia.org/wiki/Katseye"}]},{"date":"2024-10-18","precision":"day","end_date":null,"type":"point","layer":"音楽と作品","title":"🍷 ロゼ「APT.」が世界的ヒット","summary":"BLACKPINKのロゼが、ブルーノ・マーズとのデュエット曲「APT.」を発表。韓国の飲み会の遊び「アパート」を織り込んだ曲は各国のチャートで1位となり、米ビルボードGlobal 200でも首位を獲得しました。\n\nグループ活動と並行したソロでのグローバルヒットで、K-POPアイドルが個人として世界のポップ市場に立つ段階を示しました。米国のスーパースターとの対等な共作という形も、産業の成熟を物語っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: APT. (Rosé and Bruno Mars song)","url":null}]}]},{"slug":"culture-literary-awards","title":"文学賞の系譜","description":"ノーベル賞から芥川賞・本屋大賞まで。賞という制度、作家と作品、読者と市場の3層を重ね、文学賞が文学をどう動かし、時に文学が賞の外で動いたかをたどる年表。","category":"culture","language":"ja","start_year":1901,"end_year":2024,"layers":[{"name":"賞の制度","color":"gold"},{"name":"作家と作品","color":"blue"},{"name":"読者と市場","color":"pink"}],"events":[{"date":"1901-12-10","precision":"day","end_date":null,"type":"point","layer":"賞の制度","title":"第1回ノーベル文学賞授与","summary":"アルフレッド・ノーベルの遺言に基づく第1回ノーベル文学賞が、フランスの詩人シュリ・プリュドムに授与された。遺言にある「理想的な方向」という選考基準の解釈は、以後1世紀にわたり論争の種であり続ける。\n\n国境を越えて作家に権威を与える最初の仕組みであり、以後の各国の文学賞の参照点となった。**賞が文学の世界地図を描く時代**の始まりである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Literature 1901","url":"https://www.nobelprize.org/prizes/literature/1901/summary/"}]},{"date":"1935-01-01","precision":"year","end_date":null,"type":"point","layer":"賞の制度","title":"菊池寛が芥川賞・直木賞を創設","summary":"菊池寛が友人の芥川龍之介と直木三十五を記念し、文藝春秋社を母体に芥川賞・直木賞を創設した。純文学の新人に贈る芥川賞と大衆文芸の直木賞という二本立ては、日本の文学地図を長く規定することになる。\n\n**出版社が賞を作り、賞が雑誌を売る**という構図の原型であり、選考会と受賞発表は出版ジャーナリズムの行事として定着していく。この構造は約70年後の綿矢・金原同時受賞(読者と市場レイヤー)で頂点に達する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本文学振興会: 芥川龍之介賞・直木三十五賞","url":null},{"title":"Wikipedia: 芥川龍之介賞","url":"https://ja.wikipedia.org/wiki/芥川龍之介賞"}]},{"date":"1945-01-01","precision":"year","end_date":"1948-12-31","type":"period","layer":"賞の制度","title":"芥川賞・直木賞の中断","summary":"戦局の悪化と敗戦後の混乱により、芥川賞・直木賞は1945年から1948年まで中断された。用紙の統制など、出版そのものが困難な時期だった。\n\n1949年の再開後、賞は戦後文壇の登竜門として権威を強めていく。一方でこの空白期に太宰治や坂口安吾ら無頼派が読者の熱狂的な支持で台頭したことは、賞の制度と文学の動きが必ずしも一致しないことを示す例でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 芥川龍之介賞","url":"https://ja.wikipedia.org/wiki/芥川龍之介賞"}]},{"date":"1956-01-01","precision":"month","end_date":null,"type":"point","layer":"作家と作品","title":"石原慎太郎「太陽の季節」が芥川賞受賞","summary":"一橋大学在学中の石原慎太郎が「太陽の季節」で第34回芥川賞を受賞した。既成のモラルへの挑発を含む作品は選考会でも賛否が割れ、受賞自体が事件として報じられた。\n\n受賞を機に単行本はベストセラーとなり、同年の映画化を経て「太陽族」という流行現象(読者と市場レイヤー)を生む。受賞がメディアイベントになった最初期の例とされ、以後の芥川賞報道の原型となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 太陽の季節","url":"https://ja.wikipedia.org/wiki/太陽の季節"}]},{"date":"1956-05-01","precision":"month","end_date":null,"type":"point","layer":"読者と市場","title":"「太陽族」ブームが社会現象に","summary":"「太陽の季節」の映画公開を機に、無軌道な若者風俗を指す「太陽族」という語が流行し、若者の模倣を懸念する映画への批判運動も起きた。\n\n芥川賞(賞の制度レイヤー)が生んだ作品が、文学の枠を超えて風俗現象となった事例である。ただし「太陽族」の語の起源や現象の実際の規模には諸説があり、メディアが作り上げた流行という側面も指摘されている。","detail":null,"credibility":"disputed","credibility_note":"「太陽族」という語の起源(大宅壮一の命名とする説など)や、若者風俗としての実態・規模については諸説ある。","sources":[{"title":"Wikipedia: 太陽族","url":"https://ja.wikipedia.org/wiki/太陽族"}]},{"date":"1968-10-17","precision":"day","end_date":null,"type":"point","layer":"作家と作品","title":"川端康成が日本人初のノーベル文学賞","summary":"川端康成が日本人として初めてノーベル文学賞を受賞した。授賞理由は「日本人の心の精髄を、すぐれた感受性をもって表現した」ことだった。\n\n戦後日本の国際復帰を象徴する文化的事件として報じられ、記念講演「美しい日本の私」も広く読まれた。サイデンステッカーら翻訳者の貢献が強調されるなど、翻訳が賞の前提になるという世界文学の構造も可視化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Literature 1968","url":"https://www.nobelprize.org/prizes/literature/1968/summary/"}]},{"date":"1969-01-01","precision":"year","end_date":null,"type":"point","layer":"賞の制度","title":"英国でブッカー賞創設","summary":"英国で英連邦の作家を対象とする長編小説の賞、ブッカー賞が創設され、第1回はP・H・ニュービーの「Something to Answer For」が受賞した。\n\n後に候補作の段階的発表や賭け率の報道まで含めた「レース」の演出で部数を動かす賞となり、賞を出版マーケティングの中核に据える英国型モデルを確立する。2005年には国際版も設けられ、翻訳文学の市場(読者と市場レイヤー)を世界的に広げた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Booker Prizes: 賞の沿革","url":null},{"title":"Wikipedia: Booker Prize","url":"https://en.wikipedia.org/wiki/Booker_Prize"}]},{"date":"1976-07-01","precision":"month","end_date":null,"type":"point","layer":"作家と作品","title":"村上龍「限りなく透明に近いブルー」受賞","summary":"群像新人文学賞を受けた村上龍「限りなく透明に近いブルー」が第75回芥川賞を受賞した。米軍基地の町を舞台にした感覚的な文体は選考でも読者の間でも賛否を呼んだ。\n\n単行本は刊行後まもなくミリオンセラーになったとされ、芥川賞受賞作の商業的な破壊力を再認識させた。20年前の石原慎太郎と並び、若い書き手のスキャンダラスな登場を賞が増幅する構図の典型例となった。","detail":null,"credibility":"unverified","credibility_note":"「ミリオンセラー」とされる部数は出版社の公称に基づくもので、実売部数の第三者による検証はない。","sources":[{"title":"Wikipedia: 限りなく透明に近いブルー","url":"https://ja.wikipedia.org/wiki/限りなく透明に近いブルー"}]},{"date":"1987-09-01","precision":"month","end_date":null,"type":"point","layer":"読者と市場","title":"「ノルウェイの森」が記録的ベストセラー","summary":"村上春樹の長編「ノルウェイの森」が講談社から刊行され、上下巻あわせて数百万部と伝えられる記録的なベストセラーとなった。\n\n村上は芥川賞を受賞しないまま国内最大の作家となり、後年は毎年ノーベル賞報道の的となる。**賞の外側で文学市場が動く**ことを示した代表例であり、賞の制度レイヤーの権威と市場の論理の乖離を象徴する存在であり続けている。","detail":null,"credibility":"disputed","credibility_note":"累計部数は集計時点や上下巻の合算方法により400万部超などと幅があり、確定した数値はない。","sources":[{"title":"Wikipedia: ノルウェイの森","url":"https://ja.wikipedia.org/wiki/ノルウェイの森"}]},{"date":"1994-10-13","precision":"day","end_date":null,"type":"point","layer":"作家と作品","title":"大江健三郎がノーベル文学賞受賞","summary":"大江健三郎が日本人として2人目のノーベル文学賞を受賞した。授賞理由では、詩的な言語によって現実と神話の混交する世界を作り出したことが挙げられた。\n\n受賞直後に文化勲章を辞退し、賞と国家の距離について議論を呼んだ。川端康成の受賞から26年、日本文学の国際的評価の軸が「美しい日本」の美学から戦後民主主義の文学へと移ったことを示す出来事でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Literature 1994","url":"https://www.nobelprize.org/prizes/literature/1994/summary/"}]},{"date":"2004-01-01","precision":"month","end_date":null,"type":"point","layer":"作家と作品","title":"綿矢りさ・金原ひとみが最年少で同時受賞","summary":"第130回芥川賞を19歳の綿矢りさ「蹴りたい背中」と20歳の金原ひとみ「蛇にピアス」が同時受賞し、史上最年少記録を更新した。若い女性作家2人の受賞は文芸の枠を超えて報道された。\n\n受賞作を掲載した「文藝春秋」は異例の売れ行き(読者と市場レイヤー)となり、賞が若さと話題性を増幅する装置として機能した平成期の頂点といえる。純文学の読者層を一時的に大きく広げた出来事でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 芥川龍之介賞","url":"https://ja.wikipedia.org/wiki/芥川龍之介賞"}]},{"date":"2004-02-01","precision":"month","end_date":null,"type":"point","layer":"読者と市場","title":"受賞作掲載の「文藝春秋」が100万部超","summary":"綿矢りさ・金原ひとみの受賞作を全文掲載した「文藝春秋」2004年3月号が発売され、同誌として過去最大級となる100万部を超える発行部数に達したと発表された。\n\n総合月刊誌が受賞作掲載号で100万部を超えるのは異例であり、芥川賞というブランドの集客力を数字で示した。1935年の創設時に組み込まれた、賞が雑誌を売るという構図(賞の制度レイヤー)の約70年後の到達点である。","detail":null,"credibility":"disputed","credibility_note":"「100万部超」は発行元の発表に基づく発行・増刷部数であり、実売数の第三者による検証はない。","sources":[{"title":"文藝春秋2004年3月号(第130回芥川賞発表号)","url":null}]},{"date":"2004-04-01","precision":"month","end_date":null,"type":"point","layer":"賞の制度","title":"本屋大賞創設、第1回は「博士の愛した数式」","summary":"全国の書店員の投票だけで「いちばん売りたい本」を決める本屋大賞が創設され、第1回は小川洋子「博士の愛した数式」が受賞した。運営は書店員有志によるNPOが担う。\n\n作家や批評家による選考会という従来の権威への異議として生まれ、受賞作が確実に売れる賞として出版界での存在感を急速に高めた。**選ぶ権威が選考委員から売り場へ**移った、賞の歴史の転換点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"本屋大賞公式サイト","url":"https://www.hontai.or.jp/"}]},{"date":"2015-07-01","precision":"month","end_date":null,"type":"point","layer":"作家と作品","title":"又吉直樹「火花」が芥川賞受賞","summary":"お笑い芸人・又吉直樹の中編「火花」が第153回芥川賞を受賞した。純文学の新人賞を現役の芸人が受けたことは、テレビ・ネット・出版を横断する大きな話題となった。\n\n単行本は芥川賞受賞作として過去最大級の部数に達したと発表され、文芸書市場の縮小が続くなかで賞の集客力(読者と市場レイヤー)を改めて示した。テレビというメディアと文学賞の距離が最も縮まった事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 火花 (小説)","url":null}]},{"date":"2017-10-05","precision":"day","end_date":null,"type":"point","layer":"作家と作品","title":"カズオ・イシグロがノーベル文学賞受賞","summary":"長崎生まれの英国作家カズオ・イシグロがノーベル文学賞を受賞した。「日の名残り」「わたしを離さないで」で知られ、日本では「日系作家」の受賞として大きく報じられた。\n\n5歳で渡英し英語で書き続けた作家の受賞は、国籍や母語で文学を区分する視線の限界を示した。前年の音楽家ボブ・ディランへの授賞に続き、ノーベル賞自体が「文学」の境界を広げつつある時期の受賞でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Literature 2017","url":"https://www.nobelprize.org/prizes/literature/2017/summary/"}]},{"date":"2018-05-04","precision":"day","end_date":null,"type":"point","layer":"賞の制度","title":"ノーベル文学賞、2018年の発表見送り","summary":"選考主体のスウェーデン・アカデミーが、関係者を巡るスキャンダルと内部対立を受けて2018年のノーベル文学賞の発表見送りを決めた。授与の延期は1949年以来の事態と報じられた。\n\n**賞という制度そのものの信頼が問われた**出来事であり、選考体制の刷新を経て2019年に2年分がまとめて発表された。権威が人の組織である以上、賞もまた歴史の審判を受けることを示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Literature 2018","url":"https://www.nobelprize.org/prizes/literature/2018/summary/"}]},{"date":"2018-12-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"読者と市場","title":"「キム・ジヨン」邦訳とK文学ブーム","summary":"チョ・ナムジュ「82年生まれ、キム・ジヨン」の邦訳刊行を起点に、韓国文学の翻訳出版が日本で相次ぎ、「K文学ブーム」と呼ばれる状況が生まれた。\n\n書店の棚づくりとSNSの読者コミュニティが牽引した現象で、賞の制度レイヤーとは別の回路で翻訳文学の市場が動いた例である。2024年のハン・ガンのノーベル文学賞受賞は、日本ではこのブームの延長線上で受け止められた。","detail":null,"credibility":"unverified","credibility_note":"「ブーム」の起点・終点に明確な定義はなく、期間の区切りは便宜的なもの。市場規模を示す統一的な統計もない。","sources":[{"title":"筑摩書房: 82年生まれ、キム・ジヨン(日本語版)","url":null}]},{"date":"2024-10-10","precision":"day","end_date":null,"type":"point","layer":"作家と作品","title":"ハン・ガンがノーベル文学賞受賞","summary":"韓国の作家ハン・ガンがノーベル文学賞を受賞した。韓国初のノーベル文学賞であり、「菜食主義者」「少年が来る」など、歴史的な傷に向き合う詩的な散文が評価された。\n\n2016年の国際ブッカー賞(賞の制度レイヤー)が世界的評価の足場となっており、翻訳者との協働を含め**賞が賞を呼ぶ**現代の評価回路を体現する。日本ではK文学ブームで広がった読者層がこの受賞を迎えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Literature 2024","url":"https://www.nobelprize.org/prizes/literature/2024/summary/"}]}]},{"slug":"culture-photography","title":"写真表現の進化","description":"ダゲレオタイプからスマートフォン、AI画像まで。技術と機材、表現と作家、メディアと社会の3層を重ね、発明のたびに「写真とは何か」が問い直されてきた約200年を静かに俯瞰する年表です。","category":"culture","language":"ja","start_year":1826,"end_year":2023,"layers":[{"name":"技術と機材","color":"teal"},{"name":"表現と作家","color":"pink"},{"name":"メディアと社会","color":"gold"}],"events":[{"date":"1826-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と機材","title":"ニエプス、現存最古の写真を撮影","summary":"ニセフォール・ニエプスが、自宅の窓からの眺めを感光性アスファルトで定着させました。現存する最古の写真とされる「ル・グラの窓からの眺め」で、露光には数時間から数日を要したと考えられています。\n\n像を化学的に固定するという、写真の原理の最初の実証です。のちのダゲレオタイプは、ニエプスとダゲールの共同研究から生まれました。なお撮影年は1826年とも1827年ともされ、いまだ確定していません。","detail":null,"credibility":"disputed","credibility_note":"撮影年には1826年説と1827年説があり、所蔵機関・研究者によって表記が分かれます。","sources":[{"title":"Wikipedia: View from the Window at Le Gras","url":"https://en.wikipedia.org/wiki/View_from_the_Window_at_Le_Gras"}]},{"date":"1839-08-19","precision":"day","end_date":null,"type":"point","layer":"技術と機材","title":"ダゲレオタイプの製法が無償公開される","summary":"フランス政府がダゲレオタイプ(銀板写真)の発明を買い上げ、科学アカデミーと美術アカデミーの合同会議で製法を公開しました。写真の「公式な誕生日」とされる日です。\n\n**国家が発明を買い取り世界に開放した**ことで技術は数年で各国へ広がり、肖像写真館という最初の写真産業が生まれました。画家たちに衝撃を与え、絵画と写真の役割分担をめぐる長い議論も、ここから始まります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Daguerreotype","url":"https://en.wikipedia.org/wiki/Daguerreotype"}]},{"date":"1888-01-01","precision":"year","end_date":null,"type":"point","layer":"メディアと社会","title":"コダック第1号カメラ、撮影の大衆化","summary":"ジョージ・イーストマンが、ロールフィルム内蔵カメラ「コダック」を発売しました。「あなたはボタンを押すだけ、あとは当社がやります」という標語のとおり、現像・焼付はすべて工場が引き受けています。\n\n撮影を専門家の技術から日常の行為へと変えた転換点であり、スナップショットという言葉と家族アルバムの文化を生みました。**誰もが撮る側になる**大衆化の起点で、130年後のスマートフォンまで続く流れの源流です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kodak","url":"https://en.wikipedia.org/wiki/Kodak"}]},{"date":"1925-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と機材","title":"ライカI型発売、小型カメラの革命","summary":"独ライツ社が、35mm映画フィルムを流用した小型カメラ、ライカI型をライプツィヒの見本市で発表し、発売しました。上着のポケットに収まる精密機械です。\n\n三脚と大判機材からカメラを解放し、歩きながら撮るという身体性を写真にもたらしました。この機動力が街頭スナップと報道写真の美学(表現と作家レイヤー)を可能にし、のちの「決定的瞬間」の技術的な前提となっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Leica Camera","url":"https://en.wikipedia.org/wiki/Leica_Camera"}]},{"date":"1935-01-01","precision":"year","end_date":"1943-12-31","type":"period","layer":"表現と作家","title":"FSAの写真事業、記録が世論を動かす","summary":"米農業安全保障局(FSA)が、大恐慌下の農村の窮状を記録する写真事業を組織し、ドロシア・ラングやウォーカー・エヴァンズらが全国を撮影しました。ラングの「移民の母」(1936)はその象徴です。\n\n政府が写真家を雇い、写真で世論を動かすという、ドキュメンタリー写真の制度化の出発点となりました。写真はグラフ雑誌(メディアと社会レイヤー)と結びつき、社会を映す公共の記録という地位を確立していきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Library of Congress: FSA/OWI Photograph Collection","url":"https://www.loc.gov/pictures/collection/fsa/"}]},{"date":"1936-11-23","precision":"day","end_date":null,"type":"point","layer":"メディアと社会","title":"写真週刊誌LIFE創刊","summary":"ヘンリー・ルースが、写真週刊誌LIFEを創刊しました。写真を主役に据えた誌面は創刊号から売り切れが続き、グラフジャーナリズムの黄金時代を開いています。\n\n写真家に大量の仕事と巨大な観客を与え、複数の写真で物語を組み立てるフォトエッセイの形式を確立しました。マグナム(表現と作家レイヤー)の写真家たちの主要な発表の場でもあり、テレビが普及するまで、写真は世界の出来事を見るための窓であり続けました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Life (magazine)","url":"https://en.wikipedia.org/wiki/Life_(magazine)"}]},{"date":"1947-01-01","precision":"year","end_date":null,"type":"point","layer":"表現と作家","title":"マグナム・フォト設立","summary":"ロバート・キャパ、アンリ・カルティエ=ブレッソンらが、写真家の自主組織マグナム・フォトを設立しました。ネガの著作権を写真家自身が保持するという原則を打ち立てています。\n\n雑誌(メディアと社会レイヤー)が写真の扱いを決める時代に、**写真家が自分の写真の主導権を取り戻した**画期であり、報道写真家という職業の独立宣言でした。以後、世界の写真家集団のモデルとなっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Magnum Photos","url":"https://en.wikipedia.org/wiki/Magnum_Photos"}]},{"date":"1948-11-01","precision":"month","end_date":null,"type":"point","layer":"技術と機材","title":"ポラロイド、インスタントカメラ発売","summary":"エドウィン・ランドのポラロイド社が、撮影後その場で写真ができるランドカメラ95型を発売しました。ボストンの百貨店に並んだ初回分は、即日完売したと伝えられています。\n\n現像所を介さず、撮ることと見ることが一体になる体験は、写真をその場で見せ合う遊びへと変えました。撮ってすぐ共有したいという欲望は、インスタントカメラからデジタルカメラの背面液晶、そしてSNS(メディアと社会レイヤー)へと受け継がれていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Land Camera","url":"https://en.wikipedia.org/wiki/Land_Camera"}]},{"date":"1952-01-01","precision":"year","end_date":null,"type":"point","layer":"表現と作家","title":"カルティエ=ブレッソン「決定的瞬間」刊行","summary":"アンリ・カルティエ=ブレッソンの写真集「決定的瞬間」(原題 Images à la sauvette)が刊行されました。動き続ける現実のなかで構図と意味が一致する一瞬を捉える、という美学を提示しています。\n\n小型カメラ、ライカ(技術と機材レイヤー)の機動力を前提とした写真観であり、以後数十年にわたり、スナップと報道写真の規範となりました。後年には、その規範への反逆(プロヴォーク)を生む基準点ともなります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"アンリ・カルティエ=ブレッソン『決定的瞬間』(1952)","url":null}]},{"date":"1959-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と機材","title":"ニコンF発売、報道の標準機に","summary":"日本光学工業が、一眼レフカメラのニコンFを発売しました。堅牢なボディと豊富な交換レンズ群のシステム化により、報道や戦場の現場の標準機となっていきます。\n\nベトナム戦争(メディアと社会レイヤー)の報道写真の多くが日本製カメラで撮影され、カメラ産業の中心はドイツから日本へ移りました。機材の進化が「誰が、どこまで撮れるか」を規定することを示す例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Nikon F","url":"https://en.wikipedia.org/wiki/Nikon_F"}]},{"date":"1968-11-01","precision":"month","end_date":"1970-03-31","type":"period","layer":"表現と作家","title":"「プロヴォーク」、アレ・ブレ・ボケの反逆","summary":"中平卓馬、高梨豊、多木浩二らが季刊誌「プロヴォーク」を創刊し、第2号から森山大道が参加しました。「アレ・ブレ・ボケ」と呼ばれる荒れた画面で、既成の写真言語を否定しています。\n\n3号と総括の書籍を残して終わった短命の運動でしたが、写真は記録か表現かという問いを先鋭化させ、日本の写真が国際的に再評価される起点となりました。整った構図で意味を伝える報道写真の規範に対する、内部からの反逆でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"プロヴォーク(1968-1970、復刻版・研究文献)","url":null}]},{"date":"1972-06-08","precision":"day","end_date":null,"type":"point","layer":"メディアと社会","title":"「戦争の恐怖」、一枚の写真が世界を撃つ","summary":"ベトナム戦争で、ナパーム弾に焼かれて逃げる少女を捉えた写真「戦争の恐怖」がAP通信から世界へ配信され、翌年ピュリツァー賞を受けました。\n\n**一枚の写真が世論を動かす**という、フォトジャーナリズムの力の象徴とされてきた作品です。なお2025年には撮影者の同定をめぐって調査と論争が起き、World Press Photoは撮影者表記を保留しました。写真の記録性そのものが、半世紀を経て再審に付された事例でもあります。","detail":null,"credibility":"disputed","credibility_note":"従来ニック・ウトの撮影とされてきましたが、2025年に別人の撮影とする調査報道が出て、World Press Photoは撮影者表記を停止しました。AP通信は自社調査に基づき、クレジットを維持しています。","sources":[{"title":"Wikipedia: The Terror of War","url":null},{"title":"World Press Photo: 撮影者表記に関する声明(2025)","url":null}]},{"date":"1975-12-01","precision":"month","end_date":null,"type":"point","layer":"技術と機材","title":"コダック社内でデジタルカメラ試作機が完成","summary":"コダックの技術者スティーブン・サッソンが、CCDを使った自己完結型デジタルカメラの試作機を完成させました。重さ約3.6kg、記録媒体はカセットテープ、画像は白黒0.01メガピクセルでした。\n\n社内では「誰も紙の写真を捨てない」と冷遇されたと、本人はのちに回想しています。**フィルムの王者が自らデジタルを発明し、活かせなかった**この出来事は、37年後の同社の経営破綻と対で語られ、イノベーションのジレンマの代表例に挙げられます。","detail":null,"credibility":"unverified","credibility_note":"試作機の完成時期や社内での反応は、主に後年のサッソン本人の回想と1978年の特許記録に基づいており、当時の一次記録は乏しいものです。","sources":[{"title":"Wikipedia: Steven Sasson","url":"https://en.wikipedia.org/wiki/Steven_Sasson"}]},{"date":"1995-03-01","precision":"month","end_date":null,"type":"point","layer":"技術と機材","title":"カシオQV-10、液晶付きデジカメの登場","summary":"カシオが、液晶モニターを搭載したデジタルカメラQV-10を発売しました。撮った画像をその場で確認し、不要なら消して撮り直せる体験を、初めて大衆的な価格で提供しています。\n\nレンズ部が回転して自分に向けられる構造は、のちの自撮り文化(メディアと社会レイヤー)の先駆けとされます。フィルムを消費しない写真は撮影枚数の心理的な上限を取り払い、写真の総量が爆発する時代の入口となりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"カシオ計算機: QV-10(1995年発売)","url":null}]},{"date":"2000-11-01","precision":"month","end_date":null,"type":"point","layer":"技術と機材","title":"カメラ付き携帯J-SH04発売、写メール誕生","summary":"シャープ製のカメラ付き携帯電話J-SH04が、J-フォンから発売されました。11万画素のカメラを内蔵し、撮った写真をメールで送る「写メール」という言葉を生んでいます。\n\n電話とカメラの融合は「常に持ち歩く道具」に撮影機能を組み込み、写真を通信の一部へと変えました。なお1999年発売のカメラ内蔵端末が先行しており、「世界初のカメラ付き携帯」という位置づけには諸説があります。","detail":null,"credibility":"disputed","credibility_note":"「世界初のカメラ付き携帯電話」と紹介されることが多いものの、1999年発売の京セラVP-210などが先行しており、定義により見解が分かれます。","sources":[{"title":"シャープ: J-SH04(2000年)","url":null}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"メディアと社会","title":"Instagram公開、写真がSNSの中心に","summary":"写真共有アプリInstagramが公開され、初日に2万5千人が登録したとされています。正方形のフォーマットとフィルターにより、誰の写真も「作品風」に仕上がりました。\n\n撮影から共有、他者の反応までが数秒で完結する回路は、写真を記録から**コミュニケーションの通貨**へと変えました。写真の価値が「何を写したか」から「どう見られるか」へ移る転換点であり、写真文化の重心は決定的にスマートフォンへ移っていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2012-01-19","precision":"day","end_date":null,"type":"point","layer":"技術と機材","title":"コダックが経営破綻","summary":"イーストマン・コダックが、連邦破産法11条(チャプター11)の適用を申請しました。1888年に写真の大衆化を切り開いた企業の経営破綻は、フィルム時代の終わりを象徴する出来事となりました。\n\nデジタルカメラを世界で最初に試作(1975年)しながら、フィルムの収益構造を守るうちに転換が遅れたと総括されています。同じ年、社員十数人のInstagram(メディアと社会レイヤー)が10億ドルでFacebookに買収され、両者の対照が広く論じられました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kodak","url":"https://en.wikipedia.org/wiki/Kodak"}]},{"date":"2013-11-01","precision":"month","end_date":null,"type":"point","layer":"メディアと社会","title":"「selfie」が今年の言葉に","summary":"オックスフォード辞典が、2013年の「今年の言葉」にselfie(自撮り)を選びました。使用頻度がこの1年で急増したことが、選定の理由とされています。\n\nスマートフォンの前面カメラとSNSの組み合わせにより、自分を撮ることが日常の所作となったことを、言語の側から裏づけた出来事です。かつて写真館の儀式であった肖像写真は、毎日、自分の手の中で作られるものになりました。写真の主題の中心に「撮る自分」が座った時代の指標です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Oxford Languages: Word of the Year 2013 \"selfie\"","url":null}]},{"date":"2017-01-01","precision":"year","end_date":null,"type":"point","layer":"メディアと社会","title":"世界の年間撮影枚数、1兆枚超の推計","summary":"米調査会社InfoTrendsなどの推計で、世界で1年間に撮影される写真が1兆枚を超えたとされました。その大半は専用カメラではなく、スマートフォン(技術と機材レイヤー)による撮影です。\n\n写真史の大半の期間の総撮影量を、単年で上回るともいわれる規模です。撮ることが希少な行為だった時代の終わりを示す数字であり、膨大な写真をどう選び、見返し、忘れるかという、写真との関係の再設計が新たな課題となりました。","detail":null,"credibility":"unverified","credibility_note":"「1兆枚」は調査会社による推計値であり、算出方法の詳細は公開情報からは検証できません。","sources":[{"title":"InfoTrends/Keypoint Intelligence: 世界写真撮影枚数の推計","url":null}]},{"date":"2023-04-01","precision":"month","end_date":null,"type":"point","layer":"表現と作家","title":"AI生成画像が写真賞に、作家が受賞辞退","summary":"ソニー・ワールド・フォトグラフィー・アワードのクリエイティブ部門で、ボリス・エルダグセンの入選作が生成AIによる画像だったことを本人が明かし、受賞を辞退しました。\n\n本人は「AI画像が写真のコンペで通用するかを試した」と説明し、写真とAI画像を分けて扱うよう問題提起しています。カメラを介さない「写真のような画像」の登場は、**写真とは何か**という1839年以来の問いを、最も鋭い形で再演しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Boris Eldagsen: Sony World Photography Awards 2023に関する声明","url":null}]}]},{"slug":"culture-street-culture","title":"🛹 ストリートカルチャー","description":"ブロックパーティーのDJ、地下鉄のグラフィティ、路上のスケーター。3つの路上文化が交差しながら美術館・オークション・五輪へ迎えられていく半世紀を、スケボーで育った目線で層を重ねて見る年表です 🛹","category":"culture","language":"ja","start_year":1970,"end_year":2024,"layers":[{"name":"音楽とダンス","color":"orange"},{"name":"グラフィティとアート","color":"pink"},{"name":"スケートとファッション","color":"green"}],"events":[{"date":"1970-01-01","precision":"year","end_date":"1989-05-31","type":"period","layer":"グラフィティとアート","title":"ニューヨーク地下鉄グラフィティの時代","summary":"ニューヨークの地下鉄車両が、名前を残すタギングから色鮮やかな大作「ピース」まで、グラフィティの巨大なキャンバスだった時代です。車両基地に忍び込むライターたちが、技法とスタイルを競い合いました。\n\n市当局は犯罪として撲滅作戦を続けて、1989年5月に「グラフィティのない地下鉄」を宣言してこの時代は幕を閉じます。**街全体がギャラリーだった**約20年の車両と写真の記録が、後の世界的なストリートアート評価の原点になりました。","detail":null,"credibility":"disputed","credibility_note":"地下鉄グラフィティの「時代」の始まりにはっきりした定義はなく、1960年代末からとする資料もあります。終わりは1989年5月のMTAによる宣言を採りました。","sources":[{"title":"Wikipedia: Graffiti in New York City","url":"https://en.wikipedia.org/wiki/Graffiti_in_New_York_City"}]},{"date":"1971-07-21","precision":"day","end_date":null,"type":"point","layer":"グラフィティとアート","title":"NYタイムズが「TAKI 183」を報道","summary":"ニューヨーク・タイムズが、市内のあちこちに「TAKI 183」と書き残すギリシャ系の配達員の若者を記事にしました。名前を街に刻むタギング文化が、初めて大手メディアに載った瞬間です。\n\n記事を読んだ若者たちは競って自分の名前を書き始めて、タグは市内で爆発的に増えました。**メディアに載ると文化が加速する**というストリートカルチャーの逆説は、この最初期からもう動いていたわけです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The New York Times: 'Taki 183' Spawns Pen Pals (1971-07-21)","url":null}]},{"date":"1973-01-01","precision":"year","end_date":null,"type":"point","layer":"スケートとファッション","title":"🛹 ウレタンウィールがスケートを変える","summary":"フランク・ナスワージーが開発したウレタン製ウィール「キャデラック・ホイール」が発売。それまでの金属や粘土系の車輪とは別物のグリップと滑らかさをもたらしました!\n\n路面を選ばず走れるようになったことで、スケートボードは坂道や空のプールの壁へ進出して、サーフィンの陸上での模倣から独自の身体文化へ離陸します。道具の小さな革新が表現の全体を変えた、乗る側には実感でわかる例です。","detail":null,"credibility":"unverified","credibility_note":"ウレタンウィールの開発・発売の時期は1972年から1973年にかけてとされていて、資料によって記述に幅があります。","sources":[{"title":"Wikipedia: Skateboarding","url":"https://en.wikipedia.org/wiki/Skateboarding"}]},{"date":"1973-08-11","precision":"day","end_date":null,"type":"point","layer":"音楽とダンス","title":"ブロンクスのパーティー、ヒップホップの神話","summary":"ニューヨーク・ブロンクスのアパートの集会室で、DJクール・ハークが妹の新学期の費用を集めるパーティーを開催。レコードの間奏部分(ブレイク)を2枚使いで繰り返す手法が、ここで披露されたとされています。\n\nこのパーティーは後年**ヒップホップ誕生の日**として記念されることになります。ブレイクで踊るB-Boyたち、MCの語り、そして壁のグラフィティ(グラフィティとアートレイヤー)が、同じ街区で一つの文化に束ねられていきました。","detail":null,"credibility":"disputed","credibility_note":"この日を「ヒップホップ誕生日」とする位置づけは後年の回顧と記念行事で定着したもので、当時の一次記録は乏しいです。","sources":[{"title":"Wikipedia: DJ Kool Herc","url":"https://en.wikipedia.org/wiki/DJ_Kool_Herc"}]},{"date":"1978-01-01","precision":"year","end_date":null,"type":"point","layer":"スケートとファッション","title":"オーリー誕生、都市が遊び場になる","summary":"フロリダのスケートパークで、アラン・ゲレファンドが手を使わずに板ごと跳び上がる技を編み出して、仲間から「オーリー」と呼ばれました。垂直の壁面での浮遊技として生まれたこの動作が、スケートボードの語彙を根本から変えていきます。\n\n後にロドニー・ミュレンが平地でのオーリーを確立して、街の縁石も階段も手すりも、全部が技の対象になりました。都市そのものを遊び場に読み替えるストリートスケートの、技術的な前提です。","detail":null,"credibility":"disputed","credibility_note":"オーリー考案の時期は1977年とも1978年ともいわれていて、正確な日付を示す記録はありません。","sources":[{"title":"Wikipedia: Ollie (skateboarding)","url":"https://en.wikipedia.org/wiki/Ollie_(skateboarding)"}]},{"date":"1979-09-01","precision":"month","end_date":null,"type":"point","layer":"音楽とダンス","title":"「ラッパーズ・ディライト」がヒット","summary":"シュガーヒル・ギャングの「ラッパーズ・ディライト」が発売されて、ヒップホップのレコードとして初めて全米チャートのヒットになりました。\n\nパーティーの現場の即興だったMCの語りが、レコードという商品になって世界へ流通した瞬間です。一方でシーンの当事者からは「よそ者が先に商品化した」という批判も受けました。路上の文化と商業の緊張関係は、ヒップホップには最初から刻み込まれていたんですね。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Rapper's Delight","url":"https://en.wikipedia.org/wiki/Rapper's_Delight"}]},{"date":"1982-01-01","precision":"year","end_date":null,"type":"point","layer":"グラフィティとアート","title":"バスキア、路上から画廊へ","summary":"SAMOの署名で街に詩的な言葉を残していたジャン=ミシェル・バスキアが、ニューヨークのギャラリーで個展を開いて、美術市場に本格的に迎え入れられました。\n\n**路上から画廊へ**という回路が開いた瞬間で、キース・ヘリングたちもこれに続きます。落書きとして排除される者と作家として買われる者の線引きは誰がするのか。この問いは、以後のストリートアートにずっとつきまとうことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Jean-Michel Basquiat","url":"https://en.wikipedia.org/wiki/Jean-Michel_Basquiat"}]},{"date":"1982-01-01","precision":"year","end_date":"1984-12-31","type":"period","layer":"音楽とダンス","title":"ヒップホップ映画ブーム、世界への伝播","summary":"「ワイルド・スタイル」「フラッシュダンス」「ビート・ストリート」など、ヒップホップ文化を描く映画が立て続けに公開されて、ブレイクダンスとグラフィティの映像が世界中の若者に届きました!\n\nブロンクスの路上の文化は映画を通じて日本を含む各国へ一気に伝わり、各地でブレイクダンスのチームが生まれます。**映像が文化の輸出路になった**時期で、40年後のパリ五輪でのブレイキン採用につながる国際的な裾野はここで作られました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Wild Style","url":"https://en.wikipedia.org/wiki/Wild_Style"}]},{"date":"1986-01-01","precision":"year","end_date":null,"type":"point","layer":"音楽とダンス","title":"👟 Run-D.M.C.、ヒップホップを主流へ","summary":"Run-D.M.C.がアルバム「Raising Hell」を発表。エアロスミスと共演した「Walk This Way」でロックの聴衆にまで届いて、「My Adidas」をきっかけにアディダスとの大型契約を結びました。\n\nヒップホップのグループとスポーツ用品ブランドの先駆的な契約とされていて、ストリートファッション(スケートとファッションレイヤー)と音楽が市場で合流する原型です。何を履くかが何者であるかを語る。あの路上の記号の文化が、ここで産業とつながりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Raising Hell (album)","url":"https://en.wikipedia.org/wiki/Raising_Hell_(album)"}]},{"date":"1994-04-01","precision":"month","end_date":null,"type":"point","layer":"スケートとファッション","title":"Supreme、ラファイエット通りに開店","summary":"ジェームス・ジェビアがニューヨークのラファイエット通りにスケートショップSupremeをオープン。真ん中を広く空けた売り場はボードに乗ったまま入れる設計で、店員も現役のスケーターでした。\n\n少量生産と口コミで飢餓感を作る「ドロップ」の手法で熱狂的な支持を集めて、ストリートウェアを高級ブランドが参照する存在に育っていきます。2017年のルイ・ヴィトンとの協業に至る長い助走が、この小さな店から始まりました。","detail":null,"credibility":"unverified","credibility_note":"開店は1994年4月とされることが多いですが、正確な開店日を示す一次記録は乏しいです。","sources":[{"title":"Wikipedia: Supreme (brand)","url":"https://en.wikipedia.org/wiki/Supreme_(brand)"}]},{"date":"1999-06-27","precision":"day","end_date":null,"type":"point","layer":"スケートとファッション","title":"トニー・ホークが900を成功","summary":"サンフランシスコのXゲームズで、トニー・ホークが大会史上初の900(空中2回転半)をメイク!同じ年に発売されたゲーム「トニー・ホーク プロ・スケーター」も世界的なヒットになります。\n\nヒップホップがレコードと映画(音楽とダンスレイヤー)を通って主流化した過程を、スケートはテレビ中継とゲームでなぞりました。不良の遊びから子ども部屋の憧れへ。ただ、競技化と商業化が進むほど、路上の文化との距離も開き始めます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Tony Hawk","url":"https://en.wikipedia.org/wiki/Tony_Hawk"}]},{"date":"2008-05-01","precision":"month","end_date":null,"type":"point","layer":"グラフィティとアート","title":"テート・モダンが「Street Art」展","summary":"ロンドンのテート・モダンが、美術館の外壁そのものを会場にした「Street Art」展を開催して、世界の6組のアーティストが巨大壁画を制作しました。\n\n犯罪として排除されてきた表現を、国立級の美術館が正面から展示した画期です。同じ時期、路上ではバンクシーの神出鬼没の作品が話題を集めていて、制度の内と外の境界線は誰が引くのかという問いが、美術の世界で表面化しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Tate Modern: Street Art exhibition (2008)","url":null}]},{"date":"2017-01-01","precision":"month","end_date":null,"type":"point","layer":"スケートとファッション","title":"ルイ・ヴィトンがSupremeと協業発表","summary":"ルイ・ヴィトンがパリのメンズコレクションでSupremeとの協業を発表。2000年に自社の柄を無断使用したSupremeのデッキに法的措置をとった過去がある、その両者の合流でした。\n\n**ラグジュアリーがストリートを迎え入れた**象徴とされて、以後、高級ブランドはストリートウェアの手法と人材を次々に取り込みます。翌年にはストリート出身のヴァージル・アブローが、ルイ・ヴィトンのメンズ・デザイナーに就任しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Louis Vuitton 2017-18秋冬メンズコレクション(Supremeとの協業)報道","url":null}]},{"date":"2017-05-18","precision":"day","end_date":null,"type":"point","layer":"グラフィティとアート","title":"バスキア作品、1億ドルで落札","summary":"バスキアが1982年に描いた頭蓋骨の絵「Untitled」が、サザビーズで1億1050万ドルで落札されました。米国人作家のオークション最高額で、落札したのは日本の起業家、前澤友作です。\n\n路上に言葉を書くことから出発した画家の作品が、美術市場の最高価格帯に到達した出来事です。1988年に27歳で亡くなった作家の評価の高騰は、ストリート出自の表現が投資対象の資産として扱われる時代の到来を告げました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Sotheby's: Jean-Michel Basquiat, Untitled (1982) 落札(2017年5月)","url":null}]},{"date":"2018-10-05","precision":"day","end_date":null,"type":"point","layer":"グラフィティとアート","title":"バンクシー、落札直後の自動裁断","summary":"サザビーズのオークションで、バンクシーの「風船と少女」が約104万ポンドで落札された直後、額縁に仕込まれたシュレッダーが作動して、絵の下半分が裁断されました。\n\n美術市場への批評として仕掛けられたパフォーマンスでしたが、裁断された作品は「愛はごみ箱の中に」と改題されて、2021年には約16倍の価格で再落札されます。市場への挑発すら市場価値に変換される。ストリートアートの現在地が露わになった出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Sotheby's: Banksy, Love is in the Bin (2018)","url":null}]},{"date":"2021-07-25","precision":"day","end_date":null,"type":"point","layer":"スケートとファッション","title":"🏅 スケートボードが五輪競技デビュー","summary":"東京五輪でスケートボードが五輪競技として初めて実施されて、ストリート種目で堀米雄斗が初代金メダリストに。女子では13歳の西矢椛が優勝しました!\n\n警察に追われる遊びだったスケートボードが、**路上の遊びから五輪種目へ**と公認された到達点です。ただ、競技化が路上の文化の自由さを損なうという当事者の異論も根強くて、公認と自律のあいだの緊張は、滑る側の実感としてもいまも続いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Skateboarding at the 2020 Summer Olympics","url":"https://en.wikipedia.org/wiki/Skateboarding_at_the_2020_Summer_Olympics"}]},{"date":"2024-08-09","precision":"day","end_date":null,"type":"point","layer":"音楽とダンス","title":"ブレイキンがパリ五輪で正式競技に","summary":"パリ五輪でブレイキン(ブレイクダンス)が五輪競技として初めて実施されて、B-GirlsとB-Boysの各種目で世界のダンサーがバトルを繰り広げました。\n\nブロンクスの路上で生まれた踊りが、半世紀でオリンピックの正式競技まで来ました。グラフィティは美術館へ(グラフィティとアートレイヤー)、スケートボードは五輪へ(スケートとファッションレイヤー)。3つの層が同じ結末に収束したことを示す、この年表の終着点です。なお次のロサンゼルス大会では実施されません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Breaking at the 2024 Summer Olympics","url":"https://en.wikipedia.org/wiki/Breaking_at_the_2024_Summer_Olympics"}]}]},{"slug":"culture-traditional-crafts","title":"伝統工芸の現在","description":"人間国宝の制度から民藝の思想、能登の震災復興まで。産地と職人・制度と保護・市場とデザインの3層を重ね、伝統工芸が「保存」と「産業」のあいだで生き続ける道を静かに描く年表です。","category":"culture","language":"ja","start_year":1924,"end_year":2024,"layers":[{"name":"産地と職人","color":"gold"},{"name":"制度と保護","color":"teal"},{"name":"市場とデザイン","color":"pink"}],"events":[{"date":"1924-01-01","precision":"year","end_date":null,"type":"point","layer":"産地と職人","title":"濱田庄司が益子に移住","summary":"英国での作陶生活から戻った陶芸家の濱田庄司が、栃木県益子に移り住みました。地元の土と釉薬を使い、日用の器を基礎に置く作陶を始め、無名の窯業地だった益子は「作家のいる産地」として知られていきます。\n\n濱田は柳宗悦らの民藝運動(市場とデザインレイヤー)の中心人物であり、1955年には最初の人間国宝の一人に認定されます(制度と保護レイヤー)。産地・思想・制度という、本年表の3層のすべてを生きた職人です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 濱田庄司","url":"https://ja.wikipedia.org/wiki/濱田庄司"}]},{"date":"1926-01-01","precision":"year","end_date":"1961-12-31","type":"period","layer":"市場とデザイン","title":"民藝運動が始まる","summary":"柳宗悦・河井寬次郎・濱田庄司らが「日本民藝美術館設立趣意書」を発表し、民藝運動が本格的に始まりました。無名の職人が作る日用品にこそ健やかな美が宿るとする思想で、柳の死(1961年)までに美術館・雑誌・流通網を確立しています。\n\n名工の作や茶道具が中心だった工芸の価値観を**無名の手仕事**へと転倒させた運動であり、「用の美」という語彙は現在のクラフトブームまで生き続けています。工芸を語る言葉そのものを作った出来事といえます。","detail":null,"credibility":"disputed","credibility_note":"「民藝」の語は1925年末に柳らが考案したとされ、運動の起点を1925年と1926年のどちらに置くかなど、時期の区切りには諸説あります。","sources":[{"title":"Wikipedia: 民芸運動","url":"https://ja.wikipedia.org/wiki/民芸運動"}]},{"date":"1950-05-30","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"文化財保護法が制定","summary":"前年の法隆寺金堂壁画焼損を契機に、文化財保護法が制定されました。建造物や美術品に加え、演劇・音楽・工芸技術といった無形文化財の保護を、世界に先駆けて法制化した点が画期でした。\n\n形あるモノではなく「技」そのものを保護対象とする発想は、のちの重要無形文化財保持者(人間国宝)制度に結実します。半世紀後のユネスコ無形文化遺産制度の先行モデルとも評される、日本発の制度設計です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 文化財保護法","url":"https://ja.wikipedia.org/wiki/文化財保護法"}]},{"date":"1955-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と保護","title":"最初の人間国宝が認定される","summary":"改正文化財保護法に基づき、最初の重要無形文化財保持者が認定されました。工芸技術の分野では、色絵磁器の富本憲吉、民芸陶器の濱田庄司、鉄釉陶器の石黒宗麿らが名を連ねています。\n\n「人間国宝」の通称で知られるこの制度は、卓越した技を持つ個人を国が認定し、伝承者の養成を助成する仕組みです。ただし頂点の顕彰は、産地全体の雇用や流通の衰退(産地と職人レイヤー)とは別の問題を残しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 人間国宝","url":"https://ja.wikipedia.org/wiki/人間国宝"}]},{"date":"1974-05-25","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"伝統的工芸品産業振興法(伝産法)公布","summary":"100年以上続く技術・技法、主として日常生活で使われることなどを要件に、国が「伝統的工芸品」を指定して産地を支援する伝統的工芸品産業振興法が公布されました。翌年から指定が始まり、指定品目は現在240を超えています。\n\n文化財保護法が技の頂点を守るのに対し、伝産法は産業としての裾野を支える設計で、日本の工芸保護の両輪が出揃いました。それでも従事者の減少(産地と職人レイヤー)は止まらず、制度の限界も同時に示していきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 伝統的工芸品","url":"https://ja.wikipedia.org/wiki/伝統的工芸品"}]},{"date":"1977-01-01","precision":"year","end_date":null,"type":"point","layer":"産地と職人","title":"輪島塗が重要無形文化財に指定","summary":"輪島塗の製作技術が国の重要無形文化財に指定され、輪島塗技術保存会が保持団体として認定されました。個人ではなく、産地の技術者集団を認定する方式です。\n\n布着せや地の粉を使う堅牢な下地など、多数の工程を塗師・蒔絵師・沈金師らが分業で担う輪島の生産体制が、制度の上でも「集団の技」として位置づけられました。2024年の震災(同レイヤー)では、この分業構造そのものが危機に立たされます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 輪島塗","url":"https://ja.wikipedia.org/wiki/輪島塗"}]},{"date":"1979-01-01","precision":"year","end_date":"2016-12-31","type":"period","layer":"産地と職人","title":"産地の従事者、約29万人から約6万人へ","summary":"伝統的工芸品産地の従事者は、1979年ごろの約29万人をピークに減少を続け、2010年代には約6万人台まで落ち込んだとされています。生産額も、同じ期間に大きく縮小しました。\n\n生活様式の変化による需要減、安価な量産品や輸入品への代替、後継者不足という三重の圧力によるものです。指定や認定といった制度による保護(制度と保護レイヤー)だけでは、産地の雇用を維持できないことを示しました。","detail":null,"credibility":"disputed","credibility_note":"従事者数・生産額は伝統的工芸品産業振興協会等の集計に基づく数字で、対象品目の追加や調査方法の変更を含むため、単純な時系列比較には注意が必要です。","sources":[{"title":"経済産業省・伝統的工芸品産業振興協会の産業統計資料","url":null}]},{"date":"1981-01-01","precision":"year","end_date":null,"type":"point","layer":"市場とデザイン","title":"呉服市場がピーク、以後長期縮小へ","summary":"きもの関連の小売市場は、1980年代初頭に約1.8兆円の規模でピークを迎えたと推計されています。以後、生活様式の変化とともに縮小が続き、近年は2千数百億円規模とされます。\n\n染織は伝統的工芸品の指定品目でも大きな割合を占める中核分野であり、この市場の縮小が、西陣織や京友禅など主要産地の疲弊(産地と職人レイヤー)に直結しました。**需要の消失こそが最大の危機**であることを示す数字です。","detail":null,"credibility":"unverified","credibility_note":"市場規模は矢野経済研究所等の民間調査による推計で、対象範囲や推計方法により数値には幅があります。","sources":[{"title":"矢野経済研究所「呉服市場に関する調査」","url":null}]},{"date":"2008-05-01","precision":"month","end_date":null,"type":"point","layer":"市場とデザイン","title":"ふるさと納税開始、工芸品の新販路に","summary":"地方税法の改正により、ふるさと納税制度が始まりました。返礼品競争の拡大とともに、南部鉄器や江戸切子、今治タオルなどの工芸品・地場産品が、返礼品として全国の家庭へ届く販路となっていきます。\n\n都市の消費者が寄付という形で産地を支える仕組みは、問屋流通の衰退で細った販路(産地と職人レイヤー)を部分的に補いました。自治体が産品のマーケティング主体になるという、工芸の売られ方の変化も生んでいます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省: ふるさと納税ポータルサイト","url":null}]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"市場とデザイン","title":"中川政七商店が産地の経営支援を開始","summary":"奈良晒を起源とする1716年創業の中川政七商店が、他産地の工芸メーカーを支援する経営コンサルティング事業を始めました。最初期の案件となった波佐見焼のメーカーからは、ヒットブランド「HASAMI」が生まれています。\n\n問屋への下請けから自社ブランドの製造小売へ、という転換の型を各地の産地に持ち込み、**デザインと経営の言葉**で工芸を立て直す潮流の先駆けとなりました。「日本の工芸を元気にする」を掲げる同社自身も、全国区へと成長しています。","detail":null,"credibility":"unverified","credibility_note":"コンサルティング事業の開始時期や最初の案件については、同社の発信・インタビューに基づく情報で、時期の記述には幅があります。","sources":[{"title":"中川政七商店 公式サイト","url":"https://www.nakagawa-masashichi.jp"}]},{"date":"2010-11-16","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"結城紬がユネスコ無形文化遺産に登録","summary":"本場結城紬の織物技術が、ユネスコ無形文化遺産に登録されました。真綿から手でつむいだ無撚りの糸を、腰で張力を調える地機で織る、分業による手仕事の体系が評価されています。\n\n国内の重要無形文化財(1956年指定)からユネスコへという、**保護の国際化**を示す登録です。ただし登録は着物需要の回復(市場とデザインレイヤー)を保証するものではなく、「名誉と存続は別」という課題も浮き彫りにしました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 結城紬","url":"https://ja.wikipedia.org/wiki/結城紬"}]},{"date":"2012-01-01","precision":"year","end_date":null,"type":"point","layer":"市場とデザイン","title":"京都の後継者ユニット「GO ON」結成","summary":"西陣織の細尾、茶筒の開化堂、朝日焼など、京都の工芸の後継者6人がユニット「GO ON」を結成しました。海外での展示や、グローバル企業との協働プロダクトの開発に、共同で取り組む枠組みです。\n\n細尾はその後、西陣織をホテルやメゾンの内装材として海外へ販売する事業を拡大しました。**後継者自身が新しい市場を作りに行く**世代交代の象徴であり、「守る工芸」から「攻める工芸」への転換点とされています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GO ON(京都・工芸後継者ユニット)公式サイト","url":null}]},{"date":"2014-11-26","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"「和紙 日本の手漉和紙技術」ユネスコ登録","summary":"石州半紙・本美濃紙・細川紙の3つの手漉和紙技術が、「和紙 日本の手漉和紙技術」としてユネスコ無形文化遺産に登録されました。楮のみを原料とする伝統技法が対象です。\n\n登録を機に注目されたのが文化財修復の市場で、ルーブル美術館や大英博物館の修復現場でも、日本の和紙が使われています。伝統素材が世界の保存修復インフラになるという、新しい販路(市場とデザインレイヤー)を示しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 和紙","url":"https://ja.wikipedia.org/wiki/和紙"}]},{"date":"2016-01-01","precision":"year","end_date":null,"type":"point","layer":"産地と職人","title":"有田焼創業400年、海外デザイナーと協働","summary":"日本磁器発祥の地とされる有田が創業400年を迎え、佐賀県などが国際的な記念事業を展開しました。オランダのデザインスタジオが指揮を執り、国内外16組のデザイナーと窯元が協働したブランド「2016/」が発表されています。\n\n記念の年を産地の構造転換の機会に変える試みであり、有田の技術を世界の同時代デザインに接続する実験として注目されました。産地が海外デザイナーと直接組むこの型は、その後ほかの産地にも広がっています。","detail":null,"credibility":"disputed","credibility_note":"磁器創業を1616年とする起点は李参平による泉山陶石発見の伝承に基づくもので、創業年については考古学的に諸説あります。","sources":[{"title":"Wikipedia: 有田焼","url":"https://ja.wikipedia.org/wiki/有田焼"}]},{"date":"2016-01-01","precision":"year","end_date":null,"type":"point","layer":"市場とデザイン","title":"ロエベ財団クラフトプライズ創設","summary":"スペイン発のファッションブランド、ロエベの財団が、現代工芸を対象とする国際賞「ロエベ財団 クラフトプライズ」を創設しました。工芸を現代アートと同格に扱う賞として注目され、日本人作家が毎回多数ファイナリストに選ばれています。\n\nラグジュアリー産業が工芸を**同時代の芸術**として顕彰する動きです。工芸の評価軸が、国内の伝統継承の文脈から国際的なアートマーケットへ広がったことを象徴し、工芸品の価格形成にも影響を与え始めています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"LOEWE FOUNDATION Craft Prize 公式サイト","url":null}]},{"date":"2020-12-17","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"「伝統建築工匠の技」ユネスコ登録","summary":"宮大工や左官、檜皮葺、畳製作など、木造建造物を受け継ぐための17分野の伝統技術が、「伝統建築工匠の技」としてユネスコ無形文化遺産に登録されました。\n\n建物という有形ではなく、修理を担う職人の技という無形を登録した点が特徴です。1950年の文化財保護法(同レイヤー)以来の「技を守る」思想の、国際的な到達点といえます。背景には、担い手の高齢化(産地と職人レイヤー)への強い危機感があります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文化庁: 「伝統建築工匠の技」ユネスコ無形文化遺産登録","url":null}]},{"date":"2024-01-01","precision":"day","end_date":null,"type":"point","layer":"産地と職人","title":"能登半島地震で輪島塗産地が被災","summary":"元日に発生した能登半島地震で、輪島市は最大震度7の揺れと大規模火災に見舞われ、輪島塗の工房や店舗、道具や漆器の在庫が多数失われました。分業を担う職人たち自身も被災し、各地への避難を余儀なくされています。\n\n国や県は仮設工房の整備や道具の再調達支援を進め、県外からの応援購入も広がりました。**災害は産地の分業構造ごと壊す**という伝統工芸の脆さと、産地の外から支える新しい形が、同時に現れた出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 令和6年能登半島地震","url":"https://ja.wikipedia.org/wiki/令和6年能登半島地震"}]}]},{"slug":"history-age-of-discovery","title":"大航海時代の光と影","description":"セウタ攻略から東インド会社まで約200年。航海・交易・征服の3層を重ね、世界が一つの経済圏に結ばれていく過程と、その裏で進んだ収奪と人口崩壊を同じ画面で見る年表。","category":"history-politics","language":"ja","start_year":1415,"end_year":1602,"layers":[{"name":"航海と探検","color":"blue"},{"name":"交易と経済","color":"gold"},{"name":"征服と先住民","color":"pink"}],"events":[{"date":"1415-08-21","precision":"day","end_date":null,"type":"point","layer":"航海と探検","title":"ポルトガルが北アフリカのセウタを攻略","summary":"ジョアン1世率いるポルトガル軍が、ジブラルタル海峡対岸の交易都市セウタを一日で攻略した。エンリケ航海王子も従軍したこの遠征は、大航海時代の出発点と位置づけられることが多い。\n\n十字軍的な信仰の動機と、金と穀物の集まる北アフリカ交易への参入という経済の動機が重なっており、以後エンリケの支援でアフリカ西岸の組織的探検が始まる。信仰・栄光・利益が最初から不可分だったことを示す開幕である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Conquest of Ceuta","url":"https://en.wikipedia.org/wiki/Conquest_of_Ceuta"}]},{"date":"1434-01-01","precision":"year","end_date":null,"type":"point","layer":"航海と探検","title":"ジル・エアネスがボジャドール岬を越える","summary":"エンリケ航海王子の船長ジル・エアネスが、船乗りたちに「越えれば戻れない」と恐れられた西サハラ沖のボジャドール岬を初めて越えて帰還した。十数回の失敗の末の突破だったと伝えられる。\n\n心理的な限界線の突破により、アフリカ西岸の南下が一気に進む。一方でこの南下は、10年後のラゴスでの奴隷競売(征服と先住民レイヤー)に直結しており、探検の一歩一歩が収奪の一歩でもあったという本年表の主題がここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gil Eanes","url":"https://en.wikipedia.org/wiki/Gil_Eanes"}]},{"date":"1444-08-01","precision":"month","end_date":null,"type":"point","layer":"征服と先住民","title":"ラゴスでアフリカ人捕虜の大規模な競売","summary":"ポルトガル南部の港ラゴスで、西アフリカから連行された200人以上の捕虜が競売にかけられた。年代記作者ズララは、家族が引き離される光景への同情を記しつつ、事業自体は神意として正当化している。\n\n**大西洋奴隷貿易の原型**となった出来事であり、以後アフリカ人の労働力は航海事業の収益源に組み込まれていく。喜望峰到達もアメリカ到達もまだ先のこの時点で、既に人身の売買が探検の経済を支え始めていた。","detail":null,"credibility":"unverified","credibility_note":"235人という人数や競売の詳細はズララ『ギニア発見征服誌』のほぼ単一の記録に依拠しており、第三者史料による検証はできない。","sources":[{"title":"ズララ『ギニア発見征服誌』(1450年代成立)","url":null}]},{"date":"1488-02-01","precision":"month","end_date":null,"type":"point","layer":"航海と探検","title":"バルトロメウ・ディアスが喜望峰を回航","summary":"ポルトガルのバルトロメウ・ディアスが嵐に流されながらアフリカ大陸南端を回り込み、大陸の南に海が開けていることを確認した。帰路に望見した岬は、のちに「喜望峰」と名づけられる。\n\n70年余りに及んだアフリカ西岸南下の到達点であり、インドへの海路が実在するという確信をポルトガルに与えた。この情報の蓄積が10年後のガマのインド航路開拓を可能にし、香辛料交易(交易と経済レイヤー)の構造を一変させる前提となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bartolomeu Dias","url":"https://en.wikipedia.org/wiki/Bartolomeu_Dias"}]},{"date":"1492-10-12","precision":"day","end_date":null,"type":"point","layer":"航海と探検","title":"コロンブス、カリブ海の島に到達","summary":"スペイン両王の支援を得たコロンブスが、大西洋を西へ約1か月航海してバハマ諸島の島に到達し、サンサルバドルと名づけた。彼は死ぬまでそこをアジアの一部と信じていた。\n\n**「発見」は一方の側から見た言葉**であり、島には数万年来の先住民の歴史があった。この上陸を境に旧大陸と新大陸の生態系・病原体・人間が交わる「コロンブス交換」が始まり、以後の年表の光と影のすべてがこの日から分岐する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Voyages of Christopher Columbus","url":"https://en.wikipedia.org/wiki/Voyages_of_Christopher_Columbus"}]},{"date":"1493-01-01","precision":"year","end_date":"1600-01-01","type":"period","layer":"征服と先住民","title":"アメリカ大陸先住民の人口激減","summary":"接触開始からの約1世紀で、南北アメリカの先住民人口は天然痘・麻疹などの旧大陸由来の疫病、戦争、強制労働により激減した。地域によっては9割前後が失われたとする推計もある。\n\n免疫のない集団を襲った疫病が最大の要因とされるが、征服と収奪が社会の回復力を奪ったことと不可分である。**大陸規模の人口崩壊**は労働力不足を生み、それを埋める形でアフリカ人奴隷貿易が拡大するという、影が影を呼ぶ連鎖の中心にこの期間がある。","detail":null,"credibility":"disputed","credibility_note":"接触前の人口推計自体が800万人台から1億人超まで研究者間で桁違いに分かれており、減少率・死者数は確定できない。","sources":[{"title":"Wikipedia: Population history of Indigenous peoples of the Americas","url":"https://en.wikipedia.org/wiki/Population_history_of_Indigenous_peoples_of_the_Americas"}]},{"date":"1494-06-07","precision":"day","end_date":null,"type":"point","layer":"交易と経済","title":"トルデシリャス条約、世界を二分する線を引く","summary":"スペインとポルトガルが、ヴェルデ岬諸島西方の子午線を境に、新たに到達する土地の権利を二分する条約を結んだ。教皇の裁定を修正する形での、ヨーロッパ2国間の取り決めである。\n\n当事者不在のまま**地図上の一本の線で世界の所有を宣言した**この条約は、大航海時代の発想を最も端的に示す。境界線の東側にあたったブラジルは後にポルトガル領となり、条約の線は現在の南米の言語地図にまで痕跡を残している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Treaty of Tordesillas","url":"https://en.wikipedia.org/wiki/Treaty_of_Tordesillas"}]},{"date":"1498-05-20","precision":"day","end_date":null,"type":"point","layer":"航海と探検","title":"ヴァスコ・ダ・ガマがインドのカリカットに到達","summary":"喜望峰回りでインド洋を横断したガマの艦隊が、香辛料交易の中心カリカットに到達した。欧州からアジアへ直接至る海路が初めて実証された瞬間である。\n\nただしインド洋には既にアラブ・インド商人の成熟した交易網があり、ポルトガルは新参者にすぎなかった。持参した贈り物は現地の支配者に貧弱と一笑されている。以後ポルトガルは交渉ではなく艦砲による拠点支配へ転じ、航海の成果が武力交易(交易と経済レイヤー)へ姿を変えていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Vasco da Gama","url":"https://en.wikipedia.org/wiki/Vasco_da_Gama"}]},{"date":"1500-04-22","precision":"day","end_date":null,"type":"point","layer":"航海と探検","title":"カブラルの艦隊がブラジルに到達","summary":"インドへ向かうため大西洋を大きく西へ迂回したカブラルの艦隊が、現在のブラジル沿岸に到達し、ポルトガル領有を宣言した。意図的な探査か偶然の漂着かは今も議論がある。\n\nトルデシリャス条約(交易と経済レイヤー)の線の東側だったため、南米にポルトガル語圏が生まれる起点となった。当初は染料木の採取地にすぎなかったが、後に砂糖プランテーションとアフリカ人奴隷労働の中心地となり、条約の線が数百万人の運命を規定することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pedro Álvares Cabral","url":"https://en.wikipedia.org/wiki/Pedro_%C3%81lvares_Cabral"}]},{"date":"1519-09-20","precision":"day","end_date":"1522-09-06","type":"period","layer":"航海と探検","title":"マゼラン艦隊の世界周航","summary":"マゼラン率いる5隻・約270人の艦隊がスペインを出港し、南米南端の海峡を抜けて太平洋を横断した。マゼラン自身はフィリピンのマクタン島で戦死し、エルカーノ指揮下のビクトリア号1隻・生存者18人が3年後に帰港して史上初の世界周航が完成する。\n\n地球が一続きの海で結ばれていることを実証し、地球の大きさを体感として示した航海である。同じ頃メキシコではコルテスの征服(征服と先住民レイヤー)が進行しており、探検の達成と征服の暴力が同時代であったことを両レイヤーの並置が示す。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Magellan expedition","url":"https://en.wikipedia.org/wiki/Magellan_expedition"}]},{"date":"1521-08-13","precision":"day","end_date":null,"type":"point","layer":"征服と先住民","title":"テノチティトラン陥落、アステカ王国滅亡","summary":"コルテス率いるスペイン軍と先住民同盟軍が、湖上の大都市テノチティトランを長期の包囲戦の末に陥落させ、アステカ王国は滅亡した。包囲中の市内では天然痘が猛威を振るっていた。\n\n数百人のスペイン人だけの勝利ではなく、アステカ支配に反発する先住民諸都市の大軍と、旧大陸由来の疫病という「見えない同盟者」が決定的だった。人口数十万を擁したとされる都市の廃墟の上にメキシコシティが築かれ、征服の統治が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Fall of Tenochtitlan","url":"https://en.wikipedia.org/wiki/Fall_of_Tenochtitlan"}]},{"date":"1533-01-01","precision":"year","end_date":null,"type":"point","layer":"征服と先住民","title":"ピサロがインカ皇帝アタワルパを処刑","summary":"カハマルカで捕らえられていたインカ皇帝アタワルパが、部屋を満たす金銀の身代金を納めた後にもかかわらず、スペイン人により処刑された。ピサロの部隊は200人足らずでインカ帝国の中枢を制圧した。\n\n内戦と疫病で弱っていた帝国の混乱に乗じた征服であり、身代金の金銀はスペインへ流れて欧州の貨幣経済を刺激した(交易と経済レイヤー)。約束と処刑の顛末は、征服の論理の身勝手さを示す事例として同時代から批判の対象となった。","detail":null,"credibility":"dispute
