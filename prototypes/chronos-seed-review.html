urces":[{"title":"The Nippon Foundation-GEBCO Seabed 2030 Project","url":"https://seabed2030.org"}]},{"date":"2019-04-28","precision":"day","end_date":null,"type":"point","layer":"探査技術","title":"ファイブ・ディープス遠征、五大洋最深部へ","summary":"投資家ヴェスコヴォが潜水艇リミッティング・ファクターでチャレンジャー海淵に潜航し、水深10,928mと発表した。五大洋すべての最深部に潜るファイブ・ディープス遠征の一環で、遠征は約10カ月で完遂された。\n\n繰り返し潜航できる商用認証艇の登場により、最深部は一度きりの偉業の場から**繰り返し通える場所**へ変わった。同艇はその後、各国の研究者を乗せた科学潜航にも使われている。","detail":null,"credibility":"disputed","credibility_note":"記録水深10,928mは遠征側の発表値で、計測・較正の方法をめぐり過去の記録との比較には議論がある。","sources":[{"title":"Wikipedia: Five Deeps Expedition","url":"https://en.wikipedia.org/wiki/Five_Deeps_Expedition"}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"ナウルが深海採鉱の「2年ルール」を発動","summary":"太平洋の島国ナウルが、支援する企業による深海底採鉱の計画を念頭に、2年以内の採掘規則完成を国際海底機構に求める条項を発動した。規則が未完成のままでも採掘申請の審査が始まりうる状況が生まれた。\n\n主対象はクラリオン・クリッパートン海域の多金属団塊で、電池向け金属の需要増が背景にある。科学界からは深海生態系(発見と科学レイヤー)の知見不足を理由にモラトリアムを求める声が上がり、各国の賛否も割れている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際海底機構(ISA)へのナウルによる2年ルール発動通知(2021年6月)","url":null}]},{"date":"2023-06-18","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"潜水艇タイタン、タイタニック観光中に圧壊","summary":"オーシャンゲート社の潜水艇タイタンがタイタニック号見学ツアーの潜航中に消息を絶ち、のちに水深約3,800m付近で圧壊していたことが確認された。乗員5人全員が死亡した。\n\n同艇は既存の第三者認証を受けない独自設計で運航されており、事故は深海観光をめぐる安全規制の空白を露呈した。1985年の残骸発見(発見と科学レイヤー)が生んだ観光需要と、制度の未整備が交差した悲劇である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Titan submersible implosion","url":"https://en.wikipedia.org/wiki/Titan_submersible_implosion"}]},{"date":"2023-06-19","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"国連で公海の生物多様性協定(BBNJ)を採択","summary":"国家管轄権の外側にある海域の生物多様性を保全する「BBNJ協定」が国連で採択された。公海に海洋保護区を設ける手続きと、海洋遺伝資源から得る利益の配分枠組みを初めて定めた。\n\n交渉開始から採択まで約20年を要した。海洋法条約が生まれた1982年には想定されていなかった遺伝資源やDNA配列データが争点となり、**探査が生んだ新しい価値**に制度が追いつくという構図がここでも繰り返された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国連: 国家管轄権外区域の海洋生物多様性(BBNJ)協定 採択(2023年6月19日)","url":null}]}]},{"slug":"science-particle-physics","title":"素粒子物理学の旅","description":"1897年の電子発見からヒッグス粒子、次世代加速器構想まで。理論の予言、実験と加速器による検証、巨大科学を支える国際協力の3層を重ね、物質の最小単位を問い続ける旅を辿る。","category":"science-nature","language":"ja","start_year":1897,"end_year":2025,"layers":[{"name":"理論","color":"purple"},{"name":"実験と加速器","color":"blue"},{"name":"巨大科学と協力","color":"gold"}],"events":[{"date":"1897-04-30","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"J.J.トムソン、電子を発見","summary":"キャヴェンディッシュ研究所のトムソンが、陰極線の正体は原子よりはるかに軽い負電荷の粒子だとする実験結果を王立研究所で講演した。原子より小さい構成要素、最初の素粒子の発見である。\n\n「原子は分割できない」という古代以来の前提が崩れた出発点であり、1911年の原子核、1932年の中性子と続く**より小さな階層を問い続ける旅**がここから始まる。当時この発見に実用価値を見た者はほとんどいなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: J. J. Thomson","url":"https://en.wikipedia.org/wiki/J._J._Thomson"}]},{"date":"1928-02-01","precision":"month","end_date":null,"type":"point","layer":"理論","title":"ディラック方程式、反物質を予言","summary":"ディラックが特殊相対論と量子力学を両立させる電子の方程式を発表した。方程式は負エネルギーの解を含み、やがて電子と同じ質量で電荷が逆の「反粒子」の存在を意味すると解釈される。\n\n1932年にアンダーソンが宇宙線の中に陽電子を発見して予言は的中した。**紙の上の数学が未知の粒子を先に言い当てる**という理論主導の発見様式の最初の劇的な成功であり、以後の素粒子物理の型となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Dirac equation","url":"https://en.wikipedia.org/wiki/Dirac_equation"}]},{"date":"1932-02-27","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"チャドウィック、中性子を発見","summary":"チャドウィックが、ベリリウムから出る透過力の強い放射線を電荷を持たない中性の粒子と同定し、Nature誌に速報した。師のラザフォードが1920年に示唆していた中性子の実証である。\n\n陽子と中性子の組で原子核を説明できるようになり、核物理は急展開した。同年には加速器による人工核変換も成功している。核子どうしを結ぶ力の説明として、3年後に湯川の中間子論(理論レイヤー)が生まれる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: James Chadwick","url":"https://en.wikipedia.org/wiki/James_Chadwick"}]},{"date":"1935-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"湯川秀樹、中間子論を発表","summary":"湯川秀樹が、原子核の中で陽子と中性子を結びつける力は未知の粒子(中間子)の交換によって生じるとする理論を日本の学術誌に発表した。力を粒子の交換として説明する枠組みの提示である。\n\n1947年のパイ中間子発見(実験と加速器レイヤー)で理論は裏づけられ、1949年に日本人初のノーベル賞を受賞。敗戦直後の日本社会を勇気づけ、素粒子論の研究拠点が日本に育つ契機となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 湯川秀樹","url":"https://ja.wikipedia.org/wiki/%E6%B9%AF%E5%B7%9D%E7%A7%80%E6%A8%B9"}]},{"date":"1947-05-01","precision":"month","end_date":null,"type":"point","layer":"実験と加速器","title":"パイ中間子を宇宙線中に発見","summary":"パウエルらが、高山に設置した原子核乾板に残された飛跡から、湯川の予言に合う新粒子パイ中間子の崩壊を捉えてNature誌に報告した。\n\n加速器がまだ非力だった時代、天然の高エネルギー源である宇宙線が素粒子の狩場だった。だが同様に見つかる新粒子は予想外に増え続け、「粒子の動物園」と呼ばれる混沌が生じる。この混沌を整理する試みが、1964年のクォーク模型(理論レイヤー)につながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pion","url":"https://en.wikipedia.org/wiki/Pion"}]},{"date":"1954-09-29","precision":"day","end_date":null,"type":"point","layer":"巨大科学と協力","title":"欧州合同原子核研究機関(CERN)設立","summary":"欧州12か国の批准によりCERNが正式に発足した。第二次大戦で疲弊し人材が米国へ流出した欧州が、一国では持てない大型加速器を共同で保有するために作った国際機関である。\n\n「科学による欧州の再建」を掲げた設立は、素粒子物理が**一国では担えない巨大科学**へ向かう転換点となった。後にW/Z粒子の発見、LHC、さらに副産物としてのWeb発明(1989年)まで、協力の枠組みそのものが成果を生み続ける。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: CERN","url":"https://en.wikipedia.org/wiki/CERN"}]},{"date":"1956-06-14","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ニュートリノを初めて検出","summary":"ライネスとコーワンが原子炉から放出される反ニュートリノの検出に成功し、提唱者パウリに「検出した」と電報を打った。1930年の理論的な提唱から26年目の実証である。\n\nパウリが「検出不可能かもしれない」と悩みながら導入した粒子は実在した。物質とほとんど反応しないこの幽霊のような粒子は、その後も超新星の観測(1987年)や振動の発見(1998年)と、本年表で繰り返し主役を務めることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cowan–Reines neutrino experiment","url":"https://en.wikipedia.org/wiki/Cowan%E2%80%93Reines_neutrino_experiment"}]},{"date":"1964-02-01","precision":"month","end_date":null,"type":"point","layer":"理論","title":"クォーク模型の提唱","summary":"ゲルマンとツワイクがそれぞれ独立に、乱立するハドロンを3種類の基本粒子(クォーク)の組み合わせとして整理する模型を提唱した。\n\n分数電荷を持つ粒子は当初「数学的な便法」と受け取られ、単独で取り出せない性質もあって実在への懐疑が続いたが、1968年以降の電子散乱実験が陽子の内部構造を裏づけた。宇宙線と加速器が生んだ「粒子の動物園」(実験と加速器レイヤー)に、周期表にあたる秩序を与えた転換点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Quark","url":"https://en.wikipedia.org/wiki/Quark"}]},{"date":"1964-08-01","precision":"month","end_date":null,"type":"point","layer":"理論","title":"ヒッグス機構の提唱","summary":"アングレールとブラウト、続いてヒッグス、さらにグラルニクらの3グループが、対称性の自発的破れによって素粒子が質量を得る機構を相次いで独立に発表した。ヒッグスの論文は新粒子の存在に明示的に触れていた。\n\n半世紀後のLHCでの粒子発見(実験と加速器レイヤー)で実証されるが、提唱の先取権と呼び名をめぐる議論は長く続いた。2013年のノーベル賞は2名に絞られ、選から漏れた貢献者をめぐる論争も残った。","detail":null,"credibility":"disputed","credibility_note":"機構はほぼ同時期に3グループが独立に提唱しており、貢献の配分と「誰の名を冠すべきか」は現在も立場によって見解が分かれる。","sources":[{"title":"Wikipedia: Higgs mechanism","url":"https://en.wikipedia.org/wiki/Higgs_mechanism"}]},{"date":"1967-11-20","precision":"day","end_date":null,"type":"point","layer":"理論","title":"ワインバーグ、電弱統一理論を発表","summary":"ワインバーグが電磁気力と弱い力を一つの枠組みで記述する理論を発表した。ヒッグス機構を組み込み、未発見のW粒子とZ粒子の質量を予言するものだった。サラムも独立に同様の理論へ到達している。\n\n発表当初はほとんど引用されなかったが、1971年にトフーフトが計算の整合性(繰り込み可能性)を証明すると一気に主流となり、素粒子の「標準模型」の柱となった。予言の検証は1983年のCERN(実験と加速器レイヤー)を待つ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Electroweak interaction","url":"https://en.wikipedia.org/wiki/Electroweak_interaction"}]},{"date":"1974-11-11","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"J/ψ粒子の同時発見(11月革命)","summary":"米国のブルックヘブン研究所とSLACの2チームが、同じ新粒子J/ψの発見を同日に発表した。異常に長い寿命を持つこの粒子は、第4のクォーク(チャーム)と反クォークの束縛状態と解釈された。\n\nクォーク模型と電弱理論(理論レイヤー)の予言が一挙に裏づけられ、標準模型が定説となる「11月革命」と呼ばれる転換点になった。一方でティン側が結果の公表を数か月遅らせた経緯には食い違いが残り、名称も両陣営の呼称を併記する異例の形となった。","detail":null,"credibility":"disputed","credibility_note":"ブルックヘブン側がいつ発見と確信し、なぜ公表を遅らせたのかについては、当事者の回想の間に食い違いがある。","sources":[{"title":"Wikipedia: J/psi meson","url":"https://en.wikipedia.org/wiki/J/psi_meson"}]},{"date":"1983-01-25","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"CERN、W粒子の発見を発表","summary":"ルビア率いるUA1実験が、陽子・反陽子衝突の中にW粒子の証拠を確認したと発表した。同年6月にはZ粒子の発見も発表され、いずれも電弱統一理論(理論レイヤー)の予言どおりの質量だった。\n\n反陽子を貯めて冷却するファンデルメーアの技術革新が発見を可能にし、両名は翌1984年にノーベル賞を受賞。欧州が素粒子実験の主導権を米国から取り戻した出来事とも評され、探索の焦点は残るヒッグス粒子へ移っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: W and Z bosons","url":"https://en.wikipedia.org/wiki/W_and_Z_bosons"}]},{"date":"1987-02-23","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"超新星1987Aのニュートリノを検出","summary":"大マゼラン雲で起きた超新星爆発からのニュートリノを、岐阜県神岡のカミオカンデを含む3つの検出器がほぼ同時に捉えた。カミオカンデは11個の事象を時刻とエネルギー付きで記録した。\n\n超新星理論の中核を初めて直接検証した観測であり、ニュートリノで宇宙を見る「ニュートリノ天文学」を開いた。小柴昌俊は2002年にノーベル賞を受賞し、後継機スーパーカミオカンデによる振動発見(1998年)へと日本の実験の系譜が続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: SN 1987A","url":"https://en.wikipedia.org/wiki/SN_1987A"}]},{"date":"1993-10-01","precision":"month","end_date":null,"type":"point","layer":"巨大科学と協力","title":"米国、超伝導超大型加速器(SSC)を中止","summary":"米議会が、テキサス州で建設中だった周長約87kmの加速器SSCの計画中止を決定した。すでに約20億ドルが投じられトンネルの一部も掘られていたが、費用の膨張と冷戦終結後の優先順位の変化が致命傷となった。\n\n素粒子物理の主導権は、より小さい周長27kmのLHCを選んだ欧州へ移る。**巨大科学の成否を決めるのは政治と予算**であることを見せつけた事件であり、以後の大型計画は最初から国際分担を前提に設計されるようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Superconducting Super Collider","url":"https://en.wikipedia.org/wiki/Superconducting_Super_Collider"}]},{"date":"1998-01-01","precision":"year","end_date":"2008-09-10","type":"period","layer":"巨大科学と協力","title":"LHC建設、100か国規模の協力事業に","summary":"CERNで大型ハドロン衝突型加速器(LHC)の建設が進み、2008年9月10日に最初のビーム周回に到達した。周長27kmのトンネルに超伝導磁石を並べ、検出器の建設には日本や米国を含む100を超える国・地域の研究者が参加した。\n\nSSC中止(1993年)後の素粒子物理の希望を一身に背負った計画である。周回の9日後に磁石接続部の事故で1年余り停止する挫折も経て2010年から本格運転に入り、2年後のヒッグス粒子発見の舞台となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Large Hadron Collider","url":"https://en.wikipedia.org/wiki/Large_Hadron_Collider"}]},{"date":"1998-06-05","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ニュートリノ振動の発見","summary":"スーパーカミオカンデのグループが、大気ニュートリノが飛行中に種類を変える「振動」の証拠を岐阜県高山市での国際会議で発表した。振動が起きることは、ニュートリノに質量があることを意味する。\n\n標準模型はニュートリノの質量をゼロと仮定しており、これは**標準模型の綻びを示した初の確かな実験事実**となった。梶田隆章とマクドナルドは2015年にノーベル賞を受賞。質量の起源や宇宙の物質優勢の謎へ続く未解決領域が開かれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Neutrino oscillation","url":"https://en.wikipedia.org/wiki/Neutrino_oscillation"}]},{"date":"2012-07-04","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ヒッグス粒子の発見を発表","summary":"CERNのATLASとCMSの両実験が、質量約125GeVの新粒子の発見を発表した。1964年に提唱されたヒッグス機構(理論レイヤー)が予言する粒子と矛盾しない性質で、その後の測定でも裏づけられた。\n\n標準模型最後の未発見粒子が48年越しに見つかり、翌年アングレールとヒッグスがノーベル賞を受賞した。**半世紀前の理論を数千人の実験が検証する**という、この分野の時間スケールと協力の規模を象徴する到達点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Higgs boson","url":"https://en.wikipedia.org/wiki/Higgs_boson"}]},{"date":"2013-08-23","precision":"day","end_date":null,"type":"point","layer":"巨大科学と協力","title":"ILC、国内候補地に北上山地を選定","summary":"次世代の直線加速器・国際リニアコライダー(ILC)について、日本の研究者組織が国内候補地を岩手県などにまたがる北上山地に一本化した。発見されたばかりのヒッグス粒子を精密測定する「ヒッグス工場」の構想である。\n\nしかし巨額の建設費の国際分担は固まらず、日本政府は誘致の意思表明を保留し続けた。SSC中止(1993年)と同様に、次の一手を決めるのは物理ではなく政治と資金であるという構図が繰り返されている。","detail":null,"credibility":"unverified","credibility_note":"候補地選定は研究者側の決定であり、政府の誘致判断・国際的な費用分担・実現時期はいずれも未確定のままである。","sources":[{"title":"Wikipedia: 国際リニアコライダー","url":"https://ja.wikipedia.org/wiki/%E5%9B%BD%E9%9A%9B%E3%83%AA%E3%83%8B%E3%82%A2%E3%82%B3%E3%83%A9%E3%82%A4%E3%83%80%E3%83%BC"}]},{"date":"2021-04-07","precision":"day","end_date":null,"type":"point","layer":"実験と加速器","title":"ミューオンg-2、標準模型とのずれを報告","summary":"米フェルミ研究所のMuon g-2実験が、ミューオンの磁気異常の測定値が標準模型の予測と食い違うとする最初の結果を発表した。先行するブルックヘブンの測定とも一致し、ずれの統計的有意性が高まった。\n\n未知の粒子の兆候かと注目されたが、同時期に格子QCDによる新しい理論計算が実験値に近い値を示し、**ずれているのは自然か、それとも理論計算か**という論争になった。標準模型の先を探る現在進行形の戦線である。","detail":null,"credibility":"disputed","credibility_note":"実験値と理論値の乖離は、理論側の計算手法(データ駆動法と格子QCD)の間の不一致が未解決のため、新物理の証拠かどうか結論が出ていない。","sources":[{"title":"Wikipedia: Muon g-2","url":"https://en.wikipedia.org/wiki/Muon_g-2"}]},{"date":"2025-03-31","precision":"day","end_date":null,"type":"point","layer":"巨大科学と協力","title":"CERN、次期加速器FCCの実現可能性報告","summary":"CERNが周長約91kmの次期円形加速器FCCの実現可能性調査の最終報告をまとめた。まず電子・陽電子衝突でヒッグス粒子を精密測定し、将来は陽子衝突で未知の高エネルギー領域を探る二段構えの構想である。\n\n建設費は第1段階だけで150億スイスフラン規模とされ、承認は加盟国の判断に委ねられる。1954年の設立以来続いてきた国際協力の枠組みが、数十年がかりの次の賭けに踏み出せるかが問われている。","detail":null,"credibility":"unverified","credibility_note":"報告書は構想段階の計画であり、費用見積りと建設の可否・時期は未承認・未確定。公表日は報道に基づく。","sources":[{"title":"Wikipedia: Future Circular Collider","url":"https://en.wikipedia.org/wiki/Future_Circular_Collider"}]}]},{"slug":"science-renewable-energy","title":"再生可能エネルギー史","description":"1839年の光起電力効果の発見から世界の電力の3割へ。技術の芽、産業と価格の変動、政策の後押しの3層を重ね、再生可能エネルギーが補助輪を外すまでの長い道のりを追う。","category":"science-nature","language":"ja","start_year":1839,"end_year":2024,"layers":[{"name":"技術の芽","color":"green"},{"name":"産業と価格","color":"orange"},{"name":"政策と社会","color":"blue"}],"events":[{"date":"1839-01-01","precision":"year","end_date":null,"type":"point","layer":"技術の芽","title":"ベクレル、光起電力効果を発見","summary":"フランスの19歳の物理学者エドモン・ベクレルが、電解液に浸した電極に光を当てると電流が生じる現象を報告した。光を電気に変える太陽電池の原理につながる、最初の観察とされる。\n\n実用にはほど遠く、シリコン太陽電池(1954年)まで115年を要した。**原理の発見から産業になるまでの時間差**は本年表を貫く主題である。なお、放射能を発見した孫のアンリ・ベクレルの方が後世には有名になった。","detail":null,"credibility":"disputed","credibility_note":"ベクレルが観察した現象は今日の半導体の光起電力効果とは機構が異なる光電気化学反応であり、「太陽電池の起源」とみなせるかには学説上の幅がある。","sources":[{"title":"Wikipedia: Edmond Becquerel","url":"https://en.wikipedia.org/wiki/Edmond_Becquerel"}]},{"date":"1887-07-01","precision":"month","end_date":null,"type":"point","layer":"技術の芽","title":"ブライス、風車による発電に成功","summary":"スコットランドのジェームズ・ブライスが自宅の庭に風車を建て、蓄電池への充電に成功した。翌1888年には米国のブラッシュも自邸で大型風車による発電を始めており、風力発電の実質的な誕生期にあたる。\n\nブライスが余った電力を村に提供しようと申し出たところ「悪魔の仕業」と断られたという逸話が残る。風力が発電の主役級へ育つのは、約1世紀後のデンマークの産業化と洋上風力(1991年)を待つことになる。","detail":null,"credibility":"disputed","credibility_note":"「世界初の風力発電」をブライス(1887年)とブラッシュ(1888年)のどちらに帰すかは、規模や連続運転などの定義によって記述が分かれる。","sources":[{"title":"Wikipedia: James Blyth (engineer)","url":"https://en.wikipedia.org/wiki/James_Blyth_(engineer)"}]},{"date":"1954-04-25","precision":"day","end_date":null,"type":"point","layer":"技術の芽","title":"ベル研究所、シリコン太陽電池を発表","summary":"米ベル研究所が変換効率約6%のシリコン太陽電池を発表した。おもちゃの観覧車やラジオを動かす実演が行われ、報道は無尽蔵の太陽エネルギー利用の始まりと持ち上げた。\n\nしかし高価すぎて地上の用途は開けず、最初の顧客は電池交換のできない人工衛星だった(1958年のヴァンガード1号)。宇宙という特殊市場が技術を存続させ、地上での価格低下(産業と価格レイヤー)を待つ構図が数十年続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Solar cell","url":"https://en.wikipedia.org/wiki/Solar_cell"}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"政策と社会","title":"第一次石油危機","summary":"第四次中東戦争を機にアラブ産油国が原油の減産と禁輸を発動し、原油価格は数か月で約4倍に高騰した。石油に依存しきった先進国の経済は大きな打撃を受けた。\n\n**エネルギーを他国に握られる恐怖**が、代替エネルギー研究への公的投資を初めて本格化させた。日本のサンシャイン計画(1974年)や米国の太陽エネルギー研究所の設立など、現在の再エネ技術の源流の多くがこの危機に発している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1973 oil crisis","url":"https://en.wikipedia.org/wiki/1973_oil_crisis"}]},{"date":"1979-06-20","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"カーター、ホワイトハウスに太陽熱パネル","summary":"カーター米大統領がホワイトハウスの屋根に32枚の太陽熱温水パネルを設置し、2000年までにエネルギーの2割を太陽由来にするという目標を掲げた。第二次石油危機の最中の象徴的な行動だった。\n\nパネルは石油価格が下落した後の1986年、レーガン政権下で撤去された。再エネ政策が**政権交代のたびに揺れる**ことを示す最初の分かりやすい例であり、同じ構図は2010年代以降の米国でも繰り返されることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Scientific American: Where Did the Carter White House's Solar Panels Go? (2010)","url":null}]},{"date":"1981-01-01","precision":"year","end_date":"1986-12-31","type":"period","layer":"産業と価格","title":"カリフォルニア風力ラッシュ","summary":"石油危機後の手厚い税制優遇を追い風に、カリフォルニア州の峠に数千基規模の風車が林立した。当時の世界の風力発電容量の大半が同州に集中する、異常な集積だった。\n\n優遇の失効と油価の下落でブームは崩壊し、粗製乱造された風車の残骸は再エネ懐疑論の格好の材料になった。一方で着実に改良を重ねたデンマークの製造業者が生き残り、風力産業の主導権は欧州へ移る。補助金の設計が産業の質を左右する教訓例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Altamont Pass Wind Farm","url":"https://en.wikipedia.org/wiki/Altamont_Pass_Wind_Farm"}]},{"date":"1991-01-01","precision":"year","end_date":null,"type":"point","layer":"技術の芽","title":"世界初の洋上風力発電所ヴィンデビー","summary":"デンマーク沖に世界初の洋上風力発電所ヴィンデビーが完成した。450kW機11基、合計約5MWという小規模ながら、風況が良く土地の制約もない海の上へ風車を進出させた最初の一歩である。\n\n実証を積み重ねるデンマークの漸進主義は、ブームと崩壊を繰り返したカリフォルニア(産業と価格レイヤー)と対照をなす。洋上風力はその後、北海を中心に主力電源級へ成長し、ヴィンデビーは2017年に役目を終えて解体された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Vindeby Offshore Wind Farm","url":"https://en.wikipedia.org/wiki/Vindeby_Offshore_Wind_Farm"}]},{"date":"1997-12-11","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"京都議定書を採択","summary":"気候変動枠組条約の第3回締約国会議(COP3)が京都で開かれ、先進国に温室効果ガスの削減義務を課す京都議定書が採択された。気候変動対策が国際法上の義務になった最初の枠組みである。\n\n削減義務の存在は、再エネを「環境に良い選択肢」から「義務履行の手段」へと変えた。各国の導入支援策が2000年前後に出揃う下地となり、世界の太陽光市場を作ったドイツの固定価格買取制度(2000年)へ直結する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kyoto Protocol","url":"https://en.wikipedia.org/wiki/Kyoto_Protocol"}]},{"date":"2000-04-01","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"ドイツ、再エネ固定価格買取制度(EEG)","summary":"ドイツで再生可能エネルギー法(EEG)が施行され、再エネ電力を20年間固定価格で買い取ることが電力会社に義務づけられた。発電した分だけ確実に収入になる仕組みが、個人や農家までも発電事業者に変えた。\n\n生まれた巨大な需要は太陽電池の量産投資を誘発し、後に中国メーカーの規模拡大(産業と価格レイヤー)を通じて世界の価格を押し下げた。**一国の制度設計が世界の価格曲線を動かした**例として政策史の画期とされる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: German Renewable Energy Sources Act","url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act"}]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"技術の芽","title":"宮坂力ら、ペロブスカイト太陽電池を報告","summary":"桐蔭横浜大学の宮坂力らが、ペロブスカイト結晶を光吸収材に使う新型太陽電池を論文で報告した。当初の変換効率はわずか3.8%だった。\n\n塗って作れる軽く曲げられる電池として2012年ごろから効率が急伸し、研究レベルではシリコンに迫る25%超へ達した。ビルの壁面や耐荷重の小さい屋根など設置場所を一気に広げうる次世代の本命として、日本発の技術の産業化競争(産業と価格レイヤー)が現在も進行中である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Perovskite solar cell","url":"https://en.wikipedia.org/wiki/Perovskite_solar_cell"}]},{"date":"2011-06-30","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"ドイツ、脱原発と再エネ転換を決定","summary":"福島第一原発事故を受けて、ドイツ連邦議会が2022年までの原発全廃を圧倒的多数で可決した。再エネを電力供給の柱に据える「エネルギーヴェンデ(転換)」の加速が国策として確定した。\n\n遠い国の事故という外生的な出来事が、一国のエネルギー構成を転換させた事例である。移行期の石炭依存や電力価格の上昇といった代償も大きく、脱原発と脱炭素の優先順位をめぐる論争は世界の再エネ政策に影響を与え続けた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Energiewende","url":"https://en.wikipedia.org/wiki/Energiewende"}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"米ソリンドラ破綻、価格競争の象徴に","summary":"米政府の債務保証を受けていた新興太陽電池メーカーのソリンドラが経営破綻した。シリコンを使わない円筒形パネルという独自技術は、シリコン価格の暴落によって競争力の前提を失った。\n\n破綻は米政界で再エネ支援策への攻撃材料となったが、背景にあったのは中国メーカーの大増産による太陽電池の世界的な値崩れである。**価格下落は産業の淘汰と普及を同時に進める**という、この時期の太陽光の二面性を象徴する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Solyndra","url":"https://en.wikipedia.org/wiki/Solyndra"}]},{"date":"2012-07-01","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"日本、再エネ固定価格買取制度を開始","summary":"福島第一原発事故後のエネルギー政策見直しの中で、日本でも再エネの固定価格買取制度(FIT)が始まった。高めに設定された買取価格を追って、メガソーラーの建設が全国で殺到した。\n\n太陽光の導入量は数年で世界有数の規模となった一方、電気料金への賦課金の膨張や山林開発をめぐる摩擦も生み、入札制への移行(2017年以降)につながった。ドイツ(2000年)が先にたどった軌跡を、短期間に圧縮して繰り返した形である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"資源エネルギー庁: 再生可能エネルギー固定価格買取制度","url":null}]},{"date":"2015-12-12","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"パリ協定を採択","summary":"COP21で、産業革命前からの気温上昇を2℃より十分低く、できれば1.5℃に抑えることを目指すパリ協定が採択された。途上国を含む全ての国が削減目標を掲げる、初の普遍的な枠組みである。\n\n今世紀後半の実質排出ゼロが長期目標となったことで、再エネは移行の中心手段と位置づけられ、企業の投資判断や金融の基準にまで浸透していく。義務型の京都議定書(1997年)から、自主目標を積み上げる方式への転換でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Paris Agreement","url":"https://en.wikipedia.org/wiki/Paris_Agreement"}]},{"date":"2016-09-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"太陽光入札、当時最安級の価格が相次ぐ","summary":"アブダビの発電事業入札で1kWh当たり2.42米セントという当時世界最安水準の太陽光の応札価格が報じられた。この前後、中東や中南米で最安記録の更新が相次いだ。\n\n補助金なしでも化石燃料と競える水準に達したことを市場自身が示した局面である。ただしこれらの数字は日照や金利、土地条件が揃った案件の値であり、単純な国際比較はできない。それでも価格の向かう方向は誰の目にも明らかになった。","detail":null,"credibility":"unverified","credibility_note":"入札価格は報道ベースであり、契約条件や補助の有無が案件ごとに異なるため「最安記録」の比較には幅がある。","sources":[{"title":"PV Magazine等による2016年アブダビ・スウェイハン入札の報道","url":null}]},{"date":"2019-10-09","precision":"day","end_date":null,"type":"point","layer":"技術の芽","title":"リチウムイオン電池にノーベル化学賞","summary":"リチウムイオン電池を開発したグッドイナフ、ウィッティンガム、吉野彰の3氏にノーベル化学賞が贈られた。授賞理由には、化石燃料に依存しない社会を可能にする基盤という位置づけが明記された。\n\n天候で出力が変わる太陽光・風力を使いこなす鍵は蓄電にある。電気自動車の量産が電池価格を押し下げる好循環(産業と価格レイヤー)が2010年代に確立し、1970年代の石油危機に始まった研究が再エネの弱点を埋める形で結実した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Chemistry 2019","url":"https://www.nobelprize.org/prizes/chemistry/2019/summary/"}]},{"date":"2020-10-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"IEA「太陽光は史上最も安い電力」","summary":"国際エネルギー機関(IEA)が年次報告書の世界エネルギー見通しで、好条件の太陽光発電を「歴史上最も安い電力源」と表現した。再エネの成長を長年保守的に見積もってきた同機関の転換として注目された。\n\nベクレルの発見(1839年)から181年、ベル研の電池(1954年)から66年での到達である。以後の争点は発電コストそのものから、送電網への統合や蓄電といった変動対策(技術の芽レイヤー)へと移っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IEA: World Energy Outlook 2020","url":"https://www.iea.org/reports/world-energy-outlook-2020"}]},{"date":"2022-08-16","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"米インフレ抑制法(IRA)成立","summary":"気候・エネルギー対策に約3700億ドルを投じる米インフレ抑制法が成立した。税額控除を軸に、再エネ発電から蓄電池や部材の製造まで国内投資を誘導する、米国史上最大の気候立法である。\n\n規制や炭素価格ではなく補助で産業を自国に呼び込む設計は、各国の産業政策競争を誘発した。再エネが気候対策であると同時に**産業の主導権争いの主戦場**になったことを象徴する。政権交代による見直しという米国特有のリスクも残った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Inflation Reduction Act","url":"https://en.wikipedia.org/wiki/Inflation_Reduction_Act"}]},{"date":"2023-12-13","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"COP28、再エネ3倍と脱化石燃料を合意","summary":"ドバイでのCOP28で、2030年までに世界の再エネ容量を3倍にする目標と、エネルギーシステムにおける「化石燃料からの脱却」が初めて合意文書に明記された。\n\n産油国での開催でこの文言が入ったことは象徴的だが、法的拘束力はなく、実現は各国の実行にかかっている。目標達成には送電網の増強と資金、とりわけ途上国への投資という壁が残ると、採択の当日から指摘されていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2023 United Nations Climate Change Conference","url":"https://en.wikipedia.org/wiki/2023_United_Nations_Climate_Change_Conference"}]},{"date":"2024-05-01","precision":"month","end_date":null,"type":"point","layer":"産業と価格","title":"世界の発電量の30%が再エネに","summary":"エネルギー分野のシンクタンクのエンバーが、2023年に世界の発電量に占める再エネの比率が初めて30%を超えたとする分析を公表した。伸びを牽引したのは水力ではなく太陽光と風力である。\n\n分析は各国統計の集計と推計を含む速報値だが、方向は明確である。1839年の実験室の現象は185年で世界の電力の3分の1近くを担うに至り、焦点は「増やせるか」から「どこまで速く置き換えられるか」へ移った。","detail":null,"credibility":"unverified","credibility_note":"30%超という比率はエンバーの集計・推計に基づく速報値であり、確定統計では数値が改定されうる。","sources":[{"title":"Ember: Global Electricity Review 2024","url":null}]}]},{"slug":"science-vaccines","title":"ワクチン開発の歴史","description":"ジェンナーの種痘からmRNAワクチンまで230年。科学の突破、感染症と社会の反応、制度と公衆衛生の整備の3層を重ね、ワクチンが一人の発明から社会の基盤へ変わる過程を追う年表。","category":"science-nature","language":"ja","start_year":1796,"end_year":2023,"layers":[{"name":"科学と技術","color":"blue"},{"name":"感染症と社会","color":"orange"},{"name":"制度と公衆衛生","color":"teal"}],"events":[{"date":"1796-05-14","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"ジェンナーが少年に牛痘を接種、種痘の起点","summary":"英国の医師エドワード・ジェンナーが、8歳の少年ジェームズ・フィップスに牛痘を接種し、のちに天然痘への抵抗力が生じたことを確認した。人為的に免疫を付与する方法の最初の体系的な実証とされる。\n\n牛痘接種自体は農夫ベンジャミン・ジェスティらの先行例が知られるが、観察を実験と論文にまとめて医学界に届けた点がジェンナーの功績である。種痘は急速に各国へ広がり、1853年の英国での義務化(制度と公衆衛生レイヤー)につながっていく。","detail":null,"credibility":"disputed","credibility_note":"「世界初のワクチン接種」という位置づけには、1774年のベンジャミン・ジェスティら先行例をめぐって諸説がある。","sources":[{"title":"Wikipedia: Edward Jenner","url":"https://en.wikipedia.org/wiki/Edward_Jenner"}]},{"date":"1853-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"英国で種痘法成立、乳児への接種を義務化","summary":"英国で1853年種痘法が成立し、乳児への天然痘ワクチン接種が罰則付きで義務づけられた。国家が国民に予防接種を義務として課した初期の代表例である。\n\n直後から**接種の義務化と反対運動**が対になって現れ、反ワクチン同盟の結成や「良心的拒否」条項の追加(1898年)を生んだ。ワクチンが個人の医療から公衆衛生の制度へ変わる出発点であり、感染症と社会レイヤーで繰り返される忌避運動の原型もここにある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Vaccination Act","url":"https://en.wikipedia.org/wiki/Vaccination_Act"}]},{"date":"1885-07-06","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"パスツールが狂犬病ワクチンを少年に接種","summary":"ルイ・パスツールが弱毒化した狂犬病ワクチンを、狂犬に咬まれた9歳の少年ジョゼフ・マイステルに接種し、発症を防いだ。実験室で病原体を弱毒化してワクチンを作る、近代的な開発手法の最初の劇的な成功である。\n\nジェンナーの種痘が自然界に存在する牛痘に依存したのに対し、病原体を人為的に改変して免疫原にするという原理の転換だった。この成功は1888年のパスツール研究所設立(制度と公衆衛生レイヤー)と、世界に広がる研究所網の礎となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Louis Pasteur","url":"https://en.wikipedia.org/wiki/Louis_Pasteur"}]},{"date":"1890-12-04","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"ベーリングと北里が血清療法を発表","summary":"エミール・ベーリングと北里柴三郎が血清療法の論文を発表した。ジフテリアと破傷風の毒素に対する「抗毒素」が動物の血清中に生じることを示し、免疫という現象の実体に初めて迫った。\n\nワクチンが「なぜ効くのか」を説明する免疫学の出発点であり、のちの抗体医薬にも連なる発見である。1901年の第1回ノーベル生理学・医学賞はベーリング単独に授与され、共同研究者だった北里の貢献の評価をめぐる議論は現在まで続いている。","detail":null,"credibility":"disputed","credibility_note":"共同研究における北里柴三郎の貢献の位置づけと、ノーベル賞がベーリング単独授与となった経緯については評価が分かれている。","sources":[{"title":"Wikipedia: Emil von Behring","url":"https://en.wikipedia.org/wiki/Emil_von_Behring"}]},{"date":"1918-03-01","precision":"month","end_date":"1920-04-30","type":"period","layer":"感染症と社会","title":"スペインかぜ大流行、ワクチンなき最後の大災禍","summary":"H1N1型インフルエンザが世界的に大流行し、世界人口の3割前後が感染、死者は1700万人から1億人と推定される。当時はインフルエンザウイルスの分離すらできておらず、有効なワクチンは存在しなかった。\n\n「病原体が分からないまま流行が過ぎ去る」最後の世界的大流行となり、各国の公衆衛生体制と国際協調(制度と公衆衛生レイヤー)の必要性を刻んだ。流行の最中にワクチンが作られた約1世紀後の新型コロナと、鮮明な対をなす出来事である。","detail":null,"credibility":"disputed","credibility_note":"死者数は推計手法により1700万人から1億人まで大きな幅があり、流行の発生地についても米国起源説など諸説ある。","sources":[{"title":"Wikipedia: Spanish flu","url":"https://en.wikipedia.org/wiki/Spanish_flu"}]},{"date":"1921-07-01","precision":"month","end_date":null,"type":"point","layer":"科学と技術","title":"BCGワクチン、パリで初めて新生児に投与","summary":"カルメットとゲランが13年かけて230代以上継代培養し弱毒化したウシ型結核菌(BCG)が、パリで初めて新生児に投与された。当時最大の死因の一つだった結核に対する、初のワクチンである。\n\n実験室での長期培養によって弱毒株を「育てた」点で、パスツール流の方法論の到達点だった。1930年のリューベック事故で信頼が大きく揺らぎながらも、戦後はWHOとユニセフの大規模接種事業(制度と公衆衛生レイヤー)を通じて世界で最も広く接種されるワクチンとなる。","detail":null,"credibility":"unverified","credibility_note":"初回投与の正確な日付は資料により記載が異なり、1921年7月とする文献が多いものの確定的な一次記録は確認できていない。","sources":[{"title":"Wikipedia: BCG vaccine","url":"https://en.wikipedia.org/wiki/BCG_vaccine"}]},{"date":"1948-04-07","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"世界保健機関(WHO)が発足","summary":"国連の専門機関として世界保健機関(WHO)が発足した。憲章発効日の4月7日はのちに「世界保健デー」となる。感染症対策を国家単位の事業から国際協調の枠組みへ移す拠点が生まれた。\n\n種痘の国際的な調整はここから本格化し、1959年の根絶決議、1967年の根絶強化計画を経て、1980年の天然痘根絶宣言(感染症と社会レイヤー)へ至る。ワクチンを世界に「配る」制度の中心が確立した出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"WHO: Constitution of the World Health Organization","url":"https://www.who.int/about/governance/constitution"}]},{"date":"1955-04-12","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"ソークのポリオワクチン、有効性が発表される","summary":"フランシス報告により、ソークの不活化ポリオワクチンが大規模野外試験で有効と発表された。約180万人の児童が参加した史上最大級の臨床試験の結果であり、ポリオに怯えていた米国は祝賀に沸いた。\n\n発表はラジオで中継され、各地で教会の鐘が鳴らされたと伝えられる社会的事件で(感染症と社会レイヤー)、ワクチンへの公的信頼が頂点にあった瞬間といえる。しかしわずか2週間後、カッター事故が製造管理体制の未熟さを露呈することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Polio vaccine","url":"https://en.wikipedia.org/wiki/Polio_vaccine"}]},{"date":"1955-04-27","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"カッター事故、ワクチン規制強化の転機に","summary":"カッター研究所製の不活化ポリオワクチンに、不活化が不十分な生きたウイルスが混入していたことが判明し、接種した子どもらに麻痺患者と死者が出た。政府は同社製品を回収し、接種計画は一時停止された。\n\n事故調査を通じて連邦政府によるワクチンの品質管理と規制の体制が抜本的に強化され、後の生物製剤監督制度の原型となった。**失敗が制度を作る**という、この年表で繰り返される構図の最初の明確な事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cutter incident","url":"https://en.wikipedia.org/wiki/Cutter_incident"}]},{"date":"1961-07-01","precision":"month","end_date":null,"type":"point","layer":"感染症と社会","title":"日本、ポリオ生ワクチンを緊急輸入し一斉投与","summary":"日本でポリオ患者が急増する中、母親たちを中心とする世論の強い要求を受け、政府はソ連・カナダから経口生ワクチン約1300万人分を緊急輸入し、全国一斉投与に踏み切った。患者数は翌年から激減した。\n\n通常の薬事手続きを超えた政治判断で接種が実現した例であり、市民運動が制度(制度と公衆衛生レイヤー)を動かした出来事として記憶される。以後、日本のポリオ定期接種の起点となった。","detail":null,"credibility":"unverified","credibility_note":"緊急輸入の数量は約1300万人分とする資料が多いが文献により幅があり、投与実績の集計も資料間で異なる。","sources":[{"title":"厚生労働省・国立感染症研究所によるポリオ(急性灰白髄炎)関連資料","url":null}]},{"date":"1974-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"WHOが拡大予防接種計画(EPI)を開始","summary":"WHOが拡大予防接種計画(EPI)を開始し、結核・ジフテリア・百日咳・破傷風・ポリオ・麻疹の6疾病のワクチンを、世界のすべての子どもに届けるという目標を掲げた。\n\n当時の途上国での接種率は5%程度とされ、ワクチンの存在ではなく**すべての子どもに届ける仕組み**こそが課題であることを国際保健の中心に据えた。のちのGAVIワクチンアライアンス(2000年)やCOVAX(2020年)も、この枠組みの延長線上にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"WHO: Essential Programme on Immunization","url":null}]},{"date":"1980-05-08","precision":"day","end_date":null,"type":"point","layer":"感染症と社会","title":"WHOが天然痘の世界根絶を宣言","summary":"WHO総会が天然痘の世界根絶を宣言した。ジェンナーの種痘から184年、天然痘は**人類が計画的に根絶した最初の感染症**となった。最後の自然感染例は1977年のソマリアで確認されている。\n\nサーベイランスと包囲接種という戦略、凍結乾燥ワクチンと分岐針という技術、WHOという制度(制度と公衆衛生レイヤー)の三者がそろって初めて達成された。ワクチンの力を示す金字塔である一方、以後「根絶」は麻疹でもポリオでも達成できていない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Smallpox","url":"https://en.wikipedia.org/wiki/Smallpox"}]},{"date":"1998-02-28","precision":"day","end_date":null,"type":"point","layer":"感染症と社会","title":"MMRと自閉症を結びつけた論文、忌避の起点に","summary":"英国の医師ウェイクフィールドらが、MMRワクチンと自閉症の関連を示唆する論文をランセット誌に発表した。のちに研究不正が認定され、2010年に論文は撤回、本人は医籍を抹消された。\n\n撤回までの12年間に英国などでMMR接種率が大きく低下し、麻疹の再流行を招いた。科学的には完全に否定された主張が、SNS時代の**ワクチン忌避**の中核的な言説として生き残り続ける、その起点となった出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Lancet MMR autism fraud","url":"https://en.wikipedia.org/wiki/Lancet_MMR_autism_fraud"}]},{"date":"2006-06-08","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"FDAが初のHPVワクチンを承認","summary":"米FDAが初のヒトパピローマウイルス(HPV)ワクチン「ガーダシル」を承認した。子宮頸がんの主因となるウイルス型の感染を防ぐ、「がんを予防するワクチン」の実用化である。\n\n感染症対策の枠を超えてがん対策にワクチンが組み込まれた転換点で、豪州など早期導入国では前がん病変の減少が確認されていく。一方、日本では2013年に積極的勧奨が中止され(制度と公衆衛生レイヤー)、普及の明暗が国によって大きく分かれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gardasil","url":"https://en.wikipedia.org/wiki/Gardasil"}]},{"date":"2013-06-14","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"日本、HPVワクチンの積極的勧奨を中止","summary":"厚生労働省が、接種後の多様な症状の報告を受けてHPVワクチンの積極的勧奨を一時差し控えた。定期接種の位置づけは維持されたものの、接種率は70%前後から1%未満へ急落した。\n\nその後の疫学研究で症状とワクチンの因果関係は支持されず、2022年4月に勧奨は再開されたが、約9年の空白は対象世代で防げたはずの子宮頸がんを増やすと推計されている。科学・制度・社会(感染症と社会レイヤー)の緊張関係が凝縮した事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: HPVワクチンの積極的勧奨差し控えに関する勧告(2013年6月14日)","url":null}]},{"date":"2020-01-30","precision":"day","end_date":"2023-05-05","type":"period","layer":"感染症と社会","title":"新型コロナのパンデミック(緊急事態宣言期間)","summary":"新型コロナウイルス感染症が世界的に流行し、WHOは2020年1月30日に「国際的に懸念される公衆衛生上の緊急事態」を宣言、2023年5月5日に終了を発表した。確認された死者は690万人を超え、超過死亡は1500万人前後と推計される。\n\nスペインかぜから約1世紀、今回は流行の最中にワクチンが開発・接種された初の世界的大流行となり、mRNA技術の実力(科学と技術レイヤー)と分配の不平等(制度と公衆衛生レイヤー)の両方を可視化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: COVID-19 pandemic","url":"https://en.wikipedia.org/wiki/COVID-19_pandemic"}]},{"date":"2020-12-02","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"英国がmRNAワクチンを世界に先駆け承認","summary":"英国の規制当局MHRAがファイザー・ビオンテックのmRNAワクチンを承認し、西側諸国で初の新型コロナワクチン実用化となった。8日後には90歳の女性が臨床試験外で世界初の接種を受けた。\n\nウイルスの遺伝子配列公開から約11か月、**着手から1年未満での実用化**は「ワクチン開発は10年仕事」という常識を覆した。カリコらの基礎研究、各国政府の先行購入という資本、緊急承認という制度(制度と公衆衛生レイヤー)の総和だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pfizer–BioNTech COVID-19 vaccine","url":"https://en.wikipedia.org/wiki/Pfizer%E2%80%93BioNTech_COVID-19_vaccine"}]},{"date":"2021-02-24","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"COVAX初の供給便がガーナに到着","summary":"ワクチンの共同購入・分配の国際枠組みCOVAXによる初の供給便が、ガーナの首都アクラに到着した。高所得国による買い占めに対し、途上国にも公平にワクチンを届けることを目指す仕組みである。\n\nしかし2021年の供給目標20億回分は大幅な未達に終わり、先進国でブースター接種が進む一方、低所得国の接種率が1桁台にとどまる時期が続いた。**分配の不平等**が、技術ではなく制度の限界として刻まれた出来事である。","detail":null,"credibility":"unverified","credibility_note":"供給実績や各国の接種率の数値は、GaviやWHOの自己報告と推計に基づいており、集計時点や定義により幅がある。","sources":[{"title":"Gavi/WHO/UNICEF: COVAX共同声明・供給実績報告","url":null}]},{"date":"2021-10-06","precision":"day","end_date":null,"type":"point","layer":"制度と公衆衛生","title":"WHOが初のマラリアワクチンを推奨","summary":"WHOがマラリアワクチンRTS,S(モスキリックス)について、サハラ以南アフリカなどの子どもへの広範な使用を初めて推奨した。寄生虫による感染症に対する、世界初の実用ワクチンである。\n\n有効率は3割程度と高くないが、患者数の膨大さから公衆衛生上の効果は大きいと判断された。30年を超えた開発は官民連携の資金で支えられ、市場原理だけでは進まないワクチン開発を制度が支えた例として、COVAXと同じ文脈に置かれる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: RTS,S","url":"https://en.wikipedia.org/wiki/RTS,S"}]},{"date":"2023-10-02","precision":"day","end_date":null,"type":"point","layer":"科学と技術","title":"カリコとワイスマンにノーベル生理学・医学賞","summary":"mRNAワクチンを可能にした塩基修飾の発見により、カタリン・カリコとドリュー・ワイスマンにノーベル生理学・医学賞が授与された。授賞理由は新型コロナワクチン開発への貢献を明示した。\n\nカリコの研究は長年資金難と降格の中で続けられ、鍵となる2005年の論文も当初はほとんど注目されなかった。パンデミックという需要が**基礎研究の長い助走**を一気に社会実装へ変えた、この年表の締めくくりにふさわしい逆転劇である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NobelPrize.org: The Nobel Prize in Physiology or Medicine 2023","url":"https://www.nobelprize.org/prizes/medicine/2023/press-release/"}]}]},{"slug":"tech-5g-6g","title":"5G/6G通信の進化","description":"通信の世代交代は技術だけでは進まない。国際標準化・事業者の市場競争・各国の政策と地政学の3層を重ね、5Gの理想と現実、そして6Gへの助走を俯瞰する年表。","category":"technology","language":"ja","start_year":2015,"end_year":2026,"layers":[{"name":"技術と標準化","color":"blue"},{"name":"事業者と市場","color":"orange"},{"name":"政策と地政学","color":"teal"}],"events":[{"date":"2015-09-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"ITU-Rが5Gビジョン勧告「IMT-2020」を承認","summary":"国際電気通信連合の無線通信部門が勧告M.2083を承認し、高速大容量・超低遅延・多数同時接続という5Gの3つの利用シナリオと、2020年頃の実用化という目標を国際的に定めた。\n\n通信の世代交代は各社の発明の積み上げではなく、**国際的な目標設定から逆算して進む**。以後は3GPPが仕様策定を担い、各国が周波数割当と免許で追走する。本年表の3層構造が動き出す起点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ITU-R勧告 M.2083: IMT Vision - Framework and overall objectives of the future development of IMT for 2020 and beyond","url":"https://www.itu.int/rec/R-REC-M.2083"}]},{"date":"2017-12-21","precision":"day","end_date":null,"type":"point","layer":"技術と標準化","title":"3GPPが最初の5G NR仕様(NSA)を完成","summary":"標準化団体3GPPがリスボン会合で、4Gのコアネットワークに5G無線を組み合わせるノンスタンドアロン(NSA)方式の仕様をRelease 15の一部として完成させた。最初の5G標準の確定である。\n\n早期商用化を急ぐ主要事業者(事業者と市場レイヤー)の要望を受け、当初計画から前倒しで策定された経緯があり、標準化のスケジュールそのものが各国・各社の競争の対象であることを示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP発表: First 5G NR specs approved (2017-12-21)","url":null}]},{"date":"2018-06-14","precision":"day","end_date":null,"type":"point","layer":"技術と標準化","title":"Release 15完成、単独運用できる5G標準が確定","summary":"3GPPが米サンディエゴ近郊の会合で、5G専用コアネットワークを含むスタンドアロン(SA)方式の仕様を承認し、Release 15として完全な5G標準の初版が揃った。\n\nこれを受けて機器開発と各国の周波数オークション(事業者と市場・政策レイヤー)が本格化する。ただし実際の商用サービスは当面NSA方式で始まり、SA方式への移行は当初の想定より長い時間を要することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP発表: Release 15 SA仕様承認 (2018-06)","url":null}]},{"date":"2019-04-03","precision":"day","end_date":null,"type":"point","layer":"事業者と市場","title":"韓国と米国が「世界初の5G商用化」を競う","summary":"韓国の通信3社が4月3日夜に一般向け5Gサービスを一斉に開始し、米Verizonも予定を繰り上げて同日の開始を発表。「世界初の5G商用化」の座を両国が争った。\n\n開始時刻を繰り上げてまで初物の称号を奪い合った背景には、5Gを国家と企業のブランドに使う思惑がある。**「世界初」争いそのものが5Gの政治性**を象徴しており、通信世代が国力の指標として扱われる時代の幕開けだった。","detail":null,"credibility":"disputed","credibility_note":"どちらが「世界初」かは、開始時刻の定義や対象(一般向けか限定提供か)によって主張が分かれている。","sources":[{"title":"韓国科学技術情報通信部発表・Reuters報道 (2019-04)","url":null}]},{"date":"2019-05-15","precision":"day","end_date":null,"type":"point","layer":"政策と地政学","title":"米国がファーウェイへ事実上の禁輸措置","summary":"米政権が情報通信サプライチェーンを守るとする大統領令に署名し、商務省はファーウェイをエンティティリストへ追加すると発表。米国由来の技術・部品の供給が原則許可制となった。\n\n5G基地局シェア首位の企業を狙い撃つ措置は、通信インフラが**安全保障の最前線**になったことを示した。以後、同盟国へ排除への同調圧力が広がり、機器市場の勢力図(事業者と市場レイヤー)を書き換えていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省産業安全保障局(BIS)発表 (2019-05)","url":null}]},{"date":"2019-06-06","precision":"day","end_date":null,"type":"point","layer":"政策と地政学","title":"中国が5G商用免許を交付、国家主導の整備へ","summary":"中国の工業情報化部が通信大手4社に5G商用免許を交付した。米国による制裁発動のわずか3週間後というタイミングで、当初の想定より前倒しの交付と報じられた。\n\n以後、中国は国家主導で基地局整備を進め、数年で世界の5G基地局の過半を占める規模に達する。標準・市場・政策が一体となって動く中国モデルと、同盟国連携で対抗する米国という対立軸がここで固まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中国工業情報化部発表・新華社報道 (2019-06-06)","url":null}]},{"date":"2020-03-25","precision":"day","end_date":null,"type":"point","layer":"事業者と市場","title":"日本で5G商用サービス開始","summary":"NTTドコモが日本初の5G商用サービスを開始し、同じ週にKDDI、ソフトバンクも続いた。当初は都市部のごく限られたスポットからの出発だった。\n\n直後に新型コロナの外出制限が重なり、5Gを体験する機会自体が限られたまま推移する。エリアの狭さと対応端末の少なさから「つながらない5G」との批判も受け、規格への期待と利用実態のギャップが早くも表面化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTTドコモ報道発表 (2020-03-25)","url":null}]},{"date":"2020-04-08","precision":"day","end_date":null,"type":"point","layer":"事業者と市場","title":"楽天モバイル本格開始、完全仮想化網を主張","summary":"楽天モバイルが自社回線での本格サービスを開始。ネットワーク機能をソフトウェアで実現する「世界初の完全仮想化クラウドネイティブ網」を掲げ、単一の低価格プランで市場に参入した。\n\n専用ハードウェアに依存しない構成は、基地局のオープン化(O-RAN)の潮流を先取りするものとして海外の事業者からも注目された。ただし「世界初」という位置づけは同社の発表に基づく主張である。","detail":null,"credibility":"disputed","credibility_note":"「世界初の完全仮想化モバイルネットワーク」は同社の主張であり、仮想化の定義や範囲をめぐって業界内で見解が分かれる。","sources":[{"title":"楽天モバイル報道発表 (2020-04-08)","url":null}]},{"date":"2020-07-14","precision":"day","end_date":null,"type":"point","layer":"政策と地政学","title":"英国が5G網からのファーウェイ排除を決定","summary":"英政府が、2020年末以降のファーウェイ製5G機器の新規購入禁止と、2027年までの既設機器の完全撤去を決定した。同年1月の「限定的に容認」からわずか半年での方針転換だった。\n\n転換の直接の契機は米国による対ファーウェイ半導体規制の強化で、機器の安全性評価の前提が変わったためと説明された。**同盟国の政策が連鎖する構図**が鮮明になり、欧州各国でも排除・制限の決定が続いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"英政府(DCMS)発表 (2020-07-14)","url":null}]},{"date":"2021-02-01","precision":"month","end_date":null,"type":"point","layer":"事業者と市場","title":"米C帯オークション、落札総額約810億ドルで史上最大","summary":"米FCCの周波数オークション(オークション107)で、5Gの本命周波数とされるミッドバンドのC帯免許の落札総額が約810億ドルに達し、過去最大となった。VerizonとAT&Tが大半を投じた。\n\nミリ波偏重だった米国の5G戦略の軌道修正を意味し、周波数という有限資源の配分が市場の勝敗を左右することを改めて示した。巨額の免許料は事業者の投資余力を圧迫し、その後の固定無線(FWA)注力にも影を落とす。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FCC Auction 107 (3.7 GHz Service) 結果公表","url":"https://www.fcc.gov/auction/107"}]},{"date":"2022-01-01","precision":"year","end_date":"2024-12-31","type":"period","layer":"事業者と市場","title":"「期待と現実」の調整期、FWAが想定外の主役に","summary":"各国で5Gエリアは拡大したものの、収益の柱と期待された法人向け用途や自動運転は立ち上がらず、米国では5Gを使った固定無線アクセス(FWA)が家庭向け回線として急伸するという想定外の展開になった。\n\nSA方式への移行も調査会社の推計では想定より遅れ、**華々しい標語と収益の実態の乖離**がこの時期の主題となる。6Gの議論が「5Gの反省」から始まる素地は、この数年間に形づくられた。","detail":null,"credibility":"unverified","credibility_note":"SA移行率やFWA契約数は調査会社・事業者発表による推計値で、業界全体の確定的な統計は存在しない。","sources":[{"title":"Ericsson Mobility Report","url":"https://www.ericsson.com/en/reports-and-papers/mobility-report"}]},{"date":"2022-06-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"Release 17完成、衛星通信と省電力IoTを標準に","summary":"3GPPがRelease 17を完成させ、衛星を経由して5G端末と直接通信するNTN(非地上系ネットワーク)や、簡易なIoT端末向けのRedCapが携帯電話の標準仕様に加わった。\n\n地上基地局を前提に発展してきた携帯標準が宇宙へ拡張された画期であり、スマートフォンと衛星の直接通信への道を開いた。5Gの「完成度を上げる」段階から「適用範囲を広げる」段階へ、標準化の軸足が移った節目でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP: Release 17","url":"https://www.3gpp.org/specifications-technologies/releases/release-17"}]},{"date":"2023-11-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"ITU-Rが6Gの枠組み勧告「IMT-2030」を承認","summary":"ITUの無線通信総会が6Gの枠組み勧告M.2160を承認した。没入型通信、AIと通信の融合、通信とセンシングの統合など6つの利用シナリオと、2030年頃の実用化という目標が示された。\n\n2015年のIMT-2020ビジョンと同じ手順の反復であり、**世代交代は10年周期の国際的な合意形成**として進むことがよく分かる。各国・各社の6G研究開発は、以後この座標系に沿って整列し始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ITU-R勧告 M.2160: Framework and overall objectives of the future development of IMT for 2030 and beyond","url":"https://www.itu.int/rec/R-REC-M.2160"}]},{"date":"2024-03-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"Release 18(5G-Advanced)の主要仕様が固まる","summary":"3GPPが5G-Advancedの最初の版となるRelease 18の主要仕様を凍結した。無線区間へのAI・機械学習の適用、ネットワーク省電力化、衛星通信(NTN)の拡張などが盛り込まれた。\n\n5Gと6Gをつなぐ橋渡しと位置づけられ、6Gの本命とされるAIネイティブなネットワークの予行演習という意味を持つ。収益化に苦しむ事業者(事業者と市場レイヤー)にとっては、追加投資に値するかを測る試金石ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP: Release 18","url":"https://www.3gpp.org/specifications-technologies/releases/release-18"}]},{"date":"2025-03-01","precision":"month","end_date":null,"type":"point","layer":"技術と標準化","title":"3GPPが6G標準化に向けた検討を正式に開始","summary":"3GPPが韓国・仁川で6Gワークショップを開催し、Release 20における6Gの研究項目を始動させた。世界の通信事業者・機器ベンダー・研究機関から技術提案が一斉に持ち寄られた。\n\n標準化の開始は次世代競争の号砲でもある。AIとの融合を押し出す米欧、独自路線もにらむ中国など、この場には政策レイヤーの技術覇権争いがそのまま持ち込まれており、5Gで起きた分断の再現が早くも懸念されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"3GPP発表: 6G Workshop, Incheon (2025-03)","url":null}]},{"date":"2026-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と標準化","title":"6G仕様策定は2026年以降へ、商用化目標は2030年頃","summary":"3GPPの工程表では、Release 20での研究を経て2026年以降にRelease 21で6Gの仕様策定段階へ入り、2020年代末の初版完成、2030年頃の商用化開始が見込まれている。\n\nただしこれは現時点の計画にすぎない。5Gで起きた標準化の前倒し圧力、「世界初」競争、地政学的な分断が6Gでも再現される可能性は高く、標準・市場・政策の3層が再び同じ順序で動くのかが、本年表の続きを決める。","detail":null,"credibility":"unverified","credibility_note":"仕様策定と商用化の時期はいずれも標準化団体・各社の計画・見込みであり、今後変動しうる。","sources":[{"title":"3GPP発表・主要各社6Gホワイトペーパー","url":null}]}]},{"slug":"tech-ai-revolution","title":"AI革命の全体像 2020–2026","description":"深層学習の下地からTransformer、生成AIの爆発的普及、そして各国の規制整備まで。技術・資本・規制の3層を重ね、なぜこの数年でAIが社会の前提になったのかを俯瞰する年表。","category":"technology","language":"ja","start_year":2012,"end_year":2026,"layers":[{"name":"技術","color":"blue"},{"name":"企業と資本","color":"orange"},{"name":"社会と規制","color":"teal"}],"events":[{"date":"2012-10-01","precision":"month","end_date":null,"type":"point","layer":"技術","title":"AlexNetがILSVRCで圧勝、深層学習ブームの起点","summary":"トロント大学のKrizhevsky、Sutskever、HintonによるGPU学習の深層CNNが、画像認識コンペILSVRCで従来手法を大差で破り、深層学習の実用性を示した。\n\n以後の研究資源が深層学習へ集中する契機となり、GPUを学習に用いる手法もここで定着。後年のNVIDIAの資本市場での躍進(企業と資本レイヤー)の伏線となる、生成AI以前の「下地」にあたる出来事。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: AlexNet","url":"https://en.wikipedia.org/wiki/AlexNet"}]},{"date":"2017-06-12","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Transformer論文公開、大規模言語モデルの基盤に","summary":"Googleの研究者らが再帰構造を捨てAttentionのみで系列変換を行うTransformerを提案。並列学習に適した構造により、モデルとデータの規模を拡大するほど性能が伸びる「スケーリング」の道を開き、GPTシリーズもBERTもこの構造の上に成立する。\n\nこの時点で産業界のAIはまだ研究投資の対象であり、資本市場や規制当局の主要関心事ではなかった点が、5年後との対比として重要である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Attention Is All You Need (1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"date":"2019-07-22","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"MicrosoftがOpenAIに10億ドル出資","summary":"MicrosoftがOpenAIとの提携と10億ドルの出資を発表し、Azureを独占的クラウド基盤とする計算資源の供給関係が始まった。\n\n非営利として出発したOpenAIが営利子会社(capped-profit)を設けた直後の出資であり、この**資本と計算資源の結合が翌年のGPT-3(技術レイヤー)を可能にした**。以後、生成AI競争はモデル開発企業とクラウド大手の連合という構図で進む。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft News: OpenAI forms exclusive computing partnership with Microsoft (2019-07-22)","url":"https://news.microsoft.com/2019/07/22/openai-forms-exclusive-computing-partnership-with-microsoft-to-build-new-azure-ai-supercomputing-technologies/"}]},{"date":"2020-05-28","precision":"day","end_date":null,"type":"point","layer":"技術","title":"GPT-3論文公開、1750億パラメータの言語モデル","summary":"OpenAIが1750億パラメータのGPT-3を発表。少数例を示すだけで多様なタスクをこなす「few-shot」能力を示し、規模の拡大が汎用的な能力をもたらすことを実証した。\n\n前年のMicrosoft出資による計算資源が結実した成果で、同年6月にはAPIとして限定公開され、AIが「研究成果」から「サービス基盤」へ移る転換点となる。\n\n社会と規制の側では新型コロナ対応が優先され、AI規制の議論はまだEU域内の準備段階にとどまっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Language Models are Few-Shot Learners (2005.14165)","url":"https://arxiv.org/abs/2005.14165"}]},{"date":"2021-04-21","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"欧州委員会がAI規則(AI Act)案を提案","summary":"欧州委員会が、用途ごとにリスクを4段階に分け高リスク用途に義務を課す、リスクベースの包括的AI規制案を公表。世界初の横断的AI法制に向けた立法プロセスが始まった。\n\n提案時点では生成AIは想定の中心になく、2022年末のChatGPT登場(技術レイヤー)後に汎用AIモデル条項が追加されるなど、技術の進展が立法途中の修正を迫る。**規制が技術に追いつこうとする構図の出発点**である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Proposal COM(2021) 206 final","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52021PC0206"}]},{"date":"2022-08-22","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Stable Diffusion公開、画像生成AIがオープンに","summary":"Stability AIらが画像生成モデルStable Diffusionの重みを公開し、個人のPCで動く生成AIが一気に広まった。\n\n同年4月のDALL·E 2、7月のMidjourneyに続く動きだが、モデル自体をオープンに配布した点で影響が大きく、派生モデルやツールが爆発的に増えた。\n\n一方で学習データの著作権をめぐる訴訟が翌年以降に相次ぎ、社会と規制レイヤーの論点を先取りする。生成AIが「見て分かる」形で一般に届いた最初の波である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Stability AI: Stable Diffusion Public Release","url":"https://stability.ai/news/stable-diffusion-public-release"}]},{"date":"2022-10-07","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"米国が先端半導体の対中輸出規制を発表","summary":"米商務省が先端AIチップと製造装置の対中輸出を制限し、**計算資源が安全保障と地政学の対象になった**。規制はNVIDIAのA100/H100級のGPUを対象とし、以後段階的に強化される。\n\nこの制約が中国側の効率的な学習手法の追求を促し、2025年のDeepSeek-R1(技術レイヤー)の衝撃につながったとの見方もある。AIの覇権争いが企業間競争にとどまらず国家戦略として扱われ始めた、最初の明確な出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省産業安全保障局(BIS) 2022年10月7日発表 輸出管理規則改正","url":null}]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"ChatGPT公開","summary":"OpenAIが対話型AI「ChatGPT」を無料公開。GPT-3.5系モデルに人間のフィードバックによる強化学習(RLHF)を施し対話UIで提供したもので、技術的な飛躍というより「届け方」の転換だったが、誰でも自然言語で使える体験が生成AIを一般社会の関心事に変え、公開から2か月で推定1億ユーザーに達した(社会と規制レイヤー)。\n\n翌年1月にはMicrosoftの追加出資が発表され、大手各社が生成AIへ一斉に舵を切る。**以後の年表の全レイヤーがここを分岐点とする**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: Introducing ChatGPT","url":"https://openai.com/index/chatgpt/"}]},{"date":"2023-01-23","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"MicrosoftがOpenAIへ数十億ドル規模の追加出資","summary":"MicrosoftがOpenAIとの提携延長と複数年・数十億ドル規模の投資を発表(報道では総額100億ドルとされた)。ChatGPT公開からわずか2か月後で、生成AIが資本市場の中心テーマになったことを象徴する。\n\n翌月にはBing、続いてOffice製品への組み込みが進み、Googleも対抗発表を急いだ。技術レイヤーでは3月にGPT-4の公開が控え、資本と技術の投入サイクルが極端に短くなった時期である。","detail":null,"credibility":"disputed","credibility_note":"Microsoftの公式発表は金額を明示しておらず、100億ドルという数字は報道ベースの推定にとどまる。","sources":[{"title":"Microsoft Official Blog: Microsoft and OpenAI extend partnership (2023-01-23)","url":"https://blogs.microsoft.com/blog/2023/01/23/microsoftandopenaiextendpartnership/"}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"社会と規制","title":"ChatGPTが公開2か月で推定1億ユーザーに到達","summary":"UBSの分析として、ChatGPTの月間利用者が公開2か月で1億人に達したと報じられ、史上最速の普及と評された。\n\n教育現場での利用制限や企業の情報漏えい懸念など社会的な反応が一斉に噴出し、イタリアのデータ保護当局が3月末に一時利用停止を命じるなど、規制当局の初動もこの普及速度が引き金となった。技術レイヤーの「届け方の転換」が社会レイヤーに波及するまでの時間の短さを示す指標である。","detail":null,"credibility":"disputed","credibility_note":"1億人はUBSがSimilarweb等のデータから推定した数値で、OpenAIの公式開示ではない。集計方法により数値は前後する。","sources":[{"title":"Reuters: ChatGPT sets record for fastest-growing user base - analyst note (2023-02-02)","url":null}]},{"date":"2023-03-14","precision":"day","end_date":null,"type":"point","layer":"技術","title":"GPT-4公開、マルチモーダル対応へ","summary":"OpenAIがGPT-4を発表。画像入力に対応し、司法試験など多くの試験で人間上位層に匹敵する成績を示した。\n\n技術報告書ではモデル規模や学習データを非公開とし、競争と安全性を理由にオープンな研究文化から距離を置いた点も注目された。\n\n同月にはGoogle Bard、AnthropicのClaudeも公開され(企業と資本レイヤー)、1週間後には開発一時停止を求める公開書簡(社会と規制レイヤー)が出されるなど、加速と警戒が同時進行した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: GPT-4 Research","url":"https://openai.com/index/gpt-4-research/"}]},{"date":"2023-03-22","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"「巨大AI実験の一時停止」を求める公開書簡","summary":"Future of Life InstituteがGPT-4を超えるAIの開発を6か月停止するよう求める書簡を公開し、著名研究者や経営者が署名した。GPT-4公開の8日後という時期が示すとおり、技術レイヤーの加速への直接の反応である。\n\n実際に停止した企業はなく、むしろ投資と開発は加速したが、AIの存在論的リスクを一般議論の俎上に載せ、同年10月の米大統領令や11月の英国AI安全サミットなど各国政府の動きを後押ししたと評価される。","detail":null,"credibility":"unverified","credibility_note":"書簡の署名者数(3万人超とされる)は主催団体の集計で、第三者による検証はない。","sources":[{"title":"Future of Life Institute: Pause Giant AI Experiments: An Open Letter","url":"https://futureoflife.org/open-letter/pause-giant-ai-experiments/"}]},{"date":"2023-10-30","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"米国でAIに関する大統領令14110号に署名","summary":"バイデン大統領が「安全で信頼できるAI」に関する大統領令14110号に署名し、計算量の閾値を基準に大規模モデルの開発者へ安全性テスト結果の報告を求めた。\n\n米国初の包括的なAI政策であり、EUのAI Actが立法の最終段階にあった時期と重なり、大西洋の両側で規制枠組みが並走した。\n\nなお本大統領令は2025年1月の政権交代直後に撤回され、規制の方向性が政治に左右されることを示す事例ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Executive Order 14110: Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence","url":null}]},{"date":"2023-11-17","precision":"day","end_date":"2023-11-22","type":"period","layer":"企業と資本","title":"OpenAI取締役会がアルトマンCEOを解任、5日後に復帰","summary":"OpenAI取締役会がサム・アルトマンCEOを解任。従業員の大量離反表明とMicrosoftの介入を経て、5日後に復帰した。\n\n非営利の理念に基づく統治構造と巨額資本を受け入れた営利事業の間の緊張が表面化した出来事であり、再編後は実質的に企業としての方向性が優先される結果となった。\n\n前月に米大統領令、同月に英国AI安全サミットが行われた時期で、AI企業の内部統治が公共的関心事として扱われるようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: OpenAI announces leadership transition (2023-11-17)","url":"https://openai.com/index/openai-announces-leadership-transition/"}]},{"date":"2024-03-13","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"欧州議会がAI Actを可決","summary":"欧州議会が世界初の包括的AI規制であるAI Actを可決。\n\n2021年の提案時にはなかった汎用AI(GPAI)モデルへの透明性義務は、ChatGPT以後の技術レイヤーの変化を受けて追加された。理事会の承認を経て2024年8月1日に発効し、禁止事項、GPAI義務、高リスク義務の順に段階的に適用される。\n\n企業と資本レイヤーでは、規制コストを理由に欧州での提供を遅らせる企業も現れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2024/1689 (AI Act)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"date":"2024-08-01","precision":"day","end_date":"2026-08-02","type":"period","layer":"社会と規制","title":"EU AI Actの段階的適用期間","summary":"AI Actが発効し、禁止事項(2025年2月)、汎用AIモデル義務(2025年8月)、高リスク義務(2026年8月)の順に、2年かけて段階的に適用が進む。\n\nこの間、企業と資本レイヤーでは適用延期を求めるロビー活動が続き、技術レイヤーではモデルの更新周期が数か月単位に短縮された。**「規制の時間」と「技術の時間」の速度差**が最も可視化される期間であり、本年表の終点でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2024/1689 (AI Act) 第113条 適用期日","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"date":"2025-01-20","precision":"day","end_date":null,"type":"point","layer":"技術","title":"DeepSeek-R1公開、低コスト推論モデルの衝撃","summary":"中国のDeepSeekが推論特化モデルR1をオープンウェイトで公開し、少ない計算資源で最先端に迫る性能を示したと主張した。\n\n米国の輸出規制(社会と規制レイヤー)で先端GPUの入手が制限される中での成果とされ、**「計算資源の量が競争力を決める」という前提を揺さぶった**。\n\n1週間後にはNVIDIA株が急落し(企業と資本レイヤー)、AI投資の妥当性をめぐる議論が広がった。オープンウェイト戦略が地政学的な意味を持つことも示した。","detail":null,"credibility":"disputed","credibility_note":"学習コストが数百万ドル規模とする主張は自社発表に基づき、算定範囲(最終学習のみか研究開発全体か)をめぐって見解が分かれる。","sources":[{"title":"arXiv: DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning (2501.12948)","url":"https://arxiv.org/abs/2501.12948"}]},{"date":"2025-01-21","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"「Stargate」構想発表、最大5000億ドルのAIインフラ投資","summary":"OpenAI、SoftBank、Oracleらが米国内にAIデータセンターを建設する合弁「Stargate」を発表し、投資規模を4年間で最大5000億ドルと表明した。\n\n政権交代の翌日にホワイトハウスで発表され、AIインフラが国家的プロジェクトとして扱われることを印象づけた。\n\n同じ週にDeepSeek-R1(技術レイヤー)が「少ない計算資源」で注目を集めており、巨額投資の前提が同時に問われる対照的な構図が生まれた。電力とデータセンター立地が新たな争点となる。","detail":null,"credibility":"unverified","credibility_note":"5000億ドルは表明額であり、実際の資金調達と投資実行の規模・時期は発表時点で確定していない。","sources":[{"title":"OpenAI: Announcing The Stargate Project","url":"https://openai.com/index/announcing-the-stargate-project/"}]},{"date":"2025-01-27","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"NVIDIA株が急落、時価総額が1日で約6000億ドル減","summary":"DeepSeekの低コスト主張を受けNVIDIA株が約17%下落し、1日の時価総額減少額(約6000億ドル)として米国市場史上最大級とされた。\n\n2012年のAlexNet以来GPUと歩み、生成AIブームで時価総額世界首位級に躍進していた同社の急落は、AI投資の収益性と「計算資源の必要量」への疑念を映す。\n\nDeepSeek-R1公開(技術レイヤー)の1週間後の出来事で、その後株価は回復したが、輸出規制(社会と規制レイヤー)をめぐる政策も揺れ続けた。","detail":null,"credibility":"unverified","credibility_note":"減少額は終値ベースの報道による概算で、媒体により5900億ドル前後と数値に幅がある。","sources":[{"title":"Reuters: Nvidia loses nearly $600 billion in market value (2025-01-27)","url":null}]},{"date":"2025-05-28","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"日本でAI推進法が成立","summary":"人工知能関連技術の研究開発・活用の推進に関する法律が参議院で可決・成立。罰則を設けず振興を主眼とする日本初のAI基本法で、EUのAI Actが義務と罰則で臨むのに対し、事業者の協力義務と政府の基本計画を柱とする「ソフトロー寄り」の設計を選んだ。\n\n同時期の米国では前政権の大統領令が撤回されており、主要国の規制姿勢が分岐した年といえる。\n\n企業と資本レイヤーでは国内データセンター投資の呼び込みが政策目標に据えられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 人工知能関連技術の研究開発及び活用の推進に関する法律(令和7年)","url":null}]}]},{"slug":"tech-autonomous-driving","title":"自動運転の現在地","description":"砂漠のレースから死亡事故、法整備、ロボタクシーの商用化まで。技術・産業・制度の3層を重ね、「もうすぐ実現」と言われ続けた自動運転がいまどこにいるのかを測る年表。","category":"technology","language":"ja","start_year":2004,"end_year":2025,"layers":[{"name":"技術開発","color":"blue"},{"name":"産業と提携","color":"orange"},{"name":"制度と社会","color":"teal"}],"events":[{"date":"2004-03-13","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"DARPAグランドチャレンジ第1回、完走ゼロ","summary":"DARPAが賞金100万ドルをかけた無人車両の砂漠横断レースを開催。約240kmのコースで、最も進んだカーネギーメロン大学の車両でも約12km地点で走行不能となり、完走車はなかった。\n\n結果だけ見れば惨敗だが、軍用技術の公開コンペに大学や愛好家が参加する形式が人材の裾野を一気に広げた。**自動運転の歴史は公開の失敗から始まった**のであり、この失敗の共有が翌年の躍進を生む。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Grand Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Grand_Challenge"}]},{"date":"2005-10-08","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"スタンフォードのStanleyが砂漠212kmを完走","summary":"第2回グランドチャレンジで、セバスチャン・スラン率いるスタンフォード大学の「Stanley」が約212kmのコースを6時間53分で走破し優勝。5台が完走し、前年の完走ゼロから状況は一変した。\n\n機械学習を制御へ本格導入したことが勝因とされ、以後の自動運転開発の技術路線を方向づけた。スランはこの後Googleに移り、自動運転プロジェクト(2009年)を率いることになる。競技会が産業の母体となった瞬間である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Grand Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Grand_Challenge"}]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"技術開発","title":"Googleが自動運転車プロジェクトを開始","summary":"Googleがスランらグランドチャレンジ出身の研究者を集め、自動運転車の開発プロジェクトを非公開で開始した。翌2010年に公表され、公道での試験走行距離を着実に積み上げていく。\n\n自動車メーカーではなくIT企業が本気で参入したことで、自動運転は研究テーマから産業競争へと局面を変えた。センサーの塊のような試験車両は、**走行データの量が競争力を決める**という新しいゲームのルールを業界に持ち込んだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Waymo: Our journey(会社沿革)","url":null}]},{"date":"2014-01-01","precision":"month","end_date":null,"type":"point","layer":"制度と社会","title":"SAEが自動運転レベル0〜5の分類を発行","summary":"米自動車技術会(SAE)が、自動化の程度をレベル0〜5に分ける規格J3016を発行。「レベル3」「レベル4」という共通言語が生まれ、各国の法制度や企業の開発目標がこの物差しの上で語られるようになった。\n\n一方で「レベル2はあくまで運転支援」という区分の趣旨は一般に浸透せず、後のTesla Autopilotをめぐる誤解と事故(制度と社会レイヤーの2016年)の背景の一つとなる。分類が先、現実が後という順序が象徴的である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SAE International: J3016 Taxonomy and Definitions for Terms Related to Driving Automation Systems","url":null}]},{"date":"2015-02-01","precision":"month","end_date":"2021-01-01","type":"period","layer":"産業と提携","title":"Uberの自動運転開発、参入から売却まで","summary":"Uberがカーネギーメロン大学の研究者を大量採用して自動運転部門ATGを設立。配車事業の人件費をなくす切り札として巨額を投じ、2016年にはピッツバーグで乗客を乗せた公道試験を始めた。\n\nしかし2018年の死亡事故(制度と社会レイヤー)で試験は停止に追い込まれ、開発の遅れと資金難から2020年末に部門のAuroraへの売却を発表して撤退した。**「配車の次」を焦った資本**の躓きは、この分野の難度を業界に再認識させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters等によるUber ATG設立(2015)とAuroraへの売却(2020-12)の報道","url":null}]},{"date":"2015-10-14","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"TeslaがAutopilotを配信、運転支援の大衆化","summary":"Teslaがソフトウェア更新でModel Sに「Autopilot」を配信。高速道路での車線維持と自動操舵を市販車へ一斉に解放し、所有者が一夜にして「半自動運転」を体験する事態となった。\n\n無線更新(OTA)で機能が追加される手法は自動車の常識を変えたが、機能名と実態(レベル2の運転支援)の乖離への批判も当初から強かった。**「できること」と「任せてよいこと」の混同**という問題が、ここで社会に持ち込まれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Tesla: Your Autopilot has arrived (2015-10-14)","url":null}]},{"date":"2016-05-07","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"Autopilot使用中の初の死亡事故","summary":"米フロリダ州で、Autopilot使用中のModel Sが交差進行するトレーラーの側面に衝突し、運転者が死亡した。明るい空を背にした白い車体を識別できなかったとされ、運転支援中の死亡事故として世界的に報じられた。\n\n米当局の調査は、制度の側が実走行データと向き合う最初の機会となり、システムの限界と運転者の過信という論点を確立した。技術の普及(2015年のAutopilot配信)から半年余りで、社会は代償の議論を始めることになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NHTSA: ODI調査報告 PE16-007 (2017-01)","url":null}]},{"date":"2016-12-13","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"Google自動運転部門がWaymoとして独立","summary":"Googleの自動運転プロジェクトが「Waymo」として分社化し、Alphabet傘下の事業会社となった。研究段階の終了と事業化の開始を告げる再編である。\n\n「自家用車を作らず自動運転技術を磨く」路線を明確にし、クライスラーやジャガーとの提携で車両を調達する水平分業を選んだ。7年の先行投資(技術開発レイヤー)を収益に変える長い道のりがここから始まり、2018年のWaymo Oneへとつながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Waymo","url":"https://en.wikipedia.org/wiki/Waymo"}]},{"date":"2018-03-18","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"Uber試験車が歩行者死亡事故、業界に衝撃","summary":"米アリゾナ州テンピで、Uberの自動運転試験車が道路を横断中の歩行者をはね、死亡させた。自動運転試験車による世界初の歩行者死亡事故となった。\n\n国家運輸安全委員会(NTSB)は、システムが歩行者を直前まで正しく分類できず、監視役の運転者も画面を注視していたと認定した。各社が公道試験を一時停止し、州による緩い誘致競争を含む**「実験場としての公道」**の是非が問われた。楽観の時代の終わりを画す事故である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTSB: Highway Accident Report HWY18MH010","url":null}]},{"date":"2018-12-05","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"Waymo One開始、ロボタクシー商用化の一歩","summary":"Waymoが米アリゾナ州フェニックス郊外で配車サービス「Waymo One」を開始し、世界初の商用ロボタクシーと報じられた。\n\nただし当初の利用者は実証実験の参加者からの移行組に限られ、安全要員も同乗しており、「商用化」の実態には議論があった。誰でも呼べる完全無人のサービスに至るのはさらに2年後である。**発表の言葉と運行の実態の距離**は、この産業を測るうえで常に確認すべき指標であり続ける。","detail":null,"credibility":"disputed","credibility_note":"「世界初の商用サービス」という位置づけは、利用者限定・安全要員同乗という当初の運行実態から議論がある。","sources":[{"title":"Waymo: Waymo One launch (2018-12-05)","url":null}]},{"date":"2020-04-01","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"日本でレベル3を認める改正法が施行","summary":"改正道路交通法と改正道路運送車両法が施行され、一定条件下でシステムに運転を委ねるレベル3の自動運転が、日本の公道で法的に可能になった。世界に先駆けた法整備とされる。\n\n渋滞時の高速道路などに限りシステムが運転主体となることを認め、翌2021年のホンダ・レジェンド(技術開発レイヤー)で実車が実現する。技術より先に制度が枠を用意した点で、米国の州任せの誘致競争とは対照的な進め方である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国土交通省: 改正道路運送車両法・改正道路交通法の施行について (2020-04)","url":null}]},{"date":"2020-10-08","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"Waymo、完全無人のロボタクシーを一般開放","summary":"Waymoが米フェニックスで、安全要員が同乗しない完全無人のロボタクシーを一般利用者に開放した。誰でもアプリで無人車を呼べる状態が、世界で初めて日常のものになった。\n\nDARPAの砂漠(2004年)から16年での到達点だが、対象は詳細な地図を整備済みの限られた地域にとどまる。「どこでも走れる」汎用性への道のりはなお遠く、地域限定で確実に動かす路線と、量産車で一気に広げる路線(Tesla)の分岐が明確になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Waymo: Expanded fully driverless service in Phoenix (2020-10)","url":null}]},{"date":"2021-03-05","precision":"day","end_date":null,"type":"point","layer":"技術開発","title":"ホンダ、世界初のレベル3市販車を発売","summary":"ホンダが渋滞時に運転をシステムへ委ねられる「トラフィックジャムパイロット」搭載のレジェンドを100台限定でリース販売。国土交通省の型式指定を受けた世界初のレベル3市販車となった。\n\n2020年の法整備(制度と社会レイヤー)が用意した枠に技術がはまった、制度先行型の成果である。一方で作動条件は高速道路の渋滞時に限られ、台数も限定的で、レベル3の普及は世界的にも緩慢なままである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"本田技研工業: レジェンド(Honda SENSING Elite搭載)発売 (2021-03-05)","url":null}]},{"date":"2023-04-01","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"日本でレベル4の運行許可制度が施行","summary":"改正道路交通法が施行され、特定の条件下で運転者不在の自動運行を認める「特定自動運行」の許可制度が始まった。翌月には福井県永平寺町の移動サービスが全国初の許可を受けた。\n\n過疎地の移動手段の確保という日本固有の課題が推進力であり、都市のロボタクシー(米国)とは異なる、低速・限定路線からの社会実装が選ばれた。制度と社会レイヤーが描く自動運転の姿は、国によってここまで違うという好例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"警察庁: 特定自動運行に係る許可制度の施行 (2023-04)","url":null}]},{"date":"2023-08-10","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"サンフランシスコで24時間ロボタクシー認可","summary":"カリフォルニア州公益事業委員会(CPUC)がWaymoとCruiseに対し、サンフランシスコ全域での24時間の有償ロボタクシー運行を認可した。大都市での本格商用化に道を開く決定だった。\n\n消防・警察からは緊急車両の妨害事例が報告され、公聴会は賛否で紛糾した。認可からわずか2か月後にCruiseの事故(同レイヤー)が起き、**都市が実験台になることへの合意**は依然もろいことが示される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"CPUC: Decision authorizing expanded driverless AV service in San Francisco (2023-08-10)","url":null}]},{"date":"2023-10-02","precision":"day","end_date":null,"type":"point","layer":"制度と社会","title":"Cruise車両が歩行者引きずり事故、許可停止へ","summary":"サンフランシスコで、他車にはねられた歩行者がCruiseの無人車両の下に巻き込まれ、車両が路肩へ移動する際に約6m引きずられる事故が起きた。州当局は同社が事故映像を完全には開示しなかったとして、同月末に無人運行の許可を停止した。\n\n事故そのもの以上に、事後対応と情報開示の不備が信頼問題として扱われた点が重要で、全米展開を急いだ同社の路線は撤回に追い込まれていく(産業と提携レイヤー)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"カリフォルニア州DMV: Cruiseの無人運行許可停止に関する発表 (2023-10-24)","url":null}]},{"date":"2024-12-10","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"GMがCruiseのロボタクシー事業から撤退","summary":"GMがCruiseへの資金拠出を打ち切り、ロボタクシー事業からの撤退を発表した。累計100億ドル規模を投じたとされる事業は、技術を市販車の運転支援システムへ転用する形で幕を下ろした。\n\n事故(2023年)後の信頼失墜と資金負担の重さが理由とされ、自動車メーカー本体がロボタクシー事業を抱えることの難しさを示した。市場は先行するWaymoと、量産車アプローチのTeslaへと整理されていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GM: Cruiseロボタクシー事業からの撤退発表 (2024-12-10)","url":null}]},{"date":"2025-05-01","precision":"month","end_date":null,"type":"point","layer":"産業と提携","title":"Waymo、有償乗車1000万回到達と拡大を発表","summary":"Waymoが累計の有償乗車回数が1000万回に達したと発表した。フェニックス、サンフランシスコ、ロサンゼルスなどで週25万回を超える無人乗車を提供しているとし、対象都市のさらなる拡大も表明した。\n\n数字はいずれも同社の公表値だが、ロボタクシーが一部の都市で日常の交通手段になりつつあることを示す。2004年に砂漠で12kmしか走れなかった技術は、21年かけてようやく「現在地」と呼べる場所に立った。","detail":null,"credibility":"unverified","credibility_note":"乗車回数・週間回数はWaymoの自社発表で、第三者機関による検証済みの統計はない。","sources":[{"title":"Waymo: 10 million paid rides milestone (2025)","url":null}]},{"date":"2025-06-22","precision":"day","end_date":null,"type":"point","layer":"産業と提携","title":"Teslaがオースティンでロボタクシー試験開始","summary":"Teslaが米テキサス州オースティンで、招待制のロボタクシーサービスを開始した。Model Yを用い、助手席に安全監視員が同乗する限定的な運行と報じられた。\n\nカメラのみで高精度地図に頼らない同社の路線が公道サービスに達した節目だが、「無人」の程度や運行範囲は報道により差があり、発表と実態の検証はここでも続く。**「もうすぐ」と言われ続けた約束**が、どの水準で果たされるのかを測る局面に入った。","detail":null,"credibility":"disputed","credibility_note":"運行の無人性・地理的範囲・監視員の役割は報道により記述が分かれ、公式な運行実績の開示も限定的である。","sources":[{"title":"Reuters: Tesla launches robotaxi service in Austin (2025-06-22)","url":null}]}]},{"slug":"tech-blockchain","title":"ブロックチェーンの興亡","description":"Bitcoin論文からEthereum、ICOブーム、相次ぐ取引所事件とFTX破綻、そしてETF承認と法制化まで。技術・市場と資本・規制と事件の3層を重ね、熱狂と崩壊が交互に訪れた歴史を読み解く。","category":"technology","language":"ja","start_year":2008,"end_year":2025,"layers":[{"name":"技術","color":"blue"},{"name":"市場と資本","color":"gold"},{"name":"規制と事件","color":"pink"}],"events":[{"date":"2008-10-31","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Bitcoin論文「P2P電子通貨システム」公開","summary":"サトシ・ナカモトを名乗る人物が暗号学メーリングリストに9ページの論文を投稿し、中央管理者なしで二重支払いを防ぐ仕組みを示した。リーマン・ブラザーズ破綻から約1か月半後という時期は、金融機関への不信が背景にあったとしばしば語られる。\n\nProof of Workによる合意形成と公開台帳という設計は、後のEthereum(技術)や無数の暗号資産の原型となった。著者の正体は現在も不明で、規制と事件レイヤーの多くの騒動もこの匿名性に根ざす。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcoin: A Peer-to-Peer Electronic Cash System","url":"https://bitcoin.org/bitcoin.pdf"}]},{"date":"2009-01-03","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Bitcoinのジェネシスブロック生成","summary":"Bitcoinネットワークの最初のブロックが生成され、稼働開始。ブロックに埋め込まれた英紙の見出し「Chancellor on brink of second bailout for banks」は、金融危機下での既存金融への批評と読まれている。\n\n当初は暗号学者や愛好家の実験にすぎず、市場価格は存在しなかった。1年半後のピザ取引(市場と資本)で初めて実物との交換価値が示され、価格を持つ資産としての歴史が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin","url":"https://en.wikipedia.org/wiki/Bitcoin"}]},{"date":"2010-05-22","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"1万BTCでピザ2枚、初の実物取引","summary":"フロリダのプログラマーが1万BTCと引き換えにピザ2枚を受け取ったと掲示板に報告。Bitcoinの最初の商取引として知られ、当時の1万BTCは約41ドル相当だったが、後年の価格では数億ドルに相当し、「ビットコイン・ピザ・デー」として毎年言及される。\n\n技術(ジェネシスブロック)から1年半で価格発見が始まった事例であり、翌年以降の取引所の乱立とMt.Goxの台頭(規制と事件)につながる。投機資産としての性格はこの時点ではまだ薄かった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcointalk: Pizza for bitcoins? (2010)","url":"https://bitcointalk.org/index.php?topic=137.0"}]},{"date":"2013-10-02","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"闇市場Silk Roadを米当局が閉鎖","summary":"FBIがBitcoin決済の違法商品市場Silk Roadを閉鎖し運営者を逮捕。Bitcoinと犯罪の結びつきが広く報じられ、Torと暗号資産の匿名性を利用した市場の摘発は、規制当局が暗号資産を本格的に監視対象とする契機となった。\n\n同年12月には中国人民銀行が金融機関のBitcoin取扱いを禁止し、価格が急落している(市場と資本)。技術の中立性と利用の違法性を分けて論じる枠組みは、この事件を通じて形成された。","detail":null,"credibility":"unverified","credibility_note":"当局が押収したBitcoinの数量は報道により約2.6万〜17万BTCと幅があり、押収時期の区別も含めて数値は未確定。","sources":[{"title":"Wikipedia: Silk Road (marketplace)","url":"https://en.wikipedia.org/wiki/Silk_Road_(marketplace)"}]},{"date":"2014-02-28","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"Mt.Goxが民事再生を申請、大量のBitcoin消失","summary":"東京の取引所Mt.Goxが取引を停止し民事再生を申請。顧客資産を含む大量のBitcoinが失われたと発表し、業界最大級の破綻となった。世界のBitcoin取引の大半を扱っていた取引所の破綻は、価格の長期低迷を招いた。\n\n各国に取引所規制の必要性を認識させ、日本では利用者保護の議論が進み、2017年の改正資金決済法(規制と事件)で取引所登録制が導入される。技術そのものではなく**取引所という「入口」が最大の弱点**であることを示した事件である。","detail":null,"credibility":"disputed","credibility_note":"消失額は当初約85万BTCと発表されたが、後に約20万BTCが発見されるなど、実際の損失規模と原因(外部からのハッキングか内部要因か)には諸説ある。","sources":[{"title":"Wikipedia: Mt. Gox","url":"https://en.wikipedia.org/wiki/Mt._Gox"}]},{"date":"2015-07-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Ethereumメインネット稼働開始","summary":"スマートコントラクトを実行できる汎用ブロックチェーンEthereumが稼働開始。ヴィタリック・ブテリンが2013年に構想し、2014年のクラウドセールで資金を集めて開発された。「通貨」から「プログラム可能な台帳」へ用途が広がった。\n\n任意のプログラムをチェーン上で動かせる設計は、翌年のThe DAO(技術・事件)や2017年のICOブーム(市場と資本)、後のDeFiやNFTの基盤となった。Bitcoinが「価値の保存」に特化する一方、Ethereumは応用の実験場となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ethereum","url":"https://en.wikipedia.org/wiki/Ethereum"}]},{"date":"2016-06-17","precision":"day","end_date":null,"type":"point","layer":"技術","title":"The DAOハッキング、Ethereumがハードフォークへ","summary":"Ethereum上の投資ファンドThe DAOの脆弱性が突かれ、集めたETHの約3分の1が流出。「コードが法」という理念と、被害回復のためにチェーンを巻き戻すかという実務判断が衝突し、取り消しのためのハードフォークをめぐって議論が割れた。\n\n7月のハードフォークで巻き戻さない側がEthereum Classicとして分離した。スマートコントラクトの脆弱性が巨額損失に直結することを示し、後の監査産業やDeFiハックの系譜(規制と事件)の起点となった。","detail":null,"credibility":"unverified","credibility_note":"流出額は約360万ETHとされるが、当時のドル換算額は5000万〜7000万ドルと資料により幅がある。","sources":[{"title":"Wikipedia: The DAO","url":"https://en.wikipedia.org/wiki/The_DAO"}]},{"date":"2017-01-01","precision":"year","end_date":"2018-01-31","type":"period","layer":"市場と資本","title":"ICOブーム","summary":"Ethereum上でトークンを発行して資金を集めるICOが急増し、2017年に数十億ドル規模の調達が行われた。Ethereumのスマートコントラクト(技術)がなければ成立しなかった資金調達手法で、ホワイトペーパー1枚で巨額を集める例が続出し、多くが後に価値を失った。\n\n2017年9月には中国がICOを全面禁止し、米SECも証券法違反の警告を出すなど、規制と事件レイヤーの対応を招いた。同年末のBitcoin高騰と重なり、暗号資産が一般投資家の関心事となる。","detail":null,"credibility":"unverified","credibility_note":"ブームの開始・終了時期は明確な定義がなく、調達総額も集計機関により大きく異なる。","sources":[{"title":"Wikipedia: Initial coin offering","url":"https://en.wikipedia.org/wiki/Initial_coin_offering"}]},{"date":"2017-04-01","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"日本で改正資金決済法が施行、仮想通貨交換業を登録制に","summary":"仮想通貨を法的に定義し、交換業者に金融庁への登録を義務づける改正資金決済法が施行。主要国で初の包括的な取引所規制であり、Mt.Gox破綻(2014年)の教訓を受けて利用者財産の分別管理や本人確認を義務化した。\n\n同年、日本は世界のBitcoin取引で大きなシェアを占め、価格高騰(市場と資本)を支えた一因ともされる。しかし翌年のCoincheck事件は、登録制のみでは資産保全が不十分であることを露呈させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"金融庁: 仮想通貨交換業者登録一覧・資金決済に関する法律","url":null}]},{"date":"2017-08-01","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Bitcoin Cashが分岐、ブロックサイズ論争の決着","summary":"取引処理能力をめぐる数年来の対立の末、ブロックサイズを拡大したBitcoin Cashが分岐し、Bitcoin本体はSegWitを有効化した。分散型ネットワークの仕様変更を誰がどう決めるかというガバナンス問題が、実際にチェーンの分裂という形で表れた。\n\n技術論争は市場にも波及し、分岐前後の価格変動や取引所の対応(市場と資本)が投資家を翻弄した。この後Bitcoinはレイヤー2で拡張する路線を、Ethereumはやがてコンセンサス転換(2022年のMerge)を選ぶ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin Cash","url":"https://en.wikipedia.org/wiki/Bitcoin_Cash"}]},{"date":"2017-12-17","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"Bitcoinが約2万ドルの史上最高値、初のバブル頂点","summary":"Bitcoin価格が主要取引所で2万ドル前後に達し、当時の史上最高値を記録。年初の約1000ドルから20倍近い上昇で、ICOブームを背景に個人投資家が殺到し、テレビや新聞が連日報じる社会現象となった。\n\n同月にCBOEとCMEがBitcoin先物を上場し、機関投資家の参入が期待されたが、翌年には8割以上下落する「暗号資産の冬」に入る。技術(SegWit、Bitcoin Cash分岐)や規制(日本の登録制、中国のICO禁止)がすべて同じ年に集中していた。","detail":null,"credibility":"disputed","credibility_note":"最高値は取引所により1万9000〜2万ドル台と異なり、日付も12月16〜18日の間で資料により差がある。","sources":[{"title":"CoinMarketCap: Bitcoin 価格履歴","url":null}]},{"date":"2018-01-26","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"コインチェックからNEM約580億円分が流出","summary":"国内取引所コインチェックから約5.2億XEM(当時約580億円相当)が不正送金された。単一事件としては当時最大規模の流出で、改正資金決済法(2017年)の登録審査中だった業者で起き、ホットウォレット管理の不備が指摘された。\n\n金融庁は立入検査と業務改善命令を出し、以後の審査は厳格化。バブル頂点(市場と資本)からわずか1か月後の出来事であり、**熱狂の直後に事件が起きるという本年表の反復パターン**を象徴する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Coincheck","url":"https://en.wikipedia.org/wiki/Coincheck"}]},{"date":"2021-09-07","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"エルサルバドルがBitcoinを法定通貨に","summary":"エルサルバドルで世界初となるBitcoin法定通貨法が施行。ドル化経済の同国が送金コスト削減と金融包摂を掲げ、国家が暗号資産を通貨として採用する実験が始まった。\n\n国民の利用は限定的で、IMFは金融リスクを警告し続け、2025年にはIMF融資の条件として法定通貨としての受け入れ義務が撤回されている。同月、中国は暗号資産取引を全面禁止しており、国家の対応が正反対に分かれた月である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin Law","url":"https://en.wikipedia.org/wiki/Bitcoin_Law"}]},{"date":"2021-09-24","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"中国が暗号資産取引とマイニングを全面禁止","summary":"中国人民銀行など10機関が暗号資産関連の取引を違法とする通知を公表。同年5月のマイニング規制と合わせ事実上の全面禁止となり、世界のBitcoinマイニングの過半を担っていた中国からハッシュレートが米国などへ流出した(技術)。\n\n取引禁止は市場に短期的な下落をもたらしたが、同年11月にはBitcoinが史上最高値を更新しており(市場と資本)、単一国家の禁止では市場が止まらないことも示した。エルサルバドルの法定通貨化と同じ月の出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中国人民銀行: 关于进一步防范和处置虚拟货币交易炒作风险的通知(2021年9月24日)","url":null}]},{"date":"2021-11-10","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"Bitcoinが約6万9000ドルの史上最高値","summary":"コロナ禍の金融緩和とTeslaなど企業の購入、米国での先物ETF承認を背景に、Bitcoinが約6万9000ドルの史上最高値をつけた。2017年の頂点(約2万ドル)から3年半で3倍超の水準に達し、NFTやDeFiのブームも重なった。\n\n翌2022年の利上げ局面でTerra崩壊とFTX破綻(規制と事件)が続き、価格は1万6000ドル台まで下落する。低金利下の資本(市場と資本)が暗号資産へ流入し、引き締めとともに退潮する構図が明確に表れた。","detail":null,"credibility":"disputed","credibility_note":"最高値は取引所により6万8000〜6万9000ドル台と異なる。","sources":[{"title":"CoinMarketCap: Bitcoin 価格履歴","url":null}]},{"date":"2022-05-07","precision":"day","end_date":"2022-05-13","type":"period","layer":"市場と資本","title":"Terra/USTの崩壊","summary":"アルゴリズム型ステーブルコインUSTがドル連動を失い、姉妹通貨LUNAとともに1週間でほぼ無価値になり、約400億ドル規模の時価総額が消失した。担保ではなくアルゴリズムで価格を維持する設計(技術)の脆弱性が、市場の売り圧力で一気に露呈した。\n\n連鎖的にヘッジファンドや貸付業者が破綻し、**11月のFTX破綻(規制と事件)へ続く信用収縮の起点**となった。米国や日本でステーブルコイン規制の議論が急加速し、日本では翌年、改正資金決済法でステーブルコインの発行者が限定された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Terra (blockchain)","url":"https://en.wikipedia.org/wiki/Terra_(blockchain)"}]},{"date":"2022-09-15","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Ethereumが「The Merge」でProof of Stakeへ移行","summary":"EthereumがProof of WorkからProof of Stakeへ移行するアップグレード「The Merge」を完了し、消費電力を99%以上削減したとされる。稼働中のネットワークを止めずに合意形成の仕組みを入れ替えた大規模な移行で、数年来の開発の集大成だった。\n\n環境負荷への批判(規制と事件レイヤーの論点)に技術で応えた形だが、同時期の市場はTerra崩壊とFTX破綻に挟まれた「冬」の最中で、価格への影響は限定的だった。**技術と市場の時間軸のずれ**を示す事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ethereum.org: The Merge","url":"https://ethereum.org/en/roadmap/merge/"}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"FTXが破産申請、顧客資産流用が発覚","summary":"世界2位級の取引所FTXが米国で連邦破産法11条を申請。関連会社への顧客資産流用が明らかになり、創業者は後に有罪となった。Mt.Gox(2014年)以来、再び「取引所」が最大の弱点となった事件で、規制当局と政界に深く食い込んでいた企業の破綻は業界全体の信頼を失墜させた。\n\n米国では取引所規制の議論が加速し、日本では分別管理義務により国内利用者の資産返還が比較的速やかに進んだ点が対照的だった。市場(市場と資本)は底値圏に沈む。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bankruptcy of FTX","url":"https://en.wikipedia.org/wiki/Bankruptcy_of_FTX"}]},{"date":"2024-01-10","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"米SECが現物Bitcoin ETFを承認","summary":"米証券取引委員会が11本の現物Bitcoin ETFを承認。10年以上却下され続けた申請が裁判所の判断を経て承認に至り、証券口座で買える商品となって機関投資家と個人の資金流入が加速した。\n\nFTX破綻(規制と事件)から1年余りでの転換であり、投機的な「取引所」経由から規制された金融商品へと入口が広がったことを意味する。同年4月の半減期と重なり、Bitcoinは同年末に初めて10万ドルを超えた。**技術ではなく制度が価格を動かした**局面である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SEC: Statement on the Approval of Spot Bitcoin Exchange-Traded Products (2024-01-10)","url":"https://www.sec.gov/newsroom/speeches-statements/gensler-statement-spot-bitcoin-011023"}]},{"date":"2025-07-18","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"米国でステーブルコイン規制法(GENIUS法)が成立","summary":"ドル連動ステーブルコインの発行者に準備資産の全額裏付けなどを義務づけるGENIUS法が成立し、米国初の包括的な暗号資産法制となった。Terra崩壊(2022年)で露呈したステーブルコインの危うさに対する立法上の回答であり、同時にドル建てステーブルコインを制度に取り込む産業政策でもある。\n\nETF承認(市場と資本)と並び、暗号資産が**「規制の外」から「規制の内側」へ**移る流れを決定づけた。Bitcoin論文から17年、興亡の末に制度化へ至った現在地を示す。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: GENIUS Act","url":"https://en.wikipedia.org/wiki/GENIUS_Act"}]}]},{"slug":"tech-cloud-revolution","title":"クラウド革命の15年","description":"2006年のAmazon S3公開から、社会の土台となった末の大規模障害まで。技術・企業競争・利用者の3層で、計算資源が「所有するもの」から「借りるもの」へ変わった15年を辿る。","category":"technology","language":"ja","start_year":2006,"end_year":2021,"layers":[{"name":"技術とサービス","color":"blue"},{"name":"企業競争","color":"orange"},{"name":"利用者と社会","color":"teal"}],"events":[{"date":"2006-03-14","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"Amazon S3公開、クラウドストレージの誕生","summary":"Amazonがオンラインストレージ「Amazon S3」を公開。使った分だけ課金される従量制で、開発者はサーバーを買わずに事実上無限の保存領域を使えるようになった。\n\n書店から始まった小売企業が自社インフラの技術を外販するという意外な参入であり、**「所有から利用へ」**というクラウド革命の出発点となった。後発のGoogleやMicrosoftが追いかける構図(企業競争レイヤー)はここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"AWS News Blog: Amazon S3 (2006-03-14)","url":"https://aws.amazon.com/blogs/aws/amazon_s3/"}]},{"date":"2006-08-25","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"Amazon EC2ベータ公開、仮想サーバーを時間貸し","summary":"Amazonが仮想サーバーを1時間単位で貸し出す「Amazon EC2」のベータ版を公開。クレジットカード1枚で数分後にサーバーが手に入る体験は、調達に数週間かかる物理サーバーの常識を覆した。\n\nS3と組み合わせることでスタートアップの初期投資が劇的に下がり、後のモバイルアプリやSNSの爆発的増加を支える見えない土台となった。利用者と社会レイヤーの変化は、まずスタートアップ経済に現れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"AWS News Blog: Amazon EC2 Beta (2006-08-25)","url":"https://aws.amazon.com/blogs/aws/amazon_ec2_beta/"}]},{"date":"2008-04-07","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"Google App Engine公開、PaaSの先駆け","summary":"Googleがアプリケーション実行基盤「Google App Engine」のプレビュー版を公開。サーバー管理を意識せず、コードを置くだけで動く、後にPaaSと呼ばれる形態の先駆けとなった。\n\n検索大手のクラウド参入によりAWS一強に対抗軸が生まれ、企業競争レイヤーが動き出す。ただし独自制約の強さから当初の普及は限定的で、汎用性で勝るIaaS型のAWSが先行を保ち続けた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google公式ブログ: Introducing Google App Engine (2008-04-07)","url":null}]},{"date":"2010-02-01","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"Windows Azure正式提供開始","summary":"Microsoftがクラウド基盤「Windows Azure」の商用提供を開始。パッケージソフトの巨人が、自社の収益源を侵食しかねないクラウドへ本格参入した。\n\n当初は既存のサーバー製品事業との間で戦略が揺れ、AWSの後塵を拝し続けたが、この基盤が2014年以降のナデラ体制(企業競争レイヤー)で会社の中核となる。**追われる側の自己変革**が始まった地点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft: Windows Azure General Availability (2010-02)","url":null}]},{"date":"2010-07-19","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"OpenStack始動、オープンソースのクラウド基盤","summary":"RackspaceとNASAが、クラウド基盤ソフトウェアをオープンソースとして開発する「OpenStack」プロジェクトを発表。誰でも自前のクラウドを構築できる選択肢が生まれた。\n\n特定企業への依存(ロックイン)を嫌う通信会社や政府機関に採用され、パブリッククラウド一辺倒ではない「プライベートクラウド」の潮流を作った。標準化をめぐる主導権争いは、企業競争レイヤーの隠れた戦線でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenStack Foundation: プロジェクト沿革","url":null}]},{"date":"2011-06-06","precision":"day","end_date":null,"type":"point","layer":"利用者と社会","title":"AppleがiCloud発表、消費者の日常にクラウド","summary":"AppleがWWDCで「iCloud」を発表。写真や連絡先が複数の端末で自動的に同期される体験を無料で提供し、一般消費者が意識せずクラウドを使う時代を開いた。\n\nそれまで開発者と企業のものだったクラウドが、利用者と社会レイヤーへ直接届いた転換点である。「ファイルはどの端末にもある」という感覚が当たり前になり、データの置き場所は手元の機器からデータセンターへ静かに移っていった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple: iCloud発表 (WWDC 2011)","url":null}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"利用者と社会","title":"NISTがクラウドコンピューティングを定義","summary":"米国立標準技術研究所(NIST)が特別刊行物SP 800-145でクラウドコンピューティングを定義。オンデマンドや従量制など5つの特徴と、IaaS/PaaS/SaaSの3つのサービスモデルを整理した。\n\nバズワードだった「クラウド」に共通言語を与え、政府調達や企業の導入判断の基準となった。定義の確立は米政府の「クラウド・ファースト」政策とも連動し、制度が市場拡大を後押しする構図が生まれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NIST SP 800-145: The NIST Definition of Cloud Computing","url":"https://csrc.nist.gov/pubs/sp/800/145/final"}]},{"date":"2013-01-01","precision":"year","end_date":null,"type":"point","layer":"企業競争","title":"CIAがAWSと6億ドル規模のクラウド契約","summary":"米中央情報局(CIA)がAWSと推定6億ドルの専用クラウド構築契約を結んだと報じられた。IBMが調達手続きを不服として提訴したが、連邦請求裁判所はAWSの技術的優位を認めた。\n\n**最も機密を扱う組織がクラウドを選んだ**事実は「クラウドは安全ではない」という通念を覆し、政府・大企業の採用を一気に正当化した。企業競争レイヤーでは、AWSの技術先行が司法の場で裏書きされた事件でもある。","detail":null,"credibility":"disputed","credibility_note":"契約額6億ドルは報道ベースの推定で、契約の詳細は機密のため公式には開示されていない。","sources":[{"title":"FCW / The Atlanticによる2013年のCIAクラウド契約(C2S)報道","url":null}]},{"date":"2013-03-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"Docker公開、コンテナ技術が主流へ","summary":"Solomon HykesがPyConでDockerを披露し、オープンソースとして公開。アプリケーションを軽量な「コンテナ」に包んでどこでも動かす技術が、瞬く間に開発者の標準となった。\n\nクラウド間の移植性を高め、コンテナ前提の設計(クラウドネイティブ)を生んだ点で、特定ベンダーへの依存を相対化する技術でもある。翌年のKubernetes登場と合わせ、クラウドの主戦場は仮想マシンからコンテナ基盤へ移っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Docker (software)","url":"https://en.wikipedia.org/wiki/Docker_(software)"}]},{"date":"2014-02-04","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"ナデラがMicrosoft CEOに、クラウド最優先へ","summary":"サティア・ナデラがMicrosoftの3代目CEOに就任し、「モバイルファースト、クラウドファースト」を掲げた。Windows中心の戦略を転換し、Azureとサブスクリプション型のOffice 365を成長の柱に据えた。\n\nLinux対応など過去路線との決別が進み、Azureは以後AWSを追う明確な2番手に浮上する。クラウドが一部門の事業から**企業の存続を賭けた本業**へ格上げされた、企業競争レイヤーの分水嶺である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft: Satya Nadella named CEO (2014-02-04)","url":null}]},{"date":"2014-06-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"GoogleがKubernetesを公開","summary":"Googleが社内基盤Borgの知見をもとに、コンテナ管理システムKubernetesをオープンソース
