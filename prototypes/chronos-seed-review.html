1804-12-02","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"ナポレオン、皇帝に戴冠","summary":"ノートルダム大聖堂で、ナポレオンは教皇ピウス7世の臨席のもと自ら帝冠をかぶり、フランス人民の皇帝ナポレオン1世となった。帝位は事前の国民投票で圧倒的多数の承認を得た形式を踏んでいる。\n\n王を処刑した国民が11年後に皇帝を戴く逆説だが、帝政は世襲王政の復活ではなく「革命の成果の上に立つ君主制」を自称した。国民投票という装置で権力を正当化する手法は、以後の近代政治にも受け継がれる。欧州諸王室はこれを挑発と受け取り、対仏大同盟が再結成されていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Coronation of Napoleon","url":"https://en.wikipedia.org/wiki/Coronation_of_Napoleon"}]},{"date":"1805-12-02","precision":"day","end_date":null,"type":"point","layer":"戦争と外交","title":"アウステルリッツの三帝会戦","summary":"ナポレオンがロシア・オーストリア連合軍を大破した。中央の高地をあえて放棄して敵を誘い込み、分断して撃破する采配は戦史上の傑作とされ、第三次対仏大同盟は崩壊した。\n\n戴冠1周年の日の大勝は帝政の軍事的絶頂を示し、翌年の神聖ローマ帝国解体とライン同盟結成につながった。ただし同年10月のトラファルガー海戦で仏西艦隊は英海軍に壊滅しており、大陸の覇権と海の敗北という対照が、翌年の大陸封鎖という経済戦争の選択を規定する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Battle of Austerlitz","url":"https://en.wikipedia.org/wiki/Battle_of_Austerlitz"}]},{"date":"1806-11-21","precision":"day","end_date":null,"type":"point","layer":"戦争と外交","title":"ベルリン勅令、大陸封鎖令を発布","summary":"占領下のベルリンでナポレオンが大陸封鎖令を発し、大陸諸国とイギリスの通商を禁じた。海戦で勝てないイギリスを経済的に締め上げる戦略である。\n\n実際には密貿易が横行し、穀物や工業品の流通が滞って大陸側の民衆と商工業(民衆と社会レイヤー)にも打撃を与えた。封鎖の徹底を各国に強制する必要が、スペイン介入やロシア遠征といった過剰な軍事行動を呼び込み、帝国の破滅の遠因となる。経済戦争が軍事的破綻を招いた例として引かれることが多い。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Continental System","url":"https://en.wikipedia.org/wiki/Continental_System"}]},{"date":"1812-06-24","precision":"day","end_date":"1812-12-14","type":"period","layer":"戦争と外交","title":"ロシア遠征、大陸軍の壊滅","summary":"大陸封鎖から離反したロシアを罰するため、ナポレオンは60万人規模とされる多国籍の大陸軍でニエメン川を渡った。ボロジノの激戦を経てモスクワに入城したが、講和は成立せず、大火と飢えと冬将軍のなかの退却で軍は壊滅した。\n\n動員国家の頂点で起きた最大の破局であり、翌年の諸国民解放戦争と1814年の退位への転回点となる。フランス一国の革命が生んだエネルギーが、欧州全土を巻き込んで反転してくる構図がここに極まった。","detail":null,"credibility":"disputed","credibility_note":"侵攻兵力(45万〜68万)と生還者数(数万人規模)は史料・算定範囲により大きく幅があり、確定値はない。","sources":[{"title":"Wikipedia: French invasion of Russia","url":"https://en.wikipedia.org/wiki/French_invasion_of_Russia"}]},{"date":"1815-06-18","precision":"day","end_date":null,"type":"point","layer":"戦争と外交","title":"ワーテルローの戦い、百日天下の終焉","summary":"エルバ島を脱出して復位したナポレオンは、ブリュッセル南方ワーテルローでウェリントンの英蘭連合軍と対峙し、プロイセン軍の到着により決定的に敗れた。再退位の後、セントヘレナ島へ流される。\n\n25年に及んだ革命戦争・ナポレオン戦争の終幕であり、ウィーン体制下で各国は王政へ回帰した。しかし法典・行政制度・国民主権の理念は消えず、**帝政は滅び、原理は残った**。以後の19世紀欧州は、この反動と継承の緊張のうえで動いていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Battle of Waterloo","url":"https://en.wikipedia.org/wiki/Battle_of_Waterloo"}]}]},{"slug":"history-german-reunification","title":"東西ドイツ統一","description":"敗戦国の分割占領から1990年10月3日の統一まで。大国の外交、東ドイツの体制と経済、市民の動きを三層で重ね、45年の分断が1年足らずで解けた理由と、その後に残った課題を追う。","category":"history-politics","language":"ja","start_year":1945,"end_year":1994,"layers":[{"name":"外交と大国","color":"blue"},{"name":"体制と経済","color":"gold"},{"name":"市民と社会","color":"orange"}],"events":[{"date":"1945-08-02","precision":"day","end_date":null,"type":"point","layer":"外交と大国","title":"ポツダム協定、ドイツ4か国分割占領","summary":"1945年8月2日、米英ソの首脳はポツダム協定に合意し、敗戦国ドイツを米英仏ソの4占領地区に、首都ベルリンを4分割統治とすることを確定した。非ナチ化・非武装化と、統一体としての管理が建前だった。\n\n「一時的な占領管理」のはずの線引きは、米ソ対立の激化とともに固定化していく。とりわけソ連占領地区の奥深くに浮かぶ西ベルリンという飛び地の存在が、以後45年にわたる分断の火種であり続けた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ポツダム協定","url":"https://ja.wikipedia.org/wiki/ポツダム協定"}]},{"date":"1948-06-24","precision":"day","end_date":"1949-05-12","type":"period","layer":"外交と大国","title":"ベルリン封鎖と大空輸","summary":"1948年6月24日、西側地区の通貨改革に反発したソ連は、西ベルリンへ通じる陸路と水路を全面封鎖した。米英は約11か月間、200万人の市民の食料と石炭を空輸で運び続け、1949年5月12日に封鎖は解除された。\n\n冷戦最初の本格的な対決は、軍事衝突なしに西側の西ベルリン残留を確定させた。封鎖は西ベルリン市民の帰属意識を西側へ決定的に傾け、翌月からの二つの国家の建国(体制と経済レイヤー)への流れを不可逆にした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ベルリン封鎖","url":"https://ja.wikipedia.org/wiki/ベルリン封鎖"}]},{"date":"1949-05-23","precision":"day","end_date":null,"type":"point","layer":"外交と大国","title":"西独と東独、二つの国家が成立","summary":"1949年5月23日にドイツ連邦共和国(西独)の基本法が公布・発効し、10月7日にはソ連占領地区にドイツ民主共和国(東独)が建国された。占領地区の境界が、そのまま二つの国家の境界になった。\n\n西独の基本法は「憲法」を名乗らず、統一までの暫定秩序と自らを規定した。この建て付けが41年後、東独の「加入」による統一という法形式を可能にする。双方は互いを正式の国家と認めず、分断は「暫定」の名の下で固定化していった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ドイツ連邦共和国基本法","url":"https://ja.wikipedia.org/wiki/ドイツ連邦共和国基本法"},{"title":"Wikipedia: ドイツ民主共和国","url":"https://ja.wikipedia.org/wiki/ドイツ民主共和国"}]},{"date":"1953-06-17","precision":"day","end_date":null,"type":"point","layer":"市民と社会","title":"6月17日事件、東独全土の労働者蜂起","summary":"1953年6月17日、労働ノルマ引き上げへの抗議から始まったストライキは東独全土で数十万人規模のデモに発展し、ソ連軍の戦車が鎮圧した。死者は少なくとも55人とされるが、推計には幅がある。\n\n東独の体制がソ連軍なしには維持できないことを、建国4年目にして示した事件である。以後、体制は監視機構(シュタージ)を肥大させ、市民の不満は公然の抗議から西への出国という形に変わっていく。西独はこの日を「ドイツ統一の日」として祝日にした。","detail":null,"credibility":"disputed","credibility_note":"死者数は55人から125人以上まで推計に幅があり、正確な犠牲者数は確定していない。","sources":[{"title":"Wikipedia: East German uprising of 1953","url":"https://en.wikipedia.org/wiki/East_German_uprising_of_1953"}]},{"date":"1961-08-13","precision":"day","end_date":null,"type":"point","layer":"体制と経済","title":"ベルリンの壁の建設","summary":"1961年8月13日未明、東独は東西ベルリンの境界を封鎖し、壁の建設を始めた。建国以来の西への出国者は累計約270万人に達しており、若年層と技術者の流出は体制の存続そのものを脅かしていた。\n\n壁は東独経済をひとまず安定させたが、**国民を閉じ込めなければ維持できない体制**であることを世界に可視化した。以後28年間、壁を越えようとして少なくとも140人が命を落とす。ケネディの「私はベルリン市民である」演説(1963年)など、壁は冷戦の象徴となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ベルリンの壁","url":"https://ja.wikipedia.org/wiki/ベルリンの壁"}]},{"date":"1972-12-21","precision":"day","end_date":null,"type":"point","layer":"外交と大国","title":"東西ドイツ基本条約に調印","summary":"1972年12月21日、東西ドイツは基本条約に調印し、互いを対等な存在として尊重し常駐代表部を置くことで合意した。翌1973年、両国は同時に国連へ加盟する。\n\nブラント西独首相の東方外交は、対決ではなく「**接近による変化**」を掲げた。分断の現実をいったん認めることで人の往来と通信を広げ、東独社会に西側との接点を保ち続ける。この回路が、1980年代末の市民と社会レイヤーの動きで効いてくることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 東西ドイツ基本条約","url":"https://ja.wikipedia.org/wiki/東西ドイツ基本条約"}]},{"date":"1975-08-01","precision":"day","end_date":null,"type":"point","layer":"外交と大国","title":"ヘルシンキ宣言、人権が東西の議題に","summary":"1975年8月1日、欧州33か国と米国・カナダが全欧安全保障協力会議(CSCE)の最終文書に署名した。欧州の国境の現状承認と引き換えに、人権と基本的自由の尊重、人と情報の移動の自由が明記された。\n\nソ連圏は国境の承認を成果と見たが、**人権が国際合意の言葉になった**ことの効果は逆向きに働いた。東欧各国で宣言を根拠に人権侵害を記録する市民グループが生まれ、東独でも出国申請者や教会内の運動が「ヘルシンキ」を盾に取るようになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 全欧安全保障協力会議","url":"https://ja.wikipedia.org/wiki/全欧安全保障協力会議"}]},{"date":"1976-11-16","precision":"day","end_date":null,"type":"point","layer":"体制と経済","title":"ビーアマン国籍剥奪事件","summary":"1976年11月16日、東独は西独公演中の歌手ヴォルフ・ビーアマンの帰国を拒み、国籍を剥奪した。体制批判の歌を理由とする、事実上の追放だった。\n\n著名な作家や俳優が公然と抗議声明を出し、その多くが処分や出国に追い込まれた。この事件は知識人と体制の決定的な亀裂となり、文化による統合という東独の建前を自ら壊した。抗議した文化人たちへの監視の記録は、統一後にシュタージ文書として公開されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Wolf Biermann","url":"https://en.wikipedia.org/wiki/Wolf_Biermann"}]},{"date":"1983-01-01","precision":"year","end_date":null,"type":"point","layer":"体制と経済","title":"西独が東独への10億マルク借款を保証","summary":"1983年、西独政府はバイエルン州首相シュトラウスの仲介による10億西独マルクの民間銀行借款を東独に保証した。反共の急先鋒として知られた政治家が東独への融資を仲介したことは、東西双方に衝撃を与えた。\n\n東独は深刻な外貨不足にあり、借款は支払い不能の回避を助けた。**市場の外にある体制が、市場からの借金で延命する**構図である。借款が体制を安定させたのか、依存を深めて崩壊を早めたのかは、今も評価が分かれる。","detail":null,"credibility":"disputed","credibility_note":"借款が東独体制の延命・崩壊に与えた影響の評価は、研究者の間で分かれている。","sources":[{"title":"ドイツ連邦政治教育センター(bpb)資料: Milliardenkredit","url":null},{"title":"Wikipedia: Franz Josef Strauss","url":"https://en.wikipedia.org/wiki/Franz_Josef_Strauss"}]},{"date":"1985-03-11","precision":"day","end_date":null,"type":"point","layer":"外交と大国","title":"ゴルバチョフ、ソ連書記長に就任","summary":"1985年3月11日、54歳のゴルバチョフがソ連共産党書記長に就任し、ペレストロイカ(再建)とグラスノスチ(情報公開)を掲げた。やがて東欧諸国への内政不干渉へ舵を切り、軍事介入を正当化してきた「ブレジネフ・ドクトリン」を事実上放棄する。\n\nソ連軍の介入(1953年の記憶)こそが東独体制の最後の担保だった。その担保が静かに外されたことで、体制と経済レイヤーの矛盾も市民と社会レイヤーの不満も、もはや戦車では抑えられないものになっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ミハイル・ゴルバチョフ","url":"https://ja.wikipedia.org/wiki/ミハイル・ゴルバチョフ"}]},{"date":"1989-09-11","precision":"day","end_date":null,"type":"point","layer":"市民と社会","title":"ハンガリー国境開放、東独市民の大量出国","summary":"1989年9月11日、ハンガリーは東独市民のオーストリアへの出国を正式に認めた。この夏、東独の休暇客は西への脱出路を求めて国境地帯やプラハの西独大使館に殺到しており、数週間で数万人が西へ渡ったとされる。\n\n5月の国境鉄条網の撤去、8月の「汎ヨーロッパ・ピクニック」と、鉄のカーテンの穴は段階的に広がっていた。「逃げる自由」が現実になったことで、国内に残る市民の「とどまって変える」声、すなわちライプツィヒのデモも一気に力を増す。","detail":null,"credibility":"unverified","credibility_note":"1989年夏から秋の出国者数は当時の当局・報道の推計で、集計により数値に幅がある。","sources":[{"title":"Wikipedia: 汎ヨーロッパ・ピクニック","url":"https://ja.wikipedia.org/wiki/汎ヨーロッパ・ピクニック"}]},{"date":"1989-10-09","precision":"day","end_date":null,"type":"point","layer":"市民と社会","title":"ライプツィヒ月曜デモ、7万人の行進","summary":"1989年10月9日、ライプツィヒのニコライ教会の「平和の祈り」から続く月曜デモに約7万人(推計)が集まり、「**我々が人民だ**」を合言葉に市内を行進した。治安部隊は展開したが、発砲は起きなかった。\n\n建国40周年式典の直後、天安門事件(同年6月)型の鎮圧が公然と語られる中で、暴力なしに行進が貫かれたことは決定的だった。以後デモは毎週膨れ上がり、体制は市民を止める手段を失っていく。参加者数は主催者側や研究者の推計に依存する。","detail":null,"credibility":"unverified","credibility_note":"参加者数約7万人は推計であり、正確な人数を示す記録はない。","sources":[{"title":"Wikipedia: Monday demonstrations in East Germany","url":"https://en.wikipedia.org/wiki/Monday_demonstrations_in_East_Germany"}]},{"date":"1989-11-09","precision":"day","end_date":null,"type":"point","layer":"市民と社会","title":"ベルリンの壁崩壊","summary":"1989年11月9日夜、東独政府報道官シャボフスキーが記者会見で新しい出国規制を「遅滞なく」施行すると発表し、検問所に市民が殺到した。国境警備は圧力に屈して通行を認め、壁は事実上崩壊した。\n\n準備不足の記者会見という偶然が引き金だったが、それが引き金になり得たのは、出国の波とデモによって体制の権威がすでに空洞化していたからである。この夜を境に、問いは「東独をどう改革するか」から「統一をどう進めるか」へと急速に移っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ベルリンの壁崩壊","url":"https://ja.wikipedia.org/wiki/ベルリンの壁崩壊"}]},{"date":"1989-11-28","precision":"day","end_date":null,"type":"point","layer":"外交と大国","title":"コール首相、統一への10項目提案","summary":"1989年11月28日、西独のコール首相は連邦議会で、両独の連合的構造を経て連邦国家へ段階的に進む10項目計画を表明した。壁崩壊からわずか19日後、同盟国にも事前に諮らない単独の発表だった。\n\n**タブーだった「統一」が公式の政治目標に戻った**瞬間である。英仏には強い警戒があり、ソ連は反発したが、東独のデモの合言葉は「我々は一つの人民だ」へ変わり、流れは加速する。統一の主導権が街頭と西独政府に移ったことを示す出来事だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ドイツ連邦議会議事録(1989年11月28日) コール首相演説","url":null},{"title":"Wikipedia: ヘルムート・コール","url":"https://ja.wikipedia.org/wiki/ヘルムート・コール"}]},{"date":"1990-03-01","precision":"day","end_date":"1994-12-31","type":"period","layer":"体制と経済","title":"信託公社による東独経済の民営化","summary":"1990年3月に設立された信託公社(トロイハント)は、約8500の東独国営企業(コンビナート)を引き継ぎ、統一後の1994年末までに売却・清算を進めた。一国の経済のほぼ全体を市場経済へ移し替える、前例のない事業だった。\n\nその過程で数百万人規模の雇用が失われたとされ、東部の脱工業化と西部資本への安値売却をめぐる不満は、統一後の東西の心理的な溝の核心となった。雇用喪失の規模や民営化全体の評価は、今日まで論争が続いている。","detail":null,"credibility":"disputed","credibility_note":"民営化に伴う雇用喪失の規模(約250万人とする推計もある)や事業全体の評価は、推計・立場により大きく分かれる。","sources":[{"title":"Wikipedia: Treuhandanstalt","url":"https://en.wikipedia.org/wiki/Treuhandanstalt"}]},{"date":"1990-03-18","precision":"day","end_date":null,"type":"point","layer":"体制と経済","title":"東独初の自由選挙、早期統一派が勝利","summary":"1990年3月18日、東独で初めて自由な人民議会選挙が行われ、93%を超える投票率の下、コール支持の選挙連合「ドイツのための連合」が第一勢力となった。争点はもはや体制の改革ではなく、統一までの速度だった。\n\n「改革された東独」の存続を模索した市民運動側の得票は数%にとどまり、有権者は西独マルクと早期統一を選んだ。この結果が、基本法23条による東独の加入という最短の法形式と、通貨同盟の早期実施を決定づけた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1990 East German general election","url":"https://en.wikipedia.org/wiki/1990_East_German_general_election"}]},{"date":"1990-07-01","precision":"day","end_date":null,"type":"point","layer":"体制と経済","title":"通貨・経済・社会同盟が発足","summary":"1990年7月1日、東西ドイツの通貨・経済・社会同盟が発効し、西独マルクが東独の通貨となった。賃金・年金と一定額までの預金は1対1で交換され、両独間の国境管理も事実上撤廃された。\n\n政治的には統一を先取りする決定だったが、実勢を大きく上回る交換レートは東独企業の競争力を一夜で奪い、倒産と失業の波(信託公社の民営化)を加速したと批判される。統一の速度と経済の現実との緊張が、ここに凝縮されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ドイツ再統一","url":"https://ja.wikipedia.org/wiki/ドイツ再統一"}]},{"date":"1990-09-12","precision":"day","end_date":null,"type":"point","layer":"外交と大国","title":"2プラス4条約に調印","summary":"1990年9月12日、モスクワで東西ドイツと米英仏ソの外相が「ドイツに関する最終規定条約」に調印した。戦勝4か国の占領国としての権利は終了し、統一ドイツは完全な主権と、NATOに残留する自由を認められた。\n\nオーデル・ナイセ線の国境確定、兵力の上限、ソ連軍の撤退と経済支援が取引の中身だった。1945年のポツダム(外交と大国レイヤーの起点)で始まった「戦勝国による管理」が、45年を経て正式に閉じられた条約である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ドイツ最終規定条約","url":"https://ja.wikipedia.org/wiki/ドイツ最終規定条約"}]},{"date":"1990-10-03","precision":"day","end_date":null,"type":"point","layer":"体制と経済","title":"ドイツ統一、東独が連邦共和国へ加入","summary":"1990年10月3日、ドイツ民主共和国は基本法第23条に基づきドイツ連邦共和国へ加入し、東西ドイツは統一された。壁の崩壊から1年足らず、ベルリンの旧帝国議会議事堂前に連邦の旗が掲げられた。\n\n法形式の上では東独の消滅による「加入」であり、新憲法の制定という道は選ばれなかった。外交の合意、体制の自壊、市民の圧力という三つの層が一点で交わった帰結だが、経済統合と心理的な統一という課題はこの日から始まる。10月3日は「ドイツ統一の日」として祝日となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ドイツ再統一","url":"https://ja.wikipedia.org/wiki/ドイツ再統一"}]}]},{"slug":"history-industrial-revolution","title":"産業革命の波紋","description":"蒸気機関と紡績機から始まった変化が、都市と経済、そして働く人々の生活をどう作り替えたか。技術・経済と都市・労働と社会運動の三層を重ね、一つの発明が社会全体に広がる波紋を追う。","category":"history-politics","language":"ja","start_year":1712,"end_year":1872,"layers":[{"name":"技術と発明","color":"blue"},{"name":"経済と都市","color":"orange"},{"name":"労働と社会運動","color":"pink"}],"events":[{"date":"1712-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と発明","title":"ニューコメンの蒸気機関が稼働","summary":"1712年、トーマス・ニューコメンの大気圧機関がイングランドの炭鉱で排水用に稼働を始めた。人力と畜力と水力しかなかった世界に、燃料から動力を取り出す初めての実用機械が現れた。\n\n効率は低く、用途も鉱山の排水にほぼ限られたが、**石炭を動力に変える**という原理はここで実証された。半世紀後にワットはこの機関の改良から出発する。産業革命という波紋の、最初の一滴にあたる出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Newcomen atmospheric engine","url":"https://en.wikipedia.org/wiki/Newcomen_atmospheric_engine"}]},{"date":"1733-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と発明","title":"ジョン・ケイ、飛び杼を発明","summary":"1733年、ジョン・ケイが特許を得た飛び杼(フライング・シャトル)は織布の速度をおよそ2倍にし、これまで2人がかりだった広幅の布を1人で織ることを可能にした。\n\n織りが速くなると、今度は糸が足りなくなる。この不均衡が後の紡績機の発明競争を呼び、技術が次の技術を要求する連鎖が始まった。職を奪われることを恐れた織工たちの反発でケイが困窮したという逸話も伝わるが、その細部は検証されていない。","detail":null,"credibility":"unverified","credibility_note":"ケイが織工の反発を受けて困窮・亡命したという逸話は後世の脚色を含む可能性があり、検証されていない。","sources":[{"title":"Wikipedia: John Kay (flying shuttle)","url":"https://en.wikipedia.org/wiki/John_Kay_(flying_shuttle)"},{"title":"T.S.アシュトン『産業革命』","url":null}]},{"date":"1764-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と発明","title":"ハーグリーブスのジェニー紡績機","summary":"織工ジェームズ・ハーグリーブスが、1人で複数の錘(つむ)を同時に回せるジェニー紡績機を作った。家内工業の道具の形のまま、紡績の生産性を数倍に引き上げた発明である。\n\n発明年は1764年とも65年ともされ、ハーグリーブス自身が記録を残さなかったため確定しない。飛び杼が生んだ糸不足への応答であり、まもなくアークライトの水力紡績機と競い合いながら、綿工業を技術革新の主戦場に変えていく。","detail":null,"credibility":"disputed","credibility_note":"発明年は1764〜65年と資料により幅があり、発明の経緯も後年の証言と伝承に依存する。","sources":[{"title":"Wikipedia: Spinning jenny","url":"https://en.wikipedia.org/wiki/Spinning_jenny"}]},{"date":"1769-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と発明","title":"ワットの分離凝縮器特許","summary":"ジェームズ・ワットが、蒸気を別室で冷やす分離凝縮器の特許を取得した。ニューコメン機関の燃料消費を大幅に減らすこの改良で、蒸気機関は炭鉱の外でも採算の取れる動力になった。\n\n同じ1769年にはアークライトが水力紡績機の特許を得ており、動力と作業機械の革新が同時に進んだ。ワットは実業家ボールトンと組み、特許制度に守られながら機関を市場化していく。技術が資本と結びつく産業革命の型が、ここで整った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ジェームズ・ワット","url":"https://ja.wikipedia.org/wiki/ジェームズ・ワット"}]},{"date":"1771-01-01","precision":"year","end_date":null,"type":"point","layer":"経済と都市","title":"アークライト、クロムフォードに紡績工場","summary":"リチャード・アークライトがダーウェント川沿いのクロムフォードに水力紡績工場を建てた。数百人が機械の速度に合わせて交替で働く、近代的な工場制度の原型である。\n\n農村の仕事は季節と日光が区切っていたが、工場では時計が区切る。**時間で管理される労働**という新しい生活の型がここで生まれ、やがて都市へ、そして世界へ広がっていく。工場村クロムフォードを含むダーウェント峡谷は、現在世界遺産に登録されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cromford Mill","url":"https://en.wikipedia.org/wiki/Cromford_Mill"}]},{"date":"1776-03-09","precision":"day","end_date":null,"type":"point","layer":"経済と都市","title":"アダム・スミス『国富論』刊行","summary":"1776年3月9日、アダム・スミスの『国富論』が刊行された。ピン工場の分業の観察から説き起こし、市場での交換が社会全体の富を増やしていく仕組みを体系的に描いた。\n\n重商主義的な規制や独占への批判は、その後の自由貿易政策や工場主たちの自己理解を支える理論となった。工業化がまだ始まったばかりの時点で、来たるべき経済社会を語る言葉を先に用意した書物といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 国富論","url":"https://ja.wikipedia.org/wiki/国富論"}]},{"date":"1785-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と発明","title":"カートライトの力織機特許","summary":"聖職者エドマンド・カートライトが、動力で布を織る力織機の特許を取得した。初期の機械は実用性に乏しかったが、改良を重ねて19世紀初頭から普及が進む。\n\n紡績の機械化が生んだ「糸余り」への応答であり、飛び杼以来の技術連鎖がこれで一巡した。手織工は一時は高賃金を享受したが、力織機の普及とともに没落していき、その困窮が労働と社会運動レイヤーのラッダイト運動の背景の一つとなる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edmund Cartwright","url":"https://en.wikipedia.org/wiki/Edmund_Cartwright"}]},{"date":"1811-01-01","precision":"year","end_date":"1816-12-31","type":"period","layer":"労働と社会運動","title":"ラッダイト運動（機械打ち壊し）","summary":"1811年、ノッティンガムの靴下編工から始まった機械打ち壊しは、伝説の指導者「ネッド・ラッド」の名を掲げてランカシャーやヨークシャーの繊維地帯に広がった。政府は軍を投入し、機械破壊を死刑とする法で応じた。\n\n単純な機械嫌いではなく、賃金切り下げと熟練の無価値化への抗議だった。団結が法で禁じられていた時代、機械の破壊(技術と発明レイヤーの力織機など)は残された交渉手段でもあった。「ラッド」なる人物の実在は確認されていない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ラッダイト運動","url":"https://ja.wikipedia.org/wiki/ラッダイト運動"},{"title":"E.P.トムスン『イングランド労働者階級の形成』","url":null}]},{"date":"1819-08-16","precision":"day","end_date":null,"type":"point","layer":"労働と社会運動","title":"ピータールーの虐殺","summary":"1819年8月16日、マンチェスターの聖ピーター広場で議会改革を求めて集まった約6万人の群衆に騎兵隊が突入し、死者十数人、負傷者数百人を出した。ワーテルローをもじって「ピータールー」と呼ばれる。\n\n急成長する工業都市マンチェスターには、当時まだ独自の議席がなかった。**繁栄の中心にいながら発言権を持たない人々**の存在をこの事件は可視化し、1832年の選挙法改正へ続く長い圧力の起点となった。","detail":null,"credibility":"disputed","credibility_note":"死者数は11〜18人、参加者数は6万人前後と、資料により推計に幅がある。","sources":[{"title":"Wikipedia: Peterloo Massacre","url":"https://en.wikipedia.org/wiki/Peterloo_Massacre"}]},{"date":"1825-09-27","precision":"day","end_date":null,"type":"point","layer":"技術と発明","title":"世界初の公共鉄道が開業","summary":"1825年9月27日、スティーヴンソンの機関車ロコモーション号が客車と貨車を牽いてストックトン・アンド・ダーリントン鉄道を走った。蒸気機関車が牽く世界初の公共鉄道である。\n\nもとは炭鉱の石炭を港へ運ぶための路線だったが、蒸気機関が「据え付けの動力」から「移動する動力」へ変わった意味は大きい。5年後のリバプール・マンチェスター鉄道(経済と都市レイヤー)で、鉄道の時代が本格的に開く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Stockton and Darlington Railway","url":"https://en.wikipedia.org/wiki/Stockton_and_Darlington_Railway"}]},{"date":"1830-09-15","precision":"day","end_date":null,"type":"point","layer":"経済と都市","title":"リバプール・マンチェスター鉄道開業","summary":"綿工業都市マンチェスターと港湾都市リバプールを結ぶ、時刻表に基づき機関車牽引で運行される初の都市間鉄道が開業した。開業式典では政治家ハスキソンが機関車にひかれて死亡する事故も起きている。\n\n輸送費と移動時間の劇的な短縮は、原料と製品と人と情報の流れを一変させた。以後20年で英国は鉄道網に覆われ、株式投機の熱狂(鉄道狂時代)まで生む。産業革命の波紋が、空間そのものを縮め始めた出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Liverpool and Manchester Railway","url":"https://en.wikipedia.org/wiki/Liverpool_and_Manchester_Railway"}]},{"date":"1833-01-01","precision":"year","end_date":null,"type":"point","layer":"労働と社会運動","title":"工場法成立、児童労働に国家が介入","summary":"1833年の工場法は、繊維工場での9歳未満の児童の就労を禁じ、年少者の労働時間を制限し、専任の工場監督官を置いた。実効性を備えた初の労働立法とされる。\n\n**自由放任の時代に、国家が工場の門をくぐった**転換点である。監督官の報告書は労働の実態を数字で可視化し、以後の10時間法など一連の工場立法の根拠となった。児童に就学を義務づけた規定は、公教育の整備にもつながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Factory Acts","url":"https://en.wikipedia.org/wiki/Factory_Acts"}]},{"date":"1842-05-02","precision":"day","end_date":null,"type":"point","layer":"労働と社会運動","title":"チャーティスト運動、第2次請願を提出","summary":"男子普通選挙などを求める人民憲章を掲げたチャーティスト運動は、1842年5月2日、主催者発表で300万筆を超える署名を議会に提出した。同年夏には賃下げに抗議するストライキが工業地帯に広がった。\n\n議会は請願の審議自体を拒んだが、工場労働者が全国規模の政治運動を組織したこと自体が新しかった。掲げられた要求の多く(普通選挙・秘密投票など)は、半世紀以上かけて実現していくことになる。","detail":null,"credibility":"unverified","credibility_note":"署名数(約331万筆とされる)は主催者側の集計で、水増しの指摘もあり第三者による検証はない。","sources":[{"title":"Wikipedia: Chartism","url":"https://en.wikipedia.org/wiki/Chartism"}]},{"date":"1844-01-01","precision":"year","end_date":"1847-12-31","type":"period","layer":"経済と都市","title":"鉄道狂時代（レイルウェイ・マニア）","summary":"1840年代半ばの英国では鉄道会社の設立と株式投機が過熱し、ピークの1846年には270本を超える鉄道法案が議会を通過した。中流層まで巻き込んだ投機は40年代末に破綻し、多くの投資家が財産を失った。\n\nしかしバブルの残骸として、路線網は現実に残った。技術レイヤーの発明が資本市場の熱狂を生み、その熱狂が意図せずインフラを整備するという、後の時代にも繰り返されるパターンの原型である。","detail":null,"credibility":"disputed","credibility_note":"「鉄道狂時代」の期間の区切りは慣用的で、投機の規模や損失額の推計は研究により幅がある。","sources":[{"title":"Wikipedia: Railway Mania","url":"https://en.wikipedia.org/wiki/Railway_Mania"}]},{"date":"1848-02-01","precision":"month","end_date":null,"type":"point","layer":"労働と社会運動","title":"『共産党宣言』刊行","summary":"1848年2月、マルクスとエンゲルスの『共産党宣言』がロンドンで刊行された。産業革命が生んだブルジョアジーとプロレタリアートの対立を歴史の推進力として描き、労働者の国際的な団結を呼びかけた。\n\n刊行直後に大陸では二月革命・三月革命が連鎖したが、宣言自体の同時代への影響は限られていた。むしろ後年、労働運動と社会主義運動の基礎文献となっていく。エンゲルスの父は、マンチェスターの紡績工場の共同経営者だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 共産党宣言","url":"https://ja.wikipedia.org/wiki/共産党宣言"}]},{"date":"1851-05-01","precision":"day","end_date":null,"type":"point","layer":"経済と都市","title":"ロンドン万国博覧会が開幕","summary":"1851年5月1日、ガラスと鉄でできた水晶宮を会場に、世界初の万国博覧会が開幕した。約5か月半の会期で600万人が入場し、展示の中心は英国の機械と工業製品が占めた。\n\n**「世界の工場」となった英国**が自国の工業力を世界に示す祭典であり、整備されたばかりの鉄道網が地方から観客を運んだ。他国は展示から技術と制度を学び、以後の万博は各国の工業化の進度を競う場となる。入場者数は主催者の記録に基づく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Great Exhibition","url":"https://en.wikipedia.org/wiki/Great_Exhibition"}]},{"date":"1856-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と発明","title":"ベッセマー転炉法の発表","summary":"ヘンリー・ベッセマーが、溶けた銑鉄に空気を吹き込んで大量の鋼を安価に作る転炉法を発表した。鋼の価格は劇的に下がり、レール・船・建築・機械の素材が鉄から鋼へ置き換わっていく。\n\n産業革命の主役だった綿と石炭に、鋼という新しい主役が加わった。安価な鋼は、より長い鉄道、より大きな船、やがては高層建築を可能にし、重工業と化学を軸とするいわゆる第二次産業革命への橋渡しとなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bessemer process","url":"https://en.wikipedia.org/wiki/Bessemer_process"}]},{"date":"1858-01-01","precision":"year","end_date":null,"type":"point","layer":"経済と都市","title":"ロンドンの「大悪臭」と下水道建設","summary":"1858年夏、猛暑でテムズ川の汚水が腐敗し、議事堂が窓を閉ざすほどの悪臭がロンドンを覆った。「大悪臭」と呼ばれるこの事態を受け、議会は長年先送りしてきた大下水道の建設をわずか18日で決定した。\n\n人口が急増した工業都市は、コレラの流行と河川汚染という代価を払っていた。バザルジェット設計の下水道網は都市衛生の転換点となり、急成長する都市をどう住める場所にするかという工業化の問いへの、最初の大規模な答えの一つとなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Great Stink","url":"https://en.wikipedia.org/wiki/Great_Stink"}]},{"date":"1871-01-01","precision":"year","end_date":null,"type":"point","layer":"労働と社会運動","title":"英国で労働組合法が成立","summary":"1871年の労働組合法により、労働組合は初めて法的な地位を認められた。団結禁止法(1799年)から70年あまりを経て、組合はもはや犯罪ではなく制度の一部となった。\n\n機械打ち壊し(ラッダイト)から街頭の請願(チャーティズム)を経て、交渉と立法へ。労働運動の手段の変遷は、産業革命が生んだ対立が制度に組み込まれていく過程そのものである。ただし争議行為への刑事責任は残り、完全な合法化はさらに後の課題となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Trade Union Act 1871","url":"https://en.wikipedia.org/wiki/Trade_Union_Act_1871"}]},{"date":"1872-01-01","precision":"year","end_date":null,"type":"point","layer":"経済と都市","title":"富岡製糸場が開業、波紋は日本へ","summary":"1872年(明治5年)、群馬県富岡に官営の器械製糸場が開業した。フランスから技師と機械を導入し、全国から集まった工女たちが器械製糸の技術を学んで各地に伝えた。\n\n英国に始まった工業化の波紋は、1世紀半かけて極東の島国に到達した。**後発国が国家主導で工業化を移植する**モデルの初期例であり、日本の産業革命はここから約40年で重工業の段階まで駆け上がっていく。富岡製糸場は2014年に世界遺産に登録された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 富岡製糸場","url":"https://ja.wikipedia.org/wiki/富岡製糸場"}]}]},{"slug":"history-middle-east","title":"中東紛争の構造","description":"百年にわたる中東の紛争を、戦争・外交・大国の介入という3つの層で重ねて読む。個々の衝突ではなく、紛争が繰り返される構造そのものを浮かび上がらせる年表。","category":"history-politics","language":"ja","start_year":1917,"end_year":2024,"layers":[{"name":"戦争と紛争","color":"pink"},{"name":"外交と和平","color":"blue"},{"name":"大国の介入と資源","color":"gold"}],"events":[{"date":"1917-11-02","precision":"day","end_date":null,"type":"point","layer":"外交と和平","title":"バルフォア宣言、ユダヤ人の「民族的郷土」支持","summary":"英外相バルフォアが、パレスチナにおけるユダヤ人の「民族的郷土」建設への支持を表明する書簡をロスチャイルド卿に送った。第一次大戦中の英国の中東政策の一環である。\n\n同時期の英国はフサイン=マクマホン書簡でアラブ側にも独立を示唆しており、**相互に矛盾する約束**がその後百年の紛争の出発点となった。委任統治(大国の介入と資源レイヤー)の下でユダヤ人移民が増え、両民族の衝突が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Avalon Project: Balfour Declaration 1917","url":"https://avalon.law.yale.edu/20th_century/balfour.asp"}]},{"date":"1947-11-29","precision":"day","end_date":null,"type":"point","layer":"外交と和平","title":"国連総会がパレスチナ分割決議181を採択","summary":"国連総会が決議181を採択し、パレスチナをユダヤ国家とアラブ国家に分割してエルサレムを国際管理下に置く案を可決した。ユダヤ側は受諾し、アラブ側は拒否した。\n\n英国の委任統治放棄を受けた国際社会の解決案だったが、当事者の合意なき分割は翌年の建国と第一次中東戦争(戦争と紛争レイヤー)に直結した。以後の和平交渉は、常にこの決議の線引きを参照点とし続けることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United Nations Partition Plan for Palestine","url":"https://en.wikipedia.org/wiki/United_Nations_Partition_Plan_for_Palestine"}]},{"date":"1948-05-14","precision":"day","end_date":"1949-07-20","type":"period","layer":"戦争と紛争","title":"イスラエル建国宣言と第一次中東戦争","summary":"イスラエルが独立を宣言し、翌日エジプト・ヨルダン・シリアなどアラブ諸国が侵攻して第一次中東戦争が始まった。1949年の休戦協定まで続き、イスラエルは分割決議案を上回る領土を確保した。\n\n戦争の過程で70万人前後のパレスチナ人が故郷を追われ、「ナクバ(大惨事)」と呼ばれる。**難民問題という紛争の核**がここで生まれ、外交と和平レイヤーのすべての和平案が向き合う争点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1948 Arab-Israeli War","url":"https://en.wikipedia.org/wiki/1948_Arab%E2%80%93Israeli_War"}]},{"date":"1956-10-29","precision":"day","end_date":null,"type":"point","layer":"大国の介入と資源","title":"スエズ危機、英仏イスラエルがエジプトへ軍事介入","summary":"ナセルのスエズ運河国有化を受け、イスラエルがシナイ半島に侵攻し、英仏も運河地帯へ軍事介入した。しかし米ソ双方の圧力により、3か国は撤退に追い込まれた。\n\n運河という資源動脈をめぐる旧宗主国の介入は失敗し、中東の主導権は英仏から米ソへ移った。ナセルはアラブ民族主義の英雄となり、以後の戦争と紛争レイヤーの対立構図を大きく規定していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Suez Crisis","url":"https://en.wikipedia.org/wiki/Suez_Crisis"}]},{"date":"1967-06-05","precision":"day","end_date":null,"type":"point","layer":"戦争と紛争","title":"第三次中東戦争、6日間で占領地が拡大","summary":"イスラエルが先制攻撃でエジプト空軍を壊滅させ、6日間でシナイ半島、ガザ地区、ヨルダン川西岸、東エルサレム、ゴラン高原を占領した。\n\nこの戦争で生じた「占領」が以後の紛争の中心争点となり、「土地と平和の交換」を掲げる国連安保理決議242(外交と和平レイヤー)もここから生まれた。入植地やエルサレムの帰属など、現在まで続く争点の大半がこの6日間に起源を持つ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Six-Day War","url":"https://en.wikipedia.org/wiki/Six-Day_War"}]},{"date":"1973-10-06","precision":"day","end_date":null,"type":"point","layer":"戦争と紛争","title":"第四次中東戦争、エジプト・シリアが奇襲","summary":"ユダヤ教の贖罪日にエジプトとシリアがスエズ運河とゴラン高原で奇襲攻撃を開始した。緒戦はアラブ側が優勢に立ったが、イスラエルが巻き返して停戦に至った。\n\n軍事的には決着がつかなかったが、エジプトは緒戦の成功で交渉の足場を得て、単独和平(外交と和平レイヤー)へ向かう。同月の石油戦略(大国の介入と資源レイヤー)と併せ、中東の戦争が世界経済を直撃した最初の例となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Yom Kippur War","url":"https://en.wikipedia.org/wiki/Yom_Kippur_War"}]},{"date":"1973-10-17","precision":"day","end_date":null,"type":"point","layer":"大国の介入と資源","title":"アラブ産油国が石油戦略発動、第一次石油危機","summary":"アラブ石油輸出国機構(OAPEC)がイスラエル支持国への段階的減産と禁輸を決定し、原油価格は数か月で約4倍に高騰した。第一次石油危機である。\n\n**石油が外交兵器として機能する**ことを世界に示し、産油国の発言力を一変させた。消費国は中東和平への関与を強め、翌年以降の米国の仲介外交(外交と和平レイヤー)の背景となる。日本の親アラブ路線への転換など域外国の政策も動かした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1973 oil crisis","url":"https://en.wikipedia.org/wiki/1973_oil_crisis"}]},{"date":"1978-09-17","precision":"day","end_date":null,"type":"point","layer":"外交と和平","title":"キャンプ・デービッド合意","summary":"カーター米大統領の仲介でエジプトのサダトとイスラエルのベギンが合意に署名し、翌1979年の平和条約でエジプトはアラブ諸国として初めてイスラエルを承認した。\n\nシナイ半島は返還されたが、併記されたパレスチナ自治の枠組みは実現せず、サダトは1981年に暗殺された。**個別和平は成立しても中核の問題は残る**という、以後繰り返される和平の型がここで定まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Camp David Accords","url":"https://en.wikipedia.org/wiki/Camp_David_Accords"}]},{"date":"1979-02-11","precision":"day","end_date":null,"type":"point","layer":"大国の介入と資源","title":"イラン革命、親米王政が崩壊","summary":"ホメイニ率いる革命勢力がパフラヴィー王政を打倒し、イスラム共和国が成立した。米国の中東戦略の柱だった親米国家が、一転して敵対国となった。\n\n革命の波及を恐れた周辺国と米国の警戒がイラン・イラク戦争(戦争と紛争レイヤー)の背景となり、第二次石油危機も引き起こした。宗派と革命理念が国家間対立の軸に加わり、中東の紛争構造は一段と複雑になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Iranian Revolution","url":"https://en.wikipedia.org/wiki/Iranian_Revolution"}]},{"date":"1980-09-22","precision":"day","end_date":"1988-08-20","type":"period","layer":"戦争と紛争","title":"イラン・イラク戦争、8年の消耗戦","summary":"イラクのフセイン政権が国境紛争と革命波及への懸念からイランに侵攻し、8年におよぶ消耗戦となった。1988年、国連安保理決議598の受諾により停戦した。\n\n米ソや湾岸諸国がイラクを支援するなど大国の介入と資源レイヤーと深く絡み、化学兵器の使用も確認された。犠牲者は両国合計で推定数十万人から100万人規模とされるが確定していない。戦後のイラクの巨額債務は1990年のクウェート侵攻の一因となる。","detail":null,"credibility":"unverified","credibility_note":"犠牲者数は推計により数十万人から100万人超まで幅があり、確定した統計は存在しない。","sources":[{"title":"Wikipedia: Iran-Iraq War","url":"https://en.wikipedia.org/wiki/Iran%E2%80%93Iraq_War"}]},{"date":"1990-08-02","precision":"day","end_date":null,"type":"point","layer":"戦争と紛争","title":"イラクがクウェート侵攻、湾岸戦争へ","summary":"イラクがクウェートに侵攻し併合を宣言した。国連安保理は即時撤退を要求し、翌1991年1月に米国主導の多国籍軍が攻撃を開始、2月末にクウェートは解放された。\n\n冷戦終結直後の安保理が一致して行動した稀有な事例だった。石油資源(大国の介入と資源レイヤー)が開戦判断の核心にあり、戦後の米軍サウジアラビア駐留は、後の反米武装闘争が掲げる口実ともなっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gulf War","url":"https://en.wikipedia.org/wiki/Gulf_War"}]},{"date":"1993-09-13","precision":"day","end_date":null,"type":"point","layer":"外交と和平","title":"オスロ合意、イスラエルとPLOが相互承認","summary":"ノルウェーの仲介による秘密交渉を経て、イスラエルとPLOが相互承認とパレスチナ暫定自治で合意した。ホワイトハウスでラビン首相とアラファト議長が握手した。\n\n和平プロセスの頂点だったが、エルサレム・難民・入植地という核心問題は先送りされた。1995年のラビン暗殺と双方の強硬派の台頭で行き詰まり、**合意の脆さが次の暴力の温床になる**という構図を残した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Oslo Accords","url":"https://en.wikipedia.org/wiki/Oslo_Accords"}]},{"date":"2001-09-11","precision":"day","end_date":null,"type":"point","layer":"大国の介入と資源","title":"米同時多発テロ、「対テロ戦争」の開始","summary":"アルカイダが米国で同時多発テロを実行し、約3000人が死亡した。米国は翌月アフガニスタンを攻撃し、「対テロ戦争」を宣言した。\n\n攻撃の背景には湾岸戦争後の米軍サウジアラビア駐留への反発があり、中東の紛争構造が米本土への攻撃として跳ね返った出来事といえる。以後の米国の大規模介入は中東の秩序を大きく揺らし、2003年のイラク戦争へつながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: September 11 attacks","url":"https://en.wikipedia.org/wiki/September_11_attacks"}]},{"date":"2003-03-20","precision":"day","end_date":null,"type":"point","layer":"大国の介入と資源","title":"イラク戦争開戦","summary":"米英軍が大量破壊兵器の保有を理由にイラクを攻撃し、フセイン政権を打倒した。しかし大量破壊兵器は発見されず、開戦の正当性は今も争われている。\n\n戦後統治の失敗は宗派対立と過激派の温床を生み、後のIS台頭(戦争と紛争レイヤー)につながった。**外部の介入が新たな紛争を生む**という本年表の構造が、最も明瞭に現れた事例とされる。","detail":null,"credibility":"disputed","credibility_note":"開戦理由とされた大量破壊兵器は発見されず、開戦判断の正当性と国際法上の根拠について現在も評価が分かれる。","sources":[{"title":"Wikipedia: Iraq War","url":"https://en.wikipedia.org/wiki/Iraq_War"}]},{"date":"2010-12-17","precision":"day","end_date":null,"type":"point","layer":"戦争と紛争","title":"アラブの春の発端、チュニジアで抗議拡大","summary":"チュニジアの露天商ブアジジの焼身自殺を契機に反政府デモが拡大し、翌月ベンアリ政権が崩壊した。抗議はエジプト、リビア、シリアなどアラブ諸国へ波及した。\n\n民主化の期待は多くの国で内戦や権威主義の再強化に転じ、特にシリアとリビアは長期の内戦(同レイヤー)に陥った。域外大国の介入が各地の内戦を長期化させ、紛争の主形態が国家間戦争から代理戦争へ移る画期となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Arab Spring","url":"https://en.wikipedia.org/wiki/Arab_Spring"}]},{"date":"2011-03-15","precision":"day","end_date":"2024-12-08","type":"period","layer":"戦争と紛争","title":"シリア内戦、13年でアサド政権崩壊まで","summary":"アサド政権による抗議デモ弾圧から内戦に発展し、ISの台頭、ロシア・イラン・トルコ・米国など多数の外部勢力が介入する複合紛争となった。2024年12月、反体制派の攻勢で政権は崩壊した。\n\n死者は数十万人、難民・国内避難民は1000万人超とされ、代理戦争化した内戦の典型となった。難民の流出は欧州政治まで揺るがし、中東の紛争が域外に及ぼす影響の大きさを改めて示した。","detail":null,"credibility":"disputed","credibility_note":"内戦の開始日には2011年3月15日の抗議拡大を起点とする説など諸説あり、死者数も監視団体による推計で大きな幅がある。","sources":[{"title":"Wikipedia: Syrian civil war","url":"https://en.wikipedia.org/wiki/Syrian_civil_war"}]},{"date":"2015-07-14","precision":"day","end_date":null,"type":"point","layer":"外交と和平","title":"イラン核合意(JCPOA)成立","summary":"イランと米英仏独中露の6か国が、核開発の制限と制裁解除を柱とする包括的共同作業計画(JCPOA)に合意した。10年以上に及んだ核交渉の到達点である。\n\nしかし2018年に米国が一方的に離脱し、合意は形骸化した。**大国の政権交代で外交成果が覆る**脆弱さを示し、地域各国の核・ミサイル開発と代理勢力間の対立(戦争と紛争レイヤー)はむしろ深まっていった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Joint Comprehensive Plan of Action","url":"https://en.wikipedia.org/wiki/Joint_Comprehensive_Plan_of_Action"}]},{"date":"2020-09-15","precision":"day","end_date":null,"type":"point","layer":"外交と和平","title":"アブラハム合意、UAEなどがイスラエルと国交","summary":"米国の仲介でUAEとバーレーンがイスラエルとの国交正常化に合意した。アラブ諸国の正常化はエジプト、ヨルダンに続くもので、後にモロッコとスーダンも加わった。\n\nパレスチナ問題の解決を経ない正常化にパレスチナ側は「裏切り」と反発した。紛争の当事者を置き去りにした和平の限界は、2023年のガザでの戦争(戦争と紛争レイヤー)で改めて問われることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Abraham Accords","url":"https://en.wikipedia.org/wiki/Abraham_Accords"}]},{"date":"2023-10-07","precision":"day","end_date":null,"type":"point","layer":"戦争と紛争","title":"ハマスの奇襲攻撃とガザ戦争","summary":"ハマスがイスラエルへ大規模な奇襲攻撃を行い、約1200人を殺害し約250人を人質とした。イスラエルはガザ地区への大規模攻撃で応じ、戦闘はレバノンやイエメン、イランへも波及した。\n\nガザ側の死者は保健当局の集計で数万人規模とされるが、独立した検証は難しい。難民・占領・エルサレムという百年来の争点が未解決のまま残っていたことを、最も苛烈な形で示した戦争となった。","detail":null,"credibility":"unverified","credibility_note":"双方の死者数は当事者側の発表に基づき、特にガザ側の集計は独立検証が困難で数値に幅がある。","sources":[{"title":"Reuters・BBC等による2023年10月7日攻撃とガザ戦争の報道","url":null}]}]},{"slug":"history-postwar-japan","title":"日本の戦後復興","description":"焼け跡の1945年から大阪万博まで25年。政治外交・経済産業・暮らしの3層を重ね、占領改革と国際復帰、成長の光と代償が、家庭の風景をどう変えたかを追う年表。","category":"history-politics","language":"ja","start_year":1945,"end_year":1970,"layers":[{"name":"政治と外交","color":"blue"},{"name":"経済と産業","color":"gold"},{"name":"暮らしと文化","color":"green"}],"events":[{"date":"1945-08-15","precision":"day","end_date":null,"type":"point","layer":"政治と外交","title":"玉音放送、戦争が終わる","summary":"昭和天皇がポツダム宣言受諾を国民にラジオで告げ、日本の戦争は終わった。国土の主要都市は空襲で焦土となり、生産力は崩壊し、海外からは約600万人の引揚げが始まる。\n\n9月2日の降伏文書調印を経て連合国軍の占領下に入り、政治・経済・暮らしのすべてがゼロからの再出発となった。この年表は、この日を起点に25年で大阪万博(暮らしと文化レイヤー)へ至る距離を測るものである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 玉音放送","url":"https://ja.wikipedia.org/wiki/玉音放送"}]},{"date":"1945-10-11","precision":"day","end_date":null,"type":"point","layer":"政治と外交","title":"GHQが五大改革を指示","summary":"マッカーサーが幣原喜重郎首相に、婦人参政権、労働組合の結成奨励、教育の自由化、圧政的諸制度の廃止、経済の民主化のいわゆる五大改革を口頭で指示した。占領改革の骨格を示すものである。\n\n財閥解体・農地改革(経済と産業レイヤー)や新憲法制定はこの延長線上にあり、翌1946年4月の総選挙では女性が初めて投票し39人の女性議員が誕生した。敗戦国の社会構造を外からの力が組み替えていく、占領期の性格を象徴する指令である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国立国会図書館「日本国憲法の誕生」資料と解説","url":"https://www.ndl.go.jp/constitution/"}]},{"date":"1946-10-21","precision":"day","end_date":"1950-12-31","type":"period","layer":"経済と産業","title":"農地改革、地主制の解体","summary":"第二次農地改革の法律が成立し、不在地主の全小作地などを国が強制買収して小作農に売り渡す事業が1950年ごろまで続いた。小作地の約8割が解放され、大部分の農家が自作農となった。\n\n寄生地主制という戦前農村の骨格を数年で解体した、占領改革でも最も徹底した社会変革とされる。自作農の購買力は後の耐久消費財ブーム(暮らしと文化レイヤー)の基盤となり、農村は保守政治の安定した支持基盤(政治と外交レイヤー)にもなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 農地改革","url":"https://ja.wikipedia.org/wiki/農地改革"}]},{"date":"1946-11-03","precision":"day","end_date":null,"type":"point","layer":"政治と外交","title":"日本国憲法公布","summary":"国民主権・戦争放棄・基本的人権の尊重を三原則とする日本国憲法が公布され、翌1947年5月3日に施行された。天皇は統治権の総攬者から象徴となった。\n\nGHQ草案を基礎に帝国議会の審議で修正を経た制定過程には今も評価の幅があるが、この憲法が**戦後日本の骨格**となったことは動かない。戦力不放棄の下での安全保障をどう確保するかという問いは、講和・安保条約(1951年)から安保闘争(1960年)まで、この年表の政治レイヤーを貫く主題となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国立国会図書館「日本国憲法の誕生」","url":"https://www.ndl.go.jp/constitution/"}]},{"date":"1946-12-27","precision":"day","end_date":null,"type":"point","layer":"経済と産業","title":"傾斜生産方式を閣議決定","summary":"第1次吉田内閣が、乏しい資材と資金を石炭と鉄鋼に集中投入し、その増産を他産業に波及させる傾斜生産方式を閣議決定した。復興金融金庫の融資がこれを支えた。\n\n統制経済の手法で生産の底割れを止めようとする戦後最初の本格的な経済戦略だったが、復金融資の紙幣増発はインフレーションを激化させ、ドッジ・ラインによる強制的な引き締めを招く伏線となった。石炭増産への実際の寄与については、今日まで経済史家の評価が分かれている。","detail":null,"credibility":"disputed","credibility_note":"政策の存在は確実だが、増産効果がどの程度この方式によるものかは資材配分の実態をめぐって研究上の評価が分かれる。","sources":[{"title":"Wikipedia: 傾斜生産方式","url":"https://ja.wikipedia.org/wiki/傾斜生産方式"}]},{"date":"1949-03-07","precision":"day","end_date":null,"type":"point","layer":"経済と産業","title":"ドッジ・ライン発表、1ドル360円時代へ","summary":"GHQ財政顧問ドッジが超均衡予算と補助金削減を柱とする経済安定策を発表し、4月には1ドル360円の単一為替レートが設定された。戦後インフレは収束に向かう。\n\n「竹馬の足を切る」と形容された荒療治はデフレ不況と人員整理を招き、労働争議が激化した(政治と外交レイヤーの占領政策転換と連動)。しかし360円レートは以後22年間維持され、輸出主導の高度成長の土台となる。緊縮の痛みの直後に朝鮮特需が訪れる展開は、戦後経済の運の分かれ目だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ドッジ・ライン","url":"https://ja.wikipedia.org/wiki/ドッジ・ライン"}]},{"date":"1950-06-25","precision":"day","end_date":"1953-07-27","type":"period","layer":"経済と産業","title":"朝鮮戦争と特需景気","summary":"朝鮮戦争の勃発により、在日米軍からの物資調達とサービス需要が日本経済に流れ込んだ。トラック・繊維から兵器修理まで、いわゆる特需は数十億ドル規模に達したと推計され、ドッジ不況下の企業を一気に立ち直らせた。\n\n**隣国の戦争が復興の燃料になった**という戦後日本の出発点の逆説であり、講和の早期実現(政治と外交レイヤー)と再軍備問題もこの戦争が引き寄せた。トヨタなどはこの受注を「命拾い」と回顧している。","detail":null,"credibility":"disputed","credibility_note":"特需収入の総額は集計範囲(狭義の特需か関連需要を含むか)により10億ドル台から30億ドル超まで推計が分かれる。","sources":[{"title":"Wikipedia: 朝鮮特需","url":"https://ja.wikipedia.org/wiki/朝鮮特需"}]},{"date":"1951-09-08","precision":"day","end_date":null,"type":"point","layer":"政治と外交","title":"サンフランシスコ講和条約・日米安保条約に調印","summary":"日本は48か国と平和条約に調印し、翌1952年4月28日の発効をもって占領は終わり主権を回復した。同じ日に日米安全保障条約も調印され、米軍の駐留が継続することになった。\n\nソ連が調印せず中国が招かれない「片面講和」か全面講和かをめぐり国内世論は割れ、独立と引き換えの安保体制という枠組みは、1960年の条約改定(安保闘争)まで持ち越される争点となった。国際社会への復帰と対米依存が同じ日に始まった点が、戦後外交の構図を決めている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 日本国との平和条約","url":"https://ja.wikipedia.org/wiki/日本国との平和条約"}]},{"date":"1953-02-01","precision":"day","end_date":null,"type":"point","layer":"暮らしと文化","title":"NHKがテレビ本放送を開始","summary":"NHK東京テレビジョンが日本初のテレビ本放送を開始し、8月には日本テレビが民放として続いた。受像機は月給の数十倍もする高嶺の花で、視聴の場は街頭テレビだった。\n\n力道山のプロレス中継には駅前や盛り場の街頭テレビに群衆が詰めかけ、数千人から2万人ともいわれる人垣ができたと報じられた。敗戦国の大衆が外国人レスラーを倒すヒーローに熱狂する光景は、復興期の国民感情の象徴として語られる。テレビはこの後、皇太子ご成婚を経て家庭へ入っていく。","detail":null,"credibility":"unverified","credibility_note":"街頭テレビの観衆数(新橋駅前2万人など)は当時の報道や主催者側の概数で、確認可能な統計はない。放送開始日自体は確実である。","sources":[{"title":"NHK放送史(日本放送協会)","url":null}]},{"date":"1955-11-15","precision":"day","end_date":null,"type":"point","layer":"政治と外交","title":"保守合同で自由民主党結成、55年体制へ","summary":"日本民主党と自由党が合同して自由民主党が結成された。同年10月の社会党再統一と合わせ、保守一党優位のもとで保守対革新が対峙する「55年体制」が成立する。\n\n以後38年間続くこの体制の下で、政権交代なき安定が長期の経済政策(経済と産業レイヤー)を可能にしたとされる一方、政治的対立は国会外の運動へ向かい、1960年の安保闘争で頂点に達する。高度成長期の政治の器がこの年に据えられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 55年体制","url":"https://ja.wikipedia.org/wiki/55年体制"}]},{"date":"1956-07-17","precision":"day","end_date":null,"type":"point","layer":"経済と産業","title":"経済白書「もはや戦後ではない」","summary":"経済企画庁の年次経済報告(経済白書)が、1人当たり実質国民所得が戦前水準を回復したことを踏まえ「**もはや戦後ではない**」と記した。復興による成長の終わりと、近代化による成長への転換を説く文脈の言葉である。\n\n本来は楽観ではなく警句だったが、流行語となって復興完了の宣言のように受け取られた。実際この前後から神武景気が始まっており、電気洗濯機・冷蔵庫・白黒テレビの「三種の神器」(暮らしと文化レイヤー)が家庭の憧れになっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済企画庁『昭和31年度 年次経済報告』","url":null}]},{"date":"1956-12-18","precision":"day","end_date":null,"type":"point","layer":"政治と外交","title":"日本が国際連合に加盟","summary":"同年10月の日ソ共同宣言によりソ連との国交が回復し、ソ連の拒否権行使が解けて、日本は80番目の国連加盟国となった。重光葵外相が総会で受諾演説を行った。\n\n講和条約(1951年)で果たせなかった国際社会への完全復帰が、敗戦から11年でひとまず完成した節目である。ただし北方領土問題は棚上げされ平和条約は未締結のまま残った。翌年には国連安保理非常任理事国にも選出され、経済成長(経済と産業レイヤー)を背景とした国際的地位の回復が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"外務省: 日本と国際連合","url":null}]},{"date":"1958-12-23","precision":"day","end_date":null,"type":"point","layer":"暮らしと文化","title":"東京タワー完成","summary":"高さ333メートルの総合電波塔、東京タワーが完成した。当時自立式鉄塔として世界一の高さで、テレビ放送の電波を関東一円に送る基幹施設である。\n\n戦後13年でパリのエッフェル塔を超える塔を建てたことは復興の象徴として受け止められ、完成翌年の皇太子ご成婚中継とあわせてテレビ受信契約の急増を支えた。放送インフラの整備が家庭の茶の間の風景を変えていく、暮らしと文化レイヤーの転換点の一つである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 東京タワー","url":"https://ja.wikipedia.org/wiki/東京タワー"}]},{"date":"1959-04-10","precision":"day","end_date":null,"type":"point","layer":"暮らしと文化","title":"皇太子ご成婚、テレビが家庭に入る","summary":"皇太子明仁親王と正田美智子さんの結婚の儀が行われ、馬車パレードの沿道には数十万人が詰めかけたと報じられた。「ミッチー・ブーム」と呼ばれる社会現象が起きる。\n\n民間出身の皇太子妃という戦後的な物語はパレードの生中継への期待を生み、この前後でテレビ受信契約は200万件規模へ急増したとされる。街頭のものだったテレビ(1953年)が家庭の中心になる決定的な契機であり、大衆消費社会の到来を告げる祝祭だった。","detail":null,"credibility":"unverified","credibility_note":"沿道の観衆数(53万人など)や成婚を機とした受信契約増加数は当時の報道・概算に基づき、厳密な検証はできない。","sources":[{"title":"Wikipedia: 明仁","url":"https://ja.wikipedia.org/wiki/明仁"}]},{"date":"1960-06-19","precision":"day","end_date":null,"type":"point","layer":"政治と外交","title":"新安保条約が自然成立、安保闘争の頂点","summary":"5月の衆議院での強行採決に反発した大規模なデモが連日国会を包囲するなか、新日米安全保障条約は参議院の議決を経ずに自然成立した。6月15日のデモでは東大生樺美智子さんが死亡し、アイゼンハワー大統領の訪日は中止、岸信介内閣は条約発効後に総辞職した。\n\n戦後最大の大衆運動だったが、条約自体は成立し、続く池田内閣は争点を政治から経済へ移す。**政治の季節から経済の季節へ**の転轍点として、この年は戦後史の折り目になっている。","detail":null,"credibility":"disputed","credibility_note":"国会周辺のデモ参加者数は主催者発表33万人、警察発表13万人など集計主体により大きな開きがある。","sources":[{"title":"Wikipedia: 安保闘争","url":"https://ja.wikipedia.org/wiki/安保闘争"}]},{"date":"1960-12-27","precision":"day","end_date":null,"type":"point","layer":"経済と産業","title":"国民所得倍増計画を閣議決定","summary":"池田勇人内閣が、10年間で国民所得を2倍にすることを目標とする国民所得倍増計画を閣議決定した。社会資本の整備、産業構造の高度化、人的能力の向上などを柱とする。\n\n安保闘争(政治と外交レイヤー)で二分された世論を「経済」で束ね直す政治的転換でもあり、実際の経済は計画を上回る年率10%前後の成長を続けて、目標はおよそ7年で達成された。**経済成長を国民的目標に据えた**この計画の下で、太平洋ベルトへの人口移動と過密・過疎、公害という代償も進行していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 国民所得倍増計画","url":"https://ja.wikipedia.org/wiki/国民所得倍増計画"}]},{"date":"1964-10-01","precision":"day","end_date":null,"type":"point","layer":"暮らしと文化","title":"東海道新幹線が開業","summary":"東京・新大阪間を最短4時間(翌年から3時間10分)で結ぶ東海道新幹線が開業した。世界初の本格的高速鉄道であり、世界銀行の借款も建設資金に充てられた。\n\n東京オリンピック開会式の9日前という開業日が示すとおり、五輪に向けた首都改造・交通整備の中核事業だった。「夢の超特急」は高度成長の技術的自信の象徴となり、太平洋ベルトの一体化(経済と産業レイヤー)を加速して、通勤・出張・旅行という移動の日常を作り替えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 東海道新幹線","url":"https://ja.wikipedia.org/wiki/東海道新幹線"}]},{"date":"1964-10-10","precision":"day","end_date":null,"type":"point","layer":"暮らしと文化","title":"東京オリンピック開幕","summary":"アジア初のオリンピックが東京で開幕した。93の国と地域が参加し、開会式の聖火最終走者には広島に原爆が投下された日に生まれた坂井義則さんが選ばれた。\n\n**焼け跡から19年**で国際社会に復興を示す国家的事業であり、首都高速・モノレール・新幹線などの都市基盤がこの機会に整えられた。カラー中継や衛星中継の実験も行われ、テレビ(暮らしと文化レイヤーの主題)は名実ともに国民的メディアとなった。閉会後の反動不況を経て、経済はさらに長い成長局面へ入る。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1964年東京オリンピック","url":"https://ja.wikipedia.org/wiki/1964年東京オリンピック"}]},{"date":"1968-01-01","precision":"year","end_date":null,"type":"point","layer":"経済と産業","title":"GNPが資本主義世界第2位に","summary":"1968年の国民総生産(GNP)で日本は西ドイツを抜き、米国に次ぐ資本主義世界第2位となった。敗戦から23年での到達である。\n\n「経済大国」の自己認識が定着する画期だが、同じ時期に水俣病・イタイイタイ病などの公害病が社会問題化し、1967年の公害対策基本法制定、1970年の「公害国会」へと続く。成長の順位と成長の代償が同時に可視化された年であり、豊かさの中身を問う1970年代への入口となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 国民経済計算(GNP長期系列)","url":null}]},{"date":"1970-03-14","precision":"day","end_date":null,"type":"point","layer":"暮らしと文化","title":"大阪万博開幕、戦後復興の総決算","summary":"「人類の進歩と調和」をテーマとする日本万国博覧会が大阪・千里丘陵で開幕した。半年の会期で入場者は約6400万人に達し、当時の万博史上最多を記録した。\n\n太陽の塔と月の石に人々が列を作った祝祭は、焼け跡から4半世紀の到達点を示す**復興の総決算**だった。一方でテーマに「調和」が掲げられたこと自体、公害と過密(経済と産業レイヤーの代償)への意識の表れでもある。この年表はここで幕を閉じ、日本は成長の質を問う時代へ入る。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 日本万国博覧会","url":"https://ja.wikipedia.org/wiki/日本万国博覧会"}]}]},{"slug":"history-silk-road","title":"シルクロードの2000年","description":"ローマの絹熱から一帯一路まで約2000年。交易・帝国・宗教文化の3層を重ね、モノと信仰と権力が同じ道を共有し、道の盛衰が帝国の盛衰と重なるさまを俯瞰する。","category":"history-politics","language":"ja","start_year":16,"end_year":2014,"layers":[{"name":"交易と経済","color":"gold"},{"name":"帝国と権力","color":"blue"},{"name":"宗教と文化の伝播","color":"purple"}],"events":[{"date":"0016-01-01","precision":"year","end_date":null,"type":"point","layer":"交易と経済","title":"ローマで男性の絹着用を禁じる布告","summary":"タキトゥス『年代記』によれば、ティベリウス帝の時代に元老院は男性の絹衣着用を禁じた。東方から届く絹はローマで熱狂的に求められ、莫大な富が流出するとして道徳と財政の両面から問題視された。\n\n漢の張騫が西域へ派遣された前2世紀以来、中国とローマは互いの実像を知らないまま中継交易で結ばれていた。**生産地と消費地が互いを知らないまま道だけがつながる**という、この交易路の原型を示す最初期の記録である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"タキトゥス『年代記』第2巻33章","url":null}]},{"date":"0073-01-01","precision":"year","end_date":null,"type":"point","layer":"帝国と権力","title":"班超が西域経営に着手","summary":"後漢の班超が西域への遠征に加わり、以後約30年にわたり駐留してオアシス諸国を後漢の勢力下にまとめた。匈奴の影響を排し、途絶していた西域との通交が回復される。\n\n少人数の使節と外交で諸国を束ねた班超の手法は「虎穴に入らずんば虎子を得ず」の故事でも知られる。彼の在任中に交易路の安全が保たれ隊商が行き交ったことは、**道の安全は帝国の力に依存する**というシルクロードの基本構造を示している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ban Chao","url":"https://en.wikipedia.org/wiki/Ban_Chao"}]},{"date":"0097-01-01","precision":"year","end_date":null,"type":"point","layer":"帝国と権力","title":"甘英、大秦(ローマ)を目指して西へ","summary":"班超は部下の甘英を大秦(ローマ帝国)へ使節として派遣した。甘英は安息(パルティア)を越えて大海のほとりまで達したが、船人に航海の困難を説かれて引き返したと『後漢書』は記す。\n\n漢とローマという両端の帝国が直接接触する寸前まで行った試みであり、中継交易の利を守りたいパルティアが渡航を思いとどまらせたとする解釈もある。両帝国は以後も直接の国交を持たず、絹は幾多の仲介者の手を経て運ばれ続けた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Gan Ying","url":"https://en.wikipedia.org/wiki/Gan_Ying"}]},{"date":"0148-01-01","precision":"year","end_date":null,"type":"point","layer":"宗教と文化の伝播","title":"安世高が洛陽に至り仏典の漢訳を始める","summary":"パルティア出身の僧安世高が後漢の都洛陽に到来し、仏典を組織的に漢訳した最初期の訳経僧となったと伝えられる。仏教は前後1世紀ごろから西域経由で中国へ浸透しつつあった。\n\n隊商の道はそのまま布教の道であり、商人の共同体が僧と経典の移動を支えた。インドで生まれた宗教が中央アジアの言語と民族を経由して東アジアの文明の柱になる、この年表の宗教レイヤーを貫く大過程の始点にあたる。","detail":null,"credibility":"unverified","credibility_note":"安世高の生没年や洛陽到来を148年とする年代は後代の経録の伝承に基づき、同時代史料による確認はできない。","sources":[{"title":"Wikipedia: An Shigao","url":"https://en.wikipedia.org/wiki/An_Shigao"}]},{"date":"0399-01-01","precision":"year","end_date":null,"type":"point","layer":"宗教と文化の伝播","title":"法顕、長安から天竺への求法の旅に出発","summary":"東晋の僧法顕が戒律の原典を求めて長安を発ち、タクラマカン砂漠と葱嶺(パミール)を越えてインドに至った。十数年後に海路で帰国し、旅の記録『仏国記』を残す。\n\n60歳を過ぎての出発とされる苛烈な旅で、砂漠では「死人の枯骨を標識とする」と記した。求道者が命懸けで越えた道は、同時に隊商が日常的に往来する道でもあった。『仏国記』は5世紀の中央アジア・インドを伝える一級の史料として、後世の探検家の手引きにもなる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Faxian","url":"https://en.wikipedia.org/wiki/Faxian"}]},{"date":"0552-01-01","precision":"year","end_date":null,"type":"point","layer":"交易と経済","title":"東ローマ帝国へ蚕の卵が持ち込まれる","summary":"ユスティニアヌス帝の時代、僧侶が中央アジアから蚕の卵を杖に隠して持ち帰り、東ローマ帝国で養蚕が始まったとプロコピオスらは伝える。以後ビザンツは絹の自給に踏み出した。\n\n中国が長く独占した養蚕技術の西伝は、**技術の独占は道を通じていずれ破られる**ことを示す象徴的な事件である。ただしビザンツ絹織物業の確立後も、中国産の生糸と絹はなお高級品として運ばれ続け、道の交易が消えたわけではなかった。","detail":null,"credibility":"disputed","credibility_note":"僧侶が卵を密輸したという経緯はプロコピオス等の逸話的記述に基づき、伝来の実際の経路・年次には諸説ある。","sources":[{"title":"Wikipedia: Smuggling of silkworm eggs into the Byzantine Empire","url":"https://en.wikipedia.org/wiki/Smuggling_of_silkworm_eggs_into_the_Byzantine_Empire"}]},{"date":"0645-01-01","precision":"year","end_date":null,"type":"point","layer":"宗教と文化の伝播","title":"玄奘がインドから長安に帰還","summary":"唐の僧玄奘が約17年の求法の旅を終えて長安に帰還し、経典657部と仏像・仏舎利を持ち帰った。国禁を犯しての出国だったが、太宗は帰国を歓迎し、訳経事業を国家的に支援した。\n\n旅の見聞録『大唐西域記』は7世紀の中央アジアとインドを網羅する史料となり、後に『西遊記』の素材として東アジアの大衆文化にも流れ込む。唐帝国の西域支配(帝国と権力レイヤー)が最も安定していた時期と、求法の往来の最盛期が重なっている点が示唆的である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Xuanzang","url":"https://en.wikipedia.org/wiki/Xuanzang"}]},{"date":"0700-01-01","precision":"year","end_date":null,"type":"point","layer":"交易と経済","title":"ソグド商人の交易網が最盛期を迎える","summary":"サマルカンドなどオアシス都市を本拠とするソグド人は、中国から中央アジアに至る交易網を張り巡らせ、7〜8世紀ごろその活動の最盛期を迎えたとされる。唐の長安・洛陽には彼らの居留地が置かれ、ソグド語は交易の共通語となった。\n\n絹や銀器とともにゾロアスター教やマニ教、音楽・舞踏も彼らの網に乗って東へ運ばれた。国家ではなく商人の離散共同体が道を実質的に運営した点で、シルクロードの担い手の典型である。","detail":null,"credibility":"unverified","credibility_note":"交易網の最盛期を8世紀前後とするのは出土文書や墓誌からの研究上の推定で、厳密な年代の確定は困難である。","sources":[{"title":"Wikipedia: Sogdia","url":"https://en.wikipedia.org/wiki/Sogdia"}]},{"date":"0751-01-01","precision":"year","end_date":null,"type":"point","layer":"帝国と権力","title":"タラス河畔の戦い、唐とアッバース朝が激突","summary":"中央アジアのタラス河畔で、唐の高仙芝の軍とアッバース朝の軍が衝突し、同盟部族の離反もあって唐軍が大敗した。東西の大帝国が中央アジアの覇権をめぐって直接ぶつかった稀有な戦いである。\n\n数年後の安史の乱もあり唐の西域支配は後退し、中央アジアのイスラーム化が長期的に進む。捕虜の唐人を通じて製紙法が西方に伝わったとする伝承が有名で、事実とすれば**戦争さえ技術伝播の経路になった**例だが、近年は伝播の経緯に疑問も呈されている。","detail":null,"credibility":"disputed","credibility_note":"戦い自体は両陣営の史料にあるが、捕虜経由の製紙法西伝は後代のアラビア語史料等に基づく通説で、それ以前からの漸進的伝播を指摘して疑問視する研究もある。","sources":[{"title":"Wikipedia: Battle of Talas","url":"https://en.wikipedia.org/wiki/Battle_of_Talas"}]},{"date":"1206-01-01","precision":"year","end_date":null,"type":"point","layer":"帝国と権力","title":"チンギス・カン即位、モンゴル帝国成立","summary":"テムジンがクリルタイでチンギス・カンとして即位し、モンゴル帝国が成立した。以後半世紀余りで、帝国は東は高麗から西はロシア・イランに至るユーラシアの大部分を覆う。\n\n征服は各地に破壊をもたらした一方、分立していた諸勢力の関税と略奪のリスクを一つの秩序が置き換えたことで、東西を貫く陸路がかつてない規模で開かれる条件が整った。交易と経済レイヤーの「パクス・モンゴリカ」は、この軍事的統一の直接の帰結である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Genghis Khan","url":"https://en.wikipedia.org/wiki/Genghis_Khan"}]},{"date":"1250-01-01","precision":"year","end_date":"1350-01-01","type":"period","layer":"交易と経済","title":"パクス・モンゴリカ、東西交易の最盛期","summary":"モンゴル帝国の支配下でユーラシアの交易路が安定し、駅伝制(ジャムチ)が整備されて、商人・使節・宣教師が大陸を横断できる約1世紀が続いた。「頭に金の皿を載せた乙女が一人で旅できる」と形容された治安である。\n\n**一つの権力が道全体を覆うとき、交易は最も栄える**というこの年表の主題が最も純粋に現れた期間であり、マルコ・ポーロら欧州人の東方旅行(宗教と文化レイヤー)もこの秩序の産物だった。帝国の分裂と疫病がこの窓を閉じる。","detail":null,"credibility":"unverified","credibility_note":"「パクス・モンゴリカ」は後代の研究上の概念で、1250〜1350年という区切りはおおよその通例にすぎず、明確な始点・終点はない。","sources":[{"title":"Wikipedia: Pax Mongolica","url":"https://en.wikipedia.org/wiki/Pax_Mongolica"}]},{"date":"1271-01-01","precision":"year","end_date":"1295-01-01","type":"period","layer":"宗教と文化の伝播","title":"マルコ・ポーロの東方旅行","summary":"ヴェネツィアの商人マルコ・ポーロは父・叔父とともに陸路で元へ向かい、クビライに仕えた後、海路で帰国したとされる。その見聞は『世界の記述(東方見聞録)』にまとめられた。\n\n黄金の国ジパングの記述などが欧州人の東方像を形作り、写本はコロンブスも携えて航海の動機の一つとなった。パクス・モンゴリカ(交易と経済レイヤー)が可能にした旅であると同時に、その記録が2世紀後の大航海時代を刺激するという、道が生んだ想像力の連鎖を示す。","detail":null,"credibility":"disputed","credibility_note":"旅程や中国滞在の実態については、記述の欠落を根拠に到達自体を疑う説と、元側史料との整合から支持する説が対立している。","sources":[{"title":"Wikipedia: Marco Polo","url":"https://en.wikipedia.org/wiki/Marco_Polo"}]},{"date":"1347-01-01","precision":"year","end_date":null,"type":"point","layer":"交易と経済","title":"ペストが交易路を経て地中海世界へ","summary":"中央アジアに由来するとされるペストが、クリミアの交易拠点カッファなどを経由して地中海に達し、以後数年で欧州人口の3分の1前後が失われたと推計される。\n\n人と駱駝と船が行き交う道はそのまま病原体の道でもあり、**道は富だけでなく疫病も運ぶ**ことを人類史に刻んだ。モンゴル支配の動揺と重なって東西を結ぶ陸路の往来は細り、パクス・モンゴリカの世紀は事実上ここで幕を閉じる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Black Death","url":"https://en.wikipedia.org/wiki/Black_Death"}]},{"date":"1370-01-01","precision":"year","end_date":null,"type":"point","layer":"帝国と権力","title":"ティムールが政権を樹立、サマルカンドが繁栄","summary":"中央アジアでティムールが実権を握り、サマルカンドを都とする大帝国を築き始めた。征服戦争は苛烈を極めたが、各地から職人と学者を都に集め、レギスタン広場に象徴される壮麗な都市文化が花開く。\n\nモンゴル帝国分裂後の道の再統合を武力で試みた最後の大帝国であり、その宮廷にはスペインの使節クラビホも訪れた。しかし没後の帝国は分裂し、同じ頃に始まる海の交易路の台頭(15世紀以降)が、陸のシルクロードの地位を相対化していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Timur","url":"https://en.wikipedia.org/wiki/Timur"}]},{"date":"1453-05-29","precision":"day","end_date":null,"type":"point","layer":"帝国と権力","title":"オスマン帝国がコンスタンティノープルを征服","summary":"メフメト2世率いるオスマン軍が千年の都コンスタンティノープルを陥落させ、東ローマ帝国が滅亡した。東地中海の交易の結節点は、以後オスマンの管理下に置かれる。\n\n「オスマンが東方貿易を遮断したため大航海時代が始まった」と語られてきたが、実際にはオスマンは関税収入のため交易を維持しており、近年の研究は単純な遮断説を否定する。それでも欧州側が中間者を介さない航路を求める動機は強まり、道の主役が陸から海へ移る転換期の画期となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Fall of Constantinople","url":"https://en.wikipedia.org/wiki/Fall_of_Constantinople"}]},{"date":"1877-01-01","precision":"year","end_date":null,"type":"point","layer":"宗教と文化の伝播","title":"リヒトホーフェンが「ザイデンシュトラーセン」と命名","summary":"ドイツの地理学者リヒトホーフェンが著書『中国』で、漢代の中国と西方を結んだ交易路を「ザイデンシュトラーセン(絹の道)」と呼んだ。この学術用語が20世紀に各国語へ広がり、「シルクロード」の名が定着する。\n\n**「シルクロード」という名は近代の発明**であり、古代の隊商が自らの道をそう呼んだわけではない。名付けは同時代の鉄道建設調査とも結びついており、道への学術的関心が列強の中央アジア進出と地続きだったことも見落とせない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ferdinand von Richthofen","url":"https://en.wikipedia.org/wiki/Ferdinand_von_Richthofen"}]},{"date":"1900-06-22","precision":"day","end_date":null,"type":"point","layer":"宗教と文化の伝播","title":"敦煌・莫高窟で蔵経洞が発見される","summary":"敦煌莫高窟を管理していた道士王円籙が、封印された小窟(蔵経洞)から数万点に及ぶ写本・絵画を発見した。4〜11世紀の仏典や公文書、多言語の文書群は、シルクロード研究の一大宝庫となる。\n\n発見後、スタインやペリオら各国の探検隊、日本の大谷探検隊が文物を大量に持ち出し、コレクションは世界中に分散した。文化財の流出として今日まで議論が続く一方、文書研究は敦煌学という一分野を生み、道の日常を記録から復元する営みが始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Dunhuang manuscripts","url":"https://en.wikipedia.org/wiki/Dunhuang_manuscripts"}]},{"date":"2013-09-07","precision":"day","end_date":null,"type":"point","layer":"帝国と権力","title":"中国が「シルクロード経済ベルト」構想を提唱","summary":"習近平国家主席がカザフスタンのナザルバエフ大学での演説で「シルクロード経済ベルト」構想を提唱した。同年10月の「21世紀海上シルクロード」と合わせ、後に「一帯一路」と総称される広域経済圏構想となる。\n\n古代の道の記憶を国家戦略の物語として再利用した点にこの構想の特徴があり、鉄道・港湾・パイプラインが隊商路の後継を名乗る。沿線国への投資と債務、影響力拡大をめぐる評価は分かれ、道と権力の結びつきという古い主題が21世紀の姿で再演されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Belt and Road Initiative","url":"https://en.wikipedia.org/wiki/Belt_and_Road_Initiative"}]},{"date":"2014-06-22","precision":"day","end_date":null,"type":"point","layer":"宗教と文化の伝播","title":"「シルクロード:長安-天山回廊」が世界遺産に","summary":"ユネスコ世界遺産委員会が、中国・カザフスタン・キルギスの3か国が共同推薦した「シルクロード:長安-天山回廊の交易路網」を世界文化遺産に登録した。全長約5000キロ、33の構成資産からなる初の国境を越えた回廊型登録である。\n\n漢代から続いた道が、国民国家の枠を越えた人類共通の遺産として制度化された到達点であり、この年表の終点にふさわしい。交易の実利で始まった道は、2000年を経て記憶と観光と外交の資源になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNESCO World Heritage List: Silk Roads: the Routes Network of Chang'an-Tianshan Corridor","url":"https://whc.unesco.org/en/list/1442/"}]}]},{"slug":"history-space-race","title":"宇宙開発の舞台裏","description":"スプートニクから民間宇宙船まで、ロケットの進歩だけでなく、その裏で誰が何を決め、社会がどう反応したかを三層で重ねる。同じ年に別の場所で起きていたことが見えてくる年表。","category":"history-politics","language":"ja","start_year":1957,"end_year":2020,"layers":[{"name":"技術","color":"blue"},{"name":"人の決断","color":"gold"},{"name":"社会の動き","color":"teal"}],"events":[{"date":"1957-10-04","precision":"day","end_date":null,"type":"point","layer":"技術","title":"スプートニク1号、世界初の人工衛星に","summary":"ソ連がR-7ロケットで直径58cmの人工衛星を軌道に投入し、地上でも受信できるビープ音が世界を駆けた。国際地球観測年に合わせた打ち上げだったが、R-7は本来ICBMとして開発されたロケットで、核弾頭を米本土に届けうる能力の実証でもあった。\n\n技術上の成功は同じ日に社会の動きレイヤーで始まるスプートニク・ショックを引き起こし、**翌年のNASA設立という「人の決断」へと連鎖する**。設計主任コロリョフの名は公表されなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Sputnik 1","url":"https://en.wikipedia.org/wiki/Sputnik_1"},{"title":"NASA History: Sputnik and the Dawn of the Space Age","url":null}]},{"date":"1957-10-04","precision":"day","end_date":"1958-09-02","type":"period","layer":"社会の動き","title":"スプートニク・ショックと米国の科学教育改革","summary":"衛星そのものより「ソ連が先に到達した」事実が米国世論を揺さぶり、12月のヴァンガード打ち上げ失敗が焦りを増幅した。\n\n議会は科学教育への連邦投資を拡大し、1958年9月2日の国防教育法(NDEA)で理数・外国語教育に連邦資金が投じられる。同年7月にはNASA設立法が署名されており、この期間の世論が「人の決断」レイヤーの政策判断を後押しした構図が読み取れる。","detail":null,"credibility":"disputed","credibility_note":"アイゼンハワー政権自身は衛星を脅威と見ておらず、「ショック」は主にメディアと議会の反応だったとする研究があり、当時の危機感の実態は評価が分かれる。","sources":[{"title":"Wikipedia（英語版）: Sputnik crisis","url":"https://en.wikipedia.org/wiki/Sputnik_crisis"},{"title":"Wikipedia（英語版）: National Defense Education Act","url":"https://en.wikipedia.org/wiki/National_Defense_Education_Act"}]},{"date":"1958-07-29","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"アイゼンハワー、NASA設立法に署名","summary":"アイゼンハワーが国家航空宇宙法に署名し、軍ではなく文民機関に宇宙開発を担わせる決断を下した。10月1日にNASAが発足する。陸海空軍がそれぞれ宇宙計画を競っていた状況を整理し、既存のNACA(航空諮問委員会)を母体とした。\n\n「平和目的」を掲げる建て付けは、のちの宇宙条約や国際協力の前提となる。同じ年、技術レイヤーではエクスプローラー1号がヴァン・アレン帯を発見し、社会レイヤーではスプートニク・ショックが議会を動かしていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: National Aeronautics and Space Act","url":"https://en.wikipedia.org/wiki/National_Aeronautics_and_Space_Act"}]},{"date":"1961-04-12","precision":"day","end_date":null,"type":"point","layer":"技術","title":"ガガーリン、人類初の有人宇宙飛行","summary":"ボストーク1号が地球を1周、108分の飛行で、人類が初めて地球の外から地球を見た日となった。飛行は完全自動制御で、ガガーリンは高度約7kmで機体から射出されパラシュートで着地したが、この点は国際航空連盟の記録要件を満たすため当時公表されなかった。\n\n技術的勝利は6週間後のケネディ演説という「人の決断」を直接引き出し、米ソの競争は月へと舞台を移す。同年8月にはベルリンの壁が築かれ、冷戦の緊張が最高潮にあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Vostok 1","url":"https://en.wikipedia.org/wiki/Vostok_1"}]},{"date":"1961-05-25","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"ケネディ、「10年以内に月へ」と議会に表明","summary":"ガガーリン飛行とピッグス湾侵攻失敗という二つの打撃の直後、ケネディは議会特別教書で1960年代中の有人月着陸を国家目標に掲げた。副大統領ジョンソンへの「ソ連に勝てる分野」の諮問と、5月5日のシェパードの弾道飛行成功がこの演説を後押しした。\n\n**技術面の見通しは未確定のまま政治判断が先行した**点が、以後の予算膨張(社会の動きレイヤー・1966年)につながる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"JFK Library: Address to Joint Session of Congress, May 25, 1961","url":"https://www.jfklibrary.org/learn/about-jfk/historic-speeches/address-to-joint-session-of-congress-may-25-1961"}]},{"date":"1966-01-01","precision":"year","end_date":null,"type":"point","layer":"社会の動き","title":"NASA予算、連邦予算の約4.4%でピーク","summary":"アポロ計画の人員は40万人規模に達し、NASA予算は連邦支出比約4.4%と史上最高水準になった。1961年の決断から5年、予算は毎年拡大し1966会計年度に頂点を迎えた。\n\n同時期にベトナム戦争の戦費と「偉大な社会」政策の支出が膨らみ、以後NASA予算は月着陸前から削減局面に入る。技術レイヤーではこの年にコロリョフが死去し、翌年にはアポロ1号火災が起きる。予算の山と現場の緊張が同時に存在していた。","detail":null,"credibility":"unverified","credibility_note":"「約4.4%」は連邦予算に対する比率としてよく引用されるが、算出方法により4.4〜4.5%と幅があり、雇用者数の40万人も概数である。","sources":[{"title":"Wikipedia（英語版）: Budget of NASA","url":"https://en.wikipedia.org/wiki/Budget_of_NASA"}]},{"date":"1966-01-14","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"コロリョフ死去、ソ連月計画の指揮系統に空白","summary":"ソ連宇宙開発を率いた「主任設計者」コロリョフが手術中に死去した。スプートニクとガガーリン飛行を実現した人物だが、機密のため生前は匿名で、その名はこの時初めて公表された。\n\n死後、N1月ロケットの開発はミーシンが引き継ぐが、設計局間の対立と資源分散は解消されない。同じ年、社会の動きレイヤーで米国のNASA予算がピークを迎えていたのと対照的に、**ソ連側は指揮の統合を失っていた**。","detail":null,"credibility":"disputed","credibility_note":"コロリョフの死がソ連月計画失敗の主因だったかは評価が分かれる。N1のエンジン構成や資金・組織の問題を重視する研究者も多い。","sources":[{"title":"Wikipedia（英語版）: Sergei Korolev","url":"https://en.wikipedia.org/wiki/Sergei_Korolev"}]},{"date":"1967-10-10","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"宇宙条約が発効、天体の領有を禁止","summary":"宇宙空間の平和利用と天体の国家領有禁止を定めた条約が発効し、宇宙法の基礎となった。米ソ英が1月に署名し、核兵器の軌道配備禁止も定めた。\n\n月着陸を目前にした両国が「先に着いた側が月を領有する」事態を避ける枠組みでもあった。同年1月にはアポロ1号火災、4月にはソユーズ1号事故で両国が犠牲者を出しており、技術レイヤーの試練と並行して法的秩序が整えられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Outer Space Treaty","url":"https://en.wikipedia.org/wiki/Outer_Space_Treaty"},{"title":"国連宇宙部（UNOOSA）: Outer Space Treaty","url":null}]},{"date":"1968-12-24","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"アポロ8号「地球の出」写真が世界に届く","summary":"初めて月周回軌道に入ったアポロ8号の乗員が撮影した地球の写真「Earthrise」が世界に届いた。月着陸船の遅れを受けて計画を急きょ変更し、司令船のみで月周回に向かった決断の産物だった。\n\n写真は翌年以降の環境運動の象徴となり、1970年の最初のアースデイにも影響したとされ、環境意識と「一つの地球」の感覚を広めた。暗殺やベトナム反戦運動が続いた1968年の年末、この中継は米国内で異例の共有体験として受け止められた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Earthrise","url":"https://en.wikipedia.org/wiki/Earthrise"}]},{"date":"1969-07-03","precision":"day","end_date":null,"type":"point","layer":"技術","title":"ソ連N1ロケット、発射台で爆発","summary":"ソ連の月ロケットN1が2回目の打ち上げで発射直後に落下・爆発した。アポロ11号の17日前だった。30基のエンジンを束ねる設計のN1は4回の打ち上げすべてに失敗し、この爆発は発射施設を大きく損壊して、ソ連の有人月着陸の可能性を事実上絶った。\n\nソ連は月競争への参加自体を長く公式に認めず、計画の存在が公表されたのは1989年である。人の決断レイヤーで見たコロリョフ死去後の混乱が、技術面の結果として現れた形といえる。","detail":null,"credibility":"unverified","credibility_note":"N1計画はソ連が1989年まで存在を公表せず、打ち上げ経過や被害規模は後年公開された資料と関係者証言に基づく。爆発規模の推定値も資料により異なる。","sources":[{"title":"Wikipedia（英語版）: N1 (rocket)","url":"https://en.wikipedia.org/wiki/N1_(rocket)"}]},{"date":"1969-07-20","precision":"day","end_date":null,"type":"point","layer":"技術","title":"アポロ11号、人類初の月面着陸","summary":"アームストロングとオルドリンが月面に立ち、ケネディの目標を期限内に達成した。着陸は協定世界時7月20日20時17分、最初の一歩は21日2時56分で、日本では21日午前の出来事だった。\n\n1961年の政治決断から8年、社会の動きレイヤーの予算ピークを経て到達した頂点だが、NASA予算はすでに削減期に入っており、アポロ計画は17号で打ち切られる。同月3日にはソ連N1が爆発しており、競争の帰趨は事実上この月に決した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Apollo 11","url":"https://en.wikipedia.org/wiki/Apollo_11"}]},{"date":"1972-01-05","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"ニクソン、スペースシャトル計画を承認","summary":"ニクソンがスペースシャトル計画を承認し、月の次に「再使用型」を選ぶ決断を下した。アポロ後の構想には宇宙ステーションと火星有人飛行案もあったが、予算制約の中でシャトル単体が選ばれ、**以後30年の米有人宇宙の形がこの一つの選択で決まった**。\n\n初飛行は1981年4月12日、ガガーリン飛行のちょうど20年後だった。低コスト・高頻度という当初の想定は達成されず、1986年のチャレンジャー事故(技術レイヤー)で計画の前提そのものが問われることになる。","detail":null,"credibility":"disputed","credibility_note":"承認の主因を、大統領選の年にカリフォルニア州の航空宇宙雇用を守る政治判断とみる説と、国家威信や軍の要求を重視する説があり、解釈が分かれる。","sources":[{"title":"Wikipedia（英語版）: Space Shuttle program","url":"https://en.wikipedia.org/wiki/Space_Shuttle_program"}]},{"date":"1975-07-17","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"アポロ・ソユーズ、軌道上で米ソがドッキング","summary":"デタント(緊張緩和)の象徴として、競争相手だった米ソの宇宙船が軌道上でドッキングし、握手を交わした。1972年のニクソン訪ソで合意された共同飛行である。\n\n同じ夏にヘルシンキ最終文書が採択されており、外交の緊張緩和がそのまま宇宙に映し出された。技術面では両国のドッキング機構が異なるため中間モジュールを新設した。この協力は1979年のアフガニスタン侵攻で途絶え、再開は1990年代のシャトル・ミール計画まで待つことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Apollo–Soyuz","url":"https://en.wikipedia.org/wiki/Apollo%E2%80%93Soyuz"}]},{"date":"1986-01-28","precision":"day","end_date":null,"type":"point","layer":"技術","title":"チャレンジャー号、打ち上げ73秒後に空中分解","summary":"チャレンジャー号が打ち上げ73秒後に空中分解し、乗員7名が死亡した。原因は固体ロケットブースターのOリング破損で、シャトルは約2年半飛行を停止する。\n\n前夜、製造元の技術者が低温下での打ち上げに反対していたことが調査委員会で明らかになり、**技術的欠陥だけでなく組織の意思決定が問われた**。教員宇宙飛行士の搭乗で全米の学校が生中継を見ており、社会的衝撃は大きかった。同年2月にはソ連が宇宙ステーション・ミールの中核モジュールを打ち上げており、両国の明暗が分かれた月でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Space Shuttle Challenger disaster","url":"https://en.wikipedia.org/wiki/Space_Shuttle_Challenger_disaster"}]},{"date":"1998-11-20","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"ISS最初のモジュール「ザーリャ」打ち上げ","summary":"冷戦後の米露協力を軸に、日欧加を含む15か国が参加する国際宇宙ステーションの建設が始まった。最初のモジュール「ザーリャ」はロシア製だが米国の資金で建造され、冷戦期のライバルが同じ構造物を組み立てる象徴となった。\n\nソ連解体後、ロシアの宇宙技術者を計画に組み込む狙いもあった。日本は実験棟「きぼう」で参加し、2008年から取り付けが始まる。技術レイヤーではこの後、シャトルによる組み立て飛行が2011年の退役まで続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Zarya","url":"https://en.wikipedia.org/wiki/Zarya"},{"title":"JAXA: 国際宇宙ステーション（ISS）","url":null}]},{"date":"2003-10-15","precision":"day","end_date":null,"type":"point","layer":"技術","title":"神舟5号、中国が3番目の有人宇宙飛行国に","summary":"楊利偉を乗せた神舟5号が地球を14周し、中国はソ連・米国に続き、独自ロケットで人を軌道に送った3か国目となった。ソユーズ設計を参考にした神舟宇宙船と長征2Fロケットによる飛行である。\n\n同年2月にはコロンビア号事故で米シャトルが飛行停止しており、有人宇宙飛行の担い手が多極化する転機だった。中国はISSに参加しておらず、以後独自ステーション「天宮」へ向かう。社会の動きレイヤーで見る国際協力の枠外に、もう一つの軸が生まれた年である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Shenzhou 5","url":"https://en.wikipedia.org/wiki/Shenzhou_5"}]},{"date":"2006-08-18","precision":"day","end_date":null,"type":"point","layer":"人の決断","title":"NASA、民間に貨物輸送を委ねるCOTS契約","summary":"NASAがISSへの物資輸送を「自前開発」から「民間からの購入」へ切り替える商業軌道輸送サービス(COTS)契約を結び、設立4年のスペースXが選ばれた。仕様と成果に対して段階的に支払う方式で、従来の受託開発とは異なる。\n\n**この決断が2010年代の民間宇宙の土台となり**、2015年12月のファルコン9第1段着陸(技術)、2020年の民間有人飛行へつながる。同年、政府はコンステレーション計画で月再訪を目指していたが、後に中止される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Commercial Orbital Transportation Services","url":"https://en.wikipedia.org/wiki/Commercial_Orbital_Transportation_Services"}]},{"date":"2011-07-21","precision":"day","end_date":"2020-05-30","type":"period","layer":"社会の動き","title":"シャトル退役後、米国が有人打ち上げ能力を失った9年間","summary":"STS-135の帰還を最後にシャトルが退役し、米国飛行士はISSへ行くためロシアのソユーズに依存することになった。退役の背景にはコロンビア号事故後の安全性評価と運用コストがある。\n\nこの間、米国はソユーズの座席を購入し続け、宇宙開発の主導権をめぐる議論と民間活用への期待が高まった。人の決断レイヤーで2006年に始まった民間委託が、2020年5月30日のクルードラゴン初有人飛行(技術)で空白を埋める形となる。","detail":null,"credibility":"unverified","credibility_note":"ソユーズ座席の購入単価は契約年により異なり、報道値に幅があるため本項では金額を示していない。","sources":[{"title":"Wikipedia（英語版）: STS-135","url":"https://en.wikipedia.org/wiki/STS-135"}]},{"date":"2020-05-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"クルードラゴン、民間宇宙船初の有人軌道飛行","summary":"スペースXの宇宙船クルードラゴンがNASA飛行士2名をISSへ運び、民間企業が有人軌道飛行を担う時代が始まった。ファルコン9第1段は洋上のドローン船に着陸し、2015年以来の再使用技術が有人飛行にも適用された。\n\n2006年のCOTS契約(人の決断)から14年、シャトル退役後の空白(社会の動き)を終わらせた飛行でもある。新型コロナウイルスの流行下で観客を制限した打ち上げとなり、同年10月にはアルテミス合意が署名され月探査の国際枠組みが動き出した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Crew Dragon Demo-2","url":"https://en.wikipedia.org/wiki/Crew_Dragon_Demo-2"}]},{"date":"2020-10-13","precision":"day","end_date":null,"type":"point","layer":"社会の動き","title":"アルテミス合意に日本など8か国が署名","summary":"月探査の行動原則を定めたアルテミス合意に日本など8か国が署名した。1967年の宇宙条約を土台に、透明性・相互運用性・宇宙資源の利用や安全区域の考え方を示したもので、米国主導のアルテミス計画に参加する国々による合意である。\n\nロシアと中国は加わっておらず、月探査は再び複数の陣営に分かれつつある。技術レイヤーで民間有人飛行が実現した同じ年に法と外交の枠組みが更新された点は、1967年に宇宙条約と有人計画が並走した構図の再来ともいえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Artemis Accords","url":"https://en.wikipedia.org/wiki/Artemis_Accords"}]}]},{"slug":"personal-career-turns","title":"キャリアの転換点","description":"1998年、就職氷河期に社会へ出た架空の一人の28年。転機の決断と仕事の現場の変化に、金融危機やリモートワーク、生成AIといった経済と働き方の地殻変動を重ね、キャリアが時代に削られ、開かれてきた道筋をたどる。","category":"personal-life","language":"ja","start_year":1997,"end_year":2026,"layers":[{"name":"転機と決断","color":"purple"},{"name":"仕事の現場","color":"orange"},{"name":"経済と働き方","color":"blue"}],"events":[{"date":"1997-11-24","precision":"day","end_date":null,"type":"point","layer":"経済と働き方","title":"山一證券が自主廃業","summary":"四大証券の一角だった山一證券が自主廃業を決めた。前後して北海道拓殖銀行も破綻し、金融危機は企業の新卒採用の急収縮につながり、以後の就職戦線は「氷河期」と呼ばれる長い冬に入る。\n\n大学3年だった「わたし」がテレビで見たのは、経営陣が頭を下げる映像だった。**個人の努力の外側で採用の椅子が消えていく**のを、このとき初めて具体的に想像した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 山一證券","url":"https://ja.wikipedia.org/wiki/%E5%B1%B1%E4%B8%80%E8%A8%BC%E5%88%B8"}]},{"date":"1998-04-01","precision":"day","end_date":null,"type":"point","layer":"転機と決断","title":"第一志望全滅、町の印刷会社へ(22歳)","summary":"出版社とメーカーを中心に40社近く受けてすべて落ち、ゼミの紹介で従業員30人の印刷会社に入社した。希望とは違う入口だったが、選べる状況ではなかった。\n\n後から見れば、ここが最初の転機である。印刷の現場で覚えた組版と色の知識は、のちにWebの仕事へ移るときの土台になった。入口の不本意さと、そこで拾えるものは別だと知るのは、もう少し先の話である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-01-01","precision":"year","end_date":null,"type":"point","layer":"経済と働き方","title":"大卒求人倍率が1倍を割り込む","summary":"民間調査で2000年3月卒の大卒求人倍率が0.99倍とされ、調査開始以来初めて1倍を下回った。新卒一括採用を前提とする社会で、椅子が人数より少ない年が現実になった。\n\n数値は調査主体の定義によって幅があるものの、「わたし」の数年下の後輩たちが味わった状況は数字より厳しかったと記憶している。「氷河期世代」という言葉が定着していく。","detail":null,"credibility":"disputed","credibility_note":"求人倍率は民間調査(リクルートワークス研究所)に基づく推計で、対象企業や算出方法により他の調査と数値が一致しない。","sources":[{"title":"リクルートワークス研究所「大卒求人倍率調査」","url":null}]},{"date":"2001-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事の現場","title":"独学のHTMLで会社サイトを作る","summary":"深夜のファミレスと入門書で覚えたHTMLで、勤め先の最初のWebサイトを作った。上司の指示は「若いから分かるだろう」の一言で、業務命令ですらなかった。\n\n印刷不況の足音の中、サイト経由の小さな受注が取れたことが社内での立場を変えた。会社の外でも通用する技能を持つという発想は、このときの手応えから始まっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2003-04-01","precision":"month","end_date":null,"type":"point","layer":"仕事の現場","title":"「Web制作担当」が正式な肩書になる","summary":"名刺に「Web制作担当」が加わり、印刷とWebの二足のわらじが公式になった。ブロードバンドの普及で中小企業のサイト需要が伸び、制作の外注をさばく窓口も任された。\n\n独学の知識では追いつかなくなり、夜間のデザインスクールに自腹で通った。**学び直しは危機が来る前に始めておくもの**だという教訓は、この時期の貯金である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2005-04-01","precision":"month","end_date":null,"type":"point","layer":"転機と決断","title":"29歳、Web制作会社へ転職","summary":"求人サイト経由で20人規模のWeb制作会社に転職した。給与はほぼ横ばい、通勤時間は倍。それでも、本業としてWebをやれる環境を選んだ。\n\n印刷会社の上司には強く引き留められたが、「刷り物は減っていく」という現場の実感が背中を押した。転職が珍しくなくなり始めた時期で、大学の同期も3人が前後して会社を移っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2008-09-15","precision":"day","end_date":null,"type":"point","layer":"経済と働き方","title":"リーマン・ショック","summary":"米リーマン・ブラザーズが経営破綻し、世界金融危機の引き金になった。日本でも企業の広告宣伝費が真っ先に削られ、Web制作業界の受注は翌年にかけて急減した。\n\n32歳の「わたし」の勤め先も例外ではなかった。10年前に就職の入口で経験した「外側から来る危機」が、今度は築いてきたキャリアの真ん中を直撃することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 平成21年度 年次経済財政報告","url":null}]},{"date":"2009-03-01","precision":"month","end_date":null,"type":"point","layer":"転機と決断","title":"受注半減、会社都合の退職(33歳)","summary":"会社の受注が半減し、人員整理の対象になった。会社都合の退職。ハローワークの列に並びながら、雇われ続けることだけを前提にした人生設計の危うさを考えた。\n\n再就職先を探すか、細々と抱えていた直請け案件を足がかりに独立するか。失業手当をもらいながら1か月迷い、後者を選んだ。恐怖より、発注側と直接話せる仕事の面白さが勝った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-04-01","precision":"month","end_date":"2014-04-30","type":"period","layer":"仕事の現場","title":"フリーランスの5年間","summary":"屋号ひとつで始めた個人事業は、初年度の売上が会社員時代の年収の6割だった。営業も経理も納品もひとり。それでも3年目には取引先が10社を超え、仕事を選べるようになった。\n\nこの間にスマートフォンの普及がWeb業界の需要を押し上げ、個人にも仕事が回ってきた。**危機で始めた働き方が、次の波で追い風を受けた**5年である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2011-01-01","precision":"year","end_date":null,"type":"point","layer":"経済と働き方","title":"スマートフォン保有世帯が3割へ急伸","summary":"総務省の通信利用動向調査で、スマートフォンを保有する世帯の割合が3割近くに達したとされる。前年から倍増のペースで、企業サイトのスマホ対応が一斉に発注される特需が生まれた。\n\nフリーランス2年目の「わたし」の仕事の半分は、このスマホ対応の案件だった。技術の普及曲線が、個人の売上曲線をそのまま持ち上げた年である。","detail":null,"credibility":"unverified","credibility_note":"世帯保有率は総務省の公表統計だが、調査年版によって端末分類の定義が変わっており、当該年の正確な数値は確認できていない。","sources":[{"title":"総務省「通信利用動向調査」","url":null}]},{"date":"2014-05-01","precision":"month","end_date":null,"type":"point","layer":"転機と決断","title":"法人化、3人の会社を作る(38歳)","summary":"増えた案件を断り切れなくなり、常連の外注パートナー2人と株式会社を設立した。社名は3日で決め、資本金は貯金から300万円。肩書が「代表」になった。\n\n雇う側になって最初に決めたのは、全員の残業を月20時間までにすることだった。氷河期の入口で自分が味わった働かされ方を、自分の会社で再生産しないための線引きである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-09-01","precision":"month","end_date":null,"type":"point","layer":"転機と決断","title":"41歳、長野へ移住しフルリモート経営に","summary":"東京の事務所を解約し、家族で長野県に移住した。社員とは毎朝のビデオ会議でつなぎ、客先へは月2回の新幹線。当時はまだ「思い切った実験」と呼ばれた。\n\n各地で移住支援策が整い始めた時期だったが、取引先の半数には心配された。**働く場所を先に決め、働き方を後から作る**という順番は、3年後に世の中の標準が追いつくことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-06-29","precision":"day","end_date":null,"type":"point","layer":"経済と働き方","title":"働き方改革関連法が成立","summary":"残業時間の罰則付き上限規制や年次有給休暇の取得義務などを定めた働き方改革関連法が成立した。長時間労働を前提にしてきた日本の働き方に、法律が初めて明確な天井を作った。\n\n「わたし」の会社が4年前から続けていた残業上限は、期せずして法の先取りになっていた。制度が現場を追いかけてくる感覚は、移住のときと同じだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 働き方改革関連法の概要","url":null}]},{"date":"2019-06-21","precision":"day","end_date":null,"type":"point","layer":"経済と働き方","title":"就職氷河期世代支援プログラム決定","summary":"政府が「骨太の方針」で就職氷河期世代支援プログラムを打ち出し、30代半ばから40代半ばの世代を対象とする3年間の集中支援を掲げた。卒業年次の偶然が20年続く不利になった現実を、国が公式に認めた形である。\n\n43歳の「わたし」はまさに対象世代だった。同窓会の顔ぶれを思い浮かべると、支援の遅さと、それでも問題に名前が付いたことの意味を、両方考える。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 経済財政運営と改革の基本方針2019","url":null}]},{"date":"2020-04-07","precision":"day","end_date":null,"type":"point","layer":"経済と働き方","title":"緊急事態宣言、リモートワークが一斉に始まる","summary":"新型コロナウイルス対策の緊急事態宣言が7都府県に発出され、出社を前提としない働き方が半ば強制的に始まった。ビデオ会議と在宅勤務は、数週間で当たり前の風景になった。\n\n3年前に「実験」と呼ばれた「わたし」の会社の形は、一夜にして標準の側になった。危機のたびに働き方の常識が書き換わるのを、これで3度目撃したことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 新型コロナウイルス感染症緊急事態宣言(令和2年4月7日)","url":null}]},{"date":"2020-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事の現場","title":"「移住した経営者」に相談が続く","summary":"リモート移行や地方拠点づくりの相談が取引先から相次ぎ、制作会社なのに働き方の相談窓口のようになった。移住から3年分の試行錯誤と失敗談が、そのまま商品になった。\n\n講演や寄稿の依頼も増え、売上の1割が「作らない仕事」になった。専門性は計画して作るものだと思っていたが、偶然の蓄積があとから資産になることもあると知った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"経済と働き方","title":"ChatGPT公開、制作の現場が揺れる","summary":"OpenAIが対話型AIのChatGPTを無料公開し、文章やコードの生成が誰にでも使える道具になった。Web制作の見積もりの前提が、数か月単位で崩れ始める。\n\n46歳の「わたし」には3度目の地殻変動だった。HTMLを独学した2001年と同じで、**新しい道具は職を奪う前に、覚えた者の道具になる**。社内勉強会を年内に始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: Introducing ChatGPT","url":"https://openai.com/index/chatgpt/"}]},{"date":"2023-07-01","precision":"month","end_date":null,"type":"point","layer":"仕事の現場","title":"生成AIを制作フローに組み込む","summary":"原稿の下書きとコードの雛形づくりに生成AIを標準採用し、見積もりの工数を平均3割圧縮した。浮いた時間は設計と取材に回すと決め、請求の単価は下げなかった。\n\n「安くする」ではなく「濃くする」方向に使うという判断は、印刷からWebへ移った経験の応用である。道具が変わるたびに、自分たちに残る仕事の核は何かを問われてきた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-01-01","precision":"month","end_date":null,"type":"point","layer":"転機と決断","title":"50歳、次の10年の設計図を書く","summary":"50歳の正月、これまでの転機を1枚の紙に書き出した。不本意な入社、独学、転職、退職勧奨、独立、法人化、移住。**自分から選んだ転機は半分もなかった**が、選び直した回数なら全部だった。\n\n次の10年は、会社を若い2人に少しずつ渡しながら、氷河期世代の学び直しと再挑戦を支援する仕事を事業の柱に加える。入口で詰まった世代の、出口を作る側に回りたい。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-cooking","title":"料理スキルの進化","description":"2005年、進学を機に自炊ゼロから始めた架空の「僕」の20年。台所の記録に暮らしの転機と食の時代を重ね、レシピサイトから動画、値上げの時代まで、家庭の台所が社会とどうつながってきたかを残す。","category":"personal-life","language":"ja","start_year":2005,"end_year":2026,"layers":[{"name":"台所の記録","color":"green"},{"name":"暮らしの転機","color":"gold"},{"name":"食の時代","color":"orange"}],"events":[{"date":"2005-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"京都で一人暮らしを始める","summary":"大学進学で福岡から京都へ。六畳とミニキッチンのワンルームで、18年間の実家暮らしが終わった。炊飯器と包丁一本は母が持たせてくれた。\n\n自炊の動機は仕送りの節約だった。当時の頼りは雑誌の切り抜きと母への電話で、レシピをネットで検索する習慣はまだ薄かった。台所の記録は、ここから始まる。最初に買い足した道具は、100円の計量カップだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2005-05-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"最初のカレー、鍋を焦がす","summary":"初めての自炊はカレーだった。ルウの箱の手順すら読み飛ばし、水を減らしすぎて鍋底を焦がした。それでも食べられたことに驚いた、と当時の日記にある。\n\n失敗の原因を調べもせず、次も勘で作った。**焦げた鍋から始まった**この年表は、道具と情報が台所をどう変えるかの記録でもある。20年後、僕はもう一度このカレーを作り直すことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2006-04-01","precision":"month","end_date":"2008-03-31","type":"period","layer":"台所の記録","title":"定食屋のまかないで基礎を覚える","summary":"学生街の定食屋でアルバイトを始め、まかない付きの2年間で包丁の持ち方、だしの取り方、火加減を仕込まれた。店主の口癖は「レシピより段取り」。皿洗いから始めて、半年で仕込みを任された。\n\n体系立てて習ったわけではないが、目の前で見て真似る学び方は、のちの動画レシピの時代を先取りしていたのかもしれない。この2年が僕の料理の土台になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"食の時代","title":"「弁当男子」という言葉が広まる","summary":"弁当を自作する男性を指す「弁当男子」という言葉がメディアで広まった。節約志向と健康志向を背景に、男性の料理が特集される機会が増えた。\n\n流行の起点や広がりの実態を示す確かな統計はなく、報道ベースの流行語である。ただ、料理は女性のものという前提が緩み始めた空気は、数年後に弁当を作り始める僕の背中を確かに押した。","detail":null,"credibility":"unverified","credibility_note":"流行語としての起点や普及の程度は報道ベースで、確かな統計や確定した初出はない。","sources":[{"title":"「弁当男子」に関する各紙報道(2009年)","url":null}]},{"date":"2009-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"就職、自炊が途絶える","summary":"大阪の機械メーカーに営業職で入社した。歓迎会、残業、外回り。気づけば冷蔵庫には調味料だけが残り、自炊は月に数回まで減った。\n\nリーマン・ショック直後の就職で、同期は当初の予定より少なかったと聞いた。コンビニと外食に頼る生活は、忙しさの記録でもある。台所が復活するには、震災と弁当というふたつの出来事を待つことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-07-01","precision":"month","end_date":null,"type":"point","layer":"食の時代","title":"クックパッドが上場","summary":"レシピ投稿サイトのクックパッドが東証マザーズに上場した。家庭の無数のレシピが検索される時代の到来を象徴する出来事である。\n\n「レシピは本で調べるもの」から「検索するもの」への転換点だった。自炊を休んでいた僕(暮らしの転機レイヤー)がのちに台所へ戻ったとき、まず開いたのはこのサイトだった。**台所に検索窓がついた**時代の始まりである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"クックパッド株式会社: 東証マザーズ上場(2009年7月)","url":null}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"食の時代","title":"東日本大震災、家で作る意味が問い直される","summary":"東北地方太平洋沖地震と津波により東日本一帯が甚大な被害を受けた。首都圏では計画停電が行われ、店頭から米や水が消えた。\n\n外食やコンビニに頼る暮らしの脆さが意識され、家で作って食べることの意味が問い直された。大阪にいた僕も買い置きと自炊を再開した。食をめぐる「内向き」への転換は、この日を境に語られることが多い。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成23年(2011年)東北地方太平洋沖地震","url":null}]},{"date":"2012-06-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"週3日の弁当作りを始める","summary":"節約と昼食の栄養を考え、週3日の弁当を始めた。前夜の残りと卵焼き、冷凍ブロッコリー。職場では「弁当男子」とからかわれたが、続いた。卵焼きは百回焼いて、ようやく形になった。\n\n震災を機に再開した自炊が習慣として定着した時期で、レシピ検索が毎晩の日課になった。数年前に流行語だった言葉(食の時代レイヤー)が、そのまま自分の生活になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2013-12-04","precision":"day","end_date":null,"type":"point","layer":"食の時代","title":"和食がユネスコ無形文化遺産に登録","summary":"「和食;日本人の伝統的な食文化」がユネスコ無形文化遺産に登録された。自然の尊重や年中行事との結びつきが評価された。\n\n登録が家庭の食卓を直接変えたわけではないが、だしや一汁三菜が改めて語られる契機になった。まかない時代に習っただしの取り方を、僕が引っ張り出したのもこの頃である。書店には、だしの特集を組む雑誌が並んでいた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"農林水産省: 「和食」のユネスコ無形文化遺産登録","url":null}]},{"date":"2014-11-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"だしを引く生活","summary":"昆布と鰹節でだしを取り、味噌汁を毎朝作るようになった。休日に昆布水を仕込み、平日はそれで済ませる自己流の段取りも固まった。鰹節は削り節で妥協したが、香りの違いには驚いた。\n\n和食の遺産登録以降の「だしブーム」に乗った形だが、手を動かすと定食屋の店主の言葉が戻ってきた。レシピより段取り。**基本はいつも人から習ったものだった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-01-01","precision":"year","end_date":null,"type":"point","layer":"食の時代","title":"1分料理動画アプリが台頭","summary":"スマートフォン向けの短い料理動画サービスが相次いで登場し、レシピを「読む」時代から「見る」時代への移行が進んだ。\n\n各サービスの開始時期や利用者数は自社発表が中心で、正確な比較は難しい。ただ、手元を映す動画が火加減や手順の「見て覚える」を誰にでも開いたことは、まかないで育った身として実感をもって言える。","detail":null,"credibility":"unverified","credibility_note":"各サービスの開始時期・利用者数は自社発表ベースで、第三者による確定的な統計がない。","sources":[{"title":"料理動画サービス各社のプレスリリース(2015〜2016年)","url":null}]},{"date":"2017-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"東京転勤、1Kの狭い台所へ","summary":"東京本社へ異動し、まな板を置くと調理スペースが消える1Kのキッチンになった。フライパン一つ、鍋一つに道具を絞った。\n\n制約は工夫の母で、ワンパン調理と作り置きに傾いたのはこの部屋のせいである。動画アプリの「狭いキッチン向け」特集にも助けられた。台所の広さより段取りが腕を決めるのだと、狭さが教えてくれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-03-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"週末の作り置きを習慣化","summary":"日曜の夜に常備菜を4品作る習慣が定着した。きんぴら、塩ゆで鶏、ミニトマトのマリネ。保存容器を統一したら冷蔵庫が図書館のようになった。\n\n平日の自炊率は一気に上がり、外食は「行きたい店」だけになった。検索と動画で覚えた技術が、狭い台所の制約と組み合わさって自分の型になった時期である。日曜の台所仕事は、気づけば週の楽しみになっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"食の時代","title":"小麦粉やホットケーキミックスが品薄に","summary":"外出自粛で家庭での菓子作りやパン作りが広がり、小麦粉やホットケーキミックスの品薄が各地で報じられた。\n\n台所が娯楽の場になったことを示す象徴的な現象だった。メーカーは増産で対応し、品薄は秋にかけて解消へ向かう。在宅で三食を作っていた僕(暮らしの転機レイヤー)も、生まれて初めてパンを焼いた一人である。スーパーの粉売り場が空になった光景は、記憶に残っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ホットケーキミックス等の品薄に関する報道(2020年春)","url":null}]},{"date":"2020-04-07","precision":"day","end_date":"2020-05-25","type":"period","layer":"暮らしの転機","title":"在宅勤務、三食を自分で作る","summary":"緊急事態宣言で在宅勤務になり、生まれて初めて三食を自分で作る日々になった。昼はパスタばかり茹でていた記録が残っている。\n\n同じ頃、全国で小麦粉や製菓材料が品薄になった(食の時代レイヤー)。台所に立つ人が一斉に増えた春で、僕の料理も「済ませるもの」から「楽しみ」へ変わり始めた。毎日の献立を考える大変さも、このとき初めて知った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-05-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"結婚、ふたりの台所になる","summary":"在宅期間に再会した大学時代の友人と結婚し、2LDKに移った。台所の主導権は週替わり、味噌汁の味噌は折衷案で合わせ味噌になった。\n\n料理を「自分の管理」から「ふたりの運営」へ変える転機だった。得意料理のカレーは、相方の一票で辛口から中辛になった。台所は初めて、交渉の場になった。冷蔵庫の中身にも、ふたり分の歴史が同居し始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-11-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"低温調理器を導入する","summary":"ボーナスで低温調理器を買い、鶏むね肉と温度の関係に沼のようにはまった。63度と68度の違いを食べ比べ、ノートに記録した。\n\n感覚で覚えた火加減を数値で捉え直す経験は、まかないで仕込まれた技術に理屈の裏付けを与えた。家庭の調理家電が「科学」を連れてきた時期で、SNSには温度と時間の一覧表が飛び交っていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-10-01","precision":"month","end_date":null,"type":"point","layer":"食の時代","title":"食品値上げ、単月で6,000品目超","summary":"原材料高と
