n\n技術(ジェネシスブロック)から1年半で価格発見が始まった事例で、翌年以降の取引所の乱立とMt.Goxの台頭(規制と事件)につながります。投機資産っぽさは、この時点ではまだ薄めでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcointalk: Pizza for bitcoins? (2010)","url":"https://bitcointalk.org/index.php?topic=137.0"}]},{"date":"2013-10-02","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🕸️ 闇市場Silk Roadを米当局が閉鎖","summary":"FBIがBitcoin決済の違法商品市場Silk Roadを閉鎖し、運営者を逮捕。Bitcoinと犯罪の結びつきが広く報じられ、Torと暗号資産の匿名性を使った市場の摘発は、規制当局が本格的に監視へ動く契機になりました。\n\n同年12月には中国人民銀行が金融機関のBitcoin取扱いを禁止し、価格が急落しています(市場と資本)。「技術は中立、使い方が違法」という切り分けの枠組みも、この事件を通じて形になっていきました。","detail":null,"credibility":"unverified","credibility_note":"当局が押収したBitcoinの数量は報道によって約2.6万〜17万BTCと幅があって、押収時期の区別も含めて数字は固まっていません。","sources":[{"title":"Wikipedia: Silk Road (marketplace)","url":"https://en.wikipedia.org/wiki/Silk_Road_(marketplace)"}]},{"date":"2014-02-28","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🫠 Mt.Goxが民事再生を申請、大量のBitcoin消失","summary":"東京の取引所Mt.Goxが取引を停止して民事再生を申請。顧客資産を含む大量のBitcoinが失われたと発表され、業界最大級の破綻になりました。世界のBitcoin取引の大半を扱っていた場所だけに、価格の長期低迷を招きます。\n\n各国に取引所規制の必要性を突きつけ、日本では利用者保護の議論が進み、2017年の改正資金決済法(規制と事件)で登録制が導入されます。技術そのものより**取引所という「入口」が最大の弱点**だと示した事件でした。","detail":null,"credibility":"disputed","credibility_note":"消失額は当初約85万BTCと発表されましたが、後に約20万BTCが見つかるなど、実際の損失規模も原因(外部からのハッキングか内部要因か)も諸説あります。","sources":[{"title":"Wikipedia: Mt. Gox","url":"https://en.wikipedia.org/wiki/Mt._Gox"}]},{"date":"2015-07-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🧱 Ethereumメインネット稼働開始","summary":"スマートコントラクトを実行できる汎用ブロックチェーンEthereumが稼働開始。ヴィタリック・ブテリンが2013年に構想し、2014年のクラウドセールで資金を集めて開発されました。「通貨」から「プログラム可能な台帳」へ、用途が一段広がります!\n\n任意のプログラムをチェーン上で動かせる設計は、翌年のThe DAO(技術・事件)や2017年のICOブーム(市場と資本)、後のDeFiやNFTの土台に。Bitcoinが「価値の保存」に寄る一方、Ethereumは応用の実験場になっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ethereum","url":"https://en.wikipedia.org/wiki/Ethereum"}]},{"date":"2016-06-17","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🕳️ The DAOハッキング、Ethereumがハードフォークへ","summary":"Ethereum上の投資ファンドThe DAOの脆弱性が突かれ、集めたETHの約3分の1が流出。「コードが法」という理念と、被害回復のためにチェーンを巻き戻すかという実務判断がぶつかり、ハードフォークをめぐって議論は真っ二つになりました。\n\n7月のハードフォークで、巻き戻さない側がEthereum Classicとして分離。スマートコントラクトの穴が巨額損失に直結すると示し、後の監査産業やDeFiハックの系譜(規制と事件)の起点になった事件です。","detail":null,"credibility":"unverified","credibility_note":"流出額は約360万ETHとされますが、当時のドル換算は5000万〜7000万ドルと資料によって幅があります。","sources":[{"title":"Wikipedia: The DAO","url":"https://en.wikipedia.org/wiki/The_DAO"}]},{"date":"2017-01-01","precision":"year","end_date":"2018-01-31","type":"period","layer":"市場と資本","title":"🚀 ICOブーム","summary":"Ethereum上でトークンを発行して資金を集めるICOが急増し、2017年に数十億ドル規模の調達が行われました。Ethereumのスマートコントラクト(技術)あってこその手法で、ホワイトペーパー1枚で巨額が集まる例が続出し、多くは後に価値を失います。\n\n2017年9月には中国がICOを全面禁止、米SECも証券法違反の警告を出すなど、規制と事件レイヤーが動き出しました。同年末のBitcoin高騰と重なり、暗号資産は一般投資家の関心事になっていきます。","detail":null,"credibility":"unverified","credibility_note":"ブームの始まりと終わりに明確な定義はなく、調達総額も集計機関によって大きく違います。","sources":[{"title":"Wikipedia: Initial coin offering","url":"https://en.wikipedia.org/wiki/Initial_coin_offering"}]},{"date":"2017-04-01","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🗾 日本で改正資金決済法が施行、仮想通貨交換業を登録制に","summary":"仮想通貨を法的に定義し、交換業者に金融庁への登録を義務づける改正資金決済法が施行。主要国では初の包括的な取引所規制で、Mt.Gox破綻(2014年)の教訓から、利用者財産の分別管理や本人確認が義務化されました。\n\n同年、日本は世界のBitcoin取引で大きなシェアを占め、価格高騰(市場と資本)を支えた一因ともされます。ただ翌年のCoincheck事件で、登録制だけでは資産を守りきれないことが露呈することになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"金融庁: 仮想通貨交換業者登録一覧・資金決済に関する法律","url":null}]},{"date":"2017-08-01","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🍴 Bitcoin Cashが分岐、ブロックサイズ論争の決着","summary":"取引処理能力をめぐる数年来の対立の末、ブロックサイズを拡大したBitcoin Cashが分岐し、Bitcoin本体はSegWitを有効化。分散型ネットワークの仕様を誰がどう決めるのかというガバナンス問題が、チェーンの分裂という形で表に出ました。\n\n技術論争は市場にも波及し、分岐前後の価格変動や取引所の対応(市場と資本)に投資家は振り回されます。この後Bitcoinはレイヤー2で拡張する路線を、Ethereumはやがてコンセンサス転換(2022年のMerge)を選びました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin Cash","url":"https://en.wikipedia.org/wiki/Bitcoin_Cash"}]},{"date":"2017-12-17","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"🎆 Bitcoinが約2万ドルの史上最高値、初のバブル頂点","summary":"Bitcoin価格が主要取引所で2万ドル前後に到達し、当時の史上最高値に。年初の約1000ドルから20倍近い上昇で、ICOブームを背景に個人投資家が殺到し、テレビや新聞まで連日報じる社会現象になりました。\n\n同月にCBOEとCMEがBitcoin先物を上場し、機関投資家の参入も期待されましたが、翌年には8割以上下落する「暗号資産の冬」へ。技術(SegWit、Bitcoin Cash分岐)も規制(日本の登録制、中国のICO禁止)も、ぜんぶ同じ年に集中していました。","detail":null,"credibility":"disputed","credibility_note":"最高値は取引所によって1万9000〜2万ドル台と差があり、日付も12月16〜18日の間で資料によりばらつきます。","sources":[{"title":"CoinMarketCap: Bitcoin 価格履歴","url":null}]},{"date":"2018-01-26","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🚨 コインチェックからNEM約580億円分が流出","summary":"国内取引所コインチェックから約5.2億XEM(当時約580億円相当)が不正送金されました。単一事件では当時最大規模の流出で、改正資金決済法(2017年)の登録審査中だった業者で起き、ホットウォレット管理の不備が指摘されます。\n\n金融庁は立入検査と業務改善命令を出し、以後の審査は厳格化。バブル頂点(市場と資本)からわずか1か月後の出来事で、**熱狂の直後に事件が起きるというこの年表の反復パターン**をそのまま体現しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Coincheck","url":"https://en.wikipedia.org/wiki/Coincheck"}]},{"date":"2021-09-07","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🌎 エルサルバドルがBitcoinを法定通貨に","summary":"エルサルバドルで世界初となるBitcoin法定通貨法が施行。ドル化経済の同国が送金コスト削減と金融包摂を掲げ、国家が暗号資産を通貨として採用する実験が始まりました。\n\n国民の利用は限定的で、IMFは金融リスクを警告し続け、2025年にはIMF融資の条件として法定通貨としての受け入れ義務が撤回されています。同じ月に中国は暗号資産取引を全面禁止していて、国家の対応が正反対に割れた月でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin Law","url":"https://en.wikipedia.org/wiki/Bitcoin_Law"}]},{"date":"2021-09-24","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🚫 中国が暗号資産取引とマイニングを全面禁止","summary":"中国人民銀行など10機関が、暗号資産関連の取引を違法とする通知を公表。同年5月のマイニング規制と合わせて事実上の全面禁止となり、世界のBitcoinマイニングの過半を担っていた中国から、ハッシュレートが米国などへ流出しました(技術)。\n\n取引禁止で市場は短期的に下落したものの、同年11月にはBitcoinが史上最高値を更新(市場と資本)。一国が禁止しても市場は止まらないことも示されました。エルサルバドルの法定通貨化と同じ月の出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中国人民銀行: 关于进一步防范和处置虚拟货币交易炒作风险的通知(2021年9月24日)","url":null}]},{"date":"2021-11-10","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"🌕 Bitcoinが約6万9000ドルの史上最高値","summary":"コロナ禍の金融緩和とTeslaなど企業の購入、米国での先物ETF承認を背景に、Bitcoinが約6万9000ドルの史上最高値をつけました。2017年の頂点(約2万ドル)から3年半で3倍超、NFTやDeFiのブームも重なったお祭り状態です。\n\n翌2022年の利上げ局面でTerra崩壊とFTX破綻(規制と事件)が続き、価格は1万6000ドル台まで下落。低金利下の資本(市場と資本)が流れ込み、引き締めとともに引いていく構図がはっきり出ました。","detail":null,"credibility":"disputed","credibility_note":"最高値は取引所によって6万8000〜6万9000ドル台と差があります。","sources":[{"title":"CoinMarketCap: Bitcoin 価格履歴","url":null}]},{"date":"2022-05-07","precision":"day","end_date":"2022-05-13","type":"period","layer":"市場と資本","title":"💥 Terra/USTの崩壊","summary":"アルゴリズム型ステーブルコインUSTがドル連動を失い、姉妹通貨LUNAとともに1週間でほぼ無価値に。約400億ドル規模の時価総額が消えました。担保ではなくアルゴリズムで価格を保つ設計(技術)の弱さが、市場の売り圧力で一気に露呈した形です。\n\nヘッジファンドや貸付業者の破綻が連鎖し、**11月のFTX破綻(規制と事件)へ続く信用収縮の起点**になりました。米国や日本でステーブルコイン規制の議論が急加速し、日本では翌年、改正資金決済法で発行者が限定されます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Terra (blockchain)","url":"https://en.wikipedia.org/wiki/Terra_(blockchain)"}]},{"date":"2022-09-15","precision":"day","end_date":null,"type":"point","layer":"技術","title":"🔀 Ethereumが「The Merge」でProof of Stakeへ移行","summary":"EthereumがProof of WorkからProof of Stakeへ移行するアップグレード「The Merge」を完了し、消費電力を99%以上削減したとされます。動いているネットワークを止めずに合意形成の仕組みを入れ替える、数年がかりの開発の集大成でした!\n\n環境負荷への批判(規制と事件レイヤーの論点)に技術で答えた形ですが、同時期の市場はTerra崩壊とFTX破綻に挟まれた「冬」の真っ最中で、価格への影響は限定的。**技術と市場の時間軸のずれ**がよく分かる事例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ethereum.org: The Merge","url":"https://ethereum.org/en/roadmap/merge/"}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🧊 FTXが破産申請、顧客資産流用が発覚","summary":"世界2位級の取引所FTXが米国で連邦破産法11条を申請。関連会社への顧客資産流用が明らかになり、創業者は後に有罪となりました。Mt.Gox(2014年)以来、また「取引所」が最大の弱点になった事件で、規制当局や政界に食い込んでいた企業の破綻は業界の信頼を失墜させます。\n\n米国では取引所規制の議論が加速。日本では分別管理義務のおかげで、国内利用者への資産返還が比較的すんなり進んだのが対照的でした。市場(市場と資本)は底値圏に沈みます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bankruptcy of FTX","url":"https://en.wikipedia.org/wiki/Bankruptcy_of_FTX"}]},{"date":"2024-01-10","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"🏦 米SECが現物Bitcoin ETFを承認","summary":"米証券取引委員会が11本の現物Bitcoin ETFを承認。10年以上却下され続けた申請が裁判所の判断を経て承認に至り、証券口座で買える商品になって、機関投資家と個人の資金流入が加速しました。\n\nFTX破綻(規制と事件)から1年ちょっとでの転換で、投機的な「取引所」経由から規制された金融商品へと入口が広がります。同年4月の半減期とも重なり、Bitcoinは同年末に初めて10万ドル超え!**技術ではなく制度が価格を動かした**局面です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SEC: Statement on the Approval of Spot Bitcoin Exchange-Traded Products (2024-01-10)","url":"https://www.sec.gov/newsroom/speeches-statements/gensler-statement-spot-bitcoin-011023"}]},{"date":"2025-07-18","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"🏛️ 米国でステーブルコイン規制法(GENIUS法)が成立","summary":"ドル連動ステーブルコインの発行者に準備資産の全額裏付けなどを義務づけるGENIUS法が成立し、米国初の包括的な暗号資産法制になりました。Terra崩壊(2022年)で露呈した危うさへの立法上の回答で、同時にドル建てステーブルコインを制度に取り込む産業政策でもあります。\n\nETF承認(市場と資本)と並んで、暗号資産が**「規制の外」から「規制の内側」へ**移る流れを決定づけました。Bitcoin論文から17年、興亡の末にたどり着いた現在地です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: GENIUS Act","url":"https://en.wikipedia.org/wiki/GENIUS_Act"}]}]},{"slug":"tech-cloud-revolution","title":"☁️ クラウド革命の15年","description":"2006年のAmazon S3公開から、社会の土台になった末の大規模障害まで。技術・企業競争・利用者の3つのレイヤーで、計算資源が「所有するもの」から「借りるもの」へ変わった15年をたどる年表です ☁️","category":"technology","language":"ja","start_year":2006,"end_year":2021,"layers":[{"name":"技術とサービス","color":"blue"},{"name":"企業競争","color":"orange"},{"name":"利用者と社会","color":"teal"}],"events":[{"date":"2006-03-14","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"📦 Amazon S3公開、クラウドストレージの誕生","summary":"Amazonがオンラインストレージ「Amazon S3」を公開しました。使った分だけ課金される従量制で、開発者はサーバーを買わずに、事実上無限の保存領域を使えるようになったのです!\n\n書店から始まった小売企業が、自社インフラの技術を外販する。この意外な参入が、**「所有から利用へ」**というクラウド革命の出発点になりました。後発のGoogleやMicrosoftが追いかける構図(企業競争レイヤー)も、ここから始まります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"AWS News Blog: Amazon S3 (2006-03-14)","url":"https://aws.amazon.com/blogs/aws/amazon_s3/"}]},{"date":"2006-08-25","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"🖥️ Amazon EC2ベータ公開、仮想サーバーを時間貸し","summary":"Amazonが、仮想サーバーを1時間単位で貸し出す「Amazon EC2」のベータ版を公開しました。クレジットカード1枚で数分後にサーバーが手に入る。調達に数週間かかる物理サーバーの常識が、ここでひっくり返りました!\n\nS3と組み合わせるとスタートアップの初期投資が劇的に下がります。のちのモバイルアプリやSNSの爆発的増加を支える、見えない土台になりました。利用者と社会レイヤーの変化は、まずスタートアップ経済に現れます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"AWS News Blog: Amazon EC2 Beta (2006-08-25)","url":"https://aws.amazon.com/blogs/aws/amazon_ec2_beta/"}]},{"date":"2008-04-07","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"⚙️ Google App Engine公開、PaaSの先駆け","summary":"Googleがアプリケーション実行基盤「Google App Engine」のプレビュー版を公開しました。サーバー管理を意識せず、コードを置くだけで動く。のちにPaaSと呼ばれる形態の先駆けです。\n\n検索大手のクラウド参入でAWS一強に対抗軸が生まれ、企業競争レイヤーが動き出しました。ただ、独自の制約が強くて当初の普及は限定的。汎用性で勝るIaaS型のAWSが、先行を保ち続けます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google公式ブログ: Introducing Google App Engine (2008-04-07)","url":null}]},{"date":"2010-02-01","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"🪟 Windows Azure正式提供開始","summary":"Microsoftがクラウド基盤「Windows Azure」の商用提供を始めました。パッケージソフトの巨人が、自社の収益源を侵食しかねないクラウドへ本格参入した形です。\n\n当初は既存のサーバー製品事業との間で戦略が揺れて、AWSの後塵を拝し続けました。でも、この基盤が2014年以降のナデラ体制(企業競争レイヤー)で会社の中核になります。**追われる側の自己変革**が始まった地点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft: Windows Azure General Availability (2010-02)","url":null}]},{"date":"2010-07-19","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"🔧 OpenStack始動、オープンソースのクラウド基盤","summary":"RackspaceとNASAが、クラウド基盤ソフトウェアをオープンソースで開発する「OpenStack」プロジェクトを発表しました。誰でも自前のクラウドを構築できる選択肢が生まれたことになります。\n\n特定企業への依存(ロックイン)を嫌う通信会社や政府機関に採用され、パブリッククラウド一辺倒ではない「プライベートクラウド」の潮流を作りました。標準化をめぐる主導権争いは、企業競争レイヤーの隠れた戦線でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenStack Foundation: プロジェクト沿革","url":null}]},{"date":"2011-06-06","precision":"day","end_date":null,"type":"point","layer":"利用者と社会","title":"☁️ AppleがiCloud発表、消費者の日常にクラウド","summary":"AppleがWWDCで「iCloud」を発表しました。写真や連絡先が複数の端末で自動的に同期される体験を無料で提供し、一般の人が意識せずクラウドを使う時代を開きます。\n\nそれまで開発者と企業のものだったクラウドが、利用者と社会レイヤーへ直接届いた転換点です。「ファイルはどの端末にもある」という感覚が当たり前になり、データの置き場所は手元の機器からデータセンターへ、静かに移っていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple: iCloud発表 (WWDC 2011)","url":null}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"利用者と社会","title":"📖 NISTがクラウドコンピューティングを定義","summary":"米国立標準技術研究所(NIST)が、特別刊行物SP 800-145でクラウドコンピューティングを定義しました。オンデマンドや従量制など5つの特徴と、IaaS/PaaS/SaaSの3つのサービスモデルの整理です。\n\nバズワードだった「クラウド」に共通言語を与え、政府調達や企業の導入判断の基準になりました。定義の確立は米政府の「クラウド・ファースト」政策とも連動していて、制度が市場拡大を後押しする構図が生まれます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NIST SP 800-145: The NIST Definition of Cloud Computing","url":"https://csrc.nist.gov/pubs/sp/800/145/final"}]},{"date":"2013-01-01","precision":"year","end_date":null,"type":"point","layer":"企業競争","title":"🕶️ CIAがAWSと6億ドル規模のクラウド契約","summary":"米中央情報局(CIA)がAWSと推定6億ドルの専用クラウド構築契約を結んだと報じられました。IBMが調達手続きを不服として提訴しましたが、連邦請求裁判所はAWSの技術的優位を認めます。\n\n**最も機密を扱う組織がクラウドを選んだ**という事実は、「クラウドは安全ではない」という通念をひっくり返し、政府・大企業の採用を一気に正当化しました。企業競争レイヤーで見れば、AWSの技術先行が司法の場で裏書きされた事件でもあります。","detail":null,"credibility":"disputed","credibility_note":"契約額の6億ドルは報道ベースの推定です。契約の詳細は機密のため、公式には開示されていません。","sources":[{"title":"FCW / The Atlanticによる2013年のCIAクラウド契約(C2S)報道","url":null}]},{"date":"2013-03-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"🐳 Docker公開、コンテナ技術が主流へ","summary":"Solomon HykesがPyConでDockerを披露し、オープンソースとして公開しました。アプリを軽量な「コンテナ」に包んでどこでも動かす技術は、あっという間に開発者の標準になります!\n\nクラウド間の移植性を高めて、コンテナ前提の設計(クラウドネイティブ)を生んだ点で、特定ベンダーへの依存を相対化する技術でもありました。翌年のKubernetes登場と合わせて、クラウドの主戦場は仮想マシンからコンテナ基盤へ移っていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Docker (software)","url":"https://en.wikipedia.org/wiki/Docker_(software)"}]},{"date":"2014-02-04","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"👔 ナデラがMicrosoft CEOに、クラウド最優先へ","summary":"サティア・ナデラがMicrosoftの3代目CEOに就任し、「モバイルファースト、クラウドファースト」を掲げました。Windows中心の戦略を転換して、Azureとサブスクリプション型のOffice 365を成長の柱に据えます。\n\nLinux対応など過去路線との決別が進み、AzureはAWSを追う明確な2番手に浮上しました。クラウドが一部門の事業から**企業の存続を賭けた本業**へ格上げされた、企業競争レイヤーの分水嶺です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft: Satya Nadella named CEO (2014-02-04)","url":null}]},{"date":"2014-06-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"🚢 GoogleがKubernetesを公開","summary":"Googleが社内基盤Borgの知見をもとに、コンテナ管理システムKubernetesをオープンソースで公開しました。多数のコンテナを自動で配置・復旧する仕組みを、誰でも使えるようにしたのです。\n\nのちに中立団体CNCFへ移管され、AWS・Microsoft・Googleのすべてが対応する事実上の標準になりました。**激しく競争する市場の土台が共有のオープンソースになる**という、クラウド時代らしい構図を象徴する出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Kubernetes","url":"https://en.wikipedia.org/wiki/Kubernetes"}]},{"date":"2014-11-13","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"⚡ AWS Lambda発表、サーバーレスの登場","summary":"AWSが、イベントが起きたときだけコードを実行する「AWS Lambda」を発表しました。サーバーの存在自体を意識しない「サーバーレス」という、新しい抽象化の提示です。\n\n物理サーバーから仮想マシン、コンテナ、そして関数へ。借りる単位は細かくなり続けてきましたが、その到達点で、ミリ秒単位の従量課金は「所有から利用へ」の極致といえます。運用人員を持てない小さなチームの選択肢を広げ、利用者レイヤーの裾野をさらに広げました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"AWS: AWS Lambda発表 (re:Invent 2014)","url":null}]},{"date":"2015-04-23","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"💹 AmazonがAWSの業績を初開示、高収益に衝撃","summary":"Amazonが四半期決算でAWS部門の業績を初めて開示しました。売上高は四半期で15億ドル超、営業利益率は小売事業を大きく上回る。「副業」と見られていたクラウドが、実は同社の利益の柱だったと判明します!\n\n市場の評価は一変し、Amazon株は急伸しました。競合他社の投資判断にも影響を与え、クラウドが**利益率の高い本命事業**であることが公式の数字で裏付けられた瞬間です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon.com: Q1 2015 決算発表 (2015-04-23)","url":null}]},{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"利用者と社会","title":"🎞️ Netflixがクラウド完全移行を完了","summary":"Netflixが7年がかりの取り組みを経て、自社データセンターを閉じ、配信事業の基盤をAWSへ完全移行したと発表しました。世界190か国への同時展開を、クラウドの伸縮性が支えます。\n\n大規模サービスでも自前設備なしで運営できると示した代表例で、「クラウドは本番システムには不向き」という残っていた慎重論をほぼ終わらせました。障害を前提に設計する同社の手法(カオスエンジニアリング)も、業界標準に影響を与えています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Netflix Tech Blog: Completing the Netflix Cloud Migration (2016-02)","url":null}]},{"date":"2018-10-28","precision":"day","end_date":null,"type":"point","layer":"企業競争","title":"🎩 IBMがRed Hatを340億ドルで買収発表","summary":"IBMがオープンソース大手Red Hatを約340億ドルで買収すると発表しました。同社史上最大の買収で、複数のクラウドをまたいで運用する「ハイブリッドクラウド」に活路を求めた形です。\n\n上位3社に離された老舗が、単独の基盤競争ではなく**「どのクラウドも使う企業」の側に立つ**戦略へ転じました。買収額の大きさそのものが、クラウド市場の勝敗がIT業界の勢力図を塗り替えつつあったことを物語っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IBM Newsroom: IBM To Acquire Red Hat (2018-10-28)","url":null}]},{"date":"2019-10-25","precision":"day","end_date":"2021-07-06","type":"period","layer":"企業競争","title":"⚔️ 国防総省JEDI契約、係争の末に白紙へ","summary":"米国防総省の最大100億ドルのクラウド契約「JEDI」がMicrosoftに授与されました。本命視されていたAmazonは「政治的介入があった」と提訴。履行が止まったまま、2021年7月に国防総省は契約自体を取り消します。\n\n後継のJWCC契約は複数社への分割発注になり、巨大調達を単独ベンダーに委ねる方式は事実上終わりました。クラウドが国家の中枢インフラになり、その調達が政治問題になる時代を示した係争です。","detail":null,"credibility":"disputed","credibility_note":"Amazonが主張した、当時の大統領による選定への介入があったかどうかは、司法手続きで確定認定には至っていません。","sources":[{"title":"米国防総省: JEDI契約の取消し発表 (2021-07-06)","url":null}]},{"date":"2020-03-01","precision":"month","end_date":"2021-03-31","type":"period","layer":"利用者と社会","title":"🏠 コロナ禍で在宅勤務、クラウド需要が急増","summary":"新型コロナウイルスの感染拡大で在宅勤務やオンライン授業が一斉に始まり、ビデオ会議や仮想デスクトップなど、クラウド経由のサービス利用が急増しました。この期間のクラウド支出の伸びは前年比3割超、と調査会社は推定しています。\n\n「必要になったら数日で拡張できる」性質が社会機能の維持を支え、クラウドは**平時の効率化の道具から有事の社会インフラ**へと立ち位置を変えました。各国の行政デジタル化(利用者と社会レイヤー)も、この経験が押し出しています。","detail":null,"credibility":"unverified","credibility_note":"クラウド支出の伸び率はCanalysなど調査会社の推定で、算定方法によって数字に幅があります。","sources":[{"title":"Canalys: Global cloud services market(2020年各四半期レポート)","url":null}]},{"date":"2021-09-01","precision":"day","end_date":null,"type":"point","layer":"利用者と社会","title":"🗾 デジタル庁発足、ガバメントクラウド整備へ","summary":"日本でデジタル庁が発足し、国と自治体の情報システムを共通のクラウド基盤に載せる「ガバメントクラウド」の整備が始まりました。初年度の対象にはAWSとGoogle Cloudが選ばれています。\n\nコロナ禍で露呈した行政デジタル化の遅れへの、制度としての回答です。一方で選定が海外勢に偏ったことは国内産業界に議論を呼び、クラウドをめぐる経済安全保障という論点を日本でも顕在化させました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁: ガバメントクラウドの概要と対象クラウドサービスの選定 (2021)","url":null}]},{"date":"2021-12-07","precision":"day","end_date":null,"type":"point","layer":"利用者と社会","title":"🚨 AWS大規模障害、依存の深さが可視化","summary":"AWSの米東部リージョン(us-east-1)で大規模障害が発生し、物流システムから動画配信、スマート家電まで、広い範囲のサービスが数時間停止しました。\n\n15年かけて社会の土台になったクラウドの集中リスクを、多くの人が生活の不便として初めて体感した出来事です。分散設計の必要が改めて叫ばれましたが、少数の事業者に計算資源が集中する構造は変わっておらず、この年表の締めくくりにふさわしい問いを残しました。","detail":null,"credibility":"unverified","credibility_note":"影響を受けたサービス・企業の全容には公的な集計がなく、報道と各社の個別発表がもとになっています。","sources":[{"title":"AWS: Summary of the AWS Service Event in the Northern Virginia (US-EAST-1) Region (2021-12)","url":null}]}]},{"slug":"tech-cybersecurity","title":"🔐 サイバーセキュリティの進化","description":"Morrisワームからランサムウェアの産業化まで。攻撃と脅威・防御と技術・法と国家の3層を重ねて、個人の悪戯だった攻撃が国家戦と社会インフラの問題へ広がる過程を追いかけます。つながって動く機械が増えるほど、守る話は他人事ではなくなります。","category":"technology","language":"ja","start_year":1986,"end_year":2024,"layers":[{"name":"攻撃と脅威","color":"pink"},{"name":"防御と技術","color":"blue"},{"name":"法と国家","color":"teal"}],"events":[{"date":"1986-10-01","precision":"month","end_date":null,"type":"point","layer":"法と国家","title":"米国でコンピュータ詐欺濫用法(CFAA)成立","summary":"権限のないコンピュータへのアクセスを連邦犯罪と定めるコンピュータ詐欺濫用法が米国で成立しました。映画「ウォー・ゲーム」が象徴したハッカーへの社会不安を背景にした、サイバー犯罪を裁く初の本格的な法枠組みです。\n\n大きな実害が出る前に法が先行した、珍しい例だと思います。2年後のMorrisワーム(攻撃と脅威レイヤー)は、この法律による最初の重要判例を生みました。「不正アクセス」の定義の広さをめぐる論争は、今日まで続いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Computer Fraud and Abuse Act","url":"https://en.wikipedia.org/wiki/Computer_Fraud_and_Abuse_Act"}]},{"date":"1988-11-02","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"Morrisワーム、インターネットを初めて麻痺させる","summary":"コーネル大学の大学院生ロバート・モリスが放った自己増殖プログラムが、当時のインターネット接続機の約1割にあたる推定6000台を停止させました。悪意より実験目的だったとされますが、被害は全米に及びます。\n\n**ネットワークそのものが攻撃の媒介になる**ことを初めて示した事件です。対応組織CERT/CCの設立(防御と技術レイヤー)を直接生み、モリスはCFAAによる最初期の有罪判決を受けました。法と技術の追いかけ合いの始まりです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Morris worm","url":"https://en.wikipedia.org/wiki/Morris_worm"}]},{"date":"1991-06-01","precision":"month","end_date":null,"type":"point","layer":"防御と技術","title":"PGP公開、強い暗号が市民の手に","summary":"フィル・ジマーマンが、公開鍵暗号を誰でも使えるメール暗号化ソフトPGPを無償公開しました。軍事技術と扱われてきた強い暗号が、初めて一般市民の手に渡った瞬間です。\n\n米政府は暗号の輸出規制違反としてジマーマンを捜査し、「暗号戦争」と呼ばれる政府と技術者の対立(法と国家レイヤー)が始まりました。捜査は後に打ち切られますが、この対立の構図は2013年のスノーデン事件を経て、現在の暗号化論争まで続いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pretty Good Privacy","url":"https://en.wikipedia.org/wiki/Pretty_Good_Privacy"}]},{"date":"2000-05-04","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"ILOVEYOUワームが世界数千万台に感染","summary":"「ILOVEYOU」という件名のメールで広がるワームがフィリピンから放たれ、数時間で世界の数千万台に感染しました。被害総額は数十億ドルから100億ドル超と推計され、各国の政府機関や企業がメールシステムを止める事態になります。\n\n人の心理を突いて開封させる手口は、後のフィッシングの原型といえます。作成者は当時のフィリピンに処罰法がなく訴追されませんでした。各国にサイバー犯罪立法(法と国家レイヤー)を急がせた事件です。","detail":null,"credibility":"unverified","credibility_note":"感染台数・被害総額はいずれもセキュリティ企業等の推計で、集計方法により大きな幅があります。","sources":[{"title":"Wikipedia: ILOVEYOU","url":"https://en.wikipedia.org/wiki/ILOVEYOU"}]},{"date":"2007-04-27","precision":"day","end_date":"2007-05-18","type":"period","layer":"攻撃と脅威","title":"エストニアに大規模サイバー攻撃","summary":"ソ連兵士像の移設をめぐるロシアとの対立を背景に、エストニアの政府・銀行・報道機関のサイトが約3週間にわたり大規模なDDoS攻撃を受けました。電子政府先進国の行政サービスが、断続的に止まります。\n\n**国家全体が攻撃対象になった**初の事例と位置づけられ、翌年NATOはタリンにサイバー防衛協力センターを設立しました(法と国家レイヤー)。国家間攻撃の交戦規定を論じる「タリン・マニュアル」も、ここから生まれています。","detail":null,"credibility":"disputed","credibility_note":"ロシア政府の関与は状況証拠から広く疑われていますが、公式には立証されておらず帰属は確定していません。","sources":[{"title":"Wikipedia: 2007 cyberattacks on Estonia","url":"https://en.wikipedia.org/wiki/2007_cyberattacks_on_Estonia"}]},{"date":"2010-06-01","precision":"month","end_date":null,"type":"point","layer":"攻撃と脅威","title":"Stuxnet発見、物理設備を破壊したマルウェア","summary":"イランのウラン濃縮施設の遠心分離機を狙ったマルウェアStuxnetが発見されました。制御システムに潜り込み、正常値を装いながら遠心分離機を破壊する、前例のない精密さです。回る機械が狙われた攻撃として、個人的にも忘れられません。\n\n**コードが物理世界を破壊した**初の事例とされ、報道では米国とイスラエルの共同作戦と伝えられています。サイバー攻撃が外交・軍事の手段であることが公然の事実になり、各国の攻撃能力開発(法と国家レイヤー)が加速しました。","detail":null,"credibility":"disputed","credibility_note":"米国・イスラエルの関与は複数の報道と研究者の分析に基づくもので、両政府とも公式には認めていません。","sources":[{"title":"Wikipedia: Stuxnet","url":"https://en.wikipedia.org/wiki/Stuxnet"}]},{"date":"2013-06-01","precision":"month","end_date":null,"type":"point","layer":"法と国家","title":"スノーデンがNSAの大規模監視を告発","summary":"元NSA契約職員エドワード・スノーデンが、米政府による通信の大規模収集プログラムの内部文書を暴露しました。同盟国の首脳や一般市民の通信までが収集対象だったことが明らかになります。\n\n敵は犯罪者だけでなく**自国の政府でもあり得る**。この認識が広がり、通信の常時暗号化(防御と技術レイヤー)が業界標準へ一気に進みました。プライバシーと安全保障のバランスをめぐる議論の前提を変えた告発です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edward Snowden","url":"https://en.wikipedia.org/wiki/Edward_Snowden"}]},{"date":"2014-11-06","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"日本でサイバーセキュリティ基本法が成立","summary":"サイバーセキュリティ政策の基本理念と、国・重要インフラ事業者の責務を定める基本法が成立しました。内閣サイバーセキュリティセンター(NISC)が法定組織となり、司令塔機能が整います。\n\n立法を後押ししたのは、政府機関への標的型攻撃の増加と2020年東京五輪の招致決定です。翌年の日本年金機構の情報流出(攻撃と脅威レイヤー)は、この体制が最初に直面した大規模事案となり、法改正による監視対象の拡大につながりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"サイバーセキュリティ基本法(平成26年法律第104号)","url":null}]},{"date":"2015-06-01","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"日本年金機構から125万件の年金情報が流出","summary":"日本年金機構が標的型メール攻撃を受け、氏名・基礎年金番号など約125万件の個人情報が流出したと発表しました。職員が添付ファイルを開いたことを起点に、内部ネットワークへ侵入されています。\n\n日本の公的機関を狙った標的型攻撃の深刻さを、国民に知らしめた事案です。成立直後のサイバーセキュリティ基本法(法と国家レイヤー)の下で初の大規模検証が行われました。マイナンバー制度開始前夜という時期も、行政のセキュリティ議論を加速させます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本年金機構: 不正アクセスによる情報流出事案について (2015年6月)","url":null}]},{"date":"2015-12-03","precision":"day","end_date":null,"type":"point","layer":"防御と技術","title":"Let's Encryptが公開ベータ、常時HTTPS時代へ","summary":"無料でサーバー証明書を自動発行する認証局Let's Encryptが公開ベータを始めました。年間数万円の費用と煩雑な手続きが要った通信の暗号化を、誰でも無料で自動化できるようにした取り組みです。\n\nスノーデンの告発(法と国家レイヤー)後に高まった暗号化の要請に、費用の壁を壊すことで応えました。主要ブラウザの後押しもあり、ウェブの暗号化率は数年で過半から9割超へ。**平文の通信が例外になる**時代を作りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Let's Encrypt","url":"https://en.wikipedia.org/wiki/Let%27s_Encrypt"}]},{"date":"2017-05-12","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"WannaCryが世界150か国を襲う","summary":"ランサムウェアWannaCryが150か国の推定20万台以上に感染し、英国では国民保健サービス(NHS)の病院が診療停止に追い込まれました。感染に使われた脆弱性攻撃ツールは、NSAから流出したものです。\n\n国家の攻撃ツールが流出し、犯罪者と他国に使われる。攻撃能力の拡散(法と国家レイヤー)の危うさが現実になりました。米英政府は後に北朝鮮の犯行と公式に非難しています。身代金要求型の攻撃が、医療という人命に関わる領域へ達した事件でもありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: WannaCry ransomware attack","url":"https://en.wikipedia.org/wiki/WannaCry_ransomware_attack"}]},{"date":"2020-12-13","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"SolarWinds事件、供給網攻撃の衝撃","summary":"米SolarWinds社の運用管理ソフトの更新プログラムにバックドアが仕込まれ、同ソフトを導入する米政府機関や大手企業など約1万8000組織に配布されていたことが発覚しました。米政府はロシア対外情報庁(SVR)の関与を指摘しています。\n\n信頼して受け取る正規のアップデート自体が攻撃経路になる。サプライチェーン攻撃の代表例となり、ソフトウェア部品表(SBOM)の義務化など翌年の米大統領令(法と国家レイヤー)に直結しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2020 United States federal government data breach","url":"https://en.wikipedia.org/wiki/2020_United_States_federal_government_data_breach"}]},{"date":"2021-05-07","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"Colonial Pipelineがランサムウェアで停止","summary":"米東海岸の燃料供給の約45%を担うパイプラインがランサムウェア攻撃を受け、5日間の操業停止に追い込まれました。ガソリンの買いだめが起き、複数の州が非常事態を宣言。同社は身代金約440万ドルの支払いを認めています。\n\n**ランサムウェアが社会インフラを人質に取った**事件として、サイバー犯罪を国家安全保障問題へ格上げしました。犯行グループのRaaS(サービス化された攻撃)という分業構造も注目され、米政府の対応(法と国家レイヤー)が一変します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Colonial Pipeline ransomware attack","url":"https://en.wikipedia.org/wiki/Colonial_Pipeline_ransomware_attack"}]},{"date":"2021-05-12","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"米大統領令14028、ゼロトラストを国家方針に","summary":"バイデン大統領がサイバーセキュリティ強化の大統領令に署名しました。連邦政府機関へのゼロトラスト・アーキテクチャ導入、多要素認証の義務化、ソフトウェア部品表(SBOM)の整備などを求める包括的な内容です。\n\nColonial Pipeline停止のわずか5日後、SolarWinds事件(攻撃と脅威レイヤー)の半年後。この時期が示すとおり、相次ぐ実害への直接の応答でした。「境界の内側は信用する」という従来の防御思想の、公式な転換点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Executive Order 14028: Improving the Nation's Cybersecurity (2021-05-12)","url":null}]},{"date":"2022-02-24","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"ウクライナ侵攻、サイバー戦が実戦の一部に","summary":"ロシアのウクライナ全面侵攻の直前、ウクライナ軍も利用する衛星通信網Viasatがワイパー型マルウェアで妨害されました。EUと米英は後にロシアの犯行と公式に認定しています。\n\n物理侵攻とサイバー攻撃が統合されたハイブリッド戦が、現実になりました。一方でウクライナ側もIT義勇軍や民間クラウドへのデータ退避(防御と技術レイヤー)で対抗します。民間企業が戦争の当事者に近い役割を担う、前例のない構図が生まれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EU理事会: Viasatへのサイバー攻撃に関するロシア非難声明 (2022-05-10)","url":null}]},{"date":"2023-07-01","precision":"month","end_date":null,"type":"point","layer":"攻撃と脅威","title":"生成AIを悪用する攻撃ツールの出現が報告","summary":"フィッシングメール作成やマルウェア作成支援をうたう「WormGPT」「FraudGPT」などの生成AIツールが闇市場で売買されていると、セキュリティ研究者が相次いで報告しました。\n\n流暢な文面のフィッシングを誰でも量産できるようになり、「不自然な日本語で見分ける」という従来の注意喚起が通用しにくくなっています。防御側も検知への生成AI活用(防御と技術レイヤー)を進めていて、AIをめぐる攻防の入口にあたる出来事です。","detail":null,"credibility":"unverified","credibility_note":"これらのツールの実際の性能と流通規模はセキュリティ企業の報告に基づくもので、誇大宣伝の可能性も指摘されています。","sources":[{"title":"SlashNext: WormGPT – The Generative AI Tool Cybercriminals Are Using (2023-07)","url":null}]},{"date":"2024-02-20","precision":"day","end_date":null,"type":"point","layer":"法と国家","title":"国際共同捜査がLockBitの基盤を摘発","summary":"英国家犯罪対策庁と米FBIなど10か国の共同捜査「オペレーション・クロノス」が、世界最大級のランサムウェア組織LockBitの攻撃基盤を差し押さえ、リークサイトを押収したと発表しました。\n\n匿名性を盾にしてきた攻撃組織に、国境を越えた法執行の連合で応じる段階に入ったことを示します。ただし組織は数日で活動再開を宣言しました。基盤の摘発と犯人の逮捕の間にある壁も、同時に露呈しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"英国家犯罪対策庁(NCA): Operation Cronos発表 (2024-02-20)","url":null}]},{"date":"2024-06-08","precision":"day","end_date":null,"type":"point","layer":"攻撃と脅威","title":"KADOKAWAへのランサムウェア攻撃でニコニコ動画停止","summary":"KADOKAWAグループがランサムウェア攻撃を受け、ニコニコ動画をはじめとするサービスが長期間止まりました。出版・経理システムにも障害が及び、後に約25万人分の個人情報の流出が確認されています。\n\n日本のコンテンツ産業を代表する企業が数か月にわたり機能不全に陥り、ランサムウェア被害の深刻さを日本社会に印象づけました。復旧過程の情報開示のあり方や、身代金交渉をめぐる報道の是非など、事後対応の論点(法と国家レイヤー)も多く残しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"KADOKAWA: 不正アクセスに関するお知らせ・調査結果 (2024年)","url":null}]},{"date":"2024-07-19","precision":"day","end_date":null,"type":"point","layer":"防御と技術","title":"CrowdStrike更新不具合で世界的システム障害","summary":"セキュリティ企業CrowdStrikeの検知ソフトの更新プログラム不具合で、世界のWindows端末約850万台がブルースクリーンで起動不能になりました。空港・病院・銀行が止まり、航空便は数千便が欠航しています。\n\n攻撃ではなく**防御ソフトそのものが単一障害点**になった、皮肉な事件です。少数のベンダーへの依存が生む集中リスクを露呈しました。カーネルへの深いアクセスを持つ防御手法の是非という、防御と技術レイヤーの設計論争も引き起こしています。","detail":null,"credibility":"unverified","credibility_note":"影響台数850万台はMicrosoftの推計で、実際の影響範囲の全体像は確定していません。","sources":[{"title":"CrowdStrike: Falcon Content Update Remediation and Guidance Hub (2024-07)","url":null}]},{"date":"2024-08-13","precision":"day","end_date":null,"type":"point","layer":"防御と技術","title":"🔐 NISTがポスト量子暗号の最初の標準を発表","summary":"米国立標準技術研究所(NIST)が、量子コンピュータでも解読困難な暗号方式の最初の連邦標準3件(FIPS 203/204/205)を発表しました。約8年の国際公募と評価を経た成果です。\n\n将来の量子計算機に現在の暗号が破られる前に、いま流れている通信を守る移行が始まりました。「今のうちに暗号文を集めて後で解読する」攻撃(攻撃と脅威レイヤー)への備えでもあり、防御が攻撃の実現に先回りした初の事例といえます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NIST: Post-Quantum Cryptography Project","url":"https://csrc.nist.gov/projects/post-quantum-cryptography"}]}]},{"slug":"tech-edtech","title":"🎓 EdTechが変える教育","description":"無料公開講義の理想からコロナ禍の一斉オンライン化、AI家庭教師まで。サービス・制度・資本の3つのレイヤーを重ねて、テクノロジーは教育の何を変えて、何を変えられなかったのかを検証する年表です 🎓","category":"technology","language":"ja","start_year":2001,"end_year":2025,"layers":[{"name":"技術とサービス","color":"blue"},{"name":"制度と教育現場","color":"teal"},{"name":"産業と資本","color":"orange"}],"events":[{"date":"2001-04-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"🏛️ MITが講義教材の無料公開OCWを発表","summary":"マサチューセッツ工科大学が、ほぼすべての講義教材をウェブで無償公開するOpenCourseWare(OCW)構想を発表しました。「教育をオープンにする」という宣言は、世界の大学に衝撃を与えます!\n\n商用eラーニングの模索が続くなかで、最高峰の大学が知識の無償公開を選んだ意味は大きいです。のちのオープン教材(OER)運動とMOOCの思想的な源流で、日本でも2005年に主要大学によるJOCWが発足しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"MIT News: MIT to make nearly all course materials available free on the World Wide Web (2001-04)","url":null}]},{"date":"2008-01-01","precision":"year","end_date":null,"type":"point","layer":"技術とサービス","title":"✏️ カーンアカデミー設立、動画で学ぶ形を確立","summary":"サルマン・カーンが、親戚の子に算数を教えるために作ったYouTube動画を母体に、非営利のカーンアカデミーを設立しました。短い解説動画と練習問題を無料で提供するモデルを確立します。\n\n「授業を動画で予習して、教室では演習する」という反転授業の議論を世界に広め、財団の支援を受けて成長しました。営利スタートアップが主導する後年のEdTech産業に対して、非営利・無料という対極のモデルを示し続ける存在です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Khan Academy: About","url":"https://www.khanacademy.org/about"}]},{"date":"2012-01-01","precision":"year","end_date":null,"type":"point","layer":"技術とサービス","title":"🎓 「MOOC元年」、大学講義が数十万人に開かれる","summary":"スタンフォード発のCourseraとUdacity、MITとハーバードが設立したedXが相次いで開講し、大学講義を誰でも無料受講できるMOOCが爆発的な注目を集めました。米紙はこの年を「MOOCの年」と呼びます。\n\n数十万人規模の登録者は「大学の終わり」論まで呼びました!でも、のちの研究で修了率が数%にとどまると示され、期待は急速にしぼみます。**理想の規模と学びの完遂の落差**という、この年表を貫くテーマの最初の実例です。","detail":null,"credibility":"disputed","credibility_note":"登録者数は各社の自社発表です。修了率も研究によって数%から十数%と、推計に幅があります。","sources":[{"title":"The New York Times: The Year of the MOOC (2012-11)","url":null}]},{"date":"2019-12-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"🏫 日本がGIGAスクール構想を開始","summary":"文部科学省が、児童生徒1人1台の学習端末と高速ネットワークを全国の小中学校に整備するGIGAスクール構想を打ち出し、補正予算が計上されました。当初は2023年度までの整備計画です。\n\n直後のコロナ禍で計画は大幅に前倒しされ、OECD調査で最下位級とされた日本の学校ICT環境は数年で一変しました。危機が制度を動かした典型例ですが、端末が行き渡ったあとに「何にどう使うか」という課題が現場に残ります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: GIGAスクール構想の実現について","url":null}]},{"date":"2020-03-01","precision":"month","end_date":"2021-08-31","type":"period","layer":"制度と教育現場","title":"🌍 世界規模の学校閉鎖、オンライン学習へ一斉移行","summary":"新型コロナウイルスの感染拡大で世界の大半の国が休校措置をとり、ピーク時には世界の学習者の9割超・約16億人が影響を受けたとUNESCOは推計しています。授業は突如、オンラインに移りました。\n\nZoomやGoogle Classroomが事実上の公共インフラになり、EdTechの利用は数年分跳ね上がります。一方で、端末や通信環境の有無による**学習機会の格差**が世界中で可視化され、テクノロジーは格差を埋めるのか広げるのか、という問いを残しました。","detail":null,"credibility":"unverified","credibility_note":"影響を受けた学習者数はUNESCOの推計で、各国の報告基準によって数字は変わります。","sources":[{"title":"UNESCO: Education - From COVID-19 school closures to recovery","url":null}]},{"date":"2021-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と資本","title":"💰 世界のEdTech投資が過去最高の200億ドル規模に","summary":"コロナ禍の需要急増を受けて、2021年の世界のEdTechベンチャー投資は、調査会社の推計で200億ドル規模と過去最高に達しました。インドと中国の大型資金調達が全体を引っ張っています。\n\nオンライン学習が恒久的に定着すると見込んだ資金流入でしたが、翌年以降は対面回帰と金利上昇で投資額は急減。**需要の先食い**だったことが後から判明し、高い評価額で調達した企業ほど深い調整を迫られました。","detail":null,"credibility":"unverified","credibility_note":"投資額はHolonIQなど調査会社の推計で、集計範囲によって数字が異なります。","sources":[{"title":"HolonIQ: Global EdTech Venture Capital Report","url":null}]},{"date":"2021-07-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"🇨🇳 中国が「双減」政策で学習塾産業を事実上解体","summary":"中国政府が、義務教育段階の学科系学習塾に非営利化や新規認可停止などを課す「双減」政策を発表しました。急成長していたオンライン教育企業の株価は暴落し、世界最大の教育産業は事実上解体されます。\n\n史上最大級のEdTech市場が、政策ひとつで消えた出来事です。教育サービスが**国家の教育方針の従属変数**であることを、これ以上ないほど鮮烈に示しました。行き場を失った投資マネー(産業と資本レイヤー)は、以後インドや東南アジアへ向かいます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中共中央弁公庁・国務院弁公庁「双減」に関する意見 (2021-07)","url":null}]},{"date":"2022-03-01","precision":"month","end_date":null,"type":"point","layer":"産業と資本","title":"🦄 Byju'sが評価額220億ドル、世界最大のEdTechに","summary":"インドのByju'sが資金調達で評価額220億ドルと報じられ、世界で最も企業価値の高いEdTech企業になりました。広告攻勢と相次ぐ買収で、インドの国民的サービスと目されていた会社です。\n\nでも、コロナ特需の反動と決算監査の遅延で信用は急速に崩れ、2年後には債権者から破産手続を申し立てられるところまで行きます。EdTechバブルの頂点と崩壊をわずか数年で体現した、時代の象徴といえる企業です。","detail":null,"credibility":"disputed","credibility_note":"評価額220億ドルは資金調達時の報道ベースの数字で、その後の評価下落の幅にも諸説あります。","sources":[{"title":"Reuters・Bloomberg報道 (2022)","url":null}]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"💬 ChatGPT公開、宿題とレポートの前提を揺るがす","summary":"OpenAIの対話型AIが公開され、レポート作成や問題演習を数秒で代行できることが教育界を直撃しました。公開から数週間で学生の利用が広がり、剽窃検出ツールの各社は対応に追われます。\n\n「答えを出す機械」の登場は、宿題・試験・評価という学校の基本装置(制度と教育現場レイヤー)の前提を揺るがしました。禁止か活用かの論争が世界の教室で始まり、以後の「教育とAI」をめぐるすべての議論の起点になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: Introducing ChatGPT","url":"https://openai.com/index/chatgpt/"}]},{"date":"2023-01-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"🗽 NY市教育局がChatGPTを遮断、4か月で方針転換","summary":"全米最大の学区であるニューヨーク市教育局が、学校のネットワークと端末からChatGPTへのアクセスを遮断しました。理由は、学習への悪影響と不正利用への懸念です。\n\nところが同じ年の5月には方針を撤回し、AIリテラシー教育の推進へ転じます。**禁止から共存への転回**をわずか4か月で経験したこの学区の迷走は、そのあと世界中の教育行政がたどることになる道筋の縮図でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ニューヨーク市教育局発表・Chalkbeat報道 (2023-01, 2023-05)","url":null}]},{"date":"2023-03-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"🤖 カーンアカデミーがAI家庭教師Khanmigoを発表","summary":"カーンアカデミーが、GPT-4を組み込んだAI家庭教師「Khanmigo」を発表しました。答えを直接教えず、対話を通じて生徒自身の思考を促す、ソクラテス式の設計を掲げています。\n\nChatGPT遮断(制度と教育現場レイヤー)と同じ時期に、非営利の老舗が「正しく使う」形を示した対比が鮮やかです!1対1の個別指導は集団授業より大幅に効果が高いという「ブルームの2シグマ問題」への、AIによる挑戦と位置づけられました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Khan Academy発表 (2023-03)","url":null}]},{"date":"2023-05-02","precision":"day","end_date":null,"type":"point","layer":"産業と資本","title":"🪫 Chegg株が1日で約半値に、AIが収益を直撃","summary":"宿題支援サービス大手Cheggの株価が、1日で約48%下落しました。引き金は、ChatGPTの影響で新規契約の伸びが鈍っていると経営陣が決算発表で認めたことです。\n\n生成AIが既存EdTech企業の収益を直接壊しうることを、資本市場が織り込んだ最初の事例になりました。「AIに置き換えられる側」と「AIを組み込む側」の選別が始まり、教育関連株はAI戦略の説得力で評価される時代に入ります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2023-05-02)","url":null}]},{"date":"2023-07-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"📵 UNESCOが学校でのスマートフォン規制を提言","summary":"UNESCOが世界教育モニタリングレポートで、学習の妨げになる場合は学校でのスマートフォン使用を禁止すべきだと提言しました。テクノロジーの導入は人間中心の視点で判断すべき、という警鐘です。\n\nデジタル化を推進してきた国際機関自身による軌道修正で、各国で相次いだ学校スマホ禁止立法とも呼応しています。EdTechの学習効果に関する**独立した証拠の乏しさ**への指摘は、業界全体への根本的な問いになっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNESCO: Global Education Monitoring Report 2023 - Technology in education","url":null}]},{"date":"2024-04-01","precision":"month","end_date":null,"type":"point","layer":"制度と教育現場","title":"📚 日本の小中学校で英語のデジタル教科書を本格導入","summary":"2024年度から、全国の小学5年から中学3年の英語で、紙の教科書と併用する形のデジタル教科書の提供が始まりました。GIGAスクール構想で整備された1人1台端末が、その前提です。\n\n端末整備(2019年〜)から日常活用への移行を示す節目ですが、視力や学習定着への影響を心配する声も根強く、当面は紙との併用が続きます。制度が慎重に歩んでいる間にも、生徒の学びはAIアプリ(技術とサービスレイヤー)へ先に流れています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 学習者用デジタル教科書について","url":null}]},{"date":"2024-07-01","precision":"month","end_date":null,"type":"point","layer":"産業と資本","title":"🍂 Byju'sに破産手続き開始、バブルの象徴が転落","summary":"インドの会社法審判所が、スポンサー料未払いを申し立てたインドクリケット協会の訴えを認め、Byju'sの破産手続き開始を決定しました。評価額220億ドルとされた企業が、2年で法的整理の入口に立ったのです。\n\n過大な広告費、強引な販売手法、ガバナンスの不全が崩壊の内因とされ、コロナ特需を実力と誤認した業界全体への教訓になりました。資本の熱狂と教育の成果は別物であることを、最も高い代償で示した事例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2024-07)","url":null}]},{"date":"2025-07-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"🧭 ChatGPTに「学習モード」、答えを教えないAIへ","summary":"OpenAIがChatGPTに、答えを直接示さず対話を通じて理解へ導く「study mode」を追加しました。学生による丸写し利用への批判が続くなかでの、汎用AI側からの応答です。\n\nKhanmigoが先行した「ソクラテス式AI」の設計思想が汎用チャットAIにも標準搭載された形で、教育専用サービスと汎用AIの境界は一段とあいまいになりました。宿題の代行者から**学びの伴走者**へ。教育におけるAIの立ち位置の再定義が進んでいます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI発表 (2025-07)","url":null}]}]},{"slug":"tech-fintech","title":"💳 フィンテックの破壊力","description":"モバイル送金から暗号資産、スマホ時代の銀行取り付けまで。技術は金融の何を壊して、何を壊せなかったのか。サービス・既存金融・規制の3つのレイヤーで、破壊と吸収の20年を追いかける年表です 💸","category":"technology","language":"ja","start_year":2007,"end_year":2025,"layers":[{"name":"技術とサービス","color":"blue"},{"name":"既存金融と資本","color":"orange"},{"name":"規制と社会","color":"teal"}],"events":[{"date":"2007-03-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"📲 ケニアでM-Pesa開始、銀行なしの送金インフラに","summary":"ケニアの通信会社サファリコムが、携帯電話のショートメッセージを使った送金サービスM-Pesaを始めました。銀行口座を持たない人たちが、現金を電子的に送って受け取れるようになったのです!\n\n銀行網の外側から金融アクセスを一気に広げた代表例で、「金融包摂」というフィンテックの原点を示しています。のちの途上国モバイルマネーやQR決済の先行モデルになり、規制当局も「銀行免許なしで営まれる金融」への対応を迫られました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Safaricom/Vodafone発表・GSMA調査 (2007)","url":null}]},{"date":"2008-10-31","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"🪙 ビットコイン論文公開","summary":"サトシ・ナカモト名義の論文「Bitcoin: A Peer-to-Peer Electronic Cash System」が暗号技術のメーリングリストで公開されました。中央管理者なしに二重支払いを防ぐ、電子通貨の仕組みの提案です。\n\nリーマン・ブラザーズ破綻の翌月というタイミングがなんとも象徴的で、既存金融(既存金融と資本レイヤー)への不信がこの構想の受け皿になりました。翌年1月に最初のブロックが生成され、以後の暗号資産はすべてここから派生します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcoin: A Peer-to-Peer Electronic Cash System (原論文)","url":"https://bitcoin.org/bitcoin.pdf"}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"💳 Stripe公開、オンライン決済がAPI数行になる","summary":"米Stripeが開発者向けの決済APIを一般公開しました。加盟店契約や審査で数週間かかっていたカード決済の導入が、ウェブサイトに数行のコードを書くだけで済むようになります!\n\n**決済のインフラ化**はECやSaaSの起業コストをぐっと下げ、その後のプラットフォーム経済の裏方になりました。既存金融レイヤーから見ると、カード網の上に乗りながら顧客接点だけを奪っていく、新種の存在の登場です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Stripe公式発表 (2011-09)","url":null}]},{"date":"2014-01-01","precision":"year","end_date":"2018-12-31","type":"period","layer":"技術とサービス","title":"🧧 中国でQR決済が日常インフラ化","summary":"アリペイとWeChat Payの二強が、屋台の支払いから公共料金まで、QRコード決済を暮らしに浸透させました。この間に中国のモバイル決済取引額は、数十兆元規模へ拡大したと推計されています。\n\nカード社会を経ずに、現金からスマホへ一気に跳んだ「リープフロッグ」の代表例です。決済データが信用スコアや少額投資の入口になることを世界に示し、各国のスーパーアプリ構想と規制議論(規制と社会レイヤー)の参照点になりました。","detail":null,"credibility":"unverified","credibility_note":"取引額は中国人民銀行の統計や調査会社の推計がもとで、集計範囲によって数字が大きく変わります。","sources":[{"title":"中国人民銀行「支付体系運行総体情況」各年版","url":null}]},{"date":"2014-02-28","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"💥 マウントゴックス破綻、暗号資産規制の原点に","summary":"世界最大級のビットコイン交換所だった東京のマウントゴックスが、民事再生法の適用を申請しました。約85万BTCの消失が公表され、利用者資産の保全が世界的な問題として噴き出します。\n\nこの事件をきっかけに日本は交換業者の登録制を導入し、世界に先んじて暗号資産を法制度に取り込む道を選びました。**破綻が規制を生む**というフィンテック史の反復パターンの、最初の大きな実例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本経済新聞・Reuters報道 (2014-02-28)","url":null}]},{"date":"2015-10-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"🔑 EUが決済サービス指令PSD2を可決","summary":"欧州議会が改定決済サービス指令(PSD2)を可決しました。銀行に対して、顧客の同意を前提に、口座情報や決済機能を外部事業者へAPIで開放するよう義務づける内容です。\n\n銀行が独占してきた口座データを、競争の基盤として開放させる「オープンバンキング」の法的な出発点で、規制が破壊を後押しした珍しい例といえます。英国の同名制度や日本の銀行法改正など、各国制度の雛形になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Directive (EU) 2015/2366 (PSD2)","url":"https://eur-lex.europa.eu/eli/dir/2015/2366/oj"}]},{"date":"2018-12-04","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"🎁 PayPayの「100億円あげちゃうキャンペーン」","summary":"ソフトバンクとヤフーが立ち上げたPayPayが、決済額の20%を還元する大型キャンペーンを開始。わずか10日で還元原資の100億円を使い切りました!日本のQR決済の認知を一気に押し上げたとされています。\n\n現金志向の強い日本市場に、巨額の販促でユーザーの行動変容を買うプラットフォーム型の戦略が持ち込まれた出来事です。翌年の消費増税に伴うポイント還元事業(規制と社会レイヤー)とも重なり、キャッシュレス比率は以後上がり続けました。","detail":null,"credibility":"unverified","credibility_note":"キャンペーンの実施は事実ですが、利用者獲得数や認知への効果は同社発表と調査会社の推計がもとで、独立した検証はありません。","sources":[{"title":"PayPay報道発表 (2018-12)","url":null}]},{"date":"2019-06-18","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"🌐 FacebookがLibra構想を発表","summary":"Facebook(現Meta)が、複数の通貨建て資産で裏付けるグローバルデジタル通貨Libraの構想を発表しました。世界20億人超の利用者基盤に金融を載せる計画に、各国の規制当局と中央銀行が一斉に身構えます。\n\n構想は縮小と改名(Diem)を経て2022年に消滅しました。それでも**民間企業が通貨そのものに手を伸ばした**衝撃は大きく、各国のCBDC研究とステーブルコイン規制を加速させます。挫折が制度を動かした例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Libra白書 (2019-06)","url":null}]},{"date":"2021-01-28","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"🎮 ゲームストップ株騒動、Robinhoodが購入制限","summary":"掲示板Redditに集まった個人投資家が、空売りの多いゲームストップ株を買い上げて株価が急騰。手数料無料の株取引アプリRobinhoodが同株の新規購入を一時制限し、のちに米議会の公聴会にまで発展しました。\n\nスマホ証券が掲げた「投資の民主化」と、その足元の脆さが同時に露呈した事件です。購入制限の背景には清算機関への預託金という既存金融レイヤーの仕組みがあって、新興サービスも旧来インフラの上に立っている事実を示しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米下院金融サービス委員会公聴会記録 (2021-02)","url":null}]},{"date":"2021-04-14","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"🔔 Coinbaseがナスダック上場","summary":"米最大の暗号資産交換所Coinbaseがナスダックに直接上場し、時価総額は一時1,000億ドル近くに達しました。暗号資産企業として初めての大型上場です。\n\n既存金融の破壊を掲げた企業が、伝統的な資本市場の作法で資金調達をする。この構図は、**破壊と制度への吸収が同時に進む**というフィンテックの性格をよく表しています。この上場を頂点とする強気相場は、翌年の連鎖破綻で暗転することになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2021-04-14)","url":null}]},{"date":"2021-09-07","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"🌋 エルサルバドルがビットコインを法定通貨に","summary":"エルサルバドルが、世界で初めてビットコインを法定通貨とする法律を施行しました。国民向けウォレット「Chivo」を配布し、事業者には受け入れを義務づけます。\n\n国家が暗号資産を通貨制度へ組み込む最初の実験でした。ただ、その後の調査では国民の利用低迷が繰り返し報告され、IMFも見直しを勧告し続けます。2025年には受け入れ義務が撤廃され、実験は大きく後退しました。","detail":null,"credibility":"disputed","credibility_note":"法律の施行は事実ですが、国民の利用実態は学術調査・世論調査ベースの報告で、数字には幅があります。","sources":[{"title":"NBER Working Paper: Are Cryptocurrencies Currencies? Bitcoin as Legal Tender in El Salvador","url":null}]},{"date":"2022-05-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"📉 ステーブルコインTerraUSD崩壊","summary":"アルゴリズム型ステーブルコインTerraUSD(UST)が米ドルとの連動を失い、姉妹通貨LUNAとともに数日でほぼ無価値になりました。消えた時価総額は400億ドル規模と推計されています。\n\n「アルゴリズムで価値を保つ」という設計の破綻は、貸付業者やファンドの連鎖倒産を招き、半年後のFTX破綻への導火線になりました。各国のステーブルコイン規制(規制と社会レイヤー)が一気に具体化する、直接のきっかけです。","detail":null,"credibility":"disputed","credibility_note":"消失額の推計は、集計時点と対象範囲によって数百億ドル規模の幅があります。","sources":[{"title":"Reuters・Bloomberg報道 (2022-05)","url":null}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"🏚️ FTX破綻","summary":"世界2位級の暗号資産交換所FTXが、顧客資産の流用疑惑の表面化から10日足らずで連邦破産法11条を申請しました。創業者サム・バンクマン=フリードは、のちに詐欺罪で有罪となります。\n\n著名投資家や機関投資家まで巻き込んだ崩壊は、**規制の空白地帯に築かれた信用の脆さ**をさらけ出しました。皮肉なことに破綻処理は伝統的な裁判所と会計専門家の手に委ねられ、暗号資産業界への規制導入論を決定づけます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FTX連邦破産法11条申請・米司法省発表 (2022-11)","url":null}]},{"date":"2023-03-10","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"🏦 シリコンバレー銀行破綻、スマホ時代の取り付け","summary":"スタートアップ業界の主要銀行だったシリコンバレー銀行(SVB)が破綻しました。SNSでの不安拡散とモバイルバンキングで、預金流出は1日で420億ドル規模に達したとされ、史上最速級の取り付けと呼ばれます。\n\nフィンテックが磨いた「即時に動くカネ」が、預金は簡単には逃げないという既存銀行の前提を崩した事件です。破壊の技術は新興企業だけでなく**銀行制度そのものの弱点**にもなり得ると示し、預金保険と規制の再設計論を呼びました。","detail":null,"credibility":"disputed","credibility_note":"流出額・速度は当局発表と報道がもとですが、「史上最速の取り付け」という比較には定義上の異論もあります。","sources":[{"title":"FDIC・カリフォルニア州金融保護革新局発表 (2023-03-10)","url":null}]},{"date":"2023-06-01","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"🗾 日本で改正資金決済法施行、ステーブルコインを制度化","summary":"改正資金決済法が施行され、法定通貨建てステーブルコインが「電子決済手段」として定義されました。発行者を銀行・資金移動業者・信託会社に限定する、世界でも先行する包括的な制度です。\n\nマウントゴックス以来の「事件が先、制度が後」という順序から、**制度を先に整えて市場を待つ**姿勢への転換点といえます。2025年には国内初の円建てステーブルコインが登場し、送金・決済インフラとしての実験段階に入りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"金融庁: 資金決済法等の改正について (2023)","url":null}]},{"date":"2023-07-20","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"🏛️ 米FRBが即時決済網FedNowを稼働","summary":"米連邦準備制度が、24時間365日動く銀行間の即時送金インフラFedNowの運用を始めました。数日かかることもあった米国内送金が、ようやくリアルタイム化への一歩を踏み出します。\n\n英国の即時決済や日本の全銀システム24時間化など、各国の流れに続く動きで、フィンテックが生んだ「即時性」への需要に中央銀行側が応えた形です。**土台のインフラを更新して破壊者を吸収する**、既存側の対応の典型といえます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Federal Reserve発表 (2023-07-20)","url":null}]},{"date":"2024-01-10","precision":"day","end_date":null,"type":"point","layer":"既存金融と資本","title":"📊 米SECがビットコイン現物ETFを一括承認","summary":"米証券取引委員会(SEC)が11本のビットコイン現物ETFを一括承認し、翌日から取引が始まりました。10年にわたって申請却下が続いてきた歴史が、裁判所の判断を経てひっくり返った形です!\n\nブラックロックなど伝統的な資産運用の最大手が暗号資産への窓口となり、破壊者として出発した資産が既存金融の商品棚に収まりました。反体制の思想から生まれたビットコインの制度化として、この年表の一つの到達点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米SEC発表・声明 (2024-01-10)","url":null}]},{"date":"2025-07-18","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"📜 米国でステーブルコイン規制法(GENIUS法)成立","summary":"決済用ステーブルコインの発行者に、準備資産の全額保有と開示を義務づけるGENIUS法が米国で成立しました。連邦レベルでは初めての、包括的な暗号資産関連法です。\n\nLibra(2019年)への警戒から始まった議論が、6年かけて「排除ではなく制度化」に着地しました。ドル建てステーブルコインの普及を通じてドルの地位を守るという狙いも指摘されていて、規制そのものが競争戦略の色を帯びる段階に入っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米ホワイトハウス・連邦議会発表 (2025-07)","url":null}]}]},{"slug":"tech-mobile-revolution","title":"モバイル革命の全体像","description":"iモードのモバイルネットからiPhone登場、アプリ経済圏の拡大、そして巨大プラットフォームへの規制まで。端末技術・アプリとビジネス・社会と制度の3層で、スマートフォンが生活の基盤になるまでを追う。","category":"technology","language":"ja","start_year":1999,"end_year":2026,"layers":[{"name":"技術と端末","color":"blue"},{"name":"アプリとビジネス","color":"orange"},{"name":"社会と制度","color":"green"}],"events":[{"date":"1999-02-22","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"NTTドコモがiモードを開始","summary":"NTTドコモが携帯電話からメールとウェブサイトを利用できるiモードを開始。着メロや占い、モバイルバンキングなど公式コンテンツへの課金を通信料と合算徴収する月額課金の仕組みで、モバイルコンテンツ市場を築いた。\n\nこの仕組みは、後のApp Storeが整えた**「小額課金の経済圏」を先取りした**ものと評される。一方で日本市場が独自進化を遂げたことは、2008年のiPhone上陸(技術と端末レイヤー)後に「ガラパゴス」と呼ばれる転換の背景ともなった。","detail":null,"credibility":"disputed","credibility_note":"「世界初のモバイルインターネットサービス」とする表現は、同時期のWAP等との比較で定義が分かれる。","sources":[{"title":"Wikipedia: i-mode","url":"https://en.wikipedia.org/wiki/I-mode"}]},{"date":"2001-10-01","precision":"day","end_date":"2026-03-31","type":"period","layer":"技術と端末","title":"3G(FOMA)サービスの時代","summary":"NTTドコモが世界初の商用W-CDMAサービスFOMAを開始。テレビ電話や高速パケット通信を掲げて始まった3Gは、当初は端末の電池持ちなどで普及が遅れたが、2000年代半ばに主流となり、2026年3月末の終了まで四半世紀にわたり通信の土台を担った。\n\n2008年のiPhone 3G(技術と端末)、2010年代のLINEやスマホ決済(アプリとビジネス)はいずれも3G以降の通信基盤の上に成立している。停波はスマホ移行の完了を告げる区切りでもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTTドコモ 報道発表: FOMAおよびiモードのサービス終了について(2019年10月29日)","url":null}]},{"date":"2007-01-09","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"AppleがiPhoneを発表","summary":"スティーブ・ジョブズがMacworldでiPhoneを発表。物理キーを廃したマルチタッチの全面タッチスクリーンとデスクトップ級のフルブラウザを備え、同年6月29日に米国で発売された。\n\nこれはiモードに代表される**「携帯向けに縮小されたウェブ」との決別**を意味した。当初はサードパーティのアプリを認めず、翌年のApp Store(アプリとビジネス)開設で経済圏が生まれる。発表当時、世界の携帯端末市場ではNokiaが首位にあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: Apple Reinvents the Phone with iPhone (2007-01-09)","url":"https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/"}]},{"date":"2007-11-05","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"GoogleらがAndroidとOpen Handset Allianceを発表","summary":"Googleと端末・通信34社がオープンソースのモバイルOS「Android」とOpen Handset Allianceを発表。iPhone発表から10か月後に、対抗する開放型の陣営が形成された。\n\nOSを無償で端末メーカーに提供する戦略は、Samsungや中国メーカーの台頭を促し、世界のスマホ出荷台数の大半をAndroidが占める構図をつくった。同時に、検索やアプリストアを通じたGoogleの支配力が、後年のEUデジタル市場法(社会と制度レイヤー)の主要な争点となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Open Handset Alliance: Industry Leaders Announce Open Platform for Mobile Devices (2007-11-05)","url":"https://www.openhandsetalliance.com/press_110507.html"}]},{"date":"2008-07-10","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"App Store開設、アプリ経済圏の始まり","summary":"AppleがiPhone向けApp Storeを開設。約500本のアプリで始まり、開発者への70%配分モデルがアプリ産業の標準となった。iモードの公式サイト課金と異なり、審査を通れば世界中の開発者が同じ条件で配信できる仕組みが、個人開発者から大手までを引き込んだ。\n\n翌日にはiPhone 3Gが日本を含む22か国で発売され(技術と端末)、端末とストアが同時に世界展開された。この**30%手数料は十数年後にEpic訴訟やDMA(社会と制度)で問われる**ことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: iPhone 3G on Sale Tomorrow (2008-07-10)","url":"https://www.apple.com/newsroom/2008/07/10iPhone-3G-on-Sale-Tomorrow/"}]},{"date":"2008-07-11","precision":"day","end_date":"2011-10-14","type":"period","layer":"アプリとビジネス","title":"iPhone 3G日本発売とソフトバンク単独販売期","summary":"iPhone 3Gが日本で発売され、ソフトバンクモバイルが単独で取り扱った。発売日には表参道の店舗に長い行列ができ、2011年10月のau参入まで続いた単独販売期間はソフトバンクの契約者数を押し上げ、通信キャリアの勢力図を変えた。\n\n日本の携帯市場が端末メーカー主導からプラットフォーム主導へ転換する起点であり、iモード全盛の国内でスマホの世帯保有率が1割に満たなかった2010年(社会と制度)を挟む期間である。","detail":null,"credibility":"unverified","credibility_note":"Appleとソフトバンク間の契約内容は非公開で、「独占契約」の存在は当時の報道と販売実態からの推定にとどまる。","sources":[{"title":"ソフトバンクモバイル 報道発表: iPhone 3Gの発売について(2008年)","url":null}]},{"date":"2008-10-22","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"初のAndroid端末「T-Mobile G1」発売","summary":"HTC製の初のAndroid搭載スマートフォン「T-Mobile G1」が米国で発売。物理キーボード付きで、Android Marketも同時に始まった。iPhone 3G発売の3か月後にあたる。\n\n初代Androidは完成度で劣るとの評価も多かったが、複数メーカーへの展開が急速に進み、2010年代初頭には出荷台数でiOSを上回った。日本ではドコモが2009年にHT-03Aとして初のAndroid端末を投入し、iPhoneを持たなかった同社の対抗軸となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: HTC Dream","url":"https://en.wikipedia.org/wiki/HTC_Dream"}]},{"date":"2010-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と制度","title":"日本のスマートフォン世帯保有率は約1割","summary":"総務省の通信利用動向調査で、2010年末時点のスマートフォン世帯保有率は9.7%。携帯電話全体の保有率は9割を超えており、iPhone上陸から2年を経てもなお大半の利用者はフィーチャーフォンを使っていた。\n\nこの年、Instagramが公開され(アプリとビジネス)、ドコモはLTEサービス「Xi」を12月に開始している(技術と端末)。普及の「前夜」にあたり、以後10年で保有率が8割超へ達する急上昇の起点として参照される数値である。","detail":null,"credibility":"unverified","credibility_note":"9.7%は平成22年通信利用動向調査の値として広く引用されるが、調査年版により集計対象や設問が異なるため原資料での確認を推奨する。","sources":[{"title":"総務省: 通信利用動向調査","url":"https://www.soumu.go.jp/johotsusintokei/statistics/statistics05.html"}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"Instagram公開","summary":"写真共有アプリInstagramがiPhone向けに公開。スマホのカメラとSNSを直結させ、モバイル発のサービスが主流になる先駆けとなった。\n\nPC版を持たずモバイル専用で始まった点が象徴的で、スマートフォンが「PCの補助」から「主戦場」へ変わったことを示す。2012年にFacebookが約10億ドルで買収し、アプリ企業の評価額が急騰する時代を印象づけた。同年の日本ではスマホ保有率が1割程度(社会と制度)であり、普及の速度差が読み取れる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"東日本大震災、安否確認にSNSとモバイルが機能","summary":"東日本大震災では通信規制により音声通話がつながりにくい中、パケット通信は比較的つながりやすく、TwitterなどのSNSによる安否確認や情報共有が広く使われてテレビと並ぶ情報源となり、モバイルの社会的役割が認識された。\n\nこの経験は同年6月のLINE誕生(アプリとビジネス)の直接の動機とされ、災害時の連絡手段としてスマホへの移行を後押しした。3Gネットワーク(技術と端末)の混雑と復旧は通信各社の課題として残った。","detail":null,"credibility":"disputed","credibility_note":"SNSが果たした役割の評価は研究により幅があり、デマ拡散の弊害を重く見る見解もある。","sources":[{"title":"総務省: 平成23年版 情報通信白書 東日本大震災における情報通信の状況","url":null}]},{"date":"2011-06-23","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"LINEサービス開始","summary":"NHN Japanがメッセージアプリ「LINE」を公開。震災時の連絡手段の課題(社会と制度)を受けて短期間で開発されたとされ、無料通話とスタンプで急成長し、日本のスマホ利用の中心的なアプリとなった。\n\n電話番号ベースの登録により乗り換えの負担が小さく、**フィーチャーフォン利用者をスマホへ移行させる強い動機**となった。スタンプ販売や公式アカウントによる収益化はiモード時代の課金文化と接続し、日本独自のアプリ経済圏を形づくった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Line (software)","url":"https://en.wikipedia.org/wiki/Line_(software)"}]},{"date":"2013-09-03","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"MicrosoftがNokiaの携帯端末事業を買収すると発表","summary":"かつて世界首位だったNokiaの携帯端末事業を、Microsoftが約72億ドルで取得すると発表。スマホ移行に乗り遅れた旧勢力の退場を象徴した。\n\niPhone発表時に首位だったNokiaは独自OSからWindows Phoneへ転換したが、iOSとAndroidの二強(技術と端末)とアプリの品揃え(アプリとビジネス)の差を埋められなかった。プラットフォームとアプリ経済圏を握った側が勝つという構図が確定した出来事で、同月には日本でドコモがiPhoneの取り扱いを開始している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Microsoft Mobile","url":"https://en.wikipedia.org/wiki/Microsoft_Mobile"}]},{"date":"2013-09-20","precision":"day","end_date":null,"type":"point","layer":"技術と端末","title":"NTTドコモがiPhone販売を開始","summary":"国内最大手のNTTドコモがiPhone 5s/5cを発売し、国内3キャリアすべてがiPhoneを扱う体制となって日本市場でのiPhone優位が固まった。同日発売のiPhone 5sは指紋認証Touch IDを搭載し、翌年のApple Payにつながる。\n\niモードで独自エコシステムを築いたドコモがiPhoneを受け入れたことは、**キャリア主導からプラットフォーム主導への転換の完了**を意味した。iモード終了(2026年)は既定路線となり、日本のスマホ世帯保有率はこの後も急上昇を続ける(社会と制度)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NTTドコモ 報道発表: iPhone 5s/iPhone 5cの発売について(2013年9月)","url":null}]},{"date":"2016-07-22","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"ポケモンGO日本配信、位置情報ゲームが社会現象に","summary":"米国などでの配信から2週間後、日本でもポケモンGOの配信が開始。公園や観光地に人が集まり、スマホが街の使い方を変える様子が可視化された。GPSとカメラを使ったAR体験は、スマホの標準機能(技術と端末)が数億人規模の行動を同時に動かせることを示した。\n\n歩きスマホや私有地への立ち入りが問題となり、自治体や施設が利用ルールを設けるなど、社会の側がスマホ利用に対応を迫られた早い例でもある。任天堂株の急騰(アプリとビジネス)も話題となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pokémon Go","url":"https://en.wikipedia.org/wiki/Pok%C3%A9mon_Go"}]},{"date":"2018-12-04","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"PayPay「100億円あげちゃうキャンペーン」開始","summary":"スマホ決済PayPayが購入額の20%を還元する「100億円あげちゃうキャンペーン」を開始。10日で予算を使い切り、QRコード決済の認知を一気に広げた。中国のAlipayやWeChat Payに倣った決済方式を、巨額の還元で普及させる手法だった。\n\n翌年の消費増税に伴う政府のポイント還元事業(社会と制度)が追い風となり、現金志向の強かった日本でスマホ決済が日常化する転機となった。スマホがサイフになることで、端末(技術と端末)は生活インフラとしての性格を強めた。","detail":null,"credibility":"unverified","credibility_note":"還元総額や終了時点の利用者数はPayPay社の発表に基づき、第三者による検証はない。","sources":[{"title":"PayPay株式会社 プレスリリース: 100億円あげちゃうキャンペーン(2018年)","url":null}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と制度","title":"スマホの世帯保有率が固定電話を上回る","summary":"総務省の通信利用動向調査で、2019年のスマートフォン世帯保有率は83.4%となり、固定電話(69.0%)を初めて上回った。2010年の約1割から10年足らずで8割超に達し、スマホが「電話」の主役の座を固定電話から奪ったことを示す象徴的な数値である。\n\n同時期にPayPayなど決済アプリ(アプリとビジネス)が普及し、翌年のコロナ禍ではCOCOAや給付金申請など行政サービスもスマホ前提で設計されるようになる。5Gの国内商用開始(2020年、技術と端末)も目前だった。","detail":null,"credibility":"disputed","credibility_note":"83.4%と69.0%は令和元年調査の公表値だが、調査年により集計方法が見直されており、経年比較の解釈には注意が必要。","sources":[{"title":"総務省: 令和元年通信利用動向調査の結果","url":"https://www.soumu.go.jp/johotsusintokei/statistics/statistics05.html"}]},{"date":"2020-06-19","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"接触確認アプリCOCOAの提供開始","summary":"厚生労働省が新型コロナ接触確認アプリCOCOAを公開。AppleとGoogleが共同提供したAPIの上に築かれ、公衆衛生施策がスマホ前提となった。国の施策がプラットフォーム企業の提供する仕組み(技術と端末)に依存する構図が明確になった出来事である。\n\nAndroid版の不具合が長期間見過ごされるなど運用面の課題も残した。同時期にリモートワークやオンライン診療が広がり、スマホとアプリ(アプリとビジネス)が生活と行政の接点として不可欠になった年である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 新型コロナウイルス接触確認アプリ(COCOA)","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/cocoa_00138.html"}]},{"date":"2020-08-13","precision":"day","end_date":null,"type":"point","layer":"アプリとビジネス","title":"Epic GamesがAppleを提訴、App Store手数料をめぐる争い","summary":"フォートナイトに独自決済を導入したEpic GamesがApp Storeから排除され、同日Appleを反トラスト法違反で提訴。2008年のApp Store開設以来の手数料30%と外部決済禁止に対する正面からの挑戦であり、その妥当性が法廷で争われた。\n\n2021年の一審は大半でApple勝訴としつつ外部リンク禁止を違法と判断し、以後の是正命令へつながった。EUのDMAや日本のスマホ新法(社会と制度)と並び、アプリ経済圏の「門番」に対する規制の潮流をつくった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Epic Games v. Apple","url":"https://en.wikipedia.org/wiki/Epic_Games_v._Apple"}]},{"date":"2024-03-07","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"EUデジタル市場法(DMA)の義務が適用開始","summary":"EUデジタル市場法(DMA)に基づく指定ゲートキーパー企業への義務が発効。AppleはEU域内でサードパーティのアプリストアや外部決済を認める対応を迫られ、iPhoneのアプリ配布がApp Store一本に限られてきた16年間の前提が、初めて法律によって変更された。\n\n対象にはGoogle、Meta、Amazonなども含まれ、Android(技術と端末)の検索やストアの既定設定も是正対象となった。Epic訴訟(アプリとビジネス)が問うた論点を、EUは事前規制として立法で解決する道を選んだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Commission: The Digital Markets Act","url":"https://digital-markets-act.ec.europa.eu/"}]},{"date":"2024-06-12","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"日本でスマホソフトウェア競争促進法が成立","summary":"スマホOS・アプリストア・ブラウザ・検索エンジンの提供事業者に、他社ストアの受け入れなどを義務づけるスマホソフトウェア競争促進法が成立。2025年12月に全面施行され、EUのDMAに続き日本もアプリ経済圏(アプリとビジネス)の門番に対する事前規制へ踏み出した。\n\n1999年のiモード以来、**キャリアからプラットフォーム企業へ移った市場支配力に、制度が追いつく**形となる。25年前にiモードで始まった日本のモバイル史が、規制対象としてのスマホという段階に到達したことを示す出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"公正取引委員会: スマートフォンにおいて利用される特定ソフトウェアに係る競争の促進に関する法律","url":null}]}]},{"slug":"tech-quantum-computing","title":"量子コンピュータへの道","description":"1981年のファインマンの着想から誤り訂正の実証まで。理論・ハードウェア・産業・国家戦略の4層を重ね、40年越しの技術がなぜいま実用へ近づいているのかを俯瞰する年表。","category":"technology","language":"ja","start_year":1981,"end_year":2025,"layers":[{"name":"理論とアルゴリズム","color":"purple"},{"name":"ハードウェア実装","color":"blue"},{"name":"産業と投資","color":"orange"},{"name":"国家戦略","color":"teal"}],"events":[{"date":"1981-05-01","precision":"month","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"ファインマンが量子シミュレータを提唱","summary":"MITで開かれた計算物理の会議で、物理学者リチャード・ファインマンが「自然は量子力学的であり、その完全なシミュレーションには量子力学で動く計算機が必要だ」と講演した。\n\n**量子で量子を計算する**という着想がこのとき研究課題として定式化され、量子計算の出発点として広く引用される。以後10年以上、関心は少数の理論家にとどまり、産業や国家戦略の視点はまだ存在しなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"R. P. Feynman, \"Simulating Physics with Computers\", Int. J. Theor. Phys. 21 (1982)","url":null}]},{"date":"1985-01-01","precision":"year","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"ドイチュが万能量子計算機を定式化","summary":"オックスフォード大学のデイヴィッド・ドイチュが、任意の物理系を模倣できる「万能量子チューリング機械」の概念を論文で提示し、量子計算を計算理論の正式な対象に据えた。\n\nファインマンの着想が「原理的に何を計算できるか」という数学の言葉に翻訳された段階であり、後のショアやグローヴァーのアルゴリズムはこの枠組みの上で設計される。実装(ハードウェア実装レイヤー)への道筋はまだ全く見えていなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"D. Deutsch, Proc. R. Soc. Lond. A 400, 97–117 (1985)","url":null}]},{"date":"1994-01-01","precision":"year","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"ショアが素因数分解の量子アルゴリズムを発表","summary":"AT&Tベル研究所のピーター・ショアが、量子計算機なら大きな数の素因数分解を効率的に解けることを示した。素因数分解の困難さはRSAなど公開鍵暗号の安全性の根拠そのものである。\n\n**理論が暗号という現実の利害に直結した**瞬間であり、各国の政府と軍が量子計算に注目する出発点となった。約30年後のポスト量子暗号標準(国家戦略レイヤー)まで続く、長い備えの起点でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer (quant-ph/9508027)","url":"https://arxiv.org/abs/quant-ph/9508027"}]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"グローヴァーの探索アルゴリズム発表","summary":"ベル研究所のロヴ・グローヴァーが、N件のデータからの探索を古典計算の平方根程度の手数で行える量子アルゴリズムを発表した。ショアの指数的な加速に続く、応用範囲の広い二次加速の代表例である。\n\n素因数分解に加えて探索という汎用的な応用が示されたことで、量子アルゴリズム研究は一つの分野として定着した。一方、これらを動かす量子ビット(ハードウェア実装レイヤー)は、この時点ではまだ実験室にも存在しなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: A fast quantum mechanical algorithm for database search (quant-ph/9605043)","url":"https://arxiv.org/abs/quant-ph/9605043"}]},{"date":"1999-04-01","precision":"month","end_date":null,"type":"point","layer":"ハードウェア実装","title":"NECで超伝導量子ビットが初めて動作","summary":"NEC基礎研究所の中村泰信と蔡兆申らが、超伝導回路上の電荷状態を使って量子重ね合わせの制御に成功し、Nature誌に発表した。\n\n**固体の電子回路で量子ビットを作れる**ことを示した成果で、原子や光子が中心だった実装研究の流れを変えた。超伝導方式は後にGoogleやIBM(産業と投資レイヤー)が採用する主流方式へ育ち、日本発の貢献として特筆される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nakamura, Pashkin & Tsai, Nature 398, 786–788 (1999)","url":null}]},{"date":"2011-05-01","precision":"month","end_date":null,"type":"point","layer":"産業と投資","title":"D-Waveが「世界初の商用量子コンピュータ」発売","summary":"カナダのD-Wave Systemsが量子アニーリング方式の「D-Wave One」を発表し、ロッキード・マーティンが購入した。量子計算をうたう装置が初めて商品として売買された出来事である。\n\nただし同機は最適化問題に特化した方式で、量子効果が計算速度に寄与しているかをめぐり長い学術論争が起きた。論争自体が量子計算への産業的関心を広げた面もあり、市場形成の始まりと位置づけられる。","detail":null,"credibility":"disputed","credibility_note":"量子効果による高速化が実際にあったかは学術的に決着しておらず、性能評価が研究者間で分かれる。","sources":[{"title":"Wikipedia: D-Wave Systems","url":"https://en.wikipedia.org/wiki/D-Wave_Systems"}]},{"date":"2016-05-04","precision":"day","end_date":null,"type":"point","layer":"産業と投資","title":"IBMが量子計算機をクラウドで一般公開","summary":"IBMが5量子ビットの実機をクラウド経由で誰でも使える「IBM Quantum Experience」を公開した。研究室の外の開発者や学生が、実際の量子ハードウェアに触れられるようになった。\n\n量子計算機が論文の中の存在から「試せるサービス」へ変わり、開発ツールと人材をめぐるエコシステム競争が始まった。以後、各社によるロードマップ公表と量子ビット数の競争(ハードウェア実装レイヤー)が産業の定番となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IBMニュースリリース: IBM Makes Quantum Computing Available on IBM Cloud (2016-05-04)","url":null}]},{"date":"2016-12-01","precision":"month","end_date":"2024-08-13","type":"period","layer":"国家戦略","title":"NISTがポスト量子暗号の標準化を推進","summary":"米国立標準技術研究所(NIST)が、量子計算機でも破れない暗号方式の公募を開始。世界から提案された方式の評価を約8年かけて進め、2024年8月に最初の標準3件を発表した。\n\n**まだ存在しない計算機に備えて世界の暗号を入れ替える**という異例の事業であり、根拠は1994年のショアのアルゴリズム(理論とアルゴリズムレイヤー)にある。理論から30年がかりで制度が動いた例といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NIST: Post-Quantum Cryptography Project","url":"https://csrc.nist.gov/projects/post-quantum-cryptography"}]},{"date":"2018-12-21","precision":"day","end_date":null,"type":"point","layer":"国家戦略","title":"米国で国家量子イニシアチブ法が成立","summary":"量子情報科学への連邦投資を定める国家量子イニシアチブ法が米国で成立し、5年間で約12億ドルの研究資金と省庁横断の調整体制が整備された。\n\n背景には量子技術を安全保障と経済競争力の問題とみなす認識があり、EUのQuantum Flagshipや中国の大型投資と同時期の動きである。企業の研究開発(産業と投資レイヤー)に対し、国家が資金と方向を与える構図がここで定まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"H.R.6227 National Quantum Initiative Act (Public Law 115-368)","url":null}]},{"date":"2019-10-23","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"Googleが「量子超越性」の達成を発表","summary":"Googleが53量子ビットの超伝導チップSycamoreで特定の乱数サンプリング課題を約200秒で実行し、最速スパコンなら1万年かかるとする論文をNatureに発表した。\n\nIBMは古典計算でも数日で可能と反論し、**「量子超越性」という言葉の意味そのもの**が論争になった。実用性のない課題ではあったが、各国の投資判断(国家戦略レイヤー)や報道に強く影響し、量子への注目を一段引き上げた。","detail":null,"credibility":"disputed","credibility_note":"「スパコンで1万年」という見積もりにはIBMが反論しており、古典計算に対する優位の程度は評価が分かれる。","sources":[{"title":"Nature: Quantum supremacy using a programmable superconducting processor (2019)","url":"https://www.nature.com/articles/s41586-019-1666-5"}]},{"date":"2020-12-03","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"中国の光量子計算機「九章」が優位性を主張","summary":"中国科学技術大学の潘建偉らが、光子を用いる専用機「九章」でガウシアン・ボソンサンプリングを実行し、古典計算機を大幅に上回るとする論文をScienceに発表した。\n\n超伝導方式のGoogleに続く別方式・別国からの優位性主張であり、量子計算が米中の技術競争(国家戦略レイヤー)の文脈で語られる流れを決定づけた。なお後年の古典アルゴリズムの改良により、優位の幅は当初の主張より縮まっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Science: Quantum computational advantage using photons (2020)","url":null}]},{"date":"2021-07-01","precision":"month","end_date":null,"type":"point","layer":"産業と投資","title":"PsiQuantumが4.5億ドル調達、評価額31億ドルと報道","summary":"光量子方式で誤り訂正済みの大規模機を目指す米PsiQuantumが4億5000万ドルの資金調達を発表し、報道では企業評価額が31億ドル超とされた。\n\n実機を公開していない段階での巨額調達であり、量子スタートアップ投資が期待先行で過熱する局面を象徴する。誤り訂正に必要な規模を見積もる理論(理論とアルゴリズムレイヤー)の時間軸と、資本の時間軸のずれが試され始めた。","detail":null,"credibility":"unverified","credibility_note":"評価額31億ドル超は報道ベースの数値で、当事者による公式開示はない。","sources":[{"title":"Reuters: PsiQuantum raises $450 mln (2021-07)","url":null}]},{"date":"2021-10-01","precision":"day","end_date":null,"type":"point","layer":"産業と投資","title":"IonQが上場、量子専業で初の上場企業に","summary":"イオントラップ方式のIonQがSPAC合併を経てニューヨーク証券取引所に上場し、量子計算専業として初の上場企業となった。\n\n収益がほぼない段階での上場は、量子産業が公開市場の資金で長期開発を続けるモデルへ移ったことを示す。以後RigettiやD-Waveも株式市場に続き、株価は各社の技術発表(ハードウェア実装レイヤー)のたびに大きく変動する投機的な値動きを見せるようになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: IonQ","url":"https://en.wikipedia.org/wiki/IonQ"}]},{"date":"2022-10-04","precision":"day","end_date":null,"type":"point","layer":"理論とアルゴリズム","title":"量子もつれの実証にノーベル物理学賞","summary":"量子もつれの実在を実験で示したアスペ、クラウザー、ツァイリンガーの3氏にノーベル物理学賞が贈られた。ベルの不等式の破れの検証という、量子情報科学の土台にあたる業績である。\n\n授賞理由に「量子情報科学の開拓」が明記され、かつて哲学論争に近かった基礎研究が、量子計算・量子通信という応用分野の礎として公式に位置づけられた。基礎から産業(産業と投資レイヤー)までの距離の縮まりを示す授賞といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Physics 2022 - Press release","url":"https://www.nobelprize.org/prizes/physics/2022/press-release/"}]},{"date":"2023-03-27","precision":"day","end_date":null,"type":"point","layer":"国家戦略","title":"国産量子コンピュータ初号機が稼働","summary":"理化学研究所が64量子ビットの超伝導量子コンピュータ国産初号機を稼働させ、クラウド経由での外部利用を開始した。1999年に超伝導量子ビットを生んだ国としての蓄積が、実機として結実した。\n\n開発は国のプロジェクトとして大学・企業の連合で進められ、日本も量子を国家戦略技術と位置づけたことを示す。ハードウェア実装レイヤーにおける日本の存在感を再確立する一歩と受け止められた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"理化学研究所プレスリリース: 量子コンピュータ国産初号機の公開 (2023-03-27)","url":null}]},{"date":"2023-12-04","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"IBMが1121量子ビットの「Condor」を発表","summary":"IBMが1121量子ビットの超伝導プロセッサCondorを発表した。同時に、量子ビット数より誤り率の低さを重視した新チップHeronと、誤り訂正を見据えた開発ロードマップの改訂も示した。\n\n数を競う時代が一つの節目に達し、以後の焦点は誤りの少なさと誤り訂正へ移る。この転換は翌年のGoogleによる誤り訂正実証と合わせ、投資家(産業と投資レイヤー)の評価軸も物理量子ビット数から論理量子ビットへと変えていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IBM Quantum Summit 2023 発表 (Condor / Heron)","url":null}]},{"date":"2024-12-09","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"GoogleのWillowが誤り訂正の閾値を突破","summary":"Googleが105量子ビットのチップWillowで、符号を大きくするほど論理誤り率が下がる「閾値以下」の量子誤り訂正を実証したと発表し、Natureに論文が掲載された。\n\n量子ビットを増やすほど誤りも増えるという最大の障壁に対し、**誤り訂正が原理どおりに機能する**ことを実機で示した節目である。発表を受けて量子関連株が急伸(産業と投資レイヤー)し、実用化時期の議論が具体的になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google Blog: Meet Willow, our state-of-the-art quantum chip (2024-12-09)","url":"https://blog.google/technology/research/google-willow-quantum-chip/"}]},{"date":"2025-02-19","precision":"day","end_date":null,"type":"point","layer":"ハードウェア実装","title":"Microsoftがトポロジカル量子チップを発表","summary":"Microsoftが、マヨラナ粒子に基づくとするトポロジカル量子ビットのチップ「Majorana 1」を発表した。誤りに本質的に強い方式であり、実現すれば大規模化への近道になると同社は主張した。\n\nただしマヨラナ準粒子の観測をめぐっては同社関連の論文撤回が過去にあり、学界からは慎重な検証を求める声が相次いだ。超伝導・イオン・光と並ぶ方式間の競争が、なお決着していないことを示す出来事でもある。","detail":null,"credibility":"disputed","credibility_note":"トポロジカル量子ビットが実際に実現されたかは学界で検証が続いており、評価が定まっていない。","sources":[{"title":"Microsoft発表: Majorana 1 (2025-02-19)","url":null}]},{"date":"2025-04-01","precision":"month","end_date":null,"type":"point","layer":"産業と投資","title":"富士通と理研が256量子ビット機を開発","summary":"富士通と理化学研究所が共同開発した256量子ビットの超伝導量子コンピュータを発表し、企業や研究機関への提供を始めた。2023年の国産初号機から約2年での大規模化である。\n\n国の研究機関と民間企業の共同開発という日本型の体制が継続的に成果を出し始めた例であり、国家戦略レイヤーの投資が産業側の実装能力へ接続しつつある。誤り訂正時代に向けた1000量子ビット級への通過点と位置づけられる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"富士通・理化学研究所 共同プレスリリース (2025年4月)","url":null}]}]},{"slug":"tech-robotics","title":"🦾 ロボティクスの夜明け","description":"1961年の産業用ロボットから二足歩行、災害対応、そしてヒューマノイド投資ブームまで。研究・産業・くらしの3層で、ロボットが工場を出て現場に立つまでの長い夜明けを追いかけます。動く機械の現在地を確かめる年表です。","category":"technology","language":"ja","start_year":1961,"end_year":2024,"layers":[{"name":"研究と技術","color":"blue"},{"name":"産業と市場","color":"orange"},{"name":"社会とくらし","color":"teal"}],"events":[{"date":"1961-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と市場","title":"🤖 世界初の産業用ロボットUnimate稼働","summary":"ジョージ・デボルとジョセフ・エンゲルバーガーが開発した「Unimate」が、ゼネラルモーターズの工場で稼働を始めました。担当はダイカスト部品の搬出。高温で危険な、人がやりたくない仕事です。世界初の産業用ロボットとされています。\n\n**人が嫌がる作業から現場に入る**という普及の型は、ここで決まりました。以後20年あまり、ロボットの主戦場は工場の中。家庭や街に出てくるのは、ずっと先の話になります。","detail":null,"credibility":"disputed","credibility_note":"導入年は試験導入の1959年とする資料と本格稼働の1961年とする資料があり、記述が分かれています。","sources":[{"title":"Wikipedia: Unimate","url":"https://en.wikipedia.org/wiki/Unimate"}]},{"date":"1973-01-01","precision":"year","end_date":null,"type":"point","layer":"研究と技術","title":"早稲田大学WABOT-1、世界初の本格人間型ロボット","summary":"早稲田大学の加藤一郎らが、二足で歩き、視覚と対話機能を備えた世界初の本格的な人間型ロボット「WABOT-1」を完成させました。歩行は一歩に数十秒。それでも、人の形の機械が自分の脚で立って歩いたことの意味は大きいです。\n\n産業用ロボット(産業と市場レイヤー)が実用の道を進む一方、人型への挑戦は大学の研究室から始まりました。この系譜が後のホンダの極秘研究、そしてASIMOへつながっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"早稲田大学ヒューマノイド研究所: WABOTの歴史","url":null}]},{"date":"1980-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と市場","title":"日本で「ロボット普及元年」、生産現場に浸透","summary":"日本で産業用ロボットの導入が急拡大し、1980年は業界で「ロボット普及元年」と呼ばれました。自動車と電機の工場で溶接・塗装・組立への採用が進み、日本は稼働台数で世界最大のロボット大国になっていきます。\n\n背景にあるのは人手不足と品質競争です。現場では「雇用を奪う機械」ではなく「人手を補う仲間」として迎えられました。この日本特有の受け止め方(社会とくらしレイヤー)も、この時期に形づくられています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本ロボット工業会: 産業用ロボットの歴史","url":null}]},{"date":"1986-01-01","precision":"year","end_date":"1996-12-31","type":"period","layer":"研究と技術","title":"ホンダ、極秘の二足歩行研究からP2公開へ","summary":"ホンダが社内で二足歩行ロボットの研究を極秘に始めました。試作機E0からE6、P1を経て、1996年12月に自律歩行する人間型ロボット「P2」を公開。あの発表に世界の研究者が衝撃を受けました。自動車会社が10年黙って基礎研究を続けていた事実も含めて、です。\n\n**研究室の夢に企業の資本と工学が合流した**10年でした。WABOT以来の学術の系譜は一気に実用水準へ引き上げられ、ASIMOへ結実します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"本田技研工業: ヒューマノイドロボット研究開発の歩み","url":null}]},{"date":"1999-06-01","precision":"day","end_date":null,"type":"point","layer":"社会とくらし","title":"🐕 ソニーAIBO発売、ロボットが家庭のペットに","summary":"ソニーが犬型エンタテインメントロボット「AIBO」を発売しました。25万円という価格ながら、日本向け3000台はネット販売開始から約20分で完売と発表されています。\n\n役に立つかではなく、**愛着の対象としてのロボット**という市場を初めて成立させた製品です。「ロボットと暮らす」ことへの日本社会のハードルの低さも見えました。後年、修理サポート終了の際にAIBOの「葬儀」が営まれたことも、この受容の深さを物語っています。","detail":null,"credibility":"unverified","credibility_note":"「約20分で3000台完売」はソニーの発表に基づく数字で、第三者による検証はありません。","sources":[{"title":"ソニー: AIBO(ERS-110)発売に関する発表 (1999)","url":null}]},{"date":"2000-10-31","precision":"day","end_date":null,"type":"point","layer":"研究と技術","title":"ホンダASIMO公開、二足歩行の到達点","summary":"ホンダが人間型ロボット「ASIMO」を公開しました。身長120cmへの小型化と、あの滑らかな歩行。二足歩行ロボットの代名詞として世界に知られる存在になります。歩きの自然さは、いま映像で見返しても引き込まれます。\n\nP2から4年、研究の系譜がひとつの完成形に達した瞬間でした。ただ用途は実証と広報にとどまり、量産・実用化には至らないまま2022年に開発の歴史を閉じます。「歩ける」と「役に立つ」の間の距離は、この分野のずっと続く課題です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ASIMO","url":"https://en.wikipedia.org/wiki/ASIMO"}]},{"date":"2002-09-01","precision":"month","end_date":null,"type":"point","layer":"社会とくらし","title":"ルンバ発売、掃除ロボットが実用市場を開く","summary":"米iRobotが自動掃除機「Roomba」を199ドルで発売しました。軍事・研究用ロボットを手がけてきた会社が家庭向けに出した円盤型の機械は、累計数千万台の大ヒットになります。\n\n人型でも高機能でもなく、床掃除という単機能に絞ったことが成功の鍵で、**形は仕事が決める**という設計思想を体現しています。二足歩行の研究(研究と技術レイヤー)が脚光を浴びる裏で、実際に家庭へ入ったのはこの円盤だったのが面白いところです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Roomba","url":"https://en.wikipedia.org/wiki/Roomba"}]},{"date":"2004-03-13","precision":"day","end_date":null,"type":"point","layer":"研究と技術","title":"DARPAグランドチャレンジ、完走車ゼロ","summary":"米国防高等研究計画局(DARPA)が賞金100万ドルの無人車両レースを砂漠で開催しました。約240kmのコースに対し、最長走行は約12km。完走はゼロでした。\n\n「大失敗」と報じられましたが、翌2005年の第2回では5台が完走します。この現場に集まった研究者たちが、後の自動運転産業の中核になりました。賞金レース方式が研究を加速させた好例で、移動ロボットが屋外の実環境へ出ていった節目でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Grand Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Grand_Challenge"}]},{"date":"2005-01-01","precision":"year","end_date":null,"type":"point","layer":"研究と技術","title":"Boston DynamicsのBigDog公開","summary":"Boston DynamicsがDARPA資金による四足歩行ロボット「BigDog」を発表しました。不整地をずんずん歩き、横から蹴られても踏ん張って立て直す。あの動画に釘付けになった人は多いはずです。脚式ロボットの可能性を強烈に印象づけました。\n\n軍用の荷物運搬を想定した研究でしたが、エンジン騒音などの理由で配備には至りません。それでもこの技術系譜が後のSpot(産業と市場レイヤーでの商用化)につながり、動画でロボットが大衆的関心を集める先例にもなりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: BigDog","url":"https://en.wikipedia.org/wiki/BigDog"}]},{"date":"2008-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と市場","title":"Universal Robots、初の協働ロボットUR5出荷","summary":"デンマークのUniversal Robotsが軽量アーム「UR5」を初出荷しました。安全柵で人と隔離するのが常識だった産業用ロボットの世界に、人の隣で働ける「協働ロボット」という新しい分類を作った機械です。\n\n教示の簡単さと低価格で、導入できる企業の裾野は中小製造業まで広がりました。**柵の中から人の隣へ**。この変化は、ロボットが工場の外へ出ていく後年の流れ(社会とくらしレイヤー)の前段でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Universal Robots: Company history","url":null}]},{"date":"2011-04-01","precision":"month","end_date":null,"type":"point","layer":"社会とくらし","title":"福島第一原発にロボット投入、災害対応の現実","summary":"東京電力福島第一原子力発電所の事故対応で、米iRobot社のPackBotが原子炉建屋内の放射線量測定などに投入されました。ロボット大国を自任してきた日本が、緊急時に即応できる国産ロボットを持っていなかった。その事実が重く突きつけられました。\n\nこの反省が国内の災害対応ロボット研究を再起動させ、米国ではDARPAロボティクス・チャレンジ(研究と技術レイヤー)開催の直接の契機になります。ロボットの価値が問われる場が、展示会から現場へ移った出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IEEE Spectrum: Robots Enter Fukushima Reactor Building (2011)","url":null}]},{"date":"2012-03-19","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"AmazonがKiva Systemsを7.75億ドルで買収","summary":"Amazonが倉庫内搬送ロボットのKiva Systemsを約7億7500万ドルで買収しました。棚ごと商品を運ぶロボットを物流センターに大量配備し、外販を止めて自社専用にしています。\n\n電子商取引の拡大で倉庫の人手不足が深刻化していた時期です。ロボットが**工場の外の産業現場**を本格的に変え始めた転換点で、この買収を機に物流ロボット市場へは競合の参入が相次ぎ、一大分野に育っていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Robotics","url":"https://en.wikipedia.org/wiki/Amazon_Robotics"}]},{"date":"2012-04-01","precision":"month","end_date":"2015-06-06","type":"period","layer":"研究と技術","title":"DARPAロボティクス・チャレンジ開催","summary":"福島の事故を受け、DARPAが災害現場でのロボット活用を競う「ロボティクス・チャレンジ」を始めました。車両の運転、扉の開閉、瓦礫の歩行。世界のチームが挑み、2015年6月の決勝では韓国KAISTのDRC-HUBOが優勝しています。\n\n決勝で次々と転倒するロボットの映像は、技術の現在地を包み隠さず見せてくれました。それでもここで鍛えられた人材と技術は、後のヒューマノイド企業群(産業と市場レイヤー)へ流れ込みます。災害対応という目的が研究を束ねた、貴重な大会でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DARPA Robotics Challenge","url":"https://en.wikipedia.org/wiki/DARPA_Robotics_Challenge"}]},{"date":"2013-12-01","precision":"month","end_date":null,"type":"point","layer":"産業と市場","title":"Googleがロボット企業8社を連続買収","summary":"GoogleがBoston Dynamicsを含むロボット企業8社を相次いで買収したと報じられました。Androidの生みの親アンディ・ルービンが率いる新事業として、界隈は大いに沸きました。\n\nしかし事業の方向性が定まらないままルービンは退社。Boston Dynamicsは2017年にソフトバンクグループへ売却されます。巨大IT資本によるロボット産業への最初の大波は、**資本だけでは製品にならない**という教訓を残して引いていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The New York Times: Google Puts Money on Robots (2013-12)","url":null}]},{"date":"2015-06-20","precision":"day","end_date":null,"type":"point","layer":"社会とくらし","title":"Pepper一般発売、感情認識ロボットの熱狂","summary":"ソフトバンクが人型ロボット「Pepper」を一般向けに発売しました。本体19万8000円、初回生産分1000台は発売開始から1分で完売と同社は発表しています。\n\n感情を認識する家庭用ロボットという触れ込みで店頭案内にも広がりましたが、継続的な用途の確立には苦戦し、2021年には生産休止が報じられました。AIBO以来の「ロボットと暮らす」期待と、実用の壁との落差を現場で見せた事例です。","detail":null,"credibility":"unverified","credibility_note":"「1分で完売」は同社発表に基づく数字で、販売実数の第三者検証はありません。生産休止も報道ベースです。","sources":[{"title":"ソフトバンク: Pepper一般販売開始に関する発表 (2015)","url":null}]},{"date":"2017-10-25","precision":"day","end_date":null,"type":"point","layer":"社会とくらし","title":"ロボット「Sophia」にサウジが市民権付与","summary":"Hanson Robotics製の人型ロボット「Sophia」に、サウジアラビアが「市民権」を付与したと発表しました。ロボットが市民権を持つ世界初の事例として大きく報じられています。\n\nただ、法的な権利義務の内実は示されておらず、研究者からは会話能力の誇張とあわせて演出的なイベントだという批判が根強いです。ロボットへの期待と実態の乖離、そして「人らしさ」の見せ方をめぐる倫理問題を象徴する出来事になりました。","detail":null,"credibility":"disputed","credibility_note":"付与された市民権の法的内容は公表されておらず、実質を伴わない象徴的な発表だとする見方が有力です。","sources":[{"title":"Wikipedia: Sophia (robot)","url":"https://en.wikipedia.org/wiki/Sophia_(robot)"}]},{"date":"2020-06-16","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"🦾 Boston DynamicsがSpotを一般販売開始","summary":"Boston Dynamicsが四足歩行ロボット「Spot」を7万4500ドルで一般販売開始しました。動画で世界を驚かせ続けてきた同社にとって初の量産商用製品で、工場や建設現場の巡回・点検に採用が進んでいます。\n\nBigDogから15年。研究資金による開発(研究と技術レイヤー)が、ようやく市場で買える製品に届きました。親会社はGoogle、ソフトバンクを経て2021年に現代自動車グループへ。脚式ロボットの商用化は自動車資本の下で進むことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Boston Dynamics: Spot commercial availability (2020-06)","url":null}]},{"date":"2021-08-19","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"TeslaがヒューマノイドOptimus計画を発表","summary":"TeslaがAIイベントで人型ロボット「Optimus」の開発計画を発表しました。当日ステージに登場したのは実機ではなく着ぐるみのダンサー。会場の話題と懐疑を同時にさらっていきました。\n\n自動運転で開発した認識技術と量産能力を人型に転用する構想は、**ヒューマノイドを労働力として量産する**競争の号砲になります。以後、米中で人型への投資が過熱し、WABOTからASIMOへ続いた研究の系譜とは別の、資本主導の第二幕が始まりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Tesla AI Day 2021での発表","url":null}]},{"date":"2024-02-29","precision":"day","end_date":null,"type":"point","layer":"産業と市場","title":"Figureが6.75億ドル調達、ヒューマノイド投資過熱","summary":"ヒューマノイド開発の米FigureがOpenAI、Microsoft、NVIDIA、Amazon創業者ベゾスらから6億7500万ドルを調達しました。評価額は約26億ドル。OpenAIとの共同開発も同時に発表されています。\n\n生成AIの言語・視覚能力がロボットの「頭脳」の問題を解くという期待が投資を呼び込み、1961年のUnimate以来の「体」の系譜とAI革命の「頭」の系譜が合流しつつあります。夜明けの次の章が、いよいよ始まろうとしています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Figure: Series B資金調達の発表 (2024-02-29)","url":null}]}]},{"slug":"tech-semiconductor-war","title":"半導体戦争の50年","description":"日米摩擦から米中対立まで。製造技術・企業と市場・国家と地政学の3層を重ね、半導体が「産業のコメ」から安全保障の要へと変わっていく50年を俯瞰する年表。","category":"technology","language":"ja","start_year":1976,"end_year":2025,"layers":[{"name":"技術と製造","color":"blue"},{"name":"企業と市場","color":"orange"},{"name":"国家と地政学","color":"teal"}],"events":[{"date":"1976-01-01","precision":"year","end_date":"1980-03-31","type":"period","layer":"国家と地政学","title":"日本で超LSI技術研究組合が発足","summary":"通商産業省の主導で、富士通・日立・三菱電機・NEC・東芝が参加する超LSI技術研究組合が発足した。約4年間、微細加工技術などの基礎を競合企業が共同で研究する体制が組まれた。\n\n**国家が半導体を戦略産業として育てる**モデルの原型であり、この成果が1980年代の日本製DRAM
