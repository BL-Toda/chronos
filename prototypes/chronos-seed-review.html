ども政策を一元化する新しい省庁が、こども基本法の施行と同日に発足。少子化対策や虐待防止、保育行政を担い、保育所も所管に移った。翌年には児童手当拡充などを含む政策パッケージが法制化された。\n\nこの家族にとっては、長女の小学校入学と次女の保活準備が重なる年で、区役所の窓口の書類に印刷された省庁名が変わっていることに気づいた程度の変化だったが、翌年の手当の増額はそこから来ていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"こども家庭庁: こども家庭庁について","url":"https://www.cfa.go.jp/about"}]},{"date":"2023-04-06","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"長女、小学校に入学","summary":"区立小学校に入学。ランドセルは祖父母からの贈り物。入学式は保護者2人まで参加でき、コロナ禍の制限がようやく緩んだことを実感した。GIGAスクール構想で整備されたタブレット端末が1年生から配られ、保育園にはなかった宿題として持ち帰るようになった。\n\n休園中に平仮名を覚えた子が、今度は画面で足し算の練習をしている。学童保育の申込みも同時に済ませたが、この年に母の働き方を変える必要が生じる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-06-01","precision":"month","end_date":null,"type":"point","layer":"親の仕事と暮らし","title":"「小1の壁」で母が転職","summary":"保育園は19時まで預かってくれたが、学童は18時で閉まる。時短勤務の対象からも外れ、通勤を含めると毎日迎えが間に合わない計算だった。8年勤めた会社を離れ、週4日在宅の職場へ転職。年収は下がったが、夕方の時間を取り戻した。\n\n翌年10月から児童手当が高校生まで拡充され、家計の目減りを少しだけ埋めることになる。**制度は追いついてきているが、まだ半歩遅れている**と感じた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-10-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"児童手当の拡充（所得制限撤廃・高校生まで）","summary":"2024年10月分から児童手当の所得制限が撤廃され、支給対象が高校生年代まで延長、第3子以降は月3万円に増額された。こども家庭庁が主導した「こども未来戦略」に基づく改正で、支払いも年3回から隔月に変わった。\n\nこの家族には長女と次女の2人分が該当し、前年の転職で母の収入が下がったあとに届いた。制度の拡充と家計の変化が続けて起きたのは偶然だが、記録として残しておくと、あとで見返したときに因果のように見えてしまう。それも年表の面白さかもしれない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"こども家庭庁: 児童手当制度のご案内（令和6年10月分からの制度改正）","url":"https://www.cfa.go.jp/policies/kokoseido/jidouteate/annai"}]},{"date":"2025-04-01","precision":"day","end_date":null,"type":"point","layer":"子どもの成長","title":"次女、保育所に入園","summary":"姉と同じ園の2歳児クラスに入園。長女のときは2年かかった認可入園が、次女は一度で決まり、慣らし保育は3日で終わった。地域の子どもの数が減り、園によっては定員に空きが出始めていると園長から聞いた。姉のときとは何もかもが早い。\n\n同じ4月から改正育児・介護休業法が施行され、3歳未満の子を持つ親のテレワークが事業主の努力義務になった。転職した母の在宅勤務は、制度に先回りしていた形になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"「こども誰でも通園制度」が全国で本格実施","summary":"親の就労を問わず、生後6か月から3歳未満の子を月一定時間まで保育所等に預けられる制度が全国実施の予定。2023年から試行的事業として一部自治体で始まり、2025年度に法律上の給付制度化、2026年度から全自治体での実施が予定されている。\n\nこの家族の次女はすでに認可に在園しているため直接の対象ではないが、10年前に「保育園落ちた」が国会で語られたことを思うと、預ける理由を問わない制度が全国に広がる予定というだけで、**時代の距離**を感じる。","detail":null,"credibility":"unverified","credibility_note":"2026年度からの全国実施は制度設計上の予定であり、自治体ごとの実施時期や利用可能時間の運用は本記録作成時点で確定していない。","sources":[{"title":"こども家庭庁: こども誰でも通園制度について","url":"https://www.cfa.go.jp/policies/kokoseido/daredemo-tsuen"}]}]},{"slug":"personal-reading-log","title":"読書遍歴 1990–2026","description":"1980年生まれの架空の一人が、10歳から46歳までに出会った本の記録。読んだ本と転機、人生の出来事、出版と社会の変化を重ね、一冊の本がどんな年に手元へ届いたのかをたどる。","category":"personal-life","language":"ja","start_year":1990,"end_year":2026,"layers":[{"name":"読んだ本と転機","color":"purple"},{"name":"人生の出来事","color":"gold"},{"name":"出版と社会","color":"blue"}],"events":[{"date":"1990-07-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"小学校の図書室で『モモ』に出会う","summary":"10歳の夏休み前、図書室の先生に薦められて借りたミヒャエル・エンデの長編。返却期限を2度延長して読み終え、最初の「自分の本」になった。時間泥棒の話を、当時はただの冒険物語として読んだ。図書室の貸出カードに自分の名前を何度も書いた年。\n\n読み返すたびに違う本になることを知るのはずっと後で、この記録を始めた動機のひとつでもある。1990年代初め、街の書店はまだ増えており、本は身近な場所にいくらでもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"出版物の推定販売金額がピークに","summary":"書籍・雑誌を合わせた紙の出版物の推定販売金額が約2兆6,500億円に達し、これ以降は長期の減少局面に入る。雑誌が売上の6割近くを占め、コンビニと駅の書店が日常の本の入口だった時代の頂点で、以後は雑誌の落ち込みを中心に市場が縮小を続ける。\n\nこの年、16歳の「わたし」は高校の帰り道にある書店で『ソフィーの世界』を手に取っている。**本がいちばん売れていた年に、自分の読書が本格的に始まっていた**ことを、あとから統計で知った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"出版科学研究所: 出版指標年報（出版物推定販売金額の推移）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"1996-05-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"高校1年、『ソフィーの世界』で哲学に触れる","summary":"ヨースタイン・ゴルデルによる小説仕立ての哲学史。日本語版は1995年に刊行され、ベストセラーになっていた。読み終えても哲学者の名前は覚えられなかったが、なぜ、と口に出すことに引け目を感じなくなった。哲学の入門書としてより、「問いを持ってよい」と教わった本として残っている。\n\n紙の出版物がもっとも売れた年に、通学路の書店で新刊台から取った本。その書店は2023年に閉店する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1998-04-01","precision":"day","end_date":"1999-03-31","type":"period","layer":"人生の出来事","title":"浪人の1年","summary":"大学受験に失敗し、予備校に通った1年。読んだのは参考書だけ、と当時は思っていたが、鞄の底にはいつも『銀河鉄道の夜』の文庫があった。読み進めるというより、開いて閉じるための本。\n\n駅前の書店では相変わらず雑誌の棚がいちばん広く、新刊の話題は当時のわたしには遠いものだった。翌春に地方の大学に合格し、この一年は結果的に、読書と自分の距離を測り直す時間になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2002-04-01","precision":"day","end_date":null,"type":"point","layer":"人生の出来事","title":"就職と上京","summary":"地方の大学を卒業し、東京の中堅出版取次の会社に就職。本に近い仕事を選んだつもりが、配属は物流部門だった。毎朝、雑誌の束が全国へ出ていくのを倉庫で見た。\n\n1996年をピークに市場が縮んでいることは社内の誰もが知っていて、それでも量は圧倒的だった。読む本を選ぶ時間はなくなり、代わりに「売れる本」の情報だけが増えた。この頃、Amazon.co.jpはすでに営業を始めており、書店に行かずに本を買う人が少しずつ現れていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2003-10-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『博士の愛した数式』を通勤電車で読む","summary":"小川洋子による2003年8月刊行の小説を、働き始めて2年目の通勤電車で読む。80分しか記憶がもたない数学者と家政婦の物語。取次の倉庫で数字として扱っていた本のひとつが、開いてみれば静かで確かな世界だった。\n\n仕事で本を数として扱う日々のなかで、久しぶりに一冊を最後まで読み、本を「作品」として取り戻した。翌2004年に第1回本屋大賞を受けることになるが、そのニュースを職場で聞いたとき、少しだけ自分の手柄のような気がした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2004-04-05","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"第1回本屋大賞が発表される","summary":"書店員が選ぶ文学賞として本屋大賞が創設され、第1回大賞に『博士の愛した数式』が選ばれた。出版不況と書店の減少が意識され始めた時期に、「売り場からベストセラーをつくる」ことを掲げて始まった賞である。\n\n以後、受賞作は映像化と大きな売上につながる例が続き、書店員の推薦が読者の選択に影響する構図が定着した。取次で働いていたわたしにとって、前年に通勤電車で読んだ本が最初の受賞作になったのは、小さな符合として記憶に残っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"本屋大賞 公式サイト: 過去の本屋大賞（2004年）","url":"https://www.hontai.or.jp/history/"}]},{"date":"2012-10-25","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"Kindleストアが日本で開始","summary":"Amazonが日本語の電子書籍ストアを開設。2010年のiPad発売を機に「電子書籍元年」という言葉が広まったが、日本語コンテンツと端末の両方が揃うのは2年遅れのこの年からで、以後は電子コミックを中心に電子出版市場が年々拡大していく。\n\n取次を辞めて出版社の編集に移っていたわたしは、電子版の契約書を初めて読んだ年でもあった。紙の本の物流を見てきた身には、倉庫のない本というものが不思議だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon.co.jp: プレスリリース Kindleストア開設（2012年10月25日）","url":null}]},{"date":"2012-11-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"初めて電子書籍を買う","summary":"Kindleストアの開設からひと月後、通勤中に読むために既読の文庫を電子で買い直した。最初の一冊は、紙で3冊持っている『モモ』。なぜか電子でも買ったのは、読み比べたかったのだと思う。文字の大きさを変えられることに驚き、ページの厚みで残りを測れないことに戸惑った。\n\n以後、移動中は電子、家では紙、という使い分けが定着する。同じ月に第一子が生まれ、片手で読める電子書籍は、**思いがけず育児の道具になった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-11-18","precision":"day","end_date":null,"type":"point","layer":"人生の出来事","title":"第一子が生まれる","summary":"32歳で第一子が生まれる。出版社の編集の仕事は続けたが、読書の中身が変わった。夜中の授乳の合間に電子書籍を片手で読む習慣がつき、自分のための本より子どもに読む本を選ぶ時間が増え、『ぐりとぐら』や『はらぺこあおむし』を何百回と読んだ。読む本の半分が絵本になった。\n\nKindleストアが開いたばかりの月に生まれた子で、片手で持てる端末がなければ、この時期の読書はほとんど途絶えていたと思う。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-10-01","precision":"day","end_date":"2018-06-30","type":"period","layer":"人生の出来事","title":"父の介護と、本を読めなかった1年9か月","summary":"地方の実家に月2回通い、父の入退院に付き添った1年9か月。編集の仕事は続けたが、新幹線での往復と病院の待合室で、本を開いても頭に入らなかった。読書の記録がほとんど空白になった唯一の時期で、読めない時期にも本は側にあった、という以上のことは書けない。\n\n父を見送った2018年6月以降、少しずつ読書が戻ってくる。この空白は、あとから見ると年表の中でいちばん雄弁な部分になった。**読まなかったことにも記録の価値がある**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-12-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『82年生まれ、キム・ジヨン』を読む","summary":"介護が終わった年の暮れ、チョ・ナムジュの小説の日本語版が筑摩書房から刊行されたばかりのところを一晩で読んだ。翌年にかけて韓国文学が広く読まれるきっかけのひとつになった一冊で、自分と2歳違いの主人公が通ってきた道は、国は違っても地続きに見えた。\n\n空白の1年9か月のあと、最初に最後まで読んだ本。読書が「戻ってきた」と感じた一冊として、この年表では区切りの位置にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"紙と電子を合わせた出版市場が前年比プラスに","summary":"出版科学研究所の推計で、2019年は紙の販売額が前年比マイナスとなる一方、電子出版が2割超の伸びでそれを上回り、紙+電子の合計では小幅ながら前年を上回った。\n\n報道では「1996年以来」「合算統計で初」といった表現が使われたが、紙と電子を合算した統計自体は2014年からで、比較の基準は資料によって異なる。編集の現場でも、電子の売上を前提に企画を立てることが当たり前になった年。","detail":null,"credibility":"disputed","credibility_note":"「前年比プラス」自体は出版科学研究所の推計に基づくが、「何年ぶり」「初」といった位置づけは統計の集計範囲（紙+電子の合算開始年）によって異なる。","sources":[{"title":"出版科学研究所: 2019年の出版市場（紙+電子）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"2020-01-01","precision":"year","end_date":null,"type":"point","layer":"出版と社会","title":"巣ごもりで電子出版市場が3割近く伸びる","summary":"コロナ禍の在宅時間の増加で電子コミックを中心に電子出版が急伸し、出版科学研究所の推計で市場は約3,900億円、前年比約28%増となった。書店の休業や外出自粛で紙の販売にも波があったが、児童書や学習参考書は伸びた。\n\nこの年、わたしは在宅勤務の合間にカミュの『ペスト』を読み返している。本を読む場所と方法が、この年を境にもう一段変わった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"出版科学研究所: 2020年の出版市場（紙+電子）","url":"https://shuppankagaku.com/statistics/"}]},{"date":"2020-05-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"『ペスト』を再読する","summary":"緊急事態宣言下、アルベール・カミュの1947年の小説を20年ぶりに読み返した。この年、世界的に再び読まれ、日本でも文庫が増刷された。閉ざされた街の中で人が何を続け、何を諦めるかという描写が外の空気とそのまま重なり、若い頃は寓話として読んだ小説が、記録として読めた。\n\n同じ年に電子出版が急伸し、わたしの本棚も電子の比率が初めて半分を超えた。**読む本と読み方の両方が、社会の状況に押されて動いた年**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-03-01","precision":"month","end_date":null,"type":"point","layer":"人生の出来事","title":"地元の書店が閉店する","summary":"高校時代に通い『ソフィーの世界』を買った、駅前の2階建て、雑誌と参考書と文庫が中心の書店が閉店。最終日に帰省して最後の一冊、『モモ』の新版を買った。店主からは、雑誌が売れなくなってからは厳しかったと聞いた。\n\n翌年には国が書店振興の検討を始めることになるが、間に合わない店は多い。**本を買う場所がなくなることと、本を読まなくなることは同じではない**、と自分に言い聞かせながら、それでも寂しかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-05","precision":"day","end_date":null,"type":"point","layer":"出版と社会","title":"経済産業省が書店振興プロジェクトチームを設置","summary":"全国で書店が減り続ける状況を受け、経産省が大臣直属のプロジェクトチームを設置。書店を「文化創造基盤」と位置づけ、キャッシュレス手数料や取引慣行、図書館との連携などを論点に検討が進められた。書店のない自治体が全国の4分の1を超えるとする民間調査も同時期に報じられた。\n\n前年に地元の書店が閉店したわたしにとっては、遅すぎるとも、ようやくとも思える動きだった。読書会を始める直接のきっかけのひとつでもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省: 書店振興プロジェクトチームの設置について（2024年3月5日）","url":"https://www.meti.go.jp/press/2023/03/20240305001/20240305001.html"}]},{"date":"2024-08-01","precision":"month","end_date":null,"type":"point","layer":"出版と社会","title":"書店のない自治体が全国の約3割との調査","summary":"出版文化産業振興財団の調査で、書店が1店もない市区町村が全国に約480、約27%にのぼるとされ、都道府県によっては半数近くに達する。\n\nただし「書店」の定義（新刊書店のみか、古書店やコンビニの書籍売場を含むか）や調査時点で数値は変わり、別の調査では異なる割合が示されている。地元の店を失ったわたしは、この統計の1に自分の町が入っていることを、数字として初めて確認した。","detail":null,"credibility":"unverified","credibility_note":"無書店自治体の割合は「書店」の定義と調査時点により調査ごとに差があり、約27%という値は特定の民間調査に基づく暫定的な数値。","sources":[{"title":"出版文化産業振興財団（JPIC）: 書店のない自治体に関する調査（2024年）","url":null}]},{"date":"2025-06-01","precision":"month","end_date":null,"type":"point","layer":"人生の出来事","title":"月に一度の読書会を始める","summary":"近所の公民館を借りて、6人から始めた読書会。課題本は毎回参加者が持ち回りで選び、最初の一冊は『モモ』。書店がなくなった町で、それでも本の話をする場所は作れると思った。\n\n参加者の年齢は20代から70代まで。紙で読む人も電子で読む人もいて、同じ本の違う版を並べて話すのが恒例になった。35年前に図書室で借りた本を、今度は自分が薦める側になった。この年表は、読書会の初回で自己紹介の代わりに配ったものが元になっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"読んだ本と転機","title":"子どもが『モモ』を図書室で借りてくる","summary":"13歳になった子どもが、薦めたわけでもないのに、自分が10歳で読んだ同じ本を学校の図書室から借りてきた。36年ぶりに同じ本を、別々に読む。感想は聞かないことにしている。読み返すたびに違う本になるなら、最初の一回は本人だけのものだと思うから。\n\nこの年表はここでいったん止まるが、続きは子どもの年表になるのかもしれない。本の売れ方も読み方も変わり続けたこの36年で、**変わらなかったのは、図書室に本があったこと**だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-travel-album","title":"旅行アルバム年表","description":"1955年生まれの架空の一人が、25歳の香港から古希を前にした台湾まで残した旅の記録。家族の節目に、円高やLCC、感染症といった旅をめぐる時代を重ね、50冊のアルバムを1本の年表にする。","category":"personal-life","language":"ja","start_year":1978,"end_year":2025,"layers":[{"name":"旅の記録","color":"blue"},{"name":"暮らしと家族","color":"gold"},{"name":"旅と時代","color":"teal"}],"events":[{"date":"1978-05-20","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"成田空港が開港","summary":"長い反対闘争の混乱を経て、新東京国際空港(成田空港)が開港した。羽田発着の国際線の大半が移り、日本の海外への玄関口が成田になった。\n\n開港のニュースを、22歳の「わたし」は勤め先の寮のテレビで見た。海外はまだ遠い場所だったが、玄関ができたことだけは分かった。2年後、この空港から初めて出国することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"成田国際空港株式会社: 成田空港の歴史","url":null}]},{"date":"1979-01-01","precision":"year","end_date":null,"type":"point","layer":"旅と時代","title":"『地球の歩き方』創刊","summary":"個人旅行者向けガイドブック『地球の歩き方』の最初の2冊(ヨーロッパ編、アメリカ編)が刊行された。団体パッケージツアーが主流だった時代に、自分で調べて旅する読者を想定した点で新しかった。\n\n「わたし」が手にするのは数年後だが、**旅は自分で組み立てられる**という考え方は、この本から教わった。書き込みだらけの1冊は今もアルバムと同じ棚にある。","detail":null,"credibility":"disputed","credibility_note":"創刊は1979年とされるが、刊行月や初版の詳細は資料により記述が揺れている。","sources":[{"title":"地球の歩き方: 『地球の歩き方』の歩み","url":null}]},{"date":"1980-06-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"初めてのパスポートで香港へ","summary":"25歳、会社の同期3人と3泊4日の香港旅行。初めてのパスポートは5年用で、出国審査で手が震えた。九龍の夜市の匂いと、ビクトリアピークから見た夜景をよく覚えている。\n\n帰国後に現像した36枚撮り4本が、アルバムの1冊目になった。海外旅行がまだ月給数か月分の買い物だった時代である。この1冊目だけ、写真の貼り方が不器用なままになっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1985-09-22","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"プラザ合意、円高が旅の値段を変える","summary":"先進5か国がドル高是正で合意し、1ドル240円前後だった円相場は1年ほどで150円台まで急伸した。海外旅行の実質的な値段が下がり、庶民の休暇の選択肢に入っていく。\n\n「わたし」の新婚旅行が国内でなくハワイになったのは、この円高の影響が大きい。為替の数字が家族のアルバムの行き先を決めた、最初の、そして最大の例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本銀行: 外国為替相場状況(時系列統計データ)","url":null}]},{"date":"1986-05-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"新婚旅行でハワイ、5泊7日","summary":"結婚式の翌々日からハワイへ。当時の定番だったワイキキのホテルに泊まり、レンタカーでノースショアまで走った。妻が水平線を撮った1枚は、今も居間に飾ってある。\n\n円高元年の新婚旅行は同世代に多く、帰りの成田では同じような土産袋が並んだ。アルバムは2冊目、表紙に初めてふたりの名前を書いた。土産のマカダミアナッツは、以後のわが家の定番になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1987-01-01","precision":"year","end_date":null,"type":"point","layer":"旅と時代","title":"テンミリオン計画、海外旅行が国策になる","summary":"運輸省が、海外旅行者を5年間で倍の年間1000万人にする「海外旅行倍増計画(テンミリオン計画)」を打ち出した。貿易黒字への国際的な批判をかわす狙いもあり、休暇を海外で使うことが政策として奨励された。\n\n旅行会社の店頭にパンフレットがあふれ始めたのはこの頃で、数年後の家族の旅の選択肢が広がる背景になった。","detail":null,"credibility":"unverified","credibility_note":"計画の存在と1987年策定は広く言及されるが、目標値や策定手続きの詳細を一次資料で確認できていない。","sources":[{"title":"運輸省「海外旅行倍増計画(テンミリオン計画)」(1987)","url":null}]},{"date":"1989-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"長女誕生","summary":"33歳で父になった。平成が始まった春で、産院の帰り道に桜が咲いていた。しばらく旅行どころではなくなり、アルバムは旅のものから家族のものへ変わっていく。カメラも旅行用から普段使いになった。\n\nこの年表を作って気づいたのは、旅の空白期がそのまま子育ての密度だったということである。次に海外へ出るのは、7年後のことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1990-01-01","precision":"year","end_date":null,"type":"point","layer":"旅と時代","title":"海外旅行者数、初の1000万人超え","summary":"日本人の年間出国者数が約1100万人となり、初めて1000万人を超えた。テンミリオン計画の目標は前倒しで達成され、円高とバブル景気を追い風に、海外旅行の大衆化が確立した年とされる。\n\n同じ年、「わたし」の家では1歳の長女を連れての旅は近場の温泉が精一杯だった。**時代の追い風と家の事情は別々に吹く**ことも、年表にすると見えてくる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"法務省: 出入国管理統計(1990年)","url":null}]},{"date":"1992-02-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"長男誕生","summary":"4人家族になった。社宅から郊外の賃貸に移り、ミニバンを買い、休日は近所の公園と実家への帰省が定番になった。長女は弟のベビーカーを押したがった。\n\nアルバムはこの時期がいちばん厚い。旅は遠出だけではないと今なら言えるが、当時は手帳の隅に「いつかグアム」と書いていた。その小さな走り書きが、4年後に実現することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1996-08-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"家族4人で初の海外、グアム","summary":"長女7歳、長男4歳を連れて3泊4日のグアム。子連れの飛行機は3時間半が限界という判断だった。プールと海だけで子どもたちには十分で、観光らしい観光はほとんどしていない。\n\n格安パッケージが普及し、家族4人の海外が現実的な値段になっていた時期である。帰国便で長男が描いた飛行機の絵は、アルバム10冊目の表紙に貼ってある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2001-09-11","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"米同時多発テロ、旅の風景が変わる","summary":"米国で同時多発テロが発生し、世界の航空需要が急減した。日本人出国者数も大きく落ち込み、空港の保安検査は以後、時間をかけて厳格化されていく。\n\n翌年に計画していた家族でのハワイ再訪は取りやめた。液体物の持ち込み制限や靴を脱ぐ検査など、**旅の手続きが警戒の形をとる時代**がここから始まったと、後の旅のたびに実感する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国土交通省: 観光白書(平成14年版)","url":null}]},{"date":"2004-08-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"子どもたちとの最後の家族旅行、沖縄","summary":"長女15歳、長男12歳。美ら海水族館と離島の海をめぐった4日間が、結果的に4人そろっての最後の旅行になった。以後は部活と受験で、4人の予定が合わなくなる。\n\n最後と分かって撮った写真は1枚もない。家族旅行の終わりは事件ではなく、予定表の空白として静かに来る。アルバムのこの巻だけ、妻の字で書かれたキャプションが多い。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2011-06-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"結婚25年、迷った末のイタリア10日間","summary":"銀婚式の記念に計画していたイタリア旅行を、震災後の自粛の空気の中で行くかどうか夫婦で悩み、予定どおり出発した。フィレンツェの朝市で買ったオリーブオイルの味は、今もわが家の基準になっている。\n\n旅行業界全体が自粛の影響を受けた年で、「行くことも支えになる」という添乗員の言葉が忘れられない。56歳、体力のあるうちの長旅という判断でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-03-01","precision":"day","end_date":null,"type":"point","layer":"旅と時代","title":"Peach就航、日本のLCC元年","summary":"関西空港を拠点とするPeach Aviationが初就航し、この年はジェットスター・ジャパンなども続いて「LCC元年」と呼ばれた。数千円の航空券が、旅の頻度という概念を変えていく。\n\n定年を控えた「わたし」には、リタイア後の旅の設計図が変わる出来事だった。安く何度も行く旅と、貯めて長く行く旅。ようやく両方を選べる時代になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Peach Aviation: 就航開始について(2012年3月)","url":null}]},{"date":"2016-03-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"60歳で定年、アルバムの整理を始める","summary":"60歳で定年退職した。最初にやったのは、40年近い年月分のアルバム45冊を年代順に並べ直すことだった。旅の写真の背景には、家と家族と自分の変化が全部写り込んでいた。\n\n整理の途中で、行き先と年号の一覧表を作り始めた。それがこの年表の原型である。並べ直して、ようやく分かったことがある。**アルバムは旅の記録で、旅は人生の索引だった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-05-01","precision":"month","end_date":"2018-05-30","type":"period","layer":"旅の記録","title":"夫婦で欧州鉄道の旅、30日間","summary":"鉄道パスを使い、リスボンからウィーンまで1か月かけて移動した。62歳、宿を3日先まで決めない旅を初めてやった。荷物は夫婦で機内持ち込み2個まで削った。\n\n若い頃に『地球の歩き方』で憧れた旅を、退職後にようやく実行した形である。旅先で日本の若いバックパッカーに安宿を教わる側になっていたのが、少し可笑しかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-08-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"初孫誕生","summary":"長女に子が生まれ、64歳で祖父になった。孫の写真が増えるにつれ、長男からアルバムのデジタル化を勧められ、スキャナーを買った。取り込みながら、紙のアルバムも残すと決めた。\n\n紙をめくる孫の代のことを想像したからである。旅の計画には「孫と行ける場所」という条件が加わり、次の旅の同行者が、またひとり増えたわけである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":"2023-04-30","type":"period","layer":"旅と時代","title":"海外旅行が消えた3年間","summary":"新型コロナウイルスの水際対策で国際的な人の往来が止まり、日本人出国者数は2019年の約2000万人から2021年には約51万人まで落ち込んだ。海外旅行という行為そのものが、3年間ほぼ消滅した。\n\n「わたし」のパスポートは棚の中で期限を迎えた。旅ができない間にアルバムの整理とこの年表づくりが進んだのだから、**空白もまた記録の一部**である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本政府観光局(JNTO): 日本人出国者数統計","url":null}]},{"date":"2023-10-01","precision":"month","end_date":null,"type":"point","layer":"旅の記録","title":"3年半ぶりの海外、台湾で孫と","summary":"水際措置の終了を待って、68歳で3世代の台湾旅行に出た。新しいパスポートを10年用にするか5年用にするか、人生で初めて迷った。九份の坂道を、4歳の孫と手をつないで登った。\n\n44年前の香港で始まった旅の記録に、孫の代が加わった巻である。夜市の匂いは、あの頃と同じだった。孫が屋台で選んだ提灯の写真が、この巻の最初のページになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-05-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと家族","title":"50冊目のアルバムと、この年表","summary":"古希を前に、アルバムがちょうど50冊になった。最初の香港から45年、行き先を並べると、為替とテロと感染症と、時代の出来事がそのまま旅程の余白に写っていた。\n\n年表の最後の行は空けてある。次の旅で埋めるつもりだからである。子どもたちにはそれぞれの家のアルバムがもう始まっている。旅の記録は個人のものだが、続きは誰かに引き継がれていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-two-of-us","title":"ふたりの10年間","description":"2014年に東京で出会った架空のふたり、「わたし」とKの記録。ふたりの出来事と仕事・暮らしの変化に、同じ年の社会の出来事を重ね、小さな選択が時代の空気とどう響き合っていたかを振り返る。","category":"personal-life","language":"ja","start_year":2014,"end_year":2024,"layers":[{"name":"ふたりの出来事","color":"pink"},{"name":"仕事と暮らし","color":"gold"},{"name":"時代の空気","color":"teal"}],"events":[{"date":"2014-04-01","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"消費税率が5%から8%へ","summary":"17年ぶり、1997年以来の消費税率引き上げ。社会保障財源の確保が目的とされ、駆け込み需要のあと春の消費は一時的に冷え込んだ。日用品の値札が一斉に書き換わり、街には「増税前セール」の名残があった。\n\nこの年の5月、ふたりは友人の写真展で初めて言葉を交わす。最初の会話は、缶コーヒーが少し高くなったという他愛のない話題だったと記録にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"財務省: 消費税率の引上げについて（平成26年4月）","url":"https://www.mof.go.jp/tax_policy/summary/consumption/consumption_tax/index.html"}]},{"date":"2014-05-17","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"友人の写真展で出会う","summary":"神保町の小さなギャラリーで開かれた、共通の友人の個展の最終日。会社帰りに閉場間際に滑り込んだわたしと、受付で片付けを始めていたKが初めて話した。缶コーヒーの値段が上がった話から始まり、気づけば搬出まで手伝っていた。\n\n連絡先を交換したのはその晩ではなく、友人を介した打ち上げの席だったという。**消費税が8%になった春の、なんでもない土曜日**の出来事。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-03-21","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"付き合い始める","summary":"出会いから10か月。写真展のあとも月に一度は顔を合わせていたが、関係に名前をつけるまでに時間がかかった。三連休の初日、井の頭公園のまだ蕾の桜並木を歩きながら、次の春も一緒に見に来ようという話になった。\n\n特別な告白の言葉はなく、帰り道にKが「じゃあ、そういうことで」と言ったのが始まりだったと、わたしの手帳には書いてある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-04-14","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"熊本地震が発生","summary":"4月14日と16日に最大震度7を2度観測し、前震と本震という言葉が広く知られるきっかけとなった地震。関連死を含め270人以上が亡くなり、住宅被害は20万棟近くに及んだ。\n\n東日本大震災から5年、東京でも防災意識が再び高まり、非常食や簡易トイレを買い足す人が増えて備蓄品が品薄になった。ふたりがこの年の秋に同棲を始めたとき、最初に揃えた共有の持ち物は防災リュックだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成28年（2016年）熊本地震","url":"https://www.data.jma.go.jp/eqev/data/2016_04_14_kumamoto/index.html"},{"title":"内閣府防災: 平成28年熊本地震に係る被害状況等について","url":null}]},{"date":"2016-11-01","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"三軒茶屋の1LDKで同棲を始める","summary":"ふたつの部屋を引き払い、三軒茶屋の築30年の1LDKへ。それぞれの更新時期が近かったことが背中を押した。家賃は折半、食器は片方の実家から譲り受けた。引っ越し当日は本の段ボールが多すぎて業者に呆れられ、夜は床に座って弁当を食べた。\n\n春の熊本地震のあとだったので、**最初に買い足した共有物は防災リュックと水**だった。玄関に置かれたその赤いリュックは、その後の引っ越しにもずっとついてくることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"わたしの残業が月80時間を超える","summary":"新規案件が重なり、終電帰りが続いた月。深夜のタクシー代が支給される代わりに、休日出勤が当たり前になっていた。6月末に微熱が引かず、Kに促されて受診し、初めて仕事のペースについて真剣に話し合った。\n\n翌年に働き方改革関連法が成立し残業時間に上限が設けられるが、この時点ではまだ「忙しいのは良いこと」という空気が職場に残っていた。この経験が、のちのフリーランス転向の遠い伏線になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-04-01","precision":"day","end_date":"2019-03-31","type":"period","layer":"ふたりの出来事","title":"Kの大阪赴任による遠距離の1年","summary":"Kが大阪支社の立ち上げに参加し、月に一度どちらかが新幹線に乗る遠距離の12か月。赴任は1年限定と決まっていたが、始まる前は長く感じられた。毎晩ビデオ通話をつなぎ、互いの夕食を画面越しに見せ合うのが習慣になった。\n\n同じ年に働き方改革関連法が成立し、Kの会社でも有給取得が推奨されるようになったおかげで、月一度の往復は最後まで途切れなかった。三軒茶屋の部屋の防災リュックは、この年もわたしが一人で点検した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-06-29","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"働き方改革関連法が成立","summary":"時間外労働の罰則付き上限規制や有給休暇の取得義務化を含む法律が成立。長時間労働の是正を柱に、大企業では2019年4月から残業の上限規制が始まった。背景には過労死の社会問題化と、労働力人口の減少がある。\n\n前年に残業で体調を崩したわたしにとって、この法律は**少し遅れて届いた追い風**だった。遠距離中のKが月一度の帰京を続けられたのも、有給取得を促す職場の空気の変化と無関係ではなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 「働き方改革」の実現に向けて","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000148322.html"}]},{"date":"2019-05-01","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"元号が令和に改まる","summary":"平成から令和へ、1989年以来30年ぶりの改元。憲政史上初の退位による代替わりで、事前に新元号が公表されるという珍しい経過をたどった。10連休のなか、街のカウントダウンや記帳の列がニュースになった。\n\nふたりはこの年の秋に入籍するが、婚姻届の元号欄をどちらで書くか、という小さな会話が残っている。時代の区切りが個人の記録の書式にまで及ぶことを、静かに実感した年だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 新元号「令和」について（平成31年4月1日）","url":"https://www.kantei.go.jp/jp/98_abe/statement/2019/0401singengou.html"}]},{"date":"2019-11-03","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"入籍","summary":"遠距離が明けて半年、文化の日の朝に区役所の休日窓口へ婚姻届を出した。証人はあの写真展の主催者の友人に頼み、式は挙げなかった。夜は三軒茶屋の行きつけの定食屋で、いつも通りの夕食。\n\n改元の年の秋、日付欄に「令和元年」と書き、平成生まれのふたりが**初めて新しい元号を自分の手で書いた日**でもあった。式を挙げない代わりに翌年の春に小さな旅行を計画していたが、それは実現しなかった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"時代の空気","title":"都内企業のテレワーク導入率が6割超に","summary":"東京都の調査で、従業員30人以上の都内企業のテレワーク導入率が4月に6割を超えたとされる。3月時点では2割程度だった導入率が、緊急事態宣言を挟んで急上昇した。\n\nただし調査対象や時期、「導入」の定義によって数値は大きく異なり、中小企業や現場職種では実施率が低かったとする調査もある。ふたりの在宅勤務も、Kの会社が制作業でわたしが企画職だったからこそ可能だった。数字の背後には、在宅にできなかった人々の仕事がある。","detail":null,"credibility":"unverified","credibility_note":"調査主体・対象企業規模・調査時期によりテレワーク実施率の数値は大きく異なり、単一の値として確定しにくい。","sources":[{"title":"東京都: テレワーク導入率調査結果（2020年4月）","url":null}]},{"date":"2020-04-07","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"新型コロナで初の緊急事態宣言","summary":"東京など7都府県に、改正特措法に基づく初の緊急事態宣言。16日に全国へ拡大され、飲食店の時短、学校の休校、通勤の消失と、外出自粛と在宅勤務が一気に広がった。3月24日には東京五輪の延期も決まっていた。\n\nふたりの部屋も翌日から在宅勤務の場になり、6畳の居間にふたつの机が並んだ。前年に計画した旅行は取りやめになったが、この宣言下の2か月が、**ふたりにとって最も長く一緒に過ごした時間**になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣官房: 新型コロナウイルス感染症緊急事態宣言（令和2年4月7日）","url":"https://corona.go.jp/news/pdf/kinkyujitai_sengen_0407.pdf"}]},{"date":"2020-04-08","precision":"day","end_date":"2020-05-25","type":"period","layer":"仕事と暮らし","title":"6畳の居間でふたり在宅勤務","summary":"緊急事態宣言の翌日から解除まで、ひとつの部屋にふたつの机。Kはリビングのテーブル、わたしは寝室の窓際に折りたたみ机を置き、互いのオンライン会議の時間を朝に共有して声が重ならないよう調整した。買い物は週2回にまとめ、防災リュックの中身が初めて役に立った。\n\n宣言解除で出社が戻ったあとも、Kの会社は週3日の在宅を継続した。働く場所と暮らす場所の境目が、このときから曖昧になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-10-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"わたしがフリーランスに","summary":"8年勤めた会社を辞め、企画・編集の仕事を個人で受け始める。最初の取引先は元の勤め先。在宅勤務の1年半で、会社に行かなくても仕事が回ることを知ってしまった。\n\n2017年に体調を崩した経験と、遠距離の間に身についた自分で時間を組み立てる習慣が、決断の土台になった。収入は不安定になったが、朝の時間が自分のものになった。Kは反対も賛成もせず、開業届を出した日に少し良い米を買ってきた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-06-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"物価上昇で家計簿を始める","summary":"食用油や小麦製品の値上げが続き、初めて共有の家計簿アプリを入れた。2月のロシアによるウクライナ侵攻以降、エネルギーと食料の価格が上がり、この年の秋には円相場が一時1ドル150円台をつけた。\n\nフリーランスになって収入の波が大きくなったこともあり、ふたりの支出を可視化する必要が出てきた。家計簿を続けて分かったのは、いちばん減らせないのが本代とコーヒー代だということだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-01-01","precision":"year","end_date":null,"type":"point","layer":"時代の空気","title":"東京23区の新築マンション平均価格が1億円超","summary":"民間調査で、2023年の東京23区新築分譲マンション平均価格が初めて1億円を上回ったとされる。建築費の高騰と用地不足、都心回帰、海外投資家の需要などが背景に挙げられる。\n\nただし平均価格は大型高額物件の供給に引きずられやすく、調査機関や集計方法によって数値は異なる。ふたりがこの年に8か月かけて家を探し、結局は郊外寄りの中古物件を選んだ背景には、この価格帯の変化があった。","detail":null,"credibility":"disputed","credibility_note":"平均価格の水準は調査機関（不動産経済研究所など）や集計対象により差があり、「初の1億円超」の解釈も集計方法に依存する。","sources":[{"title":"不動産経済研究所: 首都圏新築分譲マンション市場動向 2023年（年間のまとめ）","url":null}]},{"date":"2023-04-01","precision":"day","end_date":"2023-11-30","type":"period","layer":"ふたりの出来事","title":"家探しの8か月","summary":"三軒茶屋の更新を機に、購入か賃貸かで迷い続けた春から秋。中古の団地、郊外の戸建て、賃貸のまま住み替える案。週末ごとに内見を重ねて20件を超え、週末はほぼ埋まった。\n\n都心の新築マンション価格が1億円を超えたと報じられた年で、最初から新築は選択肢になかった。11月に東京の西寄りにある築25年のマンションを買うことに決めた。決め手は、Kが「ここなら本棚を壁一面にできる」と言ったことだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-01","precision":"month","end_date":null,"type":"point","layer":"仕事と暮らし","title":"住宅ローンを固定金利で契約","summary":"日銀のマイナス金利解除と同じ月に住宅ローンを契約。金利の先行きが読めない中、迷った末に返済額が変わらない安心を優先して全期間固定を選んだ。フリーランスのわたしは審査に時間がかかり、契約はKの名義が中心になった。\n\n2022年から続けていた家計簿が返済計画を立てるうえで思いがけず役に立ち、家計簿の項目がひとつ増えた。10年前に缶コーヒーの値段の話をしていたふたりが、金利の話をしている。それが可笑しくもあり、少し感慨深くもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-03-19","precision":"day","end_date":null,"type":"point","layer":"時代の空気","title":"日銀がマイナス金利政策を解除","summary":"2016年から続いたマイナス金利政策を解除し、17年ぶりの利上げ。賃金と物価の好循環が見通せるとして、大規模金融緩和の枠組みが転換された。\n\n長期金利の上昇観測から、住宅ローンを固定にするか変動にするかという議論が身近な話題になった。前年秋に購入を決めたふたりのローン契約が同じ月に重なり、決断の重さを実感することになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本銀行: 金融政策の枠組みの見直しについて（2024年3月19日）","url":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2024/k240319a.pdf"}]},{"date":"2024-05-17","precision":"day","end_date":null,"type":"point","layer":"ふたりの出来事","title":"出会いから10年、神保町へ","summary":"新居への引っ越しを翌月に控えた土曜日、出会いから10年の日に神保町へ。あの写真展のギャラリーは別の店に変わっていたが、通りの古書店は変わらずにあり、同じ喫茶店で缶コーヒーではなく珈琲を飲んだ。\n\nこの10年で消費税は2度上がり、元号が変わり、感染症で街が静まり、金利が動いた。ふたりの記録は、**大きな流れの脇に置かれた小さな注釈**のようなものだ。玄関の赤い防災リュックは、次の家にも持っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"science-artificial-organs","title":"人工臓器の進化","description":"人工腎臓と人工心臓から人工内耳、iPS細胞、異種移植まで。機器と技術、患者と社会、制度と倫理の3層を重ね、「臓器を作る」という挑戦が医療と社会をどう変えてきたかを描く。","category":"science-nature","language":"ja","start_year":1943,"end_year":2024,"layers":[{"name":"機器と技術","color":"blue"},{"name":"患者と社会","color":"pink"},{"name":"制度と倫理","color":"teal"}],"events":[{"date":"1943-01-01","precision":"year","end_date":null,"type":"point","layer":"機器と技術","title":"コルフが回転ドラム式人工腎臓を完成","summary":"オランダの医師コルフが、ナチス占領下で回転ドラム式の人工腎臓を完成させ、腎不全患者の血液透析を試みた。1945年には急性腎不全の患者の救命に成功し、実用性を初めて示した。\n\n**壊れた臓器の機能を機械で代替する**という人工臓器医療の原点である。コルフは戦後米国へ渡り、人工心臓の開発にも関わっていく。ただし血液透析の原理実証には1910年代からの先行研究があり、「最初」の線引きには議論がある。","detail":null,"credibility":"disputed","credibility_note":"人工腎臓の「実用化第一号」の位置づけは、アベルらの動物実験(1913年)やハースの臨床試行(1924年)との関係で文献により異なる。","sources":[{"title":"Wikipedia: Willem Johan Kolff","url":"https://en.wikipedia.org/wiki/Willem_Johan_Kolff"}]},{"date":"1953-05-06","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"ギボンの人工心肺で世界初の開心術成功","summary":"米国の外科医ギボンが自ら開発した人工心肺装置を用い、心房中隔欠損をもつ18歳の患者の開心術に世界で初めて成功した。心臓を止めている間、機械が血液の循環と酸素化を代行した。\n\n心臓と肺という生命の中枢を一時的にせよ機械に置き換えられることを証明し、心臓外科という分野そのものを成立させた。のちの人工心臓開発も、この体外循環技術の延長線上にある。装置の開発をIBMが支援したことでも知られる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: John Heysham Gibbon","url":"https://en.wikipedia.org/wiki/John_Heysham_Gibbon"}]},{"date":"1958-10-08","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"世界初の植込み型心臓ペースメーカー移植","summary":"ストックホルムで外科医セニングが、技術者エルムクヴィストの設計した完全植込み型心臓ペースメーカーを、患者アーネ・ラーソンに移植した。体内に完全に埋め込まれた人工臓器デバイスの世界初の例とされる。\n\n最初の装置は数時間で故障したが、ラーソンは生涯で26台の装置を乗り継ぎ、2001年まで86歳の生涯を全うした。「機械と共に生きる患者」(患者と社会レイヤー)の最初の一人であり、植込み医療が一回の手術ではなく生涯の伴走であることを示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Arne Larsson","url":"https://en.wikipedia.org/wiki/Arne_Larsson"}]},{"date":"1960-03-09","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"スクリブナー・シャントで反復透析が可能に","summary":"シアトルのスクリブナーらが開発したテフロン製シャントが患者クライド・シールズに装着され、血管を毎回切開することなく繰り返し透析を受けることが初めて可能になった。\n\n人工腎臓は急性期の救命装置から、慢性腎不全の患者が**何年も生き続けるための日常の医療**へと変わった。しかし装置と病床は圧倒的に不足し、2年後には「誰に透析を受けさせるか」を選ぶシアトルの市民委員会(制度と倫理レイヤー)を生むことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Belding Hibbard Scribner","url":"https://en.wikipedia.org/wiki/Belding_Hibbard_Scribner"}]},{"date":"1962-11-09","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"ライフ誌がシアトルの「神の委員会」を報道","summary":"ライフ誌が、シアトルの透析センターで匿名の市民委員会が透析を受けられる患者を選別している実態を「彼らが誰が生き、誰が死ぬかを決める」と報じた。職業や家族構成、社会への貢献までが考慮されたという。\n\n**誰を生かすかを委員会が決める**という事態は、スクリブナーのシャント(機器と技術レイヤー)が生んだ希少な延命技術の配分問題そのものであり、医療資源の配分を社会に突きつけ、生命倫理学誕生の契機の一つとされる。","detail":null,"credibility":"unverified","credibility_note":"委員会の運営実態は当事者の証言とライフ誌の取材に基づいており、体系的に検証できる一次記録は限られている。","sources":[{"title":"LIFE (1962-11-09): They Decide Who Lives, Who Dies","url":null}]},{"date":"1967-12-03","precision":"day","end_date":null,"type":"point","layer":"患者と社会","title":"バーナードが世界初の心臓移植を実施","summary":"南アフリカのバーナードがケープタウンで世界初のヒト心臓移植を行い、患者ワシュカンスキーは18日間生存した。手術は世界的なセンセーションとなり、各国で追随する移植手術が相次いだ。\n\nしかし拒絶反応の壁で初期の移植成績は低迷し、ドナー不足と脳死判定をめぐる議論も噴出した。移植医療の限界こそが人工心臓の開発(機器と技術レイヤー)を加速させたという意味で、人工臓器の歴史に欠かせない転換点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Christiaan Barnard","url":"https://en.wikipedia.org/wiki/Christiaan_Barnard"}]},{"date":"1969-04-04","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"クーリーが世界初の完全人工心臓を植込み","summary":"ヒューストンの外科医クーリーが、心臓移植までのつなぎとして世界初の完全人工心臓(リオッタ心臓)を患者に植え込んだ。患者は64時間後に心臓移植を受けたが、その後死亡した。\n\n装置は上司格にあたるデベーキーの研究室で開発途上のものであり、無断使用だとする非難から米国外科史に残る確執へ発展した。功名心と患者の利益、実験と治療の境界という、**人工臓器開発の倫理の原型**がこの一件に現れている。","detail":null,"credibility":"disputed","credibility_note":"装置使用の承認をめぐるクーリーとデベーキーの主張は真っ向から対立しており、実施に至る経緯の詳細には諸説ある。","sources":[{"title":"Wikipedia: Domingo Liotta","url":"https://en.wikipedia.org/wiki/Domingo_Liotta"}]},{"date":"1972-10-30","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"米国、末期腎不全の透析費用を公的保険で負担","summary":"米国で社会保障法改正が成立し、末期腎不全患者の透析と腎移植の費用が年齢を問わずメディケアの給付対象となった。特定の疾患だけを対象とした異例の公的保険拡大である。\n\nシアトルの委員会が象徴した**命の選別を制度が引き取った**出来事であり、米国の透析患者はやがて数十万人規模に増えていく。一方で膨張し続ける費用は、人工臓器医療と保険財政の緊張という、現在まで続く問題の始まりでもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"US Social Security Amendments of 1972 (P.L. 92-603) ESRD Program","url":null}]},{"date":"1982-12-02","precision":"day","end_date":"1983-03-23","type":"period","layer":"患者と社会","title":"バーニー・クラーク、人工心臓で112日間生存","summary":"ユタ大学でデブリーズが、退役歯科医バーニー・クラークに恒久使用を前提とした完全人工心臓ジャービック7を植え込んだ。クラークは体外の大型駆動装置につながれたまま112日間生存し、その経過は連日世界に報道された。\n\n**人工心臓と生きた112日**は技術の到達点であると同時に、生活の質を欠いた延命の是非という問いを社会に残した。この経験は恒久型完全人工心臓への期待を、移植までの「つなぎ」や補助人工心臓(制度と倫理レイヤーの承認へ続く)へと方向転換させる契機となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Barney Clark","url":"https://en.wikipedia.org/wiki/Barney_Clark"}]},{"date":"1985-10-01","precision":"month","end_date":null,"type":"point","layer":"制度と倫理","title":"FDAが多チャンネル人工内耳を承認","summary":"米FDAが多チャンネル方式の人工内耳「ニュークリアス22」を成人向けに承認した。聴覚という感覚そのものを電極による神経刺激で代替する、感覚系人工臓器の本格的な実用化である。\n\n1990年には小児へ適用が拡大し、装用者は世界で数十万人規模に広がっていく。一方、ろう者コミュニティ(患者と社会レイヤー)からは「ろうは治すべき欠損なのか」という根源的な異議が提起され、人工臓器が文化やアイデンティティと衝突しうることを示した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cochlear implant","url":"https://en.wikipedia.org/wiki/Cochlear_implant"}]},{"date":"1994-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と倫理","title":"FDAが補助人工心臓ハートメイトを承認","summary":"米FDAが空気駆動式の左心補助人工心臓(LVAD)ハートメイトを、心臓移植までの「つなぎ」として承認した。心臓を丸ごと置き換えるのではなく、自己心臓を残して補助する現実路線が規制の場で公認された。\n\n2001年のREMATCH試験では移植不適応の患者への恒久使用でも薬物治療を上回る生存が示され、補助人工心臓は人工心臓医療の主流となっていく。バーニー・クラーク(患者と社会レイヤー)以後の方向転換が、制度に結実した出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ventricular assist device","url":"https://en.wikipedia.org/wiki/Ventricular_assist_device"}]},{"date":"2001-07-02","precision":"day","end_date":null,"type":"point","layer":"機器と技術","title":"完全植込み型人工心臓アビオコアの初症例","summary":"米アビオメッド社の完全植込み型人工心臓アビオコアが、ケンタッキー州で初めて患者に植え込まれた。経皮的なエネルギー伝送を採用し、体外へ管や配線を一切出さない初の完全人工心臓である。\n\n初例の患者は151日間生存したが、装置の大きさと血栓の問題から適用は広がらず、2006年に人道的機器免除の枠組みで承認(制度と倫理レイヤー)された後も植込みはごく少数にとどまった。恒久型完全人工心臓の技術的困難をあらためて示した症例といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: AbioCor","url":"https://en.wikipedia.org/wiki/AbioCor"}]},{"date":"2006-08-01","precision":"month","end_date":null,"type":"point","layer":"機器と技術","title":"山中らがiPS細胞の樹立を発表","summary":"山中伸弥と高橋和利が、4つの遺伝子の導入によりマウスの体細胞を多能性幹細胞(iPS細胞)へ初期化することに成功したと発表した。翌2007年にはヒトの細胞でも樹立に成功する。\n\n胚を使う倫理問題と拒絶反応を回避しながら**体細胞から臓器の材料を作る**道を開き、人工臓器の発想を「機械による代替」から「細胞による再建」へと広げた。2012年にノーベル賞を受賞し、日本では再生医療の法制度整備(制度と倫理レイヤー)が一気に進む契機となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Cell: Induction of Pluripotent Stem Cells from Mouse Embryonic and Adult Fibroblast Cultures by Defined Factors","url":"https://doi.org/10.1016/j.cell.2006.07.024"}]},{"date":"2011-04-01","precision":"month","end_date":null,"type":"point","layer":"制度と倫理","title":"日本で植込み型補助人工心臓が保険適用に","summary":"日本で植込み型補助人工心臓が薬事承認を経て保険適用となり、心臓移植の待機患者が装置とともに在宅で移植を待てる体制が始まった。それまで患者の多くは体外式装置で長期入院を強いられていた。\n\n臓器提供が極端に少ない日本では移植待機期間が数年に及び、補助人工心臓は事実上の長期治療として使われている。機器(機器と技術レイヤー)は同じでも、臓器提供をめぐる制度と文化の違いが、その使われ方を大きく変える例である。","detail":null,"credibility":"unverified","credibility_note":"国内の薬事承認と保険適用の正確な時期・対象機種の対応関係は、公的資料での確認が取り切れていない。","sources":[{"title":"日本循環器学会・関連学会: 植込み型補助人工心臓の適正使用に関する資料","url":null}]},{"date":"2014-09-12","precision":"day","end_date":null,"type":"point","layer":"患者と社会","title":"iPS細胞由来の網膜シート、世界初の移植","summary":"理化学研究所の高橋政代らのチームが、患者本人のiPS細胞から作製した網膜色素上皮シートを、加齢黄斑変性の患者に移植した。iPS細胞由来の組織がヒトに移植された世界初の症例である。\n\n山中らの樹立(機器と技術レイヤー)からわずか8年での臨床到達であり、再生医療関連法の施行前夜という制度の転換期に慎重な審査を経て行われた。視力回復ではなく安全性確認を主目的とする設計で、「細胞で臓器を作る」医療の現実的な一歩目となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"理化学研究所: iPS細胞由来網膜色素上皮シート移植手術の実施について(2014年9月)","url":null}]},{"date":"2016-03-23","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"人工気管移植のマッキャリーニ、不正が問題化","summary":"「幹細胞を播種した人工気管」の移植で脚光を浴びた外科医マッキャリーニをめぐり、患者の相次ぐ死亡と論文の誇張が問題化し、カロリンスカ研究所が解雇を発表した。のちに複数の論文が撤回され、2023年にはスウェーデンで有罪判決が確定した。\n\n再生医療への過剰な期待が研究審査と患者保護を甘くしたと総括されており、先端的な人工臓器・再生医療の臨床応用における研究不正の教訓として、各国の制度に影を落とした事件である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Paolo Macchiarini","url":"https://en.wikipedia.org/wiki/Paolo_Macchiarini"}]},{"date":"2021-09-25","precision":"day","end_date":null,"type":"point","layer":"制度と倫理","title":"脳死者の体でブタ腎臓の機能を実証","summary":"ニューヨーク大学の医療チームが、遺伝子改変ブタの腎臓を脳死状態の提供者の血管に接続し、54時間にわたって尿の生成が続き超急性拒絶反応が起きないことを確認した。\n\n家族の同意のもとで脳死者を移植研究の場とした点で、科学的な前進であると同時に新しい研究倫理の枠組みの試行でもあった。この検証が翌2022年の生体患者への異種心臓移植(患者と社会レイヤー)への橋渡しとなり、異種移植を臨床の射程に引き入れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NYU Langone Health: 遺伝子改変ブタ腎臓の機能実証に関する発表(2021年10月)","url":null}]},{"date":"2022-01-07","precision":"day","end_date":"2022-03-08","type":"period","layer":"患者と社会","title":"世界初のブタ心臓移植、ベネット氏60日の生存","summary":"メリーランド大学で、末期心不全のデービッド・ベネットに遺伝子改変ブタの心臓が移植された。生体の人間への異種心臓移植は世界初で、他に治療手段のない患者に対するFDAの拡大アクセス制度により実施され、ベネットは60日間生存した。\n\n**種の壁を越えた移植**は臓器不足の根本的な解決策として世界の注目を集めたが、死後の分析でブタ由来ウイルスの関与が示唆され、安全性の課題も残した。移植を受けられない患者の存在(制度と倫理レイヤー)が、この挑戦の背景にある。","detail":null,"credibility":"disputed","credibility_note":"死因は移植心の機能不全に至る複合的な要因が指摘されており、ブタサイトメガロウイルスの寄与の程度をめぐって見解が分かれる。","sources":[{"title":"University of Maryland School of Medicine: 遺伝子改変ブタ心臓移植に関する発表(2022年1月)","url":null}]},{"date":"2024-03-16","precision":"day","end_date":null,"type":"point","layer":"患者と社会","title":"生体患者への世界初のブタ腎臓移植","summary":"マサチューセッツ総合病院で、遺伝子改変ブタの腎臓が末期腎不全のリチャード・スレイマンに移植された。生体の人間へのブタ腎臓移植は世界初で、患者は一時的に透析を離脱して退院した。\n\nスレイマンは約2か月後に死去したが、病院は移植との直接の関連を否定している。コルフの人工腎臓(機器と技術レイヤー)から約80年、機械による代替から始まった人工臓器の歴史は、遺伝子改変された生体臓器という新しい選択肢に到達した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Massachusetts General Hospital: 遺伝子改変ブタ腎臓の生体移植に関する発表(2024年3月)","url":null}]}]},{"slug":"science-astronomy-turning-points","title":"天文学の転換点","description":"コペルニクスの地動説から望遠鏡、相対性理論、系外惑星、重力波、JWSTまで。観測技術・宇宙像・社会の3層を重ね、「宇宙の見え方」がひっくり返った瞬間を選んで並べた年表。","category":"science-nature","language":"ja","start_year":1543,"end_year":2023,"layers":[{"name":"観測と技術","color":"blue"},{"name":"宇宙像の転換","color":"purple"},{"name":"社会と宇宙観","color":"gold"}],"events":[{"date":"1543-01-01","precision":"year","end_date":null,"type":"point","layer":"宇宙像の転換","title":"コペルニクス「天球の回転について」刊行","summary":"コペルニクスの主著「天球の回転について」が刊行された。太陽を中心に地球が公転する体系を数学的に示し、古代以来の天動説に代わる選択肢を提示した。刊行は著者の死の直前だった。\n\n**地球を宇宙の中心から外した**この一冊が、のちの科学革命の起点とされる。ただし刊行当時は主に計算の道具として読まれ、教会が本格的に問題視する(社会と宇宙観レイヤー)のはガリレオの時代である。観測による裏付けまでには半世紀以上を要した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: De revolutionibus orbium coelestium","url":"https://en.wikipedia.org/wiki/De_revolutionibus_orbium_coelestium"}]},{"date":"1600-02-17","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"無限宇宙を説いたブルーノの処刑","summary":"修道士ジョルダーノ・ブルーノが、ローマで異端として火刑に処された。ブルーノは無限の宇宙と無数の世界を唱え、恒星は太陽と同じ存在であり、それぞれに世界が伴うと論じていた。\n\n後世には「宇宙論のための殉教者」として語られてきたが、裁判記録の多くは失われており、処刑理由に宇宙論がどの程度関わったのかの検証は難しい。宇宙像と信仰の衝突(1633年のガリレオ裁判)を先取りする出来事として、この年表に置かれる。","detail":null,"credibility":"unverified","credibility_note":"裁判記録の多くが現存せず、有罪理由のうち宇宙論的主張が占めた比重は検証が難しい。神学的異端が主因とする見解が有力である。","sources":[{"title":"Wikipedia: Giordano Bruno","url":"https://en.wikipedia.org/wiki/Giordano_Bruno"}]},{"date":"1609-08-01","precision":"month","end_date":"1610-03-13","type":"period","layer":"観測と技術","title":"ガリレオの望遠鏡観測と「星界の報告」","summary":"ガリレオが自作の望遠鏡を夜空へ向け、月面の凹凸、木星を回る4つの衛星、天の川が無数の星の集まりであることを次々に発見した。成果は1610年3月の「星界の報告」で公表され、欧州中を駆け巡った。\n\n木星の衛星は「すべての天体が地球を回るわけではない」ことの実証であり、コペルニクス説(宇宙像の転換レイヤー)を観測が初めて後押しした。**見る道具が宇宙像を変える**という天文学の型が、ここで確立した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sidereus Nuncius","url":"https://en.wikipedia.org/wiki/Sidereus_Nuncius"}]},{"date":"1633-06-22","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"異端審問所がガリレオに有罪宣告","summary":"ローマの異端審問所がガリレオに有罪を宣告し、地動説を「異端の疑いが濃厚」として撤回させた。ガリレオは終身の軟禁下に置かれ、主著「天文対話」は禁書目録に載った。\n\n科学と宗教的権威の衝突を象徴する事件として、以後何世紀も語り継がれることになる。ローマ教皇庁が裁判の誤りを公式に認めたのは1992年である。一方、軟禁下のガリレオが力学研究を続けたことは、ニュートン(宇宙像の転換レイヤー)への橋渡しとなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Galileo affair","url":"https://en.wikipedia.org/wiki/Galileo_affair"}]},{"date":"1687-07-05","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"ニュートン「プリンキピア」刊行","summary":"ニュートンの「自然哲学の数学的諸原理(プリンキピア)」が刊行された。万有引力と運動の法則によって、物体の落下から惑星の公転までを同じ数学で説明し、ケプラーの法則を導出してみせた。\n\n天上と地上を支配する法則は同じであるという統一は、天動説と地動説の対立を最終的に過去のものにした。以後160年間この力学は完璧に見え、そのわずかな揺らぎ(1846年の海王星発見、1915年の一般相対性理論)自体が次の転換点となっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Philosophiæ Naturalis Principia Mathematica","url":"https://en.wikipedia.org/wiki/Philosophi%C3%A6_Naturalis_Principia_Mathematica"}]},{"date":"1846-09-23","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"計算が予言した惑星、海王星の発見","summary":"ベルリン天文台のガレが、フランスのルヴェリエの計算が示した位置のすぐ近くに海王星を発見した。天王星の軌道のずれから未知の惑星の位置を割り出した、理論天文学の金字塔である。\n\n**紙と計算だけで惑星を予言した**この成功は、ニュートン力学の権威を頂点に押し上げた。発見の栄誉をめぐっては英国のアダムズの計算の先行を主張する声が上がり英仏間の論争となったが、近年の史料再検証では英国側の主張を割り引く見方が進んでいる。","detail":null,"credibility":"disputed","credibility_note":"アダムズの計算の先行性と精度をめぐる評価は英仏間で長く対立し、近年の史料再検証では英国側の主張を割り引く見解が有力である。","sources":[{"title":"Wikipedia: Discovery of Neptune","url":"https://en.wikipedia.org/wiki/Discovery_of_Neptune"}]},{"date":"1915-11-25","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"アインシュタインが一般相対性理論を発表","summary":"アインシュタインがプロイセン科学アカデミーで一般相対性理論の重力場方程式を発表した。重力を力ではなく時空の曲がりとして記述し、ニュートン以来の重力観を根本から置き換えた。\n\n水星の近日点移動という積年の謎を説明したうえ、光の湾曲と重力波という検証可能な予言を生んだ。前者は1919年の日食観測(社会と宇宙観レイヤー)で、後者はちょうど100年後の2015年の直接検出(観測と技術レイヤー)で確かめられることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: General relativity","url":"https://en.wikipedia.org/wiki/General_relativity"}]},{"date":"1919-05-29","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"日食観測が相対性理論を実証、世界的事件に","summary":"エディントンらの遠征隊が西アフリカとブラジルで皆既日食を観測し、太陽の重力による星の光の湾曲が一般相対性理論の予言と一致すると同年11月に発表した。「ニュートンの宇宙が覆された」と新聞が報じ、アインシュタインは一夜にして世界的な名声を得た。\n\n科学の成果がメディアを通じて大衆的事件となった最初期の例である。当時の観測精度は低く、データの取捨選択が結論を左右したのではという批判が長く続いたが、後年の再解析は結論をおおむね支持している。","detail":null,"credibility":"disputed","credibility_note":"観測精度の低さとデータ選択の妥当性への批判が長く存在したが、後年の再解析では結論はおおむね支持されている。","sources":[{"title":"Wikipedia: Eddington experiment","url":"https://en.wikipedia.org/wiki/Eddington_experiment"}]},{"date":"1923-10-06","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"ハッブル、アンドロメダが銀河系の外と示す","summary":"ハッブルがウィルソン山天文台の100インチ望遠鏡で、アンドロメダ「星雲」の中にセファイド変光星を発見し、その距離が銀河系の大きさをはるかに超えることを示した。変光星を意味する「VAR」の書き込みを興奮とともに感嘆符付きで記した写真乾板が残っている。\n\n宇宙は銀河系がすべてか否かを争った1920年の「大論争」に決着をつけ、**銀河系は無数の銀河の一つ**にすぎないことを確定させた。距離の物差しは、リービットが1912年に発見した変光星の周期光度関係だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edwin Hubble","url":"https://en.wikipedia.org/wiki/Edwin_Hubble"}]},{"date":"1929-03-15","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"宇宙膨張の観測的証拠、ハッブルの法則","summary":"ハッブルが、銀河は遠いものほど速く遠ざかるという距離と後退速度の比例関係を発表した。宇宙そのものが膨張していることの観測的な根拠であり、永遠不変の静的な宇宙像は放棄を迫られた。\n\n膨張を時間的に遡れば宇宙に「始まり」があることになり、ビッグバン宇宙論への道が開けた。同様の関係は1927年にルメートルが理論とともに導いており、先取権をめぐる長い議論の末、2018年に「ハッブル–ルメートルの法則」へと改称された。","detail":null,"credibility":"disputed","credibility_note":"法則の先取権については1927年のルメートルの論文との関係で議論が続き、IAUが2018年に名称変更を決議した経緯がある。","sources":[{"title":"Wikipedia: Hubble's law","url":"https://en.wikipedia.org/wiki/Hubble%27s_law"}]},{"date":"1957-10-04","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"スプートニク1号打ち上げ、宇宙時代の幕開け","summary":"ソ連が世界初の人工衛星スプートニク1号の打ち上げに成功した。直径58cmの球体が発する電波信号は世界中のアマチュア無線家にも受信され、米国に「スプートニク・ショック」と呼ばれる衝撃を与えた。\n\n宇宙が「観測するだけの場所」から「人類が機械を送り込む場所」へ変わった瞬間である。冷戦下の宇宙開発競争は、結果として宇宙望遠鏡や惑星探査機(観測と技術レイヤー)という、大気の外から宇宙を見る天文学の新しい道具を生み出していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sputnik 1","url":"https://en.wikipedia.org/wiki/Sputnik_1"}]},{"date":"1965-05-01","precision":"month","end_date":null,"type":"point","layer":"観測と技術","title":"宇宙マイクロ波背景放射の発見","summary":"ベル研究所のペンジアスとウィルソンが、アンテナの除去できない雑音として、全天からほぼ等方的に届くマイクロ波を検出した。これが宇宙誕生の名残の光、宇宙マイクロ波背景放射と同定された。\n\nビッグバン理論と定常宇宙論の論争に事実上の決着をつけ、宇宙論(宇宙像の転換レイヤー)を思弁から精密観測の科学へ変える突破口となった(1978年ノーベル賞)。この放射を予言していたプリンストンの研究チームとの同時期の遭遇は、科学史に残る偶然として知られる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Cosmic microwave background","url":"https://en.wikipedia.org/wiki/Cosmic_microwave_background"}]},{"date":"1967-11-28","precision":"day","end_date":null,"type":"point","layer":"観測と技術","title":"ジョスリン・ベルがパルサーを発見","summary":"ケンブリッジ大学の大学院生ジョスリン・ベルが、電波観測データの中に正確な周期で届くパルスを発見した。当初半ば冗談で「小さな緑の人(LGM-1)」と呼ばれた信号は、高速で自転する中性子星、パルサーと同定された。\n\n理論上の存在だった中性子星の実在を示し、極限状態の物理を観測できる高エネルギー天体物理学の扉を開いた。1974年のノーベル物理学賞は指導教員ヒューイッシュらに贈られ、発見者本人の除外は科学界の長い論争として残った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Jocelyn Bell Burnell","url":"https://en.wikipedia.org/wiki/Jocelyn_Bell_Burnell"}]},{"date":"1990-04-24","precision":"day","end_date":null,"type":"point","layer":"観測と技術","title":"ハッブル宇宙望遠鏡の打ち上げ","summary":"スペースシャトルによってハッブル宇宙望遠鏡が打ち上げられた。大気の揺らぎに邪魔されない軌道上からの観測は天文学の悲願であり、口径2.4mのこの望遠鏡は30年以上にわたり観測を続けることになる。\n\n直後に主鏡の研磨誤差が発覚して「欠陥望遠鏡」と酷評されたが、1993年の修理ミッションで性能を回復した。以後、宇宙膨張の加速の測定(宇宙像の転換レイヤー)などに貢献し、公開された画像は大衆の宇宙のイメージそのものを塗り替えた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Hubble Space Telescope","url":"https://en.wikipedia.org/wiki/Hubble_Space_Telescope"}]},{"date":"1995-10-06","precision":"day","end_date":null,"type":"point","layer":"宇宙像の転換","title":"太陽に似た恒星を回る初の系外惑星発見","summary":"スイスのマイヨールとケローが、ペガスス座51番星を回る惑星の発見を発表した。太陽に似た恒星を回る系外惑星の確認は史上初で、木星級の巨大惑星がわずか4日で公転するという、太陽系の常識の外にある姿だった。\n\n**太陽系が特別ではなくなった**転換点である。「灼熱の木星」の存在は惑星形成理論の書き換えを迫り、以後の探査で系外惑星は5000個を超えて見つかっていく。2019年、二人にはノーベル物理学賞が贈られた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 51 Pegasi b","url":"https://en.wikipedia.org/wiki/51_Pegasi_b"}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"宇宙像の転換","title":"宇宙膨張の加速とダークエネルギーの発見","summary":"遠方の超新星を観測していた2つの国際チームが、宇宙の膨張は減速ではなくむしろ加速しているという結果を相次いで発表した。加速を引き起こす未知の何かは「ダークエネルギー」と名付けられた。\n\n**膨張は加速していた**という発見は、宇宙の約7割が正体不明のエネルギーで占められることを意味し、物理学最大級の未解決問題を生んだ。観測自体は追試で確立して2011年のノーベル賞に至ったが、ダークエネルギーの正体は今も分かっていない。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Accelerating expansion of the universe","url":"https://en.wikipedia.org/wiki/Accelerating_expansion_of_the_universe"}]},{"date":"2015-09-14","precision":"day","end_date":null,"type":"point","layer":"観測と技術","title":"LIGOが重力波を初めて直接検出","summary":"米国の重力波検出器LIGOが、約13億光年彼方のブラックホール連星の合体から届いた重力波を史上初めて直接検出した。一般相対性理論(宇宙像の転換レイヤー)の予言から、ちょうど100年目の検証だった。\n\n電磁波に頼らず時空のさざ波そのものを捉える、**宇宙を「聴く」観測**の始まりである。2017年には中性子星合体を重力波と光の双方で捉えるマルチメッセンジャー天文学も実現し、検出は同年のノーベル物理学賞の対象となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Physical Review Letters: Observation of Gravitational Waves from a Binary Black Hole Merger","url":"https://doi.org/10.1103/PhysRevLett.116.061102"}]},{"date":"2019-04-10","precision":"day","end_date":null,"type":"point","layer":"社会と宇宙観","title":"ブラックホールの「影」を初めて撮像・公開","summary":"国際協力イベント・ホライズン・テレスコープ(EHT)が、楕円銀河M87の中心にある超大質量ブラックホールの「影」の画像を、世界6か所の同時会見で公開した。ブラックホールが直接撮像された史上初の例である。\n\n地球規模の電波望遠鏡網(観測と技術レイヤー)が成し遂げた成果であると同時に、オレンジ色のリングの画像が一夜で世界中に共有される、科学とメディアの新しい関係を示した。理論上の存在だったブラックホールは、誰もが見た「実在」になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Event Horizon Telescope","url":"https://en.wikipedia.org/wiki/Event_Horizon_Telescope"}]},{"date":"2021-12-25","precision":"day","end_date":"2022-07-12","type":"period","layer":"観測と技術","title":"JWST打ち上げから最初の科学画像公開まで","summary":"ジェイムズ・ウェッブ宇宙望遠鏡(JWST)が打ち上げられ、地球から150万kmのラグランジュ点への航行と口径6.5mの主鏡の展開・調整を経て、2022年7月12日に最初の科学画像が公開された。\n\n赤外線で宇宙最初期の銀河まで見通す設計で、開発には四半世紀と約100億ドルが投じられた。最初の画像公開は米大統領が参加する社会的イベント(社会と宇宙観レイヤー)となり、観測データは公開直後から初期宇宙の描像(宇宙像の転換レイヤー)を揺さぶり始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: James Webb Space Telescope","url":"https://en.wikipedia.org/wiki/James_Webb_Space_Telescope"}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"宇宙像の転換","title":"JWSTが初期宇宙に「重すぎる銀河」候補を発見","summary":"JWSTの初期観測データから、ビッグバン後5〜7億年の宇宙に、標準的な銀河形成モデルの予想を大きく上回る質量を持つとみられる銀河の候補が複数報告された。\n\n候補の多くは測光観測による赤方偏移の推定に基づいており、分光での確認や質量見積もりの下方修正も進行中で、宇宙論の修正が必要かどうかは未確定である。新しい観測装置(観測と技術レイヤー)が宇宙像を揺さぶるという、この年表で繰り返されてきた構図の最新の一幕といえる。","detail":null,"credibility":"unverified","credibility_note":"銀河候補の距離と質量は測光的推定に基づく初期報告であり、分光確認と再解析によって見積もりが変わる可能性が高い。","sources":[{"title":"Nature: A population of red candidate massive galaxies ~600 Myr after the Big Bang (Labbé et al., 2023)","url":null}]}]},{"slug":"science-astrophysics","title":"宇宙物理学の革命","description":"1915年の一般相対性理論から重力波とJWSTまで。理論の飛躍、それを検証した観測と装置、そして発見をめぐる人と社会の反応の3層を重ね、宇宙像がどう塗り替えられてきたかをたどる。","category":"science-nature","language":"ja","start_year":1915,"end_year":2023,"layers":[{"name":"理論","color":"purple"},{"name":"観測と装置","color":"blue"},{"name":"人と社会","color":"gold"}],"events":[{"date":"1915-11-25","precision":"day","end_date":null,"type":"point","layer":"理論","title":"アインシュタイン、一般相対性理論の場の方程式を発表","summary":"アインシュタインがプロイセン科学アカデミーで、重力を時空の曲がりとして記述する場の方程式を提出。10年に及ぶ試行の末、11月中に4回の講演で理論を完成させ、水星の近日点移動を説明した。\n\nほぼ同時期にヒルベルトも同等の方程式に到達しており、先取権をめぐる議論が長く続いた。理論の予言する光の湾曲は4年後の日食観測で検証され、膨張宇宙やブラックホールといった以後の理論展開はすべてこの方程式の解として現れる。","detail":null,"credibility":"disputed","credibility_note":"場の方程式の最終形をヒルベルトが先に得ていたかどうかについて、校正刷りの証拠をめぐり科学史家の見解が分かれる。","sources":[{"title":"Einstein, A. (1915) Die Feldgleichungen der Gravitation. Sitzungsberichte der Königlich Preußischen Akademie der Wissenschaften","url":null},{"title":"Corry, L., Renn, J. & Stachel, J. (1997) Belated Decision in the Hilbert-Einstein Priority Dispute. Science","url":null}]},{"date":"1919-05-29","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"エディントンらが日食観測で光の湾曲を確認","summary":"第一次大戦終結の翌年、英国の遠征隊がプリンシペ島とブラジル・ソブラルで皆既日食を観測し、太陽近くの星の位置ずれが一般相対論の予測と一致することを確認した。\n\n同年11月6日の王立協会での発表を英タイムズ紙が「科学の革命」と報じ、アインシュタインは一夜にして世界的な有名人となった。観測精度と写真乾板の取捨選択には後年疑問も出されたが、再解析では結論が支持されている。**理論と観測と社会的反響が半年のうちに連鎖した**典型例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Dyson, F. W., Eddington, A. S. & Davidson, C. (1920) A Determination of the Deflection of Light by the Sun's Gravitational Field. Philosophical Transactions of the Royal Society A","url":"https://doi.org/10.1098/rsta.1920.0009"}]},{"date":"1927-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"ルメートル、膨張宇宙モデルを提唱","summary":"ベルギーの司祭で物理学者のルメートルが、一般相対論の解として膨張する宇宙を導き、後退速度と距離の比例関係を予言。1922年のフリードマンの数学的解に続き、観測データと結びつけて宇宙の膨張率を見積もった。\n\nフランス語の地方誌に掲載されたため当初は注目されず、2年後のハッブルの観測が広く知られることになる。2018年にIAUが「ハッブル・ルメートルの法則」の呼称を推奨して先取権が再評価された。1931年には「原始的原子」の着想でビッグバン理論の原型も示している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Lemaître, G. (1927) Un Univers homogène de masse constante et de rayon croissant. Annales de la Société Scientifique de Bruxelles","url":null},{"title":"IAU (2018) Resolution B4 on a suggested renaming of the Hubble Law","url":null}]},{"date":"1929-03-15","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ハッブル、銀河の後退速度と距離の比例関係を発表","summary":"ウィルソン山天文台の100インチ望遠鏡で測った24個の銀河の距離と赤方偏移から、ハッブルが遠い銀河ほど速く遠ざかるという比例関係を導いた。1924年にアンドロメダが天の川の外の銀河だと示した観測に続く成果である。\n\n当時の距離尺度の誤りから比例定数は現在の約7倍と大きかったが、**膨張宇宙という理論レイヤーの予言に観測の裏付けを与え**、静的宇宙を信じていたアインシュタインも1931年に宇宙項を撤回した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Hubble, E. (1929) A relation between distance and radial velocity among extra-galactic nebulae. PNAS","url":"https://doi.org/10.1073/pnas.15.3.168"}]},{"date":"1933-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と装置","title":"ツビッキー、かみのけ座銀河団に「見えない質量」を指摘","summary":"ツビッキーがビリアル定理を用いてかみのけ座銀河団の質量を見積もり、銀河の速度分散から、光度から推定される質量を大幅に上回る「見えない質量」が必要だと指摘。「暗黒物質（dunkle Materie）」の語を使った。\n\n当時のハッブル定数が過大だったため推定倍率は現在より大きく、結論は数十年間ほとんど顧みられなかった。1970年代のルービンらの銀河回転曲線の観測で問題が再浮上し、暗黒物質は現代宇宙論の中心課題となる。","detail":null,"credibility":"unverified","credibility_note":"ツビッキーが示した質量比の数値は当時の距離尺度に依存し、現在の値とは大きく異なる。「暗黒物質発見」と位置づけるかどうかも評価が分かれる。","sources":[{"title":"Zwicky, F. (1933) Die Rotverschiebung von extragalaktischen Nebeln. Helvetica Physica Acta","url":null}]},{"date":"1935-01-11","precision":"day","end_date":null,"type":"point","layer":"人と社会","title":"エディントン、王立天文学会でチャンドラセカールの理論を公然と否定","summary":"白色矮星の質量に上限があるとする24歳のチャンドラセカールの王立天文学会での発表に対し、権威エディントンがその場で酷評した。チャンドラセカールは相対論的量子統計を白色矮星に適用し、太陽質量の約1.4倍を超えると重力を支えられないと示していた。\n\nこの否定は若い研究者の評価に長く影を落とし、彼は研究分野を変えた。上限質量は後に中性子星やブラックホールの形成理解の基礎となり、1983年のノーベル賞で報われる。**理論の正しさと学界の受容が数十年ずれた**事例として語り継がれる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Chandrasekhar, S. (1935) The highly collapsed configurations of a stellar mass (Second paper). Monthly Notices of the Royal Astronomical Society","url":null},{"title":"The Observatory, Vol. 58 (1935) Report of the RAS meeting of 1935 January 11","url":null}]},{"date":"1948-04-01","precision":"day","end_date":null,"type":"point","layer":"理論","title":"アルファーとガモフ、高温初期宇宙での元素合成を提唱","summary":"「αβγ論文」として知られる短報でアルファーとガモフが、膨張する高温高密度の初期宇宙で軽元素が作られたと論じ、ビッグバン元素合成の出発点となった。ガモフが冗談でベーテを著者に加えたことでも知られる。\n\n同年、アルファーとハーマンは初期宇宙の名残の放射が現在約5Kの背景放射として残っていると予言したが、観測可能とは考えられず忘れられた。1965年の宇宙マイクロ波背景放射の偶然の発見が、17年越しでこの予言を裏付けることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Alpher, R. A., Bethe, H. & Gamow, G. (1948) The Origin of Chemical Elements. Physical Review","url":"https://doi.org/10.1103/PhysRev.73.803"}]},{"date":"1965-07-01","precision":"month","end_date":null,"type":"point","layer":"観測と装置","title":"ペンジアスとウィルソン、宇宙マイクロ波背景放射を発見","summary":"ベル研究所のペンジアスとウィルソンが、衛星通信用ホーンアンテナの除去できない雑音の源を鳩の糞まで疑って探した末、あらゆる方向から届く約3Kの等方的な宇宙背景放射を確認した。\n\nプリンストンのディッケらはちょうど同じ放射を探す観測を準備中で、両グループの論文が同じ号に並んだ。**忘れられていた1948年の予言を17年越しで裏付ける**ビッグバン理論の決定的証拠となり、定常宇宙論は退場した。2人は1978年にノーベル物理学賞を受賞している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Penzias, A. A. & Wilson, R. W. (1965) A Measurement of Excess Antenna Temperature at 4080 Mc/s. The Astrophysical Journal","url":"https://doi.org/10.1086/148307"},{"title":"The Nobel Prize in Physics 1978","url":"https://www.nobelprize.org/prizes/physics/1978/summary/"}]},{"date":"1967-11-28","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ジョスリン・ベル、初のパルサーを検出","summary":"ケンブリッジの大学院生ジョスリン・ベルが、電波観測の記録紙に1.337秒周期の規則正しいパルスを見つけた。信号は当初「LGM-1（小さな緑の人）」と冗談交じりに呼ばれ、後に高速回転する中性子星と解釈される。\n\nこの発見により1930年代に理論的に予想された中性子星の実在が確かめられ、極限状態の物理を試す天体が手に入った。1974年のノーベル物理学賞は指導教官ヒューイッシュに贈られ、発見者のベルが対象外だったことは科学界での貢献の帰属をめぐる議論を呼んだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Hewish, A., Bell, S. J., Pilkington, J. D. H., Scott, P. F. & Collins, R. A. (1968) Observation of a Rapidly Pulsating Radio Source. Nature","url":"https://doi.org/10.1038/217709a0"}]},{"date":"1970-02-01","precision":"month","end_date":null,"type":"point","layer":"観測と装置","title":"ルービンとフォード、アンドロメダ銀河の平坦な回転曲線を報告","summary":"ルービンとフォードがアンドロメダ銀河の分光観測から、外縁部の星が予想より速く回り、回転速度がほぼ一定に保たれることを示した。光る物質だけなら外側ほど速度は落ちるはずで、見えない質量が銀河を包む可能性を観測から提起した。\n\n1970年代末までに多数の渦巻銀河で同じ傾向が確かめられ、1933年のツビッキーの指摘が銀河スケールでも成り立つことになった。暗黒物質の存在は以後の宇宙論の前提となり、その正体は2020年代でも未解明のままである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Rubin, V. C. & Ford, W. K. Jr. (1970) Rotation of the Andromeda Nebula from a Spectroscopic Survey of Emission Regions. The Astrophysical Journal","url":"https://doi.org/10.1086/150317"}]},{"date":"1974-03-01","precision":"day","end_date":null,"type":"point","layer":"理論","title":"ホーキング、ブラックホールが放射して蒸発すると予言","summary":"ホーキングが一般相対論と量子論を組み合わせた計算により、ブラックホールが量子効果で熱放射を出して質量を失い蒸発しうること、温度とエントロピーを持つことをNature誌の短報で示した。\n\n1972年のベッケンシュタインの着想を理論的に裏付け、量子重力と情報パラドックスという長い議論を生んだ。放射は極めて微弱で観測はされていないが、この理論の飛躍は1988年の著書「ホーキング、宇宙を語る」を通じて社会に広く届き、宇宙物理学の大衆化を象徴した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Hawking, S. W. (1974) Black hole explosions? Nature","url":"https://doi.org/10.1038/248030a0"}]},{"date":"1981-01-15","precision":"day","end_date":null,"type":"point","layer":"理論","title":"グース、インフレーション宇宙論を発表","summary":"グースが、初期宇宙が指数関数的に急膨張したとするインフレーション宇宙論を発表し、地平線問題と平坦性問題を同時に解決。素粒子論の相転移から着想され、宇宙の一様性と平坦さを説明し、量子ゆらぎが銀河の種になるという予測を生んだ。\n\nその予測は1992年のCOBE、2003年以降のWMAP、プランク衛星の観測で確かめられていく。同時期に佐藤勝彦、スタロビンスキー、リンデらも類似の考えを独立に提案しており、着想の先取権は単一には帰せない。","detail":null,"credibility":"disputed","credibility_note":"1979〜81年に佐藤勝彦、スタロビンスキー、カザナス、リンデらが独立に類似モデルを発表しており、誰を提唱者とするかは文献により異なる。","sources":[{"title":"Guth, A. H. (1981) Inflationary universe: A possible solution to the horizon and flatness problems. Physical Review D","url":"https://doi.org/10.1103/PhysRevD.23.347"},{"title":"Sato, K. (1981) First-order phase transition of a vacuum and the expansion of the Universe. Monthly Notices of the Royal Astronomical Society","url":null}]},{"date":"1990-04-24","precision":"day","end_date":"1993-12-13","type":"period","layer":"観測と装置","title":"ハッブル宇宙望遠鏡、打ち上げから光学系修理まで","summary":"スペースシャトルで打ち上げられたハッブル宇宙望遠鏡に、直後から像がぼやける主鏡の研磨誤差「球面収差」が見つかり、巨額計画への批判が噴出。1993年12月のエンデバー号による補正光学系の取り付けで本来の性能を取り戻した。\n\n以後、深宇宙撮像、宇宙年齢の決定、加速膨張の発見など数々の成果を生む。装置の失敗と回復が社会の科学予算への視線を左右した例であり、次世代望遠鏡JWSTの慎重な開発姿勢にも影響した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NASA: Hubble Space Telescope","url":"https://science.nasa.gov/mission/hubble/"},{"title":"NASA: STS-61 Mission Archives (First Hubble Servicing Mission)","url":null}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と装置","title":"遠方超新星の観測で宇宙の加速膨張を発見","summary":"リースらとパールマッターらの2チームが、Ia型超新星の距離測定から宇宙膨張が減速でなく加速していると報告。重力で膨張が減速するはずという理論レイヤーの前提を覆し、アインシュタインが撤回した宇宙項に相当する「ダークエネルギー」の存在を示唆した。\n\nハッブル宇宙望遠鏡の追観測が精度を支えた。宇宙の組成は通常物質約5%、暗黒物質約27%、ダークエネルギー約68%という現代の描像がここから固まり、3人は2011年にノーベル物理学賞を受賞した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Riess, A. G. et al. (1998) Observational Evidence from Supernovae for an Accelerating Universe and a Cosmological Constant. The Astronomical Journal","url":"https://doi.org/10.1086/300499"},{"title":"Perlmutter, S. et al. (1999) Measurements of Ω and Λ from 42 High-Redshift Supernovae. The Astrophysical Journal","url":"https://doi.org/10.1086/307221"}]},{"date":"2014-03-17","precision":"day","end_date":"2015-01-30","type":"period","layer":"人と社会","title":"BICEP2「原始重力波の痕跡」発表から撤回まで","summary":"南極の望遠鏡BICEP2がインフレーションの証拠となる原始重力波起源の偏光パターンを検出したと発表。記者会見と動画で「ノーベル賞級」と報じられ、理論の直接証拠として大きく取り上げられた。\n\nしかしプランク衛星との共同解析で信号の大部分は銀河系内の塵によるものと結論され、2015年1月に主張は事実上撤回された。査読前の発表と科学報道のあり方が問われる一方、誤りが公開の場で修正される科学の自己修正機能を示した事例でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"BICEP2 Collaboration (2014) Detection of B-Mode Polarization at Degree Angular Scales by BICEP2. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.112.241101"},{"title":"BICEP2/Keck and Planck Collaborations (2015) Joint Analysis of BICEP2/Keck Array and Planck Data. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.114.101301"}]},{"date":"2015-09-14","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"LIGO、重力波を初めて直接検出","summary":"改良後の観測開始直後、約13億光年先のブラックホール連星合体からの重力波GW150914を2台の検出器が同時に捉え、2016年2月11日に公表された。太陽の約36倍と29倍のブラックホールが合体し、約3太陽質量分のエネルギーが重力波として放出されたと解析された。\n\n**一般相対論が1916年に予言してからほぼ100年後の直接検出**である。2017年8月には中性子星合体GW170817が電磁波でも同時観測されてマルチメッセンジャー天文学が始まり、ワイス、バリッシュ、ソーンは2017年にノーベル物理学賞を受賞した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Abbott, B. P. et al. (LIGO Scientific Collaboration and Virgo Collaboration) (2016) Observation of Gravitational Waves from a Binary Black Hole Merger. Physical Review Letters","url":"https://doi.org/10.1103/PhysRevLett.116.061102"},{"title":"The Nobel Prize in Physics 2017","url":"https://www.nobelprize.org/prizes/physics/2017/summary/"}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"理論","title":"「ハッブル定数の不一致」が統計的に有意と報告される","summary":"近傍宇宙の距離はしごによる測定値と、宇宙背景放射から標準モデルで導く値のずれが約4σ超に達したと報告された。リースらのセファイド変光星と超新星による測定は毎秒毎メガパーセクあたり約74km、プランク衛星の背景放射に標準宇宙モデルを当てはめた値は約67kmで、誤差を超えて食い違う。\n\n原因が測定の系統誤差か、暗黒エネルギーの性質や初期宇宙の物理の見直しを迫る新物理かは決着していない。JWSTによる距離尺度の再検証が2020年代の焦点となっている。","detail":null,"credibility":"disputed","credibility_note":"不一致の原因が未知の系統誤差か標準宇宙モデルの不備かについて研究者間で見解が分かれ、独立した距離測定法ごとに値も異なる。","sources":[{"title":"Riess, A. G. et al. (2019) Large Magellanic Cloud Cepheid Standards Provide a 1% Foundation for the Determination of the Hubble Constant and Stronger Evidence for Physics beyond ΛCDM. The Astrophysical Journal","url":null},{"title":"Planck Collaboration (2020) Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics","url":"https://doi.org/10.1051/0004-6361/201833910"}]},{"date":"2020-10-06","precision":"day","end_date":null,"type":"point","layer":"人と社会","title":"ペンローズ、ゲンツェル、ゲズにノーベル物理学賞","summary":"ブラックホール形成が一般相対論の帰結であることの証明と、天の川銀河中心の超大質量天体の発見が評価され、ペンローズ、ゲンツェル、ゲズにノーベル物理学賞。ペンローズは1965年に特異点定理で形成の必然性を示し、ゲンツェルとゲズは1990年代からの星の軌道追跡で銀河中心に太陽の約400万倍の質量を突き止めた。\n\n前年2019年4月にはイベント・ホライズン・テレスコープがM87銀河中心のブラックホールの影を初めて撮像しており、**理論、観測、社会的評価が105年の時を経て一点に集まった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Physics 2020","url":"https://www.nobelprize.org/prizes/physics/2020/summary/"}]},{"date":"2021-12-25","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"ジェイムズ・ウェッブ宇宙望遠鏡を打ち上げ","summary":"口径6.5mの赤外線宇宙望遠鏡ジェイムズ・ウェッブが仏領ギアナからアリアン5で打ち上げられた。1996年の構想から25年、度重なる延期と予算超過を経て総額約100億ドルの計画が実現し、2022年7月に最初の科学画像が公開された。\n\n太陽・地球のラグランジュ点L2で赤外線観測を行い、最初期の銀河、系外惑星大気、星形成領域を高感度で捉える。ハッブルの後継として距離尺度の再検証にも投入され、2019年の「ハッブル定数の不一致」の解決も期待される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NASA: James Webb Space Telescope","url":"https://science.nasa.gov/mission/webb/"}]},{"date":"2023-02-22","precision":"day","end_date":null,"type":"point","layer":"観測と装置","title":"JWST、初期宇宙に予想外に重い銀河候補を報告","summary":"ビッグバンから約5〜7億年の時点で、標準モデルの予想を超える質量を持つとみられる銀河候補がNature誌に報告された。ラベらのチームは赤外線の色から推定した6個の候補天体の質量が、当時の宇宙にある通常物質の量から見て多すぎると指摘し、銀河形成理論の見直しの可能性を提起した。\n\nただし推定は測光に基づき、分光確認や活動銀河核の寄与、質量推定法の違いによって結論が変わりうる。追観測で一部の候補は距離や質量が下方修正されており、評価は継続中である。","detail":null,"credibility":"unverified","credibility_note":"候補天体の距離と質量は測光推定に基づき、分光追観測やモデルの違いで大きく変わりうるため、標準モデルとの矛盾は確定していない。","sources":[{"title":"Labbé, I. et al. (2023) A population of red candidate massive galaxies ~600 Myr after the Big Bang. Nature","url":"https://doi.org/10.1038/s41586-023-05786-2"}]}]},{"slug":"science-climate-100","title":"気候変動の100年","description":"1896年のアレニウスの計算から2020年代の1.5℃到達まで。科学の発見、大気と気温の観測記録、国際政策と社会運動の3層を重ね、知見が政策に届くまでの遅れと加速を読む。","category":"science-nature","language":"ja","start_year":1896,"end_year":2024,"layers":[{"name":"科学の発見","color":"blue"},{"name":"観測と現象","color":"teal"},{"name":"政策と社会","color":"orange"}],"events":[{"date":"1896-01-01","precision":"year","end_date":null,"type":"point","layer":"科学の発見","title":"アレニウス、CO2濃度と地表温度の関係を定量化","summary":"スウェーデンの化学者アレニウスが、大気中のCO2が倍増すると地表温度が数℃上昇するとの計算結果を発表。氷期の成因を探る中で、CO2の赤外吸収が地表温度に与える影響を手計算で見積もり、倍増時の昇温を5〜6℃とした。\n\nただし当時は温暖化を有益と考えており、産業起源のCO2が問題になるとは想定されていなかった。**濃度上昇が観測で示されるのは60年以上後**のキーリングの測定であり、知見と検証の長い時差の出発点にあたる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Arrhenius, S. (1896) On the Influence of Carbonic Acid in the Air upon the Temperature of the Ground. Philosophical Magazine","url":"https://doi.org/10.1080/14786449608620846"}]},{"date":"1958-03-01","precision":"month","end_date":null,"type":"point","layer":"観測と現象","title":"キーリング、マウナロアでCO2の連続観測を開始","summary":"国際地球観測年を機に、スクリップス海洋研究所のチャールズ・キーリングがハワイ・マウナロア山頂で大気中CO2濃度の高精度な定常観測を開始。開始時の濃度は約315ppmだった。\n\n観測は季節変動を伴いながら右肩上がりに増える「キーリング曲線」を生み、人為的なCO2増加を初めて連続データで示した。1960年代以降の理論研究や1965年の大統領諮問報告が依拠する基礎となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Scripps Institution of Oceanography: The Keeling Curve","url":"https://keelingcurve.ucsd.edu/"},{"title":"NOAA Global Monitoring Laboratory: Trends in Atmospheric Carbon Dioxide","url":"https://gml.noaa.gov/ccgg/trends/"}]},{"date":"1965-11-01","precision":"month","end_date":null,"type":"point","layer":"政策と社会","title":"米大統領科学諮問委員会がCO2の気候影響を報告","summary":"ジョンソン政権の科学諮問委員会が報告書「Restoring the Quality of Our Environment」の付録で、CO2増加による気候変化の可能性を政府に警告。キーリングの観測開始から7年で得られたデータを根拠に、2000年までにCO2が約25%増え気候に「著しい変化」を起こしうると述べた。\n\n米政府文書が温暖化に言及した最初期の例だが、**警告は具体的な政策には結びつかなかった**。科学の知見が政策の言葉になるまでの長い空白がここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"President's Science Advisory Committee (1965) Restoring the Quality of Our Environment, Appendix Y4","url":null}]},{"date":"1967-01-01","precision":"year","end_date":null,"type":"point","layer":"科学の発見","title":"真鍋淑郎らがCO2倍増時の昇温を約2.3℃と算出","summary":"真鍋淑郎とウェザラルドが、水蒸気フィードバックを含む放射対流平衡モデルにより、CO2倍増で地表が約2.3℃昇温すると計算。物理モデルによる初の定量評価で、以後の気候モデルの原型となった。\n\n同年代の観測レイヤーではキーリング曲線が10年分の上昇を刻んでおり、理論と観測が初めてかみ合い始めた時期にあたる。真鍋はこの業績を含む研究で2021年にノーベル物理学賞を受賞した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Manabe, S. & Wetherald, R. T. (1967) Thermal Equilibrium of the Atmosphere with a Given Distribution of Relative Humidity. Journal of the Atmospheric Sciences","url":null},{"title":"The Nobel Prize in Physics 2021","url":"https://www.nobelprize.org/prizes/physics/2021/summary/"}]},{"date":"1979-07-01","precision":"month","end_date":null,"type":"point","layer":"科学の発見","title":"チャーニー報告、気候感度を1.5〜4.5℃と推定","summary":"ジュール・チャーニーを長とする米科学アカデミーの委員会が、真鍋らとハンセンらのモデルを比較し、CO2倍増時の昇温を1.5〜4.5℃と評価。「無視できる昇温は考えにくい」と結論し、この推定幅は数十年にわたり基準となった。\n\n同年2月にはWMO主催の第1回世界気候会議がジュネーブで開かれており、科学者コミュニティが政策側へ警告を発し始めた年でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"National Research Council (1979) Carbon Dioxide and Climate: A Scientific Assessment","url":"https://doi.org/10.17226/12181"}]},{"date":"1988-06-23","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"ハンセン、米上院で「温暖化は始まっている」と証言","summary":"記録的猛暑と干ばつに見舞われた夏、NASAのジェームズ・ハンセンが米上院公聴会で、温室効果と観測された昇温の関係を「99%の確度」と述べ、温暖化が高い確度で進行中と証言した。\n\nこの証言は温暖化を米国の政治課題に押し上げ、同年11月のIPCC設立とも重なった。1979年の科学的評価から約10年を経て、**科学レイヤーの知見が政策レイヤーに本格的に接続した転換点**である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Senate Committee on Energy and Natural Resources, Hearing on the Greenhouse Effect and Global Climate Change (June 23, 1988)","url":null}]},{"date":"1990-08-01","precision":"month","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC第1次評価報告書を公表","summary":"1988年に設立されたIPCCが初の評価報告書をまとめ、人為的排出が温室効果を強めていることを確認。排出が続けば21世紀に10年あたり約0.3℃の昇温が起きうると予測する一方、観測された昇温の人為的寄与についてはなお不確実と慎重に記した。\n\nこの科学的評価が同年の第2回世界気候会議を経て、1992年の気候変動枠組条約の交渉に直接つながった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (1990) Climate Change: The IPCC Scientific Assessment (First Assessment Report)","url":"https://www.ipcc.ch/reports/"}]},{"date":"1992-06-01","precision":"month","end_date":null,"type":"point","layer":"政策と社会","title":"地球サミットで気候変動枠組条約が署名開放","summary":"リオデジャネイロの国連環境開発会議で、温室効果ガス濃度を「気候系に危険な人為的干渉を及ぼさない水準」で安定させることを究極目的とする気候変動枠組条約に各国が署名。条約は1994年に発効した。\n\n数値目標を伴わない枠組みだったため、具体的な削減義務は1997年の京都議定書へ持ち越された。IPCC第1次報告から2年、ハンセン証言から4年での国際合意である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: What is the United Nations Framework Convention on Climate Change?","url":"https://unfccc.int/process-and-meetings/the-convention/what-is-the-united-nations-framework-convention-on-climate-change"}]},{"date":"1997-12-11","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"京都議定書を採択","summary":"COP3で先進国に法的拘束力ある削減目標を課す京都議定書が採択。先進国全体で2008〜2012年に1990年比約5%、日本は6%の削減を約束した。米国は署名したが批准せず、発効は2005年まで待つことになる。\n\n採択の翌年、観測レイヤーでは強いエルニーニョで1998年が当時の観測史上最高気温を記録し、科学レイヤーでは過去1000年の気温復元が発表されるなど、政策・観測・科学が同時に動いた時期だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: Kyoto Protocol","url":"https://unfccc.int/kyoto_protocol"}]},{"date":"1998-04-01","precision":"month","end_date":null,"type":"point","layer":"科学の発見","title":"マンら、過去600年の気温復元「ホッケースティック」を発表","summary":"マンらが年輪などの代替指標から北半球の気温変動を復元し、20世紀の昇温が突出していると示した論文がNatureに掲載。翌年には復元期間が過去1000年に延長された。\n\nIPCC第3次報告（2001年）に採用されて温暖化の象徴的な図となった一方、統計手法や代替指標の選択をめぐる批判が続いた。2006年の米国研究評議会の検証では大筋の結論が支持されたが、中世の気温との比較の確からしさには議論が残った。","detail":null,"credibility":"disputed","credibility_note":"復元手法（主成分分析の中心化や代替指標の選択）に対する批判があり、20世紀以前の詳細な気温変動については専門家間で評価が分かれる。","sources":[{"title":"Mann, M. E., Bradley, R. S. & Hughes, M. K. (1998) Global-scale temperature patterns and climate forcing over the past six centuries. Nature","url":"https://doi.org/10.1038/33859"},{"title":"National Research Council (2006) Surface Temperature Reconstructions for the Last 2,000 Years","url":null}]},{"date":"2003-08-01","precision":"month","end_date":null,"type":"point","layer":"観測と現象","title":"欧州熱波、初めて人為的寄与が定量評価される","summary":"西欧を襲った記録的熱波で、フランスなどでは8月上旬に40℃前後が続き、高齢者を中心に数万人規模の超過死亡が生じた。\n\n翌2004年、ストットらは人為的な温室効果ガスがこの規模の熱波の発生リスクを少なくとも2倍にしたと推定し、個別の異常気象に人為的寄与を割り当てる「イベント・アトリビューション」の先駆けとなった。政策レイヤーでは京都議定書がなお未発効だった。","detail":null,"credibility":"unverified","credibility_note":"超過死亡数は約3万人から7万人超まで推計に幅があり、対象国や集計期間によって数値が異なる。","sources":[{"title":"Stott, P. A., Stone, D. A. & Allen, M. R. (2004) Human contribution to the European heatwave of 2003. Nature","url":"https://doi.org/10.1038/nature03089"},{"title":"Robine, J.-M. et al. (2008) Death toll exceeded 70,000 in Europe during the summer of 2003. Comptes Rendus Biologies","url":"https://doi.org/10.1016/j.crvi.2007.12.001"}]},{"date":"2007-02-02","precision":"day","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC第4次報告「温暖化は疑う余地がない」","summary":"IPCC第1作業部会が気候系の温暖化を「疑う余地がない」と断定し、20世紀半ば以降の昇温の大部分が人為的温室効果ガスによる可能性を90%以上と評価した。\n\n同年9月には北極海の夏季海氷面積が当時の観測史上最小を記録し、10月にはIPCCとアル・ゴアがノーベル平和賞を受賞。科学の断定、観測の異変、社会的評価が同じ年に重なった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (2007) Climate Change 2007: The Physical Science Basis. Summary for Policymakers","url":"https://www.ipcc.ch/report/ar4/wg1/"},{"title":"The Nobel Peace Prize 2007","url":"https://www.nobelprize.org/prizes/peace/2007/summary/"}]},{"date":"2008-01-01","precision":"year","end_date":"2012-12-31","type":"period","layer":"政策と社会","title":"京都議定書 第一約束期間","summary":"先進国が削減義務を負う5年間が始まる。日本は6%削減目標を森林吸収と海外クレジットを含めて達成した。\n\n**採択から11年を経てようやく始まった義務期間**だったが、米国不参加のうえカナダは2011年に離脱を表明し、排出が急増する中国・インドには義務がなかった。期間中の2009年COP15コペンハーゲンでは次期枠組みの合意に失敗し、全ての国が参加する仕組みへの転換は2015年のパリ協定まで持ち越された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: Kyoto Protocol","url":"https://unfccc.int/kyoto_protocol"},{"title":"環境省: 京都議定書目標達成計画の進捗状況","url":null}]},{"date":"2013-05-09","precision":"day","end_date":null,"type":"point","layer":"観測と現象","title":"マウナロアの日平均CO2濃度が初めて400ppmを超える","summary":"キーリングの観測開始から55年、マウナロアの大気中CO2の日平均値が400ppmの節目に到達した。1958年の観測開始時は約315ppmだった。\n\n400ppmは少なくとも数十万年ぶりの水準とされ、報道を通じて象徴的な数字として広まった。以後、年平均でも2015年に400ppmを超え、季節的な低下でも下回らなくなる。同年9月にはIPCC第5次報告が公表され、人為的影響の確からしさが「極めて高い」に引き上げられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NOAA Global Monitoring Laboratory: Trends in Atmospheric Carbon Dioxide","url":"https://gml.noaa.gov/ccgg/trends/"},{"title":"Scripps Institution of Oceanography: The Keeling Curve","url":"https://keelingcurve.ucsd.edu/"}]},{"date":"2015-03-01","precision":"month","end_date":"2016-05-31","type":"period","layer":"観測と現象","title":"2015〜16年の強いエルニーニョ","summary":"1997〜98年に匹敵する強いエルニーニョが発生。太平洋赤道域の海面水温上昇に伴い、地球温暖化の長期傾向に上乗せして世界平均気温を押し上げ、2015年、2016年が相次いで観測史上最高気温を更新した。\n\nエルニーニョは自然変動であり、温暖化の傾向に周期的に重なる。パリ協定の交渉が進んだ2015年12月はまさにこの現象の最盛期で、記録的な暖冬や熱波が交渉の背景にあった。","detail":null,"credibility":"disputed","credibility_note":"発生期間の定義は機関により異なり、気象庁は2014年夏〜2016年春、NOAAは2015年春〜2016年春を発生期間としている。","sources":[{"title":"NOAA Climate Prediction Center: Oceanic Niño Index (ONI)","url":"https://origin.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php"},{"title":"気象庁: エルニーニョ現象およびラニーニャ現象の発生期間","url":null}]},{"date":"2015-12-12","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"パリ協定を採択","summary":"COP21で全ての国が参加する枠組みに合意。産業革命前比で2℃を十分下回り、1.5℃に抑える努力を追求するとし、京都議定書と異なり各国が自ら削減目標を掲げて5年ごとに更新する仕組みをとった。\n\n1.5℃目標は島嶼国の要求で盛り込まれ、その科学的根拠の整理がIPCCに要請されて2018年の特別報告書につながる。採択の年、観測レイヤーでは強いエルニーニョのもと世界平均気温が初めて産業革命前比1℃を超えたと報告された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: The Paris Agreement","url":"https://unfccc.int/process-and-meetings/the-paris-agreement"}]},{"date":"2018-10-08","precision":"day","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC「1.5℃特別報告書」を公表","summary":"パリ協定の要請を受けたIPCCの特別報告書が1.5℃と2℃の影響の差を示し、1.5℃に抑えるには2030年頃までにCO2排出をほぼ半減、2050年頃に実質ゼロが必要と提示。現在のペースでは2030〜2052年に1.5℃に達すると見積もった。\n\n「2050年ネットゼロ」という時間軸はこの報告書から各国政策と企業目標に広がり、公表の翌年には若者の気候ストライキが世界に拡大。**科学の提示した期限が社会運動の言葉となった**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (2018) Global Warming of 1.5°C. Special Report","url":"https://www.ipcc.ch/sr15/"}]},{"date":"2019-09-20","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"世界気候ストライキ、数百万人規模に拡大","summary":"スウェーデンの学生の座り込みから広がった運動が、国連気候行動サミットの直前に世界150か国以上で一斉行動を実施。参加者は主催者発表で約400万人と、若者主導の気候運動として最大規模となった。\n\n運動は1.5℃特別報告書が示した「2030年まで」の期限を掲げ、科学レイヤーの数字がスローガンになった例といえる。同年、EUと英国は2050年カーボンニュートラルを法制化・宣言し、企業や自治体の目標設定も加速した。","detail":null,"credibility":"unverified","credibility_note":"参加人数は主催者発表に基づく推計で、独立した集計はなく、報道により300万〜760万人と幅がある。","sources":[{"title":"Fridays for Future: Global Climate Strike, September 2019","url":null},{"title":"The Guardian (2019-09-21) Climate crisis: 6 million people join latest wave of global protests","url":null}]},{"date":"2021-08-09","precision":"day","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC第6次報告「人間の影響が温暖化させたことは疑う余地がない」","summary":"IPCC第1作業部会が人為的影響を初めて断定的に記述。1990年の第1次報告が「不確実」とし、2007年に「可能性が非常に高い」、2013年に「極めて高い」としてきた表現が、20年間の観測とモデルの進歩に支えられ、ついに「疑う余地なし」に至った。\n\n同じ年、真鍋淑郎らが気候モデルの基礎を築いた功績でノーベル物理学賞を受賞。11月のCOP26では1.5℃目標の追求を確認し、石炭火力の段階的削減が初めて合意文書に入った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (2021) Climate Change 2021: The Physical Science Basis. Summary for Policymakers","url":"https://www.ipcc.ch/report/ar6/wg1/"}]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と現象","title":"2024年、初めて年平均で産業革命前比1.5℃を超過","summary":"観測史上最も暑い年となり、複数のデータセットで年平均気温が産業革命前比1.5℃を上回ったと報告された。2023年に続く記録更新で、エルニーニョと長期的な温暖化が重なった。\n\nパリ協定の1.5℃目標は20〜30年平均で評価されるため単年の超過は目標の失敗を意味しないが、**アレニウスの計算から128年、パリ協定から9年**で象徴的な水準に達した。政策レイヤーでは各国の削減目標の積み上げがなお2℃経路にも届いていない。","detail":null,"credibility":"disputed","credibility_note":"コペルニクスは1.60℃、WMOは1.55±0.13℃と報告し、データセットや基準期間の取り方によっては1.5℃をわずかに下回る評価もある。","sources":[{"title":"Copernicus Climate Change Service: Global Climate Highlights 2024","url":null},{"title":"WMO: State of the Global Climate 2024","url":null}]}]},{"slug":"science-deep-sea","title":"深海探査の記録","description":"チャレンジャー号の測深から有人・無人での最深部到達、熱水噴出孔の生態系、深海採掘をめぐる攻防まで。探査技術・生命の発見・資源と環境の3層で、人類と深海の150年を追う。","category":"science-nature","language":"ja","start_year":1872,"end_year":2023,"layers":[{"name":"探査と技術","color":"blue"},{"name":"深海の生命と発見","color":"green"},{"name":"資源・環境と社会","color":"orange"}],"events":[{"date":"1872-12-21","precision":"day","end_date":"1876-05-24","type":"period","layer":"探査と技術","title":"チャレンジャー号探検航海、海洋学の出発点","summary":"英国のチャレンジャー号が、3年半をかけて世界の海を巡る科学探検航海に出発した。約13万kmを航海して水深測定と生物採集を体系的に行い、4700種を超える新種を記録した。\n\n1875年にはマリアナ海溝で当時最深の8184mを測深し、のちに最深部は「チャレンジャー海淵」と名付けられる。50巻に及ぶ報告書は**海洋学という学問の誕生**を告げるものとされ、以後の深海探査はすべてこの航海を起点に語られる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Challenger expedition","url":"https://en.wikipedia.org/wiki/Challenger_expedition"}]},{"date":"1934-08-15","precision":"day","end_date":null,"type":"point","layer":"探査と技術","title":"バチスフィアで潜航深度923mに到達","summary":"生物学者ビービと技師バートンが、鋼鉄球「バチスフィア」に乗りバミューダ沖で潜航深度923mに達した。人類が深海の生物を生きたまま直接観察した最初の本格的な記録である。\n\n母船からケーブルで吊り下げられた直径1.4mの球からの観察は世間を熱狂させたが、ビービが報告した発光魚の一部は後年の調査で確認されておらず、観察の正確性をめぐる議論が残る。深海が「観察できる場所」になった出発点だった。","detail":null,"credibility":"disputed","credibility_note":"ビービが報告した未確認の発光魚など一部の観察記録は、後年の調査で裏付けが得られておらず真偽をめぐって議論がある。","sources":[{"title":"Wikipedia: Bathysphere","url":"https://en.wikipedia.org/wiki/Bathysphere"}]},{"date":"1938-12-22","precision":"day","end_date":null,"type":"point","layer":"深海の生命と発見","title":"「生きた化石」シーラカンスの発見","summary":"南アフリカの博物館学芸員ラティマーが、漁獲物の中から絶滅したはずのシーラカンスを発見した。約6600万年前に姿を消したと考えられていた魚類の生存が確認され、「生きた化石」として世界を驚かせた。\n\n同定は魚類学者スミスによる。深海がまだ知られざる生物の宝庫であることを象徴する発見となり、深海生物学への関心を大きく高めた。1952年に2例目が見つかり、1997年にはインドネシアで別種も発見されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Coelacanth","url":"https://en.wikipedia.org/wiki/Coelacanth"}]},{"date":"1943-01-01","precision":"year","end_date":null,"type":"point","layer":"探査と技術","title":"クストーらがアクアラングを開発","summary":"海軍士官クストーと技術者ガニアンが、需要に応じて空気を供給する自動給気式の潜水器具アクアラングを開発した。船やケーブルにつながれず、人間が自力で水中を移動できるスキューバ潜水の原型である。\n\n到達できる深度こそ浅いものの、「潜る」ことを研究者や映像作家の日常の手段に変えた。クストー自身の映像作品を通じて海への大衆的な関心(資源・環境と社会レイヤー)を生み、深海探査を支える人と技術の裾野はここから広がった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Aqua-Lung","url":"https://en.wikipedia.org/wiki/Aqua-Lung"}]},{"date":"1960-01-23","precision":"day","end_date":null,"type":"point","layer":"探査と技術","title":"トリエステ号、チャレンジャー海淵に到達","summary":"ピカールとウォルシュが深海艇トリエステ号でマリアナ海溝のチャレンジャー海淵に潜航し、水深約10,900mの世界最深部に人類として初めて到達した。海底での滞在は約20分だった。\n\n**人類が最深部に到達した最初の日**だが、当初発表の深度10,916mは計測の補正を経た値で、現代の測量では最深部は10,920m前後とされるなど数値には今も幅がある。次の有人到達までは、52年後のキャメロンを待つことになる。","detail":null,"credibility":"disputed","credibility_note":"到達深度は当初11,521mと発表された後に10,916mへ訂正され、現代の測量値(10,920m前後)とも差があるなど数値に幅がある。","sources":[{"title":"Wikipedia: Trieste (bathyscaphe)","url":"https://en.wikipedia.org/wiki/Trieste_(bathyscaphe)"}]},{"date":"1977-02-01","precision":"month","end_date":null,
