edibility_note":"原文は現存せず、制定の経緯と条文の内容は後世の引用と伝承からの復元による。","sources":[{"title":"Wikipedia: 十二表法","url":"https://ja.wikipedia.org/wiki/十二表法"}]},{"date":"0387-01-01 BC","precision":"year","end_date":null,"type":"point","layer":"戦争と拡大","title":"ガリア人によるローマ略奪","summary":"北から南下したガリア人(セノネス族)がアッリアの戦いでローマ軍を破り、市街を略奪した。カピトリヌスの丘だけが持ちこたえたと伝えられる。\n\n年代は伝承の前390年と、ギリシア側史料から推定される前387年ごろの間で議論がある。この屈辱はローマ人の集合的記憶となり、城壁の再建と軍制の見直しを促した。以後ローマは、敗北のたびに制度を作り直しながら拡大する国家となっていく。","detail":null,"credibility":"disputed","credibility_note":"略奪の年代は前390年(ローマ伝承)と前387年ごろ(ギリシア系史料)で史料により食い違う。","sources":[{"title":"リウィウス『ローマ建国以来の歴史』第5巻","url":null}]},{"date":"0264-01-01 BC","precision":"year","end_date":null,"type":"point","layer":"戦争と拡大","title":"第一次ポエニ戦争が始まる","summary":"シチリアの都市メッサナへの介入をきっかけに、ローマは西地中海の大国カルタゴと開戦した。23年に及ぶこの戦争は、ローマ初の本格的な海外戦争である。\n\n陸の国だったローマは艦隊をゼロから建造して海戦を制し、前241年の勝利でシチリアを最初の属州とした。**イタリアの都市国家が地中海帝国へ変わる入口**であり、属州の統治という都市国家の制度が想定しない課題が、政治体制レイヤーに持ち込まれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ポリュビオス『歴史』第1巻","url":null},{"title":"Wikipedia: ポエニ戦争","url":"https://ja.wikipedia.org/wiki/ポエニ戦争"}]},{"date":"0146-01-01 BC","precision":"year","end_date":null,"type":"point","layer":"戦争と拡大","title":"カルタゴ滅亡、地中海の覇権が確定","summary":"第三次ポエニ戦争の末、ローマ軍はカルタゴ市を陥落させて破壊した。ハンニバルに本土を蹂躙された第二次ポエニ戦争(前218〜前201年)の記憶が、徹底的な破壊を後押しした。同年にはギリシアの都市コリントスも破壊されている。\n\n地中海に敵はいなくなったが、長期の従軍で中小農民は没落し、属州から富と奴隷が流入して格差が広がった。勝利の代償が共和政の内側を蝕み始め、13年後のグラックスの改革につながる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ポリュビオス『歴史』第38巻","url":null},{"title":"Wikipedia: ポエニ戦争","url":"https://ja.wikipedia.org/wiki/ポエニ戦争"}]},{"date":"0133-01-01 BC","precision":"year","end_date":null,"type":"point","layer":"社会と文化","title":"ティベリウス・グラックスの改革と死","summary":"護民官ティベリウス・グラックスが、公有地の占有を制限し土地を失った市民に再分配する法を成立させたが、同年、反対派の元老院議員らに撲殺された。政治的暴力がローマ市街で公然と行われた最初の事例とされる。\n\n争点は**拡大の果実をだれに分配するか**だった。戦争(戦争と拡大レイヤー)が生んだ富が少数に集中する構造への異議は弟ガイウスに引き継がれ、以後約1世紀続く内乱の時代の底流となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"プルタルコス『英雄伝』ティベリウス・グラックス伝","url":null},{"title":"Wikipedia: Tiberius Gracchus","url":"https://en.wikipedia.org/wiki/Tiberius_Gracchus"}]},{"date":"0049-01-01 BC","precision":"month","end_date":null,"type":"point","layer":"戦争と拡大","title":"カエサル、ルビコン川を渡る","summary":"前49年1月、ガリア総督カエサルは元老院の武装解除命令を拒み、属州境のルビコン川を軍団とともに渡って内戦に踏み切った。\n\nガリア征服(前58〜前51年)で得た兵力と富と名声が、元老院の統制を超える個人を生んでいた。ポンペイウスとの内戦を制したカエサルは終身独裁官に就き、共和政の制度は事実上機能を停止する。拡大が生んだ軍事力の私物化という共和政末期の問題が、ここで頂点に達した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"スエトニウス『ローマ皇帝伝』カエサル伝","url":null},{"title":"Wikipedia: ガイウス・ユリウス・カエサル","url":"https://ja.wikipedia.org/wiki/ガイウス・ユリウス・カエサル"}]},{"date":"0044-03-15 BC","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"カエサル暗殺","summary":"前44年3月15日、終身独裁官カエサルがブルートゥスら元老院議員の一団に議場で刺殺された。共和政の回復を掲げた行動だったが、市民と軍はむしろカエサルの後継者の側に付いた。\n\n暗殺は共和政を蘇らせるどころか、オクタウィアヌスとアントニウスによる新たな内戦を招いた。制度を壊したのは一人の野心家ではなく、都市国家の制度のまま帝国を統治しようとする矛盾そのものだったことが、この結末に表れている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"プルタルコス『英雄伝』カエサル伝","url":null},{"title":"スエトニウス『ローマ皇帝伝』カエサル伝","url":null}]},{"date":"0031-09-02 BC","precision":"day","end_date":null,"type":"point","layer":"戦争と拡大","title":"アクティウムの海戦","summary":"前31年9月2日、オクタウィアヌスの艦隊がアントニウスとクレオパトラの連合艦隊をギリシア西岸のアクティウム沖で破った。約1世紀続いた内乱の時代の、事実上の終幕である。\n\n翌年エジプトは併合され、地中海の全域が単一の権力の下に置かれた。もはや戦う相手は外にも内にもいない。勝者への権力集中が完成したことで、政治体制レイヤーでは共和政から帝政への転換が現実の日程に上ることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: アクティウムの海戦","url":"https://ja.wikipedia.org/wiki/アクティウムの海戦"},{"title":"カッシウス・ディオ『ローマ史』第50巻","url":null}]},{"date":"0027-01-01 BC","precision":"year","end_date":null,"type":"point","layer":"政治体制","title":"オクタウィアヌス、アウグストゥスとなる","summary":"前27年、オクタウィアヌスは非常大権を元老院に返上する形式を取り、元老院から「アウグストゥス(尊厳なる者)」の称号を受けた。共和政の官職と権限を一身に集める元首政(プリンキパトゥス)の始まりである。\n\n王や皇帝という新しい官名を作らず、**共和政の形式をまとった君主政**を築いた点にこの体制の本質がある。軍と属州と財政を掌握した元首の下で、社会と文化レイヤーでは約2世紀の安定期が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"『神君アウグストゥス業績録』","url":null},{"title":"Wikipedia: アウグストゥス","url":"https://ja.wikipedia.org/wiki/アウグストゥス"}]},{"date":"0027-01-01 BC","precision":"year","end_date":"0180-01-01","type":"period","layer":"社会と文化","title":"パクス・ロマーナ（ローマの平和）","summary":"アウグストゥスの体制確立からマルクス・アウレリウス帝の死(180年)までの約200年は、地中海世界が比較的安定した「ローマの平和」と呼ばれる。街道と海運が結ばれ、都市文化と法とラテン語が帝国全域に広がった。\n\nこれは**際限ない拡大を止めたことと引き換えに得た安定**でもあった。辺境では戦争が続き、平和の恩恵には地域差も大きい。起点と終点の区切りは、近代の歴史叙述が与えた慣用である。","detail":null,"credibility":"disputed","credibility_note":"「パクス・ロマーナ」の期間の区切りは近代以降の歴史叙述上の慣用で、研究者により幅がある。","sources":[{"title":"Wikipedia: パクス・ロマーナ","url":"https://ja.wikipedia.org/wiki/パクス・ロマーナ"},{"title":"エドワード・ギボン『ローマ帝国衰亡史』","url":null}]},{"date":"0064-07-19","precision":"day","end_date":null,"type":"point","layer":"社会と文化","title":"ローマ大火とネロの再建","summary":"64年7月19日、大競技場付近から出た火はローマ市街の大半に広がり、6日以上燃え続けた。ネロ帝は被災者の救済と防火を織り込んだ都市再建を進める一方、放火の疑いをキリスト教徒に向けて処刑した。\n\nネロ自身の放火説は同時代から囁かれたが、タキトゥスら古代の著述家の間でも見解が割れ、確証はない。大火後の再建は耐火建材と広い街路を定めた都市計画として、以後の帝国の都市文化の基準となった。","detail":null,"credibility":"disputed","credibility_note":"出火原因は不明で、ネロ放火説・偶発説など古代の史料の間でも記述が分かれる。","sources":[{"title":"タキトゥス『年代記』第15巻","url":null},{"title":"Wikipedia: ローマ大火","url":"https://ja.wikipedia.org/wiki/ローマ大火"}]},{"date":"0235-01-01","precision":"year","end_date":"0284-01-01","type":"period","layer":"戦争と拡大","title":"軍人皇帝時代（3世紀の危機）","summary":"235年から284年までの約50年間に、各地の軍団に擁立された皇帝が20人以上乱立し、その多くが暗殺や戦死で倒れた。ゲルマン諸族とササン朝の圧力、疫病、通貨の悪化が重なった帝国の危機である。\n\n**帝国の重さに、一つの都市と一人の皇帝が耐えられなくなった**時代であり、危機を収拾したディオクレティアヌスは帝国を複数の正帝・副帝で分担統治する体制へ移行する。政治体制レイヤーの遷都と東西分割は、この経験の延長線上にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 軍人皇帝","url":"https://ja.wikipedia.org/wiki/軍人皇帝"},{"title":"エドワード・ギボン『ローマ帝国衰亡史』","url":null}]},{"date":"0313-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と文化","title":"ミラノ勅令、キリスト教を公認","summary":"313年、コンスタンティヌス1世とリキニウスは、キリスト教を含むすべての宗教の信仰の自由を認め、没収されていた教会財産の返還を命じた。ディオクレティアヌスの大迫害(303年開始)からわずか10年での転換である。\n\n迫害されていた少数派の宗教は、以後国家の保護を受けて急速に制度化し、4世紀末には事実上の国教となる。帝国の統合の軸が、都市と伝統祭祀からキリスト教会へと移っていく画期であった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ミラノ勅令","url":"https://ja.wikipedia.org/wiki/ミラノ勅令"},{"title":"エウセビオス『教会史』","url":null}]},{"date":"0330-05-11","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"コンスタンティノープル遷都","summary":"330年5月11日、コンスタンティヌス1世はビュザンティオンの地に建設した新都コンスタンティノープルを奉献した。帝国の重心は、経済的に豊かな東方の属州へと移る。\n\nローマ市はすでに3世紀から皇帝の常駐地ではなくなっており、遷都はその現実を制度として確定させたものだった。東の新都は以後1000年以上にわたり東ローマ(ビザンツ)帝国の首都として存続し、「ローマ」の名は都市を離れて受け継がれていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: コンスタンティノープル","url":"https://ja.wikipedia.org/wiki/コンスタンティノープル"}]},{"date":"0395-01-01","precision":"year","end_date":null,"type":"point","layer":"政治体制","title":"帝国の東西分割が固定化","summary":"395年、テオドシウス1世の死により帝国は二人の息子に分割相続され、以後、東西の宮廷が一人の皇帝の下に統合されることはなかった。分担統治自体は3世紀末からの慣行だが、これが事実上の最終分割となる。\n\n同じ帝国の二つの政府という建前は保たれたものの、財政も軍も別々に動き、ゲルマン諸族の移動(戦争と拡大レイヤー)への対応力に東西で大きな差が生じた。西の政府は、この後80年あまりで消滅する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: テオドシウス1世","url":"https://ja.wikipedia.org/wiki/テオドシウス1世"}]},{"date":"0410-08-24","precision":"day","end_date":null,"type":"point","layer":"戦争と拡大","title":"西ゴート族によるローマ略奪","summary":"410年8月24日、アラリック率いる西ゴート族がローマ市に入り、3日間にわたって略奪した。ガリア人以来およそ800年ぶりの首都陥落は、地中海世界に大きな衝撃を与えた。\n\n西ゴート族はもともと帝国内への移住を認められた集団であり、その処遇をめぐる交渉の破綻が略奪に至った。外敵の侵入というより、自らの軍事を外部集団に依存した帝国の構造の帰結である。アウグスティヌスが『神の国』を書く契機ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sack of Rome (410)","url":"https://en.wikipedia.org/wiki/Sack_of_Rome_(410)"}]},{"date":"0476-01-01","precision":"year","end_date":null,"type":"point","layer":"政治体制","title":"西ローマ帝国の終焉","summary":"476年、ゲルマン人傭兵隊長オドアケルが少年皇帝ロムルス・アウグストゥルスを退位させ、帝位の標章を東の皇帝に送った。西方で皇帝は立てられなくなり、この年が伝統的に「西ローマ帝国の滅亡」とされる。\n\n同時代人にとってこれは劇的な断絶ではなく、実権を失って久しい帝位の整理に近かった。**滅亡とは一つの事件ではなく、長い変質の過程につけられた名**である。東の帝国は、この後もほぼ1000年存続した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 西ローマ帝国","url":"https://ja.wikipedia.org/wiki/西ローマ帝国"}]}]},{"slug":"history-asian-financial-crisis","title":"アジア通貨危機","description":"1997年、タイの通貨切り下げから始まった危機は数か月でアジア全域と世界市場へ波及した。市場・政治・国際機関の3層で、グローバル資本時代の最初の大危機を追う。","category":"history-politics","language":"ja","start_year":1985,"end_year":2001,"layers":[{"name":"通貨と市場","color":"gold"},{"name":"政治と社会","color":"pink"},{"name":"国際機関と改革","color":"teal"}],"events":[{"date":"1985-09-22","precision":"day","end_date":null,"type":"point","layer":"通貨と市場","title":"プラザ合意、円高とアジアへの資本流入","summary":"先進5か国がドル高是正で合意し、円は急騰した。円高に直面した日本企業は生産拠点を東南アジアへ移し、域内への直接投資と融資が急拡大した。\n\nドルに連動する通貨制度を採る東南アジア諸国は、円高局面で輸出競争力を得て高成長を実現した。**ドルペッグと外資依存の成長**という危機の前提条件は、この資本流入の中で形づくられていった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Plaza Accord","url":"https://en.wikipedia.org/wiki/Plaza_Accord"}]},{"date":"1993-01-01","precision":"year","end_date":null,"type":"point","layer":"国際機関と改革","title":"世界銀行が報告書「東アジアの奇跡」刊行","summary":"世界銀行が東アジア8経済の高成長を分析する報告書を刊行し、「東アジアの奇跡」という言葉が定着した。政府の適切な介入と市場メカニズムの組み合わせが成長要因として論じられた。\n\n国際機関自身が域内経済への楽観を裏書きした形であり、4年後の危機は**楽観の絶頂で危機は準備される**ことの例証となった。高成長の陰で短期外貨建て債務が積み上がっていたことは、危機後に強調されるようになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"World Bank: The East Asian Miracle: Economic Growth and Public Policy (1993)","url":null}]},{"date":"1994-01-01","precision":"day","end_date":null,"type":"point","layer":"通貨と市場","title":"中国が為替レートを一本化、実質切り下げ","summary":"中国が公定レートと市場実勢レートを一本化し、人民元は対ドルで実質的に大きく切り下がった。輸出主導の成長が加速していく。\n\nこの切り下げが東南アジア諸国の輸出競争力を奪い通貨危機の遠因になったとする説があるが、影響の大きさをめぐる評価は分かれている。競争的切り下げの連鎖への懸念は、危機当時の各国の政策判断にも影を落とした。","detail":null,"credibility":"disputed","credibility_note":"元切り下げを通貨危機の遠因とする説には、貿易の多くが既に市場レートで行われており切り下げの実質幅は限定的だったとする有力な反論がある。","sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1996-01-01","precision":"year","end_date":null,"type":"point","layer":"通貨と市場","title":"タイの輸出失速と経常赤字の拡大","summary":"タイの輸出の伸びが急減速し、経常赤字はGDP比8%前後に達した。不動産向け融資の焦げ付きも表面化し、金融会社の経営不安が広がり始めた。\n\nドルペッグの下で短期外貨資金への依存が進み、外貨準備に対する短期債務の比率は危険水域にあったとされる。数値の把握自体が当時は不完全であり、**見えない脆弱性**こそが翌年の急激な資本逃避を増幅する要因となった。","detail":null,"credibility":"unverified","credibility_note":"経常赤字比率や短期債務の残高は資料により数値に幅があり、当時の統計整備の不備もあって確定的な値を示しにくい。","sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1997-05-01","precision":"month","end_date":"1997-06-30","type":"period","layer":"通貨と市場","title":"バーツへの投機攻撃と防衛戦","summary":"ヘッジファンドなどによるバーツ売りが本格化し、タイ中央銀行は為替介入と資本規制で防衛を試みた。介入により外貨準備は急速に枯渇していった。\n\n先物市場を含む介入の実態は当時公表されず、使用可能な準備がほぼ尽きていたことは後に判明する。投機筋の売り建て規模も推定の域を出ないが、この攻防の帰結が7月の変動相場制移行だった。","detail":null,"credibility":"unverified","credibility_note":"投機筋のポジション規模や介入額の詳細は推定と事後開示に基づいており、正確な全体像は確定していない。","sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1997-07-02","precision":"day","end_date":null,"type":"point","layer":"通貨と市場","title":"タイがバーツ変動相場制へ移行、危機の発端","summary":"タイ中央銀行がバーツのドルペッグを放棄し、バーツは即日15%超下落した。アジア通貨危機の始まりとされる日である。\n\n切り下げはフィリピン、マレーシア、インドネシアの通貨への売り圧力に即座に波及した。**一国の通貨制度の放棄が域内全体の資本逃避に転じる**という伝染の構図は、グローバル化した資本市場が示した新しい現実だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1997-08-14","precision":"day","end_date":null,"type":"point","layer":"通貨と市場","title":"インドネシア・ルピアが変動相場制へ","summary":"インドネシア中央銀行がルピアの管理変動制を放棄し、変動相場制へ移行した。ルピアはその後数か月で対ドル価値の大半を失う暴落となった。\n\n企業の対外債務の多くが為替ヘッジのないドル建てだったため、通貨暴落は即座に企業債務危機へ転化した。経済危機は物価急騰と失業を通じて、政治と社会レイヤーの動揺へつながっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1997-08-20","precision":"day","end_date":null,"type":"point","layer":"国際機関と改革","title":"IMFがタイ支援を承認","summary":"IMF理事会がタイへの39億ドルの融資を承認し、日本などの拠出を含む支援総額は約172億ドルとなった。緊縮財政と金融引き締め、金融部門の再建が条件とされた。\n\n危機対応の主導権がIMFに置かれた最初の事例だが、緊縮を柱とする処方箋は景気をかえって悪化させたとの批判を後に浴びる。支援条件の妥当性をめぐる論争は、以後の韓国・インドネシア支援でより激しくなっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IMF: IMF Approves Stand-By Credit for Thailand (Press Release, 1997-08-20)","url":null}]},{"date":"1997-11-01","precision":"month","end_date":null,"type":"point","layer":"国際機関と改革","title":"IMFインドネシア支援とAMF構想の挫折","summary":"IMF主導でインドネシアへの総額400億ドル規模の支援が組まれた。同じ秋、日本が提唱したアジア通貨基金(AMF)構想は米国とIMFの反対で撤回された。\n\n域内独自の危機対応枠組みの試みが**米国とIMF中心の秩序**の壁に阻まれた出来事であり、この挫折の経験は2000年のチェンマイ・イニシアティブ(同レイヤー)につながる。支援額は追加分を含めて段階的に変動した。","detail":null,"credibility":"disputed","credibility_note":"支援総額(約400億ドルとされる)は追加支援を含めて段階的に変動しており、資料により数値が異なる。","sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1997-11-24","precision":"day","end_date":null,"type":"point","layer":"通貨と市場","title":"山一証券が自主廃業、日本の金融危機","summary":"四大証券の一角である山一証券が、簿外債務の発覚を受けて自主廃業を決定した。同月には北海道拓殖銀行も破綻し、日本の金融システム不安は頂点に達した。\n\nアジア向け与信の大きな出し手だった日本の銀行は融資の回収を急ぎ、域内の資金逼迫を強めたとされる。危機はアジアの新興国だけでなく、バブル崩壊後の日本の金融の脆弱さも同時に露呈させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 山一證券","url":"https://ja.wikipedia.org/wiki/%E5%B1%B1%E4%B8%80%E8%A8%BC%E5%88%B8"}]},{"date":"1997-12-03","precision":"day","end_date":null,"type":"point","layer":"国際機関と改革","title":"韓国がIMFと580億ドルの支援で合意","summary":"外貨準備が底を突いた韓国が、IMFと当時史上最大の総額約580億ドルの支援で合意した。財閥改革、資本市場開放、労働市場改革が条件に含まれた。\n\nOECD加盟国の危機は、アジアの問題が世界の問題であることを示した。韓国では**「IMF体制」という言葉が時代の記憶**として定着した。金大中次期政権の下で改革が進み、2001年に借入は完済される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1998-01-15","precision":"day","end_date":null,"type":"point","layer":"政治と社会","title":"スハルトがIMF追加合意に署名、権威の失墜","summary":"インドネシアのスハルト大統領が追加のIMF合意文書に署名した。署名する大統領を腕組みして見下ろすカムドシュIMF専務理事の写真は、主権国家と国際機関の力関係の象徴として世界に流れた。\n\n合意された補助金削減は物価急騰を招き、30年続いた開発体制の正統性は経済成長の停止とともに崩れていった。通貨暴落(通貨と市場レイヤー)が政治体制の動揺へ転化する局面の始まりである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Suharto","url":"https://en.wikipedia.org/wiki/Suharto"}]},{"date":"1998-05-13","precision":"day","end_date":"1998-05-15","type":"period","layer":"政治と社会","title":"ジャカルタ暴動","summary":"学生射殺事件を契機にジャカルタで大規模な暴動が発生し、商店の略奪と放火が広がった。華人系住民が標的となり、死者は1000人を超えるとされる。\n\n暴動の組織性や治安部隊の関与は独立調査でも解明され切っておらず、被害の全容には諸説がある。経済危機が社会の亀裂を暴力として噴出させた事例であり、スハルト退陣(同レイヤー)の直接の引き金となった。","detail":null,"credibility":"disputed","credibility_note":"死者数(1000人超とされる)や暴動への組織的関与については、政府系調査と人権団体の報告の間で見解が分かれる。","sources":[{"title":"Wikipedia: May 1998 riots of Indonesia","url":"https://en.wikipedia.org/wiki/May_1998_riots_of_Indonesia"}]},{"date":"1998-05-21","precision":"day","end_date":null,"type":"point","layer":"政治と社会","title":"スハルト大統領が辞任、32年体制の終焉","summary":"全国に広がった抗議と与党内の離反を受け、スハルト大統領が辞任した。1960年代半ばから32年に及んだ体制は、通貨危機の発生から1年足らずで崩壊した。\n\n**通貨の崩壊が独裁の崩壊に至る**という本年表の縦の因果が最も鮮明に現れた出来事である。後任のハビビ政権下で民主化(レフォルマシ)が始まり、インドネシアは危機を経て民主国家へと転換していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Fall of Suharto","url":"https://en.wikipedia.org/wiki/Fall_of_Suharto"}]},{"date":"1998-08-17","precision":"day","end_date":null,"type":"point","layer":"通貨と市場","title":"ロシアがデフォルト、危機が世界へ","summary":"原油安と資本流出に見舞われたロシアが、短期国債の債務不履行とルーブルの実質切り下げに踏み切った。アジアで始まった新興国からの資本逃避は、欧州の大国にまで及んだ。\n\n「アジアの危機」が新興市場全体の危機へ拡大したことを示す出来事であり、翌月の米ヘッジファンドLTCM危機(同レイヤー)の直接の引き金となった。資本移動の自由化の速度をめぐる国際的な再考が始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1998 Russian financial crisis","url":"https://en.wikipedia.org/wiki/1998_Russian_financial_crisis"}]},{"date":"1998-09-01","precision":"day","end_date":null,"type":"point","layer":"政治と社会","title":"マレーシアが資本規制、アンワル副首相解任","summary":"マハティール首相がIMF型の処方箋を拒否して資本規制と固定相場制を導入し、翌日には経済政策で対立していたアンワル副首相を解任した。\n\n国際世論の批判を浴びた資本規制は後に一定の再評価を受け、危機対応の「正解」が一つではないことを示した。一方でアンワルの解任と逮捕は長期の政治対立を生み、経済政策の選択が権力闘争と不可分であることも露呈した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]},{"date":"1998-09-23","precision":"day","end_date":null,"type":"point","layer":"通貨と市場","title":"米ヘッジファンドLTCMの救済","summary":"ロシア危機で巨額損失を出したヘッジファンドLTCMに対し、ニューヨーク連銀の仲介で大手金融機関14社による約36億ドルの救済が組まれた。\n\nアジアの通貨売りから始まった連鎖が、ノーベル経済学賞受賞者を擁する米国の金融エリートを直撃した帰結である。グローバル金融の相互連関の深さを米当局自身が認めた出来事であり、システミックリスクという概念が広く共有された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Long-Term Capital Management","url":"https://en.wikipedia.org/wiki/Long-Term_Capital_Management"}]},{"date":"1998-10-01","precision":"month","end_date":null,"type":"point","layer":"国際機関と改革","title":"新宮澤構想、日本が300億ドルの支援表明","summary":"日本がアジアの危機国への総額300億ドルの資金支援枠組み(新宮澤構想)を表明した。AMF構想の挫折を経た、二国間ベースでの域内支援である。\n\n危機の初期に金融不安の「震源」との批判も受けた日本が、最大の支援国として存在感を示した局面である。この域内金融協力の実績はチェンマイ・イニシアティブ(同レイヤー)の基盤となり、アジアの通貨協力は多国間化へ向かう。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"財務省: アジア通貨危機支援に関する新構想(新宮澤構想)","url":null}]},{"date":"2000-05-06","precision":"day","end_date":null,"type":"point","layer":"国際機関と改革","title":"チェンマイ・イニシアティブ合意","summary":"ASEANと日中韓の蔵相がタイのチェンマイで、通貨危機時に外貨を融通し合う二国間スワップ網の構築で合意した。危機の教訓を制度化した域内協力である。\n\nAMF構想(同レイヤー)で挫折した域内セーフティネットが、IMFを補完する形で実現した。**危機が残した最大の遺産は制度**であり、この枠組みは後にマルチ化・拡大されて、現在も域内金融協力の柱となっている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Chiang Mai Initiative","url":"https://en.wikipedia.org/wiki/Chiang_Mai_Initiative"}]},{"date":"2001-08-23","precision":"day","end_date":null,"type":"point","layer":"国際機関と改革","title":"韓国がIMF借入を完済","summary":"韓国がIMFからの借入を予定より約3年早く完済した。金融・企業・労働・公共の4大改革と、金保有を持ち寄る国民運動を経た回復だった。\n\nV字回復は改革の成果とされる一方、非正規雇用の拡大や格差など「IMF体制」の社会的代償も残った。危機はアジア各国に外貨準備の大幅な積み増しという行動様式を残し、世界的な経常収支不均衡の一因となっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1997 Asian financial crisis","url":"https://en.wikipedia.org/wiki/1997_Asian_financial_crisis"}]}]},{"slug":"history-bakumatsu-meiji","title":"幕末から明治維新まで","description":"黒船来航から西南戦争まで、幕府と諸藩の権力の動き、思想と人物のうねり、列強との外交を三層で重ねる。同じ月に京都と下関と横浜で何が起きていたかを並べて読む年表。","category":"history-politics","language":"ja","start_year":1853,"end_year":1877,"layers":[{"name":"幕府と諸藩","color":"purple"},{"name":"思想と人物","color":"pink"},{"name":"外交と世界","color":"green"}],"events":[{"date":"1853-07-08","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"ペリー艦隊、浦賀に来航","summary":"米国東インド艦隊の蒸気船を含む4隻が浦賀沖に現れ、開国を求める大統領親書を幕府に渡した。旧暦では嘉永6年6月3日。米国は太平洋航路と捕鯨船の補給地を求めており、清のアヘン戦争敗北を知る幕府にとって列強の軍事力は現実の脅威だった。\n\n老中阿部正弘は親書を諸大名に示して意見を求め、**幕府の専決という慣行が崩れる**。ここから幕府と諸藩レイヤーの権力構造の変化と、思想と人物レイヤーの尊王攘夷論が同時に動き出す。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 黒船来航","url":"https://ja.wikipedia.org/wiki/黒船来航"}]},{"date":"1858-07-29","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"日米修好通商条約に調印、勅許を得ず","summary":"大老井伊直弼のもと、天皇の許可を得ないまま日米修好通商条約に調印した。領事裁判権と関税自主権の欠如を含む内容で、旧暦安政5年6月19日にあたる。ハリスは英仏が清との戦争(アロー戦争)を終えて日本に向かうと説き、調印を急がせた。同年中に蘭露英仏とも同様の条約を結ぶ(安政五カ国条約)。\n\n無勅許調印は朝廷と諸藩の反発を招き、幕府レイヤーでは安政の大獄、思想レイヤーでは攘夷論の激化として跳ね返る。不平等条項の改正は明治政府の長年の課題となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 日米修好通商条約","url":"https://ja.wikipedia.org/wiki/日米修好通商条約"}]},{"date":"1859-11-21","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"安政の大獄で吉田松陰が処刑される","summary":"幕政批判者を弾圧した安政の大獄で、松下村塾を主宰した吉田松陰が江戸で刑死した。享年30、旧暦安政6年10月27日。大獄は前年の無勅許調印(外交レイヤー)と将軍継嗣問題への批判を封じるため、井伊直弼が主導した。\n\n松陰の門下からは高杉晋作、久坂玄瑞、伊藤博文、山県有朋らが出ており、処刑は長州藩の若手を過激化させる転機となった。弾圧の反動は翌年の桜田門外の変(幕府レイヤー)として現れる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 安政の大獄","url":"https://ja.wikipedia.org/wiki/安政の大獄"},{"title":"Wikipedia（日本語版）: 吉田松陰","url":"https://ja.wikipedia.org/wiki/吉田松陰"}]},{"date":"1860-03-24","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"桜田門外の変、大老井伊直弼が暗殺される","summary":"水戸藩脱藩者らが江戸城桜田門外で大老井伊直弼を襲撃し、幕府の最高権力者が白昼に討たれた。旧暦安政7年3月3日、雪の朝の出来事で、前年の安政の大獄(思想レイヤー)への報復だった。\n\n幕府の権威は決定的に傷つき、以後幕府は朝廷との融和(公武合体)に舵を切り、和宮降嫁へ向かう。同じ年、外交レイヤーでは条約批准のため遣米使節が渡米し、咸臨丸が太平洋を横断していた。弾圧と開国が同時に進む幕府の二面性が表れている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 桜田門外の変","url":"https://ja.wikipedia.org/wiki/桜田門外の変"}]},{"date":"1862-09-14","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"生麦事件、薩摩藩士が英国人を殺傷","summary":"島津久光の行列を横切った英国人を薩摩藩士が斬り、1名が死亡した。旧暦文久2年8月21日。英国は幕府と薩摩に賠償と犯人処罰を要求し、翌1863年8月に鹿児島を砲撃する(薩英戦争)。\n\n薩摩は城下を焼かれたが英国側にも損害を与え、以後両者は接近して、薩摩は英国から軍艦や技術を得る。**攘夷の実行が結果的に開国派を生んだ逆説**であり、思想レイヤーの薩長同盟や、幕府レイヤーの倒幕への布石となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 生麦事件","url":"https://ja.wikipedia.org/wiki/生麦事件"},{"title":"Wikipedia（日本語版）: 薩英戦争","url":"https://ja.wikipedia.org/wiki/薩英戦争"}]},{"date":"1864-08-20","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"禁門の変、長州藩が御所で敗れる","summary":"前年の八月十八日の政変で京都を追われた長州藩が挙兵し、会津・薩摩藩兵と御所周辺で交戦して敗退した。旧暦元治元年7月19日。御所に発砲した長州は「朝敵」となり、幕府は第一次長州征討を発令する。京都の市街は戦火で広範囲が焼失した。\n\n同じ月、外交レイヤーでは英仏米蘭の四国艦隊が下関を砲撃しており、**長州は国内と国外の敵に同時に直面していた**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 禁門の変","url":"https://ja.wikipedia.org/wiki/禁門の変"}]},{"date":"1864-09-05","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"四国艦隊、下関を砲撃","summary":"英仏米蘭の連合艦隊が長州藩の砲台を攻撃・占拠した。旧暦元治元年8月5日から数日間で、長州が1863年に攘夷実行として関門海峡を通る外国船を砲撃したことへの報復だった。講和交渉には高杉晋作が臨み、賠償金は幕府が負担することになる。\n\n禁門の変で朝敵となった直後(幕府レイヤー)の敗戦で、長州藩内では攘夷の非現実性が認識され、翌年の高杉らの藩政掌握、そして薩長同盟(思想レイヤー)へと方向が変わる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 下関戦争","url":"https://ja.wikipedia.org/wiki/下関戦争"}]},{"date":"1866-03-07","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"薩長同盟、京都で成立","summary":"対立していた薩摩と長州が坂本龍馬らの仲介で提携し、倒幕への政治的枠組みが生まれた。旧暦慶応2年1月21日とされる。禁門の変で交戦した両藩だが、幕府による長州再征を前に、薩摩が長州を支援する六か条に合意した。合意内容は木戸孝允の書簡裏に龍馬が朱書きで裏書きした形で残る。\n\n同年、幕府レイヤーでは第二次長州征討が始まり、この同盟によって薩摩は出兵を拒む。外交レイヤーで英国が薩長に接近していた動きとも連動している。","detail":null,"credibility":"disputed","credibility_note":"成立日は1月21日説と22日説があり、龍馬の仲介がどの程度決定的だったかも研究者間で評価が分かれる。「同盟」の性格(軍事同盟か政治的提携か)についても議論がある。","sources":[{"title":"Wikipedia（日本語版）: 薩長同盟","url":"https://ja.wikipedia.org/wiki/薩長同盟"}]},{"date":"1866-07-18","precision":"day","end_date":"1866-09-29","type":"period","layer":"幕府と諸藩","title":"第二次長州征討、幕府軍が敗退","summary":"幕府は諸藩を動員して長州を攻めたが各方面で敗れ、将軍家茂の死を機に休戦した。旧暦慶応2年6月から8月。薩摩は薩長同盟(思想レイヤー)を理由に出兵を拒み、長州は英国経由で得た新式銃で対抗した。7月20日(旧暦)に将軍家茂が大坂城で死去し、停戦の勅命で終結する。\n\n同じ年、諸国で世直し一揆や打ちこわしが頻発し、物価高騰の中での動員は幕府への不満を高めた。年末に徳川慶喜が将軍となるが、幕府の軍事的威信と主導権はすでに失われていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 長州征討","url":"https://ja.wikipedia.org/wiki/長州征討"}]},{"date":"1867-01-30","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"孝明天皇崩御、政局の均衡が崩れる","summary":"公武合体を支持し倒幕に否定的だった孝明天皇が35歳で急逝し、翌月、明治天皇が14歳で践祚した。旧暦慶応2年12月25日。孝明天皇は攘夷を強く求めつつ幕府との協調を重んじ、倒幕派にとっては壁でもあった。\n\n崩御により幼い明治天皇のもとで岩倉具視ら倒幕派公家が復権し、幕府レイヤーの王政復古へ道が開く。同じ冬、徳川慶喜が将軍に就いており、幕府と朝廷の両方で指導者が交代した数週間だった。","detail":null,"credibility":"disputed","credibility_note":"死因は天然痘とする記録が公式だが、回復期に急変したことから毒殺説が古くから唱えられており、史料上の決着はついていない。","sources":[{"title":"Wikipedia（日本語版）: 孝明天皇","url":"https://ja.wikipedia.org/wiki/孝明天皇"}]},{"date":"1867-11-09","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"大政奉還、慶喜が政権を朝廷に返上","summary":"徳川慶喜が二条城で政権返上を上表した。旧暦慶応3年10月14日。土佐藩の建白を受けた決断で、武力倒幕の名分を先回りして奪う狙いがあったとされ、**同じ日に薩長には討幕の密勅が下されていた**。政権を返しても徳川家が諸侯会議の中心に残ることを想定していたとみられる。\n\n思想レイヤーではこの1か月後に坂本龍馬が暗殺され、翌月には王政復古の大号令が発せられる。260年余の幕府政治が形式上終わり、外交上も列強への対応主体が問われる状況となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 大政奉還","url":"https://ja.wikipedia.org/wiki/大政奉還"}]},{"date":"1867-12-10","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"坂本龍馬、京都近江屋で暗殺される","summary":"大政奉還の1か月後、坂本龍馬と中岡慎太郎が京都の宿・近江屋で襲われ死亡した。龍馬は33歳、旧暦慶応3年11月15日。龍馬は薩長同盟の仲介、海援隊、大政奉還につながる建白などに関わり、新政府構想「船中八策」の伝承でも知られる。\n\n幕府レイヤーで大政奉還が実現し、王政復古を目前にした時期の死であり、以後の政局は西郷・大久保・岩倉らの主導で武力による決着へ進む。外交レイヤーでは兵庫開港が翌月に迫っていた。","detail":null,"credibility":"disputed","credibility_note":"実行犯は京都見廻組とする説が有力だが、新選組説や薩摩藩関与説など諸説があり、確定していない。「船中八策」の史料的裏付けにも疑義がある。","sources":[{"title":"Wikipedia（日本語版）: 近江屋事件","url":"https://ja.wikipedia.org/wiki/近江屋事件"}]},{"date":"1868-01-03","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"王政復古の大号令、新政府樹立を宣言","summary":"岩倉具視・薩摩らが御所を固めて幕府と摂関の廃止を宣言し、同夜の小御所会議で慶喜の辞官納地を決めた。旧暦慶応3年12月9日。大政奉還後も残る徳川家の影響力を排除するための政変で、天皇親政の名の下に総裁・議定・参与の三職を置いた。\n\n孝明天皇の崩御(思想レイヤー)で倒幕派公家が復権していたことが背景にある。慶喜側は反発し、翌月の鳥羽・伏見の戦いで武力衝突に至る。外交面では列強がどちらを日本政府と認めるかが焦点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 王政復古 (日本)","url":"https://ja.wikipedia.org/wiki/王政復古_(日本)"}]},{"date":"1868-01-27","precision":"day","end_date":"1869-06-27","type":"period","layer":"幕府と諸藩","title":"戊辰戦争、鳥羽・伏見から箱館まで","summary":"新政府軍と旧幕府勢力の内戦。旧暦慶応4年1月3日の鳥羽・伏見に始まり、江戸開城、東北諸藩の戦いを経て、明治2年5月18日の箱館五稜郭の降伏で終結した。錦の御旗を掲げた新政府軍が緒戦で勝ち、慶喜は江戸へ退いて恭順、江戸城は西郷と勝海舟の交渉で無血開城となる。\n\n思想レイヤーでは戦争中の1868年4月に五箇条の御誓文が出され、外交レイヤーでは列強が局外中立を宣言して旧幕府への武器供給を止めた。会津・長岡などの戦いは深い遺恨を残した。","detail":null,"credibility":"unverified","credibility_note":"戦死者総数は約8,000人前後とする推計が多いが、資料により幅があり確定値はない。","sources":[{"title":"Wikipedia（日本語版）: 戊辰戦争","url":"https://ja.wikipedia.org/wiki/戊辰戦争"}]},{"date":"1868-04-06","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"五箇条の御誓文、新政府の基本方針を示す","summary":"「広く会議を興し万機公論に決すべし」など五か条を天皇が神々に誓う形で公布し、新政府の理念となった。旧暦慶応4年3月14日。由利公正の原案を福岡孝弟、木戸孝允が修正した。戊辰戦争(幕府レイヤー)のさなか、諸藩や列強に新政府の方向性を示す必要があった。\n\n「公論」の理念は後の自由民権運動が政府に約束の履行を迫る根拠にもなる。翌日には民衆向けの五榜の掲示が出され、キリスト教禁止など旧幕府の政策を継承した点で、理念と現実の差もあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 五箇条の御誓文","url":"https://ja.wikipedia.org/wiki/五箇条の御誓文"},{"title":"国立公文書館デジタルアーカイブ「五箇条の御誓文」","url":null}]},{"date":"1871-08-29","precision":"day","end_date":null,"type":"point","layer":"幕府と諸藩","title":"廃藩置県、藩が消え中央集権国家へ","summary":"261の藩を廃して府県を置き、知藩事を東京に集めた。1869年の版籍奉還で藩主は知藩事となっていたが、徴税と軍事は藩に残っていた。西郷隆盛の主導で薩長土三藩の兵1万を御親兵として集め、その武力を背景に一挙に実施し、抵抗なく断行された。\n\n旧藩主は東京居住を命じられ、藩債と家臣の俸禄は政府が引き継ぐ。数か月後の岩倉使節団派遣(外交レイヤー)は、**この改革で内政の骨格が固まったことを前提としていた**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 廃藩置県","url":"https://ja.wikipedia.org/wiki/廃藩置県"}]},{"date":"1871-12-23","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"岩倉使節団、横浜を出航","summary":"岩倉具視を全権に、大久保・木戸・伊藤ら政府首脳が米欧12か国を約1年10か月かけて視察した。旧暦明治4年11月12日出発。当初の目的だった条約改正の予備交渉は米国で行き詰まり、以後は制度・産業の視察に重点を移した。津田梅子ら女子留学生も同行している。\n\n使節団不在の間、留守政府は学制・徴兵令・地租改正を進め、帰国後には征韓論をめぐって明治六年政変(思想レイヤー)が起きる。幕府レイヤーの廃藩置県の直後という時期も注目される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 岩倉使節団","url":"https://ja.wikipedia.org/wiki/岩倉使節団"}]},{"date":"1873-01-01","precision":"day","end_date":null,"type":"point","layer":"外交と世界","title":"太陽暦を採用、明治5年12月3日が明治6年1月1日に","summary":"太陰太陽暦を廃止しグレゴリオ暦へ切り替え、明治5年12月3日が明治6年1月1日となった。改暦の布告は1872年12月9日(旧暦11月9日)と急で、1か月足らずで実施された。西洋との条約・貿易実務に合わせる狙いがあった。\n\nこの年表では、これ以前の出来事はすべて旧暦を新暦に換算した日付で表し、本文に旧暦を併記している。同じ年、幕府レイヤーの旧士族には徴兵令が、思想レイヤーでは政変が待っており、暦の切替は近代化の一区切りだった。","detail":null,"credibility":"unverified","credibility_note":"改暦を急いだ理由として「明治6年に閏月があり官吏の給与を13か月分払う財政負担を避けた」とする説は大隈重信の回想に基づき、一次史料による裏付けは限定的。","sources":[{"title":"Wikipedia（日本語版）: 明治改暦","url":"https://ja.wikipedia.org/wiki/明治改暦"}]},{"date":"1873-10-24","precision":"day","end_date":null,"type":"point","layer":"思想と人物","title":"明治六年政変、西郷・板垣らが下野","summary":"朝鮮への使節派遣をめぐり政府が分裂し、西郷隆盛、板垣退助、江藤新平ら参議が辞職して政府を去った。岩倉使節団(外交レイヤー)の帰国後、内治優先を唱える大久保・岩倉と、西郷の朝鮮派遣を決めていた留守政府が対立し、西郷の辞表は10月24日に受理された。\n\n翌年には板垣らが民撰議院設立建白書を出して自由民権運動が始まる。西郷は鹿児島に帰り、士族の不満の受け皿となる。ここから佐賀の乱、西南戦争(幕府と諸藩レイヤー)へと不平士族の反乱が続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（日本語版）: 明治六年政変","url":"https://ja.wikipedia.org/wiki/明治六年政変"}]},{"date":"1877-01-29","precision":"day","end_date":"1877-09-24","type":"period","layer":"幕府と諸藩","title":"西南戦争、最後の士族反乱","summary":"鹿児島の私学校党が西郷隆盛を擁して蜂起した。1月29日の私学校生徒による火薬庫襲撃に始まり、熊本城攻防、田原坂の激戦を経て、9月24日に鹿児島城山で西郷が自刃し終結した。\n\n徴兵制の政府軍が旧武士の反乱を鎮圧したことで、**武力による政変の時代は終わり**、以後の反政府運動は言論と自由民権運動(思想レイヤー)へ向かう。戦費は政府財政を圧迫し、不換紙幣の増発がインフレを招いた。同年、大久保利通は内務卿として殖産興業を進めていたが、翌年に暗殺される。","detail":null,"credibility":"unverified","credibility_note":"両軍の戦死者数は政府軍約6,400人、薩軍約6,500人前後とされるが、資料により数値に幅がある。","sources":[{"title":"Wikipedia（日本語版）: 西南戦争","url":"https://ja.wikipedia.org/wiki/西南戦争"}]}]},{"slug":"history-cold-war","title":"冷戦の構図","description":"1945年から1991年まで、核と軍事のエスカレーション、外交の駆け引きと危機、そして人々の暮らしと文化を三層で重ねる。同じ年に会議室と実験場と茶の間で何が起きていたかを並べる年表。","category":"history-politics","language":"ja","start_year":1945,"end_year":1991,"layers":[{"name":"軍事と核","color":"orange"},{"name":"外交と危機","color":"blue"},{"name":"文化と社会","color":"pink"}],"events":[{"date":"1945-08-06","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"広島に原子爆弾が投下される","summary":"人類史上初めて核兵器が実戦使用された。米国はマンハッタン計画で開発した原爆を広島(8月6日)と長崎(8月9日)に投下し、8月8日にはソ連が対日参戦、8月15日に日本は降伏する。死者数は年末までに広島で約14万人と推計されるが、幅がある。\n\n核の独占は米国の交渉力を高める一方でソ連に開発を急がせ、外交レイヤーの戦後秩序をめぐる対立を**「核を持つ二国の対峙」**へと変えた。核時代の始まりである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Atomic bombings of Hiroshima and Nagasaki","url":"https://en.wikipedia.org/wiki/Atomic_bombings_of_Hiroshima_and_Nagasaki"},{"title":"広島平和記念資料館","url":null}]},{"date":"1947-03-12","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"トルーマン・ドクトリン、封じ込め政策を表明","summary":"ギリシャ・トルコ支援を議会に求める演説で、共産主義の拡大に対抗する方針を宣言した。英国がギリシャ支援を続けられないと通告したことを受け、米国が肩代わりする形で表明された。\n\n前年のケナン長文電報とチャーチルの「鉄のカーテン」演説に続き、ヤルタ会談時の米ソ協調は封じ込めへ転換する。6月のマーシャル・プラン発表と合わせ、欧州の東西分断が固定化していく。文化と社会レイヤーでは同年秋、ハリウッドへの下院非米活動委員会の公聴会が始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Truman Doctrine","url":"https://en.wikipedia.org/wiki/Truman_Doctrine"}]},{"date":"1948-06-24","precision":"day","end_date":"1949-05-12","type":"period","layer":"外交と危機","title":"ベルリン封鎖と大空輸","summary":"西側占領地区の通貨改革に反発したソ連が、西ベルリンへの鉄道・道路・水路を遮断した。米英は食料と石炭を航空機で運び続けて約11か月にわたり200万人の都市を支え、最盛期には数十秒間隔で着陸した。封鎖は解除される。\n\n封鎖中の1949年4月4日にNATOが設立され、5月には西ドイツ基本法が公布される。**冷戦初の直接対決が武力に至らなかった経験は、以後の危機管理の原型となった**。同じ1949年8月、軍事レイヤーではソ連が初の核実験に成功する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Berlin Blockade","url":"https://en.wikipedia.org/wiki/Berlin_Blockade"}]},{"date":"1949-08-29","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"ソ連、初の核実験に成功","summary":"カザフスタンのセミパラチンスクでRDS-1が爆発し、米国の核独占は4年で終わった。米国の予測より早い成功で、スパイによる情報入手も一因とされる。米国は翌1950年1月に水爆開発を決定し、1952年に初の水爆実験、ソ連も1953年に続く軍拡競争が始まった。\n\n外交レイヤーではこの年にNATOが発足し、10月には中華人民共和国が成立した。核の均衡は以後、外交と危機レイヤーの全交渉の背景となり、文化と社会レイヤーでは核シェルターや民間防衛が日常に入り込む。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: RDS-1","url":"https://en.wikipedia.org/wiki/RDS-1"}]},{"date":"1950-02-09","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"マッカーシー、国務省に共産主義者がいると演説","summary":"上院議員マッカーシーが国務省に共産主義者がいるとして「名簿を持っている」と述べ、以後数年続く反共の告発と社会的圧力の象徴となった。ソ連核実験と中国革命の翌年、国内の「裏切り者」を探す空気が広がっていた。\n\nハリウッド、大学、公務員に忠誠審査とブラックリストが及び、公職を追われる人が相次ぐ。1954年の陸軍公聴会のテレビ中継で世論が離れ、上院はマッカーシーを非難する。**外交・軍事の緊張が国内社会の自由を狭めた**典型例であり、同年6月には朝鮮戦争が始まる。","detail":null,"credibility":"disputed","credibility_note":"演説で挙げた人数は「205人」と報じられたが、本人はのちに「57人」と主張し、原稿が残っていないため正確な発言内容は確定していない。","sources":[{"title":"Wikipedia（英語版）: McCarthyism","url":"https://en.wikipedia.org/wiki/McCarthyism"}]},{"date":"1950-06-25","precision":"day","end_date":"1953-07-27","type":"period","layer":"軍事と核","title":"朝鮮戦争、冷戦初の大規模な熱戦","summary":"38度線を越えた北朝鮮軍の南進で始まり、米国主導の国連軍が介入、中国義勇軍が参戦して膠着した。3年後に休戦協定が結ばれたが、平和条約は結ばれていない。マッカーサーの核使用検討は却下され、核保有国同士が直接対決を避ける「限定戦争」の型ができる。\n\n日本では特需で経済が回復し、警察予備隊が発足した。文化と社会レイヤーではマッカーシズムが最盛期にあり、外交レイヤーではスターリンの死(1953年3月)が休戦を後押しした。","detail":null,"credibility":"unverified","credibility_note":"軍人・民間人の死者数は数百万人規模とされるが、推計は資料により大きく異なり確定値がない。","sources":[{"title":"Wikipedia（英語版）: Korean War","url":"https://en.wikipedia.org/wiki/Korean_War"}]},{"date":"1961-08-13","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ベルリンの壁、一夜で築かれる","summary":"東ドイツが西ベルリンとの境界を有刺鉄線で封鎖し、後にコンクリートの壁となって分断の象徴が生まれた。1949年以降、東から西へ約250万人以上が流出しており、東独政府は人口流出を止めるために境界を閉じた。\n\n米国は西ベルリンの権利が侵されない限り軍事対応せず、10月にはチェックポイント・チャーリーで米ソ戦車が対峙した。同年4月にはガガーリンの宇宙飛行、5月にケネディの月着陸表明があり、宇宙と地上の両方で対抗が激しくなっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Berlin Wall","url":"https://en.wikipedia.org/wiki/Berlin_Wall"}]},{"date":"1962-10-16","precision":"day","end_date":"1962-10-28","type":"period","layer":"外交と危機","title":"キューバ危機、核戦争に最も近づいた13日間","summary":"キューバのソ連ミサイル基地を米国が発見。ケネディは空爆案を退けて海上封鎖を選び、フルシチョフとの書簡交渉の末、ソ連が撤去に応じて危機は回避された。米国のキューバ不侵攻約束に加え、トルコの米ミサイル撤去を密約していたことは後年まで公表されなかった。\n\n**軍事レイヤーの核軍拡が外交を極限まで追い込んだ**事例であり、翌年には米ソ間にホットラインが設けられ、部分的核実験禁止条約が結ばれる。以後の軍備管理交渉の出発点になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Cuban Missile Crisis","url":"https://en.wikipedia.org/wiki/Cuban_Missile_Crisis"}]},{"date":"1968-07-01","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"核拡散防止条約(NPT)が署名開放","summary":"核保有を米ソ英仏中の5か国に限り、他国の取得を禁じる核拡散防止条約が署名開放された。1970年発効、日本は1976年に批准。キューバ危機後の米ソは、核の拡散を共通の脅威とみなして協調した。条約は非核保有国に平和利用の権利を認め、核保有国に軍縮交渉義務を課す。\n\n署名開放の翌月、外交レイヤーではソ連軍がプラハの春を鎮圧しており、緊張緩和と抑圧が同時に進んでいた。翌1969年7月にはアポロ11号(文化と社会レイヤー)が月に着陸し、米ソ競争の一つの局面が閉じる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Treaty on the Non-Proliferation of Nuclear Weapons","url":"https://en.wikipedia.org/wiki/Treaty_on_the_Non-Proliferation_of_Nuclear_Weapons"},{"title":"外務省: 核兵器不拡散条約（NPT）","url":null}]},{"date":"1969-07-20","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"アポロ11号の月面着陸、世界が同時に見た中継","summary":"人類初の月面着陸が各国にテレビ中継され、冷戦の競争が同時に世界共通の体験にもなった。中継は日本を含む多くの国で放送され、日本時間では7月21日午前に当たる。\n\n1957年のスプートニクに始まる宇宙競争は、軍事レイヤーのICBM技術と表裏一体だった。同じ年に外交レイヤーではニクソン政権が発足し、米中接近の下準備が始まる。ソ連は同月に月ロケットN1の爆発事故を起こしていたが、公表されなかった。","detail":null,"credibility":"unverified","credibility_note":"「世界で約6億人が視聴した」とする数字が広く引用されるが、当時の視聴率調査に基づく推計であり、算出根拠は明確でない。","sources":[{"title":"Wikipedia（英語版）: Apollo 11","url":"https://en.wikipedia.org/wiki/Apollo_11"}]},{"date":"1972-02-21","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ニクソン訪中、米中が対立から接近へ","summary":"米大統領が初めて中華人民共和国を訪問し毛沢東と会談した。前年のキッシンジャー秘密訪問を経て実現し、上海コミュニケで台湾問題を棚上げしつつ関係正常化の方向を示した。中ソ対立を背景に、冷戦の二極構造が揺らいだ。\n\n3か月後の5月にはニクソンがモスクワを訪れ、SALT I(第一次戦略兵器制限交渉)とABM条約に署名する。中国と関係を結ぶことでソ連に圧力をかける三角外交の始まりであり、日本でも同年9月に日中国交正常化が実現した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: 1972 visit by Richard Nixon to China","url":"https://en.wikipedia.org/wiki/1972_visit_by_Richard_Nixon_to_China"}]},{"date":"1979-12-24","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"ソ連軍、アフガニスタンに侵攻","summary":"ソ連軍が12月24日に空輸を開始し、27日にアミン政権を倒してカルマル政権を樹立した。デタントは終わり、米国は穀物禁輸とモスクワ五輪ボイコット(文化と社会レイヤー・1980年)で応じ、SALT IIの批准は見送られた。\n\nムジャヒディンへの米国・パキスタン・サウジの支援が続き、ソ連軍は1989年まで撤退できず、経済と体制の疲弊を深める。同じ12月にNATOは中距離核ミサイルの欧州配備を決めており(二重決定)、1980年代前半の「新冷戦」がここから始まる。","detail":null,"credibility":"disputed","credibility_note":"侵攻の動機については、周辺同盟国の崩壊を防ぐ防衛的判断とみる説と、南方への勢力拡張とみる説があり、ソ連側史料の公開後も評価が分かれる。","sources":[{"title":"Wikipedia（英語版）: Soviet–Afghan War","url":"https://en.wikipedia.org/wiki/Soviet%E2%80%93Afghan_War"}]},{"date":"1980-08-31","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"ポーランドで「連帯」が誕生","summary":"グダニスク造船所のストライキが政府との協定に至り、東側で初の独立自主管理労組「連帯」が認められた。食料価格の値上げに端を発した労働者の抗議を、ワレサらが組織化した。\n\n1975年のヘルシンキ最終文書で東側諸国も人権条項に署名しており、これが市民の運動の根拠となる。翌1981年12月に戒厳令で非合法化されるが地下で存続し、1989年の円卓会議と部分自由選挙で政権交代を導く。軍事レイヤーのアフガン侵攻で西側の対ソ姿勢が硬化していた時期でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Solidarity (Polish trade union)","url":"https://en.wikipedia.org/wiki/Solidarity_(Polish_trade_union)"}]},{"date":"1983-11-07","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"NATO演習「エイブル・アーチャー83」","summary":"核攻撃手順を含むNATO指揮所演習が11月7日から11日にかけて行われ、ソ連側が本物の攻撃準備と疑ったとされる。同年3月のレーガンの「悪の帝国」演説とSDI(戦略防衛構想)発表、9月の大韓航空機撃墜で緊張は高まっており、9月26日にはソ連の早期警戒システムが米ミサイル発射を誤検知している。\n\n演習は無事終わったが、後年の情報公開で東側の警戒レベルが上げられていたことが判明した。文化と社会レイヤーでは同月、核戦争を描くドラマ「ザ・デイ・アフター」が放送される。","detail":null,"credibility":"disputed","credibility_note":"ソ連指導部が実際に先制攻撃を懸念していた程度は、二重スパイの証言と公開文書の解釈をめぐって研究者間で評価が分かれる。","sources":[{"title":"Wikipedia（英語版）: Able Archer 83","url":"https://en.wikipedia.org/wiki/Able_Archer_83"}]},{"date":"1983-11-20","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"テレビ映画「ザ・デイ・アフター」全米放送","summary":"核戦争後の米中西部を描くABCのテレビ映画が全米放送され、視聴者は1億人規模とされる。軍事レイヤーのエイブル・アーチャー演習の直後という時期で、核への不安が可視化された。\n\nレーガンは日記に「大いに気が滅入った」と記し、後年INF条約への姿勢に影響したと自ら回想しており、**茶の間の不安が軍縮の交渉に跳ね返った**事例といえる。欧州では中距離核ミサイル配備に反対する大規模デモが続き、日本でも反核運動が広がっていた。翌1984年、レーガンは対ソ対話への転換を演説で示し、1985年のゴルバチョフ登場を迎える。","detail":null,"credibility":"unverified","credibility_note":"視聴者数「約1億人」は放送局の推計に基づき、正確な視聴者数は確定していない。レーガンの日記の記述は公刊されている。","sources":[{"title":"Wikipedia（英語版）: The Day After","url":"https://en.wikipedia.org/wiki/The_Day_After"}]},{"date":"1985-03-11","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ゴルバチョフ、ソ連共産党書記長に就任","summary":"54歳の書記長が誕生し、ペレストロイカとグラスノスチを掲げ、対外的には「新思考外交」で軍縮に転じた。アフガニスタンの戦費と軍事支出、石油価格の下落でソ連経済は行き詰まっていた。\n\n同年11月にレーガンとジュネーブで会談し、1986年のレイキャビク会談を経て1987年のINF条約(軍事レイヤー)に至る。1986年4月のチェルノブイリ事故は情報公開の必要性を印象づけた。文化と社会レイヤーでは検閲の緩和が東欧の市民運動を勢いづけることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Mikhail Gorbachev","url":"https://en.wikipedia.org/wiki/Mikhail_Gorbachev"}]},{"date":"1987-12-08","precision":"day","end_date":null,"type":"point","layer":"軍事と核","title":"INF全廃条約に米ソが署名","summary":"射程500〜5,500kmの地上発射ミサイルを全廃する条約に、ワシントンでレーガンとゴルバチョフが署名した。核兵器の一カテゴリーを丸ごとなくした初の条約で、現地査察を含む検証制度が導入された。\n\n1979年のNATO二重決定から8年、配備と反対運動(文化と社会レイヤー)を経ての合意である。米ソ首脳の関係改善は外交レイヤーの1989年マルタ会談へつながる。条約は2019年に米国が離脱して失効するが、冷戦終結期の軍縮の到達点として位置づけられる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Intermediate-Range Nuclear Forces Treaty","url":"https://en.wikipedia.org/wiki/Intermediate-Range_Nuclear_Forces_Treaty"}]},{"date":"1989-11-09","precision":"day","end_date":null,"type":"point","layer":"文化と社会","title":"ベルリンの壁崩壊","summary":"東独政府の記者会見での旅行自由化発表を受けて市民が検問所に殺到し、壁は事実上その夜に開いた。報道官シャボウスキーが新規則の発効時期を「ただちに」と答えたことで、準備のないまま国境が開いた。\n\n背景にはポーランドの円卓会議(連帯の合法化)、ハンガリーの国境開放、ライプツィヒの月曜デモなど、市民の動きの連鎖がある。ソ連は軍事介入せず、外交レイヤーでは3週間後にマルタ会談で冷戦終結が宣言される。1961年に一夜で築かれた壁は、28年後に一夜で開いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Fall of the Berlin Wall","url":"https://en.wikipedia.org/wiki/Fall_of_the_Berlin_Wall"}]},{"date":"1989-12-03","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"マルタ会談、米ソ首脳が冷戦の終結を宣言","summary":"ブッシュとゴルバチョフが地中海のマルタ沖で会談し、対立の時代が終わったことを共同で表明した。12月2日と3日、荒天の中ソ連客船上で行われた。\n\nベルリンの壁崩壊(文化と社会レイヤー)から1か月足らずで、東欧各国では共産党政権が相次いで退陣していた。翌1990年10月にドイツが統一し、1991年7月にはSTART I(軍事レイヤーの延長線)が署名される。会談は制度的な合意より象徴的意味が大きく、「ヤルタからマルタへ」と表現された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Malta Summit","url":"https://en.wikipedia.org/wiki/Malta_Summit"}]},{"date":"1991-12-25","precision":"day","end_date":null,"type":"point","layer":"外交と危機","title":"ソ連解体、ゴルバチョフが大統領を辞任","summary":"クレムリンの赤旗が降ろされ、ゴルバチョフが大統領を辞任、翌26日に最高会議が69年続いたソ連の消滅を宣言した。8月の保守派クーデター未遂で党の権威が崩れ、12月8日にロシア・ウクライナ・ベラルーシが独立国家共同体(CIS)創設を宣言していた。\n\n核兵器はロシアが継承し、ウクライナなどの核はその後の交渉で撤去される。東欧の市民運動(文化と社会)、軍拡の負担(軍事と核)、新思考(外交と危機)という**三層の流れが重なり合った帰結**であり、この年表の終点となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia（英語版）: Dissolution of the Soviet Union","url":"https://en.wikipedia.org/wiki/Dissolution_of_the_Soviet_Union"}]}]},{"slug":"history-democracy","title":"民主主義の系譜","description":"アテナイの民会からマグナ・カルタ、革命と人権宣言、普通選挙、そして20世紀の民主化の波まで。制度・思想・参政権の三層を重ね、「だれが決めるのか」という問いが受け継がれてきた系譜をたどる。","category":"history-politics","language":"ja","start_year":-508,"end_year":1994,"layers":[{"name":"制度と憲法","color":"blue"},{"name":"思想と言論","color":"purple"},{"name":"参政権の拡大","color":"green"}],"events":[{"date":"0508-01-01 BC","precision":"year","end_date":null,"type":"point","layer":"制度と憲法","title":"クレイステネスの改革、アテナイ民主政へ","summary":"前508年ごろ、クレイステネスはアテナイの部族制を再編し、血縁や有力者ではなく地区(デーモス)を単位とする政治参加の仕組みを作った。市民が民会で決定する体制の土台であり、アテナイ民主政の出発点とされる。\n\nくじによる公職選出や陶片追放を備えたこの体制は、統治を特定の家門から市民全体へ移した。ただし参加できたのは成年男性市民に限られ、女性・奴隷・外国人は除かれていた。以後の系譜は、この限定を押し広げていく歴史でもある。","detail":null,"credibility":"disputed","credibility_note":"改革の年代(前508/507年)と内容の詳細は、ヘロドトスら後代の記述に基づく推定を含む。","sources":[{"title":"ヘロドトス『歴史』第5巻","url":null},{"title":"Wikipedia: クレイステネス","url":"https://ja.wikipedia.org/wiki/クレイステネス"}]},{"date":"0431-01-01 BC","precision":"year","end_date":null,"type":"point","layer":"思想と言論","title":"ペリクレスの葬送演説","summary":"ペロポネソス戦争最初の冬、ペリクレスは戦没者国葬の演説で、少数ではなく多数が統治すること、法の前の平等、公共への参加をアテナイの誇りとして語ったと伝えられる。\n\nこの演説はトゥキュディデスが『戦史』の中で再構成したもので、実際の文言は検証できない。それでも民主政の理念を当事者の言葉で定式化した最古級のテキストとして、後世繰り返し参照されてきた。**統治のかたちを誇りとして語る**言語が、ここで生まれた。","detail":null,"credibility":"unverified","credibility_note":"演説の文面はトゥキュディデス『戦史』による再構成で、実際の発言内容は検証できない。","sources":[{"title":"トゥキュディデス『戦史』第2巻","url":null}]},{"date":"1215-06-15","precision":"day","end_date":null,"type":"point","layer":"制度と憲法","title":"マグナ・カルタ成立","summary":"1215年6月15日、イングランド王ジョンは反乱貴族の要求を受け、ラニーミードでマグナ・カルタ(大憲章)を承認した。課税への同意や、適法な手続きによらない逮捕・財産剥奪の禁止など、王権を文書で制約した。\n\n本来は貴族の特権確認だったが、「**王もまた法の下にある**」という原理の典拠として後世に再発見され、17世紀の議会派も、アメリカの植民地人も、この文書を自らの権利の根拠に引いた。条文そのものよりも、読み直しの歴史が系譜を作った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: マグナ・カルタ","url":"https://ja.wikipedia.org/wiki/マグナ・カルタ"}]},{"date":"1647-10-01","precision":"month","end_date":null,"type":"point","layer":"思想と言論","title":"プトニー討論、選挙権を正面から論じる","summary":"1647年10月末、清教徒革命下のイングランド軍の内部で、兵士と将校が国制のあり方を討論した。平等派のレインバラは、最も貧しい者も最も偉大な者と同じく自らの生を持つと述べ、統治は被治者の同意に基づくべきだと主張した。\n\n普通選挙の思想が公の場で真正面から論じられた最初期の記録である。討論は将校側に抑えられ実現しなかったが、**統治される者の同意**という原理はここで言葉になった。記録は速記筆記に基づき、逐語性には議論がある。","detail":null,"credibility":"disputed","credibility_note":"討論の内容はウィリアム・クラークの速記記録に基づき、発言の逐語性については議論がある。","sources":[{"title":"Wikipedia: Putney Debates","url":"https://en.wikipedia.org/wiki/Putney_Debates"}]},{"date":"1689-12-16","precision":"day","end_date":null,"type":"point","layer":"制度と憲法","title":"イングランド権利章典","summary":"名誉革命の翌1689年12月16日、権利章典が成立した。議会の同意なき課税や常備軍の禁止、議会内の言論の自由、頻繁な議会開催などを定め、王は議会の枠内で統治する存在となった。\n\n革命の事後処理として作られた実務的な文書だが、「議会が条件を付けて王位を渡す」という順序そのものが主権の所在を示していた。この立憲君主政の型は各国の憲法設計の参照点となり、1世紀後のアメリカの権利章典にも名を残す。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bill of Rights 1689","url":"https://en.wikipedia.org/wiki/Bill_of_Rights_1689"}]},{"date":"1762-01-01","precision":"year","end_date":null,"type":"point","layer":"思想と言論","title":"ルソー『社会契約論』刊行","summary":"1762年、ルソーは『社会契約論』で、正統な政治体は人民自身の一般意志に基づくほかないと論じた。主権は人民にあり、譲り渡すことも代表させることもできないという主張は、王権神授の論理を根本から否定するものだった。\n\nモンテスキューの権力分立論(『法の精神』1748年)とともに、この書は世紀末の革命の言葉を用意した。刊行当時は各地で発禁とされたが、フランス革命期には人民主権の教典として読まれ、人権宣言に「一般意志」の語が刻まれる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 社会契約論","url":"https://ja.wikipedia.org/wiki/社会契約論"}]},{"date":"1776-07-04","precision":"day","end_date":null,"type":"point","layer":"思想と言論","title":"アメリカ独立宣言","summary":"1776年7月4日、13植民地の代表は独立宣言を採択した。すべての人は平等に造られ、生命・自由・幸福追求の権利を持ち、政府の正当な権力は被治者の同意に由来する。同意なき統治への異議が、そのまま建国の文書になった。\n\n宣言の普遍的な言葉と、奴隷制が存続する現実との落差は当初から指摘されていた。しかしこの落差こそが、後の参政権拡大運動(参政権の拡大レイヤー)が繰り返し依拠する根拠となる。理念が現実を追い立てる構図の原型である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: アメリカ独立宣言","url":"https://ja.wikipedia.org/wiki/アメリカ独立宣言"}]},{"date":"1787-09-17","precision":"day","end_date":null,"type":"point","layer":"制度と憲法","title":"アメリカ合衆国憲法に署名","summary":"1787年9月17日、フィラデルフィアの憲法制定会議は合衆国憲法に署名した。現行の成文憲法として世界最古級であり、連邦制・三権分立・修正条項という設計は、以後の各国の憲法制定の雛形となった。\n\n「われら人民」で始まる前文とは裏腹に、当初の憲法は奴隷制を黙認し、選挙権の定義を各州に委ねていた。憲法は完成品ではなく修正され続ける枠組みであり、その後の修正の歴史(参政権の拡大レイヤー)こそが、この文書の民主化の歴史である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: アメリカ合衆国憲法","url":"https://ja.wikipedia.org/wiki/アメリカ合衆国憲法"}]},{"date":"1789-08-26","precision":"day","end_date":null,"type":"point","layer":"思想と言論","title":"フランス人権宣言","summary":"1789年8月26日、フランス国民議会は「人間と市民の権利の宣言」を採択した。人は自由かつ権利において平等に生まれ、主権は国民にあり、法は一般意志の表明である。革命の理念が17か条に凝縮された。\n\n宣言は普遍的な「人間」を語りながら、実際の選挙権は納税額で区切られ、女性は含まれなかった。オランプ・ド・グージュは1791年に「女性および女性市民の権利宣言」で応じている。普遍性と適用の狭さの緊張は、以後の系譜全体を貫く主題となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 人間と市民の権利の宣言","url":"https://ja.wikipedia.org/wiki/人間と市民の権利の宣言"}]},{"date":"1792-01-01","precision":"year","end_date":null,"type":"point","layer":"思想と言論","title":"『女性の権利の擁護』刊行","summary":"1792年、メアリ・ウルストンクラフトは『女性の権利の擁護』を刊行し、女性の従属は本性ではなく教育の欠如の産物だと論じた。革命が掲げる権利の言葉が**人類の半分を素通りしている**ことへの、同時代からの異議である。\n\n刊行当時の反響は限られ、没後は長く不当な扱いを受けたが、19世紀後半の女性参政権運動が先駆として再発見した。思想と言論レイヤーの一冊が、1世紀後に参政権の拡大レイヤーの運動の武器となる、系譜の典型例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: A Vindication of the Rights of Woman","url":"https://en.wikipedia.org/wiki/A_Vindication_of_the_Rights_of_Woman"}]},{"date":"1832-06-07","precision":"day","end_date":null,"type":"point","layer":"参政権の拡大","title":"英国第一次選挙法改正","summary":"1832年6月、英国で第一次選挙法改正が成立した。有権者がほとんどいない「腐敗選挙区」を廃止してマンチェスターなどの新興工業都市に議席を配分し、選挙権の財産資格を再定義した。\n\n有権者はおよそ5割増えたと推計されるが、それでも成年男性の2割前後にとどまり、裏切られた労働者の期待はチャーティスト運動へ向かう。それでも「選挙制度は変えられる」という前例の意義は大きく、1867年・1884年の改正で拡大は段階的に進んだ。","detail":null,"credibility":"unverified","credibility_note":"有権者の増加規模は登録制度の整備以前のため推計に依存し、資料により幅がある。","sources":[{"title":"Wikipedia: Reform Act 1832","url":"https://en.wikipedia.org/wiki/Reform_Act_1832"}]},{"date":"1848-01-01","precision":"year","end_date":"1849-08-01","type":"period","layer":"制度と憲法","title":"1848年革命（諸国民の春）","summary":"1848年、パリの二月革命を引き金に、ウィーン・ベルリン・ブダペスト・ミラノなど欧州各地で憲法と議会と出版の自由を求める革命が連鎖した。フランスでは男子普通選挙が実施され、フランクフルトでは全ドイツの憲法制定議会が開かれた。\n\n革命の多くは翌年までに鎮圧され、憲法は撤回された。それでも農奴制の廃止など不可逆の変化を残し、憲法と選挙という要求の形式そのものを大陸の常識に変えた。敗北が、のちの標準を用意した事例である。","detail":null,"credibility":"disputed","credibility_note":"「諸国民の春」に含める事件の範囲と期間の区切りは、研究・叙述により幅がある。","sources":[{"title":"Wikipedia: 1848年革命","url":"https://ja.wikipedia.org/wiki/1848年革命"}]},{"date":"1893-09-19","precision":"day","end_date":null,"type":"point","layer":"参政権の拡大","title":"ニュージーランド、世界初の女性参政権","summary":"1893年9月19日、ニュージーランドで新選挙法が裁可され、世界で初めて国政レベルで女性が投票権を得た。ケイト・シェパードらの運動は、成年女性のおよそ4分の1が署名したとされる大請願で議会を動かした。\n\n**性別という壁が国政選挙で初めて破られ**、オーストラリアやフィンランドへと続く各国の運動に、到達可能な実例を与えた。ただし女性の被選挙権は1919年まで持ち越され、「投票できること」と「選ばれうること」の間にも段差があった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"NZ History: Women and the vote (nzhistory.govt.nz)","url":"https://nzhistory.govt.nz/politics/womens-suffrage"}]},{"date":"1918-02-06","precision":"day","end_date":null,"type":"point","layer":"参政権の拡大","title":"英国、男子普通選挙と女性参政権へ","summary":"1918年2月、国民代表法により英国のほぼすべての成年男子と、30歳以上の一定条件を満たす女性が選挙権を得た。有権者はおよそ3倍に増え、大衆民主主義の時代が始まった。\n\n拡大を後押ししたのは総力戦だった。前線の兵士と銃後の女性の貢献は、財産による選別の論理をもはや支えきれなくした。女性の年齢制限が男性と揃うのは1928年。米国の女性参政権(1920年)、日本の男子普通選挙(1925年)と、拡大は各国でほぼ同時代に進む。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Representation of the People Act 1918","url":"https://en.wikipedia.org/wiki/Representation_of_the_People_Act_1918"}]},{"date":"1925-05-05","precision":"day","end_date":null,"type":"point","layer":"参政権の拡大","title":"日本で男子普通選挙法が成立","summary":"1925年、納税要件を撤廃して25歳以上の男子に選挙権を与える普通選挙法が成立した(5月5日公布)。有権者は約4倍の1200万人余りに増え、無産政党が議会に進出する道が開かれた。\n\n同じ議会で治安維持法が成立しており、参加の拡大と思想統制の強化(思想と言論レイヤー)が同時に進んだ点に、この時代の日本の特徴がある。女性参政権は帝国議会では実現せず、敗戦後の1945年の選挙法改正まで待つことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 普通選挙法","url":"https://ja.wikipedia.org/wiki/普通選挙法"}]},{"date":"1946-04-10","precision":"day","end_date":null,"type":"point","layer":"参政権の拡大","title":"日本初の男女普通選挙","summary":"1946年4月10日、女性が初めて投票する衆議院議員総選挙が行われ、女性の投票率は約67%に達し、39人の女性議員が誕生した。前年12月の選挙法改正で、20歳以上の男女すべてに選挙権が認められていた。\n\n敗戦と占領という外圧の下での実現だったが、市川房枝らによる戦前からの婦人参政権運動の蓄積が、制度を待ち受けていた。同年11月公布の日本国憲法は普通選挙の保障を明文化し(制度と憲法レイヤー)、拡大は憲法規範として固定された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 第22回衆議院議員総選挙","url":"https://ja.wikipedia.org/wiki/第22回衆議院議員総選挙"}]},{"date":"1948-12-10","precision":"day","end_date":null,"type":"point","layer":"思想と言論","title":"世界人権宣言、参政権を人権として明記","summary":"1948年12月10日、国連総会は世界人権宣言を採択した。第21条は、すべての人が自国の政治に参与する権利を持つこと、人民の意思こそ統治の権威の基礎であり、それは普通かつ平等の選挙によって表明されることを定めた。\n\n二度の大戦への反省から、参政権は各国の国内事情ではなく普遍的人権の語彙で語られることになった。法的拘束力はないが、以後の国際人権規約や各国憲法、植民地独立と民主化運動が共通して依拠する基準となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 世界人権宣言","url":"https://ja.wikipedia.org/wiki/世界人権宣言"}]},{"date":"1965-08-06","precision":"day","end_date":null,"type":"point","layer":"参政権の拡大","title":"米国投票権法成立","summary":"1965年8月6日、ジョンソン大統領が投票権法に署名した。識字テストなど南部諸州で黒人の投票を妨げてきた仕組みを禁じ、連邦政府に選挙運用の監督権限を与えた。セルマの行進への暴力が世論を動かした直後の立法である。\n\n憲法修正第15条(1870年)が保障したはずの権利は、1世紀近く州の運用で骨抜きにされていた。**紙の上の権利を現実の投票に変える**には運動と執行の仕組みが要る。この法はその教訓の到達点であり、南部の黒人有権者登録は数年で激増した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Voting Rights Act of 1965","url":"https://en.wikipedia.org/wiki/Voting_Rights_Act_of_1965"}]},{"date":"1974-04-25","precision":"day","end_date":null,"type":"point","layer":"制度と憲法","title":"カーネーション革命、民主化の波の始点","summary":"1974年4月25日、ポルトガルで青年将校らの蜂起が半世紀近い独裁体制をほぼ無血で倒し、市民は兵士の銃口にカーネーションを挿した。2年後には民主的な新憲法が制定される。\n\n政治学者ハンティントンは後にこの日を「民主化の第三の波」の始点とした。波は南欧からラテンアメリカ、アジア、そして1989年の東欧へと広がり、民主政は一部地域の制度から地球規模の基準へと変わっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: カーネーション革命","url":"https://ja.wikipedia.org/wiki/カーネーション革命"}]},{"date":"1994-04-27","precision":"day","end_date":null,"type":"point","layer":"参政権の拡大","title":"南アフリカ、全人種参加の総選挙","summary":"1994年4月27日から、南アフリカで初めて全人種が参加する総選挙が行われ、マンデラ率いるアフリカ民族会議(ANC)が勝利した。アパルトヘイトの下で排除されてきた黒人が、初めて自国の統治者を選んだ。\n\nクレイステネスからおよそ2500年、参政権の系譜は「例外を残さない」方向へ進み続けてきた。この選挙はその象徴的な到達点だが、終着点ではない。**だれが決めるのかという問いは、いまも書き足されている**系譜である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1994 South African general election","url":"https://en.wikipedia.org/wiki/1994_South_African_general_election"}]}]},{"slug":"history-digital-democracy","title":"デジタル民主主義","description":"インターネットは民主主義を強くするのか、壊すのか。市民の動員、世論の操作、制度の応答という3層を重ね、同じ技術が希望と脅威の両方として現れた30年を追う。","category":"history-politics","language":"ja","start_year":1996,"end_year":2024,"layers":[{"name":"参加と動員","color":"green"},{"name":"操作と分断","color":"pink"},{"name":"制度とプラットフォーム","color":"blue"}],"events":[{"date":"1996-02-08","precision":"day","end_date":null,"type":"point","layer":"参加と動員","title":"「サイバースペース独立宣言」発表","summary":"米国の通信品位法の成立に抗議し、電子フロンティア財団の共同創設者バーロウが「サイバースペース独立宣言」を発表した。ネットは政府の主権が及ばない自由な空間だと宣言した。\n\n**ネットは本質的に民主化の力である**という初期の楽観を象徴する文書である。この理想は2010年代の「アラブの春」の評価まで生き続けるが、国家とプラットフォームによる統制の現実(他の2レイヤー)に次第に侵食されていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EFF: A Declaration of the Independence of Cyberspace","url":"https://www.eff.org/cyberspace-independence"}]},{"date":"2005-10-01","precision":"month","end_date":null,"type":"point","layer":"制度とプラットフォーム","title":"エストニアが世界初の全国規模ネット投票","summary":"エストニアが地方選挙で、法的拘束力を持つ世界初の全国規模インターネット投票を実施した。国民IDカードを基盤とする電子政府構築の一環である。\n\n以後の国政選挙でもネット投票は拡大し、投票の過半がオンラインで行われる選挙も現れた。一方でセキュリティ研究者からは脆弱性の指摘が繰り返されており、利便性と検証可能性の緊張は現在も残る論点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Electronic voting in Estonia","url":"https://en.wikipedia.org/wiki/Electronic_voting_in_Estonia"}]},{"date":"2008-11-04","precision":"day","end_date":null,"type":"point","layer":"参加と動員","title":"オバマ当選、ネット動員が選挙を変える","summary":"バラク・オバマが米大統領選に勝利した。SNSと電子メールを駆使した小口献金と草の根動員の手法は、ネット時代の選挙運動の教科書とされた。\n\nこの時点でソーシャルメディアは**参加を広げる道具**として肯定的に語られていた。同じデータ駆動の手法がマイクロターゲティングとして操作と分断レイヤーの主役になるのは、わずか8年後のことである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Barack Obama 2008 presidential campaign","url":"https://en.wikipedia.org/wiki/Barack_Obama_2008_presidential_campaign"}]},{"date":"2010-12-17","precision":"day","end_date":"2011-02-11","type":"period","layer":"参加と動員","title":"アラブの春、SNSが動員の基盤に","summary":"チュニジアの抗議を発端に反政府運動がアラブ諸国へ波及し、2011年2月にはエジプトのムバラク政権が18日間の抗議で崩壊した。SNSが動員と情報拡散に使われ「SNS革命」とも呼ばれた。\n\nただしSNSの寄与がどの程度だったかは研究者の間で評価が分かれ、衛星放送や労働運動の役割を重視する見方も強い。ネット楽観論の頂点であると同時に、その後の内戦化と権威主義の再強化が楽観の終わりの始まりとなった。","detail":null,"credibility":"disputed","credibility_note":"「SNS革命」という規定には異論が多く、SNSの動員への寄与度は研究により評価が分かれる。","sources":[{"title":"Wikipedia: Arab Spring","url":"https://en.wikipedia.org/wiki/Arab_Spring"}]},{"date":"2011-05-01","precision":"month","end_date":null,"type":"point","layer":"操作と分断","title":"「フィルターバブル」概念の提唱","summary":"活動家イーライ・パリサーが著書でフィルターバブルという概念を提唱した。アルゴリズムによる情報の個人最適化が、人々を自分好みの情報の泡に閉じ込めると警告した。\n\n民主主義の前提である共通の事実基盤が技術によって侵食されるという問題設定は、後のフェイクニュース論争の枠組みを先取りした。実証研究には効果を限定的とする結果もあり、概念の妥当性自体も論争の対象であり続けている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Filter bubble","url":"https://en.wikipedia.org/wiki/Filter_bubble"}]},{"date":"2013-06-06","precision":"day","end_date":null,"type":"point","layer":"操作と分断","title":"スノーデンがNSAの大量監視を暴露","summary":"元NSA契約職員スノーデンの提供資料に基づき、米国家安全保障局による通信記録の大量収集プログラムが報道された。大手テック企業のデータへのアクセスも暴かれた。\n\n民主国家自身が**インフラ化した監視**を運用していた事実は、ネット自由論の前提を根本から揺さぶった。EUのデータ保護強化(制度とプラットフォームレイヤー)を加速させ、プライバシーは民主主義の問題として再定義された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edward Snowden","url":"https://en.wikipedia.org/wiki/Edward_Snowden"}]},{"date":"2014-03-18","precision":"day","end_date":"2014-04-10","type":"period","layer":"参加と動員","title":"台湾ひまわり運動、市民テックの合流","summary":"対中サービス貿易協定の審議強行に抗議した学生らが台湾の立法院を占拠した。シビックハッカー集団g0vが議場や街頭の情報をオンラインで中継・集約し、運動を支えた。\n\n運動後、政府はデジタル担当の政務委員に唐鳳を起用し、市民参加プラットフォームvTaiwanなどの実験が制度化された。抗議が**制度への参加回路**に転じた例として、デジタル民主主義論で最も参照される事例の一つである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Sunflower Student Movement","url":"https://en.wikipedia.org/wiki/Sunflower_Student_Movement"}]},{"date":"2016-11-08","precision":"day","end_date":null,"type":"point","layer":"操作と分断","title":"米大統領選、偽情報とロシア介入が争点に","summary":"トランプが米大統領選に勝利した。選挙期間中にSNS上で虚偽ニュースが大量に拡散し、ロシアによる組織的な情報工作の存在も後に米情報機関が認定した。\n\n介入活動の存在自体は特別検察官の起訴などで裏づけられたが、それが選挙結果を左右したかは実証が難しく、評価は分かれたままである。ソーシャルメディアが民主主義への脅威として本格的に論じられる転換点となった。","detail":null,"credibility":"disputed","credibility_note":"ロシアの介入活動の存在は米情報機関と特別検察官の捜査で認定されているが、選挙結果への影響の程度については実証的な確定がない。","sources":[{"title":"Wikipedia: Russian interference in the 2016 United States elections","url":"https://en.wikipedia.org/wiki/Russian_interference_in_the_2016_United_States_elections"}]},{"date":"2018-03-17","precision":"day","end_date":null,"type":"point","layer":"操作と分断","title":"ケンブリッジ・アナリティカ事件","summary":"選挙コンサルティング企業ケンブリッジ・アナリティカが最大8700万人分のFacebookデータを不正取得し、有権者の心理プロファイリングに用いたと報じられた。\n\n**個人データが世論操作の弾薬になる**構図を可視化した事件である。FacebookのCEOは米議会で証言し、同社には後に巨額の制裁金が科された。施行直前だったGDPR(制度とプラットフォームレイヤー)の正当性を裏書きする事件ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Facebook-Cambridge Analytica data scandal","url":null}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"制度とプラットフォーム","title":"GDPR施行","summary":"EU一般データ保護規則(GDPR)が施行され、個人データの処理に包括的な義務と、最大で全世界売上高4%の制裁金が導入された。EU域外の企業にも適用される。\n\nスノーデン暴露(操作と分断レイヤー)後のデータ保護世論を制度化したもので、世界各国の個人情報保護法制のひな型となった。データの自己決定権を民主主義の基盤と位置づける「ブリュッセル効果」の代表例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2016/679 (GDPR)","url":"https://eur-lex.europa.eu/eli/reg/2016/679/oj"}]},{"date":"2019-06-09","precision":"day","end_date":null,"type":"point","layer":"参加と動員","title":"香港で100万人デモ、分散型動員の頂点","summary":"逃亡犯条例改正案に反対する大規模デモが香港で始まった。主催者発表で100万人、1週間後には200万人と称する参加者が街頭に出た。\n\n指導者を置かずTelegramや掲示板で戦術を調整する「水になれ」型の運動だったが、翌2020年の国家安全維持法の施行で運動は制圧された。参加者数は主催者と警察の発表が大きく乖離しており、確定的な数値はない。","detail":null,"credibility":"unverified","credibility_note":"参加者数(100万人・200万人)は主催者発表であり、警察発表とは数倍の開きがある。","sources":[{"title":"Wikipedia: 2019-2020 Hong Kong protests","url":null}]},{"date":"2021-01-06","precision":"day","end_date":null,"type":"point","layer":"制度とプラットフォーム","title":"米議会襲撃、SNS各社が現職大統領を排除","summary":"米大統領選の結果認定を阻止しようとする群衆が連邦議会議事堂を襲撃した。SNS上の不正選挙言説が動員の基盤となり、直後にTwitterやFacebookはトランプ大統領のアカウントを停止した。\n\n偽情報の帰結が物理的暴力に至った出来事であると同時に、**私企業が国家元首の発言の場を奪える**事実がプラットフォーム権力の統制という新しい問いを突きつけた。EUのデジタルサービス法(同レイヤー)の議論も加速した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: January 6 United States Capitol attack","url":"https://en.wikipedia.org/wiki/January_6_United_States_Capitol_attack"}]},{"date":"2022-10-27","precision":"day","end_date":null,"type":"point","layer":"制度とプラットフォーム","title":"マスクがTwitterを買収","summary":"イーロン・マスクが約440億ドルでTwitterを買収した。コンテンツモデレーションの緩和、認証制度の変更、後の「X」への改称など、運営方針を大きく転換した。\n\n世界の公論空間の一つが一個人の所有物であることを露わにした出来事である。研究者へのデータ提供の縮小は偽情報研究(操作と分断レイヤー)の基盤を弱め、プラットフォームと民主主義の関係は所有者個人の意思に左右される段階に入った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Acquisition of Twitter by Elon Musk","url":"https://en.wikipedia.org/wiki/Acquisition_of_Twitter_by_Elon_Musk"}]},{"date":"2022-11-16","precision":"day","end_date":null,"type":"point","layer":"制度とプラットフォーム","title":"EUデジタルサービス法(DSA)発効","summary":"違法コンテンツへの対応や巨大プラットフォームへのリスク評価義務を定めるEUデジタルサービス法が発効した。2024年から全面適用され、選挙の公正性への体系的リスクも評価対象とされた。\n\nプラットフォームの内部運用を公的監督の下に置く初の包括的枠組みであり、GDPRに続く「ブリュッセル効果」の再現が競われる。表現の自由への萎縮効果を懸念する批判もあり、規制と自由の均衡点はなお論争の中にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2022/2065 (Digital Services Act)","url":"https://eur-lex.europa.eu/eli/reg/2022/2065/oj"}]},{"date":"2024-01-01","precision":"month","end_date":null,"type":"point","layer":"操作と分断","title":"AI偽音声ロボコールが米予備選で使用","summary":"米ニューハンプシャー州予備選の直前、バイデン大統領の声をAIで合成し投票の棄権を促すロボコールが有権者に届いた。生成AIが実際の選挙妨害に使われた代表的事例として世界的に報じられた。\n\n発信を仕掛けた人物は後に特定され、罰金と訴追の対象となったが、電話の到達件数や投票行動への実際の影響は推定にとどまる。**合成メディアが選挙の声を偽造する**時代の到来を告げ、各国で対策立法が動き出した。","detail":null,"credibility":"unverified","credibility_note":"ロボコールの到達件数(数千件から2万件超とされる)や投票行動への影響は推定であり、確定した数値はない。","sources":[{"title":"FCC・ニューハンプシャー州司法長官によるAI音声ロボコール事案の発表(2024)","url":null}]},{"date":"2024-01-01","precision":"year","end_date":"2024-12-31","type":"period","layer":"参加と動員","title":"史上最大の「選挙の年」","summary":"世界の60を超える国・地域で国政級の選挙が行われ、有権者の合計は数十億人規模に達したとされる。インド、EU、米国など主要な民主政体の選挙が同じ年に集中した。\n\n生成AIによる偽情報への懸念が年初から語られた一方、事後の検証ではAI偽情報の決定的な影響は確認されなかったとする分析も出ており、評価は続いている。選挙の対象国数や有権者総数は、集計主体の定義により異なる。","detail":null,"credibility":"disputed","credibility_note":"「選挙の年」の対象国数(60超から80超まで)や有権者総数は、集計主体の定義により大きく異なる。","sources":[{"title":"International IDEA: 2024 global elections \"super-cycle\" 関連資料","url":null}]},{"date":"2024-11-28","precision":"day","end_date":null,"type":"point","layer":"制度とプラットフォーム","title":"豪州が16歳未満のSNS利用禁止法を可決","summary":"オーストラリア議会が16歳未満のソーシャルメディア利用を禁止し、プラットフォームに年齢確認を義務づける法律を可決した。国レベルの包括的なSNS年齢規制としては世界初である。\n\n未成年保護を掲げる規制は各国で追随の動きを呼んだが、年齢確認が事実上全利用者の身元確認を要請し、匿名性と表現の自由を損なうという批判も強い。プラットフォームへの統制が、参加の基盤そのものと緊張する段階に入った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"オーストラリア議会: Online Safety Amendment (Social Media Minimum Age) Bill 2024","url":null}]},{"date":"2024-12-06","precision":"day","end_date":null,"type":"point","layer":"操作と分断","title":"ルーマニア憲法裁が大統領選を無効化","summary":"ルーマニア憲法裁判所が大統領選第1回投票の結果を無効とし、選挙のやり直しを命じた。無名に近い候補ジョルジェスクがTikTok上の組織的キャンペーンで首位に立ち、当局は外国の介入を示す機密文書を公開していた。\n\nSNS経由の影響工作を理由に民主的選挙そのものが取り消された、EU加盟国で初の事例である。介入の主体や規模は当局の発表に基づいており、司法判断の妥当性を含めて欧州で激しい論争を呼んだ。","detail":null,"credibility":"disputed","credibility_note":"外国(ロシアとされる)の介入の主体・規模は当局の機密解除文書に基づくもので、独立した全容の検証はなされていない。","sources":[{"title":"Reuters: Romanian court annuls presidential election first round (2024-12-06)","url":null}]}]},{"slug":"history-eu-integration","title":"EU統合の歴史","description":"石炭鉄鋼共同体から27か国の連合へ。条約による制度づくり、市場と通貨の統合、そして危機と離脱。3層を重ね、EUが危機のたびに深化してきた逆説を追う年表。","category":"history-politics","language":"ja","start_year":1950,"end_year":2020,"layers":[{"name":"制度と条約","color":"blue"},{"name":"市場と通貨","color":"gold"},{"name":"危機と離脱","color":"pink"}],"events":[{"date":"1950-05-09","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"シューマン宣言、欧州統合の出発点","summary":"フランス外相シューマンが、独仏の石炭・鉄鋼の共同管理を提案した。モネの構想に基づき、戦争の道具だった基幹産業を超国家機関の下に置くという着想である。\n\n欧州は一挙にではなく具体的な成果の積み重ねで作られる、という宣言の言葉どおり、**機能的な統合の積み重ね**が以後のEUの方法論となった。宣言の5月9日は現在「ヨーロッパ・デー」として記念されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Schuman Declaration","url":"https://en.wikipedia.org/wiki/Schuman_Declaration"}]},{"date":"1952-07-23","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"欧州石炭鉄鋼共同体(ECSC)発足","summary":"パリ条約の発効により、フランス・西ドイツ・イタリア・ベネルクス3国の6か国で欧州石炭鉄鋼共同体が発足した。史上初の超国家機関である最高機関が置かれた。\n\n加盟国が主権の一部を共同機関に委ねる仕組みがここで初めて実現した。石炭と鉄鋼という当時の戦争遂行能力そのものを共有することで、独仏の戦争を物理的に不可能にするという安全保障の設計でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: European Coal and Steel Community","url":"https://en.wikipedia.org/wiki/European_Coal_and_Steel_Community"}]},{"date":"1957-03-25","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"ローマ条約調印、EECが誕生へ","summary":"6か国がローマ条約に調印し、翌1958年に欧州経済共同体(EEC)と欧州原子力共同体が発足した。関税同盟と共同市場の建設が目標に掲げられた。\n\n前年のスエズ危機で欧州の国際的地位の低下が露呈した直後であり、危機が統合を後押しした早い例といえる。経済統合を軸に据えたことで、市場と通貨レイヤーの歩みが実質的にここから始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Treaty of Rome","url":"https://en.wikipedia.org/wiki/Treaty_of_Rome"}]},{"date":"1973-01-01","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"第一次拡大、英国など3か国が加盟","summary":"英国、アイルランド、デンマークが加盟し、共同体は9か国となった。英国の加盟は、ドゴール仏大統領による2度の拒否を経てようやく実現したものである。\n\n英国は当初から通貨統合や社会政策への留保が強く、1975年には早くも残留を問う国民投票を実施した。**距離を置く加盟国**という英国の立ち位置は、40年余り後の離脱(危機と離脱レイヤー)まで一貫する伏線である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1973 enlargement of the European Communities","url":"https://en.wikipedia.org/wiki/1973_enlargement_of_the_European_Communities"}]},{"date":"1979-03-13","precision":"day","end_date":null,"type":"point","layer":"市場と通貨","title":"欧州通貨制度(EMS)発足","summary":"加盟国の為替相場を相互に安定させる欧州通貨制度が発足し、共通の計算単位ECUが導入された。1970年代の変動相場制移行と通貨混乱への対応である。\n\n中核の為替相場メカニズム(ERM)は域内貿易を支えたが、各国の経済力格差を抱えたままの相場安定は投機攻撃(危機と離脱レイヤー)に脆く、1992年の危機で限界を露呈する。単一通貨への長い助走の始まりだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: European Monetary System","url":"https://en.wikipedia.org/wiki/European_Monetary_System"}]},{"date":"1985-06-14","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"シェンゲン協定調印","summary":"フランス・西ドイツ・ベネルクス3国の5か国が、共通国境における検問の段階的廃止で合意した。ルクセンブルクの小村シェンゲンで調印された。\n\n発効は1995年と時間を要したが、人の移動の自由を目に見える形にした点で統合の象徴となった。一方で域内の自由移動は、2015年の難民危機(危機と離脱レイヤー)では検問復活論を招く争点にもなっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Schengen Agreement","url":"https://en.wikipedia.org/wiki/Schengen_Agreement"}]},{"date":"1986-02-17","precision":"day","end_date":null,"type":"point","layer":"市場と通貨","title":"単一欧州議定書調印、市場統合へ再始動","summary":"ローマ条約の初の大幅改正となる単一欧州議定書が調印され、1992年末までの域内市場完成が条約上の目標となった。理事会での多数決の適用範囲も拡大された。\n\n「欧州硬化症」と呼ばれた1970年代の停滞を破る再始動であり、ドロール欧州委員長の下で統合は加速期に入る。モノ・ヒト・カネ・サービスの移動自由化が具体化し、単一市場(同レイヤー)への道筋が定まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Single European Act","url":"https://en.wikipedia.org/wiki/Single_European_Act"}]},{"date":"1992-02-07","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"マーストリヒト条約調印、EU誕生へ","summary":"欧州連合条約が調印され、翌1993年11月に発効してEUが誕生した。経済通貨同盟への工程表、共通外交・安全保障政策、欧州市民権が盛り込まれた。\n\n批准過程ではデンマークが国民投票で一時否決し、フランスも僅差の承認にとどまるなど、**エリート主導の統合と世論の距離**が初めて表面化した。通貨統合の財政基準は、後のユーロ危機の争点を予告するものだった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Maastricht Treaty","url":"https://en.wikipedia.org/wiki/Maastricht_Treaty"}]},{"date":"1992-09-16","precision":"day","end_date":null,"type":"point","layer":"危機と離脱","title":"ポンド危機、英国がERM離脱","summary":"欧州為替相場メカニズム(ERM)内のポンドが大規模な投機売りを浴び、英国は防衛を断念してERMから離脱した。「ブラック・ウェンズデー」と呼ばれる。\n\n投機筋のソロスのファンドは10億ドル超の利益を得たとされるが、正確な額は推定の域を出ない。固定相場の脆さを示したこの危機は、逆に「戻れない単一通貨」ユーロ(市場と通貨レイヤー)への大陸側の決意を強め、英国の通貨統合不参加もここで事実上定まった。","detail":null,"credibility":"unverified","credibility_note":"ソロスのファンドが得たとされる利益額(10億ドル超)は報道による推定で、確定した数値ではない。","sources":[{"title":"Wikipedia: Black Wednesday","url":"https://en.wikipedia.org/wiki/Black_Wednesday"}]},{"date":"1993-01-01","precision":"day","end_date":null,"type":"point","layer":"市場と通貨","title":"単一市場発足","summary":"モノ・ヒト・サービス・資本の移動を自由化する域内単一市場が発足した。単一欧州議定書が掲げた「1992年末」の期限が達成された形である。\n\n世界最大級の統合市場の誕生は加盟希望国を引き寄せ、2004年の東方拡大(制度と条約レイヤー)の吸引力となった。同時に、規制統一をめぐる「ブリュッセルの官僚主義」への批判も英国を中心に強まっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: European Single Market","url":"https://en.wikipedia.org/wiki/European_Single_Market"}]},{"date":"1999-01-01","precision":"day","end_date":null,"type":"point","layer":"市場と通貨","title":"単一通貨ユーロ導入","summary":"11か国で単一通貨ユーロが決済通貨として導入され、2002年1月には現金の流通が始まった。金融政策は新設の欧州中央銀行(ECB)に一元化された。\n\n**通貨は統合し財政は各国に残る**という非対称な設計は導入時から経済学者に指摘されていた弱点であり、10年後のユーロ危機(危機と離脱レイヤー)で現実の試練となる。それでもユーロはドルに次ぐ国際通貨の地位を確立した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Euro","url":"https://en.wikipedia.org/wiki/Euro"}]},{"date":"2004-05-01","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"東方拡大、中東欧など10か国が一挙加盟","summary":"ポーランド、チェコ、ハンガリー、バルト3国など10か国が加盟し、EUは25か国となった。冷戦で分断された欧州の再統一と位置づけられた。\n\n旧共産圏諸国の民主化と市場経済化をEU加盟という目標が支えた一方、労働移動の拡大は西欧で移民論争を呼び、英国のEU懐疑論(危機と離脱レイヤー)を強める一因ともなった。拡大と深化の緊張が以後の主題となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2004 enlargement of the European Union","url":"https://en.wikipedia.org/wiki/2004_enlargement_of_the_European_Union"}]},{"date":"2005-05-29","precision":"day","end_date":null,"type":"point","layer":"危機と離脱","title":"フランス国民投票で欧州憲法条約を否決","summary":"EUの憲法条約の批准を問うフランス国民投票で反対が約55%を占めて否決され、3日後にはオランダも否決した。条約は発効不能となった。\n\n統合の「憲法」化という象徴的な深化が原加盟国の国民自身に拒まれた衝撃は大きかった。内容の大半は2007年のリスボン条約(制度と条約レイヤー)に引き継がれたが、国民投票を回避した手法は民主的正統性への批判を残した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2005 French European Constitution referendum","url":"https://en.wikipedia.org/wiki/2005_French_European_Constitution_referendum"}]},{"date":"2007-12-13","precision":"day","end_date":null,"type":"point","layer":"制度と条約","title":"リスボン条約調印","summary":"否決された憲法条約に代わる改革条約としてリスボン条約が調印され、2009年12月に発効した。常任の欧州理事会議長と外交安全保障上級代表が新設された。\n\n離脱手続きを定めた第50条が初めて明文化され、後にBrexit(危機と離脱レイヤー)で現実に使われることになる。批准過程ではアイルランドが一度否決し再投票で承認するなど、世論との緊張はここでも続いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Treaty of Lisbon","url":"https://en.wikipedia.org/wiki/Treaty_of_Lisbon"}]},{"date":"2009-10-01","precision":"month","end_date":"2012-09-06","type":"period","layer":"危機と離脱","title":"ユーロ危機、ギリシャの統計修正から波及","summary":"ギリシャ新政権が財政赤字統計の大幅な下方修正を公表したことを発端に国債市場の信認が崩れ、危機はアイルランド、ポルトガル、スペイン、イタリアへ波及した。ギリシャは2010年以降3次にわたる支援を受けた。\n\n欧州安定メカニズム(ESM)や銀行同盟の創設など、**危機が新たな統合装置を生む**というEU特有の力学が働いた局面である。終息は2012年の国債買い入れ策の表明に置く見方が多いが、確定的ではない。","detail":null,"credibility":"disputed","credibility_note":"危機の起点と終息をどの出来事に置くかは論者により異なり、この期間設定は代表的な整理の一つにすぎない。","sources":[{"title":"Wikipedia: European debt crisis","url":"https://en.wikipedia.org/wiki/European_debt_crisis"}]},{"date":"2012-07-26","precision":"day","end_date":null,"type":"point","layer":"市場と通貨","title":"ドラギECB総裁「何でもやる」発言","summary":"ドラギ欧州中央銀行総裁がロンドンで「ユーロを守るためなら何でもやる」と演説し、9月に国債買い入れ策OMTを発表した。南欧諸国の国債利回りは急速に低下していった。\n\n市場の空気を一変させた転機として語られるが、利回り低下の主因が発言そのものかOMTという制度の裏付けかは、経済学的に議論が続いている。中央銀行が事実上の最後の貸し手となったことで、通貨同盟は財政危機を生き延びた。","detail":null,"credibility":"disputed","credibility_note":"利回り低下の主因が発言自体かOMTの制度設計かについては、研究者の間で評価が分かれる。","sources":[{"title":"ECB: Speech by Mario Draghi at the Global Investment Conference in London (2012-07-26)","url":"https://www.ecb.europa.eu/press/key/date/2012/html/sp120726.en.html"}]},{"date":"2015-09-01","precision":"month","end_date":null,"type":"point","layer":"危機と離脱","title":"難民危機が最高潮に","summary":"シリア内戦などから逃れた難民・移民の欧州流入が急増し、2015年の庇護申請は100万件を超えたとされる。ドイツは受け入れを表明し、加盟国間の分担をめぐる対立が激化した。\n\nシェンゲンの自由移動(制度と条約レイヤー)は一部の国で検問復活を招き、各国で反EU政党が伸長した。流入者数の集計は機関により異なる。移民問題は翌年の英国民投票(同レイヤー)でも中心的な争点となった。","detail":null,"credibility":"unverified","credibility_note":"流入者数・庇護申請数はUNHCR、Frontex、Eurostatなど集計主体によって定義と数値が異なる。","sources":[{"title":"Wikipedia: 2015 European migrant crisis","url":"https://en.wikipedia.org/wiki/2015_European_migrant_crisis"}]},{"date":"2016-06-23","precision":"day","end_date":null,"type":"point","layer":"危機と離脱","title":"英国民投票でEU離脱派が勝利","summary":"英国のEU残留・離脱を問う国民投票で離脱支持が51.9%となり、キャメロン首相は辞任を表明した。加盟国が離脱を選んだ初めての事例である。\n\n1973年の加盟以来続いた**「距離を置く加盟国」の帰結**であり、移民・主権・拠出金が主な争点となった。リスボン条約50条(制度と条約レイヤー)に定められた離脱手続きが、初めて発動されることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 2016 United Kingdom European Union membership referendum","url":"https://en.wikipedia.org/wiki/2016_United_Kingdom_European_Union_membership_referendum"}]},{"date":"2017-03-29","precision":"day","end_date":"2020-01-31","type":"period","layer":"危機と離脱","title":"離脱交渉から英国のEU離脱まで","summary":"英国がリスボン条約50条を発動し、離脱条件と将来関係をめぐる交渉が始まった。離脱協定は英議会で3度否決され、メイ首相は退陣、期限は3度延期された末に、2020年1月31日に英国は正式に離脱した。\n\n手続きの困難さは、統合の深さを逆説的に証明した。EU側は27か国の結束を維持し、懸念された「離脱ドミノ」は起きず、世論調査では残る加盟国のEU支持がむしろ上昇した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Brexit","url":"https://en.wikipedia.org/wiki/Brexit"}]},{"date":"2020-07-21","precision":"day","end_date":null,"type":"point","layer":"市場と通貨","title":"復興基金「次世代EU」に合意","summary":"新型コロナ禍からの復興のため、EUが共同債務による7500億ユーロの復興基金「次世代EU」で合意した。補助金と融資を加盟国に配分する仕組みである。\n\nEUの名による大規模な共同借り入れは長くタブーとされてきたもので、**危機による統合の深化**が財政分野にまで及んだ画期といえる。恒久化には慎重論も強く、財政同盟への一歩か一度限りの例外かは開かれた問いである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Next Generation EU","url":"https://en.wikipedia.org/wiki/Next_Generation_EU"}]}]},{"slug":"history-french-revolution","title":"フランス革命とナポレオン","description":"三部会からワーテルローまで。政治体制・民衆・戦争の3層を重ね、自由の理想がいかに恐怖政治と帝政へ転じ、それでも近代の原理を残したのかを追う年表。","category":"history-politics","language":"ja","start_year":1789,"end_year":1815,"layers":[{"name":"政治体制","color":"blue"},{"name":"民衆と社会","color":"pink"},{"name":"戦争と外交","color":"gold"}],"events":[{"date":"1789-05-05","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"三部会がヴェルサイユで開会","summary":"財政危機の打開のため、ルイ16世が175年ぶりに三部会を召集した。聖職者・貴族・平民の3身分の代表が集まったが、身分別議決か頭数議決かをめぐって冒頭から対立し、6月には第三身分が「国民議会」を自称して分離する。\n\n凶作とパンの価格高騰で民衆の生活が極度に悪化していた時期であり(民衆と社会レイヤー)、王権の側が開いた協議の場が、王権そのものを問い直す議会へ変質していく起点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Estates General of 1789","url":"https://en.wikipedia.org/wiki/Estates_General_of_1789"}]},{"date":"1789-07-14","precision":"day","end_date":null,"type":"point","layer":"民衆と社会","title":"バスティーユ牢獄襲撃","summary":"ネッケル罷免と軍隊のパリ集結に反発した民衆が、武器と弾薬を求めて専制の象徴バスティーユ牢獄を襲撃し、守備隊を降伏させた。この日は後にフランスの国民祝日となる。\n\n国民議会の憲法制定作業(政治体制レイヤー)が軍事力で潰される寸前に、民衆の直接行動が議会を救った構図であり、以後の革命は**議会の言葉と街頭の暴力の二重奏**で進む。地方でも領主への蜂起「大恐怖」が広がり、8月4日の封建的特権の廃止につながった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Storming of the Bastille","url":"https://en.wikipedia.org/wiki/Storming_of_the_Bastille"}]},{"date":"1789-08-26","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"人権宣言(人間と市民の権利の宣言)を採択","summary":"国民議会が全17条の人権宣言を採択した。自由・所有・安全・圧制への抵抗を自然権とし、**主権は国民にある**と定めて、法の前の平等と権力分立を掲げた。\n\nバスティーユ襲撃(民衆と社会レイヤー)からわずか6週間後であり、旧体制の身分原理を言葉の上で葬った文書といえる。ただし女性や植民地の奴隷は想定の外に置かれ、宣言の普遍性と適用範囲のずれは、その後の革命の火種であり続けた。1791年憲法の前文にも据えられる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Declaration of the Rights of Man and of the Citizen","url":"https://en.wikipedia.org/wiki/Declaration_of_the_Rights_of_Man_and_of_the_Citizen"}]},{"date":"1789-10-05","precision":"day","end_date":null,"type":"point","layer":"民衆と社会","title":"ヴェルサイユ行進、国王一家をパリへ連行","summary":"パンの欠乏に怒るパリの女性たちを中心とする群衆が、雨の中をヴェルサイユまで行進し、翌6日に国王一家をパリのテュイルリー宮殿へ移させた。国民議会もパリへ移る。\n\n生活物資の問題が王権の所在地を動かした出来事で、以後の国王と議会は、パリ民衆の監視と圧力のもとで政治を行うことになる。人権宣言への国王の裁可拒否(政治体制レイヤー)が行進の引き金の一つだった点に、理念と生活が結びつく革命の性格が表れている。","detail":null,"credibility":"disputed","credibility_note":"行進参加者の規模は数千人から7千人前後まで推計に幅があり、同時代の記録も一致しない。","sources":[{"title":"Wikipedia: Women's March on Versailles","url":"https://en.wikipedia.org/wiki/Women%27s_March_on_Versailles"}]},{"date":"1791-06-20","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"ヴァレンヌ逃亡事件、国王への信頼が崩壊","summary":"ルイ16世一家が変装して国外脱出を図り、国境近くのヴァレンヌで発見されてパリへ連れ戻された。国王が革命を受け入れていないことが誰の目にも明らかになった。\n\n立憲君主制の設計を進めていた議会は動揺し、翌月には共和制を求める請願への発砲事件(シャン・ド・マルスの虐殺)が起きて民衆と穏健派の亀裂も深まる(民衆と社会レイヤー)。逃亡先の亡命貴族と諸外国の介入への不信は、翌年の開戦論(戦争と外交レイヤー)を勢いづけた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Flight to Varennes","url":"https://en.wikipedia.org/wiki/Flight_to_Varennes"}]},{"date":"1792-04-20","precision":"day","end_date":null,"type":"point","layer":"戦争と外交","title":"フランスがオーストリアに宣戦布告","summary":"ジロンド派主導の立法議会が「ボヘミア・ハンガリー王」に宣戦し、革命戦争が始まった。戦況は当初フランスの劣勢で、敵軍の脅迫的なブラウンシュヴァイク宣言はかえってパリ民衆を激高させた。\n\n開戦は革命の輸出を掲げる勢力と、戦争で王権回復を狙う宮廷の思惑が交差した結果であり、以後**戦争が革命の性格を決めていく**。前線の敗報が8月10日の王権停止(民衆と社会レイヤー)を、外患の恐怖が九月虐殺を招き、内政は常に戦況とともに振れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: War of the First Coalition","url":"https://en.wikipedia.org/wiki/War_of_the_First_Coalition"}]},{"date":"1792-08-10","precision":"day","end_date":null,"type":"point","layer":"民衆と社会","title":"8月10日事件、民衆がテュイルリー宮殿を襲撃","summary":"パリの民衆と連盟兵がテュイルリー宮殿を襲撃し、スイス人衛兵隊と激しく交戦した。国王一家は議会に避難し、王権は停止され、男子普通選挙による国民公会の召集が決まった。\n\n対外戦争の敗勢と国王への不信(戦争と外交・政治体制レイヤー)が臨界に達した瞬間で、1789年に始まった立憲君主制の実験はここで事実上終わる。蜂起を主導したパリ・コミューンが以後の政治で発言力を強め、革命は共和制と急進化の段階へ入った。","detail":null,"credibility":"unverified","credibility_note":"双方の死者数は史料により数百人から千人超まで幅があり、確定した集計は存在しない。","sources":[{"title":"Wikipedia: Insurrection of 10 August 1792","url":"https://en.wikipedia.org/wiki/Insurrection_of_10_August_1792"}]},{"date":"1792-09-20","precision":"day","end_date":null,"type":"point","layer":"戦争と外交","title":"ヴァルミーの戦い、義勇兵が侵攻軍を撃退","summary":"北東部ヴァルミーの丘で、義勇兵を含むフランス軍が砲撃戦の末にプロイセン軍の進撃を止めた。死傷者は比較的少ない砲撃戦だったが、革命軍が正規の王軍に対抗できることを示した。\n\n翌21日に国民公会は王政廃止を宣言し、22日から共和暦が起算される。戦場の一勝が共和制宣言(政治体制レイヤー)の露払いとなった象徴的な連鎖である。従軍していたゲーテが「ここから世界史の新しい時代が始まる」と述べたと後年伝えられる。","detail":null,"credibility":"disputed","credibility_note":"ゲーテの言葉は約30年後の回想録に基づくもので、当日の発言かどうかは検証できない。","sources":[{"title":"Wikipedia: Battle of Valmy","url":"https://en.wikipedia.org/wiki/Battle_of_Valmy"}]},{"date":"1793-01-21","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"ルイ16世処刑","summary":"国民公会は僅差の評決で国王の死刑を決め、ルイ16世は革命広場のギロチンで処刑された。国王の身体に体現されてきた主権が、名実ともに国民へ移ったことを示す出来事である。\n\n処刑は諸外国の強い反発を招き、イギリス・スペインなどが加わる第一次対仏大同盟の結成(戦争と外交レイヤー)を決定的にした。国内でもヴァンデ地方の反乱が起き、内憂外患のなかで公安委員会への権力集中と恐怖政治への道が開かれていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Execution of Louis XVI","url":"https://en.wikipedia.org/wiki/Execution_of_Louis_XVI"}]},{"date":"1793-08-23","precision":"day","end_date":null,"type":"point","layer":"戦争と外交","title":"国民総動員令(ルヴェ・アン・マス)を布告","summary":"国民公会が全国民を戦争遂行に動員する国民総動員令を布告した。独身男性は前線へ、既婚男性は武器製造へ、女性は被服と看護へと、社会全体を戦争機械に組み込む前例のない体制である。\n\n傭兵と職業軍人の戦争から**国民が国民として戦う戦争**への転換点であり、翌年までにフランス軍は諸国を圧倒する兵力を持った。この動員国家の型は徴兵制として後の各国に受け継がれ、革命の遺産のうち最も両義的なものの一つとなる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Levée en masse","url":"https://en.wikipedia.org/wiki/Lev%C3%A9e_en_masse"}]},{"date":"1793-09-05","precision":"day","end_date":"1794-07-27","type":"period","layer":"政治体制","title":"恐怖政治","summary":"外敵の侵攻と内乱の危機を背景に、公安委員会が独裁的権力を握り、反革命容疑者法と革命裁判所による大量処刑が進んだ。マリー・アントワネット、ジロンド派、さらにダントンら革命の同志までがギロチンに送られた。\n\n**共和国の防衛が暴力を正当化する**という論理の帰結であり、戦況の好転(戦争と外交レイヤー)後もテロルが加速したことが、テルミドールの反動を招く。処刑判決は全国で1万6千件以上とされるが、裁判によらない死者を含む総数は諸説ある。","detail":null,"credibility":"disputed","credibility_note":"開始点を1793年9月5日の国民公会決議とするのは通説的な区切りであり、犠牲者総数も1万6千人強の処刑判決から数万人超まで推計が分かれる。","sources":[{"title":"Wikipedia: Reign of Terror","url":"https://en.wikipedia.org/wiki/Reign_of_Terror"}]},{"date":"1794-07-27","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"テルミドール9日のクーデタ、ロベスピエール失脚","summary":"国民公会がロベスピエールらの逮捕を決議し、翌日彼らは裁判なしで処刑された。革命暦テルミドール9日の政変により恐怖政治は終わり、公安委員会の権限は縮小された。\n\n粛清の恐怖が議員自身に及んだことが結束を生んだ政変であり、思想的な転換というより自己保存の反射だった。以後は穏健共和派の総裁政府へ移行するが、政情は安定せず、左右からの脅威のたびに軍の力を借りる悪循環が、ブリュメールの軍事クーデタの土壌を用意する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Thermidorian Reaction","url":"https://en.wikipedia.org/wiki/Thermidorian_Reaction"}]},{"date":"1796-03-01","precision":"month","end_date":"1797-10-17","type":"period","layer":"戦争と外交","title":"ナポレオンのイタリア遠征","summary":"26歳でイタリア方面軍司令官となったナポレオン・ボナパルトが、劣勢の軍を率いてサルデーニャとオーストリアを連破し、1797年のカンポ・フォルミオ条約で第一次対仏大同盟を事実上崩壊させた。\n\n戦費と美術品の送金で総裁政府(政治体制レイヤー)を財政的に支え、独断で講和条件を決めるなど、一将軍が外交を動かす前例を作った。勝利の報道が生んだ国民的人気は、後のクーデタの政治資本となる。革命が生んだ軍隊が革命政府を凌ぎ始めた期間である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Italian campaigns of the French Revolutionary Wars","url":"https://en.wikipedia.org/wiki/Italian_campaigns_of_the_French_Revolutionary_Wars"}]},{"date":"1799-11-09","precision":"day","end_date":null,"type":"point","layer":"政治体制","title":"ブリュメール18日のクーデタ、統領政府樹立","summary":"エジプトから帰国したナポレオンが、シェイエスらと結んで総裁政府を倒し、自らを第一統領とする統領政府を樹立した。憲法上の手続きを装ったが、実態は軍を背景とする政変である。\n\n10年間の混乱に疲れた社会が「革命の成果を保証する強い政府」を受け入れた瞬間であり、**革命は自らが生んだ軍人に幕を引かれた**。ただし新体制は封建制復活ではなく、法の前の平等や国有化財産の保有を保証しており、革命の遺産の管理者を名乗った点が重要である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Coup of 18 Brumaire","url":"https://en.wikipedia.org/wiki/Coup_of_18_Brumaire"}]},{"date":"1804-03-21","precision":"day","end_date":null,"type":"point","layer":"民衆と社会","title":"ナポレオン法典(フランス民法典)公布","summary":"全2281条の民法典が公布された。法の前の平等、所有権の不可侵、契約の自由、政教分離といった**革命の原理を日常生活の法として固定**し、旧体制の身分特権と封建的負担の廃止を不可逆にした。\n\n一方で家族法では夫と父の権限を強め、女性の法的地位は革命期より後退した面もある。法典は征服地とともに欧州へ広がり、日本を含む多くの国の民法典の母法となった。ナポレオン自身が最大の遺産と呼んだ、戦勝より長持ちした成果である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Napoleonic Code","url":"https://en.wikipedia.org/wiki/Napoleonic_Code"}]},{"date":"
