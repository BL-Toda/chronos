ified","credibility_note":null,"sources":[]},{"date":"2026-01-01","precision":"month","end_date":null,"type":"point","layer":"転機と決断","title":"50歳、次の10年の設計図を書く","summary":"50歳の正月、これまでの転機を1枚の紙に書き出してみました。不本意な入社、独学、転職、退職勧奨、独立、法人化、移住。**自分から選んだ転機は半分もなかった**のですが、選び直した回数なら全部でした。\n\n次の10年は、会社を若い2人に少しずつ渡しながら、氷河期世代の学び直しと再挑戦を支援する仕事を事業の柱に加えます。入口で詰まった世代の、出口を作る側に回りたいのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-cooking","title":"🍳 料理スキルの進化","description":"2005年、進学を機に自炊ゼロから始めた僕の20年の記録です。台所の記録に暮らしの転機と食の時代を重ねて、レシピサイトから動画、値上げの時代まで、家の台所が社会とどうつながってきたかを残しています。","category":"personal-life","language":"ja","start_year":2005,"end_year":2026,"layers":[{"name":"台所の記録","color":"green"},{"name":"暮らしの転機","color":"gold"},{"name":"食の時代","color":"orange"}],"events":[{"date":"2005-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"京都で一人暮らしを始める","summary":"大学進学で福岡から京都へ。六畳にミニキッチンのワンルームで、18年間の実家暮らしが終わりました。炊飯器と包丁一本は、母が持たせてくれたものです。\n\n自炊を始めた動機は仕送りの節約でした。頼りは雑誌の切り抜きと母への電話で、レシピをネットで調べる習慣はまだ薄かった頃です。台所の記録は、ここから始まります。最初に買い足した道具は、100円の計量カップでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2005-05-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"🍛 最初のカレー、鍋を焦がす","summary":"初めての自炊はカレーでした。ルウの箱の手順すら読み飛ばして、水を減らしすぎて鍋底を焦がしました。それでも食べられたことに驚いた、と当時の日記にあります。\n\n失敗の原因を調べもせず、次も勘で作っていました。**焦げた鍋から始まった**この年表は、道具と情報が台所をどう変えるかの記録でもあります。20年後、僕はもう一度このカレーを作り直すことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2006-04-01","precision":"month","end_date":"2008-03-31","type":"period","layer":"台所の記録","title":"定食屋のまかないで基礎を覚える","summary":"学生街の定食屋でアルバイトを始めて、まかない付きの2年間で包丁の持ち方、だしの取り方、火加減を仕込まれました。店主の口癖は「レシピより段取り」。皿洗いから始めて、半年で仕込みを任せてもらえるようになりました!\n\n体系立てて習ったわけではないんですが、目の前で見て真似るという覚え方は、のちの動画レシピの時代を先取りしていたのかもしれません。この2年が、僕の料理の土台になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"食の時代","title":"「弁当男子」という言葉が広まる","summary":"弁当を自作する男性を指す「弁当男子」という言葉が、メディアで広まりました。節約志向と健康志向を背景に、男性の料理が特集される機会が増えた年です。\n\n流行の起点や広がりの実態を示す確かな統計はなく、報道ベースの流行語ではあります。ただ、料理は女性のものという前提が緩み始めた空気は、数年後に弁当を作り始める僕の背中を確かに押してくれました。","detail":null,"credibility":"unverified","credibility_note":"流行語としての起点や普及の程度は報道ベースで、確かな統計や確定した初出はありません。","sources":[{"title":"「弁当男子」に関する各紙報道(2009年)","url":null}]},{"date":"2009-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"就職、自炊が途絶える","summary":"大阪の機械メーカーに営業職で入社しました。歓迎会、残業、外回り。気づけば冷蔵庫には調味料だけが残って、自炊は月に数回まで減っていました。\n\nリーマン・ショック直後の就職で、同期は当初の予定より少なかったと聞いています。コンビニと外食に頼る毎日は、忙しさの記録でもあります。台所が復活するには、震災と弁当というふたつの出来事を待つことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-07-01","precision":"month","end_date":null,"type":"point","layer":"食の時代","title":"クックパッドが上場","summary":"レシピ投稿サイトのクックパッドが東証マザーズに上場しました。家庭の無数のレシピが検索される時代の到来を象徴する出来事です。\n\n「レシピは本で調べるもの」から「検索するもの」への転換点でした。自炊を休んでいた僕(暮らしの転機レイヤー)がのちに台所へ戻ったとき、まず開いたのはこのサイトです。**台所に検索窓がついた**時代の始まりでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"クックパッド株式会社: 東証マザーズ上場(2009年7月)","url":null}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"食の時代","title":"東日本大震災、家で作る意味が問い直される","summary":"東北地方太平洋沖地震と津波で、東日本の広い範囲が甚大な被害を受けました。首都圏では計画停電が行われ、店頭から米や水が消えました。\n\n外食やコンビニに頼る暮らしの脆さが意識されて、家で作って食べることの意味が問い直された時期です。大阪にいた僕も、買い置きと自炊を再開しました。食をめぐる「内向き」への転換は、この日を境に語られることが多いように思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成23年(2011年)東北地方太平洋沖地震","url":null}]},{"date":"2012-06-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"🍱 週3日の弁当作りを始める","summary":"節約と昼の栄養を考えて、週3日の弁当を始めました。前の晩の残りと卵焼き、冷凍ブロッコリー。職場では「弁当男子」とからかわれましたが、続きました。卵焼きは百回焼いて、ようやく形になりました!\n\n震災をきっかけに再開した自炊が、習慣として定着した時期です。レシピ検索が毎晩の日課になりました。数年前に流行語だった言葉(食の時代レイヤー)が、そのまま自分の生活になったわけです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2013-12-04","precision":"day","end_date":null,"type":"point","layer":"食の時代","title":"和食がユネスコ無形文化遺産に登録","summary":"「和食;日本人の伝統的な食文化」がユネスコ無形文化遺産に登録されました。自然の尊重や年中行事との結びつきが評価されたそうです。\n\n登録が家庭の食卓を直接変えたわけではないと思いますが、だしや一汁三菜が改めて語られるきっかけにはなりました。まかない時代に習っただしの取り方を僕が引っ張り出したのも、この頃です。書店には、だしの特集を組む雑誌が並んでいました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"農林水産省: 「和食」のユネスコ無形文化遺産登録","url":null}]},{"date":"2014-11-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"だしを引く生活","summary":"昆布と鰹節でだしを取って、味噌汁を毎朝作るようになりました。休日に昆布水を仕込んで、平日はそれで済ませる自己流の段取りも固まりました。鰹節は削り節で妥協しましたが、香りの違いには驚きました!\n\n和食の遺産登録以降の「だしブーム」に乗った形です。でも手を動かすと、定食屋の店主の言葉が戻ってきました。レシピより段取り。**基本はいつも、人から習ったものでした**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-01-01","precision":"year","end_date":null,"type":"point","layer":"食の時代","title":"1分料理動画アプリが台頭","summary":"スマートフォン向けの短い料理動画サービスが次々に登場して、レシピを「読む」時代から「見る」時代への移行が進みました。\n\n各サービスの開始時期や利用者数は自社発表が中心で、正確な比較は難しいところです。ただ、手元を映す動画が火加減や手順の「見て覚える」を誰にでも開いたことは、まかないで育った身として実感を持って言えます。","detail":null,"credibility":"unverified","credibility_note":"各サービスの開始時期・利用者数は自社発表ベースで、第三者による確定的な統計がありません。","sources":[{"title":"料理動画サービス各社のプレスリリース(2015〜2016年)","url":null}]},{"date":"2017-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"東京転勤、1Kの狭い台所へ","summary":"東京本社へ異動して、まな板を置くと調理スペースが消える1Kのキッチンになりました。フライパン一つ、鍋一つに道具を絞りました。\n\n制約は工夫の母というやつで、ワンパン調理と作り置きに傾いたのはこの部屋のせいです。動画アプリの「狭いキッチン向け」特集にも助けられました。台所の広さより段取りが腕を決めるんだと、狭さに教わりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-03-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"週末の作り置きを習慣化","summary":"日曜の夜に常備菜を4品作る習慣が定着しました。きんぴら、塩ゆで鶏、ミニトマトのマリネ。保存容器を統一したら、冷蔵庫が図書館みたいになりました!\n\n平日の自炊率は一気に上がって、外食は「行きたい店」だけになりました。検索と動画で覚えた技術が、狭い台所の制約と組み合わさって自分の型になった時期です。日曜の台所仕事は、気づけば週の楽しみになっていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"食の時代","title":"小麦粉やホットケーキミックスが品薄に","summary":"外出自粛で家庭での菓子作りやパン作りが広がって、小麦粉やホットケーキミックスの品薄が各地で報じられました。\n\n台所が娯楽の場になったことを示す、象徴的な現象だったと思います。メーカーは増産で対応して、品薄は秋にかけて解消へ向かいました。在宅で三食を作っていた僕(暮らしの転機レイヤー)も、生まれて初めてパンを焼いた一人です。スーパーの粉売り場が空になった光景は、今も覚えています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ホットケーキミックス等の品薄に関する報道(2020年春)","url":null}]},{"date":"2020-04-07","precision":"day","end_date":"2020-05-25","type":"period","layer":"暮らしの転機","title":"在宅勤務、三食を自分で作る","summary":"緊急事態宣言で在宅勤務になって、生まれて初めて三食を自分で作る日々になりました。昼はパスタばかり茹でていた記録が残っています。\n\n同じ頃、全国で小麦粉や製菓材料が品薄になりました(食の時代レイヤー)。台所に立つ人が一斉に増えた春です。僕の料理も「済ませるもの」から「楽しみ」へ変わり始めました。毎日の献立を考える大変さも、このとき初めて知りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-05-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの転機","title":"結婚、ふたりの台所になる","summary":"在宅期間に再会した大学時代の友人と結婚して、2LDKに移りました。台所の主導権は週替わり、味噌汁の味噌は折衷案で合わせ味噌になりました。\n\n料理が「自分の管理」から「ふたりの運営」に変わった転機です。得意料理のカレーは、相方の一票で辛口から中辛になりました。台所は初めて、交渉の場になりました。冷蔵庫の中身にも、ふたり分の歴史が同居し始めています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-11-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"低温調理器を導入する","summary":"ボーナスで低温調理器を買って、鶏むね肉と温度の関係に沼のようにはまりました。63度と68度の違いを食べ比べて、ノートに記録しました。\n\n感覚で覚えた火加減を数値で捉え直す経験は、まかないで仕込まれた技術に理屈の裏付けをくれました。家庭の調理家電が「科学」を連れてきた時期で、SNSには温度と時間の一覧表が飛び交っていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-10-01","precision":"month","end_date":null,"type":"point","layer":"食の時代","title":"食品値上げ、単月で6,000品目超","summary":"原材料高と円安を背景に食品の値上げが相次いで、民間調査では2022年10月だけで6,000品目を超える値上げが集計されました。\n\n品目数は調査対象の範囲で変わるそうですが、台所への逆風は数字以上に日常的でした。わが家では献立の起点が「食べたいもの」から「安かったもの」へ移って、それはそれで料理の腕を鍛えてくれました。レシートの合計を見て、そっと献立を組み替えていました。","detail":null,"credibility":"disputed","credibility_note":"値上げ品目数は調査会社の集計対象(主要メーカーの範囲)により変動し、数値には幅があります。","sources":[{"title":"帝国データバンク: 食品主要メーカー価格改定動向調査(2022年)","url":null}]},{"date":"2026-01-01","precision":"month","end_date":null,"type":"point","layer":"台所の記録","title":"🍛 20年目のカレーを作り直す","summary":"自炊歴20年の節目に、あの最初のカレーを箱の手順どおりに作り直しました。焦がさず、でも驚くほど普通の味でした。隠し味は何も入れていません。隣で相方が笑っていました。\n\n検索、動画、低温調理、値上げ。台所は時代の道具と事情に振り回され続けましたが、**うまくなったのは料理じゃなくて、暮らしの段取り**なんだと思います。次の20年も、たぶん台所にいます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-diet-log","title":"ダイエット記録","description":"35歳の健診で初めて引っかかってから続けている、体重と健康の記録です。数値の変化と食事・運動の試行錯誤に、健診の制度や世の中の動きを重ねました。急がない減量が習慣になるまでの18年。1973年生まれの会社員の、無理はしない、記録するだけの健康管理です。","category":"personal-life","language":"ja","start_year":2008,"end_year":2026,"layers":[{"name":"からだの記録","color":"green"},{"name":"食事と運動","color":"gold"},{"name":"健康と社会","color":"blue"}],"events":[{"date":"2008-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"特定健診・特定保健指導(メタボ健診)が始まる","summary":"40〜74歳を対象に、内臓脂肪に着目した特定健診・特定保健指導が始まりました。同じ年度から職場の定期健診にも腹囲の測定が加わり、「メタボリックシンドローム」という言葉が一般に定着していきます。\n\n生活習慣病の予防を医療保険者に義務づけた制度で、体型が公的な数値として測られる時代の始まりでもありました。35歳のわたしの結果票にも、この年から腹囲の欄が現れました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 特定健診・特定保健指導について","url":null}]},{"date":"2008-06-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"35歳、健診で腹囲と血圧が基準を超える","summary":"職場の定期健診で腹囲86センチ、血圧はやや高めの判定でした。体重は大学卒業時から10キロ増。結果票の「生活習慣の改善を」という一行を、初めて自分のこととして読みました。\n\nこの年から健診に腹囲の測定が加わっていて(健康と社会レイヤー)、制度が変わらなければ気にも留めなかった気がします。この一枚が、18年続くことになる記録の一枚目です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2008-09-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"自己流の欠食ダイエットで体調を崩す","summary":"手っ取り早く昼食を抜く方法で1か月に4キロ落としましたが、午後の集中力が落ち、立ちくらみまで出て産業医に相談しました。「減らすべきは食事の回数ではない。急ぎすぎです」と止められました。\n\n**短期間で大きく減らす方法は続かないうえに体に悪い**。いま思えば当然の教訓を、身をもって学んだ失敗です。以後の記録は、ここを起点に読んでいただくと分かりやすいと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-03-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"半年で元の体重に戻る","summary":"欠食をやめた反動もあって、半年で体重は元に戻り、むしろ1キロ増えました。世に言うリバウンドを自分の数値で確認した、最初の記録です。\n\n急な減量は筋肉も一緒に落とすので、戻るときは脂肪が増えやすいのだと、のちの保健指導で教わりました。この頃はまだ体重しか測っておらず、何が減って何が増えたのか、知りようがありませんでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2013-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"健康日本21(第二次)が始まる","summary":"国民の健康づくり運動「健康日本21」の第二次計画が2013年度に始まりました。健康寿命の延伸を中心目標に、適正体重の維持や日常の歩数の増加など、具体的な数値目標を定めています。\n\n個人の努力だけでなく社会環境の整備を掲げた点が特徴で、企業の健康経営や自治体のウォーキング事業が広がる下地になりました。うちの会社に歩数計配布の制度ができたのも、この流れの中です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 健康日本21(第二次)","url":null}]},{"date":"2013-10-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"特定保健指導を受け、記録を始める","summary":"40歳の健診でまた基準を超え、特定保健指導の対象になりました。保健師さんと立てた目標は「3か月でマイナス2キロ」。方法は**毎日の体重と歩数を記録するだけ**という、拍子抜けするものでした。\n\n5年前の失敗を話すと、保健師さんは「早く減らした人から戻っていきます」と。記録はノートから携帯のアプリに移り、結果的にこれが、いちばん長く続く習慣になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2014-06-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"8か月でマイナス4キロ、血圧が正常域に","summary":"記録を始めて8か月、体重は緩やかに4キロ減り、血圧は正常域に戻りました。月に0.5キロという保健師さんの設定ペースを、結果的にほぼなぞった形です。\n\n変えたのは記録のほかに、揚げ物を週2回までにしたことと、地下鉄を一駅手前で降りることだけ。劇的な方法を何も使っていないのが、5年前のリバウンドとのいちばんの違いでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"機能性表示食品制度が始まる","summary":"事業者の責任で食品の機能性を表示できる、機能性表示食品制度が始まりました。「脂肪の吸収を抑える」といった表示の飲料や食品が店頭に並び、健康食品の市場が広がっていきます。\n\n国が個別に審査するトクホと違って届出制である点への注意も指摘されました。表示に頼って食事全体を変えないままでは意味がない、というのが保健指導で受けた助言です。以来、裏の表示だけは読む買い物客になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"消費者庁: 機能性表示食品について","url":null}]},{"date":"2017-02-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"単身赴任で外食続き、記録が途切れる","summary":"帯広への単身赴任が決まり、生活が一変しました。自炊をやめて外食と弁当が続き、歩数は増えたのに体重は増加。年末には、記録アプリを開かない日のほうが多くなっていました。\n\n環境が変わると習慣は簡単に崩れる。それを実感した2年間の始まりです。数値の悪化そのものより、記録が途切れたことのほうが、あとから見れば先に灯った危険信号でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-06-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"血糖が予備群の判定に","summary":"45歳の健診で体重は4年前より3キロ増、初めてHbA1cが基準を超えて糖尿病予備群の判定を受けました。腹囲も再び基準超え。単身赴任2年目の数字です。\n\n医師からは「今なら生活習慣で戻せる段階」と説明を受けました。体重そのものより、血糖や血圧といった**健診の数値を目標にする**発想に切り替えたのは、この判定がきっかけです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-09-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"食べる順番と一駅歩きを再開する","summary":"社員食堂で野菜から食べる、丼ものを定食に替える、帰りは一駅歩く。単身赴任先でもできることに絞って、習慣を組み直しました。記録アプリも再開し、朝一番の体重測定は歯磨きとセットにしました。\n\n新しいことを始めるより、以前できていたことに戻るほうが早い。翌年の健診でHbA1cは基準内に戻り、結果票から「予備群」の文字が消えました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"健康と社会","title":"成人男性の肥満者の割合が3割を超える","summary":"国民健康・栄養調査で、20歳以上の男性の肥満者(BMI25以上)の割合は33.0%と報告されました。10年前より増加傾向で、特に40〜50代で高い水準です。\n\n調査年や集計方法で数値は前後しますが、働き盛りの3人に1人という水準は、個人の意志の問題だけでは説明がつかないと思います。座り続ける仕事と外食中心の環境。わたしの単身赴任の2年間と、そのまま重なります。","detail":null,"credibility":"disputed","credibility_note":"肥満者割合33.0%は2019年調査(公表は2020年)の値で、調査年や年齢区分の取り方により数値は変動します。","sources":[{"title":"厚生労働省: 令和元年 国民健康・栄養調査結果の概要","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2020-12-31","type":"period","layer":"食事と運動","title":"在宅勤務で歩数が半減、朝散歩を始める","summary":"感染症の流行で単身赴任が解除され、在宅勤務になりました。通勤がなくなって歩数は1日3000歩台へ半減。危機感から、始業前に30分歩く「朝散歩」を家族と始めた9か月です。\n\n「コロナ太り」という言葉が広がった時期ですが(健康と社会レイヤー)、記録を見るとこの年の体重は横ばいで守れています。習慣の置き換えを早めに打てたのが大きかったようです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-06-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"「コロナ太り」を報じる調査が相次ぐ","summary":"外出自粛による運動不足と間食の増加で体重が増えたとする民間調査が相次いで報じられ、「コロナ太り」という言葉が広く使われました。増加幅は調査により1〜3キロ程度と幅があります。\n\nいずれもアンケートベースの民間調査で、国の統計で確認された現象ではない点には注意がいります。ただ、生活環境の急変が体重に直結することを、社会全体が同時に体験した時期ではありました。","detail":null,"credibility":"unverified","credibility_note":"「コロナ太り」の増加幅は民間のアンケート調査に基づく報道で、公的統計による裏づけは確認できません。","sources":[{"title":"在宅勤務と体重増加に関する民間調査の各社報道(2020年)","url":null}]},{"date":"2022-05-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"49歳、記録を始めた頃より5キロ軽い健診結果","summary":"健診の結果票を並べてみると、体重は特定保健指導を受けた頃より5キロ軽く、血圧・血糖・脂質はすべて基準内でした。劇的な変化はどの年にもなく、折れ線はただ緩やかに下がっています。\n\nいちばんの変化は数値より、結果票を恐れなくなったことかもしれません。**目標は痩せることから、悪化させないことへ**。記録を続けるうちに、いつの間にか置き換わっていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2023-09-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"筋力の低下を指摘され、自重トレを加える","summary":"市のスポーツセンターの体力測定で、握力と脚力が同年代の平均を下回りました。減量はできても筋肉が足りないという指摘で、スクワットと腕立てを週2回、朝散歩に追加しました。\n\n年齢を重ねてからは、体重を減らすことより筋肉を保つことが大事になると教わりました。「軽ければよい」わけではない。体重だけを見ていた15年前のわたしには、なかった視点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-04-01","precision":"month","end_date":null,"type":"point","layer":"健康と社会","title":"健康日本21(第三次)が始まる","summary":"2024年度から健康日本21(第三次)が始まりました。健康寿命の延伸に加えて「誰一人取り残さない健康づくり」を掲げ、若年女性のやせや高齢期の低栄養など、痩せる方向の課題も明記されています。\n\n「太りすぎ」だけでなく「痩せすぎ」も公衆衛生の課題として並んだわけです。減量そのものを目的にしない。わたしが遠回りして学んだことと、同じ方向を向いていると感じます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省: 健康日本21(第三次)","url":null}]},{"date":"2025-10-01","precision":"month","end_date":null,"type":"point","layer":"からだの記録","title":"52歳の健診、オールAではないが悪化なし","summary":"52歳の健診は、視力と聴力に年齢相応の低下があり、オールAとはいきませんでした。ただ、生活習慣に関わる項目は8年連続で基準内。主治医の講評は「維持できています」の一言でした。\n\n18年前の結果票と見比べると、数値より書き込みの量が違います。当時は空欄だった生活習慣の欄に、いまは歩数と筋トレの頻度。維持は地味ですが、積み重なると履歴になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-05-01","precision":"month","end_date":null,"type":"point","layer":"食事と運動","title":"18年分の記録を年表にする","summary":"体重のグラフと健診結果、そのとき起きたことをひとつの年表にまとめました。急な減少と増加の山谷は例外なく体調不良か生活の激変と重なり、良い区間はいつも変化が小さいのです。\n\n18年やって分かったのは、ダイエットとは減らす技術ではなく**崩れたあとに戻ってくるための段取り**だということ。この記録は自慢ではなく、次に崩れたとき最短で戻るための地図として残します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-family-history","title":"家族の歴史","description":"熊本から集団就職で大阪へ出た祖父、町の電器店を継いだ父、そして記録係の私。一家の70年を、家族の出来事・店と生業・時代の出来事の3層で重ねました。1970年と2025年、ふたつの万博のあいだに流れた戦後を、三代目の目でたどります。","category":"personal-life","language":"ja","start_year":1954,"end_year":2025,"layers":[{"name":"家族の出来事","color":"pink"},{"name":"店と生業","color":"orange"},{"name":"時代の出来事","color":"blue"}],"events":[{"date":"1954-04-01","precision":"month","end_date":null,"type":"point","layer":"時代の出来事","title":"集団就職列車が走り始める","summary":"地方の中学卒業者を都市部の就職先へまとめて運ぶ、いわゆる集団就職列車がこの頃から走り始めました。1954年4月の青森発上野行きを第1号とする説が有名ですが、それ以前の類似の輸送を挙げる説もあります。\n\n高度経済成長期の労働力移動を象徴する光景で、中卒の就職者は「金の卵」と呼ばれました。この2年後、熊本の農家の三男だった祖父も、この流れの中で大阪へ向かうことになります。","detail":null,"credibility":"disputed","credibility_note":"「集団就職列車の第1号」は1954年4月の青森発上野行きとする説が有名ですが、何をもって最初とするかには諸説あります。","sources":[{"title":"Wikipedia: 集団就職","url":"https://ja.wikipedia.org/wiki/%E9%9B%86%E5%9B%A3%E5%B0%B1%E8%81%B7"}]},{"date":"1956-03-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖父15歳、集団就職で熊本から大阪へ","summary":"中学校を出た祖父は、同級生4人と夜行列車で大阪へ発ちました。行き先は町工場の多い東大阪の電機部品工場。持ち物は布団袋と、母親が持たせた干し芋だったと、祖父は生前よく話していました。\n\n**布団袋ひとつで乗った夜行列車**が、うちの一家の大阪の始まりです。工場の寮から夜学に通い、ラジオの修理を独学で覚えたこと。それが、のちの店の原点になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1964-10-10","precision":"day","end_date":null,"type":"point","layer":"時代の出来事","title":"東京五輪開幕、テレビが茶の間の主役に","summary":"アジアで初めての五輪が東京で開かれ、開会式は全国に中継されました。五輪を機にテレビの世帯普及は一段と進み、白黒テレビの普及率は9割前後に達したとされます。\n\n普及率の数値は調査により幅がありますが、街頭テレビの時代が終わり「一家に一台」が当たり前になった転換は確かです。祖父の工場もテレビ部品の増産に沸き、その年の暮れ、祖父は祖母と所帯を持ちました。","detail":null,"credibility":"disputed","credibility_note":"白黒テレビ普及率の水準は、調査(内閣府消費動向調査など)や時点の取り方により数値が異なります。","sources":[{"title":"内閣府: 消費動向調査(主要耐久消費財の普及率)","url":null}]},{"date":"1966-09-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"父が生まれる","summary":"祖父26歳、祖母23歳のとき、長男である父が東大阪の社宅で生まれました。名前には「電気の恩」にちなむ字が入っている、というのが祖父の晩年の定番の話です。\n\nこの年は丙午(ひのえうま)の迷信で全国の出生数が大きく落ち込んだ年でもあり、父は「同級生の少ない学年」で育ちました。迷信が人口統計を動かした年の生まれであることを、父は少し気に入っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1970-03-15","precision":"day","end_date":"1970-09-13","type":"period","layer":"時代の出来事","title":"大阪万博が開かれる","summary":"「人類の進歩と調和」を掲げた日本万国博覧会が千里丘陵で開かれ、183日間で約6400万人が入場しました。太陽の塔、月の石、動く歩道。高度経済成長の頂点を象徴する祭典です。\n\n祖父一家は会期中に3度通い、3歳の父を肩車して太陽の塔の前で撮った写真が残っています。**一家のアルバムで最初の観光写真**で、55年後にもう一度万博を訪ねる伏線になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"万博記念公園: 日本万国博覧会(大阪万博)の概要","url":null}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"時代の出来事","title":"第一次石油危機","summary":"第四次中東戦争を機に原油価格が高騰し、狂乱物価と呼ばれる物価上昇やトイレットペーパー騒動が起きました。高度経済成長は事実上ここで終わり、翌1974年は戦後初のマイナス成長になります。\n\n祖父の勤め先も受注減で残業が消え、夜勤手当をあてにしていた家計は苦しくなったそうです。「雇われているかぎり景気に振り回される」。祖父が独立を考え始めたのはこの冬からだと、祖母から聞きました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: オイルショック","url":"https://ja.wikipedia.org/wiki/%E3%82%AA%E3%82%A4%E3%83%AB%E3%82%B7%E3%83%A7%E3%83%83%E3%82%AF"}]},{"date":"1976-04-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"祖父36歳、商店街に電器店を開く","summary":"貯金と勤め先の親方の口利きで、祖父は36歳で、東大阪の商店街の一角に家電メーカー系列の小さな電器店を開きました。売り物はテレビ、冷蔵庫、洗濯機。店の奥が住まいで、配達は自転車の荷台から始まりました。\n\n当時は全国にメーカー系列の「町の電器店」が数万軒あって、家電は近所の顔見知りから買うのが普通でした。石油危機で独立を決めた祖父にとって、店は雇われない生き方の答えだったのだと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1989-04-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"父22歳、店に入る","summary":"工業高校と電機メーカーの販売会社勤務を経て、父が店に入りました。昭和から平成に替わった年の春で、店の看板を掛け替えるついでに「親子で営業中」の札を下げたそうです。\n\n消費税3%が導入された月でもあり、全商品の値札の付け替えが親子最初の共同作業になりました。エアコンとビデオデッキが売れ筋の時代。店がいちばん忙しかったのはこの頃だと、父はいまも言います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1993-06-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"私が生まれる","summary":"父26歳の子として、私が生まれました。店の二階が子ども部屋で、ドライバーとテスターが最初のおもちゃだったというのは、たぶん半分くらい本当です。\n\n生まれた頃の日本はバブル崩壊後の平成不況に入っていましたが、店はまだ地域の御用聞きとして安定していました。私の子ども時代の記憶は、店頭に並ぶテレビの光と、配達先で出されるお茶の匂いでできています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1995-01-17","precision":"day","end_date":null,"type":"point","layer":"時代の出来事","title":"阪神・淡路大震災","summary":"淡路島北部を震源とする直下型地震が阪神地域を襲い、6400人を超える方が犠牲になりました。倒壊した高速道路の映像は、都市の防災の前提を大きく揺るがしました。\n\n東大阪の店は商品が棚から落ちる程度で済みましたが、直後から乾電池と携帯ラジオを求めるお客さんが列を作ったそうです。祖父は在庫のラジオを箱ごと神戸の同業者へ送りました。店が「電気のよろず屋」として頼られた出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成7年(1995年)兵庫県南部地震","url":null}]},{"date":"2001-11-23","precision":"day","end_date":null,"type":"point","layer":"時代の出来事","title":"ヨドバシカメラ マルチメディア梅田が開業","summary":"大阪駅前に大型家電量販店ヨドバシカメラ マルチメディア梅田が開業し、初日から長蛇の列になりました。ポイント還元と豊富な在庫を武器に、家電の買い場は郊外店と都心の大型店へ集中していきます。\n\n町の電器店には、価格で勝てない時代の到来でした。父は「うちは売る店やなく、直す店や」と方針を切り替え、配線工事と修理、高齢のお客さんの御用聞きに軸足を移していきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ヨドバシカメラ マルチメディア梅田の開業に関する報道(2001年11月)","url":null}]},{"date":"2010-01-01","precision":"year","end_date":null,"type":"point","layer":"時代の出来事","title":"町の電器店はピーク時の半分以下に","summary":"メーカー系列の地域電器店は、最盛期の1980年代には全国に数万軒あったとされますが、量販店やネット通販への移行で減り続け、この頃にはピーク時の半分以下になったとされます。\n\n店舗数の推移を示す一貫した公的統計はなく、業界団体やメーカーの公表値・報道に基づく推計です。一方で、高齢化の進む商店街では、設置や修理まで面倒を見るうちのような店の価値が、静かに見直されてもいました。","detail":null,"credibility":"unverified","credibility_note":"系列電器店の店舗数の推移は業界団体・メーカー公表値と報道による推計で、一貫した公的統計は確認できていません。","sources":[{"title":"地域家電店(まちの電器屋)の減少に関する各社報道","url":null}]},{"date":"2011-07-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"地デジ移行、店の最後の特需","summary":"7月24日のアナログ放送終了を前に、アンテナ工事とテレビ設置の依頼が店に殺到しました。祖父71歳と父44歳が朝から晩まで屋根に登ったこの数か月は、**店の歴史で最後の特需**になりました。\n\n国策のテレビ買い替えは量販店に大きな売上をもたらしましたが、高齢世帯の工事や設定を支えたのは町の電器店です。「最後まで残る仕事は工事と説明や」という父の言葉どおりの日々でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省: 地上デジタル放送への完全移行(2011年7月24日)","url":null}]},{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"店と生業","title":"開業から40年、店を閉める","summary":"祖父75歳の冬、店を閉めました。理由は後継ぎの不在ではなく、祖父の体力と、修理部品の供給が終わる製品が増えたこと。最終日は常連のお客さんが入れ代わり立ち代わり訪れ、店の前で記念写真を撮りました。\n\n父は住宅設備の会社に移り、電気工事の腕はそのまま生きています。閉店を惜しむ声の多くが「テレビを買った店」ではなく「直してくれた店」としての記憶だったこと。それが、うちの一家の誇りです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-11-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖父、78歳で死去","summary":"祖父が78歳で亡くなりました。葬儀には熊本から同郷の元同級生の方々が駆けつけてくださり、集団就職の夜行列車の話を、私はこのとき初めて詳しく聞きました。棺には店の名前入りの作業帽を入れました。\n\n遺品の整理では、開業からの売上帳と修理伝票の束、そして1970年の万博の写真が出てきました。この紙の山が、私が家族の記録を年表にまとめようと思った、直接のきっかけです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-04-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖母から帳簿とアルバムを預かる","summary":"感染症の流行で帰省できない時期が続いたのち、久しぶりに会った祖母から、店の帳簿と家族のアルバムをひと箱預かりました。「あんたがいちばん、ものを捨てへんから」というのが理由です。\n\nスキャンを始めると、帳簿の余白に祖父の字で、お客さんの家族構成や「テレビ調子悪いか、要様子見」といった書き込みが残っていました。売上の記録が、そのまま**町内の暮らしの記録**になっていたのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-08-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"祖母と熊本へ、祖父の生家跡を訪ねる","summary":"祖母と父と3人で熊本を訪ね、祖父の生家の跡と、集団就職の列車が出た駅を巡りました。駅舎は建て替わっていましたが、ホームの長さだけが当時のままだと祖母は言いました。\n\n66年前、15歳の祖父がここから夜行列車に乗った。その事実を現地に立って想像できたことが、年表づくりの解像度を変えました。記録は紙の上のものですが、場所は思ったより多くのことを覚えています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-04-13","precision":"day","end_date":"2025-10-13","type":"period","layer":"時代の出来事","title":"大阪・関西万博が開かれる","summary":"「いのち輝く未来社会のデザイン」を掲げる国際博覧会が大阪・夢洲で開かれました。1970年の大阪万博から55年ぶりに、万博がこの街へ戻ってきたことになります。\n\n半世紀を挟んだふたつの万博は、高度経済成長の頂点と、成熟したあとの社会が、それぞれ何を誇ろうとしたかの対照でもあると思います。うちにとっては、アルバムの最初の観光写真ともう一度向き合う機会になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"2025年日本国際博覧会(大阪・関西万博)公式サイト","url":"https://www.expo2025.or.jp/"}]},{"date":"2025-08-01","precision":"month","end_date":null,"type":"point","layer":"家族の出来事","title":"父と万博へ、55年前の写真を持って","summary":"58歳の父と、夢洲の万博会場を歩きました。ポケットには、3歳の父が祖父の肩の上にいる1970年の写真。太陽の塔はここにはありませんが、大屋根の下で同じ構図の写真を撮りました。\n\n**肩車の写真から55年**。集団就職の列車で始まったうちの大阪は、ふたつの万博のあいだにまるごと収まっていました。この年表は、次の誰かが書き足すための下書きとして残しておきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-film-photography","title":"フィルム写真の記録","description":"1976年生まれのわたしが、大学の写真部でフィルムカメラと出会ってからの30年の記録です。撮影と現像の記録に暮らしの転機とフィルム産業の盛衰を重ねて、消えゆくと言われ続けた媒体を選び続けた理由をたどります。","category":"personal-life","language":"ja","start_year":1996,"end_year":2026,"layers":[{"name":"写真と機材","color":"blue"},{"name":"暮らしと転機","color":"gold"},{"name":"フィルムと写真産業","color":"orange"}],"events":[{"date":"1996-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"大学入学、写真部に入る","summary":"京都の大学に進んで、新歓で立ち寄った写真部に入部しました。部室には歴代の部員が残したモノクロプリントが貼られ、薬品の匂いのする暗室が併設されていました。最初の一本は、先輩に借りたカメラで撮っています。\n\n同じ春、業界では新規格のAPSが華々しく登場しています(フィルムと写真産業レイヤー)。まだ「写真といえばフィルム」が当たり前だった時代の、その入り口でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1996-04-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"新写真システムAPSが登場","summary":"コダック、富士フイルムなど5社が共同開発した新写真システムAPSの製品が発売されました。フィルムの装填を簡単にして、プリント時に3種類の画面比率を選べるなど、フィルム写真の使い勝手を押し広げる規格でした。\n\nけれど数年後にデジタルカメラが急速に普及して、APSは短命に終わります。フィルム産業が最後の拡大を試みた時期に、わたしはちょうど写真を始めたことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Advanced Photo System","url":"https://en.wikipedia.org/wiki/Advanced_Photo_System"}]},{"date":"1997-05-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"中古のニコンFM2を手に入れる","summary":"アルバイト代を貯めて、中古カメラ店で機械式一眼レフのニコンFM2を買いました。露出計以外に電池を使わない無骨なカメラで、巻き上げの感触とシャッター音が気に入っています。\n\n**一本で36枚しか撮れない**という制約が、一枚ごとに考える癖をつけてくれました。このカメラはその後30年、修理を挟みながら手元に残り続けて、この年表のほとんどの写真を撮ることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-11-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"カメラ付き携帯電話J-SH04が発売","summary":"シャープ製の携帯電話J-SH04が発売されました。カメラを内蔵して、撮った写真をメールで送れる「写メール」の起点となった機種です。\n\nカメラ付き携帯の先駆には前年の京セラVP-210を挙げる説もあって、「世界初」の呼び方には幅があります。いずれにしても、写真を撮る道具が専用機から通信機へ移る転換点で、フィルムの出荷が減り始める時期とも重なっていました。","detail":null,"credibility":"disputed","credibility_note":"「世界初のカメラ付き携帯電話」については京セラVP-210(1999年)を先行とする見方があり、定義によって評価が分かれます。","sources":[{"title":"Wikipedia: J-SH04","url":"https://en.wikipedia.org/wiki/J-SH04"}]},{"date":"2002-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"就職し、金沢で暮らし始める","summary":"印刷会社の制作職に就いて、金沢へ移りました。会社選びの条件のひとつは、現像所と中古カメラ店が徒歩圏にある街であること。築30年のアパートは押し入れが深く、暗室代わりになりました。\n\n職場ではすでに入稿データのデジタル化が進んでいましたが、街のDPE店にはまだ「1時間仕上げ」の看板が残っていました。仕事はデジタル、趣味はフィルムという二重生活の始まりです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2003-01-01","precision":"year","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"デジタルカメラの出荷がフィルムカメラを逆転","summary":"カメラ映像機器工業会の統計などで、デジタルカメラの出荷台数がフィルムカメラを上回ったとされる時期です。カラーフィルムの需要も、この前後をピークに減少へ転じました。\n\n逆転の時期は、統計の範囲(国内か世界か、出荷か販売か)によって2002年から2003年まで幅があるようです。街のDPE店の閉店が目に見えて増えるのは、この数年後からでした。","detail":null,"credibility":"disputed","credibility_note":"デジタルカメラとフィルムカメラの「逆転」の時期は、対象統計(国内/世界、出荷/販売)により2002〜2003年と幅があります。","sources":[{"title":"カメラ映像機器工業会(CIPA) 出荷統計","url":null}]},{"date":"2006-03-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"コニカミノルタが写真事業から撤退","summary":"「サクラカラー」以来100年余りの歴史を持つコニカミノルタが、カメラ事業とフォト事業から撤退しました。カメラ関連資産の一部はソニーへ引き継がれています。\n\n老舗の撤退は、フィルム時代の終わりを象徴する出来事として報じられました。わたしが常用していた同社のモノクロフィルムも店頭から消えて、**使いたいフィルムを選ぶのではなく、残ったフィルムを使う**時代が始まります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"コニカミノルタ ニュースリリース: カメラ事業・フォト事業の終了について(2006年1月)","url":null}]},{"date":"2009-05-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"結婚、記念写真は大判フィルムで","summary":"写真部の後輩だった相手と結婚しました。式は挙げず、金沢の古い写真館で記念写真を一枚だけ、大判のフィルムで撮ってもらいました。台紙の裏には、日付と使ったフィルムの銘柄が書いてあります。\n\n披露宴代わりの食事会で配ったのは、ふたりで焼いたモノクロプリントの絵はがきでした。デジタル一眼レフが家庭にも普及した頃で、フィルムでの記念写真は写真館でも珍しがられました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-01-19","precision":"day","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"コダックが連邦破産法11条を申請","summary":"イーストマン・コダックが米連邦破産法11条の適用を申請しました。世界のフィルム市場を長く支配して、デジタルカメラを最初期に開発しながら事業転換に失敗した企業の経営破綻でした。\n\nニュースは「フィルムの死」といった見出しで世界を巡りました。一方で富士フイルムは多角化で生き残り、フィルム供給の命脈は細くつながります。冷蔵庫にフィルムを備蓄する習慣は、この頃に始まりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Eastman Kodak","url":"https://en.wikipedia.org/wiki/Eastman_Kodak"}]},{"date":"2012-02-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"冷蔵庫にフィルム専用の棚をつくる","summary":"コダック経営破綻の報を受けて、常用フィルムをまとめ買いし、冷蔵庫の最下段を備蓄棚にしました。銘柄と本数、購入日を記した在庫表は、この年表の元になった記録のひとつです。\n\n「いつまで買えるか分からない」という感覚は、このあとの廃番と値上げのたびに強まっていきます。産業レイヤーの出来事が、台所の冷蔵庫の中身を決めるようになりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2014-07-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"長男誕生、産院にFM2を持ち込む","summary":"長男が生まれました。産院に持ち込んだのはFM2と感度400のカラーネガ一本。窓際の自然光だけで撮った数枚が、いま見返しても家族のアルバムのいちばん最初にあります。\n\n成長の記録は妻のスマートフォンが主役になりましたが、月に一度はフィルムでも撮ると決めました。すぐ見られる写真と、現像まで見られない写真。ふたつの速度で、子どもの時間が残っていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-01-01","precision":"year","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"「写ルンです」30周年、若い世代に再ブーム","summary":"富士フイルムのレンズ付きフィルム「写ルンです」が発売30周年を迎えて、この前後からフィルム特有の写りを新鮮に感じる若い世代の利用が増えたと報じられました。\n\nブームの規模を示す公式な統計はなく報道ベースですが、現像受付に並ぶ若いお客さんなど、現場の変化はわたしの目にも見えていました。**終わったはずの媒体に、次の世代が合流してきた**のです。","detail":null,"credibility":"unverified","credibility_note":"「再ブーム」の規模や時期は報道と店頭での観察に基づくもので、利用者数を示す公式統計は確認できていません。","sources":[{"title":"富士フイルム: レンズ付フィルム「写ルンです」製品情報","url":null}]},{"date":"2016-10-01","precision":"month","end_date":null,"type":"point","layer":"暮らしと転機","title":"築40年の家を買い、納戸を暗室にする","summary":"金沢の郊外に、築40年の中古住宅を買いました。決め手は北側の納戸で、遮光すれば暗室にできる間取りだったこと。引っ越しの荷物で最初に運び込んだのは、引き伸ばし機でした。\n\n空き家の増加が社会問題として語られ始めた時期で、古い家は驚くほど安かったのです。学生時代に部室の暗室で覚えた作業が、20年を経て自分の家の中に戻ってくることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-01-01","precision":"month","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"コダックがエクタクロームの復活を発表","summary":"コダックが、いったん製造を終えていたリバーサルフィルム「エクタクローム」を復活させると発表しました。実際の出荷再開は2018年9月で、廃番フィルムが市場に戻る珍しい事例として注目されました。\n\n破産法申請から5年での復活発表は、縮小一辺倒だった産業レイヤーの潮目の変化を示しています。若い世代の需要(前年の再ブーム)が、供給側を動かし始めたのでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Kodak: Ektachrome復活発表(CES 2017)に関する各社報道","url":null}]},{"date":"2018-04-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"納戸の暗室でモノクロ自家現像を再開","summary":"薬品と現像タンクを揃えて、16年ぶりにモノクロの自家現像を再開しました。最初の一本は現像ムラだらけでしたが、定着液の匂いで部室の記憶が一気に戻ってきました。\n\n背景には、現像所の減少で郵送現像の納期が延びて、モノクロだけでも自分で処理する必要が出てきたという事情があります。産業レイヤーの縮小が、回り回って手仕事の技術を家庭に呼び戻した格好です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-04-01","precision":"month","end_date":"2024-04-01","type":"period","layer":"フィルムと写真産業","title":"フィルムの値上げと縮小が続く","summary":"富士フイルムが写真フィルムの大幅な価格改定を繰り返し発表して、一部製品の販売終了も続いた期間です。原材料費の高騰と需要減少が理由とされ、一本あたりの価格は数年で大きく上がりました。\n\n需要の回帰と供給の縮小が同時に進む、ねじれの時期でした。冷蔵庫の備蓄棚(写真と機材レイヤー)の在庫表では、この間、購入価格の欄の数字だけが着実に増えています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"富士フイルム ニュースリリース: 写真フィルム製品の価格改定(2019年・2022年ほか)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2021-09-30","type":"period","layer":"写真と機材","title":"半径1キロの記録","summary":"感染症の流行で遠出ができなくなって、自宅から半径1キロだけを撮ると決めた18か月でした。週に一本、同じ現像所に出し続けました。近所の用水路や畑が、撮るたびに違う場所に見えてくるのです。\n\n旅先でしか写真を撮っていなかったことに気づかされた期間でもあります。**遠くへ行けない時間が、いちばん近くを見る練習になりました**。この時期のプリントは、のちに初めての個展の核になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-01-01","precision":"year","end_date":null,"type":"point","layer":"フィルムと写真産業","title":"中古フィルムカメラの価格が高騰","summary":"中古市場でフィルムカメラの価格が大きく上がったと報じられた時期です。かつて数千円だった普及機が数万円で取引されて、人気機種では新品時の定価を超える例も伝えられました。\n\n相場を示す公的な統計はなく、報道と市場観察ベースのようです。それでも、25年前に学生が小遣いで買えた道具が投機の対象になった変化は大きいと感じます。若い世代の参入と、新品の供給途絶が重なった結果でしょう。","detail":null,"credibility":"unverified","credibility_note":"中古カメラの相場に公的統計はなく、価格水準は報道や販売店の観察に基づきます。","sources":[{"title":"中古フィルムカメラ市況に関する各社報道(2021〜2022年)","url":null}]},{"date":"2025-07-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"長男と写ルンですを持って歩く","summary":"小学5年の長男が夏休みの自由研究に「フィルムってなに」を選んで、写ルンです一つを持って一緒に近所を歩きました。27枚を撮り終えるのに、長男は3週間かけています。\n\n現像から戻った写真を見て、長男は「ゲームのセーブより緊張する」と言いました。1996年にわたしが部室で感じたことと、たぶん同じです。媒体は縮んでも、体験は受け継げるのだと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-03-01","precision":"month","end_date":null,"type":"point","layer":"写真と機材","title":"30年分のネガのデジタル化を始める","summary":"押し入れの保存箱からネガを出して、番号を振り直してスキャンを始めました。1996年の最初の一本から約900本。この年表は、その整理のために作った索引でもあります。\n\nフィルムは物として残りますが、探せなければ残っていないのと同じです。デジタルの助けを借りて、フィルムを未来へ渡す。**30年選び続けた媒体との、これからの付き合い方**だと思っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-gardening","title":"ガーデニング日記","description":"1990年の花博で一鉢の花を買ってから36年。ベランダから仮設住宅の花壇、貸し農園、庭へ。育てる記録に暮らしの節目と花と緑をめぐる社会の動きを重ねた、私の庭と暮らしの日記です。","category":"personal-life","language":"ja","start_year":1990,"end_year":2026,"layers":[{"name":"庭の記録","color":"green"},{"name":"暮らしの節目","color":"pink"},{"name":"花と緑の時代","color":"purple"}],"events":[{"date":"1990-04-01","precision":"day","end_date":"1990-09-30","type":"period","layer":"花と緑の時代","title":"国際花と緑の博覧会(花博)","summary":"大阪・鶴見緑地で「国際花と緑の博覧会」が開かれて、半年間で約2,300万人が来場しました。「自然と人間との共生」をテーマにした、園芸分野では国内空前の規模の博覧会でした。\n\n33歳の私は観光のつもりで訪れて、帰りに一鉢のゼラニウムを買いました(庭の記録レイヤー)。個人の趣味の起点が国家的なイベントだったというのが、この年表の最初の重なりです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際花と緑の博覧会協会: 花の万博の記録","url":null}]},{"date":"1990-05-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"花博で買った一鉢から","summary":"花博の売店で買ったゼラニウムを、神戸のマンションのベランダに置きました。水やりだけの世話でも夏のあいだ咲き続けてくれて、秋には挿し芽で株を増やすことを覚えました。\n\n園芸書を1冊買い、プランターは3つに増えました。**一鉢が庭になっていく**、その最初の記録です。当時「ガーデニング」という言葉はまだ一般的ではなくて、私は「園芸」と呼んでいました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1995-01-17","precision":"day","end_date":null,"type":"point","layer":"花と緑の時代","title":"阪神・淡路大震災","summary":"未明に起きた直下型地震で、神戸市を中心に6,400人を超える方が亡くなり、住宅の被害は約64万棟に及びました。\n\n私のマンションも半壊と判定されて、ベランダの鉢はひとつ残らず落ちて割れました。避難所から仮設住宅へ移る春、土に触れる暮らしはいったん途切れます。割れた鉢の土だけは、袋に集めて持っていました。けれど再開は、思ったより早く来ます(庭の記録レイヤー)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府防災情報: 阪神・淡路大震災の概要","url":null}]},{"date":"1995-04-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"仮設住宅の脇に花壇を作る","summary":"仮設住宅の並びの空き地に、ご近所の方たちと小さな花壇を作りました。がれきの中から拾ったプランターに、支援物資の種を蒔きました。最初に咲いたのはマリーゴールドでした。\n\n花に実用はありません。それでも水やりに人が集まって、立ち話が生まれました。**土に触ることが、日常を取り戻す最初の一歩でした**。この経験が、私の園芸を趣味から支えに変えたのだと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1997-12-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"「ガーデニング」が流行語トップテンに","summary":"この年の新語・流行語大賞で「ガーデニング」がトップテンに選ばれました。英国風の庭づくりがテレビや雑誌で盛んに特集されて、園芸は「ガーデニング」と呼び替えられてブームになりました。\n\nホームセンターの園芸売り場が急に広がって、苗や資材が格段に手に入りやすくなりました。震災から2年、復興住宅のベランダで再開していた私の趣味に、時代のほうが追いついてきた格好です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"「現代用語の基礎知識」選 新語・流行語大賞 1997年","url":null}]},{"date":"1998-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの節目","title":"園芸店でパートを始める","summary":"ブームで人手が足りなくなった地元の園芸店で、パートとして働き始めました。仕事は水やりと寄せ植えの見本作り、それからお客さまの相談相手です。\n\n趣味が仕事になった転機でした。売り場では「ガーデニング」と呼び、家では「花いじり」と呼んでいました。流行の熱と、震災後の花壇で知った静かな効用と、その両方をこの店で見ることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-03-18","precision":"day","end_date":"2000-09-17","type":"period","layer":"花と緑の時代","title":"淡路花博ジャパンフローラ2000","summary":"淡路島で国際園芸・造園博「ジャパンフローラ2000」が開かれて、約700万人が来場しました。阪神・淡路大震災からの復興を発信する意味も込められた博覧会でした。\n\n私は園芸店の同僚と何度も通いました。10年前の花博で一鉢を買った私が、今度は寄せ植えの技術を盗みに歩いている。震災を挟んだ10年の変化を、ふたつの博覧会が両側から見せてくれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"兵庫県: ジャパンフローラ2000(淡路花博)の記録","url":null}]},{"date":"2003-05-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"貸し農園を借りる","summary":"ベランダでは足りなくなって、市民農園の一区画を借りました。15平方メートルの土に、トマト、ナス、ハーブ。週末は農園、平日はベランダという二拠点の園芸が始まりました。\n\n花から野菜へ関心が広がったのはこの頃で、「育てて食べる」が加わると、記録は一気に具体的になりました。収穫量をノートにつけ始めたのが、このガーデニング日記の原型です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"花と緑の時代","title":"家庭菜園ブームが広がる","summary":"世界金融危機のあとの節約志向や食の安全への関心を背景に、家庭菜園の人気が広がったと報じられました。ベランダ菜園の入門書や貸し農園の契約が増えたそうです。\n\nブームの規模を示す確かな統計はなくて、報道と業界の実感が中心のようです。ただ園芸店の売り場では野菜苗の棚が目に見えて広がり、お客さまに若い世代と男性が増えました。売り場に立つ私の実感も、報道と重なっていました。","detail":null,"credibility":"unverified","credibility_note":"ブームの規模や時期を示す公的統計はなく、報道や業界団体の発表に基づいています。","sources":[{"title":"日本家庭園芸普及協会: 家庭園芸に関する調査","url":null}]},{"date":"2011-06-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"節電の夏、緑のカーテンが広がる","summary":"東日本大震災のあとの節電の夏、窓辺にゴーヤやアサガオを這わせる「緑のカーテン」が全国に広がって、自治体が苗を配る取り組みも相次ぎました。ゴーヤの苗や種は品薄になったと報じられています。\n\n品薄の程度を示す確かな数字はありませんが、園芸店の現場では入荷しても即完売が続きました。花でも食でもなく「日射を遮る」という園芸の第三の効用が注目された夏で、私の店でも育て方の講習会を開きました。","detail":null,"credibility":"unverified","credibility_note":"苗や種の品薄の規模は報道ベースで、販売数量を示す公的統計はありません。","sources":[{"title":"緑のカーテンの取組に関する報道(2011年夏)","url":null}]},{"date":"2013-04-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの節目","title":"庭のある家へ住み替える","summary":"夫の定年を機に、神戸市郊外の庭付きの中古住宅へ住み替えました。日当たりと土質だけで家を選んだと、家族には今も笑われます。内見の日には、庭の隅にスコップで穴を掘って土を確かめました。\n\nベランダ23年、貸し農園10年を経て、初めて「自分の庭」を持ちました。震災で鉢を全部失った場所から電車で20分。同じ街で、土との付き合いだけが少しずつ大きくなってきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2013-06-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"初めての庭づくり、失敗の連続","summary":"念願の地植えを始めましたが、初年度は失敗続きでした。粘土質の土でバラは根腐れし、ナスは貸し農園の半分も採れません。腐葉土を何袋もすき込んで、土壌改良に追われました。\n\n鉢と畑で覚えた技術が、庭ではそのまま通じないことを思い知りました。**庭は、借り物の知識を自分の土に翻訳する場所**なのですね。3年かけて土を作り直して、ようやく庭が応え始めました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-09-04","precision":"day","end_date":null,"type":"point","layer":"花と緑の時代","title":"台風21号が関西を直撃","summary":"非常に強い勢力の台風21号が徳島県と神戸市に上陸して、関西空港の冠水や広い範囲の停電など、大きな被害が出ました。近畿では最大瞬間風速が観測史上1位を更新した地点が相次ぎました。\n\nわが家では庭のオリーブが根元から倒れて、支柱もフェンスも飛びました。震災の鉢、そして台風の庭。この土地で育てることは、失うことと隣り合わせなのだと、改めて知らされました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"気象庁: 平成30年台風第21号による被害と気象状況","url":null}]},{"date":"2018-10-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"倒れたオリーブを起こす","summary":"台風で倒れたオリーブを、ご近所の方と3人がかりで起こして、支柱を組み直しました。折れた枝は挿し木にして、鉢でも育て始めました。翌春、木は何事もなかったように新芽を出してくれました。\n\n仮設住宅の花壇のときと同じで、復旧の作業には自然と人が集まります。**庭は何度でもやり直せる**。それはたぶん、庭以外のことにも言えるのだと、この秋に思いました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"コロナ禍の園芸ブーム、種と土が品薄に","summary":"外出自粛で家庭園芸の需要が急に増えて、野菜の種や培養土、プランターの品薄が各地で報じられました。海外でも同じようなガーデニングブームが伝えられています。\n\n売上の伸びは業界団体や小売の発表が中心で、全体像を示す統計は乏しいようです。それでも、家で過ごす時間を土に向けた人が世界中で増えたことは確かでしょう。30年前に一鉢から始めた身として、今度は始めたばかりの方の相談に乗る側になりました。","detail":null,"credibility":"disputed","credibility_note":"需要増や品薄の規模は業界団体・小売各社の発表や報道に基づいていて、数値の裏づけには幅があります。","sources":[{"title":"日本家庭園芸普及協会: 家庭園芸市場に関する発表(2020年)","url":null}]},{"date":"2021-03-01","precision":"month","end_date":null,"type":"point","layer":"暮らしの節目","title":"初孫が生まれる","summary":"初孫が生まれました。お祝いに贈ったのは、産院の帰りに寄った園芸店で買ったレモンの苗木です。娘夫婦には呆れられましたが、苗木の名札には孫の名前をひらがなで書きました。\n\n「実がなる頃に一緒に収穫しよう」というつもりでした。庭の記録に、初めて次の世代の予定が書き込まれたのです。レモンの木は孫と同じ速さで育って、この年表の続きを担うことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-06-01","precision":"month","end_date":null,"type":"point","layer":"花と緑の時代","title":"肥料価格が高騰","summary":"原料の国際価格の上昇や円安を背景に、国内の肥料価格が大幅に引き上げられました。上げ幅は肥料の種類によって違いますが、過去に例のない水準の値上げと報じられました。\n\n引き上げ幅の数字は種類・地域・時期で幅があって、ひとつの値では示しにくいようです。庭では化成肥料を減らして、落ち葉と生ごみの堆肥づくりを本格化させました。世界の情勢が、庭の隅の堆肥箱を変えた年です。","detail":null,"credibility":"disputed","credibility_note":"引き上げ幅は肥料の種類・地域・契約時期により異なり、報道される数値に幅があります。","sources":[{"title":"JA全農: 肥料価格改定に関する発表(2022年)","url":null}]},{"date":"2025-04-13","precision":"day","end_date":"2025-10-13","type":"period","layer":"花と緑の時代","title":"大阪・関西万博","summary":"大阪・夢洲で日本国際博覧会(大阪・関西万博)が開かれました。35年前の花博と同じ大阪での大規模博覧会で、会場の緑化や花の展示も話題になりました。\n\n68歳の私は、孫の手を引いて訪れました。1990年に一鉢を買って帰った人間が、今度は孫に花の名前を教えています。休憩所で孫が眠って、私は花壇の図面を眺めていました。博覧会のたびに、私の庭は次の段階へ進んできたのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"2025年日本国際博覧会(大阪・関西万博)公式サイト","url":null}]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"庭の記録","title":"孫と朝顔の種をまく","summary":"5歳になった孫と、庭の隅に朝顔の種をまきました。花博のゼラニウムから36年目の春です。レモンの木は孫の背丈を越えて、今年は実が10個つきました。双葉が出たら、水やり係は孫に任せるつもりです。\n\n震災で全部失って、台風で倒れて、それでも庭は続きました。**育てることは、時間を味方につけること**。この日記の続きは、いつか孫が書いてくれたらと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-language-learning","title":"語学学習の道のり","description":"1971年生まれの私が、ラジオ講座から駅前留学、オンライン英会話、AIまで36年続けてきた英語学習の記録です。学びの歩みに仕事と家族の出来事、語学をめぐる社会の変化を重ねました。","category":"personal-life","language":"ja","start_year":1989,"end_year":2025,"layers":[{"name":"学びの記録","color":"purple"},{"name":"仕事と家族","color":"green"},{"name":"語学の時代","color":"blue"}],"events":[{"date":"1989-04-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"ラジオ英会話を録音して聴き始める","summary":"高校3年の春、NHKラジオの英語講座をカセットに録音して聴き始めました。テキストは書店で毎月買いました。講師の声を真似て、通学の自転車で口ずさんだものです。動機は洋楽と、字幕なしで映画を観たいという漠然とした憧れでした。\n\n塾にも留学にも縁のない地方の高校生には、**ラジオがいちばん安い教室でした**。この習慣が、形を変えながら36年続くことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1992-04-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"短大を卒業、自動車部品メーカーへ","summary":"名古屋の短大を卒業して、地元の自動車部品メーカーに事務職で入社しました。配属は総務で、英語を使う場面はまったくありませんでした。\n\nバブル崩壊が始まり、求人が急にしぼんだ年でした。英語は仕事と関係のない趣味として、通勤の車内のラジオ講座だけが続きました。学びが細く長く続いたのは、この「趣味」の期間があったからだと今は思います。続けられるものが、それしかなかったとも言えますが。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1999-10-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"海外営業部へ異動、英語が仕事になる","summary":"取引先の海外展開に伴って、海外営業部に異動しました。英文メールと船積み書類、時差のある電話。趣味だった英語が、突然評価の対象になりました。\n\n製造業の海外生産移転が加速した時期で、地方の部品メーカーにも英語が流れ込んできました。ラジオ講座10年の貯金は読み書きには効きましたが、電話の英語では打ちのめされました。学び直しは、ここから始まります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1999-11-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"初めてのTOEIC、450点","summary":"異動の翌月、会社の勧めで初めてTOEICを受けました。結果は450点。リスニングの途中で頭が真っ白になったことを覚えています。会場の大学教室は受験者で満席でした。\n\n点数は悔しかったのですが、初めて自分の位置が数字で見えました。以後、TOEICは私の定点観測になります。この頃、受験者数は年々増えて、企業が採用や昇進の目安に使う流れが強まりつつありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-01-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"「英語第二公用語」論が話題に","summary":"首相の私的懇談会「21世紀日本の構想」の報告書が、英語の第二公用語化も視野に入れた国民的論議を呼びかけて、賛否両論を巻き起こしました。\n\n報告書が公用語化を正式に提言したのか、長期的な検討課題としたのかは、読み方が分かれるようです。ただ、英語が国家的な課題として語られたことは、その後の英語教育政策の流れを方向づけました。賛否の投書が新聞に並んでいたのを覚えています。","detail":null,"credibility":"disputed","credibility_note":"報告書の位置づけ(公用語化の提言か、論議の呼びかけか)は解釈が分かれ、報道と原文でトーンが異なります。","sources":[{"title":"「21世紀日本の構想」懇談会報告書(2000年1月)","url":null}]},{"date":"2000-08-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"長女誕生","summary":"30歳を目前に長女が生まれました。育児休業を取って、翌春に職場へ復帰しました。\n\n生活は一変して、机に向かう学習は止まりました。ただ、寝かしつけの子守唄は英語の歌にしました。同じ年、世間では英語第二公用語論が話題になっていました(語学の時代レイヤー)。学びの中断は後ろめたかったのですが、この中断もまた道のりの一部だったと、今なら言えます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-09-01","precision":"month","end_date":"2004-03-31","type":"period","layer":"学びの記録","title":"学習中断の3年半","summary":"育児と仕事の両立で、テキストを開かない日々が3年半続きました。唯一続いたのは、車で流す英語の歌と、娘に読む英語の絵本でした。テキストの山は、押し入れの奥へ移りました。\n\n語学は中断すると錆びます。復帰後の最初のTOEICは100点下がっていました。それでも絵本の音読が発音の感覚をつないでいたことに、後で気づきます。**中断も、やめたことにはなりません**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2002-07-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"「英語が使える日本人」戦略構想","summary":"文部科学省が「『英語が使える日本人』の育成のための戦略構想」を発表して、英語教育の数値目標や教員研修の方針を打ち出しました。\n\n第二公用語論から2年。英語力は個人の教養から、国の人材戦略へと位置づけを変えました。育児で学習を中断していた私はニュースで横目に見るだけでしたが、娘の世代の英語教育はここから変わっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 「英語が使える日本人」の育成のための戦略構想(2002年7月)","url":null}]},{"date":"2005-04-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"「駅前留学」に入会する","summary":"娘の生活が落ち着いて、大手英会話教室NOVAに入会しました。仕事帰りの駅前で週1回、初めて外国人講師と定期的に話す環境を得ました。\n\n当時の英会話学校は空前の規模で、駅前の看板とテレビCMが日常の風景でした。月謝は安くありませんでしたが、電話会議で悔しい思いをするたびに、通う理由は増えました。この選択は2年半後、思わぬ形で終わります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2007-10-26","precision":"day","end_date":null,"type":"point","layer":"語学の時代","title":"NOVAが経営破綻","summary":"英会話学校最大手のNOVAが会社更生法の適用を申請して、全国の教室が一斉に閉まりました。受講生は数十万人規模とされ、前払い受講料の扱いが社会問題になりました。\n\n私も未消化のチケットを残したまま教室を失った一人です。受講生数や被害の規模は、報道時点の推計に幅があるようです。「駅前留学」の時代の終わりは、オンライン英会話の時代(学びの記録レイヤー)への入り口でもありました。","detail":null,"credibility":"disputed","credibility_note":"破綻時の受講生数や前払い受講料の規模は報道による推計で、数値に幅があります。","sources":[{"title":"NOVAの会社更生法申請に関する報道(2007年10月26日)","url":null}]},{"date":"2009-02-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"オンライン英会話を始める","summary":"自宅のパソコンとヘッドセットで、フィリピン人講師とのオンライン英会話を始めました。1回25分、料金は駅前の教室の数分の一でした。\n\nNOVAの破綻で前払いに懲りた身には、月謝制で縛りのない仕組みがありがたかったです。時差の小さいアジアの講師と夜に話す形は、通信環境の進歩が生んだ新しい教室でした。娘の宿題の隣で受講する夜が続きました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2011-04-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"小学校で外国語活動が必修化","summary":"新学習指導要領の全面実施で、小学5・6年生の外国語活動が必修になりました。「聞く・話す」を中心に、成績評価をしない活動として始まっています。\n\nちょうど5年生になった娘の授業参観で、教室に響く英語の歌を聴きました。帰り道、娘は習った歌を口ずさんでいました。私が高校3年のラジオで始めたことを、娘は10歳で始めるのです。**学び始める年齢が、ひと世代で8年早まりました**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"文部科学省: 小学校学習指導要領(平成20年告示)外国語活動","url":null}]},{"date":"2013-09-08","precision":"day","end_date":null,"type":"point","layer":"語学の時代","title":"2020年東京五輪の開催が決定","summary":"ブエノスアイレスのIOC総会で2020年大会の東京開催が決まり、日本時間9月8日早朝の決定の瞬間が中継されました。招致演説の「おもてなし」は流行語になりました。\n\n訪日客の増加も重なって、「大会までに英語を」という空気が広がりました。42歳の私はこのとき、大会ボランティアという目標を初めて手帳に書きました。学習に、締め切りができたのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本オリンピック委員会: 2020年東京大会開催決定(2013年9月)","url":null}]},{"date":"2016-11-01","precision":"month","end_date":null,"type":"point","layer":"語学の時代","title":"Google翻訳がニューラル翻訳へ","summary":"Google翻訳にニューラル機械翻訳が導入されて、日本語と英語の間の翻訳品質が大きく向上したと発表されました。長文の訳文が急に自然になったと話題になりました。\n\n職場では英文メールの下書きを翻訳にかける同僚が増えて、「もう勉強は要らないのでは」という冗談が現実味を帯びました。学ぶ意味を私が問い直す(学びの記録レイヤー)きっかけになった、技術の節目です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google Japan Blog: Google 翻訳が進化しました(2016年11月)","url":null}]},{"date":"2017-01-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"翻訳アプリと学ぶ理由を問い直す","summary":"英文メールの大半が翻訳アプリで済むようになって、28年続けた学習の意味を初めて疑った冬でした。ノートに「それでも続けるか」と書いた記録が残っています。\n\n出した結論は、書く英語は機械に任せて、**自分の声で話すためだけに学ぶ**、でした。目標を読み書きから会話に絞ったことで、学習はむしろ軽くなりました。機械翻訳は、私の学びの敵ではなく編集者になったのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-10-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"ラグビーW杯、道案内の英語が通じる","summary":"ラグビーワールドカップ日本大会で、豊田スタジアム周辺の案内ボランティアに参加して、海外からの観客に英語で道案内をしました。定型文ではない会話が、初めて役に立ちました。\n\n大会は約1か月半にわたり、各地の会場が海外の観客であふれました。30年前のラジオ講座から続く学びが人の役に立った最初の実感で、翌年の五輪ボランティアへの予行演習のつもりでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ラグビーワールドカップ2019日本大会の開催記録","url":null}]},{"date":"2021-07-08","precision":"day","end_date":null,"type":"point","layer":"語学の時代","title":"東京五輪、首都圏会場の無観客が決定","summary":"新型コロナの感染拡大を受けて、東京五輪は首都圏の会場を無観客として開催されることが決まりました。観客向けの案内を担うはずだったボランティアの活動も、大きく縮小されました。\n\n辞退や活動縮小の人数は、報道の集計で確定値がないそうです。私が予定していた活動も、研修だけで終わりました。8年前に手帳へ書いた目標は消えましたが、通じた経験までは消えませんでした。","detail":null,"credibility":"unverified","credibility_note":"ボランティアの辞退者数や活動縮小の規模は報道による集計で、確定した公式数値がありません。","sources":[{"title":"東京2020大会の無観客開催決定に関する五者協議の報道(2021年7月8日)","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"学びの記録","title":"生成AIと毎朝10分の英会話","summary":"対話型AIに「英会話の相手役」をお願いして、通勤前の10分間、音声で話す習慣を始めました。相手は疲れず、笑わず、何度でも言い直させてくれます。\n\nラジオ、駅前の教室、オンライン、そしてAI。**教室はどんどん小さくなって、ついに手のひらに収まりました**。機械翻訳に迷った日々を経て、道具は敵ではなく相手になりました。52歳の学習記録は、まだ更新中です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-05-01","precision":"month","end_date":null,"type":"point","layer":"仕事と家族","title":"54歳、初めての海外一人旅","summary":"有休をつなげてロンドンへ、初めての海外一人旅に出ました。機内では映画を字幕なしで2本観ました。道を尋ね、パブで隣の客と話し、聞き間違えて笑い合い、それでも会話は続きました。\n\n1989年のラジオから36年。第二公用語論も、駅前留学の崩壊も、機械翻訳の衝撃もありました。旅の最後にノートへ書いたのは一行だけです。「通じた。続けてよかった」。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-life-with-cats","title":"🐈 猫との暮らし","description":"2011年、28歳のときに保護猫のソラを迎えてからの15年です。2匹の猫との日々と暮らしの変化に、動物愛護法の改正や猫ブームといった社会の動きを重ねて、速さの違う時間を一緒に生きた記録を残しておきます。","category":"personal-life","language":"ja","start_year":2011,"end_year":2026,"layers":[{"name":"猫たちの記録","color":"pink"},{"name":"わたしの暮らし","color":"gold"},{"name":"猫と社会","color":"teal"}],"events":[{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"東日本大震災、置き去りにされたペットたち","summary":"東日本大震災と原発事故で、警戒区域に多くの犬や猫が取り残されました。ボランティアによる保護活動が広がり、災害時のペット同行避難が全国的な課題として意識される契機になった出来事です。\n\n各地の保護団体には、行き場のない猫が次々と集まったそうです。半年後にわたしが譲渡会で出会う猫も、**災害が連れてきた縁**のひとつでした。当時のわたしは、まだそれを知りません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 東日本大震災における被災動物対応記録集","url":null}]},{"date":"2011-09-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"保護猫のソラを迎える(推定1歳)","summary":"区民館の譲渡会で、キジトラの若い雄猫と目が合いました。被災地から保護されてきた、推定1歳の子です。2週間のトライアル初日、ソラはケージから出てこないまま朝を迎えました。\n\n名前は空の色からソラに。28歳、ひとり暮らし2年目のわたしには、誰かの世話をする生活は初めてでした。飼うというより暮らしを分け合う感覚なのだと知るのは、もう少し後のことです 🐾","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2012-08-29","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"改正動物愛護管理法が成立、終生飼養を明記","summary":"動物愛護管理法の改正が成立し、飼い主が動物をその命の終わりまで飼う「終生飼養」の責任が明文化されました。自治体が引き取りを拒否できる場合も定められ、安易な飼育放棄に歯止めをかける内容です(施行は2013年9月)。\n\n猫と暮らして1年のわたしには、その当たり前がわざわざ法律に書かれるまでの現実がある、ということを考えさせられた改正でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 動物愛護管理法の平成24年改正の概要","url":null}]},{"date":"2013-04-01","precision":"month","end_date":null,"type":"point","layer":"わたしの暮らし","title":"ペット可の部屋へ引っ越す(30歳)","summary":"賃貸の更新を機に、ペット可の1LDKへ引っ越しました。家賃は1万円上がり、物件の選択肢は10分の1に。内見の基準は日当たりより、キャットタワーを置ける壁面になりました。\n\n猫と暮らせる賃貸の少なさは、飼育放棄の一因ともいわれます。住まいの側から猫との暮らしを考えた、最初の経験でした。この部屋で、以後の暮らしの多くが進んでいくことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2014-06-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ソラ脱走、3日間の捜索","summary":"網戸の隙間からソラが脱走しました。3日間、早朝と深夜にちくわを持って町内を歩き、3日目の夜、駐車場の車の下から鳴き声が返ってきたのです。捕まえた瞬間の爪の痛みは、安堵の記憶として残っています。\n\nその後、全部屋の網戸にロックを付けて、迷子札も作りました。のちにマイクロチップの義務化が議論されるたび、わたしはこの3日間を思い出すことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-02-01","precision":"month","end_date":null,"type":"point","layer":"猫と社会","title":"「ネコノミクス」、経済効果2兆円超と試算","summary":"猫がもたらす経済効果を年間約2兆3000億円とする大学教授の試算が報じられ、「ネコノミクス」という言葉が広まりました。猫カフェ、猫グッズ、猫の写真集と、猫を主役にした消費がふくらんでいた時期です。\n\nブームの一方で、飼いきれずに手放される猫のことも報じられていました。**かわいいと暮らせるは別の話**だと、脱走騒ぎを経たわたしは思っていました。","detail":null,"credibility":"unverified","credibility_note":"経済効果の試算は研究者個人の推計が報道されたもので、算出根拠の詳細は公表資料からは確認できていません。","sources":[{"title":"関西大学 宮本勝浩名誉教授による試算(2016年報道)","url":null}]},{"date":"2016-05-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"2匹目、子猫のハギを迎える","summary":"職場の後輩が保護した、生後2か月ほどの三毛猫を引き取りました!萩の花の柄からハギと名付けました。先住のソラは3日間威嚇し続けて、4日目の朝、同じ毛布で寝ていました 🐾\n\n2匹になって食費と医療費は倍になりましたが、猫同士の関係という新しい見物ができました。多頭飼いの適正な数を調べたのも、このときが初めてです。先輩になったソラの顔つきが、少し変わりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-12-01","precision":"month","end_date":null,"type":"point","layer":"猫と社会","title":"猫の飼育数が犬を初めて上回る","summary":"ペットフード協会の全国調査で、猫の推計飼育数約952万頭が犬の約892万頭を上回りました。調査開始以来初の逆転とされます。散歩が要らず集合住宅でも飼いやすい猫が、単身・共働き世帯の増える時代に合っていたのでしょう。\n\nソラとハギのいるわが家も、その952万分の2です。時代が猫の側に寄ってきた、と当時の日記に書いてありました。","detail":null,"credibility":"disputed","credibility_note":"飼育数は世帯アンケートからの推計値で誤差を含み、「逆転」の時期や頭数は調査によって見解が分かれています。","sources":[{"title":"一般社団法人ペットフード協会「全国犬猫飼育実態調査」(2017年)","url":null}]},{"date":"2019-04-01","precision":"month","end_date":null,"type":"point","layer":"わたしの暮らし","title":"転職して週2日は家で働く(36歳)","summary":"転職して、週2日在宅で働ける職場になりました。決め手のひとつは猫の通院のしやすさで、面接で正直にそう言ったら、面接官も自分の猫の写真を見せてくれました!\n\n家で働いてみると、猫は長い昼寝と決まった時間の要求で1日を区切っているのだと分かります。人間の側が、猫の時間割に入れてもらう格好です。出社の日は、帰宅した瞬間の鳴き声の長さで留守の長さが分かりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-06-12","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"改正動物愛護法成立、マイクロチップ義務化へ","summary":"動物愛護管理法の再改正が成立し、販売される犬猫へのマイクロチップ装着の義務化(2022年施行)や、生後56日以下の子犬・子猫の販売規制、動物虐待の厳罰化などが決まりました。\n\n脱走騒ぎを経験したわたしは施行を待たず、次の健診で2匹にチップを入れました。迷子と遺棄の境界が曖昧な現実に、番号がひとつの答えになると思ったからです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 動物愛護管理法 令和元年改正の概要","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2020-05-31","type":"period","layer":"わたしの暮らし","title":"在宅勤務の日々、猫が同僚になる","summary":"緊急事態宣言で完全在宅になり、2匹との24時間が始まりました。ビデオ会議に尻尾が映り込み、キーボードの上が定位置になり、社内でソラとハギは「同僚」と呼ばれるようになりました。\n\n世の中ではペットを迎える人が急増して、一方で安易な飼育放棄への心配も報じられていました。**ずっと家にいる人間を、猫がどう思っていたのか**は、いまだに分かりません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-08-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ソラ、慢性腎臓病の初期と診断(推定11歳)","summary":"年1回の健診の血液検査で、ソラに慢性腎臓病の初期を示す値が出ました。高齢の猫に多い病気で、完治はなく、進行を緩やかにする管理が治療になるのだと説明を受けました。\n\n療法食への切り替えと、半年ごとの検査が始まりました。猫の11歳は、人間なら60歳前後だそうです。**時間の速さが違う相手と暮らしている**ことを、数値で突きつけられた日でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2022-06-01","precision":"day","end_date":null,"type":"point","layer":"猫と社会","title":"マイクロチップ装着が義務化","summary":"改正動物愛護法の施行で、ブリーダーやペットショップが販売する犬猫へのマイクロチップ装着と情報登録が義務になりました。すでに飼われている犬猫への装着は努力義務です。\n\n迷子や災害のときに飼い主のもとへ戻る仕組みが、制度として整った形です。震災の年に猫を迎えたわたしには、あの日から11年かかってここまで来た、という感慨がありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 犬と猫のマイクロチップ情報登録制度","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"自宅での皮下点滴を覚える","summary":"ソラの腎臓病が進み、週2回の皮下点滴が始まりました。最初は動物病院に通いましたが、移動が猫の負担になると考えて自宅で行う練習をし、タオルで包む保定と針の角度を覚えました。\n\n治すためではなく、楽に過ごせる時間を延ばすための医療です。介護という言葉が猫にも使われる理由が、分かってきました。点滴のあいだ、ハギが必ず隣に座ってくれるのが支えでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"猫と社会","title":"犬猫の殺処分、10年余りで約9割減","summary":"環境省の統計によると、全国の犬猫の殺処分数は2022年度に約1万2000頭となり、約17万頭だった2011年度から9割以上減りました。譲渡活動の広がりと自治体の取り組み、たび重なる法改正の積み重ねが背景にあります。\n\nソラを迎えた年から数えたこの変化は、わたしの年表に欠かせない1行です。それでもゼロではないことも、あわせて記録しておきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"環境省: 犬・猫の引取り及び負傷動物等の収容並びに処分の状況","url":null}]},{"date":"2025-04-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ソラを見送る(推定15歳)","summary":"桜の終わりの朝、ソラが膝の上で息を引き取りました。推定15歳。最後の1週間はほとんど食べませんでしたが、それでも窓辺の日向には自分で歩いて行きました。診断から3年半、点滴は200回を超えていました。\n\n骨壺の隣に、譲渡会でもらった保護当時の写真を置きました。**14年間の暮らしの単位が、この猫でした**。ハギが数日、家中を探して歩いていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-10-01","precision":"month","end_date":null,"type":"point","layer":"わたしの暮らし","title":"保護猫の預かりボランティアを始める(42歳)","summary":"ソラがいた保護団体に登録して、譲渡が決まるまでの猫を預かるボランティアを始めました。最初の預かりは人慣れしていない黒猫で、2か月かけて、ケージの外で眠るようになってくれました。\n\n迎える側から、送り出す側へ。別れの多い活動ですが、ソラを保護してくれた誰かがいたから、あの14年がありました。今度はわたしが、その順番を回す番だと思っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-05-01","precision":"month","end_date":null,"type":"point","layer":"猫たちの記録","title":"ハギ10歳、預かり猫は5匹目に","summary":"ハギが10歳になりました!預かり猫は5匹目を送り出し、家には「うちの子」と「旅の途中の子」がいる暮らしが定着しています。ハギは新入りが来るたび、かつてソラがしたように3日間威嚇して、4日目に毛布を分けています 🐾\n\nこの年表は、ソラの一周忌に作り始めたものです。猫の時間は人より速い。だからこそ、重ねた時間は年表にして残したいのです。最後の行は、まだ書き足されていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-marathon","title":"🏃 マラソン完走記録","description":"2007年、35歳で走り始めた会社員ランナーの19年の記録です。レースと記録、練習と体の変化に、市民マラソンブームやシューズ革命といった時代の動きを重ねました。速くなった時期より、走り続けた時期のほうがずっと長い。そんな年表です。","category":"personal-life","language":"ja","start_year":2007,"end_year":2026,"layers":[{"name":"レースと記録","color":"orange"},{"name":"練習と体","color":"green"},{"name":"走る人と時代","color":"blue"}],"events":[{"date":"2007-02-18","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"第1回東京マラソン開催","summary":"東京都心の公道を約3万人が走る、第1回東京マラソンが開かれました。応募者は9万人超。抽選制の大都市型市民マラソンという形式がここで定着して、以後、大阪・神戸・京都と各都市が続き、日本の市民マラソンブームの起点になった大会です。\n\nこの日、私はテレビの前にいました。**走ることが特別な人のものでなくなった年**に、この記録も始まります。もっとも、シューズを買うのは半年も先のことなのですが。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"東京マラソン財団: 東京マラソン2007 大会概要","url":null}]},{"date":"2007-09-01","precision":"month","end_date":null,"type":"point","layer":"練習と体","title":"健康診断を機に、35歳で走り始める","summary":"春の健康診断で血圧と体重を指摘されて、9月の連休にランニングシューズを買いました。最初の夜は家の周りを15分だけ走って歩いて、距離にして2キロ足らず。翌朝の筋肉痛で、自分の体を長いこと放置していたのだと思い知りました。\n\n同じ年の2月に、東京マラソンが始まっていました。「市民ランナー」という言葉を自分のこととして意識するのは、まだ先の話です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2008-11-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"初レース、ハーフマラソンを2時間15分で完走","summary":"走り始めて1年あまり、地元のハーフマラソン大会に初めて出て、2時間15分で完走しました。後半は歩きと変わらない速さになりましたが、沿道の拍手に背中を押されてゴールできました!\n\n完走証を会社の机に飾ったら、同僚に笑われました。それでも翌週から、昼休みに走る仲間がひとり増えたのです。フルマラソンに挑むと決めたのは、完走証を鞄にしまった、この日の帰り道でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2009-03-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"初フルマラソン完走、4時間58分","summary":"河川敷のフルマラソンで、初めての42.195キロを完走しました。35キロで両脚が止まって、最後の7キロは歩きと小走りの繰り返し。それでも4時間58分、目標にしていた「5時間以内」に、ぎりぎり収まりました!\n\nゴールのあとに泣くとは、思ってもいませんでした。**完走はゴールではなく入口だった**と、この年表を作りながら思います。翌週にはもう、次のレースを探していましたから。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2011-10-30","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"第1回大阪マラソン開催、ブームが全国へ","summary":"約2万8千人が参加する第1回大阪マラソンが開かれました。東京に始まった大都市型の市民マラソンは神戸・京都・熊本と各地に広がって、抽選倍率の高さがニュースになる時代になっていました。\n\n東日本大震災の年でもあり、多くの大会がチャリティー枠を設けました。私もこの年、初めて寄付つきのエントリーを選んでいます。走ることと社会がつながった、最初の記憶です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"大阪マラソン組織委員会: 第1回大会 開催概要","url":null}]},{"date":"2012-01-01","precision":"year","end_date":null,"type":"point","layer":"走る人と時代","title":"ランニング人口が推計1000万人規模に","summary":"笹川スポーツ財団の調査で、年1回以上ジョギングやランニングをする人が推計1000万人を超えて、過去最高の水準になったとされました。東京マラソンからの5年で、ブームが数字の上でも裏付けられた格好です。\n\nもっとも、この数字は隔年のアンケート調査に基づく推計で、継続して走る人はその一部だそうです。私の実感としても、大会の抽選は年々厳しくなる一方でした。","detail":null,"credibility":"disputed","credibility_note":"推計人口はアンケート調査からの推計値で、調査手法や「実施頻度」の定義により数値に幅がある。","sources":[{"title":"笹川スポーツ財団「スポーツライフに関する調査」","url":null}]},{"date":"2013-11-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"サブ4達成、3時間52分","summary":"4度目のフルマラソンで4時間の壁を破って、3時間52分で完走しました!30キロ以降に失速しない配分を、初めて最後まで守れたレースです。\n\n練習の量より質を考え始めた時期の、成果でもありました。祝杯の写真は、今もこの年のアルバムの最初にあります。その夜、翌年以降の目標を「サブ3.5」と手帳に書きました。この一行に9年かかるとは、当時は思ってもいません。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-01-01","precision":"month","end_date":"2015-03-31","type":"period","layer":"練習と体","title":"腸脛靭帯炎で3か月走れず","summary":"サブ3.5を狙った年明けのスピード練習で右膝の外側に痛みが出て、腸脛靭帯炎と診断されました。走らないようにと告げられた3か月は、走り始めてからいちばん長い中断です。\n\n代わりに水泳と筋力トレーニングを覚えて、練習内容とフォームを記録する習慣ができました。故障は、積み過ぎた負荷への体からの通知。そう考えるようになったのは、この春からです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-02-28","precision":"day","end_date":null,"type":"point","layer":"レースと記録","title":"東京マラソン初出走、3時間47分の自己ベスト","summary":"5年連続で落選していた東京マラソンにようやく当選して、3時間47分の自己ベストで完走しました。9年前にテレビで見たコースを、自分の脚で走ったのです。\n\n銀座で、沿道の声援が途切れないことに驚きました。第1回大会を見て走り始めた者として、**スタートラインに立つまで9年かかった**ことも記録しておきます。抽選倍率は、10倍を超えていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-05-06","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"Breaking2、2時間の壁に25秒届かず","summary":"ナイキの非公認レース「Breaking2」で、キプチョゲ選手が2時間0分25秒を記録して、フルマラソン2時間切りに25秒まで迫りました。この挑戦のために開発された厚底カーボンシューズは市販化されて、以後の記録の常識を塗り替えていきます。\n\n数年のうちに、市民ランナーの間でも厚底が標準になりました。私が導入するのは2019年のことです。道具が記録を動かす時代の、入口だったのだと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Breaking2","url":"https://en.wikipedia.org/wiki/Breaking2"}]},{"date":"2018-01-01","precision":"year","end_date":null,"type":"point","layer":"走る人と時代","title":"フルマラソン完走者、年間延べ37万人規模に","summary":"国内の大会結果を集計する民間の「全日本マラソンランキング」で、フルマラソンの年間完走者が延べ37万人規模と報じられました。大会の数も記録的な水準で、市民マラソンの裾野がもっとも広がった時期とされます。\n\nこの数字は主催者データを集計した延べ人数で、公的な統計はありません。それでも、どの大会もエントリー開始日に定員が埋まるという体感とは、よく一致していました。","detail":null,"credibility":"unverified","credibility_note":"完走者数は民間ランキングによる大会結果の集計(延べ人数)で、対象大会の範囲により数値が変わり、公的統計による裏付けはない。","sources":[{"title":"アールビーズ「全日本マラソンランキング」","url":null}]},{"date":"2019-10-12","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"キプチョゲ、非公認ながら2時間の壁を破る","summary":"ウィーンの特設コースで行われたINEOS 1:59 Challengeで、キプチョゲ選手が1時間59分40秒を記録して、非公認ながら人類初のフルマラソン2時間切りを果たしました。交代制のペーサー隊列と厚底シューズが可能にした記録です。\n\n公認記録と呼べるのかという議論も起きましたが、**限界は動かせるという事実**は、市民ランナーの端くれの私にも届きました。47歳の私が、翌月からフォーム改造を始めた理由のひとつです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ineos 1:59 Challenge","url":"https://en.wikipedia.org/wiki/Ineos_1:59_Challenge"}]},{"date":"2019-11-01","precision":"month","end_date":null,"type":"point","layer":"練習と体","title":"47歳、厚底シューズとフォーム改造","summary":"初めて厚底カーボンシューズを買って、接地とピッチを作り直す練習を始めました。最初のひと月はふくらはぎの張りが抜けず、道具に走らされている感覚でした。\n\nそれでも、12月のハーフマラソンで自己ベストが出ました。加齢で落ちる分を、道具と技術でどこまで押し返せるのか。40代後半の練習は、その実験になっていきます。実験台は、自分の体ひとつです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-02-17","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"東京マラソン2020、一般の部中止を発表","summary":"新型コロナウイルスの感染拡大を受けて、東京マラソン財団が2020年大会の一般ランナーの出走中止を発表しました。約3万8千人の市民ランナーが走れなくなって、以後、全国の大会が次々と中止や延期に入っていきます。\n\n当選していた私も、そのひとりでした。目標を失って初めて気づいたのは、大会がなくても自分は走りたいのか、という問いです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"東京マラソン財団: 東京マラソン2020に関するお知らせ(2020年2月17日)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2021-09-30","type":"period","layer":"練習と体","title":"大会のない日々をひとりで走る","summary":"緊急事態宣言のもと、人の少ない早朝に、距離を抑えて走る日々が1年半続きました。大会は軒並み中止で、GPS時計の走行記録だけが、静かに積み上がっていきます。\n\n誰とも競わず、完走証もありません。それでも走るのをやめなかったことで、**走る理由は記録の外にもある**と分かりました。この期間の月間走行距離は、振り返ると19年間のどの年よりも安定しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2021-02-28","precision":"day","end_date":null,"type":"point","layer":"走る人と時代","title":"鈴木健吾が2時間4分56秒の日本記録","summary":"最後の開催となった第76回びわ湖毎日マラソンで、鈴木健吾選手が2時間4分56秒の日本記録を樹立しました。自己ベストの更新が続出して、厚底シューズ時代の到来を象徴するレースと呼ばれた大会です。\n\n歴史ある大会が幕を下ろす日に、記録が生まれる。その皮肉と希望を、私は自宅の画面越しに見ていました。中断していた自分の目標を再起動させたのは、このレースです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本陸上競技連盟: 第76回びわ湖毎日マラソン大会結果","url":null}]},{"date":"2022-11-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"50歳、サブ3.5達成の3時間28分","summary":"再開された秋のフルマラソンで3時間28分。手帳に書いてから9年越しの目標だったサブ3.5を、50歳で達成しました!35キロからの5キロを、人生でいちばん集中して走ったと思います。\n\n41歳で立てた目標に9年かかりましたが、**50歳の自己ベスト**は、加齢が言い訳にならないことの証明になりました。厚底への適応と、コロナ期の地道な走り込み。その両方の成果だと思っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2025-03-01","precision":"month","end_date":null,"type":"point","layer":"レースと記録","title":"通算20回目のフル完走","summary":"3年ぶりに当選した東京マラソンで、通算20回目のフルマラソンを3時間41分で完走しました。タイムは全盛期より落ちましたが、35キロ以降を最後まで走り切る型は、崩れませんでした。\n\n初完走から16年。完走証の束はアルバム1冊分になって、それがこの年表の下書きになっています。沿道で誰かを応援する側の楽しさを覚えたのも、最近のことです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2026-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と体","title":"54歳、次の目標は60歳でのサブ4","summary":"春の健診の数値は、走り始めた35歳のときよりいいくらいです。週3回の走りと筋力トレーニングを軸に、60歳でサブ4を維持するという次の10年の目標を、手帳に書きました。\n\n19年の記録を並べて分かるのは、速くなった時期より、走り続けた時期のほうがずっと長いということです。記録は、年齢と競争しません。この年表は、その途中経過です。🏃","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-moving-history","title":"引っ越しの歴史","description":"1955年生まれの私が経験した、社宅から団地、四畳半、持ち家までの引っ越しの記録です。住まいの変遷に家族の節目と日本の住宅史を重ねて、間取りの変化が時代をどう映してきたのかを、落ち着いて振り返ってみます。","category":"personal-life","language":"ja","start_year":1961,"end_year":2021,"layers":[{"name":"引っ越しの記録","color":"orange"},{"name":"家族の節目","color":"pink"},{"name":"住宅と都市の時代","color":"blue"}],"events":[{"date":"1961-04-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"北九州・八幡の社宅2Kへ","summary":"父の転勤で、6歳の春に家族4人で製鉄所の社宅に移りました。台所と二間の2K、風呂は共同棟で、近所と湯の順番を分け合ったものです。廊下に七輪、玄関に自転車。これが記録に残る、私のいちばん古い住まいです。\n\n高度経済成長のただ中で、企業の社宅は住宅不足を補う大きな受け皿でした。**家が会社とともにあった時代**の記憶であり、この年表の出発点になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1962-09-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"千里ニュータウンでまちびらき","summary":"大阪の千里丘陵で、日本初の大規模ニュータウンへの入居が始まりました。公団・公社・府営の住宅が丘を覆い、「ニュータウン」という言葉が現実の風景になった年です。\n\n深刻な住宅不足に対する、国としての回答でした。のちに私の一家も、この丘に移り住むことになります(引っ越しの記録レイヤー)。団地のダイニングキッチンは、食寝分離という新しい暮らし方を全国に広めていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"吹田市: 千里ニュータウンのあゆみ","url":null}]},{"date":"1968-10-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"総住宅数が総世帯数を上回る","summary":"昭和43年住宅統計調査で、全国の住宅数が初めて世帯数を上回りました。戦後の「住宅難」が量の面では峠を越えたことを示す、節目の数字です。\n\n以後の住宅政策は、量から質へと軸足を移していきます。とはいえ都市部の狭さは残り、私たちが暮らす2Kの社宅も例外ではありませんでした。広さを求める引っ越しは、まだ始まったばかりだったのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省統計局: 昭和43年住宅統計調査","url":null}]},{"date":"1970-03-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"千里ニュータウンの3DKへ","summary":"父の大阪転勤に伴い、15歳の春に千里の公団住宅3DKへ移りました。ダイニングキッチンと洋間、ベランダ、水洗トイレ。八幡の社宅とは別世界で、初めて自分の机を持たせてもらいました。\n\n窓の向こうの丘では、万国博覧会が開かれようとしていました。**2Kから3DKへ**という間取りの変化は、そのまま日本の暮らしの上昇曲線でした。同級生の多くも、同じ春に越してきた転入組だったものです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1970-03-15","precision":"day","end_date":"1970-09-13","type":"period","layer":"住宅と都市の時代","title":"大阪万博の183日間","summary":"千里丘陵で日本万国博覧会が開かれ、183日間で約6,400万人が来場しました。「人類の進歩と調和」を掲げ、動く歩道やワイヤレステレホンが未来の暮らしを演出していました。\n\n会場は、移り住んだばかりのニュータウンの隣でした。私は入場券を握って何度も通ったものです。住宅政策が生んだ丘が、そのまま未来の展示場になった半年。団地の子どもの半年は、丸ごと万博とともにありました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"大阪府: 日本万国博覧会(EXPO'70)の記録","url":null}]},{"date":"1973-10-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"第一次オイルショック","summary":"第四次中東戦争を機に原油価格が高騰し、「狂乱物価」と呼ばれるインフレが起きました。トイレットペーパー騒動が象徴するように、高度成長の前提が揺らいだ年です。\n\n建築資材も高騰し、持ち家は遠のきました。翌年に上京する私の住まいが風呂なし四畳半になったのは、仕送りの目減りと無関係ではありません。成長の終わりは、まず家賃と物価に現れたのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済企画庁『昭和49年 年次経済報告』","url":null}]},{"date":"1974-04-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"上京、風呂なし四畳半の下宿へ","summary":"大学進学で、東京・中野の木造アパートに移りました。四畳半に押し入れ、便所は共同、風呂は銭湯。家賃は月9,000円だったと手帳に残っています。\n\nオイルショック直後の物価高で仕送りは目減りし、銭湯は週3回に節約しました。それでも、初めて自分で選んだ住所でした。団地育ちの目に、木造下宿の路地は古くて新しい東京でした。銭湯の帰りに商店街で買うコロッケが贅沢だったものです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1979-04-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"就職、川崎の独身寮6畳へ","summary":"メーカーに就職し、川崎の独身寮に入りました。6畳一間に作り付けの棚、食堂と大浴場は共同です。同期と廊下で夜通し話したものでした。寮費は安く、月給の多くが貯金に回りました。\n\n社宅に生まれ、寮で働き始める。**住まいがずっと会社の敷地の中にあった**ことに気づくのは、ずっと後のことです。福利厚生としての住宅は、この時代の大企業の標準装備でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1985-05-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"結婚","summary":"29歳の春に、同じ会社の同期と結婚しました。式は横浜の小さな会場で挙げ、寮を出る日には管理人さんが赤飯を炊いてくれました。新居の家具は、ふたりの貯金で少しずつ揃えたものです。\n\n結婚は住まいの転機でもあり、翌月にはふたりで中野の賃貸2DKへ移ります(引っ越しの記録レイヤー)。この年の秋のプラザ合意から円高と地価高騰の時代が始まることを、当時のふたりはまだ知りませんでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1985-06-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"中野の賃貸2DKへ","summary":"結婚を機に、学生時代を過ごした中野へ戻り、賃貸マンションの2DKを借りました。家賃は月6万8,000円。あの四畳半の下宿から、歩いて10分の場所でした。\n\nこの部屋で長女が生まれ、6年を暮らします。その間に地価は高騰を続け、「買うなら早く」という焦りが世間に満ちていきました。それが次の引っ越しの伏線になるのですが、当時はまだ対岸の火事だと思っていたのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1988-03-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"長女誕生","summary":"中野の2DKに、家族が3人になりました。ベビーベッドを置くと居間はほぼ埋まり、押し入れの半分が子どもの物になりました。\n\n子どもの成長は、面積の問題でもあります。この頃、都心の地価高騰は郊外へ波及し、通勤圏はどんどん外へ延びていました(住宅と都市の時代レイヤー)。「広さは遠さで買う」しかない時代に、私たちの家探しは始まったのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1991-02-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"通勤90分、埼玉の建売住宅を購入","summary":"埼玉の郊外に、建売の4LDKを買いました。都心まで通勤90分。価格は年収の7倍を超え、頭金は双方の親に頼りました。契約の日の営業マンの「今買わないと一生買えませんよ」という言葉を覚えています。\n\n買った直後に地価は下落へ転じ、資産価値は長く戻りませんでした。それでも庭と子ども部屋のある家は、**遠さと引き換えに手に入れた広さ**でした。「高値づかみ」という言葉は、後に何度も聞くことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"1992-03-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"公示地価が下落、土地神話の終わり","summary":"1992年の地価公示で全国平均の地価が下落に転じ、上がり続けることが前提だった「土地神話」が崩れました。住宅地の下落は、以後長く続きます。\n\n前年に郊外の家を買った私たちには、他人事ではありませんでした。ただしピークの時期や下落幅は地域と用途で大きく異なり、一つの数字では語れません。確かなのは、「家は買えば得」という常識が終わったことです。","detail":null,"credibility":"disputed","credibility_note":"地価のピーク時期や下落幅は地域・用途により大きく異なり、全国一律の数値としては確定できません。","sources":[{"title":"国土庁: 平成4年地価公示","url":null}]},{"date":"2001-04-01","precision":"month","end_date":"2004-03-31","type":"period","layer":"引っ越しの記録","title":"名古屋へ単身赴任、1Kの3年間","summary":"46歳で名古屋勤務となり、単身赴任の1Kマンションで3年を過ごしました。荷物は段ボール10箱。家族の家と自分の部屋、住まいがふたつに分かれた3年間です。\n\n週末に新幹線で往復する暮らしは、持ち家が動けないことの裏返しでもありました。ローンを抱えた家は家族を郊外に留め、仕事は父だけを都市へ動かす。この時代の転勤族に共通する構図だったと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2015-03-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"定年退職","summary":"60歳で定年を迎え、川崎の独身寮から数えて36年の会社勤めを終えました。最後の出社の日は、社宅と寮の思い出話ばかりしていたものです。次の住まいを考え始めたのは、それから半年後のことでした。\n\n通勤がなくなると、通勤90分という立地は意味を変えます。広い家は夫婦ふたりには余り、駅から遠い坂道は年々こたえるようになりました。住まいの条件は、人生の段階ごとに書き換わっていくのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-04-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"空き家846万戸、空き家率13.6%","summary":"平成30年住宅・土地統計調査の結果が公表され、全国の空き家は846万戸、空き家率は13.6%と過去最高を更新しました。\n\n住宅数が世帯数を上回ってから半世紀、量の充足は過剰へと転じたわけです。地方の実家をどうするかという問いは、私を含む同世代の共通の宿題になりました。この年の秋、私も八幡の実家を手放すことになります(家族の節目レイヤー)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省統計局: 平成30年住宅・土地統計調査","url":null}]},{"date":"2019-11-01","precision":"month","end_date":null,"type":"point","layer":"家族の節目","title":"母を見送り、八幡の実家を手放す","summary":"春に母を見送り、秋に空き家となった実家を売却しました。買い手がつくまで半年かかりました。家財の処分は業者に頼み、アルバムだけ段ボール2箱持ち帰りました。庭の金木犀だけ、枝を一本もらってきたのです。\n\n全国で846万戸といわれた空き家の一戸が、うちの実家でした。**統計の中に自分の家がある**という感覚は、この年表を書き始めた理由のひとつです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-07-01","precision":"month","end_date":null,"type":"point","layer":"住宅と都市の時代","title":"東京都が転出超過に","summary":"住民基本台帳の人口移動報告で東京都が転出超過に転じたと報じられ、テレワークの広がりを背景に、都心を離れる動きが注目されました。\n\nただし月次の速報値で外国人の移動も含まれ、一時的な変化か構造的な変化かは評価が分かれるようです。確かなのは、通勤距離が住まい選びの絶対条件ではなくなり始めたこと。翌年の私たちの住み替えにも、この変化は追い風になりました。","detail":null,"credibility":"unverified","credibility_note":"月次の速報値に基づく報道で、集計範囲(外国人・世帯類型)や期間の取り方により基調の評価が分かれます。","sources":[{"title":"総務省統計局: 住民基本台帳人口移動報告(2020年7月分)","url":null}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"引っ越しの記録","title":"郊外の家を売り、駅前の中古マンションへ","summary":"30年住んだ埼玉の家を売り、駅から徒歩3分の中古マンション2LDKに移りました。荷物は半分に減らし、本と写真だけは全部持ってきました。おそらく、人生最後の引っ越しです。\n\nコロナ禍で、郊外の庭付き住宅に思わぬ買い手がつきました。社宅の2Kに始まり、団地、四畳半、寮、持ち家、そして駅前の2LDKへ。**間取りの遍歴は、そのまま時代の遍歴だった**と、いま振り返って思うのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]}]},{"slug":"personal-music-practice","title":"🎹 楽器練習の軌跡","description":"7歳で始めて13歳でやめ、29歳で買った電子ピアノで再開したピアノの記録です。練習と演奏の歩みに、暮らしの変化と音楽をめぐる社会の動きを重ねました。上達の記録というより、「何度でも戻ってきたこと」の記録です。1987年生まれ、いまも夜はヘッドホンで弾いています。","category":"personal-life","language":"ja","start_year":1994,"end_year":2026,"layers":[{"name":"練習と演奏","color":"purple"},{"name":"日々の暮らし","color":"gold"},{"name":"音楽と社会","color":"teal"}],"events":[{"date":"1994-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"🎹 7歳、近所のピアノ教室に通い始める","summary":"母に連れられて、団地の一室の個人教室に通い始めました。7歳でした。最初の教本はバイエルで、家の電子オルガンで練習して、練習した日はカレンダーにシールを貼っていました。\n\n教室でピアノを習う男子は、学年でわたしひとり。この「少数派」の感覚は、大人になって再開したときにも少しだけついて回りました。振り返れば、ごく普通の習い事としての始まりです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-03-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"13歳、発表会を最後に教室をやめる","summary":"中学の部活と塾が重なって、6年通った教室をやめました。最後の発表会で弾いたのはソナチネの第1楽章。演奏の出来より、終わったあとの解放感のほうをよく覚えています。\n\nやめることに迷いはなくて、**いつでも戻れると思っていた**んです。実際に戻るまで16年かかるとは、13歳のわたしは知りません。先生の「楽譜は捨てないでね」という言葉だけが残りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2000-04-01","precision":"month","end_date":"2016-05-31","type":"period","layer":"練習と演奏","title":"弾かなかった16年","summary":"高校、大学、就職。ピアノに触れないまま16年が過ぎました。実家の電子オルガンは処分され、楽譜だけが段ボールに残り、音楽は聴く一方の趣味になっていました。\n\nそのあいだに、音楽をとりまく環境は激変します。動画サイトで誰もが演奏を公開し(音楽と社会レイヤー)、街にはストリートピアノが現れる。弾いていない16年のうちに、再開のための道具立てが世の中に揃っていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2006-04-01","precision":"month","end_date":null,"type":"point","layer":"日々の暮らし","title":"大学進学、名古屋で一人暮らし","summary":"名古屋の大学に進んで、初めての一人暮らしを始めました。ワンルームにテレビより先に置いたのは中古のコンポ。軽音サークルの誘いは「聴く専門なので」と断っています。\n\n同じ年の暮れにニコニコ動画が始まり、「演奏してみた」の文化が育ち始めました(音楽と社会レイヤー)。弾かない16年のただ中で、演奏する素人を画面越しに眺める習慣だけが続いていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2006-12-12","precision":"day","end_date":null,"type":"point","layer":"音楽と社会","title":"ニコニコ動画がサービス開始","summary":"動画の上にコメントが流れるニコニコ動画が始まりました。「演奏してみた」タグが生まれ、プロでない人の演奏が不特定多数に聴かれる場が、国内に定着していきます。\n\nYouTubeと合わせて、練習の過程を公開する文化の土台になりました。楽譜と教室が中心だった音楽の学びに、「人の演奏を無限に見られる」という入り口が加わったんです。当時のわたしは、まだ見る側でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ニコニコ動画","url":"https://ja.wikipedia.org/wiki/%E3%83%8B%E3%82%B3%E3%83%8B%E3%82%B3%E5%8B%95%E7%94%BB"}]},{"date":"2010-04-01","precision":"month","end_date":null,"type":"point","layer":"日々の暮らし","title":"就職、機械メーカーの営業事務に","summary":"名古屋の機械メーカーに就職しました。配属先の歓迎会で特技を聞かれて「昔ピアノを少し」と答えたら余興で弾かされそうになり、慌てて打ち消したのを覚えています。\n\nリーマン・ショック後の厳しい就職環境で、内定はこの一社だけでした。生活が仕事中心に組み上がっていき、音楽は通勤のイヤホンの中だけに。いま振り返ると、ピアノからいちばん遠い時期です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2016-06-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"🎹 29歳、電子ピアノを買って再開する","summary":"同僚の結婚式で、新婦のお父さんが挨拶の代わりにピアノを一曲弾いたんです。その帰り道に楽器店へ寄って、ヘッドホンで練習できる電子ピアノを注文しました。ボーナスの大半が消えました。\n\n指は驚くほど動きませんでしたが、楽譜が読めることだけは体に残っていました。実家からは16年ぶりに段ボールの楽譜が届きました!**再開に必要だったのは才能ではなく、きっかけと防音**でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2017-02-01","precision":"month","end_date":null,"type":"point","layer":"音楽と社会","title":"JASRACが音楽教室からの徴収方針を表明","summary":"JASRACが、楽器教室での演奏からも著作権使用料を徴収する方針を明らかにし、教室側は「音楽教育を守る会」を結成して反発しました。争いはやがて裁判に持ち込まれます。\n\n練習のための演奏は誰のものか、という問いが初めて広く議論されました。このあと教室に通い始めるわたしにとっても、月謝の先にある論点として無縁ではありませんでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本音楽著作権協会(JASRAC)の発表に関する各社報道(2017年2月)","url":null}]},{"date":"2017-04-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"大人向けのピアノ教室に通い始める","summary":"月2回、仕事帰りに30分のレッスンに通い始めました。講師は同世代で、最初の面談の「発表会は出ても出なくてもいい」で肩の力が抜けました。課題曲は自分で選べる方式です。\n\n大人の生徒は十数人いて、半分がわたしと同じ再開組でした。子どもの頃の教室と違うのは、進度を比べる相手がいないこと。いま振り返ると、それが続けられたいちばんの理由だったと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2018-11-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"16年ぶりの発表会でショパンのワルツ","summary":"大人の生徒だけの小さな発表会で、ショパンのワルツ第19番イ短調を弾きました。直前の1週間は毎晩指が冷たくなるほど緊張して、本番では中間部で一度和音を外しました。\n\nそれでも弾き終えたとき、13歳の発表会では感じなかった種類の満足があったんです!翌週のレッスンで講師に言われた「大人の本番は減点法ではない」を、以後ずっと支えにしています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"音楽と社会","title":"ストリートピアノが全国に広がる","summary":"駅や商業施設に、誰でも弾けるピアノを置く取り組みが各地へ広がった時期です。演奏動画の人気も相まって、設置は全国で数百台規模に達したとされます。\n\n国内の先駆けとしては2011年の鹿児島の商店街の例がよく挙げられますが、正確な設置数を示す統計はなく報道ベースです。練習の成果を人前で試す敷居が、発表会の外側で一気に下がりました。","detail":null,"credibility":"unverified","credibility_note":"ストリートピアノの設置数や「国内初」の特定は報道や愛好家の集計に基づくもので、公的な統計は確認できません。","sources":[{"title":"ストリートピアノに関する各社報道(2019年前後)","url":null}]},{"date":"2019-09-01","precision":"month","end_date":null,"type":"point","layer":"練習と演奏","title":"駅のストリートピアノで初めて弾く","summary":"出張先の駅の構内にピアノが置かれていました。人が途切れた昼下がり、鞄を足元に置いてワルツを1曲。立ち止まる人はいませんでしたが、最後に小さな拍手がひとつ聞こえました。\n\n発表会と違って、誰もわたしを知らない場所で弾くのは初めてでした。**聴かせるためではなく、弾きたいから弾く**。練習の目的が、このあたりから静かに変わっていった気がします。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2020-04-01","precision":"month","end_date":"2021-03-31","type":"period","layer":"日々の暮らし","title":"在宅勤務の1年、練習時間が倍になる","summary":"感染症の流行で在宅勤務になり、通勤に使っていた朝晩の時間がそのまま練習に置き換わった1年です。昼休みの15分はハノンにあて、練習記録アプリの月間時間は再開後の最長を更新し続けました。\n\n教室のレッスンは一時オンラインになり、手元を映すカメラの角度に苦労しました。同じ頃、巣ごもり需要で電子ピアノが品薄になったと報じられ(音楽と社会レイヤー)、4年前の自分の買い物に安堵しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[]},{"date":"2
