":"point","layer":"企業の現場","title":"コロナ5類移行、出社回帰が本格化","summary":"新型コロナが感染症法上の5類に移行し、出社回帰の動きが本格化しました。週数日の出社を求めるハイブリッド勤務が大勢となり、完全在宅を続ける企業は一部にとどまっています。\n\n在宅とオフィスの最適な配分をめぐって、企業の方針は分かれました。出社義務化への反発が転職理由になる(働き手の意識レイヤー)など、働く場所そのものが労使の交渉事項として定着したことを示す出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"新型コロナウイルス感染症の5類移行(2023-05-08)と企業の出社方針に関する各社報道","url":null}]},{"date":"2024-03-01","precision":"month","end_date":null,"type":"point","layer":"働き手の意識","title":"春闘賃上げ率が33年ぶりの5%台に","summary":"2024年の春闘で、連合集計の賃上げ率が33年ぶりに5%台に達しました。人手不足を背景に、企業が賃上げで人材をつなぎ止める構図がはっきりしてきます。\n\n働き方改革の焦点が労働時間から賃金へ移ったことを示す出来事です。初任給の引き上げ競争や転職市場の活況と併せて、**働き手が会社を選ぶ側に回る**という力関係の変化を映しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本労働組合総連合会「2024春季生活闘争 回答集計結果」","url":null}]},{"date":"2024-04-01","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"「2024年問題」が現実に、物流の現場に影響","summary":"建設・運輸・医師への残業上限規制の適用猶予が終わり、「2024年問題」が現実になりました。物流ではドライバー不足による輸送力の不足が試算され、荷主側の商習慣の見直しが迫られています。\n\n規制が人手不足を顕在化させた形です。ただ、送料無料表示の見直しや再配達の削減など、**働き方の問題を消費者の行動につなぐ**議論を初めて広く呼び起こした点に意味があると考えています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国土交通省「物流の2024年問題について」","url":null}]},{"date":"2024-04-01","precision":"month","end_date":null,"type":"point","layer":"働き手の意識","title":"退職代行サービスの利用が急増と報道","summary":"新年度の直後から退職代行サービスの利用が急増したと報じられ、入社数日での依頼が相次ぐ実態が話題になりました。大型連休明けには、1日あたりの依頼件数が過去最多になったとする事業者もあります。\n\n件数の裏付けは事業者の発表ベースにとどまります。ただ、辞めることすら外部に頼むという現象は、会社と個人の関係が変わりつつあることを示す指標として、人事・労務の現場で受け止められました。","detail":null,"credibility":"unverified","credibility_note":"利用件数は退職代行事業者の自社発表や取材ベースの数値で、業界全体の統計はありません。","sources":[{"title":"退職代行サービス利用動向に関する2024年春の各社報道","url":null}]},{"date":"2025-04-01","precision":"month","end_date":null,"type":"point","layer":"法制度","title":"東京都庁で週休3日の選択制が始まる","summary":"東京都が都庁職員を対象に、フレックスタイム制を使って週休3日を選べる制度を始めました。育児中などに限定せず、全職員が対象になる点が注目されています。\n\n公務職場が柔軟な働き方の先行例を示して、民間への波及を狙う施策です。働き方改革が「残業を減らす」段階から「働き方を選ぶ」段階へ進んだことを示す事例として位置づけられます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"東京都「都庁におけるフレックスタイム制を活用した週休3日制」(2025年4月開始)に関する発表・報道","url":null}]}]},{"slug":"culture-anime-global","title":"📺 アニメ文化の世界進出","description":"1963年のテレビアニメ誕生から劇場作品の世界的ヒット、配信による産業化まで。作品・産業と配信・海外の受容の3層を重ねて、日本のアニメが世界の主流娯楽になっていく流れをカルチャーの現場目線で追う年表です。","category":"culture","language":"ja","start_year":1963,"end_year":2025,"layers":[{"name":"作品と表現","color":"blue"},{"name":"産業と配信","color":"orange"},{"name":"海外の受容とファン","color":"green"}],"events":[{"date":"1963-01-01","precision":"day","end_date":null,"type":"point","layer":"作品と表現","title":"🤖 「鉄腕アトム」放送開始、テレビアニメの原点","summary":"手塚治虫の虫プロダクションが制作した「鉄腕アトム」がフジテレビ系で放送開始。日本初の本格的な30分連続テレビアニメです。\n\n週1本の放送を回すために止め絵や作画の使い回しを体系化した**リミテッドアニメ**の手法は、低予算で物語の密度を追いかける日本アニメの生産様式と表現の型を作りました。この方式が、以後の産業と表現の両方を長く決めていくことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"手塚プロダクション公式サイト: 鉄腕アトム","url":null}]},{"date":"1963-09-01","precision":"month","end_date":null,"type":"point","layer":"海外の受容とファン","title":"「Astro Boy」として米国で放送開始","summary":"「鉄腕アトム」がNBCエンタープライズの配給で「Astro Boy」として米国で放送されました。日本のテレビアニメ輸出の最初期の成功例です。\n\n放送権は制作費の穴埋めの安値で売られたとされていて、輸出前提の採算構造はこの時点で始まっていました。米国の子どもたちは日本製と意識せずに見ていて、「日本のアニメ」というブランドの認知は、数十年後のファン文化の成立を待つことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Astro Boy (1963 TV series)","url":"https://en.wikipedia.org/wiki/Astro_Boy_(1963_TV_series)"}]},{"date":"1978-07-01","precision":"month","end_date":null,"type":"point","layer":"海外の受容とファン","title":"「ゴルドラック」がフランスで社会現象に","summary":"「UFOロボ グレンダイザー」が「Goldorak」のタイトルでフランスの公共放送の子ども番組枠で放送されて、爆発的な人気になりました。\n\n「視聴率100%」という伝説的な数字が語られるほどの現象で、フランスが日本アニメの一大受容国になる起点です。一方で暴力性を批判する社会的な論争も起きました。熱狂と反発が並走するという日本アニメ海外展開の型が、ここにもう現れています。","detail":null,"credibility":"disputed","credibility_note":"「視聴率100%」などの数字は当時の逸話として広まったもので、測定方法も含めて裏付けは確認できません。","sources":[{"title":"Wikipedia: UFOロボ グレンダイザー(フランスでの放送)","url":null}]},{"date":"1980-01-01","precision":"year","end_date":"1994-12-31","type":"period","layer":"海外の受容とファン","title":"📼 ファンサブVHSの時代","summary":"北米や欧州のファンが、日本のアニメに自主的に字幕を付けたVHSテープを同好会経由でダビングして回覧する文化が広がりました。公式流通がほとんどない時代の、非公式な受容の回路です。\n\n権利の上では違法な複製ですが、**非公式な熱意が後の市場を耕した**という評価が定着しています。ここで育ったファンがCrunchyroll(産業と配信レイヤー)など、後の正規配信の担い手や顧客になりました。規模を示す信頼できる記録はありません。","detail":null,"credibility":"unverified","credibility_note":"非公式な流通なので時期や規模を示す一次資料がなく、関係者の回想と研究書の記述が頼りです。","sources":[{"title":"Jonathan Clements: Anime: A History (BFI, 2013)","url":null}]},{"date":"1988-07-16","precision":"day","end_date":null,"type":"point","layer":"作品と表現","title":"「AKIRA」公開、ジャパニメーションの衝撃","summary":"大友克洋監督の「AKIRA」が公開。当時としては破格の制作費とセル画枚数を注ぎ込んだ緻密な作画で、崩壊後の東京を描くSF大作です。\n\n翌年以降の海外公開でカルト的な支持を獲得して、「ジャパニメーション」の代名詞として欧米のクリエイターに影響を与えました。アニメは子ども向けという既成観念をひっくり返して、大人の観客という新しい市場を海外の受容レイヤーに切り開いた1本です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Akira (1988 film)","url":"https://en.wikipedia.org/wiki/Akira_(1988_film)"}]},{"date":"1992-07-01","precision":"month","end_date":null,"type":"point","layer":"海外の受容とファン","title":"アニメ・エキスポ初開催","summary":"北米最大級のアニメコンベンションになるアニメ・エキスポの第1回が、カリフォルニアで開かれました。ファンサブ時代の同好会文化が、数千人規模の集まりとして初めて可視化された場です。\n\n以後、来場者は数十万人規模へ成長して、企業の新作発表やライセンス商談の場も兼ねるようになります。ファンの集いが産業のインフラに変わっていく過程は、海外受容レイヤーと産業と配信レイヤーが合流していく典型例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Anime Expo (Society for the Promotion of Japanese Animation)","url":null}]},{"date":"1995-11-18","precision":"day","end_date":null,"type":"point","layer":"作品と表現","title":"「GHOST IN THE SHELL/攻殻機動隊」公開","summary":"押井守監督の「GHOST IN THE SHELL/攻殻機動隊」が日英合作の枠組みで公開。義体化した主人公を通じて、ネットワーク時代の自我を問う哲学的SFです。\n\n米国ではビデオ市場で支持を広げて、ビルボードのビデオ販売チャートで首位を記録したと報じられました。「マトリックス」の監督たちが影響を公言するなど、**逆輸入される影響源**として日本アニメの国際評価を決定づけた作品です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ghost in the Shell (1995 film)","url":"https://en.wikipedia.org/wiki/Ghost_in_the_Shell_(1995_film)"}]},{"date":"1996-07-01","precision":"month","end_date":null,"type":"point","layer":"産業と配信","title":"ディズニーがジブリ作品の世界展開で提携","summary":"ウォルト・ディズニーと徳間書店が、スタジオジブリ作品の販売・配給に関する提携を発表。「もののけ姫」以降の新作や旧作ビデオの海外展開をディズニーが担う枠組みです。\n\n世界最大の配給網に乗ることで、ジブリ作品は質の高い吹替版制作と劇場公開の体制を手に入れました。作品に手を加えない無改変の条件が交渉の核だったと伝えられていて、日本側が条件を主導した契約として画期的でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"1996年7月のディズニー・徳間書店提携発表に関する各社報道","url":null}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"海外の受容とファン","title":"「ドラゴンボールZ」が米Toonami枠で人気爆発","summary":"米カートゥーン・ネットワークの放送枠Toonamiで「ドラゴンボールZ」の放送がスタート。再放送を重ねながら、10代を中心に絶大な人気を得ました。\n\nケーブル局の専門枠という受け皿を得て、日本アニメは字幕ビデオのマニア文化からテレビの日常になります。この時期にToonamiで育った世代の視聴体験が、2000年代以降の北米市場拡大と配信サービス(産業と配信レイヤー)の顧客基盤の土台になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Toonami","url":"https://en.wikipedia.org/wiki/Toonami"}]},{"date":"1998-09-01","precision":"month","end_date":null,"type":"point","layer":"産業と配信","title":"ポケモンが米国上陸、メディアミックス輸出の完成形","summary":"ゲーム・アニメ・カードを束ねた「ポケットモンスター」が米国で本格展開を開始。アニメ放送とゲーム発売が連動する形で一気に浸透しました。\n\n名前や演出のローカライズを徹底して、玩具やカードまで束ねる**メディアミックスの輸出モデル**を完成させて、世界的フランチャイズ化の雛形になります。キャラクター産業としてのアニメの規模を、桁違いに広げた事例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pokémon","url":"https://en.wikipedia.org/wiki/Pok%C3%A9mon"}]},{"date":"2003-03-23","precision":"day","end_date":null,"type":"point","layer":"作品と表現","title":"🏆 「千と千尋の神隠し」がアカデミー賞受賞","summary":"宮崎駿監督の「千と千尋の神隠し」が、第75回アカデミー賞長編アニメーション部門を受賞しました!前年にはベルリン国際映画祭で金熊賞も受けています。\n\n日本で歴代興行収入1位になった作品が米映画界の最高賞まで届いたことで、**作家性への世界的承認**が決定的になりました。CG全盛へ向かう時期に手描きの表現が評価された意味も大きくて、以後の劇場アニメの海外展開への強い追い風になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Spirited Away","url":"https://en.wikipedia.org/wiki/Spirited_Away"}]},{"date":"2006-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と配信","title":"Crunchyroll創業、ファン発の配信サービス","summary":"米国でアニメ動画サイトCrunchyrollが創業。最初は無許諾のアップロードを含むファン主導のサイトでしたが、後に権利者と提携して正規のサイマル配信へ転換しました。\n\n日本の放送直後に字幕付きで世界へ届けるサイマル配信は、ファンサブが満たしていた需要を合法の市場に変えます。ファン文化の内側から産業が生まれた例で、配信時代のアニメ経済圏の原型になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Crunchyroll","url":"https://en.wikipedia.org/wiki/Crunchyroll"}]},{"date":"2013-04-01","precision":"month","end_date":null,"type":"point","layer":"作品と表現","title":"「進撃の巨人」放送、配信で世界同時ブームに","summary":"諫山創原作のテレビアニメ「進撃の巨人」が放送開始。配信サービスを通じてほぼ同時に海外へ届いて、SNS上の考察・リアクション文化とともに世界規模のブームになりました。\n\n国内放送から海外人気までの時差がほぼ消えた最初期の例です。世界の反応が製作委員会の収益と続編の判断に直結する構造が定着していって、作品レイヤーと産業と配信レイヤーの結び付きが、配信によって一段深まりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Attack on Titan","url":"https://en.wikipedia.org/wiki/Attack_on_Titan"}]},{"date":"2016-08-26","precision":"day","end_date":null,"type":"point","layer":"作品と表現","title":"「君の名は。」公開、アジアで記録的ヒット","summary":"新海誠監督の「君の名は。」が公開されて、日本で興行収入約250億円。中国や韓国でも当時の日本映画の記録を塗り替える大ヒットになりました!\n\nスタジオジブリ以外の作家では初めての世界的メガヒットで、とりわけ中国市場の急成長を強く印象づけます。個人の作家性とSNS時代の拡散力が結び付いた事例で、劇場アニメの海外収益が事業計画の柱になる転機でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Your Name","url":"https://en.wikipedia.org/wiki/Your_Name"}]},{"date":"2020-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と配信","title":"Netflixが「1億世帯超がアニメ視聴」と公表","summary":"Netflixが、直近1年間で全世界の1億を超える世帯が同社でアニメを見たと公表して、オリジナルアニメへの投資拡大を打ち出しました。\n\n数字は自社発表で外部の検証はありませんが、世界最大級の配信プラットフォームがアニメを主要ジャンルと位置づけた意味は大きいです。配信マネーの流入は、制作現場の待遇や製作委員会方式のあり方をめぐる議論も同時に呼び起こしました。","detail":null,"credibility":"unverified","credibility_note":"視聴世帯数はNetflixの自社発表に基づく数字で、集計基準の詳しい開示や第三者による検証はありません。","sources":[{"title":"Netflixのアニメ視聴に関する発表(2020年)への各社報道","url":null}]},{"date":"2020-10-16","precision":"day","end_date":null,"type":"point","layer":"作品と表現","title":"「鬼滅の刃 無限列車編」が2020年世界興収首位","summary":"「劇場版 鬼滅の刃 無限列車編」が公開されて、日本歴代1位の興行収入を記録。パンデミック下の2020年の世界年間興行収入でも首位になりました!\n\nテレビ放送と配信で広がったファン層が劇場に殺到する、**配信が観客を育てる**時代の象徴です。日本映画が世界の年間首位に立つのは初めてで、ハリウッドの公開延期が続いた特殊な年という条件を差し引いても、産業の地力を見せました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 劇場版「鬼滅の刃」無限列車編","url":null}]},{"date":"2021-08-09","precision":"day","end_date":null,"type":"point","layer":"産業と配信","title":"ソニーがCrunchyroll買収を完了","summary":"ソニー傘下のファニメーションが、AT&TからのCrunchyroll買収を完了しました。買収額は11.75億ドルで、傘下の配信ブランドは後にCrunchyrollへ統合されます。\n\n日本の権利元に近い資本が海外アニメ配信の最大手を押さえたことで、製作から世界配信までの垂直統合が進みました。**流通の主導権**をめぐる再編で、アニメが国際的なメディア資本の主戦場になったことを示しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Sony Pictures / Funimationプレスリリース(2021-08-09)","url":null}]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と配信","title":"アニメ産業市場が3兆円突破と報告される","summary":"日本動画協会の「アニメ産業レポート2024」で、2023年の広義のアニメ産業市場が初めて3兆円を超えたと報告されました。海外市場が全体のおよそ半分を占める構造が続いています。\n\nこの数値は関連事業者の売上を積み上げた推計で、集計範囲の設定によって規模感は変わります。それでも約10年で市場が倍増して、**成長の主役は海外**という傾向は一貫していて、この年表の到達点を数字で裏づけています。","detail":null,"credibility":"disputed","credibility_note":"市場規模は日本動画協会による広義市場の推計で、集計範囲や手法をめぐって数値の評価が分かれています。","sources":[{"title":"日本動画協会「アニメ産業レポート2024」","url":null}]},{"date":"2025-07-01","precision":"month","end_date":null,"type":"point","layer":"作品と表現","title":"「鬼滅の刃 無限城編」が世界で記録的ヒット","summary":"「劇場版 鬼滅の刃 無限城編 第一章」が公開されて、日本で歴代最速級の興行記録を更新!北米でもアニメ映画の公開週末記録を塗り替えたと報じられています。\n\n興行の数字は集計途上で確定していませんが、字幕・吹替を問わず世界の一般客層が公開初週から動く状況は、半世紀にわたる受容の積み重ねの現在地です。海外レイヤーで「特別な趣味」だったアニメは、もう主流の娯楽になっています。","detail":null,"credibility":"unverified","credibility_note":"公開後の興行数値は報道ベースの速報値で、確定値や最終的な順位は集計途上です。","sources":[{"title":"「劇場版 鬼滅の刃 無限城編」の興行に関する各社報道(2025)","url":null}]}]},{"slug":"culture-architecture","title":"建築様式の進化","description":"鉄とガラスの時代からモダニズムの成立と批判、ポストモダン、そして木造回帰まで。様式の思想・技術と材料・都市と生活の3層を重ね、建築が各時代の社会にどう応えてきたかを静かに辿る年表です。","category":"culture","language":"ja","start_year":1851,"end_year":2022,"layers":[{"name":"様式と思想","color":"purple"},{"name":"技術と材料","color":"blue"},{"name":"都市と生活","color":"gold"}],"events":[{"date":"1851-05-01","precision":"day","end_date":null,"type":"point","layer":"技術と材料","title":"ロンドン万博の水晶宮が開幕","summary":"第1回万国博覧会の会場として、ジョセフ・パクストン設計の水晶宮が開幕しました。鋳鉄とガラスの規格部材を工場で量産し、現場で組み立てる方式により、巨大な展示空間をわずか数か月で建て上げています。\n\n建築家ではなく温室技師の手による建物が時代の象徴となり、**部材の工業生産**という20世紀建築の前提がここで示されました。石を積む建築から、組み立てる建築への転換点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Crystal Palace","url":"https://en.wikipedia.org/wiki/The_Crystal_Palace"}]},{"date":"1885-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と材料","title":"シカゴにホーム・インシュランス・ビル完成","summary":"シカゴに、建物の重さを鉄の骨組みに負担させるホーム・インシュランス・ビルが完成しました。組積造の厚い壁から構造を解放し、高層化への道を開いたとされています。\n\n「世界初の超高層ビル」と紹介されますが、鉄骨の負担割合など技術的な根拠には異論もあります。大火後のシカゴで地価高騰と土地不足が高さを要請したという、都市と生活レイヤーの事情が技術を押し上げた例です。","detail":null,"credibility":"disputed","credibility_note":"「最初の超高層ビル」という位置づけは定義に依存し、構造の先進性の評価も、建築史家の間で分かれています。","sources":[{"title":"Wikipedia: Home Insurance Building","url":"https://en.wikipedia.org/wiki/Home_Insurance_Building"}]},{"date":"1889-03-31","precision":"day","end_date":null,"type":"point","layer":"技術と材料","title":"エッフェル塔完成、300メートルの鉄塔","summary":"パリ万博に合わせ、ギュスターヴ・エッフェルの設計事務所による約300メートルの錬鉄塔が完成しました。当時世界一の高さで、風の力を計算に基づいて処理する、構造設計の到達点でした。\n\n建設中には芸術家たちが「無用で醜怪な塔」と抗議しましたが、完成後は都市の象徴として受け入れられていきます。新技術と美意識の衝突、そして構築物が都市の顔に転じる過程(都市と生活レイヤー)は、のちのビルバオまで繰り返されます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Eiffel Tower","url":"https://en.wikipedia.org/wiki/Eiffel_Tower"}]},{"date":"1919-04-01","precision":"month","end_date":"1933-07-31","type":"period","layer":"様式と思想","title":"バウハウスの14年","summary":"ヴァルター・グロピウスが、ワイマールに造形学校バウハウスを設立しました。工芸と芸術の分離を排し、**芸術と産業の統合**を掲げる教育で、家具から建築までの機能主義デザインを体系化しています。\n\nデッサウ移転を経て、ナチスの圧力により1933年に閉校しました。しかし教師と学生の亡命が結果として理念を世界へ広め、米国での国際様式の受容や、戦後の設計教育の土台となっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bauhaus","url":"https://en.wikipedia.org/wiki/Bauhaus"}]},{"date":"1923-01-01","precision":"year","end_date":null,"type":"point","layer":"様式と思想","title":"ル・コルビュジエ『建築をめざして』刊行","summary":"ル・コルビュジエが、論集『建築をめざして』を刊行しました。「住宅は住むための機械である」という言葉とともに、工業製品の論理で建築を再定義する、モダニズムの綱領を示した書物です。\n\n自動車や客船を美の規範に挙げる主張は、水晶宮以来の技術と材料レイヤーの蓄積を、思想の言葉に翻訳するものでした。装飾を廃した白い住宅群の実作がこれに続き、その射程はやがて都市計画論へも広がっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Vers une architecture","url":"https://en.wikipedia.org/wiki/Vers_une_architecture"}]},{"date":"1932-02-01","precision":"month","end_date":null,"type":"point","layer":"様式と思想","title":"MoMA「近代建築展」が国際様式を定義","summary":"ニューヨーク近代美術館で、ヒッチコックとフィリップ・ジョンソンの企画による近代建築の展覧会が開かれ、欧州の新しい建築を「インターナショナル・スタイル」として整理・命名しました。\n\n社会改革の思想を帯びていた欧州モダニズムを、様式すなわち見た目の語彙として米国へ紹介した展覧会と評されています。命名により普及が加速する一方で、思想の脱色という代償も指摘され、のちのポストモダンからの批判の伏線となりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"MoMA: Modern Architecture: International Exhibition (1932)","url":null}]},{"date":"1952-10-01","precision":"month","end_date":null,"type":"point","layer":"都市と生活","title":"ユニテ・ダビタシオン(マルセイユ)竣工","summary":"ル・コルビュジエ設計の集合住宅ユニテ・ダビタシオンが、マルセイユに完成しました。337戸に商店街や屋上庭園を積層し、戦後フランスの深刻な住宅難に「垂直の村」で応えています。\n\n人体寸法に基づく尺度モデュロールを全面適用した実作で、粗打ちコンクリートの表現は、のちのブルータリズムの源流となりました。ただし理念先行の大規模集合住宅は、後年プルーイット・アイゴーの失敗で厳しく問い直されることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Fondation Le Corbusier: Unité d'habitation, Marseille","url":null}]},{"date":"1958-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と材料","title":"シーグラム・ビル完成、カーテンウォールの規範に","summary":"ミース・ファン・デル・ローエ設計のシーグラム・ビルが、ニューヨークに完成しました。ブロンズとガラスのカーテンウォールと前面広場を持つ構成は、以後の超高層オフィスの世界的な規範となります。\n\n「レス・イズ・モア」の美学の到達点とされ、当時最も建設費の高い超高層とも報じられました。前面広場の評価は、のちにニューヨークの容積率優遇制度(都市と生活レイヤー)を生み、企業の威信が都市空間を形づくる時代を象徴しています。","detail":null,"credibility":"unverified","credibility_note":"「当時世界で最も建設費の高い超高層」という言及は報道・二次資料に基づくもので、一次的な費用の開示は確認できません。","sources":[{"title":"Wikipedia: Seagram Building","url":"https://en.wikipedia.org/wiki/Seagram_Building"}]},{"date":"1960-01-01","precision":"year","end_date":null,"type":"point","layer":"様式と思想","title":"世界デザイン会議で「メタボリズム」宣言","summary":"東京で開かれた世界デザイン会議に合わせ、菊竹清訓、黒川紀章らが宣言文書「METABOLISM 1960」を発表しました。都市と建築を新陳代謝する生命体と捉え、成長と交換を前提とする設計を唱えています。\n\n高度成長期の日本の人口集中という、都市と生活レイヤーの現実が生んだ日本発の建築運動です。理念はのちに中銀カプセルタワービルで実作となりますが、その建物の運命は、思想と現実の距離をも示すことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Metabolism (architecture)","url":"https://en.wikipedia.org/wiki/Metabolism_(architecture)"}]},{"date":"1966-01-01","precision":"year","end_date":null,"type":"point","layer":"様式と思想","title":"ヴェンチューリ『建築の多様性と対立性』刊行","summary":"ロバート・ヴェンチューリが著書のなかで「レス・イズ・ア・ボア(退屈)」と切り返し、単純明快を求めるモダニズムに対して、曖昧さや折衷、歴史的引用を含む建築の豊かさを擁護しました。\n\nMoMAから出版された本書は、ポストモダン建築の理論的な出発点とされています。国際様式がその定義から30年余りで内部から批判された形であり、様式の交代がまず思想の言葉から始まるという、本年表の型を示す例でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"MoMA: Complexity and Contradiction in Architecture (1966)","url":null}]},{"date":"1972-01-01","precision":"year","end_date":null,"type":"point","layer":"都市と生活","title":"中銀カプセルタワービル完成","summary":"黒川紀章設計の中銀カプセルタワービルが、東京・銀座に完成しました。工場生産した140個のカプセル住戸を2本のコアに取り付ける構成で、メタボリズムの理念を体現した代表的な実作です。\n\nカプセルは将来の交換が想定され、世界初のカプセル型集合住宅と紹介されることも多い建物です。都心に暮らす単身ビジネスマンという新しい生活像に応えた点で、都市と生活レイヤーの実験でもありました。","detail":null,"credibility":"disputed","credibility_note":"「世界初のカプセル型集合住宅」という位置づけは定義に依存し、先行例の扱いによって見解が分かれます。","sources":[{"title":"Wikipedia: Nakagin Capsule Tower","url":"https://en.wikipedia.org/wiki/Nakagin_Capsule_Tower"}]},{"date":"1972-03-16","precision":"day","end_date":null,"type":"point","layer":"都市と生活","title":"プルーイット・アイゴー団地の爆破解体が始まる","summary":"米セントルイスの大規模公営住宅プルーイット・アイゴーで、荒廃した棟の爆破解体が始まりました。モダニズムの手法で計画された団地の、竣工から20年足らずでの取り壊しでした。\n\n評論家ジェンクスは爆破の瞬間を「**モダニズム建築が死んだ日**」と呼びましたが、失敗の主因を設計に帰すこの語りには、人種隔離や維持財源の欠如といった政策要因を軽視しているとの批判が根強くあります。建築に何が背負えるのかを問う事件です。","detail":null,"credibility":"disputed","credibility_note":"解体をモダニズム建築の失敗の証拠とする解釈は象徴的な語りであり、主因は住宅政策や運営にあったとする研究が有力です。","sources":[{"title":"Wikipedia: Pruitt–Igoe","url":"https://en.wikipedia.org/wiki/Pruitt%E2%80%93Igoe"}]},{"date":"1977-01-31","precision":"day","end_date":null,"type":"point","layer":"技術と材料","title":"ポンピドゥー・センター開館","summary":"パリに、レンゾ・ピアノとリチャード・ロジャース設計のポンピドゥー・センターが開館しました。構造や配管、動線を色分けして建物の外側に露出し、内部を自由な無柱空間とする、ハイテク建築の代表作です。\n\n歴史都市の中心に現れた精製工場のような姿は激しい賛否を呼びましたが、前面広場とともに、市民へ開かれた文化装置として定着しました。技術の表現がそのまま様式となる、技術と材料レイヤーの思想化を示す例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Centre Pompidou: The Building","url":null}]},{"date":"1984-01-01","precision":"year","end_date":null,"type":"point","layer":"様式と思想","title":"AT&Tビル完成、ポストモダンの記念碑に","summary":"フィリップ・ジョンソン設計のAT&Tビルが、ニューヨークに完成しました。頂部に家具のような割れたペディメントを載せた石張りの超高層は、ガラスの箱への決別を宣言するものでした。\n\n1932年に国際様式を米国へ紹介した本人によるポストモダン転向であるだけに象徴性は大きく、歴史的意匠の引用が企業建築の主流となる80年代を開きました。ヴェンチューリの理論が、超高層のスケールで実現した形といえます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 550 Madison Avenue","url":"https://en.wikipedia.org/wiki/550_Madison_Avenue"}]},{"date":"1997-10-01","precision":"month","end_date":null,"type":"point","layer":"都市と生活","title":"グッゲンハイム美術館ビルバオ開館","summary":"フランク・ゲーリー設計のグッゲンハイム美術館が、造船業の衰退したスペイン・ビルバオに開館しました。チタンで覆われた曲面の群れは、航空機設計ソフトを転用する手法(技術と材料レイヤー)で実現されています。\n\n開館後の観光客急増による経済再生は**ビルバオ効果**と呼ばれ、各都市が象徴建築を求める潮流を生みました。ただし効果の金額は自治体系の推計が中心で、他都市での再現性には懐疑も残ります。デジタル設計普及の起点でもあります。","detail":null,"credibility":"unverified","credibility_note":"経済効果とされる数値は州・市当局や関係機関の推計に基づいており、独立した検証は限られています。","sources":[{"title":"Guggenheim Bilbao: The Building","url":null}]},{"date":"2010-01-04","precision":"day","end_date":null,"type":"point","layer":"技術と材料","title":"ブルジュ・ハリファ開業、高さ828メートル","summary":"ドバイに、世界一の高さ828メートルを誇るブルジュ・ハリファが開業しました。風の影響を抑えるため上昇につれて断面を細めるY字形の平面と、超高強度コンクリートを高所へ圧送する技術が、この高さを支えています。\n\n金融危機でドバイが債務危機に陥った直後の開業であり、支援した隣国首長の名へ改称された経緯は、超高層が経済と威信の指標であることを物語ります。高さ競争の舞台は湾岸・アジアへ移り、欧米中心の摩天楼史が塗り替えられました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Burj Khalifa","url":"https://en.wikipedia.org/wiki/Burj_Khalifa"}]},{"date":"2014-03-01","precision":"month","end_date":null,"type":"point","layer":"都市と生活","title":"坂茂がプリツカー賞受賞、紙の建築が評価される","summary":"紙管を構造材とする避難所や仮設住宅を各地の被災地で建ててきた坂茂が、プリツカー賞を受賞しました。神戸の紙の教会からニュージーランドの紙のカテドラルに至る実践が評価されています。\n\n記念碑ではなく、緊急時の生活を支える建築に最高の栄誉が与えられたことは、象徴建築の造形競争が続いた2000年代からの転換と受け止められました。建築の社会的役割を問い直す流れは、以後の同賞の受賞者選定にも続いていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Pritzker Architecture Prize: Shigeru Ban","url":"https://www.pritzkerprize.com/laureates/shigeru-ban"}]},{"date":"2019-03-01","precision":"month","end_date":null,"type":"point","layer":"技術と材料","title":"ミョーストーネ完成、木造超高層の時代へ","summary":"ノルウェーに、高さ85.4メートル、18階建ての木造高層ビル、ミョーストーネが完成し、CTBUHに当時の世界最高の木造建築と認定されました。集成材と直交集成板(CLT)による構造です。\n\n炭素を蓄える木材は脱炭素時代の構造材として再評価され、各国で耐火規制の見直しと高層木造の計画が続いています。鉄とガラスから始まった本年表が、**木への回帰**という円環を描いて現在に至ることを示す事例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"CTBUH: Mjøstårnet","url":null}]},{"date":"2022-04-01","precision":"month","end_date":null,"type":"point","layer":"都市と生活","title":"中銀カプセルタワービル解体始まる","summary":"老朽化と修繕の困難から、中銀カプセルタワービルの解体が始まりました。設計時に想定されたカプセルの交換は、竣工から50年のあいだに一度も実現しませんでした。\n\n交換により生き続けるはずだった建築が、交換できないまま終わった結末は、**新陳代謝の思想と現実の距離**を示しています。一部のカプセルは取り外されて美術館などに収蔵・再生され、解体をめぐる議論は、戦後日本の名建築の保存問題を広く喚起しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Nakagin Capsule Tower","url":"https://en.wikipedia.org/wiki/Nakagin_Capsule_Tower"}]}]},{"slug":"culture-cinema-100","title":"映画100年史","description":"1895年のリュミエール兄弟から2020年代の配信時代まで。撮影・上映の技術、作品と作家、産業と観客の3層を重ね、技術の節目がいかに表現と興行を作り替えてきたかを追う。","category":"culture","language":"ja","start_year":1895,"end_year":2023,"layers":[{"name":"技術","color":"blue"},{"name":"作品と作家","color":"pink"},{"name":"産業と観客","color":"gold"}],"events":[{"date":"1895-12-28","precision":"day","end_date":null,"type":"point","layer":"技術","title":"リュミエール兄弟、パリのグラン・カフェで有料上映","summary":"リュミエール兄弟がパリのグラン・カフェで、撮影・映写・複製を1台でこなすシネマトグラフによる有料公開上映を行い、「映画の誕生」の通説的な起点となった。\n\nエジソンのキネトスコープ（1894年）が覗き箱での個人鑑賞だったのに対し、スクリーンに投影して複数人が同時に見る形式が興行の原型を作った。作品はまだ1分足らずの実写だが、**観客が集まり料金を払う「産業と観客」のレイヤー**がこの日から始まり、翌年には世界各地へ巡回興行が広がった。","detail":null,"credibility":"disputed","credibility_note":"「最初の映画上映」の定義は諸説あり、同年11月にベルリンでスクラダノフスキー兄弟が行った有料上映や、エジソン社の先行装置を起点とする見方がある。","sources":[{"title":"Institut Lumière (公式)","url":"https://www.institut-lumiere.org/"},{"title":"Wikipedia: Auguste and Louis Lumière","url":"https://en.wikipedia.org/wiki/Auguste_and_Louis_Lumi%C3%A8re"}]},{"date":"1902-09-01","precision":"month","end_date":null,"type":"point","layer":"作品と作家","title":"メリエス『月世界旅行』公開","summary":"舞台の手品師出身のメリエスが、セットと特殊効果で約14分の物語映画『月世界旅行』を作り、映画を「見世物」から「語り」へ導いた。多重露光やストップ・トリックといった技術レイヤーの発明を、物語のために体系的に用いた最初期の作品である。\n\n無許可の複製が米国で流通して収益を奪われた経緯は、産業レイヤーで著作権と配給の仕組みが未整備だったことを示す。着色版が近年再発見され、修復のうえ上映されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: A Trip to the Moon","url":"https://en.wikipedia.org/wiki/A_Trip_to_the_Moon"}]},{"date":"1912-09-10","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"日本活動写真株式会社（日活）設立","summary":"国内4社が合併して日本活動写真株式会社（日活）が誕生し、製作・配給・興行を束ねる日本最初期の大手映画会社が生まれた。\n\n欧米でも同時期にスタジオが形成されており、日本の映画産業が世界とほぼ同時に企業化したことを示す。技術レイヤーでは輸入映写機と国産フィルムの整備が進み、作品レイヤーでは弁士付きの上映が独自の受容文化を作っていた。以後、松竹（1920年）などの参入で競争構造が形作られる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日活: 会社沿革（公式）","url":"https://www.nikkatsu.com/company/history.html"},{"title":"Wikipedia: 日活","url":"https://ja.wikipedia.org/wiki/%E6%97%A5%E6%B4%BB"}]},{"date":"1927-10-06","precision":"day","end_date":null,"type":"point","layer":"技術","title":"『ジャズ・シンガー』公開、トーキーの商業的成功","summary":"ワーナー・ブラザースのヴァイタフォン方式で同期音声を持つ長編『ジャズ・シンガー』が公開され、部分トーキーながら興行の成功が各社の設備投資を決定づけた。数年でサイレントは主流から退く。\n\n**音の導入は撮影所の防音化、俳優の声、音楽著作権と、技術・作品・産業のすべてを組み替えた**。同じ年には映画芸術科学アカデミーが設立され、業界の自己組織化が進む。日本では弁士文化のためトーキー化が数年遅れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Jazz Singer","url":"https://en.wikipedia.org/wiki/The_Jazz_Singer"}]},{"date":"1930-01-01","precision":"year","end_date":"1948-05-03","type":"period","layer":"産業と観客","title":"ハリウッド・スタジオシステムの全盛期","summary":"大手5社が製作・配給・興行を垂直統合し、専属契約の俳優と監督で量産した時代。トーキー化に伴う設備投資が寡占を強め、大恐慌下でも週7,000万人以上が映画館に通った。\n\n作品レイヤーではジャンル映画とスターシステムが確立し、1934年の製作倫理規定（ヘイズ・コード）の厳格運用で表現の枠も産業側が決めた。技術レイヤーではテクニカラーが浸透していく。1948年の反トラスト判決で体制は崩れ始める。","detail":null,"credibility":"disputed","credibility_note":"始点と終点は論者により異なる（トーキー化の1927〜1929年を起点とする説、テレビ普及の1950年代までとする説など）。","sources":[{"title":"Wikipedia: Studio system","url":"https://en.wikipedia.org/wiki/Studio_system"}]},{"date":"1941-05-01","precision":"day","end_date":null,"type":"point","layer":"作品と作家","title":"オーソン・ウェルズ『市民ケーン』公開","summary":"25歳のオーソン・ウェルズが『市民ケーン』を発表。パンフォーカス、非線形の語り、天井の見える構図で撮影所の慣習を組み替え、後世の批評で最高作と繰り返し評された。撮影監督グレッグ・トーランドの深い被写界深度は、高感度フィルムと照明技術の進歩という技術レイヤーに支えられていた。\n\nモデルとされた新聞王ハーストの妨害で興行は振るわず、産業レイヤーではスタジオが有力者の圧力に弱いことを露呈した。アカデミー賞は脚本賞のみの受賞に終わった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Citizen Kane","url":"https://en.wikipedia.org/wiki/Citizen_Kane"}]},{"date":"1948-05-03","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"米最高裁「パラマウント判決」、スタジオの劇場所有を違法と判断","summary":"米最高裁が製作会社による映画館チェーンの所有と抱き合わせ配給を反トラスト法違反と認定し、スタジオの垂直統合が解体へ向かった。判決の翌年からスタジオは劇場部門の分離を進め、2020年に同意判決が終了するまで70年以上ハリウッドの産業構造を規定した。\n\n同時期にテレビが家庭に入り始め、観客動員は減少に転じる。スタジオは大作主義とワイドスクリーンや立体といった技術的な差別化で対抗し、独立プロと監督の裁量が拡大した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: United States v. Paramount Pictures, Inc.","url":"https://en.wikipedia.org/wiki/United_States_v._Paramount_Pictures,_Inc."}]},{"date":"1951-09-10","precision":"day","end_date":null,"type":"point","layer":"作品と作家","title":"黒澤明『羅生門』、ヴェネツィア国際映画祭で金獅子賞","summary":"前年公開の黒澤明『羅生門』がヴェネツィア国際映画祭で最高賞の金獅子賞を受賞し、日本映画が国際的に発見された。国内では評価が割れた作品を、海外の映画祭という制度が押し上げた例である。\n\n以後、溝口・小津らが欧州の映画祭で評価される。産業レイヤーでは日本の映画館入場者数が急増期にあり、1950年代を通じて年10億人規模に達する。技術レイヤーでは宮川一夫が太陽に直接カメラを向ける撮影を試み、表現の常識を更新した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 羅生門 (1950年の映画)","url":"https://ja.wikipedia.org/wiki/%E7%BE%85%E7%94%9F%E9%96%80_(1950%E5%B9%B4%E3%81%AE%E6%98%A0%E7%94%BB)"}]},{"date":"1958-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と観客","title":"日本の映画館入場者数が約11億2,700万人でピーク","summary":"日本映画製作者連盟の統計で年間入場者数が約11億2,700万人の過去最高を記録。作品レイヤーでは大手6社が週替わり2本立てで年500本以上を製作した黄金期である。\n\n技術レイヤーではテレビ受像機が皇太子成婚（1959年）を機に普及し、**家庭が「観客席」になっていく**。翌年のテレビ普及本格化とともに入場者数は急減に転じ、1960年代を通じて3分の1以下に落ち込んで撮影所システムの再編を促した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日本映画製作者連盟: 過去データ一覧（入場人員）","url":"http://www.eiren.org/toukei/data.html"}]},{"date":"1959-05-01","precision":"month","end_date":"1968-05-31","type":"period","layer":"作品と作家","title":"ヌーヴェルヴァーグの時代","summary":"トリュフォー『大人は判ってくれない』のカンヌ受賞からゴダールらの活動を経て、1968年のカンヌ中止までの時代。作家主義が世界に広がった。\n\n**軽量カメラと高感度フィルム、同時録音機という技術レイヤーの進歩が、撮影所を出て街頭で撮る手法を可能にした**。批評誌『カイエ・デュ・シネマ』出身の監督たちは「作家」という概念を定着させ、産業レイヤーではスタジオ外の低予算製作が興行として成立することを示した。","detail":null,"credibility":"disputed","credibility_note":"運動の始点・終点には諸説あり（1958年『美しきセルジュ』を起点、1960年代前半で終わるとする見方など）。本項は便宜的な区切り。","sources":[{"title":"Wikipedia: French New Wave","url":"https://en.wikipedia.org/wiki/French_New_Wave"}]},{"date":"1975-06-20","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"『ジョーズ』公開、ブロックバスター興行の原型に","summary":"『ジョーズ』が全米400館超の同時公開とテレビCMの大量投下で夏興行を制し、公開規模とマーケティングの型を作った。それまで大作は都市部の少数館から順次拡大するのが通例で、広域一斉公開は例外だった。\n\n作品レイヤーではスピルバーグら「映画学校世代」が主流に入り、技術レイヤーでは1977年の『スター・ウォーズ』がモーションコントロール撮影とドルビーステレオで続く。以後、夏と年末の大作商戦が産業のリズムになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Jaws (film)","url":"https://en.wikipedia.org/wiki/Jaws_(film)"}]},{"date":"1976-09-01","precision":"month","end_date":null,"type":"point","layer":"技術","title":"日本ビクターがVHS方式のビデオデッキを発売","summary":"日本ビクターがVHS方式のビデオデッキを発売し、家庭で映画を録画・再生できる時代が始まった。ベータマックスとの規格競争を経てVHSが標準となり、レンタルビデオ市場を生む。\n\n産業レイヤーでは映画会社が当初は違法録画を恐れて訴訟を起こしたが（ベータマックス訴訟）、1980年代にはビデオ販売とレンタルが劇場興行を上回る収益源となった。作品レイヤーでは旧作や小規模作品が「棚」で発見される機会が生まれ、**後の配信時代の視聴形態を先取り**した。","detail":null,"credibility":"unverified","credibility_note":"発表は1976年9月、発売は同年10月とする資料もあり、月の特定は要確認。","sources":[{"title":"Wikipedia: VHS","url":"https://en.wikipedia.org/wiki/VHS"}]},{"date":"1995-11-22","precision":"day","end_date":null,"type":"point","layer":"技術","title":"『トイ・ストーリー』公開、全編CGによる初の長編","summary":"ピクサーがコンピュータ・グラフィックスだけで長編『トイ・ストーリー』を完成させ、アニメーションと実写の双方に転換をもたらした。1993年『ジュラシック・パーク』の恐竜が実写合成の壁を越えたのに続く節目である。\n\n産業レイヤーではディズニーとの配給契約が長編CG映画の商業モデルを確立し、2000年代の手描きアニメ縮小につながる。作品レイヤーでは「デジタルの作家」という新しい職能が生まれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Toy Story","url":"https://en.wikipedia.org/wiki/Toy_Story"}]},{"date":"1997-12-19","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"『タイタニック』公開、世界興行収入が初めて10億ドルを突破","summary":"製作費超過で不安視された大作『タイタニック』が記録的なロングランとなり、世界興行収入が初めて10億ドルを突破。世界同時マーケティングとリピート鑑賞の力を示した。\n\n技術レイヤーではCGと大規模セットの併用が標準になり、作品レイヤーではメロドラマと災害映画の合体という古典的な語りが最新技術で再生された。同年、DVDが米国で発売されて家庭視聴の画質が上がる一方、映画館は「大画面でしか味わえない体験」を売る方向へ向かう。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Titanic (1997 film)","url":"https://en.wikipedia.org/wiki/Titanic_(1997_film)"},{"title":"Box Office Mojo: Titanic","url":null}]},{"date":"2005-01-01","precision":"year","end_date":"2014-12-31","type":"period","layer":"技術","title":"フィルム上映からデジタル上映への転換期","summary":"DCI規格の策定を起点に、主要国の映画館がフィルム映写機をデジタルプロジェクターへ置き換えた期間。2009年『アバター』の3D興行がデジタル化の投資を一気に正当化し、2012年にはコダックが連邦破産法を申請した。\n\n産業レイヤーでは配給コストが激減する一方、小規模館の設備投資負担が問題化した。作品レイヤーではデジタルカメラでの撮影が標準となり、フィルムは一部作家の選択肢に退いた。","detail":null,"credibility":"unverified","credibility_note":"始点・終点は規格策定と主要国の移行完了時期から概略で置いたもので、国別の移行時期は大きく異なる。","sources":[{"title":"Wikipedia: Digital cinema","url":"https://en.wikipedia.org/wiki/Digital_cinema"}]},{"date":"2007-01-01","precision":"month","end_date":null,"type":"point","layer":"技術","title":"Netflixがストリーミング配信を開始","summary":"DVD郵送レンタルから始まったNetflixがオンライン視聴を導入し、**映画が「届く」から「呼び出す」ものへ変わる**起点となった。ブロードバンドの普及という技術基盤の上で、月額定額のライブラリという新しい消費形態が定着する。\n\n産業レイヤーでは劇場・ビデオ・テレビという公開順序（ウィンドウ）が揺らぎ、作品レイヤーでは2010年代半ばから配信会社の自社製作が映画祭と賞レースに参入していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Netflix","url":"https://en.wikipedia.org/wiki/Netflix"}]},{"date":"2009-12-18","precision":"day","end_date":null,"type":"point","layer":"技術","title":"『アバター』公開、3Dとデジタル上映を興行の主流に押し上げる","summary":"パフォーマンス・キャプチャと立体撮影を組み合わせた大作『アバター』が世界興行収入の記録を更新し、3D上映の設備投資を加速させた。\n\n1950年代の3Dブームがテレビ対策として短命に終わったのに対し、今回はデジタル上映への移行と結びついて劇場の設備を恒久的に変えた。産業レイヤーでは3D追加料金が興行収入を押し上げ、作品レイヤーではその後数年、大作の3D化が半ば義務のようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Avatar (2009 film)","url":"https://en.wikipedia.org/wiki/Avatar_(2009_film)"}]},{"date":"2020-02-09","precision":"day","end_date":null,"type":"point","layer":"作品と作家","title":"『パラサイト 半地下の家族』、非英語作品で初のアカデミー作品賞","summary":"ポン・ジュノ監督『パラサイト 半地下の家族』が非英語作品で初めてアカデミー作品賞を受賞し、監督賞など4部門を制した。前年のカンヌ最高賞に続き、英語圏中心の評価軸が動いた。\n\n韓国映画産業の1990年代以降の投資と映画振興策の成果が国際的な制度で認められた形である。技術・産業レイヤーでは字幕付き作品が配信で日常的に視聴される環境が受容の土壌を作っており、翌月にはパンデミックで世界の映画館が休業し、配信への移行が一気に進む。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Parasite (2019 film)","url":"https://en.wikipedia.org/wiki/Parasite_(2019_film)"}]},{"date":"2020-12-03","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"ワーナー、2021年全作品を劇場と配信で同日公開と発表","summary":"パンデミック下でワーナーが2021年全作品の劇場とHBO Maxでの同日公開を発表し、**劇場優先の公開順序（ウィンドウ）が大手スタジオによって公然と崩された**。\n\n映画館の休業と配信加入者の急増という産業レイヤーの変化が、技術レイヤーで整っていた配信基盤に一気に流れ込んだ形である。作家や劇場チェーンの反発を受けて翌年には劇場独占期間を短縮した形で折り合いがついたが、45日ウィンドウなど新しい慣行が定着した。同年、日本では『劇場版「鬼滅の刃」無限列車編』が興行収入の国内記録を更新し、劇場体験の需要が消えていないことも示された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: HBO Max (Warner Bros. day-and-date releases)","url":null},{"title":"Warner Bros. Discovery: プレスリリース (2020年12月3日)","url":null}]},{"date":"2023-07-21","precision":"day","end_date":null,"type":"point","layer":"産業と観客","title":"『バービー』と『オッペンハイマー』が同日公開、劇場に観客が戻る","summary":"対照的な『バービー』と『オッペンハイマー』の同日公開が「バーベンハイマー」現象を生み、パンデミック後の劇場興行回復を象徴した。SNS上の観客発の話題化がマーケティングを上回る効果を持った例である。\n\n技術レイヤーではIMAX70mmフィルム上映が話題になるなど、配信では代替できない体験が再評価された。同時期に全米で脚本家・俳優組合のストライキが起き、配信時代の報酬とAI利用をめぐる産業構造の再交渉が並行していた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Barbenheimer","url":"https://en.wikipedia.org/wiki/Barbenheimer"}]}]},{"slug":"culture-design-thinking","title":"デザイン思考の歴史","description":"バウハウスからd.school、そして批判の時代へ。思想・企業実践・教育制度の3層を重ね、デザインが造形の技能から問題解決の方法論へと広がり、流行と反省を経て定着するまでを静かに辿る年表です。","category":"culture","language":"ja","start_year":1919,"end_year":2023,"layers":[{"name":"思想と方法論","color":"purple"},{"name":"企業と実践","color":"orange"},{"name":"教育と制度","color":"teal"}],"events":[{"date":"1919-04-01","precision":"month","end_date":"1933-07-01","type":"period","layer":"教育と制度","title":"バウハウス開校","summary":"芸術と技術の統合を掲げる造形学校バウハウスが、独ヴァイマルに開校しました。工業生産を前提に、素材と機能から発想する基礎教育を体系化し、ナチス政権の圧力で1933年に閉校するまで、モダンデザインの規範を作っています。\n\n閉校後は、教員たちの亡命によって方法論が米国の大学へ移植されました。デザインを**個人の才能ではなく教えられる方法**とみなす伝統はここに始まり、後年のd.schoolに連なる「デザイン教育の制度化」の源流となります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bauhaus","url":"https://en.wikipedia.org/wiki/Bauhaus"}]},{"date":"1969-01-01","precision":"year","end_date":null,"type":"point","layer":"思想と方法論","title":"サイモン『人工物の科学』刊行","summary":"のちにノーベル経済学賞を受けるハーバート・サイモンが、『人工物の科学』を刊行しました。「現状をより好ましいものに変えようと行為を考案する者は、誰もがデザインをしている」と述べ、デザインを科学の対象に据えています。\n\n造形の技能だったデザインを、経営や工学を含むあらゆる問題解決に共通する知的活動として一般化した宣言です。後年「デザイン思考」と呼ばれる考え方の、最も広く引用される理論的な土台になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Sciences of the Artificial","url":"https://en.wikipedia.org/wiki/The_Sciences_of_the_Artificial"}]},{"date":"1971-01-01","precision":"year","end_date":null,"type":"point","layer":"思想と方法論","title":"パパネック『生きのびるためのデザイン』刊行","summary":"デザイナーのヴィクター・パパネックが、『生きのびるためのデザイン』を刊行しました。商業主義に奉仕するデザインを「有害な職業」とまで呼び、社会的弱者や途上国のための設計を説いています。\n\nデザインの対象を商品から社会課題へと広げた古典であり、後年の社会課題解決型デザイン思考の先駆といえます。同時にその商業主義批判は、半世紀後に噴出するデザイン思考批判(同レイヤー)の論点を先取りしていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Victor Papanek","url":"https://en.wikipedia.org/wiki/Victor_Papanek"}]},{"date":"1982-01-01","precision":"year","end_date":null,"type":"point","layer":"思想と方法論","title":"クロス「デザイナー的な知」論文発表","summary":"英国のデザイン研究者ナイジェル・クロスが、論文「デザイナー的な知」を発表しました。科学の知とも人文の知とも異なる第三の知の様式がデザイン実践にあると論じ、デザイン研究を独立した学問領域として基礎づけています。\n\n実務家の直観や素描を研究対象へ引き上げたことで、デザインの思考プロセスを語る学術的な語彙が整いました。1960年代からのデザイン方法論運動を継ぎ、のちのビジネス的流行とは別系統の、学術的な系譜を形づくります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nigel Cross, \"Designerly Ways of Knowing\", Design Studies Vol.3 No.4 (1982)","url":null}]},{"date":"1987-01-01","precision":"year","end_date":null,"type":"point","layer":"思想と方法論","title":"ロウ『デザイン・シンキング』刊行","summary":"建築学者ピーター・ロウが、建築家と都市設計者の思考過程を分析した『デザイン・シンキング』を、MIT出版から刊行しました。この語が書名として広く流通する、初期の例です。\n\nただし、ここでの語義は建築設計の記述であり、後年ビジネス手法として流行する「デザイン思考」とはほぼ別物です。**同じ語が意味を変えながら流行していく**過程そのものが、この年表の主題といえます。","detail":null,"credibility":"disputed","credibility_note":"書名としては初期の例ですが、「デザイン思考」という語・概念の起源には諸説あり、本書を起源と断定する見方には異論があります。","sources":[{"title":"Wikipedia: Design thinking","url":"https://en.wikipedia.org/wiki/Design_thinking"}]},{"date":"1991-01-01","precision":"year","end_date":null,"type":"point","layer":"企業と実践","title":"IDEO設立","summary":"デビッド・ケリーの事務所と、ビル・モグリッジ、マイク・ナットールの3社が合併し、米パロアルトにデザインファームIDEOが誕生しました。前身の事務所は、アップル初期のマウス開発などで知られています。\n\nプロダクトデザインの受託会社として出発したIDEOは、やがて手法そのものを商品化し、「方法論を売る会社」へと転身していきます。デザイン思考の商業的な担い手の中心が、ここに揃いました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: IDEO","url":"https://en.wikipedia.org/wiki/IDEO"}]},{"date":"1999-02-09","precision":"day","end_date":null,"type":"point","layer":"企業と実践","title":"米ABCがIDEOの買い物カート再設計を放映","summary":"米ABCの報道番組ナイトラインが、IDEOに5日間でショッピングカートを再設計させる企画「ザ・ディープ・ダイブ」を放映しました。付箋を使うブレインストーミングと、素早い試作の現場が全米に流れています。\n\nデザインのプロセスが大衆的な見世物として初めて可視化された放送であり、ビジネス界の関心に火を付けました。のちのd.school設立(教育と制度レイヤー)や企業研修ブームに至る、デザイン思考流行の世俗的な起点とされています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ABC Nightline: The Deep Dive (1999)","url":null}]},{"date":"2005-01-01","precision":"year","end_date":null,"type":"point","layer":"教育と制度","title":"スタンフォード大学にd.school設立","summary":"SAP共同創業者ハッソ・プラットナーの3500万ドルの寄付により、スタンフォード大学にデザイン研究所(通称d.school)が設立されました。全学部の学生に開かれた、専攻横断のデザイン思考教育機関です。\n\n共感・定義・発想・試作・検証の5段階プロセスに代表される教育のパッケージ化が進み、**方法論の標準化と輸出**の拠点となりました。世界中の大学と企業研修が、このモデルを模倣していきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Stanford d.school","url":"https://dschool.stanford.edu"}]},{"date":"2007-01-01","precision":"year","end_date":null,"type":"point","layer":"教育と制度","title":"ポツダムにHPIデザイン思考学校開設","summary":"プラットナーが、独ポツダムの自身の研究所(HPI)に、デザイン思考の教育課程「HPIスクール・オブ・デザインシンキング」を開設しました。スタンフォードd.schoolの姉妹校にあたります。\n\n米国西海岸で生まれた教育モデルが、欧州の工学教育に接続されました。ここで学んだ人材と教材は欧州企業の研修市場へ供給され、SAPをはじめとする大企業の組織改革に、デザイン思考が組み込まれる回路を作っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"HPI School of Design Thinking (ポツダム) 公式サイト","url":null}]},{"date":"2008-06-01","precision":"month","end_date":null,"type":"point","layer":"思想と方法論","title":"ティム・ブラウンがHBRに「デザイン思考」寄稿","summary":"IDEOのCEOティム・ブラウンが、ハーバード・ビジネス・レビュー誌に論文「デザイン思考」を発表しました。デザイナーの感性と手法を、イノベーションを生む経営の方法論として定式化しています。\n\n翌年の著書『デザイン思考が世界を変える』と合わせて、この概念は**経営言語への翻訳**を完了しました。以後、コンサルティング業界と企業研修市場で爆発的に広がり、2010年代の流行語としての地位を確立していきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Tim Brown, \"Design Thinking\", Harvard Business Review (June 2008)","url":"https://hbr.org/2008/06/design-thinking"}]},{"date":"2010-01-01","precision":"year","end_date":null,"type":"point","layer":"教育と制度","title":"人間中心設計が国際規格ISO 9241-210に","summary":"インタラクティブシステムの人間中心設計プロセスが、国際規格ISO 9241-210として発行されました。利用状況の理解、ユーザーの関与、反復的な設計と評価などを、開発の要件として定めています。\n\nデザイン思考の核心にある人間中心の考え方が、調達仕様や開発標準に書き込める形式へと翻訳されました。流行とは独立に実務へ定着する経路であり、後年ブームが退潮しても残る「制度化された成果」の代表です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ISO 9241-210:2010 Ergonomics of human-system interaction — Part 210: Human-centred design","url":null}]},{"date":"2011-01-01","precision":"year","end_date":null,"type":"point","layer":"教育と制度","title":"英政府がGDS設立、行政にデザインが常駐","summary":"英政府が、行政サービスのデジタル化組織Government Digital Service(GDS)を設立しました。利用者ニーズから出発する設計原則を掲げ、政府サイトを統合したGOV.UKは、2013年に英国のデザイン・オブ・ザ・イヤーを受賞しています。\n\nデザイン思考的な手法が、一国の行政の標準装備になった画期です。米国の18Fや日本のデジタル庁など、各国の政府デジタル組織のモデルとなりました。教育機関の外で方法論が制度化された、代表的な例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Government Digital Service","url":"https://en.wikipedia.org/wiki/Government_Digital_Service"}]},{"date":"2013-01-01","precision":"year","end_date":null,"type":"point","layer":"企業と実践","title":"IBMが大規模デザイン組織を始動","summary":"IBMが、米オースティンを拠点にデザイン部門IBM Designを発足させました。デザイナー1000人超の採用計画と、全社員向け研修プログラムIBM Design Thinkingの展開を打ち出したと報じられています。\n\n「史上最大級のデザイン投資」と喧伝され、大企業がデザイン組織を内製する流れを決定づけました。同時期のデザイン会社買収ブーム(同レイヤー)と合わせ、実践の主導権はデザイン事務所から事業会社へと移っていきます。","detail":null,"credibility":"unverified","credibility_note":"採用規模や投資額は同社発表と報道に基づく数字で、独立した検証はありません。","sources":[{"title":"IBM Design (公式サイト)","url":"https://www.ibm.com/design/"}]},{"date":"2013-01-01","precision":"year","end_date":"2017-12-31","type":"period","layer":"企業と実践","title":"デザイン会社の買収ブーム","summary":"AccentureによるFjord買収、Capital OneによるAdaptive Path買収、McKinseyによるLunar買収など、コンサルティング会社・金融・事業会社によるデザイン会社の買収が相次ぎました。\n\nデザインが、外注するサービスから**経営資源として買われる対象**へと変わったことを示す潮流です。ジョン・マエダの年次報告書Design in Tech Reportがこの動きを毎年集計し、業界の合言葉になりました。","detail":null,"credibility":"disputed","credibility_note":"買収件数の集計はDesign in Tech Report等の民間集計によるもので、集計基準により件数は変動します。","sources":[{"title":"Design in Tech Report (John Maeda)","url":"https://designintech.report"}]},{"date":"2017-06-01","precision":"month","end_date":null,"type":"point","layer":"思想と方法論","title":"ナターシャ・ジェンのデザイン思考批判講演","summary":"ペンタグラムのパートナー、ナターシャ・ジェンが、ニューヨークの99Uカンファレンスでデザイン思考を痛烈に批判する講演を行いました。5段階図式の形骸化と、付箋に頼る安易なワークショップ文化を槍玉に挙げています。\n\nデザインに不可欠な批評(クリット)の不在という指摘は、方法論の大衆化が生んだ質の劣化を突くものでした。流行の頂点で内部から上がった、最初の広く知られた異議であり、以後、批判は散発から潮流へと変わっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Natasha Jen: 99U Conference講演 (2017)","url":null}]},{"date":"2018-05-23","precision":"day","end_date":null,"type":"point","layer":"教育と制度","title":"経産省・特許庁が「デザイン経営」宣言","summary":"経済産業省と特許庁の研究会が、報告書「デザイン経営」を公表しました。最高デザイン責任者の経営参画やデザイン投資の効果を説き、日本企業へのデザイン思考導入を、国の政策として後押ししています。\n\n米国では企業実践が先行し、批判期に入りつつあった時期に、日本では官庁がブームの推進役を担いました。約10年の時差を伴って方法論が輸入されるという、日本のデザイン受容に繰り返し現れる構図です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省・特許庁「産業競争力とデザインを考える研究会」報告書『「デザイン経営」宣言』(2018)","url":null}]},{"date":"2018-10-01","precision":"month","end_date":null,"type":"point","layer":"企業と実践","title":"マッキンゼー「デザインの経営価値」報告書","summary":"マッキンゼーが、報告書「デザインの経営価値」を公表しました。約300社を5年間追跡し、独自のデザイン指標で上位に入る企業は、売上成長と株主リターンで業界平均を上回った、と結論づけています。\n\nデザイン投資を財務の言葉で正当化する際の、定番の引用元となりました。ブームが測定と投資対効果の言葉で語られる段階に入ったことを示しますが、相関を因果として引用する例の多さには、慎重な見方もあります。","detail":null,"credibility":"disputed","credibility_note":"報告書の分析は相関にとどまり、デザイン投資が業績を高めるという因果関係は実証されていません。指標の妥当性にも議論があります。","sources":[{"title":"McKinsey: The Business Value of Design (2018)","url":"https://www.mckinsey.com/capabilities/mckinsey-design/our-insights/the-business-value-of-design"}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"思想と方法論","title":"「デザイン思考はどこで間違ったのか」","summary":"MITテクノロジーレビュー誌が、「デザイン思考は世界を直すはずだった。どこで間違ったのか」と題する長編記事を掲載しました。d.school関係者を含む当事者への取材から、方法論の限界と形骸化を総括しています。\n\n万能の問題解決法という物語の終わりを象徴する記事とされます。一方で人間中心設計は、国際規格や行政の標準(教育と制度レイヤー)として定着しており、**「流行の終わり」と「定着」は別物**であることも読み取れます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"MIT Technology Review: Design thinking was supposed to fix the world. Where did it go wrong? (2023-02)","url":null}]}]},{"slug":"culture-fashion","title":"ファッションの変遷","description":"コルセットからの解放、ファストファッションの台頭、そしてサステナビリティの要請まで。デザイナーの美意識・産業と流通・社会と身体の3層を重ね、服が映してきた時代の変化を静かに辿る年表です。","category":"culture","language":"ja","start_year":1906,"end_year":2022,"layers":[{"name":"デザイナーと美意識","color":"pink"},{"name":"産業と流通","color":"orange"},{"name":"社会と身体","color":"teal"}],"events":[{"date":"1906-01-01","precision":"year","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"ポワレがコルセットに依らないドレスを発表","summary":"パリのクチュリエ、ポール・ポワレが、胴を締め付けるコルセットを前提としない、ハイウエストのゆるやかなドレスを発表しました。\n\n「私が女性をコルセットから解放した」という本人の言葉には後年の神話化が含まれ、実際の解放は服飾改革運動など複数の要因が重なる緩やかな過程でした。それでも**身体の解放**という20世紀モードの主題がここに現れた点で、本年表の起点にふさわしい出来事です。","detail":null,"credibility":"disputed","credibility_note":"コルセット廃止をポワレ個人の功績とする語りは本人の回想に基づくもので、同時代のデザイナーの寄与や服飾改革運動との先後関係には諸説があります。","sources":[{"title":"The Metropolitan Museum of Art: Poiret: King of Fashion (2007年展覧会)","url":null}]},{"date":"1926-10-01","precision":"month","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"シャネルのリトル・ブラック・ドレスがVogue誌に","summary":"米Vogue誌1926年10月号がシャネルのシンプルな黒いドレスを掲載し、誰もが乗る量産車になぞらえて「シャネルのフォード」と評しました。\n\n喪の色であった黒を日常の装いへと転じ、装飾ではなく簡素さを豊かさとする美意識を示した提案です。第一次大戦後の女性の社会進出と呼応しており、のちに産業と流通レイヤーが前提とする「定番」という考え方の原型となりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Vogue (US) 1926年10月1日号","url":null},{"title":"Wikipedia: Little black dress","url":"https://en.wikipedia.org/wiki/Little_black_dress"}]},{"date":"1947-02-12","precision":"day","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"ディオールが「ニュールック」を発表","summary":"クリスチャン・ディオールが最初のコレクションで、なで肩・絞った腰・長く豊かなスカートのシルエットを発表しました。米誌編集長スノーの命名「ニュールック」とともに、世界へ広まっていきます。\n\n布地を惜しみなく使う優雅さは、戦時の物資統制と実用一辺倒の服からの転換を告げるものでした。パリ・オートクチュールの復権を象徴する一方で贅沢への反発も招き、**服が時代の気分を映す**ことを示す代表例となっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Christian Dior","url":"https://en.wikipedia.org/wiki/Christian_Dior"}]},{"date":"1964-01-01","precision":"year","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"ミニスカートが若者のモードを塗り替える","summary":"ロンドンのマリー・クワントが膝上丈のスカートを大衆化し、パリのクレージュも同時期にミニを発表しました。若者の街のスタイルが高級モードを動かすという、逆流が起きた年です。\n\n「発明者」がクワントかクレージュかは当時から論争があり、クワント自身は、考案したのは街の女の子たちだと語っています。**ストリートがモードを動かす**構図の最初の明確な事例であり、社会と身体レイヤーの若者文化と直結しています。","detail":null,"credibility":"disputed","credibility_note":"ミニスカートの考案者をクワントとする説とクレージュとする説が併存し、流行の起点年にも幅があるため、決着はついていません。","sources":[{"title":"Wikipedia: Miniskirt","url":"https://en.wikipedia.org/wiki/Miniskirt"}]},{"date":"1966-01-01","precision":"year","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"サンローランが「ル・スモーキング」を発表","summary":"イヴ・サンローランが1966年秋冬コレクションで、男性の夜会服タキシードを女性のワードローブへ翻訳した「ル・スモーキング」を発表しました。\n\nパンツ姿の女性が高級レストランで入店を断られることもあった時代に、性差の記号を組み替えるこの提案は挑発でもありました。同時期の既製服ライン展開とも重なり、デザイナーの美意識が社会の性規範(社会と身体レイヤー)へ踏み込んだ例となっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Musée Yves Saint Laurent Paris: Le Smoking","url":null}]},{"date":"1974-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と身体","title":"ウエストウッドらの店「SEX」がパンクの発信地に","summary":"ヴィヴィアン・ウエストウッドとマルコム・マクラーレンが、ロンドン・キングス・ロードの店を「SEX」と改名しました。破れやボンデージの要素を取り込んだ服で、パンクの美学を発信していきます。\n\n店にはセックス・ピストルズの面々が集い、音楽と服が一体となった反抗の文化として広がりました。反体制の記号は、やがて高級モードのコレクションにも引用されていきます。ストリートと高級モードの往復運動の、重要な起点のひとつです。","detail":null,"credibility":"unverified","credibility_note":"店は1971年の開店後に業態と店名の変更を重ねており、「SEX」への改称時期は1974年とする資料が多いものの、記録により記述が異なります。","sources":[{"title":"V&A: Vivienne Westwood","url":null}]},{"date":"1975-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と流通","title":"ザラ1号店がスペインで開業","summary":"アマンシオ・オルテガが、スペイン北西部ア・コルーニャにザラの1号店を開きました。流行を素早く製品化し、店頭を高い頻度で入れ替える手法の出発点です。\n\nのちにインディテックスは世界最大級のアパレル企業となり、企画から店頭まで数週間という速度が業界の標準を塗り替えていきます。デザイナーレイヤーの創造をただちに大衆価格へ翻訳する、**ファストファッション**の原型がここに生まれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Zara (retailer)","url":"https://en.wikipedia.org/wiki/Zara_(retailer)"}]},{"date":"1981-01-01","precision":"year","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"川久保玲と山本耀司がパリコレクションに初参加","summary":"コム・デ・ギャルソンの川久保玲とヨウジヤマモトの山本耀司が、1981年にパリで初のショーを行いました。黒を基調に、非対称や穴あきを含む服を提示しています。\n\n「黒の衝撃」と呼ばれたこの提案は、身体を理想形に整える西欧服飾の伝統への異議として受け止められ、賛否を巻き起こしました。酷評も浴びましたが、以後の脱構築的なデザイナーたちへ道を開き、黒は都市の知的な制服として定着していきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Rei Kawakubo","url":"https://en.wikipedia.org/wiki/Rei_Kawakubo"}]},{"date":"1988-01-01","precision":"year","end_date":"1997-12-31","type":"period","layer":"産業と流通","title":"スーパーモデルの時代","summary":"リンダ・エヴァンジェリスタ、ナオミ・キャンベルら少数のモデルが雑誌表紙と主要ショーを独占し、モデル本人がブランドを超える知名度を持つ時代が続きました。\n\n背景には雑誌とテレビという媒体の最盛期があり、彼女たちの発言力は出演料の高騰にも表れています。90年代後半に女優起用などの流れで退潮したとされますが、**顔が服を売る**仕組みは、SNS時代のインフルエンサーへと引き継がれていきます。","detail":null,"credibility":"disputed","credibility_note":"「スーパーモデルの時代」の起点・終点は論者により異なり、明確な区切りが存在するわけではありません。","sources":[{"title":"Wikipedia: Supermodel","url":"https://en.wikipedia.org/wiki/Supermodel"}]},{"date":"1998-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と流通","title":"ユニクロのフリースブームが服の買い方を変える","summary":"ファーストリテイリングが原宿出店とともにフリースを1,900円で大量販売し、爆発的なブームとなりました。企画・生産・販売を一体で担う、SPAモデルの力を示した出来事です。\n\n安くても品質が足りるという感覚を広め、日本の衣料消費の基準を変えました。ザラやH&Mの世界展開と並び、産業と流通レイヤーがデザイナーレイヤーから主導権を奪っていく潮流の、日本における象徴といえます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ファーストリテイリング: 沿革","url":null}]},{"date":"2000-06-01","precision":"month","end_date":null,"type":"point","layer":"産業と流通","title":"ネッタポルテ創業、高級服のEC販売が始まる","summary":"ナタリー・マスネがロンドンで、高級ファッション専門のECサイト、ネッタポルテを開設しました。雑誌のように編集された誌面から、そのまま服を買える体験を提示しています。\n\n高級ブランドの多くはECを敬遠していましたが、同社の成功で流通の常識が変わり、のちの越境ECやブランド直販への流れが開かれました。買う場所が店から画面へ移ることで、ショー映像の即時公開など、情報の流れ方も変わっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Net-a-Porter","url":"https://en.wikipedia.org/wiki/Net-a-Porter"}]},{"date":"2013-04-24","precision":"day","end_date":null,"type":"point","layer":"社会と身体","title":"ラナ・プラザ崩落、犠牲者1,100人超","summary":"バングラデシュ・ダッカ近郊で、縫製工場が入る商業ビル、ラナ・プラザが崩落し、1,100人を超える労働者が亡くなりました。多くが、欧米ブランド向けの衣料を縫製していました。\n\n前日に建物の亀裂が指摘されながら、操業は続けられていました。**誰がこの服を作ったのか**という問いが世界に広がり、Fashion Revolution運動やサプライチェーン開示の要求へつながる、産業倫理の転換点となっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ILO: The Rana Plaza Accident","url":null}]},{"date":"2017-01-01","precision":"month","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"ルイ・ヴィトンがシュプリームとの協業を発表","summary":"ルイ・ヴィトンが2017年秋冬メンズショーで、ストリートブランドのシュプリームとの協業を発表しました。モノグラムとボックスロゴを組み合わせた製品は、世界的な争奪戦となります。\n\nかつて高級メゾンが模倣を訴えた相手と手を組む逆転劇であり、ストリートウェアの購買力と発信力を高級産業が公式に認めた瞬間でした。転売市場の過熱という流通(産業と流通レイヤー)の新しい現象も、ここで広く可視化されています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Supreme (brand)","url":"https://en.wikipedia.org/wiki/Supreme_(brand)"}]},{"date":"2018-03-01","precision":"month","end_date":null,"type":"point","layer":"デザイナーと美意識","title":"アブローがルイ・ヴィトンのメンズ芸術監督に","summary":"オフホワイト創業者のヴァージル・アブローが、ルイ・ヴィトンのメンズ部門芸術監督に任命されました。同メゾンの主要部門を黒人デザイナーが率いるのは、初めてのことです。\n\n建築を学び、DJとしても活動した経歴は、服飾の徒弟制の外から頂点へ至る新しい道筋を示しました。ストリートと高級モードの融合を制度の側が引き受けた人事であり、2021年の急逝後も、その影響は業界の人材観に残り続けています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Virgil Abloh","url":"https://en.wikipedia.org/wiki/Virgil_Abloh"}]},{"date":"2019-08-01","precision":"month","end_date":null,"type":"point","layer":"社会と身体","title":"G7で「ファッション協定」が発足","summary":"仏ビアリッツでのG7サミットに合わせ、ケリング会長ピノーの主導で、気候・生物多様性・海洋保護を柱とする業界共同の枠組み「ファッション協定」が発足し、多数の大手企業が署名しました。\n\n拘束力のない自主的な枠組みへの批判もありますが、産業の環境負荷が首脳外交の場の議題に載った意味は小さくありません。ラナ・プラザ以降の倫理の問いが、労働から環境へと広がったことを示す出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Fashion Pact","url":"https://www.thefashionpact.org"}]},{"date":"2020-03-01","precision":"month","end_date":"2022-03-31","type":"period","layer":"産業と流通","title":"パンデミックがファッションウィークを変える","summary":"新型コロナの流行で世界のファッションウィークが中止・無観客となり、各都市はショーの映像配信やデジタル開催へ移行しました。店舗休業により、ECへの移行も一気に進みます。\n\n集うことが本質であったショーの形式が問い直され、快適さを重視する需要の変化も起きました。制約下の2年間は、シーズン制や過剰生産という業界の前提を見直す議論を加速させ、対面回帰後もデジタル併用が常態となっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The Business of Fashion / McKinsey: The State of Fashion 2021","url":null}]},{"date":"2022-01-01","precision":"year","end_date":null,"type":"point","layer":"産業と流通","title":"SHEINが米国ファストファッション市場を席巻","summary":"中国発のシーインが、超低価格と毎日数千点規模の新商品投入で急成長しました。報道では、米国のファストファッション売上でH&Mやザラを上回ったと伝えられています。\n\n需要データから極小ロットで生産する手法は、流通の速度を極限まで高めました。一方で労働環境や環境負荷、デザイン盗用への批判(社会と身体レイヤー)も集中しており、速さの果てに何が残るのかという、本年表の現在地を示す事例です。","detail":null,"credibility":"unverified","credibility_note":"非上場のため売上やシェアの数値は調査会社・報道の推計に基づくもので、公式な開示はありません。","sources":[{"title":"SHEINの米国市場シェアに関する各社報道(2022)","url":null}]},{"date":"2022-03-30","precision":"day","end_date":null,"type":"point","layer":"社会と身体","title":"EUが「持続可能な繊維戦略」を発表","summary":"欧州委員会が「持続可能で循環型の繊維のためのEU戦略」を公表しました。2030年までにEU市場の繊維製品を長寿命でリサイクル可能なものとする方針や、売れ残り廃棄への規制の方向性を示しています。\n\nファストファッションの過剰生産を名指しで問題視し、自主協定から法規制へと段階が進みました。美意識・産業・社会の3層が「速さと量」をめぐって正面から向き合う、現在進行形の局面です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Commission: EU Strategy for Sustainable and Circular Textiles (COM(2022) 141)","url":null}]}]},{"slug":"culture-food-globalization","title":"食文化のグローバル化","description":"回転寿司と即席麺の発明から、ミシュランの東京上陸、宅配アプリの席巻まで。料理と店・制度と認定・技術と流通の3層を重ね、食が国境を越える経路を描く年表。","category":"culture","language":"ja","start_year":1958,"end_year":2024,"layers":[{"name":"料理と店","color":"pink"},{"name":"制度と認定","color":"gold"},{"name":"技術と流通","color":"teal"}],"events":[{"date":"1958-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と流通","title":"回転寿司の元祖「廻る元禄寿司」開業","summary":"大阪で立ち食い寿司店を営んでいた白石義明が、ビール工場のベルトコンベアに着想を得た「コンベヤ旋廻食事台」を考案し、東大阪に回転寿司の元祖「廻る元禄寿司」を開いた。\n\n職人の技に依存していた寿司の提供を機械化し、高級食だった寿司を大衆価格に引き下げた発明である。同年にはチキンラーメンも登場しており、日本の食が世界へ運ばれるための「技術の型」を得た年といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 回転寿司","url":"https://ja.wikipedia.org/wiki/回転寿司"}]},{"date":"1958-08-25","precision":"day","end_date":null,"type":"point","layer":"技術と流通","title":"チキンラーメン発売、即席麺の誕生","summary":"日清食品の創業者・安藤百福が、世界初の即席麺「チキンラーメン」を発売した。湯を注いで2分で食べられる手軽さと保存性で、発売直後から爆発的に売れた。\n\n即席麺はその後、各国の味覚に合わせて姿を変えながら普及し、世界で年間1000億食規模(業界団体推計)に達する。日本発のフォーマットが**現地化しながら国境を越える**、この年表の原型がここに生まれた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: チキンラーメン","url":"https://ja.wikipedia.org/wiki/チキンラーメン"}]},{"date":"1964-05-01","precision":"month","end_date":null,"type":"point","layer":"料理と店","title":"鉄板焼「BENIHANA」がニューヨークに開店","summary":"レスラー出身の実業家ロッキー青木が、ニューヨークに鉄板焼レストラン「BENIHANA OF TOKYO」を開店した。シェフが客の目の前で調理してみせるパフォーマンスが評判を呼び、チェーン展開に成功する。\n\n日本食をエンターテインメントとして翻訳した先駆例であり、生魚への抵抗が強かった当時の米国市場に日本食の入口を作った。のちに寿司バーが受け入れられる素地は、こうした店が耕したものである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Benihana","url":"https://en.wikipedia.org/wiki/Benihana"}]},{"date":"1966-01-01","precision":"year","end_date":null,"type":"point","layer":"料理と店","title":"ロサンゼルスに寿司バー「川福」開店","summary":"ロサンゼルスのリトルトーキョーにある日本食店「川福」に本格的な寿司カウンターが設けられ、米国における寿司バーの先駆けになったとされる。当初の客は日本人駐在員が中心だった。\n\n寿司はやがてハリウッドの俳優や健康志向の富裕層に「ヘルシーな日本食」として発見され、現地社会へ浸透していく。カリフォルニアロールの誕生と並び、寿司の米国現地化の起点として語られる出来事である。","detail":null,"credibility":"disputed","credibility_note":"「米国初の寿司バー」とする説が広く流布しているが、開店時期(1966年前後)や「初」であるかどうかには諸説ある。","sources":[{"title":"Wikipedia: History of sushi","url":"https://en.wikipedia.org/wiki/History_of_sushi"}]},{"date":"1970-01-01","precision":"year","end_date":null,"type":"point","layer":"料理と店","title":"カリフォルニアロール考案","summary":"アボカドとカニ風味の具を使い、海苔を内側に巻き込んだ「カリフォルニアロール」がロサンゼルスの寿司店で考案されたとされる。生魚と黒い海苔への抵抗感を避ける、現地の嗜好に合わせた設計だった。\n\n現地の食材で作り替えられた寿司はやがて日本への「逆輸入」も果たした。**「本場の再現」ではなく「翻訳」**こそが食文化の越境の実態であることを示す、最も有名な例である。","detail":null,"credibility":"disputed","credibility_note":"考案者はロサンゼルスの寿司職人・真下一郎とする説が有力だが、考案時期(1960年代末〜70年代)と考案者には複数の説がある。","sources":[{"title":"Wikipedia: California roll","url":"https://en.wikipedia.org/wiki/California_roll"}]},{"date":"1971-07-20","precision":"day","end_date":null,"type":"point","layer":"料理と店","title":"マクドナルド日本1号店が銀座に開店","summary":"藤田田率いる日本マクドナルドが、銀座三越1階に日本1号店を開店した。歩行者天国の銀座で立ったままハンバーガーを食べる光景が話題となり、米国型ファストフードが日本の外食に本格上陸した。\n\n食のグローバル化は日本から世界への一方向ではない。同年にはカップヌードル(技術と流通レイヤー)が発売されており、外来の食が入り、日本の食が出ていく双方向の越境が同時に加速した年として記憶される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 日本マクドナルド","url":"https://ja.wikipedia.org/wiki/日本マクドナルド"}]},{"date":"1971-09-18","precision":"day","end_date":null,"type":"point","layer":"技術と流通","title":"カップヌードル発売","summary":"日清食品が世界初のカップ入り即席麺「カップヌードル」を発売した。容器がそのまま調理器具と食器になる設計は、丼も箸も持たない文化圏への輸出を最初から想定したものだった。\n\n米国では1973年に本格発売され、以後、即席麺は各国で現地の味に姿を変えながら定着していく。食文化のグローバル化が料理そのものだけでなく、**パッケージと流通の発明**によって進むことを示した商品である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: カップヌードル","url":"https://ja.wikipedia.org/wiki/カップヌードル"}]},{"date":"1989-12-10","precision":"day","end_date":null,"type":"point","layer":"制度と認定","title":"スローフード宣言がパリで調印","summary":"ファストフードの世界的拡大に対抗し、イタリア発の運動体が15か国の代表とともにパリで「スローフード宣言」に調印した。郷土料理と食の多様性、ゆっくり味わう暮らしの保護を掲げた。\n\n源流は1986年、ローマのスペイン広場へのマクドナルド出店に対する反対運動にある。食の均質化への最初の組織的な異議申し立てであり、以後この年表の底流には「広がる食」と「守る食」の緊張が流れ続ける。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Slow Food","url":"https://en.wikipedia.org/wiki/Slow_Food"}]},{"date":"1996-08-02","precision":"day","end_date":null,"type":"point","layer":"料理と店","title":"スターバックス北米外1号店が銀座に開店","summary":"スターバックスが北米以外で初となる店舗を東京・銀座に開いた。禁煙のカフェでカスタマイズしたラテを片手に過ごすシアトル流の様式は、喫茶店文化の根づいていた日本で新しい定番になった。\n\nエスプレッソ文化はイタリアから米国へ渡り、商業様式として磨かれて日本へ届いた。マクドナルドの銀座上陸から四半世紀、銀座は外来の食文化が日本社会に試される実験場であり続けている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: スターバックス","url":"https://ja.wikipedia.org/wiki/スターバックス"}]},{"date":"2007-11-01","precision":"month","end_date":null,"type":"point","layer":"制度と認定","title":"ミシュランガイド東京版が刊行","summary":"ミシュランガイドが欧米以外で初めてとなる東京版を刊行した。東京は掲載店の星の総数で世界最多となり、「世界一の美食都市」という評価が国際的に流通し始めた。\n\nフランスの権威が日本の食を格付けする構図は、料理だけでなく**評価制度そのものの越境**を意味した。ガイドは以後アジア各都市へ拡大し、6年後の和食のユネスコ登録に至る「日本食の制度的公認」の流れを開いた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ミシュランガイド","url":"https://ja.wikipedia.org/wiki/ミシュランガイド"}]},{"date":"2008-03-01","precision":"month","end_date":null,"type":"point","layer":"料理と店","title":"一風堂がニューヨークに出店","summary":"博多ラーメンの一風堂がニューヨークに海外1号店を開いた。行列のできる人気と有力メディアの高評価を得て、ラーメンは「安い麺料理」から「専門店で並んで食べる一杯」へと地位を変えた。\n\n即席麺(技術と流通レイヤー)が先に世界へ届けていたラーメンの認知の上に、専門店の食体験が乗った構図である。以後ロンドンやパリにも専門店が広がり、RAMENは寿司に続く日本食の世界語となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ippudo","url":"https://en.wikipedia.org/wiki/Ippudo"}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"技術と流通","title":"Instagram登場、「映える」食が拡散力を持つ","summary":"写真共有アプリのInstagramが公開された。料理を撮って投稿する行為が世界共通の習慣となり、食のトレンドが国境を越えて数週間で伝播する時代が始まった。\n\nタピオカドリンクやスフレパンケーキの世界的流行は、このインフラ抜きには説明できない。店の評判を左右する力はガイドブックからフィードへ移り、後年の評価制度(制度と認定レイヤー)のあり方にも影響を与えていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2010-11-16","precision":"day","end_date":null,"type":"point","layer":"制度と認定","title":"フランスの美食術がユネスコ無形文化遺産に","summary":"「フランス人の美食術」がユネスコ無形文化遺産に登録された。食文化の登録は初めてで、同じ委員会で地中海料理とメキシコの伝統料理も認められた。\n\n食が「守るべき人類の文化」として国際制度に組み込まれた転換点である。以後、各国が自国の食文化を国家ブランドとして申請する競争が始まり、3年後の和食の登録へ直結していく。スローフード運動が訴えた「守る食」の思想が、制度の言葉に翻訳された瞬間でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNESCO ICH: Gastronomic meal of the French","url":"https://ich.unesco.org/en/RL/gastronomic-meal-of-the-french-00437"}]},{"date":"2013-12-04","precision":"day","end_date":null,"type":"point","layer":"制度と認定","title":"「和食」がユネスコ無形文化遺産に登録","summary":"「和食;日本人の伝統的な食文化」がユネスコ無形文化遺産に登録された。個別の料理ではなく、自然の尊重を核とし正月行事などと結びついた社会的慣習として認められた点が特徴である。\n\n日本政府は和食を輸出促進とインバウンド観光の柱に据え、海外の日本食レストラン急増を制度面から後押しした。制度による公認が市場の拡大を牽引する、この年表の典型的な構図である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"農林水産省: 「和食」のユネスコ無形文化遺産登録","url":"https://www.maff.go.jp/j/keikaku/syokubunka/ich/"}]},{"date":"2014-08-01","precision":"month","end_date":null,"type":"point","layer":"技術と流通","title":"UberFRESH開始、料理宅配のアプリ化","summary":"Uberがロサンゼルス近郊のサンタモニカで料理宅配サービス「UberFRESH」を始めた(翌年UberEATSに改称)。配車アプリの車両網を食の物流に転用する発想だった。\n\nDoorDashやDeliveroo、出前館など各国で同型のサービスが急成長し、レストランの商圏は店の立地から配達網の範囲へと広がった。この構造は数年後のコロナ禍で一気に社会の主流になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Uber Eats","url":"https://en.wikipedia.org/wiki/Uber_Eats"}]},{"date":"2019-05-02","precision":"day","end_date":null,"type":"point","layer":"技術と流通","title":"ビヨンド・ミート上場、代替肉が資本市場へ","summary":"植物由来の代替肉を開発する米ビヨンド・ミートがナスダックに上場し、初日に株価が2倍を超えた。食品スタートアップのIPOとして異例の注目を集めた。\n\n気候変動と食の持続可能性が投資テーマとなったことを象徴する出来事で、世界のファストフードチェーンが相次いで植物由来メニューを試験導入した。食のグローバル化に「地球環境」という制約条件が加わった転換点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Beyond Meat","url":"https://en.wikipedia.org/wiki/Beyond_Meat"}]},{"date":"2020-03-01","precision":"month","end_date":"2022-12-31","type":"period","layer":"技術と流通","title":"コロナ禍で宅配とゴーストキッチンが急拡大","summary":"新型コロナウイルスの流行で世界の都市の外食が制限され、料理宅配とテイクアウトが生活インフラになった。客席を持たず宅配アプリ上にだけ存在する「ゴーストキッチン」も急増した。\n\n**「店」と「料理」の分離**という構造変化が一気に可視化された期間である。一方で老舗の廃業も世界規模で進み、宅配プラットフォームの手数料をめぐる摩擦など、新しい流通の支配力も問われ始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ghost kitchen","url":"https://en.wikipedia.org/wiki/Ghost_kitchen"}]},{"date":"2023-10-01","precision":"month","end_date":null,"type":"point","layer":"制度と認定","title":"海外の日本食レストラン、約18.7万店に","summary":"農林水産省の調査で、海外の日本食レストランは約18万7000店と推計された。調査が始まった2006年の約2万4000店から、17年でおよそ8倍に増えた計算になる。\n\n増加の主役は日本人経営ではない現地資本の店で、寿司もラーメンももはや「日本人が作る料理」ではない。**担い手ごと現地化する**段階に入ったことを、この数字は示している。","detail":null,"credibility":"unverified","credibility_note":"店舗数は在外公館等を通じた推計値で、日本食レストランの定義や集計方法により数値には幅がある。","sources":[{"title":"農林水産省: 海外における日本食レストラン数の調査結果(2023年)","url":null}]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"制度と認定","title":"訪日客の最大の目的は「日本食を食べること」","summary":"観光庁の訪日外国人消費動向調査では、「訪日前に最も期待していたこと」として「日本食を食べること」を挙げる回答が例年最多を占める。食は日本観光の中心的な動機になっている。\n\n1958年に技術の力で国境を越え始めた日本の食は、制度の公認と店の越境を経て、いまや**人を日本へ呼び寄せる引力**へと変わった。食文化のグローバル化が一巡したことを示す到達点である。","detail":null,"credibility":"unverified","credibility_note":"「最多」は複数年の同調査で続くとされる傾向だが、調査年・設問形式により数値は変動する。","sources":[{"title":"観光庁: 訪日外国人消費動向調査","url":null}]}]},{"slug":"culture-game-industry","title":"🎮 ゲーム産業の爆発","description":"アーケードの始まりからファミコン、スマホ、巨大買収まで。コントローラーを握って育った目線で、ハード・ソフト・ビジネスと社会の3層を重ねながら、遊びが世界最大級のエンタテインメント産業に育っていく流れを追う年表です 🎮","category":"culture","language":"ja","start_year":1972,"end_year":2023,"layers":[{"name":"ハードとプラットフォーム","color":"blue"},{"name":"ソフトと表現","color":"purple"},{"name":"ビジネスと社会","color":"orange"}],"events":[{"date":"1972-11-01","precision":"month","end_date":null,"type":"point","layer":"ソフトと表現","title":"AtariがPongを発売、アーケードの起点に","summary":"Atariがアーケードゲーム「Pong」を発売。卓球を模したシンプルなルールですが、酒場に置かれた試作機がコインの詰まりで故障したという逸話つきで、ビデオゲームが商売になることを証明しました。\n\n家庭用ゲーム機の始祖オデッセイと同じ年というのもポイントです。ここから10年で北米にアーケードと家庭用の市場が一気に立ち上がり、1983年の市場崩壊(ビジネスと社会レイヤー)へ続く流れの出発点になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pong","url":"https://en.wikipedia.org/wiki/Pong"}]},{"date":"1978-06-01","precision":"month","end_date":null,"type":"point","layer":"ソフトと表現","title":"👾 スペースインベーダー稼働、日本中がブームに","summary":"タイトーのスペースインベーダーが稼働開始。専用の「インベーダーハウス」が各地に生まれて、喫茶店にまでテーブル筐体が並ぶ社会現象になりました。\n\n「100円玉が足りなくなった」という逸話は有名ですが、裏付けは乏しいそうです。ブームは翌年にかけて過熱と反動を経験して、ゲーセンと青少年をめぐる摩擦(ビジネスと社会レイヤー)の原型に。日本のゲーム産業の人材とお金の多くは、この熱狂から出発しています。","detail":null,"credibility":"disputed","credibility_note":"「100円玉が不足して造幣局が増産した」という逸話は広く知られていますが、公的記録による裏付けはなく、俗説とする指摘が有力です。","sources":[{"title":"Wikipedia: Space Invaders","url":"https://en.wikipedia.org/wiki/Space_Invaders"}]},{"date":"1983-01-01","precision":"year","end_date":"1985-12-31","type":"period","layer":"ビジネスと社会","title":"アタリショック、北米家庭用市場の崩壊","summary":"北米の家庭用ゲーム市場が、供給過剰と粗悪ソフトの氾濫に消費者が愛想を尽かして崩壊。市場規模は数年で数十分の一に縮んだとされます。Atariが売れ残りカートリッジを砂漠に埋めた逸話はその象徴ですね。\n\n小売がゲームから手を引くなか、1985年にNintendo Entertainment Systemが玩具の体裁で北米に再参入して市場を立て直します。**ソフトの品質をちゃんと管理する**日本型モデル(ハードとプラットフォームレイヤー)の正しさが裏書きされた期間です。","detail":null,"credibility":"disputed","credibility_note":"市場縮小の規模(約32億ドルから約1億ドルへ、などとされる)は集計方法によって幅がありますし、崩壊の主因についても複数の説があります。","sources":[{"title":"Wikipedia: Video game crash of 1983","url":"https://en.wikipedia.org/wiki/Video_game_crash_of_1983"}]},{"date":"1983-07-15","precision":"day","end_date":null,"type":"point","layer":"ハードとプラットフォーム","title":"任天堂がファミリーコンピュータ発売","summary":"任天堂が家庭用ゲーム機ファミリーコンピュータを発売。14,800円という思い切った価格と専用チップの性能で、日本の家庭用ゲーム機の事実上の標準になりました。\n\n同じ年、北米はアタリショック(ビジネスと社会レイヤー)で崩壊中。任天堂はソフトの品質審査とライセンス制でこれを教訓化しました。**プラットフォームがソフトを審査する**という産業構造はここから始まって、以後の家庭用ゲームビジネスの基本形になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Nintendo Entertainment System","url":"https://en.wikipedia.org/wiki/Nintendo_Entertainment_System"}]},{"date":"1985-09-13","precision":"day","end_date":null,"type":"point","layer":"ソフトと表現","title":"🍄 スーパーマリオブラザーズ発売","summary":"任天堂がスーパーマリオブラザーズを発売。横スクロールで広がる世界とあの精密な操作感が家庭用アクションゲームの文法を確立して、世界で数千万本規模を売り上げました!\n\n北米ではNESの看板ソフトとして市場再建(ビジネスと社会レイヤー)を引っ張ります。キャラクターが映画や玩具へ広がる「ゲームIP」の原型で、ソフトがハードを売るという業界の力学を決定づけた1本です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Super Mario Bros.","url":"https://en.wikipedia.org/wiki/Super_Mario_Bros."}]},{"date":"1989-04-21","precision":"day","end_date":null,"type":"point","layer":"ハードとプラットフォーム","title":"ゲームボーイ発売、携帯ゲームの時代へ","summary":"任天堂が携帯型ゲーム機ゲームボーイを発売。モノクロ液晶に単3電池4本という割り切った設計は、画面のきれいさより電池のもち・値段・頑丈さを取ったものでした。\n\n同梱・併売されたテトリスが子ども以外の層まで巻き込んで、通信ケーブルは後のポケットモンスター(ソフトと表現レイヤー)の交換文化の土台に。**ゲームを持ち歩く**という習慣はここから始まって、後の携帯電話ゲーム時代への遠い伏線になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Game Boy","url":"https://en.wikipedia.org/wiki/Game_Boy"}]},{"date":"1991-03-01","precision":"month","end_date":null,"type":"point","layer":"ソフトと表現","title":"🕹️ ストリートファイターIIが対戦文化を生む","summary":"カプコンの対戦格闘ゲーム、ストリートファイターIIがアーケードで稼働開始。筐体をはさんで知らない人と戦う対戦文化が生まれて、ゲームセンターに再び人が戻ってきました!\n\nキャラの個性とコマンド入力の奥深さは家庭用移植でも爆発的に売れて、スーパーファミコンの普及(ハードとプラットフォームレイヤー)を押し上げます。対戦の腕を競い合うコミュニティは、後のeスポーツの源流のひとつとされています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Street Fighter II","url":"https://en.wikipedia.org/wiki/Street_Fighter_II"}]},{"date":"1994-12-03","precision":"day","end_date":null,"type":"point","layer":"ハードとプラットフォーム","title":"PlayStation発売、3DとCD-ROMの時代","summary":"ソニー・コンピュータエンタテインメントがPlayStationを発売。CD-ROMと3Dグラフィックスを核に、音楽流通で培った手法を応用したソフト流通の改革まで持ち込みました。\n\nセガサターンとの競争を経て世界1億台に到達して、ゲームの買い手を大人まで広げます。ファイナルファンタジーVIIの陣営移籍に象徴されるソフト獲得競争は、**ハードの勝ち負けはソフトが決める**ことを改めて見せつけました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: PlayStation (console)","url":"https://en.wikipedia.org/wiki/PlayStation_(console)"}]},{"date":"1996-02-27","precision":"day","end_date":null,"type":"point","layer":"ソフトと表現","title":"ポケットモンスター赤・緑発売","summary":"ゲームボーイ用ソフト、ポケットモンスター赤・緑が発売。発売当初から口コミでじわじわ売れて、通信ケーブルでの交換と対戦を核に社会現象になりました。\n\nアニメ・カードゲーム・映画へ広がって、ポケモンは世界最大級のメディアフランチャイズに成長します。発売から6年経った旧世代ハード(ハードとプラットフォームレイヤー)から出た世界的ヒットで、遊びの仕組みの発明はハード性能に勝る、を体現した作品です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Pokémon Red and Blue","url":"https://en.wikipedia.org/wiki/Pokémon_Red_and_Blue"}]},{"date":"2006-12-02","precision":"day","end_date":null,"type":"point","layer":"ハードとプラットフォーム","title":"Wii発売、「ゲーム人口の拡大」路線","summary":"任天堂がWiiを日本で発売。体の動きで直感的に操作するリモコンを採用して、高性能化の競争から距離を置き、家族やお年寄りまで遊び手を広げる戦略を取りました。\n\n高性能路線のPlayStation 3が苦戦する一方でWiiは世界1億台超え。「ゲーム人口の拡大」路線の成功例になりました。ゲームに触れる人の裾野を広げたことは、直後に始まるスマートフォンゲーム(ビジネスと社会レイヤー)の爆発的な市場拡大の下地にもなっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Wii","url":"https://en.wikipedia.org/wiki/Wii"}]},{"date":"2008-07-10","precision":"day","end_date":null,"type":"point","layer":"ハードとプラットフォーム","title":"📱 App Store開設、ゲーム流通の転換点","summary":"AppleがiPhone向けにApp Storeを開設。個人開発者でも世界にゲームを直接売れる流通網ができて、ソフトの値段は数百円から無料へ一気に下がりました。\n\nパッケージ流通と専用ハードが前提だった産業構造は根本から揺らいで、**誰もがポケットにゲーム機を入れて歩く**時代が始まります。基本無料とアイテム課金という収益モデル(ビジネスと社会レイヤー)の主戦場も、ここから携帯電話の画面の中へ移っていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: App Store (Apple)","url":"https://en.wikipedia.org/wiki/App_Store_(Apple)"}]},{"date":"2012-02-20","precision":"day","end_date":null,"type":"point","layer":"ソフトと表現","title":"パズル&ドラゴンズ配信開始","summary":"ガンホーがスマートフォン向けにパズル&ドラゴンズの配信を開始。パズルとRPGを組み合わせた基本無料ゲームで、国内のモバイルゲームとして記録的な収益を上げました。\n\nガチャという収益モデルの威力を見せつけて、家庭用中心だった日本のゲーム産業の重心をモバイルへ動かします。一方で射幸性への社会的な心配も強まっていて、コンプガチャ規制(ビジネスと社会レイヤー)と同じ年というところに、この時期の産業の光と影が出ています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ガンホー・オンライン・エンターテイメント: パズル&ドラゴンズ","url":null}]},{"date":"2012-05-01","precision":"month","end_date":null,"type":"point","layer":"ビジネスと社会","title":"消費者庁がコンプガチャ規制の見解","summary":"消費者庁が「コンプリートガチャ」は景品表示法の禁止類型(カード合わせ)にあたるという考え方を公表して、ソーシャルゲーム各社は同方式の廃止を次々に発表しました。\n\n急成長したソーシャルゲームの射幸性に、行政が初めてはっきり線を引いた出来事です。業界は自主規制団体の整備へ動きました。遊びと賭博の境界という問いは、その後もガチャの確率表示やルートボックス規制として、世界各国で繰り返し問われていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"消費者庁: カード合わせに関する景品表示法(景品規制)上の考え方の公表について(2012年5月)","url":null}]},{"date":"2016-07-06","precision":"day","end_date":null,"type":"point","layer":"ビジネスと社会","title":"Pokémon GO配信、街に遊び手があふれる","summary":"Nianticと株式会社ポケモンによるPokémon GOの配信がスタート。位置情報とARで、現実の街を歩いてポケモンを捕まえる遊びが世界中で社会現象になりました。\n\n公園や観光地に人が集まる光景がニュースになって、配信数か月で数億ダウンロードに達したとされます。20年前にゲームボーイで生まれたIP(ソフトと表現レイヤー)が、**スマホで現実の街を遊び場に変えた**出来事です!","detail":null,"credibility":"disputed","credibility_note":"ダウンロード数や利用者数は調査会社の推計や自社発表がベースで、集計方法によって数字には幅があります。","sources":[{"title":"Wikipedia: Pokémon Go","url":"https://en.wikipedia.org/wiki/Pokémon_Go"}]},{"date":"2017-03-03","precision":"day","end_date":null,"type":"point","layer":"ハードとプラットフォーム","title":"Nintendo Switch発売","summary":"任天堂がNintendo Switchを発売。据置機と携帯機の垣根をなくすハイブリッド設計で、前世代Wii Uの不振から一転、世界1億台を超える成功になりました!\n\nゼルダの伝説 ブレス オブ ザ ワイルド(ソフトと表現レイヤー)を筆頭に自社ソフトの求心力を見せつけて、スマートフォン全盛の時代でも専用ゲーム機の市場は成立すると証明します。持ち歩ける据置機という設計は、ゲームボーイから続く系譜の到達点でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Nintendo Switch","url":"https://en.wikipedia.org/wiki/Nintendo_Switch"}]},{"date":"2017-09-26","precision":"day","end_date":null,"type":"point","layer":"ソフトと表現","title":"フォートナイトがバトルロイヤルを配信","summary":"Epic Gamesがフォートナイトにバトルロイヤルモードを基本無料で追加配信。100人での対戦とポップな見た目、そして建築の要素で、世界の若い世代に爆発的に広がりました。\n\n収益はスキンなど見た目アイテムの課金が中心で、登録利用者は数億人と発表されています。ゲーム内でアーティストのライブイベントが開かれるなど、ゲームがSNSに近い常設の「場」になったことを示して、後のメタバース論の参照点になりました。","detail":null,"credibility":"unverified","credibility_note":"利用者数や収益の数字は自社発表や調査会社の推計がベースで、第三者による検証はありません。","sources":[{"title":"Wikipedia: Fortnite Battle Royale","url":"https://en.wikipedia.org/wiki/Fortnite_Battle_Royale"}]},{"date":"2019-05-25","precision":"day","end_date":null,"type":"point","layer":"ビジネスと社会","title":"WHOが「ゲーム障害」を国際疾病分類に","summary":"世界保健機関(WHO)の総会が国際疾病分類の改訂版ICD-11を採択して、ゲームへの依存を「ゲーム障害(gaming disorder)」として疾病に位置づけました。\n\nゲームへの過度の依存を公衆衛生の問題として扱う初の国際的な枠組みで、日本では香川県のゲーム条例(2020年)などの規制論にも影響しました。娯楽の中心になったゲーム(ソフトと表現レイヤー)を社会がどう扱うか。インベーダーブーム以来の問いの現代版です。業界団体は疾病化に反対を表明しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"WHO: ICD-11における gaming disorder の位置づけ(Q&A)","url":null}]},{"date":"2020-03-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"ビジネスと社会","title":"コロナ禍の巣ごもり特需","summary":"新型コロナウイルスの流行下で在宅時間が増えて、世界のゲーム市場は各社の想定を超えて拡大しました。ハードの品薄や開発の遅れも同時に起きています。\n\nこの特需は、あつまれ どうぶつの森(ソフトと表現レイヤー)の世界的ヒットや、SwitchとPlayStation 5の品薄(ハードとプラットフォームレイヤー)として現れました。反動は2022年以降の市場減速と大手各社の人員削減につながって、拡大期の投資の見直しを産業全体に迫ります。","detail":null,"credibility":"unverified","credibility_note":"特需の期間の区切りは便宜的なもので、市場統計の集計範囲によって拡大幅の評価は変わります。","sources":[{"title":"ファミ通ゲーム白書2021","url":null}]},{"date":"2020-03-20","precision":"day","end_date":null,"type":"point","layer":"ソフトと表現","title":"🏝️ あつまれ どうぶつの森が世界的ヒット","summary":"任天堂があつまれ どうぶつの森を発売。新型コロナウイルスによる外出制限と時期が重なって、島でのおだやかな生活が世界中で「もう一つの日常」として受け入れられました。\n\n美術館の所蔵品公開やブランドの衣装配布、友達との集まりまでゲーム内で行われて、ゲームが社会インフラのように使われる光景が広がります。巣ごもり需要(ビジネスと社会レイヤー)の象徴として、Switchの品薄とともに産業全体の追い風になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Animal Crossing: New Horizons","url":"https://en.wikipedia.org/wiki/Animal_Crossing:_New_Horizons"}]},{"date":"2023-10-13","precision":"day","end_date":null,"type":"point","layer":"ビジネスと社会","title":"MicrosoftがActivision Blizzard買収完了","summary":"MicrosoftがActivision Blizzardの買収を完了しました。687億ドルはゲーム産業史上最大の買収額で、発表から完了まで各国競争当局の審査は約20か月に及びました。\n\nクラウドゲームの競争への影響が審査の主要な論点で、英国当局は当初、買収を差し止めています。**ゲームが各国の競争政策の主戦場になる**規模まで産業が育ったことを示す出来事で、Pongから約半世紀、この年表の到達点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Acquisition of Activision Blizzard by Microsoft","url":"https://en.wikipedia.org/wiki/Acquisition_of_Activision_Blizzard_by_Microsoft"}]}]},{"slug":"culture-hiphop-50","title":"🎙️ ヒップホップの50年","description":"1973年ブロンクスの一夜のパーティーから50周年まで。音楽と表現・産業とメディア・社会とストリートの3層を重ねて、地域の路上文化が世界最大級の音楽ジャンルに育っていく50年をたどります 🎤","category":"culture","language":"ja","start_year":1973,"end_year":2023,"layers":[{"name":"音楽と表現","color":"purple"},{"name":"産業とメディア","color":"orange"},{"name":"社会とストリート","color":"teal"}],"events":[{"date":"1973-08-11","precision":"day","end_date":null,"type":"point","layer":"社会とストリート","title":"🎛️ クール・ハークのパーティー、ヒップホップ誕生の日","summary":"ニューヨーク・ブロンクスのセジウィック通り1520番地。DJクール・ハークが妹の企画するパーティーでプレイし、曲の間奏部分だけを2枚のレコードでつなぐ手法が、ここで披露されたとされています。\n\nこの夜を「ヒップホップ誕生」とする語りは後から定着した記念日で、実際の文化はたくさんの担い手の中で少しずつ形になりました。それでも**ブレイクビーツ**の発明に象徴的な起点を与える日付として、50周年もこの日に祝われています。","detail":null,"credibility":"disputed","credibility_note":"この日を「誕生日」とする位置づけは記念日的な後付けで、手法や文化の成立はもっとゆるやかだったとする研究が多いです。","sources":[{"title":"Wikipedia: 1520 Sedgwick Avenue","url":"https://en.wikipedia.org/wiki/1520_Sedgwick_Avenue"}]},{"date":"1979-09-01","precision":"month","end_date":null,"type":"point","layer":"産業とメディア","title":"📀 「ラッパーズ・ディライト」がラップを商品に変える","summary":"シュガーヒル・ギャングの「ラッパーズ・ディライト」が発売され、ラップのレコードとして初めて全米チャート上位に入るヒットになりました。\n\nパーティーの場の即興だったラップが、録音商品として成立することを証明した曲です。**現場の文化が産業になった**分岐点とされますが、「最初のラップレコード」かどうかは先行作の存在をめぐって議論があり、ブロンクスの当事者たちの間でも評価は割れました。","detail":null,"credibility":"disputed","credibility_note":"「最初のラップレコード」という位置づけには、同年の先行作（ファットバック・バンドのKing Tim III等）を挙げる異論があります。","sources":[{"title":"Wikipedia: Rapper's Delight","url":"https://en.wikipedia.org/wiki/Rapper%27s_Delight"}]},{"date":"1982-07-01","precision":"month","end_date":null,"type":"point","layer":"音楽と表現","title":"🏙️ 「ザ・メッセージ」が路上の現実をラップに刻む","summary":"グランドマスター・フラッシュ&ザ・フューリアス・ファイヴの「ザ・メッセージ」が発売。荒廃した都市生活を淡々と描く歌詞で、パーティー音楽だったラップの主題を一変させました。\n\nブロンクスの荒廃と貧困が、初めて正面から曲の中心に据えられた作品とされます。以後「現実を語る」ことはヒップホップの中核的な価値になり、ギャングスタラップにも政治的なラップにも受け継がれていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Message (Grandmaster Flash and the Furious Five song)","url":null}]},{"date":"1983-01-01","precision":"year","end_date":null,"type":"point","layer":"社会とストリート","title":"🎬 映画「ワイルド・スタイル」が文化を世界へ運ぶ","summary":"ヒップホップ黎明期の実像を描いた映画「ワイルド・スタイル」が公開。ラップ、DJ、ブレイクダンス、グラフィティという文化の要素をまとめて世界に見せた、最初期の作品です。\n\n出演者たちは来日プロモーションも行い、テレビ出演や街頭でのパフォーマンスが反響を呼びました。日本語ラップの先駆者たちが影響を公言する、文化の伝わり道になった一本です。ただ、来日時の詳細は当事者の回想に頼る部分が大きめです。","detail":null,"credibility":"unverified","credibility_note":"来日プロモーションの時期や内容は関係者の回想・インタビューに基づくところが大きく、一次資料での確認が難しいです。","sources":[{"title":"Wikipedia: Wild Style","url":"https://en.wikipedia.org/wiki/Wild_Style"}]},{"date":"1984-01-01","precision":"year","end_date":null,"type":"point","layer":"産業とメディア","title":"🏷️ デフ・ジャム・レコーディングス設立","summary":"リック・ルービンとラッセル・シモンズがニューヨークでデフ・ジャムを設立。大学寮の一室から始まって、LL・クール・Jやビースティ・ボーイズを送り出す看板レーベルに育ちます。\n\nメジャーの流通網と組みながら路上の感覚を守る経営で、ヒップホップを一過性の流行ではなく続く産業にしました。文化の担い手自身がビジネスの主導権を握る型がここで確立し、後の起業家型アーティストの系譜につながります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Def Jam Recordings","url":"https://en.wikipedia.org/wiki/Def_Jam_Recordings"}]},{"date":"1986-07-01","precision":"month","end_date":null,"type":"point","layer":"音楽と表現","title":"🎸 Run-D.M.C.とエアロスミスの「Walk This Way」","summary":"Run-D.M.C.がエアロスミスと共演した「Walk This Way」を発表し、全米チャートの上位に。ロックの名曲をラップで作り直すという、当時としては異例の顔合わせでした。\n\nMTVがラップのビデオを本格的に流すきっかけになり、白人ロック聴衆とラップの間の壁を壊した曲と評されます。ジャンルの越境がヒットの方程式になり得ることを示して、産業とメディアの扉を内側から開けた一曲です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Walk This Way","url":"https://en.wikipedia.org/wiki/Walk_This_Way"}]},{"date":"1988-08-01","precision":"month","end_date":null,"type":"point","layer":"産業とメディア","title":"📺 MTVでラップ専門番組「Yo MTV Raps」開始","summary":"MTVでラップ専門番組「Yo MTV Raps」がスタートし、高い視聴率を記録。ヒップホップのビデオが全米、さらに国際放送網で日常的に流れる、最初の大きな窓口です。\n\n都市ごとに分かれていたシーンの音とファッションが全国で同時に共有され、地方や海外の若者がヒップホップに出会う入口になりました。メディアの回路が、文化の広がる速度を一変させた例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Yo MTV Raps(ラップ専門番組)","url":null}]},{"date":"1988-08-08","precision":"day","end_date":null,"type":"point","layer":"音楽と表現","title":"🚨 N.W.A『ストレイト・アウタ・コンプトン』発売","summary":"N.W.Aがアルバム『ストレイト・アウタ・コンプトン』を発売。ロサンゼルス・コンプトンの警察との緊張や街の暴力を生々しく描いて、ギャングスタラップを全国区に押し上げました。\n\n収録曲への抗議としてFBI職員がレーベルに書簡を送る事態にまで発展し、**表現の自由をめぐる係争地**としてのヒップホップの立ち位置が定まります。ラジオにほとんど頼らず売れた点も、産業とメディアの常識を崩しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Straight Outta Compton","url":"https://en.wikipedia.org/wiki/Straight_Outta_Compton"}]},{"date":"1990-06-01","precision":"month","end_date":null,"type":"point","layer":"社会とストリート","title":"⚖️ 2ライヴ・クルーのアルバムに猥褻判定","summary":"フロリダ州の連邦地裁が2ライヴ・クルーのアルバム『As Nasty As They Wanna Be』を猥褻と判定し、販売した店主やメンバーの逮捕が相次ぎました。音楽アルバムへの猥褻判定は極めて異例です。\n\n判定は1992年の控訴審で覆り、表現の自由の側の勝利で決着します。ラップが法廷や議会で繰り返し標的になる90年代の摩擦の始まりで、論争自体が知名度と売上を押し上げるという皮肉な構図も生まれました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: As Nasty as They Wanna Be","url":"https://en.wikipedia.org/wiki/As_Nasty_as_They_Wanna_Be"}]},{"date":"1991-05-01","precision":"month","end_date":null,"type":"point","layer":"産業とメディア","title":"📊 サウンドスキャン導入、ラップの実売が可視化","summary":"ビルボードがPOSデータに基づく集計方式サウンドスキャンを導入し、店員への聞き取りに頼っていたチャートが実売ベースに変わりました。すると導入直後から、ラップとカントリーの順位が急上昇します。\n\n業界の思い込みで過小評価されていた**ラップの本当の勢い**が数字で証明され、メジャー各社の投資が本格化しました。測り方が変わるだけで、文化の勢力図の見え方まで変わることを示した転換点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Nielsen SoundScan","url":"https://en.wikipedia.org/wiki/Nielsen_SoundScan"}]},{"date":"1994-01-01","precision":"year","end_date":"1997-03-09","type":"period","layer":"社会とストリート","title":"🕊️ 東西抗争の時代","summary":"ニューヨークのバッド・ボーイ勢とロサンゼルスのデス・ロウ勢の対立が、雑誌報道や楽曲での応酬を通じて過熱しました。1996年に2パック、1997年にノトーリアス・B.I.G.が相次いで射殺され、抗争の時代は最悪の形で幕を閉じます。\n\n両事件とも全容解明には至っていません。メディアが対立の構図を煽って売上に変えた側面が指摘され、以後のシーンには対立の商業的な演出への自省が残りました。地域性という文化の核が、暴力と結び付いてしまった時代です。","detail":null,"credibility":"disputed","credibility_note":"「東西抗争」の起点や範囲の区分は論者によって異なり、二つの射殺事件と抗争との因果関係も確定していません。","sources":[{"title":"Wikipedia: East Coast–West Coast hip hop rivalry","url":null}]},{"date":"1996-07-07","precision":"day","end_date":null,"type":"point","layer":"社会とストリート","title":"🗼 「さんピンCAMP」開催、日本語ラップの金字塔","summary":"東京・日比谷野外音楽堂で日本語ラップのイベント「さんピンCAMP」が開催され、ランプアイ、キングギドラら当時のシーンの中心的なアーティストが一堂に会しました。\n\n記録映像が繰り返し参照されることで、日本語でラップするという表現が独自の到達点を示した日として語り継がれています。ワイルド・スタイル来日から10年余り、**輸入文化のローカル化**が一つの頂点に達した瞬間です!","detail":null,"credibility":"unverified","credibility_note":"動員数や当日の詳細は主催関係者の証言と映像作品に頼っていて、公的な記録での確認は難しいです。","sources":[{"title":"Wikipedia: さんピンCAMP","url":null}]},{"date":"1999-02-01","precision":"month","end_date":null,"type":"point","layer":"音楽と表現","title":"🏆 ローリン・ヒルがグラミー5部門受賞","summary":"ローリン・ヒルが『ミスエデュケーション』でグラミー賞の最優秀アルバムを含む5部門を受賞。ヒップホップ系のアルバムが主要部門の頂点に立つのは、これが初めてでした。\n\nソウルやレゲエを溶かし込んだ音楽性と内省的な詞が、ラップを賞の外側に置いてきた音楽業界の評価軸を動かします。女性アーティストの達成としても画期的で、主流化の決定的な一歩になりました!","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Miseducation of Lauryn Hill","url":"https://en.wikipedia.org/wiki/The_Miseducation_of_Lauryn_Hill"}]},{"date":"2005-09-02","precision":"day","end_date":null,"type":"point","layer":"社会とストリート","title":"📢 カニエ・ウェストが生放送で災害対応を批判","summary":"ハリケーン・カトリーナの被災者支援の生放送番組で、カニエ・ウェストが台本を離れ、報道の偏りと政府の対応を批判して「ジョージ・ブッシュは黒人を気にかけていない」と発言しました。\n\n発言は激しい論争を呼びましたが、ヒップホップのアーティストが黒人コミュニティの代弁者として国政に直言する構図を、全国に見えるようにした出来事です。路上で生まれた音楽が、世論の回路として機能することを示しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: A Concert for Hurricane Relief","url":null}]},{"date":"2017-01-01","precision":"year","end_date":null,"type":"point","layer":"産業とメディア","title":"👑 ヒップホップが米国で最も聴かれるジャンルに","summary":"ニールセンの2017年の統計で、R&B/ヒップホップがロックを抜いて米国で最も消費される音楽ジ
