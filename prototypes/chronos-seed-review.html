021-09-27","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"TikTokが月間利用者10億人と発表","summary":"TikTokが月間アクティブユーザーが10億人に達したと発表した。国際版の提供開始から約4年での到達で、FacebookやYouTubeより速いペースとされる。\n\n推薦アルゴリズム主導の設計が世界標準になったことを示す数字であり、Metaは対抗機能Reelsへ全面的に舵を切った。同時に、若年層への影響や中国政府との関係への懸念(規制と説明責任レイヤー)も利用者数とともに膨らんでいった。","detail":null,"credibility":"unverified","credibility_note":"10億人は自社発表の数値であり、第三者機関による検証はない。","sources":[{"title":"TikTok Newsroom: Thanks a billion (2021-09-27)","url":null}]},{"date":"2021-10-05","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"元Facebook社員ハウゲンが内部文書を告発","summary":"元Facebook社員フランシス・ハウゲンが大量の内部文書を持ち出し、米上院で証言した。Instagramが10代の少女の心身に有害だと社内調査が示していながら対策が不十分だった、というのが告発の核心である。\n\n企業が自社サービスの害を認識していた証拠が示されたことで、議論は外部の推測から**内部文書に基づく責任追及**へ段階を変えた。各国の未成年保護規制や後の州政府による提訴の重要な根拠となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米上院商業科学運輸委員会公聴会証言 (2021-10-05)","url":null}]},{"date":"2022-10-27","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"マスク氏がTwitterを440億ドルで買収","summary":"イーロン・マスク氏がTwitterを約440億ドルで買収し非公開化した。大規模な人員削減、認証制度の有料化、凍結アカウントの復活、そして「X」への改名と、方針を急速に転換した。\n\n公共の言論基盤と呼ばれたサービスが一個人の所有物になったことで、モデレーションの基準が経営者の思想で変わり得ることが可視化された。広告主の離脱やEUのDSAによる監視(規制と説明責任レイヤー)など、緊張が続いている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Acquisition of Twitter by Elon Musk","url":"https://en.wikipedia.org/wiki/Acquisition_of_Twitter_by_Elon_Musk"}]},{"date":"2023-05-23","precision":"day","end_date":null,"type":"point","layer":"社会と政治","title":"米公衆衛生局長官がSNSと若者の危機で勧告","summary":"米公衆衛生局長官が、SNSが若者のメンタルヘルスに深刻なリスクをもたらし得るとする勧告を発表した。たばこや飲酒と同様の公衆衛生問題として扱う枠組みを示した点が画期的だった。\n\nハウゲンの内部告発(規制と説明責任レイヤー)以降に蓄積された研究と訴訟を背景に、「SNSと子ども」が政策課題として確立した。翌年の豪州の年齢制限法など、各国の未成年規制はこの流れの延長にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Surgeon General Advisory: Social Media and Youth Mental Health (2023)","url":null}]},{"date":"2024-02-17","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"EUデジタルサービス法(DSA)が全面適用","summary":"違法コンテンツ対応、推薦アルゴリズムの透明化、研究者へのデータ提供などを大手プラットフォームに義務づけるDSAが、EU域内の全事業者に適用された。違反には全世界売上の最大6%の制裁金が科される。\n\nGDPRがデータを守る法だとすれば、DSAは**アルゴリズムと運営に説明責任を課す**法である。X社への正式手続きなど執行も始まり、プラットフォーム設計(プラットフォームレイヤー)をEU基準が拘束する時代に入った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2022/2065 (Digital Services Act)","url":"https://eur-lex.europa.eu/eli/reg/2022/2065/oj"}]},{"date":"2024-11-01","precision":"month","end_date":null,"type":"point","layer":"規制と説明責任","title":"豪州が16歳未満のSNS利用を禁止する法律を可決","summary":"オーストラリア議会が、16歳未満のSNS利用を禁止し年齢確認をプラットフォーム側の義務とする世界初の法律を可決した。2025年12月から適用され、違反企業には最大4950万豪ドルの罰金が科される。\n\n米公衆衛生局長官の勧告(社会と政治レイヤー)に象徴される若者への害の議論が、ついに利用そのものの禁止という強い形の立法に至った。年齢確認の実効性とプライバシーへの影響をめぐり、各国が実施を注視している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Online Safety Amendment (Social Media Minimum Age) Act 2024 (豪州)","url":null}]},{"date":"2025-01-19","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"米TikTok禁止法が発効、一時サービス停止","summary":"ByteDanceに米国事業の売却を求め、応じなければ配信を禁じる法律が発効し、TikTokは米国で一時サービスを停止した。新政権の執行猶予でまもなく復旧したが、売却をめぐる交渉は長期化した。\n\n1億7000万人が使うアプリが安全保障を理由に止められた事例であり、アラブの春の頃に自由の道具とされたSNS(社会と政治レイヤー)が、国家間対立の駒になったことを象徴する。データの帰属が主権の問題になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Restrictions on TikTok in the United States","url":"https://en.wikipedia.org/wiki/Restrictions_on_TikTok_in_the_United_States"}]}]},{"slug":"tech-space-internet","title":"宇宙インターネット計画","description":"イリジウムの挫折から数千基の衛星コンステレーション、スマホと衛星の直接通信まで。打ち上げ技術・事業競争・規制の3層で、宇宙からインターネットを届ける挑戦の四半世紀を追う。","category":"technology","language":"ja","start_year":1998,"end_year":2025,"layers":[{"name":"技術と打ち上げ","color":"blue"},{"name":"事業と競争","color":"orange"},{"name":"規制と社会","color":"teal"}],"events":[{"date":"1998-11-01","precision":"day","end_date":"1999-08-13","type":"period","layer":"事業と競争","title":"イリジウム、衛星電話開始から9か月で経営破綻","summary":"モトローラ主導のイリジウムが、66基の低軌道衛星による世界初の衛星携帯電話サービスを開始した。しかし高額な端末と通話料で加入者は伸びず、9か月後に当時史上最大級の経営破綻に至った。\n\n「宇宙から全地球に通信を届ける」構想の最初の大規模な挫折であり、**需要を読み違えた宇宙事業の墓標**として長く語られた。同時期のテレデシックやグローバルスターの構想も相次いで頓挫し、夢は20年近く凍結される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The New York Times報道 (1999-08)","url":null}]},{"date":"2015-01-01","precision":"month","end_date":null,"type":"point","layer":"事業と競争","title":"スペースXが衛星インターネット構想を発表","summary":"イーロン・マスクがシアトルでの講演で、数千基の低軌道衛星により全世界へブロードバンドを提供する構想(後のStarlink)を発表した。収益は火星移住計画の資金源にすると語った。\n\nイリジウムの失敗から15年余、再使用ロケットによる**打ち上げコストの劇的低下**が構想を蘇らせた。同時期にOneWebも同様の計画で資金調達を進めており、第2次衛星コンステレーション競争の号砲となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表・報道 (2015-01)","url":null}]},{"date":"2018-02-22","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"Starlink試験衛星2基を打ち上げ","summary":"スペースXがFalcon 9ロケットで、Starlinkの試験衛星「Tintin A/B」2基を打ち上げた。低軌道からのブロードバンド通信の実証が始まった。\n\n量産設計に先立ってアンテナや通信方式の課題を洗い出す技術検証の段階であり、並行して米FCCへの数千基規模の認可申請(規制と社会レイヤー)が進められていた。翌年の量産機一括打ち上げへ向けた助走である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表・FCC申請資料 (2018)","url":null}]},{"date":"2019-02-27","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"OneWebが最初の6衛星を打ち上げ","summary":"英OneWebが最初の6基の衛星をソユーズロケットで打ち上げ、コンステレーションの構築を開始した。ソフトバンクなどから巨額の出資を集めた、Starlinkの最大の対抗馬だった。\n\nスペースXと異なり自前のロケットを持たず、打ち上げを外部調達に頼る構造が重いコストとなってのしかかる。打ち上げ手段を持つ者と持たざる者の差は、翌年の同社の経営破綻(事業と競争レイヤー)で最初の答えを見る。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OneWeb発表 (2019-02)","url":null}]},{"date":"2019-05-24","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"Starlink量産衛星60基を一括打ち上げ","summary":"スペースXがFalcon 9の1機で量産型Starlink衛星60基を一括投入した。平積みの専用搭載方式により、1回の打ち上げで従来の衛星網数個分に相当する規模を展開してみせた。\n\n衛星を一点物ではなく「量産品」として扱う発想の転換であり、以後ほぼ隔週の打ち上げで軌道上の衛星数は数年で数千基に達する。直後から天文学者が夜空に並ぶ光跡へ懸念を表明し(規制と社会レイヤー)、軌道の混雑が現実の問題になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表 (2019-05)","url":null}]},{"date":"2019-06-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"国際天文学連合が衛星群の光害に懸念声明","summary":"国際天文学連合(IAU)が、衛星コンステレーションの反射光が天体観測と夜空の景観に与える影響について懸念を表明する声明を発表した。\n\nStarlink衛星60基の一括打ち上げ(技術と打ち上げレイヤー)の直後の反応であり、**軌道と夜空は誰のものか**という新しい規制問題の始まりとなった。スペースXは反射低減塗装やサンバイザーで対応したが、電波天文学への影響や衛星急増そのものへの懸念は現在まで続いている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IAU Statement on Satellite Constellations (2019-06)","url":null}]},{"date":"2020-03-27","precision":"day","end_date":null,"type":"point","layer":"事業と競争","title":"OneWebが経営破綻、英政府連合が救済","summary":"OneWebがコロナ禍での資金調達難から連邦破産法11条を申請した。主要出資者ソフトバンクの追加出資見送りが背景と報じられた。同年7月には英政府とインドのバーティ・グローバルが買収し、再建へ向かう。\n\n民間資金のみで衛星網を築くことの難しさを示すと同時に、英政府の買収参画は衛星コンステレーションが**国家インフラとしての価値**を持ち始めたことを示した。以後、各国政府が自前の衛星網構想を掲げる流れが加速する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2020-03-27)","url":null}]},{"date":"2020-07-30","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"米FCCがアマゾンの衛星網Project Kuiperを認可","summary":"米連邦通信委員会(FCC)がアマゾンの衛星コンステレーション計画「Project Kuiper」の3,236基を認可した。2020年代末までに半数を配備することが条件として付された。\n\n巨大IT企業の本格参入を規制当局が認めた節目であり、低軌道の軌道枠と周波数の割当が競争の主戦場となったことを示す。配備期限という規制上の仕掛けは、後にKuiperの打ち上げを急がせる強制力(事業と競争レイヤー)として働くことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FCC Order: Kuiper Systems LLC (2020-07)","url":null}]},{"date":"2020-10-01","precision":"month","end_date":null,"type":"point","layer":"事業と競争","title":"Starlinkが一般向けベータサービスを開始","summary":"スペースXが北米で「Better Than Nothing Beta(何もないよりマシなベータ)」と名づけた一般向けの試験サービスを開始した。月額99ドル・機器代499ドルながら、光回線の届かない地域の住民から予想を上回る需要を集めた。\n\n謙遜した名称とは裏腹に、ブロードバンド空白地帯という明確な市場を突いた出発だった。イリジウムが読み違えた「顧客は誰か」という問いに、取り残された地域の住民という答えを示した点が、四半世紀前との本質的な違いである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX案内・報道 (2020-10)","url":null}]},{"date":"2022-02-08","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"磁気嵐でStarlink衛星最大40基を喪失","summary":"打ち上げ直後の低い軌道にあったStarlink衛星49基のうち最大40基が、磁気嵐に伴う大気の膨張で軌道を維持できず失われたとスペースXが発表した。\n\n宇宙天気が大規模コンステレーションの現実的なリスクであることを示した、初の大量喪失事例である。不良機を早期に処分できるよう低い初期軌道へ投入する同社の運用設計が、逆に嵐への脆弱性となった側面もあり、運用高度と宇宙環境予報の重要性が再認識された。","detail":null,"credibility":"disputed","credibility_note":"喪失数は同社発表で「最大40基」とされ、最終的に確定した数の公表はない。","sources":[{"title":"SpaceX update: Geomagnetic storm and recently deployed Starlink satellites (2022-02)","url":null}]},{"date":"2022-02-26","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"ウクライナ侵攻直後、Starlinkが戦時の通信網に","summary":"ロシアの侵攻で通信網が攻撃されるなか、ウクライナ政府高官のSNS上の要請に応じてスペースXがStarlinkを同国で有効化し、端末を順次供給した。衛星網が戦時の基幹通信を支える初の大規模事例となった。\n\n一民間企業のサービスが戦争の帰趨に関わる状況は、**一企業が握る地政学的な力**への各国の警戒を呼び覚ました。欧州の独自衛星網IRIS²構想をはじめ、通信の主権を問い直す各国の動きは、この経験を直接の背景としている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters・BBC報道 (2022-02〜03)","url":null}]},{"date":"2023-04-01","precision":"month","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"AST、市販スマホと衛星の直接通話に成功と発表","summary":"米AST SpaceMobileが、試験衛星BlueWalker 3を使い、改造していない市販のスマートフォンとの衛星経由の音声通話に成功したと発表した。\n\n専用端末を前提としてきた衛星通信の常識を覆し、「基地局を空に置く」方式の実現性を示した。既存の携帯事業者と組んで圏外そのものを消しにいく路線は、Starlinkのスマホ直接接続と並ぶ第二の競争軸(事業と競争レイヤー)へ育っていく。","detail":null,"credibility":"unverified","credibility_note":"通話成功は同社の発表に基づくもので、通信品質や再現性についての第三者による検証は公表されていない。","sources":[{"title":"AST SpaceMobile press release (2023-04)","url":null}]},{"date":"2023-10-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"FCCがスペースデブリ規則違反に初の制裁金","summary":"米FCCが、退役衛星を約束した軌道へ離脱させる義務を怠ったとして、衛星放送会社DISHに15万ドルの制裁金を科した。宇宙ゴミをめぐる規制当局として初の処分となった。\n\n金額こそ小さいが、軌道を「管理され、執行の対象となる環境」として扱った先例である。数千基規模のコンステレーション時代に、衝突リスクとデブリの責任を誰がどのように負うのかという問いへの、最初の制度的な応答だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FCC Enforcement Bureau発表 (2023-10)","url":null}]},{"date":"2024-01-02","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"Starlink、スマホ直結用衛星の打ち上げを開始","summary":"スペースXが、スマートフォンと直接通信するdirect-to-cell機能を持つ最初のStarlink衛星6基を打ち上げた。地上の携帯事業者の周波数を使い、圏外のスマホへそのまま電波を届ける方式である。\n\nT-Mobileをはじめ各国の携帯事業者との提携により、衛星網は携帯網の「圏外を埋める層」として組み込まれ始めた。ASTとの競争も本格化し、宇宙インターネットは固定回線の代替からモバイルの補完へと戦線を広げた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表 (2024-01)","url":null}]},{"date":"2024-08-06","precision":"day","end_date":null,"type":"point","layer":"事業と競争","title":"中国の「千帆星座」が初打ち上げ","summary":"上海市系企業が主導する衛星コンステレーション「千帆」の最初の18基が打ち上げられた。最終的には1万基を超える衛星網を構想しているとされる。\n\n国家主導の「国網」構想と並ぶ中国の大規模計画の始動であり、低軌道の軌道枠と周波数の獲得競争は米中の国家間競争の様相を帯びた。軌道は事実上早い者勝ちの側面が強く、**配備の速度そのものが地政学的な意味**を持つ段階に入っている。","detail":null,"credibility":"unverified","credibility_note":"計画総数(1万基超)は報道・申請ベースの数値であり、実際の配備規模と時期は確定していない。","sources":[{"title":"新華社・Reuters報道 (2024-08)","url":null}]},{"date":"2024-12-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"EUが独自衛星網IRIS²の契約を締結","summary":"欧州委員会が、官民連携による独自の衛星コンステレーション「IRIS²」のコンセッション契約を締結した。約290基を2030年頃までに配備し、政府向けのセキュア通信と商用ブロードバンドを提供する計画である。\n\n特定企業のサービスへの依存に対する危機感から生まれた**通信主権**の具体化であり、ウクライナでの経験(2022年)が直接の教訓となった。規模と速度で米中に劣る欧州が、規制と公共調達で対抗する構図がここに定まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Commission発表 (2024-12)","url":null}]},{"date":"2025-01-01","precision":"year","end_date":null,"type":"point","layer":"事業と競争","title":"Starlink利用者500万人超、事業は黒字化と発表","summary":"スペースXがStarlinkの利用者が世界で500万人を超えたことを明らかにした。約130か国で提供され、航空機や船舶への搭載も進み、衛星通信の売上は同社のロケット事業を上回る規模になったとされる。\n\nイリジウムが数万加入で沈んでから四半世紀、宇宙インターネットは初めて**商業的に成立する事業**になったとみられる。ただし利用者数も黒字化も自社発表であり、巨額の衛星更新費用を含めた採算の全体像は外部から検証できない。","detail":null,"credibility":"disputed","credibility_note":"利用者数・収益性はいずれも同社および経営陣の発言に基づくもので、監査済み財務情報としての公開はない。","sources":[{"title":"SpaceX発表・報道 (2025)","url":null}]},{"date":"2025-04-28","precision":"day","end_date":null,"type":"point","layer":"事業と競争","title":"アマゾンKuiper、最初の本格衛星27基を打ち上げ","summary":"アマゾンがProject Kuiperの最初の本格運用衛星27基を打ち上げ、コンステレーションの構築を開始した。FCC認可に付された配備期限が迫るなかでの船出となった。\n\n認可(2020年)から5年を要した遅れは、打ち上げ手段の確保が今なお最大の関門であることを物語る。自前ロケットを持つスペースXの優位は揺らがないが、ECとクラウドに衛星網を結びつけるという別の戦い方をアマゾンは狙っている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon発表 (2025-04)","url":null}]}]},{"slug":"tech-web3-metaverse","title":"Web3.0とメタバース","description":"ビットコインの思想からNFTの熱狂、メタバースへの巨額投資と撤退、制度化まで。技術・資本・社会の3層を重ね、理想と投機が往復するWeb3の実像を追う年表。","category":"technology","language":"ja","start_year":2008,"end_year":2025,"layers":[{"name":"技術とプロトコル","color":"blue"},{"name":"資本と市場","color":"orange"},{"name":"社会と制度","color":"teal"}],"events":[{"date":"2008-10-31","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"ビットコイン論文公開、非中央集権の原点","summary":"サトシ・ナカモトを名乗る人物が暗号学メーリングリストに論文「Bitcoin: A Peer-to-Peer Electronic Cash System」を投稿。銀行など中央管理者なしに価値を移転する仕組みを提示した。\n\nブロックチェーンという**「分散と所有」の理想**はここに始まり、後のWeb3.0やNFT、メタバース経済圏の議論はすべてこの9ページの論文を源流とする。著者の正体は現在も不明である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcoin: A Peer-to-Peer Electronic Cash System (bitcoin.org)","url":"https://bitcoin.org/bitcoin.pdf"}]},{"date":"2014-04-01","precision":"month","end_date":null,"type":"point","layer":"技術とプロトコル","title":"ギャビン・ウッドが「Web 3.0」を提唱","summary":"イーサリアム共同創設者のギャビン・ウッドがブログ記事で「Web 3.0」を提唱。中央のサーバーに依存せず、暗号技術で信頼を担保する分散型ウェブの構想を示した。\n\nこの時点では技術者コミュニティ内の概念にすぎず、資本と市場レイヤーがこの語を看板に掲げて殺到するのは7年後の2021年である。語の意味が思想から投機の旗印へ変質していく、その出発点として重要な文書といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Gavin Wood: ĐApps: What Web 3.0 Looks Like (2014)","url":null}]},{"date":"2015-07-30","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"イーサリアム稼働、スマートコントラクトの基盤","summary":"ヴィタリック・ブテリンらが開発したイーサリアムのメインネット「Frontier」が稼働。契約をコードとして自動執行するスマートコントラクトにより、ブロックチェーンの用途を通貨以外へ開いた。\n\n後のICO、NFT、DeFiといったWeb3の主要な応用はほぼすべてこの基盤の上で生まれる。技術レイヤーの土台がここで整い、2年後に資本と市場レイヤーの熱狂(ICOブーム)を呼び込むことになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ethereum.org: The history of Ethereum","url":"https://ethereum.org/en/history/"}]},{"date":"2017-01-01","precision":"month","end_date":"2018-03-31","type":"period","layer":"資本と市場","title":"ICOブーム、トークン販売に資金が殺到","summary":"イーサリアム上でトークンを発行して資金を集めるICO(イニシャル・コイン・オファリング)が世界的に過熱。2017年だけで数十億ドル規模が調達されたとされ、構想書1枚で巨額が集まる事例が続出した。\n\n**理想を掲げた技術が投機の器に変わる**最初の大波であり、詐欺的案件の続出を受けて各国当局が警告や規制に動いた。中国は2017年9月にICOを全面禁止し、社会と制度レイヤーの初動もここから始まる。","detail":null,"credibility":"disputed","credibility_note":"ICOの調達総額は集計機関により数十億〜百億ドル超と幅があり、確定した統計は存在しない。","sources":[{"title":"CoinDesk ICO Tracker(2017〜2018年の集計)","url":null}]},{"date":"2017-12-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"CryptoKitties流行でイーサリアムが混雑","summary":"ブロックチェーン上で猫のキャラクターを収集・交配するゲームCryptoKittiesが流行し、取引がイーサリアムのネットワークを圧迫。手数料が高騰し、未処理の取引が大量に積み上がった。\n\nNFT(非代替性トークン)が一般の関心を集めた最初の事例であると同時に、分散型基盤の処理能力の限界を早くも露呈した出来事でもある。スケーラビリティ問題はその後もWeb3の宿題であり続ける。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: CryptoKitties","url":"https://en.wikipedia.org/wiki/CryptoKitties"}]},{"date":"2021-03-11","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"BeepleのNFT作品が約6900万ドルで落札","summary":"デジタルアーティストBeepleの作品「Everydays: The First 5000 Days」が、老舗オークションハウスのクリスティーズで約6934万ドルで落札された。NFTに紐づくデジタル作品として史上最高額となった。\n\n2017年のCryptoKitties(社会と制度レイヤー)から4年、NFTが美術市場の中心に躍り出た瞬間であり、これを合図にNFT投機が本格化する。デジタルデータの「所有」を売買するという概念が、この一件で一般のニュースになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Everydays: the First 5000 Days","url":"https://en.wikipedia.org/wiki/Everydays:_the_First_5000_Days"}]},{"date":"2021-06-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"社会と制度","title":"Axie Infinityの「遊んで稼ぐ」が新興国で拡大","summary":"NFTゲームAxie Infinityが東南アジア、特にフィリピンで急拡大。ゲーム内トークンを換金する「Play-to-Earn」が、コロナ禍で職を失った人々の収入源になったと報じられた。\n\n**ゲームが生活インフラになる**というWeb3の可能性と、トークン価格に生計が左右される危うさを同時に示した。翌2022年の暗号資産市場の暴落(資本と市場レイヤー)で収益は急減し、ブームは短命に終わる。","detail":null,"credibility":"disputed","credibility_note":"「月収が現地平均賃金を上回った」等の収入水準の報道は聞き取りベースで、統計的な裏付けはない。","sources":[{"title":"Rest of World / CoinDeskによる2021年のAxie Infinity報道","url":null}]},{"date":"2021-10-28","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"FacebookがMetaに社名変更、メタバースへ転換","summary":"Facebookが社名をMetaに変更し、SNS企業からメタバース企業への転換を宣言。年間100億ドル規模を関連部門Reality Labsに投じる方針を示した。\n\n内部告発文書による批判が高まっていた時期の発表で、話題転換との見方も出たが、巨大テックの参入により「メタバース」は一気に流行語となった。**理想の看板を最も大きく掲げた企業**が、わずか2年後には縮小へ転じることになる(2023年のReality Labs赤字)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Meta: The Facebook Company Is Now Meta (2021-10-28)","url":"https://about.fb.com/news/2021/10/facebook-company-is-now-meta/"}]},{"date":"2021-11-01","precision":"month","end_date":null,"type":"point","layer":"資本と市場","title":"暗号資産の時価総額が約3兆ドルの頂点に","summary":"ビットコインが約6万9000ドルの史上最高値を付け、暗号資産全体の時価総額は集計サイトベースで約3兆ドルに達した。NFTやメタバース関連トークンも軒並み高騰し、投機熱は頂点を迎えた。\n\n同時期にはメタバース内の土地NFTが数億円で取引される事例も報じられた。この頂点から1年で市場は3分の1以下に縮み、Terra崩壊とFTX破綻(いずれも資本と市場レイヤー)が続くことになる。","detail":null,"credibility":"unverified","credibility_note":"時価総額約3兆ドルはCoinGecko等の集計サイトによる推定値で、集計対象の範囲により数値が異なる。","sources":[{"title":"CoinGecko: Global Cryptocurrency Market Cap(2021年11月)","url":null}]},{"date":"2022-05-09","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"ステーブルコインTerraUSD崩壊","summary":"アルゴリズム型ステーブルコインTerraUSD(UST)がドル連動を失い、対をなすトークンLUNAとともに数日でほぼ無価値になった。消失した時価総額は400億ドル規模とされる。\n\n「アルゴリズムでドルを再現する」設計の脆さが露呈した事件で、連鎖的にヘッジファンドや貸付業者の破綻を招き、FTX破綻への導火線となった。各国のステーブルコイン規制論(社会と制度レイヤー)を一気に加速させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Terra (blockchain)","url":"https://en.wikipedia.org/wiki/Terra_(blockchain)"}]},{"date":"2022-06-07","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"日本政府がWeb3.0推進を成長戦略に明記","summary":"政府の「経済財政運営と改革の基本方針(骨太の方針)2022」が閣議決定され、ブロックチェーンを基盤とするWeb3.0の推進に向けた環境整備が明記された。NFTやDAOの利用拡大が検討課題とされた。\n\n市場が下落局面に入った時期(資本と市場レイヤー)に国家戦略への採用が進むという時間差が生じており、制度が熱狂に遅れて動く構図はこの分野で繰り返し現れる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 経済財政運営と改革の基本方針2022(2022-06-07閣議決定)","url":null}]},{"date":"2022-09-15","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"イーサリアム「The Merge」でPoS移行完了","summary":"イーサリアムが合意形成の仕組みをプルーフ・オブ・ワークからプルーフ・オブ・ステークへ切り替える大型アップグレード「The Merge」を完了。ネットワークの消費電力を99.9%以上削減したとされる。\n\n暗号資産への批判の筆頭だった環境負荷に技術側から答えた形であり、弱気相場(資本と市場レイヤー)のさなかでも**プロトコル開発は着実に前進する**ことを示した。稼働を止めない基盤の切り替えは技術的にも異例の規模だった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Ethereum Foundation: The Merge","url":"https://ethereum.org/en/roadmap/merge/"}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"大手交換業者FTXが経営破綻","summary":"世界有数の暗号資産交換業者FTXが米連邦破産法11条の適用を申請。顧客資産の流用が発覚し、創業者サム・バンクマン=フリードは後に詐欺罪で有罪判決を受けた。\n\nTerra崩壊から半年での大手破綻により業界への信頼は底に落ち、「冬の時代」が決定的になった。一方でこの事件が各国の規制整備(社会と制度レイヤー)を前進させ、2年後の現物ETF承認という制度化された市場への転機ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bankruptcy of FTX","url":"https://en.wikipedia.org/wiki/Bankruptcy_of_FTX"}]},{"date":"2023-02-01","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"MetaのReality Labs、年間137億ドルの赤字","summary":"Metaの2022年通期決算で、メタバース部門Reality Labsの営業損失が137億ドルに達したことが開示された。同社は「効率の年」を掲げ、人員削減とAIへの投資シフトを進める。\n\n社名変更からわずか1年余りでの方針転換であり、**巨額投資をもってしても「住人」は集まらない**というメタバースの現実を数字で示した。世間の関心も、同時期に公開されたChatGPTなど生成AIへ急速に移っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Meta Platforms: Fourth Quarter and Full Year 2022 Results (2023-02-01)","url":null}]},{"date":"2023-06-05","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"AppleがVision Pro発表、空間コンピューティング","summary":"AppleがWWDCでヘッドセット型デバイスApple Vision Proを発表。「メタバース」の語を避け、「空間コンピューティング」という独自の枠組みを打ち出した。価格は3499ドル。\n\nMetaが牽引したメタバース概念の退潮(資本と市場レイヤー)と入れ替わるようにAppleが参入した形で、仮想空間への没入ではなく現実への重ね合わせを主軸とする点が対照的だった。没入型デバイス市場の再定義を試みる動きである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: Introducing Apple Vision Pro (2023-06-05)","url":"https://www.apple.com/newsroom/2023/06/introducing-apple-vision-pro/"}]},{"date":"2024-01-10","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"米SECがビットコイン現物ETFを承認","summary":"米証券取引委員会(SEC)がビットコイン現物ETF11本を一斉承認し、翌日から取引が始まった。BlackRockなど大手資産運用会社の参入により、機関投資家が規制された形で暗号資産に投資できるようになった。\n\n10年越しの申請却下の歴史を経た制度的転換であり、FTX破綻で地に落ちた信頼が、**分散の理想ではなく既存金融への編入**という形で回復していくことを象徴した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米SEC: ビットコイン現物ETP承認に関する委員長声明 (2024-01-10)","url":null}]},{"date":"2024-02-02","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"Vision Pro発売、初動の熱と失速","summary":"Apple Vision Proが米国で発売。初週末の行列が報じられた一方、重さや価格、用途の乏しさから利用が定着せず、出荷台数は当初想定を下回ったとの推計が相次いだ。\n\n技術レイヤーとしての完成度は高く評価されたが、日常的に装着する動機を提示できなかった点はMetaのヘッドセットと共通する。没入型デバイスが「次のiPhone」になる時期は依然見通せず、各社は軽量なAIグラスへ軸足を移し始めた。","detail":null,"credibility":"unverified","credibility_note":"出荷・販売台数はAppleが公表しておらず、調査会社の推計や報道ベースの数字にとどまる。","sources":[{"title":"Apple Newsroom: Apple Vision Pro available in the U.S. on February 2 (2024-01-08)","url":"https://www.apple.com/newsroom/2024/01/apple-vision-pro-available-in-the-us-on-february-2/"}]},{"date":"2025-07-18","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"米国初のステーブルコイン連邦法が成立","summary":"米国でステーブルコインの発行を規制するGENIUS法が成立し、準備資産の裏付けや情報開示を義務付ける連邦レベルの枠組みが初めて整った。\n\nTerra崩壊(2022年)が示した無担保設計の危険への制度的回答であり、暗号資産が規制の外の実験から**制度の内側の金融インフラ**へ移ったことを画す。ドル連動トークンが決済や送金の基盤になる道が開け、Web3は熱狂の語ではなく実務の層として定着し始めた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GENIUS Act(2025年7月成立の米ステーブルコイン規制法)","url":null}]}]}];

};
const UNSPLASH_UTM = "?utm_source=chronos&utm_medium=referral";
const CATKEY = {"technology":"tech","history-politics":"history","culture":"culture","science-nature":"science","business":"business","personal-life":"personal"};
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))>>>0}return h}
function pickPhoto(t){
  const pool = PHOTO_POOL[CATKEY[t.category]];
  if(!pool || !pool.length) return null;
  return pool[(hashStr(CATKEY[t.category] + "|" + t.title) >>> 8) % pool.length];
}
function photoURL(p, w, h){return `${p.raw}?w=${w}&h=${h}&fit=crop&auto=format&q=70`}
const CAT = {
  "technology": "テクノロジー",
  "history-politics": "歴史・政治",
  "culture": "カルチャー",
  "science-nature": "科学・自然",
  "business": "ビジネス",
  "personal-life": "個人・ライフ"
};
const COLOR = {blue:"var(--c-blue)",green:"var(--c-green)",pink:"var(--c-pink)",gold:"var(--c-gold)",purple:"var(--c-purple)",teal:"var(--c-teal)",orange:"var(--c-orange)"};
const CRED = {verified:"検証済み",disputed:"諸説あり",unverified:"未検証"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => "<p>" + esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n{2,}/g, "</p><p>") + "</p>";

function fmtDate(e){
  const [y,m,d] = e.date.split("-");
  if(e.precision === "year") return y;
  if(e.precision === "month") return `${y}.${m}`;
  return `${y}.${m}.${d}`;
}
function fmtEnd(e){
  if(e.type !== "period" || !e.end_date) return "";
  const [y,m] = e.end_date.split("-");
  return e.precision === "year" ? ` — ${y}` : ` — ${y}.${m}`;
}

function renderHome(){
  const byCat = {};
  for(const t of DATA) (byCat[t.category] ??= []).push(t);
  let html = "";
  for(const key of Object.keys(CAT)){
    const list = byCat[key] || [];
    if(!list.length) continue;
    html += `<section class="cat-sec"><div class="cat-head"><h2 class="cat-name">${CAT[key]}</h2><span class="cat-count">${list.length} TIMELINES</span></div><div class="tl-grid">`;
    for(const t of list){
      const chips = t.layers.map(l => `<span class="layer-chip"><i style="background:${COLOR[l.color]}"></i>${esc(l.name)}</span>`).join("");
      html += `<button class="tl-card" data-slug="${esc(t.slug)}">
        <div class="tl-years">${t.start_year}–${t.end_year}</div>
        <div class="tl-title">${esc(t.title)}</div>
        <div class="tl-desc">${esc(t.description)}</div>
        <div class="tl-meta">${chips}<span class="tl-evcount">${t.events.length}件</span></div>
      </button>`;
    }
    html += `</div></section>`;
  }
  document.getElementById("cats").innerHTML = html;
}

function renderDetail(t){
  const colorOf = name => COLOR[(t.layers.find(l => l.name === name) || {}).color] || "var(--text3)";
  const cred = t.events.reduce((a,e) => (a[e.credibility] = (a[e.credibility]||0)+1, a), {});
  const layers = t.layers.map(l => `<button class="d-layer" data-layer="${esc(l.name)}"><i style="background:${COLOR[l.color]}"></i>${esc(l.name)}</button>`).join("");
  let evs = "", lastYear = null;
  const sorted = [...t.events].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  for(const e of sorted){
    const y = e.date.slice(0,4);
    if(y !== lastYear){ evs += `<div class="year-mark">${y}</div>`; lastYear = y; }
    const note = e.credibility_note ? `<div class="ev-note"><span class="ev-note-label">${e.credibility === "disputed" ? "諸説ありの理由" : "未検証の理由"}</span>${esc(e.credibility_note)}</div>` : "";
    const detail = e.detail ? `<div class="ev-detail">${md(e.detail)}</div>` : "";
    const srcs = (e.sources || []).filter(s => s && s.title).map(s =>
      s.url ? `<div class="ev-src">出典: <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></div>`
            : `<div class="ev-src">出典: ${esc(s.title)}</div>`).join("");
    evs += `<div class="ev" data-layer="${esc(e.layer)}">
      <div class="ev-rail"><span class="ev-dot ${e.type === "period" ? "period" : ""}" style="background:${colorOf(e.layer)}"></span></div>
      <div class="ev-body">
        <button class="ev-head" aria-expanded="false">
        <div class="ev-top">
          <span class="ev-date">${fmtDate(e)}${fmtEnd(e)}</span>
          <span class="ev-layer"><i style="background:${colorOf(e.layer)}"></i>${esc(e.layer)}</span>
          <span class="cred ${e.credibility}">${CRED[e.credibility] || esc(e.credibility)}</span>
        </div>
        <div class="ev-title">${esc(e.title)}</div>
        </button>
        <div class="ev-x"><div class="ev-xi"><div class="ev-xd">
        <div class="ev-summary">${md(e.summary)}</div>
        ${detail}${note}${srcs ? `<div class="ev-srcs">${srcs}</div>` : ""}
        </div></div></div>
      </div>
    </div>`;
  }
  document.getElementById("detail").innerHTML = `
    <button class="d-back" id="back">← 一覧に戻る</button>
    ${(() => { const ph = pickPhoto(t); if(!ph) return ""; return `<figure class="d-coverwrap"><div class="d-cover"><img src="${photoURL(ph, 1080, 480)}" alt="" loading="lazy" decoding="async" onload="this.classList.add(&quot;loaded&quot;)" onerror="this.closest(&quot;.d-coverwrap&quot;).remove()"><div class="d-cover-shade"></div></div><figcaption class="d-cover-credit">Photo: <a href="${esc(ph.user)}${UNSPLASH_UTM}" target="_blank" rel="noopener noreferrer">${esc(ph.name)}</a> / <a href="https://unsplash.com/${UNSPLASH_UTM}" target="_blank" rel="noopener noreferrer">Unsplash</a></figcaption></figure>`; })()}
    <div class="d-cat">${CAT[t.category] || esc(t.category)}</div>
    <h1 class="d-title">${esc(t.title)}</h1>
    <p class="d-desc">${esc(t.description)}</p>
    <div class="d-stats">
      <span>期間 <b>${t.start_year}–${t.end_year}</b></span>
      <span>イベント <b>${t.events.length}</b></span>
      <span>検証済み <b>${cred.verified || 0}</b></span>
      <span>諸説あり <b>${cred.disputed || 0}</b></span>
      <span>未検証 <b>${cred.unverified || 0}</b></span>
      <span>slug <b>${esc(t.slug)}</b></span>
    </div>
    <div class="d-layers">${layers}</div>
    <div class="ev-tools"><button class="ev-expall">すべて開く</button></div>
    <div class="ev-list">${evs}</div>`;
  document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
  observeMarkers();
}

function route(){
  const slug = decodeURIComponent(location.hash.replace(/^#/, ""));
  const t = DATA.find(x => x.slug === slug);
  const home = document.getElementById("home"), detail = document.getElementById("detail");
  if(t){
    renderDetail(t);
    home.classList.add("off"); detail.classList.add("on");
    window.scrollTo(0, 0);
  } else {
    home.classList.remove("off"); detail.classList.remove("on");
  }
}

const rbFill = document.querySelector(".readbar i");
let rbMax = 1;
function updateReadbar(){
  rbFill.style.transform = `scaleX(${Math.min(1, Math.max(0, scrollY / rbMax))})`;
}
function recalcReadbar(){
  rbMax = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  updateReadbar();
  recalcYears();
  updateYearNow();
}
const yearNow = document.querySelector(".year-now");
let yearPts = [];
function recalcYears(){
  yearPts = [...document.querySelectorAll("#detail .year-mark")].map(m => ({y: m.textContent, top: m.getBoundingClientRect().top + scrollY}));
}
function updateYearNow(){
  if(!document.getElementById("detail").classList.contains("on")){ yearNow.classList.remove("show"); return; }
  const line = scrollY + 170;
  let cur = null;
  for(const pt of yearPts){ if(pt.top <= line) cur = pt.y; else break; }
  if(cur){ yearNow.textContent = cur; yearNow.classList.add("show"); } else { yearNow.classList.remove("show"); }
}
let mkIO = null;
function observeMarkers(){
  if(mkIO) mkIO.disconnect();
  mkIO = new IntersectionObserver(es => es.forEach(en => {
    if(en.isIntersecting){ en.target.classList.add("mk"); mkIO.unobserve(en.target); }
  }), {threshold: 0.6});
  document.querySelectorAll("#detail strong").forEach(el => mkIO.observe(el));
}
addEventListener("scroll", () => {
  const c = document.documentElement.classList;
  if (scrollY > 80) c.add("scrolled"); else if (scrollY < 30) c.remove("scrolled");
  updateReadbar();
  updateYearNow();
}, {passive: true});
addEventListener("resize", recalcReadbar, {passive: true});
new ResizeObserver(recalcReadbar).observe(document.body);

renderHome();
document.getElementById("cats").addEventListener("click", e => {
  const card = e.target.closest(".tl-card");
  if(card) location.hash = card.dataset.slug;
});
document.getElementById("detail").addEventListener("click", ev => {
  const chip = ev.target.closest(".d-layer");
  if(chip){
    const on = chip.classList.contains("active");
    document.querySelectorAll("#detail .d-layer").forEach(c => c.classList.remove("active"));
    document.querySelectorAll("#detail .ev").forEach(x => x.classList.remove("dim"));
    if(!on){
      chip.classList.add("active");
      document.querySelectorAll("#detail .ev").forEach(x => x.classList.toggle("dim", x.dataset.layer !== chip.dataset.layer));
    }
    return;
  }
  const body = ev.target.closest(".ev-body");
  if(body && !ev.target.closest("a")){
    const item = body.closest(".ev");
    const open = item.classList.contains("open");
    // 展開中の本文タップでは閉じない（リンク・文章選択のため）
    if(!(open && ev.target.closest(".ev-x"))){
      item.classList.toggle("open", !open);
      body.querySelector(".ev-head").setAttribute("aria-expanded", String(!open));
      return;
    }
    return;
  }
  const all = ev.target.closest(".ev-expall");
  if(all){
    const items = [...document.querySelectorAll("#detail .ev")];
    const anyClosed = items.some(x => !x.classList.contains("open"));
    items.forEach((x, i) => {
      const d = anyClosed ? `${i * 28}ms` : "0ms";
      x.querySelector(".ev-x").style.transitionDelay = d;
      x.querySelector(".ev-xd").style.transitionDelay = anyClosed ? `${i * 28 + 100}ms` : "0ms";
      x.classList.toggle("open", anyClosed);
      x.querySelector(".ev-head").setAttribute("aria-expanded", String(anyClosed));
    });
    setTimeout(() => items.forEach(x => {
      x.querySelector(".ev-x").style.transitionDelay = "";
      x.querySelector(".ev-xd").style.transitionDelay = "";
    }), items.length * 28 + 600);
    all.textContent = anyClosed ? "すべて閉じる" : "すべて開く";
  }
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
