<style>
:root{

}
*{margin:0;padding:0;box-sizing:border-box}
html.scrolled{--hdr:60px}
html{font-size:15px;-webkit-font-smoothing:antialiased;background:var(--bg);color-scheme:dark;overflow-x:clip;scroll-padding-top:calc(var(--hdr) + 16px)}
body{font-family:var(--f-b);background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:var(--lh-body);font-weight:400;touch-action:manipulation}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--text-h);outline-offset:3px;border-radius:2px}

header.site{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,12,0.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.hdr-inner{max-width:1920px;margin:0 auto;padding:0 32px;height:var(--hdr);display:flex;align-items:center;justify-content:space-between;transition:height .35s var(--ease)}
.hdr-logo{display:flex;align-items:center;padding:20px 0}
.hdr-logo img{height:40px;width:auto;transition:height .35s var(--ease),opacity .3s}

.hdr-back{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);text-decoration:none;letter-spacing:0.04em;transition:color .3s;padding:8px 0}


.readbar{position:fixed;top:var(--hdr);left:0;right:0;height:2px;z-index:99;pointer-events:none;transition:top .35s var(--ease)}
.readbar i{display:block;height:100%;background:linear-gradient(90deg,rgba(232,228,222,0.35),rgba(232,228,222,0.75));transform-origin:0 50%;transform:scaleX(0);transition:transform .12s linear}
.year-now{position:fixed;top:calc(var(--hdr) + 12px);left:50%;transform:translate(-50%,-4px);z-index:98;font-family:var(--f-m);font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;letter-spacing:0.08em;font-variant-numeric:tabular-nums;color:var(--accent);background:rgba(10,10,12,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border2);border-radius:999px;padding:4px 16px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease),top .35s var(--ease)}
.year-now.show{opacity:1;transform:translate(-50%,0)}
.wrap{max-width:1080px;margin:0 auto;padding:168px 32px 140px}
.page-label{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.22em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
h1.page-title{font-family:var(--f-d);font-weight:500;font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:0.08em;color:var(--text-h);padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.page-lead{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text);max-width:640px;margin-bottom:76px}

/* ─ home: category sections */
.stamp{padding-top:48px;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.1em;color:var(--text3);opacity:.55}
.cat-sec{margin-bottom:84px}
.cat-head{display:flex;align-items:baseline;gap:16px;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:16px}
.cat-name{font-family:var(--f-d);font-weight:500;font-size:var(--fs-title);line-height:var(--lh-title);letter-spacing:0.1em;color:var(--text-h)}
.cat-count{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.tl-card{display:block;text-align:left;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 28px 24px;transition:border-color .3s,background .3s,transform .3s var(--ease),box-shadow .3s var(--ease);width:100%}

.tl-years{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--text3);letter-spacing:0.06em;font-variant-numeric:tabular-nums;margin-bottom:8px;transition:color .3s}
.tl-title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500;color:var(--text-h);margin-bottom:12px;transition:color .3s}
.tl-desc{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.layer-chip{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text2)}
.layer-chip i{width:10px;height:10px;border-radius:3px;flex:none}
.tl-evcount{margin-left:auto;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}

/* ─ detail */
.detail{display:none}
.detail.on{display:block}
.home.off{display:none}
.d-back{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);margin-bottom:40px;transition:color .3s}

.d-coverwrap{margin:0 0 40px}
.d-cover{position:relative;height:clamp(160px,28vw,280px);overflow:hidden;background:var(--card)}
.d-cover img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.d-cover img.loaded{opacity:1}
.d-cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,0.05) 40%,rgba(10,10,12,0.55))}
.d-cover-credit{display:block;text-align:right;margin-top:8px;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.04em;color:var(--text3)}
.d-cover-credit a{color:inherit;text-decoration:underline;text-decoration-color:rgba(232,228,222,0.25);text-underline-offset:2px;transition:color .3s,text-decoration-color .3s}
.d-cat{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.d-title{font-family:var(--f-d);font-weight:500;font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:0.06em;color:var(--text-h);padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.d-desc{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text);max-width:680px;margin-bottom:28px}
.d-stats{display:flex;flex-wrap:wrap;gap:24px;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);font-variant-numeric:tabular-nums;color:var(--text3);margin-bottom:36px}
.d-stats b{color:var(--text-h);font-weight:700}
.d-layers{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:64px}
.d-layer{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);cursor:pointer;transition:border-color .3s,background .3s}
.d-layer.active{border-color:var(--border2);background:var(--accent-soft);color:var(--text-h);font-weight:500}
.d-layer i{width:12px;height:12px;border-radius:3px;flex:none;transition:transform .3s var(--ease)}

/* events */
.ev-list{position:relative}
.ev{position:relative;display:grid;grid-template-columns:16px 1fr;gap:24px;padding-bottom:8px;transition:opacity .35s var(--ease),filter .35s var(--ease)}
.ev.dim{opacity:.22;filter:saturate(.4)}
.ev-rail{position:relative}
.ev-rail::before{content:"";position:absolute;left:8px;top:24px;bottom:-4px;width:1px;background:var(--border)}
.ev:last-child .ev-rail::before{display:none}
.ev-dot{position:absolute;left:3px;top:8px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg)}
.ev-dot.period{border-radius:3px}
.ev-body{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px 28px;margin-bottom:20px;min-width:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(232,228,222,0.06);transition:background .2s,border-color .2s}
.ev-body:active{background:#1E1E24;border-color:rgba(232,228,222,0.16)}
.ev-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.ev-date{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--text2);letter-spacing:0.02em;font-variant-numeric:tabular-nums}
.ev-layer{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;color:var(--text)}
.ev-layer i{width:10px;height:10px;border-radius:3px}
.cred{font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.06em;padding:0 12px;height:20px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;align-items:center}
.cred.verified{color:var(--text-h);border-color:rgba(232,228,222,0.30);background:rgba(232,228,222,0.06)}
.cred.disputed{color:var(--text2);border-color:rgba(232,228,222,0.20)}
.cred.unverified{color:var(--text3);border-color:rgba(232,228,222,0.12)}
.ev-title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500;color:var(--text-h);transition:color .3s}
.ev-head{display:block;width:100%;text-align:left;position:relative;padding-right:44px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(232,228,222,0.06)}
.ev-head::before{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:28px;height:28px;border:1px solid rgba(232,228,222,0.16);border-radius:50%;transition:border-color .3s,background .3s}
.ev.open .ev-head::before{border-color:rgba(232,228,222,0.32);background:rgba(232,228,222,0.07)}
.ev-head::after{content:"";position:absolute;right:14px;top:50%;width:5px;height:5px;margin:-4px -2.5px 0 0;border-right:1.5px solid var(--text2);border-bottom:1.5px solid var(--text2);transform:rotate(45deg);transform-origin:center;transition:transform .3s var(--ease),border-color .3s}
.ev.open .ev-head::after{margin:-1px -2.5px 0 0;transform:rotate(-135deg);border-color:var(--text-h)}
.ev-x{overflow:hidden;max-height:0;transition:max-height .5s var(--ease)}
.ev.open .ev-x{max-height:3000px}
.ev-xi{overflow:hidden}
.ev-xd{border-top:1px solid var(--border);margin-top:16px;padding-top:16px;opacity:0;transition:opacity .3s var(--ease)}
.ev.open .ev-xd{opacity:1;transition-delay:.1s}
.ev-tools{display:flex;justify-content:flex-end;margin-bottom:24px}
.ev-expall{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);border:1px solid rgba(232,228,222,0.16);border-radius:999px;padding:8px 16px;transition:color .3s,border-color .3s,background .3s}

.ev-summary{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text);margin-bottom:16px}
.ev-summary strong,.ev-detail strong{color:var(--text-h);font-weight:700}
.ev-summary p+p,.ev-detail p+p{margin-top:16px}
.ev-detail{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);margin-bottom:16px}
.ev-note-label{display:block;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.14em;color:var(--text3);margin-bottom:4px}
.ev-note{font-size:var(--fs-sm);color:var(--text2);background:rgba(232,228,222,0.04);border-left:2px solid rgba(232,228,222,0.22);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px;line-height:var(--lh-sm)}
.ev-srcs{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);padding-top:16px;margin-top:8px}
.ev-src{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}
.ev-src a{color:var(--text2);text-decoration:underline;text-decoration-color:rgba(232,228,222,0.22);text-underline-offset:3px;word-break:break-all;transition:color .3s,text-decoration-color .3s}

.year-mark{grid-column:1 / -1;font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;letter-spacing:0.1em;font-variant-numeric:tabular-nums;color:var(--text2);padding:28px 0 16px;border-bottom:1px dashed var(--border);margin-bottom:24px}

@media (max-width:560px){
  .hdr-inner{padding:0 20px}
  .wrap{padding:128px 20px 88px}
  .tl-grid{grid-template-columns:1fr}
}

/* ─ hover（ポインタ環境のみ。タッチでは残らない）*/
@media (hover:hover) and (pointer:fine){
  .hdr-back:hover{color:var(--text-h)}
  .hdr-logo:hover img{opacity:.82}
  .tl-card:hover{border-color:var(--border2);background:#1B1B20;transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,0.35)}
  .tl-card:hover .tl-title{color:#FFFFFF}
  .tl-card:hover .tl-years{color:var(--text2)}
  .d-back:hover{color:var(--text-h)}
  .d-back:hover .d-back-arrow{transform:translateX(-3px)}
  .d-coverwrap:hover img{transform:scale(1.015)}
  .d-layer:hover{border-color:var(--border2);background:rgba(232,228,222,0.05);color:var(--text-h)}
  .d-layer:hover i{transform:scale(1.15)}
  .d-layer.active:hover{background:rgba(232,228,222,0.10)}
  .ev-body:hover{border-color:var(--border2);background:#1A1A1F}
  .ev-body:hover .ev-head::before{border-color:rgba(232,228,222,0.32)}
  .ev-body:hover .ev-head::after{border-color:var(--text-h)}
  .ev-body:hover .ev-title{color:#FFFFFF}
  .ev-expall:hover{color:var(--text-h);border-color:rgba(232,228,222,0.32);background:rgba(232,228,222,0.06)}
  .ev-src a:hover{color:var(--text-h);text-decoration-color:rgba(232,228,222,0.5)}
  .d-cover-credit a:hover{color:var(--text2);text-decoration-color:rgba(232,228,222,0.5)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>

<script>
const DATA = [{"slug":"business-advertising-100","title":"広告業界の100年","description":"1922年のラジオCMからCookie廃止の撤回まで、広告の100年をメディアと技術・広告産業とクリエイティブ・社会と規制の3層でたどります。媒体が変わるたびに、注意の売り方とルールが作り直されてきたことを、広告を見せられてきた側の目線で眺める年表です。","category":"business","language":"ja","start_year":1922,"end_year":2024,"layers":[{"name":"メディアと技術","color":"blue"},{"name":"広告産業とクリエイティブ","color":"orange"},{"name":"社会と規制","color":"teal"}],"events":[{"date":"1922-08-28","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"米WEAFで最初期の有料ラジオ広告放送","summary":"ニューヨークのラジオ局WEAFが、不動産会社クイーンズボロ・コーポレーションの宣伝放送を有料で流しました。約10分の告知で、料金は50ドルだったと伝えられています。\n\n「世界初のラジオ広告」とされることが多いものの、先行事例を挙げる研究もあります。**電波が広告を家庭の居間まで運んだ**ことで、広告は紙面ではなく時間を買うものへ変わり、放送メディアの収益モデルが生まれました。","detail":null,"credibility":"disputed","credibility_note":"「世界初のラジオ広告」という位置づけには諸説があり、放送時間・料金も資料により記述が異なります。","sources":[{"title":"Wikipedia: WEAF (歴史的放送局) およびラジオ広告史の各種資料","url":null}]},{"date":"1923-01-01","precision":"year","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"ニールセン創業、「測定」の産業が始まる","summary":"アーサー・C・ニールセンが米国で市場調査会社を創業しました。のちにラジオの聴取率、テレビの視聴率測定へ進出し、広告取引の共通通貨となる指標を提供していきます。\n\n「どれだけの人が見たか」を第三者が数字にする仕組みは、広告枠の値段を決める土台になりました。約70年後にバナー広告(メディアと技術レイヤー)が持ち込むクリック測定も、この延長線上にあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Nielsen Holdings","url":"https://en.wikipedia.org/wiki/Nielsen_Holdings"}]},{"date":"1941-07-01","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"世界初のテレビCM、ブローバの時計広告","summary":"米NBC系のWNBTで、時計メーカー・ブローバの広告が放送されました。野球中継の前に流れた短い映像で、料金は9ドルだったとされています。商業テレビ放送が認可された初日の出来事でした。\n\n以後半世紀にわたり、テレビは広告費の最大の受け皿として広告産業の構造を決めていきます。クリエイティブ革命(広告産業とクリエイティブレイヤー)も、テレビとグラフィック広告の黄金期に起きることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bulova","url":"https://en.wikipedia.org/wiki/Bulova"}]},{"date":"1957-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と規制","title":"『かくれた説得者』が広告批判の古典に","summary":"ジャーナリストのヴァンス・パッカードが『かくれた説得者』を刊行し、深層心理を突く広告手法を批判的に描いてベストセラーになりました。\n\n広告への社会的な警戒が、はじめて大衆的な言葉になった画期です。のちのタバコ広告規制やサブリミナル批判の下地になりました。広告産業が自らの手法を語る言葉を持つより先に、見せられる側の批判の言葉のほうが広まった点は示唆的です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Hidden Persuaders","url":"https://en.wikipedia.org/wiki/The_Hidden_Persuaders"}]},{"date":"1959-01-01","precision":"year","end_date":"1969-12-31","type":"period","layer":"広告産業とクリエイティブ","title":"クリエイティブ革命","summary":"DDBのビル・バーンバックらを中心に、コピーライターとアートディレクターを対等に組ませ、誇張ではなく機知と正直さで語る広告表現の刷新が米国で進みました。\n\nフォルクスワーゲンやエイビスのキャンペーンが代表例で、広告が文化として語られ、批評される時代が始まります。期間の区切りは概説によって異なりますが、テレビ(メディアと技術レイヤー)の普及期と重なっている点が本質です。","detail":null,"credibility":"unverified","credibility_note":"「クリエイティブ革命」の期間区分は論者により異なるため、1960年代全般とする概説に依拠しました。","sources":[{"title":"Wikipedia: Creative revolution","url":"https://en.wikipedia.org/wiki/Creative_revolution"}]},{"date":"1959-01-01","precision":"year","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"VW「Think Small」キャンペーン開始","summary":"DDBがフォルクスワーゲン・ビートルの広告「Think Small」を展開しました。小ささを欠点ではなく美点として正直に語る手法で、のちに広告史上最高のキャンペーンとの評価を受けます。\n\n大きな車が当たり前だった米国で、自虐的なユーモアを使った点が革新で、クリエイティブ革命の代表作になりました。なお掲載開始の年については、1959年とする資料と1960年とする資料があります。","detail":null,"credibility":"disputed","credibility_note":"キャンペーンの開始年は1959年とも1960年ともされ、資料により記述が分かれます。","sources":[{"title":"Wikipedia: Think Small","url":"https://en.wikipedia.org/wiki/Think_Small"}]},{"date":"1971-01-02","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"米国でタバコのテレビ・ラジオ広告禁止","summary":"公衆衛生タバコ喫煙法の施行により、米国のテレビ・ラジオでのタバコ広告が禁止されました。最後のCMは前夜の年越し番組の枠で流れています。\n\nテレビ広告の大口出稿者を法律が締め出した初の大型規制で、広告が公衆衛生政策の対象になりました。**何を広告してよいかを社会が決める**時代の始まりで、以後、規制の対象は酒類・医薬品・子ども向け広告へと広がっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Public Health Cigarette Smoking Act","url":"https://en.wikipedia.org/wiki/Public_Health_Cigarette_Smoking_Act"}]},{"date":"1984-01-22","precision":"day","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"Apple「1984」、スーパーボウルCMの伝説","summary":"スーパーボウル中継で、AppleがMacintosh発売を予告するCM「1984」を放送しました。リドリー・スコット監督による約60秒の映像は、製品をほとんど見せないまま強烈な印象を残します。\n\nスーパーボウルを広告の檜舞台へ変えた転換点とされ、CM自体がニュースとして報じられる「広告のイベント化」が始まりました。見る側にとってもCMが話の種になる、テレビ広告の演出力が頂点に達した時期を象徴する作品です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1984 (advertisement)","url":"https://en.wikipedia.org/wiki/1984_(advertisement)"}]},{"date":"1986-04-01","precision":"month","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"オムニコム誕生、メガエージェンシー時代へ","summary":"米広告大手BBDO、DDB、ニーダム・ハーパーの3社統合によるオムニコム・グループの設立が発表され、業界で「ビッグバン」と呼ばれました。\n\n同じ時期に英国ではサーチ&サーチが買収を重ねて世界最大手に躍り出ており、広告会社は世界規模の持株会社へ再編されていきます。クリエイティブの工房だった広告会社が、資本市場で評価される産業へ変わった画期でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Omnicom Group","url":"https://en.wikipedia.org/wiki/Omnicom_Group"}]},{"date":"1994-10-27","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"HotWiredに世界初のバナー広告","summary":"米ウェブメディアHotWiredに、AT&Tなどのバナー広告が掲載されました。ウェブ広告の事実上の始まりとされ、AT&Tのバナーのクリック率は44%に達したと伝えられています。\n\n**クリックという行動の測定**ができるようになったことで、広告の効果は推定から計測へ移り始めました。ニールセン以来の「視聴の通貨」(広告産業とクリエイティブレイヤー)とは別の、行動データに基づく取引の系譜がここから始まります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Web banner","url":"https://en.wikipedia.org/wiki/Web_banner"}]},{"date":"2000-10-23","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"Google AdWords開始","summary":"Googleがセルフサービス型の検索連動広告AdWordsを始めました。当初は表示回数課金で、2002年にクリック課金とオークション制へ移行します。\n\n**検索の意図に対して広告枠を競売にかける**仕組みは、その後の広告費の流れを根本から変えました。ドットコムバブル崩壊(2000年)の直後に、バナーの露出販売ではなく、調べものという意図への課金が生き残った点は示唆的です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google プレスリリース: Google Launches Self-Service Advertising Program (2000-10-23)","url":null}]},{"date":"2007-04-13","precision":"day","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"GoogleがDoubleClickを31億ドルで買収","summary":"Googleがアドテク大手DoubleClickを31億ドルで買収すると発表しました。検索広告に加えて、ディスプレイ広告の配信基盤まで手中に収めることになります。\n\nMicrosoftらも買収を競った末の決着で、広告産業の主役が代理店からプラットフォームへ移る転機になりました。この統合が生むデータ集中と寡占への懸念は、のちのGDPR(社会と規制レイヤー)や各国の競争法調査の伏線です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DoubleClick","url":"https://en.wikipedia.org/wiki/DoubleClick"}]},{"date":"2007-11-06","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"Facebook Ads発表、ソーシャル広告の起点","summary":"Facebookが広告プラットフォーム「Facebook Ads」を発表しました。友人の購買行動を広告として流すBeaconも同時に発表されましたが、こちらは強い反発を受けて撤回に追い込まれます。\n\n友人関係と属性データによるターゲティングは、検索連動と並ぶデジタル広告の二本柱になりました。Beaconの失敗は、自分の買い物が広告に使われることへの抵抗感という、10年後の論争(社会と規制レイヤー)を先取りしていました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Facebook: Facebook Unveils Facebook Ads (2007-11-06)","url":null}]},{"date":"2013-03-01","precision":"month","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"電通がイージス買収を完了","summary":"電通が英広告グループのイージスを約4000億円で買収し、手続きを完了しました。日本の広告会社による過去最大級の海外買収です。\n\nデジタル領域と海外市場への対応を一気に進める狙いで、国内最大手が「日本のメディア枠の販売」を軸とする事業構造から抜け出す転換点になりました。世界の広告産業が、データとデジタル運用へ再編されていく流れの一部です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"電通 ニュースリリース: イージス・グループ買収完了(2013年3月)","url":null}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"GDPR施行、ターゲティング広告に規制の網","summary":"EUの一般データ保護規則(GDPR)が施行され、個人データの処理に同意などの法的根拠と高額の制裁金が定められました。行動ターゲティング広告は最大の影響領域になります。\n\n**同意が広告取引の前提条件になった**ことで、同意管理ツールの普及や文脈連動広告への回帰が起きました。サイトを開くたびに同意を尋ねられるあの画面は、プラットフォームへのデータ集中(広告産業とクリエイティブレイヤー)に規制が対抗する構図の、身近な表れです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2016/679 (GDPR)","url":"https://eur-lex.europa.eu/eli/reg/2016/679/oj"}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と規制","title":"日本でネット広告費がテレビを初めて逆転","summary":"電通「日本の広告費」の推計で、2019年のインターネット広告費が2兆1048億円となり、テレビメディア広告費を初めて上回りました。\n\n1975年にテレビが新聞を抜いて以来の首位交代で、運用型広告が主流になった市場構造の変化を確定させました。ラジオからテレビ、テレビからネットへと、私たちが時間を使う場所を追いかけて、媒体の主役はおよそ半世紀の周期で交代しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"電通「2019年 日本の広告費」(2020年3月発表)","url":null}]},{"date":"2021-04-26","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"AppleがATT導入、追跡に本人許可を必須化","summary":"AppleがiOS 14.5でApp Tracking Transparency(ATT)を導入し、アプリをまたぐトラッキングにユーザーの明示的な許可を必須にしました。\n\n許可率は低い水準にとどまり、Metaは2022年の減収要因として約100億ドルの影響を公表しています。規制当局ではなく**プラットフォームが事実上の規制者になる**構図を示した出来事で、広告の効果測定は確率的な推定へ後退しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: App Tracking Transparency","url":"https://en.wikipedia.org/wiki/App_Tracking_Transparency"}]},{"date":"2022-02-03","precision":"day","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"Amazon、広告事業を初めて区分開示","summary":"Amazonが決算で広告事業の売上を初めて区分開示し、2021年通年で約312億ドルに達していたことが分かりました。\n\n購買データと「買う直前」の顧客接点を持つ小売業者が広告の売り手になる、リテールメディアの存在感を裏付けた数字です。Cookie規制やATT(社会と規制レイヤー)で外部データが細るなか、自社データを持つ事業者へ広告費が移る流れを象徴しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon.com Q4 2021 Earnings Release (2022-02-03)","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"生成AIが広告制作に入る","summary":"Metaが広告主向けに、生成AIで広告文や背景画像を作る「AI Sandbox」を発表するなど、生成AIによる広告制作の自動化が業界全体の動きになりました。\n\nコピーとビジュアルの制作をアルゴリズムが担うことは、クリエイティブ革命以来の「人の技」という前提を揺るがします。ただし効果や普及の実態は各社の発表ベースで、私たちが目にする広告がどこまで変わったのか、評価が定まるのはこれからです。","detail":null,"credibility":"unverified","credibility_note":"生成AIによる広告制作の効果・普及度は各社の発表ベースで、第三者による検証は確立していません。","sources":[{"title":"Meta: AI Sandbox発表(2023年5月)ほか各社発表","url":null}]},{"date":"2024-07-22","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"GoogleがサードパーティCookie廃止を撤回","summary":"GoogleがChromeにおけるサードパーティCookie廃止計画の撤回を発表しました。2020年の廃止表明から4年、3度の延期を経た方針転換です。\n\n廃止は代替技術Privacy Sandboxをめぐる競争上の懸念から英競争当局の監視下にあり、プライバシー保護と競争政策の板挟みが表面化しました。私たちを追いかける技術の行方が一企業の判断に委ねられていること自体が、規制側の新しい論点になっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google Privacy Sandbox: A new path for Privacy Sandbox on the web (2024-07-22)","url":null}]}]},{"slug":"business-b2b-saas","title":"B2B SaaSの勃興","description":"Salesforce創業の「No Software」からSaaSバブルと調整、AIエージェント時代まで。プロダクト・資本市場・導入と商習慣の3つの層で、業務ソフトが所有から利用へ変わった四半世紀を追いかけます。浮き沈みの両方を、次の挑戦のために記録する年表です。","category":"business","language":"ja","start_year":1999,"end_year":2025,"layers":[{"name":"プロダクトと企業","color":"blue"},{"name":"資本市場","color":"orange"},{"name":"導入と商習慣","color":"teal"}],"events":[{"date":"1999-03-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"Salesforce創業、「No Software」を掲げる","summary":"マーク・ベニオフらがSalesforceを創業し、業務ソフトをインストール不要のWebサービスとして月額課金で提供するモデルを打ち出しました。「No Software」を掲げた、パッケージ販売への挑戦宣言です。\n\n**所有から利用へ**という転換の出発点であり、後にSaaSと呼ばれる事業モデルの原型になりました。収益が一括販売から継続課金へ変わることで、資本市場の評価軸(資本市場レイヤー)も後年書き換えられていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Salesforce","url":"https://en.wikipedia.org/wiki/Salesforce"}]},{"date":"2004-06-23","precision":"day","end_date":null,"type":"point","layer":"資本市場","title":"SalesforceがNYSE上場","summary":"Salesforceがニューヨーク証券取引所に上場しました。継続課金型の企業向けソフト企業として資本市場に受け入れられ、SaaSという事業モデルの妥当性を示す試金石になった上場です。\n\n当時は先行投資で赤字が続く継続課金モデルを評価する物差しが定まっていませんでした。解約率やLTVといったSaaS固有の指標が投資家に浸透するのは、この後の10年をかけてのことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Salesforce","url":"https://en.wikipedia.org/wiki/Salesforce"}]},{"date":"2006-03-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"AWSがS3を公開、クラウドインフラ時代へ","summary":"AmazonがストレージサービスS3を公開し、同年には仮想サーバーのEC2も登場しました。サーバーを買わずに従量課金で計算資源を使えるクラウドインフラが、実用段階に入った年です。\n\n自前でデータセンターを持てない小さなチームでもSaaSを立ち上げられるようになり、起業のコストが劇的に下がりました。2010年代のSaaSスタートアップ急増と資本流入(資本市場レイヤー)を支える土台です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon S3","url":"https://en.wikipedia.org/wiki/Amazon_S3"}]},{"date":"2011-08-20","precision":"day","end_date":null,"type":"point","layer":"資本市場","title":"「ソフトウェアが世界を飲み込む」論考","summary":"投資家マーク・アンドリーセンがウォール・ストリート・ジャーナル紙に「Why Software Is Eating the World」を寄稿し、あらゆる産業の中核企業がソフトウェア企業に置き換わると論じました。\n\nクラウド(プロダクトと企業レイヤーのAWS)とスマートフォンの普及を背景に、ベンチャー資本が業務ソフトへ本格的に向かう転換点とされます。以後、SaaSはベンチャー投資の主要カテゴリーになっていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Marc Andreessen, \"Why Software Is Eating the World\" (WSJ, 2011-08-20)","url":"https://a16z.com/why-software-is-eating-the-world/"}]},{"date":"2012-07-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"クラウド会計のfreeeが創業","summary":"佐々木大輔がクラウド会計ソフトのfreeeを創業しました(サービス公開は翌2013年3月)。銀行口座やカードの明細と連携して記帳を自動化する発想で、中小企業の会計業務をクラウドへ移し始めます。\n\n日本のSaaSは会計・人事労務など**バックオフィスの自動化**から立ち上がりました。税理士や商習慣と深く関わる領域だけに、導入と商習慣レイヤーの制度変化が普及の追い風になっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"freee株式会社 会社情報・沿革","url":null}]},{"date":"2014-02-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"Slack一般公開、ボトムアップ導入の型を作る","summary":"ゲーム開発の社内ツールから生まれたSlackが一般公開され、メール中心だった社内コミュニケーションをチャンネル型チャットへ置き換え始めました。公開初年度から利用者が急増しています。\n\nまず現場のチームが無料で使い始め、後から会社契約に広がる「ボトムアップ導入」というSaaS特有の普及経路を確立した点が大きいと思います。導入と商習慣レイヤーのテレワーク転換で需要が爆発する伏線です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Slack (software)","url":"https://en.wikipedia.org/wiki/Slack_(software)"}]},{"date":"2015-02-01","precision":"month","end_date":null,"type":"point","layer":"資本市場","title":"「T2D3」提唱、SaaS成長指標が共通言語に","summary":"米VC Battery Venturesのニーラジ・アグラワルが、ARRを3倍・3倍・2倍・2倍・2倍と5年で伸ばす「T2D3」という成長モデルを提唱し、SaaS企業の成長目標として広く参照されるようになりました。\n\nARR・解約率・NRRといったSaaS固有の指標体系が投資判断の共通言語になった時期です。**成長速度そのものを企業価値とみなす**評価文化が、後のバブルと調整(同レイヤー)の下地を作っていきました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Neeraj Agrawal, \"The SaaS Adventure\" (TechCrunch, 2015)","url":null}]},{"date":"2019-04-01","precision":"day","end_date":null,"type":"point","layer":"導入と商習慣","title":"働き方改革関連法施行、HR SaaSの追い風に","summary":"残業時間の罰則付き上限規制や年5日の有給取得義務が始まり、労働時間の客観的な把握が企業に求められるようになりました。\n\n勤怠管理や人事労務のSaaS導入を法制度が直接後押しした形で、SmartHRなどHR領域の急成長(資本市場レイヤー)の背景になります。日本のSaaSが**制度対応を入口に広がる**構図を示す、わかりやすい例だと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「働き方改革関連法の概要」","url":null}]},{"date":"2019-06-19","precision":"day","end_date":null,"type":"point","layer":"資本市場","title":"Sansan上場、国内SaaS上場ラッシュの先駆け","summary":"名刺管理サービスのSansanが東証マザーズに上場し、同年12月にはfreeeも続きました。国内SaaSの上場が相次ぎ、「SaaS株」がひとつの投資カテゴリーとして意識され始めます。\n\nARRや解約率を開示する日本企業が増え、T2D3など米国流の評価指標(同レイヤー)が国内にも定着していきました。赤字のまま成長投資を続ける経営が日本市場で受け入れられるかを試す、試金石のような上場でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Sansan株式会社「東京証券取引所マザーズ上場に関するお知らせ」(2019-06-19)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"導入と商習慣","title":"テレワーク急拡大で業務SaaSの導入が加速","summary":"新型コロナで在宅勤務が広がり、Zoom・Slack・電子契約など業務SaaSの導入が一気に進みました。Zoomは1日あたりの会議参加者が前年の10倍を超える3億人に達したと発表しています。\n\n「まず現場が使う」ボトムアップ導入(プロダクトと企業レイヤー)が危機対応として正当化され、稟議や対面を前提とする商習慣が崩れました。SaaS株への資金流入(資本市場レイヤー)もここから過熱していきます。","detail":null,"credibility":"disputed","credibility_note":"Zoomの「1日3億人」は延べ参加者数の自社発表です。当初「利用者数」と表記して後に訂正された経緯もあり、数値の解釈には注意が要ります。","sources":[{"title":"Zoom公式ブログ発表(2020年4月)および各社報道","url":null}]},{"date":"2020-11-01","precision":"month","end_date":null,"type":"point","layer":"導入と商習慣","title":"押印廃止の方針で電子契約が急速に普及","summary":"政府が行政手続の押印を原則廃止する方針を打ち出し、民間でも電子契約サービスの導入が急速に進みました。クラウドサインなど国内サービスの導入社数がこの前後で急増しています。\n\n「ハンコを押すために出社する」という象徴的な非効率が、世論の後押しで崩れた局面です。紙と対面を前提としてきた日本の商習慣の転換が、制度の側から一気に進んだ事例だと思います。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府「押印を求める行政手続の見直し」(2020年)","url":null}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"資本市場","title":"SmartHRが約156億円のシリーズD調達","summary":"人事労務SaaSのSmartHRが約156億円のシリーズD資金調達を発表しました。評価額は約1700億円とされ「ユニコーン」入りと報じられた、国内SaaSでは突出した規模の調達です。\n\n低金利下で高成長企業に資金が集まる世界的な潮流が、日本のSaaSにも届いたことを示しています。評価額は自社・報道ベースの数値で、翌年以降の金利上昇局面(同レイヤー)では未上場企業の評価の妥当性が問われていきます。","detail":null,"credibility":"unverified","credibility_note":"調達額は自社発表、評価額約1700億円は報道ベースの推定で、第三者による確定的な開示はありません。","sources":[{"title":"SmartHR プレスリリース「シリーズDで約156億円の資金調達を実施」(2021年6月)","url":null}]},{"date":"2022-01-01","precision":"month","end_date":"2022-12-31","type":"period","layer":"資本市場","title":"金利上昇でSaaS株が世界的に急落","summary":"米国の急速な利上げを受け、高成長・赤字容認で買われてきたSaaS株が世界的に急落しました。米国のクラウド株指数は年間で半値近くに沈み、国内SaaS株も軒並み大幅安となっています。\n\n**成長一辺倒から採算重視へ**と評価軸が転換し、成長率と利益率の合計をみる「40%ルール」など効率性指標が再び重視されました。各社は人員削減と黒字化を迫られ、プロダクトレイヤーではAIへの再投資が始まります。","detail":null,"credibility":"disputed","credibility_note":"下落率は参照する指数・銘柄・期間の取り方によって大きく異なり、「半値」という水準は代表的なクラウド株指数に基づく概数です。","sources":[{"title":"BVP Nasdaq Emerging Cloud Indexの推移および各社報道","url":null}]},{"date":"2023-03-16","precision":"day","end_date":null,"type":"point","layer":"プロダクトと企業","title":"Microsoft 365 Copilot発表、SaaSにAIを実装","summary":"MicrosoftがWordやExcelなどに生成AIを組み込むMicrosoft 365 Copilotを発表しました。既存SaaSにAIを載せる路線が業界標準となり、SalesforceやNotionなど各社が一斉に追随します。\n\nGPT-4公開のわずか2日後という時期は、基盤モデルの進化が業務ソフトの機能競争に直結し始めたことを物語っています。AI機能が既存SaaSの価格体系と競争力を再定義していく、その局面の始まりでした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft Official Blog: Introducing Microsoft 365 Copilot (2023-03-16)","url":"https://blogs.microsoft.com/blog/2023/03/16/introducing-microsoft-365-copilot-your-copilot-for-work/"}]},{"date":"2024-07-19","precision":"day","end_date":null,"type":"point","layer":"導入と商習慣","title":"CrowdStrike障害、クラウド依存のリスク露呈","summary":"セキュリティ企業CrowdStrikeの更新プログラムの不具合により、世界で約850万台のWindows端末が起動不能となり、航空・医療・金融などの業務が広範囲で止まりました。\n\n特定のクラウドサービスへの依存が、社会全体の単一障害点になりうることを史上最大級の規模で示した事例です。SaaS前提の業務設計に対して、依存先の集中リスクという重い論点を突きつけました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft公式ブログによる影響台数の推計(2024-07-20)および各社報道","url":null}]},{"date":"2024-09-01","precision":"month","end_date":null,"type":"point","layer":"導入と商習慣","title":"Klarna CEOの「SaaS解約」発言が波紋","summary":"決済企業KlarnaのCEOが、自社開発のAIシステムでSalesforceやWorkdayの利用をやめると発言し、「AIはSaaSを不要にするのか」という議論を業界全体に呼び起こしました。\n\n発言はその後軌道修正が報じられ、実態には諸説あります。それでもAIエージェント(プロダクトと企業レイヤー)が**SaaSの存在意義を問い直す**時代の空気を象徴する出来事として、繰り返し引用され続けています。","detail":null,"credibility":"disputed","credibility_note":"発言の内容と実際の解約範囲は報道ベースで、後にCEO自身が発言を部分的に修正したとされるなど、実態は確定していません。","sources":[{"title":"Reuters等によるKlarna CEO発言の報道(2024年9月)","url":null}]},{"date":"2024-09-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"SalesforceがAgentforce発表、エージェントへ","summary":"SalesforceがAIエージェント基盤Agentforceを発表し、人が画面を操作するSaaSから、AIが業務そのものを代行するエージェントへの転換を打ち出しました。\n\nSaaSの代名詞だった企業自身がエージェント化を主導する点が象徴的です。席数課金から実行回数・成果に応じた課金への移行を含め、四半世紀続いたSaaSの事業モデル自体が再設計され始めたことを感じさせます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Salesforce プレスリリース: Agentforce発表(Dreamforce 2024)","url":null}]},{"date":"2025-01-01","precision":"year","end_date":null,"type":"point","layer":"導入と商習慣","title":"国内SaaS市場、1兆円超えの推計が定着","summary":"民間調査各社が国内SaaS市場を1兆円超の規模と推計するようになり、業務ソフトの新規導入はクラウドが前提という状況が定着しました。\n\n推計値は調査会社によって定義も数値も異なり幅があります。それでも、四半世紀前に「No Software」(プロダクトと企業レイヤー)が掲げた**所有から利用への転換**が、日本の商習慣としても既定路線になったことを示す指標だと思います。","detail":null,"credibility":"unverified","credibility_note":"市場規模はSaaSの定義や集計範囲が調査会社ごとに異なる推計値であり、公的統計による裏付けはない。","sources":[{"title":"富士キメラ総研・ITR等の国内SaaS市場調査","url":null}]}]},{"slug":"business-coffee-industry","title":"コーヒー産業の変遷","description":"缶コーヒーの発明からサードウェーブ、気候変動と歴史的な価格高騰まで。企業とチェーン・生産と流通・消費と文化の3層で、毎日の一杯の裏にある産業構造の変化を、飲む側の目線から追いかける年表です。","category":"business","language":"ja","start_year":1969,"end_year":2025,"layers":[{"name":"企業とチェーン","color":"orange"},{"name":"生産と流通","color":"green"},{"name":"消費と文化","color":"gold"}],"events":[{"date":"1969-01-01","precision":"year","end_date":null,"type":"point","layer":"消費と文化","title":"UCCがミルク入り缶コーヒーを発売","summary":"UCC上島珈琲がミルク入り缶コーヒーを発売しました。いつでもどこでも飲める形は自動販売機の普及とともに広がり、日本独自のコーヒー消費文化を作っていきます。\n\n「世界初の缶コーヒー」とされることが多いものの、先行商品を挙げる説もあります。いずれにせよ、コーヒーを喫茶店の飲み物から**日常の習慣に変えた**発明であり、家庭の外での消費を数十年にわたって支えました。","detail":null,"credibility":"disputed","credibility_note":"「世界初の缶コーヒー」については、先行する地方メーカーの商品を挙げる説があり、定義によって見解が分かれます。","sources":[{"title":"UCC上島珈琲 会社沿革","url":null}]},{"date":"1971-01-01","precision":"year","end_date":null,"type":"point","layer":"企業とチェーン","title":"スターバックスがシアトルで創業","summary":"シアトルのパイクプレイス市場の近くでスターバックスが創業しました。当初は焙煎豆を売る小売店で、のちにハワード・シュルツの合流を経てエスプレッソバー業態へ転換していきます。\n\n産地や焙煎に踏み込む「第二の波」と呼ばれるシアトル系コーヒー文化の源流で、コーヒーを豆の販売から**体験を売る業態**へ変えました。四半世紀後の日本上陸(同レイヤー)で、日本の喫茶市場も塗り替えることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Starbucks","url":"https://en.wikipedia.org/wiki/Starbucks"}]},{"date":"1980-04-01","precision":"month","end_date":null,"type":"point","layer":"企業とチェーン","title":"ドトールコーヒーショップ1号店が原宿に開店","summary":"ドトールコーヒーショップの1号店が原宿に開店しました。立ち飲み形式で1杯150円という安さを実現し、セルフサービス式のコーヒーチェーンという業態を日本に定着させます。\n\n外食チェーン化の波をコーヒーに持ち込んだ存在で、従来の喫茶店とは違う「早い・安い」という軸を作りました。出勤前にさっと一杯という習慣を支え、スターバックスが上陸するまで、日本のチェーンコーヒーの標準形であり続けます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ドトールコーヒー 会社沿革","url":null}]},{"date":"1989-07-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"国際コーヒー協定の経済条項が失効","summary":"輸出割当で国際価格を支えてきた国際コーヒー協定(ICA)の経済条項が失効し、コーヒーは市場価格に委ねられる時代に入りました。価格は長い下落局面へ向かいます。\n\n生産国の収入は不安定になり、1990年代末からの「コーヒー危機」(同レイヤー)の遠因になりました。一方で安い豆が安定して手に入ることは、消費国でのチェーン拡大(企業とチェーンレイヤー)を支える裏面でもあったのです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: International Coffee Agreement","url":"https://en.wikipedia.org/wiki/International_Coffee_Agreement"}]},{"date":"1996-08-02","precision":"day","end_date":null,"type":"point","layer":"企業とチェーン","title":"スターバックス日本1号店が銀座に開店","summary":"スターバックスが北米以外で初となる店舗を東京・銀座に開きました。全席禁煙の店内とエスプレッソドリンクという新しい様式で、若い世代や女性のお客を喫茶市場に呼び込みます。\n\n家庭でも職場でもない「サードプレイス」という空間の売り方が持ち込まれ、国内チェーン(同レイヤーのドトール等)との競争軸は価格から体験へ広がりました。日本のカフェブームの起点とされる出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"スターバックス コーヒー ジャパン 会社概要・沿革","url":null}]},{"date":"1997-01-01","precision":"year","end_date":null,"type":"point","layer":"生産と流通","title":"フェアトレード認証の国際組織FLOが設立","summary":"各国のフェアトレード認証団体を束ねる国際組織FLO(現Fairtrade International)が設立され、統一基準と共通の認証ラベルの仕組みが整いました。コーヒーはその中心的な対象産品です。\n\n価格下落に苦しむ生産者への最低価格保証を、援助ではなく市場の仕組みとして制度化した試みでした。店頭でラベルを見て選ぶという形で、消費側の倫理的な関心(消費と文化レイヤー)を買い物の行動につなぐ回路を作っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Fairtrade International","url":"https://en.wikipedia.org/wiki/Fairtrade_International"}]},{"date":"1999-01-01","precision":"year","end_date":"2004-12-31","type":"period","layer":"生産と流通","title":"国際価格が暴落、「コーヒー危機」","summary":"ベトナムの急速な増産などで供給過剰となり、国際価格が多くの産地で生産コストを下回る水準まで暴落しました。中米やアフリカの小規模農家が離農や転作を迫られる「コーヒー危機」です。\n\nICA体制の崩壊(同レイヤー)後の自由市場が、生産者に最も過酷に働いた局面でした。フェアトレードやスペシャルティコーヒーといった、**価格以外の価値**を豆に付ける動きを加速させることになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際コーヒー機関(ICO)の価格統計および関連研究","url":null}]},{"date":"2002-01-01","precision":"year","end_date":null,"type":"point","layer":"消費と文化","title":"「サードウェーブ」という言葉が生まれる","summary":"米国の焙煎業界誌への寄稿で、焙煎士トリッシュ・ロスギブが「サードウェーブ」という言葉を使い、豆の個性や淹れ方に向き合う新しい潮流を、先行する二つの波と区別して名付けました。\n\n言葉の初出時期や定義には諸説あります。それでも、大量消費の第一波、シアトル系チェーンの第二波(企業とチェーンレイヤー)に対して、産地・精製・抽出を語る文化に名前が付いた意味は大きいものでした。","detail":null,"credibility":"disputed","credibility_note":"言葉の初出は2002〜2003年の業界誌寄稿とされますが、時期や「誰が最初か」については諸説あります。","sources":[{"title":"Trish Rothgeb寄稿(The Flamekeeper, Roasters Guild)に関する記録","url":null}]},{"date":"2013-01-01","precision":"month","end_date":null,"type":"point","layer":"企業とチェーン","title":"セブンカフェ開始、コンビニコーヒーが市場に","summary":"セブン-イレブンが1杯100円のいれたてコーヒー「セブンカフェ」の全国展開を始め、初年度に4億5000万杯を販売したとされています。コンビニコーヒーという大きな市場が一気に立ち上がりました。\n\n販売杯数は自社発表ベースですが、100円で挽きたてが飲めるという体験は、缶コーヒー(消費と文化レイヤー)や低価格チェーンの需要を侵食し、日常の一杯をどこで買うかという勢力図を塗り替えました。","detail":null,"credibility":"unverified","credibility_note":"初年度4億5000万杯という販売数はセブン&アイの自社発表で、第三者統計による検証はありません。","sources":[{"title":"セブン&アイ・ホールディングス「セブンカフェ」に関する発表資料","url":null}]},{"date":"2015-02-06","precision":"day","end_date":null,"type":"point","layer":"消費と文化","title":"ブルーボトルコーヒーが清澄白河に日本上陸","summary":"米ブルーボトルコーヒーが海外初の店舗を東京・清澄白河に開きました。一杯ずつハンドドリップで淹れるスタイルが「サードウェーブの上陸」として大きく報じられ、開店当初は長い行列ができています。\n\n焙煎所を併設する立地選びやミニマルな店舗設計は広く真似され、国内でも自家焙煎ロースターの開業が相次ぎました。豆の産地や焙煎度を語る消費文化(同レイヤー)が、日本で一気に身近になった瞬間です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Blue Bottle Coffee","url":"https://en.wikipedia.org/wiki/Blue_Bottle_Coffee"}]},{"date":"2018-05-01","precision":"month","end_date":null,"type":"point","layer":"企業とチェーン","title":"ネスレがスタバ製品の販売権を71.5億ドルで取得","summary":"ネスレが、スターバックス製品を店舗の外で販売する永続的なライセンスを71億5000万ドルで取得すると発表しました。家庭用・小売市場で世界最大級のコーヒー連合が生まれます。\n\nカフェでの体験(店舗)と家で飲む一杯(小売)の境界が崩れ、巨大資本による寡占が進む象徴になりました。同じ年にはコカ・コーラによる英コスタの買収も発表され、世界のコーヒー業界の再編が一気に進んでいます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nestlé: Nestlé and Starbucks announce global coffee alliance (2018-05)","url":null}]},{"date":"2019-01-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"「コーヒー2050年問題」が業界共通の課題に","summary":"気候変動でアラビカ種の栽培適地が2050年までに大きく減るという研究が相次ぎ、野生のコーヒー種の6割に絶滅リスクがあるとする論文も発表されました。「コーヒー2050年問題」として広く知られるようになります。\n\n適地減少の数値は気候シナリオや研究により幅がありますが、耐候性品種の開発や産地の高地移転など、**供給の持続可能性**が業界共通の課題になり、大手チェーンの調達方針にも影響を与え始めました。","detail":null,"credibility":"disputed","credibility_note":"「適地半減」などの予測値は気候シナリオや研究手法によって幅があり、単一の確定した数値ではありません。","sources":[{"title":"Davis et al., \"High extinction risk for wild coffee species\" (Science Advances, 2019)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2023-05-01","type":"period","layer":"消費と文化","title":"コロナ禍、コーヒーを飲む場所が店から家へ","summary":"新型コロナで都市部のカフェは休業や時短を迫られ、一方で家にいる時間が増えたことで、家庭用レギュラーコーヒーや抽出器具の販売が伸びました。飲む場所が店から家へ大きく移った期間です。\n\nテイクアウトやモバイルオーダーへの投資が定着し、チェーン各社(企業とチェーンレイヤー)では店舗網の見直しも進みました。家で豆や淹れ方にこだわる人が増えたことは、サードウェーブ的な消費の裾野を広げています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"全日本コーヒー協会の統計および各社報道","url":null}]},{"date":"2021-07-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"ブラジル霜害でアラビカ先物価格が急騰","summary":"最大の産地ブラジルを数十年ぶりといわれる強い霜が襲い、翌年産以降の減産懸念からアラビカ先物価格が急騰しました。先行する干ばつとも重なり、供給不安が長引く入口になります。\n\n気候変動のリスク(同レイヤーの2050年問題)が、目の前の価格として表れた最初の大きな局面でした。のちの歴史的高値(同レイヤー)へ続く、需給逼迫の起点となった出来事です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"2021年7月のブラジル霜害とコーヒー先物価格に関するReuters等の報道","url":null}]},{"date":"2023-06-29","precision":"day","end_date":null,"type":"point","layer":"生産と流通","title":"EU森林破壊防止規則(EUDR)が発効","summary":"森林破壊に由来する産品のEU市場での流通を禁じる森林破壊防止規則(EUDR)が発効しました。コーヒーは対象品目で、輸入者には生産地の位置情報まで遡る証明が求められます。\n\n小規模農家が大半を占めるコーヒーでは対応コストの負担が重く、適用時期の延期が決まるなど混乱も続いています。**サプライチェーンの透明性**が貿易の条件そのものになったことを示す規制です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2023/1115 (EUDR)","url":"https://eur-lex.europa.eu/eli/reg/2023/1115/oj"}]},{"date":"2025-01-01","precision":"year","end_date":null,"type":"point","layer":"消費と文化","title":"国内で値上げが相次ぎ、消費の前提が揺らぐ","summary":"2024年からの生豆高騰と円安を受け、国内ではレギュラーコーヒーや缶コーヒー、チェーン各社の値上げが相次ぎました。業界統計では、国内消費量は頭打ちから微減傾向にあるとされています。\n\n消費量の統計は業界団体の推計ベースで幅がありますが、店頭で値札を見る目が変わったのは確かです。半世紀にわたり「安く日常的に飲める」ことを前提に築かれた日本のコーヒー文化(同レイヤーの缶コーヒー)が、価格局面の転換で試されています。","detail":null,"credibility":"unverified","credibility_note":"国内消費量の動向は全日本コーヒー協会などの推計に基づくもので、集計範囲により数値が異なります。","sources":[{"title":"全日本コーヒー協会「日本のコーヒーの飲用状況・統計資料」","url":null}]},{"date":"2025-02-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"アラビカ先物が名目で史上最高値を更新","summary":"ニューヨーク市場のアラビカ先物が1ポンド4ドルを超え、名目価格で史上最高値を更新しました。ブラジルの干ばつによる減産懸念と在庫の減少、規制対応コストが重なった構造的な高値とされます。\n\n名目では最高値ですが、実質価格では1977年の高騰に及ばないという指摘もあり、評価は分かれています。店頭価格への転嫁は世界で進み、**安いコーヒーの時代の終わり**が、私たち飲む側にも実感される局面になりました。","detail":null,"credibility":"disputed","credibility_note":"「史上最高値」は名目価格ベースの評価で、インフレ調整後の実質価格では過去の高騰期を下回るという指摘があります。","sources":[{"title":"2025年2月のアラビカ先物価格に関するReuters・Bloomberg等の報道","url":null}]}]},{"slug":"business-dx-japan","title":"DX推進の記録","description":"「2025年の崖」の警告からデジタル庁発足、生成AI活用まで。政策と制度・企業の現場・技術とサービスの3層を重ねて、日本のDXが掛け声から実装へ移る道のりを追う年表です。制度が動いたとき、働く現場で何が起きていたのかにも目を向けます。","category":"business","language":"ja","start_year":2018,"end_year":2025,"layers":[{"name":"政策と制度","color":"teal"},{"name":"企業の現場","color":"orange"},{"name":"技術とサービス","color":"blue"}],"events":[{"date":"2018-09-07","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"経産省「DXレポート」公表、2025年の崖を警告","summary":"経済産業省が「DXレポート」を公表し、既存システムの老朽化とIT人材不足を放置すれば2025年以降に年最大12兆円の経済損失が生じうると警告しました。いわゆる「2025年の崖」です。\n\n損失額は前提に幅のある試算ですが、この言葉が経営層への説得材料になり、**DXが経営課題として認知される起点**になりました。以後の政策と企業の現場の動きの多くが、この警告を参照して進んでいきます。","detail":null,"credibility":"disputed","credibility_note":"年最大12兆円という損失額は経産省の試算で、算定の前提や妥当性については有識者の間でも見解が分かれています。","sources":[{"title":"経済産業省「DXレポート ～ITシステム『2025年の崖』の克服とDXの本格的な展開～」(2018-09-07)","url":null}]},{"date":"2019-07-01","precision":"day","end_date":"2019-09-30","type":"period","layer":"企業の現場","title":"7payが不正アクセスで3か月で廃止","summary":"セブン&アイのスマホ決済7payが開始直後から不正アクセス被害を受け、サービス開始からわずか3か月で廃止されました。二段階認証の欠如など、基本的な設計の不備が指摘されています。\n\n大手小売のデジタル事業でも**セキュリティ軽視が事業の存続を左右する**ことを示した事例です。直後にキャッシュレス還元事業(政策と制度レイヤー)を控えた時期に、決済サービスへの信頼という課題を突きつけました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"セブン&アイ・ホールディングス「『7pay(セブンペイ)』サービス廃止のお知らせ」(2019-08-01)","url":null}]},{"date":"2019-10-01","precision":"day","end_date":"2020-06-30","type":"period","layer":"政策と制度","title":"キャッシュレス・ポイント還元事業","summary":"消費税率の引き上げと同時に、中小店舗でのキャッシュレス決済に最大5%を還元する国の事業が始まり、2020年6月末まで続きました。対象店舗は最終的に100万を超えています。\n\n決済事業者の加盟店開拓が一気に進み、QRコード決済の定着を後押ししました。直前の7pay問題(企業の現場レイヤー)で安全性への不安が残るなかでも、制度が消費者の行動を動かした事例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省「キャッシュレス・消費者還元事業」","url":null}]},{"date":"2020-04-07","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"緊急事態宣言でテレワークが急拡大","summary":"新型コロナの緊急事態宣言を機に、大企業を中心にテレワークへの移行が急速に進みました。東京都の調査では、都内企業の実施率が宣言前後で2倍超に上がったとされています。\n\n一方で現場では、押印のための出社、紙書類、VPNの容量不足という形で、**掛け声だけだったデジタル化の実力**が一斉に露呈しました。この経験が、デジタル庁設立(政策と制度レイヤー)への世論の追い風になります。","detail":null,"credibility":"disputed","credibility_note":"テレワーク実施率は調査主体・対象・時期により数値が大きく異なり、確定的な水準を示す統計はありません。","sources":[{"title":"東京都「テレワーク導入率調査結果」(2020年4月)","url":null}]},{"date":"2020-05-01","precision":"month","end_date":null,"type":"point","layer":"政策と制度","title":"特別定額給付金オンライン申請の混乱","summary":"一律10万円の特別定額給付金でマイナンバーカードによるオンライン申請が導入されましたが、自治体側の照合が手作業となり、郵送より遅い事態が生じました。オンライン受付を停止する自治体も相次いでいます。\n\n行政システムが縦割りでデータ連携できない実態を象徴する出来事となり、翌年のデジタル庁発足と自治体システム標準化を直接後押ししました。申請する側と処理する現場、双方に負担が集中した一件です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省「特別定額給付金」関連資料および各自治体の発表","url":null}]},{"date":"2020-12-28","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"DXレポート2、「9割がDX未着手か途上」","summary":"経産省がDXレポート2(中間取りまとめ)を公表し、9割超の企業がDXに未着手か一部での実施にとどまるとの調査結果を示しました。その上で、DXの本質はレガシー刷新ではなく企業文化の変革だと軌道修正しています。\n\nコロナ対応で問われたのは技術より変化への対応力だった、という整理です。最初のレポートが招いた「システム更改=DX」という誤解を、政策文書自身が正した形になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省「DXレポート2(中間取りまとめ)」(2020-12-28)","url":null}]},{"date":"2021-02-28","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"みずほ銀行で大規模システム障害","summary":"みずほ銀行で、ATMが通帳やカードを取り込んだまま停止する大規模障害が起きました。この年は障害が相次ぎ、金融庁が業務改善命令を出す事態に至っています。\n\n4000億円超を投じた勘定系システム刷新の完了後に起きた点が、重く受け止められました。**巨大レガシー刷新の難しさ**を象徴する事例として、「2025年の崖」の警告(政策と制度レイヤー)と併せて語られるようになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"金融庁「みずほ銀行及びみずほフィナンシャルグループに対する行政処分について」(2021-11-26)","url":null}]},{"date":"2021-09-01","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"デジタル庁が発足","summary":"行政のデジタル化を一元的に担うデジタル庁が発足しました。民間人材を大量に登用し、国と自治体の情報システムの統一・標準化やマイナンバー制度の普及を任務としています。\n\n給付金申請の混乱(同レイヤー)が生んだ世論を背景に、構想表明から1年足らずで設置されました。以後のガバメントクラウド選定(技術とサービスレイヤー)や保険証一体化は、この組織が進めていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁","url":"https://www.digital.go.jp/"}]},{"date":"2021-10-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"ガバメントクラウドにAWSとGoogle Cloudを選定","summary":"デジタル庁が、国・自治体の共通基盤となるガバメントクラウドの提供事業者として、AWSとGoogle Cloudを選定しました。国の基盤に海外クラウドのみが採用されたことは議論を呼んでいます。\n\n背景には、要件を満たす国内事業者が当時存在しなかったという事情がありました。**国産クラウドの不在**という論点を可視化し、2023年のさくらインターネット条件付き選定(同レイヤー)につながる伏線になります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁「ガバメントクラウド整備のためのクラウドサービスの提供に係る契約」(2021年度)","url":null}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"企業の現場","title":"パナソニック コネクトが生成AIを全社導入","summary":"パナソニック コネクトが、ChatGPTと同系のモデルを使う自社AIアシスタントを、国内大手として早い段階で全社員規模に導入したと発表しました。\n\n労働時間削減などの効果は自社発表ベースで、第三者検証はありません。それでも、ChatGPT公開(技術とサービスレイヤーの潮流)からわずか数か月で業務利用に踏み切った事例として注目され、大企業の生成AI導入が広がる先例になりました。","detail":null,"credibility":"unverified","credibility_note":"導入規模や業務効率化の効果は同社の発表に基づく数値で、第三者による検証はありません。","sources":[{"title":"パナソニック コネクト プレスリリース「AIアシスタントサービスの国内全社員への展開」(2023年2月)","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"サイバーエージェントが日本語LLMを公開","summary":"サイバーエージェントが、日本語に特化した大規模言語モデルOpenCALMを商用利用可能なライセンスで公開しました。国内企業による基盤モデル公開の、先駆けの一つです。\n\n海外製モデルへの依存が課題とされるなかで、国内でもモデルの開発・公開が始まったことを示しています。政府も国産基盤モデルの開発支援(政策と制度レイヤー)に動き、DXの論点が生成AIの活用へ移っていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"サイバーエージェント プレスリリース「独自の日本語LLM(大規模言語モデル)を一般公開」(2023年5月)","url":null}]},{"date":"2023-10-01","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"インボイス制度が開始","summary":"消費税の適格請求書等保存方式(インボイス制度)が始まり、請求書の記載要件と保存義務が変わりました。企業規模を問わず、経理・請求の現場が業務の見直しを迫られています。\n\n制度対応の必要が会計・請求SaaSの導入を強力に後押しし、中小企業にとってはデジタル化の入口になりました。**制度対応が実装を強制する**という、日本のDXに繰り返し現れる構図の典型例です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国税庁「インボイス制度の概要」","url":null}]},{"date":"2023-10-10","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"全銀システムで初の大規模障害","summary":"銀行間送金を担う全国銀行データ通信システムで、中継コンピュータの更改作業に起因する障害が発生し、複数の銀行で他行宛ての振込が2日間にわたり滞りました。1973年の稼働以来、初の大規模障害とされています。\n\n半世紀動き続けた社会インフラの更改で露呈したリスクです。老朽システムの更新を先送りする危うさを説いた「2025年の崖」(政策と制度レイヤー)の警告が、現実になった例として受け止められました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"全国銀行資金決済ネットワーク「全銀システムにおける障害について」(2023年10月)","url":null}]},{"date":"2023-11-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"さくらインターネットがガバクラに条件付き選定","summary":"ガバメントクラウドの提供事業者に、国内事業者として初めてさくらインターネットが条件付きで選定されました。2025年度末までに全ての技術要件を満たすことが条件です。\n\n海外勢のみだった政府基盤(同レイヤーの2021年選定)に、国内勢が加わる一歩になります。経済安全保障の観点からクラウドを国内に持つべきだという議論を反映した決定です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁「ガバメントクラウドの整備におけるクラウドサービスの募集結果」(2023年11月)","url":null}]},{"date":"2024-12-02","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"健康保険証の新規発行終了、マイナ保険証へ","summary":"健康保険証の新規発行が終了し、マイナンバーカードと一体化した「マイナ保険証」への移行が本格化しました。既存の保険証は、経過措置として最長1年間有効とされています。\n\n紐付け誤りの発覚などによる不信から、利用率が低迷したまま移行が進んだ点に、**普及を制度で先導することのリスク**が表れています。行政のデジタル化が国民の日常に直接触れた、最初の大規模な事例になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「マイナンバーカードの健康保険証利用について」","url":null}]},{"date":"2025-02-03","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"SBGとOpenAIが企業向けAIで合弁を発表","summary":"ソフトバンクグループとOpenAIが、企業向けAI「クリスタル・インテリジェンス」の日本展開に向けた合弁会社の設立を発表しました。SBGは年間30億ドル規模を、自社グループでのAI活用に投じるとしています。\n\n金額や展開規模は発表時点の計画で、実行は未確定です。それでも、日本企業のDXが生成AI・AIエージェントを前提とする段階へ移る流れを象徴する発表として位置づけられます。","detail":null,"credibility":"unverified","credibility_note":"投資額・展開規模は発表時点の計画値で、実際の資金投下や導入実績はこの時点で確定していません。","sources":[{"title":"ソフトバンクグループ プレスリリース(2025-02-03)","url":null}]}]},{"slug":"business-esg-investing","title":"ESG投資の潮流","description":"2004年の「ESG」誕生からGPIFの参入、グリーンウォッシング摘発、反ESGの逆風まで。投資マネー・規制と基準・社会の圧力の3層で、金融が気候と倫理を織り込んでいく20年を構造で追う。","category":"business","language":"ja","start_year":2004,"end_year":2025,"layers":[{"name":"投資と市場","color":"orange"},{"name":"規制と基準","color":"teal"},{"name":"社会と気候","color":"green"}],"events":[{"date":"2004-01-01","precision":"year","end_date":null,"type":"point","layer":"規制と基準","title":"国連報告書「Who Cares Wins」でESGの語が登場","summary":"2004年、国連グローバル・コンパクトが金融機関と共同で報告書「Who Cares Wins」を公表。環境（E）・社会（S）・企業統治（G）を投資分析に組み込むべきと提言し、**「ESG」という言葉**が国際的な公式文書に登場した。\n\n新しさは、倫理色の強かった「社会的責任投資（SRI）」をリスクとリターンという投資の言葉で語り直した点。以後の20年は、この語が金融の中心語彙になり、やがて政治の争点になっていく過程である。","detail":null,"credibility":"disputed","credibility_note":"ESGという語の初出をこの報告書とする説が広く引用されるが、それ以前の使用例を指摘する研究もあり、確定的ではない。","sources":[{"title":"UN Global Compact: Who Cares Wins - Connecting Financial Markets to a Changing World (2004)","url":null}]},{"date":"2006-04-27","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"責任投資原則(PRI)がNY証券取引所で発足","summary":"2006年4月、アナン国連事務総長の主導で責任投資原則（PRI）がNY証券取引所で発足。署名機関は、ESGを投資判断と株主行動に組み込む6つの原則にコミットする。\n\n発足時の署名は数十機関。のちに世界で数千機関・運用資産100兆ドル規模へ拡大する。法的拘束力のない自主原則という設計は、規制ではなく市場の同調圧力で広げるこの分野特有の進み方の原型となり、署名の有無自体が運用受託の条件になっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"PRI: About the PRI","url":"https://www.unpri.org/about-us/about-the-pri"}]},{"date":"2008-09-15","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"リーマン・ショック、短期主義への反省","summary":"2008年9月、リーマン・ブラザーズの経営破綻を引き金に世界金融危機が発生。短期の利益を追い、リスクを外部化してきた金融のあり方への批判が世界的に高まった。\n\n危機後の反省は、四半期主義から長期投資への転換論、機関投資家に企業との対話を求めるスチュワードシップ・コードの整備（規制と基準レイヤー）へ接続。ESGが「危機後の金融の正統性回復」という文脈で主流へ押し上げられていく出発点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: リーマン・ショック","url":"https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%BC%E3%83%9E%E3%83%B3%E3%83%BB%E3%82%B7%E3%83%A7%E3%83%83%E3%82%AF"}]},{"date":"2015-09-01","precision":"month","end_date":null,"type":"point","layer":"投資と市場","title":"GPIFが責任投資原則(PRI)に署名","summary":"2015年9月、運用資産100兆円超のGPIF（年金積立金管理運用独立行政法人）が責任投資原則に署名。世界最大級の年金基金の参入である。\n\n「クジラ」の参加は、年金の受託者責任とESG考慮は矛盾しないという解釈を日本市場に事実上定着させ、国内運用機関の一斉のESG対応を引き起こした。**アセットオーナーが動けば市場全体が動く**構図の代表例であり、日本のESG投資拡大は実質ここから始まったと評される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GPIF: 国連責任投資原則への署名について (2015年9月)","url":null}]},{"date":"2015-09-25","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"国連総会がSDGsを採択","summary":"2015年9月、国連総会が持続可能な開発目標（SDGs）を全会一致で採択。2030年までの17目標・169ターゲットを掲げ、政府だけでなく企業を変革の主体と位置づけた。\n\n法的拘束力はない。だが企業報告やESG評価の項目がSDGsに紐付き、投資と市場レイヤーに「何を測るか」の共通枠組みを提供した。日本では経団連の企業行動憲章改定などを通じて浸透し、統合報告書にアイコンが並ぶ光景が定着していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際連合広報センター: 持続可能な開発目標(SDGs)とは","url":null}]},{"date":"2015-12-12","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"COP21でパリ協定採択","summary":"2015年12月、COP21でパリ協定採択。気温上昇を産業革命前比2度未満、努力目標1.5度に抑える。\n\n「今世紀後半に排出実質ゼロ」という長期目標は金融の言葉に翻訳され、化石燃料資産が価値を失う「座礁資産」や炭素予算が、投資と市場レイヤーの用語として一般化する。気候変動が倫理の問題から**運用リスクの問題**へ置き換えられた分水嶺であり、TCFDやネットゼロ連合はこの延長線上にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: The Paris Agreement","url":"https://unfccc.int/process-and-meetings/the-paris-agreement"}]},{"date":"2017-07-03","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"GPIFがESG指数を選定、約1兆円の運用開始","summary":"2017年7月、GPIFが3つのESG指数を選定し、連動する約1兆円のパッシブ運用開始を発表。日本株のESG投資として当時最大規模である。\n\n指数への組み入れが資金流入を左右するため、企業側に情報開示とESGスコア改善への強い動機が生まれた。同時に、評価機関ごとにスコアが食い違う「ESG評価のばらつき」への批判も本格化し、評価手法の透明化という規制と基準レイヤーの論点を呼び込んだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GPIF: ESG指数を選定しました (2017-07-03)","url":null}]},{"date":"2018-08-20","precision":"day","end_date":null,"type":"point","layer":"社会と気候","title":"グレタ・トゥーンベリが学校ストライキを開始","summary":"2018年8月、15歳のグレタ・トゥーンベリがスウェーデン議会前で「気候のための学校ストライキ」を一人で開始。\n\n抗議はFridays for Futureとして世界の若者運動に拡大し、翌年の国連気候行動サミット演説で頂点に達する。株主総会での気候関連決議や機関投資家への働きかけも増加。**社会の圧力が投資行動を動かす**回路がはっきり可視化された時期の象徴であり、企業のネットゼロ宣言が相次ぐ背景となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Greta Thunberg","url":"https://en.wikipedia.org/wiki/Greta_Thunberg"}]},{"date":"2019-08-19","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"米ビジネス・ラウンドテーブルが企業の目的を再定義","summary":"2019年8月、米主要企業の経営者団体ビジネス・ラウンドテーブルが「企業の目的に関する声明」を発表。株主至上主義を改め、顧客・従業員・取引先・地域社会を含む全ステークホルダーへの価値提供を掲げた。署名したCEOは181人。\n\n株主資本主義の総本山による転換宣言として象徴的意義は大きかったが、経営行動が伴っていないとする検証も相次いだ。言葉と行動の差というグリーンウォッシング問題の構図を、企業統治の文脈で先取りした出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Business Roundtable: Statement on the Purpose of a Corporation (2019-08-19)","url":"https://opportunity.businessroundtable.org/ourcommitment/"}]},{"date":"2019-09-20","precision":"day","end_date":null,"type":"point","layer":"社会と気候","title":"世界気候ストライキ、数百万人が参加","summary":"2019年9月、国連気候行動サミットを前に世界各地で一斉の気候ストライキ。主催者発表で数百万人が参加したとされ、従業員として参加を表明する企業も現れた。\n\n消費者・従業員・市民の意識変化は、企業が脱炭素目標を掲げる際の社会的背景となり、翌年以降のESGファンドへの資金流入加速（投資と市場レイヤー）と並走した。ただし参加者数は主催者の集計であり、運動の規模の評価には幅がある。","detail":null,"credibility":"unverified","credibility_note":"参加人数(世界で400万人超などとされる)は主催団体の集計に基づくもので、第三者による検証はない。","sources":[{"title":"The Guardian: Global climate strike coverage (2019-09-20)","url":null}]},{"date":"2020-01-14","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"ブラックロックのフィンク書簡「気候リスクは投資リスク」","summary":"2020年1月、運用資産7兆ドル規模の世界最大の資産運用会社ブラックロックのラリー・フィンクCEOが、企業経営者への年頭書簡で「気候リスクは投資リスクである」と宣言。サステナビリティを運用の中心に据えると表明した。\n\nこの転換はESGの主流化を決定づけた。だが5年後、同社自身がネットゼロ連合を離脱する（2025年・同じ投資と市場レイヤー）。**運用会社の旗色は政治環境で変わり得る**ことを示す、頂点と転落の両方の起点となった書簡である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"BlackRock: Larry Fink's 2020 Letter to CEOs - A Fundamental Reshaping of Finance","url":null}]},{"date":"2020-10-26","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"菅首相が2050年カーボンニュートラルを宣言","summary":"2020年10月、菅義偉首相が所信表明演説で、2050年までに温室効果ガス排出を全体としてゼロにする「カーボンニュートラル」を宣言。\n\n主要排出国の長期目標が出そろい始めた時期にあたり、国内ではGX（グリーントランスフォーメーション）関連政策やトランジション・ファイナンスの制度設計が始動する。政府目標の明示は企業の脱炭素計画と開示の前提条件を変え、投資と市場レイヤーの国内ESG投資残高拡大を後押しした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 第二百三回国会における菅内閣総理大臣所信表明演説 (2020-10-26)","url":"https://www.kantei.go.jp/jp/99_suga/statement/2020/1026shoshinhyomei.html"}]},{"date":"2021-03-10","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"EUでサステナブルファイナンス開示規則(SFDR)適用開始","summary":"2021年3月、EUでサステナブルファイナンス開示規則（SFDR）の適用開始。運用会社は金融商品をサステナビリティ特性に応じて分類し（8条・9条など）、その根拠の開示を求められる。\n\n自主的な看板にすぎなかった「ESGファンド」に定義と説明責任を課す世界初の本格的試み。基準の厳格化に伴い9条から8条への「格下げ」が相次ぎ、**ラベルの信頼性**を巡る攻防が始まった。米欧のグリーンウォッシング規制・摘発の先行例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2019/2088 (SFDR)","url":"https://eur-lex.europa.eu/eli/reg/2019/2088/oj"}]},{"date":"2021-11-03","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"COP26でGFANZが「130兆ドル」の資金動員を表明","summary":"2021年11月、グラスゴーのCOP26で金融機関の連合GFANZ（グラスゴー金融同盟）が、ネットゼロにコミットする加盟機関の資産計130兆ドルを表明。\n\n金融の総動員を印象づけ、ESGの高揚が頂点に達した瞬間とされる。ただし集計の重複や実効性への懐疑は直後から指摘されていた。数年後の米大手脱退と連合縮小（同じ投資と市場レイヤー）を踏まえれば、宣言と実行の距離を測る基準点として振り返られる出来事である。","detail":null,"credibility":"disputed","credibility_note":"130兆ドルは加盟機関の運用・融資資産の合算。実際にネットゼロへ振り向けられる資金額ではないとの批判がある。","sources":[{"title":"GFANZ: Amount of finance committed to achieving 1.5°C now at scale needed to deliver the transition (2021-11-03)","url":null}]},{"date":"2022-01-01","precision":"year","end_date":"2025-12-31","type":"period","layer":"社会と気候","title":"米国で反ESG運動が拡大","summary":"2022年以降、米国の共和党系の州を中心に、ESGを考慮する運用会社を州資金の運用から排除する法律や、エネルギー企業へのボイコットを禁じる法律が相次いで成立。連邦議会や大統領選でもESGは攻撃の的となった。\n\nESGは政治的対立軸に組み込まれ、大手運用会社は文書からこの語を減らし、気候連合から脱退する動きを見せる。**言葉の退潮と実務の定着**が併存する複雑な局面であり、欧州・日本の制度化の進展とは対照的な分岐が生じた。","detail":null,"credibility":"disputed","credibility_note":"反ESG運動の起点と範囲の切り方は論者により異なる。この期間は、州レベルの立法が集中した時期の目安である。","sources":[{"title":"Harvard Law School Forum on Corporate Governance: ESG Battlegrounds - How the States Are Shaping the Regulatory Landscape (2023)","url":null}]},{"date":"2022-02-24","precision":"day","end_date":null,"type":"point","layer":"社会と気候","title":"ロシアのウクライナ侵攻、エネルギー危機でESGに逆風","summary":"2022年2月、ロシアがウクライナへ全面侵攻。エネルギー価格が急騰し、各国は化石燃料の調達確保とロシア産資源からの脱却を同時に迫られた。\n\nエネルギー安全保障が優先される中で石油・ガス関連株が上昇し、それらを除外するESGファンドの成績は相対的に悪化。「ESGはリターンを犠牲にするのか」という古い問いが再燃した。防衛産業を投資対象に含めるかの見直しも進み、**ESGの線引きの恣意性**が正面から問われることになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ロシアのウクライナ侵攻 (2022年)","url":"https://ja.wikipedia.org/wiki/%E3%83%AD%E3%82%B7%E3%82%A2%E3%81%AE%E3%82%A6%E3%82%AF%E3%83%A9%E3%82%A4%E3%83%8A%E4%BE%B5%E6%94%BB_(2022%E5%B9%B4)"}]},{"date":"2022-05-31","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"独DWSにグリーンウォッシング疑いで強制捜査","summary":"2022年5月、ドイツ銀行系の運用大手DWSに対し、ESG運用の実態を誇張した疑い（グリーンウォッシング）で独検察当局などが強制捜査。翌日にCEOが辞任を発表した。発端は元サステナビリティ責任者の内部告発で、のちに米SECとの間でも制裁金の支払いに至った。\n\n「ESGを名乗ること」自体が法的リスクになった転換点。SFDRなど規制と基準レイヤーの開示規制強化と呼応し、業界の看板の掛け直しを促した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters: German police raid DWS and Deutsche Bank in greenwashing probe (2022-05-31)","url":null}]},{"date":"2023-06-26","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"ISSBがサステナビリティ開示の国際基準を公表","summary":"2023年6月、国際サステナビリティ基準審議会（ISSB）が開示の国際基準IFRS S1（全般）とS2（気候関連）を公表。\n\nTCFDやSASBなど乱立していた枠組みを統合する「グローバル・ベースライン」であり、任意だった開示が各国の制度に組み込まれていく基盤となった。日本ではSSBJが国内基準を策定し、プライム市場上場企業への段階適用を議論。開示の標準化は、投資と市場レイヤーの評価のばらつき問題への一つの答えでもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IFRS Foundation: ISSB issues inaugural global sustainability disclosure standards (2023-06-26)","url":"https://www.ifrs.org/news-and-events/news/2023/06/issb-issues-ifrs-s1-ifrs-s2/"}]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"規制と基準","title":"EUで企業サステナビリティ報告指令(CSRD)適用開始","summary":"2024年度から、EUの企業サステナビリティ報告指令（CSRD）が段階適用。大企業は欧州サステナビリティ報告基準（ESRS）に基づく詳細な開示を義務付けられ、対象はEU域内で事業を行う域外企業にも及ぶ広範な設計だった。\n\nだが報告負担への反発は強く、2025年には適用対象を大幅に絞り込む「オムニバス」簡素化案が提示され、規制の振り子は緩和方向へ。開示規制の到達点と、その行き過ぎの修正が同時に観察できる事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Directive (EU) 2022/2464 (CSRD)","url":"https://eur-lex.europa.eu/eli/dir/2022/2464/oj"}]},{"date":"2025-01-13","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"ネットゼロ運用連合NZAMが活動停止","summary":"2025年1月、運用会社の連合Net Zero Asset Managers（NZAM）が活動の一時停止と枠組みの見直しを発表。ブラックロックの脱退表明を受けた措置で、前月までに米大手銀行の間でも銀行連合NZBAからの脱退が相次いでいた。\n\n米国の政治的圧力（社会と気候レイヤーの反ESG運動）が国際的な金融連合を解体に向かわせた形。一方、欧州や日本では開示の制度化と企業の脱炭素投資が継続。ESGは「旗印の時代」から「実務の時代」へ移行したと評されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Net Zero Asset Managers initiative: Statement (2025-01-13)","url":null},{"title":"Reuters: BlackRock quits climate group NZAM (2025-01-09)","url":null}]}]},{"slug":"business-freelance-economy","title":"フリーランス経済","description":"クラウドソーシングの誕生からギグエコノミーの拡大、各国の保護法制、生成AIの衝撃まで。プラットフォーム・制度・働き手の3層で、「雇用によらない働き方」の四半世紀を追う年表です。制度が現場に追いつくまでの時間差にも注目してみてください。","category":"business","language":"ja","start_year":1999,"end_year":2024,"layers":[{"name":"プラットフォーム","color":"orange"},{"name":"制度と保護","color":"teal"},{"name":"働き手と社会","color":"green"}],"events":[{"date":"1999-01-01","precision":"year","end_date":null,"type":"point","layer":"プラットフォーム","title":"Elance登場、オンライン外注市場の先駆け","summary":"米国でElanceが立ち上がり、企業がインターネット経由で世界中の個人に仕事を発注する「オンライン外注」の市場が生まれました。後にoDeskとの統合を経て、Upworkの源流になります。\n\n回線の高速化を背景に、仕事の受発注が対面と人づての紹介の世界からオンラインへ移り始めた出発点です。この働き方を指す言葉はまだなく、「ギグエコノミー」の語が広まるのは約10年後(働き手と社会レイヤー)のことでした。","detail":null,"credibility":"disputed","credibility_note":"会社の創業は1998年とされ、サービス開始の時期は資料により1999年前後と幅があります。","sources":[{"title":"Wikipedia: Elance","url":"https://en.wikipedia.org/wiki/Elance"}]},{"date":"2005-11-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"Amazon Mechanical Turk公開、マイクロタスクの誕生","summary":"Amazonが、人間にしかできない細かな作業を少額で発注できるAmazon Mechanical Turkを公開しました。データ整理や画像判定といった細切れの仕事を、世界中の作業者に分配する仕組みです。\n\n仕事を極小の単位に分解して単価をつける発想はクラウドソーシングの一つの極で、後にAIの学習データ作成を支える労働として再注目されます。同時に、最低賃金の枠外で働く「見えない労働者」への批判(働き手と社会レイヤー)も、ここから始まりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Mechanical Turk","url":"https://en.wikipedia.org/wiki/Amazon_Mechanical_Turk"}]},{"date":"2008-12-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"ランサーズ開始、日本のクラウドソーシング元年","summary":"秋好陽介が仕事のオンライン受発注サービス「ランサーズ」を開始し、日本でもクラウドソーシングが本格的に始まりました。2011年設立のクラウドワークスと並んで、国内市場を形づくっていきます。\n\n地方在住者や子育て中の親など、通勤や常勤を前提としない働き手に仕事が届くようになった意義は大きいと思います。一方で受注者同士の低単価競争という構造的な課題も早くから指摘され、働き手と社会レイヤーの論点として現在まで続いています。","detail":null,"credibility":"disputed","credibility_note":"会社設立とサービス開始の時期は、資料により2008年4月から12月の間で記述が揺れています。","sources":[{"title":"ランサーズ株式会社: 会社情報・沿革","url":"https://www.lancers.co.jp/company/"}]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"働き手と社会","title":"「ギグエコノミー」という言葉が生まれる","summary":"金融危機後の米国で、単発の仕事(ギグ)を組み合わせて生計を立てる働き方を指す「ギグエコノミー」という言葉が使われ始めました。ジャーナリストのティナ・ブラウンによる2009年のコラムが、初期の用例とされています。\n\n当初は不況で職を失った人たちの苦肉の策を指す言葉でしたが、スマートフォンとアプリの普及とともに「自由な働き方」という看板へ意味を変えていきます。言葉の意味の変わり方そのものが、この経済の光と影を映しています。","detail":null,"credibility":"disputed","credibility_note":"語の初出には諸説あり、ブラウンのコラムを起源とする説が広く引用されていますが、確定的ではありません。","sources":[{"title":"The Daily Beast: The Gig Economy (Tina Brown, 2009)","url":null}]},{"date":"2009-03-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"Uber創業、ギグワークが都市の風景になる起点","summary":"サンフランシスコでUberCab(現Uber)が創業しました。スマートフォンで運転手と乗客を直接つなぐ配車サービスは、その後数年で世界の都市交通を塗り替えていきます。\n\n運転手を雇用せず「独立請負人」と位置づける事業モデルは、**プラットフォームは雇用主か仲介者か**という、この年表を貫く法的争点を生みました。料理宅配や買い物代行など同じ構造のサービスが次々と登場し、アプリで単発の仕事を受ける働き方が日常の風景になっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Uber","url":"https://en.wikipedia.org/wiki/Uber"}]},{"date":"2014-09-01","precision":"month","end_date":null,"type":"point","layer":"働き手と社会","title":"米調査「フリーランスは5300万人・就労者の34%」","summary":"フリーランサーズ・ユニオンとElance-oDeskの共同調査「Freelancing in America」が、米国のフリーランス人口を約5300万人・就労者の34%と推計しました。\n\n副業者を含む広い定義への批判はあるものの、「3人に1人」という数字はギグエコノミー論の定番の根拠となり、各国で類似の調査が始まります。働き手の実態をとらえる政府統計の乏しさは各国共通で、**定義次第で人数が大きく動く**という統計の問題は、今も解決していません。","detail":null,"credibility":"unverified","credibility_note":"推計は業界団体の委託調査に基づくもので、フリーランスの定義に副業者を含むため、政府統計より大きく出る傾向があります。","sources":[{"title":"Freelancers Union & Elance-oDesk: Freelancing in America (2014)","url":null}]},{"date":"2014-12-12","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"クラウドワークスが東証マザーズに上場","summary":"クラウドワークスが東証マザーズに上場し、日本のクラウドソーシングが資本市場に認知される節目になりました。\n\n「時間と場所にとらわれない働き方」が成長産業として語られる一方で、プラットフォーム上の平均報酬の低さや手数料のあり方も報道で取り上げられるようになり、日本のフリーランス政策論議(制度と保護レイヤー)の呼び水になります。政府が「働き方改革」を掲げ、雇用によらない働き方を政策課題に載せるのは、この数年後のことです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"クラウドワークス: 東京証券取引所マザーズ上場に関するお知らせ (2014)","url":null}]},{"date":"2015-05-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"Upwork誕生、世界最大級のフリーランス市場に","summary":"ElanceとoDeskの統合会社が社名をUpworkに変更し、世界最大級のフリーランス仲介プラットフォームが誕生しました。\n\nスキルのオンライン売買が世界規模の単一市場に近づき、国境を越えた発注と価格競争が働き手の日常になっていきます。発注側の企業では業務を細かく切り出して外部化する動きが進み、「仕事の分解」がデザインや翻訳などホワイトカラー職に本格的に及び始めた時期です。この分解の構造は、後の生成AIの影響(働き手と社会レイヤー)にもつながります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Upwork","url":"https://en.wikipedia.org/wiki/Upwork"}]},{"date":"2019-09-18","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"カリフォルニア州でAB5法成立","summary":"働き手を原則として従業員と推定する「ABCテスト」を法制化したAB5法に、カリフォルニア州知事が署名しました。前年の州最高裁ダイナメックス判決を成文化したものです。\n\nギグワーカーの誤分類問題に対する、最も踏み込んだ立法例です。**労働法が想定しない働き手**をどう守るのかという問いを世界に突きつけました。適用を避けたいUberやLyftは巨額の住民投票キャンペーンを展開し、翌年のプロップ22(同じ制度と保護レイヤー)へ続きます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"California Legislative Information: AB-5 Worker status: employees and independent contractors (2019)","url":"https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=201920200AB5"}]},{"date":"2020-03-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"働き手と社会","title":"コロナ禍でギグワークが生活インフラになる","summary":"新型コロナのロックダウン下で料理宅配や配送のギグワークが急増し、外出できない都市の生活を支えました。米国では、通常は失業給付の対象外である自営業者に、特例の給付(PUA)が適用されています。\n\n「エッセンシャルワーカー」と呼ばれながら感染リスクと隣り合わせで働く実態は、保護の薄さを一気に可視化しました。日本でも2021年に自転車配達員らが労災保険に特別加入できるようになるなど、制度と保護レイヤーが動き出す直接のきっかけになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Department of Labor: Pandemic Unemployment Assistance (CARES Act, 2020)","url":null},{"title":"厚生労働省: 労災保険の特別加入制度の対象拡大(自転車配達員・ITフリーランス、2021年)","url":null}]},{"date":"2020-11-03","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"住民投票プロップ22可決、AB5に風穴","summary":"カリフォルニア州の住民投票で、配車・宅配の運転手をAB5の適用から外して独立請負人と位置づける「プロポジション22」が、半数を大きく超える賛成で可決されました。\n\nUberなど関係企業が2億ドル超を投じたとされる、史上最高額級のキャンペーンの結果です。**ルール自体を書き換えるプラットフォームの力**を示しました。その後の違憲訴訟を経て、2024年に州最高裁は本法を有効と判断しています。働き手側には最低報酬保証など一部の保護が導入されました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"California Secretary of State: Proposition 22 (2020) 開票結果","url":null}]},{"date":"2021-02-19","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"英最高裁がUber運転手を「ワーカー」と認定","summary":"英国最高裁が、Uberの運転手は完全な自営業者ではなく、最低賃金や有給休暇などの保護を受ける中間的な地位「ワーカー」にあたると全員一致で認定しました。\n\n判決後、Uberは英国の運転手をワーカーとして処遇すると発表しています。雇用と自営の間に第三の地位を置く英国型の解決は、二分法を前提に住民投票で決着を図った米国(プロップ22)と対照的です。同じ問題への各国の制度設計が、ここから分かれていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UK Supreme Court: Uber BV and others v Aslam and others [2021] UKSC 5","url":"https://www.supremecourt.uk/cases/uksc-2019-0029.html"}]},{"date":"2021-03-26","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"日本でフリーランスガイドライン策定","summary":"内閣官房・公正取引委員会・中小企業庁・厚生労働省が連名で「フリーランスとして安心して働ける環境を整備するためのガイドライン」を策定しました。\n\n独占禁止法・下請法・労働関係法令のフリーランス取引への適用関係を、初めて体系的に整理したものです。フリーランスが政策の対象として正面から位置づけられました。内閣官房の調査ではフリーランス人口は462万人と推計されていて、2023年の専用法制定(同じ制度と保護レイヤー)への足がかりになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"公正取引委員会: フリーランスとして安心して働ける環境を整備するためのガイドライン (2021-03-26)","url":null}]},{"date":"2023-01-01","precision":"year","end_date":null,"type":"point","layer":"働き手と社会","title":"生成AIがフリーランスの仕事を揺らし始める","summary":"ChatGPTや画像生成AIの急速な普及を受けて、翻訳・ライティング・イラストなどの分野で受注減を訴えるフリーランスが現れ始めました。プラットフォーム上の定型的な案件の減少を示す調査も報告されています。\n\n一方でAI活用スキルを掲げる新しい案件も増えていて、影響は職種の内部でも二極化しています。仕事を細分化して取引してきたクラウドソーシングの構造(プラットフォームレイヤー)が、細分化された仕事ほどAIに置き換えやすいという形で働き手に跳ね返った、との指摘もあります。","detail":null,"credibility":"disputed","credibility_note":"受注減と生成AIの因果関係は調査により結論が分かれていて、影響の規模は確定していません。","sources":[{"title":"SSRN: Hui, Reshef & Zhou, The Short-Term Effects of Generative Artificial Intelligence on Employment (2023)","url":null}]},{"date":"2023-04-28","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"フリーランス保護新法が国会で成立","summary":"発注内容の書面等による明示、報酬の60日以内の支払い、ハラスメント対策などを発注者に義務付けるフリーランス保護新法(フリーランス・事業者間取引適正化等法)が成立しました。\n\n資本金基準で対象が限られる下請法では守れなかった小さな取引を広くカバーし、**取引の適正化と就業環境の整備**を初めて一体で定めた日本の立法です。ガイドライン(2021年)からわずか2年での法制化に、フリーランス人口の拡大と社会的関心の高まりが表れています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"e-Gov法令検索: 特定受託事業者に係る取引の適正化等に関する法律(令和5年法律第25号)","url":null}]},{"date":"2023-10-01","precision":"day","end_date":null,"type":"point","layer":"働き手と社会","title":"インボイス制度開始、免税事業者に転換圧力","summary":"日本で消費税のインボイス(適格請求書)制度が始まりました。免税事業者のままでは取引先が仕入税額控除を受けられなくなるため、多くのフリーランスが課税事業者への転換か、値引きや取引打ち切りの圧力かの選択を迫られています。\n\n反対のオンライン署名は50万筆を超えたとされ、小規模な働き手への負担集中が争点になりました。保護法制の整備(制度と保護レイヤー)と税負担の増加が同時に進む、日本のフリーランス政策の両面が見える出来事です。","detail":null,"credibility":"disputed","credibility_note":"反対署名の筆数は主催団体の集計によるもので、第三者による検証はありません。制度の開始日自体は確定した事実です。","sources":[{"title":"国税庁: インボイス制度の概要","url":"https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/invoice.htm"}]},{"date":"2024-04-24","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"EUプラットフォーム労働指令を欧州議会が可決","summary":"欧州議会がプラットフォーム労働指令を可決しました。一定の要件を満たす場合に雇用関係を法的に推定し、反証責任をプラットフォーム側に課すほか、**アルゴリズムによる管理**の透明化と人による監督を義務付けます。\n\n個別の訴訟で争われてきた誤分類の問題を、雇用推定という一般ルールで扱う初のEU横断枠組みです。同年中に正式採択・発効し、加盟国は2026年末までに国内法化します。配車や宅配の働き手の地位をめぐる15年の攻防の、現時点での到達点です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Parliament: Parliament adopts Platform Work Directive (2024-04-24)","url":null},{"title":"EUR-Lex: Directive (EU) 2024/2831 on improving working conditions in platform work","url":"https://eur-lex.europa.eu/eli/dir/2024/2831/oj"}]},{"date":"2024-11-01","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"フリーランス法が施行、執行段階へ","summary":"フリーランス・事業者間取引適正化等法が施行され、公正取引委員会と厚生労働省による執行体制が動き始めました。施行後は、報酬の支払い遅延や買いたたきなどへの指導・勧告が行われています。\n\nプラットフォームの登場(1999年)から言葉の誕生(2009年)、各国の司法判断と立法を経て、日本でも専用法の執行という段階に届きました。**雇用によらない働き方**を制度が追いかける往復運動は、生成AI(働き手と社会レイヤー)という新しい変数を迎えて、今も続いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"公正取引委員会: フリーランス法特設サイト","url":"https://www.jftc.go.jp/freelancelaw/"}]}]},{"slug":"business-gafa","title":"GAFA帝国の形成","description":"1976年のApple創業から2020年代の規制強化まで。Google・Apple・Facebook（Meta）・Amazonの歩みを、製品とプラットフォーム・買収と資本・規制と社会の3層で重ね、買収額と制裁金の数字から帝国の構造を読む。","category":"business","language":"ja","start_year":1976,"end_year":2024,"layers":[{"name":"製品とプラットフォーム","color":"blue"},{"name":"買収と資本","color":"orange"},{"name":"規制と社会","color":"teal"}],"events":[{"date":"1976-04-01","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Apple Computer 創業","summary":"1976年4月、ジョブズ、ウォズニアック、ウェインの3人がカリフォルニア州でApple Computerを創業。ガレージ発、翌1977年のApple IIで個人向けコンピュータ市場を開いた。\n\nGAFA最古参。他の3社が生まれるインターネット時代より20年近く前の出来事である。1980年の株式公開で得た資本と、のちの経営危機と復活の前史が、2007年のiPhoneへ続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Apple Inc.","url":"https://en.wikipedia.org/wiki/History_of_Apple_Inc."}]},{"date":"1994-07-05","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Amazon 創業（当初社名Cadabra）","summary":"1994年7月、ベゾスがワシントン州でCadabraを設立。翌1995年7月、オンライン書店Amazon.comを開設した。ウェブ商用化の直後、書籍を入り口に「あらゆるものを売る店」を狙う。\n\n1997年に株式公開。調達資本を物流と技術へ長期に再投資し、利益より成長という方針を投資家が容認した。この蓄積が2006年のクラウド事業AWSを可能にする。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Amazon","url":"https://en.wikipedia.org/wiki/History_of_Amazon"}]},{"date":"1995-01-01","precision":"year","end_date":"2000-12-31","type":"period","layer":"買収と資本","title":"ドットコム・ブーム","summary":"2000年3月、NASDAQは史上最高値から急落。1995年頃からのネット関連投資の過熱が弾けた。AmazonとGoogleはこの熱狂の中で創業・成長し、Amazonは崩壊後の株価急落と資金繰り不安を乗り切った。\n\nGoogleは崩壊直後の2000年に検索連動広告AdWordsを開始し、収益モデルを確立。バブル期の通信インフラ過剰投資が、のちの安価な帯域と2000年代のプラットフォーム成長の土台になったとされる。","detail":null,"credibility":"unverified","credibility_note":"ブームの開始・終了年は定義次第。ここでは概ね1995年から2000年の崩壊までを目安とする。","sources":[{"title":"Wikipedia: Dot-com bubble","url":"https://en.wikipedia.org/wiki/Dot-com_bubble"}]},{"date":"1998-09-04","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Google 設立","summary":"1998年9月、ペイジとブリンがGoogleを法人化。母体はスタンフォード大の研究プロジェクト、核は被リンクを評価するPageRank。ドットコム・ブーム渦中の創業である。\n\n1999年にベンチャーキャピタルから大型調達、2004年に株式公開。2000年のAdWordsで「検索と広告」の結合が完成し、のちのYouTube・Android買収の資金源となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Google","url":"https://en.wikipedia.org/wiki/History_of_Google"}]},{"date":"2000-10-23","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Google AdWords 開始","summary":"2000年10月、セルフサービス型の検索連動広告AdWordsが始動。**検索行動を広告収益に変える仕組み**の確立である。バブル崩壊の年、無料検索の裏で稼ぐモデルが登場した意味は大きい。\n\n以後、Googleの売上の大半は広告。この資本力が2005年のAndroid、2006年のYouTube買収を支えた。検索と広告の結合は、2020年の米司法省提訴と2024年の独占認定の中心論点となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Google Ads","url":"https://en.wikipedia.org/wiki/Google_Ads"}]},{"date":"2004-02-04","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Thefacebook 開設","summary":"2004年2月、ザッカーバーグらがハーバード大の学生向けにThefacebook.comを公開。実名前提のSNSで、2006年に一般公開、2007年に外部開発者向けプラットフォームを開始した。\n\n同じ2004年はGoogleの株式公開の年。検索とソーシャル、二つの広告基盤が並行して立ち上がった。実名データの集積は成長の源泉であり、2018年のケンブリッジ・アナリティカ問題の火種でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Facebook","url":"https://en.wikipedia.org/wiki/History_of_Facebook"}]},{"date":"2005-08-01","precision":"month","end_date":null,"type":"point","layer":"買収と資本","title":"GoogleがAndroidを買収","summary":"2005年8月、GoogleがモバイルOS開発のスタートアップAndroidを買収。買収額は非公表、報道では約5,000万ドル。当時の受け止めは小さな買収だった。\n\n2007年のiPhone登場後、GoogleはAndroidをオープンソースで端末メーカーに提供し、モバイル検索と広告の入り口を確保する。製品面ではiPhoneとApp Storeが先行し、Android初端末の発売は2008年秋である。","detail":null,"credibility":"unverified","credibility_note":"買収の事実と時期は確実。額は非公表で、約5,000万ドルは報道による推計値。","sources":[{"title":"Wikipedia: Android (operating system)","url":"https://en.wikipedia.org/wiki/Android_(operating_system)"}]},{"date":"2006-08-25","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Amazon EC2 ベータ公開","summary":"2006年8月、AmazonがEC2の限定ベータを開始。同年3月のS3と合わせ、計算資源を時間貸しするクラウド事業AWSが本格化した。小売の余剰インフラ起源と語られがちだが、出発点は社内の開発効率化とされる。\n\n初期投資なしで起業できる環境は、のちのInstagramなど買収対象となる企業を育てる土壌にもなった。AWSは2010年代にAmazonの営業利益の柱となり、規制当局が同社を評価する際の重要な論点となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Elastic Compute Cloud","url":"https://en.wikipedia.org/wiki/Amazon_Elastic_Compute_Cloud"}]},{"date":"2006-10-09","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"GoogleがYouTubeを16.5億ドルで買収","summary":"2006年10月、Googleが約16.5億ドルの株式交換でYouTube買収を発表。創業2年未満の企業への大型買収であり、AdWordsで築いた資本力で成長領域を取り込む戦略が明確になった。\n\n同年にはAmazonがEC2を公開し、動画のような大容量サービスを支えるインフラ競争も始動。動画広告市場の支配は、のちの各国競争法調査で繰り返し検討対象となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: YouTube","url":"https://en.wikipedia.org/wiki/YouTube"}]},{"date":"2007-01-09","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"iPhone 発表","summary":"2007年1月、ジョブズがMacworldでiPhoneを発表。電話・iPod・インターネット端末の一体化である。同年6月に米国発売、タッチ操作前提のモバイルOSの標準をつくり、スマートフォンの形を定義した。\n\nGoogleは2005年買収のAndroidの設計を見直し、2008年に対抗端末を投入。翌2008年のApp Storeで端末とアプリ流通を一社が握る「プラットフォーム」の構図が完成し、2020年代の日欧規制の対象となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: Apple Reinvents the Phone with iPhone","url":"https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/"}]},{"date":"2008-07-10","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"App Store 開始","summary":"2008年7月、App Store開始。約500本のアプリ、開発者への配分は売上の70%。**アプリ流通を単一窓口に集約し、審査と手数料の仕組みを標準化した**ことが核心である。\n\nGoogleも同年にAndroid Marketを開始し、二大モバイルプラットフォームが並立。手数料率と審査の裁量はのちに開発者との対立を生み、EUのデジタル市場法（2022年発効）と日本のスマホソフトウェア競争促進法（2024年成立）で直接の規制対象となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: App Store (Apple)","url":"https://en.wikipedia.org/wiki/App_Store_(Apple)"}]},{"date":"2012-04-09","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"FacebookがInstagramを買収","summary":"2012年4月、FacebookがInstagram買収を発表。現金と株式で約10億ドル、相手は従業員13人。スマートフォンとApp Storeの普及で急成長した若い企業を、株式公開直前のFacebookが取り込んだ。Facebook株の下落により、完了時の価値は7億ドル台との報道もある。\n\n2020年、米連邦取引委員会（FTC）の提訴で**「競争相手の芽を摘む買収」**と問題視され、事後規制の焦点となった。","detail":null,"credibility":"disputed","credibility_note":"発表時の約10億ドルと、株価変動後の完了時価値は別物。報道により数値が分かれる。","sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2014-02-19","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"FacebookがWhatsAppを買収","summary":"2014年2月、FacebookがWhatsApp買収を発表。約190億ドル、完了時は株価上昇で200億ドル超。Instagramに続く大型買収で、モバイルのメッセージ領域を押さえた。\n\nEUの企業結合審査ではデータ統合を行わない説明が前提とされ、のちに実態との相違で制裁金。2018年のGDPR施行とケンブリッジ・アナリティカ問題を経て、データを軸にした買収の審査は各国で厳格化していく。","detail":null,"credibility":"disputed","credibility_note":"発表額は約190億ドル。株式部分の価値変動で最終取引額は約218億ドルとされ、資料により金額が異なる。","sources":[{"title":"Wikipedia: WhatsApp","url":"https://en.wikipedia.org/wiki/WhatsApp"}]},{"date":"2018-03-17","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"ケンブリッジ・アナリティカ問題が発覚","summary":"2018年3月、英ガーディアン等の報道で、Facebook利用者のデータが選挙コンサル会社に不正利用されていたことが発覚。外部アプリ経由で最大8,700万人分が取得されたとされ、ザッカーバーグは米議会で証言した。\n\n2004年の実名SNSという製品設計と、2012年以降の買収によるデータ集積が、**社会的な信頼の問題として噴出した**形である。約2か月後にEUでGDPRが施行、2019年のFTC制裁金へ続く規制強化の起点となった。","detail":null,"credibility":"disputed","credibility_note":"影響利用者数は当初報道で約5,000万人、のちにFacebook発表で最大約8,700万人。数値に幅がある。","sources":[{"title":"Wikipedia: Facebook–Cambridge Analytica data scandal","url":"https://en.wikipedia.org/wiki/Facebook%E2%80%93Cambridge_Analytica_data_scandal"}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"EU一般データ保護規則（GDPR）施行","summary":"2018年5月25日、EUでGDPR適用開始。違反時の制裁金は世界売上の最大4%。2016年採択、2年の準備期間を経ての施行である。\n\nケンブリッジ・アナリティカ問題の直後という時機が、広告を収益源とするGoogleとFacebookのデータ利用を直撃。同意取得の設計と越境データ移転を巡り、以後GAFA各社への制裁金決定が相
