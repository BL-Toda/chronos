年、大気中CO2の日平均値が400ppmの節目に到達。","detail":"1958年の観測開始時は約315ppmだった。400ppmは少なくとも数十万年ぶりの水準とされ、報道を通じて象徴的な数字として広まった。以後、年平均でも2015年に400ppmを超え、季節的な低下でも下回らなくなった。同年9月にはIPCC第5次報告が公表され、人為的影響の確からしさが「極めて高い」に引き上げられている。","credibility":"verified","credibility_note":null,"sources":[{"title":"NOAA Global Monitoring Laboratory: Trends in Atmospheric Carbon Dioxide","url":"https://gml.noaa.gov/ccgg/trends/"},{"title":"Scripps Institution of Oceanography: The Keeling Curve","url":"https://keelingcurve.ucsd.edu/"}]},{"date":"2015-03-01","precision":"month","end_date":"2016-05-31","type":"period","layer":"観測と現象","title":"2015〜16年の強いエルニーニョ","summary":"1997〜98年に匹敵する強いエルニーニョが発生し、地球温暖化の長期傾向に上乗せして世界平均気温を押し上げた。","detail":"太平洋赤道域の海面水温上昇に伴い、2015年、2016年が相次いで観測史上最高気温を更新した。エルニーニョは自然変動であり、温暖化の傾向に周期的に重なる。パリ協定の交渉が進んだ2015年12月はまさにこの現象の最盛期で、記録的な暖冬や熱波が交渉の背景にあった。","credibility":"disputed","credibility_note":"発生期間の定義は機関により異なり、気象庁は2014年夏〜2016年春、NOAAは2015年春〜2016年春を発生期間としている。","sources":[{"title":"NOAA Climate Prediction Center: Oceanic Niño Index (ONI)","url":"https://origin.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php"},{"title":"気象庁: エルニーニョ現象およびラニーニャ現象の発生期間","url":null}]},{"date":"2015-12-12","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"パリ協定を採択","summary":"COP21で全ての国が参加する枠組みに合意。産業革命前比で2℃を十分下回り、1.5℃に抑える努力を追求。","detail":"京都議定書と異なり、各国が自ら削減目標を掲げて5年ごとに更新する仕組みをとった。1.5℃目標は島嶼国の要求で盛り込まれ、その科学的根拠の整理がIPCCに要請されて2018年の特別報告書につながる。採択の年、観測レイヤーでは強いエルニーニョのもと世界平均気温が初めて産業革命前比1℃を超えたと報告された。","credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: The Paris Agreement","url":"https://unfccc.int/process-and-meetings/the-paris-agreement"}]},{"date":"2018-10-08","precision":"day","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC「1.5℃特別報告書」を公表","summary":"1.5℃と2℃の影響の差を示し、1.5℃に抑えるには2030年頃までにCO2排出をほぼ半減、2050年頃に実質ゼロが必要と提示。","detail":"パリ協定の要請を受けた報告書は、現在のペースでは2030〜2052年に1.5℃に達すると見積もった。「2050年ネットゼロ」という時間軸はこの報告書から各国政策と企業目標に広がった。公表の翌年には若者の気候ストライキが世界に拡大し、科学の提示した期限が社会運動の言葉となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (2018) Global Warming of 1.5°C. Special Report","url":"https://www.ipcc.ch/sr15/"}]},{"date":"2019-09-20","precision":"day","end_date":null,"type":"point","layer":"政策と社会","title":"世界気候ストライキ、数百万人規模に拡大","summary":"スウェーデンの学生の座り込みから広がった運動が世界150か国以上で一斉行動。参加者は主催者発表で約400万人。","detail":"国連気候行動サミットの直前に行われ、若者主導の気候運動が最大規模となった。1.5℃特別報告書が示した「2030年まで」の期限を運動が掲げ、科学レイヤーの数字がスローガンになった例といえる。同年、EUと英国は2050年カーボンニュートラルを法制化・宣言し、企業や自治体の目標設定も加速した。","credibility":"unverified","credibility_note":"参加人数は主催者発表に基づく推計で、独立した集計はなく、報道により300万〜760万人と幅がある。","sources":[{"title":"Fridays for Future: Global Climate Strike, September 2019","url":null},{"title":"The Guardian (2019-09-21) Climate crisis: 6 million people join latest wave of global protests","url":null}]},{"date":"2021-08-09","precision":"day","end_date":null,"type":"point","layer":"科学の発見","title":"IPCC第6次報告「人間の影響が温暖化させたことは疑う余地がない」","summary":"第1作業部会が人為的影響を初めて断定的に記述。20年間の観測とモデルの進歩が「疑う余地なし」を支えた。","detail":"1990年の第1次報告が人為的寄与を「不確実」とし、2007年に「可能性が非常に高い」、2013年に「極めて高い」としてきた表現が、ついに断定に至った。同じ年、真鍋淑郎らが気候モデルの基礎を築いた功績でノーベル物理学賞を受賞。11月のCOP26では1.5℃目標の追求を確認し、石炭火力の段階的削減が初めて合意文書に入った。","credibility":"verified","credibility_note":null,"sources":[{"title":"IPCC (2021) Climate Change 2021: The Physical Science Basis. Summary for Policymakers","url":"https://www.ipcc.ch/report/ar6/wg1/"}]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"観測と現象","title":"2024年、初めて年平均で産業革命前比1.5℃を超過","summary":"観測史上最も暑い年となり、複数のデータセットで年平均気温が産業革命前比1.5℃を上回ったと報告。","detail":"2023年に続く記録更新で、エルニーニョと長期的な温暖化が重なった。パリ協定の1.5℃目標は20〜30年平均で評価されるため単年の超過は目標の失敗を意味しないが、アレニウスの計算から128年、パリ協定から9年で象徴的な水準に達した。政策レイヤーでは各国の削減目標の積み上げがなお2℃経路にも届いていない。","credibility":"disputed","credibility_note":"コペルニクスは1.60℃、WMOは1.55±0.13℃と報告し、データセットや基準期間の取り方によっては1.5℃をわずかに下回る評価もある。","sources":[{"title":"Copernicus Climate Change Service: Global Climate Highlights 2024","url":null},{"title":"WMO: State of the Global Climate 2024","url":null}]}]},{"slug":"science-dna-to-editing","title":"DNAから遺伝子編集まで","description":"1869年の核酸発見からCRISPR治療の承認まで。生命の設計図をめぐる発見と理論、それを操作する技術、そして社会がどう線を引いてきたかの3層を重ね、150年の歩みを一望する。","category":"science-nature","language":"ja","start_year":1869,"end_year":2025,"layers":[{"name":"発見と理論","color":"blue"},{"name":"技術と応用","color":"green"},{"name":"倫理と制度","color":"purple"}],"events":[{"date":"1869-01-01","precision":"year","end_date":null,"type":"point","layer":"発見と理論","title":"ミーシャー、細胞核から「ヌクレイン」を単離","summary":"スイスの医師ミーシャーが白血球の核からリンを多く含む未知の物質を取り出し、ヌクレインと命名。","detail":"テュービンゲンの実験室で包帯の膿から白血球を集め、タンパク質と異なる酸性物質を得た。これが後に核酸（DNA）と呼ばれる物質の最初の記録である。ただし遺伝の担い手はタンパク質と考えられ、DNAが遺伝物質だと確立されるのは75年後の1944年まで待つことになる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Dahm, R. (2005) Friedrich Miescher and the discovery of DNA. Developmental Biology","url":"https://doi.org/10.1016/j.ydbio.2004.11.028"}]},{"date":"1944-02-01","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"エイブリーら、DNAが形質転換の本体であると報告","summary":"肺炎球菌の形質転換を起こす物質がタンパク質でなくDNAであることを精製実験で示し、遺伝物質の正体に迫る。","detail":"1928年のグリフィスの形質転換実験を出発点に、エイブリー、マクラウド、マッカーティは形質転換因子を精製し、DNA分解酵素でのみ活性が失われることを示した。当初は懐疑的な受け止めもあったが、1952年のハーシーとチェイスの実験で補強され、翌年の二重らせん構造の解明へと道が開かれた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Avery, O. T., MacLeod, C. M. & McCarty, M. (1944) Studies on the chemical nature of the substance inducing transformation of pneumococcal types. Journal of Experimental Medicine","url":"https://doi.org/10.1084/jem.79.2.137"}]},{"date":"1953-04-25","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"ワトソンとクリック、DNAの二重らせん構造を発表","summary":"Nature誌にDNAの二重らせんモデルを発表。塩基対の相補性が複製の仕組みを示唆すると指摘。","detail":"同じ号にはウィルキンス、フランクリンらのX線回折データの論文が並んで掲載された。フランクリンの「写真51」を含むデータがモデル構築に用いられた経緯と功績の配分は今も議論が続く。1962年のノーベル賞はワトソン、クリック、ウィルキンスに贈られたが、フランクリンは1958年に没していた。この構造理解が遺伝暗号解読と組換えDNA技術の前提となった。","credibility":"disputed","credibility_note":"構造自体は確立しているが、フランクリンのデータ利用の経緯と各人の貢献の配分については歴史家・科学者の間で評価が分かれる。","sources":[{"title":"Watson, J. D. & Crick, F. H. C. (1953) Molecular Structure of Nucleic Acids: A Structure for Deoxyribose Nucleic Acid. Nature","url":"https://doi.org/10.1038/171737a0"}]},{"date":"1961-01-01","precision":"year","end_date":"1966-12-31","type":"period","layer":"発見と理論","title":"遺伝暗号の解読","summary":"ニーレンバーグらのポリU実験を皮切りに、64通りのコドンとアミノ酸の対応表が5年で完成する。","detail":"1961年、ニーレンバーグとマッタイは合成RNA（ポリU）からフェニルアラニンの鎖ができることを示し、最初のコドンを決定した。コラナ、ホリーらの研究と競争を経て1966年までに暗号表が完成し、DNAの塩基配列とタンパク質を結ぶ「翻訳規則」が確定した。配列を読めば意味が分かるという前提が、1970年代の配列決定法と組換え技術の価値を決定づけた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Nirenberg, M. W. & Matthaei, J. H. (1961) The dependence of cell-free protein synthesis in E. coli upon naturally occurring or synthetic polyribonucleotides. PNAS","url":"https://doi.org/10.1073/pnas.47.10.1588"},{"title":"The Nobel Prize in Physiology or Medicine 1968","url":"https://www.nobelprize.org/prizes/medicine/1968/summary/"}]},{"date":"1973-11-01","precision":"month","end_date":null,"type":"point","layer":"技術と応用","title":"コーエンとボイヤー、組換えDNA技術を確立","summary":"制限酵素で切断したDNA断片をプラスミドにつなぎ、大腸菌内で複製させることに成功。遺伝子工学の出発点。","detail":"異なる生物由来のDNAを人工的につなぎ増やす技術は、翌年には科学者自身が実験の一時停止を呼びかけるほどの衝撃を与え、1975年のアシロマ会議につながった。技術は1976年のジェネンテック設立と1982年のヒトインスリン承認へ直結し、1980年に成立したコーエン・ボイヤー特許は大学発ライセンスの原型となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Cohen, S. N., Chang, A. C. Y., Boyer, H. W. & Helling, R. B. (1973) Construction of Biologically Functional Bacterial Plasmids In Vitro. PNAS","url":"https://doi.org/10.1073/pnas.70.11.3240"}]},{"date":"1975-02-24","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"アシロマ会議、組換えDNA研究の自主規制指針を策定","summary":"科学者約140人が集まり、組換えDNA実験のリスク区分と封じ込め基準を自ら定めた。研究者主導の規制の先例。","detail":"1974年にバーグらが呼びかけた実験モラトリアムを受け、カリフォルニア州アシロマで開かれた。物理的・生物学的封じ込めをリスクに応じて定める枠組みは、翌1976年の米NIHガイドラインの基礎となり、日本でも1979年に組換えDNA実験指針が制定された。技術の確立から2年で制度が追いついた例として、後の遺伝子編集をめぐる議論でも繰り返し参照される。","credibility":"verified","credibility_note":null,"sources":[{"title":"Berg, P., Baltimore, D., Brenner, S., Roblin, R. O. & Singer, M. F. (1975) Summary statement of the Asilomar Conference on Recombinant DNA Molecules. PNAS","url":"https://doi.org/10.1073/pnas.72.6.1981"}]},{"date":"1980-06-16","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"米最高裁、遺伝子操作した生物の特許を認める","summary":"ダイヤモンド対チャクラバーティ事件で、人が作り出した微生物は特許の対象になりうると5対4で判断。","detail":"石油分解能力を持たせた細菌をめぐる判決は「太陽の下の人工物は何でも」特許になりうるとし、バイオテクノロジー産業の投資を後押しした。同年12月にはコーエン・ボイヤー特許が成立し、同じ年にジェネンテックが株式公開している。技術と資本が制度によって結びついた年であり、後のヒト遺伝子特許やCRISPR特許紛争の遠因ともなった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Diamond v. Chakrabarty, 447 U.S. 303 (1980)","url":"https://supreme.justia.com/cases/federal/us/447/303/"}]},{"date":"1982-10-01","precision":"month","end_date":null,"type":"point","layer":"技術と応用","title":"遺伝子組換えヒトインスリンを米FDAが承認","summary":"大腸菌に作らせたヒトインスリン「ヒューマリン」が承認され、組換えDNA技術による初の医薬品が実用化。","detail":"ジェネンテックが開発しイーライリリーが製造した。それまでのブタ・ウシ由来インスリンに代わり、供給の安定と免疫反応の低減をもたらした。1973年の技術確立から9年、1975年のアシロマ会議で定められた封じ込め基準のもとで開発が進み、規制と産業化が両立しうることを示した。以後、成長ホルモンやワクチンなど組換え医薬品が続いた。","credibility":"verified","credibility_note":null,"sources":[{"title":"Genentech: Press release, First recombinant DNA drug approved by FDA (1982)","url":null},{"title":"FDA: Celebrating a Milestone: FDA's Approval of First Genetically-Engineered Product","url":null}]},{"date":"1985-12-20","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"PCR法の論文が発表される","summary":"マリスの着想に基づくシータス社の研究チームが、DNAの特定領域を試験管内で指数的に増幅する手法を発表。","detail":"1983年にマリスが着想したとされる方法は、1985年のScience誌論文と1988年の耐熱性DNAポリメラーゼの導入で実用技術となった。微量DNAの増幅は診断・法科学・ゲノム計画の全てを支え、マリスは1993年にノーベル化学賞を受賞した。ただし増幅の原理は1971年にクレッペらが記述しており、着想の先取権と貢献の配分には議論がある。","credibility":"disputed","credibility_note":"基本原理は1971年のクレッペらの論文に先例があり、マリス個人の着想とチームの貢献の配分についても関係者の証言が食い違う。","sources":[{"title":"Saiki, R. K. et al. (1985) Enzymatic amplification of β-globin genomic sequences and restriction site analysis for diagnosis of sickle cell anemia. Science","url":"https://doi.org/10.1126/science.2999980"},{"title":"The Nobel Prize in Chemistry 1993","url":"https://www.nobelprize.org/prizes/chemistry/1993/summary/"}]},{"date":"1990-09-14","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"承認された初のヒト遺伝子治療臨床試験を実施","summary":"米NIHでADA欠損症の4歳女児に対し、正常遺伝子を導入したT細胞を戻す治療が行われる。","detail":"アンダーソン、ブレーズらのチームがレトロウイルスベクターで遺伝子を導入した。患者は長期にわたり良好な経過をたどったが、酵素補充療法（PEG-ADA）を併用していたため遺伝子治療単独の効果を切り分けることは難しい。同じ年の10月にヒトゲノム計画が始動し、「読む」計画と「直す」試みが同時に幕を開けた。1999年のゲルシンガー事件で分野は一度大きく後退する。","credibility":"unverified","credibility_note":"臨床的改善への遺伝子治療の寄与度は、併用された酵素補充療法の影響を分離できないため確定していない。","sources":[{"title":"Blaese, R. M. et al. (1995) T Lymphocyte-Directed Gene Therapy for ADA-SCID: Initial Trial Results After 4 Years. Science","url":"https://doi.org/10.1126/science.270.5235.475"}]},{"date":"1990-10-01","precision":"month","end_date":"2003-04-14","type":"period","layer":"発見と理論","title":"ヒトゲノム計画","summary":"米英日仏独中の国際共同で約30億塩基対のヒトゲノムを解読。当初15年計画を前倒しで2003年に完了宣言。","detail":"1977年のサンガー法を自動化・大規模化して進められ、1998年にセレラ社が参入して官民の競争となった。2000年6月に草案、2001年2月に論文、2003年4月に二重らせん発表50周年に合わせて完了が宣言された。日本は理化学研究所などが21番・18番染色体などを担当した。全塩基配列という「地図」が、後の疾患遺伝子探索とゲノム編集の標的設計を可能にした。","credibility":"verified","credibility_note":null,"sources":[{"title":"National Human Genome Research Institute: The Human Genome Project","url":"https://www.genome.gov/human-genome-project"},{"title":"International Human Genome Sequencing Consortium (2001) Initial sequencing and analysis of the human genome. Nature","url":"https://doi.org/10.1038/35057062"}]},{"date":"1999-09-17","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"遺伝子治療の臨床試験で被験者ジェシー・ゲルシンガーが死亡","summary":"ペンシルベニア大学の試験でアデノウイルスベクター投与後に18歳の被験者が死亡し、遺伝子治療研究が停滞。","detail":"調査で被験者選定基準の逸脱や有害事象報告の不備、研究者の利益相反が指摘され、FDAは同大学の試験を停止した。1990年の初試験以来の期待は一転し、投資と臨床試験数は数年にわたり落ち込んだ。被験者保護と利益相反開示の制度強化につながり、2010年代の遺伝子治療復活と2018年のゲノム編集ベビー問題の際にも安全性議論の原点として参照された。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wilson, J. M. (2009) Lessons learned from the gene therapy trial for ornithine transcarbamylase deficiency. Molecular Genetics and Metabolism","url":null},{"title":"FDA (2000) Warning letter to the Institute for Human Gene Therapy, University of Pennsylvania","url":null}]},{"date":"2000-06-26","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"ヒトゲノム草案を国際計画とセレラ社が共同発表","summary":"クリントン米大統領とブレア英首相の立ち会いで、公的計画と民間セレラ社がヒトゲノム草案の完成を同時に発表。","detail":"1998年に参入したセレラ社が全ゲノムショットガン法で公的計画を追い上げ、政治的仲介で「引き分け」の共同発表となった。翌2001年2月、Nature誌とScience誌に別々の論文が掲載された。ヒト遺伝子数が当初の10万前後の予想を大きく下回る2万〜2万5千程度と判明したのはこの成果からで、遺伝子の数より制御の複雑さが問われる時代に入った。","credibility":"disputed","credibility_note":"草案の完成度（カバー率）と両陣営の貢献の大きさについては公的計画とセレラ社の主張が食い違い、セレラ社が公的データを利用した程度も論争となった。","sources":[{"title":"International Human Genome Sequencing Consortium (2001) Initial sequencing and analysis of the human genome. Nature","url":"https://doi.org/10.1038/35057062"},{"title":"Venter, J. C. et al. (2001) The Sequence of the Human Genome. Science","url":"https://doi.org/10.1126/science.1058040"}]},{"date":"2012-06-28","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"ダウドナとシャルパンティエ、CRISPR-Cas9を編集ツールとして提示","summary":"細菌の獲得免疫機構CRISPRを、ガイドRNAで任意のDNA配列を切断できる汎用ツールに転用できると示す。","detail":"Science誌のオンライン公開論文で、Cas9とガイドRNAの組み合わせだけで標的配列を切断できることを試験管内で実証した。翌2013年1月にはチャン、チャーチらがヒト細胞での編集を報告し、以後、技術は爆発的に普及する。ジンクフィンガーやTALENに比べ設計が容易で安価な点が決定的で、同時に特許紛争と倫理議論の火種にもなった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Jinek, M. et al. (2012) A Programmable Dual-RNA-Guided DNA Endonuclease in Adaptive Bacterial Immunity. Science","url":"https://doi.org/10.1126/science.1225829"},{"title":"Cong, L. et al. (2013) Multiplex Genome Engineering Using CRISPR/Cas Systems. Science","url":"https://doi.org/10.1126/science.1231143"}]},{"date":"2015-12-01","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"第1回ヒトゲノム編集国際サミット開催","summary":"米英中の科学アカデミーがワシントンで開催。生殖細胞系列の臨床応用は「現時点で無責任」との声明を発表。","detail":"同年4月に中国のチームが受精しない三倍体ヒト胚での編集実験を報告し、生殖細胞系列編集の是非が急浮上したことを受けて開かれた。基礎研究は容認しつつ、安全性と社会的合意が得られるまで妊娠につながる応用は行うべきでないとした。CRISPR論文からわずか3年半でのルール形成だったが、2018年の香港での第2回サミットの直前に、その線を越える事例が公表される。","credibility":"verified","credibility_note":null,"sources":[{"title":"National Academies of Sciences, Engineering, and Medicine (2015) On Human Gene Editing: International Summit Statement","url":null},{"title":"Liang, P. et al. (2015) CRISPR/Cas9-mediated gene editing in human tripronuclear zygotes. Protein & Cell","url":null}]},{"date":"2017-02-15","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"米特許審判部、CRISPR特許紛争でブロード研究所側を支持","summary":"真核細胞でのCRISPR-Cas9利用に関する特許について、カリフォルニア大学側の主張を退けブロード研究所側の特許を維持。","detail":"2012年のダウドナらの発表と2013年のチャンらの実証のどちらが真核細胞での編集の発明にあたるかが争点となった。米国では2022年にも審判部がブロード側に有利な判断を示した一方、欧州特許庁では判断が異なり、地域ごとに権利関係が分かれている。ライセンス構造の複雑さは治療開発企業の契約に影響し、2023年の治療承認まで続く背景となった。","credibility":"disputed","credibility_note":"発明の先取権をめぐる争いは控訴や地域ごとの判断の違いが続いており、最終的な権利関係は確定していない。","sources":[{"title":"USPTO Patent Trial and Appeal Board, Interference No. 106,048 (Decision on Motions, Feb. 15, 2017)","url":null},{"title":"Nature News (2017) Broad Institute wins bitter battle over CRISPR patents","url":null}]},{"date":"2018-11-26","precision":"day","end_date":null,"type":"point","layer":"倫理と制度","title":"賀建奎、ゲノム編集した双子の誕生を公表","summary":"中国の研究者がCRISPRでCCR5遺伝子を改変した受精卵から双子が生まれたと発表し、国際的な非難を招く。","detail":"香港での第2回ヒトゲノム編集国際サミット直前の公表で、2015年の第1回サミット声明が「無責任」とした生殖細胞系列の臨床応用が実際に行われたことが明らかになった。中国当局は違法な医療行為として2019年12月に懲役3年の判決を下し、WHOは登録制度と各国規制の整備を勧告した。1975年のアシロマ以来の「研究者の自主規制」モデルの限界が問われた事件でもある。","credibility":"verified","credibility_note":null,"sources":[{"title":"Nature News (2018) Genome-edited baby claim provokes international outcry","url":"https://doi.org/10.1038/d41586-018-07545-0"},{"title":"新華社 (2019-12-30) 「基因編輯嬰兒」案一審宣判","url":null}]},{"date":"2020-10-07","precision":"day","end_date":null,"type":"point","layer":"発見と理論","title":"シャルパンティエとダウドナにノーベル化学賞","summary":"CRISPR-Cas9による「遺伝子のはさみ」の開発が評価され、女性2人のみの共同受賞として初のノーベル賞となる。","detail":"2012年の論文発表から8年という異例の早さでの受賞で、技術の影響の大きさを示した。同じ時期、技術レイヤーでは鎌状赤血球症へのCRISPR治療の臨床試験結果が報告され、制度レイヤーでは特許紛争と生殖細胞系列編集の国際ルール作りが続いていた。受賞対象は基礎的発見であり、真核細胞での応用をめぐる特許の争点とは別に評価された。","credibility":"verified","credibility_note":null,"sources":[{"title":"The Nobel Prize in Chemistry 2020","url":"https://www.nobelprize.org/prizes/chemistry/2020/summary/"}]},{"date":"2023-11-16","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"世界初のCRISPR治療「カスジェビー」を英国が承認","summary":"鎌状赤血球症とβサラセミアに対するCRISPR-Cas9を用いた治療を英MHRAが承認。12月には米FDAも承認。","detail":"患者自身の造血幹細胞を体外で編集し胎児型ヘモグロビンの産生を回復させる治療で、バーテックス社とCRISPRセラピューティクス社が開発した。2012年の論文から11年で臨床承認に至った。一方で価格は1回あたり約220万ドルとされ、患者数の多いアフリカなどでの利用可能性が新たな倫理・制度の課題となった。","credibility":"verified","credibility_note":null,"sources":[{"title":"FDA (2023-12-08) FDA Approves First Gene Therapies to Treat Patients with Sickle Cell Disease","url":"https://www.fda.gov/news-events/press-announcements/fda-approves-first-gene-therapies-treat-patients-sickle-cell-disease"},{"title":"MHRA (2023-11-16) MHRA authorises world-first gene therapy that aims to cure sickle-cell disease and transfusion-dependent β-thalassemia","url":null}]},{"date":"2025-05-15","precision":"day","end_date":null,"type":"point","layer":"技術と応用","title":"個別化した塩基編集治療を乳児に初めて適用と報告","summary":"希少な代謝疾患CPS1欠損症の乳児1人のために設計された塩基編集治療の投与結果がNEJMに報告される。","detail":"米国の研究チームが患者固有の変異に合わせて約6か月で治療を設計・製造し、肝臓を標的に脂質ナノ粒子で投与した。DNA二本鎖を切らずに一塩基を書き換える塩基編集の体内投与例であり、「1人のための薬」の規制上の枠組みも同時に試された。ただし1例の短期報告であり、長期の安全性と有効性は今後の追跡による。","credibility":"unverified","credibility_note":"症例1例の短期経過報告にとどまり、長期的な安全性・有効性は未確認。","sources":[{"title":"Musunuru, K. et al. (2025) Patient-Specific In Vivo Gene Editing to Treat a Rare Genetic Disease. New England Journal of Medicine","url":null}]}]},{"slug":"tech-ai-revolution","title":"AI革命の全体像 2020–2026","description":"深層学習の下地からTransformer、生成AIの爆発的普及、そして各国の規制整備まで。技術・資本・規制の3層を重ね、なぜこの数年でAIが社会の前提になったのかを俯瞰する年表。","category":"technology","language":"ja","start_year":2012,"end_year":2026,"layers":[{"name":"技術","color":"blue"},{"name":"企業と資本","color":"orange"},{"name":"社会と規制","color":"teal"}],"events":[{"date":"2012-10-01","precision":"month","end_date":null,"type":"point","layer":"技術","title":"AlexNetがILSVRCで圧勝、深層学習ブームの起点","summary":"トロント大学のKrizhevsky、Sutskever、HintonによるGPU学習の深層CNNが、画像認識コンペILSVRCで従来手法を大差で破り、深層学習の実用性を示した。\n\n以後の研究資源が深層学習へ集中する契機となり、GPUを学習に用いる手法もここで定着。後年のNVIDIAの資本市場での躍進(企業と資本レイヤー)の伏線となる、生成AI以前の「下地」にあたる出来事。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: AlexNet","url":"https://en.wikipedia.org/wiki/AlexNet"}]},{"date":"2017-06-12","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Transformer論文公開、大規模言語モデルの基盤に","summary":"Googleの研究者らが再帰構造を捨てAttentionのみで系列変換を行うTransformerを提案。並列学習に適した構造により、モデルとデータの規模を拡大するほど性能が伸びる「スケーリング」の道を開き、GPTシリーズもBERTもこの構造の上に成立する。\n\nこの時点で産業界のAIはまだ研究投資の対象であり、資本市場や規制当局の主要関心事ではなかった点が、5年後との対比として重要である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Attention Is All You Need (1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"date":"2019-07-22","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"MicrosoftがOpenAIに10億ドル出資","summary":"MicrosoftがOpenAIとの提携と10億ドルの出資を発表し、Azureを独占的クラウド基盤とする計算資源の供給関係が始まった。\n\n非営利として出発したOpenAIが営利子会社(capped-profit)を設けた直後の出資であり、この**資本と計算資源の結合が翌年のGPT-3(技術レイヤー)を可能にした**。以後、生成AI競争はモデル開発企業とクラウド大手の連合という構図で進む。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft News: OpenAI forms exclusive computing partnership with Microsoft (2019-07-22)","url":"https://news.microsoft.com/2019/07/22/openai-forms-exclusive-computing-partnership-with-microsoft-to-build-new-azure-ai-supercomputing-technologies/"}]},{"date":"2020-05-28","precision":"day","end_date":null,"type":"point","layer":"技術","title":"GPT-3論文公開、1750億パラメータの言語モデル","summary":"OpenAIが1750億パラメータのGPT-3を発表。少数例を示すだけで多様なタスクをこなす「few-shot」能力を示し、規模の拡大が汎用的な能力をもたらすことを実証した。\n\n前年のMicrosoft出資による計算資源が結実した成果で、同年6月にはAPIとして限定公開され、AIが「研究成果」から「サービス基盤」へ移る転換点となる。\n\n社会と規制の側では新型コロナ対応が優先され、AI規制の議論はまだEU域内の準備段階にとどまっていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"arXiv: Language Models are Few-Shot Learners (2005.14165)","url":"https://arxiv.org/abs/2005.14165"}]},{"date":"2021-04-21","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"欧州委員会がAI規則(AI Act)案を提案","summary":"欧州委員会が、用途ごとにリスクを4段階に分け高リスク用途に義務を課す、リスクベースの包括的AI規制案を公表。世界初の横断的AI法制に向けた立法プロセスが始まった。\n\n提案時点では生成AIは想定の中心になく、2022年末のChatGPT登場(技術レイヤー)後に汎用AIモデル条項が追加されるなど、技術の進展が立法途中の修正を迫る。**規制が技術に追いつこうとする構図の出発点**である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Proposal COM(2021) 206 final","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52021PC0206"}]},{"date":"2022-08-22","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Stable Diffusion公開、画像生成AIがオープンに","summary":"Stability AIらが画像生成モデルStable Diffusionの重みを公開し、個人のPCで動く生成AIが一気に広まった。\n\n同年4月のDALL·E 2、7月のMidjourneyに続く動きだが、モデル自体をオープンに配布した点で影響が大きく、派生モデルやツールが爆発的に増えた。\n\n一方で学習データの著作権をめぐる訴訟が翌年以降に相次ぎ、社会と規制レイヤーの論点を先取りする。生成AIが「見て分かる」形で一般に届いた最初の波である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Stability AI: Stable Diffusion Public Release","url":"https://stability.ai/news/stable-diffusion-public-release"}]},{"date":"2022-10-07","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"米国が先端半導体の対中輸出規制を発表","summary":"米商務省が先端AIチップと製造装置の対中輸出を制限し、**計算資源が安全保障と地政学の対象になった**。規制はNVIDIAのA100/H100級のGPUを対象とし、以後段階的に強化される。\n\nこの制約が中国側の効率的な学習手法の追求を促し、2025年のDeepSeek-R1(技術レイヤー)の衝撃につながったとの見方もある。AIの覇権争いが企業間競争にとどまらず国家戦略として扱われ始めた、最初の明確な出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省産業安全保障局(BIS) 2022年10月7日発表 輸出管理規則改正","url":null}]},{"date":"2022-11-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"ChatGPT公開","summary":"OpenAIが対話型AI「ChatGPT」を無料公開。GPT-3.5系モデルに人間のフィードバックによる強化学習(RLHF)を施し対話UIで提供したもので、技術的な飛躍というより「届け方」の転換だったが、誰でも自然言語で使える体験が生成AIを一般社会の関心事に変え、公開から2か月で推定1億ユーザーに達した(社会と規制レイヤー)。\n\n翌年1月にはMicrosoftの追加出資が発表され、大手各社が生成AIへ一斉に舵を切る。**以後の年表の全レイヤーがここを分岐点とする**。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: Introducing ChatGPT","url":"https://openai.com/index/chatgpt/"}]},{"date":"2023-01-23","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"MicrosoftがOpenAIへ数十億ドル規模の追加出資","summary":"MicrosoftがOpenAIとの提携延長と複数年・数十億ドル規模の投資を発表(報道では総額100億ドルとされた)。ChatGPT公開からわずか2か月後で、生成AIが資本市場の中心テーマになったことを象徴する。\n\n翌月にはBing、続いてOffice製品への組み込みが進み、Googleも対抗発表を急いだ。技術レイヤーでは3月にGPT-4の公開が控え、資本と技術の投入サイクルが極端に短くなった時期である。","detail":null,"credibility":"disputed","credibility_note":"Microsoftの公式発表は金額を明示しておらず、100億ドルという数字は報道ベースの推定にとどまる。","sources":[{"title":"Microsoft Official Blog: Microsoft and OpenAI extend partnership (2023-01-23)","url":"https://blogs.microsoft.com/blog/2023/01/23/microsoftandopenaiextendpartnership/"}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"社会と規制","title":"ChatGPTが公開2か月で推定1億ユーザーに到達","summary":"UBSの分析として、ChatGPTの月間利用者が公開2か月で1億人に達したと報じられ、史上最速の普及と評された。\n\n教育現場での利用制限や企業の情報漏えい懸念など社会的な反応が一斉に噴出し、イタリアのデータ保護当局が3月末に一時利用停止を命じるなど、規制当局の初動もこの普及速度が引き金となった。技術レイヤーの「届け方の転換」が社会レイヤーに波及するまでの時間の短さを示す指標である。","detail":null,"credibility":"disputed","credibility_note":"1億人はUBSがSimilarweb等のデータから推定した数値で、OpenAIの公式開示ではない。集計方法により数値は前後する。","sources":[{"title":"Reuters: ChatGPT sets record for fastest-growing user base - analyst note (2023-02-02)","url":null}]},{"date":"2023-03-14","precision":"day","end_date":null,"type":"point","layer":"技術","title":"GPT-4公開、マルチモーダル対応へ","summary":"OpenAIがGPT-4を発表。画像入力に対応し、司法試験など多くの試験で人間上位層に匹敵する成績を示した。\n\n技術報告書ではモデル規模や学習データを非公開とし、競争と安全性を理由にオープンな研究文化から距離を置いた点も注目された。\n\n同月にはGoogle Bard、AnthropicのClaudeも公開され(企業と資本レイヤー)、1週間後には開発一時停止を求める公開書簡(社会と規制レイヤー)が出されるなど、加速と警戒が同時進行した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: GPT-4 Research","url":"https://openai.com/index/gpt-4-research/"}]},{"date":"2023-03-22","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"「巨大AI実験の一時停止」を求める公開書簡","summary":"Future of Life InstituteがGPT-4を超えるAIの開発を6か月停止するよう求める書簡を公開し、著名研究者や経営者が署名した。GPT-4公開の8日後という時期が示すとおり、技術レイヤーの加速への直接の反応である。\n\n実際に停止した企業はなく、むしろ投資と開発は加速したが、AIの存在論的リスクを一般議論の俎上に載せ、同年10月の米大統領令や11月の英国AI安全サミットなど各国政府の動きを後押ししたと評価される。","detail":null,"credibility":"unverified","credibility_note":"書簡の署名者数(3万人超とされる)は主催団体の集計で、第三者による検証はない。","sources":[{"title":"Future of Life Institute: Pause Giant AI Experiments: An Open Letter","url":"https://futureoflife.org/open-letter/pause-giant-ai-experiments/"}]},{"date":"2023-10-30","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"米国でAIに関する大統領令14110号に署名","summary":"バイデン大統領が「安全で信頼できるAI」に関する大統領令14110号に署名し、計算量の閾値を基準に大規模モデルの開発者へ安全性テスト結果の報告を求めた。\n\n米国初の包括的なAI政策であり、EUのAI Actが立法の最終段階にあった時期と重なり、大西洋の両側で規制枠組みが並走した。\n\nなお本大統領令は2025年1月の政権交代直後に撤回され、規制の方向性が政治に左右されることを示す事例ともなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Executive Order 14110: Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence","url":null}]},{"date":"2023-11-17","precision":"day","end_date":"2023-11-22","type":"period","layer":"企業と資本","title":"OpenAI取締役会がアルトマンCEOを解任、5日後に復帰","summary":"OpenAI取締役会がサム・アルトマンCEOを解任。従業員の大量離反表明とMicrosoftの介入を経て、5日後に復帰した。\n\n非営利の理念に基づく統治構造と巨額資本を受け入れた営利事業の間の緊張が表面化した出来事であり、再編後は実質的に企業としての方向性が優先される結果となった。\n\n前月に米大統領令、同月に英国AI安全サミットが行われた時期で、AI企業の内部統治が公共的関心事として扱われるようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OpenAI: OpenAI announces leadership transition (2023-11-17)","url":"https://openai.com/index/openai-announces-leadership-transition/"}]},{"date":"2024-03-13","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"欧州議会がAI Actを可決","summary":"欧州議会が世界初の包括的AI規制であるAI Actを可決。\n\n2021年の提案時にはなかった汎用AI(GPAI)モデルへの透明性義務は、ChatGPT以後の技術レイヤーの変化を受けて追加された。理事会の承認を経て2024年8月1日に発効し、禁止事項、GPAI義務、高リスク義務の順に段階的に適用される。\n\n企業と資本レイヤーでは、規制コストを理由に欧州での提供を遅らせる企業も現れた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2024/1689 (AI Act)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"date":"2024-08-01","precision":"day","end_date":"2026-08-02","type":"period","layer":"社会と規制","title":"EU AI Actの段階的適用期間","summary":"AI Actが発効し、禁止事項(2025年2月)、汎用AIモデル義務(2025年8月)、高リスク義務(2026年8月)の順に、2年かけて段階的に適用が進む。\n\nこの間、企業と資本レイヤーでは適用延期を求めるロビー活動が続き、技術レイヤーではモデルの更新周期が数か月単位に短縮された。**「規制の時間」と「技術の時間」の速度差**が最も可視化される期間であり、本年表の終点でもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2024/1689 (AI Act) 第113条 適用期日","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"date":"2025-01-20","precision":"day","end_date":null,"type":"point","layer":"技術","title":"DeepSeek-R1公開、低コスト推論モデルの衝撃","summary":"中国のDeepSeekが推論特化モデルR1をオープンウェイトで公開し、少ない計算資源で最先端に迫る性能を示したと主張した。\n\n米国の輸出規制(社会と規制レイヤー)で先端GPUの入手が制限される中での成果とされ、**「計算資源の量が競争力を決める」という前提を揺さぶった**。\n\n1週間後にはNVIDIA株が急落し(企業と資本レイヤー)、AI投資の妥当性をめぐる議論が広がった。オープンウェイト戦略が地政学的な意味を持つことも示した。","detail":null,"credibility":"disputed","credibility_note":"学習コストが数百万ドル規模とする主張は自社発表に基づき、算定範囲(最終学習のみか研究開発全体か)をめぐって見解が分かれる。","sources":[{"title":"arXiv: DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning (2501.12948)","url":"https://arxiv.org/abs/2501.12948"}]},{"date":"2025-01-21","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"「Stargate」構想発表、最大5000億ドルのAIインフラ投資","summary":"OpenAI、SoftBank、Oracleらが米国内にAIデータセンターを建設する合弁「Stargate」を発表し、投資規模を4年間で最大5000億ドルと表明した。\n\n政権交代の翌日にホワイトハウスで発表され、AIインフラが国家的プロジェクトとして扱われることを印象づけた。\n\n同じ週にDeepSeek-R1(技術レイヤー)が「少ない計算資源」で注目を集めており、巨額投資の前提が同時に問われる対照的な構図が生まれた。電力とデータセンター立地が新たな争点となる。","detail":null,"credibility":"unverified","credibility_note":"5000億ドルは表明額であり、実際の資金調達と投資実行の規模・時期は発表時点で確定していない。","sources":[{"title":"OpenAI: Announcing The Stargate Project","url":"https://openai.com/index/announcing-the-stargate-project/"}]},{"date":"2025-01-27","precision":"day","end_date":null,"type":"point","layer":"企業と資本","title":"NVIDIA株が急落、時価総額が1日で約6000億ドル減","summary":"DeepSeekの低コスト主張を受けNVIDIA株が約17%下落し、1日の時価総額減少額(約6000億ドル)として米国市場史上最大級とされた。\n\n2012年のAlexNet以来GPUと歩み、生成AIブームで時価総額世界首位級に躍進していた同社の急落は、AI投資の収益性と「計算資源の必要量」への疑念を映す。\n\nDeepSeek-R1公開(技術レイヤー)の1週間後の出来事で、その後株価は回復したが、輸出規制(社会と規制レイヤー)をめぐる政策も揺れ続けた。","detail":null,"credibility":"unverified","credibility_note":"減少額は終値ベースの報道による概算で、媒体により5900億ドル前後と数値に幅がある。","sources":[{"title":"Reuters: Nvidia loses nearly $600 billion in market value (2025-01-27)","url":null}]},{"date":"2025-05-28","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"日本でAI推進法が成立","summary":"人工知能関連技術の研究開発・活用の推進に関する法律が参議院で可決・成立。罰則を設けず振興を主眼とする日本初のAI基本法で、EUのAI Actが義務と罰則で臨むのに対し、事業者の協力義務と政府の基本計画を柱とする「ソフトロー寄り」の設計を選んだ。\n\n同時期の米国では前政権の大統領令が撤回されており、主要国の規制姿勢が分岐した年といえる。\n\n企業と資本レイヤーでは国内データセンター投資の呼び込みが政策目標に据えられた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 人工知能関連技術の研究開発及び活用の推進に関する法律(令和7年)","url":null}]}]},{"slug":"tech-blockchain","title":"ブロックチェーンの興亡","description":"Bitcoin論文からEthereum、ICOブーム、相次ぐ取引所事件とFTX破綻、そしてETF承認と法制化まで。技術・市場と資本・規制と事件の3層を重ね、熱狂と崩壊が交互に訪れた歴史を読み解く。","category":"technology","language":"ja","start_year":2008,"end_year":2025,"layers":[{"name":"技術","color":"blue"},{"name":"市場と資本","color":"gold"},{"name":"規制と事件","color":"pink"}],"events":[{"date":"2008-10-31","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Bitcoin論文「P2P電子通貨システム」公開","summary":"サトシ・ナカモトを名乗る人物が暗号学メーリングリストに9ページの論文を投稿。中央管理者なしで二重支払いを防ぐ仕組みを示した。","detail":"リーマン・ブラザーズ破綻から約1か月半後という時期は、金融機関への不信が背景にあったとしばしば語られる。Proof of Workによる合意形成と公開台帳という設計は、後のEthereum(技術)や無数の暗号資産の原型となった。著者の正体は現在も不明で、規制と事件レイヤーの多くの騒動もこの匿名性に根ざす。","credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcoin: A Peer-to-Peer Electronic Cash System","url":"https://bitcoin.org/bitcoin.pdf"}]},{"date":"2009-01-03","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Bitcoinのジェネシスブロック生成","summary":"Bitcoinネットワークの最初のブロックが生成され、稼働開始。ブロックには英紙の銀行救済に関する見出しが埋め込まれていた。","detail":"埋め込まれた「Chancellor on brink of second bailout for banks」の見出しは、金融危機下での既存金融への批評と読まれている。当初は暗号学者や愛好家の実験にすぎず、市場価格は存在しなかった。1年半後のピザ取引(市場と資本)で初めて実物との交換価値が示され、価格を持つ資産としての歴史が始まる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin","url":"https://en.wikipedia.org/wiki/Bitcoin"}]},{"date":"2010-05-22","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"1万BTCでピザ2枚、初の実物取引","summary":"フロリダのプログラマーが1万BTCと引き換えにピザ2枚を受け取ったと掲示板に報告。Bitcoinの最初の商取引として知られる。","detail":"当時の1万BTCは約41ドル相当だったが、後年の価格では数億ドルに相当し、「ビットコイン・ピザ・デー」として毎年言及される。技術(ジェネシスブロック)から1年半で価格発見が始まった事例であり、翌年以降の取引所の乱立とMt.Goxの台頭(規制と事件)につながる。投機資産としての性格はこの時点ではまだ薄かった。","credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcointalk: Pizza for bitcoins? (2010)","url":"https://bitcointalk.org/index.php?topic=137.0"}]},{"date":"2013-10-02","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"闇市場Silk Roadを米当局が閉鎖","summary":"FBIがBitcoin決済の違法商品市場Silk Roadを閉鎖し運営者を逮捕。Bitcoinと犯罪の結びつきが広く報じられた。","detail":"Torと暗号資産の匿名性を利用した市場の摘発は、規制当局が暗号資産を本格的に監視対象とする契機となった。同年12月には中国人民銀行が金融機関のBitcoin取扱いを禁止し、価格が急落している(市場と資本)。技術の中立性と利用の違法性を分けて論じる枠組みは、この事件を通じて形成された。","credibility":"unverified","credibility_note":"当局が押収したBitcoinの数量は報道により約2.6万〜17万BTCと幅があり、押収時期の区別も含めて数値は未確定。","sources":[{"title":"Wikipedia: Silk Road (marketplace)","url":"https://en.wikipedia.org/wiki/Silk_Road_(marketplace)"}]},{"date":"2014-02-28","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"Mt.Goxが民事再生を申請、大量のBitcoin消失","summary":"東京の取引所Mt.Goxが取引を停止し民事再生を申請。顧客資産を含む大量のBitcoinが失われたと発表し、業界最大級の破綻となった。","detail":"世界のBitcoin取引の大半を扱っていた取引所の破綻は、価格の長期低迷を招くとともに、取引所への規制の必要性を各国に認識させた。日本では利用者保護の議論が進み、2017年の改正資金決済法(規制と事件)で取引所登録制が導入される。技術そのものではなく取引所という「入口」が最大の弱点であることを示した事件である。","credibility":"disputed","credibility_note":"消失額は当初約85万BTCと発表されたが、後に約20万BTCが発見されるなど、実際の損失規模と原因(外部からのハッキングか内部要因か)には諸説ある。","sources":[{"title":"Wikipedia: Mt. Gox","url":"https://en.wikipedia.org/wiki/Mt._Gox"}]},{"date":"2015-07-30","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Ethereumメインネット稼働開始","summary":"スマートコントラクトを実行できる汎用ブロックチェーンEthereumが稼働。「通貨」から「プログラム可能な台帳」へ用途が広がった。","detail":"ヴィタリック・ブテリンが2013年に構想し、2014年のクラウドセールで資金を集めて開発された。任意のプログラムをチェーン上で動かせる設計は、翌年のThe DAO(技術・事件)や2017年のICOブーム(市場と資本)、後のDeFiやNFTの基盤となった。Bitcoinが「価値の保存」に特化する一方、Ethereumは応用の実験場となる。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Ethereum","url":"https://en.wikipedia.org/wiki/Ethereum"}]},{"date":"2016-06-17","precision":"day","end_date":null,"type":"point","layer":"技術","title":"The DAOハッキング、Ethereumがハードフォークへ","summary":"Ethereum上の投資ファンドThe DAOの脆弱性が突かれ、集めたETHの約3分の1が流出。取り消しのためのハードフォークで議論が割れた。","detail":"「コードが法」という理念と、被害回復のためにチェーンを巻き戻すかという実務判断が衝突し、7月のハードフォークで巻き戻さない側がEthereum Classicとして分離した。スマートコントラクトの脆弱性が巨額損失に直結することを示し、後の監査産業やDeFiハックの系譜(規制と事件)の起点となった。","credibility":"unverified","credibility_note":"流出額は約360万ETHとされるが、当時のドル換算額は5000万〜7000万ドルと資料により幅がある。","sources":[{"title":"Wikipedia: The DAO","url":"https://en.wikipedia.org/wiki/The_DAO"}]},{"date":"2017-01-01","precision":"year","end_date":"2018-01-31","type":"period","layer":"市場と資本","title":"ICOブーム","summary":"Ethereum上でトークンを発行して資金を集めるICOが急増。2017年に数十億ドル規模の調達が行われ、多くが後に価値を失った。","detail":"Ethereumのスマートコントラクト(技術)がなければ成立しなかった資金調達手法で、ホワイトペーパー1枚で巨額を集める例が続出した。2017年9月には中国がICOを全面禁止し、米SECも証券法違反の警告を出すなど、規制と事件レイヤーの対応を招いた。同年末のBitcoin高騰と重なり、暗号資産が一般投資家の関心事となる。","credibility":"unverified","credibility_note":"ブームの開始・終了時期は明確な定義がなく、調達総額も集計機関により大きく異なる。","sources":[{"title":"Wikipedia: Initial coin offering","url":"https://en.wikipedia.org/wiki/Initial_coin_offering"}]},{"date":"2017-04-01","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"日本で改正資金決済法が施行、仮想通貨交換業を登録制に","summary":"仮想通貨を法的に定義し、交換業者に金融庁への登録を義務づける改正法が施行。主要国で初の包括的な取引所規制となった。","detail":"Mt.Gox破綻(2014年)の教訓を受けた立法で、利用者財産の分別管理や本人確認を義務化した。同年、日本は世界のBitcoin取引で大きなシェアを占め、価格高騰(市場と資本)を支えた一因ともされる。しかし翌年のCoincheck事件は、登録制のみでは資産保全が不十分であることを露呈させた。","credibility":"verified","credibility_note":null,"sources":[{"title":"金融庁: 仮想通貨交換業者登録一覧・資金決済に関する法律","url":null}]},{"date":"2017-08-01","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Bitcoin Cashが分岐、ブロックサイズ論争の決着","summary":"取引処理能力をめぐる数年来の対立の末、ブロックサイズを拡大したBitcoin Cashが分岐。Bitcoin本体はSegWitを有効化した。","detail":"分散型ネットワークの仕様変更を誰がどう決めるかというガバナンス問題が、実際にチェーンの分裂という形で表れた。技術論争は市場にも波及し、分岐前後の価格変動や取引所の対応(市場と資本)が投資家を翻弄した。この後Bitcoinはレイヤー2で拡張する路線を、Ethereumはやがてコンセンサス転換(2022年のMerge)を選ぶ。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin Cash","url":"https://en.wikipedia.org/wiki/Bitcoin_Cash"}]},{"date":"2017-12-17","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"Bitcoinが約2万ドルの史上最高値、初のバブル頂点","summary":"Bitcoin価格が主要取引所で2万ドル前後に達し当時の最高値を記録。ICOブームとCME先物上場を背景に、個人投資家が殺到した。","detail":"年初の約1000ドルから20倍近い上昇で、テレビや新聞が連日報じる社会現象となった。同月にCBOEとCMEがBitcoin先物を上場し、機関投資家の参入が期待されたが、翌年には8割以上下落する「暗号資産の冬」に入る。技術(SegWit、Bitcoin Cash分岐)や規制(日本の登録制、中国のICO禁止)がすべて同じ年に集中していた。","credibility":"disputed","credibility_note":"最高値は取引所により1万9000〜2万ドル台と異なり、日付も12月16〜18日の間で資料により差がある。","sources":[{"title":"CoinMarketCap: Bitcoin 価格履歴","url":null}]},{"date":"2018-01-26","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"コインチェックからNEM約580億円分が流出","summary":"国内取引所コインチェックから約5.2億XEM(当時約580億円相当)が不正送金された。単一事件としては当時最大規模の流出となった。","detail":"改正資金決済法(2017年)の登録審査中だった業者で起きた事件で、ホットウォレット管理の不備が指摘された。金融庁は立入検査と業務改善命令を出し、以後の審査は厳格化。バブル頂点(市場と資本)からわずか1か月後の出来事であり、熱狂の直後に事件が起きるという本年表の反復パターンを象徴する。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Coincheck","url":"https://en.wikipedia.org/wiki/Coincheck"}]},{"date":"2021-09-07","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"エルサルバドルがBitcoinを法定通貨に","summary":"エルサルバドルで世界初となるBitcoin法定通貨法が施行。国家が暗号資産を通貨として採用する実験が始まった。","detail":"ドル化経済の国が送金コスト削減と金融包摂を掲げて導入したが、国民の利用は限定的で、IMFは金融リスクを警告し続けた。2025年にはIMF融資の条件として法定通貨としての受け入れ義務が撤回されている。同月、中国は暗号資産取引を全面禁止しており、国家の対応が正反対に分かれた月である。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bitcoin Law","url":"https://en.wikipedia.org/wiki/Bitcoin_Law"}]},{"date":"2021-09-24","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"中国が暗号資産取引とマイニングを全面禁止","summary":"中国人民銀行など10機関が暗号資産関連の取引を違法とする通知を公表。同年5月のマイニング規制と合わせ、事実上の全面禁止となった。","detail":"世界のBitcoinマイニングの過半を担っていた中国からハッシュレートが流出し、米国などへ移転した(技術)。取引禁止は市場に短期的な下落をもたらしたが、同年11月にはBitcoinが史上最高値を更新しており(市場と資本)、単一国家の禁止では市場が止まらないことも示した。エルサルバドルの法定通貨化と同じ月の出来事である。","credibility":"verified","credibility_note":null,"sources":[{"title":"中国人民銀行: 关于进一步防范和处置虚拟货币交易炒作风险的通知(2021年9月24日)","url":null}]},{"date":"2021-11-10","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"Bitcoinが約6万9000ドルの史上最高値","summary":"コロナ禍の金融緩和とTeslaなど企業の購入、米国での先物ETF承認を背景に、Bitcoinが約6万9000ドルの最高値をつけた。","detail":"2017年の頂点(約2万ドル)から3年半で3倍超の水準に達し、NFTやDeFiのブームも重なった。翌2022年の利上げ局面でTerra崩壊とFTX破綻(規制と事件)が続き、価格は1万6000ドル台まで下落する。低金利下の資本(市場と資本)が暗号資産へ流入し、引き締めとともに退潮する構図が明確に表れた。","credibility":"disputed","credibility_note":"最高値は取引所により6万8000〜6万9000ドル台と異なる。","sources":[{"title":"CoinMarketCap: Bitcoin 価格履歴","url":null}]},{"date":"2022-05-07","precision":"day","end_date":"2022-05-13","type":"period","layer":"市場と資本","title":"Terra/USTの崩壊","summary":"アルゴリズム型ステーブルコインUSTがドル連動を失い、姉妹通貨LUNAとともに1週間でほぼ無価値に。約400億ドル規模の時価総額が消失した。","detail":"担保ではなくアルゴリズムで価格を維持する設計(技術)の脆弱性が、市場の売り圧力で一気に露呈した。連鎖的にヘッジファンドや貸付業者が破綻し、11月のFTX破綻(規制と事件)へ続く信用収縮の起点となった。米国や日本でステーブルコイン規制の議論が急加速し、日本では翌年、改正資金決済法でステーブルコインの発行者が限定された。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Terra (blockchain)","url":"https://en.wikipedia.org/wiki/Terra_(blockchain)"}]},{"date":"2022-09-15","precision":"day","end_date":null,"type":"point","layer":"技術","title":"Ethereumが「The Merge」でProof of Stakeへ移行","summary":"EthereumがProof of WorkからProof of Stakeへ移行するアップグレードを完了。消費電力を99%以上削減したとされる。","detail":"稼働中のネットワークを止めずに合意形成の仕組みを入れ替えた大規模な移行で、数年来の開発の集大成だった。環境負荷への批判(規制と事件レイヤーの論点)に技術で応えた形だが、同時期の市場はTerra崩壊とFTX破綻に挟まれた「冬」の最中で、価格への影響は限定的だった。技術と市場の時間軸のずれを示す事例である。","credibility":"verified","credibility_note":null,"sources":[{"title":"ethereum.org: The Merge","url":"https://ethereum.org/en/roadmap/merge/"}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"FTXが破産申請、顧客資産流用が発覚","summary":"世界2位級の取引所FTXが米国で連邦破産法11条を申請。関連会社への顧客資産流用が明らかになり、創業者は後に有罪となった。","detail":"Mt.Gox(2014年)以来、再び「取引所」が最大の弱点となった事件で、規制当局と政界に深く食い込んでいた企業の破綻は業界全体の信頼を失墜させた。米国では取引所規制の議論が加速し、日本では分別管理義務により国内利用者の資産返還が比較的速やかに進んだ点が対照的だった。市場(市場と資本)は底値圏に沈む。","credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bankruptcy of FTX","url":"https://en.wikipedia.org/wiki/Bankruptcy_of_FTX"}]},{"date":"2024-01-10","precision":"day","end_date":null,"type":"point","layer":"市場と資本","title":"米SECが現物Bitcoin ETFを承認","summary":"米証券取引委員会が11本の現物Bitcoin ETFを承認。証券口座で買える商品となり、機関投資家と個人の資金流入が加速した。","detail":"10年以上却下され続けた申請が、裁判所の判断を経て承認に至った。FTX破綻(規制と事件)から1年余りでの転換であり、投機的な「取引所」経由から規制された金融商品へと入口が広がったことを意味する。同年4月の半減期と重なり、Bitcoinは同年末に初めて10万ドルを超えた。技術ではなく制度が価格を動かした局面である。","credibility":"verified","credibility_note":null,"sources":[{"title":"SEC: Statement on the Approval of Spot Bitcoin Exchange-Traded Products (2024-01-10)","url":"https://www.sec.gov/newsroom/speeches-statements/gensler-statement-spot-bitcoin-011023"}]},{"date":"2025-07-18","precision":"day","end_date":null,"type":"point","layer":"規制と事件","title":"米国でステーブルコイン規制法(GENIUS法)が成立","summary":"ドル連動ステーブルコインの発行者に準備資産の全額裏付けなどを義務づける連邦法が成立。米国初の包括的な暗号資産法制となった。","detail":"Terra崩壊(2022年)で露呈したステーブルコインの危うさに対する立法上の回答であり、同時にドル建てステーブルコインを制度に取り込む産業政策でもある。ETF承認(市場と資本)と並び、暗号資産が「規制の外」から「 function fmtDate(e){

  if(e.precision === "month") return `${y}.${m}`;

    for(const t of list){
      const chips = t.layers.map(l => `<span class="layer-chip"><i style="background:${COLOR[l.color]}"></i>${esc(l.name)}</span>`).join("");
      html += `<button class="tl-card" data-slug="${esc(t.slug)}">
        <div class="tl-years">${t.start_year}–${t.end_year}</div>
        <div class="tl-title">${esc(t.title)}</div>
        <div class="tl-desc">${esc(t.description)}</div>
        <div class="tl-meta">${chips}<span class="tl-evcount">${t.events.length}件</span></div>
      </button>`;
    }
    html += `</div></section>`;
  }
  document.getElementById("cats").innerHTML = html;
}

function renderDetail(t){
  const colorOf = name => COLOR[(t.layers.find(l => l.name === name) || {}).color] || "var(--text3)";
  const cred = t.events.reduce((a,e) => (a[e.credibility] = (a[e.credibility]||0)+1, a), {});
  const layers = t.layers.map(l => `<span class="d-layer"><i style="background:${COLOR[l.color]}"></i>${esc(l.name)}</span>`).join("");
  let evs = "", lastYear = null;
  const sorted = [...t.events].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  for(const e of sorted){
    const y = e.date.slice(0,4);
    if(y !== lastYear){ evs += `<div class="year-mark">${y}</div>`; lastYear = y; }
    const note = e.credibility_note ? `<div class="ev-note"><span class="ev-note-label">${e.credibility === "disputed" ? "諸説ありの理由" : "未検証の理由"}</span>${esc(e.credibility_note)}</div>` : "";
    const detail = e.detail ? `<div class="ev-detail">${md(e.detail)}</div>` : "";
    const srcs = (e.sources || []).filter(s => s && s.title).map(s =>
      s.url ? `<div class="ev-src">出典: <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></div>`
            : `<div class="ev-src">出典: ${esc(s.title)}</div>`).join("");
    evs += `<div class="ev">
      <div class="ev-rail"><span class="ev-dot ${e.type === "period" ? "period" : ""}" style="background:${colorOf(e.layer)}"></span></div>
      <div class="ev-body">
        <div class="ev-top">
          <span class="ev-date">${fmtDate(e)}${fmtEnd(e)}</span>
          <span class="ev-layer"><i style="background:${colorOf(e.layer)}"></i>${esc(e.layer)}</span>
          <span class="cred ${e.credibility}">${CRED[e.credibility] || esc(e.credibility)}</span>
        </div>
        <div class="ev-title">${esc(e.title)}</div>
        <div class="ev-summary">${md(e.summary)}</div>
        ${detail}${note}${srcs ? `<div class="ev-srcs">${srcs}</div>` : ""}
      </div>
    </div>`;
  }
  document.getElementById("detail").innerHTML = `
    <button class="d-back" id="back">← 一覧に戻る</button>
    <div class="d-cat">${CAT[t.category] || esc(t.category)}</div>
    <h1 class="d-title">${esc(t.title)}</h1>
    <p class="d-desc">${esc(t.description)}</p>
    <div class="d-stats">
      <span>期間 <b>${t.start_year}–${t.end_year}</b></span>
      <span>イベント <b>${t.events.length}</b></span>
      <span>検証済み <b>${cred.verified || 0}</b></span>
      <span>諸説あり <b>${cred.disputed || 0}</b></span>
      <span>未検証 <b>${cred.unverified || 0}</b></span>
      <span>slug <b>${esc(t.slug)}</b></span>
    </div>
    <div class="d-layers">${layers}</div>
    <div class="ev-list">${evs}</div>`;
  document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
}

function route(){
  const slug = decodeURIComponent(location.hash.replace(/^#/, ""));
  const t = DATA.find(x => x.slug === slug);
  const home = document.getElementById("home"), detail = document.getElementById("detail");
  if(t){
    renderDetail(t);
    home.classList.add("off"); detail.classList.add("on");
    window.scrollTo(0, 0);
  } else {
    home.classList.remove("off"); detail.classList.remove("on");
  }
}

renderHome();
document.getElementById("cats").addEventListener("click", e => {
  const card = e.target.closest(".tl-card");
  if(card) location.hash = card.dataset.slug;
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
