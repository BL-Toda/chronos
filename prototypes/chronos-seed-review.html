の品質優位につながったと評価される。半世紀後の米CHIPS法やRapidusまで続く、産業政策と半導体の関係の出発点である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"超LSI技術研究組合(1976–1980)に関する通商産業政策史資料","url":null}]},{"date":"1986-09-02","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"日米半導体協定に調印","summary":"ダンピング提訴と貿易摩擦の激化を受け、日米両政府が半導体協定に調印した。日本製品の価格監視と、日本市場での外国製半導体のシェア拡大が柱で、1991年の第2次協定では「外国系20%」の目安が明記された。\n\n民間の競争に政府が介入し、**半導体が貿易摩擦の主戦場**となった最初の事例である。翌年には第301条に基づく対日制裁関税も発動され、この構図は約30年後の米中対立で形を変えて再現される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"日米半導体協定(1986年9月2日調印)関連資料","url":null}]},{"date":"1987-02-21","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"台湾でTSMC設立、ファウンドリ業の発明","summary":"台湾の工業技術研究院を母体に、モリス・チャン(張忠謀)が台湾積体電路製造(TSMC)を設立した。自社製品を持たず他社の設計チップの製造だけを請け負う、世界初の専業ファウンドリである。\n\n**設計と製造の分離**という新しい分業は、工場を持たない設計企業の勃興を可能にし、半導体産業の構造を根本から変えた。約30年後、最先端製造がTSMCに集中したことが台湾の地政学的重要性(国家と地政学レイヤー)を一変させる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: TSMC","url":"https://en.wikipedia.org/wiki/TSMC"}]},{"date":"1988-01-01","precision":"year","end_date":null,"type":"point","layer":"企業と市場","title":"日本勢が世界半導体シェアの約半分を占める","summary":"NEC・東芝・日立が世界売上上位を占め、日本メーカー全体で世界の半導体市場の5割前後を握ったとされる。DRAMでは対米で圧倒的な品質と価格の優位を築いていた。\n\n超LSI組合(国家と地政学レイヤー)以来の投資が頂点に達した瞬間だが、同時に日米協定による制約が効き始めた時期でもある。以後、韓国サムスンの追い上げとPC時代の到来で、日本の優位は10年を待たずに崩れていく。","detail":null,"credibility":"disputed","credibility_note":"「シェア5割」は調査会社の統計に基づく概数で、集計範囲と年により数値が異なり、ピーク時期にも諸説ある。","sources":[{"title":"Dataquest/SIA 半導体市場統計に基づく各種文献","url":null}]},{"date":"1992-01-01","precision":"year","end_date":null,"type":"point","layer":"企業と市場","title":"Intelが売上首位、サムスンがDRAM首位に","summary":"この年、Intelが日本勢を抜いて半導体売上世界一となり、サムスン電子がDRAMで首位に立ったとされる。米国はメモリからMPUへ主戦場を移して復活し、韓国は国家的投資でメモリを制した。\n\n日本の一強時代の終わりを示す首位交代である。汎用品のメモリで規模の投資競争に敗れた日本と、設計で付加価値を取った米国という明暗は、その後の各国の産業政策(国家と地政学レイヤー)の教訓として繰り返し参照される。","detail":null,"credibility":"unverified","credibility_note":"首位交代の年は調査会社の集計基準により1992年前後で異なり、単一の確定値はない。","sources":[{"title":"Dataquest 1992年 世界半導体売上ランキング","url":null}]},{"date":"1997-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と製造","title":"EUV LLC結成、極端紫外線露光の研究開始","summary":"Intelが主導し米エネルギー省傘下の国立研究所と組んで、波長13.5nmの極端紫外線(EUV)露光を研究する共同事業体EUV LLCが結成された。ASMLやMotorolaなども参加した。\n\n露光波長の限界を一気に超える構想だったが、実用化には20年以上を要する。この超長期の研究開発を最終的に製品化できたのがオランダのASML一社だったことが、後の輸出規制(国家と地政学レイヤー)の急所を生むことになる。","detail":null,"credibility":"unverified","credibility_note":"結成時期は資料により1996〜1997年と幅があり、参加企業の構成も時期によって変動している。","sources":[{"title":"Wikipedia: Extreme ultraviolet lithography","url":"https://en.wikipedia.org/wiki/Extreme_ultraviolet_lithography"}]},{"date":"2007-06-29","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"iPhone発売、半導体需要の主役がモバイルへ","summary":"AppleがiPhoneを米国で発売した。高性能な省電力チップへの需要が爆発し、半導体の主戦場はPC向けからモバイル向けSoCへ移っていく。\n\n設計はArmアーキテクチャのライセンス、製造は台湾のファウンドリという分業(技術と製造レイヤー)がモバイルで標準となり、自前工場を持つIntelの優位が相対化された。Appleが後に自社設計チップをTSMCの最先端プロセスで独占的に製造する関係も、ここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: iPhone (1st generation)","url":"https://en.wikipedia.org/wiki/IPhone_(1st_generation)"}]},{"date":"2012-07-09","precision":"day","end_date":null,"type":"point","layer":"技術と製造","title":"IntelがASMLに共同出資、EUV開発を加速","summary":"IntelがASMLの次世代露光技術開発への共同投資プログラムに参加し、株式取得を含め最大約41億ドルを投じると発表した。TSMCとサムスンも同様の出資プログラムに続いた。\n\n競合する半導体メーカー3社がそろって装置メーカー1社に資金を出すという異例の構図であり、EUV実用化の資金難がそれだけ深刻だったことを示す。結果としてASMLの独占(企業と市場レイヤー)は決定的になり、露光装置は産業全体の共有インフラと化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Intel News Release: Intel and ASML customer co-investment program (2012-07-09)","url":null}]},{"date":"2015-05-08","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"中国が「中国製造2025」を発表","summary":"中国国務院が製造強国化の10年計画「中国製造2025」を公表した。半導体は中核分野に位置づけられ、国家集積回路産業投資基金(大基金)を通じた巨額の投資が加速した。\n\n輸入額が原油を上回る半導体の国産化は中国の悲願であり、この計画が米国の警戒を決定的にした。紫光集団による米メモリ企業への買収提案など攻勢が続き、数年後のZTE・ファーウェイへの制裁(同レイヤー)の伏線となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"中国国務院: 中国製造2025 (2015年5月8日公布)","url":null}]},{"date":"2018-04-16","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米国がZTEへの部品輸出を禁止","summary":"米商務省が、対イラン制裁違反の和解条件に背いたとして中国の通信機器大手ZTEへの米国製部品の輸出を7年間禁止した。米国製チップに依存するZTEは主要業務の停止に追い込まれ、後に罰金と経営陣刷新で解除された。\n\n**米国製半導体を断てば大企業が数週間で止まる**ことを世界に示した事件であり、中国は国産化投資をさらに加速する。供給網が武器になり得るという認識が、以後の各国の政策(企業と市場レイヤーの再編を含む)を規定していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省BIS: ZTE Denial Order (2018-04)","url":null}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"技術と製造","title":"EUV露光が量産適用、微細化の限界を突破","summary":"TSMCとサムスンが7nm世代のロジック半導体でEUV露光の量産適用を開始した。1997年のEUV LLC結成から20年余り、装置1台150億円超のASML製EUV露光機がようやく製造ラインに入った。\n\n最先端の微細化を続けられる企業はこの時点でTSMC・サムスン・(遅れて)Intelの3社に絞られた。EUV機を持つことが国力の指標のように扱われはじめ、対中輸出の管理対象(国家と地政学レイヤー)にもEUVが真っ先に挙がった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Extreme ultraviolet lithography","url":"https://en.wikipedia.org/wiki/Extreme_ultraviolet_lithography"}]},{"date":"2019-05-16","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米国がファーウェイをエンティティリストに追加","summary":"米商務省が華為技術(ファーウェイ)を輸出管理のエンティティリストに追加し、米国技術を用いた製品の供給を許可制にした。翌2020年には米国製装置で作られた半導体全般へ規制が拡大され、TSMCも取引を停止した。\n\n世界2位のスマートフォンメーカーが最先端チップを調達できなくなり、**技術覇権をめぐる米中の分断**が決定的になった。サプライチェーンの各社(企業と市場レイヤー)は、地政学リスクを前提とした再編を迫られる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省BIS: Entity List追加発表 (2019年5月)","url":null}]},{"date":"2020-12-01","precision":"month","end_date":"2023-06-30","type":"period","layer":"企業と市場","title":"世界的な半導体不足","summary":"コロナ禍の需要急変と供給網の混乱により、車載半導体を発端とする世界的な供給不足が発生した。自動車各社は減産を余儀なくされ、ゲーム機や家電まで品薄が広がった。\n\n数十円のチップ1個の欠品が数百万円の自動車の生産を止めるという事実は、各国政府に半導体を経済安全保障の問題として認識させた。米CHIPS法や日本のTSMC誘致(国家と地政学レイヤー)への政治的な追い風は、この不足が作ったといえる。","detail":null,"credibility":"disputed","credibility_note":"不足の開始・終息時期は製品分野により大きく異なり、期間の区切り方には業界内でも幅がある。","sources":[{"title":"Wikipedia: 2020–2023 global chip shortage","url":"https://en.wikipedia.org/wiki/2020%E2%80%932023_global_chip_shortage"}]},{"date":"2022-08-09","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米CHIPS法成立、527億ドルの半導体支援","summary":"バイデン大統領がCHIPS・科学法に署名した。米国内の半導体製造と研究開発に527億ドルの補助金を投じ、支援を受けた企業の対中先端投資を10年間制限するガードレール条項を付けた。\n\n自由貿易を掲げてきた米国が**補助金による産業政策へ回帰**した転換点である。半導体不足(企業と市場レイヤー)と台湾有事への懸念が超党派の合意を生み、EU・日本・インドも同様の巨額支援策で追随した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: CHIPS and Science Act","url":"https://en.wikipedia.org/wiki/CHIPS_and_Science_Act"}]},{"date":"2022-10-07","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米国が先端半導体の対中輸出規制を発表","summary":"米商務省が、先端ロジック・メモリの製造装置と高性能AIチップの対中輸出を包括的に規制した。米国人技術者が中国の先端半導体開発を支援することまで許可制とする、異例に踏み込んだ内容だった。\n\n特定企業ではなく中国の産業全体の技術水準を凍結しようとする設計であり、日本とオランダも2023年に装置規制で歩調を合わせた。露光装置の急所(技術と製造レイヤー)を握る同盟国の協調が規制の実効性を支えている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米商務省産業安全保障局(BIS) 2022年10月7日発表 輸出管理規則改正","url":null}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"Rapidus設立、日本が2nmへ再挑戦","summary":"トヨタ・ソニー・NTTなど8社の出資で設立されたRapidusが発表され、IBMとの提携で2027年の2nm世代量産を目指す計画が示された。政府は研究開発拠点LSTCの設立と数千億円規模の支援を決めた。\n\n40nm世代で止まった日本の先端ロジック製造への、四半世紀ぶりの再挑戦である。超LSI組合の成功体験と、その後の国策プロジェクトの失敗の記憶の両方を背負っており、国家と地政学レイヤーの追い風をどこまで実装力に変えられるかが問われている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省: 次世代半導体の設計・製造基盤確立に向けて (2022-11-11)","url":null}]},{"date":"2024-02-24","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"TSMC熊本工場が開所","summary":"TSMCが日本のソニー・デンソーなどと合弁で建設した熊本第一工場(JASM)が開所式を迎えた。日本政府は最大4760億円を補助し、着工から2年足らずという異例の速さで完成した。\n\n最先端ではなく成熟世代の工場だが、**製造拠点の分散が国家の保険になる**という新しい常識を体現する。台湾一極集中への懸念(国家と地政学レイヤー)が、補助金と速度で立地を動かした代表例であり、第二工場の建設も決まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"JASM/TSMC 熊本第一工場開所式 (2024-02-24)","url":null}]},{"date":"2024-06-18","precision":"day","end_date":null,"type":"point","layer":"企業と市場","title":"NVIDIAが時価総額世界一に","summary":"生成AI向けGPU需要の爆発を受け、NVIDIAの時価総額が一時Microsoftを抜いて世界一となった。1993年創業のゲーム用チップ企業が、AIデータセンター投資の中心に立った。\n\n売れているGPUの製造はTSMCの最先端プロセスと先端パッケージングに全面依存しており、設計(米)・製造(台)・装置(蘭・日)という分業の相互依存を象徴する。AIチップの対中輸出規制(国家と地政学レイヤー)は同社の売上構成をも直接左右している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters: Nvidia becomes world's most valuable company (2024-06-18)","url":null}]},{"date":"2025-08-22","precision":"day","end_date":null,"type":"point","layer":"国家と地政学","title":"米政府がIntel株式の約10%を取得","summary":"米政府がCHIPS法の補助金等を株式に転換する形でIntelの株式約10%を取得することで同社と合意した。経営不振が続く同社に対し、政府が大株主として関与する異例の枠組みである。\n\n補助金による支援からさらに踏み込み、**国家が半導体企業の株主になる**段階に達した。自由市場の旗手だった米国の変化は50年前の日本の産業政策すら超えるもので、政府の企業介入の是非をめぐる論争を呼んでいる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Intel Newsroom: 米政府による出資合意の発表 (2025-08-22)","url":null}]}]},{"slug":"tech-social-media","title":"📱 SNSが変えた世界","description":"Facebook誕生からTikTok規制まで。プラットフォームの進化、社会と政治への波及、規制の応答という3つのレイヤーを重ねて、SNSが世論と統治の形をどう変えてきたのかを追いかける年表です 📱","category":"technology","language":"ja","start_year":2004,"end_year":2025,"layers":[{"name":"プラットフォーム","color":"blue"},{"name":"社会と政治","color":"pink"},{"name":"規制と説明責任","color":"teal"}],"events":[{"date":"2004-02-04","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"🎓 ハーバードの学生寮でFacebookが誕生","summary":"マーク・ザッカーバーグたちが、ハーバード大学の学生向けサイト「TheFacebook」を公開しました。実名と現実の人間関係をそのままオンラインに持ち込む設計は、匿名が当たり前だった当時のネットではかなり異例です。\n\nこの実名制が、のちの広告ビジネスと個人データ集積の土台になりました。2010年代のプライバシー問題(規制と説明責任レイヤー)の遠因も、たどればこの設計思想です。20年後に30億人が使うインフラになるとは、当時は誰も想像していませんでした!","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Facebook","url":"https://en.wikipedia.org/wiki/Facebook"}]},{"date":"2006-07-15","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"🐦 Twitterが一般公開","summary":"140字の短文を投稿する「Twitter」が一般公開されました。フォローという非対称な関係と、公開が基本の投稿。友だち同士の交流が前提だったそれまでのSNSとは違う、速報と拡散に向いた構造です。\n\nこの構造のおかげで、Twitterはのちに報道・災害・政治の基盤(社会と政治レイヤー)になり、各国の首脳が直接発信する場にもなります。個人のつぶやきと公共の言論が同じタイムラインに並ぶ空間は、ここから始まりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Twitter","url":"https://en.wikipedia.org/wiki/Twitter"}]},{"date":"2006-09-05","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"📰 FacebookがNews Feedを導入","summary":"Facebookが、友人の行動を時系列で自動表示する「News Feed」を導入しました。出た当初は「監視みたいだ」と強い反発を受けたのに、利用時間は急増!まもなくSNSの標準機能になります。\n\n自分で見に行く場から、**アルゴリズムが情報の流れを決める**場への転換点です。この配信の仕組みがのちに、偽情報の拡散や分断の増幅(社会と政治レイヤー)をめぐる論争の中心になっていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Feed (Facebook)","url":null}]},{"date":"2010-10-06","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"📷 Instagram公開、写真SNSの時代へ","summary":"写真共有アプリInstagramがiPhone向けに公開され、初日だけで約2万5000人が登録しました!正方形の写真とフィルターという制約の強い設計が、スマホのカメラ性能の向上とうまく噛み合ったんですね。\n\n言葉より画像で自己表現する文化はここで主流になり、「映え」が消費や観光を動かす経済現象に。後年、外見の比較が若い世代の心理に与える影響(社会と政治レイヤー)が公衆衛生の議題に上る、その素地でもあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2010-12-17","precision":"day","end_date":"2011-12-31","type":"period","layer":"社会と政治","title":"✊ アラブの春、SNSが動員の基盤に","summary":"チュニジアでの青年の焼身自殺をきっかけに、反政府デモが中東・北アフリカへ連鎖。チュニジアやエジプトで長期政権が倒れました。FacebookやTwitterがデモの告知と映像拡散に使われ、「SNS革命」と呼ばれます。\n\nSNSが**国家権力に対する動員のインフラ**になり得ると、世界が気づいた出来事です。ただ、各国政府の側も監視と遮断の技術をここで学びました。規制と説明責任レイヤーでは、統制強化の転機でもあります。","detail":null,"credibility":"disputed","credibility_note":"政変にSNSがどれだけ効いたのかは研究者の間でも評価が分かれていて、「SNS革命」という呼び名そのものに異論があります。","sources":[{"title":"Wikipedia: Arab Spring","url":"https://en.wikipedia.org/wiki/Arab_Spring"}]},{"date":"2011-03-11","precision":"day","end_date":null,"type":"point","layer":"社会と政治","title":"📡 東日本大震災、SNSが災害情報インフラに","summary":"東日本大震災の直後、電話がつながりにくくなる中で、TwitterなどのSNSが安否確認と情報共有の手段として機能しました。震災当日の日本発ツイートは、平常時を大きく上回ったとされています。\n\n日本でSNSが「娯楽」から「社会インフラ」へと見方を変えた転機で、以後、自治体や公共機関の公式アカウント開設が一気に進みます。同時にデマの拡散という課題もはっきり現れ、災害時の情報検証という論点が生まれました。","detail":null,"credibility":"unverified","credibility_note":"震災当日のツイート数の増加率は集計する主体によって数字が違っていて、確定的な統計はありません。","sources":[{"title":"総務省: 情報通信白書(平成23年版) 東日本大震災における情報通信の状況","url":null}]},{"date":"2012-04-09","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"💵 FacebookがInstagramを10億ドルで買収","summary":"Facebookが、社員たった13人のInstagramを約10億ドルで買収すると発表しました。売上のないアプリへの巨額買収は当時「高すぎる」と言われましたが、結果はIT史上屈指の安い買い物と評されるようになります!\n\n有力な新興サービスを早めに取り込む成長戦略の象徴です。のちのWhatsApp買収と合わせて「競争の芽を摘む買収では」という議論(規制と説明責任レイヤー)を呼び、米当局は2020年に同社を反トラストで提訴しました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Instagram (Acquisition by Facebook)","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2013-06-01","precision":"month","end_date":null,"type":"point","layer":"規制と説明責任","title":"🕵️ スノーデンが大規模監視を告発","summary":"元NSA契約職員のエドワード・スノーデンが、米政府が大手IT企業のデータに広くアクセスする監視プログラムの存在を告発しました。SNSやメールの利用記録が国家監視の対象だと、具体的に示されたのです。\n\nプラットフォームにたまった個人データ(プラットフォームレイヤー)が国家に流れ得る。この事実は世界に衝撃を与え、通信を常時暗号化する流れを一気に進めました。EUのデータ保護強化の議論も、この事件で加速します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Edward Snowden","url":"https://en.wikipedia.org/wiki/Edward_Snowden"}]},{"date":"2016-09-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"🎬 抖音(Douyin)公開、ショート動画時代の幕開け","summary":"中国のByteDanceが短尺動画アプリ「抖音」を公開しました。翌年に国際版TikTokを展開し、買収したMusical.lyと統合して世界市場へ急拡大していきます。\n\nフォロー関係よりも推薦アルゴリズムを核にする設計は、友だちのつながりを前提としてきたSNSの定義を書き換えました。中国企業のアプリが欧米の若い世代の主要メディアになったことは、のちに安全保障上の争点(規制と説明責任レイヤー)へ発展します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: TikTok","url":"https://en.wikipedia.org/wiki/TikTok"}]},{"date":"2016-11-08","precision":"day","end_date":null,"type":"point","layer":"社会と政治","title":"🗳️ 米大統領選、SNS上の偽情報と影響工作が争点に","summary":"トランプ氏が勝利した米大統領選で、SNS上の偽ニュースの拡散と、ロシアによる組織的な影響工作が明らかになりました。プラットフォームの責任を問う議論が、世界規模で始まります。\n\nSNSが**世論操作の主戦場**になり得ると広く認識された転機です。翌年以降、各社はファクトチェックや広告透明化(プラットフォームレイヤー)を導入し、各国は規制の検討(規制と説明責任レイヤー)を本格化させました。","detail":null,"credibility":"disputed","credibility_note":"影響工作があったこと自体は米司法省の捜査で確認されていますが、それが選挙結果をどこまで左右したかは実証されておらず、評価が分かれています。","sources":[{"title":"米司法省特別検察官報告書(ミュラー報告書、2019)","url":null}]},{"date":"2018-03-17","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"🔓 ケンブリッジ・アナリティカ事件が発覚","summary":"英コンサル企業ケンブリッジ・アナリティカが、最大8700万人分のFacebookユーザーデータを不正に取得し、選挙広告の標的設定に使っていたと報じられました。ザッカーバーグCEOは米議会での証言に立ちます。\n\n2016年米大統領選(社会と政治レイヤー)への疑念と結びついて、SNSのデータ利用への信頼が決定的に揺らいだ事件です。FTCは2019年、Facebookに50億ドルの制裁金を科し、規制強化の流れがここで固まりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Facebook–Cambridge Analytica data scandal","url":"https://en.wikipedia.org/wiki/Facebook%E2%80%93Cambridge_Analytica_data_scandal"}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"🛡️ EUで一般データ保護規則(GDPR)施行","summary":"個人データの処理に同意取得や削除権などを義務づけ、違反には全世界売上の最大4%の制裁金。そんな強い設計のGDPRがEUで施行されました。域外の企業にも適用されます。\n\nスノーデンの告発やデータ不正利用事件を経て、**個人データを基本権として守る**という欧州の姿勢が法律になった形です。各社の同意画面や設定(プラットフォームレイヤー)は世界共通で改修され、各国のデータ保護法の手本になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2016/679 (GDPR)","url":"https://eur-lex.europa.eu/eli/reg/2016/679/oj"}]},{"date":"2021-01-08","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"🚫 Twitterがトランプ大統領のアカウントを永久凍結","summary":"米連邦議会議事堂の襲撃事件(1月6日)を受けて、Twitterが「さらなる暴力扇動の恐れ」を理由に、現職大統領のアカウントを永久凍結しました。FacebookやYouTubeも同様の停止措置を取ります。\n\n**私企業が国家元首の発信を止められる**。この事実は、言論空間の統治権は誰にあるのかという根源的な問いを世界に突きつけました。判断への評価は割れ、のちのマスク氏による凍結解除(プラットフォームレイヤー)まで論争が続きます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Twitter Blog: Permanent suspension of @realDonaldTrump (2021-01-08)","url":null}]},{"date":"2021-09-27","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"📈 TikTokが月間利用者10億人と発表","summary":"TikTokが、月間アクティブユーザーが10億人に達したと発表しました。国際版の提供開始から約4年での到達で、FacebookやYouTubeより速いペースとされます。\n\n推薦アルゴリズム主導の設計が世界標準になったことを示す数字で、Metaは対抗機能Reelsへ全面的に舵を切りました。一方で、若い世代への影響や中国政府との関係への懸念(規制と説明責任レイヤー)も、利用者数と一緒に膨らんでいきます。","detail":null,"credibility":"unverified","credibility_note":"10億人はあくまで自社発表の数字で、第三者機関による検証はされていません。","sources":[{"title":"TikTok Newsroom: Thanks a billion (2021-09-27)","url":null}]},{"date":"2021-10-05","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"📄 元Facebook社員ハウゲンが内部文書を告発","summary":"元Facebook社員のフランシス・ハウゲンが大量の内部文書を持ち出し、米上院で証言しました。Instagramが10代の少女の心身に有害だと社内調査が示していたのに、対策が不十分だった。それが告発の核心です。\n\n企業が自社サービスの害を認識していた証拠が示されたことで、議論は外部の推測から**内部文書に基づく責任追及**へと段階を変えました。各国の未成年保護規制や、のちの州政府による提訴の重要な根拠になっています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米上院商業科学運輸委員会公聴会証言 (2021-10-05)","url":null}]},{"date":"2022-10-27","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"🐤 マスク氏がTwitterを440億ドルで買収","summary":"イーロン・マスク氏がTwitterを約440億ドルで買収し、非公開化しました。大規模な人員削減、認証制度の有料化、凍結アカウントの復活、そして「X」への改名と、方針を次々に転換していきます。\n\n公共の言論基盤と呼ばれたサービスが一個人の所有物になったことで、モデレーションの基準が経営者の考えひとつで変わり得ると見えるようになりました。広告主の離脱やEUのDSAによる監視(規制と説明責任レイヤー)など、緊張は続いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Acquisition of Twitter by Elon Musk","url":"https://en.wikipedia.org/wiki/Acquisition_of_Twitter_by_Elon_Musk"}]},{"date":"2023-05-23","precision":"day","end_date":null,"type":"point","layer":"社会と政治","title":"🩺 米公衆衛生局長官がSNSと若者の危機で勧告","summary":"米公衆衛生局長官が、SNSは若者のメンタルヘルスに深刻なリスクをもたらし得るとする勧告を発表しました。たばこや飲酒と同じ公衆衛生問題として扱う枠組みを示した点が画期的です。\n\nハウゲンの内部告発(規制と説明責任レイヤー)以降に積み上がった研究と訴訟を背景に、「SNSと子ども」が政策課題としてはっきり確立しました。翌年の豪州の年齢制限法など、各国の未成年規制はこの流れの延長にあります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Surgeon General Advisory: Social Media and Youth Mental Health (2023)","url":null}]},{"date":"2024-02-17","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"⚖️ EUデジタルサービス法(DSA)が全面適用","summary":"違法コンテンツ対応、推薦アルゴリズムの透明化、研究者へのデータ提供。これらを大手プラットフォームに義務づけるDSAが、EU域内の全事業者に適用されました。違反には全世界売上の最大6%の制裁金です。\n\nGDPRがデータを守る法律だとすれば、DSAは**アルゴリズムと運営に説明責任を課す**法律。X社への正式手続きなど執行も始まり、プラットフォームの設計(プラットフォームレイヤー)をEU基準が縛る時代に入りました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2022/2065 (Digital Services Act)","url":"https://eur-lex.europa.eu/eli/reg/2022/2065/oj"}]},{"date":"2024-11-01","precision":"month","end_date":null,"type":"point","layer":"規制と説明責任","title":"🇦🇺 豪州が16歳未満のSNS利用を禁止する法律を可決","summary":"オーストラリア議会が、16歳未満のSNS利用を禁止し、年齢確認をプラットフォーム側の義務とする世界初の法律を可決しました。2025年12月から適用され、違反企業には最大4950万豪ドルの罰金が科されます。\n\n米公衆衛生局長官の勧告(社会と政治レイヤー)に象徴される「若者への害」の議論が、ついに利用そのものの禁止という強い立法にまで至りました。年齢確認の実効性とプライバシーへの影響をめぐって、各国が実施を注視しています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Online Safety Amendment (Social Media Minimum Age) Act 2024 (豪州)","url":null}]},{"date":"2025-01-19","precision":"day","end_date":null,"type":"point","layer":"規制と説明責任","title":"🇺🇸 米TikTok禁止法が発効、一時サービス停止","summary":"ByteDanceに米国事業の売却を求め、応じなければ配信禁止という法律が発効し、TikTokは米国で一時サービスを停止しました。新政権の執行猶予でまもなく復旧しましたが、売却をめぐる交渉は長引きます。\n\n1億7000万人が使うアプリが、安全保障を理由に止められた事例です。アラブの春の頃には自由の道具とされたSNS(社会と政治レイヤー)が、国家間対立の駒になったことを象徴しています。データの帰属が主権の問題になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Restrictions on TikTok in the United States","url":"https://en.wikipedia.org/wiki/Restrictions_on_TikTok_in_the_United_States"}]}]},{"slug":"tech-space-internet","title":"🛰️ 宇宙インターネット計画","description":"イリジウムの挫折から数千基の衛星コンステレーション、スマホと衛星の直接通信まで。打ち上げ技術・事業競争・規制の3層で、宇宙からインターネットを届ける挑戦の四半世紀を追いかけます。空の上を飛ぶ機械たちの現在地です。","category":"technology","language":"ja","start_year":1998,"end_year":2025,"layers":[{"name":"技術と打ち上げ","color":"blue"},{"name":"事業と競争","color":"orange"},{"name":"規制と社会","color":"teal"}],"events":[{"date":"1998-11-01","precision":"day","end_date":"1999-08-13","type":"period","layer":"事業と競争","title":"イリジウム、衛星電話開始から9か月で経営破綻","summary":"モトローラ主導のイリジウムが、66基の低軌道衛星による世界初の衛星携帯電話サービスを始めました。しかし高額な端末と通話料で加入者は伸びず、9か月後、当時史上最大級の経営破綻に至ります。\n\n「宇宙から全地球に通信を届ける」構想の、最初の大きな挫折です。**需要を読み違えた宇宙事業の墓標**として長く語られました。同時期のテレデシックやグローバルスターの構想も相次いで頓挫し、夢は20年近く凍結されます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"The New York Times報道 (1999-08)","url":null}]},{"date":"2015-01-01","precision":"month","end_date":null,"type":"point","layer":"事業と競争","title":"🛰️ スペースXが衛星インターネット構想を発表","summary":"イーロン・マスクがシアトルでの講演で、数千基の低軌道衛星により全世界へブロードバンドを届ける構想(後のStarlink)を発表しました。収益は火星移住計画の資金源にすると語っています。\n\nイリジウムの失敗から15年余り。構想を蘇らせたのは、再使用ロケットによる**打ち上げコストの劇的低下**です。同時期にOneWebも同様の計画で資金調達を進めていて、第2次衛星コンステレーション競争の号砲になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表・報道 (2015-01)","url":null}]},{"date":"2018-02-22","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"Starlink試験衛星2基を打ち上げ","summary":"スペースXがFalcon 9ロケットで、Starlinkの試験衛星「Tintin A/B」2基を打ち上げました。低軌道からのブロードバンド通信の実証が、ここから始まります。\n\n量産設計に先立ち、アンテナや通信方式の課題を洗い出す技術検証の段階です。並行して米FCCへの数千基規模の認可申請(規制と社会レイヤー)も進んでいました。翌年の量産機一括打ち上げへ向けた、静かな助走です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表・FCC申請資料 (2018)","url":null}]},{"date":"2019-02-27","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"OneWebが最初の6衛星を打ち上げ","summary":"英OneWebが最初の6基の衛星をソユーズロケットで打ち上げ、コンステレーションの構築を始めました。ソフトバンクなどから巨額の出資を集めた、Starlinkの最大の対抗馬です。\n\nスペースXと違い、自前のロケットを持たず打ち上げを外部調達に頼る構造が、重いコストとしてのしかかります。打ち上げ手段を持つ者と持たざる者の差は、翌年の同社の経営破綻(事業と競争レイヤー)で最初の答えを見ることになりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"OneWeb発表 (2019-02)","url":null}]},{"date":"2019-05-24","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"🚀 Starlink量産衛星60基を一括打ち上げ","summary":"スペースXがFalcon 9の1機で、量産型Starlink衛星60基を一括投入しました。平積みの専用搭載方式で、1回の打ち上げが従来の衛星網数個分。この規模感には度肝を抜かれました。\n\n衛星を一点物ではなく「量産品」として扱う発想の転換です。以後ほぼ隔週の打ち上げで、軌道上の衛星は数年で数千基に達します。直後から天文学者が夜空に並ぶ光跡へ懸念を表明し(規制と社会レイヤー)、軌道の混雑が現実の問題になりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表 (2019-05)","url":null}]},{"date":"2019-06-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"国際天文学連合が衛星群の光害に懸念声明","summary":"国際天文学連合(IAU)が、衛星コンステレーションの反射光が天体観測と夜空の景観に与える影響について、懸念を表明する声明を発表しました。\n\nStarlink衛星60基の一括打ち上げ(技術と打ち上げレイヤー)の直後の反応で、**軌道と夜空は誰のものか**という新しい規制問題の始まりです。スペースXは反射低減塗装やサンバイザーで対応しましたが、電波天文学への影響や衛星急増そのものへの懸念は現在まで続いています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IAU Statement on Satellite Constellations (2019-06)","url":null}]},{"date":"2020-03-27","precision":"day","end_date":null,"type":"point","layer":"事業と競争","title":"OneWebが経営破綻、英政府連合が救済","summary":"OneWebがコロナ禍での資金調達難から連邦破産法11条を申請しました。主要出資者ソフトバンクの追加出資見送りが背景と報じられています。同年7月には英政府とインドのバーティ・グローバルが買収し、再建へ向かいました。\n\n民間資金だけで衛星網を築く難しさを示すと同時に、英政府の買収参画は、衛星コンステレーションが**国家インフラとしての価値**を持ち始めたことの表れです。以後、各国政府が自前の衛星網構想を掲げる流れが加速します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters報道 (2020-03-27)","url":null}]},{"date":"2020-07-30","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"米FCCがアマゾンの衛星網Project Kuiperを認可","summary":"米連邦通信委員会(FCC)がアマゾンの衛星コンステレーション計画「Project Kuiper」の3,236基を認可しました。2020年代末までに半数を配備することが条件として付されています。\n\n巨大IT企業の本格参入を規制当局が認めた節目で、低軌道の軌道枠と周波数の割当が競争の主戦場になったことを示しました。配備期限という規制上の仕掛けは、後にKuiperの打ち上げを急がせる強制力(事業と競争レイヤー)として働くことになります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FCC Order: Kuiper Systems LLC (2020-07)","url":null}]},{"date":"2020-10-01","precision":"month","end_date":null,"type":"point","layer":"事業と競争","title":"Starlinkが一般向けベータサービスを開始","summary":"スペースXが北米で「Better Than Nothing Beta(何もないよりマシなベータ)」と名づけた一般向け試験サービスを始めました。月額99ドル・機器代499ドルながら、光回線の届かない地域の住民から予想を上回る需要を集めます。\n\n謙遜した名前とは裏腹に、ブロードバンド空白地帯という明確な市場を突いた出発でした。イリジウムが読み違えた「顧客は誰か」に、取り残された地域の住民という答えを示した点が、四半世紀前との本質的な違いです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX案内・報道 (2020-10)","url":null}]},{"date":"2022-02-08","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"磁気嵐でStarlink衛星最大40基を喪失","summary":"打ち上げ直後の低い軌道にあったStarlink衛星49基のうち最大40基が、磁気嵐に伴う大気の膨張で軌道を維持できず失われたとスペースXが発表しました。\n\n宇宙天気が大規模コンステレーションの現実的なリスクだと示した、初の大量喪失事例です。不良機を早期に処分できるよう低い初期軌道へ投入する運用設計が、逆に嵐への弱点になった面もあります。運用高度と宇宙環境予報の大切さを思い知らされる出来事でした。","detail":null,"credibility":"disputed","credibility_note":"喪失数は同社発表で「最大40基」とされ、最終的に確定した数は公表されていません。","sources":[{"title":"SpaceX update: Geomagnetic storm and recently deployed Starlink satellites (2022-02)","url":null}]},{"date":"2022-02-26","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"ウクライナ侵攻直後、Starlinkが戦時の通信網に","summary":"ロシアの侵攻で通信網が攻撃されるなか、ウクライナ政府高官のSNS上の要請に応じ、スペースXがStarlinkを同国で有効化して端末を順次供給しました。衛星網が戦時の基幹通信を支えた、初の大規模事例です。\n\n一民間企業のサービスが戦争の帰趨に関わる状況は、**一企業が握る地政学的な力**への各国の警戒を呼び覚ましました。欧州の独自衛星網IRIS²構想をはじめ、通信の主権を問い直す各国の動きは、この経験を直接の背景にしています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters・BBC報道 (2022-02〜03)","url":null}]},{"date":"2023-04-01","precision":"month","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"📱 AST、市販スマホと衛星の直接通話に成功と発表","summary":"米AST SpaceMobileが、試験衛星BlueWalker 3を使い、改造していない市販のスマートフォンとの衛星経由の音声通話に成功したと発表しました。\n\n専用端末が前提だった衛星通信の常識を覆し、「基地局を空に置く」方式の実現性を示した発表です。既存の携帯事業者と組んで圏外そのものを消しにいく路線は、Starlinkのスマホ直接接続と並ぶ第二の競争軸(事業と競争レイヤー)へ育っていきます。","detail":null,"credibility":"unverified","credibility_note":"通話成功は同社の発表に基づくもので、通信品質や再現性についての第三者による検証は公表されていません。","sources":[{"title":"AST SpaceMobile press release (2023-04)","url":null}]},{"date":"2023-10-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"FCCがスペースデブリ規則違反に初の制裁金","summary":"米FCCが、退役衛星を約束した軌道へ離脱させる義務を怠ったとして、衛星放送会社DISHに15万ドルの制裁金を科しました。宇宙ゴミをめぐる規制当局として、初の処分です。\n\n金額こそ小さいものの、軌道を「管理され、執行の対象となる環境」として扱った先例になりました。数千基規模のコンステレーション時代に、衝突リスクとデブリの責任を誰がどう負うのか。その問いへの最初の制度的な応答です。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FCC Enforcement Bureau発表 (2023-10)","url":null}]},{"date":"2024-01-02","precision":"day","end_date":null,"type":"point","layer":"技術と打ち上げ","title":"Starlink、スマホ直結用衛星の打ち上げを開始","summary":"スペースXが、スマートフォンと直接通信するdirect-to-cell機能を持つ最初のStarlink衛星6基を打ち上げました。地上の携帯事業者の周波数を使い、圏外のスマホへそのまま電波を届ける方式です。\n\nT-Mobileをはじめ各国の携帯事業者との提携により、衛星網は携帯網の「圏外を埋める層」として組み込まれ始めました。ASTとの競争も本格化し、宇宙インターネットは固定回線の代替からモバイルの補完へ戦線を広げています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"SpaceX発表 (2024-01)","url":null}]},{"date":"2024-08-06","precision":"day","end_date":null,"type":"point","layer":"事業と競争","title":"中国の「千帆星座」が初打ち上げ","summary":"上海市系企業が主導する衛星コンステレーション「千帆」の最初の18基が打ち上げられました。最終的には1万基を超える衛星網を構想しているとされます。\n\n国家主導の「国網」構想と並ぶ、中国の大規模計画の始動です。低軌道の軌道枠と周波数の獲得競争は、米中の国家間競争の様相を帯びてきました。軌道は事実上早い者勝ちの側面が強く、**配備の速度そのものが地政学的な意味**を持つ段階に入っています。","detail":null,"credibility":"unverified","credibility_note":"計画総数(1万基超)は報道・申請ベースの数値で、実際の配備規模と時期は確定していません。","sources":[{"title":"新華社・Reuters報道 (2024-08)","url":null}]},{"date":"2024-12-01","precision":"month","end_date":null,"type":"point","layer":"規制と社会","title":"EUが独自衛星網IRIS²の契約を締結","summary":"欧州委員会が、官民連携による独自の衛星コンステレーション「IRIS²」のコンセッション契約を締結しました。約290基を2030年頃までに配備し、政府向けのセキュア通信と商用ブロードバンドを提供する計画です。\n\n特定企業のサービスへの依存に対する危機感から生まれた、**通信主権**の具体化です。ウクライナでの経験(2022年)が直接の教訓になりました。規模と速度で米中に劣る欧州が、規制と公共調達で対抗する構図がここに定まります。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Commission発表 (2024-12)","url":null}]},{"date":"2025-01-01","precision":"year","end_date":null,"type":"point","layer":"事業と競争","title":"Starlink利用者500万人超、事業は黒字化と発表","summary":"スペースXが、Starlinkの利用者が世界で500万人を超えたことを明らかにしました。約130か国で提供され、航空機や船舶への搭載も進み、衛星通信の売上は同社のロケット事業を上回る規模になったとされます。\n\nイリジウムが数万加入で沈んでから四半世紀。宇宙インターネットは初めて**商業的に成立する事業**になったとみられます。ただし利用者数も黒字化も自社発表で、巨額の衛星更新費用を含めた採算の全体像は外からは検証できません。","detail":null,"credibility":"disputed","credibility_note":"利用者数・収益性はいずれも同社および経営陣の発言に基づくもので、監査済み財務情報としては公開されていません。","sources":[{"title":"SpaceX発表・報道 (2025)","url":null}]},{"date":"2025-04-28","precision":"day","end_date":null,"type":"point","layer":"事業と競争","title":"アマゾンKuiper、最初の本格衛星27基を打ち上げ","summary":"アマゾンがProject Kuiperの最初の本格運用衛星27基を打ち上げ、コンステレーションの構築を始めました。FCC認可に付された配備期限が迫るなかでの船出です。\n\n認可(2020年)から5年を要した遅れは、打ち上げ手段の確保が今なお最大の関門であることを物語ります。自前ロケットを持つスペースXの優位は揺らぎませんが、ECとクラウドに衛星網を結びつけるという別の戦い方を、アマゾンは狙っています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon発表 (2025-04)","url":null}]}]},{"slug":"tech-web3-metaverse","title":"🪐 Web3.0とメタバース","description":"ビットコインの思想からNFTの熱狂、メタバースへの巨額投資と撤退、制度化まで。ネットの片隅で生まれた理想が投機とお祭りを行ったり来たりする様子を、技術・資本・社会の3層でゆるく追いかける年表です 🪙","category":"technology","language":"ja","start_year":2008,"end_year":2025,"layers":[{"name":"技術とプロトコル","color":"blue"},{"name":"資本と市場","color":"orange"},{"name":"社会と制度","color":"teal"}],"events":[{"date":"2008-10-31","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"🪙 ビットコイン論文公開、非中央集権の原点","summary":"サトシ・ナカモトを名乗る誰かが、暗号学メーリングリストに論文「Bitcoin: A Peer-to-Peer Electronic Cash System」を投稿。銀行みたいな中央管理者なしで価値を送れる仕組みを、たった9ページで示しました!\n\nブロックチェーンの**「分散と所有」の理想**はここが始まりで、後のWeb3.0もNFTもメタバース経済圏の議論も、たどるとぜんぶこの論文に行き着きます。投稿主の正体は、今も不明のままです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Bitcoin: A Peer-to-Peer Electronic Cash System (bitcoin.org)","url":"https://bitcoin.org/bitcoin.pdf"}]},{"date":"2014-04-01","precision":"month","end_date":null,"type":"point","layer":"技術とプロトコル","title":"📝 ギャビン・ウッドが「Web 3.0」を提唱","summary":"イーサリアム共同創設者のギャビン・ウッドがブログ記事で「Web 3.0」を提唱。中央のサーバーに頼らず、暗号技術で信頼を担保する分散型ウェブの構想でした。\n\nこの時点では技術者コミュニティ内の、いわば界隈の内輪の概念。資本と市場レイヤーがこの語を看板に掲げて押し寄せるのは7年後の2021年です。思想だった言葉が投機の旗印へ変わっていく、その出発点の文書でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Gavin Wood: ĐApps: What Web 3.0 Looks Like (2014)","url":null}]},{"date":"2015-07-30","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"⛏️ イーサリアム稼働、スマートコントラクトの基盤","summary":"ヴィタリック・ブテリンらが開発したイーサリアムのメインネット「Frontier」が稼働。契約をコードとして自動執行するスマートコントラクトで、ブロックチェーンの使い道を通貨以外へ広げました。\n\n後のICO、NFT、DeFiといったWeb3の主な応用は、ほぼぜんぶこの基盤の上で生まれます!技術レイヤーの土台がここで整い、2年後の熱狂(ICOブーム、資本と市場レイヤー)を呼び込む舞台ができました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ethereum.org: The history of Ethereum","url":"https://ethereum.org/en/history/"}]},{"date":"2017-01-01","precision":"month","end_date":"2018-03-31","type":"period","layer":"資本と市場","title":"💸 ICOブーム、トークン販売に資金が殺到","summary":"イーサリアム上でトークンを発行して資金を集めるICO(イニシャル・コイン・オファリング)が世界的に過熱。2017年だけで数十億ドル規模が調達されたとされ、構想書1枚で巨額が集まる案件が次々出てきました。\n\n**理想を掲げた技術が投機の器に変わる**最初の大波です。詐欺的な案件も続出して各国当局が警告や規制に動き、中国は2017年9月にICOを全面禁止。社会と制度レイヤーの初動も、ここから始まります。","detail":null,"credibility":"disputed","credibility_note":"ICOの調達総額は集計機関によって数十億〜百億ドル超と幅があって、確定した統計はありません。","sources":[{"title":"CoinDesk ICO Tracker(2017〜2018年の集計)","url":null}]},{"date":"2017-12-01","precision":"month","end_date":null,"type":"point","layer":"社会と制度","title":"🐱 CryptoKitties流行でイーサリアムが混雑","summary":"ブロックチェーン上で猫のキャラクターを集めて交配するゲームCryptoKittiesが流行し、取引がイーサリアムのネットワークを圧迫。手数料が高騰して、未処理の取引が大量に積み上がりました。\n\nNFT(非代替性トークン)が一般の関心を集めた最初の事例なんですが、同時に分散型基盤の処理能力の限界も早々に露呈。スケーラビリティ問題は、この後もずっとWeb3の宿題であり続けます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: CryptoKitties","url":"https://en.wikipedia.org/wiki/CryptoKitties"}]},{"date":"2021-03-11","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"🖼️ BeepleのNFT作品が約6900万ドルで落札","summary":"デジタルアーティストBeepleの作品「Everydays: The First 5000 Days」が、老舗オークションハウスのクリスティーズで約6934万ドルで落札。NFTに紐づくデジタル作品として史上最高額になりました!\n\n2017年のCryptoKitties(社会と制度レイヤー)から4年、NFTが美術市場のど真ん中に出てきた瞬間で、これを合図にNFT投機が本格化します。デジタルデータの「所有」を売買するという概念が、一般のニュースになった一件でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Everydays: the First 5000 Days","url":"https://en.wikipedia.org/wiki/Everydays:_the_First_5000_Days"}]},{"date":"2021-06-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"社会と制度","title":"🎮 Axie Infinityの「遊んで稼ぐ」が新興国で拡大","summary":"NFTゲームAxie Infinityが東南アジア、特にフィリピンで急拡大。ゲーム内トークンを換金する「Play-to-Earn」が、コロナ禍で職を失った人たちの収入源になったと報じられました。\n\n**ゲームが生活インフラになる**というWeb3の可能性と、トークン価格に生計が振り回される危うさをセットで見せた事例です。翌2022年の暗号資産市場の暴落(資本と市場レイヤー)で収益は急減し、ブームは短命に終わりました。","detail":null,"credibility":"disputed","credibility_note":"「月収が現地の平均賃金を上回った」みたいな収入水準の話は聞き取りベースの報道で、統計的な裏付けはありません。","sources":[{"title":"Rest of World / CoinDeskによる2021年のAxie Infinity報道","url":null}]},{"date":"2021-10-28","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"🕶️ FacebookがMetaに社名変更、メタバースへ転換","summary":"Facebookが社名をMetaに変更し、SNS企業からメタバース企業への転換を宣言。年間100億ドル規模を関連部門Reality Labsに投じる方針も示しました。\n\n内部告発文書への批判が高まっていた時期だけに話題そらしでは、という見方も出ましたが、巨大テックの参入で「メタバース」は一気に流行語に。**理想の看板をいちばん大きく掲げた企業**が、わずか2年後に縮小へ転じます(2023年のReality Labs赤字)。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Meta: The Facebook Company Is Now Meta (2021-10-28)","url":"https://about.fb.com/news/2021/10/facebook-company-is-now-meta/"}]},{"date":"2021-11-01","precision":"month","end_date":null,"type":"point","layer":"資本と市場","title":"📈 暗号資産の時価総額が約3兆ドルの頂点に","summary":"ビットコインが約6万9000ドルの史上最高値をつけ、暗号資産全体の時価総額は集計サイトベースで約3兆ドルに。NFTもメタバース関連トークンも軒並み高騰して、投機熱はここが頂点でした。\n\n同じ頃には、メタバース内の土地NFTが数億円で取引される事例も報じられています。この頂点から1年で市場は3分の1以下に縮み、Terra崩壊とFTX破綻(いずれも資本と市場レイヤー)が続くことになります。","detail":null,"credibility":"unverified","credibility_note":"時価総額約3兆ドルはCoinGeckoなど集計サイトの推定値で、どこまでを数えるかで数字が変わります。","sources":[{"title":"CoinGecko: Global Cryptocurrency Market Cap(2021年11月)","url":null}]},{"date":"2022-05-09","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"💥 ステーブルコインTerraUSD崩壊","summary":"アルゴリズム型ステーブルコインTerraUSD(UST)がドル連動を失い、対をなすトークンLUNAごと数日でほぼ無価値に。消えた時価総額は400億ドル規模とされます。\n\n「アルゴリズムでドルを再現する」設計の脆さが露呈した事件で、ヘッジファンドや貸付業者の破綻が連鎖し、FTX破綻への導火線になりました。各国のステーブルコイン規制論(社会と制度レイヤー)も、これで一気に加速します。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Terra (blockchain)","url":"https://en.wikipedia.org/wiki/Terra_(blockchain)"}]},{"date":"2022-06-07","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"🗾 日本政府がWeb3.0推進を成長戦略に明記","summary":"政府の「経済財政運営と改革の基本方針(骨太の方針)2022」が閣議決定され、ブロックチェーンを基盤とするWeb3.0の推進に向けた環境整備が明記されました。NFTやDAOの利用拡大も検討課題に挙がっています。\n\n市場はすでに下落局面(資本と市場レイヤー)に入っていた頃で、国家戦略への採用とはっきり時間差が出ました。制度が熱狂に遅れて動く構図、この分野では何度も見かけるやつです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府: 経済財政運営と改革の基本方針2022(2022-06-07閣議決定)","url":null}]},{"date":"2022-09-15","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"🔀 イーサリアム「The Merge」でPoS移行完了","summary":"イーサリアムが合意形成の仕組みをプルーフ・オブ・ワークからプルーフ・オブ・ステークへ切り替える大型アップグレード「The Merge」を完了。ネットワークの消費電力を99.9%以上削減したとされます。\n\n暗号資産批判の筆頭だった環境負荷に技術側から答えた形で、弱気相場(資本と市場レイヤー)の真っ最中でも**プロトコル開発は着実に前進する**と示しました。稼働を止めずに基盤を入れ替えるのは、技術的にも異例の規模です!","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Ethereum Foundation: The Merge","url":"https://ethereum.org/en/roadmap/merge/"}]},{"date":"2022-11-11","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"🧊 大手交換業者FTXが経営破綻","summary":"世界有数の暗号資産交換業者FTXが米連邦破産法11条の適用を申請。顧客資産の流用が発覚し、創業者サム・バンクマン=フリードは後に詐欺罪で有罪判決を受けました。\n\nTerra崩壊から半年での大手破綻で、業界への信頼は底まで落ちて「冬の時代」が決定的に。一方でこの事件が各国の規制整備(社会と制度レイヤー)を前に進め、2年後の現物ETF承認という制度化された市場への転機にもなりました。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bankruptcy of FTX","url":"https://en.wikipedia.org/wiki/Bankruptcy_of_FTX"}]},{"date":"2023-02-01","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"📉 MetaのReality Labs、年間137億ドルの赤字","summary":"Metaの2022年通期決算で、メタバース部門Reality Labsの営業損失が137億ドルに達したと開示されました。同社は「効率の年」を掲げ、人員削減とAIへの投資シフトを進めます。\n\n社名変更からわずか1年ちょっとでの方針転換です。**巨額投資をもってしても「住人」は集まらない**というメタバースの現実が、数字で突きつけられました。世間の関心も、同時期に公開されたChatGPTなど生成AIへ一気に流れていきます。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Meta Platforms: Fourth Quarter and Full Year 2022 Results (2023-02-01)","url":null}]},{"date":"2023-06-05","precision":"day","end_date":null,"type":"point","layer":"技術とプロトコル","title":"🥽 AppleがVision Pro発表、空間コンピューティング","summary":"AppleがWWDCでヘッドセット型デバイスApple Vision Proを発表。「メタバース」という言葉をあえて避け、「空間コンピューティング」という独自の枠組みを打ち出しました。価格は3499ドルです。\n\nMetaが引っ張ったメタバース概念の退潮(資本と市場レイヤー)と入れ替わるような参入で、仮想空間への没入ではなく現実への重ね合わせが主軸なのが対照的でした。没入型デバイス市場の再定義を試みる動きです。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: Introducing Apple Vision Pro (2023-06-05)","url":"https://www.apple.com/newsroom/2023/06/introducing-apple-vision-pro/"}]},{"date":"2024-01-10","precision":"day","end_date":null,"type":"point","layer":"資本と市場","title":"🏦 米SECがビットコイン現物ETFを承認","summary":"米証券取引委員会(SEC)がビットコイン現物ETF11本を一斉承認し、翌日から取引開始。BlackRockなど大手資産運用会社の参入で、機関投資家が規制された形で暗号資産に投資できるようになりました。\n\n10年越しで申請が却下され続けた末の、制度的な転換です。FTX破綻で地に落ちた信頼が、**分散の理想ではなく既存金融への編入**という形で回復していくの、なかなか象徴的でした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"米SEC: ビットコイン現物ETP承認に関する委員長声明 (2024-01-10)","url":null}]},{"date":"2024-02-02","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"🛒 Vision Pro発売、初動の熱と失速","summary":"Apple Vision Proが米国で発売。初週末は行列が報じられた一方、重さや価格、使い道の乏しさから利用が定着せず、出荷台数は当初想定を下回ったという推計が相次ぎました。\n\n技術レイヤーとしての完成度は高く評価されたのに、毎日装着する動機を示せなかったのはMetaのヘッドセットと同じ課題です。没入型デバイスが「次のiPhone」になる時期は見えないまま、各社は軽量なAIグラスへ軸足を移し始めました。","detail":null,"credibility":"unverified","credibility_note":"出荷・販売台数はAppleが公表していないので、調査会社の推計や報道ベースの数字にとどまります。","sources":[{"title":"Apple Newsroom: Apple Vision Pro available in the U.S. on February 2 (2024-01-08)","url":"https://www.apple.com/newsroom/2024/01/apple-vision-pro-available-in-the-us-on-february-2/"}]},{"date":"2025-07-18","precision":"day","end_date":null,"type":"point","layer":"社会と制度","title":"🏛️ 米国初のステーブルコイン連邦法が成立","summary":"米国でステーブルコインの発行を規制するGENIUS法が成立。準備資産の裏付けや情報開示を義務付ける連邦レベルの枠組みが、初めて整いました。\n\nTerra崩壊(2022年)が見せた無担保設計の危険への制度的な回答で、暗号資産が規制の外の実験から**制度の内側の金融インフラ**へ移った節目です。ドル連動トークンが決済や送金の基盤になる道が開け、Web3は熱狂の言葉ではなく実務の層として定着し始めています。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GENIUS Act(2025年7月成立の米ステーブルコイン規制法)","url":null}]}]}];

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))>>>0}return h}
function pickPhoto(t){
  const pool = PHOTO_POOL[CATKEY[t.category]];
  if(!pool || !pool.length) return null;
  return pool[(hashStr(CATKEY[t.category] + "|" + t.title) >>> 8) % pool.length];
}

const md = s => "<p>" + esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n{2,}/g, "</p><p>") + "</p>";

function fmtDate(e){
  const [y,m,d] = e.date.split("-");
  if(e.precision === "year") return y;
  if(e.precision === "month") return `${y}.${m}`;
  return `${y}.${m}.${d}`;
}
function fmtEnd(e){
  if(e.type !== "period" || !e.end_date) return "";
  const [y,m] = e.end_date.split("-");
  return e.precision === "year" ? ` — ${y}` : ` — ${y}.${m}`;
}

function renderHome(){
  const byCat = {};
  for(const t of DATA) (byCat[t.category] ??= []).push(t);
  let html = "";
  for(const key of Object.keys(CAT)){
    const list = byCat[key] || [];
    if(!list.length) continue;
    html += `<section class="cat-sec"><div class="cat-head"><h2 class="cat-name">${CAT[key]}</h2><span class="cat-count">${list.length} TIMELINES</span></div><div class="tl-grid">`;
    for(const t of list){
      const chips = t.layers.map(l => `<span class="layer-chip"><i style="background:${COLOR[l.color]}"></i>${esc(l.name)}</span>`).join("");
      html += `<a class="tl-card" href="chronos-viewer.html?slug=${esc(t.slug)}">
        <div class="tl-years">${t.start_year}–${t.end_year}</div>
        <div class="tl-title">${esc(t.title)}</div>
        <div class="tl-desc">${esc(t.description)}</div>
        <div class="tl-meta">${chips}<span class="tl-evcount">${t.events.length}件</span></div>
      </a>`;
    }
    html += `</div></section>`;
  }
  document.getElementById("cats").innerHTML = html;
}
