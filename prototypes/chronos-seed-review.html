<style>
:root{
  --bg:#0A0A0C;--bg2:#0E0E11;--card:#16161A;
  --accent:#C8A87E;--accent-soft:rgba(200,168,126,0.10);--accent-med:rgba(200,168,126,0.18);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#9A9590;--text3:#7A7570;
  --border:rgba(200,168,126,0.10);--border2:rgba(200,168,126,0.20);
  --f-d:'Erode','Shippori Mincho',serif;--f-b:'DM Sans',sans-serif;--f-m:'JetBrains Mono',monospace;
  --hdr:100px;--ease:cubic-bezier(0.16,1,0.3,1);
  --c-blue:#5B9BD5;--c-green:#7BC67E;--c-pink:#D4849A;--c-gold:#C8B87E;--c-purple:#9E7EC8;--c-teal:#5BBCB4;--c-orange:#D4A05A;
}
*{margin:0;padding:0;box-sizing:border-box}
html.scrolled{--hdr:60px}
html{font-size:15px;-webkit-font-smoothing:antialiased;background:var(--bg);color-scheme:dark;overflow-x:clip;scroll-padding-top:calc(var(--hdr) + 16px)}
body{font-family:var(--f-b);background:var(--bg);color:var(--text);line-height:1.8;touch-action:manipulation}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

header.site{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,12,0.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.hdr-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:var(--hdr);display:flex;align-items:center;justify-content:space-between;transition:height .35s var(--ease)}
.hdr-logo{display:flex;align-items:center;padding:20px 0}
.hdr-logo img{height:40px;width:auto;transition:height .35s var(--ease)}
html.scrolled .hdr-logo img{height:26px}
.hdr-back{font-size:12px;color:var(--text2);text-decoration:none;letter-spacing:0.06em;transition:color .3s;padding:8px 0}
.hdr-back:hover{color:var(--text)}

.readbar{position:fixed;top:var(--hdr);left:0;right:0;height:2px;z-index:99;pointer-events:none;transition:top .35s var(--ease)}
.readbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#D4A05A);transform-origin:0 50%;transform:scaleX(0);transition:transform .12s linear}
.year-now{position:fixed;top:calc(var(--hdr) + 12px);left:50%;transform:translate(-50%,-6px);z-index:98;font-family:var(--f-m);font-size:12px;letter-spacing:0.14em;color:var(--accent);background:rgba(10,10,12,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border2);border-radius:999px;padding:4px 14px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease),top .35s var(--ease)}
.year-now.show{opacity:1;transform:translate(-50%,0)}
.wrap{max-width:1080px;margin:0 auto;padding:140px 24px 96px}
.page-label{font-family:var(--f-m);font-size:12px;letter-spacing:0.22em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
h1.page-title{font-family:var(--f-d);font-weight:500;font-size:clamp(24px,4vw,34px);letter-spacing:0.08em;color:var(--text-h);margin-bottom:14px}
.page-lead{font-size:15px;color:var(--text2);max-width:640px;margin-bottom:48px}

/* ─ home: category sections */
.stamp{padding-top:48px;font-family:var(--f-m);font-size:10px;letter-spacing:0.1em;color:var(--text3);opacity:.55}
.cat-sec{margin-bottom:52px}
.cat-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:10px}
.cat-name{font-family:var(--f-d);font-weight:500;font-size:19px;letter-spacing:0.1em;color:var(--text-h)}
.cat-count{font-family:var(--f-m);font-size:12px;color:var(--text3)}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tl-card{display:block;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 20px 16px;transition:border-color .3s,transform .3s var(--ease);width:100%}
.tl-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.tl-years{font-family:var(--f-m);font-size:12px;color:var(--accent);letter-spacing:0.12em;margin-bottom:8px}
.tl-title{font-size:18px;font-weight:500;color:var(--text-h);line-height:1.5;margin-bottom:8px}
.tl-desc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.layer-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.layer-chip i{width:8px;height:8px;border-radius:2px;flex:none}
.tl-evcount{margin-left:auto;font-family:var(--f-m);font-size:11px;color:var(--text3)}

/* ─ detail */
.detail{display:none}
.detail.on{display:block}
.home.off{display:none}
.d-back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin-bottom:28px;transition:color .3s}
.d-back:hover{color:var(--text)}
.d-coverwrap{margin:0 0 24px}
.d-cover{position:relative;height:clamp(160px,28vw,280px);overflow:hidden;background:var(--card)}
.d-cover img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease)}
.d-cover img.loaded{opacity:1}
.d-cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,0.05) 40%,rgba(10,10,12,0.55))}
.d-cover-credit{display:block;text-align:right;margin-top:6px;font-family:var(--f-m);font-size:8px;letter-spacing:0.04em;color:var(--text3)}
.d-cover-credit a{color:inherit;text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:2px}
.d-cat{font-family:var(--f-m);font-size:11px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
.d-title{font-family:var(--f-d);font-weight:500;font-size:clamp(24px,4vw,34px);letter-spacing:0.06em;color:var(--text-h);line-height:1.5;margin-bottom:12px}
.d-desc{font-size:16px;color:var(--text2);max-width:680px;margin-bottom:20px}
.d-stats{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--f-m);font-size:12px;color:var(--text3);margin-bottom:28px}
.d-stats b{color:var(--text);font-weight:400}
.d-layers{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:44px}
.d-layer{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;transition:border-color .3s,background .3s}
.d-layer.active{border-color:var(--accent);background:var(--accent-soft)}
.d-layer i{width:10px;height:10px;border-radius:3px;flex:none}

/* events */
.ev-list{position:relative;padding-left:2px}
.ev{position:relative;display:grid;grid-template-columns:14px 1fr;gap:16px;padding-bottom:8px;transition:opacity .35s var(--ease),filter .35s var(--ease)}
.ev.dim{opacity:.22;filter:saturate(.4)}
.ev-rail{position:relative}
.ev-rail::before{content:"";position:absolute;left:6px;top:22px;bottom:-4px;width:1px;background:var(--border)}
.ev:last-child .ev-rail::before{display:none}
.ev-dot{position:absolute;left:2px;top:9px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bg)}
.ev-dot.period{border-radius:3px}
.ev-body{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;min-width:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(200,168,126,0.08)}
.ev.open .ev-body{cursor:auto}
.ev-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.ev-date{font-family:var(--f-m);font-size:12px;color:var(--accent);letter-spacing:0.06em}
.ev-layer{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.ev-layer i{width:7px;height:7px;border-radius:2px}
.ev-top .cred{margin-left:auto}
.cred{font-size:11px;letter-spacing:0.08em;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.cred.verified{color:#7BC67E;border-color:rgba(123,198,126,0.35)}
.cred.disputed{color:#D4A05A;border-color:rgba(212,160,90,0.4)}
.cred.unverified{color:var(--text3);border-color:rgba(154,149,144,0.35)}
.ev-title{font-size:17px;font-weight:500;color:var(--text-h);line-height:1.55}
.ev-head{display:block;width:100%;text-align:left;position:relative;padding-right:28px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(200,168,126,0.08)}
.ev-head::after{content:"";position:absolute;right:6px;top:50%;width:8px;height:8px;border-right:1.5px solid var(--text3);border-bottom:1.5px solid var(--text3);transform:translateY(-70%) rotate(45deg);transition:transform .3s var(--ease)}
.ev.open .ev-head::after{transform:translateY(-30%) rotate(-135deg)}
.ev-x{overflow:hidden;max-height:0;transition:max-height .5s var(--ease)}
.ev.open .ev-x{max-height:3000px}
.ev-xi{overflow:hidden}
.ev-xd{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;opacity:0;transition:opacity .3s var(--ease)}
.ev.open .ev-xd{opacity:1;transition-delay:.1s}
.ev-tools{display:flex;justify-content:flex-end;margin-bottom:14px}
.ev-expall{font-size:13px;color:var(--text2);border:1px solid var(--border2);border-radius:999px;padding:6px 16px;transition:color .3s,border-color .3s}
.ev-expall:hover{color:var(--text);border-color:var(--accent)}
.ev-summary{font-size:15px;color:var(--text);line-height:1.75;margin-bottom:8px}
.ev-summary strong,.ev-detail strong{color:#FFFFFF;font-weight:500;background:linear-gradient(transparent 45%,rgba(200,168,126,0.42) 45%);background-repeat:no-repeat;background-size:0% 100%;padding:0 1px;transition:background-size .6s var(--ease) .15s}
.ev-summary strong.mk,.ev-detail strong.mk{background-size:100% 100%}
.ev-summary p+p,.ev-detail p+p{margin-top:10px}
.ev-detail{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:8px}
.ev-note-label{display:block;font-family:var(--f-m);font-size:11px;letter-spacing:0.14em;color:#D4A05A;margin-bottom:4px}
.ev-note{font-size:13px;color:#D4A05A;background:rgba(212,160,90,0.07);border-left:2px solid rgba(212,160,90,0.4);padding:7px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;line-height:1.7}
.ev-srcs{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.ev-src{font-size:13px;color:var(--text3);line-height:1.6}
.ev-src a{color:var(--text2);text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:3px;word-break:break-all}
.ev-src a:hover{color:var(--accent)}
.year-mark{grid-column:1 / -1;font-family:var(--f-m);font-size:13px;letter-spacing:0.18em;color:var(--text3);padding:14px 0 12px;border-bottom:1px dashed var(--border);margin-bottom:16px}

@media (max-width:560px){
  .hdr-inner{padding:0 18px}
  .wrap{padding:calc(var(--hdr) + 28px) 18px 72px}
  .tl-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  .ev-summary strong,.ev-detail strong{background-size:100% 100%}
}
</style>
</head>

<script>
const DATA = [{"slug":"business-advertising-100","title":"広告業界の100年","description":"1922年のラジオCMからCookie廃止撤回まで、広告の100年をメディアと技術・広告産業とクリエイティブ・社会と規制の3層で辿る。媒体が変わるたびに、注意の売り方とルールが作り直されてきた。","category":"business","language":"ja","start_year":1922,"end_year":2024,"layers":[{"name":"メディアと技術","color":"blue"},{"name":"広告産業とクリエイティブ","color":"orange"},{"name":"社会と規制","color":"teal"}],"events":[{"date":"1922-08-28","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"米WEAFで最初期の有料ラジオ広告放送","summary":"ニューヨークのラジオ局WEAFが、不動産会社クイーンズボロ・コーポレーションの宣伝放送を有料で流した。約10分の告知で、料金は50ドルだったと伝えられる。\n\nこれが「世界初のラジオ広告」とされることが多いが、先行事例を挙げる研究もある。**電波が広告を家庭の居間まで運んだ**ことで、広告は紙面ではなく時間を買うものへと変わり、放送メディアの収益モデルが生まれた。","detail":null,"credibility":"disputed","credibility_note":"「世界初のラジオ広告」とする位置づけには諸説があり、放送時間・料金も資料により記述が異なる。","sources":[{"title":"Wikipedia: WEAF (歴史的放送局) およびラジオ広告史の各種資料","url":null}]},{"date":"1923-01-01","precision":"year","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"ニールセン創業、「測定」の産業が始まる","summary":"アーサー・C・ニールセンが米国で市場調査会社を創業した。のちにラジオの聴取率、テレビの視聴率測定へ進出し、広告取引の共通通貨となる指標を提供していく。\n\n「どれだけの人が見たか」を第三者が数値化する仕組みは、広告枠の価格形成を可能にした基盤である。約70年後にバナー広告(メディアと技術レイヤー)が持ち込むクリック測定も、この延長線上にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Nielsen Holdings","url":"https://en.wikipedia.org/wiki/Nielsen_Holdings"}]},{"date":"1941-07-01","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"世界初のテレビCM、ブローバの時計広告","summary":"米NBC系のWNBTで、時計メーカー・ブローバの広告が放送された。野球中継の前に流れた短い映像で、料金は9ドルだったとされる。商業テレビ放送が認可された初日の出来事である。\n\n以後半世紀にわたり、テレビは広告費の最大の受け皿として広告産業の構造を規定する。クリエイティブ革命(広告産業とクリエイティブレイヤー)も、テレビとグラフィック広告の黄金期に起きることになる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Bulova","url":"https://en.wikipedia.org/wiki/Bulova"}]},{"date":"1957-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と規制","title":"『かくれた説得者』が広告批判の古典に","summary":"ジャーナリストのヴァンス・パッカードが『かくれた説得者』を刊行し、深層心理を突く広告手法を批判的に描いてベストセラーとなった。\n\n広告への社会的警戒がはじめて大衆的な言説になった画期であり、のちのタバコ広告規制やサブリミナル批判の下地となる。広告産業が自らの手法を語る言葉を持つより先に、批判の言葉のほうが広く普及した点が示唆的である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: The Hidden Persuaders","url":"https://en.wikipedia.org/wiki/The_Hidden_Persuaders"}]},{"date":"1959-01-01","precision":"year","end_date":"1969-12-31","type":"period","layer":"広告産業とクリエイティブ","title":"クリエイティブ革命","summary":"DDBのビル・バーンバックらを中心に、コピーライターとアートディレクターを対等に組ませ、誇張ではなく機知と正直さで語る広告表現の刷新が米国で進んだ。\n\nフォルクスワーゲンやエイビスのキャンペーンが代表例で、広告が文化として批評される時代が始まった。期間の区切りは概説によって異なるが、テレビ(メディアと技術レイヤー)の普及期と重なっている点が本質である。","detail":null,"credibility":"unverified","credibility_note":"「クリエイティブ革命」の期間区分は論者により異なり、1960年代全般とする概説に依拠した。","sources":[{"title":"Wikipedia: Creative revolution","url":"https://en.wikipedia.org/wiki/Creative_revolution"}]},{"date":"1959-01-01","precision":"year","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"VW「Think Small」キャンペーン開始","summary":"DDBがフォルクスワーゲン・ビートルの広告「Think Small」を展開した。小ささを欠点ではなく美点として正直に語る手法で、のちに広告史上最高のキャンペーンとの評価を受ける。\n\n大型車全盛の米国で自虐的なユーモアを用いた点が革新で、クリエイティブ革命の代表作となった。なお掲載開始の年については、1959年とする資料と1960年とする資料がある。","detail":null,"credibility":"disputed","credibility_note":"キャンペーン開始年は1959年とも1960年ともされ、資料により記述が分かれる。","sources":[{"title":"Wikipedia: Think Small","url":"https://en.wikipedia.org/wiki/Think_Small"}]},{"date":"1971-01-02","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"米国でタバコのテレビ・ラジオ広告禁止","summary":"公衆衛生タバコ喫煙法の施行により、米国のテレビ・ラジオでのタバコ広告が禁止された。最後のCMは前夜の年越し番組の枠で放送された。\n\nテレビ広告の大口出稿者を法律が排除した初の大型規制で、広告が公衆衛生政策の対象になった。**何を広告してよいかを社会が決める**時代の始まりであり、以後、酒類・医薬品・子ども向け広告へと規制の対象は広がっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Public Health Cigarette Smoking Act","url":"https://en.wikipedia.org/wiki/Public_Health_Cigarette_Smoking_Act"}]},{"date":"1984-01-22","precision":"day","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"Apple「1984」、スーパーボウルCMの伝説","summary":"スーパーボウル中継で、AppleがMacintosh発売を予告するCM「1984」を放送した。リドリー・スコット監督による約60秒の映像は、製品をほとんど見せないまま強烈な印象を残した。\n\nスーパーボウルを広告の檜舞台へ変えた転換点とされ、CM自体がニュースとして報道される「広告のイベント化」が始まった。テレビ広告の演出力が頂点に達した時期を象徴する作品である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: 1984 (advertisement)","url":"https://en.wikipedia.org/wiki/1984_(advertisement)"}]},{"date":"1986-04-01","precision":"month","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"オムニコム誕生、メガエージェンシー時代へ","summary":"米広告大手BBDO、DDB、ニーダム・ハーパーの3社統合によるオムニコム・グループの設立が発表され、業界で「ビッグバン」と呼ばれた。\n\n同時期に英国ではサーチ&サーチが買収を重ねて世界最大手に躍り出ており、広告会社は世界規模の持株会社へと再編されていく。クリエイティブの工房だった広告会社が、資本市場で評価される産業へ変わった画期である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Omnicom Group","url":"https://en.wikipedia.org/wiki/Omnicom_Group"}]},{"date":"1994-10-27","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"HotWiredに世界初のバナー広告","summary":"米ウェブメディアHotWiredに、AT&Tなどのバナー広告が掲載された。ウェブ広告の事実上の始まりとされ、AT&Tのバナーのクリック率は44%に達したと伝えられる。\n\n**クリックという行動の測定**が可能になったことで、広告効果は推定から計測へ移行し始めた。ニールセン以来の「視聴の通貨」(広告産業とクリエイティブレイヤー)とは別の、行動データに基づく取引の系譜がここから始まる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Web banner","url":"https://en.wikipedia.org/wiki/Web_banner"}]},{"date":"2000-10-23","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"Google AdWords開始","summary":"Googleがセルフサービス型の検索連動広告AdWordsを開始した。当初は表示回数課金で、2002年にクリック課金とオークション制へ移行する。\n\n**検索の意図に対して広告枠を競売にかける**仕組みは、その後の広告費の流れを根本から変えた。ドットコムバブル崩壊(2000年)の直後に、バナーの露出販売ではなく意図への課金が生き残った点が示唆的である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google プレスリリース: Google Launches Self-Service Advertising Program (2000-10-23)","url":null}]},{"date":"2007-04-13","precision":"day","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"GoogleがDoubleClickを31億ドルで買収","summary":"Googleがアドテク大手DoubleClickを31億ドルで買収すると発表した。検索広告に加え、ディスプレイ広告の配信基盤を手中に収めることになった。\n\nMicrosoftらも買収を競った末の決着で、広告産業の主役が代理店からプラットフォームへ移る転機となった。この統合が生むデータ集中と寡占への懸念は、のちのGDPR(社会と規制レイヤー)や各国の競争法調査の伏線である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: DoubleClick","url":"https://en.wikipedia.org/wiki/DoubleClick"}]},{"date":"2007-11-06","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"Facebook Ads発表、ソーシャル広告の起点","summary":"Facebookが広告プラットフォーム「Facebook Ads」を発表した。友人の購買行動を広告として流すBeaconも同時に発表されたが、こちらは強い反発を受けて撤回に追い込まれる。\n\nソーシャルグラフと属性データによるターゲティングは、検索連動と並ぶデジタル広告の二本柱となった。Beaconの失敗は、データ利用と同意をめぐる10年後の論争(社会と規制レイヤー)を先取りしていた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Facebook: Facebook Unveils Facebook Ads (2007-11-06)","url":null}]},{"date":"2013-03-01","precision":"month","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"電通がイージス買収を完了","summary":"電通が英広告グループのイージスを約4000億円で買収し、手続きを完了した。日本の広告会社による過去最大級の海外買収である。\n\nデジタル領域と海外市場への対応を一気に進める狙いで、国内最大手が「日本のメディア枠の販売」を軸とする事業構造から脱する転換点となった。世界の広告産業がデータとデジタル運用へ再編される流れの一部である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"電通 ニュースリリース: イージス・グループ買収完了(2013年3月)","url":null}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"GDPR施行、ターゲティング広告に規制の網","summary":"EUの一般データ保護規則(GDPR)が施行され、個人データの処理に同意等の法的根拠と高額の制裁金が定められた。行動ターゲティング広告は最大の影響領域となった。\n\n**同意が広告取引の前提条件になった**ことで、同意管理ツールの普及や文脈連動広告への回帰が起きた。プラットフォームへのデータ集中(広告産業とクリエイティブレイヤー)に対し、規制が対抗軸として働く構図が明確になった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2016/679 (GDPR)","url":"https://eur-lex.europa.eu/eli/reg/2016/679/oj"}]},{"date":"2019-01-01","precision":"year","end_date":null,"type":"point","layer":"社会と規制","title":"日本でネット広告費がテレビを初めて逆転","summary":"電通「日本の広告費」の推計で、2019年のインターネット広告費が2兆1048億円となり、テレビメディア広告費を初めて上回った。\n\n1975年にテレビが新聞を抜いて以来の首位交代であり、運用型広告が主流となった市場構造の変化を確定させた。媒体の主役交代はラジオからテレビ、テレビからネットへと、およそ半世紀の周期で繰り返されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"電通「2019年 日本の広告費」(2020年3月発表)","url":null}]},{"date":"2021-04-26","precision":"day","end_date":null,"type":"point","layer":"社会と規制","title":"AppleがATT導入、追跡に本人許可を必須化","summary":"AppleがiOS 14.5でApp Tracking Transparency(ATT)を導入し、アプリ横断のトラッキングにユーザーの明示的な許可を必須とした。\n\n許可率は低水準にとどまり、Metaは2022年の減収要因として約100億ドルの影響を公表した。規制当局ではなく**プラットフォームが事実上の規制者になる**構図を示し、広告の効果測定は確率的な推定へと後退した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: App Tracking Transparency","url":"https://en.wikipedia.org/wiki/App_Tracking_Transparency"}]},{"date":"2022-02-03","precision":"day","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"Amazon、広告事業を初めて区分開示","summary":"Amazonが決算で広告事業の売上を初めて区分開示し、2021年通年で約312億ドルに達していたことが明らかになった。\n\n購買データと購入直前の顧客接点を持つ小売業者が広告の売り手になる「リテールメディア」の存在感を裏付けた。Cookie規制やATT(社会と規制レイヤー)で外部データが細るなか、自社データを持つ事業者へ広告費が移る流れを象徴する。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Amazon.com Q4 2021 Earnings Release (2022-02-03)","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"広告産業とクリエイティブ","title":"生成AIが広告制作に入る","summary":"Metaが広告主向けに生成AIで広告文や背景画像を作る「AI Sandbox」を発表するなど、生成AIによる広告制作の自動化が業界全体の動きとなった。\n\nコピーとビジュアルの制作をアルゴリズムが担うことは、クリエイティブ革命以来の「人の技」という前提を揺るがす。ただし効果や普及の実態は各社発表ベースで、評価が定まるのはこれからである。","detail":null,"credibility":"unverified","credibility_note":"生成AIによる広告制作の効果・普及度は各社の発表ベースで、第三者による検証は確立していない。","sources":[{"title":"Meta: AI Sandbox発表(2023年5月)ほか各社発表","url":null}]},{"date":"2024-07-22","precision":"day","end_date":null,"type":"point","layer":"メディアと技術","title":"GoogleがサードパーティCookie廃止を撤回","summary":"GoogleがChromeにおけるサードパーティCookie廃止計画の撤回を発表した。2020年の廃止表明から4年、3度の延期を経た方針転換である。\n\n廃止は代替技術Privacy Sandboxをめぐる競争上の懸念から英競争当局の監視下にあり、プライバシー保護と競争政策の板挟みが露呈した。個人追跡の基盤技術の行方が一企業の判断に委ねられていること自体が、規制側の新たな論点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Google Privacy Sandbox: A new path for Privacy Sandbox on the web (2024-07-22)","url":null}]}]},{"slug":"business-b2b-saas","title":"B2B SaaSの勃興","description":"Salesforce創業の「No Software」からSaaSバブルと調整、AIエージェント時代まで。プロダクト・資本市場・導入と商習慣の3層で、業務ソフトが所有から利用へ変わった四半世紀を追う。","category":"business","language":"ja","start_year":1999,"end_year":2025,"layers":[{"name":"プロダクトと企業","color":"blue"},{"name":"資本市場","color":"orange"},{"name":"導入と商習慣","color":"teal"}],"events":[{"date":"1999-03-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"Salesforce創業、「No Software」を掲げる","summary":"マーク・ベニオフらがSalesforceを創業し、業務ソフトをインストール不要のWebサービスとして月額課金で提供するモデルを打ち出した。「No Software」を掲げ、パッケージ販売への挑戦を宣言した。\n\n**所有から利用へ**という転換の出発点であり、後にSaaSと呼ばれる事業モデルの原型となった。収益が一括販売から継続課金へ変わることで、資本市場の評価軸(資本市場レイヤー)も後年書き換えられていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Salesforce","url":"https://en.wikipedia.org/wiki/Salesforce"}]},{"date":"2004-06-23","precision":"day","end_date":null,"type":"point","layer":"資本市場","title":"SalesforceがNYSE上場","summary":"Salesforceがニューヨーク証券取引所に上場した。継続課金型の企業向けソフト企業として資本市場に受け入れられ、SaaSという事業モデルの妥当性を示す試金石となった。\n\n当時は先行投資で赤字が続く継続課金モデルを評価する物差しが定まっておらず、解約率やLTVといったSaaS固有の指標が投資家に浸透するのは、この後の10年をかけてのことである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Salesforce","url":"https://en.wikipedia.org/wiki/Salesforce"}]},{"date":"2006-03-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"AWSがS3を公開、クラウドインフラ時代へ","summary":"AmazonがストレージサービスS3を公開し、同年には仮想サーバーのEC2も登場した。サーバーを買わずに従量課金で計算資源を使えるクラウドインフラが実用段階に入った。\n\n自前でデータセンターを持てない小さなチームでもSaaSを立ち上げられるようになり、起業のコストが劇的に下がった。2010年代のSaaSスタートアップ急増と資本流入(資本市場レイヤー)を支える土台である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon S3","url":"https://en.wikipedia.org/wiki/Amazon_S3"}]},{"date":"2011-08-20","precision":"day","end_date":null,"type":"point","layer":"資本市場","title":"「ソフトウェアが世界を飲み込む」論考","summary":"投資家マーク・アンドリーセンがウォール・ストリート・ジャーナル紙に「Why Software Is Eating the World」を寄稿し、あらゆる産業の中核企業がソフトウェア企業に置き換わると論じた。\n\nクラウド(プロダクトと企業レイヤーのAWS)とスマートフォンの普及を背景に、ベンチャー資本が業務ソフトへ本格的に向かう転換点とされる。以後、SaaSはベンチャー投資の主要カテゴリーとなっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Marc Andreessen, \"Why Software Is Eating the World\" (WSJ, 2011-08-20)","url":"https://a16z.com/why-software-is-eating-the-world/"}]},{"date":"2012-07-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"クラウド会計のfreeeが創業","summary":"佐々木大輔がクラウド会計ソフトのfreeeを創業した(サービス公開は翌2013年3月)。銀行口座やカードの明細と連携して記帳を自動化する発想で、中小企業の会計業務をクラウドへ移し始めた。\n\n日本のSaaSは会計・人事労務など**バックオフィスの自動化**から立ち上がった。税理士や商習慣と深く関わる領域だけに、導入と商習慣レイヤーの制度変化が普及の追い風となっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"freee株式会社 会社情報・沿革","url":null}]},{"date":"2014-02-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"Slack一般公開、ボトムアップ導入の型を作る","summary":"ゲーム開発の社内ツールから生まれたSlackが一般公開され、メール中心だった社内コミュニケーションをチャンネル型チャットへ置き換え始めた。公開初年度から利用者が急増した。\n\nまず現場のチームが無料で使い始め、後から会社契約に広がる「ボトムアップ導入」というSaaS特有の普及経路を確立した点が重要である。導入と商習慣レイヤーのテレワーク転換で需要が爆発する伏線となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Slack (software)","url":"https://en.wikipedia.org/wiki/Slack_(software)"}]},{"date":"2015-02-01","precision":"month","end_date":null,"type":"point","layer":"資本市場","title":"「T2D3」提唱、SaaS成長指標が共通言語に","summary":"米VC Battery Venturesのニーラジ・アグラワルが、ARRを3倍・3倍・2倍・2倍・2倍と5年で伸ばす「T2D3」という成長モデルを提唱し、SaaS企業の成長目標として広く参照されるようになった。\n\nARR・解約率・NRRといったSaaS固有の指標体系が投資判断の共通言語になった時期であり、**成長速度そのものを企業価値とみなす**評価文化が、後のバブルと調整(同レイヤー)の下地を作った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Neeraj Agrawal, \"The SaaS Adventure\" (TechCrunch, 2015)","url":null}]},{"date":"2019-04-01","precision":"day","end_date":null,"type":"point","layer":"導入と商習慣","title":"働き方改革関連法施行、HR SaaSの追い風に","summary":"残業時間の罰則付き上限規制や年5日の有給取得義務が始まり、労働時間の客観的な把握が企業に求められるようになった。\n\n勤怠管理や人事労務のSaaS導入を法制度が直接後押しした形で、SmartHRなどHR領域の急成長(資本市場レイヤー)の背景となった。日本のSaaSが**制度対応を入口に広がる**構図を示す典型例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「働き方改革関連法の概要」","url":null}]},{"date":"2019-06-19","precision":"day","end_date":null,"type":"point","layer":"資本市場","title":"Sansan上場、国内SaaS上場ラッシュの先駆け","summary":"名刺管理サービスのSansanが東証マザーズに上場し、同年12月にはfreeeも続いた。国内SaaSの上場が相次ぎ、「SaaS株」がひとつの投資カテゴリーとして意識され始めた。\n\nARRや解約率を開示する日本企業が増え、T2D3など米国流の評価指標(同レイヤー)が国内にも定着していく。赤字のまま成長投資を続ける経営が日本市場で受け入れられるかを試す試金石でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Sansan株式会社「東京証券取引所マザーズ上場に関するお知らせ」(2019-06-19)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":null,"type":"point","layer":"導入と商習慣","title":"テレワーク急拡大で業務SaaSの導入が加速","summary":"新型コロナで在宅勤務が広がり、Zoom・Slack・電子契約など業務SaaSの導入が一気に進んだ。Zoomは1日あたりの会議参加者が前年の10倍を超える3億人に達したと発表した。\n\n「まず現場が使う」ボトムアップ導入(プロダクトと企業レイヤー)が危機対応として正当化され、稟議や対面を前提とする商習慣が崩れた。SaaS株への資金流入(資本市場レイヤー)もここから過熱していく。","detail":null,"credibility":"disputed","credibility_note":"Zoomの「1日3億人」は延べ参加者数の自社発表であり、当初「利用者数」と表記して後に訂正された経緯があるなど、数値の解釈には注意が要る。","sources":[{"title":"Zoom公式ブログ発表(2020年4月)および各社報道","url":null}]},{"date":"2020-11-01","precision":"month","end_date":null,"type":"point","layer":"導入と商習慣","title":"押印廃止の方針で電子契約が急速に普及","summary":"政府が行政手続の押印を原則廃止する方針を打ち出し、民間でも電子契約サービスの導入が急速に進んだ。クラウドサインなど国内サービスの導入社数がこの前後で急増した。\n\n「ハンコを押すために出社する」という象徴的な非効率が世論の後押しで崩れた局面であり、紙と対面を前提としてきた日本の商習慣の転換が、制度の側から一気に進んだ事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"内閣府「押印を求める行政手続の見直し」(2020年)","url":null}]},{"date":"2021-06-01","precision":"month","end_date":null,"type":"point","layer":"資本市場","title":"SmartHRが約156億円のシリーズD調達","summary":"人事労務SaaSのSmartHRが約156億円のシリーズD資金調達を発表し、評価額は約1700億円とされ「ユニコーン」入りと報じられた。国内SaaSでは突出した規模の調達だった。\n\n低金利下で高成長企業に資金が集まる世界的な潮流が日本のSaaSにも届いたことを示す。評価額は自社・報道ベースの数値であり、翌年以降の金利上昇局面(同レイヤー)で未上場企業の評価の妥当性が問われていく。","detail":null,"credibility":"unverified","credibility_note":"調達額は自社発表、評価額約1700億円は報道ベースの推定であり、第三者による確定的な開示はない。","sources":[{"title":"SmartHR プレスリリース「シリーズDで約156億円の資金調達を実施」(2021年6月)","url":null}]},{"date":"2022-01-01","precision":"month","end_date":"2022-12-31","type":"period","layer":"資本市場","title":"金利上昇でSaaS株が世界的に急落","summary":"米国の急速な利上げを受け、高成長・赤字容認で買われてきたSaaS株が世界的に急落した。米国のクラウド株指数は年間で半値近くに沈み、国内SaaS株も軒並み大幅安となった。\n\n**成長一辺倒から採算重視へ**と評価軸が転換し、成長率と利益率の合計をみる「40%ルール」など効率性指標が再び重視された。各社は人員削減と黒字化を迫られ、プロダクトレイヤーではAIへの再投資が始まる。","detail":null,"credibility":"disputed","credibility_note":"下落率は参照する指数・銘柄・期間の取り方によって大きく異なり、「半値」という水準は代表的なクラウド株指数に基づく概数である。","sources":[{"title":"BVP Nasdaq Emerging Cloud Indexの推移および各社報道","url":null}]},{"date":"2023-03-16","precision":"day","end_date":null,"type":"point","layer":"プロダクトと企業","title":"Microsoft 365 Copilot発表、SaaSにAIを実装","summary":"MicrosoftがWordやExcelなどに生成AIを組み込むMicrosoft 365 Copilotを発表した。既存SaaSにAIを載せる路線が業界標準となり、SalesforceやNotionなど各社が一斉に追随した。\n\nGPT-4公開のわずか2日後という時期は、基盤モデルの進化が業務ソフトの機能競争に直結し始めたことを示す。AI機能が既存SaaSの価格体系と競争力を再定義する局面の始まりである。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft Official Blog: Introducing Microsoft 365 Copilot (2023-03-16)","url":"https://blogs.microsoft.com/blog/2023/03/16/introducing-microsoft-365-copilot-your-copilot-for-work/"}]},{"date":"2024-07-19","precision":"day","end_date":null,"type":"point","layer":"導入と商習慣","title":"CrowdStrike障害、クラウド依存のリスク露呈","summary":"セキュリティ企業CrowdStrikeの更新プログラムの不具合により、世界で約850万台のWindows端末が起動不能となり、航空・医療・金融などの業務が広範囲で停止した。\n\n特定のクラウドサービスへの依存が社会全体の単一障害点になりうることを史上最大級の規模で示した事例であり、SaaS前提の業務設計に対して、依存先の集中リスクという論点を突きつけた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Microsoft公式ブログによる影響台数の推計(2024-07-20)および各社報道","url":null}]},{"date":"2024-09-01","precision":"month","end_date":null,"type":"point","layer":"導入と商習慣","title":"Klarna CEOの「SaaS解約」発言が波紋","summary":"決済企業KlarnaのCEOが、自社開発のAIシステムでSalesforceやWorkdayの利用をやめると発言し、「AIはSaaSを不要にするのか」という議論を業界全体に呼び起こした。\n\n発言はその後軌道修正が報じられ実態には諸説あるが、AIエージェント(プロダクトと企業レイヤー)が**SaaSの存在意義を問い直す**時代の空気を象徴する出来事として、繰り返し引用され続けている。","detail":null,"credibility":"disputed","credibility_note":"発言の内容と実際の解約範囲については報道ベースで、後にCEO自身が発言を部分的に修正したとされるなど、実態は確定していない。","sources":[{"title":"Reuters等によるKlarna CEO発言の報道(2024年9月)","url":null}]},{"date":"2024-09-01","precision":"month","end_date":null,"type":"point","layer":"プロダクトと企業","title":"SalesforceがAgentforce発表、エージェントへ","summary":"SalesforceがAIエージェント基盤Agentforceを発表し、人が画面を操作するSaaSから、AIが業務そのものを代行するエージェントへの転換を打ち出した。\n\nSaaSの代名詞だった企業自身がエージェント化を主導する点が象徴的であり、席数課金から実行回数・成果に応じた課金への移行を含め、四半世紀続いたSaaSの事業モデル自体が再設計され始めたことを示す。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Salesforce プレスリリース: Agentforce発表(Dreamforce 2024)","url":null}]},{"date":"2025-01-01","precision":"year","end_date":null,"type":"point","layer":"導入と商習慣","title":"国内SaaS市場、1兆円超えの推計が定着","summary":"民間調査各社が国内SaaS市場を1兆円超の規模と推計するようになり、業務ソフトの新規導入はクラウドが前提という状況が定着した。\n\n推計値は調査会社によって定義も数値も異なり幅があるが、四半世紀前に「No Software」(プロダクトと企業レイヤー)が掲げた**所有から利用への転換**が、日本の商習慣としても既定路線になったことを示す指標といえる。","detail":null,"credibility":"unverified","credibility_note":"市場規模はSaaSの定義や集計範囲が調査会社ごとに異なる推計値であり、公的統計による裏付けはない。","sources":[{"title":"富士キメラ総研・ITR等の国内SaaS市場調査","url":null}]}]},{"slug":"business-coffee-industry","title":"コーヒー産業の変遷","description":"缶コーヒーの発明からサードウェーブ、気候変動と歴史的価格高騰まで。企業とチェーン・生産と流通・消費と文化の3層で、一杯のコーヒーの裏にある産業構造の変化を追う年表。","category":"business","language":"ja","start_year":1969,"end_year":2025,"layers":[{"name":"企業とチェーン","color":"orange"},{"name":"生産と流通","color":"green"},{"name":"消費と文化","color":"gold"}],"events":[{"date":"1969-01-01","precision":"year","end_date":null,"type":"point","layer":"消費と文化","title":"UCCがミルク入り缶コーヒーを発売","summary":"UCC上島珈琲がミルク入り缶コーヒーを発売した。いつでもどこでも飲める形態は自動販売機の普及とともに広がり、日本独自のコーヒー消費文化を作り上げていく。\n\n「世界初の缶コーヒー」とされることが多いが先行商品を挙げる説もある。いずれにせよ、コーヒーを喫茶店の飲み物から**日常の習慣に変えた**発明として、家庭外消費の拡大を数十年にわたり支えた。","detail":null,"credibility":"disputed","credibility_note":"「世界初の缶コーヒー」については、これに先行する地方メーカーの商品を挙げる説があり、定義によって見解が分かれる。","sources":[{"title":"UCC上島珈琲 会社沿革","url":null}]},{"date":"1971-01-01","precision":"year","end_date":null,"type":"point","layer":"企業とチェーン","title":"スターバックスがシアトルで創業","summary":"シアトルのパイクプレイス市場近くでスターバックスが創業した。当初は焙煎豆を売る小売店であり、後にハワード・シュルツの合流を経てエスプレッソバー業態へ転換していく。\n\n産地や焙煎に踏み込む「第二の波」と呼ばれるシアトル系コーヒー文化の源流であり、コーヒーを豆の販売から**体験を売る業態**へ変えた。四半世紀後の日本上陸(同レイヤー)で日本の喫茶市場も塗り替える。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Starbucks","url":"https://en.wikipedia.org/wiki/Starbucks"}]},{"date":"1980-04-01","precision":"month","end_date":null,"type":"point","layer":"企業とチェーン","title":"ドトールコーヒーショップ1号店が原宿に開店","summary":"ドトールコーヒーショップの1号店が原宿に開店した。立ち飲み形式で1杯150円という低価格を実現し、セルフサービス式コーヒーチェーンという業態を日本に定着させた。\n\n外食チェーン化の波をコーヒーに持ち込んだ存在であり、従来の喫茶店文化とは異なる「早い・安い」という軸を作った。スターバックスが上陸するまで、日本のチェーンコーヒーの標準形であり続ける。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"ドトールコーヒー 会社沿革","url":null}]},{"date":"1989-07-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"国際コーヒー協定の経済条項が失効","summary":"輸出割当によって国際価格を支えてきた国際コーヒー協定(ICA)の経済条項が失効し、コーヒーは市場価格に委ねられる時代に入った。価格は長期的な下落局面へ向かう。\n\n生産国の収入は不安定化し、1990年代末からの「コーヒー危機」(同レイヤー)の遠因となった。一方で安価な豆の安定供給は、消費国でのチェーン拡大(企業とチェーンレイヤー)を支える裏面でもあった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: International Coffee Agreement","url":"https://en.wikipedia.org/wiki/International_Coffee_Agreement"}]},{"date":"1996-08-02","precision":"day","end_date":null,"type":"point","layer":"企業とチェーン","title":"スターバックス日本1号店が銀座に開店","summary":"スターバックスが北米以外で初となる店舗を東京・銀座に開いた。全席禁煙の店内とエスプレッソドリンクという新しい様式で、若年層や女性客を喫茶市場に呼び込んだ。\n\n家庭でも職場でもない「サードプレイス」という空間の売り方が持ち込まれ、国内チェーン(同レイヤーのドトール等)との競争軸が価格から体験へと広がった。日本のカフェブームの起点とされる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"スターバックス コーヒー ジャパン 会社概要・沿革","url":null}]},{"date":"1997-01-01","precision":"year","end_date":null,"type":"point","layer":"生産と流通","title":"フェアトレード認証の国際組織FLOが設立","summary":"各国のフェアトレード認証団体を束ねる国際組織FLO(現Fairtrade International)が設立され、統一基準と共通の認証ラベルの仕組みが整った。コーヒーはその中心的な対象産品である。\n\n価格下落に苦しむ生産者への最低価格保証を、援助ではなく市場の仕組みとして制度化した試みであり、消費側の倫理的な関心(消費と文化レイヤー)を購買行動へ接続する回路を作った。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Fairtrade International","url":"https://en.wikipedia.org/wiki/Fairtrade_International"}]},{"date":"1999-01-01","precision":"year","end_date":"2004-12-31","type":"period","layer":"生産と流通","title":"国際価格が暴落、「コーヒー危機」","summary":"ベトナムの急速な増産などで供給過剰となり、国際価格が多くの産地で生産コストを下回る水準まで暴落した。中米やアフリカの小規模農家が離農や転作を迫られる「コーヒー危機」となった。\n\nICA体制の崩壊(同レイヤー)後の自由市場が生産者に最も過酷に働いた局面であり、フェアトレードやスペシャルティコーヒーといった、**価格以外の価値**を豆に付ける動きを加速させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際コーヒー機関(ICO)の価格統計および関連研究","url":null}]},{"date":"2002-01-01","precision":"year","end_date":null,"type":"point","layer":"消費と文化","title":"「サードウェーブ」という言葉が生まれる","summary":"米国の焙煎業界誌への寄稿で、焙煎士トリッシュ・ロスギブが「サードウェーブ」という語を用い、豆の個性や淹れ方に向き合う新潮流を、先行する二つの波と区別して名付けた。\n\n語の初出時期や定義には諸説あるが、大量消費の第一波、シアトル系チェーンの第二波(企業とチェーンレイヤー)への対抗として、産地・精製・抽出を語る文化に名前が付いた意味は大きい。","detail":null,"credibility":"disputed","credibility_note":"語の初出は2002〜2003年の業界誌寄稿とされるが、時期や「誰が最初か」については諸説ある。","sources":[{"title":"Trish Rothgeb寄稿(The Flamekeeper, Roasters Guild)に関する記録","url":null}]},{"date":"2013-01-01","precision":"month","end_date":null,"type":"point","layer":"企業とチェーン","title":"セブンカフェ開始、コンビニコーヒーが市場に","summary":"セブン-イレブンが1杯100円のいれたてコーヒー「セブンカフェ」の全国展開を始め、初年度に4億5000万杯を販売したとされる。コンビニコーヒーという巨大市場が一気に立ち上がった。\n\n販売杯数は自社発表ベースだが、100円で挽きたてが飲める体験は、缶コーヒー(消費と文化レイヤー)や低価格チェーンの需要を侵食し、日常のコーヒーの飲用シーンの勢力図を塗り替えた。","detail":null,"credibility":"unverified","credibility_note":"初年度4億5000万杯という販売数はセブン&アイの自社発表であり、第三者統計による検証はない。","sources":[{"title":"セブン&アイ・ホールディングス「セブンカフェ」に関する発表資料","url":null}]},{"date":"2015-02-06","precision":"day","end_date":null,"type":"point","layer":"消費と文化","title":"ブルーボトルコーヒーが清澄白河に日本上陸","summary":"米ブルーボトルコーヒーが海外初の店舗を東京・清澄白河に開いた。一杯ずつハンドドリップで淹れるスタイルが「サードウェーブの上陸」として大きく報じられ、開店当初は長蛇の列ができた。\n\n焙煎所を併設する立地選びやミニマルな店舗設計が広く模倣され、国内でも自家焙煎ロースターの開業が相次いだ。豆の産地や焙煎度を語る消費文化(同レイヤー)が日本で大衆化した瞬間である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Blue Bottle Coffee","url":"https://en.wikipedia.org/wiki/Blue_Bottle_Coffee"}]},{"date":"2018-05-01","precision":"month","end_date":null,"type":"point","layer":"企業とチェーン","title":"ネスレがスタバ製品の販売権を71.5億ドルで取得","summary":"ネスレが、スターバックス製品を店舗の外で販売する永続的なライセンスを71億5000万ドルで取得すると発表した。家庭用・小売市場で世界最大級のコーヒー連合が生まれた。\n\nカフェ体験(店舗)と家庭内消費(小売)の境界が崩れ、巨大資本による寡占が進む象徴となった。同年にはコカ・コーラによる英コスタの買収も発表され、世界のコーヒー業界の再編が一気に進んだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Nestlé: Nestlé and Starbucks announce global coffee alliance (2018-05)","url":null}]},{"date":"2019-01-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"「コーヒー2050年問題」が業界共通の課題に","summary":"気候変動によりアラビカ種の栽培適地が2050年までに大きく減少するとの研究が相次ぎ、野生のコーヒー種の6割に絶滅リスクがあるとする論文も発表された。「コーヒー2050年問題」として広く知られるようになった。\n\n適地減少の数値は気候シナリオや研究により幅があるが、耐候性品種の開発や産地の高地移転など**供給の持続可能性**が業界共通の課題となり、大手チェーンの調達方針にも影響を与え始めた。","detail":null,"credibility":"disputed","credibility_note":"「適地半減」等の予測値は気候シナリオや研究手法によって幅があり、単一の確定した数値ではない。","sources":[{"title":"Davis et al., \"High extinction risk for wild coffee species\" (Science Advances, 2019)","url":null}]},{"date":"2020-04-01","precision":"month","end_date":"2023-05-01","type":"period","layer":"消費と文化","title":"コロナ禍、コーヒーを飲む場所が店から家へ","summary":"新型コロナで都市部のカフェは休業や時短を迫られ、一方で在宅時間の増加により家庭用レギュラーコーヒーや抽出器具の販売が伸びた。飲む場所が店から家へと大きく移動した。\n\nテイクアウトやモバイルオーダーへの投資が定着し、チェーン各社(企業とチェーンレイヤー)では店舗網の見直しも進んだ。家庭で豆や抽出にこだわる層の拡大は、サードウェーブ的な消費の裾野を広げた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"全日本コーヒー協会の統計および各社報道","url":null}]},{"date":"2021-07-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"ブラジル霜害でアラビカ先物価格が急騰","summary":"最大の産地ブラジルを数十年ぶりといわれる強い霜が襲い、翌年産以降の減産懸念からアラビカ先物価格が急騰した。先行する干ばつと重なり、供給不安が長期化する入口となった。\n\n気候変動リスク(同レイヤーの2050年問題)が目の前の価格として顕在化した最初の大きな局面であり、のちの歴史的高値(同レイヤー)へ続く需給逼迫の起点となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"2021年7月のブラジル霜害とコーヒー先物価格に関するReuters等の報道","url":null}]},{"date":"2023-06-29","precision":"day","end_date":null,"type":"point","layer":"生産と流通","title":"EU森林破壊防止規則(EUDR)が発効","summary":"森林破壊に由来する産品のEU市場での流通を禁じる森林破壊防止規則(EUDR)が発効した。コーヒーは対象品目であり、輸入者には生産地の位置情報まで遡る証明が求められる。\n\n小規模農家が大半を占めるコーヒーでは対応コストの負担が重く、適用時期の延期が決まるなど混乱も続く。**サプライチェーンの透明性**が貿易の条件そのものになったことを示す規制である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2023/1115 (EUDR)","url":"https://eur-lex.europa.eu/eli/reg/2023/1115/oj"}]},{"date":"2025-01-01","precision":"year","end_date":null,"type":"point","layer":"消費と文化","title":"国内で値上げが相次ぎ、消費の前提が揺らぐ","summary":"2024年からの生豆高騰と円安を受け、国内ではレギュラーコーヒーや缶コーヒー、チェーン各社の値上げが相次いだ。業界統計では国内消費量は頭打ちから微減傾向にあるとされる。\n\n消費量の統計は業界団体の推計ベースで幅があるが、半世紀にわたり「安く日常的に飲める」ことを前提に築かれた日本のコーヒー文化(同レイヤーの缶コーヒー)が、価格局面の転換で試されている。","detail":null,"credibility":"unverified","credibility_note":"国内消費量の動向は全日本コーヒー協会等の推計に基づくもので、集計範囲により数値が異なる。","sources":[{"title":"全日本コーヒー協会「日本のコーヒーの飲用状況・統計資料」","url":null}]},{"date":"2025-02-01","precision":"month","end_date":null,"type":"point","layer":"生産と流通","title":"アラビカ先物が名目で史上最高値を更新","summary":"ニューヨーク市場のアラビカ先物が1ポンド4ドルを超え、名目価格で史上最高値を更新した。ブラジルの干ばつによる減産懸念と在庫の減少、規制対応コストが重なった構造的な高値とされる。\n\n名目では最高値だが、実質価格では1977年の高騰に及ばないとの指摘もあり評価は分かれる。店頭価格への転嫁が世界で進み、**安いコーヒーの時代の終わり**が消費者にも実感される局面となった。","detail":null,"credibility":"disputed","credibility_note":"「史上最高値」は名目価格ベースの評価であり、インフレ調整後の実質価格では過去の高騰期を下回るとの指摘がある。","sources":[{"title":"2025年2月のアラビカ先物価格に関するReuters・Bloomberg等の報道","url":null}]}]},{"slug":"business-dx-japan","title":"DX推進の記録","description":"「2025年の崖」の警告からデジタル庁発足、生成AI活用まで。政策と制度・企業の現場・技術とサービスの3層を重ね、日本のDXが掛け声から実装へ移る道のりを追う年表。","category":"business","language":"ja","start_year":2018,"end_year":2025,"layers":[{"name":"政策と制度","color":"teal"},{"name":"企業の現場","color":"orange"},{"name":"技術とサービス","color":"blue"}],"events":[{"date":"2018-09-07","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"経産省「DXレポート」公表、2025年の崖を警告","summary":"経済産業省が「DXレポート」を公表し、既存システムの老朽化とIT人材不足を放置すれば2025年以降に年最大12兆円の経済損失が生じうると警告した。いわゆる「2025年の崖」である。\n\n損失額は前提に幅のある試算だが、この言葉が経営層への説得材料となり、**DXが経営課題として認知される起点**となった。以後の政策と企業の現場の動きの多くが、この警告を参照して進む。","detail":null,"credibility":"disputed","credibility_note":"年最大12兆円という損失額は経産省の試算であり、算定の前提や妥当性については有識者の間でも見解が分かれる。","sources":[{"title":"経済産業省「DXレポート ～ITシステム『2025年の崖』の克服とDXの本格的な展開～」(2018-09-07)","url":null}]},{"date":"2019-07-01","precision":"day","end_date":"2019-09-30","type":"period","layer":"企業の現場","title":"7payが不正アクセスで3か月で廃止","summary":"セブン&アイのスマホ決済7payが開始直後から不正アクセス被害を受け、サービス開始からわずか3か月で廃止された。二段階認証の欠如など基本的な設計不備が指摘された。\n\n大手小売のデジタル事業でも**セキュリティ軽視が事業の存続を左右する**ことを示した事例であり、直後のキャッシュレス還元事業(政策と制度レイヤー)を控えた時期に、決済サービスへの信頼という課題を突きつけた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"セブン&アイ・ホールディングス「『7pay(セブンペイ)』サービス廃止のお知らせ」(2019-08-01)","url":null}]},{"date":"2019-10-01","precision":"day","end_date":"2020-06-30","type":"period","layer":"政策と制度","title":"キャッシュレス・ポイント還元事業","summary":"消費税率引き上げと同時に、中小店舗でのキャッシュレス決済に最大5%を還元する国の事業が始まり、2020年6月末まで続いた。対象店舗は最終的に100万を超えた。\n\n決済事業者の加盟店開拓が一気に進み、QRコード決済の定着を後押しした。直前の7pay問題(企業の現場レイヤー)で安全性への不安が残る中、制度が消費者の行動を動かした事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省「キャッシュレス・消費者還元事業」","url":null}]},{"date":"2020-04-07","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"緊急事態宣言でテレワークが急拡大","summary":"新型コロナの緊急事態宣言を機に、大企業を中心にテレワークへの移行が急速に進んだ。東京都の調査では、都内企業の実施率が宣言前後で2倍超に上昇したとされる。\n\n一方で押印のための出社、紙書類、VPNの容量不足など、**掛け声だけだったデジタル化の実力**が一斉に露呈した。この経験がデジタル庁設立(政策と制度レイヤー)への世論の追い風となる。","detail":null,"credibility":"disputed","credibility_note":"テレワーク実施率は調査主体・対象・時期により数値が大きく異なり、確定的な水準を示す統計はない。","sources":[{"title":"東京都「テレワーク導入率調査結果」(2020年4月)","url":null}]},{"date":"2020-05-01","precision":"month","end_date":null,"type":"point","layer":"政策と制度","title":"特別定額給付金オンライン申請の混乱","summary":"一律10万円の特別定額給付金でマイナンバーカードによるオンライン申請が導入されたが、自治体側の照合が手作業となり郵送より遅い事態が生じ、オンライン受付を停止する自治体も相次いだ。\n\n行政システムが縦割りでデータ連携できない実態を象徴する出来事となり、翌年のデジタル庁発足と自治体システム標準化を直接後押しした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"総務省「特別定額給付金」関連資料および各自治体の発表","url":null}]},{"date":"2020-12-28","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"DXレポート2、「9割がDX未着手か途上」","summary":"経産省がDXレポート2(中間取りまとめ)を公表し、9割超の企業がDXに未着手か一部での実施にとどまるとの調査結果を示した上で、DXの本質はレガシー刷新ではなく企業文化の変革だと軌道修正した。\n\nコロナ対応で問われたのは技術より変化への対応力だったという整理であり、最初のレポートが招いた「システム更改=DX」という誤解を、政策文書自身が正した形である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"経済産業省「DXレポート2(中間取りまとめ)」(2020-12-28)","url":null}]},{"date":"2021-02-28","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"みずほ銀行で大規模システム障害","summary":"みずほ銀行でATMが通帳やカードを取り込んだまま停止する大規模障害が発生。同年は障害が相次ぎ、金融庁が業務改善命令を出す事態に至った。\n\n4000億円超を投じた勘定系システム刷新の完了後に起きた点が重く、**巨大レガシー刷新の難しさ**を象徴する事例として、「2025年の崖」の警告(政策と制度レイヤー)と併せて語られるようになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"金融庁「みずほ銀行及びみずほフィナンシャルグループに対する行政処分について」(2021-11-26)","url":null}]},{"date":"2021-09-01","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"デジタル庁が発足","summary":"行政のデジタル化を一元的に担うデジタル庁が発足した。民間人材を大量登用し、国と自治体の情報システムの統一・標準化やマイナンバー制度の普及を任務とする。\n\n給付金申請の混乱(同レイヤー)が生んだ世論を背景に、構想表明から1年足らずで設置された。以後のガバメントクラウド選定(技術とサービスレイヤー)や保険証一体化は、この組織が推進していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁","url":"https://www.digital.go.jp/"}]},{"date":"2021-10-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"ガバメントクラウドにAWSとGoogle Cloudを選定","summary":"デジタル庁が、国・自治体の共通基盤となるガバメントクラウドの提供事業者としてAWSとGoogle Cloudを選定した。国の基盤に海外クラウドのみが採用されたことは議論を呼んだ。\n\n要件を満たす国内事業者が当時存在しなかったことが背景にあり、**国産クラウドの不在**という論点を可視化した。2023年のさくらインターネット条件付き選定(同レイヤー)につながる伏線である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁「ガバメントクラウド整備のためのクラウドサービスの提供に係る契約」(2021年度)","url":null}]},{"date":"2023-02-01","precision":"month","end_date":null,"type":"point","layer":"企業の現場","title":"パナソニック コネクトが生成AIを全社導入","summary":"パナソニック コネクトが、ChatGPTと同系のモデルを使う自社AIアシスタントを国内大手として早期に全社員規模で導入したと発表した。\n\n労働時間削減などの効果は自社発表ベースで第三者検証はないが、ChatGPT公開(技術とサービスレイヤーの潮流)からわずか数か月で業務利用に踏み切った事例として注目され、大企業の生成AI導入が広がる先例となった。","detail":null,"credibility":"unverified","credibility_note":"導入規模や業務効率化の効果は同社の発表に基づく数値であり、第三者による検証はない。","sources":[{"title":"パナソニック コネクト プレスリリース「AIアシスタントサービスの国内全社員への展開」(2023年2月)","url":null}]},{"date":"2023-05-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"サイバーエージェントが日本語LLMを公開","summary":"サイバーエージェントが日本語に特化した大規模言語モデルOpenCALMを商用利用可能なライセンスで公開した。国内企業による基盤モデル公開の先駆けの一つである。\n\n海外製モデルへの依存が課題とされる中で、国内でもモデルの開発・公開が始まったことを示す。政府も国産基盤モデルの開発支援(政策と制度レイヤー)に動き、DXの論点が生成AIの活用へ移っていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"サイバーエージェント プレスリリース「独自の日本語LLM(大規模言語モデル)を一般公開」(2023年5月)","url":null}]},{"date":"2023-10-01","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"インボイス制度が開始","summary":"消費税の適格請求書等保存方式(インボイス制度)が始まり、請求書の記載要件と保存義務が変わった。企業規模を問わず、経理・請求業務の見直しが迫られた。\n\n制度対応の必要が会計・請求SaaSの導入を強力に後押しし、中小企業にとってデジタル化の入口となった。**制度対応が実装を強制する**という、日本のDXに繰り返し現れる構図の典型例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国税庁「インボイス制度の概要」","url":null}]},{"date":"2023-10-10","precision":"day","end_date":null,"type":"point","layer":"企業の現場","title":"全銀システムで初の大規模障害","summary":"銀行間送金を担う全国銀行データ通信システムで、中継コンピュータの更改作業に起因する障害が発生し、複数の銀行で他行宛て振込が2日間にわたり滞った。1973年の稼働以来初の大規模障害とされる。\n\n半世紀動き続けた社会インフラの更改で露呈したリスクは、老朽システムの更新を先送りする危うさを説いた「2025年の崖」(政策と制度レイヤー)の警告が現実になった例として受け止められた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"全国銀行資金決済ネットワーク「全銀システムにおける障害について」(2023年10月)","url":null}]},{"date":"2023-11-01","precision":"month","end_date":null,"type":"point","layer":"技術とサービス","title":"さくらインターネットがガバクラに条件付き選定","summary":"ガバメントクラウドの提供事業者に、国内事業者として初めてさくらインターネットが条件付きで選定された。2025年度末までに全ての技術要件を満たすことが条件とされた。\n\n海外勢のみだった政府基盤(同レイヤーの2021年選定)に国内勢が加わる一歩であり、経済安全保障の観点からクラウドを国内に持つべきだという議論を反映した決定である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"デジタル庁「ガバメントクラウドの整備におけるクラウドサービスの募集結果」(2023年11月)","url":null}]},{"date":"2024-12-02","precision":"day","end_date":null,"type":"point","layer":"政策と制度","title":"健康保険証の新規発行終了、マイナ保険証へ","summary":"健康保険証の新規発行が終了し、マイナンバーカードと一体化した「マイナ保険証」への移行が本格化した。既存の保険証は経過措置として最長1年間有効とされた。\n\n紐付け誤りの発覚などによる不信から利用率が低迷したまま移行が進んだ点に、**普及を制度で先導することのリスク**が表れている。行政のデジタル化が国民の日常に直接触れた、最初の大規模事例となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"厚生労働省「マイナンバーカードの健康保険証利用について」","url":null}]},{"date":"2025-02-03","precision":"day","end_date":null,"type":"point","layer":"技術とサービス","title":"SBGとOpenAIが企業向けAIで合弁を発表","summary":"ソフトバンクグループとOpenAIが、企業向けAI「クリスタル・インテリジェンス」の日本展開に向けた合弁会社の設立を発表した。SBGは年間30億ドル規模を自社グループでのAI活用に投じるとした。\n\n金額や展開規模は発表時点の計画であり実行は未確定だが、日本企業のDXが生成AI・AIエージェントを前提とする段階へ移る流れを象徴する発表として位置づけられる。","detail":null,"credibility":"unverified","credibility_note":"投資額・展開規模は発表時点の計画値であり、実際の資金投下や導入実績はこの時点で確定していない。","sources":[{"title":"ソフトバンクグループ プレスリリース(2025-02-03)","url":null}]}]},{"slug":"business-esg-investing","title":"ESG投資の潮流","description":"「ESG」という言葉の誕生からGPIFの参入、グリーンウォッシング摘発と反ESGの逆風まで。投資マネー・規制と基準・社会の圧力を重ね、金融が気候と倫理を織り込んでいく20年を追う。","category":"business","language":"ja","start_year":2004,"end_year":2025,"layers":[{"name":"投資と市場","color":"orange"},{"name":"規制と基準","color":"teal"},{"name":"社会と気候","color":"green"}],"events":[{"date":"2004-01-01","precision":"year","end_date":null,"type":"point","layer":"規制と基準","title":"国連報告書「Who Cares Wins」でESGの語が登場","summary":"国連グローバル・コンパクトが金融機関と共同で報告書「Who Cares Wins」を公表。環境(E)・社会(S)・企業統治(G)の要素を投資分析に組み込むべきだと提言し、**「ESG」という言葉**が国際的な公式文書に登場した。\n\nそれまで「社会的責任投資(SRI)」と呼ばれ倫理色の強かった潮流を、リスクとリターンという投資の言葉で語り直した点が新しかった。以後の20年は、この語が金融の中心語彙になり、やがて政治の争点になっていく過程でもある。","detail":null,"credibility":"disputed","credibility_note":"ESGという語の初出をこの報告書とする説が広く引用されるが、それ以前の使用例を指摘する研究もあり確定的ではない。","sources":[{"title":"UN Global Compact: Who Cares Wins - Connecting Financial Markets to a Changing World (2004)","url":null}]},{"date":"2006-04-27","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"責任投資原則(PRI)がNY証券取引所で発足","summary":"アナン国連事務総長の主導で責任投資原則(PRI)が発足した。署名機関は、ESGを投資判断と株主行動に組み込む6つの原則にコミットする。\n\n発足時の署名は数十機関にとどまったが、後に世界で数千機関・運用資産100兆ドル規模にまで拡大する。法的拘束力のない自主原則という設計は、規制ではなく市場の同調圧力でESGを広げるという、この分野に特有の進み方の原型となった。署名の有無自体が運用受託の条件になっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"PRI: About the PRI","url":"https://www.unpri.org/about-us/about-the-pri"}]},{"date":"2008-09-15","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"リーマン・ショック、短期主義への反省","summary":"リーマン・ブラザーズの経営破綻を引き金に世界金融危機が発生した。短期の利益を追い、リスクを外部化してきた金融のあり方への批判が世界的に高まった。\n\n危機後の反省は、四半期主義から長期投資への転換論や、機関投資家に企業との対話を求めるスチュワードシップ・コードの整備(規制と基準レイヤー)へつながる。ESGが「危機後の金融の正統性回復」という文脈で主流に押し上げられていく、その出発点にあたる出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: リーマン・ショック","url":"https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%BC%E3%83%9E%E3%83%B3%E3%83%BB%E3%82%B7%E3%83%A7%E3%83%83%E3%82%AF"}]},{"date":"2015-09-01","precision":"month","end_date":null,"type":"point","layer":"投資と市場","title":"GPIFが責任投資原則(PRI)に署名","summary":"世界最大級の年金基金であるGPIF(年金積立金管理運用独立行政法人)が責任投資原則に署名した。\n\n運用資産100兆円超の「クジラ」の参加は、年金の受託者責任とESG考慮は矛盾しないという解釈を日本市場に事実上定着させ、国内の運用機関が一斉にESG対応へ動く引き金となった。**アセットオーナーが動けば市場全体が動く**という構図を示す代表例であり、日本のESG投資拡大は実質的にここから始まったと評される。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GPIF: 国連責任投資原則への署名について (2015年9月)","url":null}]},{"date":"2015-09-25","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"国連総会がSDGsを採択","summary":"国連総会が持続可能な開発目標(SDGs)を全会一致で採択した。2030年までの17目標・169ターゲットを掲げ、政府だけでなく企業を変革の主体と位置づけた。\n\n法的拘束力はないが、企業報告やESG評価の項目がSDGsに紐付けられていくことで、投資と市場レイヤーに「何を測るか」の共通枠組みを提供した。日本では経団連の企業行動憲章改定などを通じて浸透し、統合報告書にアイコンが並ぶ光景が定着していく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"国際連合広報センター: 持続可能な開発目標(SDGs)とは","url":null}]},{"date":"2015-12-12","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"COP21でパリ協定採択","summary":"国連気候変動枠組条約のCOP21で、気温上昇を産業革命前比2度未満、努力目標1.5度に抑えるパリ協定が採択された。\n\n「今世紀後半に排出実質ゼロ」という長期目標は金融の言葉に翻訳され、化石燃料資産が価値を失う「座礁資産」や炭素予算の概念が投資と市場レイヤーの用語として一般化する。気候変動が倫理の問題から**運用リスクの問題**へ置き換えられた分水嶺であり、TCFDやネットゼロ連合はこの延長線上にある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UNFCCC: The Paris Agreement","url":"https://unfccc.int/process-and-meetings/the-paris-agreement"}]},{"date":"2017-07-03","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"GPIFがESG指数を選定、約1兆円の運用開始","summary":"GPIFが3つのESG指数を選定し、これに連動する約1兆円のパッシブ運用を始めると発表した。日本株のESG投資として当時最大規模だった。\n\n指数に組み入れられるかどうかが資金の流入を左右するため、企業側に情報開示とESGスコア改善への強い動機が生まれた。同時に、評価機関ごとにスコアが食い違う「ESG評価のばらつき」への批判も本格化し、評価手法の透明化という規制と基準レイヤーの論点を呼び込んだ。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"GPIF: ESG指数を選定しました (2017-07-03)","url":null}]},{"date":"2018-08-20","precision":"day","end_date":null,"type":"point","layer":"社会と気候","title":"グレタ・トゥーンベリが学校ストライキを開始","summary":"15歳のグレタ・トゥーンベリがスウェーデン議会前で「気候のための学校ストライキ」を一人で始めた。\n\nこの抗議はFridays for Futureとして世界の若者運動に拡大し、翌年の国連気候行動サミットでの演説で頂点に達する。株主総会での気候関連決議や機関投資家への働きかけが増えるなど、**社会の圧力が投資行動を動かす**回路がはっきり可視化された時期の象徴であり、企業のネットゼロ宣言が相次ぐ背景となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Greta Thunberg","url":"https://en.wikipedia.org/wiki/Greta_Thunberg"}]},{"date":"2019-08-19","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"米ビジネス・ラウンドテーブルが企業の目的を再定義","summary":"米主要企業の経営者団体ビジネス・ラウンドテーブルが「企業の目的に関する声明」を発表。株主至上主義を改め、顧客・従業員・取引先・地域社会を含む全ステークホルダーへの価値提供を掲げ、181人のCEOが署名した。\n\n株主資本主義の総本山による転換宣言として象徴的意義は大きかったが、その後の経営行動が伴っていないとする検証も相次いだ。言葉と行動の差というグリーンウォッシング問題の構図を、企業統治の文脈で先取りした出来事といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Business Roundtable: Statement on the Purpose of a Corporation (2019-08-19)","url":"https://opportunity.businessroundtable.org/ourcommitment/"}]},{"date":"2019-09-20","precision":"day","end_date":null,"type":"point","layer":"社会と気候","title":"世界気候ストライキ、数百万人が参加","summary":"国連気候行動サミットを前に世界各地で一斉の気候ストライキが行われ、主催者発表で数百万人が参加したとされる。若者だけでなく従業員として参加を表明する企業も現れた。\n\n消費者・従業員・市民としての意識の変化は、企業が脱炭素目標を掲げる際の社会的背景となり、翌年以降のESGファンドへの資金流入加速(投資と市場レイヤー)と並走した。ただし参加者数は主催者の集計であり、運動の規模の評価には幅がある。","detail":null,"credibility":"unverified","credibility_note":"参加人数(世界で400万人超などとされる)は主催団体の集計に基づくもので、第三者による検証はない。","sources":[{"title":"The Guardian: Global climate strike coverage (2019-09-20)","url":null}]},{"date":"2020-01-14","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"ブラックロックのフィンク書簡「気候リスクは投資リスク」","summary":"世界最大の資産運用会社ブラックロックのラリー・フィンクCEOが企業経営者への年頭書簡で「気候リスクは投資リスクである」と宣言し、サステナビリティを運用の中心に据えると表明した。\n\n運用資産7兆ドル規模の同社の転換はESGの主流化を決定づけた一方、5年後には同社自身がネットゼロ連合を離脱する(2025年・同じ投資と市場レイヤー)。**運用会社の旗色は政治環境で変わり得る**ことを示す、頂点と転落の両方の起点となった書簡である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"BlackRock: Larry Fink's 2020 Letter to CEOs - A Fundamental Reshaping of Finance","url":null}]},{"date":"2020-10-26","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"菅首相が2050年カーボンニュートラルを宣言","summary":"菅義偉首相が所信表明演説で、2050年までに温室効果ガスの排出を全体としてゼロにする「カーボンニュートラル」を目指すと宣言した。\n\n主要排出国の長期目標が出そろい始めた時期にあたり、国内ではGX(グリーントランスフォーメーション)関連の政策やトランジション・ファイナンスの制度設計が動き出す。政府目標の明示は企業の脱炭素計画と開示の前提条件を変え、投資と市場レイヤーの国内ESG投資残高拡大を後押しした。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"首相官邸: 第二百三回国会における菅内閣総理大臣所信表明演説 (2020-10-26)","url":"https://www.kantei.go.jp/jp/99_suga/statement/2020/1026shoshinhyomei.html"}]},{"date":"2021-03-10","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"EUでサステナブルファイナンス開示規則(SFDR)適用開始","summary":"EUでSFDRの適用が始まり、運用会社は金融商品をサステナビリティ特性に応じて分類し(8条・9条など)、その根拠を開示することを求められるようになった。\n\n自主的な看板にすぎなかった「ESGファンド」に定義と説明責任を課す世界初の本格的試みで、基準の厳格化に伴い9条から8条への「格下げ」が相次ぐなど、**ラベルの信頼性**を巡る攻防が始まった。米欧のグリーンウォッシング規制・摘発の流れの先行例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Regulation (EU) 2019/2088 (SFDR)","url":"https://eur-lex.europa.eu/eli/reg/2019/2088/oj"}]},{"date":"2021-11-03","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"COP26でGFANZが「130兆ドル」の資金動員を表明","summary":"グラスゴーのCOP26で、金融機関の連合GFANZ(グラスゴー金融同盟)が、ネットゼロにコミットする加盟機関の資産が計130兆ドルに達したと表明した。\n\n金融の総動員を印象づけ、ESGの高揚が頂点に達した瞬間とされるが、集計の重複や実効性への懐疑は直後から指摘されていた。数年後に米大手の脱退が相次ぎ連合が縮小していく(同じ投資と市場レイヤー)ことを踏まえると、宣言と実行の距離を測る基準点として振り返られる出来事である。","detail":null,"credibility":"disputed","credibility_note":"130兆ドルは加盟機関の運用・融資資産の合算であり、実際にネットゼロへ振り向けられる資金額ではないとの批判がある。","sources":[{"title":"GFANZ: Amount of finance committed to achieving 1.5°C now at scale needed to deliver the transition (2021-11-03)","url":null}]},{"date":"2022-01-01","precision":"year","end_date":"2025-12-31","type":"period","layer":"社会と気候","title":"米国で反ESG運動が拡大","summary":"米国の共和党系の州を中心に、ESGを考慮する運用会社を州資金の運用から排除する法律や、エネルギー企業へのボイコットを禁じる法律が相次いで成立した。連邦議会や大統領選でもESGは攻撃の的となった。\n\nESGが政治的対立軸に組み込まれた結果、大手運用会社は文書からESGという語を減らし、気候連合から脱退する動きを見せる。**言葉の退潮と実務の定着**が併存する複雑な局面であり、欧州・日本の制度化の進展とは対照的な分岐が生じた。","detail":null,"credibility":"disputed","credibility_note":"反ESG運動の起点と範囲の切り方は論者により異なり、この期間は州レベルの立法が集中した時期の目安である。","sources":[{"title":"Harvard Law School Forum on Corporate Governance: ESG Battlegrounds - How the States Are Shaping the Regulatory Landscape (2023)","url":null}]},{"date":"2022-02-24","precision":"day","end_date":null,"type":"point","layer":"社会と気候","title":"ロシアのウクライナ侵攻、エネルギー危機でESGに逆風","summary":"ロシアがウクライナへ全面侵攻した。エネルギー価格が急騰し、各国は化石燃料の調達確保とロシア産資源からの脱却を同時に迫られた。\n\nエネルギー安全保障が優先される中で石油・ガス関連株が上昇し、それらを除外するESGファンドの成績は相対的に悪化。「ESGはリターンを犠牲にするのか」という古い問いが再燃した。防衛産業を投資対象に含めるかの見直しも進み、**ESGの線引きの恣意性**が正面から問われることになった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: ロシアのウクライナ侵攻 (2022年)","url":"https://ja.wikipedia.org/wiki/%E3%83%AD%E3%82%B7%E3%82%A2%E3%81%AE%E3%82%A6%E3%82%AF%E3%83%A9%E3%82%A4%E3%83%8A%E4%BE%B5%E6%94%BB_(2022%E5%B9%B4)"}]},{"date":"2022-05-31","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"独DWSにグリーンウォッシング疑いで強制捜査","summary":"ドイツ銀行系の運用大手DWSに対し、ESG運用の実態を誇張した疑い(グリーンウォッシング)で独検察当局などが強制捜査を実施。翌日にCEOが辞任を発表した。\n\n元サステナビリティ責任者の内部告発に端を発した事件で、後に同社は米SECとの間でも制裁金の支払いに至った。「ESGを名乗ること」自体が法的リスクになった転換点であり、SFDRなど規制と基準レイヤーの開示規制強化と呼応して、業界の看板の掛け直しを促した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Reuters: German police raid DWS and Deutsche Bank in greenwashing probe (2022-05-31)","url":null}]},{"date":"2023-06-26","precision":"day","end_date":null,"type":"point","layer":"規制と基準","title":"ISSBがサステナビリティ開示の国際基準を公表","summary":"国際サステナビリティ基準審議会(ISSB)が、サステナビリティ開示の国際基準IFRS S1(全般)とS2(気候関連)を公表した。\n\nTCFDやSASBなど乱立していた開示枠組みを統合する「グローバル・ベースライン」であり、任意の取り組みだった開示が各国の制度に組み込まれていく基盤となった。日本でもSSBJが国内基準を策定し、プライム市場上場企業への段階適用が議論される。開示の標準化は、投資と市場レイヤーの評価のばらつき問題への一つの答えでもある。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"IFRS Foundation: ISSB issues inaugural global sustainability disclosure standards (2023-06-26)","url":"https://www.ifrs.org/news-and-events/news/2023/06/issb-issues-ifrs-s1-ifrs-s2/"}]},{"date":"2024-01-01","precision":"year","end_date":null,"type":"point","layer":"規制と基準","title":"EUで企業サステナビリティ報告指令(CSRD)適用開始","summary":"EUのCSRDが2024年度から段階的に適用され、大企業は欧州サステナビリティ報告基準(ESRS)に基づく詳細な開示を義務付けられた。対象はEU域内で事業を行う域外企業にも及ぶ広範な設計だった。\n\nしかし報告負担への反発は強く、2025年には適用対象を大幅に絞り込む「オムニバス」簡素化案が提示され、規制の振り子は緩和方向へ揺れ始めた。開示規制の到達点と、その行き過ぎの修正が同時に観察できる事例である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"EUR-Lex: Directive (EU) 2022/2464 (CSRD)","url":"https://eur-lex.europa.eu/eli/dir/2022/2464/oj"}]},{"date":"2025-01-13","precision":"day","end_date":null,"type":"point","layer":"投資と市場","title":"ネットゼロ運用連合NZAMが活動停止","summary":"ブラックロックの脱退表明を受け、運用会社の連合Net Zero Asset Managers(NZAM)が活動の一時停止と枠組みの見直しを発表した。前月までに米大手銀行の間でも銀行連合NZBAからの脱退が相次いでいた。\n\n米国の政治的圧力(社会と気候レイヤーの反ESG運動)が国際的な金融連合を解体に向かわせた形だが、欧州や日本では開示の制度化と企業の脱炭素投資が続いており、ESGは「旗印の時代」から「実務の時代」へ移行したと評されている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Net Zero Asset Managers initiative: Statement (2025-01-13)","url":null},{"title":"Reuters: BlackRock quits climate group NZAM (2025-01-09)","url":null}]}]},{"slug":"business-freelance-economy","title":"フリーランス経済","description":"クラウドソーシングの誕生からギグエコノミーの拡大、各国の保護法制、生成AIの衝撃まで。プラットフォーム・制度・働き手の3層で「雇用によらない働き方」の四半世紀を追う年表。","category":"business","language":"ja","start_year":1999,"end_year":2024,"layers":[{"name":"プラットフォーム","color":"orange"},{"name":"制度と保護","color":"teal"},{"name":"働き手と社会","color":"green"}],"events":[{"date":"1999-01-01","precision":"year","end_date":null,"type":"point","layer":"プラットフォーム","title":"Elance登場、オンライン外注市場の先駆け","summary":"米国でElanceが立ち上がり、企業がインターネット経由で世界中の個人に仕事を発注する「オンライン外注」の市場が生まれた。後にoDeskとの統合を経てUpworkの源流となる。\n\n回線の高速化を背景に、仕事の受発注が対面と人づての紹介の世界からオンラインへ移り始めた出発点である。この働き方を指す言葉はまだなく、「ギグエコノミー」の語が広まるのは約10年後(働き手と社会レイヤー)のことになる。","detail":null,"credibility":"disputed","credibility_note":"会社の創業は1998年とされ、サービス開始の時期は資料により1999年前後と幅がある。","sources":[{"title":"Wikipedia: Elance","url":"https://en.wikipedia.org/wiki/Elance"}]},{"date":"2005-11-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"Amazon Mechanical Turk公開、マイクロタスクの誕生","summary":"Amazonが、人間にしかできない細かな作業を少額で発注できるAmazon Mechanical Turkを公開した。データ整理や画像判定といった細切れの仕事を、世界中の作業者に分配する仕組みである。\n\n仕事を極小の単位に分解して単価をつける発想はクラウドソーシングの一つの極であり、後にAIの学習データ作成を支える労働として再注目される。同時に、最低賃金の枠外で働く「見えない労働者」への批判(働き手と社会レイヤー)もここから始まった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Mechanical Turk","url":"https://en.wikipedia.org/wiki/Amazon_Mechanical_Turk"}]},{"date":"2008-12-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"ランサーズ開始、日本のクラウドソーシング元年","summary":"秋好陽介が仕事のオンライン受発注サービス「ランサーズ」を開始し、日本でもクラウドソーシングが本格的に始まった。2011年設立のクラウドワークスと並び、国内市場を形づくっていく。\n\n地方在住者や子育て中の親など、通勤や常勤を前提としない働き手に仕事が届くようになった意義は大きい。一方で受注者同士の低単価競争という構造的な課題も早くから指摘され、働き手と社会レイヤーの論点として現在まで続いている。","detail":null,"credibility":"disputed","credibility_note":"会社設立とサービス開始の時期は資料により2008年4月から12月の間で記述が揺れる。","sources":[{"title":"ランサーズ株式会社: 会社情報・沿革","url":"https://www.lancers.co.jp/company/"}]},{"date":"2009-01-01","precision":"year","end_date":null,"type":"point","layer":"働き手と社会","title":"「ギグエコノミー」という言葉が生まれる","summary":"金融危機後の米国で、単発の仕事(ギグ)を組み合わせて生計を立てる働き方を指す「ギグエコノミー」という言葉が使われ始めた。ジャーナリストのティナ・ブラウンによる2009年のコラムが初期の用例とされる。\n\n当初は不況で職を失った人々の苦肉の策を指す言葉だったが、スマートフォンとアプリの普及とともに「自由な働き方」という看板へ意味を変えていく。言葉の意味の変遷そのものが、この経済の光と影を映している。","detail":null,"credibility":"disputed","credibility_note":"語の初出には諸説あり、ブラウンのコラムを起源とする説が広く引用されるが確定的ではない。","sources":[{"title":"The Daily Beast: The Gig Economy (Tina Brown, 2009)","url":null}]},{"date":"2009-03-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"Uber創業、ギグワークが都市の風景になる起点","summary":"サンフランシスコでUberCab(現Uber)が創業した。スマートフォンで運転手と乗客を直接つなぐ配車サービスは、その後数年で世界の都市交通を塗り替えていく。\n\n運転手を雇用せず「独立請負人」と位置づける事業モデルは、**プラットフォームは雇用主か仲介者か**という、この年表を貫く法的争点を生み出した。料理宅配や買い物代行など同じ構造のサービスが次々と登場し、アプリで単発の仕事を受けるギグワークが日常の風景になっていく。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Uber","url":"https://en.wikipedia.org/wiki/Uber"}]},{"date":"2014-09-01","precision":"month","end_date":null,"type":"point","layer":"働き手と社会","title":"米調査「フリーランスは5300万人・就労者の34%」","summary":"フリーランサーズ・ユニオンとElance-oDeskの共同調査「Freelancing in America」が、米国のフリーランス人口を約5300万人・就労者の34%と推計した。\n\n副業者を含む広い定義への批判はあるものの、「3人に1人」という数字はギグエコノミー論の定番の根拠となり、各国で類似調査が始まる。実態をとらえる政府統計の乏しさは各国共通で、**定義次第で人数が大きく動く**という統計の問題は現在まで解決していない。","detail":null,"credibility":"unverified","credibility_note":"推計は業界団体の委託調査に基づくもので、フリーランスの定義に副業者を含むため政府統計より大きく出る傾向がある。","sources":[{"title":"Freelancers Union & Elance-oDesk: Freelancing in America (2014)","url":null}]},{"date":"2014-12-12","precision":"day","end_date":null,"type":"point","layer":"プラットフォーム","title":"クラウドワークスが東証マザーズに上場","summary":"クラウドワークスが東証マザーズに上場し、日本のクラウドソーシングが資本市場に認知される節目となった。\n\n「時間と場所にとらわれない働き方」が成長産業として語られる一方、プラットフォーム上の平均報酬の低さや手数料のあり方も報道で取り上げられるようになり、日本のフリーランス政策論議(制度と保護レイヤー)の呼び水となった。政府が「働き方改革」を掲げ、雇用によらない働き方を政策課題に載せるのはこの数年後である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"クラウドワークス: 東京証券取引所マザーズ上場に関するお知らせ (2014)","url":null}]},{"date":"2015-05-01","precision":"month","end_date":null,"type":"point","layer":"プラットフォーム","title":"Upwork誕生、世界最大級のフリーランス市場に","summary":"ElanceとoDeskの統合会社が社名をUpworkに変更し、世界最大級のフリーランス仲介プラットフォームが誕生した。\n\nスキルのオンライン売買が世界規模の単一市場に近づき、国境を越えた発注と価格競争が日常になっていく。発注側の企業では業務を細かく切り出して外部化する動きが進み、「仕事の分解」がデザインや翻訳などホワイトカラー職に本格的に及び始めた時期にあたる。この分解の構造は後の生成AIの影響(働き手と社会レイヤー)にもつながる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Upwork","url":"https://en.wikipedia.org/wiki/Upwork"}]},{"date":"2019-09-18","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"カリフォルニア州でAB5法成立","summary":"働き手を原則として従業員と推定する「ABCテスト」を法制化したAB5法に、カリフォルニア州知事が署名した。前年の州最高裁ダイナメックス判決を成文化したものである。\n\nギグワーカーの誤分類問題に対する最も踏み込んだ立法例であり、**労働法が想定しない働き手**をどう保護するかという問いを世界に突きつけた。適用を避けたいUberやLyftは巨額の住民投票キャンペーンを展開し、翌年のプロップ22(同じ制度と保護レイヤー)へ続く。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"California Legislative Information: AB-5 Worker status: employees and independent contractors (2019)","url":"https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=201920200AB5"}]},{"date":"2020-03-01","precision":"month","end_date":"2021-12-31","type":"period","layer":"働き手と社会","title":"コロナ禍でギグワークが生活インフラになる","summary":"新型コロナのロックダウン下で料理宅配や配送のギグワークが急増し、外出できない都市の生活を支えた。米国では通常は失業給付の対象外である自営業者に特例の給付(PUA)が適用された。\n\n「エッセンシャルワーカー」と呼ばれながら感染リスクと隣り合わせで働く実態は、保護の薄さを一気に可視化した。日本でも2021年に自転車配達員らが労災保険に特別加入できるようになるなど、制度と保護レイヤーが動き出す直接の契機となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Department of Labor: Pandemic Unemployment Assistance (CARES Act, 2020)","url":null},{"title":"厚生労働省: 労災保険の特別加入制度の対象拡大(自転車配達員・ITフリーランス、2021年)","url":null}]},{"date":"2020-11-03","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"住民投票プロップ22可決、AB5に風穴","summary":"カリフォルニア州の住民投票で、配車・宅配の運転手をAB5の適用から外し独立請負人と位置づける「プロポジション22」が半数を大きく超える賛成で可決された。\n\nUberなど関係企業が2億ドル超を投じたとされる史上最高額級の住民投票キャンペーンの結果であり、**ルール自体を書き換えるプラットフォームの力**を示した。その後の違憲訴訟を経て、2024年に州最高裁は本法を有効と判断している。労働者側には最低報酬保証など一部の保護が導入された。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"California Secretary of State: Proposition 22 (2020) 開票結果","url":null}]},{"date":"2021-02-19","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"英最高裁がUber運転手を「ワーカー」と認定","summary":"英国最高裁が、Uberの運転手は完全な自営業者ではなく、最低賃金や有給休暇などの保護を受ける中間的な地位「ワーカー」にあたると全員一致で認定した。\n\n判決後、Uberは英国の運転手をワーカーとして処遇すると発表した。雇用と自営の間に第三の地位を置く英国型の解決は、二分法を前提に住民投票で決着を図った米国(プロップ22)と対照的であり、同じ問題への各国の制度設計が分岐していく様子を示している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"UK Supreme Court: Uber BV and others v Aslam and others [2021] UKSC 5","url":"https://www.supremecourt.uk/cases/uksc-2019-0029.html"}]},{"date":"2021-03-26","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"日本でフリーランスガイドライン策定","summary":"内閣官房・公正取引委員会・中小企業庁・厚生労働省が連名で「フリーランスとして安心して働ける環境を整備するためのガイドライン」を策定した。\n\n独占禁止法・下請法・労働関係法令のフリーランス取引への適用関係を初めて体系的に整理したもので、フリーランスが政策の対象として正面から位置づけられた。内閣官房の調査ではフリーランス人口は462万人と推計されており、2023年の専用法制定(同じ制度と保護レイヤー)への足がかりとなった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"公正取引委員会: フリーランスとして安心して働ける環境を整備するためのガイドライン (2021-03-26)","url":null}]},{"date":"2023-01-01","precision":"year","end_date":null,"type":"point","layer":"働き手と社会","title":"生成AIがフリーランスの仕事を揺らし始める","summary":"ChatGPTや画像生成AIの急速な普及を受け、翻訳・ライティング・イラストなどの分野で受注減を訴えるフリーランスが現れ始めた。プラットフォーム上の定型的な案件の減少を示す調査も報告された。\n\n一方でAI活用スキルを掲げる新しい案件も増えており、影響は職種の内部でも二極化している。仕事を細分化して取引してきたクラウドソーシングの構造(プラットフォームレイヤー)が、細分化された仕事ほどAIに置き換えやすいという形で跳ね返った、との指摘もある。","detail":null,"credibility":"disputed","credibility_note":"受注減と生成AIの因果関係は調査により結論が分かれており、影響の規模は確定していない。","sources":[{"title":"SSRN: Hui, Reshef & Zhou, The Short-Term Effects of Generative Artificial Intelligence on Employment (2023)","url":null}]},{"date":"2023-04-28","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"フリーランス保護新法が国会で成立","summary":"発注内容の書面等による明示、報酬の60日以内の支払い、ハラスメント対策などを発注者に義務付けるフリーランス保護新法(フリーランス・事業者間取引適正化等法)が成立した。\n\n資本金基準で対象が限られる下請法では守れなかった小規模な取引を広くカバーし、**取引の適正化と就業環境の整備**を初めて一体で定めた日本の立法である。ガイドライン(2021年)からわずか2年での法制化は、フリーランス人口の拡大と社会的関心の高まりを反映している。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"e-Gov法令検索: 特定受託事業者に係る取引の適正化等に関する法律(令和5年法律第25号)","url":null}]},{"date":"2023-10-01","precision":"day","end_date":null,"type":"point","layer":"働き手と社会","title":"インボイス制度開始、免税事業者に転換圧力","summary":"日本で消費税のインボイス(適格請求書)制度が始まった。免税事業者のままでは取引先が仕入税額控除を受けられなくなるため、多くのフリーランスが課税事業者への転換か、値引きや取引打ち切りの圧力かの選択を迫られた。\n\n反対のオンライン署名は50万筆を超えたとされ、小規模な働き手への負担集中が争点となった。保護法制の整備(制度と保護レイヤー)と税負担の増加が同時に進む、日本のフリーランス政策の両義性を示す出来事である。","detail":null,"credibility":"disputed","credibility_note":"反対署名の筆数は主催団体の集計によるもので、第三者による検証はない。制度開始日自体は確定した事実である。","sources":[{"title":"国税庁: インボイス制度の概要","url":"https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/invoice.htm"}]},{"date":"2024-04-24","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"EUプラットフォーム労働指令を欧州議会が可決","summary":"欧州議会がプラットフォーム労働指令を可決した。一定の要件を満たす場合に雇用関係を法的に推定し、反証責任をプラットフォーム側に課すほか、**アルゴリズムによる管理**の透明化と人による監督を義務付ける。\n\n個別の訴訟で争われてきた誤分類の問題を、雇用推定という一般ルールで扱う初のEU横断枠組みである。同年中に正式採択・発効し、加盟国は2026年末までに国内法化する。配車や宅配の働き手の地位を巡る15年の攻防の、現時点での到達点といえる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Parliament: Parliament adopts Platform Work Directive (2024-04-24)","url":null},{"title":"EUR-Lex: Directive (EU) 2024/2831 on improving working conditions in platform work","url":"https://eur-lex.europa.eu/eli/dir/2024/2831/oj"}]},{"date":"2024-11-01","precision":"day","end_date":null,"type":"point","layer":"制度と保護","title":"フリーランス法が施行、執行段階へ","summary":"フリーランス・事業者間取引適正化等法が施行され、公正取引委員会と厚生労働省による執行体制が始動した。施行後は報酬の支払い遅延や買いたたきなどへの指導・勧告が行われている。\n\nプラットフォームの登場(1999年)から言葉の誕生(2009年)、各国の司法判断と立法を経て、日本でも専用法の執行という段階に到達した。**雇用によらない働き方**を制度が追いかける往復運動は、生成AI(働き手と社会レイヤー)という新しい変数を迎えてなお続いている。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"公正取引委員会: フリーランス法特設サイト","url":"https://www.jftc.go.jp/freelancelaw/"}]}]},{"slug":"business-gafa","title":"GAFA帝国の形成","description":"1976年のApple創業から2020年代の規制強化まで、Google・Apple・Facebook（Meta）・Amazonの歩みを、製品とプラットフォーム・買収と資本・規制と社会の3層で重ねる。","category":"business","language":"ja","start_year":1976,"end_year":2024,"layers":[{"name":"製品とプラットフォーム","color":"blue"},{"name":"買収と資本","color":"orange"},{"name":"規制と社会","color":"teal"}],"events":[{"date":"1976-04-01","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Apple Computer 創業","summary":"スティーブ・ジョブズ、スティーブ・ウォズニアック、ロナルド・ウェインがカリフォルニア州でApple Computerを創業した。ガレージ企業として始まり、翌1977年のApple IIで個人向けコンピュータ市場を開いた。\n\nGAFA四社の中で最も古く、ほかの三社が生まれるインターネット時代より20年近く前の出来事である。1980年の株式公開で得た資本と、のちの経営危機と復活が、2007年のiPhoneに至る長い前史をつくった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Apple Inc.","url":"https://en.wikipedia.org/wiki/History_of_Apple_Inc."}]},{"date":"1994-07-05","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Amazon 創業（当初社名Cadabra）","summary":"ジェフ・ベゾスがワシントン州でCadabraを設立し、翌1995年7月にオンライン書店Amazon.comを開設した。ウェブの商用利用が始まった直後の創業で、書籍を入り口に「あらゆるものを売る店」を目指した。\n\n1997年の株式公開で調達した資本を長期にわたり物流と技術に再投資し、利益より成長を優先する姿勢が投資家に受け入れられた。この方針が2006年のクラウド事業AWSの立ち上げを可能にする。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Amazon","url":"https://en.wikipedia.org/wiki/History_of_Amazon"}]},{"date":"1995-01-01","precision":"year","end_date":"2000-12-31","type":"period","layer":"買収と資本","title":"ドットコム・ブーム","summary":"インターネット関連企業への投資が過熱し、NASDAQは2000年3月に史上最高値を付けたのち急落した。AmazonとGoogleはこの熱狂の中で創業・成長し、Amazonはバブル崩壊後の株価急落と資金繰りの不安を乗り越えた。\n\nGoogleは崩壊直後の2000年に検索連動広告AdWordsを開始し、収益モデルを確立する。バブル期に敷設された通信インフラの過剰投資が、その後の安価な帯域と2000年代のプラットフォーム成長の土台になったとされる。","detail":null,"credibility":"unverified","credibility_note":"ブームの開始・終了年は定義により異なり、ここでは概ね1995年から2000年の崩壊までを目安として示す。","sources":[{"title":"Wikipedia: Dot-com bubble","url":"https://en.wikipedia.org/wiki/Dot-com_bubble"}]},{"date":"1998-09-04","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"Google 設立","summary":"スタンフォード大学の研究プロジェクトを母体に、ラリー・ペイジとセルゲイ・ブリンがGoogleを法人化した。被リンクを評価するPageRankを核にした検索エンジンで、ドットコム・ブームの渦中の創業である。\n\n1999年にベンチャーキャピタルから大型調達を行い、2004年に株式公開する。技術面では2000年のAdWordsによって「検索と広告」の結合が完成し、これがのちのYouTubeやAndroidの買収資金の源泉となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Google","url":"https://en.wikipedia.org/wiki/History_of_Google"}]},{"date":"2000-10-23","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Google AdWords 開始","summary":"Googleがセルフサービス型の検索連動広告AdWordsを開始し、**検索行動を広告収益に変える仕組み**が確立した。ドットコム・バブル崩壊の年に、無料検索の裏側で収益を生むモデルが登場した意味は大きい。\n\n以後、Googleの売上の大半を広告が占め、この資本力が2005年のAndroid、2006年のYouTube買収を支える。規制レイヤーでは、この検索と広告の結合が2020年の米司法省提訴と2024年の独占認定の中心論点になる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Google Ads","url":"https://en.wikipedia.org/wiki/Google_Ads"}]},{"date":"2004-02-04","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Thefacebook 開設","summary":"マーク・ザッカーバーグらがハーバード大学の学生向けにThefacebook.comを公開した。実名を前提としたソーシャルネットワークで、2006年に一般公開、2007年に外部開発者向けプラットフォームを開始し、大学から一般へと段階的に開放された。\n\n同じ2004年にはGoogleが株式公開しており、検索とソーシャルという二つの広告基盤が並行して立ち上がった年である。実名データの集積は成長の源泉であると同時に、2018年のケンブリッジ・アナリティカ問題の火種にもなる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: History of Facebook","url":"https://en.wikipedia.org/wiki/History_of_Facebook"}]},{"date":"2005-08-01","precision":"month","end_date":null,"type":"point","layer":"買収と資本","title":"GoogleがAndroidを買収","summary":"Googleがモバイル向けOSを開発するスタートアップAndroidを買収した。買収額は公式には明らかにされておらず、約5,000万ドルと報じられている。当時は小さな買収と受け止められた。\n\nしかし2007年のiPhone登場後、GoogleはAndroidをオープンソースで端末メーカーに提供し、モバイル検索と広告の入り口を確保する。製品レイヤーではiPhoneとApp Storeが先行し、Androidは2008年秋に最初の端末が発売される。","detail":null,"credibility":"unverified","credibility_note":"買収の事実と時期は確かだが、買収額は非公表で報道による推計値。","sources":[{"title":"Wikipedia: Android (operating system)","url":"https://en.wikipedia.org/wiki/Android_(operating_system)"}]},{"date":"2006-08-25","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"Amazon EC2 ベータ公開","summary":"AmazonがEC2の限定ベータを開始。同年3月のS3と合わせ、計算資源を時間貸しするクラウド事業AWSが本格化した。小売の余剰インフラから生まれたと語られることが多いが、実際には社内の開発効率化の取り組みが出発点とされる。\n\nスタートアップが初期投資なしにサービスを立ち上げられる環境は、のちのInstagramなど買収対象となる企業を育てる土壌にもなった。AWSは2010年代にAmazonの営業利益の柱となり、規制当局が同社を評価する際の重要な論点となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: Amazon Elastic Compute Cloud","url":"https://en.wikipedia.org/wiki/Amazon_Elastic_Compute_Cloud"}]},{"date":"2006-10-09","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"GoogleがYouTubeを16.5億ドルで買収","summary":"Googleが動画共有サービスYouTubeを約16.5億ドルの株式交換で買収すると発表した。創業から2年に満たない企業への大型買収で、AdWordsで築いた資本力を用いて成長領域を取り込む戦略が明確になった。\n\n製品面では同年にAmazonがEC2を公開しており、動画のような大容量サービスを支えるインフラ競争も始まっていた。動画広告市場の支配は、のちの各国の競争法調査でも繰り返し検討対象となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: YouTube","url":"https://en.wikipedia.org/wiki/YouTube"}]},{"date":"2007-01-09","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"iPhone 発表","summary":"スティーブ・ジョブズがMacworldでiPhoneを発表した。電話・iPod・インターネット端末を一体化した製品は同年6月に米国で発売され、タッチ操作を前提としたモバイルOSの標準をつくり、スマートフォンの形を定義した。\n\nGoogleは2005年に買収していたAndroidの設計を見直し、2008年に対抗端末を投入する。翌2008年のApp Storeによって、端末とアプリ流通を一社が握る「プラットフォーム」の構図が完成し、これが2020年代の日欧の規制の対象となる。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Apple Newsroom: Apple Reinvents the Phone with iPhone","url":"https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/"}]},{"date":"2008-07-10","precision":"day","end_date":null,"type":"point","layer":"製品とプラットフォーム","title":"App Store 開始","summary":"AppleがiPhone向けアプリ配信のApp Storeを開始。約500本のアプリでスタートし、開発者に売上の70%を配分するモデルを示した。**アプリ流通を単一の窓口に集約し、審査と手数料の仕組みを標準化した**点が核心である。\n\nGoogleも同年にAndroid Marketを開始し、二大モバイルプラットフォームの並立が固まる。手数料率と審査の裁量はのちに開発者との対立を生み、EUのデジタル市場法（2022年発効）や日本のスマホソフトウェア競争促進法（2024年成立）で直接の規制対象となった。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: App Store (Apple)","url":"https://en.wikipedia.org/wiki/App_Store_(Apple)"}]},{"date":"2012-04-09","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"FacebookがInstagramを買収","summary":"Facebookが写真共有アプリInstagramを現金と株式で約10億ドルで買収すると発表した。従業員13人の企業への大型買収であり、スマートフォンとApp Storeの普及で急成長した若い企業を、株式公開直前のFacebookが取り込んだ形である。発表額は約10億ドルだが、Facebook株の下落により完了時の価値は7億ドル台と報じられる。\n\nこの買収は2020年の米連邦取引委員会（FTC）による提訴で**「競争相手の芽を摘む買収」**として問題視され、事後的な規制の焦点になった。","detail":null,"credibility":"disputed","credibility_note":"発表時の約10億ドルという金額と、株価変動後の完了時価値は異なり、報道により数値が分かれる。","sources":[{"title":"Wikipedia: Instagram","url":"https://en.wikipedia.org/wiki/Instagram"}]},{"date":"2014-02-19","precision":"day","end_date":null,"type":"point","layer":"買収と資本","title":"FacebookがWhatsAppを買収","summary":"Facebookがメッセージアプリ WhatsAppを約190億ドルで買収すると発表。完了時には株価上昇で200億ドルを超えた。モバイルのメッセージ領域を押さえる目的で、Instagramに続く大型買収となった。\n\nEUの企業結合審査ではデータ統合を行わないとの説明が前提とされ、のちに実態との相違で制裁金が科される。2018年のGDPR施行やケンブリッジ・アナリティカ問題を経て、こうしたデータを軸にした買収の審査は各国で厳格化していく。","detail":null,"credibility":"disputed","credibility_note":"発表額は約190億ドルだが、株式部分の価値変動により最終的な取引額は約218億ドルとされ、資料により金額が異なる。","sources":[{"title":"Wikipedia: WhatsApp","url":"https://en.wikipedia.org/wiki/WhatsApp"}]},{"date":"2018-03-17","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"ケンブリッジ・アナリティカ問題が発覚","summary":"英ガーディアン等の報道で、Facebook利用者のデータが選挙コンサル会社に不正利用されていたことが明らかになった。外部アプリを通じて最大8,700万人分のデータが取得されたとされ、ザッカーバーグは米議会で証言した。\n\n2004年の実名SNSという製品設計と、2012年以降の買収によるデータ集積が、**社会的な信頼の問題として噴出した**出来事である。約2か月後にEUでGDPRが施行され、2019年のFTC制裁金へとつながる規制強化の起点となった。","detail":null,"credibility":"disputed","credibility_note":"影響を受けた利用者数は当初約5,000万人と報じられ、後にFacebookが最大約8,700万人と発表しており、数値に幅がある。","sources":[{"title":"Wikipedia: Facebook–Cambridge Analytica data scandal","url":"https://en.wikipedia.org/wiki/Facebook%E2%80%93Cambridge_Analytica_data_scandal"}]},{"date":"2018-05-25","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"EU一般データ保護規則（GDPR）施行","summary":"EUで個人データ保護を包括的に定めるGDPRの適用が始まり、違反時は世界売上の最大4%の制裁金が可能となった。2016年に採択され、2年の準備期間を経ての施行である。\n\nケンブリッジ・アナリティカ問題の直後というタイミングで、広告を収益源とするGoogleとFacebookのデータ利用に直接影響した。同意取得の設計や越境データ移転を巡り、以後GAFA各社への制裁金決定が相次ぐ。2022年のデジタル市場法と並び、EUがプラットフォーム規制の先行地域となる基盤である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"Wikipedia: General Data Protection Regulation","url":"https://en.wikipedia.org/wiki/General_Data_Protection_Regulation"}]},{"date":"2019-07-24","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"FTCがFacebookに50億ドルの制裁金","summary":"米連邦取引委員会がプライバシー侵害を理由に、Facebookへ50億ドルの制裁金と監督強化を科すと発表した。ケンブリッジ・アナリティカ問題を受けた処分で、消費者保護分野では過去最大級の金額となり、取締役会レベルのプライバシー監督体制も義務付けられた。\n\n同年はGoogleに対する州司法長官の調査も始まり、翌2020年の司法省提訴とFTCによるFacebook提訴へ続く。**買収と資本で拡大した企業が、規制の側で初めて大きな代償を払った**出来事である。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"FTC Press Release (2019-07-24)","url":"https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-imposes-5-billion-penalty-sweeping-new-privacy-restrictions-facebook"}]},{"date":"2020-10-20","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"米司法省がGoogleを反トラスト法違反で提訴","summary":"米司法省と11州がGoogleを検索と検索広告市場の独占維持で提訴し、1998年のMicrosoft訴訟以来の大型事件となった。Appleなど端末メーカーへの巨額の支払いでデフォルト検索を確保した行為が、違法な独占維持にあたるかが争点である。\n\n製品レイヤーではiPhoneとAndroidの二大プラットフォームが検索の入り口を握る構図が背景にある。同年12月にはFTCがFacebookのInstagram・WhatsApp買収を問題視して提訴し、GAFAへの競争法執行が本格化した。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"U.S. Department of Justice: Justice Department Sues Monopolist Google","url":"https://www.justice.gov/opa/pr/justice-department-sues-monopolist-google-violating-antitrust-laws"}]},{"date":"2022-11-01","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"EUデジタル市場法（DMA）発効","summary":"EUで大規模プラットフォームを「ゲートキーパー」に指定し事前規制するデジタル市場法が発効し、2023年から順次適用された。自社サービスの優遇禁止やアプリストアの開放などを事前に義務付ける枠組みで、事後的な競争法執行の限界を補う狙いがある。\n\n2023年9月にはAlphabet・Amazon・Apple・Metaなど6社がゲートキーパーに指定された。2008年のApp Storeに始まる閉じた流通モデルが直接の規制対象となり、日本も2024年に類似の法律を成立させた。","detail":null,"credibility":"verified","credibility_note":null,"sources":[{"title":"European Commission: The Digital Markets Act","url":"https://digital-markets-act.ec.europa.eu/"}]},{"date":"2024-06-12","precision":"day","end_date":null,"type":"point","layer":"規制と社会","title":"日本でスマホソフトウェア競争促進法が成立","summary":"スマートフォンのOS・アプリストア等を対象に、公正取引委員会が事前規制を行うスマホソフトウェア競争促進法が国会で成立した。EUのデジタル市場法を参照し、AppleとGoogleを主な対象として代替アプリストアの許容や自社優遇の禁止を定めている。\n\n2008年のApp Store以来続いてきた手数料や審査の裁量が、日本でも法律で制約されることになる。米国では同年8月にGoogleの検索独占が認定されており、日米欧で規制が同時期に収束した年である。","detail":null,"credibility":"unverified","credibility_note":"成立日は国会記録に基づくが、全面施行時期（2025年12月と発表）や指定事業者の範囲は施行後の運用で確定するため未確認とする。","sources":[{"title":"公正取引委員会 スマートフォンにおいて利用される特定ソフトウェアに係る競争の促進に関する法律","url":null}]},{"date":"2024-08-05","precision":"day","end_date":null,"type":"point","
