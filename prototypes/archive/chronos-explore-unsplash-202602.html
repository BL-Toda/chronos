<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Chronos — 年表を探す</title>
<link href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A0C;--bg2:#111114;--bg3:#16161A;--bg-card:#12121A;
  --accent:#C8A87E;--accent-dim:rgba(200,168,126,0.13);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#8A8680;--text3:#5A5754;
  --border:rgba(200,168,126,0.1);--border2:rgba(200,168,126,0.22);
  --c-blue:#5B9BD5;--c-blue-d:rgba(91,155,213,0.12);
  --c-green:#7BC67E;--c-green-d:rgba(123,198,126,0.12);
  --c-pink:#D4849A;--c-pink-d:rgba(212,132,154,0.12);
  --c-teal:#5BBCB4;--c-teal-d:rgba(91,188,180,0.12);
  --c-gold:#C8B87E;--c-gold-d:rgba(200,184,126,0.12);
  --c-purple:#9E7EC8;--c-purple-d:rgba(158,126,200,0.12);
  --c-orange:#D4A05A;--c-orange-d:rgba(212,160,90,0.12);
  --f-d:'Erode','Shippori Mincho',serif;
  --f-b:'DM Sans',sans-serif;
  --f-m:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color-scheme:dark}
body{font-family:var(--f-b);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@keyframes spin{to{transform:rotate(360deg)}}

.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.88);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between}
.hdr-brand{font-family:var(--f-d);font-size:1.3rem;font-weight:500;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase}
.hdr-nav{display:flex;align-items:center;gap:20px}
.hdr-nav a{font-size:13px;color:var(--text3);text-decoration:none;transition:color 0.2s}
.hdr-nav a:hover{color:var(--text2)}
.hdr-nav a.active{color:var(--accent)}
.hdr-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;border:1.5px solid var(--border);cursor:pointer}
.hdr-avatar svg{width:100%;height:100%;display:block}

.layout{display:flex;min-height:calc(100vh - 56px)}

.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);padding:24px 20px;
  position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sb-section{margin-bottom:28px}
.sb-label{font-family:var(--f-m);font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.sb-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;transition:all 0.2s;margin-bottom:2px}
.sb-item:hover{background:rgba(200,168,126,0.04);color:var(--text)}
.sb-item.active{background:var(--accent-dim);color:var(--accent)}
.sb-item-count{font-family:var(--f-m);font-size:10px;color:var(--text3)}
.sb-item.active .sb-item-count{color:var(--accent);opacity:0.6}
.sb-dot{width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0}
.sb-item-left{display:flex;align-items:center}
.sb-reset{font-size:11px;color:var(--text3);cursor:pointer;padding:8px 10px;text-align:center;transition:color 0.2s}
.sb-reset:hover{color:var(--accent)}

.content{flex:1;padding:24px 32px 80px;min-width:0}

.search-bar{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--bg2);
  border:1px solid var(--border);border-radius:10px;margin-bottom:20px;transition:all 0.3s}
.search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,168,126,0.06)}
.search-icon{flex-shrink:0;width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-input{flex:1;background:none;border:none;outline:none;font-family:var(--f-b);font-size:14px;color:var(--text);caret-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.search-kbd{font-family:var(--f-m);font-size:10px;color:var(--text3);padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--bg)}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar-left{display:flex;align-items:center;gap:12px}
.result-count{font-size:13px;color:var(--text2)}
.result-count strong{color:var(--text);font-weight:500}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.active-filter-tag{font-family:var(--f-m);font-size:10px;padding:3px 10px 3px 8px;border-radius:12px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;gap:5px;cursor:pointer;transition:all 0.2s}
.active-filter-tag:hover{background:rgba(200,168,126,0.2)}
.active-filter-tag .aft-x{font-size:12px;opacity:0.6}
.toolbar-right{display:flex;align-items:center;gap:8px}
.sort-select{font-family:var(--f-b);font-size:12px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 28px 6px 10px;cursor:pointer;outline:none;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%235A5754' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center}
.sort-select option{background:var(--bg2);color:var(--text)}

.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.tl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:all 0.3s ease;display:flex;flex-direction:column}
.tl-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}

.tl-card-cover{position:relative;height:170px;overflow:hidden;flex-shrink:0;background:var(--bg3)}
.tl-card-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s ease,opacity 0.4s ease;opacity:0}
.tl-card-cover img.loaded{opacity:1}
.tl-card:hover .tl-card-cover img.loaded{transform:scale(1.05)}
.tl-card-cover-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,0.1) 0%,rgba(10,10,12,0.7) 100%);pointer-events:none}
.tl-card-cover-layers{position:absolute;top:10px;left:12px;display:flex;gap:4px;z-index:2}
.tl-card-cover-layers span{width:8px;height:8px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.5)}
.tl-card-cover-actions{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2}
.tl-card-action{width:28px;height:28px;border-radius:50%;background:rgba(10,10,12,0.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s}
.tl-card-action:hover{background:rgba(10,10,12,0.75);border-color:rgba(255,255,255,0.2)}
.tl-card-action svg{width:13px;height:13px;stroke:rgba(255,255,255,0.8);fill:none;stroke-width:2}
.tl-card-action.liked svg{stroke:#D4849A;fill:#D4849A;stroke-width:0}
.tl-card-action.bookmarked svg{stroke:var(--accent);fill:var(--accent);stroke-width:0}
.tl-card-cover-info{position:absolute;bottom:10px;left:12px;z-index:2;font-family:var(--f-m);font-size:10px;color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:4px}
.tl-card-cover-info svg{width:10px;height:10px;stroke:rgba(255,255,255,0.5);fill:none;stroke-width:2}

.tl-card-body{padding:14px 14px 12px;flex:1;display:flex;flex-direction:column}
.tl-card-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.tl-card-title{font-family:var(--f-d);font-size:16px;font-weight:400;line-height:1.3;margin-bottom:4px;color:var(--text-h)}
.tl-card-desc{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.tl-card-meta{display:flex;align-items:center;justify-content:space-between}
.tl-card-author{display:flex;align-items:center;gap:6px}
.tl-avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-m);font-size:8px;font-weight:500}
.tl-card-author>span{font-size:10px;color:var(--text3)}
.tl-card-stats{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--text3)}
.tl-card-stats .stat{display:flex;align-items:center;gap:3px}
.tl-card-stats svg{width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2}
.tl-card-stats .stat-liked svg{stroke:#D4849A;fill:rgba(212,132,154,0.3)}
.tl-card-stats .stat-bm svg{stroke:var(--accent);fill:rgba(200,168,126,0.3)}

.empty-state{display:none;text-align:center;padding:60px 20px}

@media(max-width:860px){.sidebar{display:none}}
@media(max-width:540px){
  .hdr-nav a:not(.active){display:none}
  .search-kbd{display:none}
  .content{padding:16px 14px 80px}
  .tl-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">Chronos</div>
  <nav class="hdr-nav">
    <a href="#">マイページ</a>
    <a href="#" class="active">年表を探す</a>
    <a href="#">年表をつくる</a>
    <div class="hdr-avatar">
      <svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#0F1A2E"/><ellipse cx="100" cy="100" rx="72" ry="32" fill="none" stroke="#5B9BD5" stroke-width="2" opacity="0.5" transform="rotate(-25 100 100)"/><ellipse cx="100" cy="100" rx="72" ry="32" fill="none" stroke="#D4849A" stroke-width="2" opacity="0.5" transform="rotate(30 100 100)"/><circle cx="100" cy="100" r="9" fill="#C8A87E" opacity="0.85"/></svg>
    </div>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sb-section">
      <div class="sb-label">カテゴリ</div>
      <div class="sb-item active"><span class="sb-item-left">すべて</span><span class="sb-item-count">10</span></div>
      <div class="sb-item"><span class="sb-item-left"><span class="sb-dot" style="background:var(--c-blue)"></span>テクノロジー</span><span class="sb-item-count">3</span></div>
      <div class="sb-item"><span class="sb-item-left"><span class="sb-dot" style="background:var(--c-pink)"></span>歴史・政治</span><span class="sb-item-count">2</span></div>
      <div class="sb-item"><span class="sb-item-left"><span class="sb-dot" style="background:var(--c-gold)"></span>カルチャー</span><span class="sb-item-count">2</span></div>
      <div class="sb-item"><span class="sb-item-left"><span class="sb-dot" style="background:var(--c-green)"></span>科学・自然</span><span class="sb-item-count">1</span></div>
      <div class="sb-item"><span class="sb-item-left"><span class="sb-dot" style="background:var(--c-orange)"></span>ビジネス</span><span class="sb-item-count">1</span></div>
      <div class="sb-item"><span class="sb-item-left"><span class="sb-dot" style="background:var(--c-purple)"></span>個人・ライフ</span><span class="sb-item-count">1</span></div>
    </div>
    <div class="sb-reset">フィルターをリセット</div>
  </aside>

  <main class="content">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="キーワード、テーマ、レイヤーの組み合わせで検索…">
      <span class="search-kbd">⌘K</span>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="result-count"><strong>10</strong> 件の年表</div>
      </div>
      <div class="toolbar-right">
        <select class="sort-select">
          <option>人気順</option><option>新着順</option><option>イベント数順</option>
        </select>
      </div>
    </div>

    <div class="tl-grid" id="grid"></div>
  </main>
</div>

<script>
const H='<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>';
const B='<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>';
const CK='<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>';

const CARDS=[
  {
    title:'AI革命の全体像 2020–2026',
    desc:'GPT、画像生成、AGI議論まで。技術と社会の接点を俯瞰する。',
    cat:'テクノロジー',catColor:'var(--c-blue)',catColorD:'var(--c-blue-d)',
    img:'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600&h=300&fit=crop',
    layers:['var(--c-blue)','var(--c-gold)'],
    author:'toda_m',likes:2847,bookmarks:612,events:72,liked:true,bookmarked:false
  },
  {
    title:'モバイル革命の全体像',
    desc:'iPhone × Android × 業界動向を並べて見る。',
    cat:'テクノロジー',catColor:'var(--c-blue)',catColorD:'var(--c-blue-d)',
    img:'https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=600&h=300&fit=crop',
    layers:['var(--c-blue)','var(--c-pink)','var(--c-green)'],
    author:'kenta_h',likes:1932,bookmarks:445,events:58,liked:false,bookmarked:true
  },
  {
    title:'宇宙開発の舞台裏',
    desc:'アポロ計画からArtemisまで。宇宙を目指した人々の記録。',
    cat:'歴史・政治',catColor:'var(--c-pink)',catColorD:'var(--c-pink-d)',
    img:'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=600&h=300&fit=crop',
    layers:['var(--c-pink)','var(--c-blue)'],
    author:'abe_hist',likes:2156,bookmarks:534,events:65,liked:false,bookmarked:false
  },
  {
    title:'印象派からストリートアートへ',
    desc:'モネからバンクシーまで。美術の潮流を一望。',
    cat:'カルチャー',catColor:'var(--c-gold)',catColorD:'var(--c-gold-d)',
    img:'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=600&h=300&fit=crop',
    layers:['var(--c-gold)','var(--c-purple)'],
    author:'yui_art',likes:1678,bookmarks:389,events:48,liked:false,bookmarked:false
  },
  {
    title:'気候変動の100年',
    desc:'産業革命から現在まで。気候と人類の関係。',
    cat:'科学・自然',catColor:'var(--c-green)',catColorD:'var(--c-green-d)',
    img:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&h=300&fit=crop',
    layers:['var(--c-green)','var(--c-blue)','var(--c-orange)'],
    author:'rika_env',likes:1423,bookmarks:312,events:55,liked:false,bookmarked:false
  },
  {
    title:'幕末から明治維新まで',
    desc:'黒船来航から文明開化まで、激動の日本近代史。',
    cat:'歴史・政治',catColor:'var(--c-pink)',catColorD:'var(--c-pink-d)',
    img:'https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=600&h=300&fit=crop',
    layers:['var(--c-pink)','var(--c-gold)'],
    author:'abe_hist',likes:1856,bookmarks:467,events:42,liked:true,bookmarked:false
  },
  {
    title:'日本発ユニコーンの軌跡',
    desc:'メルカリ、SmartHR、LayerX…日本のスタートアップ史。',
    cat:'ビジネス',catColor:'var(--c-orange)',catColorD:'var(--c-orange-d)',
    img:'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600&h=300&fit=crop',
    layers:['var(--c-orange)','var(--c-blue)'],
    author:'nao_biz',likes:1345,bookmarks:278,events:38,liked:false,bookmarked:true
  },
  {
    title:'映画100年史',
    desc:'リュミエール兄弟からストリーミングまで。',
    cat:'カルチャー',catColor:'var(--c-gold)',catColorD:'var(--c-gold-d)',
    img:'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600&h=300&fit=crop',
    layers:['var(--c-gold)','var(--c-pink)'],
    author:'miki_m',likes:1567,bookmarks:356,events:62,liked:false,bookmarked:false
  },
  {
    title:'猫との暮らし',
    desc:'保護猫との出会いから日々の暮らし。',
    cat:'個人・ライフ',catColor:'var(--c-purple)',catColorD:'var(--c-purple-d)',
    img:'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&h=300&fit=crop',
    layers:['var(--c-purple)','var(--c-teal)'],
    author:'hana_k',likes:2234,bookmarks:701,events:24,liked:true,bookmarked:true
  },
  {
    title:'半導体戦争の50年',
    desc:'地政学と技術革新が交差する半導体の歴史。',
    cat:'テクノロジー',catColor:'var(--c-blue)',catColorD:'var(--c-blue-d)',
    img:'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&h=300&fit=crop',
    layers:['var(--c-blue)','var(--c-orange)','var(--c-pink)'],
    author:'jun_s',likes:1789,bookmarks:423,events:51,liked:false,bookmarked:false
  }
];

function toggleAction(el,type){
  el.classList.toggle(type);
  // Just visual toggle for prototype
}

const grid=document.getElementById('grid');
CARDS.forEach((c,i)=>{
  const dots=c.layers.map(cl=>`<span style="background:${cl}"></span>`).join('');
  grid.insertAdjacentHTML('beforeend',`
  <div class="tl-card">
    <div class="tl-card-cover">
      <img src="${c.img}" alt="${c.title}" loading="lazy" onload="this.classList.add('loaded')">
      <div class="tl-card-cover-overlay"></div>
      <div class="tl-card-cover-layers">${dots}</div>
      <div class="tl-card-cover-actions">
        <div class="tl-card-action${c.liked?' liked':''}" onclick="event.stopPropagation();toggleAction(this,'liked')" title="いいね">
          <svg viewBox="0 0 24 24">${H}</svg>
        </div>
        <div class="tl-card-action${c.bookmarked?' bookmarked':''}" onclick="event.stopPropagation();toggleAction(this,'bookmarked')" title="ブックマーク">
          <svg viewBox="0 0 24 24">${B}</svg>
        </div>
      </div>
      <div class="tl-card-cover-info">
        <svg viewBox="0 0 24 24">${CK}</svg>${c.events} events · ${c.layers.length} layers
      </div>
    </div>
    <div class="tl-card-body">
      <div class="tl-card-cat" style="color:${c.catColor}">${c.cat}</div>
      <div class="tl-card-title">${c.title}</div>
      <div class="tl-card-desc">${c.desc}</div>
      <div class="tl-card-meta">
        <div class="tl-card-author">
          <div class="tl-avatar" style="background:${c.catColorD};color:${c.catColor}">${c.author[0].toUpperCase()}</div>
          <span>@${c.author}</span>
        </div>
        <div class="tl-card-stats">
          <span class="stat${c.liked?' stat-liked':''}"><svg viewBox="0 0 24 24">${H}</svg>${c.likes.toLocaleString()}</span>
          <span class="stat${c.bookmarked?' stat-bm':''}"><svg viewBox="0 0 24 24">${B}</svg>${c.bookmarks.toLocaleString()}</span>
        </div>
      </div>
    </div>
  </div>`);
});
</script>
</body>
</html>
