<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Chronos — 年表を探す</title>
<link href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0A0A0C;--bg2:#111114;--bg3:#16161A;--bg-card:#12121A;
  --accent:#C8A87E;--accent-dim:rgba(200,168,126,0.13);--accent-glow:rgba(200,168,126,0.04);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#8A8680;--text3:#5A5754;
  --border:rgba(200,168,126,0.1);--border2:rgba(200,168,126,0.22);
  --c-blue:#5B9BD5;--c-blue-d:rgba(91,155,213,0.12);
  --c-green:#7BC67E;--c-green-d:rgba(123,198,126,0.12);
  --c-pink:#D4849A;--c-pink-d:rgba(212,132,154,0.12);
  --c-teal:#5BBCB4;--c-teal-d:rgba(91,188,180,0.12);
  --c-gold:#C8B87E;--c-gold-d:rgba(200,184,126,0.12);
  --c-purple:#9E7EC8;--c-purple-d:rgba(158,126,200,0.12);
  --c-orange:#D4A05A;--c-orange-d:rgba(212,160,90,0.12);
  --f-d:'Erode','Shippori Mincho',serif;
  --f-b:'DM Sans',sans-serif;
  --f-m:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color-scheme:dark}
body{font-family:var(--f-b);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.88);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between}
.hdr-brand{font-family:var(--f-d);font-size:1.3rem;font-weight:500;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;cursor:pointer}
.hdr-nav{display:flex;align-items:center;gap:20px}
.hdr-nav a{font-size:13px;color:var(--text3);text-decoration:none;transition:color 0.2s}
.hdr-nav a:hover{color:var(--text2)}
.hdr-nav a.active{color:var(--accent)}
.hdr-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;border:1.5px solid var(--border);cursor:pointer;transition:border-color 0.2s}
.hdr-avatar:hover{border-color:var(--accent)}
.hdr-avatar svg{width:100%;height:100%;display:block}

/* ===== LAYOUT — LIQUID ===== */
.layout{display:flex;min-height:calc(100vh - 56px)}

/* ===== SIDEBAR ===== */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);padding:24px 20px;
  position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sb-section{margin-bottom:28px}
.sb-label{font-family:var(--f-m);font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.sb-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;transition:all 0.2s;margin-bottom:2px}
.sb-item:hover{background:rgba(200,168,126,0.04);color:var(--text)}
.sb-item.active{background:var(--accent-dim);color:var(--accent)}
.sb-item-count{font-family:var(--f-m);font-size:10px;color:var(--text3)}
.sb-item.active .sb-item-count{color:var(--accent);opacity:0.6}
.sb-dot{width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0}
.sb-item-left{display:flex;align-items:center}
.sb-range{display:flex;align-items:center;gap:8px;padding:0 4px}
.sb-range-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:var(--f-m);font-size:11px;color:var(--text);outline:none;width:100%;text-align:center}
.sb-range-input:focus{border-color:var(--accent)}
.sb-range-sep{color:var(--text3);font-size:12px}
.sb-check{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;transition:all 0.2s;margin-bottom:2px}
.sb-check:hover{background:rgba(200,168,126,0.04)}
.sb-check.active{color:var(--accent)}
.sb-checkbox{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.sb-check.active .sb-checkbox{background:var(--accent);border-color:var(--accent)}
.sb-check.active .sb-checkbox::after{content:'✓';font-size:10px;color:var(--bg);font-weight:600}
.sb-reset{font-size:11px;color:var(--text3);cursor:pointer;padding:8px 10px;text-align:center;transition:color 0.2s}
.sb-reset:hover{color:var(--accent)}

/* ===== CONTENT ===== */
.content{flex:1;padding:24px 32px 80px;min-width:0}
.search-bar{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;transition:all 0.3s ease;margin-bottom:20px}
.search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,168,126,0.06)}
.search-icon{flex-shrink:0;width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-input{flex:1;background:none;border:none;outline:none;font-family:var(--f-b);font-size:14px;color:var(--text);caret-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.search-kbd{font-family:var(--f-m);font-size:10px;color:var(--text3);padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--bg)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar-left{display:flex;align-items:center;gap:12px}
.result-count{font-size:13px;color:var(--text2)}
.result-count strong{color:var(--text);font-weight:500}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.active-filter-tag{font-family:var(--f-m);font-size:10px;padding:3px 10px 3px 8px;border-radius:12px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;gap:5px;cursor:pointer;transition:all 0.2s}
.active-filter-tag:hover{background:rgba(200,168,126,0.2)}
.active-filter-tag .aft-x{font-size:12px;opacity:0.6}
.toolbar-right{display:flex;align-items:center;gap:8px}
.sort-select{font-family:var(--f-b);font-size:12px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 28px 6px 10px;cursor:pointer;outline:none;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%235A5754' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;transition:all 0.2s}
.sort-select:focus{border-color:var(--accent)}
.sort-select option{background:var(--bg2);color:var(--text)}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.view-btn{padding:6px 10px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.view-btn svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2}
.view-btn.active{background:var(--accent-dim)}
.view-btn.active svg{stroke:var(--accent)}
.view-btn+.view-btn{border-left:1px solid var(--border)}

/* ===== FEATURED SECTIONS ===== */
.featured-sections{margin-bottom:28px}
.featured-sections.hidden{display:none}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px}
.section-title{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-size:18px;font-weight:400;color:var(--text-h)}
.section-title .emoji{font-size:16px}
.section-more{font-size:11px;color:var(--text3);cursor:pointer;transition:color 0.2s}
.section-more:hover{color:var(--accent)}

.feat-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;-webkit-overflow-scrolling:touch}
.feat-scroll::-webkit-scrollbar{height:4px}
.feat-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.feat-card{flex:0 0 340px;scroll-snap-align:start;background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.3s ease;display:flex;flex-direction:column}
.feat-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.feat-card-cover{position:relative;height:180px;overflow:hidden;background:var(--bg3)}
.feat-card-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s ease,opacity 0.4s ease;opacity:0;position:absolute;inset:0;z-index:1}
.feat-card-cover img.loaded{opacity:1}
.feat-card:hover .feat-card-cover img.loaded{transform:scale(1.05)}
.feat-card-cover svg.fb{position:absolute;inset:0;width:100%;height:100%}
.feat-card-cover-overlay{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(10,10,12,0.05) 0%,rgba(10,10,12,0.7) 100%);pointer-events:none}
.feat-badge{position:absolute;top:10px;left:12px;z-index:3;font-family:var(--f-m);font-size:9px;
  letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:6px;
  background:rgba(10,10,12,0.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.8)}
.feat-badge.trend{color:#FF6B6B;border-color:rgba(255,107,107,0.2)}
.feat-badge.new{color:#7BC67E;border-color:rgba(123,198,126,0.2)}
.feat-card-cover-layers{position:absolute;top:10px;right:12px;display:flex;gap:4px;z-index:3}
.feat-card-cover-layers span{width:8px;height:8px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.5)}
.feat-card-cover-info{position:absolute;bottom:10px;left:12px;z-index:3;font-family:var(--f-m);font-size:10px;
  color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:4px}
.feat-card-cover-info svg{width:10px;height:10px;stroke:rgba(255,255,255,0.5);fill:none;stroke-width:2}

.feat-card-body{padding:14px;flex:1;display:flex;flex-direction:column}
.feat-card-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.feat-card-title{font-family:var(--f-d);font-size:17px;font-weight:400;line-height:1.3;margin-bottom:4px;color:var(--text-h)}
.feat-card-desc{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.feat-card-meta{display:flex;align-items:center;justify-content:space-between}
.feat-card-author{display:flex;align-items:center;gap:6px}
.feat-card-author .tl-avatar{width:20px;height:20px}
.feat-card-author>span{font-size:10px;color:var(--text3)}
.feat-card-stats{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--text3)}
.feat-card-stats .stat{display:flex;align-items:center;gap:3px}
.feat-card-stats svg{width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2}

.section-divider{height:1px;background:var(--border);margin:8px 0 20px}
.all-hdr{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.all-hdr-title{font-family:var(--f-d);font-size:16px;font-weight:400;color:var(--text2)}

@media(max-width:540px){
  .feat-card{flex:0 0 280px}
  .feat-card-cover{height:150px}
}

/* ===== GRID — LIQUID ===== */
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.3s ease;display:flex;flex-direction:column}
.tl-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}

/* Cover — photo or SVG fallback */
.tl-card-cover{position:relative;height:160px;overflow:hidden;flex-shrink:0;background:var(--bg3)}
.tl-card-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s ease,opacity 0.5s ease;opacity:0;position:absolute;inset:0;z-index:1}
.tl-card-cover img.loaded{opacity:1}
.tl-card:hover .tl-card-cover img.loaded{transform:scale(1.05)}
.tl-card-cover svg.fb{position:absolute;inset:0;width:100%;height:100%}
.tl-card-cover-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,0.1) 0%,rgba(10,10,12,0.7) 100%);pointer-events:none}
.tl-card-cover-layers{position:absolute;top:10px;left:12px;display:flex;gap:4px;z-index:2}
.tl-card-cover-layers span{width:8px;height:8px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.5)}
.tl-card-cover-actions{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2}
.tl-card-action{width:28px;height:28px;border-radius:50%;background:rgba(10,10,12,0.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s}
.tl-card-action:hover{background:rgba(10,10,12,0.75);border-color:rgba(255,255,255,0.2)}
.tl-card-action svg{width:13px;height:13px;stroke:rgba(255,255,255,0.8);fill:none;stroke-width:2}
.tl-card-action.liked svg{stroke:#D4849A;fill:#D4849A;stroke-width:0}
.tl-card-action.bookmarked svg{stroke:var(--accent);fill:var(--accent);stroke-width:0}
.tl-card-cover-info{position:absolute;bottom:10px;left:12px;z-index:2;font-family:var(--f-m);font-size:10px;color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:4px}
.tl-card-cover-info svg{width:10px;height:10px;stroke:rgba(255,255,255,0.5);fill:none;stroke-width:2}

.tl-card-body{padding:14px 14px 12px;flex:1;display:flex;flex-direction:column}
.tl-card-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.tl-card-title{font-family:var(--f-d);font-size:16px;font-weight:400;line-height:1.3;margin-bottom:4px;color:var(--text-h)}
.tl-card-desc{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.tl-card-meta{display:flex;align-items:center;justify-content:space-between}
.tl-card-author{display:flex;align-items:center;gap:6px}
.tl-avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-m);font-size:8px;font-weight:500}
.tl-card-author>span{font-size:10px;color:var(--text3)}
.tl-card-stats{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--text3)}
.tl-card-stats .stat{display:flex;align-items:center;gap:3px}
.tl-card-stats svg{width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2}
.tl-card-stats .stat-liked svg{stroke:#D4849A;fill:rgba(212,132,154,0.3)}
.tl-card-stats .stat-bm svg{stroke:var(--accent);fill:rgba(200,168,126,0.3)}

/* ===== LIST VIEW ===== */
.tl-list{display:none;flex-direction:column;gap:2px}
.tl-list.active{display:flex}
.tl-grid.active{display:grid}
.tl-grid:not(.active){display:none}
.tl-list-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:all 0.2s}
.tl-list-item:hover{background:var(--bg-card);border-color:var(--border)}
.tl-list-cover{width:72px;height:48px;border-radius:6px;overflow:hidden;flex-shrink:0;position:relative;background:var(--bg3)}
.tl-list-cover img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.3s;position:absolute;inset:0;z-index:1}
.tl-list-cover img.loaded{opacity:1}
.tl-list-cover svg.fb{position:absolute;inset:0;width:100%;height:100%}
.tl-list-cover-overlay{position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(10,10,12,0.4) 100%);pointer-events:none}
.tl-list-body{flex:1;min-width:0}
.tl-list-title{font-family:var(--f-d);font-size:15px;font-weight:400;line-height:1.3;color:var(--text-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-list-sub{font-size:11px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:8px}
.tl-list-cat{font-family:var(--f-m);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.tl-list-meta{display:flex;align-items:center;gap:14px;flex-shrink:0;font-size:11px;color:var(--text3)}
.tl-list-author{display:flex;align-items:center;gap:5px}
.tl-list-author-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-m);font-size:8px}
.tl-list-stats{display:flex;align-items:center;gap:12px}
.tl-list-stats .stat{display:flex;align-items:center;gap:3px}
.tl-list-stats svg{width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2}

.loading-row{display:flex;justify-content:center;padding:32px 0}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
.load-trigger{height:1px}
.empty-state{display:none;text-align:center;padding:60px 20px}
.empty-icon{width:44px;height:44px;margin:0 auto 14px;stroke:var(--text3);fill:none;stroke-width:1.5}
.empty-title{font-family:var(--f-d);font-size:18px;font-weight:300;margin-bottom:6px;color:var(--text2)}
.empty-desc{font-size:12px;color:var(--text3);line-height:1.6}

@media(max-width:860px){.sidebar{display:none}}
@media(max-width:540px){
  .hdr-nav a:not(.active){display:none}
  .search-kbd{display:none}
  .content{padding:16px 14px 80px}
  .tl-grid{grid-template-columns:1fr}
  .tl-list-meta{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">Chronos</div>
  <nav class="hdr-nav">
    <a href="#">マイページ</a>
    <a href="#" class="active">年表を探す</a>
    <a href="#">年表をつくる</a>
    <div class="hdr-avatar">
      <svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#0F1A2E"/><ellipse cx="100" cy="100" rx="72" ry="32" fill="none" stroke="#5B9BD5" stroke-width="2" opacity="0.5" transform="rotate(-25 100 100)"/><ellipse cx="100" cy="100" rx="72" ry="32" fill="none" stroke="#D4849A" stroke-width="2" opacity="0.5" transform="rotate(30 100 100)"/><circle cx="100" cy="100" r="9" fill="#C8A87E" opacity="0.85"/></svg>
    </div>
  </nav>
</header>

<div class="layout">
  <!-- SIDEBAR FACETS -->
  <aside class="sidebar">
    <div class="sb-section">
      <div class="sb-label">カテゴリ</div>
      <div class="sb-item active" data-cat="all" onclick="toggleCat('all',this)"><span class="sb-item-left">すべて</span><span class="sb-item-count" id="countAll">1,247</span></div>
      <div class="sb-item" data-cat="tech" onclick="toggleCat('tech',this)"><span class="sb-item-left"><span class="sb-dot" style="background:var(--c-blue)"></span>テクノロジー</span><span class="sb-item-count">328</span></div>

const UNSPLASH_KEY='REDACTED_DEMO_KEY';
const CAT_QUERIES={
  tech:'technology futuristic digital',
  history:'history ancient civilization',
  culture:'art culture museum',
  science:'science nature space',
  business:'business office city',
  personal:'lifestyle family cozy'
};

// Cache: cat → [url, url, ...]
const photoCache={};
let photosReady=false;

async function fetchAllPhotos(){
  const cats=Object.keys(CAT_QUERIES);
  const promises=cats.map(async cat=>{
    try{
      const res=await fetch(
        `https://api.unsplash.com/search/photos?query=${encodeURIComponent(CAT_QUERIES[cat])}&per_page=30&orientation=landscape`,
        {headers:{'Authorization':`Client-ID ${UNSPLASH_KEY}`}}
      );
      if(!res.ok) return;
      const data=await res.json();
      photoCache[cat]=data.results.map(p=>p.urls.small);
    }catch(e){console.warn('Unsplash fetch failed for',cat,e);}
  });
  await Promise.all(promises);
  photosReady=true;
  // Re-render visible cards with photos
  refreshCovers();
}

function getPhotoUrl(item){
  const photos=photoCache[item.cat];
  if(!photos||!photos.length) return null;
  return photos[item.id % photos.length];
}

function refreshCovers(){
  document.querySelectorAll('.tl-card-cover[data-id]').forEach(cover=>{
    const id=parseInt(cover.dataset.id);
    const item=ALL_DATA.find(d=>d.id===id);
    if(!item) return;
    const url=getPhotoUrl(item);
    if(!url) return;
    if(cover.querySelector('img')) return; // already has photo
    const img=document.createElement('img');
    img.src=url;img.alt=item.title;img.loading='lazy';
    img.onload=()=>img.classList.add('loaded');
    cover.insertBefore(img,cover.querySelector('.tl-card-cover-overlay'));
  });
  document.querySelectorAll('.tl-list-cover[data-id]').forEach(cover=>{
    const id=parseInt(cover.dataset.id);
    const item=ALL_DATA.find(d=>d.id===id);
    if(!item) return;
    const url=getPhotoUrl(item);
    if(!url||cover.querySelector('img')) return;
    const img=document.createElement('img');
    img.src=url;img.alt=item.title;img.loading='lazy';
    img.onload=()=>img.classList.add('loaded');
    cover.insertBefore(img,cover.querySelector('.tl-list-cover-overlay'));
  });
}

function generateTimelines(count){
  const items=[];
  for(let i=0;i<count;i++){
    const cat=CATS[i%6];
    const title=TITLES[cat.id][i%TITLES[cat.id].length];
    const desc=DESCS[cat.id][i%DESCS[cat.id].length];
    const layers=2+Math.floor(Math.random()*2);
    const lColors=[];for(let l=0;l<layers;l++)lColors.push(COLORS[(i+l*3)%COLORS.length]);
    items.push({
      id:i,cat:cat.id,catName:cat.name,catColor:cat.color,catColorD:cat.colorD,
      title,desc,layers,lColors,
      likes:Math.floor(Math.random()*3000)+50,
      bookmarks:Math.floor(Math.random()*800)+10,
      events:Math.floor(Math.random()*80)+8,
      date:20260213-Math.floor(Math.random()*60),
      author:NAMES[i%NAMES.length],
      authorInitial:NAMES[i%NAMES.length][0].toUpperCase(),
      search:(title+' '+cat.name+' '+desc).toLowerCase(),
      liked:Math.random()>0.85,
      bookmarked:Math.random()>0.9
    });
  }
  return items;
}

  return `<div class="tl-list-item" data-id="${item.id}">
    <div class="tl-list-cover" data-id="${item.id}">${cover}<div class="tl-list-cover-overlay"></div></div>
    <div class="tl-list-body">
      <div class="tl-list-title">${item.title}</div>
      <div class="tl-list-sub">
        <span class="tl-list-cat" style="background:${item.catColorD};color:${item.catColor}">${item.catName}</span>
        <span>${item.events} events</span><span>${item.layers} layers</span>
      </div>
    </div>
    <div class="tl-list-meta">
      <div class="tl-list-author"><div class="tl-list-author-av" style="background:${item.catColorD};color:${item.catColor}">${item.authorInitial}</div><span>@${item.author}</span></div>
      <div class="tl-list-stats">
        <span class="stat"><svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2">${ICON.heart}</svg>${item.likes.toLocaleString()}</span>
        <span class="stat"><svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2">${ICON.bookmark}</svg>${item.bookmarks.toLocaleString()}</span>
      </div>
    </div>
  </div>`;
}

// ===== INTERACTIONS =====
function toggleLike(id,el){
  const item=ALL_DATA.find(d=>d.id===id);if(!item)return;
  item.liked=!item.liked;item.likes+=item.liked?1:-1;
  el.classList.toggle('liked',item.liked);
  const card=el.closest('.tl-card');
  if(card){const s=card.querySelector('.tl-card-stats .stat:first-child');if(s){s.className='stat'+(item.liked?' stat-liked':'');s.innerHTML=`<svg viewBox="0 0 24 24">${ICON.heart}</svg>${item.likes.toLocaleString()}`;}}
}
function toggleBookmark(id,el){
  const item=ALL_DATA.find(d=>d.id===id);if(!item)return;
  item.bookmarked=!item.bookmarked;item.bookmarks+=item.bookmarked?1:-1;
  el.classList.toggle('bookmarked',item.bookmarked);
  const card=el.closest('.tl-card');
  if(card){const s=card.querySelector('.tl-card-stats .stat:nth-child(2)');if(s){s.className='stat'+(item.bookmarked?' stat-bm':'');s.innerHTML=`<svg viewBox="0 0 24 24">${ICON.bookmark}</svg>${item.bookmarks.toLocaleString()}`;}}
}

// ===== FILTERS =====
function applyFilters(){
  filteredData=ALL_DATA.filter(item=>{
    if(activeCat!=='all'&&item.cat!==activeCat)return false;
    if(searchQuery&&!item.search.includes(searchQuery))return false;
    return true;
  });
  const sort=document.getElementById('sortSelect').value;
  filteredData.sort((a,b)=>{
    // Photo items always come first (while loading, pin items that already have photos)
    if(sort==='popular')return b.likes-a.likes;
    if(sort==='recent')return b.date-a.date;
    if(sort==='events')return b.events-a.events;
    return b.likes-a.likes;
  });
}
function renderPage(){
  const grid=document.getElementById('gridView'),list=document.getElementById('listView');
  const end=Math.min(displayedCount+PAGE_SIZE,filteredData.length);
  const newItems=filteredData.slice(displayedCount,end);
  if(displayedCount===0){grid.innerHTML='';list.innerHTML='';}
  newItems.forEach(item=>{
    grid.insertAdjacentHTML('beforeend',renderGridCard(item));
    list.insertAdjacentHTML('beforeend',renderListItem(item));
  });
  displayedCount=end;
  document.getElementById('resultNum').textContent=filteredData.length.toLocaleString();
  document.getElementById('emptyState').style.display=filteredData.length===0?'block':'none';
  document.getElementById('loadingRow').style.display='none';
  updateActiveFilterTags();
  // Inject photos into newly rendered cards if cache is ready
  if(photosReady) setTimeout(refreshCovers,50);
}
function rerender(){displayedCount=0;applyFilters();renderPage();updateFeaturedVisibility();}
function handleSearch(){searchQuery=document.getElementById('searchInput').value.toLowerCase().trim();rerender();}

function updateFeaturedVisibility(){
  const el=document.getElementById('featuredSections');
  // Hide featured when filtering or searching
  if(activeCat!=='all'||searchQuery) el.classList.add('hidden');
  else el.classList.remove('hidden');
}

function setView(v){
  currentView=v;
  document.getElementById('viewGrid').classList.toggle('active',v==='grid');
  document.getElementById('viewList').classList.toggle('active',v==='list');
  document.getElementById('gridView').classList.toggle('active',v==='grid');
  document.getElementById('listView').classList.toggle('active',v==='list');
}
function toggleCat(cat,el){
  activeCat=cat;
  el.parentElement.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');rerender();
}
function toggleCheck(el){el.classList.toggle('active');}
function resetFilters(){
  activeCat='all';searchQuery='';
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.sidebar .sb-item[data-cat]').forEach((item,i)=>item.classList.toggle('active',i===0));
  rerender();
}
function updateActiveFilterTags(){
  const c=document.getElementById('activeFilters');c.innerHTML='';
  if(activeCat!=='all'){const cat=CATS.find(x=>x.id===activeCat);c.innerHTML+=`<div class="active-filter-tag" onclick="toggleCat('all',document.querySelector('.sb-item[data-cat=all]'))"><span>${cat.name}</span><span class="aft-x">×</span></div>`;}
  if(searchQuery){c.innerHTML+=`<div class="active-filter-tag" onclick="document.getElementById('searchInput').value='';handleSearch()"><span>「${searchQuery}」</span><span class="aft-x">×</span></div>`;}
}

// ===== INFINITE SCROLL =====
const observer=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting&&displayedCount<filteredData.length){
    document.getElementById('loadingRow').style.display='flex';
    setTimeout(()=>renderPage(),300);
  }
},{rootMargin:'200px'});
observer.observe(document.getElementById('loadTrigger'));

document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('searchInput').focus();}});

applyFilters();renderPage();

// ===== FEATURED SECTIONS =====
function renderFeatCard(item, badgeText, badgeClass){
  const c1=rc(item.catColor), c2=rc(item.lColors[1]||item.lColors[0]);
  const svg=meshSVG(item.id,c1,c2);
  const url=getPhotoUrl(item);
  const imgTag=url?`<img src="${url}" alt="${item.title}" loading="lazy" onload="this.classList.add('loaded')">`:'';
  const dots=item.lColors.map(c=>`<span style="background:${c}"></span>`).join('');
  return `<div class="feat-card">
    <div class="feat-card-cover" data-id="${item.id}">
      ${svg}${imgTag}
      <div class="feat-card-cover-overlay"></div>
      <div class="feat-badge ${badgeClass}">${badgeText}</div>
      <div class="feat-card-cover-layers">${dots}</div>
      <div class="feat-card-cover-info"><svg viewBox="0 0 24 24">${ICON.clock}</svg>${item.events} events · ${item.layers} layers</div>
    </div>
    <div class="feat-card-body">
      <div class="feat-card-cat" style="color:${item.catColor}">${item.catName}</div>
      <div class="feat-card-title">${item.title}</div>
      <div class="feat-card-desc">${item.desc}</div>
      <div class="feat-card-meta">
        <div class="feat-card-author"><div class="tl-avatar" style="background:${item.catColorD};color:${item.catColor}">${item.authorInitial}</div><span>@${item.author}</span></div>
        <div class="feat-card-stats">
          <span class="stat"><svg viewBox="0 0 24 24">${ICON.heart}</svg>${item.likes.toLocaleString()}</span>
          <span class="stat"><svg viewBox="0 0 24 24">${ICON.bookmark}</svg>${item.bookmarks.toLocaleString()}</span>
        </div>
      </div>
    </div>
  </div>`;
}

function buildFeaturedSections(){
  // Trend: top 8 by likes
  const trend=[...ALL_DATA].sort((a,b)=>b.likes-a.likes).slice(0,8);
  const trendEl=document.getElementById('trendScroll');
  trendEl.innerHTML=trend.map(item=>renderFeatCard(item,'Trending','trend')).join('');

  // New: top 8 by date
  const newest=[...ALL_DATA].sort((a,b)=>b.date-a.date).slice(0,8);
  const newEl=document.getElementById('newScroll');
  newEl.innerHTML=newest.map(item=>renderFeatCard(item,'New','new')).join('');
}
buildFeaturedSections();

// Refresh featured covers when Unsplash photos arrive
const origRefreshCovers=refreshCovers;
refreshCovers=function(){
  origRefreshCovers();
  // Also inject photos into featured cards
  document.querySelectorAll('.feat-card-cover[data-id]').forEach(cover=>{
    const id=parseInt(cover.dataset.id);
    const item=ALL_DATA.find(d=>d.id===id);
    if(!item) return;
    const url=getPhotoUrl(item);
    if(!url||cover.querySelector('img')) return;
    const img=document.createElement('img');
    img.src=url;img.alt=item.title;img.loading='lazy';
    img.onload=()=>img.classList.add('loaded');
    cover.insertBefore(img,cover.querySelector('.feat-card-cover-overlay'));
  });
};

// Fetch Unsplash photos (6 API calls, ~30 photos each)
fetchAllPhotos();

// Ensure cached images get .loaded class (onload doesn't fire for cached)
function fixImages(){document.querySelectorAll('.tl-card-cover img:not(.loaded), .tl-list-cover img:not(.loaded), .feat-card-cover img:not(.loaded)').forEach(img=>{if(img.complete&&img.naturalWidth>0)img.classList.add('loaded');});}
new MutationObserver(()=>setTimeout(fixImages,100)).observe(document.getElementById('gridView'),{childList:true});
fixImages();
</script>
</body>
</html>
