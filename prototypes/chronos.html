<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chronos — Beautiful Timeline Creation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0A0A0C;
    --bg-secondary: #111114;
    --bg-card: #18181C;
    --bg-card-hover: #1E1E24;
    --accent: #C8A87E;
    --accent-dim: rgba(200, 168, 126, 0.15);
    --accent-glow: rgba(200, 168, 126, 0.08);
    --text-primary: #E8E4DE;
    --text-secondary: #8A8680;
    --text-muted: #5A5754;
    --border: rgba(200, 168, 126, 0.12);
    --border-strong: rgba(200, 168, 126, 0.25);
    --timeline-line: rgba(200, 168, 126, 0.2);
    --layer-tech: #7EB8C8;
    --layer-culture: #C87E9A;
    --layer-politics: #8EC87E;
    --danger: #C87E7E;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== SPLASH / LANDING ===== */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  .splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash-logo {
    font-family: var(--font-display);
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 0.3s;
  }
  .splash-sub {
    font-family: var(--font-body);
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    margin-top: 12px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 0.7s;
  }
  .splash-cta {
    margin-top: 48px;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 1.1s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== BUTTONS ===== */
  .btn {
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: var(--radius-sm);
  }
  .btn-primary {
    background: var(--accent);
    color: var(--bg-primary);
    padding: 14px 36px;
  }
  .btn-primary:hover { background: #D4B88E; transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border-strong);
    padding: 10px 24px;
  }
  .btn-ghost:hover { background: var(--accent-dim); }
  .btn-small {
    font-size: 0.72rem;
    padding: 8px 16px;
  }
  .btn-icon {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-icon:hover { background: var(--bg-card-hover); color: var(--accent); border-color: var(--border-strong); }

  /* ===== APP SHELL ===== */
  .app { display: none; min-height: 100vh; }
  .app.active { display: block; }

  /* ===== HEADER ===== */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 10, 12, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-brand {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* ===== HOME VIEW ===== */
  .home { padding: 32px 20px 100px; max-width: 640px; margin: 0 auto; }

  .home-hero {
    text-align: center;
    padding: 40px 0 48px;
  }
  .home-hero h1 {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 300;
    line-height: 1.3;
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  .home-hero p {
    font-size: 0.88rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  /* ===== AI GENERATION PANEL ===== */
  .ai-panel {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    margin-bottom: 36px;
    position: relative;
    overflow: hidden;
  }
  .ai-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }
  .ai-panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .ai-badge {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .ai-panel-title {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-primary);
  }
  .ai-input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .ai-input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--text-primary);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.3s ease;
  }
  .ai-input:focus { border-color: var(--accent); }
  .ai-input::placeholder { color: var(--text-muted); }
  .ai-input-row {
    display: flex;
    gap: 10px;
  }
  .ai-input-row .ai-input { flex: 1; }
  .ai-generate-btn {
    width: 100%;
    padding: 14px;
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bg-primary);
    background: linear-gradient(135deg, var(--accent), #D4B88E);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .ai-generate-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(200, 168, 126, 0.2); }
  .ai-generate-btn.loading {
    color: transparent;
    pointer-events: none;
  }
  .ai-generate-btn.loading::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    border: 2px solid transparent;
    border-top-color: var(--bg-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== TIMELINE CARDS (HOME) ===== */
  .timeline-list { display: flex; flex-direction: column; gap: 14px; }

  .timeline-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 22px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .timeline-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-strong);
    transform: translateY(-2px);
  }
  .timeline-card-title {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 6px;
    color: var(--text-primary);
  }
  .timeline-card-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  .timeline-card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .tag-tech { background: rgba(126, 184, 200, 0.15); color: var(--layer-tech); }
  .tag-culture { background: rgba(200, 126, 154, 0.15); color: var(--layer-culture); }
  .tag-politics { background: rgba(142, 200, 126, 0.15); color: var(--layer-politics); }

  /* ===== TIMELINE DETAIL VIEW ===== */
  .timeline-view {
    display: none;
    min-height: 100vh;
    padding-bottom: 100px;
  }
  .timeline-view.active { display: block; }

  .timeline-header {
    padding: 32px 20px 24px;
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
  }
  .timeline-header h1 {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 300;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .timeline-header p {
    font-size: 0.82rem;
    color: var(--text-secondary);
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Layer Filter */
  .layer-filter {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0 20px 28px;
    flex-wrap: wrap;
  }
  .layer-btn {
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .layer-btn.active { border-color: currentColor; }
  .layer-btn[data-layer="all"].active { color: var(--accent); background: var(--accent-dim); border-color: var(--accent); }
  .layer-btn[data-layer="tech"].active { color: var(--layer-tech); background: rgba(126, 184, 200, 0.12); }
  .layer-btn[data-layer="culture"].active { color: var(--layer-culture); background: rgba(200, 126, 154, 0.12); }
  .layer-btn[data-layer="politics"].active { color: var(--layer-politics); background: rgba(142, 200, 126, 0.12); }

  /* Year Indicator (sticky) */
  .year-indicator {
    position: sticky;
    top: 60px;
    z-index: 50;
    text-align: center;
    padding: 10px 0;
    background: rgba(10, 10, 12, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: opacity 0.3s ease;
  }
  .year-indicator span {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 5px 16px;
    border-radius: 20px;
  }

  /* Timeline Track */
  .timeline-track {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 0 48px;
  }
  .timeline-track::before {
    content: '';
    position: absolute;
    left: 34px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--timeline-line);
  }

  /* Event Node */
  .event-node {
    position: relative;
    padding: 0 0 32px 28px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .event-node.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .event-node.hidden-layer {
    display: none;
  }

  /* Dot on timeline */
  .event-dot {
    position: absolute;
    left: -21px;
    top: 6px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg-primary);
    box-shadow: 0 0 0 3px var(--accent-dim);
    z-index: 2;
  }
  .event-dot.tech { background: var(--layer-tech); box-shadow: 0 0 0 3px rgba(126, 184, 200, 0.15); }
  .event-dot.culture { background: var(--layer-culture); box-shadow: 0 0 0 3px rgba(200, 126, 154, 0.15); }
  .event-dot.politics { background: var(--layer-politics); box-shadow: 0 0 0 3px rgba(142, 200, 126, 0.15); }

  .event-date {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }

  .event-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .event-card:hover {
    border-color: var(--border-strong);
    background: var(--bg-card-hover);
  }
  .event-card.expanded {
    border-color: var(--border-strong);
  }

  .event-card-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    opacity: 0.85;
    transition: opacity 0.3s ease;
  }
  .event-card:hover .event-card-image { opacity: 1; }

  .event-card-body { padding: 18px; }

  .event-card-title {
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 6px;
    color: var(--text-primary);
  }

  .event-card-summary {
    font-size: 0.82rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .event-card-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .event-card.expanded .event-card-detail {
    max-height: 400px;
  }
  .event-card-detail-inner {
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
    margin-top: 0;
    padding-top: 14px;
  }
  .event-card-detail p {
    font-size: 0.82rem;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .event-source {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--text-muted);
  }
  .event-source a {
    color: var(--accent);
    text-decoration: none;
  }
  .event-source a:hover { text-decoration: underline; }

  /* ===== STORY MODE ===== */
  .story-toggle {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 0 20px 20px;
  }
  .story-toggle-btn {
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 7px 16px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .story-toggle-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .story-toggle-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .story-toggle-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ===== STORY VIEW (Horizontal swipe) ===== */
  .story-container {
    display: none;
    position: relative;
    overflow: hidden;
    height: calc(100vh - 200px);
    min-height: 480px;
  }
  .story-container.active { display: block; }

  .story-slide {
    position: absolute;
    inset: 0;
    padding: 40px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
    opacity: 0;
    transform: translateX(100%);
  }
  .story-slide.active {
    opacity: 1;
    transform: translateX(0);
  }
  .story-slide.prev {
    opacity: 0;
    transform: translateX(-100%);
  }

  .story-year {
    font-family: var(--font-display);
    font-size: 4rem;
    font-weight: 300;
    color: var(--accent);
    opacity: 0.4;
    margin-bottom: 8px;
  }
  .story-title {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 16px;
    max-width: 400px;
  }
  .story-text {
    font-size: 0.88rem;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 400px;
  }

  .story-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 20px;
  }
  .story-dots {
    display: flex;
    gap: 6px;
  }
  .story-dot-item {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.3s ease;
  }
  .story-dot-item.active {
    background: var(--accent);
    width: 20px;
    border-radius: 3px;
  }

  /* ===== SCROLL TIMELINE (vertical) ===== */
  .scroll-container { }
  .scroll-container.hidden { display: none; }

  /* ===== ERA DIVIDERS ===== */
  .era-divider {
    text-align: center;
    padding: 40px 20px 20px;
    max-width: 640px;
    margin: 0 auto;
  }
  .era-divider-year {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 300;
    color: var(--accent);
    opacity: 0.3;
  }
  .era-divider-label {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ===== BOTTOM NAV (mobile) ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    z-index: 100;
    background: rgba(10, 10, 12, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px 16px;
    transition: color 0.3s ease;
    font-family: var(--font-body);
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-item span { font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; }

  /* ===== PROGRESS BAR ===== */
  .progress-bar {
    position: fixed;
    top: 60px;
    left: 0;
    height: 2px;
    background: var(--accent);
    z-index: 99;
    transition: width 0.15s ease-out;
    width: 0;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
    opacity: 0;
    transition: all 0.4s ease;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== RESPONSIVE ===== */
  @media (min-width: 768px) {
    .splash-logo { font-size: 5rem; }
    .home { padding: 48px 32px 120px; }
    .home-hero h1 { font-size: 2.6rem; }
    .timeline-header h1 { font-size: 2.6rem; }
    .timeline-track { padding-left: 60px; }
    .timeline-track::before { left: 46px; }
    .event-node { padding-left: 36px; }
    .bottom-nav { display: none; }
  }
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div class="splash" id="splash">
  <div class="splash-logo"><img src="assets/chronos-logo.svg" alt="Chronos" style="height:56px;width:auto;display:block;margin:0 auto 16px"></div>
  <div class="splash-sub">Beautiful Timelines, Powered by AI</div>
  <div class="splash-cta">
    <button class="btn btn-primary" onclick="enterApp()">はじめる</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-brand" onclick="showHome()"><img src="assets/chronos-logo.svg" alt="Chronos" style="height:26px;width:auto;display:block"></div>
    <div class="header-actions">

<!-- TOAST -->

<script>

        detail: '接触確認アプリ、リモートワーク、オンライン診療、フードデリバリー。COVID-19のパンデミックはスマートフォンの社会的役割を決定的に変えた。',
        source: 'WHO, 各国政府発表',

      },
      {
        year: 2023, month: 3, date: '2023年3月',
        title: 'GPT-4とモバイルAIの到来',
        summary: 'ChatGPTの爆発的普及により、スマートフォン上でのAI活用が一般化。',
        detail: 'OpenAIのGPT-4リリースを機に、AIアシスタントがスマートフォンの標準機能に。Apple Intelligence、Google Geminiなど、OS統合型AIが次の競争軸に。',
        source: 'OpenAI Blog, 2023',
        layer: 'tech'
      },
      {
        year: 2025, month: 1, date: '2025年',
        title: '折りたたみ・空間コンピューティングの台頭',
        summary: 'フォームファクターの多様化とApple Vision Proが次のパラダイムを予感させる。',
        detail: 'Samsung Galaxy Z Fold / Flipの普及、Apple Vision Proの登場により、「スマートフォンの次」が見え始めた。空間コンピューティングとの融合が次の10年のテーマに。',
        source: '各社プレスリリース, 2024-2025',

      }
    ]
  },
  {
    id: 2,
    title: '日本のインターネット史',
    description: '1995年のWindows 95から現在まで、日本のネット文化の変遷。',
    period: '1995–2025',
    eventCount: 8,
    tags: ['tech', 'culture'],
    events: []
  }
];

let currentTimeline = null;
let currentStoryIndex = 0;
let currentViewMode = 'scroll';
let activeLayer = 'all';

// ===== SPLASH =====
function enterApp() {
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  renderTimelineList();
}

// ===== NAVIGATION =====
function showHome() {
  document.getElementById('homeView').style.display = 'block';
  document.getElementById('timelineView').classList.remove('active');
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('progressBar').style.width = '0';
  currentTimeline = null;
}

function showTimeline(id) {
  const tl = sampleTimelines.find(t => t.id === id);
  if (!tl || tl.events.length === 0) {
    showToast('この年表はデモデータがありません');
    return;
  }
  currentTimeline = tl;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('timelineView').classList.add('active');
  document.getElementById('backBtn').style.display = 'inline-block';

  document.getElementById('timelineDetailHeader').innerHTML = `
    <h1>${tl.title}</h1>
    <p>${tl.description}</p>
  `;

  activeLayer = 'all';
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.toggle('active', b.dataset.layer === 'all'));

  renderTimelineEvents(tl.events);
  renderStorySlides(tl.events);
  switchView('scroll');

  setTimeout(() => {
    observeEvents();
    updateProgress();
  }, 100);
}

// ===== RENDER TIMELINE LIST =====
function renderTimelineList() {
  const list = document.getElementById('timelineList');
  list.innerHTML = sampleTimelines.map(tl => `
    <div class="timeline-card" onclick="showTimeline(${tl.id})">
      <div class="timeline-card-title">${tl.title}</div>
      <div class="timeline-card-meta">
        <span>${tl.period}</span>
        <span>${tl.eventCount} events</span>
      </div>
      <div class="timeline-card-tags">
        ${tl.tags.map(t => `<span class="tag tag-${t}">${t === 'tech' ? 'テクノロジー' : t === 'culture' ? 'カルチャー' : '社会'}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

// ===== RENDER EVENTS (Scroll View) =====
function renderTimelineEvents(events) {
  const track = document.getElementById('timelineTrack');
  let lastEra = null;
  let html = '';

  events.forEach((ev, i) => {
    const era = Math.floor(ev.year / 5) * 5;
    if (era !== lastEra) {
      html += `<div class="era-divider"><div class="era-divider-year">${era}s</div></div>`;
      lastEra = era;
    }
    html += `
      <div class="event-node" data-layer="${ev.layer}" data-index="${i}">
        <div class="event-dot ${ev.layer}"></div>
        <div class="event-date">${ev.date}</div>
        <div class="event-card" onclick="toggleEventDetail(this)">
          <div class="event-card-body">
            <div class="event-card-title">${ev.title}</div>
            <div class="event-card-summary">${ev.summary}</div>
          </div>
          <div class="event-card-detail">
            <div class="event-card-detail-inner">
              <p>${ev.detail}</p>
              <div class="event-source">出典: ${ev.source}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  });

  track.innerHTML = html;
}

function toggleEventDetail(card) {
  card.classList.toggle('expanded');
}

// ===== RENDER STORY SLIDES =====
function renderStorySlides(events) {
  const container = document.getElementById('storyContainer');
  const dotsContainer = document.getElementById('storyDots');

  container.innerHTML = events.map((ev, i) => `
    <div class="story-slide ${i === 0 ? 'active' : ''}" data-index="${i}" data-layer="${ev.layer}">
      <div class="story-year">${ev.year}</div>
      <div class="story-title">${ev.title}</div>
      <div class="story-text">${ev.detail}</div>
    </div>
  `).join('');

  dotsContainer.innerHTML = events.map((_, i) => `
    <div class="story-dot-item ${i === 0 ? 'active' : ''}"></div>
  `).join('');

  currentStoryIndex = 0;
}

function updateStorySlide(newIndex) {
  if (!currentTimeline) return;
  const events = getFilteredEvents();
  if (newIndex < 0 || newIndex >= events.length) return;

  const slides = document.querySelectorAll('.story-slide');
  const dots = document.querySelectorAll('.story-dot-item');

  slides.forEach(s => { s.classList.remove('active', 'prev'); });

  if (currentStoryIndex < newIndex) {
    slides[currentStoryIndex]?.classList.add('prev');
  }

  currentStoryIndex = newIndex;
  slides[currentStoryIndex]?.classList.add('active');

  dots.forEach((d, i) => d.classList.toggle('active', i === currentStoryIndex));
}

function storyNext() {
  updateStorySlide(currentStoryIndex + 1);
}
function storyPrev() {
  updateStorySlide(currentStoryIndex - 1);
}

// ===== VIEW TOGGLE =====
function switchView(mode) {
  currentViewMode = mode;
  const scrollC = document.getElementById('scrollContainer');
  const storyC = document.getElementById('storyContainer');
  const storyN = document.getElementById('storyNav');
  const btns = document.querySelectorAll('.story-toggle-btn');

  if (mode === 'scroll') {
    scrollC.classList.remove('hidden');
    storyC.classList.remove('active');
    storyN.style.display = 'none';
    btns[0].classList.add('active');
    btns[1].classList.remove('active');
    observeEvents();
  } else {
    scrollC.classList.add('hidden');
    storyC.classList.add('active');
    storyN.style.display = 'flex';
    btns[0].classList.remove('active');
    btns[1].classList.add('active');
    currentStoryIndex = 0;
    const slides = document.querySelectorAll('.story-slide');
    slides.forEach((s, i) => {
      s.classList.remove('active', 'prev');
      if (i === 0) s.classList.add('active');
    });
    const dots = document.querySelectorAll('.story-dot-item');
    dots.forEach((d, i) => d.classList.toggle('active', i === 0));
  }
}

// ===== LAYER FILTER =====
function getFilteredEvents() {
  if (!currentTimeline) return [];
  if (activeLayer === 'all') return currentTimeline.events;
  return currentTimeline.events.filter(e => e.layer === activeLayer);
}

function filterLayer(layer) {
  activeLayer = layer;
  document.querySelectorAll('.layer-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.layer === layer);
  });

  // Scroll view: show/hide
  document.querySelectorAll('.event-node').forEach(node => {
    if (layer === 'all' || node.dataset.layer === layer) {
      node.classList.remove('hidden-layer');
    } else {
      node.classList.add('hidden-layer');
    }
  });

  // Story view: re-render filtered
  if (currentViewMode === 'story') {
    const filtered = getFilteredEvents();
    renderStorySlides(filtered);
  }

  observeEvents();
}

// ===== INTERSECTION OBSERVER =====
function observeEvents() {
  const nodes = document.querySelectorAll('.event-node:not(.hidden-layer)');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

  nodes.forEach(node => observer.observe(node));
}

// ===== SCROLL PROGRESS =====
function updateProgress() {
  window.addEventListener('scroll', () => {
    if (!currentTimeline || currentViewMode !== 'scroll') return;
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    document.getElementById('progressBar').style.width = progress + '%';
  });
}

// ===== AI GENERATION (SIMULATED) =====
function generateTimeline() {
  const theme = document.getElementById('aiThemeInput').value.trim();
  const startYear = document.getElementById('aiStartYear').value.trim();
  const endYear = document.getElementById('aiEndYear').value.trim();

  if (!theme) {
    showToast('テーマを入力してください');
    return;
  }

  const btn = document.getElementById('aiGenerateBtn');
  btn.classList.add('loading');

  setTimeout(() => {
    btn.classList.remove('loading');
    showToast('✨ 年表を生成しました');

    // Navigate to the sample timeline as demo
    showTimeline(1);
  }, 2500);
}

// ===== TOAST =====
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== STORY SWIPE GESTURE =====
let touchStartX = 0;
document.addEventListener('touchstart', e => {
  if (currentViewMode !== 'story') return;
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', e => {
  if (currentViewMode !== 'story') return;
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) storyNext();
    else storyPrev();
  }
});

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  // Auto-enter after splash animation
});
</script>
