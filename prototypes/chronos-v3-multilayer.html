<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chronos — Multi-Layer Timeline</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500,600,300i,400i&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0C;
    --bg2: #111114;
    --bg-card: #16161A;
    --bg-card-h: #1C1C22;
    --accent: #C8A87E;
    --accent-dim: rgba(200,168,126,0.13);
    --text: #E8E4DE;
    --text-h: #F5F2ED;
    --text2: #8A8680;
    --text3: #5A5754;
    --border: rgba(200,168,126,0.1);
    --border2: rgba(200,168,126,0.22);
    --line: rgba(200,168,126,0.15);

    --c-iphone: #5B9BD5;
    --c-iphone-dim: rgba(91,155,213,0.12);
    --c-android: #7BC67E;
    --c-android-dim: rgba(123,198,126,0.12);
    --c-culture: #D4849A;
    --c-culture-dim: rgba(212,132,154,0.12);
    --c-industry: #C8B87E;
    --c-industry-dim: rgba(200,184,126,0.12);
    --c-teal: #5BBCB4;
    --c-teal-dim: rgba(91,188,180,0.12);
    --c-orange: #D4A05A;
    --c-orange-dim: rgba(212,160,90,0.12);

    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 20px;
    --f-display: 'Erode', serif;
    --f-body: 'DM Sans', sans-serif;
    --f-mono: 'JetBrains Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; background: var(--bg); color-scheme: dark; }
  body {
    font-family: var(--f-body); background: var(--bg);
    color: var(--text); min-height:100vh;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ===== HEADER ===== */
  .header {
    position:sticky; top:0; z-index:100;
    background:rgba(10,10,12,0.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    padding:0 20px; height:56px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .header-brand {
    font-family:var(--f-display); font-size:1.3rem; font-weight:400;
    letter-spacing:0.2em; color:var(--accent); text-transform:uppercase;
  }
  .header-subtitle {
    font-size:0.7rem; color:var(--text3); letter-spacing:0.06em;
  }

  /* ===== PROGRESS ===== */
  .progress {
    position:fixed; top:56px; left:0; height:2px;
    background:var(--accent); z-index:99;
    transition:width 0.12s ease-out; width:0;
  }

  /* ===== HERO ===== */
  .hero {
    text-align:center; padding:36px 20px 8px;
    max-width:640px; margin:0 auto;
    opacity:0; animation: fadeUp 0.8s ease forwards 0.1s;
    background:var(--bg);
  }
  .hero h1 {
    font-family:var(--f-display); font-size:2.2rem; font-weight:400;
    line-height:1.25; margin-bottom:10px; color:var(--text-h);
  }
  .hero p {
    font-size:0.82rem; color:var(--text2); line-height:1.6;
    max-width:480px; margin:0 auto;
  }

  /* ===== LAYER CONTROLS ===== */
  .layer-controls {
    position:sticky; top:56px; z-index:80;
    background:rgba(10,10,12,0.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    opacity:0; animation: fadeIn 0.6s ease forwards 0.3s;
  }
  .layer-controls-inner {
    max-width:640px; margin:0 auto;
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  }
  .layer-chip {
    display:flex; align-items:center; gap:7px;
    font-family:var(--f-body); font-size:0.72rem; font-weight:500;
    letter-spacing:0.04em;
    padding:7px 14px; border-radius:24px;
    border:1px solid var(--border); background:transparent;
    color:var(--text3); cursor:pointer;
    transition:all 0.3s ease;
    user-select:none; -webkit-user-select:none;
  }
  .layer-chip .chip-dot {
    width:8px; height:8px; border-radius:50%;
    transition:transform 0.2s ease, opacity 0.3s ease;
  }
  .layer-chip.active { color:var(--text); }
  .layer-chip.active .chip-dot { transform:scale(1.3); }
  .layer-chip.inactive { opacity:0.4; }
  .layer-chip.inactive .chip-dot { opacity:0.3; }

  .layer-chip[data-layer="iphone"] .chip-dot { background:var(--c-iphone); }
  .layer-chip[data-layer="iphone"].active { border-color:var(--c-iphone); background:var(--c-iphone-dim); color:var(--c-iphone); }

  .layer-chip[data-layer="android"] .chip-dot { background:var(--c-android); }
  .layer-chip[data-layer="android"].active { border-color:var(--c-android); background:var(--c-android-dim); color:var(--c-android); }

  .layer-chip[data-layer="culture"] .chip-dot { background:var(--c-culture); }
  .layer-chip[data-layer="culture"].active { border-color:var(--c-culture); background:var(--c-culture-dim); color:var(--c-culture); }

  .layer-chip[data-layer="industry"] .chip-dot { background:var(--c-industry); }
  .layer-chip[data-layer="industry"].active { border-color:var(--c-industry); background:var(--c-industry-dim); color:var(--c-industry); }

  .layer-summary {
    width:100%; text-align:center; margin-top:6px;
    font-family:var(--f-mono); font-size:0.62rem;
    color:var(--text3); letter-spacing:0.08em;
  }

  /* ===== YEAR MARKER (sticky) ===== */
  .year-marker {
    position:sticky; top:112px; z-index:70;
    text-align:center; padding:8px 0 4px;
    pointer-events:none;
  }
  .year-marker-inner {
    display:inline-block;
    font-family:var(--f-mono); font-size:0.68rem;
    letter-spacing:0.18em; color:var(--accent);
    background:rgba(10,10,12,0.9); backdrop-filter:blur(8px);
    padding:4px 16px; border-radius:20px;
    border:1px solid var(--accent-dim);
  }

  /* ===== TIMELINE ===== */
  .timeline {
    position:relative; max-width:640px; margin:0 auto;
    padding:20px 16px 120px 16px;
    background:var(--bg);
  }

  /* Central axis */
  .timeline::before {
    content:''; position:absolute;
    left:28px; top:0; bottom:0;
    width:1px; background:var(--line);
  }

  /* ===== YEAR SECTION ===== */
  .year-section { position:relative; padding-bottom:8px; }

  .year-label {
    position:relative; padding:28px 0 16px 0;
    display:flex; align-items:center;
  }
  .year-label-text {
    font-family:var(--f-display); font-size:2.6rem; font-weight:400;
    color:var(--accent); opacity:0.2;
    margin-left:8px; line-height:1;
  }
  .year-label-line {
    flex:1; height:1px; margin-left:16px;
    background:linear-gradient(90deg, var(--line), transparent);
  }

  /* ===== EVENT ROW ===== */
  .event-row {
    position:relative;
    padding:0 0 6px 50px;
    opacity:0; transform:translateY(14px);
    transition:all 0.55s cubic-bezier(0.16,1,0.3,1);
  }
  .event-row.visible { opacity:1; transform:translateY(0); }
  .event-row.layer-hidden { display:none; }

  /* Dot on axis */
  .ev-dot {
    position:absolute; left:22px; top:14px;
    width:13px; height:13px; border-radius:50%;
    border:2.5px solid var(--bg);
    z-index:3;
    transition: transform 0.25s ease, box-shadow 0.3s ease;
  }
  .ev-dot.iphone { background:var(--c-iphone); box-shadow:0 0 0 3px var(--c-iphone-dim); }
  .ev-dot.android { background:var(--c-android); box-shadow:0 0 0 3px var(--c-android-dim); }
  .ev-dot.culture { background:var(--c-culture); box-shadow:0 0 0 3px var(--c-culture-dim); }
  .ev-dot.industry { background:var(--c-industry); box-shadow:0 0 0 3px var(--c-industry-dim); }

  .event-row:hover .ev-dot { transform:scale(1.35); }

  /* Connector line from dot to card */
  .ev-connector {
    position:absolute; left:35px; top:19px;
    width:15px; height:1px;
  }
  .ev-connector.iphone { background:var(--c-iphone); opacity:0.3; }
  .ev-connector.android { background:var(--c-android); opacity:0.3; }
  .ev-connector.culture { background:var(--c-culture); opacity:0.3; }
  .ev-connector.industry { background:var(--c-industry); opacity:0.3; }

  /* ===== EVENT CARD ===== */
  .ev-card {
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:var(--r-md); overflow:hidden;
    transition:all 0.3s ease; cursor:pointer;
    position:relative;
  }
  .ev-card:hover { background:var(--bg-card-h); border-color:var(--border2); }
  .ev-card.expanded { border-color:var(--border2); }

  /* Layer color accent on left edge */
  .ev-card::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:3px; border-radius:3px 0 0 3px;
  }
  .ev-card.iphone::before { background:var(--c-iphone); }
  .ev-card.android::before { background:var(--c-android); }
  .ev-card.culture::before { background:var(--c-culture); }
  .ev-card.industry::before { background:var(--c-industry); }

  .ev-card-body { padding:14px 14px 14px 16px; }

  .ev-card-top {
    display:flex; align-items:center; gap:8px; margin-bottom:5px;
  }
  .ev-layer-tag {
    font-family:var(--f-mono); font-size:0.58rem; font-weight:400;
    letter-spacing:0.06em; text-transform:uppercase;
    padding:2px 8px; border-radius:10px;
  }
  .ev-layer-tag.iphone { background:var(--c-iphone-dim); color:var(--c-iphone); }
  .ev-layer-tag.android { background:var(--c-android-dim); color:var(--c-android); }
  .ev-layer-tag.culture { background:var(--c-culture-dim); color:var(--c-culture); }
  .ev-layer-tag.industry { background:var(--c-industry-dim); color:var(--c-industry); }

  .ev-date {
    font-family:var(--f-mono); font-size:0.64rem;
    color:var(--text3); letter-spacing:0.08em;
  }

  .ev-title {
    font-family:var(--f-display); font-size:1.15rem; font-weight:500;
    line-height:1.3; color:var(--text-h); margin-bottom:4px;
  }
  .ev-summary {
    font-size:0.78rem; color:var(--text2); line-height:1.55;
  }

  /* Expand detail */
  .ev-detail {
    max-height:0; overflow:hidden;
    transition:max-height 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .ev-card.expanded .ev-detail { max-height:300px; }
  .ev-detail-inner {
    padding:0 14px 14px 16px; border-top:1px solid var(--border);
    margin-top:0; padding-top:12px;
  }
  .ev-detail-inner p {
    font-size:0.78rem; color:var(--text2); line-height:1.7; margin-bottom:8px;
  }
  .ev-source {
    font-family:var(--f-mono); font-size:0.6rem; color:var(--text3);
  }

  /* ===== SIMULTANEOUS EVENTS (same year-month) ===== */
  .event-cluster {
    display:flex; flex-direction:column; gap:6px;
    position:relative; padding:0 0 6px 50px;
  }
  .event-cluster .event-row {
    padding-left:0;
  }
  .event-cluster .ev-dot { left:-28px; }
  .event-cluster .ev-connector { left:-15px; }

  /* ===== COMPARISON HIGHLIGHT ===== */
  .same-period-bg {
    position:relative;
    margin:0 -16px;
    padding:4px 16px 4px 16px;
    background:rgba(200,168,126,0.03);
    border-radius:var(--r-md);
    border-left:2px solid var(--accent-dim);
  }
  .same-period-label {
    font-family:var(--f-mono); font-size:0.6rem;
    color:var(--text3); letter-spacing:0.1em;
    padding:4px 0 8px 50px; text-transform:uppercase;
  }

  /* ===== LEGEND (bottom fixed) ===== */
  .legend {
    position:fixed; bottom:0; left:0; right:0;
    z-index:90;
    background:rgba(10,10,12,0.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .legend-inner {
    max-width:640px; margin:0 auto;
    display:flex; justify-content:center; gap:16px; flex-wrap:wrap;
  }
  .legend-item {
    display:flex; align-items:center; gap:6px;
    font-size:0.65rem; color:var(--text2); letter-spacing:0.04em;
  }
  .legend-dot {
    width:8px; height:8px; border-radius:50%;
  }
  .legend-dot.iphone { background:var(--c-iphone); }
  .legend-dot.android { background:var(--c-android); }
  .legend-dot.culture { background:var(--c-culture); }
  .legend-dot.industry { background:var(--c-industry); }

  /* ===== TOAST ===== */
  .toast {
    position:fixed; bottom:70px; left:50%;
    transform:translateX(-50%) translateY(16px);
    background:var(--bg-card); border:1px solid var(--border2);
    color:var(--text); padding:10px 20px; border-radius:var(--r-sm);
    font-size:0.8rem; opacity:0; transition:all 0.4s ease;
    z-index:200; pointer-events:none; white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== RESPONSIVE ===== */
  @media (min-width:768px) {
    .hero h1 { font-size:2.8rem; }
    .timeline { padding-left:32px; padding-right:32px; }
    .timeline::before { left:44px; }
    .event-row { padding-left:66px; }
    .ev-dot { left:38px; }
    .ev-connector { left:51px; }
    .same-period-label { padding-left:66px; }
    .year-label-text { margin-left:20px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div>
    <div class="header-brand"><img src="assets/chronos-logo.svg" alt="Chronos" style="height:24px;width:auto;display:block"></div>
  </div>
  <div class="header-subtitle">マルチレイヤー表示</div>
</header>

<div class="progress" id="progress"></div>

<!-- HERO -->
<div class="hero">
  <h1>モバイル革命の<br>全体像を俯瞰する</h1>
  <p>iPhone・Android・モバイルカルチャー・業界動向——<br>4つのタイムラインを同一の時間軸で比較。</p>
</div>

<!-- LAYER CONTROLS -->
<div class="layer-controls">
  <div class="layer-controls-inner">
    <button class="layer-chip active" data-layer="iphone" onclick="toggleLayer('iphone',this)">
      <span class="chip-dot"></span>iPhone
    </button>
    <button class="layer-chip active" data-layer="android" onclick="toggleLayer('android',this)">
      <span class="chip-dot"></span>Android
    </button>
    <button class="layer-chip active" data-layer="culture" onclick="toggleLayer('culture',this)">
      <span class="chip-dot"></span>カルチャー
    </button>
    <button class="layer-chip active" data-layer="industry" onclick="toggleLayer('industry',this)">
      <span class="chip-dot"></span>業界動向
    </button>
    <div class="layer-summary" id="layerSummary">4 レイヤー表示中 · 32 イベント</div>
  </div>
</div>

<!-- TIMELINE -->
<div class="timeline" id="timeline"></div>

<!-- LEGEND -->
<div class="legend">
  <div class="legend-inner">
    <div class="legend-item"><span class="legend-dot iphone"></span>iPhone</div>
    <div class="legend-item"><span class="legend-dot android"></span>Android</div>
    <div class="legend-item"><span class="legend-dot culture"></span>カルチャー</div>
    <div class="legend-item"><span class="legend-dot industry"></span>業界動向</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== MULTI-LAYER EVENT DATA =====
const events = [
  // 2007
  {y:2007,m:1,date:'2007.01',layer:'iphone',title:'Steve Jobs、iPhoneを発表',summary:'Macworld で「電話を再発明する」と宣言。マルチタッチが世界を変えた。',detail:'タッチスクリーン、Visual Voicemail、モバイルSafariを搭載した初代iPhoneが発表。従来の携帯電話の概念を根本から覆した。',source:'Apple Keynote, Jan 2007'},
  {y:2007,m:6,date:'2007.06',layer:'iphone',title:'初代iPhone発売',summary:'米国で発売。長蛇の列が世界中のニュースに。',detail:'価格は$499/599。初週で27万台を販売。スマートフォン市場の歴史が動き出した。',source:'Apple Press Release'},
  {y:2007,m:11,date:'2007.11',layer:'android',title:'Android SDK発表',summary:'GoogleがOpen Handset Allianceを結成、Android SDKを公開。',detail:'34社による連合体としてOHAが発足。オープンソースのモバイルOSという新しいアプローチでAppleに対抗。',source:'Google Official Blog'},

  // 2008
  {y:2008,m:7,date:'2008.07',layer:'iphone',title:'App Store開始 & iPhone 3G',summary:'サードパーティアプリの配信が始まり、モバイルエコシステムが誕生。',detail:'初日500アプリ。3日で1,000万DL。アプリ経済圏という新しい産業を生んだ。',source:'Apple Press Release'},
  {y:2008,m:9,date:'2008.09',layer:'android',title:'初のAndroid端末 HTC Dream',summary:'T-Mobile G1として発売。物理QWERTYキーボード搭載。',detail:'Android Market（現Google Play）も同時にローンチ。iPhone一強に風穴を開けた。',source:'HTC / T-Mobile'},
  {y:2008,m:9,date:'2008.09',layer:'industry',title:'スマートフォン市場の二強構造へ',summary:'iOS vs Androidの構図が誕生。Nokia Symbianの衰退が始まる。',detail:'2008年時点でSymbianのシェアは約50%。しかしiPhoneとAndroidの登場で、タッチスクリーン中心のUIパラダイムへ急速に移行していく。',source:'Gartner, IDC'},

  // 2009
  {y:2009,m:6,date:'2009.06',layer:'iphone',title:'iPhone 3GS',summary:'初の「S」モデル。速度向上と動画撮影対応。',detail:'「S = Speed」。パフォーマンス改善により、アプリ開発者にとってもより実用的なプラットフォームに。',source:'Apple'},
  {y:2009,m:10,date:'2009.10',layer:'android',title:'Motorola Droid発売',summary:'「iPhoneじゃない」を売りに大ヒット。Androidの本格普及が始まる。',detail:'Verizon独占販売。「Droid Does」キャンペーンが話題に。Android端末で初めてiPhoneに匹敵する評価を獲得。',source:'Motorola / Verizon'},

  // 2010
  {y:2010,m:1,date:'2010.01',layer:'android',title:'Nexus One発表',summary:'Google初の自社ブランドスマートフォン。',detail:'Googleが「リファレンスデバイス」として自社設計。直販モデルを採用し、後のPixelシリーズの原型に。',source:'Google'},
  {y:2010,m:6,date:'2010.06',layer:'iphone',title:'iPhone 4 — Retina Display',summary:'高精細ディスプレイとガラス筐体で、デザインの新基準を確立。',detail:'326ppiのRetina Display、FaceTime、ジャイロスコープ搭載。「Antennagate」も話題に。',source:'Apple Keynote, WWDC 2010'},
  {y:2010,m:10,date:'2010.10',layer:'culture',title:'Instagram誕生',summary:'フィルター付き写真共有アプリがスマホ写真文化を変えた。',detail:'Kevin SystromとMike Kriegerが開発。24時間で2.5万ユーザー獲得。スマホカメラ=SNSの時代が始まる。',source:'Instagram Blog'},

  // 2011
  {y:2011,m:2,date:'2011.02',layer:'android',title:'Android 3.0 Honeycomb（タブレット対応）',summary:'タブレット専用UIを導入。iPad対抗の大画面戦略。',detail:'Motorola Xoomと共にリリース。ホログラフィックUIを採用し、タブレット市場への本格参入を宣言。',source:'Google'},
  {y:2011,m:6,date:'2011.06',layer:'culture',title:'LINEリリース',summary:'東日本大震災を機に開発。日本のコミュニケーションを変革。',detail:'安否確認ニーズから生まれ、スタンプ機能で若年層に爆発的に普及。アジア圏に拡大。',source:'LINE Corporation'},
  {y:2011,m:10,date:'2011.10',layer:'iphone',title:'iPhone 4S & Siri',summary:'AI音声アシスタントがスマートフォンに初搭載。',detail:'「Siri」はAIが日常のインターフェースになる最初のステップだった。Steve Jobs逝去の翌日に発売。',source:'Apple'},

  // 2012

// ===== STATE =====
const activeLayers = new Set(['iphone','android','culture','industry']);
const layerLabels = {iphone:'iPhone',android:'Android',culture:'カルチャー',industry:'業界動向'};

// ===== RENDER =====
function render() {
  const tl = document.getElementById('timeline');
  const filtered = events.filter(e => activeLayers.has(e.layer));

  // Group by year
  const byYear = {};
  filtered.forEach(e => {
    if (!byYear[e.y]) byYear[e.y] = [];
    byYear[e.y].push(e);
  });

  let html = '';
  const years = Object.keys(byYear).sort((a,b) => a - b);

  years.forEach(year => {
    const evts = byYear[year].sort((a,b) => a.m - b.m);
    html += `<div class="year-section" data-year="${year}">`;
    html += `<div class="year-label"><span class="year-label-text">${year}</span><span class="year-label-line"></span></div>`;

    // Check for same-month clusters
    const byMonth = {};
    evts.forEach(e => {
      const k = `${e.y}-${e.m}`;
      if (!byMonth[k]) byMonth[k] = [];
      byMonth[k].push(e);
    });

    Object.values(byMonth).forEach(group => {
      if (group.length > 1) {
        // Multiple events in same month — highlight as comparison
        html += `<div class="same-period-bg">`;
        html += `<div class="same-period-label">${group[0].date} — ${group.length}つのレイヤーで同時に動き</div>`;
        group.forEach(e => { html += renderEvent(e); });
        html += `</div>`;
      } else {
        html += renderEvent(group[0]);
      }
    });

    html += `</div>`;
  });

  tl.innerHTML = html;
  updateSummary();
  setTimeout(observeEvents, 50);
}

function renderEvent(e) {
  return `
    <div class="event-row" data-layer="${e.layer}">
      <div class="ev-dot ${e.layer}"></div>
      <div class="ev-connector ${e.layer}"></div>
      <div class="ev-card ${e.layer}" onclick="this.classList.toggle('expanded')">
        <div class="ev-card-body">
          <div class="ev-card-top">
            <span class="ev-layer-tag ${e.layer}">${layerLabels[e.layer]}</span>
            <span class="ev-date">${e.date}</span>
          </div>
          <div class="ev-title">${e.title}</div>
          <div class="ev-summary">${e.summary}</div>
        </div>
        <div class="ev-detail">
          <div class="ev-detail-inner">
            <p>${e.detail}</p>
            <div class="ev-source">出典: ${e.source}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ===== LAYER TOGGLE =====
function toggleLayer(layer, chip) {
  if (activeLayers.has(layer)) {
    if (activeLayers.size <= 1) {
      showToast('少なくとも1つのレイヤーを表示してください');
      return;
    }
    activeLayers.delete(layer);
    chip.classList.remove('active');
    chip.classList.add('inactive');
  } else {
    activeLayers.add(layer);
    chip.classList.add('active');
    chip.classList.remove('inactive');
  }
  render();
}

function updateSummary() {
  const count = events.filter(e => activeLayers.has(e.layer)).length;
  document.getElementById('layerSummary').textContent =
    `${activeLayers.size} レイヤー表示中 · ${count} イベント`;
}

// ===== INTERSECTION OBSERVER =====
function observeEvents() {
  const rows = document.querySelectorAll('.event-row');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) en.target.classList.add('visible');
    });
  }, { threshold:0.12, rootMargin:'0px 0px -30px 0px' });
  rows.forEach(r => obs.observe(r));
}

// ===== SCROLL PROGRESS =====
window.addEventListener('scroll', () => {
  const s = window.scrollY;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('progress').style.width = (h > 0 ? (s/h)*100 : 0) + '%';
});

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
render();
</script>
