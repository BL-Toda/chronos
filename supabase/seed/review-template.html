<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シードコンテンツ確認 — Chronos</title>
<meta name="description" content="Supabaseシード18本の内容レビュー用ページ。">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=erode@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C;--bg2:#0E0E11;--card:#16161A;
  --accent:#C8A87E;--accent-soft:rgba(200,168,126,0.10);--accent-med:rgba(200,168,126,0.18);
  --text:#E8E4DE;--text-h:#F5F2ED;--text2:#9A9590;--text3:#7A7570;
  --border:rgba(200,168,126,0.10);--border2:rgba(200,168,126,0.20);
  --f-d:'Erode','Shippori Mincho',serif;--f-b:'DM Sans',sans-serif;--f-m:'JetBrains Mono',monospace;
  --hdr:100px;--ease:cubic-bezier(0.16,1,0.3,1);
  /* タイプスケール5段（行間は偶数px固定）*/
  --fs-display:clamp(24px,4vw,32px);--lh-display:44px;
  --fs-title:18px;--lh-title:28px;
  --fs-body:15px;--lh-body:28px;
  --fs-sm:13px;--lh-sm:22px;
  --fs-xs:11px;--lh-xs:18px;
  --c-blue:#5B9BD5;--c-green:#7BC67E;--c-pink:#D4849A;--c-gold:#C8B87E;--c-purple:#9E7EC8;--c-teal:#5BBCB4;--c-orange:#D4A05A;
}
*{margin:0;padding:0;box-sizing:border-box}
html.scrolled{--hdr:60px}
html{font-size:15px;-webkit-font-smoothing:antialiased;background:var(--bg);color-scheme:dark;overflow-x:clip;scroll-padding-top:calc(var(--hdr) + 16px)}
body{font-family:var(--f-b);background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:var(--lh-body);font-weight:400;touch-action:manipulation}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

header.site{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,12,0.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.hdr-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:var(--hdr);display:flex;align-items:center;justify-content:space-between;transition:height .35s var(--ease)}
.hdr-logo{display:flex;align-items:center;padding:20px 0}
.hdr-logo img{height:40px;width:auto;transition:height .35s var(--ease)}
html.scrolled .hdr-logo img{height:24px}
.hdr-back{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);text-decoration:none;letter-spacing:0.04em;transition:color .3s;padding:8px 0}
.hdr-back:hover{color:var(--text)}

.readbar{position:fixed;top:var(--hdr);left:0;right:0;height:2px;z-index:99;pointer-events:none;transition:top .35s var(--ease)}
.readbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#D4A05A);transform-origin:0 50%;transform:scaleX(0);transition:transform .12s linear}
.year-now{position:fixed;top:calc(var(--hdr) + 12px);left:50%;transform:translate(-50%,-4px);z-index:98;font-family:var(--f-m);font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;letter-spacing:0.08em;font-variant-numeric:tabular-nums;color:var(--accent);background:rgba(10,10,12,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border2);border-radius:999px;padding:4px 16px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease),top .35s var(--ease)}
.year-now.show{opacity:1;transform:translate(-50%,0)}
.wrap{max-width:1080px;margin:0 auto;padding:168px 32px 140px}
.page-label{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.22em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
h1.page-title{font-family:var(--f-d);font-weight:500;font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:0.08em;color:var(--text-h);padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.page-lead{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text);max-width:640px;margin-bottom:76px}

/* ─ home: category sections */
.stamp{padding-top:48px;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.1em;color:var(--text3);opacity:.55}
.cat-sec{margin-bottom:84px}
.cat-head{display:flex;align-items:baseline;gap:16px;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:16px}
.cat-name{font-family:var(--f-d);font-weight:500;font-size:var(--fs-title);line-height:var(--lh-title);letter-spacing:0.1em;color:var(--text-h)}
.cat-count{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.tl-card{display:block;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 28px 24px;transition:border-color .3s,transform .3s var(--ease);width:100%}
.tl-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.tl-years{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--accent);letter-spacing:0.06em;font-variant-numeric:tabular-nums;margin-bottom:8px}
.tl-title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500;color:var(--text-h);margin-bottom:12px}
.tl-desc{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.layer-chip{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text2)}
.layer-chip i{width:8px;height:8px;border-radius:2px;flex:none}
.tl-evcount{margin-left:auto;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}

/* ─ detail */
.detail{display:none}
.detail.on{display:block}
.home.off{display:none}
.d-back{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);margin-bottom:40px;transition:color .3s}
.d-back:hover{color:var(--text)}
.d-coverwrap{margin:0 0 40px}
.d-cover{position:relative;height:clamp(160px,28vw,280px);overflow:hidden;background:var(--card)}
.d-cover img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease)}
.d-cover img.loaded{opacity:1}
.d-cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,0.05) 40%,rgba(10,10,12,0.55))}
.d-cover-credit{display:block;text-align:right;margin-top:8px;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.04em;color:var(--text3)}
.d-cover-credit a{color:inherit;text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:2px}
.d-cat{font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.d-title{font-family:var(--f-d);font-weight:500;font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:0.06em;color:var(--text-h);margin-bottom:16px}
.d-desc{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text2);max-width:680px;margin-bottom:28px}
.d-stats{display:flex;flex-wrap:wrap;gap:24px;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);font-variant-numeric:tabular-nums;color:var(--text3);margin-bottom:36px}
.d-stats b{color:var(--text-h);font-weight:700}
.d-layers{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:64px}
.d-layer{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);cursor:pointer;transition:border-color .3s,background .3s}
.d-layer.active{border-color:var(--border2);background:var(--accent-soft);color:var(--text-h);font-weight:500}
.d-layer i{width:10px;height:10px;border-radius:3px;flex:none}

/* events */
.ev-list{position:relative}
.ev{position:relative;display:grid;grid-template-columns:16px 1fr;gap:24px;padding-bottom:8px;transition:opacity .35s var(--ease),filter .35s var(--ease)}
.ev.dim{opacity:.22;filter:saturate(.4)}
.ev-rail{position:relative}
.ev-rail::before{content:"";position:absolute;left:8px;top:24px;bottom:-4px;width:1px;background:var(--border)}
.ev:last-child .ev-rail::before{display:none}
.ev-dot{position:absolute;left:4px;top:8px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--bg)}
.ev-dot.period{border-radius:3px}
.ev-body{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px 28px;margin-bottom:20px;min-width:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(232,228,222,0.06);transition:background .2s,border-color .2s}
.ev-body:active{background:#1E1E24;border-color:rgba(232,228,222,0.16)}
.ev-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.ev-date{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--accent);letter-spacing:0.02em;font-variant-numeric:tabular-nums}
.ev-layer{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text2)}
.ev-layer i{width:8px;height:8px;border-radius:2px}
.cred{font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.06em;padding:0 12px;height:20px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;align-items:center}
.cred.verified{color:#7BC67E;border-color:rgba(123,198,126,0.35)}
.cred.disputed{color:#D4A05A;border-color:rgba(212,160,90,0.4)}
.cred.unverified{color:var(--text3);border-color:rgba(154,149,144,0.35)}
.ev-title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500;color:var(--text-h)}
.ev-head{display:block;width:100%;text-align:left;position:relative;padding-right:44px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(200,168,126,0.08)}
.ev-head::before{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:28px;height:28px;border:1px solid rgba(232,228,222,0.16);border-radius:50%;transition:border-color .3s,background .3s}
.ev.open .ev-head::before{border-color:rgba(232,228,222,0.32);background:rgba(232,228,222,0.07)}
.ev-head::after{content:"";position:absolute;right:14px;top:50%;width:5px;height:5px;margin:-4px -2.5px 0 0;border-right:1.5px solid var(--text2);border-bottom:1.5px solid var(--text2);transform:rotate(45deg);transform-origin:center;transition:transform .3s var(--ease),border-color .3s}
.ev.open .ev-head::after{margin:-1px -2.5px 0 0;transform:rotate(-135deg);border-color:var(--text-h)}
.ev-x{overflow:hidden;max-height:0;transition:max-height .5s var(--ease)}
.ev.open .ev-x{max-height:3000px}
.ev-xi{overflow:hidden}
.ev-xd{border-top:1px solid var(--border);margin-top:16px;padding-top:16px;opacity:0;transition:opacity .3s var(--ease)}
.ev.open .ev-xd{opacity:1;transition-delay:.1s}
.ev-tools{display:flex;justify-content:flex-end;margin-bottom:24px}
.ev-expall{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);border:1px solid rgba(232,228,222,0.16);border-radius:999px;padding:8px 16px;transition:color .3s,border-color .3s,background .3s}
.ev-expall:hover{color:var(--text-h);border-color:rgba(232,228,222,0.32);background:rgba(232,228,222,0.05)}
.ev-summary{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text);margin-bottom:16px}
.ev-summary strong,.ev-detail strong{color:var(--text-h);font-weight:700}
.ev-summary p+p,.ev-detail p+p{margin-top:16px}
.ev-detail{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text2);margin-bottom:16px}
.ev-note-label{display:block;font-family:var(--f-m);font-size:var(--fs-xs);line-height:var(--lh-xs);letter-spacing:0.14em;color:#D4A05A;opacity:.8;margin-bottom:4px}
.ev-note{font-size:var(--fs-sm);color:#D4A05A;background:rgba(212,160,90,0.07);border-left:2px solid rgba(212,160,90,0.4);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px;line-height:var(--lh-sm)}
.ev-srcs{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);padding-top:16px;margin-top:8px}
.ev-src{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text3)}
.ev-src a{color:var(--text2);text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:3px;word-break:break-all}
.ev-src a:hover{color:var(--accent)}
.year-mark{grid-column:1 / -1;font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;letter-spacing:0.1em;font-variant-numeric:tabular-nums;color:var(--text2);padding:28px 0 16px;border-bottom:1px dashed var(--border);margin-bottom:24px}

@media (max-width:560px){
  .hdr-inner{padding:0 20px}
  .wrap{padding:128px 20px 88px}
  .tl-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<header class="site">
  <div class="hdr-inner">
    <a class="hdr-logo" href="./" aria-label="Chronos"><img src="assets/chronos-logo.svg" alt="Chronos"></a>
    <a class="hdr-back" href="./">プロトタイプ一覧へ</a>
  </div>
</header>
<div class="readbar" aria-hidden="true"><i></i></div>
<div class="year-now" aria-hidden="true"></div>

<main class="wrap">
  <div class="home" id="home">
    <p class="page-label">Seed Content Review</p>
    <h1 class="page-title">シードコンテンツ確認</h1>
    <p class="page-lead">Supabaseに投入する公式サンプル年表18本（6カテゴリ×3本）の内容レビュー用ページ。カードを開くと全イベント・信憑性ラベル・出典を確認できます。データの正本は supabase/seed/data/ の JSON です。</p>
    <div id="cats"></div>
  </div>
  <div class="detail" id="detail"></div>
<div class="stamp" aria-hidden="true">build __BUILD__</div>
</main>

<script>
const DATA = /*__DATA__*/[];
const PHOTO_POOL = /*__PHOTO_POOL__*/{};
const AUTHOR_BY_SLUG = /*__AUTHORS__*/{};
const UNSPLASH_UTM = "?utm_source=chronos&utm_medium=referral";
const CATKEY = {"technology":"tech","history-politics":"history","culture":"culture","science-nature":"science","business":"business","personal-life":"personal"};
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))>>>0}return h}
function pickPhoto(t){
  const pool = PHOTO_POOL[CATKEY[t.category]];
  if(!pool || !pool.length) return null;
  return pool[(hashStr(CATKEY[t.category] + "|" + t.title) >>> 8) % pool.length];
}
function photoURL(p, w, h){return `${p.raw}?w=${w}&h=${h}&fit=crop&auto=format&q=70`}
const CAT = {
  "technology": "テクノロジー",
  "history-politics": "歴史・政治",
  "culture": "カルチャー",
  "science-nature": "科学・自然",
  "business": "ビジネス",
  "personal-life": "個人・ライフ"
};
const COLOR = {blue:"var(--c-blue)",green:"var(--c-green)",pink:"var(--c-pink)",gold:"var(--c-gold)",purple:"var(--c-purple)",teal:"var(--c-teal)",orange:"var(--c-orange)"};
const CRED = {verified:"検証済み",disputed:"諸説あり",unverified:"未検証"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => "<p>" + esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n{2,}/g, "</p><p>") + "</p>";

function fmtDate(e){
  const [y,m,d] = e.date.split("-");
  if(e.precision === "year") return y;
  if(e.precision === "month") return `${y}.${m}`;
  return `${y}.${m}.${d}`;
}
function fmtEnd(e){
  if(e.type !== "period" || !e.end_date) return "";
  const [y,m] = e.end_date.split("-");
  return e.precision === "year" ? ` — ${y}` : ` — ${y}.${m}`;
}

function renderHome(){
  const byCat = {};
  for(const t of DATA) (byCat[t.category] ??= []).push(t);
  let html = "";
  for(const key of Object.keys(CAT)){
    const list = byCat[key] || [];
    if(!list.length) continue;
    html += `<section class="cat-sec"><div class="cat-head"><h2 class="cat-name">${CAT[key]}</h2><span class="cat-count">${list.length} TIMELINES</span></div><div class="tl-grid">`;
    for(const t of list){
      const chips = t.layers.map(l => `<span class="layer-chip"><i style="background:${COLOR[l.color]}"></i>${esc(l.name)}</span>`).join("");
      html += `<button class="tl-card" data-slug="${esc(t.slug)}">
        <div class="tl-years">${t.start_year}–${t.end_year}</div>
        <div class="tl-title">${esc(t.title)}</div>
        <div class="tl-desc">${esc(t.description)}</div>
        <div class="tl-meta">${chips}<span class="tl-evcount">${t.events.length}件</span></div>
      </button>`;
    }
    html += `</div></section>`;
  }
  document.getElementById("cats").innerHTML = html;
}

function renderDetail(t){
  const colorOf = name => COLOR[(t.layers.find(l => l.name === name) || {}).color] || "var(--text3)";
  const cred = t.events.reduce((a,e) => (a[e.credibility] = (a[e.credibility]||0)+1, a), {});
  const layers = t.layers.map(l => `<button class="d-layer" data-layer="${esc(l.name)}"><i style="background:${COLOR[l.color]}"></i>${esc(l.name)}</button>`).join("");
  let evs = "", lastYear = null;
  const sorted = [...t.events].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  for(const e of sorted){
    const y = e.date.slice(0,4);
    if(y !== lastYear){ evs += `<div class="year-mark">${y}</div>`; lastYear = y; }
    const note = e.credibility_note ? `<div class="ev-note"><span class="ev-note-label">${e.credibility === "disputed" ? "（諸説ありの理由）" : "（未検証の理由）"}</span>${esc(e.credibility_note)}</div>` : "";
    const detail = e.detail ? `<div class="ev-detail">${md(e.detail)}</div>` : "";
    const srcs = (e.sources || []).filter(s => s && s.title).map(s =>
      s.url ? `<div class="ev-src">出典: <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></div>`
            : `<div class="ev-src">出典: ${esc(s.title)}</div>`).join("");
    evs += `<div class="ev" data-layer="${esc(e.layer)}">
      <div class="ev-rail"><span class="ev-dot ${e.type === "period" ? "period" : ""}" style="background:${colorOf(e.layer)}"></span></div>
      <div class="ev-body">
        <button class="ev-head" aria-expanded="false">
        <div class="ev-top">
          <span class="ev-date">${fmtDate(e)}${fmtEnd(e)}</span>
          <span class="ev-layer"><i style="background:${colorOf(e.layer)}"></i>${esc(e.layer)}</span>
          <span class="cred ${e.credibility}">${CRED[e.credibility] || esc(e.credibility)}</span>
        </div>
        <div class="ev-title">${esc(e.title)}</div>
        </button>
        <div class="ev-x"><div class="ev-xi"><div class="ev-xd">
        <div class="ev-summary">${md(e.summary)}</div>
        ${detail}${note}${srcs ? `<div class="ev-srcs">${srcs}</div>` : ""}
        </div></div></div>
      </div>
    </div>`;
  }
  document.getElementById("detail").innerHTML = `
    <button class="d-back" id="back">← 一覧に戻る</button>
    ${(() => { const ph = pickPhoto(t); if(!ph) return ""; return `<figure class="d-coverwrap"><div class="d-cover"><img src="${photoURL(ph, 1080, 480)}" alt="" loading="lazy" decoding="async" onload="this.classList.add(&quot;loaded&quot;)" onerror="this.closest(&quot;.d-coverwrap&quot;).remove()"><div class="d-cover-shade"></div></div><figcaption class="d-cover-credit">Photo: <a href="${esc(ph.user)}${UNSPLASH_UTM}" target="_blank" rel="noopener noreferrer">${esc(ph.name)}</a> / <a href="https://unsplash.com/${UNSPLASH_UTM}" target="_blank" rel="noopener noreferrer">Unsplash</a></figcaption></figure>`; })()}
    <div class="d-cat">${CAT[t.category] || esc(t.category)}</div>
    <h1 class="d-title">${esc(t.title)}</h1>
    <p class="d-desc">${esc(t.description)}</p>
    <div class="d-stats">
      <span>期間 <b>${t.start_year}–${t.end_year}</b></span>
      <span>イベント <b>${t.events.length}</b></span>
      <span>検証済み <b>${cred.verified || 0}</b></span>
      <span>諸説あり <b>${cred.disputed || 0}</b></span>
      <span>未検証 <b>${cred.unverified || 0}</b></span>
      <span>by <b>@${esc((AUTHOR_BY_SLUG[t.slug]||{}).username||"chronos")}</b></span>
      <span>slug <b>${esc(t.slug)}</b></span>
    </div>
    <div class="d-layers">${layers}</div>
    <div class="ev-tools"><button class="ev-expall">すべて開く</button></div>
    <div class="ev-list">${evs}</div>`;
  document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
  observeMarkers();
}

function route(){
  const slug = decodeURIComponent(location.hash.replace(/^#/, ""));
  const t = DATA.find(x => x.slug === slug);
  const home = document.getElementById("home"), detail = document.getElementById("detail");
  if(t){
    renderDetail(t);
    home.classList.add("off"); detail.classList.add("on");
    window.scrollTo(0, 0);
  } else {
    home.classList.remove("off"); detail.classList.remove("on");
  }
}

const rbFill = document.querySelector(".readbar i");
let rbMax = 1;
function updateReadbar(){
  rbFill.style.transform = `scaleX(${Math.min(1, Math.max(0, scrollY / rbMax))})`;
}
function recalcReadbar(){
  rbMax = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  updateReadbar();
  recalcYears();
  updateYearNow();
}
const yearNow = document.querySelector(".year-now");
let yearPts = [];
function recalcYears(){
  yearPts = [...document.querySelectorAll("#detail .year-mark")].map(m => ({y: m.textContent, top: m.getBoundingClientRect().top + scrollY}));
}
function updateYearNow(){
  if(!document.getElementById("detail").classList.contains("on")){ yearNow.classList.remove("show"); return; }
  const line = scrollY + 170;
  let cur = null;
  for(const pt of yearPts){ if(pt.top <= line) cur = pt.y; else break; }
  if(cur){ yearNow.textContent = cur; yearNow.classList.add("show"); } else { yearNow.classList.remove("show"); }
}
let mkIO = null;
function observeMarkers(){
  if(mkIO) mkIO.disconnect();
  mkIO = new IntersectionObserver(es => es.forEach(en => {
    if(en.isIntersecting){ en.target.classList.add("mk"); mkIO.unobserve(en.target); }
  }), {threshold: 0.6});
  document.querySelectorAll("#detail strong").forEach(el => mkIO.observe(el));
}
addEventListener("scroll", () => {
  const c = document.documentElement.classList;
  if (scrollY > 80) c.add("scrolled"); else if (scrollY < 30) c.remove("scrolled");
  updateReadbar();
  updateYearNow();
}, {passive: true});
addEventListener("resize", recalcReadbar, {passive: true});
new ResizeObserver(recalcReadbar).observe(document.body);

renderHome();
document.getElementById("cats").addEventListener("click", e => {
  const card = e.target.closest(".tl-card");
  if(card) location.hash = card.dataset.slug;
});
document.getElementById("detail").addEventListener("click", ev => {
  const chip = ev.target.closest(".d-layer");
  if(chip){
    const on = chip.classList.contains("active");
    document.querySelectorAll("#detail .d-layer").forEach(c => c.classList.remove("active"));
    document.querySelectorAll("#detail .ev").forEach(x => x.classList.remove("dim"));
    if(!on){
      chip.classList.add("active");
      document.querySelectorAll("#detail .ev").forEach(x => x.classList.toggle("dim", x.dataset.layer !== chip.dataset.layer));
    }
    return;
  }
  const body = ev.target.closest(".ev-body");
  if(body && !ev.target.closest("a")){
    const item = body.closest(".ev");
    const open = item.classList.contains("open");
    item.classList.toggle("open", !open);
    body.querySelector(".ev-head").setAttribute("aria-expanded", String(!open));
    return;
  }
  const all = ev.target.closest(".ev-expall");
  if(all){
    const items = [...document.querySelectorAll("#detail .ev")];
    const anyClosed = items.some(x => !x.classList.contains("open"));
    items.forEach((x, i) => {
      const d = anyClosed ? `${i * 28}ms` : "0ms";
      x.querySelector(".ev-x").style.transitionDelay = d;
      x.querySelector(".ev-xd").style.transitionDelay = anyClosed ? `${i * 28 + 100}ms` : "0ms";
      x.classList.toggle("open", anyClosed);
      x.querySelector(".ev-head").setAttribute("aria-expanded", String(anyClosed));
    });
    setTimeout(() => items.forEach(x => {
      x.querySelector(".ev-x").style.transitionDelay = "";
      x.querySelector(".ev-xd").style.transitionDelay = "";
    }), items.length * 28 + 600);
    all.textContent = anyClosed ? "すべて閉じる" : "すべて開く";
  }
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
